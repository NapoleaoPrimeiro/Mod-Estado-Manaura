 FRW_leader_blum:0 "Léon Blum"
 FRW_leader_blum_desc:0 "Léon Blum, leader of the SFIO, is the first socialist and the first Jew to head a French government. His Popular Front came to power in 1936 on the slogan «Pain, paix, liberté»."
 FRW_leader_reynaud:0 "Paul Reynaud"
 FRW_leader_reynaud_desc:0 "A forceful finance politician of the Alliance Démocratique, Reynaud has long warned against Germany and is the patron of the young Colonel de Gaulle."
 FRW_leader_degaulle:0 "Charles de Gaulle"
 FRW_leader_degaulle_desc:0 "Long an advocate of armoured warfare and of a strong executive, the tall officer now leads a reformed Republic."
 FRW_leader_thorez:0 "Maurice Thorez"
 FRW_leader_thorez_desc:0 "The son of a miner from the Pas-de-Calais, Thorez is General Secretary of the PCF and keeps closely to the line set by the Comintern."
 FRW_leader_pivert:0 "Marceau Pivert"
 FRW_leader_pivert_desc:0 "Pivert, leader of the Gauche Révolutionnaire, coined the slogan 'Tout est possible!'. He wants a revolution run by workers' councils and independent of Moscow."
 FRW_leader_larocque:0 "François de La Rocque"
 FRW_leader_larocque_desc:0 "Colonel de La Rocque led the Croix-de-Feu and now heads the Parti Social Français. He calls for a Catholic and national state with a strong social policy."
 FRW_leader_doriot:0 "Jacques Doriot"
 FRW_leader_doriot_desc:0 "Once a communist and still mayor of Saint-Denis, Doriot founded the Parti Populaire Français in 1936, the most radical mass movement on the French right."
 FRW_leader_petain:0 "Philippe Pétain"
 FRW_leader_petain_desc:0 "The victor of Verdun is the most respected soldier in France, and many look to him to save the country."
 FRW_leader_comtedeparis:0 "Henri VI (Count of Paris)"
 FRW_leader_comtedeparis_desc:0 "Henri d'Orléans, Count of Paris, is head of the House of Orléans and the Orléanist pretender to the throne. He reigns as Henri VI."
 FRW_leader_napoleon:0 "Napoléon VI"
 FRW_leader_napoleon_desc:0 "Louis, Prince Napoléon, head of the House of Bonaparte, is young and ambitious and carries the most famous name in French history."
 FRW_EMPIRE:0 "French Empire"
 FRW_EMPIRE_DEF:0 "the French Empire"
 FRW_EMPIRE_ADJ:0 "Imperial French"
 FRW_GRANDEMPIRE:0 "Grand French Empire"
 FRW_GRANDEMPIRE_DEF:0 "the Grand French Empire"
 FRW_GRANDEMPIRE_ADJ:0 "Imperial French"
 FRW_KINGDOM:0 "Kingdom of France"
 FRW_KINGDOM_DEF:0 "the Kingdom of France"
 FRW_KINGDOM_ADJ:0 "French"
 FRW_ETAT:0 "French State"
 FRW_ETAT_DEF:0 "the French State"
 FRW_ETAT_ADJ:0 "French"
 FRW_COMMUNE:0 "Commune of France"
 FRW_COMMUNE_DEF:0 "the Commune of France"
 FRW_COMMUNE_ADJ:0 "Communard"
 FRW_SOCREP:0 "French Socialist Republic"
 FRW_SOCREP_DEF:0 "the French Socialist Republic"
 FRW_SOCREP_ADJ:0 "French"
 FRW_NATIONAL:0 "French National State"
 FRW_NATIONAL_DEF:0 "the French National State"
 FRW_NATIONAL_ADJ:0 "French"
 FRW_UNION:0 "French Union"
 FRW_UNION_DEF:0 "the French Union"
 FRW_UNION_ADJ:0 "French"
 FRW_EUROPE:0 "European Federation"
 FRW_EUROPE_DEF:0 "the European Federation"
 FRW_EUROPE_ADJ:0 "European"
 FRW_FRUK:0 "Franco-British Union"
 FRW_FRUK_DEF:0 "the Franco-British Union"
 FRW_FRUK_ADJ:0 "Franco-British"
 FRW_FRANCIA:0 "Frankish Empire"
 FRW_FRANCIA_DEF:0 "the Frankish Empire"
 FRW_FRANCIA_ADJ:0 "Frankish"
 FRW_LATIN:0 "Latin Empire"
 FRW_LATIN_DEF:0 "the Latin Empire"
 FRW_LATIN_ADJ:0 "Latin"
 FRW_EURAFRICA:0 "Eurafrican Federation"
 FRW_EURAFRICA_DEF:0 "the Eurafrican Federation"
 FRW_EURAFRICA_ADJ:0 "Eurafrican"
 FRW_entente:0 "Entente"
 FRW_red_front:0 "Red Front of Europe"
 FRW_latin_bloc_faction:0 "Latin Bloc"
 FRW_holy_alliance_faction:0 "Holy Alliance"
 FRW_collective_security_faction:0 "Collective Security"
 FRW_political_cat:0 "Domestic Affairs"
 FRW_political_cat_desc:0 "Measures to make France more stable at home and better prepared for war."
 FRW_dec_national_rally:0 "National Rally"
 FRW_dec_national_rally_desc:0 "Large public rallies are held in the main cities to win support for the government."
 FRW_dec_war_propaganda:0 "National Defence Campaign"
 FRW_dec_war_propaganda_desc:0 "Posters, newsreels and wireless broadcasts prepare the public for the possibility of war."
 FRW_dec_colonial_recruitment:0 "Recruit in the Empire"
 FRW_dec_colonial_recruitment_desc:0 "Recruiting offices in North and West Africa enlist volunteers for the army."
 FRW_colonial_purchases_cat:0 "Colonial Purchases"
 FRW_colonial_purchases_cat_desc:0 "France offers other colonial powers gold and political support in return for African territory. The seller decides on every offer; in multiplayer, that is the player who owns the land."
 FRW_buy_spanish_morocco:0 "Purchase Spanish Morocco"
 FRW_buy_spanish_morocco_desc:0 "Madrid is offered French gold in exchange for the Rif zone."
 FRW_buy_ifni_rio_de_oro:0 "Purchase Ifni and Río de Oro"
 FRW_buy_ifni_rio_de_oro_desc:0 "Spain's desert territories on the Atlantic coast lie between French Morocco and Mauritania."
 FRW_buy_spanish_guinea:0 "Purchase Spanish Guinea"
 FRW_buy_spanish_guinea_desc:0 "Río Muni is enclosed on its landward side by French Equatorial Africa."
 FRW_buy_portuguese_guinea:0 "Purchase Portuguese Guinea"
 FRW_buy_portuguese_guinea_desc:0 "The Portuguese colony in West Africa is almost entirely surrounded by French territory."
 FRW_buy_gambia:0 "Purchase the Gambia"
 FRW_buy_gambia_desc:0 "The narrow British strip along the Gambia river splits Senegal in two."
 FRW_buy_sierra_leone:0 "Purchase Sierra Leone"
 FRW_buy_sierra_leone_desc:0 "Freetown would give French West Africa a fine Atlantic harbour."
 FRW_buy_belgian_congo:0 "Purchase a Congo Concession"
 FRW_buy_belgian_congo_desc:0 "Brussels is offered terms for ceding part of the Congo to France."
 FRW_buy_fezzan:0 "Purchase the Fezzan"
 FRW_buy_fezzan_desc:0 "The Fezzan, Italy's desert hinterland in Libya, borders both Algeria and Chad."
 FRW_union_francaise_cat:0 "The French Union"
 FRW_union_francaise_cat_desc:0 "The colonial empire is reorganised as a union in which the protectorates of Tunisia and Morocco become full members of France."
 FRW_form_union_francaise:0 "Proclaim the French Union"
 FRW_form_union_francaise_desc:0 "Tunisia and Morocco become core territories of France."
 FRW_europe_cat:0 "European Federation"
 FRW_europe_cat_desc:0 "Plans for a united Europe under French leadership, whether democratic or socialist."
 FRW_form_european_federation:0 "Found the European Federation"
 FRW_form_european_federation_desc:0 "The Benelux and the Rhineland become core territories of a federation led by France."
 FRW_grand_empire_cat:0 "Le Grand Empire"
 FRW_grand_empire_cat_desc:0 "Restoring the Empire of the French within the borders it held under Napoleon."
 FRW_form_grand_empire:0 "Proclaim the Grand Empire"
 FRW_form_grand_empire_desc:0 "The Benelux, the Rhineland and Piedmont become core territories of the Empire."
 FRW_francia_cat:0 "The Frankish Empire"
 FRW_francia_cat_desc:0 "From Aachen, Charlemagne ruled the lands between the Pyrenees and the Elbe. France claims to be his rightful heir."
 FRW_form_francia:0 "Restore the Empire of Charlemagne"
 FRW_form_francia_desc:0 "Requires control of Belgium, Holland, the Rhineland, Westphalia and Baden. They become core territories."
 FRW_latin_cat:0 "The Latin Empire"
 FRW_latin_cat_desc:0 "Plans to unite France, Italy and Spain, the heirs of Rome, under a single crown or leader."
 FRW_form_latin_empire:0 "Proclaim the Latin Empire"
 FRW_form_latin_empire_desc:0 "Requires control of Rome, Madrid and Piedmont. All Italian, Spanish and Portuguese core territories we own become our cores."
 FRW_eurafrique_cat:0 "The Eurafrican Federation"
 FRW_eurafrique_cat_desc:0 "Plans to join Europe and Africa in a single federation under French leadership."
 FRW_form_eurafrican_federation:0 "Found the Eurafrican Federation"
 FRW_form_eurafrican_federation_desc:0 "The Sahara, French Sudan and Guinea become core territories."
 frw.1.t:0 "The Crisis of the Third Republic"
 frw.1.d:0 "Since the riots of 6 February 1934 the country has had no rest. Cabinets rise and fall, the leagues march in the streets, the communists gain ground and the economy stagnates. In the salons and the barracks, officers and politicians openly discuss what should replace the Republic."
 frw.1.a:0 "Preserve law and order."
 frw.1.b:0 "We need decisive action."
 frw.2.t:0 "The Commune is Proclaimed!"
 frw.2.d:0 "Red flags fly over the Hôtel de Ville. In Paris the workers, soldiers and the Communist Party have seized power and set up a socialist government in place of the Republic. The other capitals of Europe await the next move with alarm."
 frw.2.a:0 "A spectre is haunting Europe."
 frw.2.b:0 "Vive la Commune!"
 frw.3.t:0 "National Revolution in France"
 frw.3.d:0 "After weeks of unrest the united leagues have overthrown the government. The Chamber and the Senate have been dissolved and a national government has taken power."
 frw.3.a:0 "France has changed."
 frw.3.b:0 "France awakens!"
 frw.4.t:0 "The French Chambers Adjourned"
 frw.4.d:0 "Unexpectedly, the government has adjourned the Chamber and the Senate indefinitely. A cabinet 'above the parties' now runs the country, and it is still unclear what kind of regime will replace the Republic."
 frw.4.a:0 "What comes next?"
 frw.5.t:0 "The Empire of the French!"
 frw.5.d:0 "Louis, Prince Napoléon, has been crowned Napoléon VI, Emperor of the French, in Notre-Dame. The Guard has paraded down the Champs-Élysées and the eagles are back on the regimental standards."
 frw.5.a:0 "History repeats itself."
 frw.5.b:0 "Vive l'Empereur!"
 frw.6.t:0 "A King in Paris"
 frw.6.d:0 "Henri d'Orléans, Count of Paris, has returned from exile and taken the throne as Henri VI. France has a king for the first time since 1848."
 frw.6.a:0 "Interesting."
 frw.6.b:0 "Vive le Roi!"
 frw.10.t:0 "France Requests Membership"
 frw.10.d:0 "The French government has formally asked to join our alliance. France brings a large army and a powerful fleet."
 frw.10.a:0 "Welcome, France."
 frw.10.b:0 "We decline."
 frw.11.t:0 "Membership Confirmed"
 frw.11.d:0 "Our request has been accepted, and France now has allies at its side."
 frw.11.a:0 "Excellent."
 frw.12.t:0 "Request Declined"
 frw.12.d:0 "Our request to join has been turned down. France will have to manage without this alliance."
 frw.12.a:0 "Then we stand alone."
 frw.16.t:0 "An Alliance Offer from Paris"
 frw.16.d:0 "France has formed a new alliance and invites us to join."
 frw.16.a:0 "We join."
 frw.16.b:0 "We remain independent."
 frw.17.t:0 "Alliance Offer Accepted"
 frw.17.d:0 "[From.GetNameDefCap] has accepted our offer and joins the alliance."
 frw.17.a:0 "Together we are strong."
 frw.18.t:0 "Alliance Offer Declined"
 frw.18.d:0 "[From.GetNameDefCap] has declined our alliance offer."
 frw.18.a:0 "Regrettable."
 frw.20.t:0 "A Franco-British Union?"
 frw.20.d:0 "Paris proposes a union of the two nations, with joint ministries of defence and economy, a common citizenship and a single war cabinet."
 frw.20.a:0 "An indissoluble union."
 frw.20.b:0 "This goes too far."
 frw.21.t:0 "London Agrees!"
 frw.21.d:0 "The British government has accepted the union, and the two empires will now act as one."
 frw.21.a:0 "Vive l'Union!"
 frw.22.t:0 "London Refuses"
 frw.22.d:0 "London considers a union premature. The Entente will continue, but on its present terms only."
 frw.22.a:0 "Perfidious Albion."
 frw.25.t:0 "A French Protectorate?"
 frw.25.d:0 "France offers to take over our debts and guarantee our security, on condition that we become a French protectorate."
 frw.25.a:0 "We accept."
 frw.25.b:0 "Our independence is not negotiable."
 frw.26.t:0 "Liberia Accepts"
 frw.26.d:0 "Liberia is now under French protection."
 frw.26.a:0 "Very good."
 frw.27.t:0 "Liberia Refuses"
 frw.27.d:0 "The Liberian government has rejected our offer."
 frw.27.a:0 "A pity."
 frw.50.t:0 "A French Purchase Offer"
 frw.50.d:0 "An envoy from Paris has arrived with an offer. France wishes to buy colonial territory bordering its African possessions and will pay a generous sum in gold, along with political support."
 frw.50.a:0 "We sell."
 frw.50.b:0 "This land is not for sale."
 frw.51.t:0 "Purchase Completed"
 frw.51.d:0 "The negotiations have succeeded and the territory is now part of the French empire, though the purchase has strained the budget."
 frw.51.a:0 "A good deal."
 frw.52.t:0 "Offer Declined"
 frw.52.d:0 "Our purchase offer has been rejected. Part of the money has been returned to the treasury."
 frw.52.a:0 "Perhaps another time."
 frw.60.t:0 "The European Federation is Founded"
 frw.60.d:0 "The founding charter of a European Federation has been signed in Strasbourg. Under French leadership the nations of western Europe are to merge into a single state."
 frw.60.a:0 "A new age."
 frw.61.t:0 "Le Grand Empire"
 frw.61.d:0 "The imperial eagle flies again from the North Sea to the Alps. Napoleon's Grand Empire has been restored."
 frw.61.a:0 "The legacy of the Emperor."
 frw.62.t:0 "The French Union"
 frw.62.d:0 "France has proclaimed the French Union, and Tunisia and Morocco are now equal parts of the Republic."
 frw.62.a:0 "A new order for the empire."
 frw.63.t:0 "The Empire of Charlemagne Restored"
 frw.63.d:0 "In Aachen Cathedral, where Charlemagne is buried, France has proclaimed the restoration of the Frankish Empire. The lands between the Pyrenees and the Rhine are united once again."
 frw.63.a:0 "Karolus Magnus would be proud."
 frw.64.t:0 "The Latin Empire Proclaimed"
 frw.64.d:0 "France, Italy and Spain are now under a single government. The Latin Empire, claiming descent from the Caesars, has been proclaimed in Rome."
 frw.64.a:0 "Rome rises again."
 frw.65.t:0 "The Eurafrican Federation"
 frw.65.d:0 "France has merged its African territories into a Eurafrican Federation, a single state reaching from Dunkirk to the Niger."
 frw.65.a:0 "Eurafrique!"
 frw.70.t:0 "France Demands Union"
 frw.70.d:0 "The French government demands that [Root.GetNameDef] be united with France, citing a shared language and history. Paris has made it clear that a refusal may be met with force."
 frw.70.a:0 "We accept the union."
 frw.70.b:0 "Never!"
 frw.71.t:0 "France Demands Territory"
 frw.71.d:0 "France demands that we cede border districts it regards as historically French. If we refuse, Paris may use force."
 frw.71.a:0 "We cede the territory."
 frw.71.b:0 "Not one inch of our soil!"
 frw.72.t:0 "Our Demands Accepted"
 frw.72.d:0 "Our demands have been met, and French troops are crossing the new frontier without a shot being fired."
 frw.72.a:0 "Vive la France!"
 frw.73.t:0 "Union Refused"
 frw.73.d:0 "[From.GetNameDefCap] has refused union with France. The General Staff has plans ready to take by force what was denied us."
 frw.73.a:0 "Then we take it by force."
 frw.73.b:0 "We will not start a war over this."
 frw.74.t:0 "Demands Refused"
 frw.74.d:0 "[From.GetNameDefCap] refuses to cede the territories we demanded. The army can still take them if the government gives the order."
 frw.74.a:0 "Prepare for war."
 frw.74.b:0 "Let it go – for now."
 frw.75.t:0 "France Demands Our Allegiance"
 frw.75.d:0 "Paris demands that [Root.GetNameDef] place itself under French protection, with our foreign policy and our army answering to France. The French ambassador has let it be understood that a refusal would be remembered, and that the French army is on alert."
 frw.75.a:0 "We accept French protection."
 frw.75.b:0 "We remain sovereign!"
 frw.76.t:0 "Protection Refused"
 frw.76.d:0 "[From.GetNameDefCap] has rejected our offer of protection. The government must decide whether to impose it by force."
 frw.76.a:0 "Then they will learn to obey."
 frw.76.b:0 "Not worth a war."
 frw.80.t:0 "A Secret Offer from Paris"
 frw.80.d:0 "In strict confidence, the French government has offered to cede Savoy and the Alps to the Confederation. In exchange, the Swiss banks would open their vaults to French industry. The matter now lies with the Federal Council in Berne."
 frw.80.a:0 "Accept – the cantons of Savoy and the Alps join the Confederation."
 frw.80.b:0 "Switzerland does not trade in land."
 frw.81.t:0 "The Captain from Geneva"
 frw.81.d:0 "He arrived at the Gare de Lyon with a single suitcase and a Polish officer's sabre. Malo Kervadec was born in Geneva, the son of a Breton sea captain from Saint-Malo and a Polish exile from Kraków, and grew up between the quays of Lake Geneva and his mother's stories of a country that no longer appeared on any map. In 1917 he joined General Haller's Blue Army in France, and in 1920 he was on the Vistula when the Red Army was turned back before Warsaw.\n\nIn the years since, he has worked for the private banks of Zurich and Geneva, moving their gold across an uneasy Europe. He now brings that gold to Paris, convinced that Poland can survive only if France is strong."
 frw.81.a:0 "Full sail ahead."
 frw.82.t:0 "The Alpine Bargain is Sealed"
 frw.82.d:0 "Switzerland has accepted. Savoy and the Alps have passed under Swiss administration, and Swiss gold is already reaching French factories."
 frw.82.a:0 "A good trade."
 frw.83.t:0 "Bern Declines"
 frw.83.d:0 "The Federal Council has declined our offer. The Alps remain French, and the public will never learn how near the government came to giving them away."
 frw.83.a:0 "Perhaps it is better this way."
 FRW_CORSAIR:0 "Kingdom of Francia"
 FRW_CORSAIR_DEF:0 "the Kingdom of Francia"
 FRW_CORSAIR_ADJ:0 "Francian"
 FRW_corsair_cat:0 "The Kingdom of Francia"
 FRW_corsair_cat_desc:0 "France and the Iberian peninsula united under the corsair flag of Saint-Malo, with its ermine, death's head and lion. No invader who lands on our coasts will leave them alive."
 FRW_form_corsair_empire:0 "Proclaim the Kingdom of Francia"
 FRW_form_corsair_empire_desc:0 "Requires control of Paris, Madrid, Burgos and Lisbon and more than 50 % war support. Grants cores on all owned Spanish and Portuguese states and the spirit Le Pavillon Corsaire (+30 % attack and defence on core territory)."
 frw.90.t:0 "Intervention in Spain"
 frw.90.d:0 "Spain has fallen into civil war, and French troops are massed along the Pyrenees. The government must now decide which side France will support and which it will help to crush."
 frw.90.a:0 "For the Republic – crush the Nationalists!"
 frw.90.b:0 "For the Nationalists – crush the Republic!"
 frw.90.c:0 "For the lawful government – crush the rebels!"
 frw.92.t:0 "France Demands Union"
 frw.92.d:0 "French divisions are deployed along our entire frontier, from Galicia to Andalusia. Paris demands that Portugal join France, by peaceful means, its note insists. The General Staff in Lisbon reports that resistance would be hopeless."
 frw.92.a:0 "We have no choice. Portugal joins France."
 frw.92.b:0 "Portugal will fight!"
 frw.93.t:0 "Lisbon Refuses"
 frw.93.d:0 "[From.GetNameDefCap] has rejected the union. Our divisions await the order to advance."
 frw.93.a:0 "Then we march on Lisbon."
 frw.93.b:0 "Not now."
 frw.95.t:0 "The Kingdom of Francia"
 frw.95.d:0 "From the Channel to Gibraltar a new flag hangs over the ministries, bearing the lilies of France and the ermine of Saint-Malo. France and the Iberian peninsula have been proclaimed one state, the Kingdom of Francia. The captain from Saint-Malo has told his officers that this is only the beginning."
 frw.95.a:0 "A new power in the West."
 frw.95.b:0 "Montjoie Saint-Denis!"
 FRW_leader_corsair:0 "Malo Kervadec"
 FRW_leader_corsair_desc:0 "Malo Kervadec was born in Geneva, the son of a Breton sea captain from Saint-Malo and a Polish exile. He fought in Haller's Blue Army, ran gold for the private banks of Zurich and, the rumours say, sailed under the black flag off the coasts of Africa. He governs France as a corsair captain governs his ship, by written articles and a share of the plunder for every man."
 frw.96.t:0 "France Asks for Shetland"
 frw.96.d:0 "Citing the Auld Alliance and the cordial relations between our countries, Paris asks His Majesty's Government to cede the Shetland Islands to France for use as a naval station."
 frw.96.a:0 "Very well – for the sake of friendship."
 frw.96.b:0 "Britain does not give away its islands."
 frw.97.t:0 "France Asks for the Highlands"
 frw.97.d:0 "The French ambassador proposes that the Scottish Highlands and Aberdeenshire be placed under French administration, in memory, as he puts it, of the Auld Alliance."
 frw.97.a:0 "If it keeps France on our side..."
 frw.97.b:0 "Out of the question."
 frw.98.t:0 "London Says No"
 frw.98.d:0 "[From.GetNameDefCap] has declined our request, politely but firmly."
 frw.98.a:0 "Perhaps when they like us more."
 FRW_BURGUNDY:0 "Kingdom of Burgundy"
 FRW_BURGUNDY_DEF:0 "the Kingdom of Burgundy"
 FRW_BURGUNDY_ADJ:0 "Burgundian"
 FRW_WESTUNION:0 "Western Union"
 FRW_WESTUNION_DEF:0 "the Western Union"
 FRW_WESTUNION_ADJ:0 "Western"
 FRW_burgundy_cat:0 "The Burgundian Inheritance"
 FRW_burgundy_cat_desc:0 "In the fifteenth century the Valois Dukes of Burgundy held lands from Dijon to Amsterdam, among the richest in Europe. France is now in a position to reunite them."
 FRW_form_burgundy:0 "Restore the Kingdom of Burgundy"
 FRW_form_burgundy_desc:0 "Requires control of Flanders, Holland, Luxembourg, Wallonia and Bourgogne (not communist). Grants cores on the Low Countries and the spirit Burgundian Inheritance."
 FRW_western_union_cat:0 "The Western Union"
 FRW_western_union_cat_desc:0 "France and the Low Countries, bound together by a customs union and a common defence."
 FRW_form_western_union:0 "Proclaim the Western Union"
 FRW_form_western_union_desc:0 "Requires a democratic government, more than 50 % stability and control of Flanders, Holland, Luxembourg and Wallonia. Grants cores on the Low Countries and the spirit The Western Union."
 frw.99.t:0 "Burgundy Reborn"
 frw.99.d:0 "Nearly five centuries after Charles the Bold fell at Nancy in 1477, the lands between the Rhine and the Somme are united again, this time under Paris. The Kingdom of Burgundy has been proclaimed."
 frw.99.a:0 "The Golden Age returns."
 frw.100.t:0 "The Western Union"
 frw.100.d:0 "France and the Low Countries have signed the treaty of the Western Union in Brussels. It provides for a common market and an integrated army for the democracies of Western Europe, with a joint parliament to oversee both."
 frw.100.a:0 "A new beginning."
 FRW_ETERNAL:0 "Eternal Kingdom of Francia"
 FRW_ETERNAL_DEF:0 "the Eternal Kingdom of Francia"
 FRW_ETERNAL_ADJ:0 "Francian"
 FRW_leader_admiral_king:0 "Aymeric Kervadec"
 FRW_leader_admiral_king_desc:0 "Aymeric Kervadec was born in Geneva in 1894 and grew up aboard his father's ships, sailing between the Swiss banks and the harbours of Tangier and Danzig. In 1920 he was among the first officers of the new Polish Navy and learnt his trade in the cold waters off Gdynia. He later commanded the fleet that carried his father's armies to Lisbon and Leith. Crowned in Reims as Aymeric I, he is known to the people as «le Roi-Amiral». Unlike his father he prefers treaties to raids, and he wants a dynasty that will outlast him. He has never lost a battle at sea."
 FRW_admiral_king:0 "Le Roi-Amiral"
 frw.101.t:0 "The Eternal Kingdom of Francia"
 frw.101.d:0 "In Reims cathedral, Admiral Aymeric Kervadec, son of the late «Corsaire Noir», has been crowned Aymeric I, King of the Franks. France and her conquests have been proclaimed the Eternal Kingdom of Francia under a new flag bearing the lilies, the royal arms and the crusaders' cross.\n\nIn his first speech the king promised to complete his father's work. France, he said, must become so strong that no enemy will set foot on her soil again, and Poland must never again be left alone."
 frw.101.a:0 "A new crown in Europe."
 frw.101.b:0 "Pro Rege et Patria!"
 frw.84.t:0 "A Letter from Geneva"
 frw.84.d:0 "For months the Élysée has been silent. Then a letter arrives on heavy paper bearing the watermark of a private bank in Geneva, written in an old-fashioned hand.\n\n«Messieurs, France is drifting, and a ship without a captain ends on the rocks. I have ships and I have gold. I once fought for a nation that had been erased from the map, and I know what it costs to lose one's country. Send for me and I will come.\n\nM. Kervadec, Capitaine»\n\nNobody in Paris knows the name. In Zurich it is well known.\n\n§GA new decision is available: Win Over Captain Kervadec.§!"
 frw.84.a:0 "Perhaps we should answer him."
 frw.102.t:0 "Le Corsaire Noir est mort"
 frw.102.d:0 "Malo Kervadec died at sea. On a stormy night off Gdynia his heart failed aboard the ship that had carried his gold and his armies for twenty years. His officers report that his last words were in Polish.\n\nHis coffin lies in state in the cathedral of Saint-Malo, guarded by French marines alongside Polish sailors who came from Gdynia to escort him home. A regency council will govern France until the coronation. His son, Admiral Aymeric Kervadec, is travelling to Reims."
 frw.102.a:0 "Rest at sea, Captain."
 FRW_req_european_federation_tt:0 "§gRequires control of §YBelgium§!, the §YNetherlands§! and §YLuxembourg§! plus §YItaly§! or §YGermany§! (annexed or as puppets, unless stated otherwise). If France does not control them yet, the nation is founded automatically as soon as it does.§!"
 FRW_req_western_union_tt:0 "§gRequires control of §YBelgium§!, the §YNetherlands§! and §YLuxembourg§! (annexed or as puppets, unless stated otherwise). If France does not control them yet, the nation is founded automatically as soon as it does.§!"
 FRW_req_latin_empire_tt:0 "§gRequires control of §YItaly§!, §YSpain§! and §YPortugal§! (annexed or as puppets, unless stated otherwise). If France does not control them yet, the nation is founded automatically as soon as it does.§!"
 FRW_req_eurafrica_tt:0 "§gRequires control of French North Africa (§YAlgeria§!, §YMorocco§! and §YTunisia§!) – it is enough to hold them militarily. If France does not control them yet, the nation is founded automatically as soon as it does.§!"
 FRW_req_francia_tt:0 "§gRequires control of the §YRhineland§!, §YMoselland§!, §YBelgium§! and the §YNetherlands§! (annexed or as puppets, unless stated otherwise). If France does not control them yet, the nation is founded automatically as soon as it does.§!"
 FRW_req_burgundy_tt:0 "§gRequires control of the whole of §YBelgium§!, the §YNetherlands§! and §YLuxembourg§! (annexed, not as puppets). If France does not control them yet, the nation is founded automatically as soon as it does.§!"
 FRW_req_grand_empire_tt:0 "§gRequires control of the §YRhine§! (Rhineland, Moselland), §YPiedmont§!, §YBelgium§! and the §YNetherlands§! (annexed or as puppets, unless stated otherwise). If France does not control them yet, the nation is founded automatically as soon as it does.§!"
 FRW_plunder_cat_desc:0 "Every nation that has submitted to France, whether as a subject or after capitulation, keeps gold in its central bank. The captain from Saint-Malo means to collect it."
 FRW_seize_the_treasury:0 "Seize the Treasury of [FROM.GetName]"
 FRW_seize_the_treasury_desc:0 "The gold reserves of [FROM.GetNameDef] are being loaded onto French ships.\n\nFrance: §G+75§! political power, a §Gcivilian factory§! and §YCorsair Gold§! for 180 days.\n[FROM.GetNameDefCap]: §RPlundered Treasury§! for 365 days. Each country can be plundered once a year."
 FRW_corsair_gold_desc:0 "Seized gold is paid into the royal treasury."
 FRW_plundered_treasury_desc:0 "French corsairs have carried off our gold reserves."
 FRW_saint_malo_shipyards_desc:0 "The yards of the old corsair port are building ships again, and faster than at any time in their history."
 FRW_prize_economy_desc:0 "Money from captured prizes is put into factories and machine tools."
 FRW_econ_dirigiste_2_desc:0 "The plan now covers every region, and new factories are built wherever the planners choose."
 FRW_econ_dirigiste_3_desc:0 "The economy is planned in full, from the price of coal to the output of each factory."
 FRW_econ_liberal_1_desc:0 "Private capital and open markets drive French industry."
 FRW_econ_liberal_2_desc:0 "Investors and engineers compete for contracts, and France reaps the profit."
 FRW_econ_liberal_3_desc:0 "Credit is cheap and the order books of French firms are full."
 FRW_econ_rearmament_1_desc:0 "Every spare franc goes to the arsenals."
 FRW_econ_rearmament_2_desc:0 "Arms production takes precedence over every other branch of industry."
 FRW_econ_rearmament_3_desc:0 "France has become one great arsenal."
 FRW_colonial_integration_cat:0 "Colonial Integration"
 FRW_colonial_integration_cat_desc:0 "Holding territory in Africa does not by itself make it French. These decisions put the African lands France owns under a proper colonial administration, which yields more soldiers and more resources from each state. Only §YAlgeria§!, French since 1848, becomes a §Gcore§!; with the focus §YAlgeria Is France§! the overseas départements follow. The decisions can be used again whenever France gains more land in a region."
 FRW_integrate_maghreb:0 "Integrate French North Africa"
 FRW_integrate_maghreb_desc:0 "Morocco, Tunisia and the Algerian Sahara are organised into départements on the model of Algiers and Oran.\n\nPuts every state of this region that France owns under §YColonial Administration§!. §YAlgeria§! becomes a §Gcore§!."
 FRW_integrate_aof:0 "Integrate French West Africa"
 FRW_integrate_aof_desc:0 "From Dakar to Niamey the AOF comes under French civil law, and its inhabitants become citizens.\n\nPuts every state of this region that France owns under §YColonial Administration§!."
 FRW_integrate_aef:0 "Integrate French Equatorial Africa"
 FRW_integrate_aef_desc:0 "Brazzaville, Libreville, Fort-Lamy and the Cameroon mandate are placed under the direct authority of Paris.\n\nPuts every state of this region that France owns under §YColonial Administration§!."
 FRW_integrate_indian_ocean:0 "Integrate the Indian Ocean Territories"
 FRW_integrate_indian_ocean_desc:0 "Madagascar, Réunion, the Comoros and Djibouti are incorporated into overseas France.\n\nPuts every state of this region that France owns under §YColonial Administration§!."
 FRW_integrate_spanish:0 "Integrate the Former Spanish Colonies"
 FRW_integrate_spanish_desc:0 "The Rif, Ifni, Río de Oro and Río Muni pass permanently under French administration.\n\nPuts every state of this region that France owns under §YColonial Administration§!."
 FRW_integrate_portuguese:0 "Integrate the Former Portuguese Colonies"
 FRW_integrate_portuguese_desc:0 "Guinea, Angola, Mozambique and the Atlantic islands of the former Portuguese empire are annexed to France.\n\nPuts every state of this region that France owns under §YColonial Administration§!."
 FRW_integrate_congo:0 "Integrate the Congo"
 FRW_integrate_congo_desc:0 "The Belgian Congo, together with Rwanda and Burundi, is joined to French Equatorial Africa.\n\nPuts every state of this region that France owns under §YColonial Administration§!."
 FRW_integrate_libya:0 "Integrate Libya"
 FRW_integrate_libya_desc:0 "Tripolitania, Cyrenaica and the Fezzan now give France a continuous link between Tunisia and Chad.\n\nPuts every state of this region that France owns under §YColonial Administration§!."
 FRW_integrate_british_west:0 "Integrate British West Africa"
 FRW_integrate_british_west_desc:0 "The Gambia, Sierra Leone and Nigeria are attached to the AOF.\n\nPuts every state of this region that France owns under §YColonial Administration§!."
 FRW_integrate_african_territories:0 "The Overseas Departments"
 FRW_integrate_african_territories_desc:0 "Algeria, the Antilles, Guiana and Réunion become départements of France like any other. The rest of Africa is brought under colonial administration."
 RULE_FRW_FRANCE_AI:0 "France (France Rework)"
 RULE_FRW_FRANCE_AI_HISTORICAL:0 "Historical"
 RULE_FRW_FRANCE_AI_HISTORICAL_DESC:0 "France stays a democracy, usually with the Popular Front. Recommended."
 RULE_FRW_FRANCE_AI_DEMOCRATIC:0 "Democratic"
 RULE_FRW_FRANCE_AI_DEMOCRATIC_DESC:0 "France follows one of the democratic paths (Blum or Reynaud/de Gaulle)."
 RULE_FRW_FRANCE_AI_COMMUNIST:0 "Communist"
 RULE_FRW_FRANCE_AI_COMMUNIST_DESC:0 "France follows one of the communist paths (Thorez or Pivert)."
 RULE_FRW_FRANCE_AI_FASCIST:0 "Fascist"
 RULE_FRW_FRANCE_AI_FASCIST_DESC:0 "France follows one of the fascist paths (La Rocque or Doriot)."
 RULE_FRW_FRANCE_AI_NONALIGNED:0 "Non-Aligned"
 RULE_FRW_FRANCE_AI_NONALIGNED_DESC:0 "France follows one of the non-aligned paths (Pétain, Orléans or the Bonapartes)."
 RULE_FRW_FRANCE_AI_RANDOM:0 "Random"
 RULE_FRW_FRANCE_AI_RANDOM_DESC:0 "The AI picks any of the four ideologies with equal chance."
 FRW_shortcut_democratic:0 "Democratic Paths"
 FRW_shortcut_communist:0 "Communist Paths"
 FRW_shortcut_fascist:0 "Fascist Paths"
 FRW_shortcut_nonaligned:0 "Non-Aligned Paths"
 FRW_shortcut_secret:0 "Secret Path"
 FRW_shortcut_economy:0 "Economy"
 FRW_shortcut_military:0 "Military"
 FRW_shortcut_diplomacy:0 "Diplomacy"
 FRW_shortcut_colonies:0 "Colonial Empire"
 FRW_plunder_cat:0 "Prizes of War"
 FRW_econ_dirigiste_1_desc:0 "The state draws up investment plans and directs the major industries."
 FRW_union_francaise_formed_desc:0 "The colonies from Dakar to Saigon are now members of a single French Union."
 FRW_european_federation_desc:0 "A federal Europe under French leadership, with a single market and a common parliament."
 FRW_western_union_idea_desc:0 "The democracies of Western Europe share a common market and a joint army."
 FRW_latin_empire_idea_desc:0 "Mare Nostrum. The Latin navies control the Mediterranean."
 FRW_eurafrican_federation_idea_desc:0 "Europe and Africa form a single economic area directed from Paris."
 FRW_francia_idea_desc:0 "As heir to Charlemagne, the king rules from the Pyrenees to the Rhine."
 FRW_burgundy_idea_desc:0 "The wealthy provinces of the old Burgundian state are united again."
 FRW_grand_empire_idea_desc:0 "Napoleon's Europe has been restored, and the Grande Armée is on the march once more."
 FRW_franco_british_union_spirit_desc:0 "France and Britain have merged their two empires into a single union."
 FRW_drapeau_noir_desc:0 "Under the black flag of the corsairs, our soldiers defend every yard of home soil."
 FRW_eternal_kingdom_spirit_desc:0 "The crown has been restored, and the king who wears it has never lost a battle at sea."
 FRW_decolonisation_cat:0 "The Anti-Colonial Revolution"
 FRW_decolonisation_cat_desc:0 "A workers' republic cannot rule other peoples by force. Every freed colony becomes a socialist ally and raises the Commune's standing among colonial peoples everywhere.\n\nEvery liberation strengthens §YFraternal Peoples§! by one level (up to three)."
 FRW_free_north_africa:0 "Free North Africa"
 FRW_free_north_africa_desc:0 "Morocco, Tunisia and Algeria become independent socialist republics allied to the French Commune.\n\nReleases them as §Ycommunist satellites§! (only where France holds their land) and strengthens §YFraternal Peoples§!."
 FRW_free_west_africa:0 "Free West Africa"
 FRW_free_west_africa_desc:0 "The AOF territories from Senegal to Niger and the Togo mandate elect their own councils and leave the empire.\n\nReleases them as §Ycommunist satellites§! (only where France holds their land) and strengthens §YFraternal Peoples§!."
 FRW_free_equatorial_africa:0 "Free Equatorial Africa"
 FRW_free_equatorial_africa_desc:0 "Chad, Cameroon, Gabon, the Middle Congo and Ubangi-Shari are proclaimed free republics.\n\nReleases them as §Ycommunist satellites§! (only where France holds their land) and strengthens §YFraternal Peoples§!."
 FRW_free_indian_ocean:0 "Free Madagascar and Djibouti"
 FRW_free_indian_ocean_desc:0 "Madagascar and the Djibouti coast pass into the hands of their own peoples.\n\nReleases them as §Ycommunist satellites§! (only where France holds their land) and strengthens §YFraternal Peoples§!."
 FRW_free_indochina:0 "Free Indochina"
 FRW_free_indochina_desc:0 "With French backing, the Indochinese communists take power in Hanoi, Phnom Penh and Vientiane.\n\nReleases them as §Ycommunist satellites§! (only where France holds their land) and strengthens §YFraternal Peoples§!."
 FRW_free_levant:0 "Free the Levant"
 FRW_free_levant_desc:0 "The Syrian and Lebanese mandates come to an end, and Damascus and Beirut now govern themselves.\n\nReleases them as §Ycommunist satellites§! (only where France holds their land) and strengthens §YFraternal Peoples§!."
 FRW_european_community_faction:0 "European Community"
 FRW_neutral_bloc_faction:0 "Latin Neutral Bloc"
 frw.120.t:0 "France Proposes a Neutral Bloc"
 frw.120.d:0 "The Marshal's envoy has brought a proposal from Paris. The Latin nations, he says, should stand together and stay out of the coming war between Berlin, London and Moscow. France offers a common defence and asks for nothing further."
 frw.120.a:0 "We accept."
 frw.120.b:0 "We prefer to stand alone."
 frw.121.t:0 "The European Federation"
 frw.121.d:0 "Paris asks the members of the European Community to take the final step towards a federal government with a single army and currency. Our ministers would sit in Paris, and our flag would hang alongside the others in the federal assembly."
 frw.121.a:0 "We join the federation."
 frw.121.b:0 "We keep our sovereignty."
 FRW_imperial_redoubt_desc:0 "If metropolitan France falls, the government will carry on the war from North Africa."
 FRW_imperial_redoubt_2_desc:0 "Each colony has been fortified and its garrison placed on alert."
 FRW_marshals_france_desc:0 "Discipline at home and peace behind well-armed frontiers."
 FRW_continental_empire_spirit_desc:0 "The empire stretches from the Atlantic to the Vistula and the Nile."
 FRW_free_france_spirit_desc:0 "The government continues the war from the colonies until Paris is liberated."
 FRW_brazzaville_spirit_desc:0 "At Brazzaville the colonies were promised a new place in the French community once the war was over."
 FRW_liberation_spirit_desc:0 "Paris has been liberated and the government is back in the capital."
 FRW_european_partner_desc:0 "Membership of the European Community opens foreign markets and laboratories to French firms and scientists."
 FRW_european_market_desc:0 "Goods now pass freely between the member states of the Community."
 FRW_fraternal_peoples_desc:0 "Freed colonies stand with the Commune."
 FRW_fraternal_peoples_2_desc:0 "Freed colonies stand with the Commune."
 FRW_fraternal_peoples_3_desc:0 "Freed colonies stand with the Commune."
 FRW_diplomatic_overture:0 "French Diplomatic Overture"
 FRW_royal_ties:0 "Ties to the French Crown"
 FRW_fascist_friendship:0 "Fascist Friendship"
 FRW_lend_lease_spirit_desc:0 "American equipment reaches the Free French through Britain."
 FRW_resistance_spirit_desc:0 "Resistance networks in occupied France report to London."
 FRW_provisional_government_spirit_desc:0 "The Republic continues in exile and prepares its return."
 FRW_fight_on_spirit_desc:0 "The armistice is not recognised. Every Free French soldier fights as if France depended on him alone."
 FRW_oath_of_kufra_desc:0 "At Kufra, Leclerc's men swore not to lay down their arms until the flag flew over Strasbourg."
 FRW_liberation_cat:0 "The War of Liberation"
 FRW_liberation_cat_desc:0 "Once the Free French hold the main regions of their country, they can offer the occupier a peace on the present front line, or fight on for the rest."
 FRW_liberation_metropole:0 "Offer Peace: Metropolitan France"
 FRW_liberation_metropole_desc:0 "Requires control of §YParis§!, §YPas-de-Calais§!, §YAlsace-Lorraine§!, §YAquitaine§! and §YMarseille§!."
 FRW_liberation_africa:0 "Offer Peace: North Africa"
 FRW_liberation_africa_desc:0 "Requires control of §YAlgeria§!, §YTunisia§! and §YMorocco§!."
 frw.130.t:0 "The Occupier Asks for Terms"
 frw.130.d:0 "With the heartland of France back under the tricolour, the enemy's envoys arrive at our headquarters. They propose an armistice on the present front line. Our generals believe the rest of the country could be taken too, at a price."
 frw.130.a:0 "Sign the peace."
 frw.130.a.tt:0 "Every §YFrench core state§! that France controls becomes French again.\n§YWhite peace§! with every enemy that owned one of them. The capital returns to §YParis§! if France holds it."
 frw.130.b:0 "Fight on until France is free."
 frw.130.b.tt:0 "The war continues. §YWe Fight On§! for 180 days (if not already active). The offer can be made again in 90 days."
 FRW_latin_destiny_spirit_desc:0 "Corsica, Sardinia and the coast of Provence guard the western Mediterranean for France."
 FRW_leader_alfonso_desc:0 "Alfonso of Bourbon left Madrid in April 1931 without abdicating. As senior male heir of Louis XIV he is, for the French Legitimists, King Alphonse I of France and Navarre."
 FRW_legitimist_party:0 "Legitimists"
 FRW_legitimist_party_long:0 "Royalist Legitimist Union"
 FRW_bourbon_pact_faction:0 "Bourbon Family Pact"
 FRW_BOURBON:0 "Kingdom of France and Spain"
 FRW_BOURBON_DEF:0 "the Kingdom of France and Spain"
 FRW_BOURBON_ADJ:0 "Franco-Spanish"
 FRW_legitimist_crown_desc:0 "The senior Bourbons reign in France for the first time since 1830."
 FRW_legitimist_crown_2_desc:0 "Church and crown support each other in both kingdoms."
 FRW_two_crowns_spirit_desc:0 "France and Spain share a king, a fleet plan and their arms factories."
 FRW_bourbon_partner_desc:0 "Spain profits from its alliance with the Bourbon King of France."
 FRW_grand_siecle_desc:0 "A Bourbon rules from the Channel to Gibraltar, as in the days of the Sun King."
 FRW_double_monarchy_idea_desc:0 "France and Spain are one kingdom under one Bourbon king."
 FRW_req_bourbon_tt:0 "§gRequires control of §YMadrid§! (annexed or as a puppet). If France does not control it yet, the kingdom is founded automatically as soon as it does.§!"
 frw.140.t:0 "The King of France Claims Spain"
 frw.140.d:0 "The Bourbon king in Paris reminds Madrid that he never abdicated the Spanish throne. He asks Spain to recognise him as its king again. Accepting would place Spain under French protection; refusing may mean war."
 frw.140.a:0 "Long live the King."
 frw.140.b:0 "Spain will not be ruled from Paris."
 frw.141.t:0 "A Bourbon King in Paris"
 frw.141.d:0 "The Legitimists have proclaimed Alfonso of Bourbon, the exiled King of Spain, as King of France. The Orléans claimant has protested from Brussels, and in Madrid the republican government watches with alarm."
 frw.141.a:0 "Two thrones, one king?"
 frw.142.t:0 "The Crowns of France and Spain United"
 frw.142.d:0 "More than two centuries after the Treaty of Utrecht forbade it, France and Spain have been joined under a single Bourbon king. The new kingdom stretches from Dunkirk to Cádiz."
 frw.142.a:0 "The Pyrenees are gone."
 frw.143.t:0 "Spain Accepts the King"
 frw.143.d:0 "Madrid has recognised our king as King of Spain and placed the country under French protection."
 frw.143.a:0 "Vive le Roi! ¡Viva el Rey!"
 frw.144.t:0 "Spain Refuses the King"
 frw.144.d:0 "Madrid has rejected the claim of our king. The army stands ready on the Pyrenees."
 frw.144.a:0 "Then we will take it."
 FRW_disjointed_2_desc:0 "The cabinet carousel has stopped, but ministers still distrust each other and the administration obeys slowly."
 FRW_disjointed_3_desc:0 "The government has found its footing. A few old quarrels remain."
 FRW_victors_2_desc:0 "The army has begun to question the doctrines of 1918, but old habits fade slowly."
 FRW_dec_consolidate_government:0 "Consolidate the Government"
 FRW_dec_consolidate_government_desc:0 "Purge the ministries of feuding cliques and give the cabinet a firm majority.\n\nAvailable from §Y1937§!, at least §Y6 months§! after the reform began, with §Y40%§! stability: §YA Fragile Government§! becomes §YA Stabilising Government§!."
 FRW_dec_stable_government:0 "A Stable Government"
 FRW_dec_stable_government_desc:0 "The ministries carry out cabinet decrees without delay.\n\nAvailable from §Y1938§!, at least §Y6 months§! after the last step, with §Y50%§! stability: removes §YA Stabilising Government§!."
 FRW_dec_backer_blum:0 "Win Over Léon Blum"
 FRW_dec_backer_blum_desc:0 "Talks with Léon Blum and the SFIO and the Popular Front take about six weeks. Only one leader of this camp can be courted at a time.\n\nRequires §Y45%§! support for the party and §Y30%§! stability. Afterwards the path of Léon Blum can be chosen in the focus tree."
 FRW_dec_backer_reynaud:0 "Win Over Paul Reynaud"
 FRW_dec_backer_reynaud_desc:0 "Talks with Paul Reynaud and the Alliance Démocratique and the centre-right take about six weeks. Only one leader of this camp can be courted at a time.\n\nRequires §Y45%§! support for the party and §Y30%§! stability. Afterwards the path of Paul Reynaud can be chosen in the focus tree."
 FRW_dec_backer_thorez:0 "Win Over Maurice Thorez"
 FRW_dec_backer_thorez_desc:0 "Talks with Maurice Thorez and the PCF and its Moscow line take about six weeks. Only one leader of this camp can be courted at a time.\n\nRequires §Y35%§! support for the party and §Y30%§! stability. Afterwards the path of Maurice Thorez can be chosen in the focus tree."
 FRW_dec_backer_pivert:0 "Win Over Marceau Pivert"
 FRW_dec_backer_pivert_desc:0 "Talks with Marceau Pivert and the Gauche Révolutionnaire take about six weeks. Only one leader of this camp can be courted at a time.\n\nRequires §Y35%§! support for the party and §Y30%§! stability. Afterwards the path of Marceau Pivert can be chosen in the focus tree."
 FRW_dec_backer_larocque:0 "Win Over François de La Rocque"
 FRW_dec_backer_larocque_desc:0 "Talks with François de La Rocque and the Croix-de-Feu and the PSF take about six weeks. Only one leader of this camp can be courted at a time.\n\nRequires §Y35%§! support for the party and §Y30%§! stability. Afterwards the path of François de La Rocque can be chosen in the focus tree."
 FRW_dec_backer_doriot:0 "Win Over Jacques Doriot"
 FRW_dec_backer_doriot_desc:0 "Talks with Jacques Doriot and the PPF take about six weeks. Only one leader of this camp can be courted at a time.\n\nRequires §Y35%§! support for the party and §Y30%§! stability. Afterwards the path of Jacques Doriot can be chosen in the focus tree."
 FRW_dec_backer_petain:0 "Win Over Marshal Pétain"
 FRW_dec_backer_petain_desc:0 "Talks with Marshal Pétain and the veterans and the army take about six weeks. Only one leader of this camp can be courted at a time.\n\nRequires §Y35%§! support for the party and §Y30%§! stability. Afterwards the path of Marshal Pétain can be chosen in the focus tree."
 FRW_dec_backer_orleans:0 "Win Over the Count of Paris"
 FRW_dec_backer_orleans_desc:0 "Talks with the Count of Paris and the Orléanists and the Action Française take about six weeks. Only one leader of this camp can be courted at a time.\n\nRequires §Y35%§! support for the party and §Y30%§! stability. Afterwards the path of the Count of Paris can be chosen in the focus tree."
 FRW_dec_backer_bonaparte:0 "Win Over Prince Louis Napoléon"
 FRW_dec_backer_bonaparte_desc:0 "Talks with Prince Louis Napoléon and the Bonapartist committees take about six weeks. Only one leader of this camp can be courted at a time.\n\nRequires §Y35%§! support for the party and §Y30%§! stability. Afterwards the path of Prince Louis Napoléon can be chosen in the focus tree."
 FRW_dec_backer_legit:0 "Win Over Alfonso of Bourbon"
 FRW_dec_backer_legit_desc:0 "Talks with Alfonso of Bourbon and the Legitimists take about six weeks. Only one leader of this camp can be courted at a time.\n\nRequires §Y35%§! support for the party and §Y30%§! stability. Afterwards the path of Alfonso of Bourbon can be chosen in the focus tree."
 # ---------- Bedingungs-Tooltips (statt roher Flags) ----------
 FRW_backer_blum_req:0 "Has won the support of §YLéon Blum§!"
 FRW_backer_reynaud_req:0 "Has won the support of §YPaul Reynaud§!"
 FRW_backer_thorez_req:0 "Has won the support of §YMaurice Thorez§!"
 FRW_backer_pivert_req:0 "Has won the support of §YMarceau Pivert§!"
 FRW_backer_larocque_req:0 "Has won the support of §YFrançois de La Rocque§!"
 FRW_backer_doriot_req:0 "Has won the support of §YJacques Doriot§!"
 FRW_backer_petain_req:0 "Has won the support of §YMarshal Pétain§!"
 FRW_backer_orleans_req:0 "Has won the support of §Ythe Count of Paris§!"
 FRW_backer_bonaparte_req:0 "Has won the support of §YPrince Louis Napoléon§!"
 FRW_backer_legit_req:0 "Has won the support of §YAlfonso of Bourbon§!"
 FRW_not_secret_alpine_tt:0 "France has not struck the secret bargain over the Alps"
 FRW_alps_refused_tt:0 "Switzerland has refused the offer over the Alps, or no offer was made"
 FRW_alps_answered_tt:0 "Switzerland has answered the offer over the Alps"
 FRW_exile_open_tt:0 "France has capitulated or lost control of §YParis§!"
 FRW_gov_reform_wait_tt:0 "At least §Y6 months§! have passed since the last government reform"
 FRW_no_pending_offer_tt:0 "No other offer to this country is still awaiting an answer"
 FRW_joliot_curie_advisor:0 "Frédéric Joliot-Curie"
 FRW_imperial_scientist:0 "Director of Imperial Science"
 FRW_imperial_scientist_desc:0 "Nobel laureate of 1935, now charged with organising the laboratories of the Empire."
 FRW_backer_captain_req:0 "Has won the support of §YCaptain Kervadec§!"
 FRW_dec_backer_captain:0 "Win Over Captain Kervadec"
 FRW_dec_backer_captain_desc:0 "The writer of the letter from Geneva waits for an answer. Talks with Malo Kervadec and his Zurich backers take about six weeks. Only one leader of this camp can be courted at a time.\n\nRequires §Y35%§! support for the party and §Y30%§! stability. Afterwards a hidden path opens in the focus tree."
 FRW_dec_wait:0 "Wait"
 FRW_dec_wait_desc:0 "The Chambers stay closed and the ministries keep to their routine. Nobody in Paris takes a decision for another month."

 # ---------- Economic reforms (decisions per economic model) ----------
