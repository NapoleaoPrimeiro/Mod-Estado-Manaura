 FRW_adv_ybarnegaray:0 "Jean Ybarnégaray"
 FRW_adv_ybarnegaray_desc:0 "Jean Ybarnégaray has sat in the Chamber since 1914 and speaks for the Croix-de-Feu there. A veteran and a sportsman, he gives the movement the respectable face it needs to win over the provinces."
