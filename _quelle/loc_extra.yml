 FRW_european_research_name:0 "European Defence Research Council"
 FRW_european_research_desc:0 "Laboratories and staffs of the European partners share their results through a common council in Paris."
 FRW_latin_research_name:0 "Latin Scientific Council"
 FRW_latin_research_desc:0 "The universities and arsenals of the Latin nations exchange engineers, patents and results."
 FRW_join_european_research_tt:0 "France and her faction partners join the §YEuropean Defence Research Council§! (tech sharing)."
 FRW_join_latin_research_tt:0 "France and her faction partners join the §YLatin Scientific Council§! (tech sharing)."
 FRW_trait_army_of_africa:0 "Army of Africa"
 FRW_trait_army_of_africa_desc:0 "Years in the Sahara and the Rif have taught him how to keep an army supplied far from any railway."
 FRW_trait_ecole_de_guerre:0 "Professor at the École de Guerre"
 FRW_trait_ecole_de_guerre_desc:0 "He taught a generation of staff officers how to plan a methodical battle."
 FRW_trait_armoured_pioneer:0 "Pioneer of the Armoured Division"
 FRW_trait_armoured_pioneer_desc:0 "He argued for a French armoured division long before the staff wanted one."
 FRW_trait_alpine_school:0 "Alpine Warfare School"
 FRW_trait_alpine_school_desc:0 "He trained his chasseurs on the glaciers of the Alps and in the fjords of the north."
 frw_war.1.t:0 "The Enemy Enters Paris"
 frw_war.1.d:0 "Columns of [ROOT.GetAdjective] troops marched down the Champs-Élysées this morning. The government had already left the capital, and the city was declared open to spare it from destruction. Few Parisians watched the parade; most kept their shutters closed."
 frw_war.1.a:0 "France has lost a battle. She has not lost the war."
 frw_war.1.b:0 "Paris is ours!"
 frw_war.1.c:0 "The City of Light goes dark."
 frw_war.2.t:0 "Paris Liberated"
 frw_war.2.d:0 "The bells of Notre-Dame rang out over the city as French troops entered Paris. After the long occupation, crowds filled the streets from the Porte d'Orléans to the Hôtel de Ville."
 frw_war.2.a:0 "Paris outraged, Paris broken - but Paris liberated!"
 frw_war.2.b:0 "Vive la France!"

 # ---------- Game rule: secret paths ----------
 RULE_FRW_SECRET_PATHS:0 "France Rework: Secret Paths"
 RULE_FRW_SECRET_PATHS_ENABLED:0 "Enabled"
 RULE_FRW_SECRET_PATHS_ENABLED_DESC:0 "France can unlock the secret paths: the corsair captain from Saint-Malo (his fleet, the island raids and the Iberian kingdom) by waiting after Adjourn the Chambers, the revolutionary syndicalists of the CGT by keeping the factories occupied, and Marcel Déat's Neo-Socialists by hearing them out."
 RULE_FRW_SECRET_PATHS_DISABLED:0 "Disabled (recommended for competitive multiplayer)"
 RULE_FRW_SECRET_PATHS_DISABLED_DESC:0 "The decisions that unlock the secret paths never appear: no captain, no CGT path and no Déat path. Only the regular political paths can be played."







































 # ---------- FRW secret ideology paths ----------
 FRW_leader_deat:0 "Marcel Déat"
 FRW_leader_deat_desc:0 "A normalien and war veteran, Marcel Déat was once seen as Blum's successor. In 1933 he broke with the SFIO and founded the Neo-Socialists, who want a planned economy, a strong state and peace at almost any price."
 FRW_leader_deat_fascist_desc:0 "Marcel Déat has broken with parliamentary democracy. His Rassemblement National Populaire wants a single party, a corporatist Labour Front and a socialist and national Europe."
 FRW_leader_besnard:0 "Pierre Besnard"
 FRW_leader_besnard_desc:0 "A railwayman from Anjou, Pierre Besnard led the revolutionary syndicalists of the CGT-SR and was secretary of the International Workers' Association. He holds that the unions, not a party, must run the new society."
 FRW_SYNDIC:0 "Syndicalist France"
 FRW_SYNDIC_DEF:0 "Syndicalist France"
 FRW_SYNDIC_ADJ:0 "Syndicalist"
 FRW_new_europe_faction:0 "New European Order"
 FRW_backer_deat_req:0 "Has won the support of §YMarcel Déat§!"
 FRW_backer_besnard_req:0 "Has won the support of §YPierre Besnard§!"
 FRW_dec_hear_the_neos:0 "Hear the Neo-Socialists"
 FRW_dec_hear_the_neos_desc:0 "Marcel Déat and the Neo-Socialists expelled from the SFIO hold their meetings in the Salle Wagram. Sending someone to listen costs little, and they have ideas about the state that nobody else in the Chamber dares to say aloud."
 FRW_dec_backer_deat:0 "Win Over Marcel Déat"
 FRW_dec_backer_deat_desc:0 "Talks with Marcel Déat and the Neo-Socialists take about six weeks. Only one leader of this camp can be courted at a time.\n\nRequires §Y45%§! support for the party and §Y30%§! stability. Afterwards a hidden path opens in the focus tree in place of the paths of Blum and Reynaud."
 FRW_dec_occupy_factories:0 "Keep the Factories Occupied"
 FRW_dec_occupy_factories_desc:0 "The strikers refuse to leave. Red flags hang from the factory gates, and the union locals run the canteens and the night watches. Every month that the occupations last, the CGT grows bolder."
 FRW_dec_backer_besnard:0 "Win Over Pierre Besnard"
 FRW_dec_backer_besnard_desc:0 "Talks with Pierre Besnard and the revolutionary syndicalists take about six weeks. Only one leader of this camp can be courted at a time.\n\nRequires §Y35%§! support for the party and §Y30%§! stability. Afterwards a hidden path opens in the focus tree in place of the paths of Thorez and Pivert."
 frw_sp.1.t:0 "The Charter of Amiens"
 frw_sp.1.d:0 "Three months on, the factories are still occupied. A delegation of revolutionary syndicalists arrives at the ministry with a copy of the Charter of Amiens of 1906, one sentence underlined: the union, today a body of resistance, will tomorrow be the body of production and distribution.\n\nTheir spokesman, a railwayman named Pierre Besnard, is blunt. «The workers do not need a new master in the Hôtel de Ville, red or otherwise. They need their unions. Leave the factories to those who work in them, and France will run itself.»\n\n§GA new decision is available: Win Over Pierre Besnard.§!"
 frw_sp.1.a:0 "Let the unions speak."
 frw_sp.2.t:0 "Order, Authority, Nation"
 frw_sp.2.d:0 "The Salle Wagram is full. On the platform Marcel Déat repeats the slogan that cost the Neo-Socialists their place in the SFIO: socialism will win only if it takes up order, authority and the nation, and stops leaving them to the leagues.\n\nAfterwards he receives our envoy. «Blum wants to wait for the revolution, and the right wants to wait for nothing at all. I propose a Plan and a state strong enough to carry it out. Tell the government that the Neo-Socialists are ready to serve.»\n\n§GA new decision is available: Win Over Marcel Déat.§!"
 frw_sp.2.a:0 "The Republic needs a strong hand."
 frw_sp.3.t:0 "Déat Founds the Single Party"
 frw_sp.3.d:0 "In Paris, Marcel Déat has closed the Chamber and proclaimed the Rassemblement National Populaire the only party of France. Former socialists march beside veterans of the leagues under the slogan of a national and popular revolution. Déat speaks of a new Europe, and the other capitals wonder which way he means to take it."
 frw_sp.3.a:0 "Another socialist turned dictator."
 frw_sp.3.b:0 "Neither right nor left: France!"
 # ---------- /FRW secret ideology paths ----------
 # ---------- FRW pirate path ----------
 FRW_black_flag_desc:0 "The articles of the Brethren of the Coast: a share for every man, a vote for every captain and no quarter for a merchant who resists."
 FRW_black_flag_2_desc:0 "Raiders and submarines hunt on every sea lane of Europe."
 FRW_black_flag_3_desc:0 "The black flag flies from the mainmast of the flagship. The captain's fleet gives no quarter and takes its pay in prizes."
 FRW_boarders_desc:0 "Marines trained to take a ship or a harbour by surprise."
 FRW_free_port_desc:0 "Saint-Malo is a free port. No customs officer boards, but every ship pays a fee."
 FRW_island_bases_desc:0 "A chain of island harbours from the Balearics to the Seychelles supplies the captain's fleets and landing parties."
 FRW_pirate_captain:0 "Corsair Captain"
 FRW_pirate_captain_desc:0 "He has fought under three flags and lost no battle at sea under any of them."
 FRW_pirate_legoff:0 "Yann Le Goff"
 FRW_pirate_morvan:0 "Corentin Morvan"
 FRW_pirate_duroc:0 "Anatole Duroc"
 # ---------- /FRW pirate path ----------
 # ---------- FRW franc column ----------
 FRW_franc_below_40_tt:0 "Inflation is below §Y40%§!"
 FRW_strong_franc_desc:0 "Credit is cheap and the franc is trusted again. Building sites reopen across the country."
 FRW_war_finance_desc:0 "War loans, taxes and price controls finance the war."
 # ---------- /FRW franc column ----------
 # ---------- FRW colonies ----------
 FRW_colonial_administration:0 "Colonial Administration"
 FRW_colonial_administration_tt:0 "Every state of this region that France owns (without a core and not yet administered) gets §YColonial Administration§!: more recruitable manpower and §G+15%§! resources."
 FRW_colonial_administration_all_tt:0 "§YAlgeria§!, the §YAntilles§!, §YFrench Guiana§! and §YRéunion§! become §Gcores§! (the overseas départements).\nEvery other state in §YAfrica§! that France owns gets §YColonial Administration§!: more recruitable manpower and §G+15%§! resources."
 FRW_free_caribbean:0 "Free the Antilles and Guiana"
 FRW_free_caribbean_desc:0 "The plantation islands of the Caribbean and the penal colony of Guiana are handed to their own peoples.\n\nReleases them as §Ycommunist satellites§! (only where France holds their land) and strengthens §YFraternal Peoples§!."
 # ---------- /FRW colonies ----------
 # ---------- FRW feedback 2 ----------
 FRW_dec_renew_federal_offer:0 "Renew the Federal Offer"
 FRW_dec_renew_federal_offer_desc:0 "Not every government was ready the first time Paris asked. A new delegation of federalists tours the capitals of Europe with the same offer: one army, one currency, one federal assembly."
 FRW_dec_renew_federal_offer_tt:0 "Every democratic minor of Europe in France's faction or under French guarantee is asked again to join the §YEuropean Federation§!."
 # ---------- /FRW feedback 2 ----------
 # ---------- FRW feedback 3 ----------
 FRW_continental_system_faction:0 "The Continental System"
 FRW_rhine_held_desc:0 "When German battalions marched into the Rhineland, France mobilised, and Berlin pulled them back. The country has not felt this sure of itself since 1918."
 frw_fb3.1.t:0 "The Rhine Held"
 frw_fb3.1.d:0 "The German columns that crossed into the demilitarised zone are marching back over the Rhine bridges. Hitler blinked first. In Paris the newspapers call it the first victory since Versailles, and the deputies who voted for mobilisation are cheered outside the Palais Bourbon."
 frw_fb3.1.a:0 "France still keeps the watch on the Rhine."
 FRW_dec_invite_trotsky:0 "Offer Asylum to Leon Trotsky"
 FRW_dec_invite_trotsky_desc:0 "Trotsky lived in France until 1935, when the Republic expelled him to please Moscow. A workers' France could bring back the man who built the Red Army, though Stalin would not forgive it."
 FRW_dec_invite_trotsky_tt:0 "§YLeon Trotsky§! comes to France and can be appointed as a §Ypolitical advisor§!."
 frw_fb3.2.t:0 "Trotsky in Paris"
 frw_fb3.2.d:0 "Leon Trotsky has stepped off the train at the Gare de Lyon, ten years after Stalin drove him out of the Soviet Union. He wants to lecture, to write and to help organise our army. Moscow has recalled its ambassador for consultations."
 frw_fb3.2.a:0 "Welcome, comrade."
 frw_fb3.2.a.tt:0 "§YLeon Trotsky§! can be appointed as a §Ypolitical advisor§!.\nWith §YMarceau Pivert§!: §G+3%§! stability and communist support.\nWith §YMaurice Thorez§!: §R-5%§! stability.\nA communist §YSoviet Union§! takes offence (§R-40§! opinion)."
 FRW_adv_trotsky:0 "Leon Trotsky"
 FRW_trait_trotsky:0 "Founder of the Red Army"
 FRW_trotsky_affront:0 "Sheltered Trotsky"
