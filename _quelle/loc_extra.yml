 FRW_dec_franc_rates:0 "Raise the Discount Rate"
 FRW_dec_franc_rates_desc:0 "The Banque de France raises its rate. Money becomes dear and prices settle; so does work on the building sites."
 FRW_dec_franc_bonds:0 "Issue National Defence Bonds"
 FRW_dec_franc_bonds_desc:0 "Savers lend their francs to the State instead of spending them. Patriotic posters cover the walls of every post office."
 FRW_dec_franc_controls:0 "Price and Wage Controls"
 FRW_dec_franc_controls_desc:0 "Prices and wages are frozen by decree. The shops grumble, the unions grumble, but the franc holds."
 FRW_dec_franc_gold:0 "Sell Gold from the Reserves"
 FRW_dec_franc_gold_desc:0 "Some of the gold in the vaults of the Banque de France is sold abroad to buy back francs."
 FRW_dec_franc_reserves:0 "Rebuild the Gold Reserves"
 FRW_dec_franc_reserves_desc:0 "The Banque de France buys gold on the London market with newly issued francs. The vaults fill up again, but the money supply grows."
 FRW_dec_franc_exchange:0 "Exchange Controls"
 FRW_dec_franc_exchange_desc:0 "Francs may no longer leave the country without permission. Capital flight stops at the border, and so does a good deal of trade."
 FRW_dec_franc_contracts:0 "Arms Contracts Abroad"
 FRW_dec_franc_contracts_desc:0 "Gold buys what French factories cannot deliver in time: American aero-engines, machine tools and whole aircraft, paid for in cash."
 FRW_dec_franc_austerity:0 "An Austerity Budget"
 FRW_dec_franc_austerity_desc:0 "Decree-laws cut the salaries of civil servants and the pensions of veterans. The budget is balanced, to general discontent."
 FRW_dec_franc_cfa:0 "The Colonial Franc Zone"
 FRW_dec_franc_cfa_desc:0 "The colonies get their own franc, tied to the franc of Paris. Part of the pressure on the currency is shifted onto Africa."
 FRW_dec_franc_print:0 "Print Money for Rearmament"
 FRW_dec_franc_print_desc:0 "The printing presses of the Banque de France run day and night. The factories are paid at once; inflation will present the bill later."
 FRW_dec_franc_tripartite:0 "The Tripartite Monetary Agreement"
 FRW_dec_franc_tripartite_desc:0 "London and Washington agree to keep the devalued franc stable together with Paris. It is the end of the gold bloc."
 FRW_franc_cat:0 "The Franc"
 FRW_franc_cat_desc:0 "Inflation: §Y[?FRW_inflation|0]%§! (§Y[?FRW_inf_trend|2]§! points per month). Gold reserves of the Banque de France: §Y[?FRW_gold|0] t§! ([?FRW_gold_trend|+0] t per month).\n\nBelow 20% a sound franc speeds up construction. Above 20% inflation raises the cost of consumer goods, lowers stability and slows construction. At 100% consumer goods §R+12%§!, stability §R-12%§!, construction speed §R-8%§!.\nGold cover: above §Y2000 t§! it steadies the franc, below §Y1000 t§! it weakens it, below §Y400 t§! the vaults are empty.\n\n§YInflation per month§!\n- The Banque de France holds the line: §G-0.5§![FRW_inf_line_1][FRW_inf_line_2][FRW_inf_line_3][FRW_inf_line_4][FRW_inf_line_5][FRW_inf_line_6][FRW_inf_line_7][FRW_inf_line_8][FRW_inf_line_9][FRW_inf_line_10][FRW_inf_line_11][FRW_inf_line_12][FRW_inf_line_13][FRW_inf_line_14][FRW_inf_line_15][FRW_inf_line_16][FRW_inf_line_17][FRW_inf_line_18]\n\n§YGold per month§![FRW_gold_line_0][FRW_gold_line_1][FRW_gold_line_2][FRW_gold_line_3][FRW_gold_line_4][FRW_gold_line_5][FRW_gold_line_6][FRW_gold_line_7][FRW_gold_line_8][FRW_gold_line_9][FRW_gold_line_10][FRW_gold_line_11]"
 FRW_liberation_prestige_tt:0 "Every French state in Europe liberated from the enemy: Free French Prestige §G+2§!."
 FRW_exchange_controls_tt:0 "Capital flight (Popular Front, revolution, political instability) no longer drains the gold reserves."
 FRW_contracts_tt:0 "For one year: §G+3§! military factories abroad (offsite production)."
 FRW_cfa_drift_tt:0 "From now on inflation falls by another §G0.25§! points per month and the colonies send §G+5 t§! of gold per month."
 FRW_tripartite_drift_tt:0 "From now on inflation falls by another §G0.25§! points per month and §G+5 t§! of gold per month return to Paris."
 FRW_tight_money_desc:0 "Credit is dear. Fewer new projects are started, but the franc is safe."
 FRW_austerity_desc:0 "Spending cuts have calmed the markets, but civil servants, veterans and builders all feel them."
 FRW_price_riots_desc:0 "Crowds storm the markets and the bakeries. The franc is worth less every week."
 FRW_new_franc_desc:0 "A currency reform has wiped out savings overnight. The franc is sound again, but trust in the State is not."
 FRW_fighting_france_desc:0 "The whole Allied world now recognises Fighting France as the true France."
 FRW_exchange_controls_idea_desc:0 "Every franc that leaves the country needs a permit. The gold stays at home, but importers and bankers complain."
 FRW_foreign_contracts_desc:0 "Factories in America work on French orders, paid in gold."
 FRW_gold_loan_desc:0 "London has lent us gold. The interest must be paid every month."
 FRW_printing_press_desc:0 "New money pours into the factories. Inflation will follow."
 FRW_franc:0 "The Franc"
 FRW_franc_desc:0 "Inflation: §Y[?FRW_inflation|0]%§!. Manage it in the decision menu §YThe Franc§!."
 FRW_ff_prestige_mod:0 "Prestige of Free France"
 FRW_ff_prestige_mod_desc:0 "Free French Prestige: §Y[?FRW_ff_prestige|0]§! of 100. The higher it is, the more governors are willing to rally."
 FRW_dec_rally_eq:0 "Envoy to French Equatorial Africa"
 FRW_dec_rally_eq_desc:0 "A Free French envoy tries to win over the governor and the garrison.\n\nChance of success: §Y[?FRW_ffc_eq|0]%§!"
 FRW_dec_exped_eq:0 "Expedition to French Equatorial Africa"
 FRW_dec_exped_eq_desc:0 "Free French troops land with Allied support and try to take the region. Sometimes their appearance off the coast is enough.\n\nChance of success: §Y[?FRW_ffe_eq|0]%§!"
 FRW_dec_rally_aof:0 "Envoy to French West Africa"
