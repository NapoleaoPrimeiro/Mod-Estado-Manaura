 FRW_adv_bichelonne:0 "Jean Bichelonne"
 FRW_adv_bichelonne_desc:0 "Jean Bichelonne is said to know the output of every French factory by heart. He believes that a nation is a machine to be run by engineers, and the new regime has given him the controls."
 FRW_trait_bichelonne:0 "The Technocrat"
 FRW_trait_bichelonne_desc:0 "First of his year at the École Polytechnique with the highest marks in its history."
