 FRW_ffp_tt_p2:0 "Free French Prestige: §G+2§!"
 FRW_ffp_tt_p3:0 "Free French Prestige: §G+3§!"
 FRW_ralliement_cat:0 "Free France"
 FRW_exped_eq_tt:0 "Has at least §Y1,500§! infantry equipment in stock"
 FRW_dec_exped_tt:0 "Uses §Y15,000§! manpower and §Y1,500§! infantry equipment. After §Y45 days§! the expedition reports back: on success the region joins Free France (§G+5§! prestige, army experience), on failure §R-8§! prestige."
 FRW_dec_ff_agents:0 "Parachute Agents into France"
 FRW_dec_ff_agents_desc:0 "Radio operators and organisers of the BCRA are dropped by night over occupied France."
 FRW_dec_ff_agents_tt:0 "Every occupied French state in Europe: resistance §G+5§!."
 FRW_dec_ff_sabotage:0 "Sabotage the Railways"
 FRW_dec_ff_sabotage_desc:0 "Railway workers of the Résistance-Fer blow up points, derail trains and slow every German convoy."
 FRW_dec_ff_sabotage_tt:0 "Every occupied French state in Europe: resistance §G+10§!, infrastructure damaged."
 FRW_dec_ff_gold:0 "Spend the Gold of the Banque de France"
 FRW_dec_ff_gold_desc:0 "The gold shipped out of France before the armistice pays for weapons and workshops abroad.\n\nGold left: §Y[?FRW_gold|0] t§!"
 FRW_gold_m400_tt:0 "Gold reserves: §R-400 t§!"
 FRW_ralliement_cat_desc:0 "The colonies were handed to Vichy, but they can be won back one region at a time: by an §Yenvoy§! (cheap, depends on prestige) or by an §Yexpedition§! (costs men and rifles, +25% chance, another +10% while Britain fights on).\n\nFree French Prestige: §Y[?FRW_ff_prestige|0]§! of 100\n\nThe chance of success rises with prestige (half of it counts), with every earlier failure in the same region (§G+10%§! each, up to three) and with some focuses. A success gives §G+5§! prestige, a failure §R-5§!. Prestige grows by itself every month while France fights on, faster when a major ally is still in the war."
 FRW_dec_rally_tt:0 "After §Y21 days§! the envoy reports back: on success every state of the region held by §YVichy§! joins Free France, together with its soldiers and their rifles."
 FRW_ffp_tt_m10:0 "Free French Prestige: §R-10§!"
 FRW_ffp_tt_p5:0 "Free French Prestige: §G+5§!"
 frw_sys.20.t:0 "French Equatorial Africa Rallies to Free France"
 frw_sys.20.d:0 "Governor Félix Éboué has declared for Free France at Fort-Lamy. Within days Cameroon, the Middle Congo and Gabon follow. Brazzaville becomes the first capital of Free France."
 frw_sys.20.a:0 "Vive la France libre!"
 frw_sys.30.t:0 "French Equatorial Africa Stays Loyal to Vichy"
 frw_sys.30.d:0 "The officers in Gabon remain loyal to Vichy, and the envoy is put on the next boat to Lagos. Next time our envoys will be better prepared."
 frw_sys.30.a:0 "We will try again."
 frw_sys.60.t:0 "Our Troops Land in French Equatorial Africa"
 frw_sys.60.d:0 "Free French columns, supported by Allied ships and aircraft, have reached the capital of the region. Governor Félix Éboué has declared for Free France at Fort-Lamy. Within days Cameroon, the Middle Congo and Gabon follow. Brazzaville becomes the first capital of Free France."
 frw_sys.60.a:0 "The Cross of Lorraine flies again."
 frw_sys.70.t:0 "The Expedition to French Equatorial Africa Has Failed"
 frw_sys.70.d:0 "Our landing ran into determined resistance from the Vichy garrison and had to be called off. Men and equipment were lost, and Vichy propaganda celebrates."
 frw_sys.70.a:0 "We will be back."
 frw_sys.21.t:0 "French West Africa Rallies to Free France"
 frw_sys.21.d:0 "In Dakar the Governor-General has changed sides. The great harbour, the battleship in its basin and the Senegalese Tirailleurs now serve Free France."
 frw_sys.21.a:0 "Vive la France libre!"
 frw_sys.31.t:0 "French West Africa Stays Loyal to Vichy"
 frw_sys.31.d:0 "The batteries of Dakar open fire on the Free French ships. Vichy keeps West Africa for the time being. Next time our envoys will be better prepared."
 frw_sys.31.a:0 "We will try again."
 frw_sys.61.t:0 "Our Troops Land in French West Africa"
 frw_sys.61.d:0 "Free French columns, supported by Allied ships and aircraft, have reached the capital of the region. In Dakar the Governor-General has changed sides. The great harbour, the battleship in its basin and the Senegalese Tirailleurs now serve Free France."
 frw_sys.61.a:0 "The Cross of Lorraine flies again."
 frw_sys.71.t:0 "The Expedition to French West Africa Has Failed"
 frw_sys.71.d:0 "Our landing ran into determined resistance from the Vichy garrison and had to be called off. Men and equipment were lost, and Vichy propaganda celebrates."
 frw_sys.71.a:0 "We will be back."
 frw_sys.22.t:0 "French North Africa Rallies to Free France"
 frw_sys.22.d:0 "Algiers, Oran, Casablanca and Tunis have rallied. The Army of Africa, a hundred thousand men, returns to the war."
 frw_sys.22.a:0 "Vive la France libre!"
 frw_sys.32.t:0 "French North Africa Stays Loyal to Vichy"
 frw_sys.32.d:0 "General Weygand has the conspirators in Algiers arrested. North Africa stays with the Marshal. Next time our envoys will be better prepared."
 frw_sys.32.a:0 "We will try again."
 frw_sys.62.t:0 "Our Troops Land in French North Africa"
 frw_sys.62.d:0 "Free French columns, supported by Allied ships and aircraft, have reached the capital of the region. Algiers, Oran, Casablanca and Tunis have rallied. The Army of Africa, a hundred thousand men, returns to the war."
 frw_sys.62.a:0 "The Cross of Lorraine flies again."
 frw_sys.72.t:0 "The Expedition to French North Africa Has Failed"
 frw_sys.72.d:0 "Our landing ran into determined resistance from the Vichy garrison and had to be called off. Men and equipment were lost, and Vichy propaganda celebrates."
 frw_sys.72.a:0 "We will be back."
 frw_sys.23.t:0 "The Levant Rallies to Free France"
 frw_sys.23.d:0 "After a short and bitter campaign, the Army of the Levant has laid down its arms. Many of its soldiers chose to join the Free French."
 frw_sys.23.a:0 "Vive la France libre!"
 frw_sys.33.t:0 "The Levant Stays Loyal to Vichy"
 frw_sys.33.d:0 "General Dentz rejects every offer. In Damascus, Free French officers are tried for treason. Next time our envoys will be better prepared."
 frw_sys.33.a:0 "We will try again."
 frw_sys.63.t:0 "Our Troops Land in The Levant"
 frw_sys.63.d:0 "Free French columns, supported by Allied ships and aircraft, have reached the capital of the region. After a short and bitter campaign, the Army of the Levant has laid down its arms. Many of its soldiers chose to join the Free French."
 frw_sys.63.a:0 "The Cross of Lorraine flies again."
 frw_sys.73.t:0 "The Expedition to The Levant Has Failed"
 frw_sys.73.d:0 "Our landing ran into determined resistance from the Vichy garrison and had to be called off. Men and equipment were lost, and Vichy propaganda celebrates."
 frw_sys.73.a:0 "We will be back."
 frw_sys.24.t:0 "Madagascar and the Indian Ocean Rallies to Free France"
 frw_sys.24.d:0 "The governor in Tananarive has handed over the island. The Indian Ocean is closed to the Axis."
 frw_sys.24.a:0 "Vive la France libre!"
 frw_sys.34.t:0 "Madagascar and the Indian Ocean Stays Loyal to Vichy"
 frw_sys.34.d:0 "The garrison of Diego-Suarez stands firm. Madagascar remains loyal to Vichy. Next time our envoys will be better prepared."
 frw_sys.34.a:0 "We will try again."
 frw_sys.64.t:0 "Our Troops Land in Madagascar and the Indian Ocean"
 frw_sys.64.d:0 "Free French columns, supported by Allied ships and aircraft, have reached the capital of the region. The governor in Tananarive has handed over the island. The Indian Ocean is closed to the Axis."
 frw_sys.64.a:0 "The Cross of Lorraine flies again."
 frw_sys.74.t:0 "The Expedition to Madagascar and the Indian Ocean Has Failed"
 frw_sys.74.d:0 "Our landing ran into determined resistance from the Vichy garrison and had to be called off. Men and equipment were lost, and Vichy propaganda celebrates."
 frw_sys.74.a:0 "We will be back."
 frw_sys.25.t:0 "French Somaliland Rallies to Free France"
 frw_sys.25.d:0 "Cut off and starving under the British blockade, Djibouti has rallied to Free France."
 frw_sys.25.a:0 "Vive la France libre!"
 frw_sys.35.t:0 "French Somaliland Stays Loyal to Vichy"
 frw_sys.35.d:0 "The small garrison of Djibouti refuses to rally and the blockade continues. Next time our envoys will be better prepared."
 frw_sys.35.a:0 "We will try again."
 frw_sys.65.t:0 "Our Troops Land in French Somaliland"
 frw_sys.65.d:0 "Free French columns, supported by Allied ships and aircraft, have reached the capital of the region. Cut off and starving under the British blockade, Djibouti has rallied to Free France."
 frw_sys.65.a:0 "The Cross of Lorraine flies again."
 frw_sys.75.t:0 "The Expedition to French Somaliland Has Failed"
 frw_sys.75.d:0 "Our landing ran into determined resistance from the Vichy garrison and had to be called off. Men and equipment were lost, and Vichy propaganda celebrates."
 frw_sys.75.a:0 "We will be back."
 frw_sys.26.t:0 "French Indochina Rallies to Free France"
 frw_sys.26.d:0 "Hanoi and Saigon have rallied to Free France. Admiral Decoux has been put on a ship home."
 frw_sys.26.a:0 "Vive la France libre!"
 frw_sys.36.t:0 "French Indochina Stays Loyal to Vichy"
 frw_sys.36.d:0 "Admiral Decoux keeps Indochina for Vichy, under the eyes of the Japanese garrison. Next time our envoys will be better prepared."
 frw_sys.36.a:0 "We will try again."
 frw_sys.66.t:0 "Our Troops Land in French Indochina"
 frw_sys.66.d:0 "Free French columns, supported by Allied ships and aircraft, have reached the capital of the region. Hanoi and Saigon have rallied to Free France. Admiral Decoux has been put on a ship home."
 frw_sys.66.a:0 "The Cross of Lorraine flies again."
