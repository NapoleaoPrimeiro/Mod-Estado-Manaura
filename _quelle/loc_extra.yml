 # ---------- France Rework: frontier, war, industry ----------
 FRW_dec_fort_meuse:0 "Close the Meuse Gap"
 FRW_dec_fort_meuse_desc:0 "The staff calls the Ardennes impassable. The engineers of the 2nd Army are less sure and want casemates on the Meuse between Sedan and Montmédy."
 FRW_dec_fort_nord:0 "Fortify the Northern Frontier"
 FRW_dec_fort_nord_desc:0 "From Dunkirk to Maubeuge the border with Belgium lies open. A line of blockhouses and anti-tank ditches is to follow the canals."
 FRW_dec_fort_alps:0 "The Alpine Fortified Sector"
 FRW_dec_fort_alps_desc:0 "Forts high above the passes of the Maurienne and the Tinée can hold any army that tries to cross the Alps."
 FRW_dec_fort_pyrenees:0 "Watch on the Pyrenees"
 FRW_dec_fort_pyrenees_desc:0 "The war in Spain may spill across the mountains. A few strongpoints guard the passes and the coast road at Le Perthus."
 FRW_dec_fort_mareth:0 "The Mareth Line"
 FRW_dec_fort_mareth_desc:0 "Between the sea and the Matmata hills, south of Gabès, a line of blockhouses closes the road from Italian Libya into Tunisia."
 FRW_dec_fort_coast:0 "Coastal Batteries of Brest and Toulon"
 FRW_dec_fort_coast_desc:0 "New heavy batteries and anti-aircraft guns protect the two great naval bases of the Republic."
 FRW_dec_fort_paris_aa:0 "Air Defence of Paris"
 FRW_dec_fort_paris_aa_desc:0 "Searchlights, listening posts and anti-aircraft batteries ring the capital, and a new radar station watches the northern sky."
 FRW_dec_fort_corsica:0 "Fortify Corsica"
 FRW_dec_fort_corsica_desc:0 "Ajaccio and Bastia lie within reach of the Italian fleet. Coastal guns and a small garrison secure the island."
 FRW_frontier_cat:0 "Defence of the Frontiers"
 FRW_frontier_cat_desc:0 "The Maginot Line covers only part of France. These works close the remaining gaps in the north, in the Alps, on the Pyrenees and overseas. Each project takes a few weeks to finish."
 FRW_dec_war_taxis:0 "Requisition the Taxis of Paris"
 FRW_dec_war_taxis_desc:0 "In 1914 the taxis of Paris carried a division to the Marne. Every lorry, bus and car in the capital region is now pressed into service."
 FRW_dec_war_reserves:0 "Call Up the Reserve Classes"
 FRW_dec_war_reserves_desc:0 "The older classes, released years ago, are called back to the colours."
 FRW_dec_war_arsenals:0 "Open the Arsenals of 1918"
 FRW_dec_war_arsenals_desc:0 "The depots still hold rifles and guns from the last war. Old, but better than nothing."
 FRW_dec_war_gold:0 "Ship the Gold to Dakar"
 FRW_dec_war_gold_desc:0 "The cruisers of the Navy can carry the reserves of the Banque de France out of reach of the enemy. Whatever happens in Paris, the State will not be bankrupt."
 FRW_dec_war_loire:0 "Fall Back Behind the Loire"
 FRW_dec_war_loire_desc:0 "If the front cannot be held, the army must not be destroyed. It retreats in order to the next river and digs in again."
 FRW_patrie_cat:0 "La Patrie en Danger"
 FRW_gold_safe_tt:0 "The gold reserves are safe: if France capitulates, §YFree France§! can still spend them."
 FRW_patrie_cat_desc:0 "The enemy stands on French soil. Each of these emergency measures can only be taken once, so choose the moment well."
 FRW_invaded_tt:0 "An enemy holds part of §Ymetropolitan France§!"
 FRW_gold_abroad_desc:0 "The reserves of the Banque de France are safe in West Africa. The government can keep paying its soldiers and its suppliers."
 FRW_line_of_the_loire_desc:0 "The army has broken contact and dug in along the river. It will not attack, but it will not be easy to dislodge either."
