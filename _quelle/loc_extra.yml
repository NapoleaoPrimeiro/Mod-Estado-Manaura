 FRW_gold_p400_tt:0 "Gold reserves: §G+400 t§!"
 FRW_inf_tt_m35:0 "Inflation: §G-35§!"
 frw_sys.3.t:0 "Hyperinflation"
 frw_sys.3.d:0 "Banknotes are carried in baskets, and prices change twice a day. The franc is close to collapse. The experts of the Ministry of Finance propose a radical currency reform: a new franc, a hundred old ones for one new."
 frw_sys.3.a:0 "Introduce the new franc."
 frw_sys.3.b:0 "Not now. Ride it out."
 frw_sys.4.t:0 "The Gold Is Lost"
 frw_sys.4.d:0 "The gold of the Banque de France was not shipped out in time. It now lies in the hands of the occupier, and Free France must make do without it."
 frw_sys.4.a:0 "We should have sent it to Dakar."
 frw_sys.50.t:0 "The Allies Recognise Free France"
 frw_sys.50.d:0 "London and Washington now treat Free France as a real ally. Weapons, credits and factory space in Britain are put at our disposal."
 frw_sys.50.a:0 "France is back at the table."
 frw_sys.51.t:0 "Fighting France"
 frw_sys.51.d:0 "The Allied governments deal with the Free French committee as the government of France. Ambassadors who once called at Vichy go to Carlton Gardens instead."
 frw_sys.51.a:0 "Vive la France combattante!"
 frw_sys.5.t:0 "The Vaults Run Low"
 frw_sys.5.d:0 "The governor of the Banque de France brings bad news: fewer than five hundred tonnes of gold are left in the vaults. Without gold the franc has nothing behind it, and every speculator in Europe knows it."
 frw_sys.5.a:0 "Close the borders to capital."
 frw_sys.5.b:0 "Ask London for a gold loan."
 frw_sys.5.c:0 "We will manage somehow."
 frw_sys.1.t:0 "The Franc Is Falling"
 frw_sys.1.d:0 "Prices in Paris have doubled in a year. Housewives queue for bread, the unions demand higher wages and the newspapers speak of 1926. The Minister of Finance asks for emergency measures."
 frw_sys.1.a:0 "Take the bitter medicine."
 frw_sys.1.b:0 "The nation will bear it - France has other worries."
 frw_sys.2.t:0 "The Government in Exile"
 frw_sys.2.d:0 "France has fallen, but the government fights on. The Free France branch of the focus tree is now open, and the decision menu §YFree France§! lets you win back the colonies that were handed to Vichy."
 frw_sys.2.a:0 "The flame of French resistance must not go out."
 frw_sys.10.t:0 "The Fleet at Mers-el-Kébir"
 frw_sys.10.d:0 "The armistice gave the fleet to Vichy. In Mers-el-Kébir, Toulon and Alexandria the ships lie at anchor, their crews unsure whom to obey. London will not let them fall into German hands, and Free France must decide what to tell the crews."
 frw_sys.10.a:0 "Call on the sailors to join us."
 frw_sys.10.a.tt:0 "Chance (§Y20%§! + 40% of prestige): part of the Vichy fleet (§Yabout a third§!) sails to join Free France, §G+5§! prestige. Otherwise §R-5§! prestige."
 frw_sys.10.b:0 "Let the Royal Navy settle it."
 frw_sys.10.b.tt:0 "The Royal Navy attacks the Vichy fleet: Vichy loses §Ya battleship, a battlecruiser and three destroyers§!."
 frw_sys.10.c:0 "French ships will never fire on French ships."
 frw_sys.11.t:0 "The Sailors Join Us"
 frw_sys.11.d:0 "Several ships slipped out of harbour at night and are now steaming for Free French ports, with their crews cheering on deck."
 frw_sys.11.a:0 "Welcome aboard."
 frw_sys.12.t:0 "The Fleet Stays with Vichy"
 frw_sys.12.d:0 "Admiral Darlan has the crews confined to their ships. Not one vessel has answered our call."
 frw_sys.12.a:0 "A bitter blow."
 frw_sys.40.t:0 "A Governor Has Defected"
 frw_sys.40.d:0 "One of our colonial governors has gone over to the dissidents in London. His territory now flies the Cross of Lorraine."
 frw_sys.40.a:0 "Traitors!"
 FRW_hook_devalue_the_franc_0_tt:0 "Inflation: §G-10§!"
 FRW_hook_reform_banque_de_france_0_tt:0 "From now on inflation falls by another §G0.5§! points per month."
 FRW_hook_war_economy_0_tt:0 "Inflation: §R+5§!"
 FRW_hook_appeal_of_18_june_0_tt:0 "Free French Prestige starts at §Y20§! of 100 and the decisions §YFree France§! open. Removes §YDefeatism§!."
 FRW_hook_continue_the_fight_0_tt:0 "Free French Prestige: §G+5§!"
 FRW_hook_free_french_forces_0_tt:0 "Free French Prestige: §G+5§!"
 FRW_hook_rally_the_colonies_0_tt:0 "Free French Prestige: §G+10§!"
 FRW_hook_leclerc_column_0_tt:0 "Free French Prestige: §G+5§!"
 FRW_hook_brazzaville_conference_0_tt:0 "Free French Prestige: §G+10§!"
 FRW_hook_the_resistance_0_tt:0 "Free French Prestige: §G+5§!"

 # ---------- Free France extension ----------
 FRW_ff_chequers_spirit_desc:0 "Britain pays, arms and supplies the Free French, and recognises de Gaulle as their leader."
 FRW_ff_national_committee_spirit_desc:0 "The French National Committee governs from London."
 FRW_ff_bcra_spirit_desc:0 "The intelligence service of Free France runs networks across occupied France."
 FRW_ff_cnr_spirit_desc:0 "The Conseil National de la Résistance unites the movements."
 FRW_ff_bir_hakeim_spirit_desc:0 "The army remembers the sixteen days in the desert."
 FRW_ff_fafl_spirit_desc:0 "French pilots fly again under the Cross of Lorraine."
 FRW_ff_normandie_spirit_desc:0 "French pilots fly Yaks with the Red Air Force."
 FRW_ff_fnfl_spirit_desc:0 "Free French ships escort the convoys of the Atlantic."
 FRW_ff_securite_sociale_spirit_desc:0 "Every wage earner is insured. It is costly, and very popular."
 FRW_ff_reconstruction_spirit_desc:0 "France rebuilds what the war destroyed."
 FRW_ff_fourth_republic_spirit_desc:0 "An elected Assembly governs France again."
 FRW_ff_eurafrican_assembly_spirit_desc:0 "Europe and Africa share one parliament."
 FRW_ff_lorraine_spirit_desc:0 "French bomber crews fly their own missions over France."
 FRW_ff_richelieu_spirit_desc:0 "The most modern French battleship fights again."
 FRW_ff_maquis_spirit_desc:0 "The hills of France are full of armed men."
 FRW_ff_colonial_recruitment_spirit_desc:0 "Tirailleurs from Africa fill the army of liberation."
 FRW_ff_cfln_spirit_desc:0 "One committee, one army, one France."
 FRW_ff_cef_spirit_desc:0 "Juin's mountain troops lead the way."
 FRW_ff_dragoon_spirit_desc:0 "The army knows how to land on a hostile shore."
 FRW_ff_dakar_tt:0 "§YFrench West Africa§! (Dakar) has rallied to Free France"
 FRW_ff_sov_fights_tt:0 "The §YSoviet Union§! is at war with §YGermany§!"

 # ---------- French Africa in allied hands ----------
 FRW_return_cat:0 "French Africa in Allied Hands"
 FRW_return_cat_desc:0 "Allied troops hold parts of French Africa. Ask them to hand the territory back to France, either politely or with an offer they will find hard to refuse.\n\nFree French Prestige: §Y[?FRW_ff_prestige|0]§!"
 FRW_dec_return_request:0 "Ask [FROM.GetName] to Return French Africa"
 FRW_dec_return_request_desc:0 "[FROM.GetName] holds French territory in Africa. A diplomatic request costs little, but they may say no."
 FRW_dec_return_request_tt:0 "[FROM.GetName] decides. An AI accepts more readily the higher our §YFree French Prestige§! (from about §Y50%§! up to §Y95%§!).\nOn acceptance every §YFrench§! state in §YAfrica§! that [FROM.GetName] holds goes to France."
 FRW_dec_return_buy_pp:0 "Buy Back French Africa from [FROM.GetName]"
 FRW_dec_return_buy_pp_desc:0 "France offers concessions and credits in return for her African territories."
 FRW_dec_return_buy_tt:0 "An AI always accepts. [FROM.GetName] receives §Y60§! political power; if they refuse, we get our §Y100§! political power back.\nOn acceptance every §YFrench§! state in §YAfrica§! that [FROM.GetName] holds goes to France."
 FRW_dec_return_buy_gold:0 "Pay for French Africa in Gold"
 FRW_dec_return_buy_gold_desc:0 "Three hundred tonnes of the gold of the Banque de France for the return of French Africa.\n\nGold left: §Y[?FRW_gold|0] t§!"
 FRW_dec_return_gold_tt:0 "Gold reserves: §R-300 t§!. An AI always accepts. [FROM.GetName] gets §YFrench Gold§! for a year (consumer goods §G-5%§!); if they refuse, the gold comes back.\nOn acceptance every §YFrench§! state in §YAfrica§! that [FROM.GetName] holds goes to France."
 frw_ret.hand_tt:0 "Every §YFrench§! state in §YAfrica§! we hold goes to §YFrance§!."
 frw_ret.1.t:0 "France Asks for Her Colonies"
 frw_ret.1.d:0 "The French government reminds us that the African territories our troops now hold are French. It asks for them to be handed back to its administration."
 frw_ret.1.a:0 "They are our allies. Hand them over."
 frw_ret.1.b:0 "Not while the war goes on."
 frw_ret.2.t:0 "A French Offer"
 frw_ret.2.d:0 "Paris offers trade concessions and credits if we return the French territories in Africa that our troops hold."
 frw_ret.2.a:0 "A fair price. Agreed."
 frw_ret.2.b:0 "We are not for sale."
 frw_ret.3.t:0 "French Gold for French Africa"
 frw_ret.3.d:0 "The French offer three hundred tonnes of gold from the reserves of the Banque de France for the return of their African territories."
 frw_ret.3.a:0 "Gold speaks louder than words. Agreed."
 frw_ret.3.b:0 "Keep your gold."
 frw_ret.10.t:0 "French Africa Returns"
 frw_ret.10.d:0 "Our allies have handed the French territories in Africa back to us. The tricolour flies again over the government buildings."
 frw_ret.10.a:0 "Merci, mes amis."
 frw_ret.11.t:0 "Our Request Was Refused"
 frw_ret.11.d:0 "Our allies will not hand back the French territories in Africa for the time being."
 frw_ret.11.a:0 "We will ask again."
 FRW_french_gold_payment_desc:0 "Gold paid by France for the return of her African territories."
