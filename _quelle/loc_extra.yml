 FRW_dec_rally_ind:0 "Envoy to French Indochina"
 FRW_dec_rally_ind_desc:0 "A Free French envoy tries to win over the governor and the garrison.\n\nChance of success: §Y[?FRW_ffc_ind|0]%§!"
 FRW_dec_exped_ind:0 "Expedition to French Indochina"
