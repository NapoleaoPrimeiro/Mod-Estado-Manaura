 FRW_adv_sauvy:0 "Alfred Sauvy"
 FRW_adv_sauvy_desc:0 "Alfred Sauvy has the numbers no minister wants to hear: deaths in France exceed births, and forty-one million French face nearly seventy million Germans. He calls for family allowances and a proper census of the nation's manpower."
 FRW_trait_sauvy:0 "The Demographer"
 FRW_trait_sauvy_desc:0 "The statistician who warns that France is growing old while Germany grows young."
