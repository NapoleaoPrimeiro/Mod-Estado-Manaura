 FRW_adv_cot_req:0 "§YPierre Cot§! is a political advisor"
 FRW_adv_mandel:0 "Georges Mandel"
 FRW_adv_mandel_desc:0 "Georges Mandel learned politics at the side of Clemenceau and kept his master's ruthlessness. As Minister of the Colonies he plans to raise an army of half a million men overseas. France, he likes to say, is a nation of 110 million."
 FRW_trait_mandel:0 "Colonial Hardliner"
 FRW_trait_mandel_desc:0 "Clemenceau's former right hand, now Minister of the Colonies and the loudest voice against appeasement."
 FRW_dec_appoint_mandel:0 "Appoint Georges Mandel"
