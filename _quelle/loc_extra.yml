 FRW_adv_marion:0 "Paul Marion"
 FRW_adv_marion_desc:0 "Paul Marion learned the methods of the Comintern from the inside before turning against it. He knows how a party wins the street and the press, and he means to put that knowledge at Jacques Doriot's service."
 FRW_trait_marion:0 "Propaganda Chief"
 FRW_trait_marion_desc:0 "A former communist who left Moscow disillusioned and now writes the speeches of the PPF."
