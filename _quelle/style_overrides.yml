 FRW_reynaud_rearmament_desc:0 "Reynaud spent years warning the Chamber about German rearmament. In office, he can act on what he said in opposition."
 FRW_armee_de_metier_desc:0 "In 'Vers l'armée de métier' (1934) Lieutenant-Colonel de Gaulle called for a professional army built around armoured divisions. Reynaud took up the idea in the Chamber the following year. France builds a smaller army of long-service professionals."
 FRW_entente_cordiale_desc:0 "The Entente of 1904 held through four years on the Western Front. Paris proposes to make it a standing alliance with London."
 FRW_council_of_europe_desc:0 "In 1929 Aristide Briand proposed a European union at Geneva. His successors take the plan out of the files of the Quai d'Orsay."
 FRW_fourth_republic_desc:0 "The laws of 1875 were a stopgap that lasted sixty years. A new constitution gives France a stronger executive and longer-lived cabinets."
 FRW_relax_forty_hours_desc:0 "The forty-hour week remains law, but the arms factories are exempted and may work overtime."
 FRW_edge_of_the_sword_desc:0 "The armoured division de Gaulle described becomes the pattern for the rest of the army. 'Le Fil de l'épée', de Gaulle's 1932 essay on command, is placed on the reading list of the École de Guerre."
 FRW_deat_neosocialism_desc:0 "At the Socialist congress of 1933 Adrien Marquet and Marcel Déat told the party that it must win the middle classes with «order, authority, nation». Blum had them expelled. The Neo-Socialists offer the Republic a strong state and a planned economy."
 FRW_deat_die_for_danzig_desc:0 "«Must we die for Danzig?» asks Déat in the newspaper L'Œuvre. French peasants, he writes, will not go to war for a free city on the Baltic. The article divides the country, and his critics call it the first step on the road to Berlin."
 FRW_deat_republic_of_order_desc:0 "For the first time since the war a cabinet outlasts its budget and the Plan meets its targets. Déat's supporters say no parliament could have done as much."
 FRW_iberian_revolution_desc:0 "The Spanish Communists and the unions ask Paris for arms against the generals."
 FRW_red_industry_desc:0 "Le Creusot and the de Wendel steelworks pass to the state. Output targets replace dividends."
 FRW_fils_du_peuple_desc:0 "Thorez's autobiography, 'Fils du peuple', is printed in millions of copies. The miner's son from the Pas-de-Calais looks down from posters in every Party office."
 FRW_bastion_of_the_west_desc:0 "Paris is the capital of socialism in Western Europe. Workers' delegations from London, Brussels and Barcelona arrive by every train."
 FRW_cgt_bourses_du_travail_desc:0 "Fernand Pelloutier wanted the labour exchanges to be the schools of the working class. Libraries, evening classes and technical courses open in every town to make them so."
 FRW_cgt_confederal_congress_desc:0 "Delegates of every federation meet at the Mutualité. Decisions rise from the factory to the congress, not down from a central committee. The factory occupations end, since the occupiers run the works."
 FRW_national_renewal_desc:0 "The leagues march again, shouting 'À bas les voleurs!' at the Republic."
 FRW_restore_french_honour_desc:0 "Savoy and Nice have been French since the Treaty of Turin in 1860. Geneva, long claimed by the Dukes of Savoy, is demanded as well. Piedmont is left to Rome, France's partner in the Latin Bloc."
 FRW_mediterranean_ambition_desc:0 "Toulon, Bizerte, Algiers and Beirut give France harbours on every shore of the Mediterranean. Rome is expected to accept French primacy at sea, as a partner under La Rocque or as a defeated rival under Doriot."
 FRW_french_imperium_desc:0 "From Dakar to Hanoi, the empire answers to Paris alone."
 FRW_fortress_france_desc:0 "At Verdun in 1916 Pétain learned that firepower decides battles. He plans the defence of France accordingly. The veterans of 1914-1918 are gathered into one Legion and become the main support of the regime."
 FRW_imperial_guard_desc:0 "As under the First Empire, the best soldiers in France are picked for the Emperor's Guard."
 FRW_secure_crown_of_spain_desc:0 "Alfonso left Madrid in 1931 without abdicating. Paris asks Spain to take back its king, peacefully if it can."
 FRW_unite_the_crowns_desc:0 "Philip V had to renounce the French throne in 1713 so that the two crowns would never be joined. The Treaty of Utrecht is a dead letter now, and France and Spain become one kingdom."
 FRW_franc_stabilisation_fund_desc:0 "A fund of gold and foreign currency is set up to defend the franc on the markets, as London and Washington already do. Speculators will have to reckon with the Treasury as well as the Banque de France."
 FRW_franc_fiscal_reform_desc:0 "Parliament votes new taxes, cuts exemptions and for once passes the budget on time. The deficit shrinks, and so do the advances from the Banque de France."
 FRW_franc_safe_havens_desc:0 "Part of the reserves is quietly shipped to vaults in Dakar, Fort-de-France and Ottawa, out of reach of any invader."
 FRW_franc_colonial_gold_desc:0 "Geologists and engineers are sent to the gold fields of Guinea and the French Sudan. Output is small, but every ounce is mined inside the franc zone."
 FRW_franc_strong_franc_desc:0 "With a balanced budget and full vaults, the franc holds its value, and capital that fled to London and New York comes home. Credit becomes cheap, and the building sites reopen."
 FRW_franc_war_finance_desc:0 "The war will be paid for with taxes, loans and controls rather than with the printing press. Ministers remember what war debts did to the franc after 1918."
 FRW_artillery_barrage_desc:0 "Fire planned in detail and tied closely to the infantry remains the basis of French tactics."
 FRW_pilot_schools_desc:0 "New flying schools at Istres and Salon-de-Provence train several hundred pilots a year, while Pierre Cot's Aviation Populaire teaches young men to fly at local clubs."
 FRW_franco_polish_pact_desc:0 "The alliance of 1921 is renewed and given new military clauses. A German move eastwards would mean war on two fronts."
 FRW_deuxieme_bureau_desc:0 "Military intelligence receives more staff and money. Since 1931 Captain Bertrand has passed Enigma papers bought from a German informer to the Polish cipher bureau."
 FRW_rhineland_response_desc:0 "In March 1936 Hitler gambled that France would not move, and won. The next breach of the treaties will be answered with troops as well as protests."
 FRW_great_power_status_desc:0 "With the army rearmed and the eastern alliances restored, no European question is settled without the Quai d'Orsay."
 FRW_national_cohesion_desc:0 "Since the riots of 6 February 1934 right and left have been at each other's throats."
 FRW_brethren_of_the_coast_desc:0 "In the taverns of Saint-Malo, Brest and Toulon the captain's men sign the old articles of the Brethren: a share of every prize, a vote on every captain, a pension for every wound. Volunteers queue at the naval recruiting offices."
 FRW_new_tortuga_desc:0 "Saint-Malo is declared a free port without customs or inspections. Any cargo in Europe that needs to slip past a blockade can come through the captain's harbour, for a fee."
 FRW_jolly_roger_desc:0 "The black flag flies from the mainmast of the flagship. The fleet fights as the corsairs of Saint-Malo did, choosing its prey and keeping the prize."
 FRW_letters_of_marque_desc:0 "The corsairs of Saint-Malo always fought for profit as well as glory. Every defeated enemy and every protected nation will pay into the captain's war chest, and every island that commands a sea lane is a prize worth taking."
 FRW_isles_spanish_main_desc:0 "Tortuga, Port Royal, Nassau: the Caribbean was the kingdom of the Brethren of the Coast. The captain sends his ships back to the old hunting grounds of Jamaica, the Bahamas, Trinidad, Curaçao and the islands in between."
 FRW_isles_republic_desc:0 "From the Balearics to the Seychelles, the captain's islands are governed as one free federation of ports. They pay no taxes to Paris and send ships and sailors instead."
 FRW_iberian_ambitions_desc:0 "Beyond the Pyrenees Spain is sliding towards civil war. Control of the peninsula would give the captain the western entrance to the Mediterranean and the finest harbours of the Atlantic."
 FRW_army_of_africa_marches_desc:0 "Rearmed by the Americans after Tunisia, the Armée d'Afrique is needed in Italy and Provence."
 FRW_ff_second_armoured_desc:0 "Leclerc's veterans of the desert are re-equipped in Morocco with American Shermans and half-tracks."
 FRW_ff_maquis_desc:0 "Young men fleeing forced labour in Germany take to the hills of the Vercors, the Limousin and the Alps, where the Resistance arms and drills them."
 FRW_ff_cfln_desc:0 "In Algiers in June 1943 de Gaulle's Free French and Giraud's Army of Africa come together under a single committee, and their troops are merged into one army."
 FRW_ff_consultative_assembly_desc:0 "Delegates of the Resistance, the parties and the old parliament meet in Algiers in November 1943. It is the first assembly to speak for France since 1940, though its members are appointed, not elected."
 FRW_ff_epuration_desc:0 "Special courts in every département try those accused of collaboration."
 FRW_ff_votes_for_women_desc:0 "By the ordinance of Algiers of April 1944, French women receive the right to vote and to stand for office."
 FRW_ff_eurafrican_assembly_desc:0 "Deputies from Dakar, Algiers, Brazzaville and Paris sit together in one assembly for the first time."
 FRW_qol_research_council_desc:0 "A council of scientists is attached to the Prime Minister's office, on the lines of the under-secretariat for research that Irène Joliot-Curie held in 1936."
 FRW_qol_modern_state_desc:0 "After years of reform a decree reaches the prefectures in weeks rather than months."
 FRW_latin_destiny_desc:0 "France, Italy and Spain share the inheritance of Rome. Between them they hold most of the coasts of the western Mediterranean, from Gibraltar to Sicily."
 FRW_rome_accords_desc:0 "In January 1935 Laval and Mussolini settled their quarrels in Africa. France ceded a strip of desert to Libya, and Italy agreed to give up the special status of its settlers in Tunisia. La Rocque means to hold Rome to the bargain."
 FRW_stresa_front_desc:0 "At Stresa in April 1935 France, Britain and Italy stood together to keep Austria free. La Rocque wants that front restored, with Rome as France's first ally."
 FRW_latin_naval_pact_desc:0 "Toulon and La Spezia share their plans. The French fleet guards the western Mediterranean, the Italian fleet the central basin and the Sicilian narrows."
 FRW_latin_union_desc:0 "La Rocque has no wish to conquer his Latin neighbours. He offers Rome and Madrid a customs union and a common defence from Lisbon to Trieste, with Paris at its head."
 frw.20.d:0 "Paris proposes a union of the two nations, with joint ministries of defence and economy, a common citizenship and a single war cabinet."
 frw.72.d:0 "Our demands have been met, and French troops are crossing the new frontier without a shot being fired."
 frw.81.d:0 "He arrived at the Gare de Lyon with a single suitcase and a Polish officer's sabre. Malo Kervadec was born in Geneva, the son of a Breton sea captain from Saint-Malo and a Polish exile from Kraków, and grew up between the quays of Lake Geneva and his mother's stories of a country that no longer appeared on any map. In 1917 he joined General Haller's Blue Army in France, and in 1920 he was on the Vistula when the Red Army was turned back before Warsaw.\n\nIn the years since, he has worked for the private banks of Zurich and Geneva, moving their gold across an uneasy Europe. He now brings that gold to Paris, convinced that Poland can survive only if France is strong."
 frw.95.d:0 "From the Channel to Gibraltar a new flag hangs over the ministries, bearing the lilies of France and the ermine of Saint-Malo. France and the Iberian peninsula have been proclaimed one state, the Kingdom of Francia. The captain from Saint-Malo has told his officers that this is only the beginning."
 FRW_leader_corsair_desc:0 "Malo Kervadec was born in Geneva, the son of a Breton sea captain from Saint-Malo and a Polish exile. He fought in Haller's Blue Army, ran gold for the private banks of Zurich and, the rumours say, sailed under the black flag off the coasts of Africa. He governs France as a corsair captain governs his ship, by written articles and a share of the plunder for every man."
 FRW_burgundy_cat_desc:0 "In the fifteenth century the Valois Dukes of Burgundy held lands from Dijon to Amsterdam, among the richest in Europe. France is now in a position to reunite them."
 FRW_leader_admiral_king_desc:0 "Aymeric Kervadec was born in Geneva in 1894 and grew up aboard his father's ships, sailing between the Swiss banks and the harbours of Tangier and Danzig. In 1920 he was among the first officers of the new Polish Navy and learnt his trade in the cold waters off Gdynia. He later commanded the fleet that carried his father's armies to Lisbon and Leith. Crowned in Reims as Aymeric I, he is known to the people as «le Roi-Amiral». Unlike his father he prefers treaties to raids, and he wants a dynasty that will outlast him. He has never lost a battle at sea."
 FRW_econ_dirigiste_3_desc:0 "The economy is planned in full, from the price of coal to the output of each factory."
 FRW_econ_liberal_3_desc:0 "Credit is cheap and the order books of French firms are full."
 FRW_colonial_integration_cat_desc:0 "Holding territory in Africa does not by itself make it French. These decisions put the African lands France owns under a proper colonial administration, which yields more soldiers and more resources from each state. Only §YAlgeria§!, French since 1848, becomes a §Gcore§!; with the focus §YAlgeria Is France§! the overseas départements follow. The decisions can be used again whenever France gains more land in a region."
 FRW_latin_empire_idea_desc:0 "Mare Nostrum. The Latin navies control the Mediterranean."
 FRW_liberation_cat_desc:0 "Once the Free French hold the main regions of their country, they can offer the occupier a peace on the present front line, or fight on for the rest."
 frw.130.d:0 "With the heartland of France back under the tricolour, the enemy's envoys arrive at our headquarters. They propose an armistice on the present front line. Our generals believe the rest of the country could be taken too, at a price."
 FRW_legitimist_crown_desc:0 "The senior Bourbons reign in France for the first time since 1830."
 frw.143.d:0 "Madrid has recognised our king as King of Spain and placed the country under French protection."
 FRW_dec_stable_government_desc:0 "The ministries carry out cabinet decrees without delay.\n\nAvailable from §Y1938§!, at least §Y6 months§! after the last step, with §Y50%§! stability: removes §YA Stabilising Government§!."
 FRW_council_cat_desc:0 "Ministers, experts and party men offer their services. Choose a department to see who is available. Some reforms cannot be carried out without the right man in the government.\n\nMinisters appointed here can be dismissed again at the top of this list."
 FRW_adv_monnet_desc:0 "Jean Monnet has spent his life persuading governments to pool what they cannot manage alone, from Allied shipping in 1917 to loans for Poland and China. He believes the nations of Europe will one day have to share their coal and steel, and with them part of their sovereignty."
 FRW_dec_appoint_monnet_desc:0 "Jean Monnet has spent his life persuading governments to pool what they cannot manage alone, from Allied shipping in 1917 to loans for Poland and China. He believes the nations of Europe will one day have to share their coal and steel, and with them part of their sovereignty."
 FRW_adv_dautry_desc:0 "Raoul Dautry made his name rebuilding the shattered lines of northern France and modernising the State Railways. He has little patience for committees and prefers to set a target and leave his engineers to meet it."
 FRW_dec_appoint_dautry_desc:0 "Raoul Dautry made his name rebuilding the shattered lines of northern France and modernising the State Railways. He has little patience for committees and prefers to set a target and leave his engineers to meet it."
 FRW_adv_cot_desc:0 "Pierre Cot first became Air Minister in 1933, at thirty-seven, and helped make the Armée de l'Air an independent service. He wants the aircraft factories nationalised and a generation of young pilots trained in popular flying clubs."
 FRW_dec_appoint_cot_desc:0 "Pierre Cot first became Air Minister in 1933, at thirty-seven, and helped make the Armée de l'Air an independent service. He wants the aircraft factories nationalised and a generation of young pilots trained in popular flying clubs."
 FRW_adv_mandel_desc:0 "Georges Mandel learned politics at the side of Clemenceau and kept his master's ruthlessness. As Minister of the Colonies he plans to raise an army of half a million men overseas. France, he likes to say, is a nation of 110 million."
 FRW_dec_appoint_mandel_desc:0 "Georges Mandel learned politics at the side of Clemenceau and kept his master's ruthlessness. As Minister of the Colonies he plans to raise an army of half a million men overseas. France, he likes to say, is a nation of 110 million."
 FRW_adv_marty_desc:0 "André Marty led the mutiny of the French fleet in the Black Sea in 1919 and has never stopped being a revolutionary. Moscow trusts him; his volunteers fear him. Under his command the International Brigades will be organised and held to a hard discipline."
 FRW_dec_appoint_marty_desc:0 "André Marty led the mutiny of the French fleet in the Black Sea in 1919 and has never stopped being a revolutionary. Moscow trusts him; his volunteers fear him. Under his command the International Brigades will be organised and held to a hard discipline."
 FRW_adv_marion_desc:0 "Paul Marion learned the methods of the Comintern from the inside before turning against it. He knows how a party wins the street and the press, and he means to put that knowledge at Jacques Doriot's service."
 FRW_dec_appoint_marion_desc:0 "Paul Marion learned the methods of the Comintern from the inside before turning against it. He knows how a party wins the street and the press, and he means to put that knowledge at Jacques Doriot's service."
 FRW_adv_sauvy_desc:0 "Alfred Sauvy has the numbers no minister wants to hear: deaths in France exceed births, and forty-one million French face nearly seventy million Germans. He calls for family allowances and a proper census of the nation's manpower."
 FRW_dec_appoint_sauvy_desc:0 "Alfred Sauvy has the numbers no minister wants to hear: deaths in France exceed births, and forty-one million French face nearly seventy million Germans. He calls for family allowances and a proper census of the nation's manpower."
 FRW_adv_perrin_desc:0 "Jean Perrin won the Nobel Prize for proving the reality of atoms. As under-secretary for research he founds a national service to pay scientists to do science full-time, which will grow into the CNRS."
 FRW_dec_appoint_perrin_desc:0 "Jean Perrin won the Nobel Prize for proving the reality of atoms. As under-secretary for research he founds a national service to pay scientists to do science full-time, which will grow into the CNRS."
 FRW_adv_fperrin_desc:0 "Francis Perrin has worked out how much uranium a self-sustaining chain reaction would need. Together with the Joliot-Curie laboratory he could open the way to a new source of energy, or to a new weapon."
 FRW_dec_appoint_fperrin_desc:0 "Francis Perrin has worked out how much uranium a self-sustaining chain reaction would need. Together with the Joliot-Curie laboratory he could open the way to a new source of energy, or to a new weapon."
 FRW_adv_frenay_desc:0 "Henri Frenay has studied Germany for years at the Centre of Germanic Studies. He has begun to sketch an underground army of small cells, to be raised if the enemy ever occupies France."
 FRW_dec_appoint_frenay_desc:0 "Henri Frenay has studied Germany for years at the Centre of Germanic Studies. He has begun to sketch an underground army of small cells, to be raised if the enemy ever occupies France."
 FRW_adv_alibert_desc:0 "Raphaël Alibert has spent years drafting constitutions for a France without a parliament. A monarchist and admirer of Maurras, he has the legal arguments ready to replace the Third Republic with an authoritarian state."
 FRW_dec_appoint_alibert_desc:0 "Raphaël Alibert has spent years drafting constitutions for a France without a parliament. A monarchist and admirer of Maurras, he has the legal arguments ready to replace the Third Republic with an authoritarian state."
 FRW_adv_spinasse_desc:0 "Charles Spinasse wants to plan the French economy as a whole, with public works and the forty-hour week as his first instruments. Where private capital hesitates, he expects the state to invest."
 FRW_dec_appoint_spinasse_desc:0 "Charles Spinasse wants to plan the French economy as a whole, with public works and the forty-hour week as his first instruments. Where private capital hesitates, he expects the state to invest."
 FRW_adv_coanda_desc:0 "Henri Coandă exhibited a jet-driven aircraft in Paris in 1910 and has studied the flow of air ever since. His ideas run years ahead of what French factories can build."
 FRW_dec_appoint_coanda_desc:0 "Henri Coandă exhibited a jet-driven aircraft in Paris in 1910 and has studied the flow of air ever since. His ideas run years ahead of what French factories can build."
 FRW_adv_dastier_desc:0 "Emmanuel d'Astier de La Vigerie left the navy for journalism and found his way to the left. He knows how to recruit people and how to keep a secret, and an underground movement needs both."
 FRW_dec_appoint_dastier_desc:0 "Emmanuel d'Astier de La Vigerie left the navy for journalism and found his way to the left. He knows how to recruit people and how to keep a secret, and an underground movement needs both."
 FRW_adv_gmonnet_desc:0 "Georges Monnet farms his own land in the Aisne and knows what the peasants fear. His National Wheat Office fixes the price of grain each year, so that farmers know what their harvest will fetch."
 FRW_dec_appoint_gmonnet_desc:0 "Georges Monnet farms his own land in the Aisne and knows what the peasants fear. His National Wheat Office fixes the price of grain each year, so that farmers know what their harvest will fetch."
 FRW_adv_altmayer_desc:0 "Robert Altmayer commands mounted troops but has seen what lorries and armoured cars can do. He presses for light mechanised divisions to take over the old cavalry tasks of reconnaissance and screening."
 FRW_dec_appoint_altmayer_desc:0 "Robert Altmayer commands mounted troops but has seen what lorries and armoured cars can do. He presses for light mechanised divisions to take over the old cavalry tasks of reconnaissance and screening."
 FRW_adv_flavigny_desc:0 "Jean Flavigny commanded the first Division Légère Mécanique, formed from the 4th Cavalry Division in 1933. He wants the tanks concentrated in armoured divisions of their own."
 FRW_dec_appoint_flavigny_desc:0 "Jean Flavigny commanded the first Division Légère Mécanique, formed from the 4th Cavalry Division in 1933. He wants the tanks concentrated in armoured divisions of their own."
 FRW_adv_durandviel_desc:0 "Georges Durand-Viel has led the naval staff since 1931 and pushed through the fast battleships Dunkerque and Strasbourg. Both were designed to run down the German Panzerschiffe of the Deutschland class."
 FRW_dec_appoint_durandviel_desc:0 "Georges Durand-Viel has led the naval staff since 1931 and pushed through the fast battleships Dunkerque and Strasbourg. Both were designed to run down the German Panzerschiffe of the Deutschland class."
 FRW_adv_grobert_desc:0 "Georges Robert has spent his career on the ships of the Atlantic squadrons. He drills his crews hard and holds gunnery practice at long range in all weathers."
 FRW_dec_appoint_grobert_desc:0 "Georges Robert has spent his career on the ships of the Atlantic squadrons. He drills his crews hard and holds gunnery practice at long range in all weathers."
 FRW_adv_mendigal_desc:0 "Jean Mendigal flew fighters over the Western Front and trains the fighter groups of the Armée de l'Air. He wants his pilots in the air every day, whatever it costs in fuel."
 FRW_dec_appoint_mendigal_desc:0 "Jean Mendigal flew fighters over the Western Front and trains the fighter groups of the Armée de l'Air. He wants his pilots in the air every day, whatever it costs in fuel."
 FRW_frontier_cat_desc:0 "The Maginot Line covers only part of France. These works close the remaining gaps in the north, in the Alps, on the Pyrenees and overseas. Each project takes a few weeks to finish."
 FRW_patrie_cat_desc:0 "The enemy stands on French soil. Each of these emergency measures can only be taken once, so choose the moment well."
 FRW_leader_deat_fascist_desc:0 "Marcel Déat has broken with parliamentary democracy. His Rassemblement National Populaire wants a single party, a corporatist Labour Front and a socialist and national Europe."
 frw_sp.1.d:0 "Three months on, the factories are still occupied. A delegation of revolutionary syndicalists arrives at the ministry with a copy of the Charter of Amiens of 1906, one sentence underlined: the union, today a body of resistance, will tomorrow be the body of production and distribution.\n\nTheir spokesman, a railwayman named Pierre Besnard, is blunt. «The workers do not need a new master in the Hôtel de Ville, red or otherwise. They need their unions. Leave the factories to those who work in them, and France will run itself.»\n\n§GA new decision is available: Win Over Pierre Besnard.§!"
 FRW_black_flag_3_desc:0 "The black flag flies from the mainmast of the flagship. The captain's fleet gives no quarter and takes its pay in prizes."
 FRW_free_port_desc:0 "Saint-Malo is a free port. No customs officer boards, but every ship pays a fee."
 FRW_war_finance_desc:0 "War loans, taxes and price controls finance the war."
 FRW_dec_invite_trotsky_desc:0 "Trotsky lived in France until 1935, when the Republic expelled him to please Moscow. A workers' France could bring back the man who built the Red Army, though Stalin would not forgive it."
 FRW_dec_franc_rates_desc:0 "The Banque de France raises its rate. Money becomes dear and prices settle; so does work on the building sites."
 FRW_dec_franc_austerity_desc:0 "Decree-laws cut the salaries of civil servants and the pensions of veterans. The budget is balanced, to general discontent."
 FRW_dec_franc_cfa_desc:0 "The colonies get their own franc, tied to the franc of Paris. Part of the pressure on the currency is shifted onto Africa."
 FRW_dec_franc_print_desc:0 "The printing presses of the Banque de France run day and night. The factories are paid at once; inflation will present the bill later."
 FRW_dec_exped_eq_desc:0 "Free French troops land with Allied support and try to take the region. Sometimes their appearance off the coast is enough.\n\nChance of success: §Y[?FRW_ffe_eq|0]%§!"
 FRW_dec_exped_aof_desc:0 "Free French troops land with Allied support and try to take the region. Sometimes their appearance off the coast is enough.\n\nChance of success: §Y[?FRW_ffe_aof|0]%§!"
 FRW_dec_exped_afn_desc:0 "Free French troops land with Allied support and try to take the region. Sometimes their appearance off the coast is enough.\n\nChance of success: §Y[?FRW_ffe_afn|0]%§!"
 FRW_dec_exped_lev_desc:0 "Free French troops land with Allied support and try to take the region. Sometimes their appearance off the coast is enough.\n\nChance of success: §Y[?FRW_ffe_lev|0]%§!"
 FRW_dec_exped_mad_desc:0 "Free French troops land with Allied support and try to take the region. Sometimes their appearance off the coast is enough.\n\nChance of success: §Y[?FRW_ffe_mad|0]%§!"
 FRW_dec_exped_dji_desc:0 "Free French troops land with Allied support and try to take the region. Sometimes their appearance off the coast is enough.\n\nChance of success: §Y[?FRW_ffe_dji|0]%§!"
 FRW_dec_exped_ind_desc:0 "Free French troops land with Allied support and try to take the region. Sometimes their appearance off the coast is enough.\n\nChance of success: §Y[?FRW_ffe_ind|0]%§!"
 FRW_ralliement_cat_desc:0 "The colonies were handed to Vichy, but they can be won back one region at a time: by an §Yenvoy§! (cheap, depends on prestige) or by an §Yexpedition§! (costs men and rifles, +25% chance, another +10% while Britain fights on).\n\nFree French Prestige: §Y[?FRW_ff_prestige|0]§! of 100\n\nThe chance of success rises with prestige (half of it counts), with every earlier failure in the same region (§G+10%§! each, up to three) and with some focuses. A success gives §G+5§! prestige, a failure §R-5§!. Prestige grows by itself every month while France fights on, faster when a major ally is still in the war."
 frw_sys.31.d:0 "The batteries of Dakar open fire on the Free French ships. Vichy keeps West Africa for the time being. Next time our envoys will be better prepared."
 frw_sys.22.d:0 "Algiers, Oran, Casablanca and Tunis have rallied. The Army of Africa, a hundred thousand men, returns to the war."
 frw_sys.62.d:0 "Free French columns, supported by Allied ships and aircraft, have reached the capital of the region. Algiers, Oran, Casablanca and Tunis have rallied. The Army of Africa, a hundred thousand men, returns to the war."
 frw_sys.36.d:0 "Admiral Decoux keeps Indochina for Vichy, under the eyes of the Japanese garrison. Next time our envoys will be better prepared."
 frw_sys.51.d:0 "The Allied governments deal with the Free French committee as the government of France. Ambassadors who once called at Vichy go to Carlton Gardens instead."
 frw_sys.10.d:0 "The armistice gave the fleet to Vichy. In Mers-el-Kébir, Toulon and Alexandria the ships lie at anchor, their crews unsure whom to obey. London will not let them fall into German hands, and Free France must decide what to tell the crews."
 FRW_ff_chequers_spirit_desc:0 "Britain pays, arms and supplies the Free French, and recognises de Gaulle as their leader."
 FRW_ff_national_committee_spirit_desc:0 "The French National Committee governs from London."
 FRW_ff_cnr_spirit_desc:0 "The Conseil National de la Résistance unites the movements."
 FRW_ff_fafl_spirit_desc:0 "French pilots fly again under the Cross of Lorraine."
 FRW_ff_normandie_spirit_desc:0 "French pilots fly Yaks with the Red Air Force."
 FRW_ff_securite_sociale_spirit_desc:0 "Every wage earner is insured. It is costly, and very popular."
 FRW_ff_colonial_recruitment_spirit_desc:0 "Tirailleurs from Africa fill the army of liberation."
 FRW_return_cat_desc:0 "Allied troops hold parts of French Africa. Ask them to hand the territory back to France, either politely or with an offer they will find hard to refuse.\n\nFree French Prestige: §Y[?FRW_ff_prestige|0]§!"
 frw_ret.11.d:0 "Our allies will not hand back the French territories in Africa for the time being."
 frw.63.d:0 "In Aachen Cathedral, where Charlemagne is buried, France has proclaimed the restoration of the Frankish Empire. The lands between the Pyrenees and the Rhine are united once again."
