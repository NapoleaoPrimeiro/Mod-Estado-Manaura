 frw_sys.23.t:0 "Le Levant se rallie à la France libre"
 frw_sys.23.d:0 "Après une campagne courte et acharnée, l'armée du Levant a déposé les armes. Nombre de ses soldats ont choisi de rejoindre les Forces françaises libres."
 frw_sys.23.a:0 "Vive la France libre !"
 frw_sys.33.t:0 "Le Levant reste fidèle à Vichy"
 frw_sys.33.d:0 "Le général Dentz rejette toutes les offres. À Damas, des officiers de la France libre sont jugés pour trahison. La prochaine fois, nos émissaires seront mieux préparés."
 frw_sys.33.a:0 "Nous essaierons de nouveau."
