 FRW_adv_dautry_effects_tt:0 "§YRaoul Dautry§! entre au gouvernement en tant que §YMinistre de l'Armement§! (conseiller politique) :\nVitesse de construction des usines militaires : §G+10%§!\nEfficacité de changement de ligne de production : §G+10%§!\nVitesse de construction : §G+3%§!\nStabilité : §R-2%§!"
 FRW_adv_dautry_req:0 "§YRaoul Dautry§! est conseiller politique"
 FRW_adv_cot:0 "Pierre Cot"
 FRW_adv_cot_desc:0 "Pierre Cot est devenu ministre de l'Air pour la première fois en 1933, à trente-sept ans, et a contribué à faire de l'Armée de l'air une arme indépendante. Il veut nationaliser les usines aéronautiques et former une génération de jeunes pilotes dans les aéroclubs populaires."
 FRW_trait_cot:0 "Champion de l'aviation"
 FRW_trait_cot_desc:0 "Le jeune radical qui a fait de l'Armée de l'air une arme indépendante et nationalisé l'industrie aéronautique."
 FRW_dec_appoint_cot:0 "Nommer Pierre Cot"
 FRW_dec_appoint_cot_desc:0 "Pierre Cot est devenu ministre de l'Air pour la première fois en 1933, à trente-sept ans, et a contribué à faire de l'Armée de l'air une arme indépendante. Il veut nationaliser les usines aéronautiques et former une génération de jeunes pilotes dans les aéroclubs populaires."
