 FRW_gold_p400_tt:0 "Réserves d'or : §G+400 t§!"
 FRW_inf_tt_m35:0 "Inflation : §G-35§!"
 frw_sys.3.t:0 "Hyperinflation"
 frw_sys.3.d:0 "On transporte les billets dans des paniers, et les prix changent deux fois par jour. Le franc est au bord de l'effondrement. Les experts du ministère des Finances proposent une réforme monétaire radicale : un nouveau franc, cent anciens pour un nouveau."
 frw_sys.3.a:0 "Introduire le nouveau franc."
 frw_sys.3.b:0 "Pas maintenant. Laissons passer l'orage."
 frw_sys.4.t:0 "L'or est perdu"
 frw_sys.4.d:0 "L'or de la Banque de France n'a pas été évacué à temps. Il est désormais aux mains de l'occupant, et la France libre doit s'en passer."
 frw_sys.4.a:0 "Nous aurions dû l'envoyer à Dakar."
 frw_sys.50.t:0 "Les Alliés reconnaissent la France libre"
 frw_sys.50.d:0 "Londres et Washington traitent désormais la France libre en véritable alliée. Des armes, des crédits et des capacités industrielles en Grande-Bretagne sont mis à notre disposition."
 frw_sys.50.a:0 "La France retrouve sa place à la table."
 frw_sys.51.t:0 "La France combattante"
 frw_sys.51.d:0 "Les gouvernements alliés traitent le comité de la France libre comme le gouvernement de la France. Les ambassadeurs qui se rendaient autrefois à Vichy vont désormais à Carlton Gardens."
 frw_sys.51.a:0 "Vive la France combattante !"
 frw_sys.5.t:0 "Les coffres se vident"
 frw_sys.5.d:0 "Le gouverneur de la Banque de France apporte de mauvaises nouvelles : il reste moins de cinq cents tonnes d'or dans les coffres. Sans or, le franc ne repose plus sur rien, et tous les spéculateurs d'Europe le savent."
 frw_sys.5.a:0 "Fermer les frontières aux capitaux."
 frw_sys.5.b:0 "Demander un prêt en or à Londres."
 frw_sys.5.c:0 "Nous nous débrouillerons."
 frw_sys.1.t:0 "Le franc s'effondre"
 frw_sys.1.d:0 "Les prix à Paris ont doublé en un an. Les ménagères font la queue pour le pain, les syndicats réclament des hausses de salaires et les journaux évoquent 1926. Le ministre des Finances demande des mesures d'urgence."
 frw_sys.1.a:0 "Avaler la potion amère."
 frw_sys.1.b:0 "La nation le supportera : la France a d'autres soucis."
 frw_sys.2.t:0 "Le gouvernement en exil"
 frw_sys.2.d:0 "La France est tombée, mais le gouvernement poursuit le combat. La branche France libre de l'arbre des priorités nationales est désormais ouverte, et le menu de décisions §YFrance libre§! vous permet de reconquérir les colonies livrées à Vichy."
 frw_sys.2.a:0 "La flamme de la résistance française ne doit pas s'éteindre."
 frw_sys.10.t:0 "La flotte à Mers el-Kébir"
 frw_sys.10.d:0 "L'armistice a livré la flotte à Vichy. À Mers el-Kébir, Toulon et Alexandrie, les navires sont au mouillage et leurs équipages ne savent à qui obéir. Londres ne les laissera pas tomber aux mains des Allemands, et la France libre doit décider de ce qu'elle dira aux équipages."
 frw_sys.10.a:0 "Appeler les marins à nous rejoindre."
 frw_sys.10.a.tt:0 "Chances (§Y20 %§! + 40 % du prestige) : une partie de la flotte de Vichy (§Yenviron un tiers§!) appareille pour rejoindre la France libre, §G+5§! de prestige. Sinon, §R-5§! de prestige."
 frw_sys.10.b:0 "Laisser la Royal Navy régler la question."
 frw_sys.10.b.tt:0 "La Royal Navy attaque la flotte de Vichy : Vichy perd §Yun cuirassé, un croiseur de bataille et trois destroyers§!."
 frw_sys.10.c:0 "Jamais des navires français ne tireront sur des navires français."
 frw_sys.11.t:0 "Les marins nous rejoignent"
 frw_sys.11.d:0 "Plusieurs navires ont quitté le port de nuit et font route vers les ports de la France libre, leurs équipages acclamant sur le pont."
 frw_sys.11.a:0 "Bienvenue à bord."
 frw_sys.12.t:0 "La flotte reste fidèle à Vichy"
 frw_sys.12.d:0 "L'amiral Darlan fait consigner les équipages à bord. Pas un seul navire n'a répondu à notre appel."
 frw_sys.12.a:0 "Un coup dur."
 frw_sys.40.t:0 "Un gouverneur a fait défection"
 frw_sys.40.d:0 "L'un de nos gouverneurs coloniaux est passé aux dissidents de Londres. Son territoire arbore désormais la croix de Lorraine."
 frw_sys.40.a:0 "Traîtres !"
 FRW_hook_devalue_the_franc_0_tt:0 "Inflation : §G-10§!"
 FRW_hook_reform_banque_de_france_0_tt:0 "Désormais, l'inflation baisse de §G0.5§! point supplémentaire par mois."
 FRW_hook_war_economy_0_tt:0 "Inflation : §R+5§!"
 FRW_hook_appeal_of_18_june_0_tt:0 "Le prestige de la France libre commence à §Y20§! sur 100 et les décisions §YFrance libre§! s'ouvrent. Supprime §YDéfaitisme§!."
