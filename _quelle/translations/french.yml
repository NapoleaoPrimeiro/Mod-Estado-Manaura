 FRW_ralliement_cat:0 "France libre"
 FRW_exped_eq_tt:0 "Dispose d'au moins §Y1 500§! équipements d'infanterie en stock"
 FRW_dec_exped_tt:0 "Mobilise §Y15 000§! hommes de main-d'œuvre et §Y1 500§! équipements d'infanterie. Au bout de §Y45 jours§!, l'expédition rend compte : en cas de succès, la région rejoint la France libre (§G+5§! de prestige, expérience de l'armée) ; en cas d'échec, §R-8§! de prestige."
 FRW_dec_ff_agents:0 "Parachuter des agents en France"
 FRW_dec_ff_agents_desc:0 "Des opérateurs radio et des organisateurs du BCRA sont parachutés de nuit au-dessus de la France occupée."
 FRW_dec_ff_agents_tt:0 "Chaque État français occupé en Europe : résistance §G+5§!."
 FRW_dec_ff_sabotage:0 "Saboter les chemins de fer"
 FRW_dec_ff_sabotage_desc:0 "Les cheminots de Résistance-Fer font sauter les aiguillages, déraillent les trains et ralentissent chaque convoi allemand."
 FRW_dec_ff_sabotage_tt:0 "Chaque État français occupé en Europe : résistance §G+10§!, infrastructures endommagées."
 FRW_dec_ff_gold:0 "Dépenser l'or de la Banque de France"
 FRW_dec_ff_gold_desc:0 "L'or évacué de France avant l'armistice paie les armes et les ateliers à l'étranger.\n\nOr restant : §Y[?FRW_gold|0] t§!"
 FRW_gold_m400_tt:0 "Réserves d'or : §R-400 t§!"
 FRW_ralliement_cat_desc:0 "Les colonies ont été livrées à Vichy, mais elles peuvent être reconquises une région après l'autre : par un §Yémissaire§! (peu coûteux, dépend du prestige) ou par une §Yexpédition§! (coûte des hommes et des fusils, +25 % de chances, +10 % supplémentaires tant que la Grande-Bretagne poursuit la lutte).\n\nPrestige de la France libre : §Y[?FRW_ff_prestige|0]§! sur 100\n\nLes chances de succès augmentent avec le prestige (qui compte pour moitié), avec chaque échec antérieur dans la même région (§G+10 %§! chacun, jusqu'à trois) et avec certaines priorités nationales. Un succès rapporte §G+5§! de prestige, un échec §R-5§!. Le prestige augmente de lui-même chaque mois tant que la France poursuit le combat, plus vite lorsqu'un allié majeur est encore en guerre."
 FRW_dec_rally_tt:0 "Au bout de §Y21 jours§!, l'émissaire rend compte : en cas de succès, chaque État de la région tenu par §YVichy§! rejoint la France libre, avec ses soldats et leurs fusils."
 FRW_ffp_tt_m10:0 "Prestige de la France libre : §R-10§!"
 FRW_ffp_tt_p5:0 "Prestige de la France libre : §G+5§!"
 frw_sys.20.t:0 "L'Afrique-Équatoriale française se rallie à la France libre"
 frw_sys.20.d:0 "Le gouverneur Félix Éboué s'est déclaré pour la France libre à Fort-Lamy. En quelques jours, le Cameroun, le Moyen-Congo et le Gabon suivent. Brazzaville devient la première capitale de la France libre."
 frw_sys.20.a:0 "Vive la France libre !"
 frw_sys.30.t:0 "L'Afrique-Équatoriale française reste fidèle à Vichy"
 frw_sys.30.d:0 "Les officiers du Gabon restent fidèles à Vichy, et l'émissaire est mis sur le prochain bateau pour Lagos. La prochaine fois, nos émissaires seront mieux préparés."
 frw_sys.30.a:0 "Nous essaierons de nouveau."
 frw_sys.60.t:0 "Nos troupes débarquent en Afrique-Équatoriale française"
 frw_sys.60.d:0 "Les colonnes de la France libre, appuyées par des navires et des avions alliés, ont atteint la capitale de la région. Le gouverneur Félix Éboué s'est déclaré pour la France libre à Fort-Lamy. En quelques jours, le Cameroun, le Moyen-Congo et le Gabon suivent. Brazzaville devient la première capitale de la France libre."
 frw_sys.60.a:0 "La croix de Lorraine flotte de nouveau."
 frw_sys.70.t:0 "L'expédition en Afrique-Équatoriale française a échoué"
 frw_sys.70.d:0 "Notre débarquement s'est heurté à la résistance acharnée de la garnison de Vichy et a dû être annulé. Des hommes et du matériel ont été perdus, et la propagande de Vichy exulte."
 frw_sys.70.a:0 "Nous reviendrons."
 frw_sys.21.t:0 "L'Afrique-Occidentale française se rallie à la France libre"
 frw_sys.21.d:0 "À Dakar, le gouverneur général a changé de camp. Le grand port, le cuirassé dans son bassin et les tirailleurs sénégalais servent désormais la France libre."
 frw_sys.21.a:0 "Vive la France libre !"
 frw_sys.31.t:0 "L'Afrique-Occidentale française reste fidèle à Vichy"
 frw_sys.31.d:0 "Les batteries de Dakar ouvrent le feu sur les navires de la France libre. Vichy garde l'Afrique-Occidentale pour le moment. La prochaine fois, nos émissaires seront mieux préparés."
 frw_sys.31.a:0 "Nous essaierons de nouveau."
