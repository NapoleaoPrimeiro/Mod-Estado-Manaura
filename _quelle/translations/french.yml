 FRW_gold_p200_tt:0 "Réserves d'or : §G+200 t§!"
 FRW_inf_tt_p4:0 "Inflation : §R+4§!"
 FRW_inf_tt_p15:0 "Inflation : §R+15§!"
 FRW_inf_tt_m10:0 "Inflation : §G-10§!"
 FRW_dec_franc_rates:0 "Relever le taux d'escompte"
 FRW_dec_franc_rates_desc:0 "La Banque de France relève son taux. L'argent devient cher et les prix se calment, tout comme l'activité des chantiers."
 FRW_dec_franc_bonds:0 "Émettre des bons de la Défense nationale"
 FRW_dec_franc_bonds_desc:0 "Les épargnants prêtent leurs francs à l'État au lieu de les dépenser. Des affiches patriotiques couvrent les murs de chaque bureau de poste."
 FRW_dec_franc_controls:0 "Contrôle des prix et des salaires"
 FRW_dec_franc_controls_desc:0 "Prix et salaires sont bloqués par décret. Les commerçants grognent, les syndicats grognent, mais le franc tient."
 FRW_dec_franc_gold:0 "Vendre l'or des réserves"
 FRW_dec_franc_gold_desc:0 "Une partie de l'or des coffres de la Banque de France est vendue à l'étranger pour racheter des francs."
 FRW_dec_franc_reserves:0 "Reconstituer les réserves d'or"
 FRW_dec_franc_reserves_desc:0 "La Banque de France achète de l'or sur le marché de Londres avec des francs fraîchement émis. Les coffres se remplissent de nouveau, mais la masse monétaire augmente."
 FRW_dec_franc_exchange:0 "Contrôle des changes"
 FRW_dec_franc_exchange_desc:0 "Les francs ne peuvent plus quitter le pays sans autorisation. La fuite des capitaux s'arrête à la frontière, et une bonne partie du commerce aussi."
 FRW_dec_franc_contracts:0 "Contrats d'armement à l'étranger"
 FRW_dec_franc_contracts_desc:0 "L'or achète ce que les usines françaises ne peuvent livrer à temps : moteurs d'avion américains, machines-outils et avions complets, payés comptant."
 FRW_dec_franc_austerity:0 "Un budget d'austérité"
 FRW_dec_franc_austerity_desc:0 "Des décrets-lois réduisent les traitements des fonctionnaires et les pensions des anciens combattants. Le budget est équilibré, au mécontentement général."
 FRW_dec_franc_cfa:0 "La zone franc coloniale"
 FRW_dec_franc_cfa_desc:0 "Les colonies reçoivent leur propre franc, rattaché au franc de Paris. Une partie de la pression sur la monnaie est reportée sur l'Afrique."
 FRW_dec_franc_print:0 "Faire tourner la planche à billets pour le réarmement"
 FRW_dec_franc_print_desc:0 "Les presses de la Banque de France tournent jour et nuit. Les usines sont payées immédiatement ; l'inflation présentera la facture plus tard."
 FRW_dec_franc_tripartite:0 "L'accord monétaire tripartite"
 FRW_dec_franc_tripartite_desc:0 "Londres et Washington s'engagent à maintenir, avec Paris, la stabilité du franc dévalué. C'est la fin du bloc-or."
 FRW_franc_cat:0 "Le franc"
 FRW_franc_cat_desc:0 "Inflation : §Y[?FRW_inflation|0]%§! (§Y[?FRW_inf_trend|2]§! points par mois). Réserves d'or de la Banque de France : §Y[?FRW_gold|0] t§! ([?FRW_gold_trend|+0] t par mois).\n\nEn dessous de 20 %, un franc sain accélère la construction. Au-dessus de 20 %, l'inflation augmente le coût des biens de consommation, réduit la stabilité et ralentit la construction. À 100 % : biens de consommation §R+12%§!, stabilité §R-12%§!, vitesse de construction §R-8%§!.\nCouverture-or : au-dessus de §Y2000 t§!, elle stabilise le franc ; en dessous de §Y1000 t§!, elle l'affaiblit ; en dessous de §Y400 t§!, les coffres sont vides.\n\n§YInflation par mois§!\n- La Banque de France tient bon : §G-0.5§![FRW_inf_line_1][FRW_inf_line_2][FRW_inf_line_3][FRW_inf_line_4][FRW_inf_line_5][FRW_inf_line_6][FRW_inf_line_7][FRW_inf_line_8][FRW_inf_line_9][FRW_inf_line_10][FRW_inf_line_11][FRW_inf_line_12][FRW_inf_line_13][FRW_inf_line_14][FRW_inf_line_15][FRW_inf_line_16][FRW_inf_line_17][FRW_inf_line_18]\n\n§YOr par mois§![FRW_gold_line_0][FRW_gold_line_1][FRW_gold_line_2][FRW_gold_line_3][FRW_gold_line_4][FRW_gold_line_5][FRW_gold_line_6][FRW_gold_line_7][FRW_gold_line_8][FRW_gold_line_9][FRW_gold_line_10][FRW_gold_line_11]"
 FRW_liberation_prestige_tt:0 "Pour chaque région française d'Europe libérée de l'ennemi : prestige de la France libre §G+2§!."
 FRW_exchange_controls_tt:0 "La fuite des capitaux (Front populaire, révolution, instabilité politique) ne grève plus les réserves d'or."
 FRW_contracts_tt:0 "Pendant un an : §G+3§! usines militaires à l'étranger (production délocalisée)."
 FRW_cfa_drift_tt:0 "Désormais, l'inflation baisse de §G0.25§! point supplémentaire par mois et les colonies envoient §G+5 t§! d'or par mois."
 FRW_tripartite_drift_tt:0 "Désormais, l'inflation baisse de §G0.25§! point supplémentaire par mois et §G+5 t§! d'or par mois reviennent à Paris."
 FRW_tight_money_desc:0 "Le crédit est cher. Moins de projets sont lancés, mais le franc est en sécurité."
 FRW_austerity_desc:0 "Les coupes budgétaires ont calmé les marchés, mais fonctionnaires, anciens combattants et bâtisseurs en ressentent tous les effets."
 FRW_price_riots_desc:0 "La foule prend d'assaut les marchés et les boulangeries. Le franc perd de sa valeur chaque semaine."
 FRW_new_franc_desc:0 "Une réforme monétaire a anéanti l'épargne du jour au lendemain. Le franc est de nouveau sain, mais la confiance dans l'État ne l'est pas."
 FRW_fighting_france_desc:0 "Le monde allié tout entier reconnaît désormais la France combattante comme la vraie France."
 FRW_exchange_controls_idea_desc:0 "Chaque franc qui quitte le pays exige une autorisation. L'or reste en France, mais importateurs et banquiers se plaignent."
 FRW_foreign_contracts_desc:0 "Des usines américaines travaillent sur des commandes françaises, payées en or."
 FRW_gold_loan_desc:0 "Londres nous a prêté de l'or. Les intérêts doivent être payés chaque mois."
 FRW_printing_press_desc:0 "L'argent frais afflue dans les usines. L'inflation suivra."
 FRW_franc:0 "Le franc"
 FRW_franc_desc:0 "Inflation : §Y[?FRW_inflation|0]%§!. Gérez-la dans le menu des décisions §YLe franc§!."
 FRW_ff_prestige_mod:0 "Prestige de la France libre"
 FRW_ff_prestige_mod_desc:0 "Prestige de la France libre : §Y[?FRW_ff_prestige|0]§! sur 100. Plus il est élevé, plus les gouverneurs sont disposés à se rallier."
 FRW_dec_rally_eq:0 "Émissaire en Afrique-Équatoriale française"
 FRW_dec_rally_eq_desc:0 "Un émissaire de la France libre tente de rallier le gouverneur et la garnison.\n\nChances de succès : §Y[?FRW_ffc_eq|0]%§!"
 FRW_dec_exped_eq:0 "Expédition en Afrique-Équatoriale française"
 FRW_dec_exped_eq_desc:0 "Les troupes de la France libre débarquent avec l'appui des Alliés et tentent de prendre la région. Parfois, leur apparition au large des côtes suffit.\n\nChances de succès : §Y[?FRW_ffe_eq|0]%§!"
 FRW_dec_rally_aof:0 "Émissaire en Afrique-Occidentale française"
 FRW_dec_rally_aof_desc:0 "Un émissaire de la France libre tente de rallier le gouverneur et la garnison.\n\nChances de succès : §Y[?FRW_ffc_aof|0]%§!"
 FRW_dec_exped_aof:0 "Expédition en Afrique-Occidentale française"
