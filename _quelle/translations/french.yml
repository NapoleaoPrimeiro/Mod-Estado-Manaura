 frw_sys.25.t:0 "La Côte française des Somalis se rallie à la France libre"
 frw_sys.25.d:0 "Isolée et affamée par le blocus britannique, Djibouti s'est ralliée à la France libre."
 frw_sys.25.a:0 "Vive la France libre !"
 frw_sys.35.t:0 "La Côte française des Somalis reste fidèle à Vichy"
 frw_sys.35.d:0 "La petite garnison de Djibouti refuse de se rallier et le blocus se poursuit. La prochaine fois, nos émissaires seront mieux préparés."
 frw_sys.35.a:0 "Nous essaierons de nouveau."
