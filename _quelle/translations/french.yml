l_french:
 FRW_crisis_of_the_republic:0 "La crise de la IIIe République"
 FRW_crisis_of_the_republic_desc:0 "L'émeute du 6 février 1934 a fait quinze morts place de la Concorde et renversé le cabinet Daladier. Deux ans plus tard, les partis ne s'accordent toujours pas sur la voie que doit suivre le pays."
 FRW_defend_the_republic:0 "Défendre la République"
 FRW_defend_the_republic_desc:0 "La IIIe République a traversé quatre années de guerre, de 1914 à 1918. Ses défenseurs affirment qu'elle saura aussi résister aux ligues et à la crise."
 FRW_social_truce:0 "La trêve sociale"
 FRW_social_truce_desc:0 "En juin 1936, deux millions d'ouvriers occupent leurs usines. Les dirigeants syndicaux et le patronat sont convoqués à l'hôtel Matignon, et personne n'en sortira sans un accord."
 FRW_social_truce_tt:0 "Protège la France du §Rsoulèvement communiste§! qu'une faible stabilité déclencherait sinon.\nMet fin à §YLa vague de grèves§!.\nDisponible à partir de §Yjuin 1936§!."
 FRW_end_disjointed_government:0 "En finir avec la valse des cabinets"
 FRW_end_disjointed_government_desc:0 "La France a connu plus d'une douzaine de cabinets depuis 1930, et rares sont ceux qui ont duré plus d'un an. Les ministres ont à peine le temps de connaître leurs dossiers qu'ils sont déjà renversés."
 FRW_end_disjointed_government_tt:0 "§YGouvernement désuni§! devient §YUn gouvernement fragile§!. Deux décisions (à partir de 1937 et de 1938, espacées d'au moins 6 mois) le suppriment entièrement – ou §YUne nouvelle constitution§! y met fin immédiatement."
 FRW_front_populaire:0 "Le Front populaire"
 FRW_front_populaire_desc:0 "Au lendemain des élections de mai 1936, Léon Blum forme un gouvernement de socialistes et de radicaux, soutenu par les communistes à la Chambre et voué aux réformes sociales."
 FRW_front_populaire_tt:0 "Nécessite le soutien de §YLéon Blum§! (décision §YRallier Léon Blum§!, 45 jours)."
 FRW_union_nationale:0 "L'Union nationale"
 FRW_union_nationale_desc:0 "Paul Reynaud rassemble le centre droit autour d'un programme d'équilibre budgétaire et de réarmement."
 FRW_union_nationale_tt:0 "Nécessite le soutien de §YPaul Reynaud§! (décision §YRallier Paul Reynaud§!, 45 jours)."
 FRW_matignon_reforms:0 "Les accords Matignon"
 FRW_matignon_reforms_desc:0 "Les accords Matignon de juin 1936 accordent des hausses de salaires et instaurent les conventions collectives. Les usines occupées se vident et le travail reprend."
 FRW_nationalize_arms_industry:0 "Nationaliser l'industrie d'armement"
 FRW_nationalize_arms_industry_desc:0 "En vertu de la loi d'août 1936, l'État prend le contrôle des principales usines d'armement, et la production de guerre passe aux mains de la puissance publique."
 FRW_conges_payes:0 "Les congés payés"
 FRW_conges_payes_desc:0 "Chaque travailleur a désormais droit à deux semaines de congés payés par an. Cet été-là, les trains vers la côte sont bondés de familles qui n'ont jamais vu la mer."
 FRW_republican_volunteers:0 "Des volontaires pour la République"
 FRW_republican_volunteers_desc:0 "Des volontaires français franchissent les Pyrénées pour combattre aux côtés de la République espagnole et en reviennent avec une dure expérience de la guerre moderne."
 FRW_plan_de_relance:0 "Le plan de relance"
 FRW_plan_de_relance_desc:0 "Le gouvernement lance un vaste programme de grands travaux et d'investissements pour sortir la France de la crise."
 FRW_reynaud_rearmament:0 "Le réarmement de Reynaud"
 FRW_reynaud_rearmament_desc:0 "Pendant des années, Reynaud a mis la Chambre en garde contre le réarmement allemand. Au pouvoir, il peut agir selon ce qu'il disait dans l'opposition."
 FRW_decree_laws:0 "Gouverner par décrets-lois"
 FRW_decree_laws_desc:0 "Fort des pleins pouvoirs, le gouvernement peut prendre des mesures sans attendre un Parlement divisé."
 FRW_armee_de_metier:0 "Vers l'armée de métier"
 FRW_armee_de_metier_desc:0 "Dans « Vers l'armée de métier » (1934), le lieutenant-colonel de Gaulle réclamait une armée de métier articulée autour de divisions blindées. Reynaud reprit l'idée à la Chambre l'année suivante. La France se dote d'une armée plus réduite de professionnels engagés à long terme."
 FRW_gaullist_presidency:0 "Une république présidentielle"
 FRW_gaullist_presidency_desc:0 "Charles de Gaulle devient chef de l'État, avec des pouvoirs bien supérieurs à ceux de tout président sous la constitution de 1875."
 FRW_republican_mobilization:0 "La République en armes"
 FRW_republican_mobilization_desc:0 "Dans tout le pays, les réservistes sont rappelés et les usines se consacrent aux besoins de la défense nationale."
 FRW_entente_cordiale:0 "Renouveler l'Entente cordiale"
 FRW_entente_cordiale_desc:0 "L'Entente de 1904 a tenu pendant quatre années sur le front occidental. Paris propose d'en faire une alliance permanente avec Londres."
 FRW_entente_cordiale_tt:0 "La France et le §YRoyaume-Uni§! rejoignent une même faction (si le Royaume-Uni est démocratique) :\n- Si le Royaume-Uni dirige une faction, la France la rejoint.\n- Sinon, la France fonde l'§YEntente§! et le Royaume-Uni la rejoint.\nUn Royaume-Uni joué par un humain décide par événement."
 FRW_union_francaise:0 "L'Union française"
 FRW_union_francaise_desc:0 "Paris propose de transformer l'empire colonial en une union de peuples associés, toujours placée sous la direction de la France."
 FRW_union_francaise_tt:0 "Fonde l'§YUnion française§! : nouveau nom et nouveau drapeau, esprit national et §Gterritoires nationaux sur l'Algérie et les départements d'outre-mer§! (Antilles, Guyane, La Réunion) que possède la France (y compris plus tard) et §Yrevendications§! sur les autres.\nRemplace toute nation formée auparavant par la France (son esprit de formation est retiré). Si la France est déjà le §YRoyaume éternel de Francia§!, elle le reste."
 FRW_little_entente_guarantees:0 "Associer la Petite Entente"
 FRW_little_entente_guarantees_desc:0 "La Tchécoslovaquie, la Yougoslavie et la Roumanie comptent déjà sur les garanties françaises. Le Quai d'Orsay les invite désormais à conclure une alliance en bonne et due forme."
 FRW_franco_british_union:0 "Union franco-britannique"
 FRW_franco_british_union_desc:0 "Jean Monnet comme Winston Churchill ont évoqué l'union des deux nations sous un même gouvernement. Paris soumet désormais l'offre à Londres."
 FRW_franco_british_union_tt:0 "Propose l'§YUnion franco-britannique§! à Londres (un Royaume-Uni dirigé par l'IA accepte toujours, un joueur humain décide) :\n- Les deux pays reçoivent §YUnion franco-britannique§!.\n- La France prend le nom et le drapeau de l'Union (cela remplace toute nation formée auparavant, sauf le §YRoyaume éternel de Francia§!). L'Union n'apporte aucun nouveau territoire national."
 FRW_colonial_assembly:0 "L'Assemblée coloniale"
 FRW_colonial_assembly_desc:0 "Des délégués des colonies siègent à Paris au sein d'une assemblée consultative."
 FRW_colonial_assembly_tt:0 "Tous les États hors territoire national : §G+10%§! de conformité."
 FRW_council_of_europe:0 "Le plan Briand"
 FRW_council_of_europe_desc:0 "En 1929, à Genève, Aristide Briand proposait une union européenne. Ses successeurs ressortent le projet des dossiers du Quai d'Orsay."
 FRW_council_of_europe_tt:0 "Fonde la §YCommunauté européenne§! (si la France n'appartient à aucune faction) et invite la §YBelgique§!, les §YPays-Bas§!, le §YLuxembourg§! et la §YSuisse§!.\nLa §YFédération européenne§! elle-même sera proclamée plus tard, lorsque la Communauté aura gagné en cohésion."
 FRW_rhine_guarantee:0 "Les gardiens du Rhin"
 FRW_rhine_guarantee_desc:0 "Deux fois en soixante-dix ans, les armées allemandes ont envahi la France. Le Rhin doit être tenu comme la frontière de sécurité du pays."
 FRW_rhine_guarantee_tt:0 "Si l'§YAllemagne§! est fasciste : but de guerre §Yrenverser le gouvernement§! contre l'Allemagne."
 FRW_arsenal_of_democracy:0 "Des armes pour les nations libres"
 FRW_arsenal_of_democracy_desc:0 "Les usines françaises produisent des armes pour toutes les démocraties d'Europe qui résistent encore."
 FRW_european_defence_community:0 "Un conseil de défense commun"
 FRW_european_defence_community_desc:0 "La France et ses partenaires mettent en commun leurs recherches en armement et élaborent des plans de défense communs."
 FRW_franco_belgian_customs:0 "Union douanière avec la Belgique"
 FRW_franco_belgian_customs_desc:0 "Une union douanière lie les économies de la Belgique et du Luxembourg à celle de la France."
 FRW_franco_belgian_customs_tt:0 "Fonde l'§YUnion occidentale§! : nouveau nom et nouveau drapeau, esprit national et §Gterritoires nationaux sur les terres de Belgique, des Pays-Bas et du Luxembourg§! que possède la France (y compris celles qu'elle y gagnera plus tard) et §Yrevendications§! sur les autres.\nRemplace toute nation formée auparavant par la France (son esprit de formation est retiré). Si la France est déjà le §YRoyaume éternel de Francia§!, elle le reste.\nNécessite le contrôle de la §YBelgique§!, des §YPays-Bas§! et du §YLuxembourg§! (annexés ou en tant qu'États fantoches, sauf indication contraire). Si la France ne les contrôle pas encore, la nation est fondée automatiquement dès qu'elle les contrôle."
 FRW_fourth_republic:0 "Une nouvelle constitution"
 FRW_fourth_republic_desc:0 "Les lois de 1875 n'étaient qu'une solution provisoire, qui a duré soixante ans. Une nouvelle constitution dote la France d'un exécutif plus fort et de cabinets plus durables."
 FRW_aid_spanish_republic:0 "Aider la République espagnole"
 FRW_aid_spanish_republic_desc:0 "En 1936, Blum voulait aider Madrid mais en fut empêché par Londres et par ses propres alliés radicaux. Cette fois, les avions prennent la route du sud."
 FRW_aid_spanish_republic_tt:0 "Envoie §Y2 000 fusils§! à la République espagnole et donne à la France un but de guerre §Yrenverser le gouvernement§! contre les nationalistes."
 FRW_european_customs_union:0 "L'union douanière européenne"
 FRW_european_customs_union_desc:0 "Le charbon, l'acier et les céréales franchissent désormais en franchise les frontières de la Communauté. Les planificateurs de Monnet n'y voient qu'un début."
 FRW_european_customs_union_tt:0 "Chaque membre de la faction de la France reçoit §YPartenaire européen§! (+5% de production des usines, +3% de vitesse de recherche).\nNécessite §YJean Monnet§! comme conseiller politique (décision §YNommer Jean Monnet§! au §YConseil des ministres§!, département §YÉconomie§!)."
 FRW_european_federation_focus:0 "La Fédération européenne"
 FRW_european_federation_focus_desc:0 "Les États membres sont invités à confier leurs armées et leurs monnaies à un gouvernement fédéral siégeant à Paris. La plupart acceptent."
 FRW_european_federation_focus_tt:0 "Chaque nation mineure démocratique d'Europe appartenant à la faction de la France ou placée sous garantie française est invitée à rejoindre la fédération (accepter signifie être annexée pacifiquement). L'offre peut être renouvelée avec la décision §YRenouveler l'offre fédérale§!.\nFonde la §YFédération européenne§! : nouveau nom et nouveau drapeau, esprit national et §Gterritoires nationaux sur les terres du Benelux, de Suisse, d'Italie, d'Allemagne et de Rhénanie§! que possède la France (y compris celles qu'elle y gagnera plus tard) et §Yrevendications§! sur les autres.\nRemplace toute nation formée auparavant par la France (son esprit de formation est retiré). Si la France est déjà le §YRoyaume éternel de Francia§!, elle le reste.\nNécessite le contrôle de la §YBelgique§!, des §YPays-Bas§! et du §YLuxembourg§! (annexés, en tant qu'États fantoches ou ralliés à la fédération) ; après cette priorité, l'§YItalie§! ou l'§YAllemagne§! ne sont plus nécessaires. Si la France ne les contrôle pas encore, la nation est fondée automatiquement dès qu'elle les contrôle."
 FRW_forty_hour_week:0 "La semaine de quarante heures"
 FRW_forty_hour_week_desc:0 "La loi de juin 1936 limite la semaine de travail à quarante heures. Les ouvriers l'accueillent favorablement, tandis que le patronat se plaint des coûts."
 FRW_pierre_cot_aviation:0 "L'Aviation populaire"
 FRW_pierre_cot_aviation_desc:0 "Le ministre de l'Air Pierre Cot nationalise les usines aéronautiques et ouvre les aéro-clubs aux fils d'ouvriers."
 FRW_jean_zay_reforms:0 "Les réformes de Jean Zay"
 FRW_jean_zay_reforms_desc:0 "Le ministre de l'Éducation nationale Jean Zay prolonge la scolarité obligatoire et fonde le service de la recherche qui deviendra le CNRS."
 FRW_relax_forty_hours:0 "Priorité aux arsenaux"
 FRW_relax_forty_hours_desc:0 "La semaine de quarante heures reste inscrite dans la loi, mais les usines d'armement en sont exemptées et peuvent faire des heures supplémentaires."
 FRW_bread_peace_liberty:0 "Pain, paix, liberté"
 FRW_bread_peace_liberty_desc:0 "« Le pain, la paix, la liberté » était le mot d'ordre électoral du Front populaire en 1936. Le gouvernement en fait désormais son programme."
 FRW_reynaud_recovery:0 "Les décrets Reynaud"
 FRW_reynaud_recovery_desc:0 "Ministre des Finances, Reynaud assouplit la semaine de quarante heures, rétablit la confiance des investisseurs et fait revenir les capitaux en France."
 FRW_mandel_colonies:0 "Mandel au ministère des Colonies"
 FRW_mandel_colonies_desc:0 "Georges Mandel, ministre des Colonies, promet de lever une puissante armée coloniale pour défendre la métropole."
 FRW_mandel_colonies_tt:0 "Nécessite §YGeorges Mandel§! comme conseiller politique (décision §YNommer Georges Mandel§! au §YConseil des ministres§!, département §YPolitique§!)."
 FRW_edge_of_the_sword:0 "Le Fil de l'épée"
 FRW_edge_of_the_sword_desc:0 "La division blindée décrite par de Gaulle devient le modèle pour le reste de l'armée. « Le Fil de l'épée », l'essai sur le commandement publié par de Gaulle en 1932, est inscrit au programme de l'École de guerre."
 FRW_certaine_idee:0 "Une certaine idée de la France"
 FRW_certaine_idee_desc:0 "De Gaulle est depuis longtemps convaincu que la France n'est réellement elle-même qu'au premier rang des nations. Devenu président, il entreprend de bâtir une République sur cette conviction."
 FRW_deat_neosocialism:0 "Ordre, Autorité, Nation"
 FRW_deat_neosocialism_desc:0 "Au congrès socialiste de 1933, Adrien Marquet et Marcel Déat ont lancé au parti qu'il devait gagner les classes moyennes par « l'ordre, l'autorité, la nation ». Blum les a fait exclure. Les néo-socialistes offrent à la République un État fort et une économie planifiée."
 FRW_deat_neosocialism_tt:0 "Nécessite le soutien de §YMarcel Déat§! (décision §YRallier Marcel Déat§!, 45 jours)."
 FRW_deat_labour_plan:0 "Le Plan du travail"
 FRW_deat_labour_plan_desc:0 "En Belgique, Henri de Man a montré la voie : crédit, énergie et industrie lourde sous direction publique, tout le reste laissé aux mains du privé. Les planistes néo-socialistes en élaborent une version française."
 FRW_deat_national_credit:0 "Un Office national du crédit"
 FRW_deat_national_credit_desc:0 "La Banque de France et les grandes banques de dépôt sont placées sous la tutelle d'un Office national du crédit. Les « deux cents familles » perdent leur emprise sur le Trésor, et c'est l'État qui décide où va l'argent."
 FRW_deat_strong_state:0 "L'État fort"
 FRW_deat_strong_state_desc:0 "Les décrets-lois deviennent la règle. Le Parlement vote le budget et le Plan une fois par an, et l'exécutif gouverne dans l'intervalle. À gauche, les critiques de Déat estiment que son socialisme de l'ordre regarde davantage vers Rome que vers Jaurès."
 FRW_deat_die_for_danzig:0 "Mourir pour Dantzig ?"
 FRW_deat_die_for_danzig_desc:0 "« Faut-il mourir pour Dantzig ? » demande Déat dans le journal L'Œuvre. Les paysans français, écrit-il, n'iront pas à la guerre pour une ville libre de la Baltique. L'article divise le pays, et ses détracteurs y voient le premier pas sur la route de Berlin."
 FRW_deat_die_for_danzig_tt:0 "Les néo-socialistes doivent désormais choisir : rester dans la §YRépublique§! ou fonder le §YParti unique§!."
 FRW_deat_planist_republic:0 "La République planiste"
 FRW_deat_planist_republic_desc:0 "Déat reste dans le cadre de la République. Le Plan est inscrit dans la loi, la Chambre conserve son vote sur celui-ci, et un Conseil de l'économie réunit syndicats, patronat et ingénieurs autour d'une même table."
 FRW_deat_x_crise:0 "Les ingénieurs d'X-Crise"
 FRW_deat_x_crise_desc:0 "Les polytechniciens du cercle X-Crise, parmi lesquels Jean Coutrot, Louis Vallon et le jeune Alfred Sauvy, quittent leurs groupes d'études pour les ministères. Pour la première fois, la France est dirigée par des planificateurs."
 FRW_deat_republic_of_order:0 "La République de l'ordre"
 FRW_deat_republic_of_order_desc:0 "Pour la première fois depuis la guerre, un cabinet survit à son budget et le Plan atteint ses objectifs. Les partisans de Déat affirment qu'aucun parlement n'aurait pu en faire autant."
 FRW_deat_single_party:0 "Le Parti unique"
 FRW_deat_single_party_desc:0 "Socialistes, anciens combattants et hommes des ligues, affirme Déat, veulent tous la même chose : une révolution nationale et populaire. Il les appelle à rejoindre un seul parti, le Rassemblement national populaire, et à fermer définitivement la Chambre."
 FRW_deat_single_party_tt:0 "Nécessite au moins §Y15%§! de popularité pour le §Yfascisme§!."
 FRW_deat_labour_front:0 "Le Front du travail"
 FRW_deat_labour_front_desc:0 "Les syndicats et les organisations patronales sont fusionnés en un seul Front du travail. Grèves et lock-out sont également interdits ; le Plan fixe les salaires et les prix."
 FRW_deat_national_legion:0 "La Légion nationale populaire"
 FRW_deat_national_legion_desc:0 "Le RNP lève sa propre légion de volontaires. Elle défile avec la pelle comme avec le fusil, et ses recrues viennent des usines autant que des anciennes ligues."
 FRW_deat_new_europe:0 "L'Ordre nouveau européen"
 FRW_deat_new_europe_desc:0 "Déat rêve d'une Europe à la fois socialiste et nationale, de Brest à Bucarest, dont Paris serait la seconde capitale. Bruxelles, La Haye, Berne et Copenhague sont invitées à la rejoindre."
 FRW_deat_new_europe_tt:0 "Fonde l'§YOrdre européen nouveau§! (si la France n'appartient à aucune faction) et invite la §YBelgique§!, les §YPays-Bas§!, le §YLuxembourg§!, la §YSuisse§! et le §YDanemark§!."
 FRW_deat_continental_economy:0 "L'économie continentale"
 FRW_deat_continental_economy_desc:0 "Une union européenne de compensation, un plan commun pour le charbon et l'acier et un marché unique de l'Atlantique à la Vistule. Déat appelle cela le socialisme continental."
 FRW_deat_lvf:0 "La Légion des volontaires français"
 FRW_deat_lvf_desc:0 "Déat et ses rivaux des autres partis s'accordent au moins sur un point : des volontaires français doivent combattre le bolchevisme à l'étranger. La Légion recrute dans les permanences du RNP et part pour tous les fronts où se mène la croisade."
 FRW_deat_ministry_of_labour:0 "Le ministère du Travail"
 FRW_deat_ministry_of_labour_desc:0 "Déat prend pour lui-même le ministère du Travail. Bureaux de placement, apprentissage et barèmes de salaires relèvent désormais d'un seul bureau, rue de Grenelle."
 FRW_deat_revolutionary_front:0 "Le Front révolutionnaire national"
 FRW_deat_revolutionary_front_desc:0 "Les derniers mouvements rivaux sont absorbés dans un Front révolutionnaire national unique sous la direction de Déat. Anciens socialistes, syndicalistes et hommes des ligues partagent désormais la même carte d'adhérent."
 FRW_deat_european_revolution:0 "La révolution européenne"
 FRW_deat_european_revolution_desc:0 "Une Europe nationale et socialiste ne saurait s'arrêter à la frontière belge, écrit Déat. Bruxelles et La Haye sont invitées à se placer sous la protection de la France, en tant que premières provinces du nouveau continent."
 FRW_protect_austria:0 "Protéger l'indépendance de l'Autriche"
 FRW_protect_austria_desc:0 "L'Autriche se trouve exposée entre Berlin et Rome. Paris lui offre sa protection et attend en retour que Vienne suive la politique française."
 FRW_libyan_border:0 "Garantir le Benelux"
 FRW_libyan_border_desc:0 "Comme à Locarno en 1925, la France se porte garante de ses voisins. Paris considérera toute attaque contre Bruxelles, La Haye ou Luxembourg comme une attaque contre la France."
 FRW_workers_popular_front:0 "Le Front ouvrier"
 FRW_workers_popular_front_desc:0 "Le PCF rompt avec ses partenaires bourgeois du Front populaire et appelle les ouvriers à prendre eux-mêmes le pouvoir."
 FRW_truce_unity_of_action:0 "L'unité d'action"
 FRW_truce_unity_of_action_desc:0 "En 1934, le PCF et la SFIO ont signé un pacte pour cesser de s'attaquer mutuellement et marcher ensemble contre les ligues. Le Parti y tient désormais les ouvriers, sous sa propre bannière."
 FRW_truce_unity_of_action_tt:0 "Protège la France du §Rsoulèvement communiste§! qu'une faible stabilité déclencherait sinon.\nMet fin à §YLa vague de grèves§!.\nDisponible à partir de §Yjuin 1936§!."
 FRW_cgt_general_strike:0 "La grève générale de la CGT"
 FRW_cgt_general_strike_desc:0 "Des millions d'ouvriers cessent le travail à l'appel de la CGT et les usines se taisent. Le gouvernement pourrait ne pas tenir la semaine."
 FRW_proclaim_the_commune:0 "Proclamer la Commune"
 FRW_proclaim_the_commune_desc:0 "En 1871, Paris s'est soulevé seul et a été écrasé. Cette fois, la province se soulève avec la capitale."
 FRW_proclaim_the_commune_tt:0 "§YGouvernement désuni§! devient §YUn gouvernement fragile§!. Deux décisions (à partir de 1937 et de 1938, espacées d'au moins 6 mois) le suppriment entièrement."
 FRW_thorez_party_line:0 "Thorez prend le pouvoir"
 FRW_thorez_party_line_desc:0 "Sous Maurice Thorez, la France aligne étroitement sa politique sur celle de Moscou."
 FRW_thorez_party_line_tt:0 "Nécessite le soutien de §YMaurice Thorez§! (décision §YRallier Maurice Thorez§!, 45 jours)."
 FRW_pivert_revolution:0 "Tout est possible !"
 FRW_pivert_revolution_desc:0 "Marceau Pivert et la Gauche révolutionnaire appellent à une démocratie des conseils ouvriers, indépendante de Moscou."
 FRW_pivert_revolution_tt:0 "Nécessite le soutien de §YMarceau Pivert§! (décision §YRallier Marceau Pivert§!, 45 jours)."
 FRW_five_year_plan_fr:0 "Le plan quinquennal français"
 FRW_five_year_plan_fr_desc:0 "Sur le modèle du Gosplan soviétique, des commissaires fixent dans chaque département des quotas de charbon, d'acier et de céréales. Les usines Renault de Billancourt reçoivent désormais leurs ordres du plan et non plus du marché."
 FRW_soviet_military_mission:0 "Mission militaire soviétique"
 FRW_soviet_military_mission_desc:0 "Des officiers de l'Armée rouge arrivent à Paris pour enseigner aux états-majors français la théorie des opérations en profondeur."
 FRW_join_comintern:0 "Rejoindre le Komintern"
 FRW_join_comintern_desc:0 "Le Parti estime que la révolution ne peut triompher dans un seul pays. Paris rejoint Moscou et les mouvements ouvriers étrangers au sein de l'Internationale communiste."
 FRW_join_comintern_tt:0 "Demande à l'§YUnion soviétique§! de l'accueillir dans sa faction. Si les Soviétiques ne dirigent aucune faction, la France fonde le §YFront rouge§! et les invite."
 FRW_red_army_of_france:0 "L'Armée rouge de France"
 FRW_red_army_of_france_desc:0 "L'armée est réorganisée sur le modèle soviétique, avec des commissaires politiques affectés à ses unités."
 FRW_workers_councils:0 "Conseils ouvriers"
 FRW_workers_councils_desc:0 "Des conseils ouvriers élus prennent en main la gestion des usines."
 FRW_revolutionary_militias:0 "Milices révolutionnaires"
 FRW_revolutionary_militias_desc:0 "La Commune de 1871 a commencé lorsque le gouvernement de Versailles a tenté de s'emparer des canons de Montmartre. Cette fois, chaque usine et chaque quartier conserve une milice ouvrière armée."
 FRW_export_the_revolution:0 "Exporter la révolution"
 FRW_export_the_revolution_desc:0 "Les dirigeants du Parti affirment que la révolution ne saurait être confinée à la France."
 FRW_iberian_revolution:0 "La révolution ibérique"
 FRW_iberian_revolution_desc:0 "Les communistes et les syndicats espagnols demandent à Paris des armes contre les généraux."
 FRW_iberian_revolution_tt:0 "But de guerre §Yrenverser le gouvernement§! contre l'§YEspagne§! (sauf si l'Espagne est communiste ou alliée)."
 FRW_red_navy_of_toulon:0 "La Flotte et l'Aviation rouges"
 FRW_red_navy_of_toulon_desc:0 "La mutinerie de la mer Noire de 1919, menée notamment par André Marty, reste dans les mémoires de la flotte. Les marins de Toulon tiennent désormais les navires au nom du peuple. De jeunes ouvriers apprennent à piloter dans les aéroclubs du Parti."
 FRW_red_industry:0 "L'industrie rouge"
 FRW_red_industry_desc:0 "Le Creusot et les aciéries de Wendel passent à l'État. Les objectifs de production remplacent les dividendes."
 FRW_liberate_colonies:0 "Libérer les colonies"
 FRW_liberate_colonies_desc:0 "Une France socialiste ne peut garder des colonies par la force. Le Maroc et la Tunisie deviennent des républiques sœurs indépendantes."
 FRW_liberate_colonies_tt:0 "Le §YMaroc§! et la §YTunisie§! sont libérés en tant que satellites communistes (si la France les possède) et §YPeuples frères§! progresse d'un niveau."
 FRW_union_of_european_socialist_republics:0 "États socialistes unis d'Europe"
 FRW_union_of_european_socialist_republics_desc:0 "Le Parti vise une union socialiste de l'Europe, sans frontières ni capitalistes."
 FRW_union_of_european_socialist_republics_tt:0 "But de guerre §Yrenversement du gouvernement§! contre la §YBelgique§!, les §YPays-Bas§! et le §YLuxembourg§! (sauf s'ils sont déjà communistes, satellites ou alliés de la France).\nForme la §YFédération européenne§! : nouveau nom et nouveau drapeau, esprit national et §Gterritoires nationaux sur les terres du Benelux, de la Suisse, de l'Italie, de l'Allemagne et de la Rhénanie§! que possède la France (ainsi que sur celles qu'elle y gagnera plus tard) et §Yrevendications§! sur le reste.\nRemplace toute nation que la France a formée auparavant (son esprit de nation formable est retiré). Si la France est déjà le §YRoyaume éternel de Francia§!, elle le reste.\nNécessite le contrôle de la §YBelgique§!, des §YPays-Bas§! et du §YLuxembourg§!, ainsi que de l'§YItalie§! ou de l'§YAllemagne§! (annexés ou en tant qu'États fantoches, sauf indication contraire). Si la France ne les contrôle pas encore, la nation est fondée automatiquement dès qu'elle les contrôle."
 FRW_peoples_science:0 "La science au service du peuple"
 FRW_peoples_science_desc:0 "Frédéric Joliot-Curie et d'autres savants mettent leurs laboratoires au service de la révolution."
 FRW_internationale_victory:0 "La lutte finale"
 FRW_internationale_victory_desc:0 "L'Internationale retentit dans les rues tandis que l'Armée rouge française se met en marche."
 FRW_purge_deviationists:0 "Épurer les déviationnistes"
 FRW_purge_deviationists_desc:0 "Trotskistes, partisans de Pivert et autres « ennemis du Parti » sont exclus du PCF et de la CGT."
 FRW_fils_du_peuple:0 "Fils du peuple"
 FRW_fils_du_peuple_desc:0 "L'autobiographie de Thorez, « Fils du peuple », est imprimée à des millions d'exemplaires. Du haut des affiches, le fils de mineur du Pas-de-Calais veille sur chaque permanence du Parti."
 FRW_second_five_year_plan:0 "Le deuxième plan quinquennal"
 FRW_second_five_year_plan_desc:0 "Le deuxième plan place l'industrie lourde et l'électrification avant tout le reste."
 FRW_political_commissars:0 "Les commissaires politiques"
 FRW_political_commissars_desc:0 "Un commissaire est affecté à chaque régiment, et l'armée répond désormais au Parti."
 FRW_bastion_of_the_west:0 "Bastion de la révolution"
 FRW_bastion_of_the_west_desc:0 "Paris est la capitale du socialisme en Europe occidentale. Des délégations ouvrières de Londres, de Bruxelles et de Barcelone arrivent par chaque train."
 FRW_federation_of_communes:0 "Une fédération de communes"
 FRW_federation_of_communes_desc:0 "Les préfets sont supprimés et chaque commune s'administre par son conseil élu. Des cours du soir ouvrent dans les villes de toute la France. Les ouvriers qui ont pris les usines remplissent désormais les amphithéâtres."
 FRW_aid_the_poum:0 "Aider les camarades ibériques"
 FRW_aid_the_poum_desc:0 "Fusils, camions et volontaires franchissent les Pyrénées pour rejoindre le POUM et la gauche antistalinienne de Barcelone."
 FRW_workers_army:0 "Des milices à une armée ouvrière"
 FRW_workers_army_desc:0 "Les milices reçoivent des officiers, un entraînement régulier et des armes lourdes, tout en conservant leurs comités élus."
 FRW_republic_of_labour:0 "La République du travail"
 FRW_republic_of_labour_desc:0 "Les partisans de Pivert décrivent le nouvel État comme une libre association de producteurs, dirigée ni par les capitalistes ni par les bureaucrates."
 FRW_cgt_unions_take_power:0 "Tout le pouvoir aux syndicats"
 FRW_cgt_unions_take_power_desc:0 "En 1906, la CGT déclarait à Amiens que le syndicat, et non le parti, serait la cellule de la société future. Pierre Besnard et les syndicalistes révolutionnaires prennent aujourd'hui le mouvement au mot : le Parti peut siéger à l'Hôtel de Ville, mais ce sont les syndicats qui dirigeront la France."
 FRW_cgt_unions_take_power_tt:0 "Nécessite le soutien de §YPierre Besnard§! (décision §YRallier Pierre Besnard§!, 45 jours)."
 FRW_cgt_factory_committees:0 "Les comités d'usine"
 FRW_cgt_factory_committees_desc:0 "Dans chaque usine, un comité élu à l'atelier prend en main la direction. Ingénieurs et contremaîtres restent, mais ils rendent désormais des comptes aux hommes et aux femmes à l'établi."
 FRW_cgt_local_unions:0 "Les syndicats locaux gouvernent"
 FRW_cgt_local_unions_desc:0 "Les préfets sont renvoyés chez eux. Dans chaque ville, la section syndicale et ses délégués reprennent le travail de la mairie, du rationnement du pain aux tramways."
 FRW_cgt_bourses_du_travail:0 "Les Bourses du travail"
 FRW_cgt_bourses_du_travail_desc:0 "Fernand Pelloutier voulait faire des Bourses du travail les écoles de la classe ouvrière. Pour y parvenir, bibliothèques, cours du soir et cours techniques ouvrent dans chaque ville."
 FRW_cgt_confederal_congress:0 "Le congrès confédéral"
 FRW_cgt_confederal_congress_desc:0 "Les délégués de toutes les fédérations se réunissent à la Mutualité. Les décisions montent de l'usine au congrès au lieu de descendre d'un comité central. Les occupations d'usines prennent fin, puisque ce sont désormais les occupants qui les dirigent."
 FRW_cgt_confederal_congress_tt:0 "Met fin à la §Yvague de grèves§! et protège la France du §Rsoulèvement communiste§! que déclencherait sinon une faible stabilité."
 FRW_cgt_red_black_columns:0 "Les colonnes rouges et noires"
 FRW_cgt_red_black_columns_desc:0 "Les milices syndicales forment des colonnes sous le drapeau rouge et noir. Elles élisent leurs officiers et se battent avec acharnement, mais goûtent peu les ordres."
 FRW_cgt_iwa:0 "L'Association internationale des travailleurs"
 FRW_cgt_iwa_desc:0 "Besnard fut secrétaire de l'Association internationale des travailleurs, l'internationale syndicaliste. La France étant aux mains des syndicats, ses congrès se tiennent désormais à Paris."
 FRW_cgt_aid_the_cnt:0 "Aider la CNT"
 FRW_cgt_aid_the_cnt_desc:0 "Fusils et camions franchissent les Pyrénées pour la CNT et les colonnes anarchistes de Catalogne et d'Aragon."
 FRW_cgt_collectivise_land:0 "Collectiviser la terre"
 FRW_cgt_collectivise_land_desc:0 "Les ouvriers agricoles prennent possession des grands domaines de la Beauce et du Midi. Les petits exploitants peuvent rejoindre les collectivités ou garder leurs champs."
 FRW_cgt_workers_self_defence:0 "L'autodéfense ouvrière"
 FRW_cgt_workers_self_defence_desc:0 "Le congrès admet que la révolution a finalement besoin d'une armée, mais d'une armée qui défende les communes et n'ait pas d'état-major propre."
 FRW_cgt_iberian_federation:0 "La Fédération ibérique"
 FRW_cgt_iberian_federation_desc:0 "À Barcelone, la CNT parle d'une libre fédération des peuples ibériques. Paris promet d'aider à la faire advenir."
 FRW_cgt_iberian_federation_tt:0 "But de guerre §Yrenversement du gouvernement§! contre l'§YEspagne§! (sauf si l'Espagne est communiste ou alliée)."
 FRW_cgt_libertarian_commune:0 "La Commune libertaire"
 FRW_cgt_libertarian_commune_desc:0 "La France n'a plus ni patrons ni bureaucrates, seulement des fédérations de producteurs libres. Une telle société peut-elle mener une guerre moderne ? Le congrès préfère ne pas se poser la question."
 FRW_workers_belgium:0 "À bas Salazar"
 FRW_workers_belgium_desc:0 "À Lisbonne, l'Estado Novo de Salazar maintient le mouvement ouvrier sous la répression. L'Espagne étant aux mains des révolutionnaires, le Portugal se retrouvera isolé."
 FRW_smash_italian_fascism:0 "Écraser le fascisme italien"
 FRW_smash_italian_fascism_desc:0 "Mussolini gouverne l'Italie depuis 1922, plus longtemps que tout autre chef fasciste en Europe. Les exilés italiens en France affirment que les ouvriers restés au pays sont prêts à se soulever."
 FRW_red_switzerland:0 "Les Brigades internationales"
 FRW_red_switzerland_desc:0 "Des volontaires de nombreuses nations quittent la gare d'Austerlitz pour l'Espagne, Français aux côtés d'Allemands, de Polonais et d'Américains. Paris est devenu le bureau de recrutement de la révolution mondiale."
 FRW_red_switzerland_tt:0 "Nécessite §YAndré Marty§! comme conseiller politique (décision §YNommer André Marty§! au §YConseil des ministres§!, département §YPolitique§!)."
 FRW_national_renewal:0 "Le renouveau national"
 FRW_national_renewal_desc:0 "Les ligues défilent de nouveau en criant « À bas les voleurs ! » contre la République."
 FRW_truce_labour_charter:0 "L'ordre corporatif"
 FRW_truce_labour_charter_desc:0 "Grèves et lock-out sont interdits. Ouvriers et patrons de chaque métier siègent ensemble au sein d'une même corporation, et l'État tranche ce qu'ils ne peuvent régler."
 FRW_truce_labour_charter_tt:0 "Protège la France du §Rsoulèvement communiste§! que déclencherait sinon une faible stabilité.\nMet fin à la §Yvague de grèves§!.\nDevient disponible en §Yjuin 1936§!."
 FRW_february_sixth:0 "Prendre d'assaut le Palais Bourbon"
 FRW_february_sixth_desc:0 "Le 6 février 1934, les ligues furent arrêtées au pont de la Concorde. Cette fois, elles comptent bien le franchir."
 FRW_national_revolution:0 "La Révolution nationale"
 FRW_national_revolution_desc:0 "La République tombe et un gouvernement nationaliste autoritaire prend sa place."
 FRW_national_revolution_tt:0 "Le §YGouvernement désuni§! devient §YUn gouvernement fragile§!. Deux décisions (à partir de 1937 et de 1938, espacées d'au moins 6 mois) le suppriment entièrement."
 FRW_la_rocque_psf:0 "Travail, Famille, Patrie"
 FRW_la_rocque_psf_desc:0 "Le colonel de La Rocque et son Parti social français veulent un État national et catholique qui se garde des aventures étrangères."
 FRW_la_rocque_psf_tt:0 "Nécessite le soutien de §YFrançois de La Rocque§! (décision §YRallier François de La Rocque§!, 45 jours)."
 FRW_doriot_ppf:0 "Le Parti populaire français"
 FRW_doriot_ppf_desc:0 "Jacques Doriot, exclu du Parti communiste en 1934, dirige désormais le PPF et veut un État de masse totalitaire."
 FRW_doriot_ppf_tt:0 "Nécessite le soutien de §YJacques Doriot§! (décision §YRallier Jacques Doriot§!, 45 jours)."
 FRW_corporatist_state:0 "L'État corporatiste"
 FRW_corporatist_state_desc:0 "Patrons et ouvriers de chaque métier sont réunis en corporations sous la tutelle de l'État."
 FRW_latin_bloc:0 "Le Bloc latin"
 FRW_latin_bloc_desc:0 "La France, l'Espagne, le Portugal et l'Italie se rapprochent pour former un bloc de nations latines entre Berlin et Moscou."
 FRW_latin_bloc_tt:0 "Fonde la faction du §YBloc latin§! et invite l'§YItalie§!, l'§YEspagne§! et le §YPortugal§!.\nL'§YEmpire latin§! lui-même sera proclamé plus tard avec §YLa direction de l'Europe latine§!."
 FRW_colonial_legions:0 "Les légions coloniales"
 FRW_colonial_legions_desc:0 "Des recrues du Sénégal, de Madagascar et d'Indochine sont organisées en légions sous le commandement d'officiers français."
 FRW_restore_french_honour:0 "L'héritage savoyard"
 FRW_restore_french_honour_desc:0 "La Savoie et Nice sont françaises depuis le traité de Turin de 1860. Genève, longtemps revendiquée par les ducs de Savoie, est réclamée elle aussi. Le Piémont est laissé à Rome, partenaire de la France au sein du Bloc latin."
 FRW_totalitarian_party:0 "Le parti unique"
 FRW_totalitarian_party_desc:0 "Les Chambres, les ligues et les anciens partis sont dissous par décret. Le PPF devient le seul parti légal en France."
 FRW_totalitarian_party_tt:0 "Nécessite §YPaul Marion§! comme conseiller politique (décision §YNommer Paul Marion§! au §YConseil des ministres§!, département §YPolitique§!)."
 FRW_approach_germany:0 "Se rapprocher de Berlin"
 FRW_approach_germany_desc:0 "Doriot est convaincu que l'Europe sera dirigée par les puissances fascistes et veut la France à leurs côtés."
 FRW_greater_france_claims:0 "La Grande France"
 FRW_greater_france_claims_desc:0 "On parle français en Romandie et en Valais, et Mussolini convoite Nice, la Savoie et la Corse. Paris répond par sa propre carte : la Romandie, le Piémont et le val d'Aoste, ainsi que la Sardaigne, de l'autre côté du détroit qui la sépare de la Corse."
 FRW_march_on_brussels:0 "Ultimatum à Genève"
 FRW_march_on_brussels_desc:0 "Genève abrite la Société des Nations, des émigrés politiques et de l'or étranger hostile au régime. Doriot a envoyé son ultimatum une fois et n'entend pas en envoyer un second."
 FRW_march_on_brussels_tt:0 "But de guerre §Yannexion§! contre la §YSuisse§! (sauf si elle est alliée).\nDisponible à partir de §Yjanvier 1937§!."
 FRW_national_rearmament:0 "Le réarmement national"
 FRW_national_rearmament_desc:0 "Le gouvernement entreprend de refaire de l'armée française la plus puissante du continent."
 FRW_mediterranean_ambition:0 "Maîtresse de la Méditerranée"
 FRW_mediterranean_ambition_desc:0 "Toulon, Bizerte, Alger et Beyrouth donnent à la France des ports sur toutes les rives de la Méditerranée. Rome devra accepter la primauté française sur mer, en partenaire sous La Rocque ou en rivale vaincue sous Doriot."
 FRW_french_state_youth:0 "La Jeunesse nationale"
 FRW_french_state_youth_desc:0 "Les écoles et les mouvements de jeunesse passent sous le contrôle de l'État, qui leur apprend à servir la nation."
 FRW_french_imperium:0 "La mission impériale"
 FRW_french_imperium_desc:0 "De Dakar à Hanoï, l'Empire ne répond qu'à Paris."
 FRW_nouvel_ordre:0 "La direction de l'Europe latine"
 FRW_nouvel_ordre_desc:0 "Rome, Madrid et Lisbonne se tournent vers Paris pour être guidées. La France propose un bloc des nations latines placé sous sa direction."
 FRW_nouvel_ordre_tt:0 "But de guerre §Yvassalisation§! contre l'§YEspagne§! et le §YPortugal§! (sauf s'ils sont satellites ou alliés de la France).\nForme l'§YEmpire latin§! : nouveau nom et nouveau drapeau, esprit national et §Gterritoires nationaux sur les terres de l'Italie, de l'Espagne et du Portugal§! que possède la France (ainsi que sur celles qu'elle y gagnera plus tard) et §Yrevendications§! sur le reste.\nRemplace toute nation que la France a formée auparavant (son esprit de nation formable est retiré). Si la France est déjà le §YRoyaume éternel de Francia§!, elle le reste.\nNécessite le contrôle de l'§YItalie§!, de l'§YEspagne§! et du §YPortugal§! (annexés ou en tant qu'États fantoches, sauf indication contraire). Si la France ne les contrôle pas encore, la nation est fondée automatiquement dès qu'elle les contrôle."
 FRW_african_empire_fascist:0 "La question tunisienne"
 FRW_african_empire_fascist_desc:0 "En novembre 1938, des députés italiens criaient « Tunisi, Corsica, Nizza ! » à la Chambre, à Rome. La réponse de Paris est concrète : la ligne Mareth, dans le sud de la Tunisie, sera tenue."
 FRW_corporative_chambers:0 "Les chambres corporatives"
 FRW_corporative_chambers_desc:0 "Des chambres patronales et ouvrières reprennent le rôle du Sénat en matière de législation économique."
 FRW_volontaires_nationaux:0 "Les Volontaires nationaux"
 FRW_volontaires_nationaux_desc:0 "Les Volontaires nationaux, la branche jeunesse du PSF, sont formés pour constituer une réserve nationale disciplinée."
 FRW_volontaires_nationaux_tt:0 "Nécessite §YJean Ybarnégaray§! comme conseiller politique (décision §YNommer Jean Ybarnégaray§! au §YConseil des ministres§!, département §YPolitique§!)."
 FRW_social_catholicism:0 "Le catholicisme social"
 FRW_social_catholicism_desc:0 "La charité, les allocations familiales et les syndicats chrétiens sont le remède du PSF à la lutte des classes."
 FRW_friendship_with_lisbon:0 "Amitié avec Lisbonne et Madrid"
 FRW_friendship_with_lisbon_desc:0 "Salazar gouverne le Portugal depuis 1932 sans chercher la guerre. La Rocque cite l'Estado Novo comme la preuve que l'ordre et la paix peuvent aller de pair."
 FRW_french_social_state:0 "L'État social français"
 FRW_french_social_state_desc:0 "La Rocque promet une France fondée sur le travail, la famille et la foi catholique, gouvernée dans l'ordre et en paix avec elle-même."
 FRW_purge_the_reds:0 "Épurer les rouges"
 FRW_purge_the_reds_desc:0 "Doriot fut autrefois le maire communiste de Saint-Denis. Il connaît ses anciens camarades par leur nom et dispose désormais de la police pour les arrêter."
 FRW_purge_the_reds_tt:0 "Popularité communiste : §R-10%§!"
 FRW_anti_bolshevik_crusade:0 "La croisade antibolchevique"
 FRW_anti_bolshevik_crusade_desc:0 "Doriot appelle les nations d'Europe à s'unir contre Moscou."
 FRW_party_militia:0 "La milice du Parti"
 FRW_party_militia_desc:0 "Le service d'ordre du PPF est armé et devient la garde du régime."
 FRW_pact_with_berlin:0 "Le pacte avec Berlin"
 FRW_pact_with_berlin_desc:0 "Deux fois en soixante-dix ans, la France et l'Allemagne se sont fait la guerre. Paris demande désormais à rejoindre l'alliance allemande."
 FRW_pact_with_berlin_tt:0 "Demande à l'§YAllemagne§! de laisser la France rejoindre sa faction (si l'Allemagne est fasciste et en dirige une)."
 FRW_cult_of_the_chef:0 "Le culte du Chef"
 FRW_cult_of_the_chef_desc:0 "Le portrait de Doriot est accroché dans chaque mairie. Le Parti et l'État sont dirigés par le Chef seul."
 FRW_seize_libya:0 "S'emparer de la Libye"
 FRW_seize_libya_desc:0 "Tripoli et le Fezzan relieraient la Tunisie à l'Afrique-Occidentale et à l'Afrique-Équatoriale françaises. L'Italie doit être contrainte de les céder."
 FRW_swiss_protectorate:0 "Mare Nostrum"
 FRW_swiss_protectorate_desc:0 "Mussolini appelle la Méditerranée « mare nostrum ». Paris n'est pas de cet avis, et Toulon, Bizerte et Mers el-Kébir sont aménagés en bases pour une flotte capable de la contrôler."
 FRW_demand_spanish_morocco:0 "Exiger le Fezzan"
 FRW_demand_spanish_morocco_desc:0 "Par les accords Laval-Mussolini de janvier 1935, la France avait promis à l'Italie une bande du Sahara. Le nouveau gouvernement les répudie et exige à la place le Fezzan."
 FRW_above_the_parties:0 "Au-dessus des partis"
 FRW_above_the_parties_desc:0 "En France, beaucoup ont perdu confiance dans les communistes, les ligues fascistes et un Parlement entaché de scandales. Ils veulent une main ferme au sommet."
 FRW_truce_national_concord:0 "La trêve des partis"
 FRW_truce_national_concord_desc:0 "Après les émeutes de février 1934, Gaston Doumergue gouverna avec des ministres de tous les camps dans le cadre d'une trêve des partis. Il est temps d'en proclamer une nouvelle."
 FRW_truce_national_concord_tt:0 "Protège la France du §Rsoulèvement communiste§! que déclencherait sinon une faible stabilité.\nMet fin à la §Yvague de grèves§!.\nDevient disponible en §Yjuin 1936§!."
 FRW_suspend_the_chambers:0 "Ajourner les Chambres"
 FRW_suspend_the_chambers_desc:0 "Le président Lebrun refuse de nommer un énième cabinet. La Chambre des députés et le Sénat sont ajournés sine die."
 FRW_suspend_the_chambers_tt:0 "Le §YGouvernement désuni§! devient §YUn gouvernement fragile§!. Deux décisions (à partir de 1937 et de 1938, espacées d'au moins 6 mois) le suppriment entièrement.\nLes Chambres sont renvoyées. Nul ne sait ce qui viendra combler un tel silence..."
 FRW_secret_captain:0 "Le Capitaine de Saint-Malo"
 FRW_secret_captain_desc:0 "La lettre de Genève repose sur le bureau d'un ministère désert. Son auteur, un capitaine au long cours breton au sang polonais et à la fortune d'origine incertaine, demande seulement qu'on le fasse appeler. Il arrive avec une seule valise, un sabre d'officier polonais et un pavillon noir plié au fond de sa malle. Personne d'autre ne s'est proposé pour gouverner la France."
 FRW_secret_captain_tt:0 "§YMalo Kervadec§! devient le dirigeant de la France.\nLa France et la §YPologne§! se rapprochent.\nUne voie cachée s'ouvre : les §YFrères de la Côte§!, les §YÎles§! et l'§YIbérie§!."
 FRW_etat_francais:0 "L'État français"
 FRW_etat_francais_desc:0 "Le maréchal Pétain, vainqueur de Verdun en 1916, prend le pouvoir comme chef de l'État."
 FRW_etat_francais_tt:0 "Nécessite le soutien du §Ymaréchal Pétain§! (décision §YRallier le maréchal Pétain§!, 45 jours)."
 FRW_return_to_the_land:0 "Le retour à la terre"
 FRW_return_to_the_land_desc:0 "« La terre, elle, ne ment pas. » Le régime compte sur la paysannerie pour régénérer la France."
 FRW_fortress_france:0 "La forteresse France"
 FRW_fortress_france_desc:0 "À Verdun, en 1916, Pétain a appris que le feu décide des batailles. Il organise la défense de la France en conséquence. Les anciens combattants de 1914-1918 sont rassemblés en une seule Légion, qui devient le principal soutien du régime."
 FRW_corporation_paysanne:0 "La Corporation paysanne"
 FRW_corporation_paysanne_desc:0 "Une corporation paysanne nationale est créée pour organiser l'agriculture et assurer le ravitaillement."
 FRW_weygand_staff:0 "L'état-major du général Weygand"
 FRW_weygand_staff_desc:0 "Le général Weygand révise la doctrine défensive de l'armée et modernise son équipement."
 FRW_armee_d_afrique:0 "L'Armée d'Afrique"
 FRW_armee_d_afrique_desc:0 "Les divisions de l'Armée d'Afrique en Algérie, au Maroc et en Tunisie deviennent la réserve stratégique de l'Empire."
 FRW_armed_neutrality:0 "La neutralité armée"
 FRW_armed_neutrality_desc:0 "La France déclare qu'elle ne prendra part à aucune guerre étrangère. Toute attaque contre son territoire sera repoussée par la force."
 FRW_redoubt_of_the_empire:0 "Le réduit de l'Empire"
 FRW_redoubt_of_the_empire_desc:0 "Des plans sont établis pour poursuivre la guerre depuis Alger si la métropole venait à être envahie."
 FRW_charte_du_travail:0 "La Charte du travail"
 FRW_charte_du_travail_desc:0 "Grèves et lock-out sont interdits. Des comités mixtes de patrons et d'ouvriers règlent les différends dans chaque métier."
 FRW_charte_du_travail_tt:0 "Nécessite §YJean Bichelonne§! comme conseiller politique (décision §YNommer Jean Bichelonne§! au §YConseil des ministres§!, département §YÉconomie§!)."
 FRW_chantiers_de_jeunesse:0 "Les Chantiers de la jeunesse"
 FRW_chantiers_de_jeunesse_desc:0 "Chaque jeune homme de vingt ans passe huit mois dans les chantiers, à abattre du bois et à apprendre l'exercice."
 FRW_cult_of_the_marshal:0 "Maréchal, nous voilà !"
 FRW_cult_of_the_marshal_desc:0 "Les écoliers apprennent à chanter « Maréchal, nous voilà ». Dans bien des mairies, son portrait est désormais accroché à la place du buste de Marianne."
 FRW_darlan_admiralty:0 "Darlan à l'Amirauté"
 FRW_darlan_admiralty_desc:0 "L'amiral Darlan garde la flotte intacte. Pour une France neutre, c'est le meilleur atout dans les négociations."
 FRW_unconquerable_france:0 "La France invincible"
 FRW_unconquerable_france_desc:0 "Les défenses s'étendent de la ligne Maginot aux cols de l'Atlas. Un envahisseur paierait chèrement chaque mètre."
 FRW_order_in_the_rif:0 "L'ordre dans le Rif"
 FRW_order_in_the_rif_desc:0 "En 1925, Pétain prit le commandement contre Abd el-Krim et mit fin à la guerre du Rif. L'Espagne n'a jamais tenu fermement la région, et la France propose désormais de s'en charger."
 FRW_latin_neutral_bloc:0 "Le Bloc latin neutre"
 FRW_latin_neutral_bloc_desc:0 "Franco, Salazar et le Conseil fédéral suisse partagent l'objectif du Maréchal : rester à l'écart de la prochaine guerre. En agissant ensemble, ils pourraient y parvenir."
 FRW_latin_neutral_bloc_tt:0 "Fonde le §YBloc latin neutre§! (si la France n'appartient à aucune faction) et, si la France dirige sa faction, invite l'§YEspagne§!, le §YPortugal§! et la §YSuisse§!."
 FRW_empire_stands_guard:0 "L'Empire monte la garde"
 FRW_empire_stands_guard_desc:0 "Weygand inspecte les garnisons de Dakar à Beyrouth. L'armée coloniale reçoit l'ordre de se tenir prête à une attaque de l'un ou l'autre camp."
 FRW_marshals_peace:0 "La paix du Maréchal"
 FRW_marshals_peace_desc:0 "Tandis que les grandes puissances s'épuisent mutuellement, la France se reconstruit derrière ses frontières. Le Maréchal a promis qu'aucun Français ne mourra pour Dantzig ni pour Moscou."
 FRW_orleanist_restoration:0 "La restauration orléaniste"
 FRW_orleanist_restoration_desc:0 "Henri d'Orléans, comte de Paris, rentre d'exil et est proclamé roi sous le nom d'Henri VI."
 FRW_orleanist_restoration_tt:0 "Nécessite le soutien du §Ycomte de Paris§! (décision §YRallier le comte de Paris§!, 45 jours)."
 FRW_charter_of_1830:0 "Renouveler la Charte"
 FRW_charter_of_1830_desc:0 "Une nouvelle constitution, sur le modèle de la Charte de 1830, lie la couronne aux classes possédantes."
 FRW_royal_diplomacy:0 "Diplomatie royale"
 FRW_royal_diplomacy_desc:0 "La maison d'Orléans est apparentée par alliance à nombre des familles régnantes d'Europe."
 FRW_action_francaise_ministers:0 "Des ministres de l'Action française"
 FRW_action_francaise_ministers_desc:0 "Pour la première fois, des membres de l'Action française de Charles Maurras entrent au gouvernement."
 FRW_royal_army:0 "L'Armée royale"
 FRW_royal_army_desc:0 "Les officiers prêtent serment au roi. En retour, ils reçoivent les crédits que la République leur refusait."
 FRW_parliamentary_monarchy:0 "Monarchie parlementaire"
 FRW_parliamentary_monarchy_desc:0 "Sur le modèle britannique, le roi règne et ses ministres gouvernent."
 FRW_absolute_crown:0 "La Couronne gouverne"
 FRW_absolute_crown_desc:0 "Henri VI gouverne en personne, en s'appuyant sur l'armée et l'Église."
 FRW_crown_of_the_franks:0 "L'héritage de Charlemagne"
 FRW_crown_of_the_franks_desc:0 "La Wallonie et le Luxembourg appartinrent jadis à la couronne de France, et Charlemagne tenait sa cour à Aix-la-Chapelle."
 FRW_crown_of_the_franks_tt:0 "But de guerre contre l'§YAllemagne§! pour la §YRhénanie§! et le §YMoselland§! (sauf si la France les possède déjà).\nFonde l'§YEmpire franc§! : nouveau nom et nouveau drapeau, esprit national et §Gterritoires nationaux sur les terres du Benelux, de Rhénanie, de Suisse et d'Italie du Nord§! que possède la France (ainsi que sur celles qu'elle y acquerra par la suite) et §Yrevendications§! sur le reste.\nRemplace toute nation formée auparavant par la France (son esprit de nation formable est retiré). Si la France est déjà le §YRoyaume éternel de Francia§!, elle le reste.\nNécessite le contrôle de la §YRhénanie§!, du §YMoselland§!, de la §YBelgique§! et des §YPays-Bas§! (annexés ou en tant qu'États fantoches, sauf indication contraire). Si la France ne les contrôle pas encore, la nation est fondée automatiquement dès qu'elle les contrôle."
 FRW_catholic_revival:0 "Renouveau catholique"
 FRW_catholic_revival_desc:0 "L'Église accorde sa bénédiction à la monarchie restaurée."
 FRW_holy_alliance:0 "Une nouvelle Sainte-Alliance"
 FRW_holy_alliance_desc:0 "Les monarchies d'Europe s'unissent en une ligue contre la révolution et la guerre."
 FRW_holy_alliance_tt:0 "Fonde la faction §YSainte-Alliance§!."
 FRW_kings_government:0 "Le gouvernement du roi"
 FRW_kings_government_desc:0 "Le roi nomme un cabinet de concorde nationale, que la Chambre confirme ensuite. L'Académie des sciences trouve dans le nouveau roi un protecteur généreux."
 FRW_conseil_du_roi:0 "Le Conseil du roi"
 FRW_conseil_du_roi_desc:0 "À l'instar de Louis XIV, le roi gouverne entouré d'un conseil restreint de fidèles conseillers."
 FRW_provinces_restored:0 "Restaurer les provinces"
 FRW_provinces_restored_desc:0 "Les départements créés en 1790 cèdent de nouveau la place aux provinces historiques, telles que la Normandie et la Bretagne."
 FRW_most_christian_king:0 "Le Roi Très Chrétien"
 FRW_most_christian_king_desc:0 "Henri VI est sacré en la cathédrale de Reims, où les rois de France furent couronnés pendant des siècles."
 FRW_belgian_crown:0 "La Marine royale"
 FRW_belgian_crown_desc:0 "La marine est depuis longtemps l'arme la plus royaliste de France. Sous la fleur de lys, elle doit retrouver son prestige d'antan."
 FRW_luxembourg_protectorate:0 "Les Académies royales"
 FRW_luxembourg_protectorate_desc:0 "Louis XIV fonda l'Académie des sciences en 1666. La couronne entend de nouveau en être la protectrice."
 FRW_bonapartist_appeal:0 "L'appel de l'Aigle"
 FRW_bonapartist_appeal_desc:0 "Les comités bonapartistes réclament le retour du prince Louis Napoléon."
 FRW_bonapartist_appeal_tt:0 "Nécessite le soutien du §Yprince Louis Napoléon§! (décision §YRallier le prince Louis Napoléon§!, 45 jours)."
 FRW_proclaim_the_empire:0 "Proclamer l'Empire"
 FRW_proclaim_the_empire_desc:0 "Louis Napoléon est couronné à Notre-Dame sous le nom de Napoléon VI, empereur des Français."
 FRW_code_napoleon:0 "Un nouveau Code Napoléon"
 FRW_code_napoleon_desc:0 "Le droit et l'administration sont uniformisés sur le modèle du Premier Empire."
 FRW_imperial_guard:0 "La Garde impériale"
 FRW_imperial_guard_desc:0 "Comme sous le Premier Empire, les meilleurs soldats de France sont choisis pour la Garde de l'Empereur."
 FRW_grande_armee_reborn:0 "La renaissance de la Grande Armée"
 FRW_grande_armee_reborn_desc:0 "L'état-major étudie Austerlitz et Iéna et adapte leurs manœuvres rapides et leurs coups concentrés aux chars et aux avions."
 FRW_marshals_of_the_empire:0 "Les maréchaux d'Empire"
 FRW_marshals_of_the_empire_desc:0 "L'avancement se fait de nouveau au mérite, et tout simple soldat peut espérer porter un bâton de maréchal dans sa giberne."
 FRW_continental_system:0 "Le Blocus continental"
 FRW_continental_system_desc:0 "La France met en place une zone commerciale européenne fermée, placée sous sa propre direction."
 FRW_imperial_university:0 "L'Université impériale"
 FRW_imperial_university_desc:0 "Les grandes écoles sont mises à contribution pour former les ingénieurs et les fonctionnaires de l'Empire."
 FRW_imperial_university_tt:0 "Débloque le conseiller politique §YFrédéric Joliot-Curie§! (directeur de la Science impériale : vitesse de recherche §G+15%§!, 150 de pouvoir politique)."
 FRW_natural_borders:0 "Les frontières naturelles"
 FRW_natural_borders_desc:0 "Le Rhin et les Pyrénées marquent les frontières naturelles de la France, comme le proclamait jadis la Révolution."
 FRW_hundred_days_spirit:0 "L'esprit des Cent-Jours"
 FRW_hundred_days_spirit_desc:0 "En 1815, Napoléon promit que l'aigle volerait de clocher en clocher jusqu'aux tours de Notre-Dame. Son héritier reprend ces mots."
 FRW_kingdom_of_holland:0 "Le royaume de Hollande"
 FRW_kingdom_of_holland_desc:0 "Louis Bonaparte fut roi de Hollande de 1806 à 1810. Les Pays-Bas doivent redevenir un royaume vassal de l'Empire."
 FRW_kingdom_of_holland_tt:0 "But de guerre §YÉtat fantoche§! contre les §YPays-Bas§! (s'ils sont indépendants et non alliés)."
 FRW_rhine_confederation:0 "La Confédération du Rhin"
 FRW_rhine_confederation_desc:0 "La rive gauche du Rhin et le pays de Bade sont de nouveau placés sous la protection de l'Empereur."
 FRW_rhine_confederation_tt:0 "But de guerre contre l'§YAllemagne§! pour le §YMoselland§!, la §YRhénanie§! et le §YBade§! (sauf en cas d'alliance)."
 FRW_kingdom_of_italy_napoleon:0 "Le royaume d'Italie"
 FRW_kingdom_of_italy_napoleon_desc:0 "Le Piémont était un département français sous le Premier Empire, et Milan la capitale du royaume d'Italie de Napoléon. Son héritier entend restaurer l'un et l'autre."
 FRW_kingdom_of_italy_napoleon_tt:0 "But de guerre contre l'§YItalie§! pour le §YPiémont§! (sauf en cas d'alliance)."
 FRW_grand_empire:0 "Le Grand Empire"
 FRW_grand_empire_desc:0 "L'Empire français s'étendait jadis de Hambourg à Rome. Napoléon VI entreprend de le rebâtir."
 FRW_grand_empire_tt:0 "Fonde le §YGrand Empire français§! : nouveau nom, drapeau impérial, couleur bleu foncé sur la carte, esprit national et §Gterritoires nationaux sur les terres du Benelux, de Rhénanie, de Suisse, d'Italie du Nord, de Sardaigne et de Catalogne§! que possède la France (ainsi que sur celles qu'elle y acquerra par la suite) et §Yrevendications§! sur le reste.\nRemplace toute nation formée auparavant par la France (son esprit de nation formable est retiré). Si la France est déjà le §YRoyaume éternel de Francia§!, elle le reste.\nNécessite le contrôle du §YRhin§! (Rhénanie, Moselland), du §YPiémont§!, de la §YBelgique§! et des §YPays-Bas§! (annexés ou en tant qu'États fantoches, sauf indication contraire). Si la France ne les contrôle pas encore, la nation est fondée automatiquement dès qu'elle les contrôle."
 FRW_iron_crown:0 "La Couronne de fer"
 FRW_iron_crown_desc:0 "Napoléon fut couronné de la Couronne de fer de Lombardie à Milan en 1805. Son héritier entend la porter à son tour."
 FRW_legion_of_honour:0 "La Légion d'honneur"
 FRW_legion_of_honour_desc:0 "À l'exemple du premier Napoléon, l'Empereur récompense la bravoure au combat par la Légion d'honneur."
 FRW_imperial_navy:0 "La Marine impériale"
 FRW_imperial_navy_desc:0 "La défaite de Trafalgar, en 1805, n'a jamais été vengée. L'Empire commande une flotte à la mesure de ses ambitions."
 FRW_emperor_of_the_west:0 "Empereur d'Occident"
 FRW_emperor_of_the_west_desc:0 "L'autorité de l'Empereur s'étend désormais de l'Atlantique à l'Elbe et de la mer du Nord au Tibre, sous un code de lois unique."
 FRW_act_of_mediation:0 "L'Acte de médiation"
 FRW_act_of_mediation_desc:0 "En 1803, Napoléon donna aux Suisses une constitution et sa protection. Son héritier renouvelle cet arrangement."
 FRW_duchy_of_warsaw:0 "Le duché de Varsovie"
 FRW_duchy_of_warsaw_desc:0 "Les lanciers polonais suivirent Napoléon de Madrid à Moscou. La Pologne doit redevenir l'avant-poste de l'Empire à l'Est."
 FRW_egyptian_campaign:0 "La campagne d'Égypte"
 FRW_egyptian_campaign_desc:0 "Bonaparte mena son armée jusqu'aux pyramides en 1798. Son héritier a des vues sur le canal de Suez."
 FRW_egyptian_campaign_tt:0 "Revendications sur §YLe Caire§!, §YAlexandrie§! et la région de §YSuez§!, et but de guerre contre quiconque tient Alexandrie (l'Égypte ou le Royaume-Uni)."
 FRW_road_to_moscow:0 "La route de Moscou"
 FRW_road_to_moscow_desc:0 "La campagne de 1812 s'acheva dans la neige. Cette fois, la Grande Armée dispose de chars, et Varsovie est déjà une alliée."
 FRW_road_to_moscow_tt:0 "Revendications sur §YMinsk§!, §YVitebsk§!, §YSmolensk§! et §YMoscou§!, et but de guerre contre l'§YUnion soviétique§!."
 FRW_continental_empire:0 "L'Empire continental"
 FRW_continental_empire_desc:0 "La dynastie règne désormais de Cadix au Nil et de la Manche à la Vistule."
 FRW_legitimate_heir:0 "L'héritier légitime"
 FRW_legitimate_heir_desc:0 "Pour les légitimistes, les Orléans sont des usurpateurs. Le roi légitime est l'aîné des héritiers de Louis XIV : Alphonse de Bourbon, le roi d'Espagne en exil, qu'ils appellent Alphonse Ier."
 FRW_legitimate_heir_tt:0 "§YAlphonse de Bourbon§! (après sa mort en 1941 : son fils §YJacques II§!) devient roi de France. Les légitimistes forment le gouvernement.\nNécessite le soutien d'§YAlphonse de Bourbon§! (décision §YRallier Alphonse de Bourbon§!, 45 jours)."
 FRW_white_flag:0 "Le drapeau blanc"
 FRW_white_flag_desc:0 "Henri V refusa le trône en 1873 plutôt que d'accepter le drapeau tricolore. Ses héritiers ramènent la bannière blanche des Bourbons, du moins sur les toits des palais."
 FRW_spanish_bourbons:0 "Les Bourbons de Madrid"
 FRW_spanish_bourbons_desc:0 "Le nouveau roi est aussi le roi d'Espagne en exil. Les monarchistes des deux côtés des Pyrénées ont les yeux tournés vers Paris."
 FRW_spanish_bourbons_tt:0 "Chaque faction espagnole d'une guerre civile obtient également §YLiens avec la Couronne de France§!."
 FRW_requetes:0 "Les requetés de Navarre"
 FRW_requetes_desc:0 "Des volontaires carlistes en béret rouge franchissent les Pyrénées pour servir le roi. Ils sont pieux, disciplinés et avides de combattre."
 FRW_secure_crown_of_spain:0 "S'assurer la couronne d'Espagne"
 FRW_secure_crown_of_spain_desc:0 "Alphonse quitta Madrid en 1931 sans abdiquer. Paris demande à l'Espagne de reprendre son roi, pacifiquement si possible."
 FRW_secure_crown_of_spain_tt:0 "Si l'Espagne est en guerre civile : but de guerre §YÉtat fantoche§! contre chaque camp espagnol non allié à la France.\nSinon, l'§YEspagne§! est invitée à accepter le roi de France comme son propre roi (elle devient un État fantoche de la France). Un refus donne un but de guerre à la France."
 FRW_unite_the_crowns:0 "Unir les couronnes"
 FRW_unite_the_crowns_desc:0 "Philippe V dut renoncer au trône de France en 1713 afin que les deux couronnes ne soient jamais réunies. Le traité d'Utrecht est désormais lettre morte, et la France et l'Espagne ne forment plus qu'un seul royaume."
 FRW_unite_the_crowns_tt:0 "Annexe tous les États fantoches espagnols de la France.\nFonde le §YRoyaume bourbon de France et d'Espagne§! : nouveau nom et nouveau drapeau, esprit national §YLa Double Monarchie§! et §Gterritoires nationaux sur les terres d'Espagne§! que possède la France (ainsi que sur celles qu'elle y acquerra par la suite) et §Yrevendications§! sur le reste.\nRemplace toute nation formée auparavant par la France. Nécessite le contrôle de §YMadrid§! (annexée ou en tant qu'État fantoche) ; si la France ne la contrôle pas encore, le royaume est fondé dès qu'elle la contrôle."
 FRW_two_crowns:0 "Deux pays, deux couronnes"
 FRW_two_crowns_desc:0 "Un roi, deux royaumes : la France et l'Espagne conservent leurs propres gouvernements et armées, mais restent unies sous la maison de Bourbon."
 FRW_two_crowns_tt:0 "L'Espagne redevient indépendante (si elle était un État fantoche de la France) et rejoint la France dans le §YPacte de famille des Bourbons§!. Les deux royaumes conservent leurs propres gouvernements."
 FRW_no_more_pyrenees:0 "Il n'y a plus de Pyrénées"
 FRW_no_more_pyrenees_desc:0 "« Il n'y a plus de Pyrénées », aurait déclaré Louis XIV lorsque son petit-fils devint roi d'Espagne. Routes, chemins de fer et tarifs douaniers traitent désormais les montagnes comme si elles n'existaient pas."
 FRW_no_more_pyrenees_tt:0 "L'Espagne, si elle se tient aux côtés de la France : §YPartenaire bourbon§! (+5% de production des usines, +5% de stabilité)."
 FRW_catholic_kings:0 "Les Rois Très Catholiques"
 FRW_catholic_kings_desc:0 "L'Église retrouve ses écoles et ses sièges dans les conseils de l'État. En retour, les évêques des deux royaumes prêchent la fidélité à la couronne."
 FRW_portuguese_alliance:0 "Une offre à Lisbonne"
 FRW_portuguese_alliance_desc:0 "Seule Lisbonne se tient encore à l'écart dans la péninsule. Paris et Madrid offrent à Salazar une place sous la couronne des Bourbons, et n'attendront pas longtemps sa réponse."
 FRW_heirs_of_louis_xiv:0 "Les héritiers de Louis XIV"
 FRW_heirs_of_louis_xiv_desc:0 "Pour la première fois depuis le Roi-Soleil, un Bourbon règne de la Manche à Gibraltar. Les courtisans parlent d'un nouveau Grand Siècle."
 FRW_rock_of_gibraltar:0 "Le rocher de Gibraltar"
 FRW_rock_of_gibraltar_desc:0 "L'Espagne perdit Gibraltar au profit des Britanniques en 1704, en combattant pour les droits de Philippe d'Anjou, premier Bourbon roi d'Espagne. Ses héritiers règnent désormais à Paris et à Madrid, et ils veulent récupérer le Rocher."
 FRW_rock_of_gibraltar_tt:0 "But de guerre contre le §YRoyaume-Uni§! pour §YGibraltar§! (sauf si le Royaume-Uni est un allié)."
 FRW_two_sicilies:0 "La couronne des Deux-Siciles"
 FRW_two_sicilies_desc:0 "Jusqu'en 1861, un roi Bourbon régnait à Naples et à Palerme. La maison de Savoie s'empara de son royaume par la force, et l'aîné des Bourbons le revendique aujourd'hui comme l'héritage de sa famille."
 FRW_two_sicilies_tt:0 "But de guerre contre l'§YItalie§! pour la §YCampanie, la Sicile, la Calabre et les Pouilles§! (sauf si l'Italie est une alliée)."
 FRW_family_compact_fleet:0 "La flotte du Pacte de famille"
 FRW_family_compact_fleet_desc:0 "En 1761, les rois Bourbons de France et d'Espagne unirent leurs flottes contre la Grande-Bretagne. Brest, Toulon, Ferrol et Carthagène construisent de nouveau pour une seule marine."
 FRW_family_compact_fleet_tt:0 "Si la France possède la §YGalice§! (Ferrol) et la §YMurcie§! (Carthagène) : §G+2§! chantiers navals dans chacune."
 FRW_house_of_parma:0 "La maison de Bourbon-Parme"
 FRW_house_of_parma_desc:0 "Le prince Félix de Bourbon-Parme est l'époux de la grande-duchesse de Luxembourg, et Parme fut elle-même un duché des Bourbons jusqu'en 1859. L'un et l'autre sont invités à revenir dans la famille."
 FRW_nec_pluribus_impar:0 "Nec Pluribus Impar"
 FRW_nec_pluribus_impar_desc:0 "« À nul autre pareil » : telle était la devise de Louis XIV. De la Manche à la Sicile, la maison de Bourbon est de nouveau de taille à affronter toute coalition que l'Europe pourrait dresser contre elle."
 FRW_nec_pluribus_impar_tt:0 "§YLe Grand Siècle§! devient §YNec Pluribus Impar§!."
 FRW_devalue_the_franc:0 "Dévaluer le franc"
 FRW_devalue_the_franc_desc:0 "La France ne peut plus maintenir la cohésion du bloc-or. Une dévaluation devrait rendre les exportations françaises de nouveau compétitives."
 FRW_econ_dirigisme:0 "L'économie dirigée"
 FRW_econ_dirigisme_desc:0 "Des nationalisations du Front populaire aux bureaux du Plan des gouvernements ultérieurs, les ministres français de tous bords ont compté sur Paris pour diriger l'économie. Le crédit, l'investissement et la production suivront des plans établis par l'État."
 FRW_econ_dirigisme_tt:0 "Choisit l'§YÉconomie dirigée§! comme modèle économique de la France. Son esprit se renforce avec §YCartels industriels§! et §YIndépendance économique§!."
 FRW_econ_liberal:0 "Le libéralisme économique"
 FRW_econ_liberal_desc:0 "Les maîtres de forges du Comité des forges veulent un franc libéré des contrôles et des marchés livrés à eux-mêmes. Qu'on leur laisse les mains libres, disent-ils, et les usines prospéreront."
 FRW_econ_liberal_tt:0 "Choisit le §YLibéralisme économique§! comme modèle économique de la France (pas pour les communistes). Son esprit se renforce avec §YCartels industriels§! et §YIndépendance économique§!."
 FRW_econ_rearmament:0 "Le réarmement d'abord"
 FRW_econ_rearmament_desc:0 "Les usines allemandes travaillent pour l'armée depuis 1935. Paris suit désormais le mouvement, et le budget des arsenaux passe avant tout le reste."
 FRW_econ_rearmament_tt:0 "Choisit §YLe réarmement d'abord§! comme modèle économique de la France. Son esprit se renforce avec §YCartels industriels§! et §YIndépendance économique§!."
 FRW_economic_plan:0 "Le plan économique"
 FRW_economic_plan_desc:0 "Quelle que soit la voie choisie, le gouvernement doit décider de ce qui sera construit, où, et qui le paiera."
 FRW_public_works:0 "Les grands travaux"
 FRW_public_works_desc:0 "Routes, ponts et ports sont mis en adjudication, ce qui donne du travail aux chômeurs et laisse le pays mieux équipé."
 FRW_rationalize_industry:0 "Rationaliser l'industrie"
 FRW_rationalize_industry_desc:0 "Beaucoup d'entreprises françaises sont encore de petites affaires familiales aux machines vétustes. Les fusions et les méthodes de production modernes sont encouragées."
 FRW_rationalize_industry_tt:0 "Si la France souffre encore d'une §YÉconomie inefficace§!, celle-ci est réduite d'un niveau."
 FRW_reform_banque_de_france:0 "Réformer la Banque de France"
 FRW_reform_banque_de_france_desc:0 "Les 200 plus gros actionnaires perdent leur emprise sur la Banque de France, dont le conseil est désormais en grande partie nommé par l'État."
 FRW_autoroutes_nationales:0 "Les routes nationales"
 FRW_autoroutes_nationales_desc:0 "Les anciennes routes nationales sont élargies, revêtues à neuf et raccordées entre elles. Camions et convois militaires peuvent désormais traverser le pays en quelques heures plutôt qu'en plusieurs jours."
 FRW_sncf_modernization:0 "Fonder la SNCF"
 FRW_sncf_modernization_desc:0 "Le 1er janvier 1938, les grandes compagnies ferroviaires privées sont fusionnées au sein de la Société nationale des chemins de fer français."
 FRW_modern_management:0 "L'organisation scientifique du travail"
 FRW_modern_management_desc:0 "Des ingénieurs de formation prennent la tête de conseils d'administration longtemps tenus par les familles fondatrices, et l'industrie française commence à compter ses coûts."
 FRW_modern_management_tt:0 "Supprime entièrement l'§YÉconomie inefficace§!.\nNécessite toutes les priorités de la rangée supérieure et une industrie d'au moins §Y40§! usines civiles et §Y25§! usines militaires.\nToutes les priorités inférieures de l'arbre économique en dépendent."
 FRW_industrial_cartels:0 "Cartels industriels"
 FRW_industrial_cartels_desc:0 "Des comités propres à chaque branche de l'industrie répartissent les matières premières et s'accordent sur les investissements."
 FRW_industrial_cartels_tt:0 "Fait passer l'esprit de votre §Ymodèle économique§! au niveau supérieur."
 FRW_hydroelectric_alps:0 "L'hydroélectricité alpine"
 FRW_hydroelectric_alps_desc:0 "Les barrages sur le Rhône et dans les vallées alpines fournissent une énergie bon marché aux nouvelles usines."
 FRW_electrification:0 "L'électrification"
 FRW_electrification_desc:0 "Les centrales du Rhône et du Rhin acheminent le courant jusqu'aux fermes les plus reculées du Massif central. De nouvelles industries s'installent le long des lignes."
 FRW_lorraine_steel:0 "L'acier lorrain"
 FRW_lorraine_steel_desc:0 "De nouvelles méthodes d'extraction et de fonte permettent de mieux exploiter la minette, ce minerai lorrain à faible teneur."
 FRW_heavy_industry_nord:0 "L'industrie lourde du Nord"
 FRW_heavy_industry_nord_desc:0 "Les puits et les aciéries du Nord et du Pas-de-Calais sont agrandis."
 FRW_renault_and_citroen:0 "Renault et Citroën"
 FRW_renault_and_citroen_desc:0 "Renault et Citroën convertissent leurs chaînes de montage à la production de camions, de tracteurs et de véhicules blindés."
 FRW_research_institutes:0 "Fonder le CNRS"
 FRW_research_institutes_desc:0 "Le nouveau Centre national de la recherche scientifique réunit les laboratoires du pays sous une administration unique."
 FRW_bauxite_provence:0 "La bauxite de Provence"
 FRW_bauxite_provence_desc:0 "La bauxite, qui doit son nom aux Baux-de-Provence, y est extraite pour fournir l'aluminium dont les avionneurs ont besoin."
 FRW_rearmament_plan:0 "Le programme de réarmement de 1936"
 FRW_rearmament_plan_desc:0 "Quatorze milliards de francs sont votés pour quatre années de réarmement. Renault construira des chars, Schneider des canons et Dewoitine des avions."
 FRW_rearmament_plan_tt:0 "Nécessite §YRaoul Dautry§! comme conseiller politique (décision §YNommer Raoul Dautry§! au §YConseil des ministres§!, département §YÉconomie§!)."
 FRW_aviation_industry:0 "Réorganiser l'industrie aéronautique"
 FRW_aviation_industry_desc:0 "Les usines d'aviation sont reprises par l'État et regroupées en sociétés nationales régionales, les SNCA."
 FRW_atomic_research:0 "Le laboratoire Joliot-Curie"
 FRW_atomic_research_desc:0 "Frédéric et Irène Joliot-Curie, prix Nobel en 1935, sont à la pointe de la recherche nucléaire."
 FRW_ecole_polytechnique:0 "Développer les grandes écoles"
 FRW_ecole_polytechnique_desc:0 "Polytechnique, Centrale et l'École des mines doublent leurs effectifs. Leurs diplômés concevront les armes du pays et dirigeront ses usines."
 FRW_iraqi_oil:0 "La concession pétrolière de Mossoul"
 FRW_iraqi_oil_desc:0 "Par l'intermédiaire de la Compagnie française des pétroles, la France détient près d'un quart de l'Iraq Petroleum Company. Le brut de Kirkouk gagne Tripoli par oléoduc avant d'être expédié vers les raffineries proches de Marseille."
 FRW_dockyards_brest:0 "Les arsenaux de Brest"
 FRW_dockyards_brest_desc:0 "Les arsenaux de Brest et de Lorient reçoivent de nouvelles machines et de nouvelles cales. C'est ici que seront construits les navires de la flotte de l'Atlantique."
 FRW_consumer_economy:0 "L'industrie des biens de consommation"
 FRW_consumer_economy_desc:0 "De plus en plus de ménages de la classe moyenne peuvent s'offrir un réfrigérateur, un poste de TSF ou une automobile."
 FRW_thomson_electronics:0 "L'industrie radioélectrique"
 FRW_thomson_electronics_desc:0 "Thomson-Houston, la SFR et le Laboratoire central de télécommunications reçoivent des commandes de l'État pour des postes de radio et les premiers radars."
 FRW_war_economy:0 "L'économie de guerre"
 FRW_war_economy_desc:0 "Les usines sont préparées à leur reconversion, les stocks constitués et la main-d'œuvre recensée en vue de son affectation. Si la guerre éclate, l'industrie sera prête en quelques semaines."
 FRW_dispersed_industry:0 "Décentraliser l'industrie de guerre"
 FRW_dispersed_industry_desc:0 "De nouvelles usines sont construites à Toulouse, Bordeaux et Marseille, hors de portée des bombardiers basés en Allemagne."
 FRW_paris_expo:0 "L'Exposition universelle de Paris 1937"
 FRW_paris_expo_desc:0 "L'Exposition internationale de 1937 présente l'art et la technique français sur les bords de la Seine."
 FRW_economic_modernization:0 "Modernisation économique"
 FRW_economic_modernization_desc:0 "Un vaste programme d'investissements vise à hisser l'industrie française au niveau des industries britannique et allemande."
 FRW_arsenal_de_la_republique:0 "L'Arsenal de la République"
 FRW_arsenal_de_la_republique_desc:0 "Les arsenaux d'État tournent jour et nuit en équipes successives et produisent des armes en des quantités jamais vues en temps de paix."
 FRW_strategic_stockpiles:0 "Stocks stratégiques"
 FRW_strategic_stockpiles_desc:0 "Les dépôts sont remplis de fusils, d'obus et de pièces de rechange en prévision du jour de la mobilisation."
 FRW_regional_development:0 "Aménagement régional"
 FRW_regional_development_desc:0 "Le crédit et les grands travaux sont dirigés vers les départements délaissés du centre de la France."
 FRW_war_production_board:0 "Ministère de l'Armement"
 FRW_war_production_board_desc:0 "Le ministère de l'Armement de Raoul Dautry prend en charge l'ensemble de la production de guerre."
 FRW_economic_independence:0 "L'indépendance économique"
 FRW_economic_independence_desc:0 "La France entend subvenir à ses propres besoins grâce au sol de la métropole et de l'Empire."
 FRW_economic_independence_tt:0 "Améliore d'un niveau l'esprit du §Ymodèle économique§! choisi (jusqu'au niveau final si §YLes cartels industriels§! est également achevé)."
 FRW_franc_treasury_crisis:0 "La crise du Trésor"
 FRW_franc_treasury_crisis_desc:0 "Le Trésor vit au jour le jour grâce aux avances de la Banque de France. Avant toute réforme, il faut d'abord savoir de combien d'argent l'État dispose réellement."
 FRW_franc_treasury_crisis_tt:0 "Inflation : §G-5§!"
 FRW_franc_stabilisation_fund:0 "Le Fonds de stabilisation des changes"
 FRW_franc_stabilisation_fund_desc:0 "Un fonds d'or et de devises est créé pour défendre le franc sur les marchés, comme le font déjà Londres et Washington. Les spéculateurs devront compter avec le Trésor autant qu'avec la Banque de France."
 FRW_franc_stabilisation_fund_tt:0 "Réserves d'or : §G+100 t§!\nDésormais §G+5 t§! d'or par mois."
 FRW_franc_defence_bonds:0 "Les bons de la Défense nationale"
 FRW_franc_defence_bonds_desc:0 "Le Trésor vend des bons dans tous les bureaux de poste de France. Les épargnants prêtent leurs francs à l'État au lieu de les dépenser, et les affiches promettent que chaque franc achète un obus."
 FRW_franc_defence_bonds_tt:0 "Inflation : §G-8§!"
 FRW_franc_fiscal_reform:0 "La réforme fiscale"
 FRW_franc_fiscal_reform_desc:0 "Le Parlement vote de nouveaux impôts, réduit les exonérations et, pour une fois, adopte le budget dans les délais. Le déficit se réduit, et avec lui les avances de la Banque de France."
 FRW_franc_fiscal_reform_tt:0 "Désormais, l'inflation baisse en outre de §G0.25§! point par mois."
 FRW_franc_safe_havens:0 "Mettre l'or à l'abri"
 FRW_franc_safe_havens_desc:0 "Une partie des réserves est discrètement expédiée vers des coffres à Dakar, Fort-de-France et Ottawa, hors de portée de tout envahisseur."
 FRW_franc_safe_havens_tt:0 "Les réserves d'or sont à l'abri : si la France capitule, la §YFrance libre§! pourra toujours en disposer."
 FRW_franc_colonial_gold:0 "L'or de l'Empire"
 FRW_franc_colonial_gold_desc:0 "Géologues et ingénieurs sont envoyés sur les gisements aurifères de Guinée et du Soudan français. La production est modeste, mais chaque once est extraite dans la zone franc."
 FRW_franc_colonial_gold_tt:0 "Réserves d'or : §G+50 t§!\nDésormais §G+5 t§! d'or par mois."
 FRW_franc_strong_franc:0 "Un franc fort"
 FRW_franc_strong_franc_desc:0 "Avec un budget équilibré et des coffres pleins, le franc garde sa valeur, et les capitaux qui avaient fui vers Londres et New York reviennent. Le crédit devient bon marché et les chantiers rouvrent."
 FRW_franc_strong_franc_tt:0 "Inflation : §G-10§!"
 FRW_franc_war_finance:0 "Financer la guerre"
 FRW_franc_war_finance_desc:0 "La guerre sera payée par l'impôt, l'emprunt et les contrôles plutôt que par la planche à billets. Les ministres se souviennent de ce que les dettes de guerre ont fait au franc après 1918."
 FRW_franc_war_finance_tt:0 "Inflation : §G-8§!\nDisponible uniquement §Yen temps de guerre§!."
 FRW_lessons_of_verdun:0 "Les leçons de Verdun"
 FRW_lessons_of_verdun_desc:0 "Les officiers d'état-major étudient les campagnes de 1914 à 1918 afin que l'armée n'en répète pas les erreurs."
 FRW_beyond_victory:0 "Dépasser la suffisance du vainqueur"
 FRW_beyond_victory_desc:0 "La victoire de 1918 a laissé l'armée sûre de ses méthodes. Ses officiers doivent désormais les remettre en question."
 FRW_beyond_victory_tt:0 "Les doutes restants (§YLes doutes du vainqueur§!) ne sont levés que par §YUne armée moderne§!, à la fin de la branche de l'armée de terre."
 FRW_methodical_battle:0 "La bataille méthodique"
 FRW_methodical_battle_desc:0 "L'armée combat selon un plan minutieux, avec une artillerie massive et un front continu et solidement tenu."
 FRW_methodical_battle_tt:0 "§YLes généraux de 1918§! s'atténue en §YUn commandement en transition§!. §YRéformer l'état-major§! le supprime."
 FRW_war_of_movement:0 "La guerre de mouvement"
 FRW_war_of_movement_desc:0 "Les chars, les camions et la radio décideront de la prochaine guerre, et elle sera rapide."
 FRW_war_of_movement_tt:0 "§YLes généraux de 1918§! s'atténue en §YUn commandement en transition§!. §YRéformer l'état-major§! le supprime."
 FRW_maginot_extension:0 "Prolonger la ligne Maginot"
 FRW_maginot_extension_desc:0 "La ligne Maginot s'arrête à la frontière belge, l'état-major allemand le sait bien. De nouvelles casemates et de nouveaux obstacles s'étendront désormais de Montmédy jusqu'à la mer."
 FRW_heavy_artillery:0 "L'artillerie lourde"
 FRW_heavy_artillery_desc:0 "Schneider et l'Atelier de Puteaux livrent de nouvelles pièces pour remplacer les stocks de la dernière guerre."
 FRW_mas_rifles:0 "Le MAS-36"
 FRW_mas_rifles_desc:0 "Le MAS-36 est plus court et plus léger que le vieux Lebel, et plus rapide à recharger. Il doit équiper tous les régiments d'infanterie."
 FRW_mechanized_divisions:0 "Les divisions légères mécaniques"
 FRW_mechanized_divisions_desc:0 "La cavalerie forme des divisions légères mécaniques chargées d'éclairer l'armée et de poursuivre un ennemi battu. Les camions remplacent les convois hippomobiles qui assurent encore le ravitaillement de l'armée."
 FRW_divisions_cuirassees:0 "Les divisions cuirassées"
 FRW_divisions_cuirassees_desc:0 "Suivant les idées du colonel de Gaulle, les chars sont regroupés en divisions cuirassées autonomes. Les travaux se poursuivent sur un char de rupture plus lourd pour succéder au Char B1."
 FRW_chasseurs_alpins:0 "Chasseurs alpins et spahis"
 FRW_chasseurs_alpins_desc:0 "Les chasseurs alpins, les « Diables bleus » de la dernière guerre, comptent parmi les meilleures troupes de montagne d'Europe. Toutes les divisions alpines doivent être formées selon leurs exigences. Les régiments de spahis montés d'Afrique du Nord sont rééquipés en unités de reconnaissance."
 FRW_colonial_troops:0 "Les troupes coloniales"
 FRW_colonial_troops_desc:0 "Tirailleurs sénégalais et spahis nord-africains viennent renforcer l'armée."
 FRW_general_staff_reform:0 "Réformer l'état-major"
 FRW_general_staff_reform_desc:0 "Les généraux âgés sont mis à la retraite et des officiers plus jeunes reçoivent des commandements."
 FRW_foreign_legion:0 "La Légion étrangère"
 FRW_foreign_legion_desc:0 "La Légion étrangère, dont la devise est Legio Patria Nostra, est agrandie et entraînée comme une force d'élite."
 FRW_reserve_system:0 "Le système des réserves"
 FRW_reserve_system_desc:0 "Les réservistes sont rappelés pour des périodes d'instruction régulières afin de pouvoir rejoindre rapidement leurs unités."
 FRW_reserve_system_tt:0 "Nécessite §YAlfred Sauvy§! comme conseiller politique (décision §YNommer Alfred Sauvy§! au §YConseil des ministres§!, département §YÉconomie§!)."
 FRW_combined_arms:0 "Les armes combinées"
 FRW_combined_arms_desc:0 "Infanterie, chars, artillerie et aviation s'entraînent ensemble et apprennent à combattre de concert. Le canon de 47 mm SA 37 peut percer le blindage de tout char actuellement en service en Europe. Chaque division d'infanterie doit en recevoir suffisamment pour arrêter une attaque blindée."
 FRW_paratroopers:0 "Parachutistes et corps francs"
 FRW_paratroopers_desc:0 "La France a formé ses premières compagnies parachutistes, l'Infanterie de l'Air, en 1937, parmi les toutes premières au monde. De petits détachements d'assaut sont entraînés à la reconnaissance et aux coups de main."
 FRW_desert_warfare:0 "La guerre du désert"
 FRW_desert_warfare_desc:0 "Les enseignements des campagnes du Maroc et du Sahara sont recueillis et enseignés."
 FRW_artillery_barrage:0 "Le barrage roulant"
 FRW_artillery_barrage_desc:0 "Des tirs planifiés en détail et étroitement liés à l'infanterie restent le fondement de la tactique française."
 FRW_army_of_the_republic:0 "Une armée moderne"
 FRW_army_of_the_republic_desc:0 "Hormis ses drapeaux, l'armée de 1940 n'a plus grand-chose en commun avec celle de 1918. Un état-major interarmées est créé pour coordonner l'armée de terre, la marine et l'aviation."
 FRW_tank_production_lines:0 "Chaînes de production de chars"
 FRW_tank_production_lines_desc:0 "De nouvelles chaînes de montage de chars ouvrent à Issy-les-Moulineaux et à Vénissieux."
 FRW_darlan_programme:0 "Le programme Darlan"
 FRW_darlan_programme_desc:0 "La France possède la quatrième marine du monde, et ses navires doivent être tenus à jour. L'amiral Darlan, chef d'état-major de la Marine à partir de 1937, réclame une flotte capable d'opérer en haute mer."
 FRW_darlan_programme_tt:0 "§YUne flotte divisée§! s'atténue en §YUne flotte en réforme§!. §YLes arsenaux de Toulon et de Brest§! la supprime.\nDébloque le département §YMarine§! au §YConseil des ministres§!."
 FRW_richelieu_class:0 "La classe Richelieu"
 FRW_richelieu_class_desc:0 "Le Dunkerque et le Strasbourg n'étaient que les premiers des nouveaux cuirassés. La classe Richelieu sera à la hauteur de tout ce que l'Italie ou l'Allemagne pourront mettre à la mer. Le Richelieu et ses sister-ships seront les cuirassés les plus puissants jamais construits par la France."
 FRW_mediterranean_fleet:0 "La flotte de Méditerranée"
 FRW_mediterranean_fleet_desc:0 "Les croiseurs et contre-torpilleurs français comptent parmi les navires de guerre les plus rapides du monde. La route maritime vers l'Afrique du Nord doit rester ouverte à tout prix."
 FRW_atlantic_squadrons:0 "Les escadres de l'Atlantique"
 FRW_atlantic_squadrons_desc:0 "La marine investit massivement dans les sous-marins, du géant Surcouf aux petits submersibles côtiers. Brest devient la base principale de la flotte de l'Atlantique."
 FRW_carrier_programme:0 "Le programme de porte-avions"
 FRW_carrier_programme_desc:0 "Le vieux Béarn est le seul porte-avions de la marine, et il est trop lent pour les opérations modernes. La nouvelle classe Joffre donnera à la flotte sa propre aviation."
 FRW_naval_aviation:0 "L'aviation navale"
 FRW_naval_aviation_desc:0 "L'Aéronavale reçoit ses propres avions, pilotes et bases aéronavales. Bombardiers-torpilleurs et avions de reconnaissance chercheront et frapperont l'ennemi pour la flotte."
 FRW_toulon_brest_yards:0 "Les arsenaux de Toulon et de Brest"
 FRW_toulon_brest_yards_desc:0 "De nouvelles cales sèches sont construites à Toulon et à Brest pour la prochaine génération de navires de guerre."
 FRW_convoy_escorts:0 "Escorte des convois"
 FRW_convoy_escorts_desc:0 "Avisos et corvettes escortent les navires marchands sur les routes des colonies."
 FRW_coastal_defence:0 "La défense côtière"
 FRW_coastal_defence_desc:0 "Les fusiliers marins, célèbres pour leur résistance à Dixmude en 1914, sont reconstitués en force de débarquement moderne. Batteries côtières et champs de mines protègent les ports de France et de l'Empire."
 FRW_fleet_in_being:0 "Une flotte équilibrée"
 FRW_fleet_in_being_desc:0 "Cuirassés, croiseurs, contre-torpilleurs et sous-marins sont construits en nombres équilibrés, afin que la flotte puisse opérer sur toutes les mers."
 FRW_naval_treaties_end:0 "Adieu aux traités navals"
 FRW_naval_treaties_end_desc:0 "La France ne se considère plus liée par les traités navals de Washington et de Londres."
 FRW_plan_v:0 "Le plan V"
 FRW_plan_v_desc:0 "L'Armée de l'air n'est une arme indépendante que depuis 1934. Le plan V prévoit 2 400 avions modernes."
 FRW_plan_v_tt:0 "§YUne armée de l'air dépassée§! s'atténue en §YUne armée de l'air en transition§!. §YLes écoles de pilotage§! la supprime.\nDébloque le département §YAir§! au §YConseil des ministres§!."
 FRW_dewoitine_fighters:0 "Les chasseurs Dewoitine"
 FRW_dewoitine_fighters_desc:0 "Le Dewoitine D.520 doit pouvoir tenir tête à n'importe quel chasseur qu'il rencontre."
 FRW_bomber_command:0 "Les forces de bombardement"
 FRW_bomber_command_desc:0 "Les escadrilles sont rééquipées de bombardiers bimoteurs modernes tels que le LeO 45."
 FRW_air_doctrine:0 "La doctrine aérienne"
 FRW_air_doctrine_desc:0 "L'état-major fixe par écrit le rôle de l'aviation dans une guerre future."
 FRW_colonial_air_bases:0 "Les bases aériennes de l'Empire"
 FRW_colonial_air_bases_desc:0 "Les aérodromes d'Afrique du Nord étendent la couverture aérienne sur la Méditerranée occidentale."
 FRW_close_air_support:0 "L'appui aérien rapproché"
 FRW_close_air_support_desc:0 "Bombardiers en piqué et avions d'assaut seront envoyés partout où l'infanterie les réclame. Pour la première fois, l'Armée de l'air s'entraîne sérieusement avec l'armée de terre."
 FRW_air_defence_paris:0 "La défense aérienne de Paris"
 FRW_air_defence_paris_desc:0 "Canons antiaériens et appareils d'écoute encerclent la capitale."
 FRW_pilot_schools:0 "Les écoles de pilotage"
 FRW_pilot_schools_desc:0 "De nouvelles écoles de pilotage à Istres et à Salon-de-Provence forment plusieurs centaines de pilotes par an, tandis que l'Aviation populaire de Pierre Cot apprend à voler aux jeunes gens dans les aéroclubs locaux."
 FRW_jet_research:0 "Les moteurs à réaction"
 FRW_jet_research_desc:0 "L'ingénieur René Leduc travaille sur un statoréacteur."
 FRW_strategic_air_force:0 "L'aviation stratégique"
 FRW_strategic_air_force_desc:0 "Des bombardiers quadrimoteurs sont commandés pour frapper usines, voies ferrées et ports loin derrière les lignes ennemies."
 FRW_strategic_air_force_tt:0 "Nécessite §YPierre Cot§! comme conseiller politique (décision §YNommer Pierre Cot§! au §YConseil des ministres§!, département §YRecherche§!)."
 FRW_air_superiority:0 "La supériorité aérienne"
 FRW_air_superiority_desc:0 "Les récents combats en Espagne ont montré que les armées privées de couverture aérienne subissent de lourdes pertes. L'Armée de l'air a besoin de chasseurs plus nombreux et plus rapides."
 FRW_air_staff:0 "L'état-major de l'Air"
 FRW_air_staff_desc:0 "Un état-major de l'Air permanent planifie désormais ensemble l'action des escadrilles de chasse, de bombardement et de reconnaissance. Les ordres viendront d'officiers qui connaissent les avions."
 FRW_quai_d_orsay:0 "Le Quai d'Orsay"
 FRW_quai_d_orsay_desc:0 "Le Quai d'Orsay possède une plus grande expérience de la diplomatie européenne qu'aucun autre ministère des Affaires étrangères, et ses ambassadeurs sont mis à contribution."
 FRW_league_of_nations:0 "Renforcer la Société des Nations"
 FRW_league_of_nations_desc:0 "Paris place sa confiance dans la Société des Nations à Genève et dans l'action collective contre tout agresseur."
 FRW_eastern_alliances:0 "Le système d'alliances à l'Est"
 FRW_eastern_alliances_desc:0 "À l'est, la Pologne et les États de la Petite Entente doivent tenir l'Allemagne en respect."
 FRW_mediterranean_policy:0 "La politique méditerranéenne"
 FRW_mediterranean_policy_desc:0 "Des pourparlers avec Rome, Madrid et Ankara visent à maintenir le calme en Méditerranée et à garder ouvertes les routes maritimes vers l'Afrique."
 FRW_belgian_alliance:0 "L'alliance belge"
 FRW_belgian_alliance_desc:0 "La vieille route d'invasion de la France passe par la Belgique. Sa défense est considérée comme une affaire française."
 FRW_franco_polish_pact:0 "Le pacte franco-polonais"
 FRW_franco_polish_pact_desc:0 "L'alliance de 1921 est renouvelée et dotée de nouvelles clauses militaires. Une offensive allemande vers l'est signifierait une guerre sur deux fronts."
 FRW_franco_soviet_pact:0 "Le pacte franco-soviétique"
 FRW_franco_soviet_pact_desc:0 "Le pacte d'assistance mutuelle signé en 1935 est enfin complété par des conversations d'état-major et des engagements concrets."
 FRW_franco_soviet_pact_tt:0 "Signe un §Ypacte de non-agression§! avec l'§YUnion soviétique§!."
 FRW_turkish_friendship:0 "L'amitié avec la Turquie"
 FRW_turkish_friendship_desc:0 "La cession du sandjak d'Alexandrette à la Turquie gagne la bienveillance d'Ankara."
 FRW_turkish_friendship_tt:0 "Le §YHatay§! est cédé à la §YTurquie§! (s'il appartient à la France ou à la Syrie française)."
 FRW_swiss_talks:0 "Pourparlers avec Berne"
 FRW_swiss_talks_desc:0 "Paris engage des pourparlers avec Berne afin qu'aucune armée ne puisse emprunter le territoire suisse pour contourner les défenses françaises."
 FRW_balkan_guarantees:0 "Soutenir l'Entente balkanique"
 FRW_balkan_guarantees_desc:0 "Les garanties accordées à la Grèce et à la Turquie referment le cercle des alliances françaises dans le Sud-Est."
 FRW_arms_exports:0 "Les exportations d'armes"
 FRW_arms_exports_desc:0 "Les commandes de fusils, de canons et d'avions français affluent de nombreux gouvernements étrangers."
 FRW_deuxieme_bureau:0 "Le Deuxième Bureau"
 FRW_deuxieme_bureau_desc:0 "Le renseignement militaire reçoit davantage de personnel et de crédits. Depuis 1931, le capitaine Bertrand transmet au bureau du chiffre polonais des documents sur Enigma achetés à un informateur allemand."
 FRW_american_credits:0 "Les crédits américains"
 FRW_american_credits_desc:0 "Les prêts et les licences de fabrication accordés par Washington accélèrent le réarmement français."
 FRW_vatican_concordat:0 "La réconciliation avec le Vatican"
 FRW_vatican_concordat_desc:0 "Un concordat avec le Saint-Siège met fin à la longue querelle entre la République et l'Église."
 FRW_rhineland_response:0 "Répondre au coup de force rhénan"
 FRW_rhineland_response_desc:0 "En mars 1936, Hitler a parié que la France ne bougerait pas, et il a gagné. La prochaine violation des traités sera suivie de l'envoi de troupes, et non plus seulement de protestations."
 FRW_collective_security:0 "La sécurité collective"
 FRW_collective_security_desc:0 "Paris appelle tous les gouvernements qui redoutent l'agression à rejoindre la France dans un front commun."
 FRW_collective_security_tt:0 "Une France démocratique n'appartenant à aucune faction fonde la §YSécurité collective§!."
 FRW_diplomatic_shield:0 "Le bouclier diplomatique"
 FRW_diplomatic_shield_desc:0 "Tout État qui attaquera la France sera partout considéré comme l'agresseur."
 FRW_great_power_status:0 "La Grande Nation"
 FRW_great_power_status_desc:0 "L'armée réarmée et les alliances de l'Est rétablies, plus aucune question européenne ne se règle sans le Quai d'Orsay."
 FRW_empire_colonial:0 "L'Empire colonial"
 FRW_empire_colonial_desc:0 "La France possède le deuxième empire colonial du monde, et ses hommes et ses ressources constituent la plus grande réserve du pays."
 FRW_ministry_of_colonies:0 "Le ministère des Colonies"
 FRW_ministry_of_colonies_desc:0 "Le ministère des Colonies de la rue Oudinot est réorganisé. Des gouverneurs, ingénieurs et médecins formés remplacent les aventuriers et les spéculateurs."
 FRW_african_development:0 "Développer l'Afrique du Nord"
 FRW_african_development_desc:0 "Centrales électriques, travaux portuaires et usines sont construits à Alger, Oran et Casablanca, faisant de l'Afrique du Nord la base industrielle de l'Empire."
 FRW_colonial_purchases:0 "Les achats coloniaux"
 FRW_colonial_purchases_desc:0 "Certains territoires peuvent s'acheter. L'Espagne, le Portugal, la Belgique, la Grande-Bretagne et l'Italie détiennent des terres qui arrondiraient l'Afrique française."
 FRW_aof_federation:0 "La fédération de l'Afrique-Occidentale française"
 FRW_aof_federation_desc:0 "Les colonies de l'Afrique-Occidentale française sont gouvernées depuis Dakar comme une seule fédération."
 FRW_trans_saharan_railway:0 "Le Transsaharien"
 FRW_trans_saharan_railway_desc:0 "Les travaux commencent sur une voie ferrée traversant le Sahara d'Alger au Niger, reliant l'Afrique du Nord à l'Afrique occidentale."
 FRW_saharan_oil:0 "Le pétrole du Sahara"
 FRW_saharan_oil_desc:0 "Les géologues pensent que d'importants gisements de pétrole se trouvent sous le Sahara algérien, et des équipes de prospection sont envoyées vers le sud."
 FRW_tonkin_industry:0 "L'industrie au Tonkin"
 FRW_tonkin_industry_desc:0 "Le Japon regarde vers le sud. La garnison d'Indochine est renforcée. Les mines de charbon et la main-d'œuvre du Tonkin sont mises au service de l'industrie locale."
 FRW_moroccan_question:0 "L'héritage de Lyautey"
 FRW_moroccan_question_desc:0 "Le maréchal Lyautey a bâti le protectorat marocain sur le respect du sultan ainsi que sur les routes, les ports et les écoles. Ses successeurs doivent achever l'œuvre."
 FRW_moroccan_question_tt:0 "États marocains : §G+10%§! de conformité."
 FRW_liberia_protectorate:0 "Protectorat sur le Liberia"
 FRW_liberia_protectorate_desc:0 "Le Liberia est lourdement endetté. La France lui offre crédit et protection."
 FRW_dakar_naval_base:0 "La base navale de Dakar"
 FRW_dakar_naval_base_desc:0 "Depuis Dakar, la marine peut surveiller le goulet atlantique entre l'Afrique et l'Amérique du Sud."
 FRW_dakar_naval_base_tt:0 "§G+1§! chantier naval et emplacement de construction dans un État côtier d'Afrique."
 FRW_mauritanian_iron:0 "Le minerai de fer de Mauritanie"
 FRW_mauritanian_iron_desc:0 "Les prospections confirment que la montagne de Kediet ej Jill, près de Zouérat, est presque entièrement constituée de minerai de fer. Une voie ferrée jusqu'à la côte l'acheminera vers les hauts fourneaux français."
 FRW_pacific_bases:0 "Les bases du Pacifique"
 FRW_pacific_bases_desc:0 "De nouveaux aérodromes en Indochine couvrent les possessions asiatiques de l'Empire."
 FRW_libyan_question:0 "La frontière saharienne"
 FRW_libyan_question_desc:0 "De Tindouf au Fezzan, la frontière désertique n'est surveillée que par une poignée de méharistes. L'Armée d'Afrique réclame des forts, des aérodromes et des puits."
 FRW_colonial_development_fund:0 "Le Fonds d'investissement colonial"
 FRW_colonial_development_fund_desc:0 "Un fonds public est créé pour financer routes, voies ferrées et ports en Afrique."
 FRW_colonial_development_fund_tt:0 "§G+1§! usine civile et emplacement de construction dans un État d'Afrique."
 FRW_algerian_departments:0 "L'Algérie, c'est la France"
 FRW_algerian_departments_desc:0 "Depuis 1848, l'Algérie est organisée en départements, et Paris la considère comme une partie intégrante de la France."
 FRW_djibouti_railway:0 "Le chemin de fer Djibouti–Addis-Abeba"
 FRW_djibouti_railway_desc:0 "La ligne française de Djibouti à Addis-Abeba est le seul accès ferroviaire de l'Éthiopie à la mer."
 FRW_indochina_rubber:0 "Le caoutchouc d'Indochine"
 FRW_indochina_rubber_desc:0 "Le caoutchouc des plantations Michelin d'Indochine est réservé à l'armée."
 FRW_levant_mandates:0 "Intégrer les mandats du Levant"
 FRW_levant_mandates_desc:0 "La Syrie et le Liban sont placés sous administration française directe."
 FRW_levant_mandates_tt:0 "Annexe les mandats français de §YSyrie§! et du §YLiban§! s'ils sont des États fantoches français. Si la France administre déjà directement le Levant (p. ex. dans Road to 56), elle reçoit simplement le bonus d'administration."
 FRW_eurafrique:0 "L'Eurafrique"
 FRW_eurafrique_desc:0 "Des planificateurs parisiens proposent un espace économique unique réunissant l'Europe et l'Afrique, avec la France à sa tête."
 FRW_colonial_war_production:0 "La production de guerre dans l'Empire"
 FRW_colonial_war_production_desc:0 "Les usines construites en Afrique sont hors de portée des bombardiers ennemis."
 FRW_imperial_preference:0 "La préférence impériale"
 FRW_imperial_preference_desc:0 "Les droits de douane baissent à l'intérieur de l'Empire et augmentent à ses frontières. Le coton, le caoutchouc et le minerai coloniaux vont d'abord aux usines françaises."
 FRW_madagascar_development:0 "Développer Madagascar"
 FRW_madagascar_development_desc:0 "Madagascar reçoit de nouveaux ports et de nouvelles routes."
 FRW_national_cohesion:0 "La cohésion nationale"
 FRW_national_cohesion_desc:0 "Depuis les émeutes du 6 février 1934, la droite et la gauche se déchirent."
 FRW_end_political_violence:0 "Dissoudre les ligues"
 FRW_end_political_violence_desc:0 "Les Croix-de-Feu, les Camelots du roi et les milices de gauche sont dissous et leurs armes saisies. Le maintien de l'ordre dans la rue revient à la police."
 FRW_radio_propaganda:0 "Radio-Paris"
 FRW_radio_propaganda_desc:0 "Radio-Paris et les stations régionales portent le message du gouvernement dans les foyers, les cafés et les casernes de tout le pays."
 FRW_code_de_la_famille:0 "Le Code de la famille"
 FRW_code_de_la_famille_desc:0 "Le Code de la famille de 1939 offre allocations et incitations pour relever le faible taux de natalité de la France."
 FRW_civil_defence:0 "La défense passive"
 FRW_civil_defence_desc:0 "Les villes creusent des abris antiaériens et organisent des exercices d'occultation."
 FRW_mobilization_laws:0 "La loi sur l'organisation de la nation en temps de guerre"
 FRW_mobilization_laws_desc:0 "La loi de juillet 1938 sur l'organisation de la nation en temps de guerre fixe les modalités de mobilisation des hommes et de l'industrie."
 FRW_rural_modernization:0 "Moderniser l'agriculture"
 FRW_rural_modernization_desc:0 "Tracteurs et engrais arrivent dans les fermes, libérant de la main-d'œuvre pour les usines."
 FRW_national_service:0 "Le service national"
 FRW_national_service_desc:0 "Les civils comme les soldats se voient attribuer des tâches, au front ou dans les usines de guerre."
 FRW_women_in_industry:0 "Les femmes dans l'industrie"
 FRW_women_in_industry_desc:0 "Comme en 1914, les femmes prennent en charge une grande partie du travail dans les usines."
 FRW_union_sacree:0 "L'Union sacrée"
 FRW_union_sacree_desc:0 "En août 1914, les partis ont mis leurs querelles de côté pour la durée de la guerre. Le gouvernement demande aujourd'hui aux ouvriers et aux patrons, aux catholiques et aux anticléricaux d'en faire autant."
 FRW_iberian_ambitions:0 "La question ibérique"
 FRW_iberian_ambitions_desc:0 "Au-delà des Pyrénées, l'Espagne glisse vers la guerre civile. Le contrôle de la péninsule donnerait au capitaine l'entrée occidentale de la Méditerranée et les plus beaux ports de l'Atlantique."
 FRW_intervene_in_spain:0 "Intervenir en Espagne"
 FRW_intervene_in_spain_desc:0 "Les Espagnols s'entretuent. La France entend intervenir et mettre fin à la guerre selon ses propres conditions, quelle que soit la faction qui se dresse sur son chemin."
 FRW_intervene_in_spain_tt:0 "But de guerre §Yannexion§! contre §Ychaque camp§! de la guerre civile espagnole qui n'est pas allié à la France."
 FRW_spanish_protectorate:0 "Un protectorat sur l'Espagne"
 FRW_spanish_protectorate_desc:0 "Qu'il y ait eu guerre civile ou non, l'Espagne est faible et Paris est proche. Un protectorat français est proposé."
 FRW_one_iberia:0 "Une seule Ibérie sous la France"
 FRW_one_iberia_desc:0 "Les canons se sont tus. Ce qui reste de l'Espagne passera à la France, par traité si possible, par la force sinon."
 FRW_one_iberia_tt:0 "Tout État espagnol déjà §Ysatellite de la France§! est §Yentièrement annexé§!, armée comprise.\nContre toute Espagne §Yindépendante§!, la France obtient à la place un §Ybut de guerre§!.\nSi l'Espagne n'existe plus, cette priorité est ignorée."
 FRW_portuguese_question:0 "La question portugaise"
 FRW_portuguese_question_desc:0 "Lisbonne se retrouve isolée au bord d'une péninsule française. Les divisions françaises massées à la frontière appuient les arguments des diplomates français."
 FRW_portuguese_question_tt:0 "Le §YPortugal§! doit choisir : rejoindre pacifiquement la France ou affronter la guerre.\nPlus l'armée française est forte par rapport à celle du Portugal, plus Lisbonne a de chances de céder. Si le Portugal refuse, la France obtient un but de guerre §Yannexion§!."
 FRW_raise_the_black_flag:0 "Le Royaume de Francia"
 FRW_raise_the_black_flag_desc:0 "Le capitaine de Saint-Malo unit la France et l'Ibérie sous une même bannière, portant les lys de France et l'hermine de Bretagne. Il l'appelle royaume pour l'heure, et royaume éternel pour son fils."
 FRW_raise_the_black_flag_tt:0 "Proclame le §YRoyaume de Francia§!, précurseur du Royaume éternel, avec une bannière aux lys et à l'hermine bretonne, §YLe Pavillon Corsaire§! (+15 % d'attaque et de défense en territoire national) et des §Gterritoires nationaux sur les terres d'Espagne et du Portugal§! que possède la France (ainsi que sur celles qu'elle y acquerra plus tard) et des §Yrevendications§! sur le reste.\nRemplace toute nation formée auparavant par la France (son esprit de nation formable est retiré). Si la France est déjà le §YRoyaume éternel de Francia§!, elle le reste."
 FRW_iberian_cores:0 "Une péninsule, une nation"
 FRW_iberian_cores_desc:0 "De Calais à Cadix et de Brest à Lisbonne, ces terres seront gouvernées comme une seule nation."
 FRW_iberian_cores_tt:0 "§GTerritoire national§! sur chaque région possédée qui est un territoire national de l'§YEspagne§! ou du §YPortugal§!, et §G+15 %§! de conformité dans ces régions."
 FRW_asturian_steel:0 "Le charbon des Asturies et le minerai d'Andalousie"
 FRW_asturian_steel_desc:0 "Les mines et les hauts fourneaux des Asturies ainsi que les anciennes mines de cuivre du Río Tinto travaillent désormais pour la France."
 FRW_catalan_industry:0 "Les usines de Barcelone"
 FRW_catalan_industry_desc:0 "La Catalogne était l'atelier de l'Espagne ; ses filatures et ses usines servent désormais les besoins de la France dans le Sud."
 FRW_port_of_lisbon:0 "Le port de Lisbonne"
 FRW_port_of_lisbon_desc:0 "Le port de Lisbonne, l'un des meilleurs de l'Atlantique, devient le port d'attache de l'escadre de l'Atlantique du capitaine."
 FRW_iberian_arsenal:0 "L'arsenal ibérique"
 FRW_iberian_arsenal_desc:0 "Les arsenaux de Madrid et de Burgos produisent fusils, canons et chars pour les armées impériales."
 FRW_letters_of_marque:0 "Lettres de marque"
 FRW_letters_of_marque_desc:0 "Les corsaires de Saint-Malo se sont toujours battus pour le profit autant que pour la gloire. Chaque ennemi vaincu et chaque nation protégée alimentera le trésor de guerre du capitaine, et chaque île qui commande une route maritime est une prise qui vaut d'être saisie."
 FRW_letters_of_marque_tt:0 "Débloque §YSaisir le trésor§! : s'emparer des réserves d'or de tout pays qui est §Ysatellite de la France§! ou qui a §Ycapitulé§! en guerre contre la France.\nLa France gagne §G+75§! de pouvoir politique, une usine civile et §YL'or des corsaires§! (180 jours) ; la victime subit §RTrésor pillé§! (365 jours). Chaque pays ne peut être pillé qu'une fois par an."
 FRW_shipyards_of_saint_malo:0 "Les chantiers de Saint-Malo"
 FRW_shipyards_of_saint_malo_desc:0 "Le vieux port corsaire construit de nouveau : frégates, cargos et les usines pour les approvisionner."
 FRW_corsair_economy:0 "L'économie des prises"
 FRW_corsair_economy_desc:0 "L'or, les navires et les cargaisons pris en mer sont transformés en acier et en machines à terre. Les tribunaux des prises de Saint-Malo siègent jour et nuit."
 FRW_appeal_of_18_june:0 "L'Appel du 18 juin"
 FRW_appeal_of_18_june_desc:0 "« La France a perdu une bataille ! Mais la France n'a pas perdu la guerre ! » Depuis Londres, un général peu connu exhorte tous les Français à poursuivre le combat."
 FRW_appeal_of_18_june_tt:0 "Cette branche apparaît dès que la France a §Ycapitulé§! ou perdu le contrôle de §YParis§! – même si une paix a déjà été signée. Ses priorités peuvent être choisies pendant la capitulation.\nLe prestige de la France libre commence à §Y20§! sur 100 et les décisions §YFrance libre§! deviennent disponibles. Retire §YDéfaitisme§!."
 FRW_continue_the_fight:0 "Poursuivre le combat"
 FRW_continue_the_fight_desc:0 "Un armistice signé à Bordeaux n'engage personne à Londres. Les Français libres déclarent que la guerre continue."
 FRW_continue_the_fight_tt:0 "La France déclare de nouveau la guerre à quiconque tient §YParis§! (si elle n'est plus en guerre contre lui) et rejoint la faction du §YRoyaume-Uni§! (s'il en dirige une).\nPrestige de la France libre : §G+5§!"
 FRW_free_french_forces:0 "Les Forces françaises libres"
 FRW_free_french_forces_desc:0 "Des légionnaires revenus de Narvik, des marins échappés de Brest et des tirailleurs coloniaux du Tchad forment le noyau d'une nouvelle armée."
 FRW_free_french_forces_tt:0 "§G+2§! usines militaires en exil (ateliers britanniques et coloniaux).\nPrestige de la France libre : §G+5§!"
 FRW_rally_the_colonies:0 "Rallier les colonies"
 FRW_rally_the_colonies_desc:0 "En août 1940, le Tchad, le Cameroun et le Moyen-Congo se sont ralliés à de Gaulle. Les autres gouverneurs sont invités à suivre."
 FRW_rally_the_colonies_tt:0 "§YRevendications§! sur chaque colonie française d'Afrique détenue par un autre pays, et un §Ybut de guerre§! contre chaque pays (hors de la faction de la France) qui en détient une.\nPrestige de la France libre : §G+10§!"
 FRW_lend_lease:0 "L'aide de Washington"
 FRW_lend_lease_desc:0 "Le prêt-bail de Roosevelt parvient aux Français libres par l'intermédiaire du Royaume-Uni : fusils, camions et uniformes."
 FRW_lend_lease_tt:0 "§G+3§! usines militaires en exil (production américaine du prêt-bail)."
 FRW_leclerc_column:0 "La colonne Leclerc"
 FRW_leclerc_column_desc:0 "En 1941, Leclerc traversa le Sahara depuis le Tchad et prit le fort italien de Koufra. Dans l'oasis, ses hommes jurèrent de ne déposer les armes qu'une fois le drapeau flottant sur Strasbourg."
 FRW_leclerc_column_tt:0 "Revendications sur le §YFezzan§! et la §YSyrte§! et un but de guerre contre l'§YItalie§! pour ces régions.\nPrestige de la France libre : §G+5§!"
 FRW_algiers_capital:0 "Alger, capitale de la France"
 FRW_algiers_capital_desc:0 "Les ministères s'installent dans les villas surplombant la baie d'Alger. Pour l'heure, c'est d'ici que la France est gouvernée."
 FRW_algiers_capital_tt:0 "§G+2§! usines civiles en exil.\nTransfère la capitale à §YAlger§! (ou à §YBrazzaville§! si la France ne tient pas l'Algérie)."
 FRW_the_resistance:0 "La Résistance"
 FRW_the_resistance_desc:0 "Jean Moulin est parachuté en Provence pour unifier les mouvements de résistance. Cheminots, étudiants et communistes commencent à saboter l'occupant."
 FRW_brazzaville_conference:0 "La conférence de Brazzaville"
 FRW_brazzaville_conference_desc:0 "De Gaulle promet aux colonies une place nouvelle dans la communauté française après la guerre. En retour, l'Afrique lui fournit des hommes et des matières premières."
 FRW_brazzaville_conference_tt:0 "Chaque région possédée en §YAfrique§! : §G+10 %§! de conformité.\nPrestige de la France libre : §G+10§!"
 FRW_mobilise_the_empire:0 "Mobiliser l'Empire"
 FRW_mobilise_the_empire_desc:0 "Des usines sont improvisées à Casablanca et à Dakar, et les chemins de fer du Maghreb tournent jour et nuit."
 FRW_mobilise_the_empire_tt:0 "§G+2§! usines militaires en exil."
 FRW_army_of_africa_marches:0 "L'armée d'Afrique en marche"
 FRW_army_of_africa_marches_desc:0 "Réarmée par les Américains après la Tunisie, l'armée d'Afrique est nécessaire en Italie et en Provence."
 FRW_eurafrican_federation_focus:0 "La Fédération eurafricaine"
 FRW_eurafrican_federation_focus_desc:0 "Paris étant occupé, l'Empire, c'est la France. Alger propose d'unir l'Europe et l'Afrique en une seule fédération, pour toute la durée de la guerre et peut-être au-delà."
 FRW_eurafrican_federation_focus_tt:0 "Facultatif – exclut §YLe Gouvernement provisoire§!.\nForme la §YFédération eurafricaine§! : nouveaux nom et drapeau, esprit national et §Gterritoires nationaux sur l'Afrique du Nord française, Dakar et les départements d'outre-mer§! que possède la France (y compris plus tard) et §Yrevendications§! sur le reste de ces territoires.\nRemplace toute nation formée auparavant par la France (son esprit de nation formable est retiré). Si la France est déjà le §YRoyaume éternel de Francia§!, elle le reste.\nNécessite le contrôle d'une capitale en Afrique – §YAlger§!, §YDakar§!, §YBrazzaville§! ou le §YTchad§! (ralliez-les grâce aux décisions §YFrance libre§!). Si la France n'en tient encore aucune, la nation est fondée automatiquement dès qu'elle en tient une."
 FRW_provisional_government:0 "Le Gouvernement provisoire"
 FRW_provisional_government_desc:0 "Les Français libres forment le Gouvernement provisoire de la République française. Il promet des élections et une nouvelle constitution dès que le pays sera libéré."
 FRW_provisional_government_tt:0 "Facultatif – exclut §YLa Fédération eurafricaine§!. La France reste la France et conserve la République."
 FRW_liberation_of_paris:0 "La libération de Paris"
 FRW_liberation_of_paris_desc:0 "Les cloches de Notre-Dame sonnent pour la première fois depuis quatre ans. Le gouvernement regagne la capitale."
 FRW_liberation_of_paris_tt:0 "Les Forces françaises de l'intérieur rejoignent l'armée : §G+50 000§! de main-d'œuvre.\nNécessite le contrôle de §YParis§!. Paris redevient française et la capitale y est rétablie."
 FRW_ff_chequers:0 "L'accord de Chequers"
 FRW_ff_chequers_desc:0 "Churchill et de Gaulle signent un accord : le Royaume-Uni paiera, armera et ravitaillera les Français libres, et la France conservera son indépendance de commandement."
 FRW_ff_chequers_tt:0 "§G+1§! usine militaire en exil.\nPrestige de la France libre : §G+5§!"
 FRW_ff_national_committee:0 "Le Comité national français"
 FRW_ff_national_committee_desc:0 "À Londres, les services épars de la France libre deviennent un véritable gouvernement, avec des commissaires à la Guerre, aux Finances, aux Affaires étrangères et aux Colonies."
 FRW_ff_national_committee_tt:0 "Prestige de la France libre : §G+5§!"
 FRW_ff_bcra:0 "Le BCRA"
 FRW_ff_bcra_desc:0 "Le colonel Passy met sur pied le Bureau central de renseignements et d'action. Ses agents dirigent des réseaux de la Bretagne à Marseille."
 FRW_ff_cnr:0 "Le Conseil national de la Résistance"
 FRW_ff_cnr_desc:0 "Dans un appartement de la rue du Four, les mouvements, partis et syndicats de la Résistance se réunissent pour la première fois sous une direction unique."
 FRW_ff_cnr_tt:0 "Chaque région française occupée en Europe : résistance §G+15§!.\nPrestige de la France libre : §G+10§!"
 FRW_ff_first_division:0 "La 1re division française libre"
 FRW_ff_first_division_desc:0 "Légionnaires, fusiliers marins, infanterie coloniale et volontaires venus des quatre coins de l'Empire sont réunis en une seule division."
 FRW_ff_bir_hakeim:0 "Bir Hakeim"
 FRW_ff_bir_hakeim_desc:0 "Pendant seize jours, la brigade de Koenig tient un fort en ruine dans le désert libyen face aux chars de Rommel. Le monde apprend que les Français se battent de nouveau."
 FRW_ff_bir_hakeim_tt:0 "Prestige de la France libre : §G+5§!"
 FRW_ff_second_armoured:0 "La 2e division blindée"
 FRW_ff_second_armoured_desc:0 "Les vétérans du désert de Leclerc sont rééquipés au Maroc de chars Sherman et de half-tracks américains."
 FRW_ff_fafl:0 "Les Forces aériennes françaises libres"
 FRW_ff_fafl_desc:0 "Quelques centaines de pilotes et de mécaniciens échappés de France volent avec la Royal Air Force sous leur propre cocarde."
 FRW_ff_groupe_lorraine:0 "Le groupe Lorraine"
 FRW_ff_groupe_lorraine_desc:0 "Des équipages de bombardiers français formés au Royaume-Uni et en Syrie constituent leur propre groupe et mènent des raids en Boston contre des objectifs en France et aux Pays-Bas."
 FRW_ff_normandie_niemen:0 "Normandie-Niémen"
 FRW_ff_normandie_niemen_desc:0 "Une escadrille de pilotes de chasse français part combattre sur le front de l'Est, aux commandes de Yak soviétiques face à la Luftwaffe."
 FRW_ff_fnfl:0 "Les Forces navales françaises libres"
 FRW_ff_fnfl_desc:0 "L'amiral Muselier rassemble les navires réfugiés dans les ports britanniques, du sous-marin Surcouf à une poignée de chalutiers."
 FRW_ff_corvettes:0 "Des corvettes britanniques"
 FRW_ff_corvettes_desc:0 "L'Amirauté prête des corvettes de classe Flower à la marine de la France libre. Elles escortent les convois de l'Atlantique."
 FRW_ff_corvettes_tt:0 "§G+1§! chantier naval en exil."
 FRW_ff_richelieu:0 "Le Richelieu reprend le combat"
 FRW_ff_richelieu_desc:0 "Le grand cuirassé, resté endommagé à Dakar, appareille pour New York afin d'y être réparé, puis retourne à la guerre sous les trois couleurs."
 FRW_ff_richelieu_tt:0 "§G+2§! chantiers navals en exil (chantiers américains)."
 FRW_ff_maquis:0 "Le maquis"
 FRW_ff_maquis_desc:0 "Des jeunes gens fuyant le travail obligatoire en Allemagne gagnent les hauteurs du Vercors, du Limousin et des Alpes, où la Résistance les arme et les entraîne."
 FRW_ff_maquis_tt:0 "Chaque région française occupée en Europe : résistance §G+10§!.\nPrestige de la France libre : §G+5§!"
 FRW_ff_colonial_recruitment:0 "Le recrutement dans les colonies"
 FRW_ff_colonial_recruitment_desc:0 "Des bureaux de recrutement ouvrent de Dakar à Madagascar. Tirailleurs, goumiers et spahis formeront la moitié de l'armée qui libérera la France."
 FRW_ff_cfln:0 "Le Comité français de libération nationale"
 FRW_ff_cfln_desc:0 "À Alger, en juin 1943, les Français libres du général de Gaulle et l'armée d'Afrique du général Giraud se réunissent sous un comité unique, et leurs troupes sont fusionnées en une seule armée."
 FRW_ff_cfln_tt:0 "Prestige de la France libre : §G+10§!"
 FRW_ff_consultative_assembly:0 "L'Assemblée consultative"
 FRW_ff_consultative_assembly_desc:0 "Des délégués de la Résistance, des partis et de l'ancien Parlement se réunissent à Alger en novembre 1943. C'est la première assemblée à parler au nom de la France depuis 1940, bien que ses membres soient désignés et non élus."
 FRW_ff_cef:0 "Le Corps expéditionnaire français"
 FRW_ff_cef_desc:0 "Le corps du général Juin, composé de troupes de montagne et de divisions coloniales, enfonce la ligne allemande dans les montagnes d'Italie, là où d'autres avaient échoué."
 FRW_ff_dragoon:0 "Le débarquement de Provence"
 FRW_ff_dragoon_desc:0 "Deux cent mille soldats français débarquent entre Toulon et Saint-Raphaël et remontent la vallée du Rhône vers Lyon et les Vosges."
 FRW_ff_epuration:0 "L'Épuration"
 FRW_ff_epuration_desc:0 "Dans chaque département, des cours de justice spéciales jugent les personnes accusées de collaboration."
 FRW_ff_votes_for_women:0 "Le vote des femmes"
 FRW_ff_votes_for_women_desc:0 "Par l'ordonnance d'Alger d'avril 1944, les Françaises obtiennent le droit de vote et d'éligibilité."
 FRW_ff_securite_sociale:0 "La Sécurité sociale"
 FRW_ff_securite_sociale_desc:0 "Conformément au programme de la Résistance, chaque travailleur est assuré contre la maladie, la vieillesse et les accidents du travail."
 FRW_ff_securite_sociale_tt:0 "Inflation : §R+5§!"
 FRW_ff_reconstruction:0 "La reconstruction de la France"
 FRW_ff_reconstruction_desc:0 "Ponts, voies ferrées, ports et villes entières gisent en ruine. Le ministère de la Reconstruction se met à l'ouvrage."
 FRW_ff_reconstruction_tt:0 "Inflation : §R+10§! (la reconstruction est financée à crédit)."
 FRW_ff_fourth_republic:0 "La IVe République"
 FRW_ff_fourth_republic_desc:0 "Une nouvelle constitution est approuvée par référendum. Le Gouvernement provisoire remet le pouvoir à une Assemblée élue."
 FRW_ff_fourth_republic_tt:0 "Nécessite §YLe Gouvernement provisoire§!."
 FRW_ff_eurafrican_assembly:0 "L'Assemblée eurafricaine"
 FRW_ff_eurafrican_assembly_desc:0 "Des députés de Dakar, d'Alger, de Brazzaville et de Paris siègent ensemble dans une même assemblée pour la première fois."
 FRW_ff_eurafrican_assembly_tt:0 "Nécessite §YLa Fédération eurafricaine§!.\nChaque région possédée en §YAfrique§! : §G+10 %§! de conformité."
 FRW_eternal_kingdom:0 "Le Royaume éternel de Francia"
 FRW_eternal_kingdom_desc:0 "Des Alpes à Gibraltar, de Brest aux Highlands et des Caraïbes à l'océan Indien, l'antique couronne est restaurée sous un amiral qui n'a jamais perdu de bataille en mer. La France devient le Royaume éternel de Francia."
 FRW_eternal_kingdom_tt:0 "Forme le §YRoyaume éternel de Francia§! : nouveau drapeau, couleur bleu foncé sur la carte, esprit national §YLe Royaume éternel§! et §Gterritoires nationaux sur les terres d'Espagne, du Portugal et des îles écossaises§! que possède la France (ainsi que sur celles qu'elle y acquerra plus tard) et §Yrevendications§! sur le reste.\nIl remplace toute nation formée auparavant – et ne pourra jamais être remplacé.\nMalo Kervadec meurt au début de cette priorité ; son fils §YAymeric Kervadec§! est couronné à son achèvement."
 FRW_qol_state_reform:0 "La Commission de la réforme de l'État"
 FRW_qol_state_reform_desc:0 "Les dossiers s'entassent dans chaque ministère, et un simple décret peut mettre des mois à franchir les bureaux de la IIIe République. Une commission de hauts fonctionnaires a été chargée de simplifier les procédures."
 FRW_qol_state_reform_tt:0 "Débloque le département §YPolitique§! du §YConseil des ministres§! (décisions)."
 FRW_qol_cabinet:0 "Un cabinet resserré"
 FRW_qol_cabinet_desc:0 "Le nombre de ministères est réduit et leurs attributions redéfinies, afin que le Conseil des ministres puisse prendre ses décisions plus rapidement."
 FRW_qol_cabinet_tt:0 "Débloque le département §YÉconomie§! du §YConseil des ministres§!."
 FRW_qol_staff_college:0 "L'École de guerre"
 FRW_qol_staff_college_desc:0 "L'École supérieure de guerre révise ses cours afin de préparer les jeunes officiers au commandement dans une guerre moderne."
 FRW_qol_staff_college_tt:0 "Débloque le département §YArmée§! du §YConseil des ministres§!."
 FRW_qol_logistics:0 "Le Bureau de la logistique"
 FRW_qol_logistics_desc:0 "Un bureau unique à Paris planifie désormais l'emploi des chemins de fer, des camions et des dépôts de ravitaillement pour toute l'armée."
 FRW_qol_standards:0 "Un équipement normalisé"
 FRW_qol_standards_desc:0 "Les usines d'armement reçoivent l'ordre de travailler selon des normes communes, afin que fusils, obus et pièces de rechange conviennent à l'équipement de chaque régiment."
 FRW_qol_research_council:0 "Le Conseil supérieur de la recherche"
 FRW_qol_research_council_desc:0 "Un conseil de savants est rattaché à la présidence du Conseil, sur le modèle du sous-secrétariat d'État à la Recherche qu'occupait Irène Joliot-Curie en 1936."
 FRW_qol_research_council_tt:0 "Débloque le département §YRecherche§! du §YConseil des ministres§!."
 FRW_qol_special_projects:0 "La Direction des projets spéciaux"
 FRW_qol_special_projects_desc:0 "Les fusées, les moteurs à réaction et l'atome sont trop importants pour être laissés aux ateliers privés. Une direction du ministère de l'Armement les prend en charge."
 FRW_qol_special_projects_tt:0 "Débloque le département §YProjets spéciaux§! du §YConseil des ministres§!."
 FRW_qol_deuxieme_bureau:0 "Réorganiser le Deuxième Bureau"
 FRW_qol_deuxieme_bureau_desc:0 "Le service de renseignement militaire et sa section de contre-espionnage reçoivent de nouveaux crédits, de nouveaux bureaux et une ligne directe avec le gouvernement."
 FRW_qol_deuxieme_bureau_tt:0 "Débloque le département §YAgence de renseignement§! du §YConseil des ministres§!."
 FRW_qol_modern_state:0 "L'État moderne"
 FRW_qol_modern_state_desc:0 "Après des années de réformes, un décret parvient aux préfectures en quelques semaines plutôt qu'en quelques mois."
 FRW_rhine_question:0 "La question du Rhin"
 FRW_rhine_question_desc:0 "Poincaré occupa la Ruhr en 1923 et soutint les séparatistes rhénans, et la Sarre resta sous l'autorité de la Société des Nations, ses mines aux mains de la France, jusqu'en 1935. Beaucoup à Paris estiment encore que la sécurité de la France dépend du Rhin."
 FRW_demand_the_saar:0 "Exiger la Sarre"
 FRW_demand_the_saar_desc:0 "Paris qualifie désormais le plébiscite de janvier 1935 de simulacre organisé sous la pression nazie et exige le rattachement de la Sarre à la France."
 FRW_rhenish_republic:0 "La République rhénane"
 FRW_rhenish_republic_desc:0 "Les séparatistes de 1923 ont échoué faute de soutien. La France entend désormais apporter ce soutien à la Rhénanie et la placer sous contrôle français."
 FRW_pyrenees_question:0 "La question des Pyrénées"
 FRW_pyrenees_question_desc:0 "À Barcelone, les ouvriers livrent le même combat que leurs camarades de Paris. Une France rouge n'a nullement l'intention de répéter la politique de non-intervention de Blum."
 FRW_demand_catalonia:0 "La Commune catalane"
 FRW_demand_catalonia_desc:0 "La CNT et le POUM tiennent Barcelone. Paris propose que la Catalogne, annexée à la France sous Napoléon en 1812, rejoigne la république ouvrière française."
 FRW_iberian_protectorate:0 "Une Ibérie soviétique"
 FRW_iberian_protectorate_desc:0 "Paris n'abandonnera pas l'Espagne à Franco. Le projet est de faire de toute la péninsule une république sœur guidée depuis Paris."
 FRW_alpine_question:0 "La question alpine"
 FRW_alpine_question_desc:0 "On parle français à Genève, en Valais et dans la vallée d'Aoste, tandis que Rome revendique Nice et la Savoie. Les ligues veulent que la France cesse de céder du terrain dans les Alpes et reprenne ce qu'elles estiment français."
 FRW_demand_romandy:0 "Exiger la Romandie"
 FRW_demand_romandy_desc:0 "Les ligues réclament pour la France Genève, Lausanne et le reste de la Suisse francophone."
 FRW_demand_aosta_nice:0 "Exiger le Piémont et la vallée d'Aoste"
 FRW_demand_aosta_nice_desc:0 "La maison de Savoie tire son nom de terres situées du côté français des Alpes. Paris revendique désormais le Piémont et la vallée d'Aoste."
 FRW_swiss_anschluss:0 "Union avec la Suisse"
 FRW_swiss_anschluss_desc:0 "Depuis des siècles, la neutralité suisse repose sur ses montagnes et sa milice. Paris n'entend plus la respecter."
 FRW_corsica_and_sardinia:0 "Corse et Sardaigne"
 FRW_corsica_and_sardinia_desc:0 "La Sardaigne ne se trouve qu'à quelques milles au sud de la Corse, de l'autre côté des bouches de Bonifacio. Paris soutient que les deux îles doivent être gouvernées ensemble."
 FRW_latin_destiny:0 "Un destin latin"
 FRW_latin_destiny_desc:0 "La France, l'Italie et l'Espagne partagent l'héritage de Rome. À elles trois, elles tiennent l'essentiel des côtes de la Méditerranée occidentale, de Gibraltar à la Sicile."
 FRW_latin_destiny_tt:0 "§GTerritoire national§! en §YSardaigne§! (si la France la possède)."
 FRW_benelux_question:0 "L'héritage bourguignon"
 FRW_benelux_question_desc:0 "Louise d'Orléans fut la première reine des Belges, et les Pays-Bas formaient jadis le cœur des États bourguignons. Un roi de France peut faire valoir d'anciennes prétentions et des liens familiaux à Bruxelles et à Luxembourg."
 FRW_union_with_luxembourg:0 "Union avec le Luxembourg"
 FRW_union_with_luxembourg_desc:0 "Coincé entre la France et l'Allemagne, le grand-duché a peu de chances de tenir seul. Paris lui propose l'union."
 FRW_demand_wallonia:0 "Exiger la Wallonie"
 FRW_demand_wallonia_desc:0 "Paris exige que les provinces francophones du sud de la Belgique soient rendues à la France."
 FRW_belgian_union:0 "Union avec la Belgique"
 FRW_belgian_union_desc:0 "La Belgique fit partie de la France de 1795 à 1814. On demande aujourd'hui à Bruxelles si elle souhaite redevenir française."
 FRW_batavian_union:0 "Union avec les Pays-Bas"
 FRW_batavian_union_desc:0 "En 1810, Napoléon annexa le royaume de Hollande à la France. Paris entend désormais faire de même."
 FRW_batavian_union_tt:0 "Si les §YPays-Bas§! sont indépendants, ils reçoivent une demande d'union (acceptation = annexion). S'ils sont un État fantoche de la France, celle-ci les annexe.\nFonde le §YRoyaume de Bourgogne§! : nouveau nom et nouveau drapeau, esprit national et §Gterritoire national sur les terres de Belgique, des Pays-Bas et du Luxembourg§! que possède la France (ainsi que sur celles qu'elle y acquerra plus tard) et §Yrevendications§! sur le reste.\nRemplace toute nation formée auparavant par la France (son esprit de nation formable est retiré). Si la France est déjà le §YRoyaume éternel de Francia§!, elle le reste.\nNécessite le contrôle de l'ensemble de la §YBelgique§!, des §YPays-Bas§! et du §YLuxembourg§! (annexés, et non en tant qu'États fantoches). Si la France ne les contrôle pas encore, la nation est fondée automatiquement dès que ce sera le cas."
 FRW_reunions_complete:0 "Le royaume bourguignon restauré"
 FRW_reunions_complete_desc:0 "Les anciennes terres bourguignonnes, des Flandres au Luxembourg, sont de nouveau réunies sous la couronne de France."
