 frw_sys.22.d:0 "Alger, Oran, Casablanca et Tunis se sont ralliées. L'armée d'Afrique, forte de cent mille hommes, reprend le combat."
 frw_sys.22.a:0 "Vive la France libre !"
 frw_sys.32.t:0 "L'Afrique du Nord française reste fidèle à Vichy"
 frw_sys.32.d:0 "Le général Weygand fait arrêter les conjurés d'Alger. L'Afrique du Nord reste aux côtés du Maréchal. La prochaine fois, nos émissaires seront mieux préparés."
