 FRW_adv_mandel:0 "Georges Mandel"
 FRW_adv_mandel_desc:0 "Georges Mandel a appris la politique aux côtés de Clemenceau et a gardé l'implacabilité de son maître. Ministre des Colonies, il projette de lever outre-mer une armée d'un demi-million d'hommes. La France, aime-t-il à dire, est une nation de 110 millions d'habitants."
 FRW_trait_mandel:0 "Intransigeant colonial"
 FRW_trait_mandel_desc:0 "L'ancien bras droit de Clemenceau, aujourd'hui ministre des Colonies et la voix la plus forte contre l'apaisement."
 FRW_dec_appoint_mandel:0 "Nommer Georges Mandel"
 FRW_dec_appoint_mandel_desc:0 "Georges Mandel a appris la politique aux côtés de Clemenceau et a gardé l'implacabilité de son maître. Ministre des Colonies, il projette de lever outre-mer une armée d'un demi-million d'hommes. La France, aime-t-il à dire, est une nation de 110 millions d'habitants."
