 FRW_adv_ybarnegaray:0 "Jean Ybarnégaray"
 FRW_adv_ybarnegaray_desc:0 "Jean Ybarnégaray siège à la Chambre depuis 1914 et y parle au nom des Croix-de-Feu. Ancien combattant et sportif, il donne au mouvement le visage respectable dont il a besoin pour rallier la province."
