 FRW_adv_marty:0 "André Marty"
 FRW_adv_marty_desc:0 "André Marty a mené la mutinerie de la flotte française en mer Noire en 1919 et n'a jamais cessé d'être un révolutionnaire. Moscou lui fait confiance ; ses volontaires le craignent. Sous son commandement, les Brigades internationales seront organisées et soumises à une discipline rigoureuse."
 FRW_trait_marty:0 "Commissaire des Brigades"
 FRW_trait_marty_desc:0 "Le mutin de la flotte de la mer Noire de 1919, aujourd'hui secrétaire du Komintern."
