 FRW_mio_brest_req_tt:0 "A achevé la priorité nationale §Y$FRW_darlan_programme$§!"
 FRW_citroen_organization:0 "Citroën"
 FRW_citroen_organization_initial:0 "Chaînes de montage du quai de Javel"
 FRW_brandt_organization:0 "Edgar Brandt"
 FRW_brandt_organization_initial:0 "Ateliers de mortiers de Châtillon"
 FRW_hispano_organization:0 "Hispano-Suiza"
 FRW_hispano_organization_initial:0 "Usine de canons de Bois-Colombes"
 FRW_european_research_name:0 "Conseil européen de la recherche de défense"
 FRW_european_research_desc:0 "Les laboratoires et les états-majors des partenaires européens mettent leurs résultats en commun au sein d'un conseil siégeant à Paris."
 FRW_latin_research_name:0 "Conseil scientifique latin"
 FRW_latin_research_desc:0 "Les universités et les arsenaux des nations latines échangent ingénieurs, brevets et résultats."
 FRW_join_european_research_tt:0 "La France et ses partenaires de faction rejoignent le §YConseil européen de la recherche de défense§! (partage technologique)."
 FRW_join_latin_research_tt:0 "La France et ses partenaires de faction rejoignent le §YConseil scientifique latin§! (partage technologique)."
 FRW_trait_army_of_africa:0 "Armée d'Afrique"
 FRW_trait_army_of_africa_desc:0 "Des années passées au Sahara et dans le Rif lui ont appris à ravitailler une armée loin de toute voie ferrée."
 FRW_trait_ecole_de_guerre:0 "Professeur à l'École de guerre"
 FRW_trait_ecole_de_guerre_desc:0 "Il a enseigné à toute une génération d'officiers d'état-major l'art de préparer une bataille méthodique."
 FRW_trait_armoured_pioneer:0 "Pionnier de la division cuirassée"
 FRW_trait_armoured_pioneer_desc:0 "Il a plaidé pour une division cuirassée française bien avant que l'état-major n'en veuille une."
 FRW_trait_alpine_school:0 "École de guerre en montagne"
 FRW_trait_alpine_school_desc:0 "Il a entraîné ses chasseurs sur les glaciers des Alpes et dans les fjords du Nord."
 frw_war.1.t:0 "L'ennemi entre dans Paris"
 frw_war.1.d:0 "Ce matin, des colonnes de troupes [ROOT.GetAdjective] ont descendu les Champs-Élysées. Le gouvernement avait déjà quitté la capitale, et la ville avait été déclarée ouverte pour lui épargner la destruction. Peu de Parisiens ont regardé le défilé ; la plupart ont gardé leurs volets clos."
 frw_war.1.a:0 "La France a perdu une bataille. Elle n'a pas perdu la guerre."
 frw_war.1.b:0 "Paris est à nous !"
 frw_war.1.c:0 "La Ville Lumière s'éteint."
 frw_war.2.t:0 "Paris libéré"
 frw_war.2.d:0 "Les cloches de Notre-Dame ont sonné sur la ville tandis que les troupes françaises entraient dans Paris. Après la longue occupation, la foule a envahi les rues de la porte d'Orléans à l'Hôtel de Ville."
 frw_war.2.a:0 "Paris outragé ! Paris brisé ! mais Paris libéré !"
 frw_war.2.b:0 "Vive la France !"
 RULE_FRW_SECRET_PATHS:0 "France Rework : voies secrètes"
 RULE_FRW_SECRET_PATHS_ENABLED:0 "Activées"
 RULE_FRW_SECRET_PATHS_ENABLED_DESC:0 "La France peut débloquer les voies secrètes : le capitaine corsaire de Saint-Malo (sa flotte, les raids sur les îles et le royaume ibérique) en patientant après « Ajourner les Chambres », les syndicalistes révolutionnaires de la CGT en maintenant l'occupation des usines, et les néo-socialistes de Marcel Déat en leur prêtant l'oreille."
 RULE_FRW_SECRET_PATHS_DISABLED:0 "Désactivées (recommandé en multijoueur compétitif)"
 RULE_FRW_SECRET_PATHS_DISABLED_DESC:0 "Les décisions qui débloquent les voies secrètes n'apparaissent jamais : ni capitaine, ni voie de la CGT, ni voie Déat. Seules les voies politiques normales sont jouables."
 FRW_leader_deat:0 "Marcel Déat"
 FRW_leader_deat_desc:0 "Normalien et ancien combattant, Marcel Déat passait autrefois pour le dauphin de Blum. En 1933, il a rompu avec la SFIO et fondé les néo-socialistes, qui veulent une économie planifiée, un État fort et la paix presque à tout prix."
 FRW_leader_deat_fascist_desc:0 "Marcel Déat a rompu avec la démocratie parlementaire. Son Rassemblement national populaire veut un parti unique, un Front du travail corporatiste et une Europe socialiste et nationale."
 FRW_leader_besnard:0 "Pierre Besnard"
 FRW_leader_besnard_desc:0 "Cheminot angevin, Pierre Besnard a dirigé les syndicalistes révolutionnaires de la CGT-SR et a été secrétaire de l'Association internationale des travailleurs. Pour lui, ce sont les syndicats, et non un parti, qui doivent diriger la société nouvelle."
 FRW_SYNDIC:0 "France syndicaliste"
 FRW_SYNDIC_DEF:0 "la France syndicaliste"
 FRW_SYNDIC_ADJ:0 "syndicaliste"
 FRW_new_europe_faction:0 "Ordre européen nouveau"
 FRW_backer_deat_req:0 "A obtenu le soutien de §YMarcel Déat§!"
 FRW_backer_besnard_req:0 "A obtenu le soutien de §YPierre Besnard§!"
 FRW_dec_hear_the_neos:0 "Écouter les néo-socialistes"
 FRW_dec_hear_the_neos_desc:0 "Marcel Déat et les néo-socialistes exclus de la SFIO tiennent leurs réunions salle Wagram. Y envoyer quelqu'un pour les écouter ne coûte pas grand-chose, et ils ont sur l'État des idées que personne d'autre à la Chambre n'ose formuler à voix haute."
 FRW_dec_backer_deat:0 "Rallier Marcel Déat"
 FRW_dec_backer_deat_desc:0 "Les pourparlers avec Marcel Déat et les néo-socialistes durent environ six semaines. On ne peut courtiser qu'un seul dirigeant de ce camp à la fois.\n\nNécessite §Y45%§! de soutien au parti et §Y30%§! de stabilité. Une voie cachée s'ouvre ensuite dans l'arbre de priorités nationales, à la place des voies de Blum et de Reynaud."
 FRW_dec_occupy_factories:0 "Maintenir l'occupation des usines"
 FRW_dec_occupy_factories_desc:0 "Les grévistes refusent de partir. Des drapeaux rouges pendent aux grilles des usines, et les sections syndicales tiennent les cantines et les rondes de nuit. Chaque mois d'occupation rend la CGT plus audacieuse."
 FRW_dec_backer_besnard:0 "Rallier Pierre Besnard"
 FRW_dec_backer_besnard_desc:0 "Les pourparlers avec Pierre Besnard et les syndicalistes révolutionnaires durent environ six semaines. On ne peut courtiser qu'un seul dirigeant de ce camp à la fois.\n\nNécessite §Y35%§! de soutien au parti et §Y30%§! de stabilité. Une voie cachée s'ouvre ensuite dans l'arbre de priorités nationales, à la place des voies de Thorez et de Pivert."
 frw_sp.1.t:0 "La Charte d'Amiens"
 frw_sp.1.d:0 "Trois mois plus tard, les usines sont toujours occupées. Une délégation de syndicalistes révolutionnaires se présente au ministère avec un exemplaire de la Charte d'Amiens de 1906, une phrase soulignée : le syndicat, aujourd'hui groupement de résistance, sera dans l'avenir le groupement de production et de répartition.\n\nLeur porte-parole, un cheminot nommé Pierre Besnard, ne mâche pas ses mots. « Les ouvriers n'ont pas besoin d'un nouveau maître à l'Hôtel de Ville, rouge ou non. Ils ont besoin de leurs syndicats. Laissez les usines à ceux qui y travaillent, et la France se gouvernera elle-même. »\n\n§GUne nouvelle décision est disponible : Rallier Pierre Besnard.§!"
 frw_sp.1.a:0 "Que les syndicats parlent."
 frw_sp.2.t:0 "Ordre, autorité, nation"
 frw_sp.2.d:0 "La salle Wagram est comble. À la tribune, Marcel Déat répète le mot d'ordre qui a coûté aux néo-socialistes leur place à la SFIO : le socialisme ne vaincra que s'il fait siens l'ordre, l'autorité et la nation, au lieu de les abandonner aux ligues.\n\nIl reçoit ensuite notre émissaire. « Blum veut attendre la révolution, et la droite ne veut rien attendre du tout. Je propose un Plan et un État assez fort pour l'appliquer. Dites au gouvernement que les néo-socialistes sont prêts à servir. »\n\n§GUne nouvelle décision est disponible : Rallier Marcel Déat.§!"
 frw_sp.2.a:0 "La République a besoin d'une main ferme."
 frw_sp.3.t:0 "Déat fonde le parti unique"
 frw_sp.3.d:0 "À Paris, Marcel Déat a fermé la Chambre et proclamé le Rassemblement national populaire seul parti de France. D'anciens socialistes défilent aux côtés de vétérans des ligues au nom d'une révolution nationale et populaire. Déat parle d'une Europe nouvelle, et les autres capitales se demandent dans quelle direction il entend l'entraîner."
 frw_sp.3.a:0 "Encore un socialiste devenu dictateur."
 frw_sp.3.b:0 "Ni droite ni gauche : la France !"
 FRW_franc_below_40_tt:0 "L'inflation est inférieure à §Y40%§!"
 FRW_strong_franc_desc:0 "Le crédit est bon marché et le franc inspire de nouveau confiance. Les chantiers rouvrent dans tout le pays."
 FRW_war_finance_desc:0 "Emprunts de guerre, impôts et contrôle des prix financent la guerre."
 FRW_colonial_administration:0 "Administration coloniale"
 FRW_colonial_administration_tt:0 "Chaque région de cette zone possédée par la France (hors territoire national et pas encore administrée) reçoit §YAdministration coloniale§! : davantage de main-d'œuvre recrutable et §G+15%§! de ressources."
 FRW_colonial_administration_all_tt:0 "L'§YAlgérie§!, les §YAntilles§!, la §YGuyane française§! et §YLa Réunion§! deviennent des §Gterritoires nationaux§! (départements d'outre-mer).\nChaque autre région d'§YAfrique§! possédée par la France reçoit §YAdministration coloniale§! : davantage de main-d'œuvre recrutable et §G+15%§! de ressources."
 FRW_free_caribbean:0 "Libérer les Antilles et la Guyane"
 FRW_free_caribbean_desc:0 "Les îles des plantations des Caraïbes et le bagne de Guyane sont rendus à leurs propres peuples.\n\nLes libère en tant que §Ysatellites communistes§! (uniquement là où la France détient leurs terres) et renforce §YPeuples frères§!."
