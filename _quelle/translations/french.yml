 frw_sys.24.t:0 "Madagascar et l'océan Indien se rallient à la France libre"
 frw_sys.24.d:0 "Le gouverneur de Tananarive a remis l'île. L'océan Indien est fermé à l'Axe."
 frw_sys.24.a:0 "Vive la France libre !"
 frw_sys.34.t:0 "Madagascar et l'océan Indien restent fidèles à Vichy"
 frw_sys.34.d:0 "La garnison de Diego-Suarez tient bon. Madagascar reste fidèle à Vichy. La prochaine fois, nos émissaires seront mieux préparés."
 frw_sys.34.a:0 "Nous essaierons de nouveau."
