 FRW_dec_fort_meuse:0 "Fermer la trouée de la Meuse"
 FRW_dec_fort_meuse_desc:0 "L'état-major juge les Ardennes infranchissables. Les sapeurs de la 2e armée en sont moins sûrs et réclament des casemates sur la Meuse entre Sedan et Montmédy."
 FRW_dec_fort_nord:0 "Fortifier la frontière du Nord"
 FRW_dec_fort_nord_desc:0 "De Dunkerque à Maubeuge, la frontière belge est ouverte. Une ligne de blockhaus et de fossés antichars doit suivre les canaux."
 FRW_dec_fort_alps:0 "Le secteur fortifié des Alpes"
 FRW_dec_fort_alps_desc:0 "Des forts dominant les cols de la Maurienne et de la Tinée peuvent arrêter toute armée qui tenterait de franchir les Alpes."
 FRW_dec_fort_pyrenees:0 "Veille sur les Pyrénées"
 FRW_dec_fort_pyrenees_desc:0 "La guerre d'Espagne pourrait déborder par-delà les montagnes. Quelques points d'appui gardent les cols et la route côtière au Perthus."
 FRW_dec_fort_mareth:0 "La ligne Mareth"
 FRW_dec_fort_mareth_desc:0 "Entre la mer et les monts des Matmata, au sud de Gabès, une ligne de blockhaus barre la route de la Libye italienne vers la Tunisie."
 FRW_dec_fort_coast:0 "Batteries côtières de Brest et de Toulon"
 FRW_dec_fort_coast_desc:0 "De nouvelles batteries lourdes et des canons antiaériens protègent les deux grandes bases navales de la République."
 FRW_dec_fort_paris_aa:0 "Défense aérienne de Paris"
 FRW_dec_fort_paris_aa_desc:0 "Projecteurs, postes d'écoute et batteries antiaériennes ceinturent la capitale, et une nouvelle station radar surveille le ciel du nord."
 FRW_dec_fort_corsica:0 "Fortifier la Corse"
 FRW_dec_fort_corsica_desc:0 "Ajaccio et Bastia sont à portée de la flotte italienne. Des canons côtiers et une petite garnison assurent la défense de l'île."
 FRW_frontier_cat:0 "Défense des frontières"
 FRW_frontier_cat_desc:0 "La ligne Maginot ne couvre qu'une partie de la France. Ces ouvrages comblent les brèches qui subsistent au nord, dans les Alpes, sur les Pyrénées et outre-mer. Chaque chantier demande quelques semaines."
 FRW_dec_war_taxis:0 "Réquisitionner les taxis de Paris"
 FRW_dec_war_taxis_desc:0 "En 1914, les taxis de Paris ont porté une division jusqu'à la Marne. Chaque camion, autobus et voiture de la région parisienne est désormais réquisitionné."
 FRW_dec_war_reserves:0 "Rappeler les classes de réserve"
 FRW_dec_war_reserves_desc:0 "Les classes les plus anciennes, libérées depuis des années, sont rappelées sous les drapeaux."
 FRW_dec_war_arsenals:0 "Ouvrir les arsenaux de 1918"
 FRW_dec_war_arsenals_desc:0 "Les dépôts renferment encore des fusils et des canons de la dernière guerre. Vieux, mais mieux que rien."
 FRW_dec_war_gold:0 "Envoyer l'or à Dakar"
 FRW_dec_war_gold_desc:0 "Les croiseurs de la Marine peuvent mettre les réserves de la Banque de France hors de portée de l'ennemi. Quoi qu'il arrive à Paris, l'État ne fera pas faillite."
 FRW_dec_war_loire:0 "Se replier derrière la Loire"
 FRW_dec_war_loire_desc:0 "Si le front ne peut être tenu, l'armée ne doit pas être anéantie. Elle se replie en bon ordre jusqu'au fleuve suivant et s'y retranche à nouveau."
 FRW_patrie_cat:0 "La Patrie en danger"
 FRW_gold_safe_tt:0 "Les réserves d'or sont à l'abri : si la France capitule, la §YFrance libre§! pourra encore en disposer."
 FRW_patrie_cat_desc:0 "L'ennemi foule le sol français. Chacune de ces mesures d'urgence ne peut être prise qu'une seule fois, alors choisissez bien le moment."
 FRW_invaded_tt:0 "Un ennemi occupe une partie de la §YFrance métropolitaine§!"
 FRW_gold_abroad_desc:0 "Les réserves de la Banque de France sont à l'abri en Afrique occidentale. Le gouvernement peut continuer à payer ses soldats et ses fournisseurs."
 FRW_line_of_the_loire_desc:0 "L'armée a rompu le contact et s'est retranchée le long du fleuve. Elle n'attaquera pas, mais elle ne sera pas facile à déloger non plus."
 FRW_dewoitine_organization:0 "Dewoitine"
 FRW_dewoitine_organization_initial:0 "Bureau d'études de Toulouse"
 FRW_potez_organization:0 "Potez"
 FRW_potez_organization_initial:0 "Usines de Méaulte"
 FRW_breguet_organization:0 "Breguet"
