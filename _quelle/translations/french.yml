 FRW_political_cat:0 "Affaires intérieures"
 FRW_political_cat_desc:0 "Mesures visant à stabiliser la France à l'intérieur et à mieux la préparer à la guerre."
 FRW_dec_national_rally:0 "Rassemblement national"
 FRW_dec_national_rally_desc:0 "De grands rassemblements publics sont organisés dans les principales villes pour rallier l'opinion au gouvernement."
 FRW_dec_war_propaganda:0 "Campagne pour la défense nationale"
 FRW_dec_war_propaganda_desc:0 "Affiches, actualités filmées et émissions de TSF préparent l'opinion à l'éventualité d'une guerre."
 FRW_dec_colonial_recruitment:0 "Recruter dans l'Empire"
 FRW_dec_colonial_recruitment_desc:0 "Des bureaux de recrutement en Afrique du Nord et en Afrique occidentale enrôlent des volontaires pour l'armée."
 FRW_colonial_purchases_cat:0 "Achats coloniaux"
 FRW_colonial_purchases_cat_desc:0 "La France offre à d'autres puissances coloniales de l'or et un soutien politique en échange de territoires africains. Le vendeur se prononce sur chaque offre ; en multijoueur, il s'agit du joueur qui possède le territoire."
 FRW_buy_spanish_morocco:0 "Acheter le Maroc espagnol"
 FRW_buy_spanish_morocco_desc:0 "On offre à Madrid de l'or français en échange de la zone du Rif."
 FRW_buy_ifni_rio_de_oro:0 "Acheter Ifni et le Río de Oro"
 FRW_buy_ifni_rio_de_oro_desc:0 "Les territoires désertiques espagnols de la côte atlantique s'étendent entre le Maroc français et la Mauritanie."
 FRW_buy_spanish_guinea:0 "Acheter la Guinée espagnole"
 FRW_buy_spanish_guinea_desc:0 "Côté terre, le Río Muni est entièrement enclavé dans l'Afrique-Équatoriale française."
 FRW_buy_portuguese_guinea:0 "Acheter la Guinée portugaise"
 FRW_buy_portuguese_guinea_desc:0 "La colonie portugaise d'Afrique occidentale est presque entièrement entourée de territoires français."
 FRW_buy_gambia:0 "Acheter la Gambie"
 FRW_buy_gambia_desc:0 "L'étroite bande britannique qui longe le fleuve Gambie coupe le Sénégal en deux."
 FRW_buy_sierra_leone:0 "Acheter la Sierra Leone"
 FRW_buy_sierra_leone_desc:0 "Freetown offrirait à l'Afrique-Occidentale française un excellent port sur l'Atlantique."
 FRW_buy_belgian_congo:0 "Acheter une concession au Congo"
 FRW_buy_belgian_congo_desc:0 "On propose à Bruxelles des conditions pour céder une partie du Congo à la France."
 FRW_buy_fezzan:0 "Acheter le Fezzan"
 FRW_buy_fezzan_desc:0 "Le Fezzan, arrière-pays désertique de la Libye italienne, borde à la fois l'Algérie et le Tchad."
 FRW_union_francaise_cat:0 "L'Union française"
 FRW_union_francaise_cat_desc:0 "L'empire colonial est réorganisé en une union dans laquelle les protectorats de Tunisie et du Maroc deviennent des membres à part entière de la France."
 FRW_form_union_francaise:0 "Proclamer l'Union française"
 FRW_form_union_francaise_desc:0 "La Tunisie et le Maroc deviennent des territoires nationaux de la France."
 FRW_europe_cat:0 "Fédération européenne"
 FRW_europe_cat_desc:0 "Projets d'une Europe unie sous direction française, qu'elle soit démocratique ou socialiste."
 FRW_form_european_federation:0 "Fonder la Fédération européenne"
 FRW_form_european_federation_desc:0 "Le Benelux et la Rhénanie deviennent des territoires nationaux d'une fédération dirigée par la France."
 FRW_grand_empire_cat:0 "Le Grand Empire"
 FRW_grand_empire_cat_desc:0 "Restaurer l'Empire des Français dans les frontières qui étaient les siennes sous Napoléon."
 FRW_form_grand_empire:0 "Proclamer le Grand Empire"
 FRW_form_grand_empire_desc:0 "Le Benelux, la Rhénanie et le Piémont deviennent des territoires nationaux de l'Empire."
 FRW_francia_cat:0 "L'Empire franc"
 FRW_francia_cat_desc:0 "Depuis Aix-la-Chapelle, Charlemagne régnait sur les terres situées entre les Pyrénées et l'Elbe. La France se pose en son héritière légitime."
 FRW_form_francia:0 "Restaurer l'Empire de Charlemagne"
 FRW_form_francia_desc:0 "Nécessite le contrôle de la Belgique, de la Hollande, de la Rhénanie, de la Westphalie et du Bade. Ils deviennent des territoires nationaux."
 FRW_latin_cat:0 "L'Empire latin"
 FRW_latin_cat_desc:0 "Projets visant à unir la France, l'Italie et l'Espagne, héritières de Rome, sous une seule couronne ou un seul chef."
 FRW_form_latin_empire:0 "Proclamer l'Empire latin"
 FRW_form_latin_empire_desc:0 "Nécessite le contrôle de Rome, de Madrid et du Piémont. Tous les territoires nationaux italiens, espagnols et portugais que nous possédons deviennent nos territoires nationaux."
 FRW_eurafrique_cat:0 "La Fédération eurafricaine"
 FRW_eurafrique_cat_desc:0 "Projets visant à réunir l'Europe et l'Afrique en une seule fédération sous direction française."
 FRW_form_eurafrican_federation:0 "Fonder la Fédération eurafricaine"
 FRW_form_eurafrican_federation_desc:0 "Le Sahara, le Soudan français et la Guinée deviennent des territoires nationaux."
 frw.1.t:0 "La crise de la IIIe République"
 frw.1.d:0 "Depuis les émeutes du 6 février 1934, le pays ne connaît aucun répit. Les cabinets se font et se défont, les ligues défilent dans les rues, les communistes gagnent du terrain et l'économie stagne. Dans les salons comme dans les casernes, officiers et hommes politiques discutent ouvertement de ce qui devrait remplacer la République."
 frw.1.a:0 "Maintenir l'ordre public."
 frw.1.b:0 "Il faut agir avec résolution."
 frw.2.t:0 "La Commune est proclamée !"
 frw.2.d:0 "Le drapeau rouge flotte sur l'Hôtel de Ville. À Paris, les ouvriers, les soldats et le Parti communiste ont pris le pouvoir et installé un gouvernement socialiste à la place de la République. Les autres capitales européennes attendent la suite avec inquiétude."
 frw.2.a:0 "Un spectre hante l'Europe."
 frw.2.b:0 "Vive la Commune !"
 frw.3.t:0 "Révolution nationale en France"
 frw.3.d:0 "Après des semaines de troubles, les ligues unies ont renversé le gouvernement. La Chambre et le Sénat ont été dissous et un gouvernement national a pris le pouvoir."
 frw.3.a:0 "La France a changé."
 frw.3.b:0 "La France se réveille !"
 frw.4.t:0 "Les Chambres françaises ajournées"
 frw.4.d:0 "À la surprise générale, le gouvernement a ajourné la Chambre et le Sénat sine die. Un cabinet « au-dessus des partis » dirige désormais le pays, et l'on ignore encore quel régime remplacera la République."
 frw.4.a:0 "Et maintenant ?"
 frw.5.t:0 "L'Empire des Français !"
 frw.5.d:0 "Louis, prince Napoléon, a été sacré à Notre-Dame sous le nom de Napoléon VI, empereur des Français. La Garde a défilé sur les Champs-Élysées et les aigles ont retrouvé les drapeaux des régiments."
 frw.5.a:0 "L'histoire se répète."
 frw.5.b:0 "Vive l'Empereur !"
 frw.6.t:0 "Un roi à Paris"
 frw.6.d:0 "Henri d'Orléans, comte de Paris, est rentré d'exil et est monté sur le trône sous le nom d'Henri VI. Pour la première fois depuis 1848, la France a un roi."
 frw.6.a:0 "Intéressant."
 frw.6.b:0 "Vive le Roi !"
 frw.10.t:0 "La France demande à adhérer"
 frw.10.d:0 "Le gouvernement français a officiellement demandé à rejoindre notre alliance. La France apporte une armée nombreuse et une flotte puissante."
 frw.10.a:0 "Bienvenue, France."
 frw.10.b:0 "Nous refusons."
 frw.11.t:0 "Adhésion confirmée"
 frw.11.d:0 "Notre demande a été acceptée et la France a désormais des alliés à ses côtés."
 frw.11.a:0 "Excellent."
 frw.12.t:0 "Demande rejetée"
 frw.12.d:0 "Notre demande d'adhésion a été rejetée. La France devra se passer de cette alliance."
 frw.12.a:0 "Nous resterons donc seuls."
 frw.16.t:0 "Une offre d'alliance de Paris"
 frw.16.d:0 "La France a formé une nouvelle alliance et nous invite à la rejoindre."
 frw.16.a:0 "Nous la rejoignons."
 frw.16.b:0 "Nous restons indépendants."
 frw.17.t:0 "Offre d'alliance acceptée"
 frw.17.d:0 "[From.GetNameDefCap] a accepté notre offre et rejoint l'alliance."
 frw.17.a:0 "L'union fait la force."
 frw.18.t:0 "Offre d'alliance rejetée"
 frw.18.d:0 "[From.GetNameDefCap] a rejeté notre offre d'alliance."
 frw.18.a:0 "C'est regrettable."
 frw.20.t:0 "Une union franco-britannique ?"
 frw.20.d:0 "Paris propose une union des deux nations, avec des ministères communs de la Défense et de l'Économie, une citoyenneté commune et un cabinet de guerre unique."
 frw.20.a:0 "Une union indissoluble."
 frw.20.b:0 "Cela va trop loin."
 frw.21.t:0 "Londres accepte !"
 frw.21.d:0 "Le gouvernement britannique a accepté l'union, et les deux empires agiront désormais comme un seul."
 frw.21.a:0 "Vive l'Union !"
 frw.22.t:0 "Londres refuse"
 frw.22.d:0 "Londres juge une union prématurée. L'Entente se poursuivra, mais uniquement dans ses termes actuels."
 frw.22.a:0 "Perfide Albion."
 frw.25.t:0 "Un protectorat français ?"
 frw.25.d:0 "La France propose de reprendre nos dettes et de garantir notre sécurité, à condition que nous devenions un protectorat français."
 frw.25.a:0 "Nous acceptons."
 frw.25.b:0 "Notre indépendance n'est pas négociable."
 frw.26.t:0 "Le Liberia accepte"
 frw.26.d:0 "Le Liberia est désormais sous protection française."
 frw.26.a:0 "Très bien."
 frw.27.t:0 "Le Liberia refuse"
 frw.27.d:0 "Le gouvernement libérien a rejeté notre offre."
 frw.27.a:0 "Dommage."
 frw.50.t:0 "Une offre d'achat française"
 frw.50.d:0 "Un envoyé de Paris est arrivé avec une offre. La France souhaite acheter des territoires coloniaux limitrophes de ses possessions africaines et paiera une somme généreuse en or, assortie d'un soutien politique."
 frw.50.a:0 "Nous vendons."
 frw.50.b:0 "Cette terre n'est pas à vendre."
 frw.51.t:0 "Achat conclu"
 frw.51.d:0 "Les négociations ont abouti et le territoire fait désormais partie de l'empire français, même si l'achat a grevé le budget."
 frw.51.a:0 "Une bonne affaire."
 frw.52.t:0 "Offre rejetée"
 frw.52.d:0 "Notre offre d'achat a été rejetée. Une partie des fonds a été reversée au Trésor."
 frw.52.a:0 "Une autre fois, peut-être."
 frw.60.t:0 "La Fédération européenne est fondée"
 frw.60.d:0 "La charte fondatrice d'une Fédération européenne a été signée à Strasbourg. Sous direction française, les nations d'Europe occidentale doivent se fondre en un seul État."
 frw.60.a:0 "Une ère nouvelle."
 frw.61.t:0 "Le Grand Empire"
 frw.61.d:0 "L'aigle impériale flotte de nouveau de la mer du Nord aux Alpes. Le Grand Empire de Napoléon est restauré."
 frw.61.a:0 "L'héritage de l'Empereur."
 frw.62.t:0 "L'Union française"
 frw.62.d:0 "La France a proclamé l'Union française, et la Tunisie et le Maroc sont désormais des parties égales de la République."
 frw.62.a:0 "Un ordre nouveau pour l'empire."
 frw.63.t:0 "L'Empire de Charlemagne restauré"
 frw.63.d:0 "Dans la cathédrale d'Aix-la-Chapelle, où repose Charlemagne, la France a proclamé la restauration de l'Empire franc. Les terres situées entre les Pyrénées et le Rhin sont de nouveau réunies."
 frw.63.a:0 "Karolus Magnus serait fier."
 frw.64.t:0 "L'Empire latin est proclamé"
 frw.64.d:0 "La France, l'Italie et l'Espagne sont désormais réunies sous un seul gouvernement. L'Empire latin, qui se réclame des Césars, a été proclamé à Rome."
 frw.64.a:0 "Rome renaît."
 frw.65.t:0 "La Fédération eurafricaine"
 frw.65.d:0 "La France a fondu ses territoires africains dans une Fédération eurafricaine, un État unique qui s'étend de Dunkerque au Niger."
 frw.65.a:0 "Eurafrique !"
 frw.70.t:0 "La France exige l'union"
 frw.70.d:0 "Le gouvernement français exige que [Root.GetNameDef] soit unie à la France, invoquant une langue et une histoire communes. Paris a clairement fait savoir qu'un refus pourrait être suivi d'un recours à la force."
 frw.70.a:0 "Nous acceptons l'union."
 frw.70.b:0 "Jamais !"
 frw.71.t:0 "La France exige des territoires"
 frw.71.d:0 "La France exige que nous lui cédions des districts frontaliers qu'elle considère comme historiquement français. Si nous refusons, Paris pourrait recourir à la force."
 frw.71.a:0 "Nous cédons le territoire."
 frw.71.b:0 "Pas un pouce de notre sol !"
 frw.72.t:0 "Nos exigences acceptées"
 frw.72.d:0 "Nos exigences ont été satisfaites, et les troupes françaises franchissent la nouvelle frontière sans qu'un seul coup de feu soit tiré."
 frw.72.a:0 "Vive la France !"
 frw.73.t:0 "Union refusée"
 frw.73.d:0 "[From.GetNameDefCap] a refusé l'union avec la France. L'état-major a des plans tout prêts pour prendre par la force ce qui nous a été refusé."
 frw.73.a:0 "Alors, prenons-le par la force."
 frw.73.b:0 "Nous ne déclencherons pas une guerre pour cela."
 frw.74.t:0 "Exigences refusées"
 frw.74.d:0 "[From.GetNameDefCap] refuse de céder les territoires que nous avons exigés. L'armée peut encore s'en emparer si le gouvernement en donne l'ordre."
 frw.74.a:0 "Préparez-vous à la guerre."
 frw.74.b:0 "Laissons cela – pour l'instant."
 frw.75.t:0 "La France exige notre allégeance"
 frw.75.d:0 "Paris exige que [Root.GetNameDef] se place sous protection française, notre politique étrangère et notre armée devant rendre des comptes à la France. L'ambassadeur de France a laissé entendre qu'un refus ne serait pas oublié et que l'armée française est en alerte."
 frw.75.a:0 "Nous acceptons la protection française."
 frw.75.b:0 "Nous restons souverains !"
 frw.76.t:0 "Protection refusée"
 frw.76.d:0 "[From.GetNameDefCap] a rejeté notre offre de protection. Le gouvernement doit décider s'il l'impose par la force."
 frw.76.a:0 "Alors, ils apprendront à obéir."
 frw.76.b:0 "Cela ne vaut pas une guerre."
 frw.80.t:0 "Une offre secrète de Paris"
 frw.80.d:0 "Dans le plus grand secret, le gouvernement français a proposé de céder la Savoie et les Alpes à la Confédération. En échange, les banques suisses ouvriraient leurs coffres à l'industrie française. L'affaire est désormais entre les mains du Conseil fédéral à Berne."
 frw.80.a:0 "Accepter – les cantons de Savoie et des Alpes rejoignent la Confédération."
 frw.80.b:0 "La Suisse ne fait pas commerce de ses terres."
 frw.81.t:0 "Le capitaine venu de Genève"
 frw.81.d:0 "Il est arrivé à la gare de Lyon avec une seule valise et un sabre d'officier polonais. Né à Genève, fils d'un capitaine au long cours breton de Saint-Malo et d'une exilée polonaise de Cracovie, Malo Kervadec a grandi entre les quais du Léman et les récits de sa mère sur un pays qui ne figurait plus sur aucune carte. En 1917, il a rejoint l'Armée bleue du général Haller en France et, en 1920, il était sur la Vistule lorsque l'Armée rouge fut repoussée devant Varsovie.\n\nDepuis, il a travaillé pour les banques privées de Zurich et de Genève, transportant leur or à travers une Europe inquiète. Il apporte aujourd'hui cet or à Paris, convaincu que la Pologne ne peut survivre que si la France est forte."
 frw.81.a:0 "Toutes voiles dehors."
 frw.82.t:0 "Le marché alpin est conclu"
 frw.82.d:0 "La Suisse a accepté. La Savoie et les Alpes sont passées sous administration suisse, et l'or suisse parvient déjà aux usines françaises."
 frw.82.a:0 "Une bonne affaire."
 frw.83.t:0 "Berne décline"
 frw.83.d:0 "Le Conseil fédéral a décliné notre offre. Les Alpes restent françaises, et l'opinion publique ne saura jamais à quel point le gouvernement a été près de les céder."
 frw.83.a:0 "C'est peut-être mieux ainsi."
 FRW_CORSAIR:0 "Royaume de Francia"
 FRW_CORSAIR_DEF:0 "le Royaume de Francia"
 FRW_CORSAIR_ADJ:0 "francien"
 FRW_corsair_cat:0 "Le Royaume de Francia"
 FRW_corsair_cat_desc:0 "La France et la péninsule Ibérique unies sous le pavillon corsaire de Saint-Malo, avec son hermine, sa tête de mort et son lion. Aucun envahisseur qui débarquera sur nos côtes ne les quittera vivant."
 FRW_form_corsair_empire:0 "Proclamer le Royaume de Francia"
 FRW_form_corsair_empire_desc:0 "Nécessite le contrôle de Paris, Madrid, Burgos et Lisbonne et plus de 50 % de soutien à la guerre. Accorde le statut de territoire national à tous les États espagnols et portugais possédés ainsi que l'esprit Le Pavillon Corsaire (+30 % d'attaque et de défense en territoire national)."
 frw.90.t:0 "Intervention en Espagne"
 frw.90.d:0 "L'Espagne a sombré dans la guerre civile, et les troupes françaises sont massées le long des Pyrénées. Le gouvernement doit maintenant décider quel camp la France soutiendra et lequel elle aidera à écraser."
 frw.90.a:0 "Pour la République – écrasons les nationalistes !"
 frw.90.b:0 "Pour les nationalistes – écrasons la République !"
 frw.90.c:0 "Pour le gouvernement légitime – écrasons les rebelles !"
 frw.92.t:0 "La France exige l'union"
 frw.92.d:0 "Des divisions françaises sont déployées le long de toute notre frontière, de la Galice à l'Andalousie. Paris exige que le Portugal rejoigne la France, par des moyens pacifiques, insiste sa note. L'état-major à Lisbonne indique que toute résistance serait vaine."
 frw.92.a:0 "Nous n'avons pas le choix. Le Portugal rejoint la France."
 frw.92.b:0 "Le Portugal se battra !"
 frw.93.t:0 "Lisbonne refuse"
 frw.93.d:0 "[From.GetNameDefCap] a rejeté l'union. Nos divisions attendent l'ordre d'avancer."
 frw.93.a:0 "Alors, marchons sur Lisbonne."
 frw.93.b:0 "Pas maintenant."
 frw.95.t:0 "Le Royaume de Francia"
 frw.95.d:0 "De la Manche à Gibraltar, un nouveau drapeau flotte sur les ministères, portant les lys de France et l'hermine de Saint-Malo. La France et la péninsule Ibérique ont été proclamées un seul État, le Royaume de Francia. Le capitaine de Saint-Malo a déclaré à ses officiers que ce n'était qu'un début."
 frw.95.a:0 "Une nouvelle puissance en Occident."
 frw.95.b:0 "Montjoie Saint-Denis !"
 FRW_leader_corsair:0 "Malo Kervadec"
 FRW_leader_corsair_desc:0 "Malo Kervadec est né à Genève, fils d'un capitaine au long cours breton de Saint-Malo et d'une exilée polonaise. Il a combattu dans l'Armée bleue du général Haller, convoyé de l'or pour les banques privées de Zurich et, dit-on, navigué sous pavillon noir au large des côtes d'Afrique. Il gouverne la France comme un capitaine corsaire gouverne son navire, selon des articles écrits et avec une part du butin pour chaque homme."
 frw.96.t:0 "La France demande les Shetland"
 frw.96.d:0 "Invoquant la Auld Alliance et les relations cordiales entre nos deux pays, Paris demande au gouvernement de Sa Majesté de céder les îles Shetland à la France pour en faire une base navale."
 frw.96.a:0 "Soit – au nom de l'amitié."
 frw.96.b:0 "La Grande-Bretagne ne cède pas ses îles."
 frw.97.t:0 "La France demande les Highlands"
 frw.97.d:0 "L'ambassadeur de France propose que les Highlands écossaises et l'Aberdeenshire soient placés sous administration française, en souvenir, selon ses termes, de la Auld Alliance."
 frw.97.a:0 "Si cela maintient la France à nos côtés..."
 frw.97.b:0 "Hors de question."
 frw.98.t:0 "Londres dit non"
 frw.98.d:0 "[From.GetNameDefCap] a décliné notre demande, poliment mais fermement."
 frw.98.a:0 "Peut-être quand ils nous apprécieront davantage."
 FRW_BURGUNDY:0 "Royaume de Bourgogne"
 FRW_BURGUNDY_DEF:0 "le Royaume de Bourgogne"
 FRW_BURGUNDY_ADJ:0 "bourguignon"
 FRW_WESTUNION:0 "Union occidentale"
 FRW_WESTUNION_DEF:0 "l'Union occidentale"
 FRW_WESTUNION_ADJ:0 "occidental"
 FRW_burgundy_cat:0 "L'héritage bourguignon"
 FRW_burgundy_cat_desc:0 "Au XVe siècle, les ducs de Bourgogne de la maison de Valois tenaient des terres de Dijon à Amsterdam, parmi les plus riches d'Europe. La France est aujourd'hui en mesure de les réunir de nouveau."
 FRW_form_burgundy:0 "Restaurer le Royaume de Bourgogne"
 FRW_form_burgundy_desc:0 "Nécessite le contrôle de la Flandre, de la Hollande, du Luxembourg, de la Wallonie et de la Bourgogne (non communiste). Accorde le statut de territoire national aux Pays-Bas historiques ainsi que l'esprit Héritage bourguignon."
 FRW_western_union_cat:0 "L'Union occidentale"
 FRW_western_union_cat_desc:0 "La France et les pays du Benelux, liés par une union douanière et une défense commune."
 FRW_form_western_union:0 "Proclamer l'Union occidentale"
 FRW_form_western_union_desc:0 "Nécessite un gouvernement démocratique, plus de 50 % de stabilité et le contrôle de la Flandre, de la Hollande, du Luxembourg et de la Wallonie. Accorde le statut de territoire national aux pays du Benelux ainsi que l'esprit L'Union occidentale."
 frw.99.t:0 "La Bourgogne renaît"
 frw.99.d:0 "Près de cinq siècles après la mort de Charles le Téméraire devant Nancy en 1477, les terres entre le Rhin et la Somme sont de nouveau unies, cette fois sous l'autorité de Paris. Le Royaume de Bourgogne a été proclamé."
 frw.99.a:0 "L'âge d'or est de retour."
 frw.100.t:0 "L'Union occidentale"
 frw.100.d:0 "La France et les pays du Benelux ont signé à Bruxelles le traité de l'Union occidentale. Il prévoit un marché commun et une armée intégrée pour les démocraties d'Europe occidentale, ainsi qu'un parlement commun chargé de superviser l'un et l'autre."
 frw.100.a:0 "Un nouveau départ."
 FRW_ETERNAL:0 "Royaume éternel de Francia"
 FRW_ETERNAL_DEF:0 "le Royaume éternel de Francia"
 FRW_ETERNAL_ADJ:0 "francien"
 FRW_leader_admiral_king:0 "Aymeric Kervadec"
 FRW_leader_admiral_king_desc:0 "Aymeric Kervadec est né à Genève en 1894 et a grandi à bord des navires de son père, naviguant entre les banques suisses et les ports de Tanger et de Dantzig. En 1920, il fut l'un des premiers officiers de la nouvelle marine polonaise et apprit son métier dans les eaux froides au large de Gdynia. Il commanda plus tard la flotte qui transporta les armées de son père jusqu'à Lisbonne et Leith. Couronné à Reims sous le nom d'Aymeric Ier, il est connu du peuple comme « le Roi-Amiral ». Contrairement à son père, il préfère les traités aux coups de main, et il veut fonder une dynastie qui lui survive. Il n'a jamais perdu une bataille en mer."
 FRW_admiral_king:0 "Le Roi-Amiral"
 frw.101.t:0 "Le Royaume éternel de Francia"
 frw.101.d:0 "Dans la cathédrale de Reims, l'amiral Aymeric Kervadec, fils du défunt « Corsaire Noir », a été couronné Aymeric Ier, roi des Francs. La France et ses conquêtes ont été proclamées Royaume éternel de Francia sous un nouveau drapeau portant les lys, les armes royales et la croix des croisés.\n\nDans son premier discours, le roi a promis d'achever l'œuvre de son père. La France, a-t-il déclaré, doit devenir si forte qu'aucun ennemi ne foulera plus jamais son sol, et la Pologne ne doit plus jamais être laissée seule."
 frw.101.a:0 "Une nouvelle couronne en Europe."
 frw.101.b:0 "Pro Rege et Patria !"
 frw.84.t:0 "Une lettre de Genève"
 frw.84.d:0 "Depuis des mois, l'Élysée reste muet. Puis arrive une lettre sur papier épais, portant le filigrane d'une banque privée de Genève, rédigée d'une écriture à l'ancienne.\n\n« Messieurs, la France dérive, et un navire sans capitaine finit sur les récifs. J'ai des navires et j'ai de l'or. J'ai jadis combattu pour une nation qui avait été rayée de la carte, et je sais ce qu'il en coûte de perdre son pays. Faites-moi appeler et je viendrai.\n\nM. Kervadec, capitaine »\n\nÀ Paris, personne ne connaît ce nom. À Zurich, il est bien connu.\n\n§GUne nouvelle décision est disponible : Rallier le capitaine Kervadec.§!"
 frw.84.a:0 "Peut-être devrions-nous lui répondre."
 frw.102.t:0 "Le Corsaire Noir est mort"
 frw.102.d:0 "Malo Kervadec est mort en mer. Par une nuit de tempête au large de Gdynia, son cœur a lâché à bord du navire qui avait transporté son or et ses armées pendant vingt ans. Ses officiers rapportent que ses dernières paroles furent en polonais.\n\nSon cercueil est exposé dans la cathédrale de Saint-Malo, veillé par des fusiliers marins français aux côtés de marins polonais venus de Gdynia pour le ramener chez lui. Un conseil de régence gouvernera la France jusqu'au couronnement. Son fils, l'amiral Aymeric Kervadec, est en route pour Reims."
 frw.102.a:0 "Reposez en mer, capitaine."
 FRW_req_european_federation_tt:0 "§gNécessite le contrôle de la §YBelgique§!, des §YPays-Bas§! et du §YLuxembourg§! ainsi que de l'§YItalie§! ou de l'§YAllemagne§! (annexés ou en tant qu'États fantoches, sauf indication contraire). Si la France ne les contrôle pas encore, la nation sera fondée automatiquement dès que ce sera le cas.§!"
 FRW_req_western_union_tt:0 "§gNécessite le contrôle de la §YBelgique§!, des §YPays-Bas§! et du §YLuxembourg§! (annexés ou en tant qu'États fantoches, sauf indication contraire). Si la France ne les contrôle pas encore, la nation sera fondée automatiquement dès que ce sera le cas.§!"
 FRW_req_latin_empire_tt:0 "§gNécessite le contrôle de l'§YItalie§!, de l'§YEspagne§! et du §YPortugal§! (annexés ou en tant qu'États fantoches, sauf indication contraire). Si la France ne les contrôle pas encore, la nation sera fondée automatiquement dès que ce sera le cas.§!"
 FRW_req_eurafrica_tt:0 "§gNécessite le contrôle de l'Afrique du Nord française (§YAlgérie§!, §YMaroc§! et §YTunisie§!) – une occupation militaire suffit. Si la France ne les contrôle pas encore, la nation sera fondée automatiquement dès que ce sera le cas.§!"
 FRW_req_francia_tt:0 "§gNécessite le contrôle de la §YRhénanie§!, de la §YMoselle§!, de la §YBelgique§! et des §YPays-Bas§! (annexés ou en tant qu'États fantoches, sauf indication contraire). Si la France ne les contrôle pas encore, la nation sera fondée automatiquement dès que ce sera le cas.§!"
 FRW_req_burgundy_tt:0 "§gNécessite le contrôle de l'ensemble de la §YBelgique§!, des §YPays-Bas§! et du §YLuxembourg§! (annexés, pas en tant qu'États fantoches). Si la France ne les contrôle pas encore, la nation sera fondée automatiquement dès que ce sera le cas.§!"
 FRW_req_grand_empire_tt:0 "§gNécessite le contrôle du §YRhin§! (Rhénanie, Moselle), du §YPiémont§!, de la §YBelgique§! et des §YPays-Bas§! (annexés ou en tant qu'États fantoches, sauf indication contraire). Si la France ne les contrôle pas encore, la nation sera fondée automatiquement dès que ce sera le cas.§!"
 FRW_plunder_cat_desc:0 "Chaque nation qui s'est soumise à la France, que ce soit comme satellite ou après une capitulation, conserve de l'or dans sa banque centrale. Le capitaine de Saint-Malo entend bien le récupérer."
 FRW_seize_the_treasury:0 "Saisir le trésor de [FROM.GetName]"
 FRW_seize_the_treasury_desc:0 "Les réserves d'or de [FROM.GetNameDef] sont chargées sur des navires français.\n\nFrance : §G+75§! de pouvoir politique, une §Gusine civile§! et §YL'or des corsaires§! pendant 180 jours.\n[FROM.GetNameDefCap] : §RTrésor pillé§! pendant 365 jours. Chaque pays ne peut être pillé qu'une fois par an."
 FRW_corsair_gold_desc:0 "L'or saisi est versé au trésor royal."
 FRW_plundered_treasury_desc:0 "Des corsaires français ont emporté nos réserves d'or."
 FRW_saint_malo_shipyards_desc:0 "Les chantiers du vieux port corsaire construisent de nouveau des navires, et plus vite qu'à aucun autre moment de leur histoire."
 FRW_prize_economy_desc:0 "L'argent des prises est investi dans les usines et les machines-outils."
 FRW_econ_dirigiste_2_desc:0 "Le plan couvre désormais toutes les régions, et de nouvelles usines sont construites là où les planificateurs le décident."
 FRW_econ_dirigiste_3_desc:0 "L'économie est entièrement planifiée, du prix du charbon à la production de chaque usine."
 FRW_econ_liberal_1_desc:0 "Les capitaux privés et l'ouverture des marchés animent l'industrie française."
 FRW_econ_liberal_2_desc:0 "Investisseurs et ingénieurs se disputent les contrats, et la France en récolte les bénéfices."
 FRW_econ_liberal_3_desc:0 "Le crédit est bon marché et les carnets de commandes des entreprises françaises sont pleins."
 FRW_econ_rearmament_1_desc:0 "Chaque franc disponible va aux arsenaux."
 FRW_econ_rearmament_2_desc:0 "La production d'armement a la priorité sur toutes les autres branches de l'industrie."
 FRW_econ_rearmament_3_desc:0 "La France est devenue un immense arsenal."
 FRW_colonial_integration_cat:0 "Intégration coloniale"
 FRW_colonial_integration_cat_desc:0 "Posséder des territoires en Afrique ne suffit pas à les rendre français. Ces décisions placent les terres africaines possédées par la France sous une véritable administration coloniale, qui fournit davantage de soldats et de ressources dans chaque État. Seule l'§YAlgérie§!, française depuis 1848, devient un §Gterritoire national§! ; avec la priorité §YL'Algérie, c'est la France§!, les départements d'outre-mer suivent. Les décisions peuvent être réutilisées chaque fois que la France acquiert de nouvelles terres dans une région."
 FRW_integrate_maghreb:0 "Intégrer l'Afrique du Nord française"
 FRW_integrate_maghreb_desc:0 "Le Maroc, la Tunisie et le Sahara algérien sont organisés en départements sur le modèle d'Alger et d'Oran.\n\nPlace chaque État de cette région possédé par la France sous §YAdministration coloniale§!. L'§YAlgérie§! devient un §Gterritoire national§!."
 FRW_integrate_aof:0 "Intégrer l'Afrique-Occidentale française"
 FRW_integrate_aof_desc:0 "De Dakar à Niamey, l'AOF passe sous le droit civil français, et ses habitants deviennent citoyens.\n\nPlace chaque État de cette région possédé par la France sous §YAdministration coloniale§!."
 FRW_integrate_aef:0 "Intégrer l'Afrique-Équatoriale française"
 FRW_integrate_aef_desc:0 "Brazzaville, Libreville, Fort-Lamy et le Cameroun sous mandat sont placés sous l'autorité directe de Paris.\n\nPlace chaque État de cette région possédé par la France sous §YAdministration coloniale§!."
 FRW_integrate_indian_ocean:0 "Intégrer les territoires de l'océan Indien"
 FRW_integrate_indian_ocean_desc:0 "Madagascar, La Réunion, les Comores et Djibouti sont intégrés à la France d'outre-mer.\n\nPlace chaque État de cette région possédé par la France sous §YAdministration coloniale§!."
 FRW_integrate_spanish:0 "Intégrer les anciennes colonies espagnoles"
 FRW_integrate_spanish_desc:0 "Le Rif, Ifni, le Río de Oro et le Río Muni passent définitivement sous administration française.\n\nPlace chaque État de cette région possédé par la France sous §YAdministration coloniale§!."
 FRW_integrate_portuguese:0 "Intégrer les anciennes colonies portugaises"
 FRW_integrate_portuguese_desc:0 "La Guinée, l'Angola, le Mozambique et les îles atlantiques de l'ancien empire portugais sont annexés à la France.\n\nPlace chaque État de cette région possédé par la France sous §YAdministration coloniale§!."
 FRW_integrate_congo:0 "Intégrer le Congo"
 FRW_integrate_congo_desc:0 "Le Congo belge, ainsi que le Rwanda et le Burundi, est rattaché à l'Afrique-Équatoriale française.\n\nPlace chaque État de cette région possédé par la France sous §YAdministration coloniale§!."
 FRW_integrate_libya:0 "Intégrer la Libye"
 FRW_integrate_libya_desc:0 "La Tripolitaine, la Cyrénaïque et le Fezzan offrent désormais à la France une liaison continue entre la Tunisie et le Tchad.\n\nPlace chaque État de cette région possédé par la France sous §YAdministration coloniale§!."
 FRW_integrate_british_west:0 "Intégrer l'Afrique-Occidentale britannique"
 FRW_integrate_british_west_desc:0 "La Gambie, la Sierra Leone et le Nigeria sont rattachés à l'AOF.\n\nPlace chaque État de cette région possédé par la France sous §YAdministration coloniale§!."
 FRW_integrate_african_territories:0 "Les départements d'outre-mer"
 FRW_integrate_african_territories_desc:0 "L'Algérie, les Antilles, la Guyane et La Réunion deviennent des départements français comme les autres. Le reste de l'Afrique est placé sous administration coloniale."
 RULE_FRW_FRANCE_AI:0 "France (France Rework)"
 RULE_FRW_FRANCE_AI_HISTORICAL:0 "Historique"
 RULE_FRW_FRANCE_AI_HISTORICAL_DESC:0 "La France reste une démocratie, généralement avec le Front populaire. Recommandé."
 RULE_FRW_FRANCE_AI_DEMOCRATIC:0 "Démocratique"
 RULE_FRW_FRANCE_AI_DEMOCRATIC_DESC:0 "La France suit l'une des voies démocratiques (Blum ou Reynaud/de Gaulle)."
 RULE_FRW_FRANCE_AI_COMMUNIST:0 "Communiste"
 RULE_FRW_FRANCE_AI_COMMUNIST_DESC:0 "La France suit l'une des voies communistes (Thorez ou Pivert)."
 RULE_FRW_FRANCE_AI_FASCIST:0 "Fasciste"
 RULE_FRW_FRANCE_AI_FASCIST_DESC:0 "La France suit l'une des voies fascistes (La Rocque ou Doriot)."
 RULE_FRW_FRANCE_AI_NONALIGNED:0 "Non-aligné"
 RULE_FRW_FRANCE_AI_NONALIGNED_DESC:0 "La France suit l'une des voies non alignées (Pétain, Orléans ou les Bonaparte)."
 RULE_FRW_FRANCE_AI_RANDOM:0 "Aléatoire"
 RULE_FRW_FRANCE_AI_RANDOM_DESC:0 "L'IA choisit l'une des quatre idéologies avec une probabilité égale."
 FRW_shortcut_democratic:0 "Voies démocratiques"
 FRW_shortcut_communist:0 "Voies communistes"
 FRW_shortcut_fascist:0 "Voies fascistes"
 FRW_shortcut_nonaligned:0 "Voies non alignées"
 FRW_shortcut_secret:0 "Voie secrète"
 FRW_shortcut_economy:0 "Économie"
 FRW_shortcut_military:0 "Armée"
 FRW_shortcut_diplomacy:0 "Diplomatie"
 FRW_shortcut_colonies:0 "Empire colonial"
 FRW_plunder_cat:0 "Prises de guerre"
 FRW_econ_dirigiste_1_desc:0 "L'État élabore des plans d'investissement et dirige les grandes industries."
 FRW_union_francaise_formed_desc:0 "De Dakar à Saïgon, les colonies sont désormais membres d'une seule et même Union française."
 FRW_european_federation_desc:0 "Une Europe fédérale sous direction française, avec un marché unique et un parlement commun."
 FRW_western_union_idea_desc:0 "Les démocraties d'Europe occidentale partagent un marché commun et une armée commune."
 FRW_latin_empire_idea_desc:0 "Mare Nostrum. Les marines latines contrôlent la Méditerranée."
 FRW_eurafrican_federation_idea_desc:0 "L'Europe et l'Afrique forment un espace économique unique dirigé depuis Paris."
 FRW_francia_idea_desc:0 "Héritier de Charlemagne, le roi règne des Pyrénées au Rhin."
 FRW_burgundy_idea_desc:0 "Les riches provinces de l'ancien État bourguignon sont de nouveau unies."
 FRW_grand_empire_idea_desc:0 "L'Europe de Napoléon a été restaurée, et la Grande Armée est de nouveau en marche."
 FRW_franco_british_union_spirit_desc:0 "La France et la Grande-Bretagne ont fusionné leurs deux empires en une seule union."
 FRW_drapeau_noir_desc:0 "Sous le pavillon noir des corsaires, nos soldats défendent chaque pouce du sol natal."
 FRW_eternal_kingdom_spirit_desc:0 "La couronne a été restaurée, et le roi qui la porte n'a jamais perdu une bataille en mer."
 FRW_decolonisation_cat:0 "La révolution anticoloniale"
 FRW_decolonisation_cat_desc:0 "Une république ouvrière ne peut gouverner d'autres peuples par la force. Chaque colonie libérée devient un allié socialiste et renforce le prestige de la Commune auprès des peuples colonisés du monde entier.\n\nChaque libération renforce §YPeuples frères§! d'un niveau (jusqu'à trois)."
 FRW_free_north_africa:0 "Libérer l'Afrique du Nord"
 FRW_free_north_africa_desc:0 "Le Maroc, la Tunisie et l'Algérie deviennent des républiques socialistes indépendantes alliées à la Commune française.\n\nLes libère en tant que §Ysatellites communistes§! (uniquement là où la France détient leurs terres) et renforce §YPeuples frères§!."
 FRW_free_west_africa:0 "Libérer l'Afrique-Occidentale"
 FRW_free_west_africa_desc:0 "Les territoires de l'AOF, du Sénégal au Niger, ainsi que le mandat du Togo élisent leurs propres conseils et quittent l'empire.\n\nLibère ces territoires en tant que §Ysatellites communistes§! (uniquement là où la France contrôle leur sol) et renforce §YPeuples frères§!."
 FRW_free_equatorial_africa:0 "Libérer l'Afrique-Équatoriale"
 FRW_free_equatorial_africa_desc:0 "Le Tchad, le Cameroun, le Gabon, le Moyen-Congo et l'Oubangui-Chari sont proclamés républiques libres.\n\nLibère ces territoires en tant que §Ysatellites communistes§! (uniquement là où la France contrôle leur sol) et renforce §YPeuples frères§!."
 FRW_free_indian_ocean:0 "Libérer Madagascar et Djibouti"
 FRW_free_indian_ocean_desc:0 "Madagascar et la Côte française des Somalis passent aux mains de leurs propres peuples.\n\nLibère ces territoires en tant que §Ysatellites communistes§! (uniquement là où la France contrôle leur sol) et renforce §YPeuples frères§!."
 FRW_free_indochina:0 "Libérer l'Indochine"
 FRW_free_indochina_desc:0 "Avec l'appui de la France, les communistes indochinois prennent le pouvoir à Hanoï, Phnom Penh et Vientiane.\n\nLibère ces territoires en tant que §Ysatellites communistes§! (uniquement là où la France contrôle leur sol) et renforce §YPeuples frères§!."
 FRW_free_levant:0 "Libérer le Levant"
 FRW_free_levant_desc:0 "Les mandats de Syrie et du Liban prennent fin : Damas et Beyrouth se gouvernent désormais eux-mêmes.\n\nLibère ces territoires en tant que §Ysatellites communistes§! (uniquement là où la France contrôle leur sol) et renforce §YPeuples frères§!."
 FRW_european_community_faction:0 "Communauté européenne"
 FRW_neutral_bloc_faction:0 "Bloc latin neutre"
 frw.120.t:0 "La France propose un bloc neutre"
 frw.120.d:0 "L'envoyé du Maréchal nous apporte une proposition de Paris. Les nations latines, dit-il, doivent rester unies et se tenir à l'écart de la guerre qui s'annonce entre Berlin, Londres et Moscou. La France offre une défense commune et ne demande rien de plus."
 frw.120.a:0 "Nous acceptons."
 frw.120.b:0 "Nous préférons rester seuls."
 frw.121.t:0 "La Fédération européenne"
 frw.121.d:0 "Paris demande aux membres de la Communauté européenne de franchir le dernier pas vers un gouvernement fédéral doté d'une armée et d'une monnaie uniques. Nos ministres siégeraient à Paris, et notre drapeau flotterait aux côtés des autres dans l'assemblée fédérale."
 frw.121.a:0 "Nous rejoignons la fédération."
 frw.121.b:0 "Nous conservons notre souveraineté."
 FRW_imperial_redoubt_desc:0 "Si la métropole tombe, le gouvernement poursuivra la guerre depuis l'Afrique du Nord."
 FRW_imperial_redoubt_2_desc:0 "Chaque colonie a été fortifiée et sa garnison mise en alerte."
 FRW_marshals_france_desc:0 "L'ordre à l'intérieur et la paix derrière des frontières bien armées."
 FRW_continental_empire_spirit_desc:0 "L'empire s'étend de l'Atlantique à la Vistule et au Nil."
 FRW_free_france_spirit_desc:0 "Le gouvernement poursuit la guerre depuis les colonies jusqu'à la libération de Paris."
 FRW_brazzaville_spirit_desc:0 "À Brazzaville, une place nouvelle au sein de la communauté française a été promise aux colonies, une fois la guerre terminée."
 FRW_liberation_spirit_desc:0 "Paris a été libéré et le gouvernement est de retour dans la capitale."
 FRW_european_partner_desc:0 "L'adhésion à la Communauté européenne ouvre les marchés et les laboratoires étrangers aux entreprises et aux savants français."
 FRW_european_market_desc:0 "Les marchandises circulent désormais librement entre les États membres de la Communauté."
 FRW_fraternal_peoples_desc:0 "Les colonies libérées se tiennent aux côtés de la Commune."
 FRW_fraternal_peoples_2_desc:0 "Les colonies libérées se tiennent aux côtés de la Commune."
 FRW_fraternal_peoples_3_desc:0 "Les colonies libérées se tiennent aux côtés de la Commune."
 FRW_diplomatic_overture:0 "Ouverture diplomatique française"
 FRW_royal_ties:0 "Liens avec la Couronne de France"
 FRW_fascist_friendship:0 "Amitié fasciste"
 FRW_lend_lease_spirit_desc:0 "Le matériel américain parvient aux Français libres par l'intermédiaire de la Grande-Bretagne."
 FRW_resistance_spirit_desc:0 "Les réseaux de résistance de la France occupée rendent compte à Londres."
 FRW_provisional_government_spirit_desc:0 "La République se poursuit en exil et prépare son retour."
 FRW_fight_on_spirit_desc:0 "L'armistice n'est pas reconnu. Chaque soldat de la France libre se bat comme si le sort de la France dépendait de lui seul."
 FRW_oath_of_kufra_desc:0 "À Koufra, les hommes de Leclerc ont juré de ne déposer les armes que lorsque le drapeau flottera sur Strasbourg."
 FRW_liberation_cat:0 "La guerre de libération"
 FRW_liberation_cat_desc:0 "Dès que les Français libres tiennent les principales régions de leur pays, ils peuvent proposer à l'occupant une paix sur la ligne de front actuelle, ou continuer à se battre pour le reste."
 FRW_liberation_metropole:0 "Proposer la paix : France métropolitaine"
 FRW_liberation_metropole_desc:0 "Nécessite le contrôle de §YParis§!, du §YPas-de-Calais§!, de l'§YAlsace-Lorraine§!, de l'§YAquitaine§! et de §YMarseille§!."
 FRW_liberation_africa:0 "Proposer la paix : Afrique du Nord"
 FRW_liberation_africa_desc:0 "Nécessite le contrôle de l'§YAlgérie§!, de la §YTunisie§! et du §YMaroc§!."
 frw.130.t:0 "L'occupant demande ses conditions"
 frw.130.d:0 "Le cœur de la France étant de nouveau sous le drapeau tricolore, les émissaires ennemis se présentent à notre quartier général. Ils proposent un armistice sur la ligne de front actuelle. Nos généraux estiment que le reste du pays pourrait lui aussi être repris, mais à un certain prix."
 frw.130.a:0 "Signer la paix."
 frw.130.a.tt:0 "Chaque §YÉtat du territoire national français§! contrôlé par la France redevient français.\n§YPaix blanche§! avec chaque ennemi qui en possédait un. La capitale revient à §YParis§! si la France la tient."
 frw.130.b:0 "Combattre jusqu'à la libération de la France."
 frw.130.b.tt:0 "La guerre continue. §YNous continuons le combat§! pendant 180 jours (s'il n'est pas déjà actif). L'offre pourra être renouvelée dans 90 jours."
 FRW_latin_destiny_spirit_desc:0 "La Corse, la Sardaigne et le littoral provençal gardent la Méditerranée occidentale pour la France."
 FRW_leader_alfonso_desc:0 "Alphonse de Bourbon a quitté Madrid en avril 1931 sans abdiquer. Aîné des descendants mâles de Louis XIV, il est, pour les légitimistes français, le roi Alphonse Ier de France et de Navarre."
 FRW_legitimist_party:0 "Légitimistes"
 FRW_legitimist_party_long:0 "Union légitimiste royaliste"
 FRW_bourbon_pact_faction:0 "Pacte de famille des Bourbons"
 FRW_BOURBON:0 "Royaume de France et d'Espagne"
 FRW_BOURBON_DEF:0 "le Royaume de France et d'Espagne"
 FRW_BOURBON_ADJ:0 "franco-espagnol"
 FRW_legitimist_crown_desc:0 "Les Bourbons de la branche aînée règnent en France pour la première fois depuis 1830."
 FRW_legitimist_crown_2_desc:0 "L'Église et la Couronne se soutiennent mutuellement dans les deux royaumes."
 FRW_two_crowns_spirit_desc:0 "La France et l'Espagne partagent un roi, un programme naval et leurs usines d'armement."
 FRW_bourbon_partner_desc:0 "L'Espagne tire profit de son alliance avec le roi Bourbon de France."
 FRW_grand_siecle_desc:0 "Un Bourbon règne de la Manche à Gibraltar, comme au temps du Roi-Soleil."
 FRW_double_monarchy_idea_desc:0 "La France et l'Espagne forment un seul royaume sous un seul roi Bourbon."
 FRW_req_bourbon_tt:0 "§gNécessite le contrôle de §YMadrid§! (annexée ou en tant qu'État fantoche). Si la France ne la contrôle pas encore, le royaume sera fondé automatiquement dès qu'elle la contrôlera.§!"
 frw.140.t:0 "Le roi de France revendique l'Espagne"
 frw.140.d:0 "Le roi Bourbon de Paris rappelle à Madrid qu'il n'a jamais abdiqué le trône d'Espagne. Il demande à l'Espagne de le reconnaître de nouveau comme son roi. Accepter placerait l'Espagne sous protection française ; refuser pourrait signifier la guerre."
 frw.140.a:0 "Vive le Roi !"
 frw.140.b:0 "L'Espagne ne sera pas gouvernée depuis Paris."
 frw.141.t:0 "Un roi Bourbon à Paris"
 frw.141.d:0 "Les légitimistes ont proclamé roi de France Alphonse de Bourbon, le roi d'Espagne en exil. Le prétendant orléaniste a protesté depuis Bruxelles, et à Madrid, le gouvernement républicain observe la situation avec inquiétude."
 frw.141.a:0 "Deux trônes, un seul roi ?"
 frw.142.t:0 "Les couronnes de France et d'Espagne réunies"
 frw.142.d:0 "Plus de deux siècles après que le traité d'Utrecht l'a interdit, la France et l'Espagne sont réunies sous un seul roi Bourbon. Le nouveau royaume s'étend de Dunkerque à Cadix."
 frw.142.a:0 "Il n'y a plus de Pyrénées."
 frw.143.t:0 "L'Espagne accepte le roi"
 frw.143.d:0 "Madrid a reconnu notre roi comme roi d'Espagne et placé le pays sous protection française."
 frw.143.a:0 "Vive le Roi ! ¡Viva el Rey!"
 frw.144.t:0 "L'Espagne refuse le roi"
 frw.144.d:0 "Madrid a rejeté la revendication de notre roi. L'armée se tient prête dans les Pyrénées."
 frw.144.a:0 "Alors nous la prendrons."
 FRW_disjointed_2_desc:0 "Le carrousel ministériel s'est arrêté, mais les ministres se méfient toujours les uns des autres et l'administration obéit avec lenteur."
 FRW_disjointed_3_desc:0 "Le gouvernement a trouvé son assise. Quelques vieilles querelles subsistent."
 FRW_victors_2_desc:0 "L'armée a commencé à remettre en question les doctrines de 1918, mais les vieilles habitudes ont la vie dure."
 FRW_dec_consolidate_government:0 "Consolider le gouvernement"
 FRW_dec_consolidate_government_desc:0 "Purger les ministères des coteries rivales et donner au cabinet une majorité solide.\n\nDisponible à partir de §Y1937§!, au moins §Y6 mois§! après le début de la réforme, avec §Y40 %§! de stabilité : §YUn gouvernement fragile§! devient §YUn gouvernement qui se stabilise§!."
 FRW_dec_stable_government:0 "Un gouvernement stable"
 FRW_dec_stable_government_desc:0 "Les ministères exécutent sans délai les décrets du cabinet.\n\nDisponible à partir de §Y1938§!, au moins §Y6 mois§! après la dernière étape, avec §Y50 %§! de stabilité : supprime §YUn gouvernement qui se stabilise§!."
 FRW_dec_backer_blum:0 "Rallier Léon Blum"
 FRW_dec_backer_blum_desc:0 "Les pourparlers avec Léon Blum, la SFIO et le Front populaire durent environ six semaines. Un seul dirigeant de ce camp peut être courtisé à la fois.\n\nNécessite §Y45 %§! de soutien au parti et §Y30 %§! de stabilité. Ensuite, la voie de Léon Blum pourra être choisie dans l'arbre des priorités."
 FRW_dec_backer_reynaud:0 "Rallier Paul Reynaud"
 FRW_dec_backer_reynaud_desc:0 "Les pourparlers avec Paul Reynaud, l'Alliance démocratique et le centre droit durent environ six semaines. Un seul dirigeant de ce camp peut être courtisé à la fois.\n\nNécessite §Y45 %§! de soutien au parti et §Y30 %§! de stabilité. Ensuite, la voie de Paul Reynaud pourra être choisie dans l'arbre des priorités."
 FRW_dec_backer_thorez:0 "Rallier Maurice Thorez"
 FRW_dec_backer_thorez_desc:0 "Les pourparlers avec Maurice Thorez, le PCF et sa ligne moscovite durent environ six semaines. Un seul dirigeant de ce camp peut être courtisé à la fois.\n\nNécessite §Y35 %§! de soutien au parti et §Y30 %§! de stabilité. Ensuite, la voie de Maurice Thorez pourra être choisie dans l'arbre des priorités."
 FRW_dec_backer_pivert:0 "Rallier Marceau Pivert"
 FRW_dec_backer_pivert_desc:0 "Les pourparlers avec Marceau Pivert et la Gauche révolutionnaire durent environ six semaines. Un seul dirigeant de ce camp peut être courtisé à la fois.\n\nNécessite §Y35 %§! de soutien au parti et §Y30 %§! de stabilité. Ensuite, la voie de Marceau Pivert pourra être choisie dans l'arbre des priorités."
 FRW_dec_backer_larocque:0 "Rallier François de La Rocque"
 FRW_dec_backer_larocque_desc:0 "Les pourparlers avec François de La Rocque, les Croix-de-Feu et le PSF durent environ six semaines. Un seul dirigeant de ce camp peut être courtisé à la fois.\n\nNécessite §Y35 %§! de soutien au parti et §Y30 %§! de stabilité. Ensuite, la voie de François de La Rocque pourra être choisie dans l'arbre des priorités."
 FRW_dec_backer_doriot:0 "Rallier Jacques Doriot"
 FRW_dec_backer_doriot_desc:0 "Les pourparlers avec Jacques Doriot et le PPF durent environ six semaines. Un seul dirigeant de ce camp peut être courtisé à la fois.\n\nNécessite §Y35 %§! de soutien au parti et §Y30 %§! de stabilité. Ensuite, la voie de Jacques Doriot pourra être choisie dans l'arbre des priorités."
 FRW_dec_backer_petain:0 "Rallier le maréchal Pétain"
 FRW_dec_backer_petain_desc:0 "Les pourparlers avec le maréchal Pétain, les anciens combattants et l'armée durent environ six semaines. Un seul dirigeant de ce camp peut être courtisé à la fois.\n\nNécessite §Y35 %§! de soutien au parti et §Y30 %§! de stabilité. Ensuite, la voie du maréchal Pétain pourra être choisie dans l'arbre des priorités."
 FRW_dec_backer_orleans:0 "Rallier le comte de Paris"
 FRW_dec_backer_orleans_desc:0 "Les pourparlers avec le comte de Paris, les orléanistes et l'Action française durent environ six semaines. Un seul dirigeant de ce camp peut être courtisé à la fois.\n\nNécessite §Y35 %§! de soutien au parti et §Y30 %§! de stabilité. Ensuite, la voie du comte de Paris pourra être choisie dans l'arbre des priorités."
 FRW_dec_backer_bonaparte:0 "Rallier le prince Louis Napoléon"
 FRW_dec_backer_bonaparte_desc:0 "Les pourparlers avec le prince Louis Napoléon et les comités bonapartistes durent environ six semaines. Un seul dirigeant de ce camp peut être courtisé à la fois.\n\nNécessite §Y35 %§! de soutien au parti et §Y30 %§! de stabilité. Ensuite, la voie du prince Louis Napoléon pourra être choisie dans l'arbre des priorités."
 FRW_dec_backer_legit:0 "Rallier Alphonse de Bourbon"
 FRW_dec_backer_legit_desc:0 "Les pourparlers avec Alphonse de Bourbon et les légitimistes durent environ six semaines. Un seul dirigeant de ce camp peut être courtisé à la fois.\n\nNécessite §Y35 %§! de soutien au parti et §Y30 %§! de stabilité. Ensuite, la voie d'Alphonse de Bourbon pourra être choisie dans l'arbre des priorités."
 FRW_backer_blum_req:0 "A obtenu le soutien de §YLéon Blum§!"
 FRW_backer_reynaud_req:0 "A obtenu le soutien de §YPaul Reynaud§!"
 FRW_backer_thorez_req:0 "A obtenu le soutien de §YMaurice Thorez§!"
 FRW_backer_pivert_req:0 "A obtenu le soutien de §YMarceau Pivert§!"
 FRW_backer_larocque_req:0 "A obtenu le soutien de §YFrançois de La Rocque§!"
 FRW_backer_doriot_req:0 "A obtenu le soutien de §YJacques Doriot§!"
 FRW_backer_petain_req:0 "A obtenu le soutien §Ydu maréchal Pétain§!"
 FRW_backer_orleans_req:0 "A obtenu le soutien §Ydu comte de Paris§!"
 FRW_backer_bonaparte_req:0 "A obtenu le soutien §Ydu prince Louis Napoléon§!"
 FRW_backer_legit_req:0 "A obtenu le soutien de §YAlphonse de Bourbon§!"
 FRW_not_secret_alpine_tt:0 "La France n'a pas conclu le marché secret sur les Alpes"
 FRW_alps_refused_tt:0 "La Suisse a refusé l'offre concernant les Alpes, ou aucune offre n'a été faite"
 FRW_alps_answered_tt:0 "La Suisse a répondu à l'offre concernant les Alpes"
 FRW_exile_open_tt:0 "La France a capitulé ou a perdu le contrôle de §YParis§!"
 FRW_gov_reform_wait_tt:0 "Au moins §Y6 mois§! se sont écoulés depuis la dernière réforme gouvernementale"
 FRW_no_pending_offer_tt:0 "Aucune autre offre faite à ce pays n'attend encore de réponse"
 FRW_joliot_curie_advisor:0 "Frédéric Joliot-Curie"
 FRW_imperial_scientist:0 "Directeur de la Science impériale"
 FRW_imperial_scientist_desc:0 "Lauréat du prix Nobel en 1935, désormais chargé d'organiser les laboratoires de l'Empire."
 FRW_backer_captain_req:0 "A obtenu le soutien du §Ycapitaine Kervadec§!"
 FRW_dec_backer_captain:0 "Rallier le capitaine Kervadec"
 FRW_dec_backer_captain_desc:0 "L'auteur de la lettre de Genève attend une réponse. Les pourparlers avec Malo Kervadec et ses soutiens zurichois durent environ six semaines. Un seul dirigeant de ce camp peut être courtisé à la fois.\n\nNécessite §Y35 %§! de soutien au parti et §Y30 %§! de stabilité. Ensuite, une voie cachée s'ouvre dans l'arbre des priorités."
 FRW_dec_wait:0 "Attendre"
 FRW_dec_wait_desc:0 "Les Chambres restent closes et les ministères s'en tiennent à la routine. Personne à Paris ne prend de décision pendant un mois encore."
 FRW_econ_reforms_cat:0 "Réformes économiques"
 FRW_econ_reforms_cat_desc:0 "Le modèle économique choisi par la France peut être approfondi étape par étape. Chaque réforme comporte trois étapes ; une nouvelle étape ne peut être lancée que cinq mois après la précédente dans le même domaine."
 FRW_econ_reforms:0 "Réformes économiques"
 FRW_econ_reforms_desc:0 "L'effet cumulé de toutes les réformes économiques adoptées jusqu'ici."
 FRW_dec_er_dirigisme_slots_1:0 "Plans de développement régional (I)"
 FRW_dec_er_dirigisme_slots_1_desc:0 "Économie dirigée : étape 1 sur 3 dans le domaine des §YEmplacements de construction§!."
 FRW_dec_er_dirigisme_slots_1_tt:0 "§YRéformes économiques§! : Emplacements de construction §G+4 %§!"
 FRW_dec_er_dirigisme_slots_2:0 "Plans de développement régional (II)"
 FRW_dec_er_dirigisme_slots_2_desc:0 "Économie dirigée : étape 2 sur 3 dans le domaine des §YEmplacements de construction§!."
