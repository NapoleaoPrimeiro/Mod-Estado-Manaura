 FRW_dec_dismiss_tt:0 "Le ministre quitte le gouvernement et libère son emplacement de conseiller. Il pourra être nommé de nouveau plus tard."
 FRW_council_cat:0 "Le Conseil des ministres"
 FRW_council_cat_desc:0 "Ministres, experts et hommes de parti offrent leurs services. Choisissez un département pour voir qui est disponible. Certaines réformes ne peuvent être menées sans l'homme qu'il faut au gouvernement.\n\nLes ministres nommés ici peuvent être renvoyés en haut de cette liste."
 FRW_dec_council_back:0 "« Retour au Conseil"
 FRW_dec_council_back_desc:0 "Revenir à la liste des départements."
 FRW_dec_council_back_tt:0 "Revenir à la liste des départements."
 FRW_dec_council_open_tt:0 "Affiche les candidats de ce département."
 FRW_dec_council_open_politics:0 "Département : Politique"
 FRW_dec_council_open_politics_desc:0 "Hommes de parti, idéologues et voix de la rue."
 FRW_dec_council_open_economy:0 "Département : Économie"
 FRW_dec_council_open_economy_desc:0 "Planificateurs, ingénieurs et statisticiens pour diriger l'économie."
 FRW_dec_council_open_research:0 "Département : Recherche"
 FRW_dec_council_open_research_desc:0 "Des savants capables de ramener la recherche française au premier rang."
 FRW_dec_council_open_projects:0 "Département : Projets spéciaux"
 FRW_dec_council_open_projects_desc:0 "Des ingénieurs pour les grands projets de l'avenir : les fusées et l'atome."
 FRW_dec_council_open_army:0 "Département : Armée de terre"
 FRW_dec_council_open_army_desc:0 "Chefs d'état-major et réformateurs qui préparent l'armée à la prochaine guerre."
 FRW_dec_council_open_navy:0 "Département : Marine"
 FRW_dec_council_open_navy_desc:0 "Des amiraux qui construisent et entraînent la flotte."
 FRW_dec_council_open_air:0 "Département : Armée de l'air"
 FRW_dec_council_open_air_desc:0 "Des généraux aviateurs qui façonnent l'Armée de l'air."
 FRW_dec_council_open_resistance:0 "Département : Renseignement"
 FRW_dec_council_open_resistance_desc:0 "Le Deuxième Bureau et les hommes qui organiseraient la résistance si la France venait à être occupée."
 FRW_adv_monnet:0 "Jean Monnet"
 FRW_adv_monnet_desc:0 "Jean Monnet a passé sa vie à convaincre les gouvernements de mettre en commun ce qu'ils ne peuvent gérer seuls, du fret maritime allié en 1917 aux prêts à la Pologne et à la Chine. Il est convaincu que les nations d'Europe devront un jour partager leur charbon et leur acier, et avec eux une part de leur souveraineté."
 FRW_trait_monnet:0 "Planificateur de l'Europe"
 FRW_trait_monnet_desc:0 "Négociant en cognac devenu financier international, secrétaire général adjoint de la Société des Nations à trente et un ans."
 FRW_dec_appoint_monnet:0 "Nommer Jean Monnet"
 FRW_dec_appoint_monnet_desc:0 "Jean Monnet a passé sa vie à convaincre les gouvernements de mettre en commun ce qu'ils ne peuvent gérer seuls, du fret maritime allié en 1917 aux prêts à la Pologne et à la Chine. Il est convaincu que les nations d'Europe devront un jour partager leur charbon et leur acier, et avec eux une part de leur souveraineté."
 FRW_dec_dismiss_monnet:0 "Renvoyer Jean Monnet"
 FRW_dec_dismiss_monnet_desc:0 "Jean Monnet quitte le Conseil des ministres."
 FRW_adv_monnet_effects_tt:0 "§YJean Monnet§! entre au gouvernement en tant que §YPlanificateur de l'Europe§! (conseiller politique) :\nEfficacité maximale des usines : §G+5%§!\nOpinion commerciale : §G+20%§!\nGain d'opinion mensuel : §G+10%§!\nSoutien à la guerre : §R-3%§!"
 FRW_adv_monnet_req:0 "§YJean Monnet§! est conseiller politique"
 FRW_adv_dautry:0 "Raoul Dautry"
 FRW_adv_dautry_desc:0 "Raoul Dautry s'est fait un nom en reconstruisant les lignes dévastées du nord de la France et en modernisant les Chemins de fer de l'État. Il a peu de patience pour les commissions et préfère fixer un objectif, puis laisser ses ingénieurs l'atteindre."
 FRW_trait_dautry:0 "Ministre de l'Armement"
 FRW_trait_dautry_desc:0 "L'ingénieur qui a reconstruit les chemins de fer du Nord après 1918 et dirigé le réseau de l'État comme une entreprise moderne."
 FRW_dec_appoint_dautry:0 "Nommer Raoul Dautry"
 FRW_dec_appoint_dautry_desc:0 "Raoul Dautry s'est fait un nom en reconstruisant les lignes dévastées du nord de la France et en modernisant les Chemins de fer de l'État. Il a peu de patience pour les commissions et préfère fixer un objectif, puis laisser ses ingénieurs l'atteindre."
