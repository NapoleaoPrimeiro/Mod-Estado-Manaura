 FRW_hook_the_resistance_0_tt:0 "Prestige de la France libre : §G+5§!"
 FRW_ff_chequers_spirit_desc:0 "La Grande-Bretagne finance, arme et ravitaille les Français libres, et reconnaît de Gaulle comme leur chef."
 FRW_ff_national_committee_spirit_desc:0 "Le Comité national français gouverne depuis Londres."
 FRW_ff_bcra_spirit_desc:0 "Le service de renseignement de la France libre anime des réseaux dans toute la France occupée."
 FRW_ff_cnr_spirit_desc:0 "Le Conseil national de la Résistance unit les mouvements."
 FRW_ff_bir_hakeim_spirit_desc:0 "L'armée se souvient des seize jours dans le désert."
 FRW_ff_fafl_spirit_desc:0 "Les aviateurs français volent de nouveau sous la croix de Lorraine."
 FRW_ff_normandie_spirit_desc:0 "Des pilotes français volent sur Yak aux côtés de l'aviation soviétique."
 FRW_ff_fnfl_spirit_desc:0 "Les navires de la France libre escortent les convois de l'Atlantique."
 FRW_ff_securite_sociale_spirit_desc:0 "Chaque salarié est assuré. C'est coûteux, et très populaire."
 FRW_ff_reconstruction_spirit_desc:0 "La France reconstruit ce que la guerre a détruit."
 FRW_ff_fourth_republic_spirit_desc:0 "Une Assemblée élue gouverne de nouveau la France."
 FRW_ff_eurafrican_assembly_spirit_desc:0 "L'Europe et l'Afrique partagent un même parlement."
 FRW_ff_lorraine_spirit_desc:0 "Les équipages de bombardiers français mènent leurs propres missions au-dessus de la France."
 FRW_ff_richelieu_spirit_desc:0 "Le plus moderne des cuirassés français reprend le combat."
 FRW_ff_maquis_spirit_desc:0 "Les collines de France sont pleines d'hommes en armes."
 FRW_ff_colonial_recruitment_spirit_desc:0 "Les tirailleurs d'Afrique remplissent les rangs de l'armée de libération."
 FRW_ff_cfln_spirit_desc:0 "Un comité, une armée, une France."
 FRW_ff_cef_spirit_desc:0 "Les troupes de montagne de Juin ouvrent la voie."
 FRW_ff_dragoon_spirit_desc:0 "L'armée sait débarquer sur un rivage hostile."
 FRW_ff_dakar_tt:0 "L'§YAfrique-Occidentale française§! (Dakar) s'est ralliée à la France libre"
 FRW_ff_sov_fights_tt:0 "L'§YUnion soviétique§! est en guerre contre l'§YAllemagne§!"
 FRW_return_cat:0 "L'Afrique française aux mains des Alliés"
 FRW_return_cat_desc:0 "Des troupes alliées tiennent une partie de l'Afrique française. Demandez-leur de rendre ces territoires à la France, poliment ou avec une offre qu'ils auront du mal à refuser.\n\nPrestige de la France libre : §Y[?FRW_ff_prestige|0]§!"
 FRW_dec_return_request:0 "Demander à [FROM.GetName] de rendre l'Afrique française"
 FRW_dec_return_request_desc:0 "[FROM.GetName] détient des territoires français en Afrique. Une demande diplomatique coûte peu, mais elle peut être refusée."
 FRW_dec_return_request_tt:0 "[FROM.GetName] décide. Une IA accepte d'autant plus volontiers que notre §Yprestige de la France libre§! est élevé (d'environ §Y50 %§! jusqu'à §Y95 %§!).\nEn cas d'acceptation, chaque État §Yfrançais§! d'§YAfrique§! détenu par [FROM.GetName] revient à la France."
 FRW_dec_return_buy_pp:0 "Racheter l'Afrique française à [FROM.GetName]"
 FRW_dec_return_buy_pp_desc:0 "La France offre des concessions et des crédits en échange de ses territoires africains."
 FRW_dec_return_buy_tt:0 "Une IA accepte toujours. [FROM.GetName] reçoit §Y60§! de pouvoir politique ; en cas de refus, nous récupérons nos §Y100§! de pouvoir politique.\nEn cas d'acceptation, chaque État §Yfrançais§! d'§YAfrique§! détenu par [FROM.GetName] revient à la France."
 FRW_dec_return_buy_gold:0 "Payer l'Afrique française en or"
 FRW_dec_return_buy_gold_desc:0 "Trois cents tonnes de l'or de la Banque de France pour le retour de l'Afrique française.\n\nOr restant : §Y[?FRW_gold|0] t§!"
 FRW_dec_return_gold_tt:0 "Réserves d'or : §R-300 t§!. Une IA accepte toujours. [FROM.GetName] reçoit §YL'or français§! pendant un an (biens de consommation §G-5 %§!) ; en cas de refus, l'or nous revient.\nEn cas d'acceptation, chaque État §Yfrançais§! d'§YAfrique§! détenu par [FROM.GetName] revient à la France."
 frw_ret.hand_tt:0 "Chaque État §Yfrançais§! d'§YAfrique§! que nous détenons revient à la §YFrance§!."
 frw_ret.1.t:0 "La France réclame ses colonies"
 frw_ret.1.d:0 "Le gouvernement français nous rappelle que les territoires africains que tiennent nos troupes sont français. Il demande qu'ils soient rendus à son administration."
 frw_ret.1.a:0 "Ce sont nos alliés. Rendons-les."
 frw_ret.1.b:0 "Pas tant que la guerre continue."
 frw_ret.2.t:0 "Une offre française"
 frw_ret.2.d:0 "Paris offre des concessions commerciales et des crédits si nous rendons les territoires français d'Afrique que tiennent nos troupes."
 frw_ret.2.a:0 "Un prix honnête. Accepté."
 frw_ret.2.b:0 "Nous ne sommes pas à vendre."
 frw_ret.3.t:0 "De l'or français pour l'Afrique française"
 frw_ret.3.d:0 "Les Français offrent trois cents tonnes d'or prélevées sur les réserves de la Banque de France pour le retour de leurs territoires africains."
 frw_ret.3.a:0 "L'or parle plus fort que les mots. Accepté."
 frw_ret.3.b:0 "Gardez votre or."
 frw_ret.10.t:0 "L'Afrique française revient"
 frw_ret.10.d:0 "Nos alliés nous ont rendu les territoires français d'Afrique. Le drapeau tricolore flotte de nouveau sur les bâtiments du gouvernement."
 frw_ret.10.a:0 "Merci, mes amis."
 frw_ret.11.t:0 "Notre demande a été refusée"
 frw_ret.11.d:0 "Nos alliés ne rendront pas les territoires français d'Afrique pour le moment."
 frw_ret.11.a:0 "Nous redemanderons."
 FRW_french_gold_payment_desc:0 "Or versé par la France en échange du retour de ses territoires africains."
 FRW_brethren_of_the_coast:0 "Les Frères de la Côte"
 FRW_brethren_of_the_coast_desc:0 "Dans les tavernes de Saint-Malo, de Brest et de Toulon, les hommes du capitaine signent les vieux articles des Frères de la Côte : une part de chaque prise, une voix pour l'élection de chaque capitaine, une pension pour chaque blessure. Les volontaires font la queue devant les bureaux de recrutement de la Marine."
 FRW_sea_wolves:0 "Les Loups de mer"
 FRW_sea_wolves_desc:0 "Des corsaires rapides et des sous-marins à long rayon d'action partent guetter leurs proies sur les routes maritimes. Le capitaine veut que chaque capitaine marchand d'Europe regarde par-dessus son épaule."
 FRW_privateer_squadrons:0 "Les escadres corsaires"
 FRW_privateer_squadrons_desc:0 "Tout armateur de Bretagne et de Normandie peut armer ses navires en course sous lettre de marque française. L'État paie les canons ; les armateurs gardent la moitié des prises."
 FRW_boarding_parties:0 "Les compagnies d'abordage"
 FRW_boarding_parties_desc:0 "Des fusiliers marins entraînés à s'emparer par surprise d'un navire ou d'un port : grappins, pistolets-mitrailleurs et aucune question posée."
 FRW_new_tortuga:0 "Une nouvelle Tortue"
 FRW_new_tortuga_desc:0 "Saint-Malo est proclamé port franc, sans douane ni inspection. Toute cargaison d'Europe qui doit franchir un blocus peut passer par le port du capitaine, moyennant finance."
 FRW_black_admiralty:0 "L'Amirauté noire"
 FRW_black_admiralty_desc:0 "Les vieux amiraux sont mis à la retraite et les hommes du capitaine prennent leur place sur les passerelles de la flotte. Le Goff, Morvan et Duroc ont navigué sous des pavillons qu'aucun annuaire de la Marine ne mentionne."
 FRW_black_admiralty_tt:0 "Trois nouveaux amiraux rejoignent la flotte : §YYann Le Goff§! (Loup de mer), §YCorentin Morvan§! (Forceur de blocus) et §YAnatole Duroc§! (Flanc de fer)."
 FRW_jolly_roger:0 "Sous le Jolly Roger"
 FRW_jolly_roger_desc:0 "Le pavillon noir flotte au grand mât du navire amiral. La flotte combat comme le faisaient les corsaires de Saint-Malo, en choisissant ses proies et en gardant ses prises."
 FRW_isles_balearics:0 "Raid sur les Baléares"
 FRW_isles_balearics_desc:0 "Majorque et Minorque se dressent sur toutes les routes de Marseille à Gibraltar. Le capitaine entend mouiller ses frégates à Port-Mahon, où des navires français arborèrent les lys pour la dernière fois en 1756."
 FRW_isles_balearics_tt:0 "§YRevendique§! les §YÎles Baléares§! et obtient un §Ybut de guerre§! contre leur possesseur, l'Espagne."
 FRW_isles_fortunate:0 "Les îles Fortunées"
 FRW_isles_fortunate_desc:0 "Les Canaries et Madère gardent la route de l'Afrique et des Amériques. Les corsaires d'autrefois les prenaient pour leur vin et leur sucre ; le capitaine veut leurs ports."
 FRW_isles_fortunate_tt:0 "§YRevendique§! les §YÎles Canaries§! et §YMadère§!, et obtient des §Ybuts de guerre§! contre leurs possesseurs (Espagne, Portugal)."
 FRW_isles_keys_med:0 "Les clés de la Méditerranée"
 FRW_isles_keys_med_desc:0 "Malte et Gibraltar sont les deux serrures de la mer intérieure, et la Royal Navy en détient les deux clés. Le capitaine n'a jamais eu peur de la Royal Navy."
 FRW_isles_keys_med_tt:0 "§YRevendications§! sur §YMalte§! et §YGibraltar§! et un §Ybut de guerre§! contre le Royaume-Uni."
 FRW_isles_azores:0 "Les îles de l'Atlantique"
 FRW_isles_azores_desc:0 "Les Açores, les îles du Cap-Vert et São Tomé permettraient à une flotte française de traverser l'Atlantique sans demander de charbon à personne."
 FRW_isles_azores_tt:0 "§YRevendications§! sur les §YAçores§!, le §YCap-Vert§! et §YSão Tomé§! et un §Ybut de guerre§! contre le Portugal."
 FRW_isles_spanish_main:0 "Le Main espagnol"
 FRW_isles_spanish_main_desc:0 "La Tortue, Port Royal, Nassau : les Caraïbes furent le royaume des Frères de la Côte. Le capitaine renvoie ses navires sur les anciens terrains de chasse de la Jamaïque, des Bahamas, de Trinidad, de Curaçao et des îles alentour."
 FRW_isles_spanish_main_tt:0 "§YRevendications§! sur les îles des Caraïbes et §Ybuts de guerre§! contre leurs possesseurs :\n- §YRoyaume-Uni§! : Jamaïque, Bahamas, Trinidad, îles du Vent, Bermudes\n- §YPays-Bas§! : Curaçao\n- §YHaïti§!, la §YRépublique dominicaine§! et §YCuba§!"
 FRW_isles_libertalia:0 "Libertalia"
 FRW_isles_libertalia_desc:0 "La légende raconte que les pirates de l'océan Indien fondèrent jadis une république libre sur la côte de Madagascar. Le capitaine entend faire de la légende une réalité, en commençant par Maurice et les Seychelles."
 FRW_isles_libertalia_tt:0 "§YRevendications§! sur §YMaurice§! et les §YSeychelles§! et un §Ybut de guerre§! contre le Royaume-Uni.\n§YMadagascar§!, §YLa Réunion§! et les §YComores§! (si françaises) : §G+10 %§! de conformité."
 FRW_isles_north:0 "Les îles du Nord"
 FRW_isles_north_desc:0 "Les Shetland, les Féroé et l'Islande ferment l'Atlantique Nord comme une porte. Qui les tient peut étrangler les convois de trois nations."
 FRW_isles_north_tt:0 "§YRevendications§! sur les §YShetland§!, les §YÎles Féroé§! et l'§YIslande§! et §Ybuts de guerre§! contre leurs possesseurs (Royaume-Uni, Danemark, Islande)."
 FRW_isles_republic:0 "La République des Îles"
 FRW_isles_republic_desc:0 "Des Baléares aux Seychelles, les îles du capitaine sont gouvernées comme une seule fédération libre de ports. Elles ne paient aucun impôt à Paris et fournissent à la place des navires et des marins."
 FRW_isles_republic_tt:0 "§GTerritoire national§! sur chaque île possédée par la France parmi les Baléares, les Canaries, Madère, les Açores, le Cap-Vert, São Tomé, Malte, Gibraltar, les îles des Caraïbes, Maurice, les Seychelles, les Shetland et les Féroé."
 FRW_black_flag:0 "Le Pavillon Noir"
 FRW_black_flag_2:0 "Les Loups de mer"
 FRW_black_flag_3:0 "Sous le Jolly Roger"
 FRW_boarders:0 "Les compagnies d'abordage"
 FRW_free_port:0 "Une nouvelle Tortue"
 FRW_island_bases:0 "La République des Îles"
 FRW_black_flag_desc:0 "Les articles des Frères de la Côte : une part pour chaque homme, une voix pour l'élection de chaque capitaine et pas de quartier pour le marchand qui résiste."
 FRW_black_flag_2_desc:0 "Corsaires et sous-marins chassent sur toutes les routes maritimes d'Europe."
 FRW_black_flag_3_desc:0 "Le pavillon noir flotte au grand mât du navire amiral. La flotte du capitaine ne fait pas de quartier et se paie en prises."
 FRW_boarders_desc:0 "Des fusiliers marins entraînés à s'emparer par surprise d'un navire ou d'un port."
 FRW_free_port_desc:0 "Saint-Malo est un port franc. Aucun douanier ne monte à bord, mais chaque navire acquitte un droit."
 FRW_island_bases_desc:0 "Une chaîne de ports insulaires, des Baléares aux Seychelles, ravitaille les flottes et les troupes de débarquement du capitaine."
 FRW_pirate_captain:0 "Capitaine corsaire"
 FRW_pirate_captain_desc:0 "Il a combattu sous trois pavillons et n'a perdu aucune bataille en mer sous aucun d'entre eux."
 FRW_pirate_legoff:0 "Yann Le Goff"
 FRW_pirate_morvan:0 "Corentin Morvan"
 FRW_pirate_duroc:0 "Anatole Duroc"
 FRW_mediterranean_ambition_tt:0 "Si §YJacques Doriot§! dirige la France : §Yrevendications§! sur la §YTripolitaine§! et le §YFezzan§!."
 FRW_rome_accords:0 "Les accords de Rome"
 FRW_rome_accords_desc:0 "En janvier 1935, Laval et Mussolini ont réglé leurs différends en Afrique. La France a cédé une bande de désert à la Libye, et l'Italie a accepté de renoncer au statut particulier de ses colons en Tunisie. La Rocque entend obliger Rome à tenir ses engagements."
 FRW_stresa_front:0 "Le front de Stresa renouvelé"
 FRW_stresa_front_desc:0 "À Stresa, en avril 1935, la France, la Grande-Bretagne et l'Italie se sont unies pour garantir l'indépendance de l'Autriche. La Rocque veut rétablir ce front, avec Rome pour premier allié de la France."
 FRW_stresa_front_tt:0 "Invite l'§YItalie§! dans la faction de la France (si la France en dirige une)."
 FRW_latin_naval_pact:0 "Le pacte naval latin"
 FRW_latin_naval_pact_desc:0 "Toulon et La Spezia mettent leurs plans en commun. La flotte française garde la Méditerranée occidentale, la flotte italienne le bassin central et le détroit de Sicile."
 FRW_latin_union:0 "L'Union latine"
 FRW_latin_union_desc:0 "La Rocque ne cherche pas à conquérir ses voisins latins. Il offre à Rome et à Madrid une union douanière et une défense commune de Lisbonne à Trieste, sous la direction de Paris."
 FRW_latin_union_tt:0 "Une §YItalie§! alliée au sein de la faction de la France compte désormais comme contrôlée pour l'§YEmpire latin§! (l'Espagne et le Portugal restent nécessaires)."
 FRW_dec_renew_federal_offer:0 "Renouveler l'offre fédérale"
 FRW_dec_renew_federal_offer_desc:0 "Tous les gouvernements n'étaient pas prêts la première fois que Paris les a sollicités. Une nouvelle délégation de fédéralistes parcourt les capitales d'Europe avec la même offre : une seule armée, une seule monnaie, une seule assemblée fédérale."
 FRW_dec_renew_federal_offer_tt:0 "Chaque nation mineure démocratique d'Europe appartenant à la faction de la France ou placée sous garantie française est de nouveau invitée à rejoindre la §YFédération européenne§!."
 FRW_marshals_of_the_empire_tt:0 "§YLe prince Louis Napoléon§! entre lui-même en campagne en tant que §Ymaréchal§! (Doctrine offensive)."
 FRW_continental_system_tt:0 "Fonde la faction du §YBlocus continental§! (si la France n'appartient à aucune faction) et invite la §YPologne§! et le §YDanemark§!, anciens alliés de l'Empereur."
 FRW_rhine_held:0 "Le Rhin a tenu"
 FRW_continental_system_faction:0 "Le Blocus continental"
 FRW_rhine_held_desc:0 "Lorsque les bataillons allemands sont entrés en Rhénanie, la France a mobilisé, et Berlin les a rappelés. Le pays ne s'était pas senti aussi sûr de lui depuis 1918."
 frw_fb3.1.t:0 "Le Rhin a tenu"
 frw_fb3.1.d:0 "Les colonnes allemandes qui avaient pénétré dans la zone démilitarisée repassent les ponts du Rhin. Hitler a cédé le premier. À Paris, les journaux parlent de la première victoire depuis Versailles, et les députés qui ont voté la mobilisation sont acclamés devant le Palais-Bourbon."
 frw_fb3.1.a:0 "La France monte toujours la garde sur le Rhin."
 FRW_dec_invite_trotsky:0 "Offrir l'asile à Léon Trotski"
 FRW_dec_invite_trotsky_desc:0 "Trotski a vécu en France jusqu'en 1935, lorsque la République l'a expulsé pour complaire à Moscou. Une France ouvrière pourrait faire revenir l'homme qui a bâti l'Armée rouge, même si Staline ne le lui pardonnerait pas."
 FRW_dec_invite_trotsky_tt:0 "§YLéon Trotski§! vient en France et peut être nommé §Yconseiller politique§!."
 frw_fb3.2.t:0 "Trotski à Paris"
 frw_fb3.2.d:0 "Léon Trotski est descendu du train en gare de Lyon, dix ans après que Staline l'a chassé d'Union soviétique. Il veut donner des conférences, écrire et aider à organiser notre armée. Moscou a rappelé son ambassadeur pour consultations."
 frw_fb3.2.a:0 "Bienvenue, camarade."
 frw_fb3.2.a.tt:0 "§YLéon Trotski§! peut être nommé §Yconseiller politique§!.\nAvec §YMarceau Pivert§! : §G+3 %§! de stabilité et de soutien au communisme.\nAvec §YMaurice Thorez§! : §R-5 %§! de stabilité.\nUne §YUnion soviétique§! communiste s'en offusque (§R-40§! d'opinion)."
 FRW_adv_trotsky:0 "Léon Trotski"
 FRW_trait_trotsky:0 "Fondateur de l'Armée rouge"
 FRW_trotsky_affront:0 "Abrite Trotski"
