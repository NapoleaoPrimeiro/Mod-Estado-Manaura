 FRW_leader_blum:0 "Léon Blum"
 FRW_leader_blum_desc:0 "Léon Blum, chef de la SFIO, est le premier socialiste et le premier Juif à diriger un gouvernement français. Son Front populaire est arrivé au pouvoir en 1936 avec pour mot d'ordre « Pain, paix, liberté »."
 FRW_leader_reynaud:0 "Paul Reynaud"
 FRW_leader_reynaud_desc:0 "Homme politique énergique de l'Alliance démocratique, spécialiste des finances, Reynaud met depuis longtemps en garde contre l'Allemagne et protège le jeune colonel de Gaulle."
 FRW_leader_degaulle:0 "Charles de Gaulle"
 FRW_leader_degaulle_desc:0 "Longtemps partisan de la guerre blindée et d'un exécutif fort, le grand officier dirige désormais une République réformée."
 FRW_leader_thorez:0 "Maurice Thorez"
 FRW_leader_thorez_desc:0 "Fils de mineur du Pas-de-Calais, Thorez est secrétaire général du PCF et suit de près la ligne fixée par le Komintern."
 FRW_leader_pivert:0 "Marceau Pivert"
 FRW_leader_pivert_desc:0 "Chef de la Gauche révolutionnaire, Pivert a lancé le mot d'ordre « Tout est possible ! ». Il veut une révolution conduite par les conseils ouvriers et indépendante de Moscou."
 FRW_leader_larocque:0 "François de La Rocque"
 FRW_leader_larocque_desc:0 "Le colonel de La Rocque a dirigé les Croix-de-Feu et préside désormais le Parti social français. Il appelle de ses vœux un État catholique et national doté d'une politique sociale ambitieuse."
 FRW_leader_doriot:0 "Jacques Doriot"
 FRW_leader_doriot_desc:0 "Ancien communiste et toujours maire de Saint-Denis, Doriot a fondé en 1936 le Parti populaire français, le mouvement de masse le plus radical de la droite française."
 FRW_leader_petain:0 "Philippe Pétain"
 FRW_leader_petain_desc:0 "Le vainqueur de Verdun est le soldat le plus respecté de France, et beaucoup comptent sur lui pour sauver le pays."
 FRW_leader_comtedeparis:0 "Henri VI (comte de Paris)"
 FRW_leader_comtedeparis_desc:0 "Henri d'Orléans, comte de Paris, est le chef de la maison d'Orléans et le prétendant orléaniste au trône. Il règne sous le nom d'Henri VI."
 FRW_leader_napoleon:0 "Napoléon VI"
 FRW_leader_napoleon_desc:0 "Louis, prince Napoléon, chef de la maison Bonaparte, est jeune et ambitieux et porte le nom le plus célèbre de l'histoire de France."
