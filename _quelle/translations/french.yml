 frw_sys.75.a:0 "Nous reviendrons."
 frw_sys.26.t:0 "L'Indochine française se rallie à la France libre"
 frw_sys.26.d:0 "Hanoï et Saïgon se sont ralliées à la France libre. L'amiral Decoux a été renvoyé en métropole par bateau."
 frw_sys.26.a:0 "Vive la France libre !"
 frw_sys.36.t:0 "L'Indochine française reste fidèle à Vichy"
 frw_sys.36.d:0 "L'amiral Decoux garde l'Indochine pour Vichy, sous les yeux de la garnison japonaise. La prochaine fois, nos émissaires seront mieux préparés."
 frw_sys.36.a:0 "Nous essaierons de nouveau."
 frw_sys.66.t:0 "Nos troupes débarquent en Indochine française"
 frw_sys.66.d:0 "Les colonnes de la France libre, appuyées par des navires et des avions alliés, ont atteint la capitale de la région. Hanoï et Saïgon se sont ralliées à la France libre. L'amiral Decoux a été renvoyé en métropole par bateau."
 frw_sys.66.a:0 "La croix de Lorraine flotte de nouveau."
