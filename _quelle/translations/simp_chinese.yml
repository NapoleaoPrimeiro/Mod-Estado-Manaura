 FRW_dec_fort_meuse:0 "封闭默兹河缺口"
 FRW_dec_fort_meuse_desc:0 "总参谋部称阿登山区无法通行。第2集团军的工兵却没有那么肯定，他们希望在色当与蒙梅迪之间的默兹河沿岸修建碉堡。"
 FRW_dec_fort_nord:0 "加固北部边境"
 FRW_dec_fort_nord_desc:0 "从敦刻尔克到莫伯日，与比利时的边境门户洞开。一条由碉堡和反坦克壕组成的防线将沿运河修建。"
 FRW_dec_fort_alps:0 "阿尔卑斯筑垒地域"
 FRW_dec_fort_alps_desc:0 "高踞莫列讷和蒂内山口之上的要塞，足以挡住任何企图翻越阿尔卑斯山的军队。"
 FRW_dec_fort_pyrenees:0 "守望比利牛斯"
 FRW_dec_fort_pyrenees_desc:0 "西班牙的战火可能越过群山蔓延而来。几处支撑点将扼守各山口以及勒佩尔蒂的沿海公路。"
 FRW_dec_fort_mareth:0 "马雷特防线"
 FRW_dec_fort_mareth_desc:0 "在加贝斯以南、大海与马特马塔丘陵之间，一条碉堡线封锁了从意属利比亚进入突尼斯的道路。"
 FRW_dec_fort_coast:0 "布雷斯特与土伦的海岸炮台"
 FRW_dec_fort_coast_desc:0 "新的重炮台和高射炮守护着共和国的两大海军基地。"
 FRW_dec_fort_paris_aa:0 "巴黎防空"
 FRW_dec_fort_paris_aa_desc:0 "探照灯、监听哨和高射炮阵地环绕首都，一座新建的雷达站监视着北方的天空。"
 FRW_dec_fort_corsica:0 "加固科西嘉"
 FRW_dec_fort_corsica_desc:0 "阿雅克肖和巴斯蒂亚都在意大利舰队的打击范围之内。岸防炮和一支小规模守备部队将确保该岛的安全。"
 FRW_frontier_cat:0 "边境防御"
 FRW_frontier_cat_desc:0 "马奇诺防线只覆盖了法国的一部分。这些工事将填补北部、阿尔卑斯山、比利牛斯山以及海外的剩余缺口。每项工程需要数周时间完成。"
 FRW_dec_war_taxis:0 "征用巴黎出租车"
 FRW_dec_war_taxis_desc:0 "1914年，巴黎的出租车曾将一个师送上马恩河前线。如今，首都地区的每一辆卡车、公共汽车和小汽车都将被征调服役。"
 FRW_dec_war_reserves:0 "征召预备役各年龄组"
 FRW_dec_war_reserves_desc:0 "多年前退役的老兵被重新征召入伍。"
 FRW_dec_war_arsenals:0 "开放1918年的军械库"
 FRW_dec_war_arsenals_desc:0 "仓库里仍存放着上一场战争留下的步枪和火炮。虽然老旧，但聊胜于无。"
 FRW_dec_war_gold:0 "将黄金运往达喀尔"
 FRW_dec_war_gold_desc:0 "海军的巡洋舰可以将法兰西银行的储备运到敌人鞭长莫及之处。无论巴黎发生什么，国家都不会破产。"
 FRW_dec_war_loire:0 "退守卢瓦尔河"
 FRW_dec_war_loire_desc:0 "如果前线守不住，军队也绝不能被歼灭。它将有序撤退至下一条河流，重新构筑阵地。"
