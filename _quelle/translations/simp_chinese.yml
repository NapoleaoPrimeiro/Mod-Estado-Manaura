l_simp_chinese:
 # France Rework – simplified Chinese translation (machine-assisted, reviewed for consistency). Missing keys fall back to English.
 FRW_crisis_of_the_republic:0 "第三共和国的危机"
 FRW_crisis_of_the_republic_desc:0 "1934年2月6日的骚乱在协和广场造成十五人死亡，并导致达拉第内阁倒台。两年过去了，各党派对国家的前进方向仍争执不下。"
 FRW_defend_the_republic:0 "保卫共和国"
 FRW_defend_the_republic_desc:0 "第三共和国挺过了1914年至1918年的四年战争。共和国的捍卫者们认为，它同样能挺过右翼同盟和经济萧条的冲击。"
 FRW_social_truce:0 "社会休战"
 FRW_social_truce_desc:0 "1936年6月，两百万工人占领了他们的工厂。工会领袖和雇主联合会被召集到马提尼翁府，不达成协议谁也不许离开。"
 FRW_social_truce_tt:0 "使法国免于因稳定度过低而引发的§R共产主义起义§!。\n结束§Y罢工浪潮§!。\n于§Y1936年6月§!起可用。"
 FRW_end_disjointed_government:0 "结束内阁走马灯"
 FRW_end_disjointed_government_desc:0 "自1930年以来，法国已经历了十几届内阁，很少有能维持一年以上的。部长们还没熟悉自己的职责，内阁就已倒台。"
 FRW_end_disjointed_government_tt:0 "§Y分裂的政府§!变为§Y脆弱的政府§!。两项决议（分别自1937年和1938年起可用，间隔至少6个月）可将其彻底移除——或由§Y新宪法§!立即终结。"
 FRW_front_populaire:0 "人民阵线"
 FRW_front_populaire_desc:0 "1936年5月大选后，莱昂·布鲁姆组建了由社会党人和激进党人组成的政府，并在众议院获得共产党人的支持，承诺推行社会改革。"
 FRW_front_populaire_tt:0 "需要§Y莱昂·布鲁姆§!的支持（决议§Y争取莱昂·布鲁姆§!，45天）。"
 FRW_union_nationale:0 "国民联合"
 FRW_union_nationale_desc:0 "保罗·雷诺以平衡预算和重整军备为纲领，团结了中右翼力量。"
 FRW_union_nationale_tt:0 "需要§Y保罗·雷诺§!的支持（决议§Y争取保罗·雷诺§!，45天）。"
 FRW_matignon_reforms:0 "马提尼翁协议"
 FRW_matignon_reforms_desc:0 "1936年6月的马提尼翁协议提高了工资，并确立了集体谈判制度。被占领的工厂人去楼空，工作得以恢复。"
 FRW_nationalize_arms_industry:0 "军火工业国有化"
 FRW_nationalize_arms_industry_desc:0 "根据1936年8月的法律，国家接管了主要的兵工厂，战争生产转入公有。"
 FRW_conges_payes:0 "带薪休假"
 FRW_conges_payes_desc:0 "如今每名工人每年都享有两周带薪休假。那年夏天，开往海滨的火车上挤满了从未见过大海的家庭。"
 FRW_republican_volunteers:0 "共和国志愿者"
 FRW_republican_volunteers_desc:0 "法国志愿者越过比利牛斯山，为西班牙共和国而战，归来时带回了现代战争的惨痛经验。"
 FRW_plan_de_relance:0 "复苏计划"
 FRW_plan_de_relance_desc:0 "政府启动了一项大规模的公共工程与投资计划，以带领法国走出大萧条。"
 FRW_reynaud_rearmament:0 "雷诺的重整军备"
 FRW_reynaud_rearmament_desc:0 "雷诺多年来一直在众议院警告德国重整军备的威胁。如今他身居要职，可以将在野时的主张付诸实施。"
 FRW_decree_laws:0 "以法令治国"
 FRW_decree_laws_desc:0 "政府手握法令权，无需等待四分五裂的议会便可推行各项措施。"
 FRW_armee_de_metier:0 "迈向职业军队"
 FRW_armee_de_metier_desc:0 "在《建立职业军队》（1934年）一书中，戴高乐中校呼吁建立一支以装甲师为核心的职业军队。次年，雷诺在众议院采纳了这一主张。法国将建立一支规模较小、由长期服役的职业军人组成的军队。"
 FRW_gaullist_presidency:0 "总统制共和国"
 FRW_gaullist_presidency_desc:0 "夏尔·戴高乐成为国家元首，其权力远远超过1875年宪法下的任何一位总统。"
 FRW_republican_mobilization:0 "共和国武装起来"
 FRW_republican_mobilization_desc:0 "全国各地召回预备役人员，工厂纷纷转向满足国防需要。"
 FRW_entente_cordiale:0 "重续英法协约"
 FRW_entente_cordiale_desc:0 "1904年的英法协约经受住了西线四年战火的考验。巴黎提议将其变为与伦敦的常设同盟。"
 FRW_entente_cordiale_tt:0 "法国与§Y英国§!加入同一阵营（若英国为民主国家）：\n- 若英国领导一个阵营，法国将加入该阵营。\n- 否则法国将建立§Y协约国§!，英国随后加入。\n由玩家控制的英国将通过事件作出决定。"
 FRW_union_francaise:0 "法兰西联盟"
 FRW_union_francaise_desc:0 "巴黎提议将殖民帝国改组为各联系民族的联盟，而法国仍居于其首。"
 FRW_union_francaise_tt:0 "组建§Y法兰西联盟§!：获得新国名和国旗、国家精神，并获得法国拥有（包括日后获得）的§G阿尔及利亚及海外省的核心领土§!（安的列斯、圭亚那、留尼汪），以及对其余部分的§Y宣称§!。\n取代法国此前组建的任何国家（移除其可组建国家的国家精神）。若法国已是§Y永恒的弗朗西亚王国§!，则保持不变。"
 FRW_little_entente_guarantees:0 "拉拢小协约国"
 FRW_little_entente_guarantees_desc:0 "捷克斯洛伐克、南斯拉夫和罗马尼亚早已依赖法国的保障。如今，法国外交部邀请它们缔结正式同盟。"
 FRW_franco_british_union:0 "英法联盟"
 FRW_franco_british_union_desc:0 "让·莫内和温斯顿·丘吉尔都曾谈及将两国统一于一个政府之下。如今巴黎向伦敦正式提出这一建议。"
 FRW_franco_british_union_tt:0 "向伦敦提议建立§Y英法联盟§!（AI控制的英国总会接受，玩家控制的英国自行决定）：\n- 两国均获得§Y英法联盟§!。\n- 法国采用联盟的国名和国旗（取代此前组建的任何国家，§Y永恒的弗朗西亚王国§!除外）。联盟不带来新的核心领土。"
 FRW_colonial_assembly:0 "殖民地议会"
 FRW_colonial_assembly_desc:0 "来自各殖民地的代表在巴黎的一个咨询议会中就座。"
 FRW_colonial_assembly_tt:0 "所有非核心地区：顺从度§G+10%§!。"
 FRW_council_of_europe:0 "白里安计划"
 FRW_council_of_europe_desc:0 "1929年，阿里斯蒂德·白里安在日内瓦提出建立欧洲联盟。他的继任者们将这一计划从法国外交部的档案中重新翻了出来。"
 FRW_council_of_europe_tt:0 "建立§Y欧洲共同体§!（若法国不在任何阵营中），并邀请§Y比利时§!、§Y荷兰§!、§Y卢森堡§!和§Y瑞士§!加入。\n待共同体融合成形后，再宣布成立§Y欧洲联邦§!本身。"
 FRW_rhine_guarantee:0 "莱茵河守护者"
 FRW_rhine_guarantee_desc:0 "七十年间，德国军队两度侵入法国。莱茵河必须作为国家的安全边界而守住。"
 FRW_rhine_guarantee_tt:0 "若§Y德国§!为法西斯国家：获得对德国的§Y推翻政府§!战争借口。"
 FRW_arsenal_of_democracy:0 "武装自由国家"
 FRW_arsenal_of_democracy_desc:0 "法国工厂为欧洲每一个仍在抵抗的民主国家生产武器。"
 FRW_european_defence_community:0 "共同防务委员会"
 FRW_european_defence_community_desc:0 "法国与其伙伴共享军备研究成果，并制定共同防御计划。"
 FRW_franco_belgian_customs:0 "与比利时的关税同盟"
 FRW_franco_belgian_customs_desc:0 "关税同盟将比利时和卢森堡的经济与法国紧密相连。"
 FRW_franco_belgian_customs_tt:0 "组建§Y西方联盟§!：获得新国名和国旗、国家精神，并获得法国拥有的§G比利时、荷兰和卢森堡领土的核心领土§!（包括日后在当地获得的领土），以及对其余部分的§Y宣称§!。\n取代法国此前组建的任何国家（移除其可组建国家的国家精神）。若法国已是§Y永恒的弗朗西亚王国§!，则保持不变。\n需要控制§Y比利时§!、§Y荷兰§!和§Y卢森堡§!（吞并或作为傀儡，另有说明者除外）。若法国尚未控制这些国家，则一旦控制便会自动建立该国家。"
 FRW_fourth_republic:0 "新宪法"
 FRW_fourth_republic_desc:0 "1875年的宪法本是权宜之计，却沿用了六十年。新宪法将赋予法国更强有力的行政权和更持久的内阁。"
 FRW_aid_spanish_republic:0 "援助西班牙共和国"
 FRW_aid_spanish_republic_desc:0 "1936年，布鲁姆曾想援助马德里，却受到伦敦和他自己的激进党盟友的掣肘。这一次，飞机将飞往南方。"
 FRW_aid_spanish_republic_tt:0 "向西班牙共和国运送§Y2,000支步枪§!，并使法国获得对国民军的§Y推翻政府§!战争借口。"
 FRW_european_customs_union:0 "欧洲关税同盟"
 FRW_european_customs_union_desc:0 "煤炭、钢铁和粮食如今免税通过共同体的边界。莫内的规划者们称这仅仅是一个开端。"
 FRW_european_customs_union_tt:0 "法国阵营的每个成员国获得§Y欧洲伙伴§!（工厂产出+5%，科研速度+3%）。\n需要§Y让·莫内§!担任政治顾问（在§Y部长会议§!的§Y经济§!部门中执行决议§Y任命让·莫内§!）。"
 FRW_european_federation_focus:0 "欧洲联邦"
 FRW_european_federation_focus_desc:0 "各成员国被要求将其军队和货币交给设在巴黎的联邦政府。大多数国家接受了。"
 FRW_european_federation_focus_tt:0 "法国阵营中或受法国保障的每个欧洲民主小国都将被邀请加入联邦（接受即意味着被和平吞并）。可通过决议§Y重申联邦提议§!再次发出邀请。\n组建§Y欧洲联邦§!：获得新国名和国旗、国家精神，并获得法国拥有的§G比荷卢、瑞士、意大利、德国和莱茵兰领土的核心领土§!（包括日后在当地获得的领土），以及对其余部分的§Y宣称§!。\n取代法国此前组建的任何国家（移除其可组建国家的国家精神）。若法国已是§Y永恒的弗朗西亚王国§!，则保持不变。\n需要控制§Y比利时§!、§Y荷兰§!和§Y卢森堡§!（吞并、作为傀儡或通过联邦加入）——完成此国策后不再需要§Y意大利§!或§Y德国§!。若法国尚未控制这些国家，则一旦控制便会自动建立该国家。"
 FRW_forty_hour_week:0 "每周四十小时工作制"
 FRW_forty_hour_week_desc:0 "1936年6月的法律将每周工作时间限制为四十小时。工人们对此表示欢迎，雇主们则抱怨成本上升。"
 FRW_pierre_cot_aviation:0 "大众航空"
 FRW_pierre_cot_aviation_desc:0 "空军部长皮埃尔·科特将飞机制造厂收归国有，并向工人子弟开放飞行俱乐部。"
 FRW_jean_zay_reforms:0 "让·扎伊改革"
 FRW_jean_zay_reforms_desc:0 "教育部长让·扎伊提高了离校年龄，并创立了日后发展为法国国家科学研究中心的研究机构。"
 FRW_relax_forty_hours:0 "兵工厂优先"
 FRW_relax_forty_hours_desc:0 "四十小时工作周仍是法律，但兵工厂获得豁免，可以加班生产。"
 FRW_bread_peace_liberty:0 "面包、和平与自由"
 FRW_bread_peace_liberty_desc:0 "“面包、和平与自由”是人民阵线在1936年的竞选口号。如今，政府将其奉为施政纲领。"
 FRW_reynaud_recovery:0 "雷诺法令"
 FRW_reynaud_recovery_desc:0 "作为财政部长，雷诺放宽了四十小时工作周，恢复了投资者的信心，并使资本回流法国。"
 FRW_mandel_colonies:0 "芒代尔的殖民部"
 FRW_mandel_colonies_desc:0 "殖民地部长乔治·芒代尔承诺组建一支庞大的殖民地军队以保卫法国本土。"
 FRW_mandel_colonies_tt:0 "需要§Y乔治·芒代尔§!担任政治顾问（在§Y部长会议§!的§Y政治§!部门中执行决议§Y任命乔治·芒代尔§!）。"
 FRW_edge_of_the_sword:0 "剑刃"
 FRW_edge_of_the_sword_desc:0 "戴高乐所描述的装甲师成为全军其余部队的样板。戴高乐1932年论述指挥艺术的文章《剑刃》被列入高等军事学院的必读书目。"
 FRW_certaine_idee:0 "法兰西的某种理念"
 FRW_certaine_idee_desc:0 "戴高乐一贯认为，法国只有屹立于世界各国的前列时，才能成为真正的法国。作为总统，他着手在这一信念之上建设共和国。"
 FRW_deat_neosocialism:0 "秩序、权威、民族"
 FRW_deat_neosocialism_desc:0 "在1933年的社会党代表大会上，阿德里安·马凯和马塞尔·德亚告诉党内同仁，必须以“秩序、权威、民族”赢得中产阶级。布鲁姆将他们开除出党。新社会主义者为共和国提供了一个强大的国家和计划经济。"
 FRW_deat_neosocialism_tt:0 "需要§Y马塞尔·德亚§!的支持（决议§Y争取马塞尔·德亚§!，45天）。"
 FRW_deat_labour_plan:0 "劳工计划"
 FRW_deat_labour_plan_desc:0 "在比利时，亨德里克·德曼已经指明了道路：信贷、能源和重工业由国家主导，其余一切留给私人经营。新社会主义者的规划者们正在起草一份法国版本。"
 FRW_deat_national_credit:0 "国家信贷局"
 FRW_deat_national_credit_desc:0 "法兰西银行和各大存款银行被置于国家信贷局的管辖之下。“两百家族”失去了对国库的控制，资金流向由国家决定。"
 FRW_deat_strong_state:0 "强大的国家"
 FRW_deat_strong_state_desc:0 "法令治国成为常态。议会每年表决一次预算和计划，其余时间由行政机构治理。德亚的左翼批评者说，他的秩序社会主义更像是效仿罗马，而非饶勒斯。"
 FRW_deat_die_for_danzig:0 "为但泽而死？"
 FRW_deat_die_for_danzig_desc:0 "“我们必须为但泽而死吗？”德亚在《事业报》上发问。他写道，法国农民不会为波罗的海上的一座自由市而战。这篇文章令全国意见分裂，批评者称之为通往柏林之路的第一步。"
 FRW_deat_die_for_danzig_tt:0 "新社会主义者现在必须作出抉择：留在§Y共和国§!内，还是建立§Y单一政党§!。"
 FRW_deat_planist_republic:0 "计划主义共和国"
 FRW_deat_planist_republic_desc:0 "德亚选择留在共和国体制内。计划被写入法律，众议院保留对其的表决权，经济委员会则将工会、雇主和工程师召集到同一张桌前。"
 FRW_deat_x_crise:0 "X-危机小组的工程师"
 FRW_deat_x_crise_desc:0 "X-危机小组的综合理工学院毕业生们——其中包括让·库特罗、路易·瓦隆和年轻的阿尔弗雷德·索维——离开研究小组，进入各部委任职。法国第一次由规划者治理。"
 FRW_deat_republic_of_order:0 "秩序共和国"
 FRW_deat_republic_of_order_desc:0 "自大战以来，第一次有内阁的寿命超过了它的预算，计划也达成了既定目标。德亚的支持者们说，任何议会都不可能做到这一点。"
 FRW_deat_single_party:0 "单一政党"
 FRW_deat_single_party_desc:0 "德亚认为，社会主义者、退伍老兵和右翼同盟成员都想要同一样东西：一场民族的、人民的革命。他号召他们加入同一个政党——全国人民联盟，并永久关闭众议院。"
 FRW_deat_single_party_tt:0 "需要§Y法西斯主义§!的支持率至少达到§Y15%§!。"
 FRW_deat_labour_front:0 "劳工阵线"
 FRW_deat_labour_front_desc:0 "工会和雇主联合会被合并为单一的劳工阵线。罢工和闭厂同样被禁止；工资和物价由计划决定。"
 FRW_deat_national_legion:0 "全国人民军团"
 FRW_deat_national_legion_desc:0 "全国人民联盟组建了自己的志愿军团。他们既扛步枪也扛铁锹行进，新兵既来自工厂，也来自旧日的右翼同盟。"
 FRW_deat_new_europe:0 "欧洲新秩序"
 FRW_deat_new_europe_desc:0 "德亚梦想着一个从布雷斯特到布加勒斯特、既是社会主义又是民族主义的欧洲，而巴黎将成为它的第二首都。布鲁塞尔、海牙、伯尔尼和哥本哈根受邀加入。"
 FRW_deat_new_europe_tt:0 "建立§Y欧洲新秩序§!（若法国不在任何阵营中），并邀请§Y比利时§!、§Y荷兰§!、§Y卢森堡§!、§Y瑞士§!和§Y丹麦§!加入。"
 FRW_deat_continental_economy:0 "大陆经济"
 FRW_deat_continental_economy_desc:0 "一个欧洲清算联盟，一项煤钢共同计划，以及从大西洋到维斯瓦河的统一市场。德亚称之为大陆社会主义。"
 FRW_deat_lvf:0 "法国志愿军团"
 FRW_deat_lvf_desc:0 "德亚和其他政党的对手们至少在一件事上意见一致：法国志愿者应当到国外与布尔什维主义作战。军团在全国人民联盟的办事处征募兵员，开赴任何进行这场十字军东征的地方。"
 FRW_deat_ministry_of_labour:0 "劳工部"
 FRW_deat_ministry_of_labour_desc:0 "德亚亲自执掌劳工部。劳动介绍所、学徒制度和工资标准都归格勒内勒街的同一个部门管辖。"
 FRW_deat_revolutionary_front:0 "革命国民阵线"
 FRW_deat_revolutionary_front_desc:0 "最后一批对立运动被并入德亚领导下的单一的革命国民阵线。昔日的社会主义者、工团主义者和右翼同盟成员如今持有同一张党员证。"
 FRW_deat_european_revolution:0 "欧洲革命"
 FRW_deat_european_revolution_desc:0 "德亚写道，一个民族的、社会主义的欧洲不能止步于比利时边境。布鲁塞尔和海牙受邀接受法国的保护，成为新大陆的首批省份。"
 FRW_protect_austria:0 "保护奥地利独立"
 FRW_protect_austria_desc:0 "奥地利暴露于柏林和罗马之间。巴黎向其提供保护，作为回报，希望维也纳追随法国的政策。"
 FRW_libyan_border:0 "保障低地国家"
 FRW_libyan_border_desc:0 "如同1925年的洛迦诺公约一样，法国为其邻国提供担保。巴黎将把对布鲁塞尔、海牙或卢森堡的攻击视为对法国的攻击。"
 FRW_workers_popular_front:0 "工人阵线"
 FRW_workers_popular_front_desc:0 "法国共产党与人民阵线中的资产阶级伙伴决裂，号召工人们亲自夺取政权。"
 FRW_truce_unity_of_action:0 "统一行动"
 FRW_truce_unity_of_action_desc:0 "1934年，法国共产党与工人国际法国支部签订协定，停止相互攻击，共同对抗右翼同盟。如今，党要求工人们在它自己的旗帜下践行这一协定。"
 FRW_truce_unity_of_action_tt:0 "使法国免于因稳定度过低而引发的§R共产主义起义§!。\n结束§Y罢工浪潮§!。\n于§Y1936年6月§!起可用。"
 FRW_cgt_general_strike:0 "法国总工会总罢工"
 FRW_cgt_general_strike_desc:0 "数百万工人响应法国总工会（CGT）的号召举行罢工，工厂陷入沉寂。政府可能撑不过这一周。"
 FRW_proclaim_the_commune:0 "宣布成立公社"
 FRW_proclaim_the_commune_desc:0 "1871年，巴黎孤军起义，惨遭镇压。这一次，各省将与首都一同起义。"
 FRW_proclaim_the_commune_tt:0 "§Y分裂的政府§!变为§Y脆弱的政府§!。两项决议（分别自1937年和1938年起可用，间隔至少6个月）可将其彻底移除。"
 FRW_thorez_party_line:0 "多列士掌权"
 FRW_thorez_party_line_desc:0 "在莫里斯·多列士的领导下，法国的政策与莫斯科紧密保持一致。"
 FRW_thorez_party_line_tt:0 "需要§Y莫里斯·多列士§!的支持（决议§Y争取莫里斯·多列士§!，45天）。"
 FRW_pivert_revolution:0 "一切皆有可能！"
 FRW_pivert_revolution_desc:0 "马索·皮韦尔和革命左派号召建立独立于莫斯科的工人委员会民主制度。"
 FRW_pivert_revolution_tt:0 "需要§Y马索·皮韦尔§!的支持（决议§Y争取马索·皮韦尔§!，45天）。"
 FRW_five_year_plan_fr:0 "法国五年计划"
 FRW_five_year_plan_fr_desc:0 "效仿苏联国家计划委员会，各省的专员为煤炭、钢铁和粮食制定生产指标。比扬古的雷诺工厂如今听命于计划，而非市场。"
 FRW_soviet_military_mission:0 "苏联军事代表团"
 FRW_soviet_military_mission_desc:0 "红军军官抵达巴黎，向法国参谋人员传授大纵深作战理论。"
 FRW_join_comintern:0 "加入共产国际"
 FRW_join_comintern_desc:0 "党认为，革命不可能在一国单独取得胜利。巴黎与莫斯科及各国工人运动一道加入共产国际。"
 FRW_join_comintern_tt:0 "邀请§Y苏联§!加入其阵营。若苏联未领导任何阵营，法国将建立§Y欧洲红色阵线§!并邀请苏联加入。"
 FRW_red_army_of_france:0 "法兰西红军"
 FRW_red_army_of_france_desc:0 "军队按照苏联模式进行改组，各部队配属政治委员。"
 FRW_workers_councils:0 "工人委员会"
 FRW_workers_councils_desc:0 "选举产生的工人委员会接管了工厂的管理。"
 FRW_revolutionary_militias:0 "革命民兵"
 FRW_revolutionary_militias_desc:0 "1871年的巴黎公社始于凡尔赛政府试图夺走蒙马特的大炮。这一次，每座工厂、每个街区都保有一支武装工人民兵。"
 FRW_export_the_revolution:0 "输出革命"
 FRW_export_the_revolution_desc:0 "党的领导人认为，革命不能局限于法国一国。"
 FRW_iberian_revolution:0 "伊比利亚革命"
 FRW_iberian_revolution_desc:0 "西班牙共产党人和工会向巴黎请求武器，以对抗将军们。"
 FRW_iberian_revolution_tt:0 "获得对§Y西班牙§!的§Y推翻政府§!战争借口（除非西班牙为共产主义国家或盟友）。"
 FRW_red_navy_of_toulon:0 "红色舰队与红色空军"
 FRW_red_navy_of_toulon_desc:0 "1919年由安德烈·马蒂等人领导的黑海兵变至今仍在舰队中为人铭记。土伦的水兵们如今为人民掌控着舰船。青年工人在党的飞行俱乐部里学习飞行。"
 FRW_red_industry:0 "红色工业"
 FRW_red_industry_desc:0 "勒克勒佐和德·温德尔钢铁厂收归国有。产量指标取代了股息。"
 FRW_liberate_colonies:0 "解放殖民地"
 FRW_liberate_colonies_desc:0 "社会主义的法国不能以武力维持殖民地。摩洛哥和突尼斯成为独立的兄弟共和国。"
 FRW_liberate_colonies_tt:0 "§Y摩洛哥§!和§Y突尼斯§!作为共产主义卫星国获得释放（若为法国所有），§Y兄弟民族§!提升一级。"
 FRW_union_of_european_socialist_republics:0 "欧洲社会主义合众国"
 FRW_union_of_european_socialist_republics_desc:0 "党将目光投向一个没有边界、没有资本家的欧洲社会主义联盟。"
 FRW_union_of_european_socialist_republics_tt:0 "获得对§Y比利时§!、§Y荷兰§!和§Y卢森堡§!的§Y推翻政府§!战争借口（除非它们已是共产主义国家、法国的附庸或盟友）。\n组建§Y欧洲联邦§!：获得新国名和国旗、国家精神，并获得法国拥有的§G比荷卢、瑞士、意大利、德国和莱茵兰领土的核心领土§!（包括日后在当地获得的领土），以及对其余部分的§Y宣称§!。\n取代法国此前组建的任何国家（移除其可组建国家的国家精神）。若法国已是§Y永恒的弗朗西亚王国§!，则保持不变。\n需要控制§Y比利时§!、§Y荷兰§!和§Y卢森堡§!，以及§Y意大利§!或§Y德国§!（吞并或作为傀儡，另有说明者除外）。若法国尚未控制这些国家，则一旦控制便会自动建立该国家。"
 FRW_peoples_science:0 "人民的科学"
 FRW_peoples_science_desc:0 "弗雷德里克·约里奥-居里和其他科学家将他们的实验室交由革命支配。"
 FRW_internationale_victory:0 "最后的斗争"
 FRW_internationale_victory_desc:0 "法国红军开拔之际，街头响起了《国际歌》。"
 FRW_purge_deviationists:0 "清洗偏离分子"
 FRW_purge_deviationists_desc:0 "托洛茨基分子、皮韦尔的追随者以及其他“党的敌人”被开除出法国共产党和法国总工会。"
 FRW_fils_du_peuple:0 "人民之子"
 FRW_fils_du_peuple_desc:0 "多列士的自传《人民之子》印行数百万册。这位来自加来海峡省的矿工之子的画像从每一间党办公室的海报上俯视着众人。"
 FRW_second_five_year_plan:0 "第二个五年计划"
 FRW_second_five_year_plan_desc:0 "第二个计划将重工业和电气化置于一切之上。"
 FRW_political_commissars:0 "政治委员"
 FRW_political_commissars_desc:0 "每个团都配属了一名政委，军队如今听命于党。"
 FRW_bastion_of_the_west:0 "革命堡垒"
 FRW_bastion_of_the_west_desc:0 "巴黎是西欧的社会主义之都。来自伦敦、布鲁塞尔和巴塞罗那的工人代表团乘着每一班列车抵达。"
 FRW_federation_of_communes:0 "公社联邦"
 FRW_federation_of_communes_desc:0 "省长制度被废除，每个市镇通过其选举产生的委员会实行自治。法国各地城镇开办了夜校。曾经接管工厂的工人们如今坐满了讲堂。"
 FRW_aid_the_poum:0 "援助伊比利亚同志"
 FRW_aid_the_poum_desc:0 "步枪、卡车和志愿者越过比利牛斯山，前往巴塞罗那支援马克思主义统一工人党（POUM）和反斯大林主义左派。"
 FRW_workers_army:0 "从民兵到工人军队"
 FRW_workers_army_desc:0 "民兵配备了军官、正规操练和重武器，同时保留了他们选举产生的委员会。"
 FRW_republic_of_labour:0 "劳动共和国"
 FRW_republic_of_labour_desc:0 "皮韦尔的追随者们将新国家描述为生产者的自由联合体，既不由资本家管理，也不由官僚管理。"
 FRW_cgt_unions_take_power:0 "一切权力归工会"
 FRW_cgt_unions_take_power_desc:0 "1906年，法国总工会在亚眠宣布，未来社会的基本单位将是工会，而非政党。皮埃尔·贝纳尔和革命工团主义者如今要求运动兑现诺言：政党可以坐镇市政厅，但治理法国的将是工会。"
 FRW_cgt_unions_take_power_tt:0 "需要§Y皮埃尔·贝纳尔§!的支持（决议§Y争取皮埃尔·贝纳尔§!，45天）。"
 FRW_cgt_factory_committees:0 "工厂委员会"
 FRW_cgt_factory_committees_desc:0 "每座工厂都由车间选举产生的委员会接管管理。工程师和工头留任，但如今要向工作台前的男女工人负责。"
 FRW_cgt_local_unions:0 "地方工会执政"
 FRW_cgt_local_unions_desc:0 "省长们被遣送回家。在每座城镇，地方工会及其代表接管了市政厅的工作，从面包配给到电车运营无所不包。"
 FRW_cgt_bourses_du_travail:0 "劳工交易所"
 FRW_cgt_bourses_du_travail_desc:0 "费尔南·佩卢蒂埃希望劳动交易所成为工人阶级的学校。为实现这一愿景，各城镇纷纷开办图书馆、夜校和技术课程。"
 FRW_cgt_confederal_congress:0 "联合会代表大会"
 FRW_cgt_confederal_congress_desc:0 "各联合会的代表齐聚互助会大厅。决定由工厂向上传达至代表大会，而不是由中央委员会向下发布。工厂占领运动随之结束，因为占领者已经在经营工厂。"
 FRW_cgt_confederal_congress_tt:0 "结束§Y罢工浪潮§!，并使法国免于因稳定度过低而引发的§R共产主义起义§!。"
 FRW_cgt_red_black_columns:0 "红黑纵队"
 FRW_cgt_red_black_columns_desc:0 "工会民兵在红黑旗帜下组成纵队。他们选举自己的军官，作战勇猛，但并不乐于服从命令。"
 FRW_cgt_iwa:0 "国际工人协会"
 FRW_cgt_iwa_desc:0 "贝纳尔曾任工团主义国际——国际工人协会的书记。随着法国落入工会之手，该协会的代表大会移师巴黎。"
 FRW_cgt_aid_the_cnt:0 "援助全国劳工联盟（CNT）"
 FRW_cgt_aid_the_cnt_desc:0 "步枪和卡车越过比利牛斯山，送往全国劳工联合会（CNT）以及加泰罗尼亚和阿拉贡的无政府主义纵队。"
 FRW_cgt_collectivise_land:0 "土地集体化"
 FRW_cgt_collectivise_land_desc:0 "农业工人接管了博斯和南部地区的大庄园。小农可以加入集体农庄，也可以保留自己的田地。"
 FRW_cgt_workers_self_defence:0 "工人自卫"
 FRW_cgt_workers_self_defence_desc:0 "代表大会最终同意，革命毕竟需要一支军队，但这支军队只保卫公社，且没有自己的总参谋部。"
 FRW_cgt_iberian_federation:0 "伊比利亚联邦"
 FRW_cgt_iberian_federation_desc:0 "在巴塞罗那，全国劳工联合会谈论着建立一个伊比利亚各民族的自由联邦。巴黎承诺帮助实现这一目标。"
 FRW_cgt_iberian_federation_tt:0 "获得对§Y西班牙§!的§Y推翻政府§!战争借口（除非西班牙为共产主义国家或盟友）。"
 FRW_cgt_libertarian_commune:0 "自由意志主义公社"
 FRW_cgt_libertarian_commune_desc:0 "法国既没有老板，也没有官僚，只有自由生产者的联合会。这样的社会能否打一场现代战争，是代表大会宁愿不去追问的问题。"
 FRW_workers_belgium:0 "打倒萨拉查"
 FRW_workers_belgium_desc:0 "在里斯本，萨拉查的新国家政权持续压制着工人运动。随着西班牙落入革命者之手，葡萄牙将陷入孤立。"
 FRW_smash_italian_fascism:0 "粉碎意大利法西斯"
 FRW_smash_italian_fascism_desc:0 "墨索里尼自1922年起统治意大利，比欧洲任何其他法西斯领袖执政的时间都长。流亡法国的意大利人说，国内的工人已准备起义。"
 FRW_red_switzerland:0 "国际纵队"
 FRW_red_switzerland_desc:0 "来自许多国家的志愿者从奥斯特里茨车站出发前往西班牙，法国人与德国人、波兰人和美国人并肩同行。巴黎已成为世界革命的征兵处。"
 FRW_red_switzerland_tt:0 "需要§Y安德烈·马蒂§!担任政治顾问（在§Y部长会议§!的§Y政治§!部门中执行决议§Y任命安德烈·马蒂§!）。"
 FRW_national_renewal:0 "民族复兴"
 FRW_national_renewal_desc:0 "右翼同盟再度走上街头，向共和国高喊“打倒窃贼！”"
 FRW_truce_labour_charter:0 "社团秩序"
 FRW_truce_labour_charter_desc:0 "罢工和闭厂被禁止。每个行业的工人和雇主同坐于一个行业公会之中，二者无法解决的问题由国家裁决。"
 FRW_truce_labour_charter_tt:0 "使法国免于因稳定度过低而引发的§R共产主义起义§!。\n结束§Y罢工浪潮§!。\n于§Y1936年6月§!起可用。"
 FRW_february_sixth:0 "冲击波旁宫"
 FRW_february_sixth_desc:0 "1934年2月6日，右翼同盟在协和桥前被拦下。这一次，他们决意过桥。"
 FRW_national_revolution:0 "民族革命"
 FRW_national_revolution_desc:0 "共和国覆灭，一个威权民族主义政府取而代之。"
 FRW_national_revolution_tt:0 "§Y分裂的政府§!变为§Y脆弱的政府§!。两项决议（分别自1937年和1938年起可用，间隔至少6个月）可将其彻底移除。"
 FRW_la_rocque_psf:0 "劳动、家庭、祖国"
 FRW_la_rocque_psf_desc:0 "德·拉罗克上校及其法兰西社会党希望建立一个避免对外冒险的天主教民族国家。"
 FRW_la_rocque_psf_tt:0 "需要§Y弗朗索瓦·德·拉罗克§!的支持（决议§Y争取弗朗索瓦·德·拉罗克§!，45天）。"
 FRW_doriot_ppf:0 "法兰西人民党"
 FRW_doriot_ppf_desc:0 "雅克·多里奥于1934年被开除出共产党，如今领导着法兰西人民党，意欲建立一个极权主义的群众国家。"
 FRW_doriot_ppf_tt:0 "需要§Y雅克·多里奥§!的支持（决议§Y争取雅克·多里奥§!，45天）。"
 FRW_corporatist_state:0 "社团主义国家"
 FRW_corporatist_state_desc:0 "各行业的雇主和工人在国家监督下被组织进行业公会。"
 FRW_latin_bloc:0 "拉丁集团"
 FRW_latin_bloc_desc:0 "法国、西班牙、葡萄牙和意大利携手组成一个立于柏林与莫斯科之间的拉丁民族集团。"
 FRW_latin_bloc_tt:0 "建立§Y拉丁集团§!阵营，并邀请§Y意大利§!、§Y西班牙§!和§Y葡萄牙§!加入。\n随后通过§Y领导拉丁欧洲§!宣布成立§Y拉丁帝国§!本身。"
 FRW_colonial_legions:0 "殖民地军团"
 FRW_colonial_legions_desc:0 "来自塞内加尔、马达加斯加和印度支那的新兵被编成由法国军官指挥的军团。"
 FRW_restore_french_honour:0 "萨伏依的遗产"
 FRW_restore_french_honour_desc:0 "自1860年《都灵条约》以来，萨伏依和尼斯便属于法国。长期被萨伏依公爵们宣称拥有的日内瓦也在索要之列。皮埃蒙特则留给罗马——法国在拉丁集团中的伙伴。"
 FRW_totalitarian_party:0 "单一政党"
 FRW_totalitarian_party_desc:0 "议会两院、右翼同盟和旧政党均被法令解散。法兰西人民党成为法国唯一的合法政党。"
 FRW_totalitarian_party_tt:0 "需要§Y保罗·马里昂§!担任政治顾问（在§Y部长会议§!的§Y政治§!部门中执行决议§Y任命保罗·马里昂§!）。"
 FRW_approach_germany:0 "接近柏林"
 FRW_approach_germany_desc:0 "多里奥相信欧洲将由法西斯列强主导，并希望法国站在它们一边。"
 FRW_greater_france_claims:0 "大法兰西"
 FRW_greater_france_claims_desc:0 "罗曼德和瓦莱州讲法语，而墨索里尼觊觎尼斯、萨伏依和科西嘉。巴黎以自己的地图作为回应：罗曼德、皮埃蒙特和奥斯塔河谷，以及与科西嘉隔海峡相望的撒丁岛。"
 FRW_march_on_brussels:0 "向日内瓦发出最后通牒"
 FRW_march_on_brussels_desc:0 "日内瓦是国际联盟、政治流亡者和敌视本政权的外国资金的聚集地。多里奥已经发出过一次最后通牒，不打算再发第二次。"
 FRW_march_on_brussels_tt:0 "获得对§Y瑞士§!的§Y吞并§!战争借口（除非为盟友）。\n自§Y1937年1月§!起可用。"
 FRW_national_rearmament:0 "国家重整军备"
 FRW_national_rearmament_desc:0 "政府着手使法国军队重新成为欧洲大陆上最强大的军队。"
 FRW_mediterranean_ambition:0 "地中海霸主"
 FRW_mediterranean_ambition_desc:0 "土伦、比塞大、阿尔及尔和贝鲁特使法国在地中海沿岸各处都拥有港口。罗马应当接受法国的海上霸主地位——在拉罗克治下作为伙伴，在多里奥治下则作为战败的对手。"
 FRW_mediterranean_ambition_tt:0 "若§Y雅克·多里奥§!领导法国：获得对§Y的黎波里塔尼亚§!和§Y费赞§!的§Y宣称§!。"
 FRW_french_state_youth:0 "国家青年团"
 FRW_french_state_youth_desc:0 "学校和青年团体被置于国家控制之下，被教导为民族服务。"
 FRW_french_imperium:0 "帝国使命"
 FRW_french_imperium_desc:0 "从达喀尔到河内，整个帝国只听命于巴黎。"
 FRW_nouvel_ordre:0 "领导拉丁欧洲"
 FRW_nouvel_ordre_desc:0 "罗马、马德里和里斯本都期待巴黎的领导。法国提议在其引领下建立一个拉丁民族集团。"
 FRW_nouvel_ordre_tt:0 "获得对§Y西班牙§!和§Y葡萄牙§!的§Y傀儡化§!战争借口（除非它们是法国的附庸或盟友）。\n组建§Y拉丁帝国§!：获得新国名和国旗、国家精神，并获得法国拥有的§G意大利、西班牙和葡萄牙领土的核心领土§!（包括日后在当地获得的领土），以及对其余部分的§Y宣称§!。\n取代法国此前组建的任何国家（移除其可组建国家的国家精神）。若法国已是§Y永恒的弗朗西亚王国§!，则保持不变。\n需要控制§Y意大利§!、§Y西班牙§!和§Y葡萄牙§!（吞并或作为傀儡，另有说明者除外）。若法国尚未控制这些国家，则一旦控制便会自动建立该国家。"
 FRW_african_empire_fascist:0 "突尼斯问题"
 FRW_african_empire_fascist_desc:0 "1938年11月，意大利议员们在罗马的议会中高喊“突尼斯、科西嘉、尼斯！”巴黎的回应是钢筋混凝土——突尼斯南部的马雷斯防线必将守住。"
 FRW_corporative_chambers:0 "社团议院"
 FRW_corporative_chambers_desc:0 "由雇主和工人组成的行业议院接替参议院在经济立法方面的职能。"
 FRW_volontaires_nationaux:0 "国民志愿者"
 FRW_volontaires_nationaux_desc:0 "法兰西社会党的青年组织“国民志愿者”被训练成一支纪律严明的国民后备力量。"
 FRW_volontaires_nationaux_tt:0 "需要§Y让·伊巴内加莱§!担任政治顾问（在§Y部长会议§!的§Y政治§!部门中执行决议§Y任命让·伊巴内加莱§!）。"
 FRW_social_catholicism:0 "社会天主教"
 FRW_social_catholicism_desc:0 "慈善事业、家庭补贴和天主教工会是法兰西社会党医治阶级冲突的良方。"
 FRW_friendship_with_lisbon:0 "与里斯本和马德里的友谊"
 FRW_friendship_with_lisbon_desc:0 "萨拉查自1932年起统治葡萄牙，从未寻求战争。拉罗克以新国家政权为例，证明秩序与和平可以并行不悖。"
 FRW_french_social_state:0 "法兰西社会国家"
 FRW_french_social_state_desc:0 "拉罗克承诺建设一个以劳动、家庭和天主教信仰为基础，秩序井然、内部安宁的法国。"
 FRW_purge_the_reds:0 "清洗赤色分子"
 FRW_purge_the_reds_desc:0 "多里奥曾是圣但尼的共产党籍市长。他叫得出昔日同志的名字，如今他手中有了逮捕他们的警察。"
 FRW_purge_the_reds_tt:0 "共产主义支持率：§R-10%§!"
 FRW_anti_bolshevik_crusade:0 "反布尔什维克十字军"
 FRW_anti_bolshevik_crusade_desc:0 "多里奥号召欧洲各国团结起来对抗莫斯科。"
 FRW_party_militia:0 "党卫民兵"
 FRW_party_militia_desc:0 "法兰西人民党的纠察队被武装起来，成为政权的卫队。"
 FRW_pact_with_berlin:0 "与柏林的条约"
 FRW_pact_with_berlin_desc:0 "七十年间，法国和德国两度兵戎相见。如今巴黎请求加入德国的同盟。"
 FRW_pact_with_berlin_tt:0 "请求§Y德国§!允许法国加入其阵营（若德国为法西斯国家且领导一个阵营）。"
 FRW_cult_of_the_chef:0 "领袖崇拜"
 FRW_cult_of_the_chef_desc:0 "每座市政厅都悬挂着多里奥的画像。党和国家由领袖一人指挥。"
 FRW_seize_libya:0 "夺取利比亚"
 FRW_seize_libya_desc:0 "的黎波里和费赞将把突尼斯与法属西非和法属赤道非洲连成一片。必须迫使意大利交出它们。"
 FRW_swiss_protectorate:0 "我们的海"
 FRW_swiss_protectorate_desc:0 "墨索里尼称地中海为“我们的海”。巴黎对此不以为然，土伦、比塞大和米尔斯克比尔被改建为一支足以控制地中海的舰队的基地。"
 FRW_demand_spanish_morocco:0 "索要费赞"
 FRW_demand_spanish_morocco_desc:0 "根据1935年1月的赖伐尔-墨索里尼协定，法国曾许诺将撒哈拉的一片狭长地带让给意大利。新政府宣布废除该协定，并转而索要费赞。"
 FRW_above_the_parties:0 "超越党派"
 FRW_above_the_parties_desc:0 "许多法国人已对共产党人、法西斯同盟和丑闻缠身的议会失去信心。他们希望最高层有一只铁腕。"
 FRW_truce_national_concord:0 "党派休战"
 FRW_truce_national_concord_desc:0 "1934年2月骚乱之后，加斯东·杜梅格在政党休战下与来自各阵营的部长们共同执政。是时候再次召集这样的政府了。"
 FRW_truce_national_concord_tt:0 "使法国免于因稳定度过低而引发的§R共产主义起义§!。\n结束§Y罢工浪潮§!。\n于§Y1936年6月§!起可用。"
 FRW_suspend_the_chambers:0 "休会两院"
 FRW_suspend_the_chambers_desc:0 "勒布伦总统拒绝再任命新一届内阁。众议院和参议院被无限期休会。"
 FRW_suspend_the_chambers_tt:0 "§Y分裂的政府§!变为§Y脆弱的政府§!。两项决议（分别自1937年和1938年起可用，间隔至少6个月）可将其彻底移除。\n议会两院被遣散回家。无人知晓什么会填补这样的沉默……"
 FRW_etat_francais:0 "法兰西国"
 FRW_etat_francais_desc:0 "1916年凡尔登战役的胜利者贝当元帅以国家元首身份掌权。"
 FRW_etat_francais_tt:0 "需要§Y贝当元帅§!的支持（决议§Y争取贝当元帅§!，45天）。"
 FRW_return_to_the_land:0 "回归土地"
 FRW_return_to_the_land_desc:0 "“唯有土地不会说谎。”本政权寄望于农民来复兴法国。"
 FRW_fortress_france:0 "法兰西要塞"
 FRW_fortress_france_desc:0 "1916年在凡尔登，贝当认识到火力决定战局。他据此规划法国的防御。1914—1918年的老兵被集结成一个军团，成为本政权的主要支柱。"
 FRW_corporation_paysanne:0 "农民社团"
 FRW_corporation_paysanne_desc:0 "成立全国农民行业公会，以组织农业生产并保障粮食供应。"
 FRW_weygand_staff:0 "魏刚将军的参谋部"
 FRW_weygand_staff_desc:0 "魏刚将军修订了军队的防御学说，并对其装备进行现代化改造。"
 FRW_armee_d_afrique:0 "非洲军团"
 FRW_armee_d_afrique_desc:0 "阿尔及利亚、摩洛哥和突尼斯的非洲军团各师成为帝国的战略预备队。"
 FRW_armed_neutrality:0 "武装中立"
 FRW_armed_neutrality_desc:0 "法国宣布不参加任何对外战争。对其领土的任何攻击都将遭到武力回击。"
 FRW_redoubt_of_the_empire:0 "帝国堡垒"
 FRW_redoubt_of_the_empire_desc:0 "已制定计划，一旦法国本土沦陷，便从阿尔及尔继续进行战争。"
 FRW_charte_du_travail:0 "劳动宪章"
 FRW_charte_du_travail_desc:0 "罢工和闭厂被禁止。由雇主和工人组成的混合委员会负责调解各行业的纠纷。"
 FRW_charte_du_travail_tt:0 "需要§Y让·比舍洛讷§!担任政治顾问（在§Y部长会议§!的§Y经济§!部门中执行决议§Y任命让·比舍洛讷§!）。"
 FRW_chantiers_de_jeunesse:0 "青年劳动营"
 FRW_chantiers_de_jeunesse_desc:0 "每个年满二十岁的青年都要在营地度过八个月，伐木并接受操练。"
 FRW_cult_of_the_marshal:0 "元帅，我们来了！"
 FRW_cult_of_the_marshal_desc:0 "学童们学唱《元帅，我们来了》。在许多市政厅里，元帅的肖像如今挂在了昔日玛丽安娜半身像所在的位置。"
 FRW_darlan_admiralty:0 "达尔朗执掌海军部"
 FRW_darlan_admiralty_desc:0 "达尔朗海军上将保全了舰队。对于一个中立的法国而言，这是最有分量的筹码。"
 FRW_unconquerable_france:0 "不可征服的法兰西"
 FRW_unconquerable_france_desc:0 "防线从马奇诺防线一直延伸到阿特拉斯山脉的隘口。入侵者每前进一米都将付出惨重代价。"
 FRW_order_in_the_rif:0 "里夫的秩序"
 FRW_order_in_the_rif_desc:0 "1925年，贝当受命讨伐阿卜杜·克里姆，结束了里夫战争。西班牙从未牢牢掌控这一地区，如今法国提出由自己接手。"
 FRW_latin_neutral_bloc:0 "拉丁中立集团"
 FRW_latin_neutral_bloc_desc:0 "佛朗哥、萨拉查和瑞士联邦委员会与元帅抱有同样的目标：置身于下一场战争之外。若能携手行动，他们或许能够如愿。"
 FRW_latin_neutral_bloc_tt:0 "建立§Y拉丁中立集团§!（若法国未加入任何阵营）；若法国是其阵营的领导者，则邀请§Y西班牙§!、§Y葡萄牙§!和§Y瑞士§!加入。"
 FRW_empire_stands_guard:0 "帝国严阵以待"
 FRW_empire_stands_guard_desc:0 "魏刚视察了从达喀尔到贝鲁特的各处驻军。殖民地军队奉命做好准备，以应对来自任何一方的进攻。"
 FRW_marshals_peace:0 "元帅的和平"
 FRW_marshals_peace_desc:0 "当列强彼此消耗之际，法国在边境之后休养重建。元帅已经承诺，不会有一个法国人为但泽或莫斯科而死。"
 FRW_orleanist_restoration:0 "奥尔良派复辟"
 FRW_orleanist_restoration_desc:0 "巴黎伯爵亨利·德·奥尔良结束流亡归国，被拥立为国王亨利六世。"
 FRW_orleanist_restoration_tt:0 "需要获得§Y巴黎伯爵§!的支持（决议§Y争取巴黎伯爵§!，45天）。"
 FRW_charter_of_1830:0 "重颁宪章"
 FRW_charter_of_1830_desc:0 "一部仿照1830年宪章的新宪法将王权与有产阶级紧密联系在一起。"
 FRW_royal_diplomacy:0 "王室外交"
 FRW_royal_diplomacy_desc:0 "奥尔良家族与欧洲许多在位王室均有姻亲关系。"
 FRW_action_francaise_ministers:0 "法兰西行动派入阁"
 FRW_action_francaise_ministers_desc:0 "夏尔·莫拉斯领导的法兰西行动成员首次进入政府。"
 FRW_royal_army:0 "王家陆军"
 FRW_royal_army_desc:0 "军官们向国王宣誓效忠。作为回报，他们得到了共和国一直拒绝拨付的经费。"
 FRW_parliamentary_monarchy:0 "议会君主制"
 FRW_parliamentary_monarchy_desc:0 "仿照英国模式，国王统而不治，由大臣们执掌政务。"
 FRW_absolute_crown:0 "王权统治"
 FRW_absolute_crown_desc:0 "亨利六世亲自执政，依靠军队和教会的支持。"
 FRW_crown_of_the_franks:0 "查理曼的遗产"
 FRW_crown_of_the_franks_desc:0 "瓦隆和卢森堡曾属法国王室所有，查理曼更曾在亚琛设立宫廷。"
 FRW_crown_of_the_franks_tt:0 "获得对§Y德国§!的战争借口，目标为§Y莱茵兰§!和§Y摩泽尔兰§!（除非法国已拥有这些地区）。\n建立§Y法兰克帝国§!：更换国名与国旗，获得国家精神，并在法国拥有的§G低地国家、莱茵兰、瑞士和意大利北部领土上获得核心§!（日后在这些地区获得的领土同样适用），对其余领土获得§Y宣称§!。\n取代法国此前建立的任何国家（移除其可成立国家的国家精神）。若法国已是§Y永恒的弗朗西亚王国§!，则保持不变。\n需要控制§Y莱茵兰§!、§Y摩泽尔兰§!、§Y比利时§!和§Y荷兰§!（吞并或作为傀儡，另有说明者除外）。若法国尚未控制这些地区，则一旦控制即自动建国。"
 FRW_catholic_revival:0 "天主教复兴"
 FRW_catholic_revival_desc:0 "教会为复辟的君主制赐福。"
 FRW_holy_alliance:0 "新神圣同盟"
 FRW_holy_alliance_desc:0 "欧洲各君主国结成同盟，共同对抗革命与战争。"
 FRW_holy_alliance_tt:0 "建立§Y神圣同盟§!阵营。"
 FRW_kings_government:0 "国王的政府"
 FRW_kings_government_desc:0 "国王任命一个民族和睦内阁，随后由议会予以确认。法兰西科学院在新国王身上找到了一位慷慨的赞助人。"
 FRW_conseil_du_roi:0 "国王御前会议"
 FRW_conseil_du_roi_desc:0 "效仿路易十四，国王依靠一个由亲信顾问组成的小型御前会议治理国家。"
 FRW_provinces_restored:0 "恢复行省"
 FRW_provinces_restored_desc:0 "1790年设立的省份再次让位于诺曼底、布列塔尼等历史行省。"
 FRW_most_christian_king:0 "笃信基督的国王"
 FRW_most_christian_king_desc:0 "亨利六世在兰斯大教堂受膏，数百年来法国国王皆在此加冕。"
 FRW_belgian_crown:0 "国王的海军"
 FRW_belgian_crown_desc:0 "海军长期以来都是法国最倾向保王的军种。在百合花旗下，它将重拾昔日的荣光。"
 FRW_luxembourg_protectorate:0 "王家学院"
 FRW_luxembourg_protectorate_desc:0 "路易十四于1666年创立了法兰西科学院。王室意欲再次成为它的赞助人。"
 FRW_bonapartist_appeal:0 "雄鹰的召唤"
 FRW_bonapartist_appeal_desc:0 "波拿巴派委员会呼吁路易·拿破仑亲王归国。"
 FRW_bonapartist_appeal_tt:0 "需要获得§Y路易·拿破仑亲王§!的支持（决议§Y争取路易·拿破仑亲王§!，45天）。"
 FRW_proclaim_the_empire:0 "宣布成立帝国"
 FRW_proclaim_the_empire_desc:0 "路易·拿破仑在巴黎圣母院加冕为拿破仑六世，成为法国人的皇帝。"
 FRW_code_napoleon:0 "新拿破仑法典"
 FRW_code_napoleon_desc:0 "仿照第一帝国的模式，法律与行政得以统一。"
 FRW_imperial_guard:0 "帝国近卫军"
 FRW_imperial_guard_desc:0 "一如第一帝国时期，法国最优秀的士兵被选入皇帝的近卫军。"
 FRW_grande_armee_reborn:0 "大军团重生"
 FRW_grande_armee_reborn_desc:0 "参谋部研究奥斯特里茨和耶拿之战，并将其中的快速机动与集中打击运用于坦克和飞机。"
 FRW_marshals_of_the_empire:0 "帝国元帅"
 FRW_marshals_of_the_empire_desc:0 "晋升重新以功绩为准，每个士兵都可以期望背包里装着一根元帅权杖。"
 FRW_marshals_of_the_empire_tt:0 "§Y路易·拿破仑亲王§!亲自出征，担任§Y陆军元帅§!（进攻学说）。"
 FRW_continental_system:0 "大陆体系"
 FRW_continental_system_desc:0 "法国建立一个由其主导的封闭式欧洲贸易区。"
 FRW_continental_system_tt:0 "建立§Y大陆体系§!阵营（若法国未加入任何阵营），并邀请皇帝的老盟友§Y波兰§!和§Y丹麦§!加入。"
 FRW_imperial_university:0 "帝国大学"
 FRW_imperial_university_desc:0 "各大高等专业学院奉命为帝国培养工程师和官员。"
 FRW_imperial_university_tt:0 "解锁政治顾问§Y弗雷德里克·约里奥-居里§!（帝国科学总监：科研速度§G+15%§!，150政治点数）。"
 FRW_natural_borders:0 "自然疆界"
 FRW_natural_borders_desc:0 "正如大革命时期所宣称的那样，莱茵河与比利牛斯山脉是法国的天然疆界。"
 FRW_hundred_days_spirit:0 "百日王朝精神"
 FRW_hundred_days_spirit_desc:0 "1815年，拿破仑曾许诺鹰旗将从一座钟楼飞向另一座钟楼，直至巴黎圣母院的塔顶。如今他的继承人重申了这番话。"
 FRW_kingdom_of_holland:0 "荷兰王国"
 FRW_kingdom_of_holland_desc:0 "路易·波拿巴曾于1806年至1810年间担任荷兰国王。荷兰将再次成为帝国的附庸王国。"
 FRW_kingdom_of_holland_tt:0 "获得对§Y荷兰§!的§Y傀儡§!战争借口（若其独立且非盟友）。"
 FRW_rhine_confederation:0 "莱茵邦联"
 FRW_rhine_confederation_desc:0 "莱茵河左岸和巴登再次被置于皇帝的保护之下。"
 FRW_rhine_confederation_tt:0 "获得对§Y德国§!的战争借口，目标为§Y摩泽尔兰§!、§Y莱茵兰§!和§Y巴登§!（除非为盟友）。"
 FRW_kingdom_of_italy_napoleon:0 "意大利王国"
 FRW_kingdom_of_italy_napoleon_desc:0 "第一帝国时期，皮埃蒙特曾是法国的一个省，米兰则是拿破仑的意大利王国的首都。他的继承人决心恢复这两者。"
 FRW_kingdom_of_italy_napoleon_tt:0 "获得对§Y意大利§!的战争借口，目标为§Y皮埃蒙特§!（除非为盟友）。"
 FRW_grand_empire:0 "大帝国"
 FRW_grand_empire_desc:0 "法兰西帝国曾从汉堡延伸至罗马。拿破仑六世决心将其重建。"
 FRW_grand_empire_tt:0 "建立§Y法兰西大帝国§!：更换国名，启用帝国国旗和深蓝色地图颜色，获得国家精神，并在法国拥有的§G低地国家、莱茵兰、瑞士、意大利北部、撒丁岛和加泰罗尼亚领土上获得核心§!（日后在这些地区获得的领土同样适用），对其余领土获得§Y宣称§!。\n取代法国此前建立的任何国家（移除其可成立国家的国家精神）。若法国已是§Y永恒的弗朗西亚王国§!，则保持不变。\n需要控制§Y莱茵河地区§!（莱茵兰、摩泽尔兰）、§Y皮埃蒙特§!、§Y比利时§!和§Y荷兰§!（吞并或作为傀儡，另有说明者除外）。若法国尚未控制这些地区，则一旦控制即自动建国。"
 FRW_iron_crown:0 "铁王冠"
 FRW_iron_crown_desc:0 "1805年，拿破仑在米兰戴上了伦巴第铁王冠。他的继承人也打算戴上它。"
 FRW_legion_of_honour:0 "荣誉军团"
 FRW_legion_of_honour_desc:0 "与第一位拿破仑一样，皇帝以荣誉军团勋章嘉奖战场上的英勇行为。"
 FRW_imperial_navy:0 "帝国海军"
 FRW_imperial_navy_desc:0 "1805年特拉法尔加之败的耻辱至今未雪。帝国下令建造一支与其雄心相称的舰队。"
 FRW_emperor_of_the_west:0 "西方皇帝"
 FRW_emperor_of_the_west_desc:0 "从大西洋到易北河，从北海到台伯河，皇帝的诏令如今通行无阻，同一部法典治理着这片土地。"
 FRW_act_of_mediation:0 "调停法案"
 FRW_act_of_mediation_desc:0 "1803年，拿破仑赐予瑞士人一部宪法并给予保护。他的继承人重续了这一安排。"
 FRW_duchy_of_warsaw:0 "华沙公国"
 FRW_duchy_of_warsaw_desc:0 "波兰枪骑兵曾追随拿破仑从马德里征战到莫斯科。波兰将再次成为帝国在东方的前哨。"
 FRW_egyptian_campaign:0 "埃及战役"
 FRW_egyptian_campaign_desc:0 "1798年，波拿巴率军抵达金字塔下。他的继承人则将目光投向了苏伊士运河。"
 FRW_egyptian_campaign_tt:0 "获得对§Y开罗§!、§Y亚历山大§!和§Y苏伊士§!地区的宣称，并获得对亚历山大控制者（埃及或英国）的战争借口。"
 FRW_road_to_moscow:0 "通往莫斯科之路"
 FRW_road_to_moscow_desc:0 "1812年的远征终结于漫天风雪之中。这一次，大军团拥有了坦克，而华沙早已是盟友。"
 FRW_road_to_moscow_tt:0 "获得对§Y明斯克§!、§Y维捷布斯克§!、§Y斯摩棱斯克§!和§Y莫斯科§!的宣称，并获得对§Y苏联§!的战争借口。"
 FRW_continental_empire:0 "大陆帝国"
 FRW_continental_empire_desc:0 "王朝的统治如今从加的斯延伸至尼罗河，从英吉利海峡延伸至维斯瓦河。"
 FRW_legitimate_heir:0 "正统继承人"
 FRW_legitimate_heir_desc:0 "在正统派看来，奥尔良家族是篡位者。合法的国王是路易十四的长系继承人：流亡的西班牙国王波旁的阿方索，他们称之为阿方斯一世。"
 FRW_legitimate_heir_tt:0 "§Y波旁的阿方索§!（他于1941年去世后，由其子§Y雅克二世§!继位）成为法国国王。正统派组建政府。\n需要获得§Y波旁的阿方索§!的支持（决议§Y争取波旁的阿方索§!，45天）。"
 FRW_white_flag:0 "白旗"
 FRW_white_flag_desc:0 "1873年，亨利五世宁可放弃王位也不愿接受三色旗。他的继承人恢复了波旁王朝的白旗，至少在王宫屋顶上如此。"
 FRW_spanish_bourbons:0 "马德里的波旁家族"
 FRW_spanish_bourbons_desc:0 "新国王同时也是流亡的西班牙国王。比利牛斯山两侧的君主主义者都将目光投向了巴黎。"
 FRW_spanish_bourbons_tt:0 "西班牙内战中的每一方也将获得§Y与法国王室的纽带§!。"
 FRW_requetes:0 "纳瓦拉义勇军"
 FRW_requetes_desc:0 "头戴红色贝雷帽的卡洛斯派志愿兵越过比利牛斯山，为国王效力。他们虔诚、守纪且求战心切。"
 FRW_secure_crown_of_spain:0 "确保西班牙王冠"
 FRW_secure_crown_of_spain_desc:0 "1931年，阿方索离开马德里，但并未退位。巴黎要求西班牙迎回其国王，如有可能，以和平方式进行。"
 FRW_secure_crown_of_spain_tt:0 "若西班牙处于内战中：获得对每个未与法国结盟的西班牙势力的§Y傀儡§!战争借口。\n否则将要求§Y西班牙§!接受法国国王为其国王（成为法国的傀儡）。若遭拒绝，法国将获得战争借口。"
 FRW_unite_the_crowns:0 "统一王冠"
 FRW_unite_the_crowns_desc:0 "1713年，腓力五世被迫放弃法国王位，以确保两国王冠永不合一。如今《乌得勒支和约》已成一纸空文，法国与西班牙合为一个王国。"
 FRW_unite_the_crowns_tt:0 "吞并法国的所有西班牙傀儡。\n建立§Y波旁法兰西-西班牙王国§!：更换国名与国旗，获得国家精神§Y二元君主国§!，并在法国拥有的§G西班牙领土上获得核心§!（日后在这些地区获得的领土同样适用），对其余领土获得§Y宣称§!。\n取代法国此前建立的任何国家。需要控制§Y马德里§!（吞并或作为傀儡）；若法国尚未控制该地，则一旦控制即建立王国。"
 FRW_two_crowns:0 "两个国家，两顶王冠"
 FRW_two_crowns_desc:0 "一位国王，两个王国：法国与西班牙各自保留政府和军队，但在波旁家族之下团结一致。"
 FRW_two_crowns_tt:0 "西班牙重新独立（若其曾为法国傀儡），并与法国一同加入§Y波旁家族盟约§!。两个王国均保留各自的政府。"
 FRW_no_more_pyrenees:0 "比利牛斯山已不复存在"
 FRW_no_more_pyrenees_desc:0 "据说路易十四在其孙登上西班牙王位时曾说：“比利牛斯山已不复存在。”如今，公路、铁路和关税都仿佛这道山脉从未存在过一般。"
 FRW_no_more_pyrenees_tt:0 "若西班牙与法国站在一起：获得§Y波旁伙伴§!（工厂产出+5%，稳定度+5%）。"
 FRW_catholic_kings:0 "天主教国王"
 FRW_catholic_kings_desc:0 "教会重新获得了其学校以及在国务会议中的席位。作为回报，两个王国的主教们宣扬对王室的忠诚。"
 FRW_portuguese_alliance:0 "向里斯本提议"
 FRW_portuguese_alliance_desc:0 "半岛上唯有里斯本仍置身事外。巴黎和马德里邀请萨拉查投身波旁王冠之下，而且不会久等答复。"
 FRW_heirs_of_louis_xiv:0 "路易十四的继承者"
 FRW_heirs_of_louis_xiv_desc:0 "自太阳王以来，波旁家族首次统治从英吉利海峡到直布罗陀的广袤土地。廷臣们纷纷谈论一个新的伟大世纪。"
 FRW_rock_of_gibraltar:0 "直布罗陀巨岩"
 FRW_rock_of_gibraltar_desc:0 "1704年，西班牙在为首位波旁西班牙国王安茹的腓力争夺王位时将直布罗陀丢给了英国人。如今他的继承人统治着巴黎和马德里，他们要夺回这块巨岩。"
 FRW_rock_of_gibraltar_tt:0 "获得对§Y英国§!的战争借口，目标为§Y直布罗陀§!（除非英国是盟友）。"
 FRW_two_sicilies:0 "两西西里王冠"
 FRW_two_sicilies_desc:0 "直至1861年，一位波旁国王仍统治着那不勒斯和巴勒莫。萨伏依王室以武力夺取了他的王国，如今波旁长系宣称这是其家族的遗产。"
 FRW_two_sicilies_tt:0 "获得对§Y意大利§!的战争借口，目标为§Y坎帕尼亚、西西里、卡拉布里亚和普利亚§!（除非意大利是盟友）。"
 FRW_family_compact_fleet:0 "家族盟约舰队"
 FRW_family_compact_fleet_desc:0 "1761年，法国与西班牙的波旁国王联合舰队对抗英国。如今，布雷斯特、土伦、费罗尔和卡塔赫纳再次为同一支海军造舰。"
 FRW_family_compact_fleet_tt:0 "若法国拥有§Y加利西亚§!（费罗尔）和§Y穆尔西亚§!（卡塔赫纳）：各获得§G+2§!海军船坞。"
 FRW_house_of_parma:0 "波旁-帕尔马家族"
 FRW_house_of_parma_desc:0 "波旁-帕尔马的费利克斯亲王是卢森堡女大公的丈夫，而帕尔马本身直到1859年都是波旁家族的公国。两者都被邀请回归家族。"
 FRW_nec_pluribus_impar:0 "无与伦比"
 FRW_nec_pluribus_impar_desc:0 "“不逊于众”是路易十四的格言。从英吉利海峡到西西里，波旁家族再次足以对抗欧洲所能组建的任何同盟。"
 FRW_nec_pluribus_impar_tt:0 "§Y伟大世纪§!变为§Y无与伦比§!。"
 FRW_devalue_the_franc:0 "法郎贬值"
 FRW_devalue_the_franc_desc:0 "法国已无力维系金本位集团。货币贬值应能使法国出口重新具备竞争力。"
 FRW_econ_dirigisme:0 "统制经济"
 FRW_econ_dirigisme_desc:0 "从人民阵线的国有化到后来历届政府的计划机构，各党派的法国部长们都相信应由巴黎指导经济。信贷、投资和生产将遵循国家制定的计划。"
 FRW_econ_dirigisme_tt:0 "选择§Y统制经济§!作为法国的经济模式。其国家精神将随§Y工业卡特尔§!和§Y经济独立§!而增强。"
 FRW_econ_liberal:0 "经济自由主义"
 FRW_econ_liberal_desc:0 "冶铁同业公会的铁器大亨们希望解除对法郎的管制，让市场自行运转。他们说，只要放手让他们去做，工厂就会发展壮大。"
 FRW_econ_liberal_tt:0 "选择§Y经济自由主义§!作为法国的经济模式（共产主义者不可选）。其国家精神将随§Y工业卡特尔§!和§Y经济独立§!而增强。"
 FRW_econ_rearmament:0 "重整军备优先"
 FRW_econ_rearmament_desc:0 "自1935年起，德国的工厂就一直在为军队生产。巴黎如今也紧随其后，兵工厂的预算优先于一切。"
 FRW_econ_rearmament_tt:0 "选择§Y重整军备优先§!作为法国的经济模式。其国家精神将随§Y工业卡特尔§!和§Y经济独立§!而增强。"
 FRW_economic_plan:0 "经济计划"
 FRW_economic_plan_desc:0 "无论政府采取何种方针，都必须决定建造什么、在哪里建造以及由谁出资。"
 FRW_public_works:0 "大型公共工程"
 FRW_public_works_desc:0 "道路、桥梁和港口工程对外发包，既为失业者提供了工作，也改善了国家的基础设施。"
 FRW_rationalize_industry:0 "工业合理化"
 FRW_rationalize_industry_desc:0 "许多法国企业仍是设备陈旧的小型家族企业。政府鼓励企业合并并采用现代化生产方式。"
 FRW_rationalize_industry_tt:0 "若法国仍受§Y低效经济§!影响，则将其降低一级。"
 FRW_reform_banque_de_france:0 "改革法兰西银行"
 FRW_reform_banque_de_france_desc:0 "两百大股东失去了对法兰西银行的控制，其理事会如今主要由国家任命。"
 FRW_autoroutes_nationales:0 "国道网"
 FRW_autoroutes_nationales_desc:0 "旧有的国道得到拓宽、重铺并相互连通。卡车和军队车队如今只需数小时而非数天即可横穿全国。"
 FRW_sncf_modernization:0 "组建法国国家铁路公司"
 FRW_sncf_modernization_desc:0 "1938年1月1日，各大私营铁路公司合并为法国国家铁路公司。"
 FRW_modern_management:0 "科学管理"
 FRW_modern_management_desc:0 "受过专业训练的工程师接管了长期由创始家族把持的董事会，法国工业开始精打细算。"
 FRW_modern_management_tt:0 "完全移除§Y低效经济§!。\n需要完成上一行的所有国策，且工业规模至少达到§Y40§!座民用工厂和§Y25§!座军用工厂。\n经济国策树中所有更低层级的国策均以此为基础。"
 FRW_industrial_cartels:0 "工业卡特尔"
 FRW_industrial_cartels_desc:0 "各工业部门的委员会分配原材料并协调投资。"
 FRW_industrial_cartels_tt:0 "将你所选§Y经济模式§!的国家精神升级到下一级。"
 FRW_hydroelectric_alps:0 "阿尔卑斯水电"
 FRW_hydroelectric_alps_desc:0 "罗讷河上和阿尔卑斯山谷中的水坝为新建工厂提供廉价电力。"
 FRW_electrification:0 "电气化"
 FRW_electrification_desc:0 "罗讷河与莱茵河畔的发电站将电力输送到中央高原最偏远的农庄。新兴工业沿着输电线路落户。"
 FRW_lorraine_steel:0 "洛林钢铁"
 FRW_lorraine_steel_desc:0 "新的采矿与冶炼方法使洛林低品位的鲕状褐铁矿得到更充分的利用。"
 FRW_heavy_industry_nord:0 "北部重工业"
 FRW_heavy_industry_nord_desc:0 "诺尔省和加来海峡省的矿井与钢铁厂得到扩建。"
 FRW_renault_and_citroen:0 "雷诺与雪铁龙"
 FRW_renault_and_citroen_desc:0 "雷诺和雪铁龙将装配线转产卡车、拖拉机和装甲车辆。"
 FRW_research_institutes:0 "组建国家科学研究中心"
 FRW_research_institutes_desc:0 "新成立的国家科学研究中心将全国的实验室纳入统一管理。"
 FRW_bauxite_provence:0 "普罗旺斯铝土矿"
 FRW_bauxite_provence_desc:0 "铝土矿得名于普罗旺斯的莱博，当地开采的铝土矿为飞机制造商提供所需的铝材。"
 FRW_rearmament_plan:0 "1936年重整军备计划"
 FRW_rearmament_plan_desc:0 "议会表决通过140亿法郎用于为期四年的重整军备。雷诺将制造坦克，施耐德制造火炮，德瓦蒂纳制造飞机。"
 FRW_rearmament_plan_tt:0 "需要§Y拉乌尔·多特里§!担任政治顾问（在§Y部长会议§!的§Y经济§!部门中执行决议§Y任命拉乌尔·多特里§!）。"
 FRW_aviation_industry:0 "重组航空工业"
 FRW_aviation_industry_desc:0 "飞机工厂由国家接管，并按地区组建为国营航空制造公司（SNCA）。"
 FRW_atomic_research:0 "约里奥-居里实验室"
 FRW_atomic_research_desc:0 "1935年诺贝尔奖得主弗雷德里克·约里奥-居里和伊雷娜·约里奥-居里站在核研究的最前沿。"
 FRW_ecole_polytechnique:0 "扩建大学校"
 FRW_ecole_polytechnique_desc:0 "巴黎综合理工学院、中央理工学院和巴黎高等矿业学院的招生人数翻了一番。它们的毕业生将设计国家的武器并管理国家的工厂。"
 FRW_iraqi_oil:0 "摩苏尔石油特许权"
 FRW_iraqi_oil_desc:0 "通过法国石油公司，法国拥有伊拉克石油公司近四分之一的股份。基尔库克的原油经管道输送到的黎波里，再装船运往马赛附近的炼油厂。"
 FRW_dockyards_brest:0 "布雷斯特兵工厂"
 FRW_dockyards_brest_desc:0 "布雷斯特和洛里昂的兵工厂获得了新的机械设备和船台。大西洋舰队的舰船将在这里建造。"
 FRW_consumer_economy:0 "消费品工业"
 FRW_consumer_economy_desc:0 "越来越多的中产家庭买得起冰箱、收音机或汽车。"
 FRW_thomson_electronics:0 "无线电工业"
 FRW_thomson_electronics_desc:0 "汤姆森-休斯顿公司、法国无线电公司和中央电信实验室获得了国家的无线电和早期雷达设备合同。"
 FRW_war_economy:0 "战时经济"
 FRW_war_economy_desc:0 "工厂做好了转产准备，物资储备到位，劳动力完成登记以便调配。一旦战争爆发，工业将在数周内准备就绪。"
 FRW_dispersed_industry:0 "分散军事工业"
 FRW_dispersed_industry_desc:0 "新工厂建在图卢兹、波尔多和马赛，处于德国境内轰炸机的航程之外。"
 FRW_paris_expo:0 "1937年巴黎世界博览会"
 FRW_paris_expo_desc:0 "1937年世界博览会在塞纳河畔展示法国的艺术与工程成就。"
 FRW_economic_modernization:0 "经济现代化"
 FRW_economic_modernization_desc:0 "一项大规模投资计划旨在使法国工业达到英国和德国的水平。"
 FRW_arsenal_de_la_republique:0 "共和国兵工厂"
 FRW_arsenal_de_la_republique_desc:0 "国营兵工厂昼夜轮班运转，武器产量达到了和平时期前所未有的水平。"
 FRW_strategic_stockpiles:0 "战略储备"
 FRW_strategic_stockpiles_desc:0 "仓库中储满了步枪、炮弹和备件，以备动员之日所需。"
 FRW_regional_development:0 "区域规划"
 FRW_regional_development_desc:0 "信贷和公共工程被投向法国中部那些长期被忽视的省份。"
 FRW_war_production_board:0 "军备部"
 FRW_war_production_board_desc:0 "拉乌尔·多特里领导的军备部全面负责所有战争生产。"
 FRW_economic_independence:0 "经济独立"
 FRW_economic_independence_desc:0 "法国力求依靠本土与帝国的资源实现自给自足。"
 FRW_economic_independence_tt:0 "将你所选§Y经济模式§!的国家精神提升一级（若§Y工业卡特尔§!也已完成，则直接提升至最高级）。"
 FRW_franc_treasury_crisis:0 "国库危机"
 FRW_franc_treasury_crisis_desc:0 "国库靠法兰西银行的垫款勉强逐月度日。在任何改革开始之前，必须有人查清国家究竟还有多少钱。"
 FRW_franc_treasury_crisis_tt:0 "通货膨胀：§G-5§!"
 FRW_franc_stabilisation_fund:0 "外汇平准基金"
 FRW_franc_stabilisation_fund_desc:0 "效仿伦敦和华盛顿的做法，法国设立一个由黄金和外汇组成的基金，在市场上捍卫法郎。投机者今后不仅要面对法兰西银行，还要面对财政部。"
 FRW_franc_stabilisation_fund_tt:0 "黄金储备：§G+100吨§!\n此后每月获得§G+5吨§!黄金。"
 FRW_franc_defence_bonds:0 "国防债券"
 FRW_franc_defence_bonds_desc:0 "财政部在法国的每一个邮局出售债券。储户们将法郎借给国家而不是花掉，海报上承诺每一法郎都能换来一枚炮弹。"
 FRW_franc_defence_bonds_tt:0 "通货膨胀：§G-8§!"
 FRW_franc_fiscal_reform:0 "税制改革"
 FRW_franc_fiscal_reform_desc:0 "议会表决通过新税种，削减减免项目，并难得地按时通过了预算。赤字缩小了，法兰西银行的垫款也随之减少。"
 FRW_franc_fiscal_reform_tt:0 "此后通货膨胀每月额外下降§G0.25§!点。"
 FRW_franc_safe_havens:0 "黄金的避风港"
 FRW_franc_safe_havens_desc:0 "部分储备被悄悄运往达喀尔、法兰西堡和渥太华的金库，任何入侵者都无法触及。"
 FRW_franc_safe_havens_tt:0 "黄金储备已转移至安全地点：即使法国投降，§Y自由法国§!仍可动用这些储备。"
 FRW_franc_colonial_gold:0 "帝国的黄金"
 FRW_franc_colonial_gold_desc:0 "地质学家和工程师被派往几内亚和法属苏丹的金矿。产量虽小，但每一盎司黄金都产自法郎区内。"
 FRW_franc_colonial_gold_tt:0 "黄金储备：§G+50吨§!\n此后每月获得§G+5吨§!黄金。"
 FRW_franc_strong_franc:0 "强势法郎"
 FRW_franc_strong_franc_desc:0 "预算平衡、金库充盈，法郎币值稳定，逃往伦敦和纽约的资本纷纷回流。信贷变得廉价，工地重新开工。"
 FRW_franc_strong_franc_tt:0 "通货膨胀：§G-10§!"
 FRW_franc_war_finance:0 "为战争筹资"
 FRW_franc_war_finance_desc:0 "战争将依靠税收、贷款和管制来支付，而不是开动印钞机。部长们没有忘记1918年后战争债务给法郎造成的后果。"
 FRW_franc_war_finance_tt:0 "通货膨胀：§G-8§!\n仅在§Y战争中§!可用。"
 FRW_lessons_of_verdun:0 "凡尔登的教训"
 FRW_lessons_of_verdun_desc:0 "参谋军官们研究1914年至1918年的历次战役，以免军队重蹈覆辙。"
 FRW_beyond_victory:0 "克服胜利者的自满"
 FRW_beyond_victory_desc:0 "1918年的胜利让军队对自己的方法深信不疑。如今，军官们必须对其提出质疑。"
 FRW_beyond_victory_tt:0 "剩余的疑虑（§Y胜利者的疑虑§!）只能通过陆军分支末端的§Y现代化陆军§!移除。"
 FRW_methodical_battle:0 "有条不紊的战斗"
 FRW_methodical_battle_desc:0 "军队依照周密的计划作战，依靠集中的炮兵和一条连续、坚守的战线。"
 FRW_methodical_battle_tt:0 "§Y1918年的将军们§!减弱为§Y过渡中的指挥层§!。§Y改革总参谋部§!将其移除。"
 FRW_war_of_movement:0 "运动战"
 FRW_war_of_movement_desc:0 "坦克、卡车和无线电将决定下一场战争，而这场战争将进展迅速。"
 FRW_war_of_movement_tt:0 "§Y1918年的将军们§!减弱为§Y过渡中的指挥层§!。§Y改革总参谋部§!将其移除。"
 FRW_maginot_extension:0 "延伸马奇诺防线"
 FRW_maginot_extension_desc:0 "马奇诺防线止步于比利时边境，这一点德国参谋部心知肚明。如今，新的炮台和障碍物将从蒙梅迪一直延伸到海边。"
 FRW_heavy_artillery:0 "重炮"
 FRW_heavy_artillery_desc:0 "施耐德公司和皮托兵工厂交付新式火炮，以替换上次大战遗留的库存。"
 FRW_mas_rifles:0 "MAS-36步枪"
 FRW_mas_rifles_desc:0 "MAS-36比老式勒贝尔步枪更短、更轻，装填也更快。它将配发给每一个步兵团。"
 FRW_mechanized_divisions:0 "轻型机械化师"
 FRW_mechanized_divisions_desc:0 "骑兵组建了轻型机械化师，在大军前方侦察并追击溃败之敌。卡车取代了至今仍在为军队运送补给的马拉车队。"
 FRW_divisions_cuirassees:0 "装甲师"
 FRW_divisions_cuirassees_desc:0 "根据戴高乐上校的理念，坦克被编组为独立的装甲师。继夏尔B1之后，一种更重型的突破坦克的研制工作仍在继续。"
 FRW_chasseurs_alpins:0 "山地猎兵与北非骑兵"
 FRW_chasseurs_alpins_desc:0 "阿尔卑斯猎兵，即上次大战中的“蓝色魔鬼”，被视为欧洲最精锐的山地部队之一。所有阿尔卑斯师都将按照他们的标准进行训练。北非的骑乘斯帕希团则被改编为侦察部队。"
 FRW_colonial_troops:0 "殖民地部队"
 FRW_colonial_troops_desc:0 "塞内加尔步兵和北非斯帕希骑兵被调来加强军队。"
 FRW_general_staff_reform:0 "改革总参谋部"
 FRW_general_staff_reform_desc:0 "年迈的将领被勒令退休，年轻军官获得指挥权。"
 FRW_foreign_legion:0 "外籍军团"
 FRW_foreign_legion_desc:0 "以“军团即祖国”为格言的外籍军团得到扩充，并被训练为一支精锐部队。"
 FRW_reserve_system:0 "预备役制度"
 FRW_reserve_system_desc:0 "预备役人员被定期召集训练，以便能够迅速归建。"
 FRW_reserve_system_tt:0 "需要§Y阿尔弗雷德·索维§!担任政治顾问（在§Y部长会议§!的§Y经济§!部门中执行决议§Y任命阿尔弗雷德·索维§!）。"
 FRW_combined_arms:0 "诸兵种合成"
 FRW_combined_arms_desc:0 "步兵、坦克、炮兵和飞机共同训练，学习协同作战。47毫米SA 37反坦克炮能够击穿目前欧洲任何现役坦克的装甲。每个步兵师都将获得足够数量的此种火炮，以阻挡装甲部队的进攻。"
 FRW_paratroopers:0 "伞兵与自由突击队"
 FRW_paratroopers_desc:0 "法国于1937年组建了首批伞兵连，即空降步兵，跻身世界最早的伞兵部队之列。小型突击分队接受侦察和袭击训练。"
 FRW_desert_warfare:0 "沙漠战"
 FRW_desert_warfare_desc:0 "摩洛哥和撒哈拉历次战役的经验教训得到汇总并用于教学。"
 FRW_artillery_barrage:0 "徐进弹幕"
 FRW_artillery_barrage_desc:0 "周密计划、与步兵紧密配合的火力仍然是法国战术的基础。"
 FRW_army_of_the_republic:0 "现代化陆军"
 FRW_army_of_the_republic_desc:0 "除了军旗之外，1940年的军队与1918年的军队已鲜有相同之处。法国设立联合参谋部，以协调陆军、海军和空军。"
 FRW_tank_production_lines:0 "坦克生产线"
 FRW_tank_production_lines_desc:0 "伊西莱穆利诺和韦尼西厄的新坦克装配线投入运营。"
 FRW_darlan_programme:0 "达尔朗计划"
 FRW_darlan_programme_desc:0 "法国拥有世界第四大海军，其舰艇必须与时俱进。自1937年起担任海军总参谋长的达尔朗海军上将力主建立一支能够在远洋作战的舰队。"
 FRW_darlan_programme_tt:0 "§Y分裂的舰队§!减弱为§Y改革中的舰队§!。§Y土伦与布雷斯特船厂§!将其移除。\n解锁§Y部长会议§!中的§Y海军§!部门。"
 FRW_richelieu_class:0 "黎塞留级"
 FRW_richelieu_class_desc:0 "敦刻尔克号和斯特拉斯堡号只是新式战列舰中的头两艘。黎塞留级将足以匹敌意大利或德国所能派出的任何舰艇。黎塞留号及其姊妹舰将成为法国有史以来建造的最强大的战列舰。"
 FRW_mediterranean_fleet:0 "地中海舰队"
 FRW_mediterranean_fleet_desc:0 "法国的巡洋舰和大型驱逐舰跻身世界上最快的军舰之列。无论代价如何，通往北非的海上航线都必须保持畅通。"
 FRW_atlantic_squadrons:0 "大西洋分舰队"
 FRW_atlantic_squadrons_desc:0 "海军在潜艇上投入巨资，从巨型的絮库夫号到小型近海潜艇应有尽有。布雷斯特被定为大西洋舰队的主要基地。"
 FRW_carrier_programme:0 "航空母舰计划"
 FRW_carrier_programme_desc:0 "老旧的贝亚恩号是海军唯一的航空母舰，航速太慢，无法适应现代作战。新的霞飞级将为舰队提供自己的航空兵力。"
 FRW_naval_aviation:0 "海军航空兵"
 FRW_naval_aviation_desc:0 "海军航空兵获得了自己的飞机、飞行员和航空站。鱼雷轰炸机和侦察机将为舰队执行搜索和打击任务。"
 FRW_toulon_brest_yards:0 "土伦与布雷斯特船厂"
 FRW_toulon_brest_yards_desc:0 "土伦和布雷斯特新建了干船坞，以建造下一代军舰。"
 FRW_convoy_escorts:0 "护航舰队"
 FRW_convoy_escorts_desc:0 "通报舰和护卫舰为通往殖民地航线上的船只护航。"
 FRW_coastal_defence:0 "海岸防御"
 FRW_coastal_defence_desc:0 "海军陆战队员因1914年坚守迪克斯迈德而闻名，如今被重建为一支现代化的登陆部队。岸防炮台和雷区保护着法国本土和帝国的港口。"
 FRW_fleet_in_being:0 "均衡舰队"
 FRW_fleet_in_being_desc:0 "战列舰、巡洋舰、驱逐舰和潜艇按均衡的比例建造，使舰队能够在任何海域作战。"
 FRW_naval_treaties_end:0 "告别海军条约"
 FRW_naval_treaties_end_desc:0 "法国不再认为自己受华盛顿和伦敦海军条约的约束。"
 FRW_plan_v:0 "V计划"
 FRW_plan_v_desc:0 "法国空军直到1934年才成为独立军种。V计划要求装备2,400架现代化飞机。"
 FRW_plan_v_tt:0 "§Y过时的空军§!减弱为§Y过渡中的空军§!。§Y飞行学校§!将其移除。\n解锁§Y部长会议§!中的§Y空军§!部门。"
 FRW_dewoitine_fighters:0 "德瓦蒂纳战斗机"
 FRW_dewoitine_fighters_desc:0 "德瓦蒂纳D.520旨在与其遭遇的任何战斗机一较高下。"
 FRW_bomber_command:0 "轰炸机部队"
 FRW_bomber_command_desc:0 "各中队换装了LeO 45等现代化双发轰炸机。"
 FRW_air_doctrine:0 "空军学说"
 FRW_air_doctrine_desc:0 "参谋部以书面形式确定空军在未来战争中的任务。"
 FRW_colonial_air_bases:0 "帝国空军基地"
 FRW_colonial_air_bases_desc:0 "北非的机场将空中掩护范围扩展到地中海西部。"
 FRW_close_air_support:0 "近距离空中支援"
 FRW_close_air_support_desc:0 "俯冲轰炸机和对地攻击机将被派往步兵需要的任何地方。法国空军首次与陆军认真进行协同训练。"
 FRW_air_defence_paris:0 "巴黎防空"
 FRW_air_defence_paris_desc:0 "高射炮与声学定位仪环绕着首都。"
 FRW_pilot_schools:0 "飞行学校"
 FRW_pilot_schools_desc:0 "伊斯特尔和普罗旺斯地区沙隆的新飞行学校每年培养数百名飞行员，而皮埃尔·科特的大众航空计划则在各地俱乐部教年轻人学习飞行。"
 FRW_jet_research:0 "喷气式发动机"
 FRW_jet_research_desc:0 "工程师勒内·勒杜克正在研制冲压喷气发动机。"
 FRW_strategic_air_force:0 "战略空军"
 FRW_strategic_air_force_desc:0 "四发轰炸机奉命打击敌方战线后方纵深的工厂、铁路和港口。"
 FRW_strategic_air_force_tt:0 "需要§Y皮埃尔·科特§!担任政治顾问（在§Y部长会议§!的§Y科研§!部门中执行决议§Y任命皮埃尔·科特§!）。"
 FRW_air_superiority:0 "空中优势"
 FRW_air_superiority_desc:0 "西班牙近来的战事表明，缺乏空中掩护的军队会遭受惨重损失。法国空军需要更多、更快的战斗机。"
 FRW_air_staff:0 "空军参谋部"
 FRW_air_staff_desc:0 "一个常设的空军参谋部如今统一筹划战斗机、轰炸机和侦察机中队的任务。命令将由懂飞机的军官下达。"
 FRW_quai_d_orsay:0 "奥赛码头"
 FRW_quai_d_orsay_desc:0 "奥赛码头在欧洲外交方面的经验胜过任何其他外交部，其大使们被派上用场。"
 FRW_league_of_nations:0 "加强国际联盟"
 FRW_league_of_nations_desc:0 "巴黎将信任寄托于日内瓦的国际联盟，以及针对任何侵略者的集体行动。"
 FRW_eastern_alliances:0 "东方同盟体系"
 FRW_eastern_alliances_desc:0 "在东方，波兰和小协约国各国被寄望于牵制德国。"
 FRW_mediterranean_policy:0 "地中海政策"
 FRW_mediterranean_policy_desc:0 "与罗马、马德里和安卡拉的会谈旨在维持地中海的平静，并确保通往非洲的海上航线畅通。"
 FRW_belgian_alliance:0 "比利时同盟"
 FRW_belgian_alliance_desc:0 "入侵法国的传统路线经过比利时。比利时的防御被视为法国自身的事务。"
 FRW_franco_polish_pact:0 "法波条约"
 FRW_franco_polish_pact_desc:0 "1921年的同盟得以续订，并增加了新的军事条款。德国一旦向东行动，就将陷入两线作战。"
 FRW_franco_soviet_pact:0 "法苏条约"
 FRW_franco_soviet_pact_desc:0 "1935年签订的互助条约终于有了参谋会谈和实际承诺。"
 FRW_franco_soviet_pact_tt:0 "与§Y苏联§!签订§Y互不侵犯条约§!。"
 FRW_turkish_friendship:0 "与土耳其的友谊"
 FRW_turkish_friendship_desc:0 "将亚历山大勒塔旗移交土耳其，赢得了安卡拉的好感。"
 FRW_turkish_friendship_tt:0 "将§Y哈塔伊§!移交给§Y土耳其§!（若其属于法国或法属叙利亚）。"
 FRW_swiss_talks:0 "与伯尔尼会谈"
 FRW_swiss_talks_desc:0 "巴黎与伯尔尼展开会谈，确保任何军队都无法借道瑞士领土绕过法国的防线。"
 FRW_balkan_guarantees:0 "支持巴尔干公约"
 FRW_balkan_guarantees_desc:0 "对希腊和土耳其的保证使法国在东南方向的同盟体系得以闭合。"
 FRW_arms_exports:0 "武器出口"
 FRW_arms_exports_desc:0 "法国的步枪、火炮和飞机订单从许多外国政府纷至沓来。"
 FRW_deuxieme_bureau:0 "第二局"
 FRW_deuxieme_bureau_desc:0 "军事情报部门获得了更多的人员和经费。自1931年以来，贝特朗上尉一直将从一名德国线人处购得的恩尼格玛文件转交给波兰密码局。"
 FRW_american_credits:0 "美国贷款"
 FRW_american_credits_desc:0 "来自华盛顿的贷款和生产许可加快了法国的重整军备。"
 FRW_vatican_concordat:0 "与梵蒂冈和解"
 FRW_vatican_concordat_desc:0 "与教廷签订的政教协定解决了共和国与教会之间的长期纷争。"
 FRW_rhineland_response:0 "回应莱茵兰政变"
 FRW_rhineland_response_desc:0 "1936年3月，希特勒赌法国不会采取行动，结果他赢了。下一次违反条约的行为将不仅招致抗议，还将招致军队的回应。"
 FRW_collective_security:0 "集体安全"
 FRW_collective_security_desc:0 "巴黎呼吁每一个担心遭受侵略的政府与法国一道组成共同阵线。"
 FRW_collective_security_tt:0 "未加入任何阵营的民主法国将建立§Y集体安全§!。"
 FRW_diplomatic_shield:0 "外交之盾"
 FRW_diplomatic_shield_desc:0 "任何攻击法国的国家都将被世人视为侵略者。"
 FRW_great_power_status:0 "伟大民族"
 FRW_great_power_status_desc:0 "军队重整完毕，东方同盟得以恢复，任何欧洲问题都不可能绕开奥赛码头而得到解决。"
 FRW_empire_colonial:0 "殖民帝国"
 FRW_empire_colonial_desc:0 "法国拥有世界第二大殖民帝国，其人力和资源是国家最大的后备力量。"
 FRW_ministry_of_colonies:0 "殖民地部"
 FRW_ministry_of_colonies_desc:0 "位于乌迪诺街的殖民部进行了改组。受过专业训练的总督、工程师和医生取代了冒险家和投机者。"
 FRW_african_development:0 "开发北非"
 FRW_african_development_desc:0 "阿尔及尔、奥兰和卡萨布兰卡兴建了发电站、港口工程和工厂，使北非成为帝国的工业基地。"
 FRW_colonial_purchases:0 "殖民地收购"
 FRW_colonial_purchases_desc:0 "有些领土可以用钱买到。西班牙、葡萄牙、比利时、英国和意大利所持有的土地将使法属非洲更加完整。"
 FRW_aof_federation:0 "法属西非联邦"
 FRW_aof_federation_desc:0 "法属西非各殖民地作为一个联邦，由达喀尔统一治理。"
 FRW_trans_saharan_railway:0 "跨撒哈拉铁路"
 FRW_trans_saharan_railway_desc:0 "一条从阿尔及尔横穿撒哈拉直抵尼日尔河的铁路开始动工，将北非与西非连为一体。"
 FRW_saharan_oil:0 "撒哈拉石油"
 FRW_saharan_oil_desc:0 "地质学家相信阿尔及利亚撒哈拉地下蕴藏着大量石油，勘探队被派往南方。"
 FRW_tonkin_industry:0 "东京的工业"
 FRW_tonkin_industry_desc:0 "日本正将目光投向南方。印度支那的驻军得到加强。东京的煤矿和劳动力被用于发展当地工业。"
 FRW_moroccan_question:0 "利奥泰的遗产"
 FRW_moroccan_question_desc:0 "利奥泰元帅以尊重苏丹为基础，并通过修建道路、港口和学校，建立了摩洛哥保护国。他的继任者将完成这一事业。"
 FRW_moroccan_question_tt:0 "摩洛哥各州：§G+10%§!顺从度。"
 FRW_liberia_protectorate:0 "利比里亚保护国"
 FRW_liberia_protectorate_desc:0 "利比里亚负债累累。法国向其提供信贷和保护。"
 FRW_dakar_naval_base:0 "达喀尔海军基地"
 FRW_dakar_naval_base_desc:0 "从达喀尔出发，海军可以监视非洲与南美洲之间的大西洋狭窄水域。"
 FRW_dakar_naval_base_tt:0 "在非洲的一个沿海州获得§G+1§!海军船坞和建筑槽。"
 FRW_mauritanian_iron:0 "毛里塔尼亚铁矿"
 FRW_mauritanian_iron_desc:0 "勘探证实，祖埃拉特附近的伊吉勒山几乎是一整座铁矿。一条通往海岸的铁路将把矿石运往法国的高炉。"
 FRW_pacific_bases:0 "太平洋基地"
 FRW_pacific_bases_desc:0 "印度支那的新机场为帝国在亚洲的属地提供空中掩护。"
 FRW_libyan_question:0 "撒哈拉边疆"
 FRW_libyan_question_desc:0 "从廷杜夫到费赞，沙漠边境仅由寥寥几名骆驼骑兵把守。非洲军团要求修建堡垒、机场和水井。"
 FRW_colonial_development_fund:0 "殖民地投资基金"
 FRW_colonial_development_fund_desc:0 "设立一项公共基金，用于资助非洲的道路、铁路和港口建设。"
 FRW_colonial_development_fund_tt:0 "在非洲的一个州获得§G+1§!民用工厂和建筑槽。"
 FRW_algerian_departments:0 "阿尔及利亚就是法兰西"
 FRW_algerian_departments_desc:0 "自1848年起，阿尔及利亚便按省建制，巴黎将其视为法国本土的一部分。"
 FRW_djibouti_railway:0 "吉布提—亚的斯亚贝巴铁路"
 FRW_djibouti_railway_desc:0 "从吉布提通往亚的斯亚贝巴的法国铁路，是埃塞俄比亚唯一的出海通道。"
 FRW_indochina_rubber:0 "印度支那的橡胶"
 FRW_indochina_rubber_desc:0 "印度支那米其林种植园出产的橡胶专供军队使用。"
 FRW_levant_mandates:0 "整合黎凡特委任统治地"
 FRW_levant_mandates_desc:0 "叙利亚和黎巴嫩被置于法国的直接管理之下。"
 FRW_levant_mandates_tt:0 "若法属委任统治地§Y叙利亚§!和§Y黎巴嫩§!为法国傀儡，则将其吞并。若法国已直接统治黎凡特（例如在“通往56之路”模组中），则仅获得行政加成。"
 FRW_eurafrique:0 "欧非一体"
 FRW_eurafrique_desc:0 "巴黎的规划者提议建立一个连接欧洲与非洲、由法国领导的统一经济区。"
 FRW_colonial_war_production:0 "帝国的战时生产"
 FRW_colonial_war_production_desc:0 "在非洲兴建的工厂位于敌方轰炸机的航程之外。"
 FRW_imperial_preference:0 "帝国特惠制"
 FRW_imperial_preference_desc:0 "帝国内部的关税下调，边境关税则提高。殖民地的棉花、橡胶和矿石优先供应法国工厂。"
 FRW_madagascar_development:0 "开发马达加斯加"
 FRW_madagascar_development_desc:0 "马达加斯加获得了新的港口和道路。"
 FRW_national_cohesion:0 "民族凝聚力"
 FRW_national_cohesion_desc:0 "自1934年2月6日骚乱以来，左右两派一直势同水火。"
 FRW_end_political_violence:0 "解散联盟组织"
 FRW_end_political_violence_desc:0 "火十字团、国王报贩团以及左翼民兵均被解散，武器悉数收缴。街头秩序交由警察维持。"
 FRW_radio_propaganda:0 "巴黎广播电台"
 FRW_radio_propaganda_desc:0 "巴黎广播电台和各地方电台将政府的声音传进全国的家庭、咖啡馆和兵营。"
 FRW_code_de_la_famille:0 "家庭法典"
 FRW_code_de_la_famille_desc:0 "1939年的《家庭法典》提供津贴和奖励措施，以提高法国低迷的出生率。"
 FRW_civil_defence:0 "民防"
 FRW_civil_defence_desc:0 "各城市纷纷挖掘防空洞，并举行灯火管制演习。"
 FRW_mobilization_laws:0 "战时组织法"
 FRW_mobilization_laws_desc:0 "1938年7月颁布的《战时国家组织法》规定了人员和工业的动员方式。"
 FRW_rural_modernization:0 "农业现代化"
 FRW_rural_modernization_desc:0 "拖拉机和化肥进入农场，为工厂腾出了劳动力。"
 FRW_national_service:0 "国民兵役"
 FRW_national_service_desc:0 "不仅是士兵，平民同样被分派任务，或上前线，或进军工厂。"
 FRW_women_in_industry:0 "工业中的妇女"
 FRW_women_in_industry_desc:0 "与1914年一样，妇女承担起了工厂中的大部分工作。"
 FRW_union_sacree:0 "神圣联盟"
 FRW_union_sacree_desc:0 "1914年8月，各党派在战争期间搁置了彼此的争执。如今，政府要求工人与雇主、天主教徒与反教权人士也这样做。"
 FRW_secret_captain:0 "来自圣马洛的船长"
 FRW_secret_captain_desc:0 "一封来自日内瓦的信静静躺在一间空荡荡的部长办公室桌上。写信人是一名布列塔尼船长，身上流着波兰人的血，财富来路不明，他只求被召见。他来时只带着一只手提箱、一把波兰军官的马刀，箱底还叠放着一面黑旗。除他之外，再没有人主动提出要治理法国。"
 FRW_secret_captain_tt:0 "§Y马洛·凯尔瓦德克§!成为法国领导人。\n法国与§Y波兰§!关系更加紧密。\n一条隐藏路线随之开启：§Y海岸兄弟会§!、§Y群岛§!与§Y伊比利亚§!。"
 FRW_brethren_of_the_coast:0 "海岸兄弟会"
 FRW_brethren_of_the_coast_desc:0 "在圣马洛、布雷斯特和土伦的酒馆里，船长的手下签署了兄弟会的古老盟约：每份战利品都有分成，每任船长都经投票推选，每处伤残都有抚恤。海军征兵处前排起了志愿者的长队。"
 FRW_shipyards_of_saint_malo:0 "圣马洛造船厂"
 FRW_shipyards_of_saint_malo_desc:0 "这座古老的私掠港口再度开工，建造护卫舰和货船，以及为其提供补给的工厂。"
 FRW_sea_wolves:0 "海狼"
 FRW_sea_wolves_desc:0 "快速袭击舰和远程潜艇被派往各条航线伺机而动。船长要让欧洲的每一位商船船长都提心吊胆。"
 FRW_corsair_economy:0 "战利品经济"
 FRW_corsair_economy_desc:0 "在海上缴获的黄金、船只和货物在陆上化为钢铁与机器。圣马洛的捕获法庭日夜开庭。"
 FRW_privateer_squadrons:0 "私掠船分舰队"
 FRW_privateer_squadrons_desc:0 "布列塔尼和诺曼底的每一位船东都可凭法国颁发的私掠许可证武装自己的船只。国家出钱购置火炮，船东则保留所获之物的一半。"
 FRW_boarding_parties:0 "接舷队"
 FRW_boarding_parties_desc:0 "受过突袭夺取船只或港口训练的海军陆战队：抓钩、冲锋枪，不问缘由。"
 FRW_new_tortuga:0 "新托尔图加"
 FRW_new_tortuga_desc:0 "圣马洛被宣布为自由港，不设海关，不受检查。欧洲任何需要偷越封锁线的货物，只要付费，都可以经由船长的港口通过。"
 FRW_black_admiralty:0 "黑色海军部"
 FRW_black_admiralty_desc:0 "老一辈的海军将领被勒令退役，船长的亲信接管了舰队的舰桥。勒高夫、莫尔旺和迪罗克都曾在任何海军名册上都找不到的旗帜下航行。"
 FRW_black_admiralty_tt:0 "三名新海军将领加入舰队：§Y扬·勒高夫§!（海狼）、§Y科朗坦·莫尔旺§!（封锁突破者）和§Y阿纳托尔·迪罗克§!（铁壁）。"
 FRW_jolly_roger:0 "骷髅旗下"
 FRW_jolly_roger_desc:0 "黑旗在旗舰的主桅上飘扬。舰队如当年圣马洛的私掠者一般作战，自择猎物，独享战利品。"
 FRW_letters_of_marque:0 "私掠许可证"
 FRW_letters_of_marque_desc:0 "圣马洛的私掠者向来既为荣耀、也为利益而战。每一个被击败的敌人、每一个受保护的国家都要向船长的战争金库纳款，每一座扼守航线的岛屿都是值得夺取的战利品。"
 FRW_letters_of_marque_tt:0 "解锁§Y夺取国库§!：夺取任何身为§Y法国附庸§!或在与法国交战期间已§Y投降§!的国家的黄金储备。\n法国获得§G+75§!政治点数、一座民用工厂以及§Y私掠者的黄金§!（180天）；受害国则承受§R遭劫掠的国库§!（365天）。每个国家每年只能被劫掠一次。"
 FRW_isles_balearics:0 "袭击巴利阿里群岛"
 FRW_isles_balearics_desc:0 "马略卡岛和梅诺卡岛横亘在从马赛到直布罗陀的每一条航线上。船长打算让他的护卫舰停泊在马翁港——法国舰船上一次在那里升起百合花旗还是1756年。"
 FRW_isles_balearics_tt:0 "§Y宣称§!§Y巴利阿里群岛§!，并获得针对其所有者西班牙的§Y战争借口§!。"
 FRW_isles_fortunate:0 "幸运群岛"
 FRW_isles_fortunate_desc:0 "加那利群岛和马德拉群岛扼守着通往非洲和美洲的航路。昔日的私掠者夺取它们是为了葡萄酒和蔗糖，而船长看中的是它们的港口。"
 FRW_isles_fortunate_tt:0 "§Y宣称§!§Y加那利群岛§!和§Y马德拉群岛§!，并获得针对其所有者（西班牙、葡萄牙）的§Y战争借口§!。"
 FRW_isles_keys_med:0 "地中海之钥"
 FRW_isles_keys_med_desc:0 "马耳他和直布罗陀是这片内海的两把锁，而两把钥匙都握在皇家海军手中。船长从来不怕皇家海军。"
 FRW_isles_keys_med_tt:0 "§Y宣称§!§Y马耳他§!和§Y直布罗陀§!，并获得针对英国的§Y战争借口§!。"
 FRW_isles_azores:0 "大西洋群岛"
 FRW_isles_azores_desc:0 "有了亚速尔群岛、佛得角群岛和圣多美，法国舰队便能横渡大西洋，而无需向任何人讨要煤炭。"
 FRW_isles_azores_tt:0 "§Y宣称§!§Y亚速尔群岛§!、§Y佛得角§!和§Y圣多美§!，并获得针对葡萄牙的§Y战争借口§!。"
 FRW_isles_spanish_main:0 "西属美洲海岸"
 FRW_isles_spanish_main_desc:0 "托尔图加、皇家港、拿骚——加勒比海曾是海岸兄弟会的王国。船长派他的舰船重返牙买加、巴哈马、特立尼达、库拉索以及其间诸岛这些昔日的猎场。"
 FRW_isles_spanish_main_tt:0 "§Y宣称§!加勒比海诸岛，并获得针对其所有者的§Y战争借口§!：\n- §Y英国§!：牙买加、巴哈马、特立尼达、向风群岛、百慕大\n- §Y荷兰§!：库拉索\n- §Y海地§!、§Y多米尼加共和国§!和§Y古巴§!"
 FRW_isles_libertalia:0 "利伯塔利亚"
 FRW_isles_libertalia_desc:0 "相传印度洋的海盗曾在马达加斯加沿岸建立过一个自由共和国。船长打算让传说成真，就从毛里求斯和塞舌尔开始。"
 FRW_isles_libertalia_tt:0 "§Y宣称§!§Y毛里求斯§!和§Y塞舌尔§!，并获得针对英国的§Y战争借口§!。\n§Y马达加斯加§!、§Y留尼汪§!和§Y科摩罗§!（若为法国所有）：顺从度§G+10%§!。"
 FRW_isles_north:0 "北方群岛"
 FRW_isles_north_desc:0 "设得兰、法罗群岛和冰岛如同一道大门封锁着北大西洋。谁占据了它们，谁就能扼住三个国家的护航船队。"
 FRW_isles_north_tt:0 "§Y宣称§!§Y设得兰§!、§Y法罗群岛§!和§Y冰岛§!，并获得针对其所有者（英国、丹麦、冰岛）的§Y战争借口§!。"
 FRW_isles_republic:0 "群岛共和国"
 FRW_isles_republic_desc:0 "从巴利阿里群岛到塞舌尔，船长的岛屿作为一个自由的港口联邦统一治理。它们不向巴黎缴税，而是提供船只和水手。"
 FRW_isles_republic_tt:0 "将法国在巴利阿里群岛、加那利群岛、马德拉群岛、亚速尔群岛、佛得角、圣多美、马耳他、直布罗陀、加勒比海诸岛、毛里求斯、塞舌尔、设得兰和法罗群岛中拥有的每一座岛屿设为§G核心领土§!。"
 FRW_iberian_ambitions:0 "伊比利亚问题"
 FRW_iberian_ambitions_desc:0 "比利牛斯山另一侧，西班牙正滑向内战。控制这座半岛，船长便能掌握地中海的西大门和大西洋上最优良的港口。"
 FRW_intervene_in_spain:0 "干涉西班牙"
 FRW_intervene_in_spain_desc:0 "西班牙人正在自相残杀。法国打算介入，按照自己的条件结束这场战争，无论哪一派挡路。"
 FRW_intervene_in_spain_tt:0 "获得针对西班牙内战中所有未与法国结盟的§Y每一方§!的§Y吞并§!战争借口。"
 FRW_spanish_protectorate:0 "西班牙保护国"
 FRW_spanish_protectorate_desc:0 "无论内战是否爆发，西班牙都很虚弱，而巴黎近在咫尺。法国提议建立保护国。"
 FRW_one_iberia:0 "法国治下的统一伊比利亚"
 FRW_one_iberia_desc:0 "枪炮声已经平息。西班牙残存的一切都将归于法国——能以条约解决则以条约，不能则诉诸武力。"
 FRW_one_iberia_tt:0 "所有已是§Y法国附庸§!的西班牙国家将被§Y完全吞并§!，包括其军队。\n对于每个§Y独立§!的西班牙，法国则获得一个§Y战争借口§!。\n若西班牙已不复存在，则跳过此国策。"
 FRW_portuguese_question:0 "葡萄牙问题"
 FRW_portuguese_question_desc:0 "里斯本如今孤悬于一座法国半岛的边缘。陈兵边境的法国师团为法国外交官的说辞增添了分量。"
 FRW_portuguese_question_tt:0 "§Y葡萄牙§!必须做出抉择：和平并入法国，或是面对战争。\n法国陆军相对葡萄牙越强大，里斯本屈服的可能性就越大。若葡萄牙拒绝，法国将获得§Y吞并§!战争借口。"
 FRW_raise_the_black_flag:0 "弗朗西亚王国"
 FRW_raise_the_black_flag_desc:0 "来自圣马洛的船长将法国与伊比利亚统一在同一面旗帜之下，旗上绘有法兰西的百合花与布列塔尼的白鼬纹。他暂且称之为王国，而到他儿子那一代，它将成为永恒的王国。"
 FRW_raise_the_black_flag_tt:0 "宣布成立§Y弗朗西亚王国§!，即永恒王国的前身：启用绘有百合花与布列塔尼白鼬纹的旗帜，获得§Y私掠旗§!（核心领土上进攻和防御+15%），将法国所拥有的§G西班牙和葡萄牙领土设为核心领土§!（此后在该地区获得的领土同样适用），并§Y宣称§!其余领土。\n取代法国此前组建的任何国家（移除其可组建国家的国家精神）。若法国已是§Y永恒的弗朗西亚王国§!，则保持不变。"
 FRW_iberian_cores:0 "一个半岛，一个民族"
 FRW_iberian_cores_desc:0 "从加来到加的斯，从布雷斯特到里斯本，这片土地将作为一个统一的国家来治理。"
 FRW_iberian_cores_tt:0 "将所拥有的每一个属于§Y西班牙§!或§Y葡萄牙§!核心领土的地区设为§G核心领土§!，并使当地顺从度§G+15%§!。"
 FRW_asturian_steel:0 "阿斯图里亚斯煤炭与安达卢西亚矿石"
 FRW_asturian_steel_desc:0 "阿斯图里亚斯的矿山与高炉，以及力拓的古老铜矿，如今都在为法国效力。"
 FRW_catalan_industry:0 "巴塞罗那的工厂"
 FRW_catalan_industry_desc:0 "加泰罗尼亚曾是西班牙的工场，如今其纺织厂和工厂转而满足法国在南方的需求。"
 FRW_port_of_lisbon:0 "里斯本港"
 FRW_port_of_lisbon_desc:0 "里斯本港是大西洋上最好的港口之一，成为船长大西洋分舰队的母港。"
 FRW_iberian_arsenal:0 "伊比利亚兵工厂"
 FRW_iberian_arsenal_desc:0 "马德里和布尔戈斯的兵工厂为帝国军队生产步枪、火炮和坦克。"
 FRW_eternal_kingdom:0 "永恒的弗朗西亚王国"
 FRW_eternal_kingdom_desc:0 "从阿尔卑斯山到直布罗陀，从布雷斯特到苏格兰高地，从加勒比海到印度洋，古老的王冠在一位从未输过海战的海军上将治下复兴。法国成为永恒的弗朗西亚王国。"
 FRW_eternal_kingdom_tt:0 "组建§Y永恒的弗朗西亚王国§!：启用新国旗和深蓝色地图颜色，获得国家精神§Y永恒的王国§!，将法国所拥有的§G西班牙、葡萄牙和苏格兰诸岛领土设为核心领土§!（此后在该地区获得的领土同样适用），并§Y宣称§!其余领土。\n它将取代此前组建的任何国家——且永远不会被取代。\n马洛·凯尔瓦德克在此国策开始时去世；国策完成时，其子§Y艾默里克·凯尔瓦德克§!加冕。"
 FRW_appeal_of_18_june:0 "6月18日号召"
 FRW_appeal_of_18_june_desc:0 "“法国输掉了一场战役，但法国并没有输掉这场战争。”一位名不见经传的将军在伦敦发表讲话，号召每一个法国人继续战斗。"
 FRW_appeal_of_18_june_tt:0 "一旦法国§Y投降§!或失去对§Y巴黎§!的控制，此分支即会出现——即使和约已经签订。投降状态下也可执行其中的国策。\n自由法国威望初始为§Y20§!（满值100），并开放§Y自由法国§!决议。移除§Y失败主义§!。"
 FRW_continue_the_fight:0 "继续战斗"
 FRW_continue_the_fight_desc:0 "在波尔多签订的停战协定对伦敦的任何人都没有约束力。自由法国军宣布战争仍将继续。"
 FRW_continue_the_fight_tt:0 "法国再次向占领§Y巴黎§!的国家宣战（若已不再与其交战），并加入§Y英国§!的阵营（若英国领导一个阵营）。\n自由法国威望：§G+5§!"
 FRW_free_french_forces:0 "自由法国军"
 FRW_free_french_forces_desc:0 "从纳尔维克归来的外籍军团士兵、从布雷斯特出逃的水兵和来自乍得的殖民地步兵，构成了一支新军队的骨干。"
 FRW_free_french_forces_tt:0 "§G+2§!座流亡军用工厂（英国及殖民地工场）。\n自由法国威望：§G+5§!"
 FRW_rally_the_colonies:0 "团结殖民地"
 FRW_rally_the_colonies_desc:0 "1940年8月，乍得、喀麦隆和中刚果宣布支持戴高乐。其他总督也被要求追随。"
 FRW_rally_the_colonies_tt:0 "§Y宣称§!被他国占据的每一块非洲法国殖民地，并获得针对每一个占据此类殖民地的国家（法国阵营以外）的§Y战争借口§!。\n自由法国威望：§G+10§!"
 FRW_lend_lease:0 "来自华盛顿的援助"
 FRW_lend_lease_desc:0 "罗斯福的租借物资经由英国送抵自由法国军：步枪、卡车和军服。"
 FRW_lend_lease_tt:0 "§G+3§!座流亡军用工厂（美国租借生产）。"
 FRW_leclerc_column:0 "勒克莱尔纵队"
 FRW_leclerc_column_desc:0 "1941年，勒克莱尔从乍得穿越撒哈拉沙漠，攻占了意大利人在库夫拉的要塞。在绿洲中，他的部下宣誓要一直战斗，直到国旗在斯特拉斯堡上空飘扬。"
 FRW_leclerc_column_tt:0 "宣称§Y费赞§!和§Y苏尔特§!，并为此获得针对§Y意大利§!的战争借口。\n自由法国威望：§G+5§!"
 FRW_algiers_capital:0 "阿尔及尔，法国首都"
 FRW_algiers_capital_desc:0 "各部迁入阿尔及尔海湾上方的别墅。眼下，法国就在这里治理。"
 FRW_algiers_capital_tt:0 "§G+2§!座流亡民用工厂。\n将首都迁至§Y阿尔及尔§!（若法国未控制阿尔及利亚，则迁至§Y布拉柴维尔§!）。"
 FRW_the_resistance:0 "抵抗运动"
 FRW_the_resistance_desc:0 "让·穆兰空降普罗旺斯，以统一各抵抗运动。铁路工人、学生和共产党人开始破坏占领者。"
 FRW_brazzaville_conference:0 "布拉柴维尔会议"
 FRW_brazzaville_conference_desc:0 "戴高乐许诺战后让各殖民地在法兰西共同体中获得新的地位。作为回报，非洲向他提供人员和原材料。"
 FRW_brazzaville_conference_tt:0 "§Y非洲§!的每个己方地区：顺从度§G+10%§!。\n自由法国威望：§G+10§!"
 FRW_mobilise_the_empire:0 "动员帝国"
 FRW_mobilise_the_empire_desc:0 "卡萨布兰卡和达喀尔临时建起了工厂，马格里布的铁路昼夜不停地运转。"
 FRW_mobilise_the_empire_tt:0 "§G+2§!座流亡军用工厂。"
 FRW_army_of_africa_marches:0 "非洲军团出征"
 FRW_army_of_africa_marches_desc:0 "突尼斯战役后由美国人重新武装的非洲军团，正是意大利和普罗旺斯所需的力量。"
 FRW_eurafrican_federation_focus:0 "欧非联邦"
 FRW_eurafrican_federation_focus_desc:0 "巴黎被占领后，帝国就是法国。阿尔及尔提议将欧洲与非洲结为一个联邦，至少维持到战争结束，或许更久。"
 FRW_eurafrican_federation_focus_tt:0 "可选——与§Y临时政府§!互斥。\n组建§Y欧非联邦§!：启用新国名和国旗，获得国家精神，将法国所拥有的§G法属北非、达喀尔和海外省领土设为核心领土§!（此后获得的同样适用），并§Y宣称§!其余部分。\n取代法国此前组建的任何国家（移除其可组建国家的国家精神）。若法国已是§Y永恒的弗朗西亚王国§!，则保持不变。\n需要控制一座非洲首府——§Y阿尔及尔§!、§Y达喀尔§!、§Y布拉柴维尔§!或§Y乍得§!（通过§Y自由法国§!决议使其归附）。若法国尚未控制其中任何一处，则一旦控制便自动建国。"
 FRW_provisional_government:0 "临时政府"
 FRW_provisional_government_desc:0 "自由法国军组建法兰西共和国临时政府。它承诺一旦国家获得解放，便举行选举并制定新宪法。"
 FRW_provisional_government_tt:0 "可选——与§Y欧非联邦§!互斥。法国仍是法国，并保留共和国。"
 FRW_liberation_of_paris:0 "解放巴黎"
 FRW_liberation_of_paris_desc:0 "巴黎圣母院的钟声四年来首次响起。政府重返首都。"
 FRW_liberation_of_paris_tt:0 "法国内地军加入陆军：人力§G+50,000§!。\n需要控制§Y巴黎§!。巴黎重归法国，首都迁回该地。"
 FRW_ff_chequers:0 "契克斯协定"
 FRW_ff_chequers_desc:0 "丘吉尔与戴高乐签署协议：英国将为自由法国军提供军饷、武器和补给，而法国在指挥上保持独立。"
 FRW_ff_chequers_tt:0 "§G+1§!座流亡军用工厂。\n自由法国威望：§G+5§!"
 FRW_ff_national_committee:0 "法兰西民族委员会"
 FRW_ff_national_committee_desc:0 "在伦敦，自由法国分散的各部门组成了一个真正的政府，设有分管战争、财政、外交和殖民地事务的专员。"
 FRW_ff_national_committee_tt:0 "自由法国威望：§G+5§!"
 FRW_ff_bcra:0 "中央情报行动局（BCRA）"
 FRW_ff_bcra_desc:0 "帕西上校组建了中央情报与行动局。其特工经营着从布列塔尼到马赛的情报网。"
 FRW_ff_cnr:0 "全国抵抗委员会"
 FRW_ff_cnr_desc:0 "在四方街的一间公寓里，抵抗运动的各组织、政党和工会首次在统一领导下聚首。"
 FRW_ff_cnr_tt:0 "欧洲每个被占领的法国地区：抵抗度§G+15§!。\n自由法国威望：§G+10§!"
 FRW_ff_first_division:0 "自由法国第1师"
 FRW_ff_first_division_desc:0 "外籍军团士兵、海军陆战队员、殖民地步兵和来自帝国各个角落的志愿者被编成一个师。"
 FRW_ff_bir_hakeim:0 "比尔哈凯姆"
 FRW_ff_bir_hakeim_desc:0 "柯尼希的旅在利比亚沙漠中的一座废弃要塞里抵御隆美尔的坦克长达十六天。全世界都知道，法国人又开始战斗了。"
 FRW_ff_bir_hakeim_tt:0 "自由法国威望：§G+5§!"
 FRW_ff_second_armoured:0 "第2装甲师"
 FRW_ff_second_armoured_desc:0 "勒克莱尔麾下久经沙漠战火的老兵在摩洛哥换装了美制谢尔曼坦克和半履带车。"
 FRW_ff_fafl:0 "自由法国空军"
 FRW_ff_fafl_desc:0 "数百名逃离法国的飞行员和机械师在皇家空军中作战，飞机上涂着他们自己的机徽。"
 FRW_ff_groupe_lorraine:0 "洛林大队"
 FRW_ff_groupe_lorraine_desc:0 "在英国和叙利亚受训的法国轰炸机机组组成了自己的大队，驾驶波士顿轰炸机攻击法国和低地国家境内的目标。"
 FRW_ff_normandie_niemen:0 "诺曼底-涅曼"
 FRW_ff_normandie_niemen_desc:0 "一支法国战斗机飞行员中队奔赴东线作战，驾驶苏制雅克战斗机迎击德国空军。"
 FRW_ff_fnfl:0 "自由法国海军"
 FRW_ff_fnfl_desc:0 "米塞利耶海军上将集结了逃往英国港口的舰船，从“絮库夫”号潜艇到寥寥几艘拖网渔船。"
 FRW_ff_corvettes:0 "来自英国的护卫舰"
 FRW_ff_corvettes_desc:0 "英国海军部将花级护卫舰借给自由法国海军。它们为大西洋上的护航船队护航。"
 FRW_ff_corvettes_tt:0 "§G+1§!座流亡海军船坞。"
 FRW_ff_richelieu:0 "“黎塞留”号重返战场"
 FRW_ff_richelieu_desc:0 "这艘曾在达喀尔受损停泊的巨型战列舰驶往纽约维修，随后在三色旗下重返战场。"
 FRW_ff_richelieu_tt:0 "§G+2§!座流亡海军船坞（美国船厂）。"
 FRW_ff_maquis:0 "马基游击队"
 FRW_ff_maquis_desc:0 "为逃避赴德强制劳动，年轻人纷纷遁入韦科尔、利穆赞和阿尔卑斯山区，抵抗运动在那里为他们提供武器并加以训练。"
 FRW_ff_maquis_tt:0 "欧洲每个被占领的法国地区：抵抗度§G+10§!。\n自由法国威望：§G+5§!"
 FRW_ff_colonial_recruitment:0 "在殖民地征兵"
 FRW_ff_colonial_recruitment_desc:0 "从达喀尔到马达加斯加，各地纷纷开设征兵处。土著步兵、摩洛哥山地兵和北非骑兵将构成解放法国的军队的一半。"
 FRW_ff_cfln:0 "法兰西民族解放委员会"
 FRW_ff_cfln_desc:0 "1943年6月，戴高乐的自由法国军与吉罗的非洲军团在阿尔及尔联合于同一个委员会之下，两军合编为一支军队。"
 FRW_ff_cfln_tt:0 "自由法国威望：§G+10§!"
 FRW_ff_consultative_assembly:0 "咨询议会"
 FRW_ff_consultative_assembly_desc:0 "1943年11月，抵抗运动、各政党和旧议会的代表在阿尔及尔集会。这是1940年以来第一个代表法国发声的议会，尽管其成员是任命而非选举产生的。"
 FRW_ff_cef:0 "法国远征军"
 FRW_ff_cef_desc:0 "朱安将军麾下由山地部队和殖民地师组成的军，在他人屡屡受挫的意大利山区突破了德军防线。"
 FRW_ff_dragoon:0 "普罗旺斯登陆"
 FRW_ff_dragoon_desc:0 "二十万法国士兵在土伦与圣拉斐尔之间登陆，沿罗讷河谷向里昂和孚日山区挺进。"
 FRW_ff_epuration:0 "大肃清"
 FRW_ff_epuration_desc:0 "各省设立特别法庭，审判被控通敌的人。"
 FRW_ff_votes_for_women:0 "妇女选举权"
 FRW_ff_votes_for_women_desc:0 "根据1944年4月的阿尔及尔法令，法国妇女获得了选举权和被选举权。"
 FRW_ff_securite_sociale:0 "社会保障"
 FRW_ff_securite_sociale_desc:0 "依照抵抗运动的纲领，每一名工人都享有疾病、养老和工伤保险。"
 FRW_ff_securite_sociale_tt:0 "通货膨胀：§R+5§!"
 FRW_ff_reconstruction:0 "法兰西的重建"
 FRW_ff_reconstruction_desc:0 "桥梁、铁路、港口乃至整座城镇都已化为废墟。重建部开始着手工作。"
 FRW_ff_reconstruction_tt:0 "通货膨胀：§R+10§!（重建依靠贷款支付）。"
 FRW_ff_fourth_republic:0 "第四共和国"
 FRW_ff_fourth_republic_desc:0 "新宪法经全民公决获得通过。临时政府将权力移交给民选的国民议会。"
 FRW_ff_fourth_republic_tt:0 "需要§Y临时政府§!。"
 FRW_ff_eurafrican_assembly:0 "欧非议会"
 FRW_ff_eurafrican_assembly_desc:0 "来自达喀尔、阿尔及尔、布拉柴维尔和巴黎的议员首次同席于一个议会。"
 FRW_ff_eurafrican_assembly_tt:0 "需要§Y欧非联邦§!。\n§Y非洲§!的每个己方地区：顺从度§G+10%§!。"
 FRW_qol_state_reform:0 "国家改革委员会"
 FRW_qol_state_reform_desc:0 "各部的文件堆积如山，一道简单的法令在第三共和国的各个衙门中流转可能要耗费数月。一个由高级官员组成的委员会奉命简化程序。"
 FRW_qol_state_reform_tt:0 "解锁§Y部长会议§!（决议）中的§Y政治§!部门。"
 FRW_qol_cabinet:0 "精简内阁"
 FRW_qol_cabinet_desc:0 "部委数量得以精简，职责重新划分，使部长会议能够更迅速地做出决定。"
 FRW_qol_cabinet_tt:0 "解锁§Y部长会议§!中的§Y经济§!部门。"
 FRW_qol_staff_college:0 "参谋学院"
 FRW_qol_staff_college_desc:0 "高等军事学院修订课程，为年轻军官在现代战争中担任指挥做好准备。"
 FRW_qol_staff_college_tt:0 "解锁§Y部长会议§!中的§Y陆军§!部门。"
 FRW_qol_logistics:0 "后勤局"
 FRW_qol_logistics_desc:0 "如今，巴黎的一个统一机构负责规划全军对铁路、卡车和补给站的使用。"
 FRW_qol_standards:0 "装备标准化"
 FRW_qol_standards_desc:0 "各兵工厂奉命执行统一标准，使步枪、炮弹和备件能够适配每个团的装备。"
 FRW_qol_research_council:0 "高等研究委员会"
 FRW_qol_research_council_desc:0 "仿照伊雷娜·约里奥-居里于1936年出任的科研副国务秘书一职，一个科学家委员会被设立于总理府下。"
 FRW_qol_research_council_tt:0 "解锁§Y部长会议§!中的§Y科研§!部门。"
 FRW_qol_special_projects:0 "特别项目局"
 FRW_qol_special_projects_desc:0 "火箭、喷气发动机和原子能事关重大，不能任由私人工场摆布。军备部下设的一个局负责统管这些项目。"
 FRW_qol_special_projects_tt:0 "解锁§Y部长会议§!中的§Y特别项目§!部门。"
 FRW_qol_deuxieme_bureau:0 "重组第二局"
 FRW_qol_deuxieme_bureau_desc:0 "军事情报部门及其反间谍处获得了新的经费、新的办公场所，以及直通政府的联络渠道。"
 FRW_qol_deuxieme_bureau_tt:0 "解锁§Y部长会议§!中的§Y情报机构§!部门。"
 FRW_qol_modern_state:0 "现代国家"
 FRW_qol_modern_state_desc:0 "经过多年改革，一道法令只需数周而非数月便能下达到各省。"
 FRW_rhine_question:0 "莱茵问题"
 FRW_rhine_question_desc:0 "1923年，普恩加莱占领鲁尔并支持莱茵分离主义者；萨尔则一直处于国际联盟治下，其矿山掌握在法国手中，直到1935年。巴黎仍有许多人认为，法国的安全取决于莱茵河。"
 FRW_demand_the_saar:0 "索要萨尔"
 FRW_demand_the_saar_desc:0 "巴黎如今称1935年1月的全民公决是在纳粹施压下进行的骗局，并要求将萨尔移交给法国。"
 FRW_rhenish_republic:0 "莱茵共和国"
 FRW_rhenish_republic_desc:0 "1923年的分离主义者因缺乏支持而失败。如今法国打算给予莱茵兰这种支持，并将其置于法国控制之下。"
 FRW_pyrenees_question:0 "比利牛斯问题"
 FRW_pyrenees_question_desc:0 "在巴塞罗那，工人们正进行着与巴黎同志相同的斗争。红色法国无意重蹈布鲁姆不干涉政策的覆辙。"
 FRW_demand_catalonia:0 "加泰罗尼亚公社"
 FRW_demand_catalonia_desc:0 "全国劳工联盟和马克思主义统一工人党控制着巴塞罗那。巴黎提议，曾于1812年拿破仑时期并入法国的加泰罗尼亚加入法国工人共和国。"
 FRW_iberian_protectorate:0 "苏维埃伊比利亚"
 FRW_iberian_protectorate_desc:0 "巴黎不会将西班牙拱手让给佛朗哥。其计划是将整个半岛变为一个由巴黎指导的兄弟共和国。"
 FRW_alpine_question:0 "阿尔卑斯问题"
 FRW_alpine_question_desc:0 "日内瓦、瓦莱和奥斯塔河谷都说法语，而罗马却对尼斯和萨伏依提出领土要求。各联盟希望法国不再在阿尔卑斯山步步退让，并收回他们眼中属于法国的土地。"
 FRW_demand_romandy:0 "索要罗曼德"
 FRW_demand_romandy_desc:0 "各联盟要求将日内瓦、洛桑以及瑞士其余法语区划归法国。"
 FRW_demand_aosta_nice:0 "索要皮埃蒙特与奥斯塔"
 FRW_demand_aosta_nice_desc:0 "萨伏依家族得名于阿尔卑斯山法国一侧的领地。巴黎如今宣称拥有皮埃蒙特和奥斯塔河谷。"
 FRW_swiss_anschluss:0 "与瑞士合并"
 FRW_swiss_anschluss_desc:0 "数百年来，瑞士的中立一直依靠其群山和民兵。巴黎不再打算尊重它。"
 FRW_corsica_and_sardinia:0 "科西嘉与撒丁"
 FRW_corsica_and_sardinia_desc:0 "撒丁岛与科西嘉岛隔博尼法乔海峡相望，仅在其南方数英里之外。巴黎主张两岛应统一治理。"
 FRW_latin_destiny:0 "拉丁的命运"
 FRW_latin_destiny_desc:0 "法国、意大利和西班牙共同继承了罗马的遗产。三国共同掌握着西地中海的大部分海岸，从直布罗陀一直延伸到西西里。"
 FRW_latin_destiny_tt:0 "将§Y撒丁岛§!设为§G核心领土§!（若为法国所有）。"
 FRW_rome_accords:0 "罗马协定"
 FRW_rome_accords_desc:0 "1935年1月，赖伐尔与墨索里尼解决了两国在非洲的争端。法国将一片沙漠地带割让给利比亚，意大利则同意放弃其在突尼斯侨民的特殊地位。拉罗克打算让罗马信守这笔交易。"
 FRW_stresa_front:0 "重建斯特雷萨阵线"
 FRW_stresa_front_desc:0 "1935年4月，法国、英国和意大利在斯特雷萨携手维护奥地利的独立。拉罗克希望恢复这一阵线，让罗马成为法国的首要盟友。"
 FRW_stresa_front_tt:0 "邀请§Y意大利§!加入法国的阵营（若法国领导一个阵营）。"
 FRW_latin_naval_pact:0 "拉丁海军条约"
 FRW_latin_naval_pact_desc:0 "土伦与拉斯佩齐亚共享作战计划。法国舰队守卫西地中海，意大利舰队则负责中部海域和西西里海峡。"
 FRW_latin_union:0 "拉丁联盟"
 FRW_latin_union_desc:0 "拉罗克无意征服他的拉丁邻国。他向罗马和马德里提议建立一个从里斯本到的里雅斯特的关税同盟和共同防御体系，由巴黎居于领导地位。"
 FRW_latin_union_tt:0 "在法国阵营中结盟的§Y意大利§!现视为已为组建§Y拉丁帝国§!而控制（仍需西班牙和葡萄牙）。"
 FRW_benelux_question:0 "勃艮第遗产"
 FRW_benelux_question_desc:0 "奥尔良的路易丝是比利时的首位王后，而低地国家曾是勃艮第领地的核心。法国国王可以援引在布鲁塞尔和卢森堡的古老权利和家族纽带。"
 FRW_union_with_luxembourg:0 "与卢森堡合并"
 FRW_union_with_luxembourg_desc:0 "夹在法国与德国之间，这个大公国几乎没有独立自存的可能。巴黎向其提出合并。"
 FRW_demand_wallonia:0 "索要瓦隆"
 FRW_demand_wallonia_desc:0 "巴黎要求将比利时南部的法语省份归还法国。"
 FRW_belgian_union:0 "与比利时合并"
 FRW_belgian_union_desc:0 "1795年至1814年间，比利时曾是法国的一部分。如今布鲁塞尔被问及是否愿意再次成为法国的一部分。"
 FRW_batavian_union:0 "与荷兰合并"
 FRW_batavian_union_desc:0 "1810年，拿破仑将荷兰王国并入法国。巴黎如今打算如法炮制。"
 FRW_batavian_union_tt:0 "若§Y荷兰§!独立，则向其提出合并要求（接受即被吞并）。若其为法国傀儡，则法国将其吞并。\n组建§Y勃艮第王国§!：启用新国名和国旗，获得国家精神，将法国所拥有的§G比利时、荷兰和卢森堡领土设为核心领土§!（此后在该地区获得的领土同样适用），并§Y宣称§!其余领土。\n取代法国此前组建的任何国家（移除其可组建国家的国家精神）。若法国已是§Y永恒的弗朗西亚王国§!，则保持不变。\n需要控制§Y比利时§!、§Y荷兰§!和§Y卢森堡§!全境（须为吞并而非傀儡）。若法国尚未控制它们，则一旦控制便自动建国。"
 FRW_reunions_complete:0 "勃艮第王国重光"
 FRW_reunions_complete_desc:0 "从佛兰德到卢森堡的古老勃艮第领地再次统一于法国王冠之下。"
