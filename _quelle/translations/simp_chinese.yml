 FRW_ff_richelieu_spirit:0 "“黎塞留”号"
 FRW_ff_maquis_spirit:0 "马基游击队"
 FRW_ff_colonial_recruitment_spirit:0 "殖民地征兵"
 FRW_ff_cfln_spirit:0 "民族解放委员会"
