 FRW_ffp_tt_p2:0 "自由法国威望：§G+2§!"
 FRW_ffp_tt_p3:0 "自由法国威望：§G+3§!"
 FRW_ralliement_cat:0 "自由法国"
 FRW_exped_eq_tt:0 "库存至少有§Y1,500§!件步兵装备"
 FRW_dec_exped_tt:0 "消耗§Y15,000§!人力和§Y1,500§!件步兵装备。§Y45天§!后远征军将回报结果：若成功，该地区加入自由法国（威望§G+5§!，获得陆军经验）；若失败，威望§R-8§!。"
 FRW_dec_ff_agents:0 "向法国空投特工"
 FRW_dec_ff_agents_desc:0 "中央情报行动局（BCRA）的无线电报务员和组织者在夜间空降到被占领的法国。"
 FRW_dec_ff_agents_tt:0 "欧洲每个被占领的法国省份：抵抗度§G+5§!。"
 FRW_dec_ff_sabotage:0 "破坏铁路"
 FRW_dec_ff_sabotage_desc:0 "“铁路抵抗”组织的铁路工人炸毁道岔、颠覆列车，拖慢每一支德国运输队。"
 FRW_dec_ff_sabotage_tt:0 "欧洲每个被占领的法国省份：抵抗度§G+10§!，基础设施遭到破坏。"
 FRW_dec_ff_gold:0 "动用法兰西银行的黄金"
 FRW_dec_ff_gold_desc:0 "停战前运出法国的黄金，可用于在海外购买武器、开设工场。\n\n剩余黄金：§Y[?FRW_gold|0]吨§!"
 FRW_gold_m400_tt:0 "黄金储备：§R-400吨§!"
 FRW_ralliement_cat_desc:0 "各殖民地已被移交给维希，但可以逐个地区将其争取回来：派遣§Y特使§!（代价低廉，取决于威望），或派遣§Y远征军§!（消耗兵员和步枪，成功几率+25%，若英国仍在作战则再+10%）。\n\n自由法国威望：§Y[?FRW_ff_prestige|0]§!/100\n\n成功几率随威望（计入一半）、同一地区此前的每次失败（每次§G+10%§!，最多三次）以及某些国策而提高。成功时威望§G+5§!，失败时威望§R-5§!。只要法国继续作战，威望每月都会自行增长；若仍有一个主要盟国在参战，增长速度更快。"
 FRW_dec_rally_tt:0 "§Y21天§!后特使将回报结果：若成功，该地区由§Y维希§!控制的每个省份都将连同其士兵和步枪一起加入自由法国。"
 FRW_ffp_tt_m10:0 "自由法国威望：§R-10§!"
 FRW_ffp_tt_p5:0 "自由法国威望：§G+5§!"
 frw_sys.20.t:0 "法属赤道非洲归附自由法国"
 frw_sys.20.d:0 "费利克斯·埃布埃总督在拉密堡宣布支持自由法国。数日之内，喀麦隆、中刚果和加蓬相继跟进。布拉柴维尔成为自由法国的第一个首都。"
 frw_sys.20.a:0 "自由法国万岁！"
 frw_sys.30.t:0 "法属赤道非洲继续效忠维希"
 frw_sys.30.d:0 "加蓬的军官们仍效忠维希，我们的特使被送上了下一班开往拉各斯的船。下一次，我们的特使将做好更充分的准备。"
 frw_sys.30.a:0 "我们会再试一次。"
 frw_sys.60.t:0 "我军登陆法属赤道非洲"
 frw_sys.60.d:0 "在盟军舰船和飞机的支援下，自由法国军的纵队已抵达该地区首府。费利克斯·埃布埃总督在拉密堡宣布支持自由法国。数日之内，喀麦隆、中刚果和加蓬相继跟进。布拉柴维尔成为自由法国的第一个首都。"
 frw_sys.60.a:0 "洛林十字旗再次飘扬。"
 frw_sys.70.t:0 "远征法属赤道非洲失败"
 frw_sys.70.d:0 "我们的登陆行动遭到维希守军的顽强抵抗，不得不中止。人员和装备蒙受损失，维希的宣传机器正在大肆庆祝。"
 frw_sys.70.a:0 "我们还会回来的。"
 frw_sys.21.t:0 "法属西非归附自由法国"
 frw_sys.21.d:0 "在达喀尔，总督已改换阵营。这座大港、停泊在港池中的战列舰以及塞内加尔步兵如今都为自由法国效力。"
 frw_sys.21.a:0 "自由法国万岁！"
 frw_sys.31.t:0 "法属西非继续效忠维希"
 frw_sys.31.d:0 "达喀尔的炮台向自由法国的舰船开火。维希暂时保住了西非。下一次，我们的特使将做好更充分的准备。"
 frw_sys.31.a:0 "我们会再试一次。"
 frw_sys.61.t:0 "我军登陆法属西非"
 frw_sys.61.d:0 "在盟军舰船和飞机的支援下，自由法国军的纵队已抵达该地区首府。在达喀尔，总督已改换阵营。这座大港、停泊在港池中的战列舰以及塞内加尔步兵如今都为自由法国效力。"
 frw_sys.61.a:0 "洛林十字旗再次飘扬。"
 frw_sys.71.t:0 "远征法属西非失败"
 frw_sys.71.d:0 "我们的登陆行动遭到维希守军的顽强抵抗，不得不中止。人员和装备蒙受损失，维希的宣传机器正在大肆庆祝。"
 frw_sys.71.a:0 "我们还会回来的。"
 frw_sys.22.t:0 "法属北非归附自由法国"
 frw_sys.22.d:0 "阿尔及尔、奥兰、卡萨布兰卡和突尼斯已相继归附。拥有十万之众的非洲军团重返战场。"
 frw_sys.22.a:0 "自由法国万岁！"
 frw_sys.32.t:0 "法属北非继续效忠维希"
 frw_sys.32.d:0 "魏刚将军下令逮捕了阿尔及尔的密谋者。北非仍追随元帅。下一次，我们的特使将做好更充分的准备。"
 frw_sys.32.a:0 "我们会再试一次。"
 frw_sys.62.t:0 "我军登陆法属北非"
 frw_sys.62.d:0 "在盟军舰船和飞机的支援下，自由法国军的纵队已抵达该地区首府。阿尔及尔、奥兰、卡萨布兰卡和突尼斯已相继归附。拥有十万之众的非洲军团重返战场。"
 frw_sys.62.a:0 "洛林十字旗再次飘扬。"
 frw_sys.72.t:0 "远征法属北非失败"
 frw_sys.72.d:0 "我们的登陆行动遭到维希守军的顽强抵抗，不得不中止。人员和装备蒙受损失，维希的宣传机器正在大肆庆祝。"
 frw_sys.72.a:0 "我们还会回来的。"
 frw_sys.23.t:0 "黎凡特归附自由法国"
 frw_sys.23.d:0 "经过一场短暂而激烈的战役，黎凡特军团已放下武器。其中许多士兵选择加入自由法国军。"
 frw_sys.23.a:0 "自由法国万岁！"
 frw_sys.33.t:0 "黎凡特继续效忠维希"
 frw_sys.33.d:0 "当茨将军拒绝了一切提议。在大马士革，自由法国的军官们以叛国罪受审。下一次，我们的特使将做好更充分的准备。"
 frw_sys.33.a:0 "我们会再试一次。"
 frw_sys.63.t:0 "我军登陆黎凡特"
 frw_sys.63.d:0 "在盟军舰船和飞机的支援下，自由法国军的纵队已抵达该地区首府。经过一场短暂而激烈的战役，黎凡特军团已放下武器。其中许多士兵选择加入自由法国军。"
 frw_sys.63.a:0 "洛林十字旗再次飘扬。"
 frw_sys.73.t:0 "远征黎凡特失败"
 frw_sys.73.d:0 "我们的登陆行动遭到维希守军的顽强抵抗，不得不中止。人员和装备蒙受损失，维希的宣传机器正在大肆庆祝。"
 frw_sys.73.a:0 "我们还会回来的。"
 frw_sys.24.t:0 "马达加斯加与印度洋归附自由法国"
 frw_sys.24.d:0 "塔那那利佛的总督已交出该岛。印度洋已对轴心国关闭。"
 frw_sys.24.a:0 "自由法国万岁！"
 frw_sys.34.t:0 "马达加斯加与印度洋继续效忠维希"
 frw_sys.34.d:0 "迭戈-苏亚雷斯的守军坚守不退。马达加斯加仍效忠维希。下一次，我们的特使将做好更充分的准备。"
 frw_sys.34.a:0 "我们会再试一次。"
 frw_sys.64.t:0 "我军登陆马达加斯加与印度洋"
 frw_sys.64.d:0 "在盟军舰船和飞机的支援下，自由法国军的纵队已抵达该地区首府。塔那那利佛的总督已交出该岛。印度洋已对轴心国关闭。"
 frw_sys.64.a:0 "洛林十字旗再次飘扬。"
 frw_sys.74.t:0 "远征马达加斯加与印度洋失败"
 frw_sys.74.d:0 "我们的登陆行动遭到维希守军的顽强抵抗，不得不中止。人员和装备蒙受损失，维希的宣传机器正在大肆庆祝。"
 frw_sys.74.a:0 "我们还会回来的。"
 frw_sys.25.t:0 "法属索马里归附自由法国"
 frw_sys.25.d:0 "在英国的封锁下陷入孤立、饥饿难耐的吉布提已归附自由法国。"
 frw_sys.25.a:0 "自由法国万岁！"
 frw_sys.35.t:0 "法属索马里继续效忠维希"
 frw_sys.35.d:0 "吉布提的小股守军拒绝归附，封锁仍在继续。下一次，我们的特使将做好更充分的准备。"
 frw_sys.35.a:0 "我们会再试一次。"
 frw_sys.65.t:0 "我军登陆法属索马里"
 frw_sys.65.d:0 "在盟军舰船和飞机的支援下，自由法国军的纵队已抵达该地区首府。在英国的封锁下陷入孤立、饥饿难耐的吉布提已归附自由法国。"
 frw_sys.65.a:0 "洛林十字旗再次飘扬。"
 frw_sys.75.t:0 "远征法属索马里失败"
 frw_sys.75.d:0 "我们的登陆行动遭到维希守军的顽强抵抗，不得不中止。人员和装备蒙受损失，维希的宣传机器正在大肆庆祝。"
 frw_sys.75.a:0 "我们还会回来的。"
 frw_sys.26.t:0 "法属印度支那归附自由法国"
 frw_sys.26.d:0 "河内和西贡已归附自由法国。德古海军上将已被送上回国的船。"
 frw_sys.26.a:0 "自由法国万岁！"
 frw_sys.36.t:0 "法属印度支那继续效忠维希"
 frw_sys.36.d:0 "在日本驻军的注视下，德古海军上将为维希保住了印度支那。下一次，我们的特使将做好更充分的准备。"
 frw_sys.36.a:0 "我们会再试一次。"
 frw_sys.66.t:0 "我军登陆法属印度支那"
 frw_sys.66.d:0 "在盟军舰船和飞机的支援下，自由法国军的纵队已抵达该地区首府。河内和西贡已归附自由法国。德古海军上将已被送上回国的船。"
 frw_sys.66.a:0 "洛林十字旗再次飘扬。"
 frw_sys.76.t:0 "远征法属印度支那失败"
 frw_sys.76.d:0 "我们的登陆行动遭到维希守军的顽强抵抗，不得不中止。人员和装备蒙受损失，维希的宣传机器正在大肆庆祝。"
 frw_sys.76.a:0 "我们还会回来的。"
 FRW_gold_p400_tt:0 "黄金储备：§G+400吨§!"
 FRW_inf_tt_m35:0 "通货膨胀：§G-35§!"
 frw_sys.3.t:0 "恶性通货膨胀"
 frw_sys.3.d:0 "人们用篮子装着钞票，物价一天要变两次。法郎已濒临崩溃。财政部的专家提出了一项激进的货币改革：发行新法郎，一百旧法郎兑换一新法郎。"
 frw_sys.3.a:0 "发行新法郎。"
 frw_sys.3.b:0 "现在不行。熬过去。"
 frw_sys.4.t:0 "黄金丢失了"
 frw_sys.4.d:0 "法兰西银行的黄金未能及时运出。如今它落入了占领者手中，自由法国只能在没有这批黄金的情况下勉力支撑。"
 frw_sys.4.a:0 "我们早该把它运到达喀尔。"
 frw_sys.50.t:0 "盟国承认自由法国"
 frw_sys.50.d:0 "伦敦和华盛顿如今将自由法国视为真正的盟友。武器、信贷以及英国的工厂产能都交由我们支配。"
 frw_sys.50.a:0 "法国重回谈判桌。"
 frw_sys.51.t:0 "战斗法国"
 frw_sys.51.d:0 "盟国各政府将自由法国委员会视为法国政府来打交道。曾经前往维希拜会的大使们，如今转而前往卡尔顿花园。"
 frw_sys.51.a:0 "战斗法国万岁！"
 frw_sys.5.t:0 "金库告急"
 frw_sys.5.d:0 "法兰西银行行长带来了坏消息：金库中的黄金已不足五百吨。没有黄金，法郎就失去了支撑，而欧洲的每一个投机者都心知肚明。"
 frw_sys.5.a:0 "对资本关闭边境。"
 frw_sys.5.b:0 "向伦敦申请黄金贷款。"
 frw_sys.5.c:0 "我们总会想办法的。"
 frw_sys.1.t:0 "法郎正在下跌"
 frw_sys.1.d:0 "巴黎的物价在一年内翻了一番。主妇们排队购买面包，工会要求提高工资，报纸纷纷提起1926年。财政部长请求采取紧急措施。"
 frw_sys.1.a:0 "吞下这剂苦药。"
 frw_sys.1.b:0 "国家会承受的——法国还有别的烦恼。"
 frw_sys.2.t:0 "流亡政府"
 frw_sys.2.d:0 "法国已经沦陷，但政府仍在继续战斗。国策树中的自由法国分支现已开启，通过决议菜单§Y自由法国§!，你可以将已移交给维希的殖民地争取回来。"
 frw_sys.2.a:0 "法国抵抗的火焰绝不能熄灭。"
 frw_sys.10.t:0 "米尔斯克比尔港的舰队"
 frw_sys.10.d:0 "停战协定将舰队交给了维希。在米尔斯克比尔、土伦和亚历山大港，舰船停泊在锚地，船员们不知该听命于谁。伦敦绝不会让它们落入德国人手中，自由法国必须决定对船员们说些什么。"
 frw_sys.10.a:0 "号召水兵加入我们。"
 frw_sys.10.a.tt:0 "几率（§Y20%§! + 威望的40%）：维希舰队的一部分（§Y约三分之一§!）驶来加入自由法国，威望§G+5§!。否则威望§R-5§!。"
 frw_sys.10.b:0 "让皇家海军去解决。"
 frw_sys.10.b.tt:0 "皇家海军攻击维希舰队：维希损失§Y一艘战列舰、一艘战列巡洋舰和三艘驱逐舰§!。"
 frw_sys.10.c:0 "法国军舰绝不会向法国军舰开火。"
 frw_sys.11.t:0 "水兵们加入了我们"
 frw_sys.11.d:0 "数艘舰船趁夜溜出港口，正驶向自由法国的港口，船员们在甲板上欢呼。"
 frw_sys.11.a:0 "欢迎登舰。"
 frw_sys.12.t:0 "舰队留在维希一方"
 frw_sys.12.d:0 "达尔朗海军上将下令将船员禁闭在各自舰上。没有一艘舰船响应我们的号召。"
 frw_sys.12.a:0 "沉重的打击。"
 frw_sys.40.t:0 "一名总督倒戈了"
 frw_sys.40.d:0 "我们的一位殖民地总督已投向伦敦的异见者。他的领地如今飘扬着洛林十字旗。"
 frw_sys.40.a:0 "叛徒！"
 FRW_hook_devalue_the_franc_0_tt:0 "通货膨胀：§G-10§!"
 FRW_hook_reform_banque_de_france_0_tt:0 "从现在起，通货膨胀每月额外下降§G0.5§!点。"
 FRW_hook_war_economy_0_tt:0 "通货膨胀：§R+5§!"
 FRW_hook_appeal_of_18_june_0_tt:0 "自由法国威望从§Y20§!/100起步，并开启§Y自由法国§!决议。移除§Y失败主义§!。"
 FRW_hook_continue_the_fight_0_tt:0 "自由法国威望：§G+5§!"
 FRW_hook_free_french_forces_0_tt:0 "自由法国威望：§G+5§!"
 FRW_hook_rally_the_colonies_0_tt:0 "自由法国威望：§G+10§!"
 FRW_hook_leclerc_column_0_tt:0 "自由法国威望：§G+5§!"
 FRW_hook_brazzaville_conference_0_tt:0 "自由法国威望：§G+10§!"
 FRW_hook_the_resistance_0_tt:0 "自由法国威望：§G+5§!"
 FRW_ff_chequers_spirit_desc:0 "英国为自由法国军提供资金、武器和补给，并承认戴高乐为其领袖。"
 FRW_ff_national_committee_spirit_desc:0 "法兰西民族委员会在伦敦执政。"
 FRW_ff_bcra_spirit_desc:0 "自由法国的情报机构在被占领的法国各地经营着情报网。"
 FRW_ff_cnr_spirit_desc:0 "全国抵抗委员会将各抵抗运动团结起来。"
 FRW_ff_bir_hakeim_spirit_desc:0 "军队铭记着沙漠中的十六天。"
 FRW_ff_fafl_spirit_desc:0 "法国飞行员再次在洛林十字下飞翔。"
 FRW_ff_normandie_spirit_desc:0 "法国飞行员与苏联红军空军一道驾驶雅克战斗机。"
 FRW_ff_fnfl_spirit_desc:0 "自由法国舰艇为大西洋护航船队护航。"
 FRW_ff_securite_sociale_spirit_desc:0 "每一位工薪劳动者都享有保险。代价高昂，却深得人心。"
 FRW_ff_reconstruction_spirit_desc:0 "法国重建被战争摧毁的一切。"
 FRW_ff_fourth_republic_spirit_desc:0 "一个经选举产生的议会再次治理法国。"
 FRW_ff_eurafrican_assembly_spirit_desc:0 "欧洲与非洲共享一个议会。"
 FRW_ff_lorraine_spirit_desc:0 "法国轰炸机机组在法国上空执行自己的任务。"
 FRW_ff_richelieu_spirit_desc:0 "法国最先进的战列舰再度投入战斗。"
 FRW_ff_maquis_spirit_desc:0 "法国的山林中到处是武装人员。"
 FRW_ff_colonial_recruitment_spirit_desc:0 "来自非洲的土著步兵充实了解放军。"
 FRW_ff_cfln_spirit_desc:0 "一个委员会，一支军队，一个法兰西。"
 FRW_ff_cef_spirit_desc:0 "朱安的山地部队一马当先。"
 FRW_ff_dragoon_spirit_desc:0 "这支军队懂得如何在敌对海岸登陆。"
 FRW_ff_dakar_tt:0 "§Y法属西非§!（达喀尔）已归附自由法国"
 FRW_ff_sov_fights_tt:0 "§Y苏联§!正与§Y德国§!交战"
 FRW_return_cat:0 "盟国手中的法属非洲"
 FRW_return_cat_desc:0 "盟军控制着法属非洲的部分地区。请求他们将这些领土交还法国，可以客气地提出，也可以开出一个让他们难以拒绝的条件。\n\n自由法国威望：§Y[?FRW_ff_prestige|0]§!"
 FRW_dec_return_request:0 "要求[FROM.GetName]归还法属非洲"
 FRW_dec_return_request_desc:0 "[FROM.GetName]控制着法国在非洲的领土。外交请求代价不大，但对方可能会拒绝。"
 FRW_dec_return_request_tt:0 "由[FROM.GetName]决定。我们的§Y自由法国威望§!越高，AI就越乐于接受（从约§Y50%§!到§Y95%§!）。\n若对方接受，[FROM.GetName]在§Y非洲§!控制的每个§Y法国§!省份都将归还法国。"
 FRW_dec_return_buy_pp:0 "从[FROM.GetName]手中赎回法属非洲"
 FRW_dec_return_buy_pp_desc:0 "法国提供特许权和信贷，以换取其非洲领土的归还。"
 FRW_dec_return_buy_tt:0 "AI总是会接受。[FROM.GetName]获得§Y60§!政治点数；若对方拒绝，我们将收回§Y100§!政治点数。\n若对方接受，[FROM.GetName]在§Y非洲§!控制的每个§Y法国§!省份都将归还法国。"
 FRW_dec_return_buy_gold:0 "以黄金支付法属非洲"
 FRW_dec_return_buy_gold_desc:0 "以法兰西银行的三百吨黄金换取法属非洲的归还。\n\n剩余黄金：§Y[?FRW_gold|0]吨§!"
 FRW_dec_return_gold_tt:0 "黄金储备：§R-300吨§!。AI总是会接受。[FROM.GetName]获得为期一年的§Y法国黄金§!（消费品§G-5%§!）；若对方拒绝，黄金将退回。\n若对方接受，[FROM.GetName]在§Y非洲§!控制的每个§Y法国§!省份都将归还法国。"
 frw_ret.hand_tt:0 "我们在§Y非洲§!控制的每个§Y法国§!省份都将归还§Y法国§!。"
 frw_ret.1.t:0 "法国要求归还其殖民地"
 frw_ret.1.d:0 "法国政府提醒我们，我军目前控制的非洲领土属于法国。它要求将这些领土交还其管辖。"
 frw_ret.1.a:0 "他们是我们的盟友。交还给他们。"
 frw_ret.1.b:0 "战争还在继续，现在不行。"
 frw_ret.2.t:0 "法国的提议"
 frw_ret.2.d:0 "巴黎提出，如果我们归还我军控制的法国在非洲的领土，将向我们提供贸易特许权和信贷。"
 frw_ret.2.a:0 "价格公道。成交。"
 frw_ret.2.b:0 "我们不出卖。"
 frw_ret.3.t:0 "以法国黄金换法属非洲"
 frw_ret.3.d:0 "法国人提出，以法兰西银行储备中的三百吨黄金换取其非洲领土的归还。"
 frw_ret.3.a:0 "黄金胜于雄辩。成交。"
 frw_ret.3.b:0 "留着你们的黄金吧。"
 frw_ret.10.t:0 "法属非洲回归"
 frw_ret.10.d:0 "我们的盟友已将法国在非洲的领土交还给我们。三色旗再次飘扬在政府大楼上空。"
 frw_ret.10.a:0 "谢谢，我的朋友们。"
 frw_ret.11.t:0 "我们的请求遭拒"
 frw_ret.11.d:0 "我们的盟友暂时不会交还法国在非洲的领土。"
 frw_ret.11.a:0 "我们会再请求的。"
 FRW_french_gold_payment_desc:0 "法国为换回其非洲领土而支付的黄金。"
 FRW_trotsky_affront:0 "庇护托洛茨基"
