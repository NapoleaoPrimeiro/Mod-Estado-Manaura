 FRW_collective_security_faction:0 "集体安全"
 FRW_political_cat:0 "国内事务"
 FRW_political_cat_desc:0 "使法国国内更加稳定、并为战争做好更充分准备的各项措施。"
 FRW_dec_national_rally:0 "全国集会"
 FRW_dec_national_rally_desc:0 "在各主要城市举行大型群众集会，为政府争取支持。"
 FRW_dec_war_propaganda:0 "国防宣传运动"
 FRW_dec_war_propaganda_desc:0 "海报、新闻短片和无线电广播让民众为可能爆发的战争做好准备。"
 FRW_dec_colonial_recruitment:0 "在帝国境内征兵"
 FRW_dec_colonial_recruitment_desc:0 "北非和西非的征兵处为军队招募志愿兵。"
 FRW_colonial_purchases_cat:0 "殖民地收购"
 FRW_colonial_purchases_cat_desc:0 "法国以黄金和政治支持为代价，向其他殖民列强换取非洲领土。每一项提议均由卖方决定；在多人游戏中，即由拥有该土地的玩家决定。"
 FRW_buy_spanish_morocco:0 "购买西属摩洛哥"
 FRW_buy_spanish_morocco_desc:0 "法国向马德里提出以黄金换取里夫地区。"
 FRW_buy_ifni_rio_de_oro:0 "购买伊夫尼和里奥德奥罗"
 FRW_buy_ifni_rio_de_oro_desc:0 "西班牙在大西洋沿岸的沙漠领地位于法属摩洛哥与毛里塔尼亚之间。"
 FRW_buy_spanish_guinea:0 "购买西属几内亚"
 FRW_buy_spanish_guinea_desc:0 "木尼河地区的陆上一侧被法属赤道非洲所环绕。"
 FRW_buy_portuguese_guinea:0 "购买葡属几内亚"
 FRW_buy_portuguese_guinea_desc:0 "这块葡萄牙在西非的殖民地几乎完全被法国领土所包围。"
 FRW_buy_gambia:0 "购买冈比亚"
 FRW_buy_gambia_desc:0 "沿冈比亚河延伸的狭长英国领地将塞内加尔一分为二。"
 FRW_buy_sierra_leone:0 "购买塞拉利昂"
 FRW_buy_sierra_leone_desc:0 "弗里敦将为法属西非提供一座优良的大西洋港口。"
 FRW_buy_belgian_congo:0 "购买刚果特许经营权"
 FRW_buy_belgian_congo_desc:0 "法国向布鲁塞尔提出条件，要求其将刚果的一部分割让给法国。"
 FRW_buy_fezzan:0 "购买费赞"
 FRW_buy_fezzan_desc:0 "费赞是意大利在利比亚的沙漠腹地，与阿尔及利亚和乍得均接壤。"
 FRW_union_francaise_cat:0 "法兰西联盟"
 FRW_union_francaise_cat_desc:0 "殖民帝国被改组为一个联盟，突尼斯和摩洛哥两个保护国成为法国的正式成员。"
 FRW_form_union_francaise:0 "宣布成立法兰西联盟"
 FRW_form_union_francaise_desc:0 "突尼斯和摩洛哥成为法国的核心领土。"
 FRW_europe_cat:0 "欧洲联邦"
 FRW_europe_cat_desc:0 "在法国领导下建立统一欧洲的计划，无论是民主的还是社会主义的。"
 FRW_form_european_federation:0 "建立欧洲联邦"
 FRW_form_european_federation_desc:0 "比荷卢和莱茵兰成为法国领导的联邦的核心领土。"
 FRW_grand_empire_cat:0 "大帝国"
 FRW_grand_empire_cat_desc:0 "在拿破仑时代的疆界内恢复法兰西帝国。"
 FRW_form_grand_empire:0 "宣布成立大帝国"
 FRW_form_grand_empire_desc:0 "比荷卢、莱茵兰和皮埃蒙特成为帝国的核心领土。"
 FRW_francia_cat:0 "法兰克帝国"
 FRW_francia_cat_desc:0 "查理曼曾在亚琛统治着比利牛斯山与易北河之间的土地。法国自称是他的合法继承者。"
 FRW_form_francia:0 "重建查理曼帝国"
 FRW_form_francia_desc:0 "需要控制比利时、荷兰、莱茵兰、威斯特法伦和巴登。这些地区将成为核心领土。"
 FRW_latin_cat:0 "拉丁帝国"
 FRW_latin_cat_desc:0 "将罗马的继承者法国、意大利和西班牙统一于同一顶王冠或同一位领袖之下的计划。"
 FRW_form_latin_empire:0 "宣布成立拉丁帝国"
 FRW_form_latin_empire_desc:0 "需要控制罗马、马德里和皮埃蒙特。我们所拥有的所有意大利、西班牙和葡萄牙核心领土都将成为我们的核心领土。"
 FRW_eurafrique_cat:0 "欧非联邦"
 FRW_eurafrique_cat_desc:0 "在法国领导下将欧洲与非洲结为单一联邦的计划。"
 FRW_form_eurafrican_federation:0 "建立欧非联邦"
 FRW_form_eurafrican_federation_desc:0 "撒哈拉、法属苏丹和几内亚成为核心领土。"
 frw.1.t:0 "第三共和国的危机"
 frw.1.d:0 "自1934年2月6日骚乱以来，国家便不得安宁。内阁走马灯般更迭，各联盟在街头游行，共产党人的势力日益壮大，经济停滞不前。在沙龙和兵营里，军官和政客们公开讨论应当用什么来取代共和国。"
 frw.1.a:0 "维护法律与秩序。"
 frw.1.b:0 "我们需要果断行动。"
 frw.2.t:0 "公社宣告成立！"
 frw.2.d:0 "红旗在市政厅上空飘扬。在巴黎，工人、士兵和共产党夺取了政权，建立了一个社会主义政府以取代共和国。欧洲其他各国首都惊恐地等待着下一步的动向。"
 frw.2.a:0 "一个幽灵，在欧洲游荡。"
 frw.2.b:0 "公社万岁！"
 frw.3.t:0 "法国的民族革命"
 frw.3.d:0 "经过数周的动荡，联合起来的各联盟推翻了政府。众议院和参议院已被解散，一个国民政府掌握了政权。"
 frw.3.a:0 "法国变了。"
 frw.3.b:0 "法兰西觉醒了！"
 frw.4.t:0 "法国议会两院休会"
 frw.4.d:0 "出人意料的是，政府宣布众议院和参议院无限期休会。一个“超党派”内阁如今治理着国家，至于何种政体将取代共和国，目前仍不明朗。"
 frw.4.a:0 "接下来会怎样？"
 frw.5.t:0 "法兰西人的帝国！"
 frw.5.d:0 "路易·拿破仑亲王已在巴黎圣母院加冕为法国人的皇帝拿破仑六世。近卫军沿香榭丽舍大街列队行进，雄鹰重新回到了各团的军旗之上。"
 frw.5.a:0 "历史重演了。"
 frw.5.b:0 "皇帝万岁！"
 frw.6.t:0 "巴黎有了国王"
 frw.6.d:0 "巴黎伯爵亨利·德·奥尔良结束流亡归来，以亨利六世之名登上王位。法国自1848年以来首次有了国王。"
 frw.6.a:0 "有意思。"
 frw.6.b:0 "国王万岁！"
 frw.10.t:0 "法国申请加入"
 frw.10.d:0 "法国政府正式请求加入我们的同盟。法国将带来一支庞大的陆军和一支强大的舰队。"
 frw.10.a:0 "欢迎，法国。"
 frw.10.b:0 "我们拒绝。"
 frw.11.t:0 "加入申请获准"
 frw.11.d:0 "我们的请求已被接受，法国如今有了并肩作战的盟友。"
 frw.11.a:0 "好极了。"
 frw.12.t:0 "申请遭拒"
 frw.12.d:0 "我们的加入请求遭到拒绝。法国将不得不在没有这一同盟的情况下自行应对。"
 frw.12.a:0 "那我们就独自面对。"
 frw.16.t:0 "来自巴黎的结盟邀请"
 frw.16.d:0 "法国组建了新的同盟，并邀请我们加入。"
 frw.16.a:0 "我们加入。"
 frw.16.b:0 "我们保持独立。"
 frw.17.t:0 "结盟邀请已被接受"
 frw.17.d:0 "[From.GetNameDefCap]已接受我们的提议，加入了同盟。"
 frw.17.a:0 "团结就是力量。"
 frw.18.t:0 "结盟邀请遭拒"
 frw.18.d:0 "[From.GetNameDefCap]拒绝了我们的结盟邀请。"
 frw.18.a:0 "遗憾。"
 frw.20.t:0 "英法联盟？"
 frw.20.d:0 "巴黎提议两国合并，设立联合的国防部与经济部，实行共同公民身份，并组建统一的战时内阁。"
 frw.20.a:0 "一个牢不可破的联盟。"
 frw.20.b:0 "这太过分了。"
 frw.21.t:0 "伦敦同意了！"
 frw.21.d:0 "英国政府已接受合并，两大帝国今后将作为一个整体行动。"
 frw.21.a:0 "联盟万岁！"
 frw.22.t:0 "伦敦拒绝"
 frw.22.d:0 "伦敦认为合并为时尚早。协约将继续维持，但仅限于现行条款。"
 frw.22.a:0 "背信弃义的英格兰。"
 frw.25.t:0 "法国的保护国？"
 frw.25.d:0 "法国提出承担我国债务并保障我国安全，条件是我国成为法国的保护国。"
 frw.25.a:0 "我们接受。"
 frw.25.b:0 "我们的独立没有商量的余地。"
 frw.26.t:0 "利比里亚接受"
 frw.26.d:0 "利比里亚现已处于法国的保护之下。"
 frw.26.a:0 "很好。"
 frw.27.t:0 "利比里亚拒绝"
 frw.27.d:0 "利比里亚政府拒绝了我们的提议。"
 frw.27.a:0 "可惜。"
 frw.50.t:0 "法国的购买提议"
 frw.50.d:0 "一位来自巴黎的使节带来了一项提议。法国希望购买与其非洲属地接壤的殖民领土，并将支付一笔丰厚的黄金，同时提供政治支持。"
 frw.50.a:0 "我们出售。"
 frw.50.b:0 "这片土地不卖。"
 frw.51.t:0 "购买完成"
 frw.51.d:0 "谈判取得成功，该领土现已成为法兰西帝国的一部分，但这笔购地款也使预算捉襟见肘。"
 frw.51.a:0 "一笔好买卖。"
 frw.52.t:0 "提议遭拒"
 frw.52.d:0 "我们的购买提议遭到拒绝。部分款项已退回国库。"
 frw.52.a:0 "也许下次吧。"
 frw.60.t:0 "欧洲联邦成立"
 frw.60.d:0 "欧洲联邦的建国宪章已在斯特拉斯堡签署。在法国的领导下，西欧各国将合并为一个统一的国家。"
 frw.60.a:0 "一个新时代。"
 frw.61.t:0 "大帝国"
 frw.61.d:0 "帝国之鹰再次翱翔于从北海到阿尔卑斯山的天空。拿破仑的大帝国已经重建。"
 frw.61.a:0 "皇帝的遗产。"
 frw.62.t:0 "法兰西联盟"
 frw.62.d:0 "法国已宣布成立法兰西联盟，突尼斯和摩洛哥现已成为共和国平等的组成部分。"
 frw.62.a:0 "帝国的新秩序。"
 frw.63.t:0 "查理曼帝国重建"
 frw.63.d:0 "在安葬着查理曼的亚琛大教堂，法国宣布法兰克帝国复兴。比利牛斯山与莱茵河之间的土地再次统一。"
 frw.63.a:0 "查理大帝也会为此骄傲。"
 frw.64.t:0 "拉丁帝国宣告成立"
 frw.64.d:0 "法国、意大利和西班牙现已处于同一个政府之下。自称恺撒后裔的拉丁帝国已在罗马宣告成立。"
 frw.64.a:0 "罗马再度崛起。"
 frw.65.t:0 "欧非联邦"
 frw.65.d:0 "法国已将其非洲领土合并为欧非联邦，这是一个从敦刻尔克延伸至尼日尔河的统一国家。"
 frw.65.a:0 "欧非一体！"
 frw.70.t:0 "法国要求合并"
 frw.70.d:0 "法国政府以共同的语言和历史为由，要求[Root.GetNameDef]与法国合并。巴黎已明确表示，拒绝可能招致武力回应。"
 frw.70.a:0 "我们接受合并。"
 frw.70.b:0 "绝不！"
 frw.71.t:0 "法国索要领土"
 frw.71.d:0 "法国要求我们割让其视为历史上属于法国的边境地区。如果我们拒绝，巴黎可能会诉诸武力。"
 frw.71.a:0 "我们割让领土。"
 frw.71.b:0 "寸土不让！"
 frw.72.t:0 "我们的要求已被接受"
 frw.72.d:0 "我们的要求已得到满足，法军正兵不血刃地越过新的边界。"
 frw.72.a:0 "法兰西万岁！"
 frw.73.t:0 "合并遭拒"
 frw.73.d:0 "[From.GetNameDefCap]拒绝与法国合并。总参谋部已备好计划，要以武力夺取对方拒绝给予我们的东西。"
 frw.73.a:0 "那我们就用武力夺取。"
 frw.73.b:0 "我们不会为此开战。"
 frw.74.t:0 "要求遭拒"
 frw.74.d:0 "[From.GetNameDefCap]拒绝割让我们所要求的领土。只要政府下令，军队仍可将其夺取。"
 frw.74.a:0 "准备战争。"
 frw.74.b:0 "暂且作罢。"
 frw.75.t:0 "法国要求我们效忠"
 frw.75.d:0 "巴黎要求[Root.GetNameDef]接受法国的保护，我国的外交政策和军队都将听命于法国。法国大使暗示，拒绝之举将被铭记在心，而且法军已进入戒备状态。"
 frw.75.a:0 "我们接受法国的保护。"
 frw.75.b:0 "我们仍是主权国家！"
 frw.76.t:0 "保护遭拒"
 frw.76.d:0 "[From.GetNameDefCap]拒绝了我们的保护提议。政府必须决定是否以武力强行实施。"
 frw.76.a:0 "那他们会学会服从的。"
 frw.76.b:0 "不值得为此开战。"
 frw.80.t:0 "来自巴黎的秘密提议"
 frw.80.d:0 "法国政府在严格保密的情况下，提出将萨伏依和阿尔卑斯地区割让给瑞士联邦。作为交换，瑞士各银行将向法国工业敞开金库。此事现由伯尔尼的联邦委员会定夺。"
 frw.80.a:0 "接受——萨伏依和阿尔卑斯各州加入联邦。"
 frw.80.b:0 "瑞士不拿领土做交易。"
 frw.81.t:0 "来自日内瓦的船长"
 frw.81.d:0 "他抵达里昂火车站时，只带着一只手提箱和一把波兰军官的马刀。马洛·凯尔瓦德克生于日内瓦，父亲是来自圣马洛的布列塔尼船长，母亲是来自克拉科夫的波兰流亡者。他在日内瓦湖的码头边长大，听着母亲讲述一个早已从地图上消失的国度。1917年，他在法国加入了哈勒将军的蓝军；1920年，他在维斯瓦河畔亲历红军在华沙城下被击退。\n\n此后多年，他为苏黎世和日内瓦的私人银行效力，在动荡不安的欧洲各地转运黄金。如今他将这些黄金带到巴黎，坚信只有法国强大，波兰才能生存。"
 frw.81.a:0 "满帆前进。"
 frw.82.t:0 "阿尔卑斯交易达成"
 frw.82.d:0 "瑞士已经接受。萨伏依和阿尔卑斯地区已转归瑞士管辖，瑞士的黄金已开始流入法国工厂。"
 frw.82.a:0 "一笔好交易。"
 frw.83.t:0 "伯尔尼拒绝"
 frw.83.d:0 "联邦委员会拒绝了我们的提议。阿尔卑斯地区仍属法国，公众永远不会知道政府曾差一点将其拱手让人。"
 frw.83.a:0 "也许这样更好。"
 FRW_CORSAIR:0 "弗朗西亚王国"
 FRW_CORSAIR_DEF:0 "弗朗西亚王国"
 FRW_CORSAIR_ADJ:0 "弗朗西亚"
 FRW_corsair_cat:0 "弗朗西亚王国"
 FRW_corsair_cat_desc:0 "法国与伊比利亚半岛在圣马洛的私掠旗下统一，旗上绘有白鼬纹、骷髅与雄狮。任何在我们海岸登陆的侵略者都休想活着离开。"
 FRW_form_corsair_empire:0 "宣布成立弗朗西亚王国"
 FRW_form_corsair_empire_desc:0 "需要控制巴黎、马德里、布尔戈斯和里斯本，且战争支持度高于50 %。获得所有已拥有的西班牙和葡萄牙地区的核心领土，以及国家精神“私掠旗”（核心领土上的进攻和防御+30 %）。"
 frw.90.t:0 "干涉西班牙"
 frw.90.d:0 "西班牙已陷入内战，法军正在比利牛斯山沿线集结。政府现在必须决定法国将支持哪一方，又将协助粉碎哪一方。"
 frw.90.a:0 "为了共和国——粉碎国民军！"
 frw.90.b:0 "为了国民军——粉碎共和国！"
 frw.90.c:0 "为了合法政府——粉碎叛军！"
 frw.92.t:0 "法国要求合并"
 frw.92.d:0 "法军各师已沿我国整条边境部署，从加利西亚一直到安达卢西亚。巴黎要求葡萄牙并入法国——其照会坚称将以和平方式进行。里斯本总参谋部报告称，抵抗将毫无希望。"
 frw.92.a:0 "我们别无选择。葡萄牙并入法国。"
 frw.92.b:0 "葡萄牙将会抵抗！"
 frw.93.t:0 "里斯本拒绝"
 frw.93.d:0 "[From.GetNameDefCap]拒绝了合并。我军各师正在等待进军命令。"
 frw.93.a:0 "那我们就进军里斯本。"
 frw.93.b:0 "现在不行。"
 frw.95.t:0 "弗朗西亚王国"
 frw.95.d:0 "从英吉利海峡到直布罗陀，一面新的旗帜飘扬在各部大楼之上，旗上绘有法兰西的百合花与圣马洛的白鼬纹。法国与伊比利亚半岛已宣布合为一国——弗朗西亚王国。来自圣马洛的船长对他的军官们说，这仅仅是个开始。"
 frw.95.a:0 "西方的新强权。"
 frw.95.b:0 "蒙茹瓦，圣德尼！"
 FRW_leader_corsair:0 "马洛·凯尔瓦德克"
 FRW_leader_corsair_desc:0 "马洛·凯尔瓦德克生于日内瓦，父亲是来自圣马洛的布列塔尼船长，母亲是一名波兰流亡者。他曾在哈勒的蓝军中作战，为苏黎世的私人银行运送黄金，据传还曾在非洲沿海打着黑旗航行。他治理法国，就像私掠船长治理他的船：依据成文的条款，并让每个人都分得一份战利品。"
 frw.96.t:0 "法国索要设得兰"
 frw.96.d:0 "巴黎援引“古老同盟”及两国间的友好关系，请求国王陛下政府将设得兰群岛割让给法国，用作海军基地。"
 frw.96.a:0 "好吧——看在友谊的份上。"
 frw.96.b:0 "英国不会拱手让出自己的岛屿。"
 frw.97.t:0 "法国索要苏格兰高地"
 frw.97.d:0 "法国大使提议将苏格兰高地和阿伯丁郡置于法国管辖之下，用他的话说，这是为了纪念“古老同盟”。"
 frw.97.a:0 "如果这能让法国站在我们这边……"
 frw.97.b:0 "绝无可能。"
 frw.98.t:0 "伦敦说不"
 frw.98.d:0 "[From.GetNameDefCap]礼貌而坚定地拒绝了我们的请求。"
 frw.98.a:0 "也许等他们更喜欢我们的时候吧。"
 FRW_BURGUNDY:0 "勃艮第王国"
 FRW_BURGUNDY_DEF:0 "勃艮第王国"
 FRW_BURGUNDY_ADJ:0 "勃艮第"
 FRW_WESTUNION:0 "西方联盟"
 FRW_WESTUNION_DEF:0 "西方联盟"
 FRW_WESTUNION_ADJ:0 "西方联盟"
 FRW_burgundy_cat:0 "勃艮第遗产"
 FRW_burgundy_cat_desc:0 "十五世纪时，瓦卢瓦王朝的勃艮第公爵们领有从第戎到阿姆斯特丹的土地，那是欧洲最富庶的地区之一。如今法国已有能力将其重新统一。"
 FRW_form_burgundy:0 "重建勃艮第王国"
 FRW_form_burgundy_desc:0 "需要控制佛兰德斯、荷兰、卢森堡、瓦隆和勃艮第（非共产主义政府）。获得低地国家的核心领土及国家精神“勃艮第遗产”。"
 FRW_western_union_cat:0 "西方联盟"
 FRW_western_union_cat_desc:0 "法国与低地国家通过关税同盟与共同防御紧密相连。"
 FRW_form_western_union:0 "宣布成立西方联盟"
 FRW_form_western_union_desc:0 "需要民主政府、稳定度高于50 %，并控制佛兰德斯、荷兰、卢森堡和瓦隆。获得低地国家的核心领土及国家精神“西方联盟”。"
 frw.99.t:0 "勃艮第重生"
 frw.99.d:0 "自1477年大胆查理战死南锡以来，将近五个世纪过去了，莱茵河与索姆河之间的土地再次统一，这一次是在巴黎治下。勃艮第王国已宣告成立。"
 frw.99.a:0 "黄金时代归来。"
 frw.100.t:0 "西方联盟"
 frw.100.d:0 "法国与低地国家在布鲁塞尔签署了西方联盟条约。条约规定西欧各民主国家建立共同市场和一体化军队，并设立联合议会对二者进行监督。"
 frw.100.a:0 "新的开始。"
 FRW_ETERNAL:0 "永恒的弗朗西亚王国"
 FRW_ETERNAL_DEF:0 "永恒的弗朗西亚王国"
 FRW_ETERNAL_ADJ:0 "弗朗西亚"
 FRW_leader_admiral_king:0 "艾默里克·凯尔瓦德克"
 FRW_leader_admiral_king_desc:0 "艾默里克·凯尔瓦德克1894年生于日内瓦，在父亲的船上长大，往来于瑞士的银行与丹吉尔、但泽的港口之间。1920年，他成为新生的波兰海军的首批军官之一，在格丁尼亚外海的寒冷水域中学会了这门本领。后来，他指挥舰队将父亲的军队运往里斯本和利斯。他在兰斯加冕为艾默里克一世，人民称他为“海军上将国王”。与父亲不同，他更喜欢条约而非袭掠，并希望建立一个比他自己更长久的王朝。他在海上从未败过一仗。"
 FRW_admiral_king:0 "海军上将国王"
 frw.101.t:0 "永恒的弗朗西亚王国"
 frw.101.d:0 "在兰斯大教堂，已故的“黑色私掠者”之子、海军上将艾默里克·凯尔瓦德克加冕为法兰克国王艾默里克一世。法国及其征服的土地已在一面新的旗帜下宣布成为永恒的弗朗西亚王国，旗上绘有百合花、王室纹章和十字军十字。\n\n国王在首次演讲中承诺将完成父亲的事业。他说，法国必须强大到再也没有敌人能踏上她的土地，波兰也绝不能再被孤立无援地抛弃。"
 frw.101.a:0 "欧洲的新王冠。"
 frw.101.b:0 "为国王与祖国！"
 frw.84.t:0 "一封来自日内瓦的信"
 frw.84.d:0 "数月以来，爱丽舍宫一直保持沉默。随后，一封信送达，信纸厚重，带有日内瓦一家私人银行的水印，字迹古雅。\n\n“先生们，法国正在随波漂流，而没有船长的船终将触礁。我有船，也有黄金。我曾为一个被从地图上抹去的国家而战，深知失去祖国的代价。召唤我，我便会前来。\n\n船长 M.凯尔瓦德克”\n\n巴黎无人知晓这个名字。而在苏黎世，它却无人不知。\n\n§G新的决议已可用：争取凯尔瓦德克船长。§!"
 frw.84.a:0 "也许我们应该回复他。"
 frw.102.t:0 "黑色私掠者已死"
 frw.102.d:0 "马洛·凯尔瓦德克死于海上。在格丁尼亚外海一个风暴交加的夜晚，他的心脏在那艘为他运送了二十年黄金与军队的船上停止了跳动。据他的军官们报告，他的遗言是用波兰语说的。\n\n他的灵柩停放在圣马洛大教堂供人瞻仰，由法国海军陆战队员与专程从格丁尼亚赶来护送他归乡的波兰水兵共同守护。在加冕礼之前，将由摄政委员会治理法国。他的儿子、海军上将艾默里克·凯尔瓦德克正在前往兰斯的途中。"
 frw.102.a:0 "安息于大海吧，船长。"
 FRW_req_european_federation_tt:0 "§g需要控制§Y比利时§!、§Y荷兰§!和§Y卢森堡§!，以及§Y意大利§!或§Y德国§!（吞并或作为傀儡均可，另有说明者除外）。如果法国尚未控制它们，一旦控制，该国家将自动建立。§!"
 FRW_req_western_union_tt:0 "§g需要控制§Y比利时§!、§Y荷兰§!和§Y卢森堡§!（吞并或作为傀儡均可，另有说明者除外）。如果法国尚未控制它们，一旦控制，该国家将自动建立。§!"
 FRW_req_latin_empire_tt:0 "§g需要控制§Y意大利§!、§Y西班牙§!和§Y葡萄牙§!（吞并或作为傀儡均可，另有说明者除外）。如果法国尚未控制它们，一旦控制，该国家将自动建立。§!"
 FRW_req_eurafrica_tt:0 "§g需要控制法属北非（§Y阿尔及利亚§!、§Y摩洛哥§!和§Y突尼斯§!）——军事占领即可。如果法国尚未控制它们，一旦控制，该国家将自动建立。§!"
 FRW_req_francia_tt:0 "§g需要控制§Y莱茵兰§!、§Y摩泽尔兰§!、§Y比利时§!和§Y荷兰§!（吞并或作为傀儡均可，另有说明者除外）。如果法国尚未控制它们，一旦控制，该国家将自动建立。§!"
 FRW_req_burgundy_tt:0 "§g需要控制§Y比利时§!、§Y荷兰§!和§Y卢森堡§!全境（须吞并，不可为傀儡）。如果法国尚未控制它们，一旦控制，该国家将自动建立。§!"
 FRW_req_grand_empire_tt:0 "§g需要控制§Y莱茵河§!地区（莱茵兰、摩泽尔兰）、§Y皮埃蒙特§!、§Y比利时§!和§Y荷兰§!（吞并或作为傀儡均可，另有说明者除外）。如果法国尚未控制它们，一旦控制，该国家将自动建立。§!"
 FRW_plunder_cat_desc:0 "每一个已臣服于法国的国家，无论是作为附庸还是在投降之后，其中央银行里都存有黄金。来自圣马洛的船长打算将其收入囊中。"
 FRW_seize_the_treasury:0 "夺取[FROM.GetName]的国库"
 FRW_seize_the_treasury_desc:0 "[FROM.GetNameDef]的黄金储备正被装上法国船只。\n\n法国：§G+75§!政治点数、一座§G民用工厂§!，以及持续180天的§Y私掠者的黄金§!。\n[FROM.GetNameDefCap]：持续365天的§R遭劫掠的国库§!。每个国家每年只能被劫掠一次。"
 FRW_corsair_gold_desc:0 "缴获的黄金已存入王室国库。"
 FRW_plundered_treasury_desc:0 "法国私掠者劫走了我们的黄金储备。"
 FRW_saint_malo_shipyards_desc:0 "这座古老私掠港的船坞再次开始造船，速度之快为其历史上前所未有。"
 FRW_prize_economy_desc:0 "缴获战利品所得的资金被投入工厂和机床。"
 FRW_econ_dirigiste_2_desc:0 "计划现已覆盖每一个地区，规划者选在哪里，新工厂就建在哪里。"
 FRW_econ_dirigiste_3_desc:0 "经济已全面计划化，从煤炭价格到每座工厂的产量无不如此。"
 FRW_econ_liberal_1_desc:0 "私人资本与开放市场推动着法国工业。"
 FRW_econ_liberal_2_desc:0 "投资者和工程师竞相争夺合同，法国坐收其利。"
 FRW_econ_liberal_3_desc:0 "信贷低廉，法国企业的订单簿满满当当。"
 FRW_econ_rearmament_1_desc:0 "每一个多余的法郎都投入了兵工厂。"
 FRW_econ_rearmament_2_desc:0 "军火生产优先于其他一切工业部门。"
 FRW_econ_rearmament_3_desc:0 "法国已成为一座巨大的兵工厂。"
 FRW_colonial_integration_cat:0 "殖民地整合"
 FRW_colonial_integration_cat_desc:0 "在非洲占有领土本身并不能使其成为法国的一部分。这些决议将法国在非洲拥有的土地置于正式的殖民地行政管理之下，从而使每个地区提供更多的士兵和资源。只有自1848年起即属法国的§Y阿尔及利亚§!会成为§G核心领土§!；完成国策§Y阿尔及利亚就是法兰西§!后，各海外省也将随之成为核心领土。每当法国在某一区域获得更多土地时，即可再次使用这些决议。"
 FRW_integrate_maghreb:0 "整合法属北非"
 FRW_integrate_maghreb_desc:0 "摩洛哥、突尼斯和阿尔及利亚撒哈拉仿照阿尔及尔和奥兰的模式被组建为省。\n\n将法国在该区域拥有的所有地区置于§Y殖民地行政管理§!之下。§Y阿尔及利亚§!成为§G核心领土§!。"
 FRW_integrate_aof:0 "整合法属西非"
 FRW_integrate_aof_desc:0 "从达喀尔到尼亚美，法属西非开始施行法国民法，其居民成为公民。\n\n将法国在该区域拥有的所有地区置于§Y殖民地行政管理§!之下。"
 FRW_integrate_aef:0 "整合法属赤道非洲"
 FRW_integrate_aef_desc:0 "布拉柴维尔、利伯维尔、拉密堡和喀麦隆委任统治地被置于巴黎的直接管辖之下。\n\n将法国在该区域拥有的所有地区置于§Y殖民地行政管理§!之下。"
 FRW_integrate_indian_ocean:0 "整合印度洋领地"
 FRW_integrate_indian_ocean_desc:0 "马达加斯加、留尼汪、科摩罗和吉布提被并入海外法国。\n\n将法国在该区域拥有的所有地区置于§Y殖民地行政管理§!之下。"
 FRW_integrate_spanish:0 "整合前西班牙殖民地"
 FRW_integrate_spanish_desc:0 "里夫、伊夫尼、里奥德奥罗和里奥穆尼永久转归法国管辖。\n\n将法国在该区域拥有的所有地区置于§Y殖民地行政管理§!之下。"
 FRW_integrate_portuguese:0 "整合前葡萄牙殖民地"
 FRW_integrate_portuguese_desc:0 "前葡萄牙帝国的几内亚、安哥拉、莫桑比克以及大西洋诸岛被并入法国。\n\n将法国在该区域拥有的所有地区置于§Y殖民地行政管理§!之下。"
 FRW_integrate_congo:0 "整合刚果"
 FRW_integrate_congo_desc:0 "比属刚果连同卢旺达和布隆迪被并入法属赤道非洲。\n\n将法国在该区域拥有的所有地区置于§Y殖民地行政管理§!之下。"
 FRW_integrate_libya:0 "整合利比亚"
 FRW_integrate_libya_desc:0 "的黎波里塔尼亚、昔兰尼加和费赞如今为法国在突尼斯与乍得之间建立起一条连续的通道。\n\n将法国在该区域拥有的所有地区置于§Y殖民地行政管理§!之下。"
 FRW_integrate_british_west:0 "整合英属西非"
 FRW_integrate_british_west_desc:0 "冈比亚、塞拉利昂和尼日利亚被并入法属西非。\n\n将法国在该区域拥有的所有地区置于§Y殖民地行政管理§!之下。"
 FRW_integrate_african_territories:0 "海外省"
 FRW_integrate_african_territories_desc:0 "阿尔及利亚、安的列斯、圭亚那和留尼汪成为与本土无异的法国省份。非洲其余地区则被置于殖民地行政管理之下。"
 RULE_FRW_FRANCE_AI:0 "法国（France Rework）"
 RULE_FRW_FRANCE_AI_HISTORICAL:0 "历史"
 RULE_FRW_FRANCE_AI_HISTORICAL_DESC:0 "法国保持民主制度，通常由人民阵线执政。推荐。"
 RULE_FRW_FRANCE_AI_DEMOCRATIC:0 "民主主义"
 RULE_FRW_FRANCE_AI_DEMOCRATIC_DESC:0 "法国走民主路线之一（布鲁姆或雷诺/戴高乐）。"
 RULE_FRW_FRANCE_AI_COMMUNIST:0 "共产主义"
 RULE_FRW_FRANCE_AI_COMMUNIST_DESC:0 "法国走共产主义路线之一（多列士或皮韦尔）。"
 RULE_FRW_FRANCE_AI_FASCIST:0 "法西斯主义"
 RULE_FRW_FRANCE_AI_FASCIST_DESC:0 "法国走法西斯路线之一（拉罗克或多里奥）。"
 RULE_FRW_FRANCE_AI_NONALIGNED:0 "不结盟"
 RULE_FRW_FRANCE_AI_NONALIGNED_DESC:0 "法国走不结盟路线之一（贝当、奥尔良派或波拿巴家族）。"
 RULE_FRW_FRANCE_AI_RANDOM:0 "随机"
 RULE_FRW_FRANCE_AI_RANDOM_DESC:0 "AI将以相同概率选择四种意识形态之一。"
 FRW_shortcut_democratic:0 "民主主义路线"
 FRW_shortcut_communist:0 "共产主义路线"
 FRW_shortcut_fascist:0 "法西斯主义路线"
 FRW_shortcut_nonaligned:0 "不结盟路线"
 FRW_shortcut_secret:0 "秘密路线"
 FRW_shortcut_economy:0 "经济"
 FRW_shortcut_military:0 "军事"
 FRW_shortcut_diplomacy:0 "外交"
 FRW_shortcut_colonies:0 "殖民帝国"
 FRW_plunder_cat:0 "战利品"
 FRW_econ_dirigiste_1_desc:0 "国家制定投资计划，并指导各主要工业。"
 FRW_union_francaise_formed_desc:0 "从达喀尔到西贡的各殖民地现已成为统一的法兰西联盟的成员。"
 FRW_european_federation_desc:0 "一个在法国领导下的联邦制欧洲，拥有统一市场和共同议会。"
 FRW_western_union_idea_desc:0 "西欧各民主国家共享共同市场和联合军队。"
 FRW_latin_empire_idea_desc:0 "我们的海。拉丁诸国海军掌控着地中海。"
 FRW_eurafrican_federation_idea_desc:0 "欧洲与非洲构成一个由巴黎主导的统一经济区。"
 FRW_francia_idea_desc:0 "作为查理曼的继承者，国王统治着从比利牛斯山到莱茵河的土地。"
 FRW_burgundy_idea_desc:0 "昔日勃艮第国家的富庶省份再次统一。"
 FRW_grand_empire_idea_desc:0 "拿破仑的欧洲已经重建，大军团再次踏上征途。"
 FRW_franco_british_union_spirit_desc:0 "法国和英国已将两大帝国合并为一个联盟。"
 FRW_drapeau_noir_desc:0 "在私掠者的黑旗下，我们的士兵捍卫着本土的每一寸土地。"
 FRW_eternal_kingdom_spirit_desc:0 "王冠已经恢复，而戴上它的国王在海上从未败过一仗。"
 FRW_decolonisation_cat:0 "反殖民革命"
 FRW_decolonisation_cat_desc:0 "工人共和国不能以武力统治其他民族。每一个获得解放的殖民地都将成为社会主义盟友，并提升公社在世界各地殖民地人民中的声望。\n\n每解放一处，§Y兄弟民族§!便提升一级（最多三级）。"
 FRW_free_north_africa:0 "解放北非"
 FRW_free_north_africa_desc:0 "摩洛哥、突尼斯和阿尔及利亚成为与法兰西公社结盟的独立社会主义共和国。\n\n将其释放为§Y共产主义卫星国§!（仅限法国拥有其土地者），并加强§Y兄弟民族§!。"
 FRW_free_west_africa:0 "解放西非"
 FRW_free_west_africa_desc:0 "从塞内加尔到尼日尔的法属西非领土以及多哥委任统治地选举各自的议会，并脱离帝国。\n\n将其释放为§Y共产主义卫星国§!（仅限法国拥有其土地者），并加强§Y兄弟民族§!。"
 FRW_free_equatorial_africa:0 "解放赤道非洲"
 FRW_free_equatorial_africa_desc:0 "乍得、喀麦隆、加蓬、中刚果和乌班吉沙里被宣布为自由共和国。\n\n将其释放为§Y共产主义卫星国§!（仅限法国拥有其土地者），并加强§Y兄弟民族§!。"
 FRW_free_indian_ocean:0 "解放马达加斯加和吉布提"
 FRW_free_indian_ocean_desc:0 "马达加斯加和吉布提海岸交由其本国人民掌管。\n\n将其释放为§Y共产主义卫星国§!（仅限法国拥有其土地者），并加强§Y兄弟民族§!。"
 FRW_free_indochina:0 "解放印度支那"
 FRW_free_indochina_desc:0 "在法国的支持下，印度支那共产党人在河内、金边和万象夺取政权。\n\n将其释放为§Y共产主义卫星国§!（仅限法国拥有其土地者），并加强§Y兄弟民族§!。"
 FRW_free_levant:0 "解放黎凡特"
 FRW_free_levant_desc:0 "叙利亚和黎巴嫩委任统治宣告结束，大马士革和贝鲁特如今实行自治。\n\n将其释放为§Y共产主义卫星国§!（仅限法国拥有其土地者），并加强§Y兄弟民族§!。"
 FRW_european_community_faction:0 "欧洲共同体"
 FRW_neutral_bloc_faction:0 "拉丁中立集团"
 frw.120.t:0 "法国提议建立中立集团"
 frw.120.d:0 "元帅的特使从巴黎带来了一项提议。他说，拉丁诸国应当团结一致，置身于柏林、伦敦和莫斯科之间即将爆发的战争之外。法国提供共同防御，除此之外别无所求。"
 frw.120.a:0 "我们接受。"
 frw.120.b:0 "我们宁愿独善其身。"
 frw.121.t:0 "欧洲联邦"
 frw.121.d:0 "巴黎请求欧洲共同体各成员国迈出最后一步，建立拥有统一军队和货币的联邦政府。我们的部长们将在巴黎任职，我们的旗帜将与其他旗帜一同悬挂在联邦议会中。"
 frw.121.a:0 "我们加入联邦。"
 frw.121.b:0 "我们保留主权。"
 FRW_imperial_redoubt_desc:0 "如果法国本土沦陷，政府将在北非继续战争。"
 FRW_imperial_redoubt_2_desc:0 "每个殖民地都已设防，其驻军已进入戒备状态。"
 FRW_marshals_france_desc:0 "国内纪律严明，和平有坚固的边防作后盾。"
 FRW_continental_empire_spirit_desc:0 "帝国从大西洋延伸到维斯瓦河和尼罗河。"
 FRW_free_france_spirit_desc:0 "在巴黎解放之前，政府将在殖民地继续战争。"
 FRW_brazzaville_spirit_desc:0 "在布拉柴维尔，各殖民地获得承诺：战争结束后，它们将在法兰西共同体中获得新的地位。"
 FRW_liberation_spirit_desc:0 "巴黎已经解放，政府已重返首都。"
 FRW_european_partner_desc:0 "加入欧洲共同体为法国企业和科学家打开了外国的市场与实验室。"
 FRW_european_market_desc:0 "商品现已在共同体各成员国之间自由流通。"
 FRW_fraternal_peoples_desc:0 "获得解放的殖民地与公社站在一起。"
 FRW_fraternal_peoples_2_desc:0 "获得解放的殖民地与公社站在一起。"
 FRW_fraternal_peoples_3_desc:0 "获得解放的殖民地与公社站在一起。"
 FRW_diplomatic_overture:0 "法国的外交示好"
 FRW_royal_ties:0 "与法国王室的纽带"
 FRW_fascist_friendship:0 "法西斯友谊"
 FRW_lend_lease_spirit_desc:0 "美国装备经由英国运抵自由法国军。"
 FRW_resistance_spirit_desc:0 "被占领法国境内的抵抗网络向伦敦汇报。"
 FRW_provisional_government_spirit_desc:0 "共和国在流亡中延续，并为回归做准备。"
 FRW_fight_on_spirit_desc:0 "停战协定不被承认。每一名自由法国军士兵都在战斗，仿佛法国的命运全系于他一人之身。"
 FRW_oath_of_kufra_desc:0 "在库夫拉，勒克莱尔的部下发誓，在国旗飘扬于斯特拉斯堡上空之前绝不放下武器。"
 FRW_liberation_cat:0 "解放战争"
 FRW_liberation_cat_desc:0 "一旦自由法国军控制了本国的主要地区，便可以向占领者提出以当前战线为界实现和平，或者继续为夺回其余领土而战。"
 FRW_liberation_metropole:0 "提出和平：法国本土"
 FRW_liberation_metropole_desc:0 "需要控制§Y巴黎§!、§Y加来海峡§!、§Y阿尔萨斯-洛林§!、§Y阿基坦§!和§Y马赛§!。"
 FRW_liberation_africa:0 "提出和平：北非"
 FRW_liberation_africa_desc:0 "需要控制§Y阿尔及利亚§!、§Y突尼斯§!和§Y摩洛哥§!。"
 frw.130.t:0 "占领者请求议和"
 frw.130.d:0 "随着法国腹地重新飘扬起三色旗，敌方使节来到了我军司令部。他们提议以当前战线为界停战。我们的将领们认为，其余国土也可以拿下，但要付出代价。"
 frw.130.a:0 "签署和约。"
 frw.130.a.tt:0 "法国控制的每一个§Y法国核心地区§!重新归属法国。\n与每一个曾拥有其中某个地区的敌国实现§Y白色和平§!。如果法国控制§Y巴黎§!，首都将迁回该地。"
 frw.130.b:0 "继续战斗，直到法国获得自由。"
 frw.130.b.tt:0 "战争继续。获得§Y我们将继续战斗§!，持续180天（如尚未生效）。90天后可再次提出该提议。"
 FRW_latin_destiny_spirit_desc:0 "科西嘉、撒丁岛和普罗旺斯海岸为法国守卫着西地中海。"
 FRW_leader_alfonso_desc:0 "波旁的阿方索于1931年4月离开马德里，但并未退位。作为路易十四的男系长支继承人，在法国正统派眼中，他就是法兰西和纳瓦拉国王阿方斯一世。"
 FRW_legitimist_party:0 "正统派"
 FRW_legitimist_party_long:0 "保王正统派联盟"
 FRW_bourbon_pact_faction:0 "波旁家族盟约"
 FRW_BOURBON:0 "法兰西-西班牙王国"
 FRW_BOURBON_DEF:0 "法兰西-西班牙王国"
 FRW_BOURBON_ADJ:0 "法兰西-西班牙"
 FRW_legitimist_crown_desc:0 "波旁长支自1830年以来首次统治法国。"
 FRW_legitimist_crown_2_desc:0 "教会与王权在两个王国中相互扶持。"
 FRW_two_crowns_spirit_desc:0 "法国与西班牙共享一位国王、一套舰队计划以及各自的兵工厂。"
 FRW_bourbon_partner_desc:0 "西班牙从与法国波旁国王的同盟中获益。"
 FRW_grand_siecle_desc:0 "一位波旁君主统治着从英吉利海峡到直布罗陀的土地，一如太阳王的时代。"
 FRW_double_monarchy_idea_desc:0 "法国与西班牙在一位波旁国王治下合为一个王国。"
 FRW_req_bourbon_tt:0 "§g需要控制§Y马德里§!（吞并或作为傀儡均可）。如果法国尚未控制它，一旦控制，该王国将自动建立。§!"
 frw.140.t:0 "法国国王宣称拥有西班牙"
 frw.140.d:0 "巴黎的波旁国王提醒马德里，他从未放弃西班牙王位。他要求西班牙重新承认他为国王。接受将使西班牙置于法国的保护之下；拒绝则可能意味着战争。"
 frw.140.a:0 "国王万岁。"
 frw.140.b:0 "西班牙不会接受巴黎的统治。"
 frw.141.t:0 "巴黎的波旁国王"
 frw.141.d:0 "正统派已宣布流亡的西班牙国王波旁的阿方索为法国国王。奥尔良派王位觊觎者从布鲁塞尔提出抗议，而在马德里，共和政府正忧心忡忡地注视着局势。"
 frw.141.a:0 "两个王位，一位国王？"
 frw.142.t:0 "法兰西与西班牙王冠合一"
 frw.142.d:0 "在《乌得勒支和约》明令禁止两个多世纪之后，法国与西班牙已在同一位波旁国王治下合为一体。新王国从敦刻尔克一直延伸到加的斯。"
 frw.142.a:0 "比利牛斯山已不复存在。"
 frw.143.t:0 "西班牙接受国王"
 frw.143.d:0 "马德里已承认我们的国王为西班牙国王，并将该国置于法国的保护之下。"
 frw.143.a:0 "国王万岁！吾王万岁！"
 frw.144.t:0 "西班牙拒绝国王"
 frw.144.d:0 "马德里拒绝了我们国王的主张。军队已在比利牛斯山严阵以待。"
 frw.144.a:0 "那我们就去夺取它。"
 FRW_disjointed_2_desc:0 "内阁走马灯已经停止，但部长们仍彼此猜忌，行政机构执行起来依旧迟缓。"
 FRW_disjointed_3_desc:0 "政府已站稳脚跟。仅余少许旧日争端。"
 FRW_victors_2_desc:0 "军队已开始质疑1918年的教条，但旧习难改。"
 FRW_dec_consolidate_government:0 "巩固政府"
 FRW_dec_consolidate_government_desc:0 "清除各部中相互倾轧的派系，并使内阁获得稳固的多数。\n\n自§Y1937年§!起可用，须在改革开始至少§Y6个月§!后，且稳定度达到§Y40%§!：§Y脆弱的政府§!将变为§Y趋于稳定的政府§!。"
 FRW_dec_stable_government:0 "稳定的政府"
 FRW_dec_stable_government_desc:0 "各部毫不拖延地执行内阁法令。\n\n自§Y1938年§!起可用，须在上一步骤至少§Y6个月§!后，且稳定度达到§Y50%§!：移除§Y趋于稳定的政府§!。"
 FRW_dec_backer_blum:0 "争取莱昂·布鲁姆"
 FRW_dec_backer_blum_desc:0 "与莱昂·布鲁姆、工人国际法国支部（SFIO）及人民阵线的会谈大约需要六周。该阵营每次只能争取一位领导人。\n\n需要该党派支持率达到§Y45%§!且稳定度达到§Y30%§!。之后即可在国策树中选择莱昂·布鲁姆路线。"
 FRW_dec_backer_reynaud:0 "争取保罗·雷诺"
 FRW_dec_backer_reynaud_desc:0 "与保罗·雷诺、民主联盟及中右翼的会谈大约需要六周。该阵营每次只能争取一位领导人。\n\n需要该党派支持率达到§Y45%§!且稳定度达到§Y30%§!。之后即可在国策树中选择保罗·雷诺路线。"
 FRW_dec_backer_thorez:0 "争取莫里斯·多列士"
 FRW_dec_backer_thorez_desc:0 "与莫里斯·多列士、法国共产党（PCF）及其莫斯科路线的会谈大约需要六周。该阵营每次只能争取一位领导人。\n\n需要该党派支持率达到§Y35%§!且稳定度达到§Y30%§!。之后即可在国策树中选择莫里斯·多列士路线。"
 FRW_dec_backer_pivert:0 "争取马索·皮韦尔"
 FRW_dec_backer_pivert_desc:0 "与马索·皮韦尔及革命左派的会谈大约需要六周。该阵营每次只能争取一位领导人。\n\n需要该党派支持率达到§Y35%§!且稳定度达到§Y30%§!。之后即可在国策树中选择马索·皮韦尔路线。"
 FRW_dec_backer_larocque:0 "争取弗朗索瓦·德·拉罗克"
 FRW_dec_backer_larocque_desc:0 "与弗朗索瓦·德·拉罗克、火十字团及法兰西社会党（PSF）的会谈大约需要六周。该阵营每次只能争取一位领导人。\n\n需要该党派支持率达到§Y35%§!且稳定度达到§Y30%§!。之后即可在国策树中选择弗朗索瓦·德·拉罗克路线。"
 FRW_dec_backer_doriot:0 "争取雅克·多里奥"
 FRW_dec_backer_doriot_desc:0 "与雅克·多里奥及法兰西人民党（PPF）的会谈大约需要六周。该阵营每次只能争取一位领导人。\n\n需要该党派支持率达到§Y35%§!且稳定度达到§Y30%§!。之后即可在国策树中选择雅克·多里奥路线。"
 FRW_dec_backer_petain:0 "争取贝当元帅"
 FRW_dec_backer_petain_desc:0 "与贝当元帅、退伍军人及军队的会谈大约需要六周。该阵营每次只能争取一位领导人。\n\n需要该党派支持率达到§Y35%§!且稳定度达到§Y30%§!。之后即可在国策树中选择贝当元帅路线。"
 FRW_dec_backer_orleans:0 "争取巴黎伯爵"
 FRW_dec_backer_orleans_desc:0 "与巴黎伯爵、奥尔良派及法兰西行动的会谈大约需要六周。该阵营每次只能争取一位领导人。\n\n需要该党派支持率达到§Y35%§!且稳定度达到§Y30%§!。之后即可在国策树中选择巴黎伯爵路线。"
 FRW_dec_backer_bonaparte:0 "争取路易·拿破仑亲王"
 FRW_dec_backer_bonaparte_desc:0 "与路易·拿破仑亲王及波拿巴派委员会的会谈大约需要六周。该阵营每次只能争取一位领导人。\n\n需要该党派支持率达到§Y35%§!且稳定度达到§Y30%§!。之后即可在国策树中选择路易·拿破仑亲王路线。"
 FRW_dec_backer_legit:0 "争取波旁的阿方索"
