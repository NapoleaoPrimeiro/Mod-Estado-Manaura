 FRW_european_research_name:0 "欧洲防务研究委员会"
 FRW_european_research_desc:0 "欧洲各伙伴国的实验室和参谋部通过设在巴黎的一个共同委员会分享成果。"
 FRW_latin_research_name:0 "拉丁科学委员会"
 FRW_latin_research_desc:0 "拉丁各国的大学和兵工厂相互交流工程师、专利与成果。"
 FRW_join_european_research_tt:0 "法国及其阵营伙伴加入§Y欧洲防务研究委员会§!（科技共享）。"
 FRW_join_latin_research_tt:0 "法国及其阵营伙伴加入§Y拉丁科学委员会§!（科技共享）。"
 FRW_trait_army_of_africa:0 "非洲军团"
 FRW_trait_army_of_africa_desc:0 "在撒哈拉和里夫的多年经历教会了他如何在远离铁路的地方维持军队补给。"
 FRW_trait_ecole_de_guerre:0 "高等军事学院教授"
 FRW_trait_ecole_de_guerre_desc:0 "他教会了一代参谋军官如何筹划一场按部就班的战役。"
 FRW_trait_armoured_pioneer:0 "装甲师先驱"
 FRW_trait_armoured_pioneer_desc:0 "早在总参谋部有意之前，他就力主组建一支法国装甲师。"
 FRW_trait_alpine_school:0 "阿尔卑斯山地战学校"
 FRW_trait_alpine_school_desc:0 "他曾在阿尔卑斯山的冰川和北方的峡湾中训练他的山地猎兵。"
 frw_war.1.t:0 "敌军进入巴黎"
 frw_war.1.d:0 "今天早晨，[ROOT.GetAdjective]军队的纵队沿香榭丽舍大街行进。政府此前已撤离首都，巴黎被宣布为不设防城市，以免遭到破坏。很少有巴黎人观看这场游行，大多数人紧闭着百叶窗。"
 frw_war.1.a:0 "法兰西输掉了一场战斗，但并没有输掉这场战争。"
 frw_war.1.b:0 "巴黎是我们的了！"
 frw_war.1.c:0 "光明之城陷入黑暗。"
 frw_war.2.t:0 "巴黎解放"
 frw_war.2.d:0 "法国军队开进巴黎之际，巴黎圣母院的钟声响彻全城。经历了漫长的占领之后，从奥尔良门到市政厅，街道上挤满了人群。"
 frw_war.2.a:0 "巴黎被凌辱！巴黎被摧残！但巴黎解放了！"
 frw_war.2.b:0 "法兰西万岁！"
 RULE_FRW_SECRET_PATHS:0 "France Rework：秘密路线"
 RULE_FRW_SECRET_PATHS_ENABLED:0 "启用"
 RULE_FRW_SECRET_PATHS_ENABLED_DESC:0 "法国可以解锁秘密路线：在“休会两院”之后等待，可解锁来自圣马洛的私掠船长（他的舰队、海岛袭击以及伊比利亚王国）；让工厂保持占领状态，可解锁法国总工会（CGT）的革命工团主义者；倾听马塞尔·德亚的新社会主义者，则可解锁其路线。"
 RULE_FRW_SECRET_PATHS_DISABLED:0 "禁用（推荐用于竞技多人游戏）"
 RULE_FRW_SECRET_PATHS_DISABLED_DESC:0 "解锁秘密路线的决议将永远不会出现：没有船长，没有CGT路线，也没有德亚路线。只能选择常规政治路线。"
 FRW_leader_deat:0 "马塞尔·德亚"
 FRW_leader_deat_desc:0 "马塞尔·德亚毕业于巴黎高等师范学校，是一名参战老兵，曾被视为布鲁姆的接班人。1933年，他与工人国际法国支部（SFIO）决裂，创建了新社会主义派。他们主张计划经济、强大的国家，以及几乎不惜任何代价的和平。"
 FRW_leader_deat_fascist_desc:0 "马塞尔·德亚已与议会民主决裂。他的全国人民联盟希望建立单一政党、一个社团主义的劳工阵线，以及一个社会主义的、民族的欧洲。"
 FRW_leader_besnard:0 "皮埃尔·贝纳尔"
 FRW_leader_besnard_desc:0 "皮埃尔·贝纳尔是来自安茹的铁路工人，曾领导革命工团主义总工会（CGT-SR）的革命工团主义者，并担任国际工人协会书记。他坚持认为，应由工会而非政党来管理新社会。"
 FRW_SYNDIC:0 "工团主义法国"
 FRW_SYNDIC_DEF:0 "工团主义法国"
 FRW_SYNDIC_ADJ:0 "工团主义"
 FRW_new_europe_faction:0 "欧洲新秩序"
 FRW_backer_deat_req:0 "已赢得§Y马塞尔·德亚§!的支持"
 FRW_backer_besnard_req:0 "已赢得§Y皮埃尔·贝纳尔§!的支持"
 FRW_dec_hear_the_neos:0 "倾听新社会主义者"
 FRW_dec_hear_the_neos_desc:0 "马塞尔·德亚和被开除出SFIO的新社会主义者在瓦格拉姆大厅举行集会。派人去听一听花不了多少代价，而且他们对国家有一些议会中其他人都不敢公开表达的想法。"
 FRW_dec_backer_deat:0 "争取马塞尔·德亚"
 FRW_dec_backer_deat_desc:0 "与马塞尔·德亚及新社会主义者的谈判约需六周。同一时间只能拉拢该阵营的一位领袖。\n\n需要该党支持度达到§Y45%§!，稳定度达到§Y30%§!。之后，国策树中将开启一条隐藏路线，取代布鲁姆和雷诺的路线。"
 FRW_dec_occupy_factories:0 "继续占领工厂"
 FRW_dec_occupy_factories_desc:0 "罢工者拒绝离开。工厂大门上悬挂着红旗，工会基层组织管理着食堂和夜间值守。占领每持续一个月，法国总工会（CGT）就愈发大胆。"
 FRW_dec_backer_besnard:0 "争取皮埃尔·贝纳尔"
 FRW_dec_backer_besnard_desc:0 "与皮埃尔·贝纳尔及革命工团主义者的谈判约需六周。同一时间只能拉拢该阵营的一位领袖。\n\n需要该党支持度达到§Y35%§!，稳定度达到§Y30%§!。之后，国策树中将开启一条隐藏路线，取代多列士和皮韦尔的路线。"
 frw_sp.1.t:0 "亚眠宪章"
 frw_sp.1.d:0 "三个月过去了，工厂仍处于占领之中。一个革命工团主义者代表团来到部里，带来一份1906年《亚眠宪章》，其中一句话被划了线：工会今天是抵抗的组织，明天将成为生产与分配的组织。\n\n他们的发言人是一位名叫皮埃尔·贝纳尔的铁路工人，说话直截了当。“工人们不需要市政厅里再来一位新主子，不管他是红色的还是别的颜色。他们需要的是自己的工会。把工厂交给在里面劳动的人，法兰西自己就能运转。”\n\n§G新的决议已可用：争取皮埃尔·贝纳尔。§!"
 frw_sp.1.a:0 "让工会发声。"
 frw_sp.2.t:0 "秩序、权威、民族"
 frw_sp.2.d:0 "瓦格拉姆大厅座无虚席。讲台上，马塞尔·德亚重申了那句让新社会主义者失去SFIO席位的口号：社会主义只有接过秩序、权威和民族的旗帜，不再将它们拱手让给右翼联盟，才能取得胜利。\n\n会后，他接见了我们的特使。“布鲁姆想等待革命，右派则什么都不想等。我提出的是一项计划，以及一个强大到足以将其付诸实施的国家。请转告政府，新社会主义者随时准备效力。”\n\n§G新的决议已可用：争取马塞尔·德亚。§!"
 frw_sp.2.a:0 "共和国需要一只强有力的手。"
 frw_sp.3.t:0 "德亚建立单一政党"
 frw_sp.3.d:0 "在巴黎，马塞尔·德亚关闭了议会，并宣布全国人民联盟为法国唯一合法政党。昔日的社会主义者与右翼联盟的老兵并肩行进，高呼民族与人民革命的口号。德亚谈论着一个新欧洲，而其他国家的首都都在猜测，他究竟打算把它引向何方。"
 frw_sp.3.a:0 "又一个社会主义者变成了独裁者。"
 frw_sp.3.b:0 "非左非右：唯有法兰西！"
 FRW_black_flag_desc:0 "海岸兄弟会的章程：人人都有一份战利品，每位船长都有一票表决权，对抵抗的商船绝不留情。"
 FRW_black_flag_2_desc:0 "袭击舰与潜艇在欧洲的每一条航道上猎杀。"
 FRW_black_flag_3_desc:0 "黑旗在旗舰的主桅上飘扬。船长的舰队绝不留情，以缴获的战利品充当军饷。"
 FRW_boarders_desc:0 "受过奇袭夺取船只或港口训练的海军陆战队。"
 FRW_free_port_desc:0 "圣马洛是一座自由港。没有海关官员登船检查，但每艘船都要缴纳一笔费用。"
 FRW_island_bases_desc:0 "从巴利阿里群岛到塞舌尔，一连串海岛港口为船长的舰队和登陆部队提供补给。"
 FRW_pirate_captain:0 "私掠船长"
 FRW_pirate_captain_desc:0 "他曾在三面旗帜下作战，无论在哪面旗下，都未曾输掉过一场海战。"
 FRW_pirate_legoff:0 "扬·勒高夫"
 FRW_pirate_morvan:0 "科朗坦·莫尔旺"
 FRW_pirate_duroc:0 "阿纳托尔·迪罗克"
 FRW_franc_below_40_tt:0 "通货膨胀低于§Y40%§!"
 FRW_strong_franc_desc:0 "信贷廉价，法郎再度赢得信任。全国各地的工地纷纷复工。"
 FRW_war_finance_desc:0 "战争贷款、税收和价格管制为战争提供资金。"
 FRW_colonial_administration:0 "殖民地行政管理"
 FRW_colonial_administration_tt:0 "法国拥有的该地区每个省份（无核心且尚未纳入管理）获得§Y殖民地行政管理§!：可征召人力增加，资源§G+15%§!。"
 FRW_colonial_administration_all_tt:0 "§Y阿尔及利亚§!、§Y安的列斯§!、§Y法属圭亚那§!和§Y留尼汪§!成为§G核心领土§!（海外省）。\n法国在§Y非洲§!拥有的其他每个省份获得§Y殖民地行政管理§!：可征召人力增加，资源§G+15%§!。"
 FRW_free_caribbean:0 "解放安的列斯和圭亚那"
 FRW_free_caribbean_desc:0 "加勒比海的种植园岛屿和圭亚那的流放地被交还给当地人民。\n\n将其释放为§Y共产主义附庸国§!（仅限法国控制其领土之处），并强化§Y兄弟民族§!。"
 FRW_dec_renew_federal_offer:0 "重申联邦提议"
 FRW_dec_renew_federal_offer_desc:0 "巴黎第一次提出邀请时，并非每个政府都已做好准备。一个新的联邦主义者代表团带着同样的提议巡访欧洲各国首都：一支军队、一种货币、一个联邦议会。"
 FRW_dec_renew_federal_offer_tt:0 "法国阵营中或受法国保障的每个欧洲民主小国，将再次被邀请加入§Y欧洲联邦§!。"
 FRW_continental_system_faction:0 "大陆体系"
 FRW_rhine_held_desc:0 "当德国营队开进莱茵兰时，法国进行了动员，柏林随即撤回了部队。自1918年以来，这个国家从未如此自信过。"
 frw_fb3.1.t:0 "坚守莱茵河"
 frw_fb3.1.d:0 "越过边界进入非军事区的德军纵队正经由莱茵河上的桥梁撤回。希特勒先眨了眼。巴黎的报纸称之为凡尔赛以来的第一场胜利，投票赞成动员的议员们在波旁宫外受到欢呼。"
 frw_fb3.1.a:0 "法兰西仍在莱茵河畔守望。"
 FRW_dec_invite_trotsky:0 "向列夫·托洛茨基提供庇护"
 FRW_dec_invite_trotsky_desc:0 "托洛茨基曾在法国居住，直到1935年共和国为讨好莫斯科将其驱逐出境。一个工人的法国可以把这位红军的缔造者请回来，尽管斯大林绝不会原谅此举。"
 FRW_dec_invite_trotsky_tt:0 "§Y列夫·托洛茨基§!来到法国，可被任命为§Y政治顾问§!。"
 frw_fb3.2.t:0 "托洛茨基在巴黎"
 frw_fb3.2.d:0 "在被斯大林逐出苏联十年之后，列夫·托洛茨基在里昂火车站走下了列车。他希望讲学、写作，并协助组建我们的军队。莫斯科已召回其大使进行磋商。"
 frw_fb3.2.a:0 "欢迎你，同志。"
 frw_fb3.2.a.tt:0 "§Y列夫·托洛茨基§!可被任命为§Y政治顾问§!。\n若领袖为§Y马索·皮韦尔§!：稳定度和共产主义支持度§G+3%§!。\n若领袖为§Y莫里斯·多列士§!：稳定度§R-5%§!。\n共产主义的§Y苏联§!将感到不满（好感度§R-40§!）。"
 FRW_adv_trotsky:0 "列夫·托洛茨基"
 FRW_trait_trotsky:0 "红军缔造者"
