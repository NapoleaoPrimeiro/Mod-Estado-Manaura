 FRW_dec_franc_rates:0 "提高贴现率"
 FRW_dec_franc_rates_desc:0 "法兰西银行提高利率。资金变得昂贵，物价趋于稳定，工地上的活计也随之冷清下来。"
 FRW_dec_franc_bonds:0 "发行国防债券"
 FRW_dec_franc_bonds_desc:0 "储户将法郎借给国家，而不是花掉。每座邮局的墙上都贴满了爱国海报。"
 FRW_dec_franc_controls:0 "物价与工资管制"
 FRW_dec_franc_controls_desc:0 "物价和工资通过法令冻结。商店抱怨，工会也抱怨，但法郎稳住了。"
 FRW_dec_franc_gold:0 "出售储备黄金"
 FRW_dec_franc_gold_desc:0 "法兰西银行金库中的部分黄金被出售到国外，用以回购法郎。"
 FRW_dec_franc_reserves:0 "重建黄金储备"
 FRW_dec_franc_reserves_desc:0 "法兰西银行用新发行的法郎在伦敦市场上购买黄金。金库重新充实起来，但货币供应量也随之增加。"
 FRW_dec_franc_exchange:0 "外汇管制"
 FRW_dec_franc_exchange_desc:0 "未经许可，法郎不得再流出国境。资本外逃在边境止步，大量贸易也随之停滞。"
 FRW_dec_franc_contracts:0 "海外军火合同"
 FRW_dec_franc_contracts_desc:0 "黄金能买到法国工厂无法及时交付的东西：美国的航空发动机、机床乃至整架飞机，全部现金支付。"
 FRW_dec_franc_austerity:0 "紧缩预算"
 FRW_dec_franc_austerity_desc:0 "法令削减了公务员的薪水和老兵的抚恤金。预算实现了平衡，却引起了普遍不满。"
 FRW_dec_franc_cfa:0 "殖民地法郎区"
 FRW_dec_franc_cfa_desc:0 "各殖民地获得了自己的法郎，与巴黎的法郎挂钩。货币所承受的部分压力被转嫁到了非洲。"
 FRW_dec_franc_print:0 "印钞重整军备"
 FRW_dec_franc_print_desc:0 "法兰西银行的印钞机日夜运转。工厂立即拿到了货款，而通货膨胀会在日后送来账单。"
 FRW_dec_franc_tripartite:0 "三方货币协定"
 FRW_dec_franc_tripartite_desc:0 "伦敦和华盛顿同意与巴黎共同维持贬值后法郎的稳定。金本位集团就此终结。"
 FRW_franc_cat:0 "法郎"
 FRW_franc_cat_desc:0 "通货膨胀：§Y[?FRW_inflation|0]%§!（每月§Y[?FRW_inf_trend|2]§!点）。法兰西银行黄金储备：§Y[?FRW_gold|0]吨§!（每月[?FRW_gold_trend|+0]吨）。\n\n低于20%时，稳健的法郎可加快建造速度。高于20%时，通货膨胀会提高消费品占比、降低稳定度并减缓建造速度。达到100%时，消费品§R+12%§!，稳定度§R-12%§!，建造速度§R-8%§!。\n黄金储备：高于§Y2000吨§!时可稳定法郎，低于§Y1000吨§!时会削弱法郎，低于§Y400吨§!时金库告罄。\n\n§Y每月通货膨胀§!\n- 法兰西银行坚守防线：§G-0.5§![FRW_inf_line_1][FRW_inf_line_2][FRW_inf_line_3][FRW_inf_line_4][FRW_inf_line_5][FRW_inf_line_6][FRW_inf_line_7][FRW_inf_line_8][FRW_inf_line_9][FRW_inf_line_10][FRW_inf_line_11][FRW_inf_line_12][FRW_inf_line_13][FRW_inf_line_14][FRW_inf_line_15][FRW_inf_line_16][FRW_inf_line_17][FRW_inf_line_18]\n\n§Y每月黄金变化§![FRW_gold_line_0][FRW_gold_line_1][FRW_gold_line_2][FRW_gold_line_3][FRW_gold_line_4][FRW_gold_line_5][FRW_gold_line_6][FRW_gold_line_7][FRW_gold_line_8][FRW_gold_line_9][FRW_gold_line_10][FRW_gold_line_11]"
 FRW_liberation_prestige_tt:0 "欧洲每有一个法国省份从敌人手中解放：自由法国威望§G+2§!。"
 FRW_exchange_controls_tt:0 "资本外逃（人民阵线、革命、政治动荡）不再消耗黄金储备。"
 FRW_contracts_tt:0 "持续一年：海外军用工厂§G+3§!（境外生产）。"
 FRW_cfa_drift_tt:0 "从现在起，通货膨胀每月额外下降§G0.25§!点，各殖民地每月输送§G+5吨§!黄金。"
 FRW_tripartite_drift_tt:0 "从现在起，通货膨胀每月额外下降§G0.25§!点，每月有§G+5吨§!黄金回流巴黎。"
 FRW_tight_money_desc:0 "信贷昂贵。新开工的项目减少了，但法郎安然无虞。"
 FRW_austerity_desc:0 "削减开支安抚了市场，但公务员、老兵和建筑工人都感受到了切肤之痛。"
 FRW_price_riots_desc:0 "人群冲进市场和面包店。法郎的价值每周都在缩水。"
 FRW_new_franc_desc:0 "一场货币改革在一夜之间抹去了人们的积蓄。法郎重新稳健，但对国家的信任却一去不返。"
 FRW_fighting_france_desc:0 "整个盟国世界如今都承认战斗法国才是真正的法国。"
 FRW_exchange_controls_idea_desc:0 "每一法郎流出国境都需要许可证。黄金留在了国内，但进口商和银行家怨声载道。"
 FRW_foreign_contracts_desc:0 "美国的工厂接受法国订单，以黄金支付。"
 FRW_gold_loan_desc:0 "伦敦借给了我们黄金。每月都必须支付利息。"
 FRW_printing_press_desc:0 "新钞涌入工厂。通货膨胀将接踵而至。"
 FRW_franc:0 "法郎"
 FRW_franc_desc:0 "通货膨胀：§Y[?FRW_inflation|0]%§!。可在决议菜单§Y法郎§!中进行管理。"
 FRW_ff_prestige_mod:0 "自由法国威望"
 FRW_ff_prestige_mod_desc:0 "自由法国威望：§Y[?FRW_ff_prestige|0]§!/100。威望越高，愿意归附的总督就越多。"
 FRW_dec_rally_eq:0 "派遣特使前往法属赤道非洲"
 FRW_dec_rally_eq_desc:0 "一名自由法国特使试图争取总督和守备部队。\n\n成功几率：§Y[?FRW_ffc_eq|0]%§!"
 FRW_dec_exped_eq:0 "远征法属赤道非洲"
