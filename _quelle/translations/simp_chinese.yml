 FRW_adv_monnet:0 "让·莫内"
 FRW_adv_monnet_desc:0 "让·莫内毕生都在说服各国政府将其无力独自应对之事合而为一，从1917年的协约国航运到对波兰和中国的贷款，莫不如此。他相信，欧洲各国终有一天必须共享煤炭与钢铁，并随之让渡部分主权。"
