 FRW_ff_dragoon_spirit:0 "普罗旺斯登陆"
 FRW_french_gold_payment:0 "以黄金换法属非洲"
 FRW_leader_blum:0 "莱昂·布鲁姆"
 FRW_leader_blum_desc:0 "工人国际法国支部领袖莱昂·布鲁姆，是首位领导法国政府的社会党人，也是首位领导法国政府的犹太人。他的人民阵线于1936年以“面包、和平、自由”的口号上台执政。"
 FRW_leader_reynaud:0 "保罗·雷诺"
 FRW_leader_reynaud_desc:0 "雷诺是民主联盟中一位强势的财政政治家，长期以来一直警告德国的威胁，也是年轻的戴高乐上校的庇护人。"
 FRW_leader_degaulle:0 "夏尔·戴高乐"
 FRW_leader_degaulle_desc:0 "这位身材高大的军官长期倡导装甲战和强有力的行政权，如今领导着一个改革后的共和国。"
 FRW_leader_thorez:0 "莫里斯·多列士"
 FRW_leader_thorez_desc:0 "多列士是加来海峡省一名矿工之子，现任法国共产党总书记，紧跟共产国际制定的路线。"
 FRW_leader_pivert:0 "马索·皮韦尔"
 FRW_leader_pivert_desc:0 "革命左派领袖皮韦尔提出了“一切皆有可能！”的口号。他希望进行一场由工人委员会领导、独立于莫斯科的革命。"
 FRW_leader_larocque:0 "弗朗索瓦·德·拉罗克"
 FRW_leader_larocque_desc:0 "德·拉罗克上校曾领导火十字团，如今执掌法兰西社会党。他呼吁建立一个奉行强有力社会政策的天主教民族国家。"
 FRW_leader_doriot:0 "雅克·多里奥"
 FRW_leader_doriot_desc:0 "多里奥曾是共产党人，至今仍是圣但尼市长。他于1936年创立了法兰西人民党，这是法国右翼中最激进的群众运动。"
 FRW_leader_petain:0 "菲利普·贝当"
 FRW_leader_petain_desc:0 "这位凡尔登的胜利者是法国最受尊敬的军人，许多人都指望他来拯救国家。"
 FRW_leader_comtedeparis:0 "亨利六世（巴黎伯爵）"
 FRW_leader_comtedeparis_desc:0 "巴黎伯爵亨利·德·奥尔良是奥尔良家族的家长，也是奥尔良派的王位觊觎者。他以亨利六世之名统治。"
 FRW_leader_napoleon:0 "拿破仑六世"
 FRW_leader_napoleon_desc:0 "路易·拿破仑亲王是波拿巴家族的家长，年轻而富有野心，背负着法国历史上最著名的姓氏。"
