 FRW_dec_dismiss_mendigal_desc:0 "Jean Mendigal abandona el Consejo de Ministros."
 FRW_adv_mendigal_effects_tt:0 "§YJean Mendigal§! se une al gobierno como §YComandante de caza§! (jefe de la Fuerza Aérea):\nAgilidad aérea: §G+5%§!\nGanancia de experiencia aérea: §G+8%§!"
 FRW_adv_mendigal_req:0 "§YJean Mendigal§! es jefe del Ejército del Aire"
 FRW_adv_bouscat:0 "René Bouscat"
 FRW_adv_bouscat_desc:0 "René Bouscat sabe que un avión en tierra no sirve de nada. Mejores aeródromos, piezas de repuesto y mecánicos mantendrán en el aire a una mayor parte de la fuerza aérea."
 FRW_trait_bouscat:0 "Organizador aéreo"
 FRW_trait_bouscat_desc:0 "Un oficial de Estado Mayor de la fuerza aérea, organizador de bases y del mantenimiento."
 FRW_dec_appoint_bouscat:0 "Nombrar a René Bouscat"
 FRW_dec_appoint_bouscat_desc:0 "René Bouscat sabe que un avión en tierra no sirve de nada. Mejores aeródromos, piezas de repuesto y mecánicos mantendrán en el aire a una mayor parte de la fuerza aérea."
 FRW_dec_dismiss_bouscat:0 "Destituir a René Bouscat"
 FRW_dec_dismiss_bouscat_desc:0 "René Bouscat abandona el Consejo de Ministros."
 FRW_adv_bouscat_effects_tt:0 "§YRené Bouscat§! se une al gobierno como §YOrganizador aéreo§! (jefe de la Fuerza Aérea):\nEficiencia de las misiones aéreas: §G+5%§!\nAccidentes aéreos: §G-15%§!"
