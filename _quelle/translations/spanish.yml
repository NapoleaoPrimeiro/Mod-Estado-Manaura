 FRW_dec_council_open_economy_desc:0 "Planificadores, ingenieros y estadísticos para dirigir la economía."
 FRW_dec_council_open_research:0 "Departamento: Investigación"
 FRW_dec_council_open_research_desc:0 "Científicos capaces de devolver la investigación francesa a la primera fila."
 FRW_dec_council_open_projects:0 "Departamento: Proyectos especiales"
 FRW_dec_council_open_projects_desc:0 "Ingenieros para los grandes proyectos del futuro: los cohetes y el átomo."
 FRW_dec_council_open_army:0 "Departamento: Ejército"
 FRW_dec_council_open_army_desc:0 "Jefes de Estado Mayor y reformadores que preparan al ejército para la próxima guerra."
