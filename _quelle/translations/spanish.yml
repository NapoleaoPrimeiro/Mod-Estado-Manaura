 FRW_gen_argenlieu:0 "Georges Thierry d'Argenlieu"
 FRW_gen_muselier:0 "Émile Muselier"
 FRW_dec_fort_meuse:0 "Cerrar la brecha del Mosa"
 FRW_dec_fort_meuse_desc:0 "El Estado Mayor considera infranqueables las Ardenas. Los ingenieros del 2.º Ejército no están tan seguros y quieren casamatas en el Mosa entre Sedán y Montmédy."
 FRW_dec_fort_nord:0 "Fortificar la frontera norte"
 FRW_dec_fort_nord_desc:0 "De Dunkerque a Maubeuge, la frontera con Bélgica está abierta. Una línea de blocaos y fosos antitanque seguirá el trazado de los canales."
 FRW_dec_fort_alps:0 "El Sector Fortificado de los Alpes"
 FRW_dec_fort_alps_desc:0 "Los fuertes que dominan los pasos de la Maurienne y del Tinée pueden detener a cualquier ejército que intente cruzar los Alpes."
 FRW_dec_fort_pyrenees:0 "Vigilancia en los Pirineos"
 FRW_dec_fort_pyrenees_desc:0 "La guerra de España podría desbordarse al otro lado de las montañas. Unos cuantos puntos fortificados vigilan los pasos y la carretera de la costa en Le Perthus."
 FRW_dec_fort_mareth:0 "La Línea Mareth"
 FRW_dec_fort_mareth_desc:0 "Entre el mar y las colinas de Matmata, al sur de Gabès, una línea de blocaos cierra el camino desde la Libia italiana hacia Túnez."
 FRW_dec_fort_coast:0 "Baterías costeras de Brest y Tolón"
 FRW_dec_fort_coast_desc:0 "Nuevas baterías pesadas y cañones antiaéreos protegen las dos grandes bases navales de la República."
 FRW_dec_fort_paris_aa:0 "Defensa aérea de París"
 FRW_dec_fort_paris_aa_desc:0 "Reflectores, puestos de escucha y baterías antiaéreas rodean la capital, y una nueva estación de radar vigila el cielo del norte."
 FRW_dec_fort_corsica:0 "Fortificar Córcega"
 FRW_dec_fort_corsica_desc:0 "Ajaccio y Bastia están al alcance de la flota italiana. Cañones costeros y una pequeña guarnición aseguran la isla."
 FRW_frontier_cat:0 "Defensa de las fronteras"
 FRW_frontier_cat_desc:0 "La Línea Maginot solo cubre una parte de Francia. Estas obras cierran las brechas que quedan en el norte, en los Alpes, en los Pirineos y en ultramar. Cada proyecto tarda unas semanas en completarse."
 FRW_dec_war_taxis:0 "Requisar los taxis de París"
 FRW_dec_war_taxis_desc:0 "En 1914, los taxis de París llevaron una división al Marne. Ahora se requisan todos los camiones, autobuses y automóviles de la región de la capital."
 FRW_dec_war_reserves:0 "Llamar a las quintas de reserva"
 FRW_dec_war_reserves_desc:0 "Las quintas más antiguas, licenciadas hace años, vuelven a ser llamadas a filas."
 FRW_dec_war_arsenals:0 "Abrir los arsenales de 1918"
 FRW_dec_war_arsenals_desc:0 "Los depósitos aún guardan fusiles y cañones de la última guerra. Viejos, pero mejor que nada."
 FRW_dec_war_gold:0 "Enviar el oro a Dakar"
 FRW_dec_war_gold_desc:0 "Los cruceros de la Marina pueden poner las reservas de la Banque de France fuera del alcance del enemigo. Pase lo que pase en París, el Estado no caerá en bancarrota."
 FRW_dec_war_loire:0 "Replegarse tras el Loira"
 FRW_dec_war_loire_desc:0 "Si no se puede sostener el frente, el ejército no debe ser destruido. Se retira en orden hasta el siguiente río y vuelve a atrincherarse."
 FRW_patrie_cat:0 "La Patrie en danger"
 FRW_gold_safe_tt:0 "Las reservas de oro están a salvo: si Francia capitula, la §YFrancia Libre§! aún podrá disponer de ellas."
 FRW_patrie_cat_desc:0 "El enemigo pisa suelo francés. Cada una de estas medidas de emergencia solo puede tomarse una vez, así que elegid bien el momento."
 FRW_invaded_tt:0 "Un enemigo ocupa parte de la §YFrancia metropolitana§!"
 FRW_gold_abroad_desc:0 "Las reservas de la Banque de France están a salvo en África Occidental. El gobierno puede seguir pagando a sus soldados y a sus proveedores."
 FRW_line_of_the_loire_desc:0 "El ejército ha roto el contacto y se ha atrincherado a lo largo del río. No atacará, pero tampoco será fácil desalojarlo."
 FRW_dewoitine_organization:0 "Dewoitine"
 FRW_dewoitine_organization_initial:0 "Oficina de diseño de Toulouse"
 FRW_potez_organization:0 "Potez"
 FRW_potez_organization_initial:0 "Talleres de Méaulte"
 FRW_breguet_organization:0 "Breguet"
 FRW_breguet_organization_initial:0 "Estudios de asalto de Vélizy"
