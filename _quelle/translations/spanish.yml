 FRW_dec_backer_captain:0 "Ganarse al capitán Kervadec"
 FRW_dec_backer_captain_desc:0 "El autor de la carta de Ginebra espera una respuesta. Las conversaciones con Malo Kervadec y sus valedores de Zúrich duran unas seis semanas. Solo se puede cortejar a un líder de este bando a la vez.\n\nRequiere un §Y35%§! de apoyo al partido y un §Y30%§! de estabilidad. Después se abrirá una vía oculta en el árbol de enfoques."
 FRW_dec_wait:0 "Esperar"
 FRW_dec_wait_desc:0 "Las Cámaras permanecen cerradas y los ministerios siguen con su rutina. Nadie en París tomará una decisión durante otro mes."
