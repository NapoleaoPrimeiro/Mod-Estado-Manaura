 FRW_ffp_tt_p2:0 "Prestigio de la Francia Libre: §G+2§!"
 FRW_ffp_tt_p3:0 "Prestigio de la Francia Libre: §G+3§!"
 FRW_ralliement_cat:0 "Francia Libre"
 FRW_exped_eq_tt:0 "Tiene al menos §Y1.500§! unidades de equipo de infantería en reserva"
 FRW_dec_exped_tt:0 "Emplea §Y15.000§! de mano de obra y §Y1.500§! unidades de equipo de infantería. Tras §Y45 días§! la expedición informa: si tiene éxito, la región se une a la Francia Libre (§G+5§! de prestigio, experiencia del ejército); si fracasa, §R-8§! de prestigio."
 FRW_dec_ff_agents:0 "Lanzar agentes en paracaídas sobre Francia"
 FRW_dec_ff_agents_desc:0 "Radiotelegrafistas y organizadores del BCRA son lanzados de noche sobre la Francia ocupada."
 FRW_dec_ff_agents_tt:0 "Cada estado francés ocupado de Europa: resistencia §G+5§!."
 FRW_dec_ff_sabotage:0 "Sabotear los ferrocarriles"
 FRW_dec_ff_sabotage_desc:0 "Los ferroviarios de la Résistance-Fer vuelan agujas, descarrilan trenes y retrasan cada convoy alemán."
 FRW_dec_ff_sabotage_tt:0 "Cada estado francés ocupado de Europa: resistencia §G+10§!, infraestructura dañada."
 FRW_dec_ff_gold:0 "Gastar el oro de la Banque de France"
 FRW_dec_ff_gold_desc:0 "El oro sacado de Francia antes del armisticio paga armas y talleres en el extranjero.\n\nOro restante: §Y[?FRW_gold|0] t§!"
 FRW_gold_m400_tt:0 "Reservas de oro: §R-400 t§!"
 FRW_ralliement_cat_desc:0 "Las colonias fueron entregadas a Vichy, pero pueden recuperarse región por región: mediante un §Yenviado§! (barato, depende del prestigio) o mediante una §Yexpedición§! (cuesta hombres y fusiles, +25% de probabilidad y otro +10% mientras Gran Bretaña siga luchando).\n\nPrestigio de la Francia Libre: §Y[?FRW_ff_prestige|0]§! de 100\n\nLa probabilidad de éxito aumenta con el prestigio (cuenta la mitad), con cada fracaso anterior en la misma región (§G+10%§! cada uno, hasta tres) y con algunos enfoques. Un éxito otorga §G+5§! de prestigio; un fracaso, §R-5§!. El prestigio crece por sí solo cada mes mientras Francia siga luchando, y más rápido si un aliado principal sigue en la guerra."
 FRW_dec_rally_tt:0 "Tras §Y21 días§! el enviado informa: si tiene éxito, todos los estados de la región en manos de §YVichy§! se unen a la Francia Libre, junto con sus soldados y sus fusiles."
 FRW_ffp_tt_m10:0 "Prestigio de la Francia Libre: §R-10§!"
 FRW_ffp_tt_p5:0 "Prestigio de la Francia Libre: §G+5§!"
 frw_sys.20.t:0 "El África Ecuatorial Francesa se une a la Francia Libre"
 frw_sys.20.d:0 "El gobernador Félix Éboué se ha declarado a favor de la Francia Libre en Fort-Lamy. En pocos días le siguen Camerún, el Congo Medio y Gabón. Brazzaville se convierte en la primera capital de la Francia Libre."
 frw_sys.20.a:0 "¡Vive la France libre!"
 frw_sys.30.t:0 "El África Ecuatorial Francesa sigue leal a Vichy"
 frw_sys.30.d:0 "Los oficiales de Gabón permanecen leales a Vichy, y al enviado lo embarcan en el siguiente barco a Lagos. La próxima vez nuestros enviados irán mejor preparados."
 frw_sys.30.a:0 "Lo intentaremos de nuevo."
 frw_sys.60.t:0 "Nuestras tropas desembarcan en el África Ecuatorial Francesa"
 frw_sys.60.d:0 "Columnas de la Francia Libre, apoyadas por buques y aviones aliados, han alcanzado la capital de la región. El gobernador Félix Éboué se ha declarado a favor de la Francia Libre en Fort-Lamy. En pocos días le siguen Camerún, el Congo Medio y Gabón. Brazzaville se convierte en la primera capital de la Francia Libre."
 frw_sys.60.a:0 "La Cruz de Lorena ondea de nuevo."
 frw_sys.70.t:0 "La expedición al África Ecuatorial Francesa ha fracasado"
 frw_sys.70.d:0 "Nuestro desembarco topó con una resistencia decidida de la guarnición de Vichy y tuvo que suspenderse. Se perdieron hombres y material, y la propaganda de Vichy lo celebra."
 frw_sys.70.a:0 "Volveremos."
 frw_sys.21.t:0 "El África Occidental Francesa se une a la Francia Libre"
 frw_sys.21.d:0 "En Dakar, el gobernador general ha cambiado de bando. El gran puerto, el acorazado de su dársena y los tiradores senegaleses sirven ahora a la Francia Libre."
 frw_sys.21.a:0 "¡Vive la France libre!"
 frw_sys.31.t:0 "El África Occidental Francesa sigue leal a Vichy"
 frw_sys.31.d:0 "Las baterías de Dakar abren fuego contra los buques de la Francia Libre. Vichy conserva el África Occidental por el momento. La próxima vez nuestros enviados irán mejor preparados."
 frw_sys.31.a:0 "Lo intentaremos de nuevo."
 frw_sys.61.t:0 "Nuestras tropas desembarcan en el África Occidental Francesa"
 frw_sys.61.d:0 "Columnas de la Francia Libre, apoyadas por buques y aviones aliados, han alcanzado la capital de la región. En Dakar, el gobernador general ha cambiado de bando. El gran puerto, el acorazado de su dársena y los tiradores senegaleses sirven ahora a la Francia Libre."
 frw_sys.61.a:0 "La Cruz de Lorena ondea de nuevo."
 frw_sys.71.t:0 "La expedición al África Occidental Francesa ha fracasado"
 frw_sys.71.d:0 "Nuestro desembarco topó con una resistencia decidida de la guarnición de Vichy y tuvo que suspenderse. Se perdieron hombres y material, y la propaganda de Vichy lo celebra."
 frw_sys.71.a:0 "Volveremos."
 frw_sys.22.t:0 "El África del Norte Francesa se une a la Francia Libre"
 frw_sys.22.d:0 "Argel, Orán, Casablanca y Túnez se han unido. El Ejército de África, cien mil hombres, vuelve a la guerra."
 frw_sys.22.a:0 "¡Vive la France libre!"
 frw_sys.32.t:0 "El África del Norte Francesa sigue leal a Vichy"
 frw_sys.32.d:0 "El general Weygand hace arrestar a los conspiradores de Argel. El norte de África sigue con el mariscal. La próxima vez nuestros enviados irán mejor preparados."
 frw_sys.32.a:0 "Lo intentaremos de nuevo."
 frw_sys.62.t:0 "Nuestras tropas desembarcan en el África del Norte Francesa"
 frw_sys.62.d:0 "Columnas de la Francia Libre, apoyadas por buques y aviones aliados, han alcanzado la capital de la región. Argel, Orán, Casablanca y Túnez se han unido. El Ejército de África, cien mil hombres, vuelve a la guerra."
 frw_sys.62.a:0 "La Cruz de Lorena ondea de nuevo."
 frw_sys.72.t:0 "La expedición al África del Norte Francesa ha fracasado"
 frw_sys.72.d:0 "Nuestro desembarco topó con una resistencia decidida de la guarnición de Vichy y tuvo que suspenderse. Se perdieron hombres y material, y la propaganda de Vichy lo celebra."
 frw_sys.72.a:0 "Volveremos."
 frw_sys.23.t:0 "El Levante se une a la Francia Libre"
 frw_sys.23.d:0 "Tras una campaña breve y encarnizada, el Ejército del Levante ha depuesto las armas. Muchos de sus soldados han optado por unirse a los Franceses Libres."
 frw_sys.23.a:0 "¡Vive la France libre!"
 frw_sys.33.t:0 "El Levante sigue leal a Vichy"
 frw_sys.33.d:0 "El general Dentz rechaza todas las ofertas. En Damasco, oficiales de la Francia Libre son juzgados por traición. La próxima vez nuestros enviados irán mejor preparados."
 frw_sys.33.a:0 "Lo intentaremos de nuevo."
 frw_sys.63.t:0 "Nuestras tropas desembarcan en el Levante"
 frw_sys.63.d:0 "Columnas de la Francia Libre, apoyadas por buques y aviones aliados, han alcanzado la capital de la región. Tras una campaña breve y encarnizada, el Ejército del Levante ha depuesto las armas. Muchos de sus soldados han optado por unirse a los Franceses Libres."
 frw_sys.63.a:0 "La Cruz de Lorena ondea de nuevo."
