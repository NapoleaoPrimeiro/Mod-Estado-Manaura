 FRW_council_cat:0 "El Consejo de Ministros"
 FRW_council_cat_desc:0 "Ministros, expertos y hombres de partido ofrecen sus servicios. Elige un departamento para ver quién está disponible. Algunas reformas no pueden llevarse a cabo sin el hombre adecuado en el gobierno.\n\nLos ministros nombrados aquí pueden ser destituidos de nuevo desde la parte superior de esta lista."
