 FRW_econ_reforms_cat_desc:0 "El modelo económico elegido por Francia puede profundizarse paso a paso. Cada reforma consta de tres etapas; una nueva etapa solo puede iniciarse cinco meses después de la anterior en el mismo ámbito."
