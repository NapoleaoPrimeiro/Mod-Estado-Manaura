 FRW_inf_line_2_on:0 "\n- El rearme ante todo: §R+1§!"
 FRW_inf_line_3_on:0 "\n- Economía dirigida: §R+0.5§!"
 FRW_inf_line_4_on:0 "\n- Liberalismo económico: §G-0.5§!"
 FRW_inf_line_5_on:0 "\n- Vacaciones pagadas y semana de cuarenta horas: §R+0.5§!"
 FRW_inf_line_6_on:0 "\n- La oleada de huelgas: §R+0.5§!"
 FRW_inf_line_7_on:0 "\n- Economía de guerra: §R+0.5§!"
 FRW_inf_line_8_on:0 "\n- Movilización total: §R+1§!"
 FRW_inf_line_9_on:0 "\n- Banque de France reformada: §G-0.5§!"
 FRW_inf_line_10_on:0 "\n- Acuerdo Monetario Tripartito: §G-0.25§!"
 FRW_inf_line_11_on:0 "\n- Inestabilidad política: §R+0.5§!"
 FRW_inf_line_12_on:0 "\n- Juntas estatales de precios: §G-0.5§!"
 FRW_inf_line_13_on:0 "\n- La zona del franco colonial: §G-0.25§!"
 FRW_inf_line_14_on:0 "\n- Compras de pánico: §R+0.5§!"
 FRW_inf_line_15_on:0 "\n- Amplia cobertura de oro: §G-0.25§!"
 FRW_inf_line_16_on:0 "\n- Escasa cobertura de oro: §R+0.5§!"
 FRW_inf_line_17_on:0 "\n- Las cámaras acorazadas están vacías: §R+1§!"
 FRW_gold_line_0_on:0 "\n- Fuga de capitales ante el Frente Popular: §R-20 t§!"
 FRW_gold_line_1_on:0 "\n- Fuga de capitales ante la revolución: §R-30 t§!"
 FRW_gold_line_2_on:0 "\n- Inestabilidad política: §R-15 t§!"
 FRW_gold_line_3_on:0 "\n- Huida del franco: §R-15 t§!"
 FRW_gold_line_4_on:0 "\n- Confianza en un franco sólido: §G+10 t§!"
 FRW_gold_line_5_on:0 "\n- Libre circulación de capitales: §G+10 t§!"
 FRW_gold_line_6_on:0 "\n- Acuerdo Monetario Tripartito: §G+5 t§!"
 FRW_gold_line_7_on:0 "\n- Oro de la zona del franco colonial: §G+5 t§!"
 FRW_gold_line_8_on:0 "\n- Compras en el extranjero en tiempo de guerra: §R-15 t§!"
 FRW_gold_line_9_on:0 "\n- Reembolso del préstamo de oro de Londres: §R-10 t§!"
 FRW_empty_line:0 ""
 FRW_gold_p200_tt:0 "Reservas de oro: §G+200 t§!"
 FRW_inf_tt_p4:0 "Inflación: §R+4§!"
 FRW_dec_franc_reserves:0 "Reconstituir las reservas de oro"
 FRW_dec_franc_reserves_desc:0 "La Banque de France compra oro en el mercado de Londres con francos de nueva emisión. Las cámaras acorazadas vuelven a llenarse, pero la masa monetaria crece."
 FRW_dec_franc_exchange:0 "Control de cambios"
 FRW_dec_franc_exchange_desc:0 "Los francos ya no pueden salir del país sin autorización. La fuga de capitales se detiene en la frontera, y buena parte del comercio también."
 FRW_dec_franc_contracts:0 "Contratos de armamento en el extranjero"
 FRW_dec_franc_contracts_desc:0 "El oro compra lo que las fábricas francesas no pueden entregar a tiempo: motores de aviación estadounidenses, máquinas herramienta y aviones completos, pagados al contado."
 FRW_exchange_controls_tt:0 "La fuga de capitales (Frente Popular, revolución, inestabilidad política) ya no merma las reservas de oro."
 FRW_contracts_tt:0 "Durante un año: §G+3§! fábricas militares en el extranjero (producción externa)."
 FRW_exchange_controls_idea_desc:0 "Cada franco que sale del país necesita un permiso. El oro se queda en casa, pero importadores y banqueros se quejan."
 FRW_foreign_contracts_desc:0 "Fábricas en Estados Unidos trabajan en pedidos franceses, pagados en oro."
 FRW_gold_loan_desc:0 "Londres nos ha prestado oro. Los intereses deben pagarse cada mes."
 FRW_gold_p400_tt:0 "Reservas de oro: §G+400 t§!"
 frw_sys.5.t:0 "Las cámaras acorazadas se vacían"
 frw_sys.5.d:0 "El gobernador de la Banque de France trae malas noticias: quedan menos de quinientas toneladas de oro en las cámaras acorazadas. Sin oro, el franco no tiene respaldo, y todos los especuladores de Europa lo saben."
 frw_sys.5.a:0 "Cerrar las fronteras al capital."
 frw_sys.5.b:0 "Pedir a Londres un préstamo de oro."
 frw_sys.5.c:0 "Ya nos arreglaremos de algún modo."
 FRW_franc_treasury_crisis:0 "La crisis del Tesoro"
 FRW_franc_treasury_crisis_desc:0 "El Tesoro vive al día, mes a mes, de los anticipos de la Banque de France. Antes de que pueda empezar cualquier reforma, alguien tiene que averiguar cuánto dinero tiene realmente el Estado."
 FRW_franc_treasury_crisis_tt:0 "Inflación: §G-5§!"
 FRW_franc_stabilisation_fund:0 "El Fondo de Estabilización Cambiaria"
 FRW_franc_stabilisation_fund_desc:0 "Se crea un fondo de oro y divisas para defender el franco en los mercados, como ya hacen Londres y Washington. Los especuladores tendrán que contar con el Tesoro además de con la Banque de France."
 FRW_franc_stabilisation_fund_tt:0 "Reservas de oro: §G+100 t§!\nA partir de ahora, §G+5 t§! de oro al mes."
 FRW_franc_defence_bonds:0 "Bonos de defensa nacional"
 FRW_franc_defence_bonds_desc:0 "El Tesoro vende bonos en todas las oficinas de correos de Francia. Los ahorradores prestan sus francos al Estado en lugar de gastarlos, y los carteles prometen que cada franco compra un obús."
 FRW_franc_defence_bonds_tt:0 "Inflación: §G-8§!"
 FRW_franc_fiscal_reform:0 "La reforma fiscal"
 FRW_franc_fiscal_reform_desc:0 "El Parlamento vota nuevos impuestos, recorta exenciones y, por una vez, aprueba el presupuesto a tiempo. El déficit se reduce, y con él los anticipos de la Banque de France."
 FRW_franc_fiscal_reform_tt:0 "A partir de ahora, la inflación baja otros §G0.25§! puntos al mes."
 FRW_franc_safe_havens:0 "Refugios seguros para el oro"
 FRW_franc_safe_havens_desc:0 "Parte de las reservas se traslada discretamente a cámaras acorazadas de Dakar, Fort-de-France y Ottawa, fuera del alcance de cualquier invasor."
 FRW_franc_safe_havens_tt:0 "Las reservas de oro están a salvo: si Francia capitula, la §YFrancia Libre§! aún podrá disponer de ellas."
 FRW_franc_colonial_gold:0 "El oro del Imperio"
 FRW_franc_colonial_gold_desc:0 "Se envían geólogos e ingenieros a los yacimientos auríferos de Guinea y del Sudán francés. La producción es escasa, pero cada onza se extrae dentro de la zona del franco."
 FRW_franc_colonial_gold_tt:0 "Reservas de oro: §G+50 t§!\nA partir de ahora, §G+5 t§! de oro al mes."
 FRW_franc_strong_franc:0 "Un franco sólido"
 FRW_franc_strong_franc_desc:0 "Con un presupuesto equilibrado y las cámaras acorazadas llenas, el franco mantiene su valor, y el capital que huyó a Londres y Nueva York regresa. El crédito se abarata y las obras se reanudan."
 FRW_franc_strong_franc_tt:0 "Inflación: §G-10§!"
 FRW_franc_war_finance:0 "Financiar la guerra"
 FRW_franc_war_finance_desc:0 "La guerra se pagará con impuestos, préstamos y controles, y no con la imprenta. Los ministros recuerdan lo que las deudas de guerra hicieron al franco después de 1918."
 FRW_franc_war_finance_tt:0 "Inflación: §G-8§!\nSolo disponible §Yen guerra§!."
 FRW_strong_franc:0 "Un franco sólido"
 FRW_war_finance:0 "Finanzas de guerra"
 FRW_franc_below_40_tt:0 "La inflación está por debajo del §Y40%§!"
 FRW_strong_franc_desc:0 "El crédito es barato y el franco vuelve a inspirar confianza. Las obras se reanudan en todo el país."
 FRW_war_finance_desc:0 "Los empréstitos de guerra, los impuestos y el control de precios financian la guerra."
 FRW_inf_line_18_on:0 "\n- La reforma fiscal: §G-0.25§!"
 FRW_gold_line_10_on:0 "\n- Fondo de Estabilización Cambiaria: §G+5 t§!"
 FRW_gold_line_11_on:0 "\n- Oro del Imperio: §G+5 t§!"
 FRW_colonial_administration:0 "Administración colonial"
 FRW_colonial_administration_tt:0 "Cada estado de esta región que posee Francia (sin territorio nacional y aún no administrado) recibe §YAdministración colonial§!: más mano de obra reclutable y §G+15%§! de recursos."
 FRW_colonial_administration_all_tt:0 "§YArgelia§!, las §YAntillas§!, la §YGuayana Francesa§! y la §YReunión§! pasan a ser §Gterritorio nacional§! (los départements de ultramar).\nCualquier otro estado de §YÁfrica§! que posea Francia recibe §YAdministración colonial§!: más mano de obra reclutable y §G+15%§! de recursos."
 FRW_free_caribbean:0 "Liberar las Antillas y la Guayana"
 FRW_free_caribbean_desc:0 "Las islas de plantaciones del Caribe y la colonia penal de la Guayana pasan a manos de sus propios pueblos.\n\nLos libera como §Ysatélites comunistas§! (solo donde Francia controle su territorio) y refuerza §YPueblos hermanos§!."
 FRW_brethren_of_the_coast:0 "Los Hermanos de la Costa"
 FRW_brethren_of_the_coast_desc:0 "En las tabernas de Saint-Malo, Brest y Tolón, los hombres del capitán firman los viejos artículos de los Hermanos de la Costa: una parte de cada presa, un voto en la elección de cada capitán, una pensión por cada herida. Los voluntarios hacen cola ante las oficinas de reclutamiento naval."
 FRW_sea_wolves:0 "Los lobos de mar"
 FRW_sea_wolves_desc:0 "Corsarios rápidos y submarinos de largo alcance acechan en las rutas marítimas. El capitán quiere que todo capitán mercante de Europa mire siempre por encima del hombro."
 FRW_privateer_squadrons:0 "Escuadras corsarias"
 FRW_privateer_squadrons_desc:0 "Todo armador de Bretaña y Normandía puede armar sus barcos con una patente de corso francesa. El Estado paga los cañones; los armadores se quedan con la mitad de lo que capturen."
 FRW_boarding_parties:0 "Los grupos de abordaje"
 FRW_boarding_parties_desc:0 "Infantes de marina adiestrados para tomar por sorpresa un barco o un puerto: garfios de abordaje, subfusiles y ninguna pregunta."
 FRW_new_tortuga:0 "Una nueva Tortuga"
 FRW_new_tortuga_desc:0 "Saint-Malo es declarado puerto franco, sin aduanas ni inspecciones. Todo cargamento de Europa que necesite eludir un bloqueo puede pasar por el puerto del capitán, previo pago."
 FRW_black_admiralty:0 "El Almirantazgo Negro"
 FRW_black_admiralty_desc:0 "Los viejos almirantes pasan al retiro y los propios hombres del capitán ocupan los puentes de la flota. Le Goff, Morvan y Duroc han navegado bajo banderas que ninguna lista naval menciona."
 FRW_black_admiralty_tt:0 "Tres nuevos almirantes se unen a la flota: §YYann Le Goff§! (Lobo de mar), §YCorentin Morvan§! (Rompebloqueos) y §YAnatole Duroc§! (Casco de hierro)."
 FRW_jolly_roger:0 "Bajo el Jolly Roger"
 FRW_jolly_roger_desc:0 "La bandera negra ondea en el palo mayor del buque insignia. La flota combate como lo hacían los corsarios de Saint-Malo: elige sus presas y se queda con el botín."
 FRW_isles_balearics:0 "Asaltar las Baleares"
 FRW_isles_balearics_desc:0 "Mallorca y Menorca se interponen en todas las rutas de Marsella a Gibraltar. El capitán se propone fondear sus fragatas en Mahón, donde los barcos franceses enarbolaron las lises por última vez en 1756."
 FRW_isles_balearics_tt:0 "§YReclamaciones§! sobre las §YIslas Baleares§! y un §Yobjetivo de guerra§! contra su propietario, España."
 FRW_isles_fortunate:0 "Las Islas Afortunadas"
 FRW_isles_fortunate_desc:0 "Canarias y Madeira guardan el camino hacia África y las Américas. Los corsarios de antaño las tomaban por su vino y su azúcar; el capitán quiere sus puertos."
 FRW_isles_fortunate_tt:0 "§YReclamaciones§! sobre las §YIslas Canarias§! y §YMadeira§!, y §Yobjetivos de guerra§! contra sus propietarios (España, Portugal)."
 FRW_isles_keys_med:0 "Las llaves del Mediterráneo"
 FRW_isles_keys_med_desc:0 "Malta y Gibraltar son las dos cerraduras del mar interior, y la Royal Navy tiene ambas llaves. Al capitán nunca le ha dado miedo la Royal Navy."
 FRW_isles_keys_med_tt:0 "§YReclamaciones§! sobre §YMalta§! y §YGibraltar§! y un §Yobjetivo de guerra§! contra Gran Bretaña."
 FRW_isles_azores:0 "Las islas atlánticas"
 FRW_isles_azores_desc:0 "Las Azores, las islas de Cabo Verde y Santo Tomé permitirían a una flota francesa cruzar el Atlántico sin pedir carbón a nadie."
 FRW_isles_azores_tt:0 "§YReclamaciones§! sobre las §YAzores§!, §YCabo Verde§! y §YSanto Tomé§! y un §Yobjetivo de guerra§! contra Portugal."
 FRW_isles_spanish_main:0 "La Tierra Firme"
 FRW_isles_spanish_main_desc:0 "Tortuga, Port Royal, Nasáu: el Caribe fue el reino de los Hermanos de la Costa. El capitán envía sus barcos de vuelta a los viejos cazaderos de Jamaica, las Bahamas, Trinidad, Curazao y las islas intermedias."
 FRW_isles_spanish_main_tt:0 "§YReclamaciones§! sobre las islas del Caribe y §Yobjetivos de guerra§! contra sus propietarios:\n- §YGran Bretaña§!: Jamaica, las Bahamas, Trinidad, las Islas de Barlovento, Bermudas\n- los §YPaíses Bajos§!: Curazao\n- §YHaití§!, la §YRepública Dominicana§! y §YCuba§!"
 FRW_isles_libertalia:0 "Libertalia"
 FRW_isles_libertalia_desc:0 "Cuenta la leyenda que los piratas del océano Índico fundaron una vez una república libre en la costa de Madagascar. El capitán se propone hacer realidad la leyenda, empezando por Mauricio y las Seychelles."
 FRW_isles_libertalia_tt:0 "§YReclamaciones§! sobre §YMauricio§! y las §YSeychelles§! y un §Yobjetivo de guerra§! contra Gran Bretaña.\n§YMadagascar§!, §YReunión§! y las §YComoras§! (si son francesas): §G+10%§! de colaboración."
 FRW_isles_north:0 "Las islas del norte"
 FRW_isles_north_desc:0 "Shetland, las Feroe e Islandia cierran el Atlántico Norte como una puerta. Quien las domine podrá estrangular los convoyes de tres naciones."
 FRW_isles_north_tt:0 "§YReclamaciones§! sobre §YShetland§!, las §YIslas Feroe§! e §YIslandia§! y §Yobjetivos de guerra§! contra sus propietarios (Gran Bretaña, Dinamarca, Islandia)."
 FRW_isles_republic:0 "La República de las Islas"
 FRW_isles_republic_desc:0 "De las Baleares a las Seychelles, las islas del capitán se gobiernan como una única federación libre de puertos. No pagan impuestos a París y, en su lugar, aportan barcos y marineros."
 FRW_isles_republic_tt:0 "§GTerritorios nacionales§! en cada isla que posea Francia entre las Baleares, Canarias, Madeira, Azores, Cabo Verde, Santo Tomé, Malta, Gibraltar, las islas del Caribe, Mauricio, las Seychelles, Shetland y las Feroe."
 FRW_black_flag:0 "Le Pavillon Noir"
 FRW_black_flag_2:0 "Los lobos de mar"
 FRW_black_flag_3:0 "Bajo el Jolly Roger"
 FRW_boarders:0 "Los grupos de abordaje"
 FRW_free_port:0 "Una nueva Tortuga"
 FRW_island_bases:0 "La República de las Islas"
 FRW_black_flag_desc:0 "Los artículos de los Hermanos de la Costa: una parte para cada hombre, un voto para cada capitán y ningún cuartel para el mercader que se resista."
 FRW_black_flag_2_desc:0 "Corsarios y submarinos cazan en todas las rutas marítimas de Europa."
 FRW_black_flag_3_desc:0 "La bandera negra ondea en el palo mayor del buque insignia. La flota del capitán no da cuartel y cobra su paga en presas."
 FRW_boarders_desc:0 "Infantes de marina adiestrados para tomar por sorpresa un barco o un puerto."
 FRW_free_port_desc:0 "Saint-Malo es un puerto franco. Ningún aduanero sube a bordo, pero todo barco paga una tarifa."
 FRW_island_bases_desc:0 "Una cadena de puertos insulares desde las Baleares hasta las Seychelles abastece las flotas y los destacamentos de desembarco del capitán."
 FRW_pirate_captain:0 "Capitán corsario"
 FRW_pirate_captain_desc:0 "Ha combatido bajo tres banderas y no ha perdido ninguna batalla en el mar bajo ninguna de ellas."
 FRW_pirate_legoff:0 "Yann Le Goff"
 FRW_pirate_morvan:0 "Corentin Morvan"
 FRW_pirate_duroc:0 "Anatole Duroc"
 FRW_mediterranean_ambition_tt:0 "Si §YJacques Doriot§! gobierna Francia: §Yreclamaciones§! sobre §YTripolitania§! y el §YFezzán§!."
 FRW_rome_accords:0 "Los Acuerdos de Roma"
 FRW_rome_accords_desc:0 "En enero de 1935, Laval y Mussolini zanjaron sus disputas en África. Francia cedió a Libia una franja de desierto, e Italia aceptó renunciar al estatuto especial de sus colonos en Túnez. La Rocque se propone que Roma cumpla lo pactado."
 FRW_stresa_front:0 "El Frente de Stresa renovado"
 FRW_stresa_front_desc:0 "En Stresa, en abril de 1935, Francia, Gran Bretaña e Italia se unieron para mantener libre a Austria. La Rocque quiere restablecer ese frente, con Roma como primera aliada de Francia."
 FRW_stresa_front_tt:0 "Invita a §YItalia§! a la facción de Francia (si Francia lidera una)."
 FRW_latin_naval_pact:0 "El Pacto Naval Latino"
 FRW_latin_naval_pact_desc:0 "Tolón y La Spezia comparten sus planes. La flota francesa guarda el Mediterráneo occidental, y la italiana, la cuenca central y el estrecho de Sicilia."
 FRW_latin_union:0 "La Unión Latina"
 FRW_latin_union_desc:0 "La Rocque no desea conquistar a sus vecinos latinos. Ofrece a Roma y Madrid una unión aduanera y una defensa común de Lisboa a Trieste, con París a la cabeza."
 FRW_latin_union_tt:0 "Una §YItalia§! aliada en la facción de Francia cuenta ahora como controlada para el §YImperio Latino§! (aún se necesitan España y Portugal)."
 FRW_dec_renew_federal_offer:0 "Renovar la oferta federal"
 FRW_dec_renew_federal_offer_desc:0 "No todos los gobiernos estaban preparados la primera vez que París se lo pidió. Una nueva delegación de federalistas recorre las capitales de Europa con la misma oferta: un ejército, una moneda, una asamblea federal."
 FRW_dec_renew_federal_offer_tt:0 "Se vuelve a invitar a todas las naciones menores democráticas de Europa que formen parte de la facción de Francia o estén bajo garantía francesa a unirse a la §YFederación Europea§!."
 FRW_marshals_of_the_empire_tt:0 "El §Ypríncipe Luis Napoleón§! sale él mismo a campaña como §Ymariscal de campo§! (Doctrina ofensiva)."
 FRW_continental_system_tt:0 "Funda la facción §YBloqueo Continental§! (si Francia no pertenece a ninguna facción) e invita a §YPolonia§! y §YDinamarca§!, los antiguos aliados del Emperador."
 FRW_rhine_held:0 "El Rin resiste"
 FRW_continental_system_faction:0 "El Bloqueo Continental"
 FRW_rhine_held_desc:0 "Cuando los batallones alemanes entraron en Renania, Francia movilizó, y Berlín los hizo retroceder. El país no se sentía tan seguro de sí mismo desde 1918."
 frw_fb3.1.t:0 "El Rin resiste"
 frw_fb3.1.d:0 "Las columnas alemanas que entraron en la zona desmilitarizada vuelven a cruzar los puentes del Rin. Hitler ha cedido primero. En París, los periódicos lo llaman la primera victoria desde Versalles, y los diputados que votaron la movilización son aclamados ante el Palais Bourbon."
 frw_fb3.1.a:0 "Francia sigue montando guardia en el Rin."
 FRW_dec_invite_trotsky:0 "Ofrecer asilo a León Trotski"
 FRW_dec_invite_trotsky_desc:0 "Trotski vivió en Francia hasta 1935, cuando la República lo expulsó para complacer a Moscú. Una Francia obrera podría traer de vuelta al hombre que construyó el Ejército Rojo, aunque Stalin no lo perdonaría."
 FRW_dec_invite_trotsky_tt:0 "§YLeón Trotski§! viene a Francia y puede ser nombrado §Yasesor político§!."
 frw_fb3.2.t:0 "Trotski en París"
 frw_fb3.2.d:0 "León Trotski ha bajado del tren en la Gare de Lyon, diez años después de que Stalin lo expulsara de la Unión Soviética. Quiere dar conferencias, escribir y ayudar a organizar nuestro ejército. Moscú ha llamado a consultas a su embajador."
 frw_fb3.2.a:0 "Bienvenido, camarada."
 frw_fb3.2.a.tt:0 "§YLeón Trotski§! puede ser nombrado §Yasesor político§!.\nCon §YMarceau Pivert§!: §G+3%§! de estabilidad y de apoyo comunista.\nCon §YMaurice Thorez§!: §R-5%§! de estabilidad.\nUna §YUnión Soviética§! comunista se ofende (§R-40§! de opinión)."
 FRW_adv_trotsky:0 "León Trotski"
 FRW_trait_trotsky:0 "Fundador del Ejército Rojo"
 FRW_trotsky_affront:0 "Da asilo a Trotski"
