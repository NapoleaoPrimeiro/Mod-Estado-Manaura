 FRW_ff_dragoon_spirit:0 "Desembarco en Provenza"
 FRW_leader_blum:0 "Léon Blum"
 FRW_leader_blum_desc:0 "Léon Blum, líder de la SFIO, es el primer socialista y el primer judío en presidir un gobierno francés. Su Frente Popular llegó al poder en 1936 con el lema «Pain, paix, liberté»."
 FRW_leader_reynaud:0 "Paul Reynaud"
 FRW_leader_reynaud_desc:0 "Enérgico político de las finanzas de la Alliance Démocratique, Reynaud lleva mucho tiempo advirtiendo contra Alemania y es el protector del joven coronel De Gaulle."
 FRW_leader_degaulle:0 "Charles de Gaulle"
 FRW_leader_degaulle_desc:0 "Defensor desde hace años de la guerra acorazada y de un ejecutivo fuerte, el alto oficial dirige ahora una República reformada."
 FRW_leader_thorez:0 "Maurice Thorez"
 FRW_leader_thorez_desc:0 "Hijo de un minero del Paso de Calais, Thorez es secretario general del PCF y se ciñe estrechamente a la línea marcada por la Comintern."
 FRW_leader_pivert:0 "Marceau Pivert"
 FRW_leader_pivert_desc:0 "Pivert, líder de la Gauche Révolutionnaire, acuñó el lema «Tout est possible!». Aspira a una revolución dirigida por consejos obreros e independiente de Moscú."
 FRW_leader_larocque:0 "François de La Rocque"
 FRW_leader_larocque_desc:0 "El coronel De La Rocque dirigió las Croix-de-Feu y encabeza ahora el Parti Social Français. Reclama un Estado católico y nacional con una política social enérgica."
 FRW_leader_doriot:0 "Jacques Doriot"
 FRW_leader_doriot_desc:0 "Antiguo comunista y todavía alcalde de Saint-Denis, Doriot fundó en 1936 el Parti Populaire Français, el movimiento de masas más radical de la derecha francesa."
 FRW_leader_petain:0 "Philippe Pétain"
 FRW_leader_petain_desc:0 "El vencedor de Verdún es el soldado más respetado de Francia, y muchos ven en él al salvador del país."
 FRW_leader_comtedeparis:0 "Enrique VI (conde de París)"
 FRW_leader_comtedeparis_desc:0 "Enrique de Orleans, conde de París, es jefe de la Casa de Orleans y pretendiente orleanista al trono. Reina como Enrique VI."
 FRW_leader_napoleon:0 "Napoleón VI"
 FRW_leader_napoleon_desc:0 "Luis, príncipe Napoleón, jefe de la Casa Bonaparte, es joven y ambicioso, y lleva el nombre más célebre de la historia de Francia."
