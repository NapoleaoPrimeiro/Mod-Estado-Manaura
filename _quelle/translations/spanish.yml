 FRW_dec_council_open_navy_desc:0 "Almirantes que construyen y adiestran la flota."
 FRW_dec_council_open_air:0 "Departamento: Fuerza Aérea"
 FRW_dec_council_open_air_desc:0 "Generales del aire que dan forma a la Armée de l'Air."
 FRW_dec_council_open_resistance:0 "Departamento: Servicio de Inteligencia"
 FRW_dec_council_open_resistance_desc:0 "El Deuxième Bureau y los hombres que organizarían la resistencia si Francia llegara a ser ocupada."
 FRW_adv_monnet:0 "Jean Monnet"
 FRW_adv_monnet_desc:0 "Jean Monnet ha dedicado su vida a convencer a los gobiernos de poner en común lo que no pueden gestionar por sí solos, desde el transporte marítimo aliado en 1917 hasta los préstamos a Polonia y China. Cree que las naciones de Europa tendrán que compartir algún día su carbón y su acero, y con ellos parte de su soberanía."
 FRW_trait_monnet:0 "Planificador de Europa"
 FRW_trait_monnet_desc:0 "Comerciante de coñac convertido en financiero internacional, secretario general adjunto de la Sociedad de Naciones a los treinta y un años."
 FRW_dec_appoint_monnet:0 "Nombrar a Jean Monnet"
 FRW_dec_appoint_monnet_desc:0 "Jean Monnet ha dedicado su vida a convencer a los gobiernos de poner en común lo que no pueden gestionar por sí solos, desde el transporte marítimo aliado en 1917 hasta los préstamos a Polonia y China. Cree que las naciones de Europa tendrán que compartir algún día su carbón y su acero, y con ellos parte de su soberanía."
 FRW_dec_dismiss_monnet:0 "Destituir a Jean Monnet"
 FRW_dec_dismiss_monnet_desc:0 "Jean Monnet abandona el Consejo de Ministros."
 FRW_adv_monnet_effects_tt:0 "§YJean Monnet§! se une al gobierno como §YPlanificador de Europa§! (asesor político):\nEficiencia máxima de fábrica: §G+5%§!\nOpinión comercial: §G+20%§!\nGanancia mensual de opinión: §G+10%§!\nApoyo a la guerra: §R-3%§!"
 FRW_adv_monnet_req:0 "§YJean Monnet§! es asesor político"
 FRW_adv_dautry:0 "Raoul Dautry"
 FRW_adv_dautry_desc:0 "Raoul Dautry se labró su reputación reconstruyendo las líneas destrozadas del norte de Francia y modernizando los Ferrocarriles del Estado. Tiene poca paciencia con los comités y prefiere fijar un objetivo y dejar que sus ingenieros lo cumplan."
 FRW_trait_dautry:0 "Ministro de Armamento"
 FRW_trait_dautry_desc:0 "El ingeniero que reconstruyó los ferrocarriles del norte después de 1918 y dirigió la red del État como una empresa moderna."
 FRW_dec_appoint_dautry:0 "Nombrar a Raoul Dautry"
