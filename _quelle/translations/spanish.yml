 FRW_political_cat:0 "Asuntos internos"
 FRW_political_cat_desc:0 "Medidas para dar a Francia más estabilidad interior y prepararla mejor para la guerra."
 FRW_dec_national_rally:0 "Concentración nacional"
 FRW_dec_national_rally_desc:0 "Se celebran grandes concentraciones públicas en las principales ciudades para ganar apoyos al gobierno."
 FRW_dec_war_propaganda:0 "Campaña de defensa nacional"
 FRW_dec_war_propaganda_desc:0 "Carteles, noticiarios y emisiones de radio preparan a la población ante la posibilidad de una guerra."
 FRW_dec_colonial_recruitment:0 "Reclutar en el Imperio"
 FRW_dec_colonial_recruitment_desc:0 "Las oficinas de reclutamiento del norte y el oeste de África alistan voluntarios para el ejército."
 FRW_colonial_purchases_cat:0 "Compras coloniales"
 FRW_colonial_purchases_cat_desc:0 "Francia ofrece a otras potencias coloniales oro y apoyo político a cambio de territorio africano. El vendedor decide sobre cada oferta; en multijugador, es el jugador propietario del territorio."
 FRW_buy_spanish_morocco:0 "Comprar el Marruecos español"
 FRW_buy_spanish_morocco_desc:0 "Se ofrece oro francés a Madrid a cambio de la zona del Rif."
 FRW_buy_ifni_rio_de_oro:0 "Comprar Ifni y Río de Oro"
 FRW_buy_ifni_rio_de_oro_desc:0 "Los territorios desérticos españoles de la costa atlántica se encuentran entre el Marruecos francés y Mauritania."
 FRW_buy_spanish_guinea:0 "Comprar la Guinea Española"
 FRW_buy_spanish_guinea_desc:0 "Río Muni está rodeado por tierra por el África Ecuatorial Francesa."
 FRW_buy_portuguese_guinea:0 "Comprar la Guinea Portuguesa"
 FRW_buy_portuguese_guinea_desc:0 "La colonia portuguesa de África occidental está casi totalmente rodeada de territorio francés."
 FRW_buy_gambia:0 "Comprar Gambia"
 FRW_buy_gambia_desc:0 "La estrecha franja británica a lo largo del río Gambia parte Senegal en dos."
 FRW_buy_sierra_leone:0 "Comprar Sierra Leona"
 FRW_buy_sierra_leone_desc:0 "Freetown daría al África Occidental Francesa un excelente puerto atlántico."
 FRW_buy_belgian_congo:0 "Comprar una concesión en el Congo"
 FRW_buy_belgian_congo_desc:0 "Se ofrecen a Bruselas condiciones para ceder parte del Congo a Francia."
 FRW_buy_fezzan:0 "Comprar el Fezán"
 FRW_buy_fezzan_desc:0 "El Fezán, el interior desértico de la Libia italiana, limita tanto con Argelia como con el Chad."
 FRW_union_francaise_cat:0 "La Unión Francesa"
 FRW_union_francaise_cat_desc:0 "El imperio colonial se reorganiza como una unión en la que los protectorados de Túnez y Marruecos pasan a ser miembros de pleno derecho de Francia."
 FRW_form_union_francaise:0 "Proclamar la Unión Francesa"
 FRW_form_union_francaise_desc:0 "Túnez y Marruecos pasan a ser territorio nacional de Francia."
 FRW_europe_cat:0 "Federación Europea"
 FRW_europe_cat_desc:0 "Planes para una Europa unida bajo liderazgo francés, ya sea democrática o socialista."
 FRW_form_european_federation:0 "Fundar la Federación Europea"
 FRW_form_european_federation_desc:0 "El Benelux y Renania pasan a ser territorio nacional de una federación dirigida por Francia."
 FRW_grand_empire_cat:0 "Le Grand Empire"
 FRW_grand_empire_cat_desc:0 "Restaurar el Imperio de los franceses dentro de las fronteras que tuvo bajo Napoleón."
 FRW_form_grand_empire:0 "Proclamar el Gran Imperio"
 FRW_form_grand_empire_desc:0 "El Benelux, Renania y el Piamonte pasan a ser territorio nacional del Imperio."
 FRW_francia_cat:0 "El Imperio Franco"
 FRW_francia_cat_desc:0 "Desde Aquisgrán, Carlomagno gobernó las tierras entre los Pirineos y el Elba. Francia se proclama su legítima heredera."
 FRW_form_francia:0 "Restaurar el Imperio de Carlomagno"
 FRW_form_francia_desc:0 "Requiere el control de Bélgica, Holanda, Renania, Westfalia y Baden, que pasan a ser territorio nacional."
 FRW_latin_cat:0 "El Imperio Latino"
 FRW_latin_cat_desc:0 "Planes para unir Francia, Italia y España, herederas de Roma, bajo una sola corona o un solo líder."
 FRW_form_latin_empire:0 "Proclamar el Imperio Latino"
 FRW_form_latin_empire_desc:0 "Requiere el control de Roma, Madrid y el Piamonte. Todo el territorio nacional italiano, español y portugués que poseamos pasa a ser territorio nacional nuestro."
 FRW_eurafrique_cat:0 "La Federación Euroafricana"
 FRW_eurafrique_cat_desc:0 "Planes para unir Europa y África en una sola federación bajo liderazgo francés."
 FRW_form_eurafrican_federation:0 "Fundar la Federación Euroafricana"
 FRW_form_eurafrican_federation_desc:0 "El Sáhara, el Sudán francés y Guinea pasan a ser territorio nacional."
 frw.1.t:0 "La crisis de la Tercera República"
 frw.1.d:0 "Desde los disturbios del 6 de febrero de 1934 el país no ha conocido descanso. Los gabinetes se suceden, las ligas desfilan por las calles, los comunistas ganan terreno y la economía se estanca. En los salones y en los cuarteles, oficiales y políticos discuten abiertamente qué debería sustituir a la República."
 frw.1.a:0 "Mantener la ley y el orden."
 frw.1.b:0 "Necesitamos medidas decisivas."
 frw.2.t:0 "¡Proclamada la Comuna!"
 frw.2.d:0 "Las banderas rojas ondean sobre el Hôtel de Ville. En París, los obreros, los soldados y el Partido Comunista han tomado el poder y han instaurado un gobierno socialista en lugar de la República. Las demás capitales de Europa aguardan con alarma lo que vendrá después."
 frw.2.a:0 "Un fantasma recorre Europa."
 frw.2.b:0 "Vive la Commune!"
 frw.3.t:0 "Revolución nacional en Francia"
 frw.3.d:0 "Tras semanas de agitación, las ligas unidas han derrocado al gobierno. La Cámara y el Senado han sido disueltos y un gobierno nacional ha tomado el poder."
 frw.3.a:0 "Francia ha cambiado."
 frw.3.b:0 "¡Francia despierta!"
 frw.4.t:0 "Suspendidas las cámaras francesas"
 frw.4.d:0 "De forma inesperada, el gobierno ha suspendido indefinidamente la Cámara y el Senado. Un gabinete «por encima de los partidos» dirige ahora el país, y aún no está claro qué clase de régimen sustituirá a la República."
 frw.4.a:0 "¿Qué vendrá ahora?"
 frw.5.t:0 "¡El Imperio de los franceses!"
 frw.5.d:0 "Luis, príncipe Napoleón, ha sido coronado en Notre-Dame como Napoleón VI, emperador de los franceses. La Guardia ha desfilado por los Campos Elíseos y las águilas han vuelto a los estandartes de los regimientos."
 frw.5.a:0 "La historia se repite."
 frw.5.b:0 "Vive l'Empereur!"
 frw.6.t:0 "Un rey en París"
 frw.6.d:0 "Enrique de Orleans, conde de París, ha regresado del exilio y ha ocupado el trono como Enrique VI. Francia tiene rey por primera vez desde 1848."
 frw.6.a:0 "Interesante."
 frw.6.b:0 "Vive le Roi!"
 frw.10.t:0 "Francia solicita la adhesión"
 frw.10.d:0 "El gobierno francés ha solicitado formalmente unirse a nuestra alianza. Francia aporta un gran ejército y una poderosa flota."
 frw.10.a:0 "Bienvenida, Francia."
 frw.10.b:0 "Lo rechazamos."
 frw.11.t:0 "Adhesión confirmada"
 frw.11.d:0 "Nuestra solicitud ha sido aceptada, y Francia cuenta ahora con aliados a su lado."
 frw.11.a:0 "Excelente."
 frw.12.t:0 "Solicitud rechazada"
 frw.12.d:0 "Nuestra solicitud de adhesión ha sido rechazada. Francia tendrá que arreglárselas sin esta alianza."
 frw.12.a:0 "Entonces estaremos solos."
 frw.16.t:0 "Una oferta de alianza de París"
 frw.16.d:0 "Francia ha formado una nueva alianza y nos invita a unirnos."
 frw.16.a:0 "Nos unimos."
 frw.16.b:0 "Seguimos siendo independientes."
 frw.17.t:0 "Oferta de alianza aceptada"
 frw.17.d:0 "[From.GetNameDefCap] ha aceptado nuestra oferta y se une a la alianza."
 frw.17.a:0 "Juntos somos fuertes."
 frw.18.t:0 "Oferta de alianza rechazada"
 frw.18.d:0 "[From.GetNameDefCap] ha rechazado nuestra oferta de alianza."
 frw.18.a:0 "Lamentable."
 frw.20.t:0 "¿Una Unión Franco-Británica?"
 frw.20.d:0 "París propone una unión de ambas naciones, con ministerios conjuntos de defensa y economía, una ciudadanía común y un único gabinete de guerra."
 frw.20.a:0 "Una unión indisoluble."
 frw.20.b:0 "Esto va demasiado lejos."
 frw.21.t:0 "¡Londres acepta!"
 frw.21.d:0 "El gobierno británico ha aceptado la unión, y los dos imperios actuarán en adelante como uno solo."
 frw.21.a:0 "Vive l'Union!"
 frw.22.t:0 "Londres se niega"
 frw.22.d:0 "Londres considera prematura una unión. La Entente continuará, pero solo en sus términos actuales."
 frw.22.a:0 "La pérfida Albión."
 frw.25.t:0 "¿Un protectorado francés?"
 frw.25.d:0 "Francia se ofrece a asumir nuestras deudas y garantizar nuestra seguridad, a condición de que nos convirtamos en un protectorado francés."
 frw.25.a:0 "Aceptamos."
 frw.25.b:0 "Nuestra independencia no es negociable."
 frw.26.t:0 "Liberia acepta"
 frw.26.d:0 "Liberia se encuentra ahora bajo protección francesa."
 frw.26.a:0 "Muy bien."
 frw.27.t:0 "Liberia se niega"
 frw.27.d:0 "El gobierno liberiano ha rechazado nuestra oferta."
 frw.27.a:0 "Una lástima."
 frw.50.t:0 "Una oferta de compra francesa"
 frw.50.d:0 "Un enviado de París ha llegado con una oferta. Francia desea comprar territorio colonial limítrofe con sus posesiones africanas y pagará una generosa suma en oro, junto con apoyo político."
 frw.50.a:0 "Vendemos."
 frw.50.b:0 "Esta tierra no está en venta."
 frw.51.t:0 "Compra completada"
 frw.51.d:0 "Las negociaciones han tenido éxito y el territorio forma ya parte del imperio francés, aunque la compra ha tensado el presupuesto."
 frw.51.a:0 "Un buen negocio."
 frw.52.t:0 "Oferta rechazada"
 frw.52.d:0 "Nuestra oferta de compra ha sido rechazada. Parte del dinero ha vuelto al Tesoro."
 frw.52.a:0 "Quizá en otra ocasión."
 frw.60.t:0 "Fundada la Federación Europea"
 frw.60.d:0 "En Estrasburgo se ha firmado la carta fundacional de una Federación Europea. Bajo liderazgo francés, las naciones de Europa occidental se fundirán en un único Estado."
 frw.60.a:0 "Una nueva era."
 frw.61.t:0 "Le Grand Empire"
 frw.61.d:0 "El águila imperial ondea de nuevo desde el mar del Norte hasta los Alpes. El Gran Imperio de Napoleón ha sido restaurado."
 frw.61.a:0 "El legado del Emperador."
 frw.62.t:0 "La Unión Francesa"
 frw.62.d:0 "Francia ha proclamado la Unión Francesa, y Túnez y Marruecos son ahora partes iguales de la República."
 frw.62.a:0 "Un nuevo orden para el imperio."
 frw.63.t:0 "Restaurado el Imperio de Carlomagno"
 frw.63.d:0 "En la catedral de Aquisgrán, donde reposa Carlomagno, Francia ha proclamado la restauración del Imperio Franco. Las tierras entre los Pirineos y el Rin vuelven a estar unidas."
 frw.63.a:0 "Karolus Magnus estaría orgulloso."
 frw.64.t:0 "Proclamado el Imperio Latino"
 frw.64.d:0 "Francia, Italia y España se encuentran ahora bajo un solo gobierno. El Imperio Latino, que reivindica su descendencia de los Césares, ha sido proclamado en Roma."
 frw.64.a:0 "Roma resurge."
 frw.65.t:0 "La Federación Euroafricana"
 frw.65.d:0 "Francia ha fusionado sus territorios africanos en una Federación Euroafricana, un único Estado que se extiende desde Dunkerque hasta el Níger."
 frw.65.a:0 "Eurafrique!"
 frw.70.t:0 "Francia exige la unión"
 frw.70.d:0 "El gobierno francés exige que [Root.GetNameDef] se una a Francia, alegando una lengua y una historia comunes. París ha dejado claro que una negativa podría responderse por la fuerza."
 frw.70.a:0 "Aceptamos la unión."
 frw.70.b:0 "¡Jamás!"
 frw.71.t:0 "Francia exige territorio"
 frw.71.d:0 "Francia exige que cedamos distritos fronterizos que considera históricamente franceses. Si nos negamos, París podría recurrir a la fuerza."
 frw.71.a:0 "Cedemos el territorio."
 frw.71.b:0 "¡Ni un palmo de nuestra tierra!"
 frw.72.t:0 "Nuestras exigencias aceptadas"
 frw.72.d:0 "Nuestras exigencias han sido satisfechas, y las tropas francesas cruzan la nueva frontera sin disparar un solo tiro."
 frw.72.a:0 "Vive la France!"
 frw.73.t:0 "Unión rechazada"
 frw.73.d:0 "[From.GetNameDefCap] ha rechazado la unión con Francia. El Estado Mayor tiene listos los planes para tomar por la fuerza lo que se nos ha negado."
 frw.73.a:0 "Entonces lo tomaremos por la fuerza."
 frw.73.b:0 "No empezaremos una guerra por esto."
 frw.74.t:0 "Exigencias rechazadas"
 frw.74.d:0 "[From.GetNameDefCap] se niega a ceder los territorios que exigimos. El ejército aún puede tomarlos si el gobierno da la orden."
 frw.74.a:0 "Preparaos para la guerra."
 frw.74.b:0 "Dejémoslo estar, por ahora."
 frw.75.t:0 "Francia exige nuestra lealtad"
 frw.75.d:0 "París exige que [Root.GetNameDef] se ponga bajo protección francesa, con nuestra política exterior y nuestro ejército subordinados a Francia. El embajador francés ha dado a entender que una negativa no se olvidaría y que el ejército francés está en alerta."
 frw.75.a:0 "Aceptamos la protección francesa."
 frw.75.b:0 "¡Seguimos siendo soberanos!"
 frw.76.t:0 "Protección rechazada"
 frw.76.d:0 "[From.GetNameDefCap] ha rechazado nuestra oferta de protección. El gobierno debe decidir si imponerla por la fuerza."
 frw.76.a:0 "Entonces aprenderán a obedecer."
 frw.76.b:0 "No merece una guerra."
 frw.80.t:0 "Una oferta secreta de París"
 frw.80.d:0 "Con la máxima discreción, el gobierno francés ha ofrecido ceder Saboya y los Alpes a la Confederación. A cambio, los bancos suizos abrirían sus cámaras acorazadas a la industria francesa. El asunto está ahora en manos del Consejo Federal en Berna."
 frw.80.a:0 "Aceptar: los cantones de Saboya y los Alpes se unen a la Confederación."
 frw.80.b:0 "Suiza no comercia con tierras."
 frw.81.t:0 "El capitán de Ginebra"
 frw.81.d:0 "Llegó a la Gare de Lyon con una sola maleta y un sable de oficial polaco. Malo Kervadec nació en Ginebra, hijo de un capitán de barco bretón de Saint-Malo y de una exiliada polaca de Cracovia, y creció entre los muelles del lago Lemán y los relatos de su madre sobre un país que ya no aparecía en ningún mapa. En 1917 se unió al Ejército Azul del general Haller en Francia, y en 1920 estaba en el Vístula cuando el Ejército Rojo fue rechazado ante Varsovia.\n\nDesde entonces ha trabajado para la banca privada de Zúrich y Ginebra, trasladando su oro a través de una Europa inquieta. Ahora trae ese oro a París, convencido de que Polonia solo podrá sobrevivir si Francia es fuerte."
 frw.81.a:0 "Avante a toda vela."
 frw.82.t:0 "Sellado el trato alpino"
 frw.82.d:0 "Suiza ha aceptado. Saboya y los Alpes han pasado a administración suiza, y el oro suizo ya está llegando a las fábricas francesas."
 frw.82.a:0 "Un buen intercambio."
 frw.83.t:0 "Berna declina la oferta"
 frw.83.d:0 "El Consejo Federal ha declinado nuestra oferta. Los Alpes siguen siendo franceses, y la opinión pública nunca sabrá lo cerca que estuvo el gobierno de cederlos."
 frw.83.a:0 "Quizá sea mejor así."
 FRW_CORSAIR:0 "Reino de Franquia"
 FRW_CORSAIR_DEF:0 "el Reino de Franquia"
 FRW_CORSAIR_ADJ:0 "franquiano"
 FRW_corsair_cat:0 "El Reino de Franquia"
 FRW_corsair_cat_desc:0 "Francia y la península ibérica, unidas bajo el pabellón corsario de Saint-Malo, con su armiño, su calavera y su león. Ningún invasor que desembarque en nuestras costas saldrá de ellas con vida."
 FRW_form_corsair_empire:0 "Proclamar el Reino de Franquia"
 FRW_form_corsair_empire_desc:0 "Requiere el control de París, Madrid, Burgos y Lisboa y más de un 50 % de apoyo a la guerra. Otorga territorio nacional en todos los estados españoles y portugueses propios y el espíritu Le Pavillon Corsaire (+30 % de ataque y defensa en territorio nacional)."
 frw.90.t:0 "Intervención en España"
 frw.90.d:0 "España ha caído en la guerra civil, y las tropas francesas se concentran a lo largo de los Pirineos. El gobierno debe decidir ahora a qué bando apoyará Francia y a cuál ayudará a aplastar."
 frw.90.a:0 "Por la República: ¡aplastad a los nacionales!"
 frw.90.b:0 "Por los nacionales: ¡aplastad a la República!"
 frw.90.c:0 "Por el gobierno legítimo: ¡aplastad a los rebeldes!"
 frw.92.t:0 "Francia exige la unión"
 frw.92.d:0 "Las divisiones francesas están desplegadas a lo largo de toda nuestra frontera, de Galicia a Andalucía. París exige que Portugal se una a Francia, por medios pacíficos, según insiste su nota. El Estado Mayor en Lisboa informa de que la resistencia sería inútil."
 frw.92.a:0 "No tenemos elección. Portugal se une a Francia."
 frw.92.b:0 "¡Portugal luchará!"
 frw.93.t:0 "Lisboa se niega"
 frw.93.d:0 "[From.GetNameDefCap] ha rechazado la unión. Nuestras divisiones aguardan la orden de avanzar."
 frw.93.a:0 "Entonces marcharemos sobre Lisboa."
 frw.93.b:0 "Ahora no."
 frw.95.t:0 "El Reino de Franquia"
 frw.95.d:0 "Desde el canal de la Mancha hasta Gibraltar, una nueva bandera ondea sobre los ministerios, con las lises de Francia y el armiño de Saint-Malo. Francia y la península ibérica han sido proclamadas un solo Estado: el Reino de Franquia. El capitán de Saint-Malo ha dicho a sus oficiales que esto es solo el principio."
 frw.95.a:0 "Una nueva potencia en Occidente."
 frw.95.b:0 "Montjoie Saint-Denis!"
 FRW_leader_corsair:0 "Malo Kervadec"
 FRW_leader_corsair_desc:0 "Malo Kervadec nació en Ginebra, hijo de un capitán de navío bretón de Saint-Malo y de una exiliada polaca. Luchó en el Ejército Azul de Haller, transportó oro para la banca privada de Zúrich y, según dicen los rumores, navegó bajo la bandera negra frente a las costas de África. Gobierna Francia como un capitán corsario gobierna su barco: con artículos escritos y una parte del botín para cada hombre."
 frw.96.t:0 "Francia pide las Shetland"
 frw.96.d:0 "Invocando la Auld Alliance y las cordiales relaciones entre nuestros países, París pide al Gobierno de Su Majestad que ceda las islas Shetland a Francia para utilizarlas como base naval."
 frw.96.a:0 "Muy bien, en aras de la amistad."
 frw.96.b:0 "Gran Bretaña no regala sus islas."
 frw.97.t:0 "Francia pide las Highlands"
 frw.97.d:0 "El embajador francés propone que las Tierras Altas de Escocia y Aberdeenshire pasen a administración francesa, en recuerdo, según sus palabras, de la Auld Alliance."
 frw.97.a:0 "Si así mantenemos a Francia de nuestro lado..."
 frw.97.b:0 "Ni hablar."
 frw.98.t:0 "Londres dice no"
 frw.98.d:0 "[From.GetNameDefCap] ha rechazado nuestra petición, cortés pero firmemente."
 frw.98.a:0 "Quizá cuando nos aprecien más."
 FRW_BURGUNDY:0 "Reino de Borgoña"
 FRW_BURGUNDY_DEF:0 "el Reino de Borgoña"
 FRW_BURGUNDY_ADJ:0 "borgoñón"
 FRW_WESTUNION:0 "Unión Occidental"
 FRW_WESTUNION_DEF:0 "la Unión Occidental"
 FRW_WESTUNION_ADJ:0 "occidental"
 FRW_burgundy_cat:0 "La herencia borgoñona"
 FRW_burgundy_cat_desc:0 "En el siglo XV, los duques Valois de Borgoña poseían tierras desde Dijon hasta Ámsterdam, de las más ricas de Europa. Francia está ahora en condiciones de volver a unirlas."
 FRW_form_burgundy:0 "Restaurar el Reino de Borgoña"
 FRW_form_burgundy_desc:0 "Requiere el control de Flandes, Holanda, Luxemburgo, Valonia y Borgoña (no comunista). Otorga territorio nacional en los Países Bajos y el espíritu Herencia borgoñona."
 FRW_western_union_cat:0 "La Unión Occidental"
 FRW_western_union_cat_desc:0 "Francia y los Países Bajos, unidos por una unión aduanera y una defensa común."
 FRW_form_western_union:0 "Proclamar la Unión Occidental"
 FRW_form_western_union_desc:0 "Requiere un gobierno democrático, más de un 50 % de estabilidad y el control de Flandes, Holanda, Luxemburgo y Valonia. Otorga territorio nacional en los Países Bajos y el espíritu La Unión Occidental."
 frw.99.t:0 "Borgoña renace"
 frw.99.d:0 "Casi cinco siglos después de que Carlos el Temerario cayera en Nancy en 1477, las tierras entre el Rin y el Somme vuelven a estar unidas, esta vez bajo París. Se ha proclamado el Reino de Borgoña."
 frw.99.a:0 "Vuelve la Edad de Oro."
 frw.100.t:0 "La Unión Occidental"
 frw.100.d:0 "Francia y los Países Bajos han firmado en Bruselas el tratado de la Unión Occidental. Prevé un mercado común y un ejército integrado para las democracias de Europa Occidental, con un parlamento conjunto que supervise ambos."
 frw.100.a:0 "Un nuevo comienzo."
 FRW_ETERNAL:0 "Reino Eterno de Franquia"
 FRW_ETERNAL_DEF:0 "el Reino Eterno de Franquia"
 FRW_ETERNAL_ADJ:0 "franquiano"
 FRW_leader_admiral_king:0 "Aymeric Kervadec"
 FRW_leader_admiral_king_desc:0 "Aymeric Kervadec nació en Ginebra en 1894 y creció a bordo de los barcos de su padre, navegando entre los bancos suizos y los puertos de Tánger y Dánzig. En 1920 fue uno de los primeros oficiales de la nueva Armada polaca y aprendió el oficio en las frías aguas frente a Gdynia. Más tarde mandó la flota que llevó los ejércitos de su padre a Lisboa y a Leith. Coronado en Reims como Aymeric I, el pueblo lo conoce como «le Roi-Amiral». A diferencia de su padre, prefiere los tratados a las incursiones y quiere una dinastía que le sobreviva. Jamás ha perdido una batalla en el mar."
 FRW_admiral_king:0 "Le Roi-Amiral"
 frw.101.t:0 "El Reino Eterno de Franquia"
 frw.101.d:0 "En la catedral de Reims, el almirante Aymeric Kervadec, hijo del difunto «Corsaire Noir», ha sido coronado como Aymeric I, rey de los francos. Francia y sus conquistas han sido proclamadas Reino Eterno de Franquia bajo una nueva bandera con las lises, las armas reales y la cruz de los cruzados.\n\nEn su primer discurso, el rey prometió culminar la obra de su padre. Francia, dijo, debe hacerse tan fuerte que ningún enemigo vuelva a pisar su suelo, y Polonia no debe volver a quedar sola jamás."
 frw.101.a:0 "Una nueva corona en Europa."
 frw.101.b:0 "Pro Rege et Patria!"
 frw.84.t:0 "Una carta de Ginebra"
 frw.84.d:0 "Durante meses, el Elíseo ha guardado silencio. Entonces llega una carta en papel grueso con la marca de agua de un banco privado de Ginebra, escrita con letra anticuada.\n\n«Messieurs, Francia va a la deriva, y un barco sin capitán acaba en las rocas. Yo tengo barcos y tengo oro. Una vez luché por una nación que había sido borrada del mapa, y sé lo que cuesta perder la patria. Llámenme y acudiré.\n\nM. Kervadec, Capitaine»\n\nNadie en París conoce ese nombre. En Zúrich es bien conocido.\n\n§GHay una nueva decisión disponible: Ganarse al capitán Kervadec.§!"
 frw.84.a:0 "Quizá deberíamos responderle."
 frw.102.t:0 "Le Corsaire Noir est mort"
 frw.102.d:0 "Malo Kervadec ha muerto en el mar. Una noche de tormenta frente a Gdynia le falló el corazón a bordo del barco que durante veinte años había transportado su oro y sus ejércitos. Sus oficiales cuentan que sus últimas palabras fueron en polaco.\n\nSu féretro reposa en capilla ardiente en la catedral de Saint-Malo, custodiado por infantes de marina franceses junto a marineros polacos llegados de Gdynia para escoltarlo a casa. Un consejo de regencia gobernará Francia hasta la coronación. Su hijo, el almirante Aymeric Kervadec, viaja hacia Reims."
 frw.102.a:0 "Descanse en el mar, capitán."
 FRW_req_european_federation_tt:0 "§gRequiere el control de §YBélgica§!, los §YPaíses Bajos§! y §YLuxemburgo§!, además de §YItalia§! o §YAlemania§! (anexionados o como títeres, salvo que se indique lo contrario). Si Francia aún no los controla, la nación se funda automáticamente en cuanto lo haga.§!"
 FRW_req_western_union_tt:0 "§gRequiere el control de §YBélgica§!, los §YPaíses Bajos§! y §YLuxemburgo§! (anexionados o como títeres, salvo que se indique lo contrario). Si Francia aún no los controla, la nación se funda automáticamente en cuanto lo haga.§!"
 FRW_req_latin_empire_tt:0 "§gRequiere el control de §YItalia§!, §YEspaña§! y §YPortugal§! (anexionados o como títeres, salvo que se indique lo contrario). Si Francia aún no los controla, la nación se funda automáticamente en cuanto lo haga.§!"
 FRW_req_eurafrica_tt:0 "§gRequiere el control del África del Norte francesa (§YArgelia§!, §YMarruecos§! y §YTúnez§!); basta con ocuparlos militarmente. Si Francia aún no los controla, la nación se funda automáticamente en cuanto lo haga.§!"
 FRW_req_francia_tt:0 "§gRequiere el control de §YRenania§!, §YMosela§!, §YBélgica§! y los §YPaíses Bajos§! (anexionados o como títeres, salvo que se indique lo contrario). Si Francia aún no los controla, la nación se funda automáticamente en cuanto lo haga.§!"
 FRW_req_burgundy_tt:0 "§gRequiere el control total de §YBélgica§!, los §YPaíses Bajos§! y §YLuxemburgo§! (anexionados, no como títeres). Si Francia aún no los controla, la nación se funda automáticamente en cuanto lo haga.§!"
 FRW_req_grand_empire_tt:0 "§gRequiere el control del §YRin§! (Renania, Mosela), el §YPiamonte§!, §YBélgica§! y los §YPaíses Bajos§! (anexionados o como títeres, salvo que se indique lo contrario). Si Francia aún no los controla, la nación se funda automáticamente en cuanto lo haga.§!"
 FRW_plunder_cat_desc:0 "Toda nación que se ha sometido a Francia, ya sea como súbdito o tras capitular, guarda oro en su banco central. El capitán de Saint-Malo se propone cobrarlo."
 FRW_seize_the_treasury:0 "Confiscar el tesoro de [FROM.GetName]"
 FRW_seize_the_treasury_desc:0 "Las reservas de oro de [FROM.GetNameDef] se están cargando en barcos franceses.\n\nFrancia: §G+75§! de poder político, una §Gfábrica civil§! y §YOro corsario§! durante 180 días.\n[FROM.GetNameDefCap]: §RTesoro saqueado§! durante 365 días. Cada país solo puede ser saqueado una vez al año."
 FRW_corsair_gold_desc:0 "El oro confiscado se ingresa en el tesoro real."
 FRW_plundered_treasury_desc:0 "Los corsarios franceses se han llevado nuestras reservas de oro."
 FRW_saint_malo_shipyards_desc:0 "Los astilleros del viejo puerto corsario vuelven a construir barcos, y más rápido que en ningún otro momento de su historia."
 FRW_prize_economy_desc:0 "El dinero de las presas capturadas se invierte en fábricas y máquinas herramienta."
 FRW_econ_dirigiste_2_desc:0 "El plan abarca ya todas las regiones, y se construyen nuevas fábricas allí donde deciden los planificadores."
 FRW_econ_dirigiste_3_desc:0 "La economía está planificada por completo, desde el precio del carbón hasta la producción de cada fábrica."
 FRW_econ_liberal_1_desc:0 "El capital privado y los mercados abiertos impulsan la industria francesa."
 FRW_econ_liberal_2_desc:0 "Inversores e ingenieros compiten por los contratos, y Francia cosecha los beneficios."
 FRW_econ_liberal_3_desc:0 "El crédito es barato y las carteras de pedidos de las empresas francesas están llenas."
 FRW_econ_rearmament_1_desc:0 "Cada franco disponible va a parar a los arsenales."
 FRW_econ_rearmament_2_desc:0 "La producción de armamento tiene prioridad sobre cualquier otra rama de la industria."
 FRW_econ_rearmament_3_desc:0 "Francia se ha convertido en un gran arsenal."
 FRW_colonial_integration_cat:0 "Integración colonial"
 FRW_colonial_integration_cat_desc:0 "Poseer territorio en África no basta para hacerlo francés. Estas decisiones someten las tierras africanas que posee Francia a una auténtica administración colonial, que aporta más soldados y más recursos de cada estado. Solo §YArgelia§!, francesa desde 1848, pasa a ser §Gterritorio nacional§!; con el enfoque §YArgelia es Francia§! le siguen los départements de ultramar. Las decisiones pueden volver a usarse siempre que Francia gane más tierras en una región."
 FRW_integrate_maghreb:0 "Integrar el África del Norte francesa"
 FRW_integrate_maghreb_desc:0 "Marruecos, Túnez y el Sáhara argelino se organizan en départements según el modelo de Argel y Orán.\n\nSomete todos los estados de esta región que posee Francia a §YAdministración colonial§!. §YArgelia§! pasa a ser §Gterritorio nacional§!."
 FRW_integrate_aof:0 "Integrar el África Occidental Francesa"
 FRW_integrate_aof_desc:0 "De Dakar a Niamey, el AOF queda sometido al derecho civil francés y sus habitantes pasan a ser ciudadanos.\n\nSomete todos los estados de esta región que posee Francia a §YAdministración colonial§!."
 FRW_integrate_aef:0 "Integrar el África Ecuatorial Francesa"
 FRW_integrate_aef_desc:0 "Brazzaville, Libreville, Fort-Lamy y el mandato del Camerún quedan bajo la autoridad directa de París.\n\nSomete todos los estados de esta región que posee Francia a §YAdministración colonial§!."
 FRW_integrate_indian_ocean:0 "Integrar los territorios del océano Índico"
 FRW_integrate_indian_ocean_desc:0 "Madagascar, la Reunión, las Comoras y Yibuti se incorporan a la Francia de ultramar.\n\nSomete todos los estados de esta región que posee Francia a §YAdministración colonial§!."
 FRW_integrate_spanish:0 "Integrar las antiguas colonias españolas"
 FRW_integrate_spanish_desc:0 "El Rif, Ifni, Río de Oro y Río Muni pasan de forma permanente a la administración francesa.\n\nSomete todos los estados de esta región que posee Francia a §YAdministración colonial§!."
 FRW_integrate_portuguese:0 "Integrar las antiguas colonias portuguesas"
 FRW_integrate_portuguese_desc:0 "Guinea, Angola, Mozambique y las islas atlánticas del antiguo imperio portugués quedan anexionadas a Francia.\n\nSomete todos los estados de esta región que posee Francia a §YAdministración colonial§!."
 FRW_integrate_congo:0 "Integrar el Congo"
 FRW_integrate_congo_desc:0 "El Congo Belga, junto con Ruanda y Burundi, se une al África Ecuatorial Francesa.\n\nSomete todos los estados de esta región que posee Francia a §YAdministración colonial§!."
 FRW_integrate_libya:0 "Integrar Libia"
 FRW_integrate_libya_desc:0 "Tripolitania, Cirenaica y el Fezzán dan ahora a Francia un enlace continuo entre Túnez y el Chad.\n\nSomete todos los estados de esta región que posee Francia a §YAdministración colonial§!."
 FRW_integrate_british_west:0 "Integrar el África Occidental Británica"
 FRW_integrate_british_west_desc:0 "Gambia, Sierra Leona y Nigeria se incorporan al AOF.\n\nSomete todos los estados de esta región que posee Francia a §YAdministración colonial§!."
 FRW_integrate_african_territories:0 "Los départements de ultramar"
 FRW_integrate_african_territories_desc:0 "Argelia, las Antillas, la Guayana y la Reunión se convierten en départements de Francia como cualquier otro. El resto de África queda bajo administración colonial."
 RULE_FRW_FRANCE_AI:0 "Francia (France Rework)"
 RULE_FRW_FRANCE_AI_HISTORICAL:0 "Histórico"
 RULE_FRW_FRANCE_AI_HISTORICAL_DESC:0 "Francia sigue siendo una democracia, normalmente con el Frente Popular. Recomendado."
 RULE_FRW_FRANCE_AI_DEMOCRATIC:0 "Democrático"
 RULE_FRW_FRANCE_AI_DEMOCRATIC_DESC:0 "Francia sigue una de las vías democráticas (Blum o Reynaud/de Gaulle)."
 RULE_FRW_FRANCE_AI_COMMUNIST:0 "Comunista"
 RULE_FRW_FRANCE_AI_COMMUNIST_DESC:0 "Francia sigue una de las vías comunistas (Thorez o Pivert)."
 RULE_FRW_FRANCE_AI_FASCIST:0 "Fascista"
 RULE_FRW_FRANCE_AI_FASCIST_DESC:0 "Francia sigue una de las vías fascistas (La Rocque o Doriot)."
 RULE_FRW_FRANCE_AI_NONALIGNED:0 "No alineado"
 RULE_FRW_FRANCE_AI_NONALIGNED_DESC:0 "Francia sigue una de las vías no alineadas (Pétain, Orleans o los Bonaparte)."
 RULE_FRW_FRANCE_AI_RANDOM:0 "Aleatorio"
 RULE_FRW_FRANCE_AI_RANDOM_DESC:0 "La IA elige cualquiera de las cuatro ideologías con la misma probabilidad."
 FRW_shortcut_democratic:0 "Vías democráticas"
 FRW_shortcut_communist:0 "Vías comunistas"
 FRW_shortcut_fascist:0 "Vías fascistas"
 FRW_shortcut_nonaligned:0 "Vías no alineadas"
 FRW_shortcut_secret:0 "Vía secreta"
 FRW_shortcut_economy:0 "Economía"
 FRW_shortcut_military:0 "Ejército"
 FRW_shortcut_diplomacy:0 "Diplomacia"
 FRW_shortcut_colonies:0 "Imperio colonial"
 FRW_plunder_cat:0 "Botín de guerra"
 FRW_econ_dirigiste_1_desc:0 "El Estado elabora planes de inversión y dirige las grandes industrias."
 FRW_union_francaise_formed_desc:0 "Las colonias, de Dakar a Saigón, son ahora miembros de una única Unión Francesa."
 FRW_european_federation_desc:0 "Una Europa federal bajo liderazgo francés, con un mercado único y un parlamento común."
 FRW_western_union_idea_desc:0 "Las democracias de Europa Occidental comparten un mercado común y un ejército conjunto."
 FRW_latin_empire_idea_desc:0 "Mare Nostrum. Las marinas latinas controlan el Mediterráneo."
 FRW_eurafrican_federation_idea_desc:0 "Europa y África forman un único espacio económico dirigido desde París."
 FRW_francia_idea_desc:0 "Como heredero de Carlomagno, el rey gobierna desde los Pirineos hasta el Rin."
 FRW_burgundy_idea_desc:0 "Las ricas provincias del antiguo Estado borgoñón vuelven a estar unidas."
 FRW_grand_empire_idea_desc:0 "La Europa de Napoleón ha sido restaurada y la Grande Armée vuelve a estar en marcha."
 FRW_franco_british_union_spirit_desc:0 "Francia y Gran Bretaña han fusionado sus dos imperios en una sola unión."
 FRW_drapeau_noir_desc:0 "Bajo la bandera negra de los corsarios, nuestros soldados defienden cada palmo del suelo patrio."
 FRW_eternal_kingdom_spirit_desc:0 "La corona ha sido restaurada, y el rey que la ciñe jamás ha perdido una batalla en el mar."
 FRW_decolonisation_cat:0 "La revolución anticolonial"
 FRW_decolonisation_cat_desc:0 "Una república obrera no puede gobernar a otros pueblos por la fuerza. Cada colonia liberada se convierte en un aliado socialista y aumenta el prestigio de la Comuna entre los pueblos coloniales de todo el mundo.\n\nCada liberación refuerza §YPueblos hermanos§! en un nivel (hasta tres)."
 FRW_free_north_africa:0 "Liberar el norte de África"
 FRW_free_north_africa_desc:0 "Marruecos, Túnez y Argelia se convierten en repúblicas socialistas independientes aliadas de la Comuna francesa.\n\nLos libera como §Ysatélites comunistas§! (solo donde Francia controle su territorio) y refuerza §YPueblos hermanos§!."
 FRW_free_west_africa:0 "Liberar el África Occidental"
 FRW_free_west_africa_desc:0 "Los territorios del AOF, de Senegal a Níger, y el mandato de Togo eligen sus propios consejos y abandonan el imperio.\n\nLos libera como §Ysatélites comunistas§! (solo donde Francia controle su territorio) y refuerza §YPueblos hermanos§!."
 FRW_free_equatorial_africa:0 "Liberar el África Ecuatorial"
 FRW_free_equatorial_africa_desc:0 "El Chad, el Camerún, Gabón, el Congo Medio y Ubangui-Chari son proclamados repúblicas libres.\n\nLos libera como §Ysatélites comunistas§! (solo donde Francia controle su territorio) y refuerza §YPueblos hermanos§!."
 FRW_free_indian_ocean:0 "Liberar Madagascar y Yibuti"
 FRW_free_indian_ocean_desc:0 "Madagascar y la costa de Yibuti pasan a manos de sus propios pueblos.\n\nLos libera como §Ysatélites comunistas§! (solo donde Francia controle su territorio) y refuerza §YPueblos hermanos§!."
 FRW_free_indochina:0 "Liberar Indochina"
 FRW_free_indochina_desc:0 "Con el respaldo francés, los comunistas indochinos toman el poder en Hanói, Nom Pen y Vientián.\n\nLos libera como §Ysatélites comunistas§! (solo donde Francia controle su territorio) y refuerza §YPueblos hermanos§!."
 FRW_free_levant:0 "Liberar el Levante"
 FRW_free_levant_desc:0 "Los mandatos de Siria y del Líbano llegan a su fin, y Damasco y Beirut se gobiernan ahora a sí mismas.\n\nLos libera como §Ysatélites comunistas§! (solo donde Francia controle su territorio) y refuerza §YPueblos hermanos§!."
 FRW_european_community_faction:0 "Comunidad Europea"
 FRW_neutral_bloc_faction:0 "Bloque Latino Neutral"
 frw.120.t:0 "Francia propone un bloque neutral"
 frw.120.d:0 "El enviado del mariscal ha traído una propuesta de París. Las naciones latinas, afirma, deberían mantenerse unidas y al margen de la guerra que se avecina entre Berlín, Londres y Moscú. Francia ofrece una defensa común y no pide nada más."
 frw.120.a:0 "Aceptamos."
 frw.120.b:0 "Preferimos mantenernos solos."
 frw.121.t:0 "La Federación Europea"
 frw.121.d:0 "París pide a los miembros de la Comunidad Europea que den el paso definitivo hacia un gobierno federal con un único ejército y una única moneda. Nuestros ministros tendrían su sede en París, y nuestra bandera ondearía junto a las demás en la asamblea federal."
 frw.121.a:0 "Nos unimos a la federación."
 frw.121.b:0 "Conservamos nuestra soberanía."
 FRW_imperial_redoubt_desc:0 "Si cae la Francia metropolitana, el gobierno continuará la guerra desde el norte de África."
 FRW_imperial_redoubt_2_desc:0 "Cada colonia ha sido fortificada y su guarnición puesta en alerta."
 FRW_marshals_france_desc:0 "Disciplina en casa y paz tras unas fronteras bien armadas."
 FRW_continental_empire_spirit_desc:0 "El imperio se extiende desde el Atlántico hasta el Vístula y el Nilo."
 FRW_free_france_spirit_desc:0 "El gobierno continúa la guerra desde las colonias hasta que París sea liberado."
 FRW_brazzaville_spirit_desc:0 "En Brazzaville se prometió a las colonias un nuevo lugar en la comunidad francesa una vez terminada la guerra."
 FRW_liberation_spirit_desc:0 "París ha sido liberado y el gobierno ha regresado a la capital."
 FRW_european_partner_desc:0 "La pertenencia a la Comunidad Europea abre los mercados y laboratorios extranjeros a las empresas y científicos franceses."
 FRW_european_market_desc:0 "Las mercancías circulan ya libremente entre los Estados miembros de la Comunidad."
 FRW_fraternal_peoples_desc:0 "Las colonias liberadas están del lado de la Comuna."
 FRW_fraternal_peoples_2_desc:0 "Las colonias liberadas están del lado de la Comuna."
 FRW_fraternal_peoples_3_desc:0 "Las colonias liberadas están del lado de la Comuna."
 FRW_diplomatic_overture:0 "Acercamiento diplomático francés"
 FRW_royal_ties:0 "Vínculos con la Corona francesa"
 FRW_fascist_friendship:0 "Amistad fascista"
 FRW_lend_lease_spirit_desc:0 "El material estadounidense llega a los Franceses Libres a través de Gran Bretaña."
 FRW_resistance_spirit_desc:0 "Las redes de la Resistencia en la Francia ocupada informan a Londres."
 FRW_provisional_government_spirit_desc:0 "La República continúa en el exilio y prepara su regreso."
 FRW_fight_on_spirit_desc:0 "No se reconoce el armisticio. Cada soldado de la Francia Libre lucha como si Francia dependiera solo de él."
 FRW_oath_of_kufra_desc:0 "En Kufra, los hombres de Leclerc juraron no deponer las armas hasta que la bandera ondeara sobre Estrasburgo."
 FRW_liberation_cat:0 "La guerra de liberación"
 FRW_liberation_cat_desc:0 "Cuando los Franceses Libres controlen las principales regiones de su país, podrán ofrecer al ocupante una paz sobre la actual línea del frente, o seguir luchando por el resto."
 FRW_liberation_metropole:0 "Ofrecer la paz: Francia metropolitana"
 FRW_liberation_metropole_desc:0 "Requiere el control de §YParís§!, §YPaso de Calais§!, §YAlsacia-Lorena§!, §YAquitania§! y §YMarsella§!."
 FRW_liberation_africa:0 "Ofrecer la paz: norte de África"
 FRW_liberation_africa_desc:0 "Requiere el control de §YArgelia§!, §YTúnez§! y §YMarruecos§!."
 frw.130.t:0 "El ocupante pide condiciones"
 frw.130.d:0 "Con el corazón de Francia de nuevo bajo la tricolor, los enviados del enemigo llegan a nuestro cuartel general. Proponen un armisticio sobre la actual línea del frente. Nuestros generales creen que también podría tomarse el resto del país, a un precio."
 frw.130.a:0 "Firmar la paz."
 frw.130.a.tt:0 "Todo §Yestado del territorio nacional francés§! que Francia controle vuelve a ser francés.\n§YPaz blanca§! con todo enemigo que poseyera alguno de ellos. La capital vuelve a §YParís§! si Francia la controla."
 frw.130.b:0 "Luchar hasta que Francia sea libre."
 frw.130.b.tt:0 "La guerra continúa. §YSeguimos luchando§! durante 180 días (si no está ya activo). La oferta podrá repetirse dentro de 90 días."
 FRW_latin_destiny_spirit_desc:0 "Córcega, Cerdeña y la costa de Provenza guardan el Mediterráneo occidental para Francia."
 FRW_leader_alfonso_desc:0 "Alfonso de Borbón abandonó Madrid en abril de 1931 sin abdicar. Como heredero varón primogénito de Luis XIV, es para los legitimistas franceses el rey Alfonso I de Francia y de Navarra."
 FRW_legitimist_party:0 "Legitimistas"
 FRW_legitimist_party_long:0 "Unión Realista Legitimista"
 FRW_bourbon_pact_faction:0 "Pacto de Familia Borbónico"
 FRW_BOURBON:0 "Reino de Francia y España"
 FRW_BOURBON_DEF:0 "el Reino de Francia y España"
 FRW_BOURBON_ADJ:0 "francoespañol"
 FRW_legitimist_crown_desc:0 "La rama primogénita de los Borbones reina en Francia por primera vez desde 1830."
 FRW_legitimist_crown_2_desc:0 "La Iglesia y la Corona se apoyan mutuamente en ambos reinos."
 FRW_two_crowns_spirit_desc:0 "Francia y España comparten un rey, un plan naval y sus fábricas de armamento."
 FRW_bourbon_partner_desc:0 "España se beneficia de su alianza con el rey Borbón de Francia."
 FRW_grand_siecle_desc:0 "Un Borbón reina desde el canal de la Mancha hasta Gibraltar, como en los tiempos del Rey Sol."
 FRW_double_monarchy_idea_desc:0 "Francia y España son un solo reino bajo un solo rey Borbón."
 FRW_req_bourbon_tt:0 "§gRequiere el control de §YMadrid§! (anexionado o como títere). Si Francia aún no lo controla, el reino se funda automáticamente en cuanto lo haga.§!"
 frw.140.t:0 "El rey de Francia reclama España"
 frw.140.d:0 "El rey Borbón de París recuerda a Madrid que nunca abdicó del trono español. Pide a España que vuelva a reconocerlo como su rey. Aceptar pondría a España bajo protección francesa; negarse podría significar la guerra."
 frw.140.a:0 "¡Viva el rey!"
 frw.140.b:0 "España no será gobernada desde París."
 frw.141.t:0 "Un rey Borbón en París"
 frw.141.d:0 "Los legitimistas han proclamado rey de Francia a Alfonso de Borbón, el rey exiliado de España. El pretendiente orleanista ha protestado desde Bruselas, y en Madrid el gobierno republicano observa la situación con alarma."
 frw.141.a:0 "¿Dos tronos, un solo rey?"
 frw.142.t:0 "Las coronas de Francia y España, unidas"
 frw.142.d:0 "Más de dos siglos después de que el Tratado de Utrecht lo prohibiera, Francia y España han quedado unidas bajo un solo rey Borbón. El nuevo reino se extiende desde Dunkerque hasta Cádiz."
 frw.142.a:0 "Ya no hay Pirineos."
 frw.143.t:0 "España acepta al rey"
 frw.143.d:0 "Madrid ha reconocido a nuestro rey como rey de España y ha puesto el país bajo protección francesa."
 frw.143.a:0 "Vive le Roi! ¡Viva el Rey!"
 frw.144.t:0 "España rechaza al rey"
 frw.144.d:0 "Madrid ha rechazado la reclamación de nuestro rey. El ejército aguarda en los Pirineos."
 frw.144.a:0 "Entonces la tomaremos."
 FRW_disjointed_2_desc:0 "El carrusel de gabinetes se ha detenido, pero los ministros siguen desconfiando unos de otros y la administración obedece con lentitud."
 FRW_disjointed_3_desc:0 "El gobierno ha encontrado su equilibrio. Quedan algunas viejas rencillas."
 FRW_victors_2_desc:0 "El ejército ha empezado a cuestionar las doctrinas de 1918, pero las viejas costumbres tardan en desaparecer."
 FRW_dec_consolidate_government:0 "Consolidar el gobierno"
 FRW_dec_consolidate_government_desc:0 "Depurar los ministerios de camarillas enfrentadas y dar al gabinete una mayoría firme.\n\nDisponible desde §Y1937§!, al menos §Y6 meses§! después del inicio de la reforma, con un §Y40%§! de estabilidad: §YUn gobierno frágil§! pasa a ser §YUn gobierno en vías de estabilización§!."
 FRW_dec_stable_government:0 "Un gobierno estable"
 FRW_dec_stable_government_desc:0 "Los ministerios ejecutan sin demora los decretos del gabinete.\n\nDisponible desde §Y1938§!, al menos §Y6 meses§! después del último paso, con un §Y50%§! de estabilidad: elimina §YUn gobierno en vías de estabilización§!."
 FRW_dec_backer_blum:0 "Ganarse a Léon Blum"
 FRW_dec_backer_blum_desc:0 "Las conversaciones con Léon Blum, la SFIO y el Frente Popular duran unas seis semanas. Solo se puede cortejar a un líder de este bando a la vez.\n\nRequiere un §Y45%§! de apoyo al partido y un §Y30%§! de estabilidad. Después podrá elegirse la vía de Léon Blum en el árbol de enfoques."
 FRW_dec_backer_reynaud:0 "Ganarse a Paul Reynaud"
 FRW_dec_backer_reynaud_desc:0 "Las conversaciones con Paul Reynaud, la Alliance Démocratique y el centroderecha duran unas seis semanas. Solo se puede cortejar a un líder de este bando a la vez.\n\nRequiere un §Y45%§! de apoyo al partido y un §Y30%§! de estabilidad. Después podrá elegirse la vía de Paul Reynaud en el árbol de enfoques."
 FRW_dec_backer_thorez:0 "Ganarse a Maurice Thorez"
 FRW_dec_backer_thorez_desc:0 "Las conversaciones con Maurice Thorez, el PCF y su línea moscovita duran unas seis semanas. Solo se puede cortejar a un líder de este bando a la vez.\n\nRequiere un §Y35%§! de apoyo al partido y un §Y30%§! de estabilidad. Después podrá elegirse la vía de Maurice Thorez en el árbol de enfoques."
 FRW_dec_backer_pivert:0 "Ganarse a Marceau Pivert"
 FRW_dec_backer_pivert_desc:0 "Las conversaciones con Marceau Pivert y la Gauche Révolutionnaire duran unas seis semanas. Solo se puede cortejar a un líder de este bando a la vez.\n\nRequiere un §Y35%§! de apoyo al partido y un §Y30%§! de estabilidad. Después podrá elegirse la vía de Marceau Pivert en el árbol de enfoques."
 FRW_dec_backer_larocque:0 "Ganarse a François de La Rocque"
 FRW_dec_backer_larocque_desc:0 "Las conversaciones con François de La Rocque, las Croix-de-Feu y el PSF duran unas seis semanas. Solo se puede cortejar a un líder de este bando a la vez.\n\nRequiere un §Y35%§! de apoyo al partido y un §Y30%§! de estabilidad. Después podrá elegirse la vía de François de La Rocque en el árbol de enfoques."
 FRW_dec_backer_doriot:0 "Ganarse a Jacques Doriot"
 FRW_dec_backer_doriot_desc:0 "Las conversaciones con Jacques Doriot y el PPF duran unas seis semanas. Solo se puede cortejar a un líder de este bando a la vez.\n\nRequiere un §Y35%§! de apoyo al partido y un §Y30%§! de estabilidad. Después podrá elegirse la vía de Jacques Doriot en el árbol de enfoques."
 FRW_dec_backer_petain:0 "Ganarse al mariscal Pétain"
 FRW_dec_backer_petain_desc:0 "Las conversaciones con el mariscal Pétain, los veteranos y el ejército duran unas seis semanas. Solo se puede cortejar a un líder de este bando a la vez.\n\nRequiere un §Y35%§! de apoyo al partido y un §Y30%§! de estabilidad. Después podrá elegirse la vía del mariscal Pétain en el árbol de enfoques."
 FRW_dec_backer_orleans:0 "Ganarse al conde de París"
 FRW_dec_backer_orleans_desc:0 "Las conversaciones con el conde de París, los orleanistas y la Action Française duran unas seis semanas. Solo se puede cortejar a un líder de este bando a la vez.\n\nRequiere un §Y35%§! de apoyo al partido y un §Y30%§! de estabilidad. Después podrá elegirse la vía del conde de París en el árbol de enfoques."
 FRW_dec_backer_bonaparte:0 "Ganarse al príncipe Luis Napoleón"
 FRW_dec_backer_bonaparte_desc:0 "Las conversaciones con el príncipe Luis Napoleón y los comités bonapartistas duran unas seis semanas. Solo se puede cortejar a un líder de este bando a la vez.\n\nRequiere un §Y35%§! de apoyo al partido y un §Y30%§! de estabilidad. Después podrá elegirse la vía del príncipe Luis Napoleón en el árbol de enfoques."
 FRW_dec_backer_legit:0 "Ganarse a Alfonso de Borbón"
 FRW_dec_backer_legit_desc:0 "Las conversaciones con Alfonso de Borbón y los legitimistas duran unas seis semanas. Solo se puede cortejar a un líder de este bando a la vez.\n\nRequiere un §Y35%§! de apoyo al partido y un §Y30%§! de estabilidad. Después podrá elegirse la vía de Alfonso de Borbón en el árbol de enfoques."
