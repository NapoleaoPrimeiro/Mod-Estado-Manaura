l_spanish:
 # France Rework – spanish translation (machine-assisted, reviewed for consistency). Missing keys fall back to English.
 FRW_crisis_of_the_republic:0 "La crisis de la Tercera República"
 FRW_crisis_of_the_republic_desc:0 "Los disturbios del 6 de febrero de 1934 dejaron quince muertos en la plaza de la Concordia y derribaron al gabinete Daladier. Dos años después, los partidos siguen sin ponerse de acuerdo sobre el rumbo que debe tomar el país."
 FRW_defend_the_republic:0 "Defender la República"
 FRW_defend_the_republic_desc:0 "La Tercera República resistió cuatro años de guerra entre 1914 y 1918. Sus defensores sostienen que también podrá capear a las ligas y la depresión."
 FRW_social_truce:0 "La tregua social"
 FRW_social_truce_desc:0 "En junio de 1936, dos millones de obreros ocupan sus fábricas. Los dirigentes sindicales y la patronal son convocados al Hôtel Matignon, y nadie saldrá de allí hasta que haya un acuerdo."
 FRW_social_truce_tt:0 "Protege a Francia del §Rlevantamiento comunista§! que, de otro modo, provocaría una estabilidad baja.\nPone fin a la §YOleada de huelgas§!.\nDisponible a partir de §Yjunio de 1936§!."
 FRW_end_disjointed_government:0 "Acabar con el baile de gabinetes"
 FRW_end_disjointed_government_desc:0 "Francia ha conocido más de una docena de gabinetes desde 1930, y pocos han durado más de un año. Los ministros apenas llegan a conocer sus carteras antes de caer."
 FRW_end_disjointed_government_tt:0 "§YGobierno desarticulado§! pasa a ser §YUn gobierno frágil§!. Dos decisiones (a partir de 1937 y de 1938, separadas al menos 6 meses) lo eliminan por completo, o bien §YUna nueva constitución§! le pone fin de inmediato."
 FRW_front_populaire:0 "El Frente Popular"
 FRW_front_populaire_desc:0 "Tras las elecciones de mayo de 1936, Léon Blum forma un gobierno de socialistas y radicales, con el apoyo comunista en la Cámara, comprometido con la reforma social."
 FRW_front_populaire_tt:0 "Requiere el apoyo de §YLéon Blum§! (decisión §YGanarse a Léon Blum§!, 45 días)."
 FRW_union_nationale:0 "La Unión Nacional"
 FRW_union_nationale_desc:0 "Paul Reynaud reúne al centroderecha en torno a un programa de presupuestos equilibrados y rearme."
 FRW_union_nationale_tt:0 "Requiere el apoyo de §YPaul Reynaud§! (decisión §YGanarse a Paul Reynaud§!, 45 días)."
 FRW_matignon_reforms:0 "Los Acuerdos de Matignon"
 FRW_matignon_reforms_desc:0 "Los Acuerdos de Matignon de junio de 1936 conceden salarios más altos y la negociación colectiva. Las fábricas ocupadas se vacían y se reanuda el trabajo."
 FRW_nationalize_arms_industry:0 "Nacionalizar la industria armamentística"
 FRW_nationalize_arms_industry_desc:0 "En virtud de la ley de agosto de 1936, el Estado se hace cargo de las principales fábricas de armas, y la producción bélica pasa a manos públicas."
 FRW_conges_payes:0 "Vacaciones pagadas"
 FRW_conges_payes_desc:0 "Todo trabajador tiene ahora derecho a dos semanas de vacaciones pagadas al año. Ese verano, los trenes hacia la costa van llenos de familias que nunca han visto el mar."
 FRW_republican_volunteers:0 "Voluntarios por la República"
 FRW_republican_volunteers_desc:0 "Voluntarios franceses cruzan los Pirineos para luchar por la República española y regresan con la dura experiencia de la guerra moderna."
 FRW_plan_de_relance:0 "El plan de recuperación"
 FRW_plan_de_relance_desc:0 "El gobierno lanza un amplio programa de obras públicas e inversión para sacar a Francia de la Depresión."
 FRW_reynaud_rearmament:0 "El rearme de Reynaud"
 FRW_reynaud_rearmament_desc:0 "Reynaud pasó años advirtiendo a la Cámara sobre el rearme alemán. Ahora en el gobierno, puede actuar conforme a lo que decía en la oposición."
 FRW_decree_laws:0 "Gobernar por decreto"
 FRW_decree_laws_desc:0 "Armado con poderes de decreto, el gobierno puede aprobar medidas sin esperar a un parlamento dividido."
 FRW_armee_de_metier:0 "Hacia un ejército profesional"
 FRW_armee_de_metier_desc:0 "En «Vers l'armée de métier» (1934), el teniente coronel De Gaulle defendía un ejército profesional articulado en torno a divisiones acorazadas. Reynaud retomó la idea en la Cámara al año siguiente. Francia forma un ejército más reducido de profesionales de largo servicio."
 FRW_gaullist_presidency:0 "Una república presidencial"
 FRW_gaullist_presidency_desc:0 "Charles de Gaulle se convierte en jefe del Estado, con poderes muy superiores a los de cualquier presidente bajo la constitución de 1875."
 FRW_republican_mobilization:0 "La República en armas"
 FRW_republican_mobilization_desc:0 "En todo el país se llama a filas a los reservistas y las fábricas se vuelcan en las necesidades de la defensa nacional."
 FRW_entente_cordiale:0 "Renovar la Entente Cordiale"
 FRW_entente_cordiale_desc:0 "La Entente de 1904 resistió cuatro años en el frente occidental. París propone convertirla en una alianza permanente con Londres."
 FRW_entente_cordiale_tt:0 "Francia y §YGran Bretaña§! se unen en una misma facción (si Gran Bretaña es democrática):\n- Si Gran Bretaña lidera una facción, Francia se une a ella.\n- De lo contrario, Francia funda la §YEntente§! y Gran Bretaña se une.\nSi Gran Bretaña la controla un jugador humano, decide mediante un evento."
 FRW_union_francaise:0 "La Unión Francesa"
 FRW_union_francaise_desc:0 "París propone transformar el imperio colonial en una unión de pueblos asociados, con Francia todavía a la cabeza."
 FRW_union_francaise_tt:0 "Forma la §YUnión Francesa§!: nuevo nombre y bandera, espíritu nacional y §Gterritorio nacional en Argelia y los départements de ultramar§! (Antillas, Guayana, la Reunión) que posea Francia (también más adelante) y §Yreclamaciones§! sobre el resto de ellos.\nSustituye a cualquier nación que Francia haya formado antes (se elimina su espíritu de nación formable). Si Francia ya es el §YReino Eterno de Franquia§!, lo sigue siendo."
 FRW_little_entente_guarantees:0 "Incorporar a la Pequeña Entente"
 FRW_little_entente_guarantees_desc:0 "Checoslovaquia, Yugoslavia y Rumanía ya dependen de las garantías francesas. El Quai d'Orsay las invita ahora a una alianza formal."
 FRW_franco_british_union:0 "Unión Franco-Británica"
 FRW_franco_british_union_desc:0 "Jean Monnet y Winston Churchill hablaron ambos de unir las dos naciones bajo un solo gobierno. París presenta ahora la oferta a Londres."
 FRW_franco_british_union_tt:0 "Propone la §YUnión Franco-Británica§! a Londres (una Gran Bretaña controlada por la IA siempre acepta; un jugador humano decide):\n- Ambos países obtienen §YUnión Franco-Británica§!.\n- Francia adopta el nombre y la bandera de la Unión (esto sustituye a cualquier nación formada antes, salvo el §YReino Eterno de Franquia§!). La Unión no aporta nuevo territorio nacional."
 FRW_colonial_assembly:0 "La Asamblea Colonial"
 FRW_colonial_assembly_desc:0 "Delegados de las colonias ocupan sus escaños en una asamblea consultiva en París."
 FRW_colonial_assembly_tt:0 "Todos los estados que no son territorio nacional: §G+10%§! de colaboración."
 FRW_council_of_europe:0 "El Plan Briand"
 FRW_council_of_europe_desc:0 "En 1929, Aristide Briand propuso en Ginebra una unión europea. Sus sucesores sacan el proyecto de los archivos del Quai d'Orsay."
 FRW_council_of_europe_tt:0 "Funda la §YComunidad Europea§! (si Francia no pertenece a ninguna facción) e invita a §YBélgica§!, los §YPaíses Bajos§!, §YLuxemburgo§! y §YSuiza§!.\nLa propia §YFederación Europea§! se proclamará más adelante, cuando la Comunidad se haya consolidado."
 FRW_rhine_guarantee:0 "Guardianes del Rin"
 FRW_rhine_guarantee_desc:0 "Dos veces en setenta años los ejércitos alemanes han penetrado en Francia. El Rin debe mantenerse como la frontera de seguridad del país."
 FRW_rhine_guarantee_tt:0 "Si §YAlemania§! es fascista: objetivo de guerra §Yderrocar el gobierno§! contra Alemania."
 FRW_arsenal_of_democracy:0 "Armas para las naciones libres"
 FRW_arsenal_of_democracy_desc:0 "Las fábricas francesas producen armas para todas las democracias de Europa que aún resisten."
 FRW_european_defence_community:0 "Un consejo de defensa común"
 FRW_european_defence_community_desc:0 "Francia y sus socios ponen en común la investigación armamentística y elaboran planes de defensa conjuntos."
 FRW_franco_belgian_customs:0 "Unión aduanera con Bélgica"
 FRW_franco_belgian_customs_desc:0 "Una unión aduanera vincula las economías de Bélgica y Luxemburgo a la de Francia."
 FRW_franco_belgian_customs_tt:0 "Forma la §YUnión Occidental§!: nuevo nombre y bandera, espíritu nacional y §Gterritorio nacional en las tierras de Bélgica, los Países Bajos y Luxemburgo§! que posea Francia (también en las que obtenga allí más adelante) y §Yreclamaciones§! sobre el resto.\nSustituye a cualquier nación que Francia haya formado antes (se elimina su espíritu de nación formable). Si Francia ya es el §YReino Eterno de Franquia§!, lo sigue siendo.\nRequiere el control de §YBélgica§!, los §YPaíses Bajos§! y §YLuxemburgo§! (anexionados o como títeres, salvo que se indique lo contrario). Si Francia aún no los controla, la nación se funda automáticamente en cuanto lo haga."
 FRW_fourth_republic:0 "Una nueva constitución"
 FRW_fourth_republic_desc:0 "Las leyes de 1875 fueron una solución provisional que duró sesenta años. Una nueva constitución dota a Francia de un ejecutivo más fuerte y de gabinetes más duraderos."
 FRW_aid_spanish_republic:0 "Ayudar a la República española"
 FRW_aid_spanish_republic_desc:0 "En 1936, Blum quiso ayudar a Madrid, pero Londres y sus propios radicales se lo impidieron. Esta vez los aviones vuelan hacia el sur."
 FRW_aid_spanish_republic_tt:0 "Envía §Y2000 fusiles§! a la República española y otorga a Francia el objetivo de guerra §Yderrocar el gobierno§! contra los nacionales."
 FRW_european_customs_union:0 "La Unión Aduanera Europea"
 FRW_european_customs_union_desc:0 "El carbón, el acero y el grano cruzan ahora las fronteras de la Comunidad libres de aranceles. Los planificadores de Monnet lo describen como un mero comienzo."
 FRW_european_customs_union_tt:0 "Todos los miembros de la facción de Francia reciben §YSocio europeo§! (+5% de producción fabril, +3% de velocidad de investigación).\nRequiere a §YJean Monnet§! como asesor político (decisión §YNombrar a Jean Monnet§! en el §YConsejo de Ministros§!, departamento §YEconomía§!)."
 FRW_european_federation_focus:0 "La Federación Europea"
 FRW_european_federation_focus_desc:0 "Se pide a los Estados miembros que cedan sus ejércitos y sus monedas a un gobierno federal con sede en París. La mayoría acepta."
 FRW_european_federation_focus_tt:0 "Se invita a todas las naciones menores democráticas de Europa que formen parte de la facción de Francia o estén bajo garantía francesa a unirse a la federación (aceptar supone ser anexionadas pacíficamente). La oferta puede renovarse con la decisión §YRenovar la oferta federal§!.\nForma la §YFederación Europea§!: nuevo nombre y bandera, espíritu nacional y §Gterritorio nacional en las tierras del Benelux, Suiza, Italia, Alemania y Renania§! que posea Francia (también en las que obtenga allí más adelante) y §Yreclamaciones§! sobre el resto.\nSustituye a cualquier nación que Francia haya formado antes (se elimina su espíritu de nación formable). Si Francia ya es el §YReino Eterno de Franquia§!, lo sigue siendo.\nRequiere el control de §YBélgica§!, los §YPaíses Bajos§! y §YLuxemburgo§! (anexionados, como títeres o unidos a través de la federación); tras este enfoque ya no se necesitan §YItalia§! ni §YAlemania§!. Si Francia aún no los controla, la nación se funda automáticamente en cuanto lo haga."
 FRW_forty_hour_week:0 "La semana de cuarenta horas"
 FRW_forty_hour_week_desc:0 "La ley de junio de 1936 limita la semana laboral a cuarenta horas. Los obreros la celebran, mientras que los patronos se quejan de los costes."
 FRW_pierre_cot_aviation:0 "Aviación popular"
 FRW_pierre_cot_aviation_desc:0 "El ministro del Aire, Pierre Cot, nacionaliza las fábricas de aviones y abre los aeroclubes a los hijos de los obreros."
 FRW_jean_zay_reforms:0 "Las reformas de Jean Zay"
 FRW_jean_zay_reforms_desc:0 "El ministro de Educación, Jean Zay, eleva la edad de escolarización obligatoria y funda el servicio de investigación que se convertirá en el CNRS."
 FRW_relax_forty_hours:0 "Prioridad para los arsenales"
 FRW_relax_forty_hours_desc:0 "La semana de cuarenta horas sigue siendo ley, pero las fábricas de armas quedan exentas y pueden hacer horas extraordinarias."
 FRW_bread_peace_liberty:0 "Pan, paz y libertad"
 FRW_bread_peace_liberty_desc:0 "«Pan, paz y libertad» fue el lema electoral del Frente Popular en 1936. El gobierno lo asume ahora como su programa."
 FRW_reynaud_recovery:0 "Los decretos Reynaud"
 FRW_reynaud_recovery_desc:0 "Como ministro de Finanzas, Reynaud flexibiliza la semana de cuarenta horas, devuelve la confianza a los inversores y hace regresar el capital a Francia."
 FRW_mandel_colonies:0 "El Ministerio de Colonias de Mandel"
 FRW_mandel_colonies_desc:0 "Georges Mandel, ministro de Colonias, promete reclutar un gran ejército colonial para defender la Francia metropolitana."
 FRW_mandel_colonies_tt:0 "Requiere a §YGeorges Mandel§! como asesor político (decisión §YNombrar a Georges Mandel§! en el §YConsejo de Ministros§!, departamento §YPolítica§!)."
 FRW_edge_of_the_sword:0 "El filo de la espada"
 FRW_edge_of_the_sword_desc:0 "La división acorazada que describió De Gaulle se convierte en el modelo para el resto del ejército. «Le Fil de l'épée», el ensayo de De Gaulle sobre el mando de 1932, entra en la lista de lecturas de la École de Guerre."
 FRW_certaine_idee:0 "Una cierta idea de Francia"
 FRW_certaine_idee_desc:0 "De Gaulle sostiene desde hace tiempo que Francia solo es ella misma cuando se sitúa en primera fila entre las naciones. Como presidente, se propone construir una República sobre esa convicción."
 FRW_protect_austria:0 "Proteger la independencia austriaca"
 FRW_protect_austria_desc:0 "Austria se encuentra expuesta entre Berlín y Roma. París le ofrece su protección y espera que, a cambio, Viena siga la política francesa."
 FRW_libyan_border:0 "Garantizar los Países Bajos"
 FRW_libyan_border_desc:0 "Como en Locarno en 1925, Francia se erige en garante de sus vecinos. París considerará un ataque contra Bruselas, La Haya o Luxemburgo como un ataque contra Francia."
 FRW_workers_popular_front:0 "El Frente Obrero"
 FRW_workers_popular_front_desc:0 "El PCF rompe con sus socios burgueses del Frente Popular y llama a los obreros a tomar el poder por sí mismos."
 FRW_truce_unity_of_action:0 "Unidad de acción"
 FRW_truce_unity_of_action_desc:0 "En 1934, el PCF y la SFIO firmaron un pacto para dejar de atacarse y marchar juntos contra las ligas. Ahora el Partido exige a los obreros que lo cumplan, bajo su propia bandera."
 FRW_truce_unity_of_action_tt:0 "Protege a Francia del §Rlevantamiento comunista§! que, de otro modo, provocaría una estabilidad baja.\nPone fin a la §YOleada de huelgas§!.\nDisponible a partir de §Yjunio de 1936§!."
 FRW_cgt_general_strike:0 "La huelga general de la CGT"
 FRW_cgt_general_strike_desc:0 "Millones de obreros abandonan el trabajo a la llamada de la CGT y las fábricas enmudecen. Puede que el gobierno no sobreviva a la semana."
 FRW_proclaim_the_commune:0 "Proclamar la Comuna"
 FRW_proclaim_the_commune_desc:0 "En 1871, París se alzó en solitario y fue aplastada. Esta vez las provincias se alzan junto a la capital."
 FRW_proclaim_the_commune_tt:0 "§YGobierno desarticulado§! pasa a ser §YUn gobierno frágil§!. Dos decisiones (a partir de 1937 y de 1938, separadas al menos 6 meses) lo eliminan por completo."
 FRW_thorez_party_line:0 "Thorez toma el poder"
 FRW_thorez_party_line_desc:0 "Bajo Maurice Thorez, Francia alinea estrechamente su política con la de Moscú."
 FRW_thorez_party_line_tt:0 "Requiere el apoyo de §YMaurice Thorez§! (decisión §YGanarse a Maurice Thorez§!, 45 días)."
 FRW_pivert_revolution:0 "¡Todo es posible!"
 FRW_pivert_revolution_desc:0 "Marceau Pivert y la Gauche Révolutionnaire reclaman una democracia de consejos obreros, independiente de Moscú."
 FRW_pivert_revolution_tt:0 "Requiere el apoyo de §YMarceau Pivert§! (decisión §YGanarse a Marceau Pivert§!, 45 días)."
 FRW_five_year_plan_fr:0 "El Plan Quinquenal francés"
 FRW_five_year_plan_fr_desc:0 "Siguiendo el modelo del Gosplan soviético, comisarios de cada departamento fijan cuotas de carbón, acero y grano. Las fábricas Renault de Billancourt reciben ahora sus órdenes del plan y no del mercado."
 FRW_soviet_military_mission:0 "Misión militar soviética"
 FRW_soviet_military_mission_desc:0 "Oficiales del Ejército Rojo llegan a París para enseñar al Estado Mayor francés la teoría de las operaciones en profundidad."
 FRW_join_comintern:0 "Unirse a la Komintern"
 FRW_join_comintern_desc:0 "El Partido sostiene que la revolución no puede triunfar en un solo país. París se une a Moscú y a los movimientos obreros extranjeros en la Internacional Comunista."
 FRW_join_comintern_tt:0 "Solicita a la §YUnión Soviética§! unirse a su facción. Si los soviéticos no lideran ninguna facción, Francia funda el §YFrente Rojo§! y los invita."
 FRW_red_army_of_france:0 "El Ejército Rojo de Francia"
 FRW_red_army_of_france_desc:0 "El ejército se reorganiza según el modelo soviético, con comisarios políticos asignados a sus unidades."
 FRW_workers_councils:0 "Consejos obreros"
 FRW_workers_councils_desc:0 "Consejos de obreros elegidos asumen la gestión de las fábricas."
 FRW_revolutionary_militias:0 "Milicias revolucionarias"
 FRW_revolutionary_militias_desc:0 "La Comuna de 1871 comenzó cuando el gobierno de Versalles intentó llevarse los cañones de Montmartre. Esta vez, cada fábrica y cada barrio conserva una milicia obrera armada."
 FRW_export_the_revolution:0 "Exportar la revolución"
 FRW_export_the_revolution_desc:0 "Los dirigentes del Partido sostienen que la revolución no puede quedar confinada a Francia."
 FRW_iberian_revolution:0 "Revolución en Iberia"
 FRW_iberian_revolution_desc:0 "Los comunistas y los sindicatos españoles piden armas a París contra los generales."
 FRW_iberian_revolution_tt:0 "Objetivo de guerra §Yderrocar el gobierno§! contra §YEspaña§! (salvo que España sea comunista o aliada)."
 FRW_red_navy_of_toulon:0 "La Flota y la Aviación Rojas"
 FRW_red_navy_of_toulon_desc:0 "El motín del mar Negro de 1919, encabezado entre otros por André Marty, sigue vivo en la memoria de la flota. Los marineros de Tolón custodian ahora los buques en nombre del pueblo. Los jóvenes obreros aprenden a volar en los aeroclubes del Partido."
 FRW_red_industry:0 "Industria roja"
 FRW_red_industry_desc:0 "Le Creusot y las acerías de los De Wendel pasan al Estado. Los objetivos de producción sustituyen a los dividendos."
 FRW_liberate_colonies:0 "Liberar las colonias"
 FRW_liberate_colonies_desc:0 "Una Francia socialista no puede mantener colonias por la fuerza. Marruecos y Túnez se convierten en repúblicas hermanas independientes."
 FRW_liberate_colonies_tt:0 "§YMarruecos§! y §YTúnez§! se liberan como satélites comunistas (si Francia los posee) y §YPueblos hermanos§! sube un nivel."
 FRW_union_of_european_socialist_republics:0 "Estados Socialistas Unidos de Europa"
 FRW_union_of_european_socialist_republics_desc:0 "El Partido aspira a una unión socialista de Europa, libre de fronteras y de capitalistas."
 FRW_union_of_european_socialist_republics_tt:0 "Objetivo de guerra §Yderrocar el gobierno§! contra §YBélgica§!, los §YPaíses Bajos§! y §YLuxemburgo§! (salvo que ya sean comunistas, súbditos de Francia o aliados).\nForma la §YFederación Europea§!: nuevo nombre y bandera, espíritu nacional y §Gterritorio nacional en las tierras del Benelux, Suiza, Italia, Alemania y Renania§! que posea Francia (también en las que obtenga allí más adelante) y §Yreclamaciones§! sobre el resto.\nSustituye a cualquier nación que Francia haya formado antes (se elimina su espíritu de nación formable). Si Francia ya es el §YReino Eterno de Franquia§!, lo sigue siendo.\nRequiere el control de §YBélgica§!, los §YPaíses Bajos§! y §YLuxemburgo§!, además de §YItalia§! o §YAlemania§! (anexionados o como títeres, salvo que se indique lo contrario). Si Francia aún no los controla, la nación se funda automáticamente en cuanto lo haga."
 FRW_peoples_science:0 "Ciencia para el pueblo"
 FRW_peoples_science_desc:0 "Frédéric Joliot-Curie y otros científicos ponen sus laboratorios al servicio de la revolución."
 FRW_internationale_victory:0 "La lucha final"
 FRW_internationale_victory_desc:0 "La Internacional resuena en las calles mientras el Ejército Rojo de Francia se pone en marcha."
 FRW_purge_deviationists:0 "Purgar a los desviacionistas"
 FRW_purge_deviationists_desc:0 "Trotskistas, seguidores de Pivert y otros «enemigos del Partido» son expulsados del PCF y de la CGT."
 FRW_fils_du_peuple:0 "Hijo del pueblo"
 FRW_fils_du_peuple_desc:0 "La autobiografía de Thorez, «Fils du peuple», se imprime en millones de ejemplares. El hijo de minero del Paso de Calais mira desde los carteles de todas las sedes del Partido."
 FRW_second_five_year_plan:0 "El Segundo Plan Quinquenal"
 FRW_second_five_year_plan_desc:0 "El segundo plan antepone la industria pesada y la electrificación a todo lo demás."
 FRW_political_commissars:0 "Comisarios políticos"
 FRW_political_commissars_desc:0 "Se asigna un comisario a cada regimiento, y el ejército responde ahora ante el Partido."
 FRW_bastion_of_the_west:0 "Bastión de la revolución"
 FRW_bastion_of_the_west_desc:0 "París es la capital del socialismo en Europa Occidental. Delegaciones obreras de Londres, Bruselas y Barcelona llegan en cada tren."
 FRW_federation_of_communes:0 "Una federación de comunas"
 FRW_federation_of_communes_desc:0 "Se suprimen los prefectos y cada comuna se gobierna a sí misma a través de su consejo electo. En pueblos y ciudades de toda Francia abren clases nocturnas. Los obreros que se hicieron con las fábricas llenan ahora las aulas."
 FRW_aid_the_poum:0 "Ayudar a los camaradas ibéricos"
 FRW_aid_the_poum_desc:0 "Fusiles, camiones y voluntarios cruzan los Pirineos para llegar al POUM y a la izquierda antiestalinista de Barcelona."
 FRW_workers_army:0 "De las milicias a un ejército obrero"
 FRW_workers_army_desc:0 "Las milicias reciben oficiales, instrucción regular y armamento pesado sin renunciar a sus comités electos."
 FRW_republic_of_labour:0 "La República del Trabajo"
 FRW_republic_of_labour_desc:0 "Los seguidores de Pivert describen el nuevo Estado como una libre asociación de productores, dirigida ni por capitalistas ni por burócratas."
 FRW_workers_belgium:0 "Abajo Salazar"
 FRW_workers_belgium_desc:0 "En Lisboa, el Estado Novo de Salazar mantiene sometido al movimiento obrero. Con España en manos revolucionarias, Portugal se verá aislado."
 FRW_smash_italian_fascism:0 "Aplastar el fascismo italiano"
 FRW_smash_italian_fascism_desc:0 "Mussolini gobierna Italia desde 1922, más tiempo que ningún otro líder fascista de Europa. Los exiliados italianos en Francia aseguran que los obreros de su país están listos para alzarse."
 FRW_red_switzerland:0 "Las Brigadas Internacionales"
 FRW_red_switzerland_desc:0 "Voluntarios de muchas naciones parten de la Gare d'Austerlitz hacia España, franceses junto a alemanes, polacos y estadounidenses. París se ha convertido en la oficina de reclutamiento de la revolución mundial."
 FRW_red_switzerland_tt:0 "Requiere a §YAndré Marty§! como asesor político (decisión §YNombrar a André Marty§! en el §YConsejo de Ministros§!, departamento §YPolítica§!)."
 FRW_national_renewal:0 "Renovación nacional"
 FRW_national_renewal_desc:0 "Las ligas vuelven a marchar y gritan «À bas les voleurs!» contra la República."
 FRW_truce_labour_charter:0 "El orden corporativo"
 FRW_truce_labour_charter_desc:0 "Se prohíben las huelgas y los cierres patronales. Obreros y patronos de cada oficio se sientan juntos en una misma corporación, y el Estado zanja lo que ellos no logran resolver."
 FRW_truce_labour_charter_tt:0 "Protege a Francia del §Rlevantamiento comunista§! que, de otro modo, provocaría una estabilidad baja.\nPone fin a la §YOleada de huelgas§!.\nDisponible a partir de §Yjunio de 1936§!."
 FRW_february_sixth:0 "Asaltar el Palais Bourbon"
 FRW_february_sixth_desc:0 "El 6 de febrero de 1934, las ligas fueron detenidas en el puente de la Concordia. Esta vez pretenden cruzarlo."
 FRW_national_revolution:0 "La Revolución Nacional"
 FRW_national_revolution_desc:0 "La República cae y un gobierno nacionalista autoritario ocupa su lugar."
 FRW_national_revolution_tt:0 "§YGobierno desarticulado§! pasa a ser §YUn gobierno frágil§!. Dos decisiones (a partir de 1937 y de 1938, con al menos 6 meses de separación) lo eliminan por completo."
 FRW_la_rocque_psf:0 "Trabajo, Familia, Patria"
 FRW_la_rocque_psf_desc:0 "El coronel de La Rocque y su Parti Social Français aspiran a un Estado católico y nacional que evite las aventuras en el extranjero."
 FRW_la_rocque_psf_tt:0 "Requiere el apoyo de §YFrançois de La Rocque§! (decisión §YGanarse a François de La Rocque§!, 45 días)."
 FRW_doriot_ppf:0 "El Partido Popular Francés"
 FRW_doriot_ppf_desc:0 "Jacques Doriot, expulsado del Partido Comunista en 1934, dirige ahora el PPF y aspira a un Estado totalitario de masas."
 FRW_doriot_ppf_tt:0 "Requiere el apoyo de §YJacques Doriot§! (decisión §YGanarse a Jacques Doriot§!, 45 días)."
 FRW_corporatist_state:0 "El Estado corporativo"
 FRW_corporatist_state_desc:0 "Patronos y obreros de cada oficio se agrupan en corporaciones bajo la supervisión del Estado."
 FRW_latin_bloc:0 "El Bloque Latino"
 FRW_latin_bloc_desc:0 "Francia, España, Portugal e Italia se acercan entre sí como un bloque de naciones latinas situado entre Berlín y Moscú."
 FRW_latin_bloc_tt:0 "Funda la facción §YBloque Latino§! e invita a §YItalia§!, §YEspaña§! y §YPortugal§!.\nEl §YImperio Latino§! se proclama más adelante con §YLiderazgo de la Europa latina§!."
 FRW_colonial_legions:0 "Legiones coloniales"
 FRW_colonial_legions_desc:0 "Los reclutas de Senegal, Madagascar e Indochina se organizan en legiones al mando de oficiales franceses."
 FRW_restore_french_honour:0 "La herencia saboyana"
 FRW_restore_french_honour_desc:0 "Saboya y Niza son francesas desde el Tratado de Turín de 1860. También se reclama Ginebra, largamente pretendida por los duques de Saboya. El Piamonte se deja a Roma, socia de Francia en el Bloque Latino."
 FRW_totalitarian_party:0 "El partido único"
 FRW_totalitarian_party_desc:0 "Las Cámaras, las ligas y los viejos partidos quedan disueltos por decreto. El PPF se convierte en el único partido legal de Francia."
 FRW_totalitarian_party_tt:0 "Requiere a §YPaul Marion§! como asesor político (decisión §YNombrar a Paul Marion§! en el §YConsejo de Ministros§!, departamento §YPolítica§!)."
 FRW_approach_germany:0 "Acercamiento a Berlín"
 FRW_approach_germany_desc:0 "Doriot cree que Europa será dirigida por las potencias fascistas y quiere a Francia a su lado."
 FRW_greater_france_claims:0 "La Gran Francia"
 FRW_greater_france_claims_desc:0 "En la Romandía y el Valais se habla francés, y Mussolini codicia Niza, Saboya y Córcega. París responde con su propio mapa: la Romandía, el Piamonte y el valle de Aosta, y Cerdeña, al otro lado del estrecho frente a Córcega."
 FRW_march_on_brussels:0 "Ultimátum a Ginebra"
 FRW_march_on_brussels_desc:0 "Ginebra acoge a la Sociedad de Naciones, a los emigrados políticos y al oro extranjero hostil al régimen. Doriot ha enviado su ultimátum una vez y no piensa enviar otro."
 FRW_march_on_brussels_tt:0 "Objetivo de guerra de §Yanexión§! contra §YSuiza§! (salvo que sea aliada).\nDisponible a partir de §Yenero de 1937§!."
 FRW_national_rearmament:0 "Rearme nacional"
 FRW_national_rearmament_desc:0 "El gobierno se propone que el ejército francés vuelva a ser el más poderoso del continente."
 FRW_mediterranean_ambition:0 "Señora del Mediterráneo"
 FRW_mediterranean_ambition_desc:0 "Tolón, Bizerta, Argel y Beirut dan a Francia puertos en todas las orillas del Mediterráneo. Se espera que Roma acepte la primacía francesa en el mar, como socia bajo La Rocque o como rival derrotada bajo Doriot."
 FRW_french_state_youth:0 "La Juventud Nacional"
 FRW_french_state_youth_desc:0 "Las escuelas y las organizaciones juveniles pasan a control del Estado y se las educa para servir a la nación."
 FRW_french_imperium:0 "La misión imperial"
 FRW_french_imperium_desc:0 "De Dakar a Hanói, el imperio solo responde ante París."
 FRW_nouvel_ordre:0 "Liderazgo de la Europa latina"
 FRW_nouvel_ordre_desc:0 "Roma, Madrid y Lisboa buscan en París un liderazgo. Francia propone un bloque de naciones latinas bajo su dirección."
 FRW_nouvel_ordre_tt:0 "Objetivo de guerra de §Ytítere§! contra §YEspaña§! y §YPortugal§! (salvo que sean súbditos o aliados de Francia).\nForma el §YImperio Latino§!: nuevo nombre y bandera, espíritu nacional y §Gterritorios nacionales en las tierras de Italia, España y Portugal§! que posea Francia (también en las que obtenga allí más adelante) y §Yreclamaciones§! sobre el resto.\nSustituye a cualquier nación que Francia haya formado antes (se elimina su espíritu de formación). Si Francia ya es el §YReino Eterno de Franquia§!, lo sigue siendo.\nRequiere el control de §YItalia§!, §YEspaña§! y §YPortugal§! (anexionados o como títeres, salvo que se indique lo contrario). Si Francia aún no los controla, la nación se funda automáticamente en cuanto lo haga."
 FRW_african_empire_fascist:0 "La cuestión tunecina"
 FRW_african_empire_fascist_desc:0 "En noviembre de 1938, los diputados italianos gritaron 'Tunisi, Corsica, Nizza!' en la Cámara de Roma. La respuesta de París es concreta: la Línea Mareth, en el sur de Túnez, se mantendrá."
 FRW_corporative_chambers:0 "Las Cámaras corporativas"
 FRW_corporative_chambers_desc:0 "Cámaras de patronos y obreros asumen el papel del Senado en la legislación económica."
 FRW_volontaires_nationaux:0 "Los Voluntarios Nacionales"
 FRW_volontaires_nationaux_desc:0 "Los Volontaires Nationaux, el ala juvenil del PSF, reciben instrucción como una reserva nacional disciplinada."
 FRW_volontaires_nationaux_tt:0 "Requiere a §YJean Ybarnégaray§! como asesor político (decisión §YNombrar a Jean Ybarnégaray§! en el §YConsejo de Ministros§!, departamento §YPolítica§!)."
 FRW_social_catholicism:0 "Catolicismo social"
 FRW_social_catholicism_desc:0 "La caridad, los subsidios familiares y los sindicatos católicos son el remedio del PSF contra la lucha de clases."
 FRW_friendship_with_lisbon:0 "Amistad con Lisboa y Madrid"
 FRW_friendship_with_lisbon_desc:0 "Salazar gobierna Portugal desde 1932 sin buscar la guerra. La Rocque señala el Estado Novo como prueba de que el orden y la paz pueden ir de la mano."
 FRW_french_social_state:0 "El Estado social francés"
 FRW_french_social_state_desc:0 "La Rocque promete una Francia construida sobre el trabajo, la familia y la fe católica, gobernada con orden y en paz consigo misma."
 FRW_purge_the_reds:0 "Purgar a los rojos"
 FRW_purge_the_reds_desc:0 "Doriot fue en su día el alcalde comunista de Saint-Denis. Conoce a sus antiguos camaradas por su nombre y ahora dispone de la policía para detenerlos."
 FRW_purge_the_reds_tt:0 "Popularidad comunista: §R-10%§!"
 FRW_anti_bolshevik_crusade:0 "La cruzada antibolchevique"
 FRW_anti_bolshevik_crusade_desc:0 "Doriot llama a las naciones de Europa a unirse contra Moscú."
 FRW_party_militia:0 "La milicia del partido"
 FRW_party_militia_desc:0 "El service d'ordre del PPF recibe armas y se convierte en la guardia del régimen."
 FRW_pact_with_berlin:0 "El pacto con Berlín"
 FRW_pact_with_berlin_desc:0 "Dos veces en setenta años Francia y Alemania se han hecho la guerra. Ahora París pide unirse a la alianza alemana."
 FRW_pact_with_berlin_tt:0 "Pide a §YAlemania§! que permita a Francia unirse a su facción (si Alemania es fascista y lidera una)."
 FRW_cult_of_the_chef:0 "El culto al Jefe"
 FRW_cult_of_the_chef_desc:0 "Un retrato de Doriot cuelga en cada ayuntamiento. El partido y el Estado obedecen únicamente al Chef."
 FRW_seize_libya:0 "Tomar Libia"
 FRW_seize_libya_desc:0 "Trípoli y el Fezzán unirían Túnez con el África Occidental y el África Ecuatorial francesas. Hay que obligar a Italia a cederlos."
 FRW_swiss_protectorate:0 "Mare Nostrum"
 FRW_swiss_protectorate_desc:0 "Mussolini llama al Mediterráneo «mare nostrum». París no está de acuerdo, y Tolón, Bizerta y Mers el-Kébir se acondicionan como bases de una flota capaz de dominarlo."
 FRW_demand_spanish_morocco:0 "Exigir el Fezzán"
 FRW_demand_spanish_morocco_desc:0 "En los acuerdos Laval-Mussolini de enero de 1935, Francia prometió a Italia una franja del Sáhara. El nuevo gobierno los repudia y exige en su lugar el Fezzán."
 FRW_above_the_parties:0 "Por encima de los partidos"
 FRW_above_the_parties_desc:0 "Muchos en Francia han perdido la fe en los comunistas, en las ligas fascistas y en un parlamento manchado por los escándalos. Quieren una mano firme al frente."
 FRW_truce_national_concord:0 "La tregua de los partidos"
 FRW_truce_national_concord_desc:0 "Tras los disturbios de febrero de 1934, Gaston Doumergue gobernó con ministros de todos los bandos bajo una tregua de los partidos. Es hora de convocar otra."
 FRW_truce_national_concord_tt:0 "Protege a Francia del §Rlevantamiento comunista§! que, de otro modo, provocaría la baja estabilidad.\nPone fin a la §YOleada de huelgas§!.\nDisponible en §Yjunio de 1936§!."
 FRW_suspend_the_chambers:0 "Suspender las Cámaras"
 FRW_suspend_the_chambers_desc:0 "El presidente Lebrun se niega a nombrar un gabinete más. La Cámara de Diputados y el Senado quedan suspendidos indefinidamente."
 FRW_suspend_the_chambers_tt:0 "§YGobierno desarticulado§! pasa a ser §YUn gobierno frágil§!. Dos decisiones (a partir de 1937 y de 1938, con al menos 6 meses de separación) lo eliminan por completo.\nSe manda a casa a las Cámaras. Nadie sabe qué llenará semejante silencio..."
 FRW_secret_captain:0 "El capitán de Saint-Malo"
 FRW_secret_captain_desc:0 "La carta de Ginebra reposa sobre el escritorio de un ministerio vacío. Su autor, un capitán de navío bretón de sangre polaca y fortuna de origen incierto, solo pide que lo llamen. Llega con una sola maleta, un sable de oficial polaco y una bandera negra doblada en el fondo de su baúl. Nadie más se ha ofrecido a gobernar Francia."
 FRW_secret_captain_tt:0 "§YMalo Kervadec§! se convierte en líder de Francia.\nFrancia y §YPolonia§! se acercan.\nSe abre un camino oculto: los §YHermanos de la Costa§!, las §YIslas§! e §YIberia§!."
 FRW_etat_francais:0 "El Estado francés"
 FRW_etat_francais_desc:0 "El mariscal Pétain, vencedor de Verdún en 1916, toma el poder como jefe del Estado."
 FRW_etat_francais_tt:0 "Requiere el apoyo del §Ymariscal Pétain§! (decisión §YGanarse al mariscal Pétain§!, 45 días)."
 FRW_return_to_the_land:0 "Retorno a la tierra"
 FRW_return_to_the_land_desc:0 "«La terre, elle, ne ment pas.» El régimen confía en el campesinado para renovar Francia."
 FRW_fortress_france:0 "Fortaleza Francia"
 FRW_fortress_france_desc:0 "En Verdún, en 1916, Pétain aprendió que la potencia de fuego decide las batallas. Planifica la defensa de Francia en consecuencia. Los veteranos de 1914-1918 se agrupan en una sola Legión, que se convierte en el principal apoyo del régimen."
 FRW_corporation_paysanne:0 "La Corporación Campesina"
 FRW_corporation_paysanne_desc:0 "Se crea una corporación campesina nacional para organizar la agricultura y asegurar el abastecimiento de alimentos."
 FRW_weygand_staff:0 "El Estado Mayor del general Weygand"
 FRW_weygand_staff_desc:0 "El general Weygand revisa la doctrina defensiva del ejército y moderniza su equipamiento."
 FRW_armee_d_afrique:0 "El Ejército de África"
 FRW_armee_d_afrique_desc:0 "Las divisiones de la Armée d'Afrique en Argelia, Marruecos y Túnez se convierten en la reserva estratégica del imperio."
 FRW_armed_neutrality:0 "Neutralidad armada"
 FRW_armed_neutrality_desc:0 "Francia declara que no participará en ninguna guerra extranjera. Cualquier ataque contra su territorio será respondido con la fuerza."
 FRW_redoubt_of_the_empire:0 "El reducto del Imperio"
 FRW_redoubt_of_the_empire_desc:0 "Se trazan planes para continuar la guerra desde Argel en caso de que la Francia metropolitana sea invadida."
 FRW_charte_du_travail:0 "La Carta del Trabajo"
 FRW_charte_du_travail_desc:0 "Se prohíben las huelgas y los cierres patronales. Comités mixtos de patronos y obreros resuelven los conflictos en cada oficio."
 FRW_charte_du_travail_tt:0 "Requiere a §YJean Bichelonne§! como asesor político (decisión §YNombrar a Jean Bichelonne§! en el §YConsejo de Ministros§!, departamento §YEconomía§!)."
 FRW_chantiers_de_jeunesse:0 "Campos de trabajo juveniles"
 FRW_chantiers_de_jeunesse_desc:0 "Todo joven de veinte años pasa ocho meses en los campos, talando árboles y aprendiendo instrucción militar."
 FRW_cult_of_the_marshal:0 "¡Mariscal, aquí estamos!"
 FRW_cult_of_the_marshal_desc:0 "Los escolares aprenden a cantar «Maréchal, nous voilà». En muchos ayuntamientos su retrato cuelga ahora donde antes estaba el busto de Marianne."
 FRW_darlan_admiralty:0 "Darlan en el Almirantazgo"
 FRW_darlan_admiralty_desc:0 "El almirante Darlan mantiene intacta la flota. Para una Francia neutral, es su mejor baza negociadora."
 FRW_unconquerable_france:0 "Francia inexpugnable"
 FRW_unconquerable_france_desc:0 "Las defensas se extienden desde la Línea Maginot hasta los pasos del Atlas. Un invasor pagaría muy caro cada metro."
 FRW_order_in_the_rif:0 "Orden en el Rif"
 FRW_order_in_the_rif_desc:0 "En 1925, Pétain asumió el mando contra Abd el-Krim y puso fin a la Guerra del Rif. España nunca ha controlado firmemente la región, y ahora Francia se ofrece a hacerlo."
 FRW_latin_neutral_bloc:0 "El Bloque Latino Neutral"
 FRW_latin_neutral_bloc_desc:0 "Franco, Salazar y el Consejo Federal suizo comparten el objetivo del mariscal de mantenerse al margen de la próxima guerra. Si actúan juntos, quizá lo logren."
 FRW_latin_neutral_bloc_tt:0 "Funda el §YBloque Latino Neutral§! (si Francia no pertenece a ninguna facción) y, si Francia lidera su facción, invita a §YEspaña§!, §YPortugal§! y §YSuiza§!."
 FRW_empire_stands_guard:0 "El Imperio monta guardia"
 FRW_empire_stands_guard_desc:0 "Weygand inspecciona las guarniciones desde Dakar hasta Beirut. Se ordena al ejército colonial que esté preparado ante un ataque de cualquiera de los dos bandos."
 FRW_marshals_peace:0 "La paz del mariscal"
 FRW_marshals_peace_desc:0 "Mientras las grandes potencias se desgastan mutuamente, Francia se reconstruye tras sus fronteras. El mariscal ha prometido que ningún francés morirá por Danzig ni por Moscú."
 FRW_orleanist_restoration:0 "La restauración orleanista"
 FRW_orleanist_restoration_desc:0 "Enrique de Orleans, conde de París, regresa del exilio y es proclamado rey Enrique VI."
 FRW_orleanist_restoration_tt:0 "Requiere el apoyo del §Yconde de París§! (decisión §YGanarse al conde de París§!, 45 días)."
 FRW_charter_of_1830:0 "Renovar la Carta"
 FRW_charter_of_1830_desc:0 "Una nueva constitución inspirada en la Carta de 1830 vincula la corona a las clases propietarias."
 FRW_royal_diplomacy:0 "Diplomacia real"
 FRW_royal_diplomacy_desc:0 "La Casa de Orleans está emparentada por matrimonio con muchas de las familias reinantes de Europa."
 FRW_action_francaise_ministers:0 "Ministros de la Action Française"
 FRW_action_francaise_ministers_desc:0 "Por primera vez, miembros de la Action Française de Charles Maurras entran en el gobierno."
 FRW_royal_army:0 "El Ejército Real"
 FRW_royal_army_desc:0 "Los oficiales prestan juramento al rey. A cambio, reciben los fondos que la República les negaba."
 FRW_parliamentary_monarchy:0 "Monarquía parlamentaria"
 FRW_parliamentary_monarchy_desc:0 "Siguiendo el modelo británico, el rey reina mientras sus ministros gobiernan."
 FRW_absolute_crown:0 "La Corona gobierna"
 FRW_absolute_crown_desc:0 "Enrique VI gobierna en persona, apoyándose en el ejército y la Iglesia."
 FRW_crown_of_the_franks:0 "El legado de Carlomagno"
 FRW_crown_of_the_franks_desc:0 "Valonia y Luxemburgo pertenecieron en otro tiempo a la corona francesa, y Carlomagno tuvo su corte en Aquisgrán."
 FRW_crown_of_the_franks_tt:0 "Objetivo de guerra contra §YAlemania§! por §YRenania§! y §YMosela§! (salvo que Francia ya los posea).\nForma el §YImperio Franco§!: nuevo nombre y bandera, espíritu nacional y §Gterritorios nacionales en las tierras de los Países Bajos, Renania, Suiza y el norte de Italia§! que posea Francia (también en las que obtenga allí más adelante) y §Yreclamaciones§! sobre el resto.\nSustituye a cualquier nación que Francia haya formado antes (se elimina su espíritu de formación). Si Francia ya es el §YReino Eterno de Franquia§!, lo sigue siendo.\nRequiere el control de §YRenania§!, §YMosela§!, §YBélgica§! y los §YPaíses Bajos§! (anexionados o como títeres, salvo que se indique lo contrario). Si Francia aún no los controla, la nación se funda automáticamente en cuanto lo haga."
 FRW_catholic_revival:0 "Renacimiento católico"
 FRW_catholic_revival_desc:0 "La Iglesia da su bendición a la monarquía restaurada."
 FRW_holy_alliance:0 "Una nueva Santa Alianza"
 FRW_holy_alliance_desc:0 "Las monarquías de Europa se unen en una liga contra la revolución y la guerra."
 FRW_holy_alliance_tt:0 "Funda la facción §YSanta Alianza§!."
 FRW_kings_government:0 "El gobierno del rey"
 FRW_kings_government_desc:0 "El rey nombra un gabinete de concordia nacional, que la Cámara confirma a continuación. La Académie des Sciences encuentra en el nuevo rey un generoso mecenas."
 FRW_conseil_du_roi:0 "El Consejo del Rey"
 FRW_conseil_du_roi_desc:0 "Como hizo Luis XIV, el rey gobierna con un reducido consejo de asesores de confianza."
 FRW_provinces_restored:0 "Restaurar las provincias"
 FRW_provinces_restored_desc:0 "Los departamentos creados en 1790 ceden de nuevo su lugar a las provincias históricas, como Normandía y Bretaña."
 FRW_most_christian_king:0 "El Rey Cristianísimo"
 FRW_most_christian_king_desc:0 "Enrique VI es ungido en la catedral de Reims, donde fueron coronados los reyes de Francia durante siglos."
 FRW_belgian_crown:0 "La Marina del Rey"
 FRW_belgian_crown_desc:0 "La marina ha sido durante mucho tiempo el cuerpo más monárquico de Francia. Bajo la flor de lis ha de recuperar su antiguo prestigio."
 FRW_luxembourg_protectorate:0 "Las Academias Reales"
 FRW_luxembourg_protectorate_desc:0 "Luis XIV fundó la Académie des sciences en 1666. La corona pretende volver a ser su mecenas."
 FRW_bonapartist_appeal:0 "La llamada del Águila"
 FRW_bonapartist_appeal_desc:0 "Los comités bonapartistas reclaman el regreso del príncipe Luis Napoleón."
 FRW_bonapartist_appeal_tt:0 "Requiere el apoyo del §Ypríncipe Luis Napoleón§! (decisión §YGanarse al príncipe Luis Napoleón§!, 45 días)."
 FRW_proclaim_the_empire:0 "Proclamar el Imperio"
 FRW_proclaim_the_empire_desc:0 "Luis Napoleón es coronado en Notre-Dame como Napoleón VI, emperador de los franceses."
 FRW_code_napoleon:0 "Un nuevo Código Napoleónico"
 FRW_code_napoleon_desc:0 "La ley y la administración se uniforman siguiendo el modelo del Primer Imperio."
 FRW_imperial_guard:0 "La Guardia Imperial"
 FRW_imperial_guard_desc:0 "Como en el Primer Imperio, los mejores soldados de Francia son seleccionados para la Guardia del Emperador."
 FRW_grande_armee_reborn:0 "El renacer de la Grande Armée"
 FRW_grande_armee_reborn_desc:0 "El Estado Mayor estudia Austerlitz y Jena y adapta sus rápidas maniobras y sus golpes concentrados a los carros de combate y los aviones."
 FRW_marshals_of_the_empire:0 "Los mariscales del Imperio"
 FRW_marshals_of_the_empire_desc:0 "Los ascensos vuelven a depender del mérito, y cualquier soldado raso puede soñar con llevar un bastón de mariscal en su mochila."
 FRW_continental_system:0 "El Bloqueo Continental"
 FRW_continental_system_desc:0 "Francia establece un área comercial europea cerrada bajo su propia dirección."
 FRW_imperial_university:0 "La Universidad Imperial"
 FRW_imperial_university_desc:0 "Las Grandes Écoles se dedican a formar a los ingenieros y funcionarios del Imperio."
 FRW_imperial_university_tt:0 "Desbloquea al asesor político §YFrédéric Joliot-Curie§! (director de Ciencia Imperial: velocidad de investigación §G+15%§!, 150 de poder político)."
 FRW_natural_borders:0 "Las fronteras naturales"
 FRW_natural_borders_desc:0 "El Rin y los Pirineos señalan las fronteras naturales de Francia, como ya proclamó la Revolución."
 FRW_hundred_days_spirit:0 "El espíritu de los Cien Días"
 FRW_hundred_days_spirit_desc:0 "En 1815, Napoleón prometió que el águila volaría de campanario en campanario hasta las torres de Notre-Dame. Su heredero repite esas palabras."
 FRW_kingdom_of_holland:0 "El Reino de Holanda"
 FRW_kingdom_of_holland_desc:0 "Luis Bonaparte fue rey de Holanda de 1806 a 1810. Los Países Bajos han de volver a ser un reino cliente del Imperio."
 FRW_kingdom_of_holland_tt:0 "Objetivo de guerra de §Ytítere§! contra los §YPaíses Bajos§! (si son independientes y no aliados)."
 FRW_rhine_confederation:0 "La Confederación del Rin"
 FRW_rhine_confederation_desc:0 "La orilla izquierda del Rin y Baden quedan de nuevo bajo la protección del emperador."
 FRW_rhine_confederation_tt:0 "Objetivo de guerra contra §YAlemania§! por §YMosela§!, §YRenania§! y §YBaden§! (salvo que sea aliada)."
 FRW_kingdom_of_italy_napoleon:0 "El Reino de Italia"
 FRW_kingdom_of_italy_napoleon_desc:0 "El Piamonte fue un departamento francés bajo el Primer Imperio, y Milán la capital del Reino de Italia de Napoleón. Su heredero pretende restaurar ambos."
 FRW_kingdom_of_italy_napoleon_tt:0 "Objetivo de guerra contra §YItalia§! por el §YPiamonte§! (salvo que sea aliada)."
 FRW_grand_empire:0 "El Gran Imperio"
 FRW_grand_empire_desc:0 "El Imperio de los franceses se extendió en otro tiempo desde Hamburgo hasta Roma. Napoleón VI se propone reconstruirlo."
 FRW_grand_empire_tt:0 "Forma el §YGran Imperio Francés§!: nuevo nombre, bandera imperial, color azul oscuro en el mapa, espíritu nacional y §Gterritorios nacionales en las tierras de los Países Bajos, Renania, Suiza, el norte de Italia, Cerdeña y Cataluña§! que posea Francia (también en las que obtenga allí más adelante) y §Yreclamaciones§! sobre el resto.\nSustituye a cualquier nación que Francia haya formado antes (se elimina su espíritu de formación). Si Francia ya es el §YReino Eterno de Franquia§!, lo sigue siendo.\nRequiere el control del §YRin§! (Renania, Mosela), el §YPiamonte§!, §YBélgica§! y los §YPaíses Bajos§! (anexionados o como títeres, salvo que se indique lo contrario). Si Francia aún no los controla, la nación se funda automáticamente en cuanto lo haga."
 FRW_iron_crown:0 "La Corona de Hierro"
 FRW_iron_crown_desc:0 "Napoleón fue coronado con la Corona de Hierro de Lombardía en Milán en 1805. Su heredero también piensa ceñírsela."
 FRW_legion_of_honour:0 "La Legión de Honor"
 FRW_legion_of_honour_desc:0 "Como el primer Napoleón, el emperador recompensa el valor en el campo de batalla con la Légion d'honneur."
 FRW_imperial_navy:0 "La Marina Imperial"
 FRW_imperial_navy_desc:0 "La derrota de Trafalgar en 1805 nunca ha sido vengada. El Imperio encarga una flota a la altura de sus ambiciones."
 FRW_emperor_of_the_west:0 "Emperador de Occidente"
 FRW_emperor_of_the_west_desc:0 "La autoridad del emperador se extiende ahora desde el Atlántico hasta el Elba y desde el mar del Norte hasta el Tíber, bajo un único código de leyes."
 FRW_act_of_mediation:0 "El Acta de Mediación"
 FRW_act_of_mediation_desc:0 "En 1803, Napoleón dio a los suizos una constitución y su protección. Su heredero renueva el acuerdo."
 FRW_duchy_of_warsaw:0 "El Ducado de Varsovia"
 FRW_duchy_of_warsaw_desc:0 "Los lanceros polacos siguieron a Napoleón de Madrid a Moscú. Polonia ha de volver a ser el puesto avanzado del Imperio en el Este."
 FRW_egyptian_campaign:0 "La campaña de Egipto"
 FRW_egyptian_campaign_desc:0 "Bonaparte condujo a su ejército hasta las pirámides en 1798. Su heredero tiene puesta la mirada en el canal de Suez."
 FRW_egyptian_campaign_tt:0 "Reclamaciones sobre §YEl Cairo§!, §YAlejandría§! y la zona de §YSuez§!, y un objetivo de guerra contra quien controle Alejandría (Egipto o Gran Bretaña)."
 FRW_road_to_moscow:0 "El camino a Moscú"
 FRW_road_to_moscow_desc:0 "La campaña de 1812 terminó en la nieve. Esta vez la Grande Armée tiene carros de combate, y Varsovia ya es una aliada."
 FRW_road_to_moscow_tt:0 "Reclamaciones sobre §YMinsk§!, §YVitebsk§!, §YSmolensk§! y §YMoscú§!, y un objetivo de guerra contra la §YUnión Soviética§!."
 FRW_continental_empire:0 "El Imperio continental"
 FRW_continental_empire_desc:0 "La dinastía gobierna ahora desde Cádiz hasta el Nilo y desde el canal de la Mancha hasta el Vístula."
 FRW_legitimate_heir:0 "El heredero legítimo"
 FRW_legitimate_heir_desc:0 "Para los legitimistas, los Orleans son usurpadores. El rey legítimo es el heredero mayor de Luis XIV: Alfonso de Borbón, el rey exiliado de España, al que llaman Alfonso I."
 FRW_legitimate_heir_tt:0 "§YAlfonso de Borbón§! (tras su muerte en 1941: su hijo §YJaime II§!) se convierte en rey de Francia. Los legitimistas forman el gobierno.\nRequiere el apoyo de §YAlfonso de Borbón§! (decisión §YGanarse a Alfonso de Borbón§!, 45 días)."
 FRW_white_flag:0 "La bandera blanca"
 FRW_white_flag_desc:0 "Enrique V rechazó el trono en 1873 antes que aceptar la tricolor. Sus herederos recuperan el estandarte blanco de los Borbones, al menos en los tejados de los palacios."
 FRW_spanish_bourbons:0 "Los Borbones de Madrid"
 FRW_spanish_bourbons_desc:0 "El nuevo rey es también el rey exiliado de España. Los monárquicos de ambos lados de los Pirineos miran hacia París."
 FRW_spanish_bourbons_tt:0 "Cada facción española de una guerra civil obtiene también §YVínculos con la Corona francesa§!."
 FRW_requetes:0 "Los requetés de Navarra"
 FRW_requetes_desc:0 "Voluntarios carlistas con boinas rojas cruzan los Pirineos para servir al rey. Son devotos, disciplinados y están ansiosos por combatir."
 FRW_secure_crown_of_spain:0 "Asegurar la Corona de España"
 FRW_secure_crown_of_spain_desc:0 "Alfonso abandonó Madrid en 1931 sin abdicar. París pide a España que vuelva a aceptar a su rey, pacíficamente si es posible."
 FRW_secure_crown_of_spain_tt:0 "Si España está en guerra civil: objetivo de guerra §Ytítere§! contra cada bando español no aliado con Francia.\nDe lo contrario, se pide a §YEspaña§! que acepte al rey de Francia como su propio rey (se convierte en títere francés). Una negativa otorga a Francia un objetivo de guerra."
 FRW_unite_the_crowns:0 "Unir las coronas"
 FRW_unite_the_crowns_desc:0 "Felipe V tuvo que renunciar al trono francés en 1713 para que ambas coronas no se unieran jamás. El Tratado de Utrecht es ya letra muerta, y Francia y España se convierten en un solo reino."
 FRW_unite_the_crowns_tt:0 "Anexiona a todos los títeres españoles de Francia.\nForma el §YReino borbónico de Francia y España§!: nuevo nombre y bandera, espíritu nacional §YLa Monarquía Dual§! y §Gterritorio nacional en las tierras de España§! que posea Francia (también en las que obtenga allí más adelante) y §Yreclamaciones§! sobre el resto.\nSustituye a cualquier nación que Francia haya formado antes. Requiere el control de §YMadrid§! (anexionada o como títere); si Francia aún no la controla, el reino se funda en cuanto lo haga."
 FRW_two_crowns:0 "Dos países, dos coronas"
 FRW_two_crowns_desc:0 "Un rey, dos reinos: Francia y España conservan sus propios gobiernos y ejércitos, pero permanecen unidas bajo la Casa de Borbón."
 FRW_two_crowns_tt:0 "España vuelve a ser independiente (si era títere de Francia) y se une a Francia en el §YPacto de Familia borbónico§!. Ambos reinos conservan sus propios gobiernos."
 FRW_no_more_pyrenees:0 "Ya no hay Pirineos"
 FRW_no_more_pyrenees_desc:0 "«Il n'y a plus de Pyrénées», dicen que comentó Luis XIV cuando su nieto se convirtió en rey de España. Carreteras, ferrocarriles y aranceles tratan ahora las montañas como si no existieran."
 FRW_no_more_pyrenees_tt:0 "España, si está del lado de Francia: §YSocio borbónico§! (+5% de producción de fábricas, +5% de estabilidad)."
 FRW_catholic_kings:0 "Los Reyes Catolicísimos"
 FRW_catholic_kings_desc:0 "La Iglesia recupera sus escuelas y sus escaños en los consejos de Estado. A cambio, los obispos de ambos reinos predican la lealtad a la corona."
 FRW_portuguese_alliance:0 "Una oferta a Lisboa"
 FRW_portuguese_alliance_desc:0 "Solo Lisboa permanece al margen en la península. París y Madrid ofrecen a Salazar un lugar bajo la corona borbónica, y no esperarán mucho una respuesta."
 FRW_heirs_of_louis_xiv:0 "Los herederos de Luis XIV"
 FRW_heirs_of_louis_xiv_desc:0 "Por primera vez desde el Rey Sol, un Borbón gobierna desde el canal de la Mancha hasta Gibraltar. Los cortesanos hablan de un nuevo Grand Siècle."
 FRW_rock_of_gibraltar:0 "El Peñón de Gibraltar"
 FRW_rock_of_gibraltar_desc:0 "España perdió Gibraltar ante los británicos en 1704, combatiendo por la pretensión de Felipe de Anjou, el primer rey Borbón de España. Sus herederos gobiernan ahora en París y Madrid, y quieren recuperar el Peñón."
 FRW_rock_of_gibraltar_tt:0 "Objetivo de guerra contra §YGran Bretaña§! por §YGibraltar§! (salvo que Gran Bretaña sea aliada)."
 FRW_two_sicilies:0 "La Corona de las Dos Sicilias"
 FRW_two_sicilies_desc:0 "Hasta 1861 un rey Borbón reinaba en Nápoles y Palermo. Los Saboya se apoderaron de su reino por la fuerza, y el Borbón primogénito lo reclama ahora como herencia de su familia."
 FRW_two_sicilies_tt:0 "Objetivo de guerra contra §YItalia§! por §YCampania, Sicilia, Calabria y Apulia§! (salvo que Italia sea aliada)."
 FRW_family_compact_fleet:0 "La flota del Pacto de Familia"
 FRW_family_compact_fleet_desc:0 "En 1761 los reyes Borbones de Francia y España unieron sus flotas contra Gran Bretaña. Brest, Tolón, Ferrol y Cartagena vuelven a construir para una sola armada."
 FRW_family_compact_fleet_tt:0 "Si Francia posee §YGalicia§! (Ferrol) y §YMurcia§! (Cartagena): §G+2§! astilleros en cada una."
 FRW_house_of_parma:0 "La Casa de Borbón-Parma"
 FRW_house_of_parma_desc:0 "El príncipe Félix de Borbón-Parma es el esposo de la gran duquesa de Luxemburgo, y la propia Parma fue un ducado borbónico hasta 1859. Se pide a ambos que regresen a la familia."
 FRW_nec_pluribus_impar:0 "Nec Pluribus Impar"
 FRW_nec_pluribus_impar_desc:0 "«No inferior a muchos» era el lema de Luis XIV. Desde el canal de la Mancha hasta Sicilia, la Casa de Borbón vuelve a estar a la altura de cualquier coalición que Europa pueda alzar contra ella."
 FRW_nec_pluribus_impar_tt:0 "§YLe Grand Siècle§! se convierte en §YNec Pluribus Impar§!."
 FRW_devalue_the_franc:0 "Devaluar el franco"
 FRW_devalue_the_franc_desc:0 "Francia ya no puede mantener unido el bloque del oro. Una devaluación debería volver a hacer competitivas las exportaciones francesas."
 FRW_econ_dirigisme:0 "La economía dirigida"
 FRW_econ_dirigisme_desc:0 "Desde las nacionalizaciones del Frente Popular hasta las oficinas de planificación de gobiernos posteriores, los ministros franceses de todos los partidos han confiado en que París dirija la economía. El crédito, la inversión y la producción seguirán planes trazados por el Estado."
 FRW_econ_dirigisme_tt:0 "Elige la §YEconomía dirigida§! como modelo económico de Francia. Su espíritu se refuerza con §YCárteles industriales§! e §YIndependencia económica§!."
 FRW_econ_liberal:0 "Liberalismo económico"
 FRW_econ_liberal_desc:0 "Los magnates del hierro del Comité des Forges quieren liberar el franco de controles y dejar los mercados a su suerte. Dennos mano libre, dicen, y las fábricas crecerán."
 FRW_econ_liberal_tt:0 "Elige el §YLiberalismo económico§! como modelo económico de Francia (no disponible para comunistas). Su espíritu se refuerza con §YCárteles industriales§! e §YIndependencia económica§!."
 FRW_econ_rearmament:0 "El rearme primero"
 FRW_econ_rearmament_desc:0 "Las fábricas de Alemania trabajan para el ejército desde 1935. París sigue ahora su ejemplo, y el presupuesto de los arsenales pasa por delante de todo lo demás."
 FRW_econ_rearmament_tt:0 "Elige §YEl rearme primero§! como modelo económico de Francia. Su espíritu se refuerza con §YCárteles industriales§! e §YIndependencia económica§!."
 FRW_economic_plan:0 "El plan económico"
 FRW_economic_plan_desc:0 "Sea cual sea el rumbo que tome el gobierno, debe decidir qué se va a construir, dónde y quién lo pagará."
 FRW_public_works:0 "Grandes obras públicas"
 FRW_public_works_desc:0 "Se sacan a concurso carreteras, puentes y puertos, lo que da trabajo a los desempleados y deja el país mejor equipado."
 FRW_rationalize_industry:0 "Racionalizar la industria"
 FRW_rationalize_industry_desc:0 "Muchas empresas francesas siguen siendo pequeños negocios familiares con maquinaria anticuada. Se fomentan las fusiones y los métodos de producción modernos."
 FRW_rationalize_industry_tt:0 "Si Francia aún sufre de §YEconomía ineficiente§!, se reduce en un nivel."
 FRW_reform_banque_de_france:0 "Reformar la Banque de France"
 FRW_reform_banque_de_france_desc:0 "Los 200 mayores accionistas pierden su control sobre la Banque de France, cuyo consejo pasa a ser nombrado en gran parte por el Estado."
 FRW_autoroutes_nationales:0 "Las carreteras nacionales"
 FRW_autoroutes_nationales_desc:0 "Las antiguas Routes Nationales se ensanchan, se repavimentan y se conectan entre sí. Los camiones y los convoyes militares pueden ahora cruzar el país en horas en lugar de días."
 FRW_sncf_modernization:0 "Fundar la SNCF"
 FRW_sncf_modernization_desc:0 "El 1 de enero de 1938 las grandes compañías ferroviarias privadas se fusionan en la Société Nationale des Chemins de fer Français."
 FRW_modern_management:0 "Gestión científica"
 FRW_modern_management_desc:0 "Ingenieros titulados se hacen cargo de consejos de administración dirigidos durante mucho tiempo por las familias fundadoras, y la industria francesa empieza a calcular sus costes."
 FRW_modern_management_tt:0 "Elimina por completo la §YEconomía ineficiente§!.\nRequiere todos los enfoques de la fila superior y una industria de al menos §Y40§! fábricas civiles y §Y25§! fábricas militares.\nTodos los enfoques inferiores del árbol económico se basan en él."
 FRW_industrial_cartels:0 "Cárteles industriales"
 FRW_industrial_cartels_desc:0 "Comités de cada rama de la industria reparten las materias primas y acuerdan las inversiones."
 FRW_industrial_cartels_tt:0 "Mejora el espíritu de tu §Ymodelo económico§! elegido al siguiente nivel."
 FRW_hydroelectric_alps:0 "Energía hidroeléctrica alpina"
 FRW_hydroelectric_alps_desc:0 "Las presas del Ródano y de los valles alpinos suministran energía barata a las nuevas fábricas."
 FRW_electrification:0 "Electrificación"
 FRW_electrification_desc:0 "Las centrales del Ródano y del Rin llevan la corriente hasta las granjas más remotas del Macizo Central. La nueva industria se instala a lo largo de las líneas."
 FRW_lorraine_steel:0 "El acero de Lorena"
 FRW_lorraine_steel_desc:0 "Nuevos métodos de extracción y fundición aprovechan mejor la minette, el mineral de baja ley de Lorena."
 FRW_heavy_industry_nord:0 "La industria pesada del norte"
 FRW_heavy_industry_nord_desc:0 "Se amplían las minas y las acerías del Nord y del Pas-de-Calais."
 FRW_renault_and_citroen:0 "Renault y Citroën"
 FRW_renault_and_citroen_desc:0 "Renault y Citroën destinan sus cadenas de montaje a camiones, tractores y vehículos blindados."
 FRW_research_institutes:0 "Fundar el CNRS"
 FRW_research_institutes_desc:0 "El nuevo Centre National de la Recherche Scientifique reúne los laboratorios del país bajo una sola administración."
 FRW_bauxite_provence:0 "La bauxita de Provenza"
 FRW_bauxite_provence_desc:0 "La bauxita, llamada así por Les Baux, en Provenza, se extrae allí para obtener el aluminio que necesitan los fabricantes de aviones."
 FRW_rearmament_plan:0 "El programa de rearme de 1936"
 FRW_rearmament_plan_desc:0 "Se votan catorce mil millones de francos para cuatro años de rearme. Renault construirá carros de combate; Schneider, cañones; y Dewoitine, aviones."
 FRW_rearmament_plan_tt:0 "Requiere a §YRaoul Dautry§! como asesor político (decisión §YNombrar a Raoul Dautry§! en el §YConsejo de Ministros§!, departamento §YEconomía§!)."
 FRW_aviation_industry:0 "Reorganizar la industria aeronáutica"
 FRW_aviation_industry_desc:0 "El Estado se hace cargo de las fábricas de aviones y las agrupa en sociedades regionales SNCA."
 FRW_atomic_research:0 "El laboratorio Joliot-Curie"
 FRW_atomic_research_desc:0 "Frédéric e Irène Joliot-Curie, premios Nobel en 1935, están a la vanguardia de la investigación nuclear."
 FRW_ecole_polytechnique:0 "Ampliar las Grandes Écoles"
 FRW_ecole_polytechnique_desc:0 "Polytechnique, Centrale y la École des Mines duplican sus plazas. Sus graduados diseñarán las armas del país y dirigirán sus fábricas."
 FRW_iraqi_oil:0 "La concesión petrolera de Mosul"
 FRW_iraqi_oil_desc:0 "A través de la Compagnie Française des Pétroles, Francia posee casi una cuarta parte de la Iraq Petroleum Company. El crudo de Kirkuk llega a Trípoli por oleoducto y se envía después a las refinerías cercanas a Marsella."
 FRW_dockyards_brest:0 "Los arsenales de Brest"
 FRW_dockyards_brest_desc:0 "Los arsenales de Brest y Lorient reciben nueva maquinaria y nuevas gradas. Aquí se construirán los buques de la flota del Atlántico."
 FRW_consumer_economy:0 "La industria de bienes de consumo"
 FRW_consumer_economy_desc:0 "Cada vez más hogares de clase media pueden permitirse un frigorífico, un aparato de radio o un automóvil."
 FRW_thomson_electronics:0 "La industria radiofónica"
 FRW_thomson_electronics_desc:0 "Thomson-Houston, SFR y el Laboratoire Central des Télécommunications reciben contratos estatales para equipos de radio y los primeros radares."
 FRW_war_economy:0 "La economía de guerra"
 FRW_war_economy_desc:0 "Se preparan las fábricas para su reconversión, se acumulan existencias y se registra la mano de obra para su asignación. Si llega la guerra, la industria estará lista en cuestión de semanas."
 FRW_dispersed_industry:0 "Descentralizar la industria de guerra"
 FRW_dispersed_industry_desc:0 "Se construyen nuevas plantas en Toulouse, Burdeos y Marsella, fuera del alcance de los bombarderos con base en Alemania."
 FRW_paris_expo:0 "Exposición Universal de París 1937"
 FRW_paris_expo_desc:0 "La Exposición Internacional de 1937 muestra el arte y la ingeniería franceses a orillas del Sena."
 FRW_economic_modernization:0 "Modernización económica"
 FRW_economic_modernization_desc:0 "Un amplio programa de inversiones pretende situar la industria francesa al nivel de la británica y la alemana."
 FRW_arsenal_de_la_republique:0 "El arsenal de la República"
 FRW_arsenal_de_la_republique_desc:0 "Los arsenales del Estado trabajan por turnos día y noche y producen armas en cantidades nunca vistas en tiempos de paz."
 FRW_strategic_stockpiles:0 "Reservas estratégicas"
 FRW_strategic_stockpiles_desc:0 "Los depósitos se llenan de fusiles, proyectiles y piezas de repuesto en previsión del día de la movilización."
 FRW_regional_development:0 "Planificación regional"
 FRW_regional_development_desc:0 "El crédito y las obras públicas se dirigen a los departamentos olvidados del centro de Francia."
 FRW_war_production_board:0 "Ministerio de Armamento"
 FRW_war_production_board_desc:0 "El Ministerio de Armamento de Raoul Dautry asume el control de toda la producción bélica."
 FRW_economic_independence:0 "Independencia económica"
 FRW_economic_independence_desc:0 "Francia aspira a abastecer sus propias necesidades con los recursos de la metrópoli y del imperio."
 FRW_economic_independence_tt:0 "Mejora en un nivel el espíritu de tu §Ymodelo económico§! elegido (hasta el nivel final si también se ha completado §YCárteles industriales§!)."
 FRW_lessons_of_verdun:0 "Las lecciones de Verdún"
 FRW_lessons_of_verdun_desc:0 "Los oficiales de Estado Mayor estudian las campañas de 1914 a 1918 para que el ejército no repita sus errores."
 FRW_beyond_victory:0 "Superar la complacencia del vencedor"
 FRW_beyond_victory_desc:0 "La victoria de 1918 dejó al ejército seguro de sus métodos. Sus oficiales deben ahora cuestionarlos."
 FRW_beyond_victory_tt:0 "Las dudas restantes (§YLas dudas del vencedor§!) solo se eliminan con §YUn ejército moderno§! al final de la rama del ejército."
 FRW_methodical_battle:0 "La batalla metódica"
 FRW_methodical_battle_desc:0 "El ejército combate según un plan minucioso, con artillería concentrada y un frente continuo y bien defendido."
 FRW_methodical_battle_tt:0 "§YLos generales de 1918§! se debilita a §YUn mando en transición§!. §YReformar el Estado Mayor§! lo elimina."
 FRW_war_of_movement:0 "La guerra de movimientos"
 FRW_war_of_movement_desc:0 "Los carros de combate, los camiones y la radio decidirán la próxima guerra, y será rápida."
 FRW_war_of_movement_tt:0 "§YLos generales de 1918§! se debilita a §YUn mando en transición§!. §YReformar el Estado Mayor§! lo elimina."
 FRW_maginot_extension:0 "Prolongar la Línea Maginot"
 FRW_maginot_extension_desc:0 "La Línea Maginot se detiene en la frontera belga, como bien sabe el Estado Mayor alemán. Nuevas casamatas y obstáculos se extenderán ahora desde Montmédy hasta el mar."
 FRW_heavy_artillery:0 "Artillería pesada"
 FRW_heavy_artillery_desc:0 "Schneider y el Atelier de Puteaux entregan nuevos cañones para sustituir las existencias de la última guerra."
 FRW_mas_rifles:0 "El MAS-36"
 FRW_mas_rifles_desc:0 "El MAS-36 es más corto y ligero que el viejo Lebel y más rápido de recargar. Se distribuirá a todos los regimientos de infantería."
 FRW_mechanized_divisions:0 "Divisiones ligeras mecanizadas"
 FRW_mechanized_divisions_desc:0 "La caballería forma divisiones ligeras mecanizadas para explorar por delante del ejército y perseguir al enemigo derrotado. Los camiones sustituyen a las columnas hipomóviles que todavía transportan los suministros del ejército."
 FRW_divisions_cuirassees:0 "Divisiones acorazadas"
 FRW_divisions_cuirassees_desc:0 "Siguiendo las ideas del coronel De Gaulle, los carros de combate se agrupan en divisiones acorazadas independientes. Prosiguen los trabajos en un carro de ruptura más pesado que suceda al Char B1."
 FRW_chasseurs_alpins:0 "Chasseurs Alpins y spahis"
 FRW_chasseurs_alpins_desc:0 "Los Chasseurs Alpins, los «Diablos Azules» de la última guerra, figuran entre las mejores tropas de montaña de Europa. Todas las divisiones alpinas se instruirán según su nivel. Los regimientos montados de spahis del norte de África se reequipan como unidades de reconocimiento."
 FRW_colonial_troops:0 "Tropas coloniales"
 FRW_colonial_troops_desc:0 "Se recurre a los tiradores senegaleses y a los spahis norteafricanos para reforzar el ejército."
 FRW_general_staff_reform:0 "Reformar el Estado Mayor"
 FRW_general_staff_reform_desc:0 "Los generales de edad avanzada pasan a retiro y se confían mandos a oficiales más jóvenes."
 FRW_foreign_legion:0 "La Legión Extranjera"
 FRW_foreign_legion_desc:0 "La Legión Extranjera, cuyo lema es Legio Patria Nostra, se amplía y se entrena como fuerza de élite."
 FRW_reserve_system:0 "El sistema de reservas"
 FRW_reserve_system_desc:0 "Los reservistas son convocados a instrucción periódica para que puedan reincorporarse rápidamente a sus unidades."
 FRW_reserve_system_tt:0 "Requiere a §YAlfred Sauvy§! como asesor político (decisión §YNombrar a Alfred Sauvy§! en el §YConsejo de Ministros§!, departamento §YEconomía§!)."
 FRW_combined_arms:0 "Armas combinadas"
 FRW_combined_arms_desc:0 "La infantería, los carros, la artillería y la aviación se entrenan juntos y aprenden a combatir de forma coordinada. El SA 37 de 47 mm puede perforar el blindaje de cualquier carro en servicio actualmente en Europa. Cada división de infantería recibirá suficientes para detener un ataque acorazado."
 FRW_paratroopers:0 "Paracaidistas y Corps Francs"
 FRW_paratroopers_desc:0 "Francia formó sus primeras compañías paracaidistas, la Infanterie de l'Air, en 1937, entre las primeras del mundo. Se entrenan pequeños destacamentos de asalto para reconocimiento e incursiones."
 FRW_desert_warfare:0 "Guerra en el desierto"
 FRW_desert_warfare_desc:0 "Se recopilan y enseñan las lecciones de las campañas de Marruecos y del Sáhara."
 FRW_artillery_barrage:0 "La cortina de fuego móvil"
 FRW_artillery_barrage_desc:0 "Un fuego planificado al detalle y estrechamente ligado a la infantería sigue siendo la base de la táctica francesa."
 FRW_army_of_the_republic:0 "Un ejército moderno"
 FRW_army_of_the_republic_desc:0 "Salvo por sus banderas, el ejército de 1940 tiene poco en común con el de 1918. Se crea un Estado Mayor conjunto para coordinar el ejército, la marina y la fuerza aérea."
 FRW_tank_production_lines:0 "Cadenas de producción de carros"
 FRW_tank_production_lines_desc:0 "Se abren nuevas cadenas de montaje de carros de combate en Issy-les-Moulineaux y Vénissieux."
 FRW_darlan_programme:0 "El programa Darlan"
 FRW_darlan_programme_desc:0 "Francia tiene la cuarta armada más grande del mundo, y sus buques deben mantenerse al día. El almirante Darlan, jefe del Estado Mayor naval desde 1937, presiona por una flota capaz de operar en alta mar."
 FRW_darlan_programme_tt:0 "§YUna flota dividida§! se debilita a §YUna flota en reforma§!. §YLos astilleros de Tolón y Brest§! lo elimina.\nDesbloquea el departamento §YMarina§! en el §YConsejo de Ministros§!."
 FRW_richelieu_class:0 "La clase Richelieu"
 FRW_richelieu_class_desc:0 "El Dunkerque y el Strasbourg fueron solo los primeros de los nuevos acorazados. La clase Richelieu estará a la altura de cualquier buque que Italia o Alemania puedan hacer a la mar. El Richelieu y sus gemelos serán los acorazados más poderosos que Francia haya construido jamás."
 FRW_mediterranean_fleet:0 "La flota del Mediterráneo"
 FRW_mediterranean_fleet_desc:0 "Los cruceros y los grandes destructores franceses se cuentan entre los buques de guerra más rápidos a flote. La ruta marítima hacia el norte de África debe mantenerse abierta cueste lo que cueste."
 FRW_atlantic_squadrons:0 "Las escuadras del Atlántico"
 FRW_atlantic_squadrons_desc:0 "La marina invierte fuertemente en submarinos, desde el gigantesco Surcouf hasta pequeñas unidades costeras. Brest se convierte en la base principal de la flota del Atlántico."
 FRW_carrier_programme:0 "El programa de portaaviones"
 FRW_carrier_programme_desc:0 "El viejo Béarn es el único portaaviones de la marina y es demasiado lento para las operaciones modernas. La nueva clase Joffre dará a la flota una aviación propia."
 FRW_naval_aviation:0 "Aviación naval"
 FRW_naval_aviation_desc:0 "La Aéronavale recibe sus propios aviones, pilotos y bases aeronavales. Torpederos y aviones de reconocimiento buscarán y atacarán al servicio de la flota."
 FRW_toulon_brest_yards:0 "Los astilleros de Tolón y Brest"
 FRW_toulon_brest_yards_desc:0 "Se construyen nuevos diques secos en Tolón y Brest para la próxima generación de buques de guerra."
 FRW_convoy_escorts:0 "Escoltas de convoyes"
 FRW_convoy_escorts_desc:0 "Avisos y corbetas escoltan la navegación en las rutas hacia las colonias."
 FRW_coastal_defence:0 "Defensa costera"
 FRW_coastal_defence_desc:0 "Los Fusiliers Marins, recordados por su resistencia en Dixmude en 1914, se reconstituyen como una moderna fuerza de desembarco. Baterías costeras y campos de minas protegen los puertos de Francia y del imperio."
 FRW_fleet_in_being:0 "Una flota equilibrada"
 FRW_fleet_in_being_desc:0 "Se construyen acorazados, cruceros, destructores y submarinos en número equilibrado, para que la flota pueda operar en cualquier mar."
 FRW_naval_treaties_end:0 "Adiós a los tratados navales"
 FRW_naval_treaties_end_desc:0 "Francia ya no se considera obligada por los tratados navales de Washington y Londres."
 FRW_plan_v:0 "Plan V"
 FRW_plan_v_desc:0 "La Armée de l'Air es un servicio independiente solo desde 1934. El Plan V prevé 2.400 aviones modernos."
 FRW_plan_v_tt:0 "§YUna fuerza aérea obsoleta§! se debilita a §YUna fuerza aérea en transición§!. §YEscuelas de vuelo§! lo elimina.\nDesbloquea el departamento §YFuerza Aérea§! en el §YConsejo de Ministros§!."
 FRW_dewoitine_fighters:0 "Cazas Dewoitine"
 FRW_dewoitine_fighters_desc:0 "El Dewoitine D.520 está concebido para hacer frente a cualquier caza con el que se encuentre."
 FRW_bomber_command:0 "La fuerza de bombarderos"
 FRW_bomber_command_desc:0 "Los escuadrones se reequipan con bombarderos bimotores modernos como el LeO 45."
 FRW_air_doctrine:0 "Doctrina aérea"
 FRW_air_doctrine_desc:0 "El Estado Mayor fija por escrito lo que la fuerza aérea deberá hacer en una guerra futura."
 FRW_colonial_air_bases:0 "Bases aéreas en el imperio"
 FRW_colonial_air_bases_desc:0 "Los aeródromos del norte de África extienden la cobertura aérea sobre el Mediterráneo occidental."
 FRW_close_air_support:0 "Apoyo aéreo cercano"
 FRW_close_air_support_desc:0 "Los bombarderos en picado y los aviones de ataque a tierra se enviarán allí donde la infantería los solicite. Por primera vez, la Armée de l'Air se entrena seriamente con el ejército."
 FRW_air_defence_paris:0 "Defensa antiaérea de París"
 FRW_air_defence_paris_desc:0 "Cañones antiaéreos y fonolocalizadores rodean la capital."
 FRW_pilot_schools:0 "Escuelas de vuelo"
 FRW_pilot_schools_desc:0 "Las nuevas escuelas de vuelo de Istres y Salon-de-Provence forman a varios cientos de pilotos al año, mientras la Aviation Populaire de Pierre Cot enseña a volar a los jóvenes en los aeroclubes locales."
 FRW_jet_research:0 "Motores a reacción"
 FRW_jet_research_desc:0 "El ingeniero René Leduc trabaja en un motor estatorreactor."
 FRW_strategic_air_force:0 "Fuerza aérea estratégica"
 FRW_strategic_air_force_desc:0 "Se encargan bombarderos cuatrimotores para atacar fábricas, ferrocarriles y puertos muy por detrás de las líneas enemigas."
 FRW_strategic_air_force_tt:0 "Requiere a §YPierre Cot§! como asesor político (decisión §YNombrar a Pierre Cot§! en el §YConsejo de Ministros§!, departamento §YInvestigación§!)."
 FRW_air_superiority:0 "Superioridad aérea"
 FRW_air_superiority_desc:0 "Los recientes combates en España han demostrado que los ejércitos sin cobertura aérea sufren graves pérdidas. La Armée de l'Air necesita más cazas y más rápidos."
 FRW_air_staff:0 "El Estado Mayor del Aire"
 FRW_air_staff_desc:0 "Un estado mayor aéreo permanente planifica ahora de forma conjunta la labor de los cazas, los bombarderos y las escuadrillas de reconocimiento. Las órdenes vendrán de oficiales que conocen los aviones."
 FRW_quai_d_orsay:0 "El Quai d'Orsay"
 FRW_quai_d_orsay_desc:0 "El Quai d'Orsay tiene más experiencia en la diplomacia europea que cualquier otro ministerio de Asuntos Exteriores, y sus embajadores se ponen manos a la obra."
 FRW_league_of_nations:0 "Fortalecer la Sociedad de Naciones"
 FRW_league_of_nations_desc:0 "París deposita su confianza en la Sociedad de Ginebra y en la acción colectiva contra cualquier agresor."
 FRW_eastern_alliances:0 "El sistema de alianzas del Este"
 FRW_eastern_alliances_desc:0 "En el este, se espera que Polonia y los Estados de la Pequeña Entente mantengan a raya a Alemania."
 FRW_mediterranean_policy:0 "Política mediterránea"
 FRW_mediterranean_policy_desc:0 "Las conversaciones con Roma, Madrid y Ankara buscan mantener la calma en el Mediterráneo y abiertas las rutas marítimas hacia África."
 FRW_belgian_alliance:0 "La alianza belga"
 FRW_belgian_alliance_desc:0 "La vieja ruta de invasión hacia Francia pasa por Bélgica. Su defensa se considera un asunto francés."
 FRW_franco_polish_pact:0 "Pacto franco-polaco"
 FRW_franco_polish_pact_desc:0 "La alianza de 1921 se renueva y se dota de nuevas cláusulas militares. Un avance alemán hacia el este significaría una guerra en dos frentes."
 FRW_franco_soviet_pact:0 "Pacto franco-soviético"
 FRW_franco_soviet_pact_desc:0 "El pacto de asistencia mutua firmado en 1935 se completa por fin con conversaciones entre estados mayores y compromisos prácticos."
 FRW_franco_soviet_pact_tt:0 "Firma un §Ypacto de no agresión§! con la §YUnión Soviética§!."
 FRW_turkish_friendship:0 "Amistad con Turquía"
 FRW_turkish_friendship_desc:0 "La cesión del sanjacado de Alejandreta a Turquía se gana la buena voluntad de Ankara."
 FRW_turkish_friendship_tt:0 "§YHatay§! se entrega a §YTurquía§! (si pertenece a Francia o a la Siria francesa)."
 FRW_swiss_talks:0 "Conversaciones con Berna"
 FRW_swiss_talks_desc:0 "París abre conversaciones con Berna para que ningún ejército pueda utilizar territorio suizo para rodear las defensas francesas."
 FRW_balkan_guarantees:0 "Apoyar el Pacto Balcánico"
 FRW_balkan_guarantees_desc:0 "Las garantías a Grecia y Turquía cierran el círculo de alianzas francesas en el sudeste."
 FRW_arms_exports:0 "Exportación de armas"
 FRW_arms_exports_desc:0 "Llegan pedidos de fusiles, cañones y aviones franceses de numerosos gobiernos extranjeros."
 FRW_deuxieme_bureau:0 "El Deuxième Bureau"
 FRW_deuxieme_bureau_desc:0 "La inteligencia militar recibe más personal y fondos. Desde 1931, el capitán Bertrand entrega a la oficina de cifrado polaca documentos sobre Enigma comprados a un informante alemán."
 FRW_american_credits:0 "Créditos estadounidenses"
 FRW_american_credits_desc:0 "Los préstamos y las licencias de fabricación de Washington aceleran el rearme francés."
 FRW_vatican_concordat:0 "Reconciliación con el Vaticano"
 FRW_vatican_concordat_desc:0 "Un concordato con la Santa Sede pone fin a la larga disputa entre la República y la Iglesia."
 FRW_rhineland_response:0 "Responder al golpe de Renania"
 FRW_rhineland_response_desc:0 "En marzo de 1936 Hitler apostó a que Francia no se movería, y ganó. La próxima violación de los tratados se responderá con tropas además de con protestas."
 FRW_collective_security:0 "Seguridad colectiva"
 FRW_collective_security_desc:0 "París hace un llamamiento a todo gobierno que tema una agresión para que se una a Francia en un frente común."
 FRW_collective_security_tt:0 "Una Francia democrática que no pertenezca a ninguna facción funda la §YSeguridad Colectiva§!."
 FRW_diplomatic_shield:0 "Escudo diplomático"
 FRW_diplomatic_shield_desc:0 "Cualquier Estado que ataque a Francia será considerado en todas partes el agresor."
 FRW_great_power_status:0 "La Grande Nation"
 FRW_great_power_status_desc:0 "Con el ejército rearmado y las alianzas del este restablecidas, ninguna cuestión europea se resuelve sin el Quai d'Orsay."
 FRW_empire_colonial:0 "El Imperio colonial"
 FRW_empire_colonial_desc:0 "Francia posee el segundo mayor imperio colonial del mundo, y sus hombres y recursos son la mayor reserva del país."
 FRW_ministry_of_colonies:0 "El Ministerio de las Colonias"
 FRW_ministry_of_colonies_desc:0 "Se reorganiza el ministerio colonial de la Rue Oudinot. Gobernadores, ingenieros y médicos cualificados ocupan el lugar de aventureros y especuladores."
 FRW_african_development:0 "Desarrollar el norte de África"
 FRW_african_development_desc:0 "Se construyen centrales eléctricas, obras portuarias y fábricas en Argel, Orán y Casablanca, que convierten el norte de África en la base industrial del imperio."
 FRW_colonial_purchases:0 "Compras coloniales"
 FRW_colonial_purchases_desc:0 "Algunos territorios pueden obtenerse con dinero. España, Portugal, Bélgica, Gran Bretaña e Italia poseen tierras que completarían el África francesa."
 FRW_aof_federation:0 "Federación del África Occidental Francesa"
 FRW_aof_federation_desc:0 "Las colonias del África Occidental Francesa se gobiernan como una sola federación desde Dakar."
 FRW_trans_saharan_railway:0 "El ferrocarril transahariano"
 FRW_trans_saharan_railway_desc:0 "Comienzan las obras de un ferrocarril que cruzará el Sáhara desde Argel hasta el Níger, uniendo el norte y el oeste de África."
 FRW_saharan_oil:0 "El petróleo del Sáhara"
 FRW_saharan_oil_desc:0 "Los geólogos creen que bajo el Sáhara argelino se esconden grandes yacimientos de petróleo, y se envían equipos de prospección al sur."
 FRW_tonkin_industry:0 "Industria en Tonkín"
 FRW_tonkin_industry_desc:0 "Japón mira hacia el sur. Se refuerza la guarnición de Indochina. Las minas de carbón y la mano de obra de Tonkín se ponen al servicio de la industria local."
 FRW_moroccan_question:0 "El legado de Lyautey"
 FRW_moroccan_question_desc:0 "El mariscal Lyautey construyó el protectorado de Marruecos sobre el respeto al sultán y sobre carreteras, puertos y escuelas. Sus sucesores deben terminar la obra."
 FRW_moroccan_question_tt:0 "Estados marroquíes: §G+10%§! de colaboración."
 FRW_liberia_protectorate:0 "Protectorado sobre Liberia"
 FRW_liberia_protectorate_desc:0 "Liberia está muy endeudada. Francia le ofrece crédito y protección."
 FRW_dakar_naval_base:0 "Base naval de Dakar"
 FRW_dakar_naval_base_desc:0 "Desde Dakar, la marina puede vigilar el estrecho atlántico entre África y Sudamérica."
 FRW_dakar_naval_base_tt:0 "§G+1§! astillero y espacio de construcción en un estado costero de África."
 FRW_mauritanian_iron:0 "El mineral de hierro de Mauritania"
 FRW_mauritanian_iron_desc:0 "Las prospecciones confirman que la montaña de Kediet ej Jill, cerca de Zouérat, es casi por completo mineral de hierro. Un ferrocarril hasta la costa lo llevará a los altos hornos franceses."
 FRW_pacific_bases:0 "Bases en el Pacífico"
 FRW_pacific_bases_desc:0 "Nuevos aeródromos en Indochina cubren las posesiones asiáticas del imperio."
 FRW_libyan_question:0 "La frontera sahariana"
 FRW_libyan_question_desc:0 "Desde Tinduf hasta el Fezán, un puñado de méharistes vigila la frontera del desierto. La Armée d'Afrique pide fuertes, aeródromos y pozos."
 FRW_colonial_development_fund:0 "El Fondo de Inversión Colonial"
 FRW_colonial_development_fund_desc:0 "Se crea un fondo público para financiar carreteras, ferrocarriles y puertos en África."
 FRW_colonial_development_fund_tt:0 "§G+1§! fábrica civil y espacio de construcción en un estado de África."
 FRW_algerian_departments:0 "Argelia es Francia"
 FRW_algerian_departments_desc:0 "Desde 1848 Argelia está organizada en departamentos, y París la trata como parte de la propia Francia."
 FRW_djibouti_railway:0 "El ferrocarril Yibuti–Adís Abeba"
 FRW_djibouti_railway_desc:0 "El ferrocarril francés de Yibuti a Adís Abeba es la única salida de Etiopía al mar."
 FRW_indochina_rubber:0 "Caucho de Indochina"
 FRW_indochina_rubber_desc:0 "El caucho de las plantaciones Michelin de Indochina se reserva para el ejército."
 FRW_levant_mandates:0 "Integrar los mandatos del Levante"
 FRW_levant_mandates_desc:0 "Siria y el Líbano pasan a la administración directa de Francia."
 FRW_levant_mandates_tt:0 "Anexiona los mandatos franceses de §YSiria§! y el §YLíbano§! si son títeres de Francia. Si Francia ya gobierna el Levante directamente (p. ej., en Road to 56), simplemente recibe la bonificación de administración."
 FRW_eurafrique:0 "Euráfrica"
 FRW_eurafrique_desc:0 "Los planificadores de París proponen un único espacio económico que una Europa y África, con Francia a la cabeza."
 FRW_colonial_war_production:0 "Producción de guerra en el Imperio"
 FRW_colonial_war_production_desc:0 "Las fábricas construidas en África quedan fuera del alcance de los bombarderos enemigos."
 FRW_imperial_preference:0 "Preferencia imperial"
 FRW_imperial_preference_desc:0 "Los aranceles bajan dentro del imperio y suben en sus fronteras. El algodón, el caucho y los minerales coloniales van primero a las fábricas francesas."
 FRW_madagascar_development:0 "Desarrollar Madagascar"
 FRW_madagascar_development_desc:0 "Madagascar recibe nuevos puertos y carreteras."
 FRW_national_cohesion:0 "Cohesión nacional"
 FRW_national_cohesion_desc:0 "Desde los disturbios del 6 de febrero de 1934, la derecha y la izquierda se lanzan al cuello la una de la otra."
 FRW_end_political_violence:0 "Disolver las ligas"
 FRW_end_political_violence_desc:0 "Las Croix-de-Feu, los Camelots du Roi y las milicias de izquierda son disueltos y sus armas confiscadas. El orden en las calles queda en manos de la policía."
 FRW_radio_propaganda:0 "Radio París"
 FRW_radio_propaganda_desc:0 "Radio-Paris y las emisoras regionales llevan el mensaje del gobierno a hogares, cafés y cuarteles de todo el país."
 FRW_code_de_la_famille:0 "El Código de la Familia"
 FRW_code_de_la_famille_desc:0 "El Code de la famille de 1939 ofrece subsidios e incentivos para elevar la baja natalidad de Francia."
 FRW_civil_defence:0 "Defensa civil"
 FRW_civil_defence_desc:0 "Las ciudades excavan refugios antiaéreos y realizan simulacros de apagón."
 FRW_mobilization_laws:0 "La Ley de Organización en Tiempo de Guerra"
 FRW_mobilization_laws_desc:0 "La ley de julio de 1938 sobre la organización de la nación en tiempo de guerra establece cómo se movilizarán los hombres y la industria."
 FRW_rural_modernization:0 "Modernizar la agricultura"
 FRW_rural_modernization_desc:0 "Los tractores y los fertilizantes llegan al campo y liberan mano de obra para las fábricas."
 FRW_national_service:0 "Servicio nacional"
 FRW_national_service_desc:0 "Tanto civiles como soldados reciben obligaciones, ya sea en el frente o en las fábricas de guerra."
 FRW_women_in_industry:0 "Mujeres en la industria"
 FRW_women_in_industry_desc:0 "Como en 1914, las mujeres asumen buena parte del trabajo en las fábricas."
 FRW_union_sacree:0 "La Union sacrée"
 FRW_union_sacree_desc:0 "En agosto de 1914 los partidos dejaron de lado sus disputas mientras durase la guerra. El gobierno pide ahora a obreros y patronos, católicos y anticlericales que hagan lo mismo."
 FRW_iberian_ambitions:0 "La cuestión ibérica"
 FRW_iberian_ambitions_desc:0 "Al otro lado de los Pirineos, España se desliza hacia la guerra civil. El control de la península daría al capitán la entrada occidental del Mediterráneo y los mejores puertos del Atlántico."
 FRW_intervene_in_spain:0 "Intervenir en España"
 FRW_intervene_in_spain_desc:0 "Los españoles se están matando entre sí. Francia pretende intervenir y poner fin a la guerra en sus propios términos, sea cual sea la facción que se interponga."
 FRW_intervene_in_spain_tt:0 "Objetivo de guerra de §Yanexión§! contra §Ytodos los bandos§! de la guerra civil española que no sean aliados de Francia."
 FRW_spanish_protectorate:0 "Un protectorado sobre España"
 FRW_spanish_protectorate_desc:0 "Haya estallado o no la guerra civil, España es débil y París está cerca. Se propone un protectorado francés."
 FRW_one_iberia:0 "Una sola Iberia bajo Francia"
 FRW_one_iberia_desc:0 "Los cañones callan. Lo que queda de España pasará a Francia, mediante un tratado si es posible y por la fuerza si no."
 FRW_one_iberia_tt:0 "Todo Estado español que ya sea §Ysúbdito de Francia§! queda §Ycompletamente anexionado§!, incluido su ejército.\nContra toda España §Yindependiente§!, Francia obtiene en su lugar un §Yobjetivo de guerra§!.\nSi España ya no existe, se omite este enfoque."
 FRW_portuguese_question:0 "La cuestión portuguesa"
 FRW_portuguese_question_desc:0 "Lisboa está ahora aislada en el extremo de una península francesa. Las divisiones francesas en la frontera refuerzan los argumentos de los diplomáticos franceses."
 FRW_portuguese_question_tt:0 "§YPortugal§! debe decidir: unirse pacíficamente a Francia o enfrentarse a la guerra.\nCuanto más fuerte sea el ejército francés en comparación con el portugués, más probable será que Lisboa ceda. Si Portugal se niega, Francia obtiene un objetivo de guerra de §Yanexión§!."
 FRW_raise_the_black_flag:0 "El Reino de Franquia"
 FRW_raise_the_black_flag_desc:0 "El capitán de Saint-Malo une Francia e Iberia bajo un mismo estandarte con las lises de Francia y el armiño de Bretaña. Por ahora lo llama reino, y eterno lo será para su hijo."
 FRW_raise_the_black_flag_tt:0 "Proclama el §YReino de Franquia§!, precursor del Reino Eterno, con un estandarte de lises y armiño bretón, §YLe Pavillon Corsaire§! (+15% de ataque y defensa en territorio nacional) y §Gterritorios nacionales en las tierras de España y Portugal§! que posea Francia (también en las que gane allí más adelante) y §Yreclamaciones§! sobre el resto.\nSustituye a cualquier nación que Francia haya formado antes (se elimina su espíritu de formación). Si Francia ya es el §YReino Eterno de Franquia§!, sigue siéndolo."
 FRW_iberian_cores:0 "Una península, una nación"
 FRW_iberian_cores_desc:0 "De Calais a Cádiz y de Brest a Lisboa, estas tierras se gobernarán como una sola nación."
 FRW_iberian_cores_tt:0 "§GTerritorio nacional§! en todo estado propio que sea territorio nacional de §YEspaña§! o §YPortugal§!, y §G+15%§! de colaboración en ellos."
 FRW_asturian_steel:0 "Carbón asturiano y mineral andaluz"
 FRW_asturian_steel_desc:0 "Las minas y los altos hornos de Asturias y las viejas minas de cobre de Río Tinto trabajan ahora para Francia."
 FRW_catalan_industry:0 "Las fábricas de Barcelona"
 FRW_catalan_industry_desc:0 "Cataluña era el taller de España, y sus hilaturas y fábricas se ponen ahora al servicio de las necesidades francesas en el sur."
 FRW_port_of_lisbon:0 "El puerto de Lisboa"
 FRW_port_of_lisbon_desc:0 "El puerto de Lisboa, uno de los mejores del Atlántico, se convierte en la base de la escuadra atlántica del capitán."
 FRW_iberian_arsenal:0 "El arsenal ibérico"
 FRW_iberian_arsenal_desc:0 "Los arsenales de Madrid y Burgos producen fusiles, cañones y carros de combate para los ejércitos imperiales."
 FRW_letters_of_marque:0 "Patentes de corso"
 FRW_letters_of_marque_desc:0 "Los corsarios de Saint-Malo siempre lucharon tanto por el beneficio como por la gloria. Todo enemigo derrotado y toda nación protegida contribuirán al cofre de guerra del capitán, y toda isla que domine una ruta marítima es una presa digna de tomarse."
 FRW_letters_of_marque_tt:0 "Desbloquea §YConfiscar el tesoro§!: toma las reservas de oro de cualquier país que sea §Ysúbdito de Francia§! o haya §Ycapitulado§! estando en guerra con Francia.\nFrancia obtiene §G+75§! de poder político, una fábrica civil y §YOro corsario§! (180 días); la víctima sufre §RTesoro saqueado§! (365 días). Cada país solo puede ser saqueado una vez al año."
 FRW_shipyards_of_saint_malo:0 "Los astilleros de Saint-Malo"
 FRW_shipyards_of_saint_malo_desc:0 "El viejo puerto corsario vuelve a construir: fragatas, cargueros y las fábricas que los abastecen."
 FRW_corsair_economy:0 "La economía de presas"
 FRW_corsair_economy_desc:0 "El oro, los barcos y los cargamentos capturados en el mar se convierten en acero y maquinaria en tierra. Los tribunales de presas de Saint-Malo sesionan día y noche."
 FRW_appeal_of_18_june:0 "El Llamamiento del 18 de junio"
 FRW_appeal_of_18_june_desc:0 "«Francia ha perdido una batalla, pero Francia no ha perdido la guerra». Desde Londres, un general poco conocido exhorta a todos los franceses a seguir luchando."
 FRW_appeal_of_18_june_tt:0 "Esta rama aparece cuando Francia ha §Ycapitulado§! o ha perdido el control de §YParís§!, aunque ya se haya firmado la paz. Sus enfoques pueden tomarse estando capitulada.\nEl prestigio de la Francia Libre comienza en §Y20§! de 100 y se abren las decisiones §YFrancia Libre§!. Elimina §YDerrotismo§!."
 FRW_continue_the_fight:0 "Continuar la lucha"
 FRW_continue_the_fight_desc:0 "Un armisticio firmado en Burdeos no obliga a nadie en Londres. Los Franceses Libres declaran que la guerra continúa."
 FRW_continue_the_fight_tt:0 "Francia vuelve a declarar la guerra a quien ocupe §YParís§! (si ya no está en guerra con él) y se une a la facción de §YGran Bretaña§! (si Gran Bretaña lidera una).\nPrestigio de la Francia Libre: §G+5§!"
 FRW_free_french_forces:0 "Las Fuerzas Francesas Libres"
 FRW_free_french_forces_desc:0 "Legionarios de regreso de Narvik, marineros huidos de Brest y tiradores coloniales del Chad forman el núcleo de un nuevo ejército."
 FRW_free_french_forces_tt:0 "§G+2§! fábricas militares en el exilio (talleres británicos y coloniales).\nPrestigio de la Francia Libre: §G+5§!"
 FRW_rally_the_colonies:0 "Unir a las colonias"
 FRW_rally_the_colonies_desc:0 "En agosto de 1940, el Chad, Camerún y el Congo Medio se declararon a favor de De Gaulle. Se pide a los demás gobernadores que los sigan."
 FRW_rally_the_colonies_tt:0 "§YReclamaciones§! sobre toda colonia francesa de África en manos de otro, y un §Yobjetivo de guerra§! contra todo país (fuera de la facción de Francia) que posea alguna.\nPrestigio de la Francia Libre: §G+10§!"
 FRW_lend_lease:0 "Ayuda de Washington"
 FRW_lend_lease_desc:0 "El Préstamo y Arriendo de Roosevelt llega a los Franceses Libres a través de Gran Bretaña: fusiles, camiones y uniformes."
 FRW_lend_lease_tt:0 "§G+3§! fábricas militares en el exilio (producción estadounidense de Préstamo y Arriendo)."
 FRW_leclerc_column:0 "La columna de Leclerc"
 FRW_leclerc_column_desc:0 "En 1941, Leclerc cruzó el Sáhara desde el Chad y tomó el fuerte italiano de Kufra. En el oasis, sus hombres juraron seguir luchando hasta que la bandera ondeara sobre Estrasburgo."
 FRW_leclerc_column_tt:0 "Reclamaciones sobre §YFezán§! y §YSirte§! y un objetivo de guerra contra §YItalia§! por ellos.\nPrestigio de la Francia Libre: §G+5§!"
 FRW_algiers_capital:0 "Argel, capital de Francia"
 FRW_algiers_capital_desc:0 "Los ministerios se instalan en las villas que dominan la bahía de Argel. Por ahora, es desde aquí desde donde se gobierna Francia."
 FRW_algiers_capital_tt:0 "§G+2§! fábricas civiles en el exilio.\nTraslada la capital a §YArgel§! (o a §YBrazzaville§! si Francia no posee Argelia)."
 FRW_the_resistance:0 "La Resistencia"
 FRW_the_resistance_desc:0 "Jean Moulin es lanzado en paracaídas sobre Provenza para unificar los movimientos de resistencia. Ferroviarios, estudiantes y comunistas comienzan a sabotear al ocupante."
 FRW_brazzaville_conference:0 "La Conferencia de Brazzaville"
 FRW_brazzaville_conference_desc:0 "De Gaulle promete a las colonias un nuevo lugar en la comunidad francesa tras la guerra. A cambio, África le entrega hombres y materias primas."
 FRW_brazzaville_conference_tt:0 "Todo estado propio en §YÁfrica§!: §G+10%§! de colaboración.\nPrestigio de la Francia Libre: §G+10§!"
 FRW_mobilise_the_empire:0 "Movilizar el Imperio"
 FRW_mobilise_the_empire_desc:0 "Se improvisan fábricas en Casablanca y Dakar, y los ferrocarriles del Magreb funcionan día y noche."
 FRW_mobilise_the_empire_tt:0 "§G+2§! fábricas militares en el exilio."
 FRW_army_of_africa_marches:0 "El Ejército de África en marcha"
 FRW_army_of_africa_marches_desc:0 "Rearmada por los estadounidenses tras Túnez, la Armée d'Afrique es necesaria en Italia y en Provenza."
 FRW_eurafrican_federation_focus:0 "La Federación Euroafricana"
 FRW_eurafrican_federation_focus_desc:0 "Con París ocupada, el imperio es Francia. Argel propone unir Europa y África en una sola federación mientras dure la guerra, y quizá más allá."
 FRW_eurafrican_federation_focus_tt:0 "Opcional: excluye §YEl Gobierno Provisional§!.\nForma la §YFederación Euroafricana§!: nuevo nombre y bandera, espíritu nacional y §Gterritorios nacionales en el África del Norte francesa, Dakar y los départements de ultramar§! que posea Francia (también más adelante) y §Yreclamaciones§! sobre el resto de ellos.\nSustituye a cualquier nación que Francia haya formado antes (se elimina su espíritu de formación). Si Francia ya es el §YReino Eterno de Franquia§!, sigue siéndolo.\nRequiere controlar una capital en África: §YArgel§!, §YDakar§!, §YBrazzaville§! o §YChad§! (únelas con las decisiones de la §YFrancia Libre§!). Si Francia aún no posee ninguna, la nación se funda automáticamente en cuanto la tenga."
 FRW_provisional_government:0 "El Gobierno Provisional"
 FRW_provisional_government_desc:0 "Los Franceses Libres forman el Gobierno Provisional de la República Francesa, que promete elecciones y una nueva constitución en cuanto el país sea libre."
 FRW_provisional_government_tt:0 "Opcional: excluye §YLa Federación Euroafricana§!. Francia sigue siendo Francia y conserva la República."
 FRW_liberation_of_paris:0 "La Liberación de París"
 FRW_liberation_of_paris_desc:0 "Las campanas de Notre-Dame repican por primera vez en cuatro años. El gobierno regresa a la capital."
 FRW_liberation_of_paris_tt:0 "Las Fuerzas del Interior se unen al ejército: §G+50.000§! de mano de obra.\nRequiere el control de §YParís§!. París vuelve a ser francesa y la capital regresa allí."
 FRW_ff_chequers:0 "El Acuerdo de Chequers"
 FRW_ff_chequers_desc:0 "Churchill y De Gaulle firman un acuerdo: Gran Bretaña pagará, armará y abastecerá a los Franceses Libres, y Francia conservará su independencia de mando."
 FRW_ff_chequers_tt:0 "§G+1§! fábrica militar en el exilio.\nPrestigio de la Francia Libre: §G+5§!"
 FRW_ff_national_committee:0 "El Comité Nacional Francés"
 FRW_ff_national_committee_desc:0 "En Londres, los dispersos servicios de la Francia Libre se convierten en un verdadero gobierno, con comisarios de Guerra, Finanzas, Asuntos Exteriores y Colonias."
 FRW_ff_national_committee_tt:0 "Prestigio de la Francia Libre: §G+5§!"
 FRW_ff_bcra:0 "El BCRA"
 FRW_ff_bcra_desc:0 "El coronel Passy crea el Bureau Central de Renseignements et d'Action. Sus agentes dirigen redes desde Bretaña hasta Marsella."
 FRW_ff_cnr:0 "El Consejo Nacional de la Resistencia"
 FRW_ff_cnr_desc:0 "En un piso de la Rue du Four, los movimientos, partidos y sindicatos de la Resistencia se reúnen por primera vez bajo una dirección única."
 FRW_ff_cnr_tt:0 "Todos los estados franceses ocupados en Europa: resistencia §G+15§!.\nPrestigio de la Francia Libre: §G+10§!"
 FRW_ff_first_division:0 "La 1.ª División de la Francia Libre"
 FRW_ff_first_division_desc:0 "Legionarios, infantes de marina, infantería colonial y voluntarios de todos los rincones del imperio se agrupan en una sola división."
 FRW_ff_bir_hakeim:0 "Bir Hakeim"
 FRW_ff_bir_hakeim_desc:0 "Durante dieciséis días, la brigada de Koenig defiende un fuerte en ruinas en el desierto libio frente a los tanques de Rommel. El mundo descubre que los franceses vuelven a combatir."
 FRW_ff_bir_hakeim_tt:0 "Prestigio de la Francia Libre: §G+5§!"
 FRW_ff_second_armoured:0 "La 2.ª División Blindada"
 FRW_ff_second_armoured_desc:0 "Los veteranos del desierto de Leclerc reciben en Marruecos nuevo equipo: Sherman y semiorugas estadounidenses."
 FRW_ff_fafl:0 "Las Fuerzas Aéreas de la Francia Libre"
 FRW_ff_fafl_desc:0 "Unos cientos de pilotos y mecánicos huidos de Francia vuelan con la Royal Air Force bajo su propia escarapela."
 FRW_ff_groupe_lorraine:0 "El Groupe Lorraine"
 FRW_ff_groupe_lorraine_desc:0 "Tripulaciones de bombarderos francesas entrenadas en Gran Bretaña y Siria forman su propio grupo y vuelan en Boston contra objetivos en Francia y los Países Bajos."
 FRW_ff_normandie_niemen:0 "Normandie-Niemen"
 FRW_ff_normandie_niemen_desc:0 "Un escuadrón de pilotos de caza franceses parte a combatir en el Frente Oriental, a bordo de Yak soviéticos contra la Luftwaffe."
 FRW_ff_fnfl:0 "Las Fuerzas Navales de la Francia Libre"
 FRW_ff_fnfl_desc:0 "El almirante Muselier reúne los buques que escaparon a puertos británicos, desde el submarino Surcouf hasta un puñado de arrastreros."
 FRW_ff_corvettes:0 "Corbetas británicas"
 FRW_ff_corvettes_desc:0 "El Almirantazgo cede corbetas de la clase Flower a la Marina de la Francia Libre, que escoltan los convoyes del Atlántico."
 FRW_ff_corvettes_tt:0 "§G+1§! astillero en el exilio."
 FRW_ff_richelieu:0 "El Richelieu vuelve al combate"
 FRW_ff_richelieu_desc:0 "El gran acorazado, que yacía averiado en Dakar, zarpa hacia Nueva York para ser reparado y regresa a la guerra bajo la tricolor."
 FRW_ff_richelieu_tt:0 "§G+2§! astilleros en el exilio (astilleros estadounidenses)."
 FRW_ff_maquis:0 "El Maquis"
 FRW_ff_maquis_desc:0 "Jóvenes que huyen del trabajo forzoso en Alemania se echan a las montañas del Vercors, el Lemosín y los Alpes, donde la Resistencia los arma y los instruye."
 FRW_ff_maquis_tt:0 "Todos los estados franceses ocupados en Europa: resistencia §G+10§!.\nPrestigio de la Francia Libre: §G+5§!"
 FRW_ff_colonial_recruitment:0 "Reclutamiento en las colonias"
 FRW_ff_colonial_recruitment_desc:0 "Se abren oficinas de reclutamiento desde Dakar hasta Madagascar. Tiradores, goumiers y spahis formarán la mitad del ejército que libere Francia."
 FRW_ff_cfln:0 "El Comité Francés de Liberación Nacional"
 FRW_ff_cfln_desc:0 "En Argel, en junio de 1943, los Franceses Libres de De Gaulle y el Ejército de África de Giraud se unen bajo un solo comité, y sus tropas se funden en un solo ejército."
 FRW_ff_cfln_tt:0 "Prestigio de la Francia Libre: §G+10§!"
 FRW_ff_consultative_assembly:0 "La Asamblea Consultiva"
 FRW_ff_consultative_assembly_desc:0 "Delegados de la Resistencia, de los partidos y del antiguo parlamento se reúnen en Argel en noviembre de 1943. Es la primera asamblea que habla en nombre de Francia desde 1940, aunque sus miembros son designados, no elegidos."
 FRW_ff_cef:0 "El Cuerpo Expedicionario Francés"
 FRW_ff_cef_desc:0 "El cuerpo del general Juin, formado por tropas de montaña y divisiones coloniales, rompe la línea alemana en las montañas de Italia, donde otros habían fracasado."
 FRW_ff_dragoon:0 "Desembarco en Provenza"
 FRW_ff_dragoon_desc:0 "Doscientos mil soldados franceses desembarcan entre Tolón y Saint-Raphaël y avanzan por el valle del Ródano hacia Lyon y los Vosgos."
 FRW_ff_epuration:0 "La Épuration"
 FRW_ff_epuration_desc:0 "Tribunales especiales en cada département juzgan a los acusados de colaboración."
 FRW_ff_votes_for_women:0 "El voto femenino"
 FRW_ff_votes_for_women_desc:0 "Por la ordenanza de Argel de abril de 1944, las francesas obtienen el derecho de voto y el de presentarse a las elecciones."
 FRW_ff_securite_sociale:0 "La Sécurité Sociale"
 FRW_ff_securite_sociale_desc:0 "Siguiendo el programa de la Resistencia, todo trabajador queda asegurado contra la enfermedad, la vejez y los accidentes laborales."
 FRW_ff_securite_sociale_tt:0 "Inflación: §R+5§!"
 FRW_ff_reconstruction:0 "La reconstrucción de Francia"
 FRW_ff_reconstruction_desc:0 "Puentes, ferrocarriles, puertos y ciudades enteras yacen en ruinas. El Ministerio de Reconstrucción se pone manos a la obra."
 FRW_ff_reconstruction_tt:0 "Inflación: §R+10§! (la reconstrucción se paga a crédito)."
 FRW_ff_fourth_republic:0 "La Cuarta República"
 FRW_ff_fourth_republic_desc:0 "Una nueva constitución es aprobada en referéndum. El Gobierno Provisional cede el poder a una Asamblea elegida."
 FRW_ff_fourth_republic_tt:0 "Requiere §YEl Gobierno Provisional§!."
 FRW_ff_eurafrican_assembly:0 "La Asamblea Euroafricana"
 FRW_ff_eurafrican_assembly_desc:0 "Diputados de Dakar, Argel, Brazzaville y París se sientan juntos en una misma asamblea por primera vez."
 FRW_ff_eurafrican_assembly_tt:0 "Requiere §YLa Federación Euroafricana§!.\nTodos los estados propios en §YÁfrica§!: §G+10%§! de colaboración."
 FRW_eternal_kingdom:0 "El Reino Eterno de Franquia"
 FRW_eternal_kingdom_desc:0 "De los Alpes a Gibraltar, de Brest a las Tierras Altas y del Caribe al océano Índico, la antigua corona es restaurada bajo un almirante que jamás ha perdido una batalla en el mar. Francia se convierte en el Reino Eterno de Franquia."
 FRW_eternal_kingdom_tt:0 "Forma el §YReino Eterno de Franquia§!: nueva bandera, color azul oscuro en el mapa, espíritu nacional §YEl Reino Eterno§! y §Gterritorios nacionales en las tierras de España, Portugal y las islas escocesas§! que Francia posea (también en las que gane allí más adelante) y §Yreclamaciones§! sobre el resto.\nSustituye a cualquier nación formada anteriormente, y nunca podrá ser sustituido.\nMalo Kervadec muere al comenzar este enfoque; su hijo §YAymeric Kervadec§! es coronado al completarse."
 FRW_qol_state_reform:0 "La Comisión para la Reforma del Estado"
 FRW_qol_state_reform_desc:0 "Los expedientes se amontonan en todos los ministerios y un simple decreto puede tardar meses en recorrer las oficinas de la Tercera República. Una comisión de altos funcionarios ha recibido el encargo de simplificar los procedimientos."
 FRW_qol_state_reform_tt:0 "Desbloquea el departamento §YPolítica§! en el §YConsejo de Ministros§! (decisiones)."
 FRW_qol_cabinet:0 "Un gabinete más ágil"
 FRW_qol_cabinet_desc:0 "Se reduce el número de ministerios y se redefinen sus competencias, para que el Consejo de Ministros pueda tomar decisiones con mayor rapidez."
 FRW_qol_cabinet_tt:0 "Desbloquea el departamento §YEconomía§! en el §YConsejo de Ministros§!."
 FRW_qol_staff_college:0 "La Escuela de Estado Mayor"
 FRW_qol_staff_college_desc:0 "La École Supérieure de Guerre revisa sus cursos para preparar a los oficiales más jóvenes para el mando en una guerra moderna."
 FRW_qol_staff_college_tt:0 "Desbloquea el departamento §YEjército§! en el §YConsejo de Ministros§!."
 FRW_qol_logistics:0 "La Oficina de Logística"
 FRW_qol_logistics_desc:0 "Una única oficina en París planifica ahora el uso de ferrocarriles, camiones y depósitos de suministros para todo el ejército."
 FRW_qol_standards:0 "Equipamiento estandarizado"
 FRW_qol_standards_desc:0 "Se ordena a las fábricas de armas trabajar con normas comunes, para que fusiles, proyectiles y piezas de repuesto sirvan al equipo de todos los regimientos."
 FRW_qol_research_council:0 "El Consejo Superior de Investigación"
 FRW_qol_research_council_desc:0 "Un consejo de científicos queda adscrito a la Presidencia del Consejo, siguiendo el modelo de la subsecretaría de Investigación que ocupó Irène Joliot-Curie en 1936."
 FRW_qol_research_council_tt:0 "Desbloquea el departamento §YInvestigación§! en el §YConsejo de Ministros§!."
 FRW_qol_special_projects:0 "La Dirección de Proyectos Especiales"
 FRW_qol_special_projects_desc:0 "Los cohetes, los motores a reacción y el átomo son demasiado importantes para dejarlos en manos de talleres privados. Una dirección del Ministerio de Armamento se hace cargo de ellos."
 FRW_qol_special_projects_tt:0 "Desbloquea el departamento §YProyectos especiales§! en el §YConsejo de Ministros§!."
 FRW_qol_deuxieme_bureau:0 "Reorganizar el Deuxième Bureau"
 FRW_qol_deuxieme_bureau_desc:0 "El servicio de inteligencia militar y su sección de contraespionaje reciben nuevos fondos, nuevas oficinas y una línea directa con el gobierno."
 FRW_qol_deuxieme_bureau_tt:0 "Desbloquea el departamento §YAgencia de inteligencia§! en el §YConsejo de Ministros§!."
 FRW_qol_modern_state:0 "El Estado moderno"
 FRW_qol_modern_state_desc:0 "Tras años de reformas, un decreto llega a las prefecturas en semanas y no en meses."
 FRW_rhine_question:0 "La cuestión del Rin"
 FRW_rhine_question_desc:0 "Poincaré ocupó el Ruhr en 1923 y apoyó a los separatistas renanos, y el Sarre permaneció bajo administración de la Sociedad de Naciones, con sus minas en manos francesas, hasta 1935. Muchos en París siguen sosteniendo que la seguridad de Francia depende del Rin."
 FRW_demand_the_saar:0 "Exigir el Sarre"
 FRW_demand_the_saar_desc:0 "París califica ahora el plebiscito de enero de 1935 de farsa celebrada bajo presión nazi y exige la cesión del Sarre a Francia."
 FRW_rhenish_republic:0 "La República Renana"
 FRW_rhenish_republic_desc:0 "Los separatistas de 1923 fracasaron por falta de apoyo. Francia se propone ahora dar a Renania ese apoyo y ponerla bajo control francés."
 FRW_pyrenees_question:0 "La cuestión de los Pirineos"
 FRW_pyrenees_question_desc:0 "En Barcelona, los obreros libran la misma batalla que sus camaradas de París. Una Francia roja no tiene intención de repetir la política de no intervención de Blum."
 FRW_demand_catalonia:0 "La Comuna Catalana"
 FRW_demand_catalonia_desc:0 "La CNT y el POUM controlan Barcelona. París propone que Cataluña, anexionada a Francia bajo Napoleón en 1812, se una a la república obrera francesa."
 FRW_iberian_protectorate:0 "Una Iberia soviética"
 FRW_iberian_protectorate_desc:0 "París no abandonará España a Franco. El plan es convertir toda la península en una república fraterna guiada desde París."
 FRW_alpine_question:0 "La cuestión alpina"
 FRW_alpine_question_desc:0 "En Ginebra, el Valais y el valle de Aosta se habla francés, mientras Roma reclama Niza y Saboya. Las ligas quieren que Francia deje de ceder terreno en los Alpes y recupere lo que consideran francés."
 FRW_demand_romandy:0 "Exigir la Romandía"
 FRW_demand_romandy_desc:0 "Las ligas reclaman para Francia Ginebra, Lausana y el resto de la Suiza francófona."
 FRW_demand_aosta_nice:0 "Exigir el Piamonte y Aosta"
 FRW_demand_aosta_nice_desc:0 "La Casa de Saboya tomó su nombre de tierras situadas en la vertiente francesa de los Alpes. París reclama ahora el Piamonte y el valle de Aosta."
 FRW_swiss_anschluss:0 "Unión con Suiza"
 FRW_swiss_anschluss_desc:0 "Durante siglos, la neutralidad suiza se ha apoyado en sus montañas y su milicia. París ya no tiene intención de respetarla."
 FRW_corsica_and_sardinia:0 "Córcega y Cerdeña"
 FRW_corsica_and_sardinia_desc:0 "Cerdeña se encuentra a pocas millas al sur de Córcega, al otro lado del estrecho de Bonifacio. París sostiene que ambas islas deberían gobernarse juntas."
 FRW_latin_destiny:0 "Un destino latino"
 FRW_latin_destiny_desc:0 "Francia, Italia y España comparten la herencia de Roma. Entre las tres poseen la mayor parte de las costas del Mediterráneo occidental, de Gibraltar a Sicilia."
 FRW_latin_destiny_tt:0 "§GTerritorios nacionales§! en §YCerdeña§! (si Francia la posee)."
 FRW_benelux_question:0 "La herencia borgoñona"
 FRW_benelux_question_desc:0 "Luisa de Orleans fue la primera reina de los belgas, y los Países Bajos estuvieron antaño en el corazón de las tierras borgoñonas. Un rey de Francia puede invocar antiguas reclamaciones y lazos familiares en Bruselas y Luxemburgo."
 FRW_union_with_luxembourg:0 "Unión con Luxemburgo"
 FRW_union_with_luxembourg_desc:0 "Encajado entre Francia y Alemania, el Gran Ducado tiene pocas posibilidades de sostenerse solo. París le ofrece la unión."
 FRW_demand_wallonia:0 "Exigir Valonia"
 FRW_demand_wallonia_desc:0 "París exige que las provincias francófonas del sur de Bélgica sean devueltas a Francia."
 FRW_belgian_union:0 "Unión con Bélgica"
 FRW_belgian_union_desc:0 "Bélgica formó parte de Francia de 1795 a 1814. Ahora se pregunta a Bruselas si desea volver a ser francesa."
 FRW_batavian_union:0 "Unión con los Países Bajos"
 FRW_batavian_union_desc:0 "En 1810, Napoleón anexionó el Reino de Holanda a Francia. París se propone ahora hacer lo mismo."
 FRW_batavian_union_tt:0 "Si los §YPaíses Bajos§! son independientes, reciben una exigencia de unión (aceptar = anexión). Si son un títere francés, Francia los anexiona.\nForma el §YReino de Borgoña§!: nuevo nombre y bandera, espíritu nacional y §Gterritorios nacionales en las tierras de Bélgica, los Países Bajos y Luxemburgo§! que Francia posea (también en las que gane allí más adelante) y §Yreclamaciones§! sobre el resto.\nSustituye a cualquier nación que Francia haya formado antes (se elimina su espíritu de nación formable). Si Francia ya es el §YReino Eterno de Franquia§!, lo sigue siendo.\nRequiere el control de la totalidad de §YBélgica§!, los §YPaíses Bajos§! y §YLuxemburgo§! (anexionados, no como títeres). Si Francia aún no los controla, la nación se funda automáticamente en cuanto lo haga."
 FRW_reunions_complete:0 "El reino borgoñón restaurado"
 FRW_reunions_complete_desc:0 "Las antiguas tierras borgoñonas, de Flandes a Luxemburgo, vuelven a estar unidas bajo la corona francesa."
