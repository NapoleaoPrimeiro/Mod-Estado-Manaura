 FRW_mio_latecoere_req_tt:0 "Ha completado el enfoque §Y$FRW_darlan_programme$§!"
 FRW_brest_organization:0 "Arsenal de Brest"
 FRW_brest_organization_initial:0 "El dique seco de Salou"
 FRW_mio_brest_req_tt:0 "Ha completado el enfoque §Y$FRW_darlan_programme$§!"
 FRW_citroen_organization:0 "Citroën"
 FRW_citroen_organization_initial:0 "Cadenas de montaje del Quai de Javel"
 FRW_brandt_organization:0 "Edgar Brandt"
 FRW_brandt_organization_initial:0 "Talleres de morteros de Châtillon"
 FRW_hispano_organization:0 "Hispano-Suiza"
 FRW_hispano_organization_initial:0 "Fábrica de cañones de Bois-Colombes"
 FRW_european_research_name:0 "Consejo Europeo de Investigación para la Defensa"
 FRW_european_research_desc:0 "Los laboratorios y estados mayores de los socios europeos comparten sus resultados a través de un consejo común en París."
 FRW_latin_research_name:0 "Consejo Científico Latino"
 FRW_latin_research_desc:0 "Las universidades y arsenales de las naciones latinas intercambian ingenieros, patentes y resultados."
 FRW_join_european_research_tt:0 "Francia y sus socios de facción se unen al §YConsejo Europeo de Investigación para la Defensa§! (tecnología compartida)."
 FRW_join_latin_research_tt:0 "Francia y sus socios de facción se unen al §YConsejo Científico Latino§! (tecnología compartida)."
 FRW_trait_army_of_africa:0 "Ejército de África"
 FRW_trait_army_of_africa_desc:0 "Años en el Sáhara y en el Rif le han enseñado a mantener abastecido un ejército lejos de cualquier vía férrea."
 FRW_trait_ecole_de_guerre:0 "Profesor de la École de Guerre"
 FRW_trait_ecole_de_guerre_desc:0 "Enseñó a toda una generación de oficiales de Estado Mayor a planificar una batalla metódica."
 FRW_trait_armoured_pioneer:0 "Pionero de la división acorazada"
 FRW_trait_armoured_pioneer_desc:0 "Defendió la creación de una división acorazada francesa mucho antes de que el Estado Mayor la quisiera."
 FRW_trait_alpine_school:0 "Escuela de guerra alpina"
 FRW_trait_alpine_school_desc:0 "Entrenó a sus cazadores en los glaciares de los Alpes y en los fiordos del norte."
 frw_war.1.t:0 "El enemigo entra en París"
 frw_war.1.d:0 "Columnas de tropas [ROOT.GetAdjective] desfilaron esta mañana por los Campos Elíseos. El gobierno ya había abandonado la capital, y la ciudad fue declarada abierta para evitar su destrucción. Pocos parisinos presenciaron el desfile; la mayoría mantuvo las persianas cerradas."
 frw_war.1.a:0 "Francia ha perdido una batalla. No ha perdido la guerra."
 frw_war.1.b:0 "¡París es nuestro!"
 frw_war.1.c:0 "La Ciudad de la Luz se apaga."
 frw_war.2.t:0 "París liberado"
 frw_war.2.d:0 "Las campanas de Notre-Dame repicaron sobre la ciudad cuando las tropas francesas entraron en París. Tras la larga ocupación, las multitudes llenaron las calles desde la Porte d'Orléans hasta el Hôtel de Ville."
 frw_war.2.a:0 "¡París ultrajado, París destrozado, pero París liberado!"
 frw_war.2.b:0 "¡Vive la France!"
 FRW_inf_tt_m8:0 "Inflación: §G-8§!"
 FRW_inf_tt_m5:0 "Inflación: §G-5§!"
 FRW_inf_tt_m15:0 "Inflación: §G-15§!"
 FRW_inf_tt_m12:0 "Inflación: §G-12§!"
 FRW_inf_tt_p15:0 "Inflación: §R+15§!"
 FRW_inf_tt_m10:0 "Inflación: §G-10§!"
 FRW_dec_franc_rates:0 "Subir el tipo de descuento"
 FRW_dec_franc_rates_desc:0 "La Banque de France sube su tipo. El dinero se encarece y los precios se estabilizan; también se frenan las obras."
 FRW_dec_franc_bonds:0 "Emitir bonos de defensa nacional"
 FRW_dec_franc_bonds_desc:0 "Los ahorradores prestan sus francos al Estado en lugar de gastarlos. Carteles patrióticos cubren las paredes de todas las oficinas de correos."
 FRW_dec_franc_controls:0 "Control de precios y salarios"
 FRW_dec_franc_controls_desc:0 "Precios y salarios quedan congelados por decreto. Los comerciantes refunfuñan, los sindicatos refunfuñan, pero el franco aguanta."
 FRW_dec_franc_gold:0 "Vender oro de las reservas"
 FRW_dec_franc_gold_desc:0 "Parte del oro de las cámaras acorazadas de la Banque de France se vende en el extranjero para recomprar francos."
 FRW_dec_franc_austerity:0 "Un presupuesto de austeridad"
 FRW_dec_franc_austerity_desc:0 "Los decretos-leyes recortan los sueldos de los funcionarios y las pensiones de los veteranos. El presupuesto queda equilibrado, en medio del descontento general."
 FRW_dec_franc_cfa:0 "La zona del franco colonial"
 FRW_dec_franc_cfa_desc:0 "Las colonias reciben su propio franco, vinculado al franco de París. Parte de la presión sobre la moneda se traslada a África."
 FRW_dec_franc_print:0 "Imprimir dinero para el rearme"
 FRW_dec_franc_print_desc:0 "Las prensas de la Banque de France funcionan día y noche. Las fábricas cobran de inmediato; la inflación pasará la factura más tarde."
 FRW_dec_franc_tripartite:0 "El Acuerdo Monetario Tripartito"
 FRW_dec_franc_tripartite_desc:0 "Londres y Washington acuerdan mantener estable el franco devaluado junto con París. Es el fin del bloque del oro."
 FRW_franc_cat:0 "El franco"
 FRW_franc_cat_desc:0 "La inflación se sitúa en el §Y[?FRW_inflation|0]%§! (§Y[?FRW_inf_trend|2]§! puntos al mes). Reservas de oro de la Banque de France: §Y[?FRW_gold|0] t§! ([?FRW_gold_trend|+0] t al mes).\n\nPor debajo del 20%, un franco sólido acelera la construcción. Por encima del 20%, la inflación aumenta el coste de los bienes de consumo, reduce la estabilidad y ralentiza la construcción. Al 100%: bienes de consumo §R+12%§!, estabilidad §R-12%§!, velocidad de construcción §R-8%§!.\nCobertura de oro: por encima de §Y2000 t§! estabiliza el franco, por debajo de §Y1000 t§! lo debilita y por debajo de §Y400 t§! las cámaras acorazadas quedan vacías.\n\n§YVariación mensual de la inflación§!\n- La Banque de France aguanta: §G-0.5§![FRW_inf_line_1][FRW_inf_line_2][FRW_inf_line_3][FRW_inf_line_4][FRW_inf_line_5][FRW_inf_line_6][FRW_inf_line_7][FRW_inf_line_8][FRW_inf_line_9][FRW_inf_line_10][FRW_inf_line_11][FRW_inf_line_12][FRW_inf_line_13][FRW_inf_line_14][FRW_inf_line_15][FRW_inf_line_16][FRW_inf_line_17][FRW_inf_line_18]\n\n§YVariación mensual del oro§![FRW_gold_line_0][FRW_gold_line_1][FRW_gold_line_2][FRW_gold_line_3][FRW_gold_line_4][FRW_gold_line_5][FRW_gold_line_6][FRW_gold_line_7][FRW_gold_line_8][FRW_gold_line_9][FRW_gold_line_10][FRW_gold_line_11]"
 FRW_liberation_prestige_tt:0 "Por cada estado francés de Europa liberado del enemigo: prestigio de la Francia Libre §G+2§!."
 FRW_gold_m300_tt:0 "Reservas de oro: §R-300 t§!"
 FRW_cfa_drift_tt:0 "A partir de ahora, la inflación baja otros §G0.25§! puntos al mes y las colonias envían §G+5 t§! de oro al mes."
 FRW_tripartite_drift_tt:0 "A partir de ahora, la inflación baja otros §G0.25§! puntos al mes y §G+5 t§! de oro vuelven a París cada mes."
 FRW_tight_money_desc:0 "El crédito es caro. Se inician menos proyectos nuevos, pero el franco está a salvo."
 FRW_austerity_desc:0 "Los recortes del gasto han calmado a los mercados, pero los funcionarios, los veteranos y los constructores los sufren por igual."
 FRW_price_riots_desc:0 "Las multitudes asaltan los mercados y las panaderías. El franco vale menos cada semana."
 FRW_new_franc_desc:0 "Una reforma monetaria ha borrado los ahorros de la noche a la mañana. El franco vuelve a ser sólido, pero la confianza en el Estado no."
 FRW_fighting_france_desc:0 "Todo el mundo aliado reconoce ahora a la Francia Combatiente como la verdadera Francia."
 FRW_printing_press_desc:0 "El dinero nuevo fluye hacia las fábricas. La inflación lo seguirá."
 FRW_franc:0 "El franco"
 FRW_franc_desc:0 "Inflación: §Y[?FRW_inflation|0]%§!. Gestiónala en el menú de decisiones §YEl franco§!."
 FRW_ff_prestige_mod:0 "Prestigio de la Francia Libre"
 FRW_ff_prestige_mod_desc:0 "Prestigio de la Francia Libre: §Y[?FRW_ff_prestige|0]§! de 100. Cuanto más alto sea, más dispuestos estarán los gobernadores a unirse."
 FRW_dec_rally_eq:0 "Enviado al África Ecuatorial Francesa"
 FRW_dec_rally_eq_desc:0 "Un enviado de la Francia Libre intenta ganarse al gobernador y a la guarnición.\n\nProbabilidad de éxito: §Y[?FRW_ffc_eq|0]%§!"
 FRW_dec_exped_eq:0 "Expedición al África Ecuatorial Francesa"
 FRW_dec_exped_eq_desc:0 "Las tropas de la Francia Libre desembarcan con apoyo aliado e intentan tomar la región. A veces basta con que aparezcan frente a la costa.\n\nProbabilidad de éxito: §Y[?FRW_ffe_eq|0]%§!"
