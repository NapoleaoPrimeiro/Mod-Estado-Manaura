 frw_sys.73.d:0 "Nuestro desembarco topó con una resistencia decidida de la guarnición de Vichy y tuvo que suspenderse. Se perdieron hombres y material, y la propaganda de Vichy lo celebra."
 frw_sys.73.a:0 "Volveremos."
 frw_sys.24.t:0 "Madagascar y el océano Índico se unen a la Francia Libre"
 frw_sys.24.d:0 "El gobernador de Tananarive ha entregado la isla. El océano Índico queda cerrado al Eje."
 frw_sys.24.a:0 "¡Vive la France libre!"
 frw_sys.34.t:0 "Madagascar y el océano Índico siguen leales a Vichy"
 frw_sys.34.d:0 "La guarnición de Diego-Suárez se mantiene firme. Madagascar sigue leal a Vichy. La próxima vez nuestros enviados irán mejor preparados."
 frw_sys.34.a:0 "Lo intentaremos de nuevo."
 frw_sys.64.t:0 "Nuestras tropas desembarcan en Madagascar y el océano Índico"
 frw_sys.64.d:0 "Columnas de la Francia Libre, apoyadas por buques y aviones aliados, han alcanzado la capital de la región. El gobernador de Tananarive ha entregado la isla. El océano Índico queda cerrado al Eje."
 frw_sys.64.a:0 "La Cruz de Lorena ondea de nuevo."
 frw_sys.74.t:0 "La expedición a Madagascar y el océano Índico ha fracasado"
 frw_sys.74.d:0 "Nuestro desembarco topó con una resistencia decidida de la guarnición de Vichy y tuvo que suspenderse. Se perdieron hombres y material, y la propaganda de Vichy lo celebra."
 frw_sys.74.a:0 "Volveremos."
 frw_sys.25.t:0 "La Somalia Francesa se une a la Francia Libre"
 frw_sys.25.d:0 "Aislada y hambrienta bajo el bloqueo británico, Yibuti se ha unido a la Francia Libre."
 frw_sys.25.a:0 "¡Vive la France libre!"
 frw_sys.35.t:0 "La Somalia Francesa sigue leal a Vichy"
 frw_sys.35.d:0 "La pequeña guarnición de Yibuti se niega a unirse y el bloqueo continúa. La próxima vez nuestros enviados irán mejor preparados."
 frw_sys.35.a:0 "Lo intentaremos de nuevo."
 frw_sys.65.t:0 "Nuestras tropas desembarcan en la Somalia Francesa"
 frw_sys.65.d:0 "Columnas de la Francia Libre, apoyadas por buques y aviones aliados, han alcanzado la capital de la región. Aislada y hambrienta bajo el bloqueo británico, Yibuti se ha unido a la Francia Libre."
 frw_sys.65.a:0 "La Cruz de Lorena ondea de nuevo."
 frw_sys.75.t:0 "La expedición a la Somalia Francesa ha fracasado"
 frw_sys.75.d:0 "Nuestro desembarco topó con una resistencia decidida de la guarnición de Vichy y tuvo que suspenderse. Se perdieron hombres y material, y la propaganda de Vichy lo celebra."
 frw_sys.75.a:0 "Volveremos."
 frw_sys.26.t:0 "La Indochina Francesa se une a la Francia Libre"
 frw_sys.26.d:0 "Hanói y Saigón se han unido a la Francia Libre. Al almirante Decoux lo han embarcado de vuelta a casa."
 frw_sys.26.a:0 "¡Vive la France libre!"
 frw_sys.36.t:0 "La Indochina Francesa sigue leal a Vichy"
 frw_sys.36.d:0 "El almirante Decoux conserva Indochina para Vichy, bajo la mirada de la guarnición japonesa. La próxima vez nuestros enviados irán mejor preparados."
 frw_sys.36.a:0 "Lo intentaremos de nuevo."
 frw_sys.66.t:0 "Nuestras tropas desembarcan en la Indochina Francesa"
 frw_sys.66.d:0 "Columnas de la Francia Libre, apoyadas por buques y aviones aliados, han alcanzado la capital de la región. Hanói y Saigón se han unido a la Francia Libre. Al almirante Decoux lo han embarcado de vuelta a casa."
 frw_sys.66.a:0 "La Cruz de Lorena ondea de nuevo."
 frw_sys.76.t:0 "La expedición a la Indochina Francesa ha fracasado"
 frw_sys.76.d:0 "Nuestro desembarco topó con una resistencia decidida de la guarnición de Vichy y tuvo que suspenderse. Se perdieron hombres y material, y la propaganda de Vichy lo celebra."
 frw_sys.76.a:0 "Volveremos."
 FRW_inf_tt_m35:0 "Inflación: §G-35§!"
 frw_sys.3.t:0 "Hiperinflación"
 frw_sys.3.d:0 "Los billetes se llevan en cestas y los precios cambian dos veces al día. El franco está al borde del colapso. Los expertos del Ministerio de Finanzas proponen una reforma monetaria radical: un franco nuevo, cien de los antiguos por uno nuevo."
 frw_sys.3.a:0 "Introducir el nuevo franco."
 frw_sys.3.b:0 "Ahora no. Aguantaremos."
 frw_sys.4.t:0 "El oro se ha perdido"
 frw_sys.4.d:0 "El oro de la Banque de France no se sacó a tiempo. Ahora está en manos del ocupante, y la Francia Libre tendrá que arreglárselas sin él."
 frw_sys.4.a:0 "Deberíamos haberlo enviado a Dakar."
 frw_sys.50.t:0 "Los Aliados reconocen a la Francia Libre"
 frw_sys.50.d:0 "Londres y Washington tratan ahora a la Francia Libre como un verdadero aliado. Ponen a nuestra disposición armas, créditos y capacidad fabril en Gran Bretaña."
 frw_sys.50.a:0 "Francia vuelve a sentarse a la mesa."
 frw_sys.51.t:0 "La Francia Combatiente"
 frw_sys.51.d:0 "Los gobiernos aliados tratan con el comité de la Francia Libre como el gobierno de Francia. Los embajadores que antes acudían a Vichy van ahora a Carlton Gardens."
 frw_sys.51.a:0 "¡Vive la France combattante!"
 frw_sys.1.t:0 "El franco se desploma"
 frw_sys.1.d:0 "Los precios en París se han duplicado en un año. Las amas de casa hacen cola para comprar pan, los sindicatos exigen salarios más altos y los periódicos hablan de 1926. El ministro de Finanzas pide medidas de emergencia."
 frw_sys.1.a:0 "Tomar la amarga medicina."
 frw_sys.1.b:0 "La nación lo soportará; Francia tiene otras preocupaciones."
 frw_sys.2.t:0 "El Gobierno en el exilio"
 frw_sys.2.d:0 "Francia ha caído, pero el gobierno sigue luchando. La rama de la Francia Libre del árbol de enfoques está ahora abierta, y el menú de decisiones §YFrancia Libre§! te permite recuperar las colonias que fueron entregadas a Vichy."
 frw_sys.2.a:0 "La llama de la resistencia francesa no debe apagarse."
 frw_sys.10.t:0 "La flota en Mers-el-Kébir"
 frw_sys.10.d:0 "El armisticio entregó la flota a Vichy. En Mers-el-Kébir, Tolón y Alejandría los buques permanecen fondeados, con sus tripulaciones sin saber a quién obedecer. Londres no permitirá que caigan en manos alemanas, y la Francia Libre debe decidir qué decir a las tripulaciones."
 frw_sys.10.a:0 "Llamar a los marineros a unirse a nosotros."
 frw_sys.10.a.tt:0 "Probabilidad (§Y20%§! + 40% del prestigio): parte de la flota de Vichy (§Yaproximadamente un tercio§!) zarpa para unirse a la Francia Libre, §G+5§! de prestigio. En caso contrario, §R-5§! de prestigio."
 frw_sys.10.b:0 "Que la Royal Navy lo resuelva."
 frw_sys.10.b.tt:0 "La Royal Navy ataca a la flota de Vichy: Vichy pierde §Yun acorazado, un crucero de batalla y tres destructores§!."
 frw_sys.10.c:0 "Los buques franceses nunca dispararán contra buques franceses."
 frw_sys.11.t:0 "Los marineros se unen a nosotros"
 frw_sys.11.d:0 "Varios buques se escabulleron del puerto por la noche y navegan ahora hacia puertos de la Francia Libre, con sus tripulaciones vitoreando en cubierta."
 frw_sys.11.a:0 "Bienvenidos a bordo."
 frw_sys.12.t:0 "La flota permanece con Vichy"
 frw_sys.12.d:0 "El almirante Darlan ha confinado a las tripulaciones en sus buques. Ni un solo navío ha respondido a nuestra llamada."
 frw_sys.12.a:0 "Un golpe amargo."
 frw_sys.40.t:0 "Un gobernador ha desertado"
 frw_sys.40.d:0 "Uno de nuestros gobernadores coloniales se ha pasado a los disidentes de Londres. Su territorio enarbola ahora la Cruz de Lorena."
 frw_sys.40.a:0 "¡Traidores!"
 FRW_hook_devalue_the_franc_0_tt:0 "Inflación: §G-10§!"
 FRW_hook_reform_banque_de_france_0_tt:0 "A partir de ahora, la inflación baja otros §G0.5§! puntos al mes."
 FRW_hook_war_economy_0_tt:0 "Inflación: §R+5§!"
 FRW_hook_appeal_of_18_june_0_tt:0 "El prestigio de la Francia Libre empieza en §Y20§! de 100 y se abren las decisiones §YFrancia Libre§!. Elimina §YDerrotismo§!."
 FRW_hook_continue_the_fight_0_tt:0 "Prestigio de la Francia Libre: §G+5§!"
 FRW_hook_free_french_forces_0_tt:0 "Prestigio de la Francia Libre: §G+5§!"
 FRW_hook_rally_the_colonies_0_tt:0 "Prestigio de la Francia Libre: §G+10§!"
 FRW_hook_leclerc_column_0_tt:0 "Prestigio de la Francia Libre: §G+5§!"
 FRW_hook_brazzaville_conference_0_tt:0 "Prestigio de la Francia Libre: §G+10§!"
 FRW_hook_the_resistance_0_tt:0 "Prestigio de la Francia Libre: §G+5§!"
 FRW_return_cat:0 "África francesa en manos aliadas"
 FRW_return_cat_desc:0 "Tropas aliadas ocupan partes del África francesa. Pídeles que devuelvan el territorio a Francia, con cortesía o con una oferta que difícilmente puedan rechazar.\n\nPrestigio de la Francia Libre: §Y[?FRW_ff_prestige|0]§!"
 FRW_dec_return_request:0 "Pedir a [FROM.GetName] que devuelva el África francesa"
 FRW_dec_return_request_desc:0 "[FROM.GetName] controla territorio francés en África. Una petición diplomática cuesta poco, pero podrían negarse."
 FRW_dec_return_request_tt:0 "[FROM.GetName] decide. Una IA acepta con más facilidad cuanto mayor sea nuestro §Yprestigio de la Francia Libre§! (desde aproximadamente un §Y50%§! hasta un §Y95%§!).\nSi acepta, todos los estados §Yfranceses§! de §YÁfrica§! que controle [FROM.GetName] pasan a Francia."
 FRW_dec_return_buy_pp:0 "Recomprar el África francesa a [FROM.GetName]"
 FRW_dec_return_buy_pp_desc:0 "Francia ofrece concesiones y créditos a cambio de sus territorios africanos."
 FRW_dec_return_buy_tt:0 "Una IA siempre acepta. [FROM.GetName] recibe §Y60§! de poder político; si se niega, recuperamos nuestros §Y100§! de poder político.\nSi acepta, todos los estados §Yfranceses§! de §YÁfrica§! que controle [FROM.GetName] pasan a Francia."
 FRW_dec_return_buy_gold:0 "Pagar el África francesa en oro"
 FRW_dec_return_buy_gold_desc:0 "Trescientas toneladas del oro de la Banque de France a cambio de la devolución del África francesa.\n\nOro restante: §Y[?FRW_gold|0] t§!"
 FRW_dec_return_gold_tt:0 "Reservas de oro: §R-300 t§!. Una IA siempre acepta. [FROM.GetName] recibe §YOro francés§! durante un año (bienes de consumo §G-5%§!); si se niega, el oro vuelve.\nSi acepta, todos los estados §Yfranceses§! de §YÁfrica§! que controle [FROM.GetName] pasan a Francia."
 frw_ret.hand_tt:0 "Todos los estados §Yfranceses§! de §YÁfrica§! que controlamos pasan a §YFrancia§!."
 frw_ret.1.t:0 "Francia reclama sus colonias"
 frw_ret.1.d:0 "El gobierno francés nos recuerda que los territorios africanos que ocupan ahora nuestras tropas son franceses, y pide que se devuelvan a su administración."
 frw_ret.1.a:0 "Son nuestros aliados. Entregádselos."
 frw_ret.1.b:0 "No mientras dure la guerra."
 frw_ret.2.t:0 "Una oferta francesa"
 frw_ret.2.d:0 "París ofrece concesiones comerciales y créditos si devolvemos los territorios franceses de África que ocupan nuestras tropas."
 frw_ret.2.a:0 "Un precio justo. De acuerdo."
 frw_ret.2.b:0 "No estamos en venta."
 frw_ret.3.t:0 "Oro francés por el África francesa"
 frw_ret.3.d:0 "Los franceses ofrecen trescientas toneladas de oro de las reservas de la Banque de France a cambio de la devolución de sus territorios africanos."
 frw_ret.3.a:0 "El oro habla más alto que las palabras. De acuerdo."
 frw_ret.3.b:0 "Guárdense su oro."
 frw_ret.10.t:0 "Regresa el África francesa"
 frw_ret.10.d:0 "Nuestros aliados nos han devuelto los territorios franceses de África. La tricolor ondea de nuevo sobre los edificios gubernamentales."
 frw_ret.10.a:0 "Merci, mes amis."
 frw_ret.11.t:0 "Nuestra petición ha sido rechazada"
 frw_ret.11.d:0 "Nuestros aliados no devolverán por ahora los territorios franceses de África."
 frw_ret.11.a:0 "Volveremos a pedirlo."
 FRW_french_gold_payment_desc:0 "Oro pagado por Francia a cambio de la devolución de sus territorios africanos."
 FRW_ff_chequers_spirit_desc:0 "Gran Bretaña financia, arma y abastece a los Franceses Libres, y reconoce a De Gaulle como su líder."
 FRW_ff_national_committee_spirit_desc:0 "El Comité Nacional Francés gobierna desde Londres."
 FRW_ff_bcra_spirit_desc:0 "El servicio de inteligencia de la Francia Libre dirige redes por toda la Francia ocupada."
 FRW_ff_cnr_spirit_desc:0 "El Conseil National de la Résistance une a los movimientos."
 FRW_ff_bir_hakeim_spirit_desc:0 "El ejército recuerda los dieciséis días en el desierto."
 FRW_ff_fafl_spirit_desc:0 "Los pilotos franceses vuelven a volar bajo la Cruz de Lorena."
 FRW_ff_normandie_spirit_desc:0 "Pilotos franceses vuelan en Yak con la Fuerza Aérea Roja."
 FRW_ff_fnfl_spirit_desc:0 "Los buques de la Francia Libre escoltan los convoyes del Atlántico."
 FRW_ff_securite_sociale_spirit_desc:0 "Todo asalariado está asegurado. Es costoso, y muy popular."
 FRW_ff_reconstruction_spirit_desc:0 "Francia reconstruye lo que la guerra destruyó."
 FRW_ff_fourth_republic_spirit_desc:0 "Una Asamblea electa vuelve a gobernar Francia."
 FRW_ff_eurafrican_assembly_spirit_desc:0 "Europa y África comparten un mismo parlamento."
 FRW_ff_lorraine_spirit_desc:0 "Las tripulaciones de bombarderos franceses realizan sus propias misiones sobre Francia."
 FRW_ff_richelieu_spirit_desc:0 "El acorazado francés más moderno vuelve a combatir."
 FRW_ff_maquis_spirit_desc:0 "Las colinas de Francia están llenas de hombres armados."
 FRW_ff_colonial_recruitment_spirit_desc:0 "Tiradores de África llenan las filas del ejército de liberación."
 FRW_ff_cfln_spirit_desc:0 "Un comité, un ejército, una Francia."
 FRW_ff_cef_spirit_desc:0 "Las tropas de montaña de Juin abren el camino."
 FRW_ff_dragoon_spirit_desc:0 "El ejército sabe cómo desembarcar en una costa hostil."
 FRW_ff_dakar_tt:0 "El §YÁfrica Occidental Francesa§! (Dakar) se ha unido a la Francia Libre"
 FRW_ff_sov_fights_tt:0 "La §YUnión Soviética§! está en guerra con §YAlemania§!"
 RULE_FRW_SECRET_PATHS:0 "France Rework: Caminos secretos"
 RULE_FRW_SECRET_PATHS_ENABLED:0 "Activado"
 RULE_FRW_SECRET_PATHS_ENABLED_DESC:0 "Francia puede desbloquear las vías secretas: el capitán corsario de Saint-Malo (su flota, los asaltos a las islas y el reino ibérico) esperando tras Suspender las Cámaras, los sindicalistas revolucionarios de la CGT manteniendo ocupadas las fábricas y los neosocialistas de Marcel Déat escuchándolos."
 RULE_FRW_SECRET_PATHS_DISABLED:0 "Desactivado (recomendado para multijugador competitivo)"
 RULE_FRW_SECRET_PATHS_DISABLED_DESC:0 "Las decisiones que desbloquean las vías secretas nunca aparecen: ni capitán, ni vía de la CGT, ni vía de Déat. Solo pueden jugarse las vías políticas habituales."
 FRW_deat_neosocialism:0 "Orden, autoridad, nación"
 FRW_deat_neosocialism_desc:0 "En el congreso socialista de 1933, Adrien Marquet y Marcel Déat dijeron al partido que debía ganarse a las clases medias con «orden, autoridad, nación». Blum hizo que los expulsaran. Los neosocialistas ofrecen a la República un Estado fuerte y una economía planificada."
 FRW_deat_neosocialism_tt:0 "Requiere el apoyo de §YMarcel Déat§! (decisión §YGanarse a Marcel Déat§!, 45 días)."
 FRW_deat_labour_plan:0 "El Plan del Trabajo"
 FRW_deat_labour_plan_desc:0 "En Bélgica, Henri de Man ha mostrado el camino: el crédito, la energía y la industria pesada bajo dirección pública, y todo lo demás en manos privadas. Los planificadores neosocialistas redactan una versión francesa."
 FRW_deat_national_credit:0 "Una Oficina Nacional de Crédito"
 FRW_deat_national_credit_desc:0 "El Banco de Francia y los grandes bancos de depósito quedan bajo la autoridad de una Oficina Nacional de Crédito. Las «doscientas familias» pierden su control sobre el Tesoro, y es el Estado quien decide adónde va el dinero."
 FRW_deat_strong_state:0 "El Estado fuerte"
 FRW_deat_strong_state_desc:0 "Los decretos-ley se convierten en la norma. El Parlamento vota el presupuesto y el Plan una vez al año, y entre tanto gobierna el ejecutivo. Los críticos de Déat en la izquierda dicen que su socialismo del orden mira más hacia Roma que hacia Jaurès."
 FRW_deat_die_for_danzig:0 "¿Morir por Dánzig?"
 FRW_deat_die_for_danzig_desc:0 "«¿Hay que morir por Dánzig?», pregunta Déat en el periódico L'Œuvre. Los campesinos franceses, escribe, no irán a la guerra por una ciudad libre a orillas del Báltico. El artículo divide al país, y sus críticos lo llaman el primer paso en el camino hacia Berlín."
 FRW_deat_die_for_danzig_tt:0 "Los neosocialistas deben elegir ahora: permanecer en la §YRepública§! o fundar el §YPartido único§!."
 FRW_deat_planist_republic:0 "La República planista"
 FRW_deat_planist_republic_desc:0 "Déat permanece dentro de la República. El Plan queda consagrado por ley, la Cámara conserva su derecho a votarlo y un Consejo de la Economía reúne en una misma mesa a sindicatos, patronos e ingenieros."
 FRW_deat_x_crise:0 "Los ingenieros de X-Crise"
 FRW_deat_x_crise_desc:0 "Los politécnicos del círculo X-Crise, entre ellos Jean Coutrot, Louis Vallon y el joven Alfred Sauvy, abandonan sus grupos de estudio por los ministerios. Por primera vez, Francia está dirigida por planificadores."
 FRW_deat_republic_of_order:0 "La República del orden"
 FRW_deat_republic_of_order_desc:0 "Por primera vez desde la guerra, un gabinete sobrevive a su presupuesto y el Plan cumple sus objetivos. Los partidarios de Déat dicen que ningún parlamento habría logrado tanto."
 FRW_deat_single_party:0 "El Partido único"
 FRW_deat_single_party_desc:0 "Socialistas, veteranos y hombres de las ligas, sostiene Déat, quieren todos lo mismo: una revolución nacional y popular. Los llama a unirse en un solo partido, el Rassemblement National Populaire, y a cerrar la Cámara para siempre."
 FRW_deat_single_party_tt:0 "Requiere al menos un §Y15%§! de popularidad del §Yfascismo§!."
 FRW_deat_labour_front:0 "El Frente del Trabajo"
 FRW_deat_labour_front_desc:0 "Los sindicatos y las federaciones patronales se fusionan en un único Frente del Trabajo. Las huelgas y los cierres patronales quedan prohibidos por igual; el Plan fija salarios y precios."
 FRW_deat_national_legion:0 "La Legión Nacional Popular"
 FRW_deat_national_legion_desc:0 "El RNP forma su propia legión de voluntarios. Desfila tanto con palas como con fusiles, y sus reclutas proceden tanto de las fábricas como de las antiguas ligas."
 FRW_deat_new_europe:0 "El Nuevo Orden Europeo"
 FRW_deat_new_europe_desc:0 "Déat sueña con una Europa a la vez socialista y nacional, de Brest a Bucarest, con París como segunda capital. Se invita a unirse a Bruselas, La Haya, Berna y Copenhague."
 FRW_deat_new_europe_tt:0 "Funda el §YNuevo Orden Europeo§! (si Francia no pertenece a ninguna facción) e invita a §YBélgica§!, los §YPaíses Bajos§!, §YLuxemburgo§!, §YSuiza§! y §YDinamarca§!."
 FRW_deat_continental_economy:0 "La economía continental"
 FRW_deat_continental_economy_desc:0 "Una unión europea de compensación, un plan común para el carbón y el acero y un solo mercado desde el Atlántico hasta el Vístula. Déat lo llama socialismo continental."
 FRW_cgt_unions_take_power:0 "Todo el poder para los sindicatos"
 FRW_cgt_unions_take_power_desc:0 "En 1906, la CGT declaró en Amiens que el sindicato, y no el partido, sería la célula de la sociedad futura. Pierre Besnard y los sindicalistas revolucionarios exigen ahora al movimiento que cumpla su palabra: el Partido puede ocupar el Hôtel de Ville, pero serán los sindicatos quienes dirijan Francia."
 FRW_cgt_unions_take_power_tt:0 "Requiere el apoyo de §YPierre Besnard§! (decisión §YGanarse a Pierre Besnard§!, 45 días)."
 FRW_cgt_factory_committees:0 "Los comités de fábrica"
 FRW_cgt_factory_committees_desc:0 "En cada fábrica, un comité elegido en el taller asume la dirección. Ingenieros y capataces siguen en sus puestos, pero ahora responden ante los hombres y mujeres de los bancos de trabajo."
 FRW_cgt_local_unions:0 "Gobiernan los sindicatos locales"
 FRW_cgt_local_unions_desc:0 "Los prefectos son enviados a casa. En cada ciudad, la sección sindical local y sus delegados asumen las tareas del ayuntamiento, desde el racionamiento del pan hasta los tranvías."
 FRW_cgt_bourses_du_travail:0 "Las Bourses du Travail"
 FRW_cgt_bourses_du_travail_desc:0 "Fernand Pelloutier quería que las Bolsas de Trabajo fueran las escuelas de la clase obrera. Para lograrlo, en cada ciudad abren bibliotecas, clases nocturnas y cursos técnicos."
 FRW_cgt_confederal_congress:0 "El Congreso Confederal"
 FRW_cgt_confederal_congress_desc:0 "Los delegados de todas las federaciones se reúnen en la Mutualité. Las decisiones suben de la fábrica al congreso, en lugar de bajar desde un comité central. Las ocupaciones de fábricas terminan, pues los ocupantes dirigen ya las empresas."
 FRW_cgt_confederal_congress_tt:0 "Pone fin a la §YOleada de huelgas§! y protege a Francia del §Rlevantamiento comunista§! que, de otro modo, provocaría una estabilidad baja."
 FRW_cgt_red_black_columns:0 "Las columnas rojinegras"
 FRW_cgt_red_black_columns_desc:0 "Las milicias sindicales forman columnas bajo la bandera roja y negra. Eligen a sus oficiales y luchan con dureza, pero no aceptan de buen grado las órdenes."
 FRW_cgt_iwa:0 "La Asociación Internacional de los Trabajadores"
 FRW_cgt_iwa_desc:0 "Besnard fue secretario de la Asociación Internacional de los Trabajadores (AIT), la internacional sindicalista. Con Francia en manos de los sindicatos, sus congresos se trasladan a París."
 FRW_cgt_aid_the_cnt:0 "Ayudar a la CNT"
 FRW_cgt_aid_the_cnt_desc:0 "Fusiles y camiones cruzan los Pirineos para la CNT y las columnas anarquistas de Cataluña y Aragón."
 FRW_cgt_collectivise_land:0 "Colectivizar la tierra"
 FRW_cgt_collectivise_land_desc:0 "Los jornaleros se apoderan de las grandes fincas de la Beauce y del Midi. Los pequeños propietarios pueden unirse a las colectividades o conservar sus campos."
 FRW_cgt_workers_self_defence:0 "Autodefensa obrera"
 FRW_cgt_workers_self_defence_desc:0 "El congreso acepta que, al fin y al cabo, la revolución necesita un ejército, pero uno que defienda las comunas y no tenga estado mayor propio."
 FRW_cgt_iberian_federation:0 "La Federación Ibérica"
 FRW_cgt_iberian_federation_desc:0 "En Barcelona, la CNT habla de una federación libre de los pueblos ibéricos. París promete ayudar a hacerla realidad."
 FRW_cgt_iberian_federation_tt:0 "Objetivo de guerra §Yderrocar el gobierno§! contra §YEspaña§! (salvo que España sea comunista o aliada)."
 FRW_cgt_libertarian_commune:0 "La Comuna libertaria"
 FRW_cgt_libertarian_commune_desc:0 "Francia no tiene ni patronos ni burócratas, solo federaciones de productores libres. Si una sociedad así puede librar una guerra moderna es una pregunta que el congreso prefiere no plantearse."
 FRW_neosocialism:0 "Neosocialismo"
 FRW_planist_republic:0 "La República planista"
 FRW_rnp_spirit:0 "Rassemblement National Populaire"
 FRW_continental_economy:0 "La economía continental"
 FRW_syndicalist_order:0 "El orden sindicalista"
 FRW_syndicalist_order_2:0 "La Comuna libertaria"
 FRW_red_black_columns:0 "Las columnas rojinegras"
 FRW_leader_deat:0 "Marcel Déat"
 FRW_leader_deat_desc:0 "Normalien y veterano de guerra, Marcel Déat fue considerado en su día el sucesor de Blum. En 1933 rompió con la SFIO y fundó los neosocialistas, que quieren una economía planificada, un Estado fuerte y la paz casi a cualquier precio."
 FRW_leader_deat_fascist_desc:0 "Marcel Déat ha roto con la democracia parlamentaria. Su Rassemblement National Populaire quiere un partido único, un Frente del Trabajo corporativista y una Europa socialista y nacional."
 FRW_leader_besnard:0 "Pierre Besnard"
 FRW_leader_besnard_desc:0 "Ferroviario de Anjou, Pierre Besnard dirigió a los sindicalistas revolucionarios de la CGT-SR y fue secretario de la Asociación Internacional de los Trabajadores. Sostiene que deben ser los sindicatos, y no un partido, quienes dirijan la nueva sociedad."
 FRW_SYNDIC:0 "Francia sindicalista"
 FRW_SYNDIC_DEF:0 "la Francia sindicalista"
 FRW_SYNDIC_ADJ:0 "sindicalista"
 FRW_new_europe_faction:0 "Nuevo Orden Europeo"
 FRW_backer_deat_req:0 "Se ha ganado el apoyo de §YMarcel Déat§!"
 FRW_backer_besnard_req:0 "Se ha ganado el apoyo de §YPierre Besnard§!"
 FRW_dec_hear_the_neos:0 "Escuchar a los neosocialistas"
 FRW_dec_hear_the_neos_desc:0 "Marcel Déat y los neosocialistas expulsados de la SFIO celebran sus reuniones en la Salle Wagram. Enviar a alguien a escucharlos cuesta poco, y tienen ideas sobre el Estado que nadie más en la Cámara se atreve a decir en voz alta."
 FRW_dec_backer_deat:0 "Ganarse a Marcel Déat"
 FRW_dec_backer_deat_desc:0 "Las conversaciones con Marcel Déat y los neosocialistas duran unas seis semanas. Solo se puede cortejar a un líder de este bando a la vez.\n\nRequiere un §Y45%§! de apoyo al partido y un §Y30%§! de estabilidad. Después se abre una vía oculta en el árbol de enfoques en lugar de las vías de Blum y Reynaud."
 FRW_dec_occupy_factories:0 "Mantener ocupadas las fábricas"
 FRW_dec_occupy_factories_desc:0 "Los huelguistas se niegan a marcharse. De las puertas de las fábricas cuelgan banderas rojas, y las secciones sindicales se encargan de los comedores y de las guardias nocturnas. Cada mes que duran las ocupaciones, la CGT se vuelve más audaz."
 FRW_dec_backer_besnard:0 "Ganarse a Pierre Besnard"
 FRW_dec_backer_besnard_desc:0 "Las conversaciones con Pierre Besnard y los sindicalistas revolucionarios duran unas seis semanas. Solo se puede cortejar a un líder de este bando a la vez.\n\nRequiere un §Y35%§! de apoyo al partido y un §Y30%§! de estabilidad. Después se abre una vía oculta en el árbol de enfoques en lugar de las vías de Thorez y Pivert."
 frw_sp.1.t:0 "La Carta de Amiens"
 frw_sp.1.d:0 "Tres meses después, las fábricas siguen ocupadas. Una delegación de sindicalistas revolucionarios llega al ministerio con un ejemplar de la Carta de Amiens de 1906, con una frase subrayada: el sindicato, hoy agrupación de resistencia, será mañana la agrupación de producción y distribución.\n\nSu portavoz, un ferroviario llamado Pierre Besnard, habla sin rodeos. «Los obreros no necesitan un nuevo amo en el Hôtel de Ville, sea rojo o de otro color. Necesitan sus sindicatos. Dejen las fábricas a quienes trabajan en ellas, y Francia se gobernará sola.»\n\n§GHay una nueva decisión disponible: Ganarse a Pierre Besnard.§!"
 frw_sp.1.a:0 "Que hablen los sindicatos."
 frw_sp.2.t:0 "Orden, autoridad, nación"
 frw_sp.2.d:0 "La Salle Wagram está llena. En la tribuna, Marcel Déat repite el lema que costó a los neosocialistas su lugar en la SFIO: el socialismo solo vencerá si hace suyos el orden, la autoridad y la nación, y deja de abandonarlos a las ligas.\n\nDespués recibe a nuestro enviado. «Blum quiere esperar a la revolución, y la derecha no quiere esperar a nada en absoluto. Yo propongo un Plan y un Estado lo bastante fuerte para llevarlo a cabo. Digan al gobierno que los neosocialistas están dispuestos a servir.»\n\n§GHay una nueva decisión disponible: Ganarse a Marcel Déat.§!"
 frw_sp.2.a:0 "La República necesita una mano firme."
 frw_sp.3.t:0 "Déat funda el Partido único"
 frw_sp.3.d:0 "En París, Marcel Déat ha cerrado la Cámara y ha proclamado el Rassemblement National Populaire partido único de Francia. Antiguos socialistas desfilan junto a veteranos de las ligas bajo el lema de una revolución nacional y popular. Déat habla de una nueva Europa, y las demás capitales se preguntan hacia dónde pretende llevarla."
 frw_sp.3.a:0 "Otro socialista convertido en dictador."
 frw_sp.3.b:0 "Ni derecha ni izquierda: ¡Francia!"
 FRW_deat_lvf:0 "La Legión de Voluntarios Franceses"
 FRW_deat_lvf_desc:0 "Déat y sus rivales de los demás partidos coinciden al menos en una cosa: los voluntarios franceses deben combatir al bolchevismo en el extranjero. La Legión recluta en las oficinas del RNP y parte hacia dondequiera que se libre la cruzada."
 FRW_deat_ministry_of_labour:0 "El Ministerio de Trabajo"
 FRW_deat_ministry_of_labour_desc:0 "Déat se reserva el Ministerio de Trabajo. Las oficinas de colocación, el aprendizaje y las tablas salariales dependen de un único despacho en la Rue de Grenelle."
 FRW_deat_revolutionary_front:0 "El Frente Nacional Revolucionario"
 FRW_deat_revolutionary_front_desc:0 "Los últimos movimientos rivales se integran en un único Frente Nacional Revolucionario bajo la dirección de Déat. Antiguos socialistas, sindicalistas y hombres de las ligas comparten ahora el mismo carné de afiliado."
 FRW_deat_european_revolution:0 "La Revolución Europea"
 FRW_deat_european_revolution_desc:0 "Una Europa nacional y socialista no puede detenerse en la frontera belga, escribe Déat. Se invita a Bruselas y La Haya a ponerse bajo la protección de Francia, como las primeras provincias del nuevo continente."
 FRW_rnp_spirit_2:0 "El Frente Nacional Revolucionario"
 FRW_lvf_spirit:0 "La Legión de Voluntarios Franceses"
 FRW_exchange_controls_idea:0 "Control de cambios"
 FRW_foreign_contracts:0 "Contratos de armamento en el extranjero"
 FRW_gold_loan:0 "El préstamo de oro de Londres"
