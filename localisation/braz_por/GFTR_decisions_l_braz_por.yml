l_braz_por:
# # # # # # # # # # # # # # #
GFTR_categories_settings: "Configurações"
GFTR_categories_settings_desc: "Olá! Fico muito feliz que você tenha se inscrito no mod §YGeneric Focus Tree: Redux!§! Se você gostar do trabalho que fiz, por favor, apoie o mod na página da Oficina Steam :) \nLá você também pode ver todas as últimas alterações, relatar problemas do mod ou bugs."
# # # # # # # # # # # # # # #
GFTR_D_set_focus_tree_SHOW: "1. Instalar árvore de focos?"
GFTR_D_set_focus_tree_SHOW_tt: "Aqui você pode instalar ou remover diferentes árvores de focos para o seu país e outros."
GFTR_D_set_focus_tree_HIDE: "1. §RFechar seção§!"
GFTR_D_set_gftr_a: "          1. Instalar (GFT: Redux)"
GFTR_D_set_gftr_a_tt: "O país atual terá §YGeneric Focus Tree: Redux§! instalado ou atualizado. \n~~~ \nAtenção: se você substituir a árvore de focos de países que possuem árvores únicas no jogo base ou DLCs (ex.: Alemanha, França, Irã etc.), só poderá restaurar as árvores originais §Lcomeçando um novo jogo§! ou §Lvia console§!."
GFTR_D_set_gftr_b: "          1. Instalar (GFT: Redux) para IA"
GFTR_D_set_gftr_b_tt: "§YGeneric Focus Tree: Redux§! será instalado ou atualizado em ABSOLUTAMENTE TODOS os países controlados pela IA. \n~~~ \n§LCuidado§!, ao clicar aqui todos os países controlados pela IA receberão a nova árvore de focos sem exceção. §GRecomenda-se§! usar esta decisão apenas no início do jogo e também remover espíritos nacionais e mecânicas especiais de todos os países (usando as decisões abaixo)."
GFTR_D_set_generic_focus: "          1. Instalar árvore vanilla"
GFTR_D_set_generic_focus_tt: "O país atual terá a árvore de focos §Gvanilla§! genérica instalada ou atualizada.\n~~~ \nNote que esta função carrega a árvore vanilla atual do seu jogo, que pode ter sido modificada por outros mods grandes. Nesse caso, ela instalará a árvore modificada, não a vanilla original."
GFTR_D_deleted_focus_tree: "          1. Remover árvore de focos"
GFTR_D_deleted_focus_tree_tt: "A árvore de focos do país atual será §Rremovida§!. Mais precisamente, será substituída por uma árvore completamente vazia, sem nenhum foco (exceto os chamados “contínuos”). \n~~~ \nSinceramente não sei para que você precisaria disso §YXD§!. Talvez queira deixar algum país “inativo” — desativar a árvore pode melhorar um pouco a performance."
GFTR_D_test_focus_tree: "          1. Testar o mod"
GFTR_D_test_focus_tree_tt: "Será instalada uma cópia exata de §YGeneric Focus Tree: Redux§!, mas todos os focos levarão apenas 1 dia para serem concluídos. \n~~~ \nEsta função foi feita principalmente para testar o comportamento da IA — para ver rapidamente como ela age e quais focos escolhe. Use-a se quiser me ajudar a encontrar problemas na IA. \n~~~ \nPode ser divertida também para sua própria campanha."
# # # # # # # # # # # # # # #
GFTR_D_remove_national_spirits_SHOW: "2. Remover espíritos nacionais?"
GFTR_D_remove_national_spirits_SHOW_tt: "Aqui você pode remover diversos espíritos nacionais do seu país e de outros."
GFTR_D_remove_national_spirits_HIDE: "2. §RFechar seção§!"
GFTR_D_remove_gftr_national_spirits_a: "          2. Remover espíritos (GFT: Redux)"
GFTR_D_remove_gftr_national_spirits_a_tt: "Todos os espíritos nacionais adicionados pelo §YGeneric Focus Tree: Redux§! serão removidos do país atual. \n~~~ \nEspíritos técnicos não serão removidos."
GFTR_D_remove_gftr_national_spirits_b: "          2. Remover espíritos (GFT: Redux) da IA"
GFTR_D_remove_gftr_national_spirits_b_tt: "Todos os espíritos nacionais adicionados pelo §YGeneric Focus Tree: Redux§! serão removidos de TODOS os países controlados pela IA. \n~~~ \nEspíritos técnicos não serão removidos. \n~~~ \n§RCuidado§! — remover espíritos nacionais pode causar pequenas travadas."
GFTR_D_remove_vanilla_national_spirits_a: "          2. Remover espíritos vanilla"
GFTR_D_remove_vanilla_national_spirits_a_tt: "Todos os espíritos nacionais iniciais §Gvanilla§! serão removidos do país atual! \n~~~ \nInfelizmente o jogo não tem função simples de “remover todos os espíritos”, então esta decisão remove apenas uma lista pré-definida de espíritos que todos os países têm em 1936. Usar depois do início provavelmente não terá efeito. §GRecomenda-se§! usar só no início do jogo."
GFTR_D_remove_vanilla_national_spirits_b: "          2. Remover espíritos vanilla da IA"
GFTR_D_remove_vanilla_national_spirits_b_tt: "Todos os espíritos nacionais iniciais §Gvanilla§! serão removidos de TODOS os países controlados pela IA. \n~~~ \nMesmas limitações da decisão acima. §GRecomenda-se§! usar só no início do jogo. \n~~~ \n§RCuidado§! — remover espíritos nacionais pode causar pequenas travadas."
# # # # # # # # # # # # # # #
GFTR_D_remove_unique_mechanics_SHOW: "3. Remover mecânicas únicas?"
GFTR_D_remove_unique_mechanics_SHOW_tt: "Aqui você pode remover mecânicas, decisões e modificadores especiais que alguns países possuem e que podem atrapalhar caso queira substituir suas árvores de focos nativas."
GFTR_D_remove_unique_mechanics_HIDE: "3. §RFechar seção§!"
GFTR_D_remove_state_modifier_a: "          3. Remover modificadores de estado"
GFTR_D_remove_state_modifier_a_tt: "Alguns modificadores de províncias serão removidos do país atual. \n~~~ \n§YModificadores de estado§! são modificadores especiais aplicados apenas a certas províncias. Exemplos: “Descentralização” na Etiópia ou “Separatismo Curdo” na Turquia. \n~~~ \n§GAo substituir§! a árvore nativa de um país, esses modificadores ficam permanentes. Esta decisão existe para removê-los. \n~~~ \nPaíses afetados estão listados em “Requisitos” acima. §L(Vale também para a versão IA)§! \n~~~ \n§GRecomenda-se§! usar no início do jogo."
GFTR_D_remove_state_modifier_b: "          3. Remover modificadores de estado da IA"
GFTR_D_remove_state_modifier_b_tt: "Modificadores de províncias serão removidos de regiões controladas por países da IA. \n~~~ \nVeja a decisão acima para detalhes. Posse atual não importa — os modificadores serão removidos de qualquer forma. \n~~~ \n§GRecomenda-se§! usar apenas se for substituir as árvores nativas de todos os países da IA."
GFTR_D_remove_special_mechanics_a: "          3. Remover mecânicas especiais"
GFTR_D_remove_special_mechanics_a_tt: "Mecânicas especiais serão removidas do país atual. \n~~~ \n§YMecânicas especiais§! são sistemas únicos de alguns países (ex.: “Balanço de Poder” na Etiópia/Dinamarca, “Paranoia” na URSS, “Revolta Camponesa” na Polônia). \n~~~ \n§GAo substituir§! a árvore nativa, essas mecânicas ficam travadas. Esta decisão as remove. \n~~~ \nPaíses afetados estão listados em “Requisitos” acima."
GFTR_D_remove_special_mechanics_b: "          3. Remover mecânicas especiais da IA"
GFTR_D_remove_special_mechanics_b_tt: "Mecânicas especiais serão removidas de alguns países controlados pela IA. \n~~~ \nVeja a decisão acima para detalhes. \n~~~ \n§GRecomenda-se§! usar apenas se for substituir as árvores nativas de todos os países da IA."
# # # # # # # # # # # # # # #
GFTR_D_ai_management_SHOW: "4. Configurar comportamento da IA?"
GFTR_D_ai_management_SHOW_tt: "Aqui você controla o comportamento dos países controlados pela IA."
GFTR_D_ai_management_HIDE: "4. §RFechar seção§!"
GFTR_D_ai_political_freedom: "          4. "Liberdade Política""
GFTR_D_ai_political_freedom_tt: "Todos os países controlados pela IA receberão o espírito nacional §Y$GFTR_idea_ai_political_freedom$§!. \n~~~ \nPor padrão no mod, a IA prefere ligeiramente a ramo político da sua ideologia atual e, em modo histórico, nunca muda ideologia nem forma alianças não-históricas. \n§YLiberdade Política§! remove essas restrições — mesmo em modo histórico a IA terá mais liberdade e será mais imprevisível. \n~~~ \nPouco útil em vanilla, mas excelente para mods que adicionam muitos países novos (ex.: §L\"Every State Independent\"§!). \n~~~ \nUse se quiser que a IA escolha ramos políticos com chances iguais ou ignore o modo histórico."
GFTR_D_ai_limit: "          4. Limitar IA"
GFTR_D_ai_limit_tt: "O país atual receberá o espírito nacional §Y$GFTR_idea_ai_limit$§! \n~~~ \nÚtil para “desativar” a IA de um país específico e melhorar performance. Não substitui mods de otimização, mas permite escolher países individualmente (precisa do console e comando \"observe\"). \n~~~ \n§GLembrete§!: acima há decisão para remover completamente a árvore de focos e limitar ainda mais a IA."
GFTR_D_ai_madness_mode: "          4. Modo "Loucura"
GFTR_D_ai_madness_mode_tt: "Todos os países controlados pela IA receberão o espírito nacional §Y$GFTR_idea_ai_madness_mode$§!. \n~~~ \n§YModo \"Loucura\"§! faz a IA escolher apenas caminhos bélicos. Mergulhe no caos total onde todos lutam contra todos! §RATENÇÃO§!: afeta apenas países com §YGeneric Focus Tree: Redux§! instalado."
GFTR_D_remove_management_ideas: "          4. Remover espíritos técnicos"
GFTR_D_remove_management_ideas_tt: "Todos os espíritos nacionais técnicos adicionados por este mod serão removidos de TODOS os países."
