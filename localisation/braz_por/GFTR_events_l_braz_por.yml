l_braz_por:
GFTR_E_independence.1.t: "Guerra pela Independência!"
GFTR_E_independence.1.d: "Nosso limite de paciência se esgotou. Esta é a nossa terra e somos nós que vamos decidir o que fazer com ela. Hoje começamos a luta contra os invasores e ocupantes que vieram à nossa terra, nos impuseram sua vontade, sua cultura, escravizaram nosso povo e fincaram sua bandeira em nosso solo."
GFTR_E_independence.1.a: "Que corra o sangue deles!"
# # # # # # # # # # # # # # #
GFTR_E_independence.2.t: "Carta com um pedido"
GFTR_E_independence.2.d: "Hoje recebemos um pedido oficial do nosso estado fantoche. Eles exigem a revisão da nossa influência, querem ter voz própria na política externa e interna e, na prática, declaram o desejo de se tornar um país independente. O tom ainda é bastante contido e diplomático, mas basta um estalar de dedos para que tudo vire guerra."
GFTR_E_independence.2.a: "Nenhuma concessão!"
GFTR_E_independence.2.b: "Estamos prontos para conceder-lhes a independência."
GFTR_E_independence.2.c: "Traidores! Fora da nossa aliança!"
GFTR_E_independence.2.d: "O Exército vai botar ordem na casa."
# # # # # # # # # # # # # # #
GFTR_E_independence_response.0.t: "Más notícias"
GFTR_E_independence_response.0.d: "A manhã de hoje começou com uma facada nas costas: nosso antigo estado fantoche declarou repentinamente a independência e atacou nossas tropas estacionadas em seu território. Nossas tentativas de negociação foram rejeitadas."
GFTR_E_independence_response.0.a: "Eles querem guerra? Então vão ter guerra!"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.1.t: "Recusa"
GFTR_E_independence_response.1.d: "Há alguns dias enviamos um pedido de independência, mas hoje recebemos uma recusa categórica. A metrópole não quer nos soltar e rejeitou qualquer discussão sobre o assunto. A diplomacia chegou a um beco sem saída."
GFTR_E_independence_response.1.a: "Teremos que lutar!"
GFTR_E_independence_response.1.b: "Tá bom..."
# # # # # # # # # # # # # # #
GFTR_E_independence_response.2.t: "Somos livres!"
GFTR_E_independence_response.2.d: "Boas notícias! A metrópole reconheceu oficialmente nossa independência. A partir de agora, nós mesmos decidimos nosso destino. Para nosso povo, este é um dia histórico que entrará nos livros didáticos."
GFTR_E_independence_response.2.a: "Uhuuuu!"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.3.t: "Liberdade com gosto amargo"
GFTR_E_independence_response.3.d: "Hoje recebemos uma resposta ambígua da metrópole. Fomos acusados de traição! Conseguimos a independência, mas a ex-metrópole rompeu todas as relações diplomáticas conosco. Estamos livres, porém sozinhos neste período turbulento. Apesar da dureza das palavras, evitamos um conflito armado."
GFTR_E_independence_response.3.a: "O importante é que tudo terminou em paz."
# # # # # # # # # # # # # # #
GFTR_E_independence_response.4.t: "Guerra pela Independência"
GFTR_E_independence_response.4.d: "Nossas esperanças de uma solução diplomática para nossa dependência desmoronaram hoje. Após nosso pedido recente, a metrópole deslocou tropas para a fronteira e se prepara para invadir com o objetivo de esmagar nosso desejo de ser um estado soberano. A partir deste momento, não lutamos mais pela liberdade, mas pela própria existência do nosso país."
GFTR_E_independence_response.4.a: "Vamos resistir!"
# # # # # # # # # # # # # # #
GFTR_E_change_of_power.1.t: "As eleições terminaram"
GFTR_E_change_of_power.1.d: "Eleições democráticas e justas foram realizadas no país. O povo fez a sua escolha."
GFTR_E_change_of_power.1.a: "Tudo bem"
# # # # # # # # # # # # # # #
GFTR_E_change_of_power.2.t: "Tomada de poder"
GFTR_E_change_of_power.2.d: "O confronto esperado não aconteceu. O antigo regime reconheceu a derrota e entregou o poder ao novo governo sem luta."
GFTR_E_change_of_power.2.a: "Decisão correta"
# # # # # # # # # # # # # # #
GFTR_E_change_of_power.3.t: "Guerra civil!"
GFTR_E_change_of_power.3.d: "A crise política atingiu o limite. O país se dividiu em dois lados inimigos e a disputa pelo poder virou confronto armado aberto."
GFTR_E_change_of_power.3.a: "Vamos conseguir"