l_braz_por:
 NO_LAG_GRE_byzantine_prosperity:0 "Renascimento Econômico Bizantino"
 NO_LAG_GRE_byzantine_prosperity_desc:0 "Com Constantinopla restaurada como coração do Império, suas oficinas, seus recursos e suas instituições comerciais podem sustentar uma nova era de prosperidade."
 NO_LAG_GRE_byzantine_prosperity_spirit:0 "Prosperidade Bizantina"
 NO_LAG_GRE_byzantine_prosperity_spirit_desc:0 "A administração imperial restaurada direciona novas terras, mão de obra e investimentos para uma base industrial em expansão."

 NO_LAG_GRE_avenge_justinian:0 "Vingar Justiniano, o Grande"
 NO_LAG_GRE_avenge_justinian_desc:0 "A reconquista de Roma reuniria os legados oriental e ocidental do Império e completaria a ambição que Justiniano perseguiu."
 NO_LAG_GRE_avenge_justinian_tt:0 "Desbloqueia as decisões de §YRestauração Imperial Grega§! e a possibilidade de restaurar o §YImpério Romano§!."

 NO_LAG_GRE_roman_restoration_category:0 "Restauração Imperial Grega"
 NO_LAG_GRE_roman_restoration_category_desc:0 "A partir de Constantinopla, o Estado Bizantino restaurado poderá reivindicar toda a herança de Roma quando controlar os territórios históricos do Mediterrâneo."
 NO_LAG_GRE_restore_roman_empire:0 "Restaurar o Império Romano"
 NO_LAG_GRE_restore_roman_empire_desc:0 "O Mediterrâneo voltou ao domínio imperial. Agora podemos proclamar a restauração do Império Romano e integrar seus territórios históricos."
