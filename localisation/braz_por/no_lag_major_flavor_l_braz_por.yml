l_braz_por:
 NO_LAG_GER_incomplete_victory:0 "A Vitória Incompleta"
 NO_LAG_GER_incomplete_victory_desc:0 "A vitória no Ocidente não trouxe a paz prometida. As rivalidades dentro do Reich e as exigências de uma guerra sem fim agora ameaçam a coesão do regime."
 NO_LAG_GER_guide_italy:0 "Guiar a Itália"
 NO_LAG_GER_guide_italy_desc:0 "A instabilidade italiana prejudica o esforço de guerra comum. Berlim colocará Roma sob uma supervisão mais firme, desde que nenhum jogador humano seja removido."
 NO_LAG_GER_secure_hungary:0 "Assegurar a Hungria"
 NO_LAG_GER_secure_hungary_desc:0 "Os exércitos e a administração da Hungria devem responder a um comando unificado para que a aliança sobreviva."
 NO_LAG_GER_secure_romania:0 "Assegurar a Romênia"
 NO_LAG_GER_secure_romania_desc:0 "O petróleo romeno e sua posição estratégica são importantes demais para permanecerem fora da supervisão direta alemã."
 NO_LAG_GER_endsieg:0 "Endsieg — A Vitória Final"
 NO_LAG_GER_endsieg_desc:0 "Com o colapso do front, a propaganda promete uma vitória final. As reservas restantes serão reunidas para uma defesa desesperada da Alemanha."
 NO_LAG_GER_volkssturm:0 "A Volkssturm"
 NO_LAG_GER_volkssturm_desc:0 "As últimas reservas de pessoal serão organizadas em formações locais de defesa. A quantidade deverá compensar a falta de tempo e treinamento."
 NO_LAG_GER_fortress_reich:0 "Fortaleza do Reich"
 NO_LAG_GER_fortress_reich_desc:0 "Cada cidade, rio e distrito industrial deve integrar uma defesa em profundidade ao redor do coração alemão."
 NO_LAG_GER_last_offensive:0 "Às Linhas de Frente!"
 NO_LAG_GER_last_offensive_desc:0 "As formações móveis restantes serão concentradas para um último contragolpe. Se ele falhar, não haverá uma segunda tentativa."

 NO_LAG_SOV_great_patriotic_war:0 "A Grande Guerra Patriótica"
 NO_LAG_SOV_great_patriotic_war_desc:0 "Toda a União deve ser mobilizada contra um grande invasor. Cada fábrica, ferrovia e cidadão agora serve à defesa da Pátria."
 NO_LAG_SOV_study_our_losses:0 "Estudar Nossas Perdas"
 NO_LAG_SOV_study_our_losses_desc:0 "O custo da guerra revelou falhas de comando e doutrina. Lições duras devem ser transformadas em experiência de combate."
 NO_LAG_SOV_coordinate_wartime_industry:0 "Coordenar a Indústria de Guerra"
 NO_LAG_SOV_coordinate_wartime_industry_desc:0 "Uma coordenação mais próxima entre planejadores, fábricas e o front manterá a produção sem criar indústrias inteiras do nada."
 NO_LAG_SOV_open_great_war_stockpiles:0 "Abrir os Depósitos da Grande Guerra"
 NO_LAG_SOV_open_great_war_stockpiles_desc:0 "Fuzis antigos e equipamentos de suporte ainda podem armar os reforços enquanto a produção moderna atende os setores decisivos."
 NO_LAG_SOV_our_blood_our_soil:0 "Nosso Sangue, Nosso Solo"
 NO_LAG_SOV_our_blood_our_soil_desc:0 "Mesmo após perdas terríveis, o povo defenderá cada cidade e campo restante até expulsar o invasor."
 NO_LAG_SOV_bind_mongolia:0 "Uma União Irrevogável"
 NO_LAG_SOV_bind_mongolia_desc:0 "A Mongólia deve ser ligada com mais firmeza ao sistema de segurança soviético. Aliados podem aceitar supervisão direta; os demais enfrentarão uma exigência formal."
 NO_LAG_SOV_secure_iran:0 "O Corredor do Cáucaso"
 NO_LAG_SOV_secure_iran_desc:0 "O controle do corredor iraniano protegerá o Cáucaso e preservará uma rota vital para homens e material."
 NO_LAG_SOV_secure_afghanistan:0 "Assegurar o Flanco Sul"
 NO_LAG_SOV_secure_afghanistan_desc:0 "Um governo confiável em Cabul fechará uma rota vulnerável para a Ásia Central."

 NO_LAG_SOV_russian_federation:0 "A Federação Russa"
 NO_LAG_SOV_russian_federation_desc:0 "O Zemsky Sobor já cumpriu seu papel. Uma república federal, um governo representativo e eleições regulares darão à Rússia uma ordem constitucional duradoura."
 NO_LAG_SOV_federal_constitution:0 "Uma Constituição Federal"
 NO_LAG_SOV_federal_constitution_desc:0 "Uma constituição escrita deve equilibrar a autoridade do governo central com os direitos das muitas repúblicas e povos da Rússia."
 NO_LAG_SOV_open_the_economy:0 "Abrir a Economia"
 NO_LAG_SOV_open_the_economy_desc:0 "O acesso controlado à iniciativa privada e ao conhecimento estrangeiro ajudará a reconstruir a economia civil após a guerra civil."
 NO_LAG_SOV_reorganize_security_service:0 "Reorganizar o Serviço de Segurança"
 NO_LAG_SOV_reorganize_security_service_desc:0 "O aparelho de segurança será submetido à lei civil e redirecionado para a contraespionagem em vez do terror político."
 NO_LAG_SOV_federal_breadbasket:0 "O Celeiro da Federação"
 NO_LAG_SOV_federal_breadbasket_desc:0 "Restaurar o transporte, o maquinário e a administração local nas regiões agrícolas estabilizará o abastecimento e apoiará a reconstrução."
 NO_LAG_SOV_league_of_free_republics:0 "Liga das Repúblicas Livres"
 NO_LAG_SOV_league_of_free_republics_desc:0 "A Rússia organizará sua diplomacia em torno da cooperação entre repúblicas soberanas, em vez da anexação compulsória."
 NO_LAG_SOV_mobilize_the_federation:0 "Mobilizar a Federação"
 NO_LAG_SOV_mobilize_the_federation_desc:0 "Uma federação democrática ainda precisa conseguir se defender. Uma estrutura militar comum unirá as repúblicas sem restaurar o antigo sistema coercitivo."
 NO_LAG_SOV_federation_secured:0 "A Federação Assegurada"
 NO_LAG_SOV_federation_secured_desc:0 "O governo constitucional, a recuperação econômica e uma defesa comum deram bases firmes à nova federação."
 NO_LAG_SOV_federation_faction:0 "Federação das Repúblicas Livres"

 NO_LAG_ENG_for_king_and_country:0 "Pelo Rei e pela Pátria!"
 NO_LAG_ENG_for_king_and_country_desc:0 "Uma guerra contra várias grandes potências exige que a Grã-Bretanha prepare seu povo e suas instituições para defender as ilhas."
 NO_LAG_ENG_open_1914_stockpiles:0 "Os Estoques de 1914"
 NO_LAG_ENG_open_1914_stockpiles_desc:0 "As armas guardadas desde a última guerra podem equipar novas formações enquanto as fábricas modernas priorizam projetos atuais."
 NO_LAG_ENG_all_subjects_to_arms:0 "Todos os Súditos às Armas!"
 NO_LAG_ENG_all_subjects_to_arms_desc:0 "Todo o reino deve contribuir para a defesa da Grã-Bretanha, mesmo com um custo moderado para a produção industrial."
 NO_LAG_ENG_last_defence_of_freedom:0 "A Última Defesa da Liberdade"
 NO_LAG_ENG_last_defence_of_freedom_desc:0 "Se as ilhas estiverem à beira da derrota, todas as reservas restantes serão empregadas para manter o governo e a guerra vivos."
 NO_LAG_ENG_continue_to_the_end:0 "Continuaremos até o Fim"
 NO_LAG_ENG_continue_to_the_end_desc:0 "Uma pequena reserva industrial externa e um plano de continuidade imperial garantirão que a capitulação não encerre a resistência britânica."
 NO_LAG_ENG_emergency_imperial_administration:0 "Administração Imperial de Emergência"
 NO_LAG_ENG_emergency_imperial_administration_desc:0 "Com as principais regiões da Grã-Bretanha perdidas, uma administração de emergência deve preparar o Canadá para receber as instituições necessárias à continuação da guerra."
 NO_LAG_ENG_transfer_war_industry_to_canada:0 "Transferir a Indústria de Guerra ao Canadá"
 NO_LAG_ENG_transfer_war_industry_to_canada_desc:0 "Máquinas, equipes técnicas e planos de produção serão evacuados pelo Atlântico para estabelecer um novo arsenal no sul de Ontário."
 NO_LAG_ENG_ottawa_war_cabinet:0 "O Gabinete de Guerra de Ottawa"
 NO_LAG_ENG_ottawa_war_cabinet_desc:0 "Ministros, funcionários públicos e os órgãos restantes do Estado se reunirão em Ottawa para restaurar um centro de governo funcional."
 NO_LAG_ENG_canadian_redoubt:0 "O Reduto Canadense"
 NO_LAG_ENG_canadian_redoubt_desc:0 "O Canadá se tornará a base segura a partir da qual as forças britânicas poderão ser reconstruídas, abastecidas e enviadas novamente à luta."
 NO_LAG_ENG_empire_beyond_the_seas:0 "O Império Além-Mar"
 NO_LAG_ENG_empire_beyond_the_seas_desc:0 "A Coroa e o governo canadense unirão suas administrações. Ottawa será a capital de um Império Britânico determinado a continuar lutando do outro lado do Atlântico."
 NO_LAG_ENG_at_war_with_two_majors_tt:0 "Em guerra com pelo menos §Y2 Grandes Potências§!"
 NO_LAG_ENG_canadian_exile_annexation_tt:0 "O Reino Unido §Yintegrará o Canadá§!, ganhará núcleos nos estados centrais canadenses, estabelecerá seu governo no exílio em §YOttawa§! e aumentará os Pontos de Vitória de §YOttawa§!, §YToronto§!, §YMontreal§! e §YVancouver§!."
 NO_LAG_ENG_canadian_industry_boost_tt:0 "Após a integração, §Y24 Fábricas Militares§! e §Y8 Fábricas Civis§! serão estabelecidas no Canadá."

 NO_LAG_GER_incomplete_victory_spirit:0 "Uma Vitória Incompleta"
 NO_LAG_GER_incomplete_victory_spirit_desc:0 "A guerra curta esperada virou uma luta sem fim claro, drenando a autoridade política e prejudicando o planejamento operacional."
 NO_LAG_GER_endsieg_spirit:0 "Endsieg"
 NO_LAG_GER_endsieg_spirit_desc:0 "A promessa de uma vitória final mantém unidas as últimas reservas e endurece a resistência em solo alemão."
 NO_LAG_GER_volkssturm_spirit:0 "Mobilização da Volkssturm"
 NO_LAG_GER_volkssturm_spirit_desc:0 "A mobilização rápida preenche as fileiras, mas as novas formações não têm a coesão do exército que substituem."
 NO_LAG_GER_fortress_reich_spirit:0 "Fortaleza do Reich"
 NO_LAG_GER_fortress_reich_spirit_desc:0 "Equipes de construção e comandos locais concentram seus esforços na fortificação do coração alemão."
 NO_LAG_GER_last_offensive_spirit:0 "A Última Ofensiva"
 NO_LAG_GER_last_offensive_spirit_desc:0 "Por um breve período, todas as reservas móveis são lançadas ao ataque, deixando pouca profundidade para a defesa."

 NO_LAG_SOV_patriotic_mobilization_spirit:0 "Mobilização Patriótica"
 NO_LAG_SOV_patriotic_mobilization_spirit_desc:0 "A invasão transformou o conflito em uma luta nacional pela sobrevivência."
 NO_LAG_SOV_lessons_from_losses_spirit:0 "Lições Pagas com Sangue"
 NO_LAG_SOV_lessons_from_losses_spirit_desc:0 "Fracassos custosos são convertidos em melhor organização e preservação da experiência de combate."
 NO_LAG_SOV_wartime_industry_spirit:0 "Indústria de Guerra Coordenada"
 NO_LAG_SOV_wartime_industry_spirit_desc:0 "Fábricas e planejadores trabalham com prioridades comuns definidas pelas necessidades do front."
 NO_LAG_SOV_our_blood_our_soil_spirit:0 "Nosso Sangue, Nosso Solo"
 NO_LAG_SOV_our_blood_our_soil_spirit_desc:0 "A mobilização emergencial fortalece a defesa do território soviético, mas retira trabalhadores da produção."

 NO_LAG_ENG_home_defence_spirit_1:0 "Preparativos de Defesa Nacional"
 NO_LAG_ENG_home_defence_spirit_1_desc:0 "Comandos locais, autoridades civis e as forças armadas preparam as ilhas para um ataque."
 NO_LAG_ENG_home_defence_spirit_2:0 "O Reino em Armas"
 NO_LAG_ENG_home_defence_spirit_2_desc:0 "Uma mobilização mais ampla reforça as ilhas enquanto impõe um custo limitado à produção de guerra."
 NO_LAG_ENG_home_defence_spirit_3:0 "A Última Defesa da Liberdade"
 NO_LAG_ENG_home_defence_spirit_3_desc:0 "As últimas reservas britânicas defendem o reino com determinação, aceitando um custo econômico maior."
 NO_LAG_ENG_imperial_continuity_spirit:0 "Continuidade Imperial"
 NO_LAG_ENG_imperial_continuity_spirit_desc:0 "A administração e a indústria dispersas permitem que o governo continue conduzindo a guerra após um desastre nas ilhas."
 shadow_scheme_focus_tt:1 "Ao entrar em uma guerra, concede ao todo §G16§! espaços de construção, §Y8 fábricas militares§! e §Y8 fábricas civis§! em dois estados.\n"
 NO_LAG_ENG_communist_empire_preserved_tt:0 "§GA Grã-Bretanha comunista pode preservar o Império.§! Nenhum território ou súdito será libertado, e a ameaça de guerra civil por falta de descolonização será removida."

 NO_LAG_BRA_south_american_research_network:0 "Rede Sul-Americana de Pesquisa"
 NO_LAG_BRA_south_american_research_network_desc:0 "Uma América do Sul unificada deve conectar suas universidades, laboratórios e centros de pesquisa industrial em uma rede científica continental."
 NO_LAG_BRA_ulasr_academy_of_sciences:0 "Academia de Ciências da ULASR"
 NO_LAG_BRA_ulasr_academy_of_sciences_desc:0 "As repúblicas socialistas reunirão seus cientistas e instituições técnicas em uma academia comum dedicada ao desenvolvimento continental."
