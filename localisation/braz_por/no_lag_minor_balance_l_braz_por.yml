 NO_LAG_BALANCE_RULE_GROUP: "NO LAG — Equilíbrio dos Jogadores"
 NO_LAG_MINOR_PLAYER_BONUS_RULE_NAME: "Apoio para Jogadores Minor"
 NO_LAG_MINOR_PLAYER_BONUS_OFF_TEXT: "Desativado"
 NO_LAG_MINOR_PLAYER_BONUS_OFF_DESC: "Países minor controlados por jogadores não recebem apoio adicional."
 NO_LAG_MINOR_PLAYER_BONUS_ON_TEXT: "Ativado para Minors Humanos"
 NO_LAG_MINOR_PLAYER_BONUS_ON_DESC: "Todo país controlado por um jogador que iniciar a campanha como minor recebe um espaço permanente de pesquisa e, nos primeiros 730 dias, exatamente o antigo espírito nacional §YApoio para Jogadores Minor§!. A IA e as grandes potências não são afetadas."
 NO_LAG_minor_player_bonus: "Apoio para Jogadores Minor"
 NO_LAG_minor_player_bonus_desc: "Nos primeiros dois anos: §G+150%§! de velocidade de construção, §G+30%§! de retenção de eficiência ao trocar linhas, §G+0,50§! de poder político diário, §G+10%§! de fator de população recrutável e §G-20%§! de tempo de treinamento. Reproduz o bônus de player minor anterior ao remake."
 NO_LAG_AUS_HABSBURG_DIPLOMACY: "Preparativos Diplomáticos Imperiais"
 NO_LAG_AUS_HABSBURG_DIPLOMACY_desc: "Preparação diplomática simplificada para restaurar a influência habsburga sem ignorar a decisão final do país vizinho."
 NO_LAG_AUS_prepare_imperial_outreach: "Preparar Aproximação com [FROM.GetNameDef]"
 NO_LAG_AUS_prepare_imperial_outreach_desc: "Um mês coordenado de cooperação industrial e conversas entre estados-maiores deixará [FROM.GetNameDef] mais receptivo a um acordo habsburgo pelos próximos cinco anos. Isso melhora a chance de aceitação, mas não garante submissão nem anexação."
