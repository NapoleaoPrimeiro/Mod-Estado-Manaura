l_braz_por:
 ROM_natural_borders:0 "Fronteiras Naturais da Romênia"
 ROM_natural_borders_desc:0 "Guiados pelo ideal 'De la Nistru până la Tisa' — o sonho de uma Romênia definida por fronteiras naturais — podemos enfim realizar essa visão nacionalista surgida após a Grande Guerra."
 ROM_appeal_to_european_capitalists:0 "Apelar aos Capitalistas Europeus"
 ROM_appeal_to_european_capitalists_desc:0 "Com a influência do rei Carol II limitada e as reformas democráticas trazendo estabilidade, podemos procurar as grandes potências industriais da Europa. Uma economia moderna e aberta atrairá os investimentos necessários para fortalecer nossa indústria e infraestrutura."
 ROM_the_red_menace:0 "A Ameaça Vermelha"
 ROM_the_red_menace_desc:0 "A exigência soviética sobre a Bessarábia revela a intenção de dominar a Europa Oriental. A Romênia defenderá sua soberania, avançará além do Dniester e não se curvará à Ameaça Vermelha."
 ROM_expand_resita_steel_works:0 "Expandir as Siderúrgicas de Reșița"
 ROM_expand_resita_steel_works_desc:0 "As siderúrgicas de Reșița são há muito tempo um pilar da nossa capacidade industrial. Sua modernização e expansão aumentarão a produção de aço e sustentarão um crescimento militar e industrial ainda maior."
 ROM_air_defense_network:0 "Rede de Defesa Aérea"
 ROM_air_defense_network_desc:0 "Os céus da Romênia, principalmente sobre nossos campos petrolíferos vitais, precisam permanecer seguros. Uma forte rede de defesa aérea protegerá a indústria e desestimulará bombardeios inimigos."
 ROM_beyond_the_black_sea:0 "Além do Mar Negro"
 ROM_beyond_the_black_sea_desc:0 "Com a modernização da marinha concluída, a Romênia pode projetar poder além do Mar Negro. Forças navais mais fortes e estaleiros ampliados permitirão enfrentar ameaças em alto-mar."
 ROM_new_eastern_borders:0 "Novas Fronteiras Orientais"
 ROM_new_eastern_borders_desc:0 "A vitória sobre a União Soviética permite consolidar a região da Transnístria. A integração desses territórios garantirá estabilidade e prosperidade às novas fronteiras orientais da Romênia."
 ROM_fight_tyranny:0 "Combater a Tirania"
 ROM_fight_tyranny_desc:0 "A expansão do fascismo pela Europa ameaça a liberdade e a autodeterminação. A Romênia deve enfrentar esse perigo e ajudar a libertar aqueles que sofrem sob seu domínio."
 ROM_subsidized_national_industrialization:0 "Industrialização Nacional Subsidiada"
 ROM_subsidized_national_industrialization_desc:0 "O alinhamento com a União Soviética cria oportunidades de cooperação econômica. Seu apoio pode acelerar nosso desenvolvimento industrial e fortalecer a economia para os desafios futuros."
 ROM_soviet_military_exercises:0 "Exercícios Militares Soviéticos"
 ROM_soviet_military_exercises_desc:0 "Como membro do Comintern, a Romênia pode aproveitar a experiência militar soviética. Exercícios conjuntos melhorarão nossas forças armadas e nos prepararão para defender o socialismo na Europa."

 ROM_bessarabian_war:0 "A Guerra da Bessarábia"
 ROM_bessarabian_war_desc:0 "A Romênia enfrenta uma guerra decisiva contra a União Soviética pela Bessarábia. Precisamos defender nossa pátria, aproveitar qualquer oportunidade de vitória e permanecer preparados para o pior."
 ROM_demand_peace_negotiations:0 "Exigir Negociações de Paz"
 ROM_demand_peace_negotiations_desc:0 "Nossas forças avançaram profundamente em território soviético. É hora de exigir a paz e afirmar nossas reivindicações na Transnístria."
 ROM_sue_for_peace:0 "Pedir a Paz"
 ROM_sue_for_peace_desc:0 "Com a Bessarábia e outros territórios romenos perdidos, precisamos buscar a paz antes que a situação se transforme em um desastre completo."

 NO_LAG_ROM_bessarabian_war:0 "$ROM_bessarabian_war$"
 NO_LAG_ROM_bessarabian_war_desc:0 "$ROM_bessarabian_war_desc$"
 NO_LAG_ROM_demand_peace_negotiations:0 "$ROM_demand_peace_negotiations$"
 NO_LAG_ROM_demand_peace_negotiations_desc:0 "$ROM_demand_peace_negotiations_desc$"
 NO_LAG_ROM_sue_for_peace:0 "$ROM_sue_for_peace$"
 NO_LAG_ROM_sue_for_peace_desc:0 "$ROM_sue_for_peace_desc$"

 NO_LAG_ROM_peace.1.t:0 "Proposta de Paz Romena"
 NO_LAG_ROM_peace.1.desc:0 "A Romênia ofereceu a paz após realizar grandes avanços em território soviético. Em troca do fim das hostilidades, exige a região da Transnístria."
 NO_LAG_ROM_peace.1.a:0 "Aceitar as exigências."
 NO_LAG_ROM_peace.1.b:0 "Rejeitar as exigências."
 NO_LAG_ROM_peace.2.t:0 "A Romênia Pede a Paz"
 NO_LAG_ROM_peace.2.desc:0 "Com suas forças recuando e territórios importantes sob controle soviético, a Romênia pediu a paz. Seu governo está disposto a ceder a Bessarábia para evitar uma derrota completa."
 NO_LAG_ROM_peace.2.a:0 "Aceitar a rendição."
 NO_LAG_ROM_peace.2.b:0 "Exigir termos mais severos."
 NO_LAG_ROM_peace.3.t:0 "Os Soviéticos Rejeitam a Proposta Romena"
 NO_LAG_ROM_peace.3.desc:0 "A liderança soviética rejeitou a proposta de paz da Romênia e decidiu continuar a guerra."
 NO_LAG_ROM_peace.3.a:0 "Preparar-se para continuar lutando."
 NO_LAG_ROM_peace.4.t:0 "Os Soviéticos Aceitam os Termos de Paz"
 NO_LAG_ROM_peace.4.desc:0 "A União Soviética aceitou os termos da Romênia e concordou em ceder a região da Transnístria."
 NO_LAG_ROM_peace.4.a:0 "Um triunfo para a Romênia."
 NO_LAG_ROM_peace.5.t:0 "A Romênia Aceita os Termos Soviéticos"
 NO_LAG_ROM_peace.5.desc:0 "Diante do avanço soviético esmagador, a Romênia aceitou perder a Bessarábia em troca da paz."
 NO_LAG_ROM_peace.5.a:0 "Um preço amargo pela paz."

 NO_LAG_ROM_transnistrian_peace_terms_tt:0 "§Y[ROM.GetNameDefCap]§! e §Y[SOV.GetNameDef]§! farão a paz. A Romênia receberá §YOdessa§!, §YBalta-Tiraspol§! e §YVinnytsia§! caso esses estados ainda pertençam aos soviéticos."
 NO_LAG_ROM_soviet_peace_terms_tt:0 "§Y[ROM.GetNameDefCap]§! e §Y[SOV.GetNameDef]§! farão a paz. A União Soviética receberá §YSul da Bessarábia§!, §YBessarábia§! e §YBucovina§! caso esses estados ainda pertençam à Romênia. A Romênia perderá estabilidade e apoio à guerra."
 NO_LAG_ROM_natural_borders_tt:0 "Se os territórios reivindicados pela Romênia na §YConferência de Trianon§! forem controlados pela Romênia ou por um de seus súditos, eles se tornarão núcleos romenos."

 NO_LAG_ROM_red_officers:0 "Oficiais Vermelhos Romenos"
 NO_LAG_ROM_red_officers_desc:0 "Exercícios conjuntos e instrução militar soviética modernizaram a estrutura de comando da Romênia."
 NO_LAG_ROM_soviet_threat:0 "A Ameaça Soviética"
 NO_LAG_ROM_soviet_threat_desc:0 "A Romênia está preparada para defender sua fronteira oriental e levar a guerra além do Dniester."
 NO_LAG_ROM_fight_against_tyranny:0 "A Luta Contra a Tirania"
 NO_LAG_ROM_fight_against_tyranny_desc:0 "A Romênia comprometeu o Estado e suas forças armadas com a luta contra a tirania fascista na Europa."
 NO_LAG_ROM_horthyist_royal_guard:0 "A Guarda Real"
