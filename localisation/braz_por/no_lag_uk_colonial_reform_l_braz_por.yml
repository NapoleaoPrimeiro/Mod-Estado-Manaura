l_braz_por:
 ENG_the_three_nation_solution:0 "Um Novo Acordo para a Índia"
 ENG_the_three_nation_solution_desc:0 "Um acordo estável para o subcontinente indiano deve fortalecer suas instituições comuns em vez de criar um mosaico de países frágeis. Investimentos e apoio administrativo prepararão a Índia para o futuro, preservando a estrutura atual da Commonwealth."
 ENG_towards_indian_independence:0 "Autogoverno Indiano"
 ENG_towards_indian_independence_desc:0 "Transferiremos gradualmente responsabilidades administrativas e investiremos na Índia sem dividir o subcontinente nem romper de forma abrupta seus vínculos com a Commonwealth."
 ENG_self_government_for_the_mediterranean:0 "Autogoverno para o Mediterrâneo"
 ENG_self_government_for_the_mediterranean_desc:0 "A ampliação da administração local nos territórios mediterrâneos melhorará a cooperação e reduzirá a resistência sem criar novos países."
 ENG_self_government_for_africa:0 "Autogoverno para a África"
 ENG_self_government_for_africa_desc:0 "Conselhos regionais e investimentos administrativos melhorarão a cooperação nos territórios africanos, preservando as fronteiras existentes."
 ENG_self_government_for_the_middle_east:0 "Autogoverno para o Oriente Médio"
 ENG_self_government_for_the_middle_east_desc:0 "Uma ampliação gradual da administração local estabilizará os territórios do Oriente Médio sem provocar uma fragmentação política repentina."
 ENG_self_government_for_the_americas:0 "Autogoverno para as Américas"
 ENG_self_government_for_the_americas_desc:0 "Reformas administrativas nos territórios americanos aumentarão a confiança local e reduzirão a resistência sem criar países adicionais."
 ENG_self_government_for_asia:0 "Autogoverno para a Ásia"
 ENG_self_government_for_asia_desc:0 "As instituições locais dos territórios asiáticos receberão mais responsabilidades, fortalecendo a cooperação sem alterar o mapa regional."
 ENG_decolonization:0 "Reforma da Commonwealth"
 ENG_decolonization_desc:0 "Responderemos às exigências por mudanças com concessões políticas, instituições locais mais fortes e uma Commonwealth renovada. O império não será despedaçado em dezenas de novos países."
 ENG_enforce_decolonization:0 "Promover a Reforma Colonial"
 ENG_enforce_decolonization_desc:0 "Nossas reformas nos dão credibilidade para promover a modernização política no exterior por meio do exemplo e da diplomacia, sem fragmentação forçada."
 NO_LAG_ENG_COLONIAL_REFORM_NO_RELEASE_TT:0 "§GNenhum novo país será libertado ou transformado em fantoche.§! Este foco fortalece a administração sem alterar fronteiras ou a autonomia dos súditos."
