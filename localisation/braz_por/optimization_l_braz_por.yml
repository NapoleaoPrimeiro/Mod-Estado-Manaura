# shackles
 remove_shackles:0 "Remover Shackles"
 remove_shackles_desc:0 "Para manter o jogo jogável até a década de 1960, a capacidade de países menores de criar exércitos gigantes e produzir grandes quantidades de equipamento foi limitada. Caso você queira jogar com um país menor ou médio que tenha sido afetado por essas limitações, esta decisão removerá essas shackles."
  
 shackles.1.t:0 "Bem-vindo ao NO LAG BR!"
 shackles.1.d:0 "Este remake mantém o jogo próximo do Vanilla e melhora o desempenho no multiplayer.\n\n§YPrincipais mudanças§!\n- O AI Shackles limita produção e recrutamento de países selecionados da IA; países humanos nunca mantêm essas limitações.\n- Jogadores em países minors recebem por padrão um espaço permanente de pesquisa e exatamente o antigo espírito de apoio por dois anos (+150% de construção, +30% de retenção ao trocar linha, +0,50 de poder político diário, +10% de fator de população recrutável e -20% de tempo de treinamento).\n- A União Soviética/Rússia começa com um espaço adicional de pesquisa.\n- Os custos de XP dos templates são zerados para criar grupos de brigadas, trocar brigadas e adicionar companhias de suporte.\n- O Colored Puppets está ativo, com cores alinhadas para as facções chinesas.\n- O Host Tool original do SPOT inicia com a Alemanha selecionada como controladora.\n- Somente o cenário de 1936 é suportado.\n\nConfirme abaixo para aplicar os limites da IA e começar."
 shackles.1.a:0 "Aplicar limites da IA e continuar"
 shackles.1.a.d:0 "Aplica os limites de otimização somente à IA; países humanos continuam sem restrições."
 
 unindustrialized:0 "Não industrializado"
 unindustrialized_desc:0 "Reduz a expansão industrial e a produção de equipamento de um país da IA sob shackles."
 uninterested:0 "Desinteressado"
 uninterested_desc:0 "Limita recrutamento, uso de combustível e diplomacia agressiva de um país da IA sob shackles."
 
 unshackle_congo:0 "Remover shackles do Congo"

