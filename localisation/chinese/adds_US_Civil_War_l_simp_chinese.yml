POLITICS_pelly_DESC:"佩利的早年生活与政治无关。他出生于马萨诸塞州一个贫穷的卫理公会牧师家庭，凭借自学成才的文笔，开启了精彩的传媒生涯\n\n1933年1月31日，即希特勒就任德国总理的次日，佩利在北卡罗来纳州的阿什维尔宣布成立“美利坚银衫军团”，公开模仿纳粹冲锋队\n\n佩利自称拥有多达10万名追随者。他通过出版《新解放者》等杂志宣传理念，并建立了传播其“解放神学”思想和政治经济理论的阿什维尔“加拉哈德学院”。其政治思想的核心是反犹太主义、极端民族主义、神秘主义和美国孤立主义的混合体。"
POLITICS_roosevelt_DESC:"1933年3月4日，罗斯福在宣誓就职时发表了一篇富有激情的演说，告诉人们：我们惟一害怕的就是恐惧本身。提出了旨在实现国家复兴和对外睦邻友好的施政方针。罗斯福入住白宫后，对内积极推行以救济、改革和复兴为主要内容的“罗斯福新政”。“新政”抛弃了传统的自由放任主义，加强政府对经济领域的干预，实行赤字财政，大力发展公共事业来刺激经济。为了推行新政，罗斯福将一批具有自由主义色彩的律师、专家与学者组成智囊团，征询方针政策问题；通过“炉边谈话”方式，密切与人民群众的联系，与反对新政的最高法院进行坚决的斗争并成功地改组最高法院。"
POLITICS_Earl_DESC:"厄尔·肯普·朗于1895年8月26日出生在路易斯安那州温菲尔德附近，是家中八个孩子里的第三个，也是那位日后成为路易斯安那政治强人的休伊·朗（Huey Long）的弟弟\n\n1935年9月10日，休伊·朗被暗杀。这一刻，长期处在阴影下的厄尔反而迎来了政治机遇。"


usa_civil_war.1.t:"裂开的房子"
usa_civil_war.1.desc:""
usa_civil_war.1.a:""

usa_civil_war.2.t:"分裂！"
usa_civil_war.2.desc:"尽管我们拼尽全力周旋各方势力，但是最坏的情况依旧来临了--在我们对游行的银衫军成员进行驱赶时，双方的冲突进化为暴力行动。大街上鲜血四溢--就仿佛如这个国家的未来一般\n当晚，银衫军领导人William Dudley Pelley发表广播讲话反对政府，并引起各个州银衫军暴动：不少州甚至放任这些法西斯分子暴乱\n一夜暴动过后，中部诸州宣布脱离联邦，随即，合众国政府宣布全国紧急状态。但为时已晚，美国已经四分五裂。"
usa_civil_war.2.a:"该死！"

usa_civil_war.3.t:"分裂！"
usa_civil_war.3.desc:"尽管我们拼尽全力周旋各方势力，但是最坏的情况依旧来临了--在我们对游行的银衫军成员进行驱赶时，双方的冲突进化为暴力行动。大街上鲜血四溢--就仿佛如这个国家的未来一般\n当晚，银衫军领导人William·D·Pelley发表广播讲话反对政府，并引起各个州银衫军暴动：不少州甚至放任这些法西斯分子暴乱\n一夜暴动过后，中部诸州宣布脱离联邦，随即，合众国政府宣布全国紧急状态。但为时已晚，美国已经四分五裂。"
usa_civil_war.3.a:"该死！"

apg.1.t:"路易斯安那--幸福之城"
apg.1.desc:"当外界处于内战的阴霾中，我们的路易斯安那却迎来了复兴：内战难民涌入，北方工业迁移...在州长厄尔·K·朗的领导下，我们克服层层困难，打造了万众瞩目的幸福之城\n\n没人能想到，有一天，休伊·朗的愿望真的能够实现。从此，没人会在怀念那个遥远的美国梦，而是沉浸于我们的路易斯安那之梦。"
apg.1.a:"向着未来前进！"

apg.2.t:"路易斯安那--前人之影"
apg.2.desc:"“路易斯安那已经变成了我一个人的王国。”——休伊·朗\n\n1935年9月10日凌晨，美国参议员、前路易斯安那州长、“王鱼”休伊·皮尔斯·朗在巴吞鲁日的医院中去世。四十二岁，正值政治生涯的巅峰。两天前，一颗子弹在州议会大厦的走廊里击中了他\n在朗生命的最后几年，路易斯安那已经完全成为了他的个人王国。他所操纵的州议院曾在22分钟内通过了44项议案。所有法官、警察、教员、税务人员都直接受他指挥。“王鱼”建立了一个近乎完美的政治机器，打着民粹主义的旗号，完成了其他州需要十几年才能实现的公共工程建设和教育改革。\n"
apg.2.a:"逝者已矣..."

apg.3.t:"路易斯安那--现状"
apg.3.desc:"1936年，失去“王鱼”的路易斯安那陷入迷茫：腐败与分裂暗流涌动；棉花、石油价格低迷，大萧条阴影未散...虽然朗派政治机器仍在运转，但危机已经悄然而至\n1月21日州长选举，“朗”派人士纽奥良市长罗伯特·马斯特里及随后的理查德·W·勒奇获胜，但这并不能掩盖一个事实：这个政治机器仍然建立在朗的个人魅力之上，而朗已经死了。\n"
apg.3.a:"生者如斯..."

apg.4.t:"收缴民间枪支"
apg.4.desc:"第二修正案赐予了我州人民配枪权力，但是这也带来了无数安全隐患\n这权力就如一把双刃剑，一方面它让我州民兵战斗力更强，另一方面枪击案层出不穷。如今我们处境亦不太平--周遭强敌环伺\n综上，我们的幕僚为我们提供了一个建议：为什么不收缴一波民间枪支？这样既可以用来武装我们的部队，又能缓解治安恶化。"
apg.4.a:"言之有理。"
apg.4.b:"我们不能损害人民的权力。"

apg.5.t:"路易斯安那国民警卫队阅兵式"
apg.5.desc:"虽然我们的财政状况仍然一般，但是厄尔坚持办一场盛大的阅兵式\n经过几个月的筹办，这场阅兵式最终取得了盛大的成功：士兵方阵井然有序，甚至还有惊喜--坦克作战部队，作为我们的王牌也在这次阅兵中出席\n人们欢呼雀跃，为我们的部队喝彩,因为这是我们保持中立、不被侵略的绝对保障\n而在主席台上，我们的州长与其他高官却另有一番心事："
apg.5.a:"我们是否能成就一番更大的功绩？"