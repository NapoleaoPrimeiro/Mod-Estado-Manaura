usa_extra.1.t:"与最高法院的较量"
usa_extra.1.desc:"最高法院大法官休斯已经公开反对我们近日提出的填塞法院计划。不仅如此，反对派更是联合了共和党、社会各界人士集体对我们发难。他们指责我们此举是在制造独裁者，是在扭曲美国宪法。\n据悉，该计划旨在增加支持总统新政的法官数量，进而改变最高法院的保守立场。罗斯福总统已经对此展开了据理力争，全力推动通过此计划。\n那么，最终的结果是？"
usa_extra.1.a:"一场苦涩的胜利。"
usa_extra.1.b:"双方各退一步。"

usa_extra.2.t:"削减开支的必要性"
usa_extra.2.desc:"经过数年努力，大萧条已经进入了尾声。新政、大量公共工程被证明是卓有成效的。它不仅挽救国家于危难之间，更为美国留下了宝贵的财产--数千里公路、数百条大桥、隧道，这是美国工业的腾飞基础。但这并不是无价的，这些工程占用了大量的政府开支。\n现在，机会摆在眼前：我们可以削减开支，缓解下政府多年来的高压状态。但此举亦有风险，若我们稍有不慎，大萧条甚至可能恶化。\n我们该如何抉择？"
usa_extra.2.a:"冒险是美国人的天性。"
usa_extra.2.b:"还是稳中求胜吧。"

usa_extra.3.t:"大萧条恶化"
usa_extra.3.desc:"最糟糕的情况还是发生了--在我们削减开支后，大萧条迅速恶化，失业率再次飙升。各州已经上报联邦政府，若我们再不进行干预，情况可能再度恶化，甚至一度让我们几年的努力付之一炬。"
usa_extra.3.a:"该死！"

usa_extra.4.t:"政府工作重点"
usa_extra.4.desc:"在减少公共工程后，政府接下来的工作重点牵动着每个美国人的心。如今的美国百废待兴，民众水深火热，军备废弛不堪，贸易陷入危机。每个方向都是我们的痛点。\n虽然政府很想一次解决所有问题，但这显然不现实。那么，我们该着力于哪个方向呢？"
usa_extra.4.a:"没有支持我们的民众，便有国而无家了。"
usa_extra.4.b:"没有强有力的军队，便有家而无国了。"
usa_extra.4.c:"还是留着这笔资金，推进后续政策。"

usa_extra.71.t:"[?global.year|0]年国防会议正式开始"
usa_extra.71.desc:"随着世界局势的乌云密布，孤立主义情绪虽然仍在国会山占据主流，但军队高层与部分远见的政治家已然嗅到了山雨欲来的气息。在美国总统[ROOT.GetLeader]的授意下，美国军事和文职领导层中最具分量的成员纷纷被召集，[?global.year|0]年国防会议正式开始。\n这次会议的结论将决定美国未来数年的国防政策，也将影响整个世界的命运。地图上的红色箭头仿佛正在蔓延，而时间，已经不多了。"
usa_extra.71.a:"开始吧。"

usa_extra.5.t:"国防会议：军备重整"
usa_extra.5.desc:"陆军参谋长首先发难，他提交了一份冗长的报告，直言不讳地指出美国陆军现役兵力甚至不及罗马尼亚，装甲力量几乎为零，这简直是国家的耻辱。海军方面则强调了在太平洋与大西洋两洋作战的潜在风险，要求批准新的舰队扩充计划。\n是继续维持“和平时期”的财政紧缩，还是为一场未知的战争进行有限的准备？这不仅是军事战略的抉择，更是对未来国策的一次关键投票。"
usa_extra.5.a:"常言道有备无患。"
usa_extra.5.b:"多少重整一下。"
usa_extra.5.c:"我们实在没有闲钱了。"

usa_extra.6.t:"国防会议：阿诺德的提议"
usa_extra.6.desc:"陆军航空队副参谋长亨利·H·阿诺德准将随即向总统提交了一份措辞谨慎却锋芒毕露的备忘录。这份后来被称为《阿诺德备忘录》的文件一针见血地指出：航空力量在现行陆军体制下被严重窒息——资金被挪用、采购流程被陆军将领卡死。\n阿诺德提出了一个看似技术性却影响深远的方案：成立“空中作战司令部”，赋予航空队在装备采购、战术训练和作战指挥上的自主权。"
usa_extra.6.a:"阿诺德说得对，我们该委任他全权负责。"
usa_extra.6.b:"空军值得更大自主权"
usa_extra.6.c:"空军只不过是辅助性军队，陆军海军才是决定性力量。"

usa_extra.7.t:"国防会议：外交方案"
usa_extra.7.desc:"在讨论完上述问题后，一个更加重要的问题摆在眼前：我们究竟该如何立足于世？是有限干涉，避免错失良机，还是外交中立，静待时机？\n总统知道，美国不可能永远置身事外，但如何说服国会和人民？他面前摆着两个截然不同的建议：干涉派主张推动国会通过有限干涉法案，为援助英法打开一扇窗；而另一派则认为，美国不应在欧洲的战争中选边站队，必须严守中立。"
usa_extra.7.a:"世界需要美国。"
usa_extra.7.b:"但不是现在。"

usa_extra.72.t:"[?global.year|0]年国防会议完美落幕"
usa_extra.72.desc:"随着一系列议题讨论完毕，国防会议正式结束。闭会前，总统[ROOT.GetLeader]发表了一段简短而有力的讲话：“先生们，我们在这里所做的，不是为战争做准备，而是为和平打基础。历史将记住，当暴风雨来临时，美国选择了清醒，而非沉睡；选择了团结，而非分裂。”\n不论我们做出了什么选择，不可否认的是，一个时代结束了，另一个时代开始了。"
usa_extra.72.a:"希望我们没选错。"

usa_extra.8.t:"工会的提议"
usa_extra.8.desc:"[?global.year|0]年劳工节，总统罗斯福向工人发出呼吁，强调“建设强大的国防”。美国劳工联合会和产业工会联合会的领袖随即响应，他们承诺“尽全力支持国防计划”，只要我们保障劳工权益，那么他们保证会尽力让工会与资方达成“一致协议”，确保战争生产不被罢工中断。\n据悉，两位工会领导人已经被请去白宫与总统当面协商。那么，关于这份提议，我们的答复是？"
usa_extra.8.a:"这是必要的举措。"
usa_extra.8.b:"我们为什么要和他们合作？"

usa_extra.9.t:"工会鼓励工人支持国防计划"
usa_extra.9.desc:"我们一系列的努力终于有了回报。\n美国劳工联合会和产业工会联合会已经公开表态支持总统的国防计划。他们表示在国家危难时刻，劳资冲突是“愚蠢和危险的”。并呼吁所有工会成员全力为国家工作，停止斗争，确保战争生产不被罢工中断。\n虽然我们的政策遭到了不少人的质疑与批判，但至少现在，一部分人开始认识到我们政策的必要性与正确性了。"
usa_extra.9.a:"好样的！"

usa_extra.10.t:"工会对我们不满"
usa_extra.10.desc:"我们的一系列举措使得美国劳工联合会和产业工会联合会两大工会愈发不满、不安。他们已经向有关部门抗议我们的政策。他们的领袖甚至公开合作，鼓动工人为自己的权力斗争。\n一点补偿可能会安抚躁动的工人们，以避免酿成更糟糕的结果。"
usa_extra.10.a:"好吧...给他们点甜头。"
usa_extra.10.b:"他们一分钱也别想拿到。"

usa_extra.11.t:"大罢工！"
usa_extra.11.desc:"由于之前我们限制了工会大部分权力，工会已经组织了数十万工人发起罢工、游行。这无疑对我们的工业造成了毁灭性打击。工厂停摆、产线停止，刚恢复过来的社会再次陷入混乱。"
usa_extra.11.a:"该死的！"

usa_extra.12.t:"国防会议：国防承包法"
usa_extra.12.desc:"阿诺德坐下不久，陆军部和海军部同时提交了一份联合提案——即所谓的《国防承包法案》。该法案旨在简化军工采购流程，允许政府向私营企业提供长期合同、税收减免，甚至补贴工厂扩建，以换取战争时期的产能优先权。\n总统需要作出选择，是迎合工业巨头，加速工业动员的齿轮；还是向孤立派让步，继续保持“离岸平衡手”的姿态？沉默亦非选项，因为合同草案正静静地等待着他的签批。"
usa_extra.12.a:"我们确实需要他们。"
usa_extra.12.b:"但不是现在。"

usa_extra.13.t:"杜鲁门的任期"
usa_extra.13.desc:"罗斯福总统的忽然离去沉重打击了美国人民。但此时此刻，我们不能沉浸在这巨大的悲伤中，必须有人站出来接过总统职位。\n杜鲁门作为时任副总统，顺理成章执掌了总统大权。事实上，他本人对此也非常意外。当记者问他的感受时，他回答说："
usa_extra.13.a:"“我感觉就像月亮、星星和所有星球都要落到我身上”"

usa_news.14.t:"联合国成立"
usa_news.14.desc:"联合国（the United Nations），是一个政府间国际组织。核心宗旨是维护国际和平与安全及进行国际合作，是最具普遍性、权威性和代表性的政府间国际组织，凡爱好和平、接受《宪章》义务的国家，均可成为会员国。\n\n联合国为世界提供了有助于为各种纠纷或问题找到解决办法的机制，并就人类关切的问题采取行动。在减缓国际紧张、预防冲突和制止已发生战事方面，应对环境、粮食、人权、难民、气候变化、自然灾害问题方面发挥着重要的作用。"
usa_news.14.a:"希望人类不再有战争"
