USA_focus3_desc:"共产主义终于实现，现在我们必须彻底改造美国"
USA_focus4_desc:"农业是我国根基，必须保障农民权益"
USA_focus5_desc:"共产主义的根基还不稳固，我们必须保持温和，无论对内还是对外"
USA_focus6_desc:"彻底改造美国的必经之路就是根除这些大资本家。我们要诱导中间派，边缘化乃至消灭顽固派"
USA_focus7_desc:"所有的农民都必须意识到，他们是美国的根基。没有粮食保障，美国的自由与平等便是泛泛之谈。"
USA_focus8_desc:"身处自由的国度，我们的思想也要保持自由。是时候解放我们的思想，为祖国创造未来了"
USA_focus9_desc:"建设美国特色社会主义，必须着力提高全民族的思想道德素质和科学文化素质，为经济发展和社会全面进步提供强大的精神动力和智力支持，培育适应社会主义现代化要求的一代又一代有理想、有道德、有文化、有纪律的公民。这是我国文化建设长期而艰巨的任务。"
USA_focus10_desc:"在美国发展社会主义，仅靠精英人才是远远不够的，我们必须联合底层人民。工人农民，这些是现阶段我们重点需要发动的目标。"
USA_focus11_desc:"所有的工人都必须意识到：他们是在为伟大祖国而生产--这是一件光荣伟大的事，我们的发展离不开工人敲下的一次次重锤。同时，我们也需要发动更多无业失业人员为祖国开动机器。"
USA_focus12_desc:"作为世界头号工业强国，我们必须以更高的目标要求自己。我们要比苏联更快更好的建设社会主义，带领美国人民世界人民走向最美好的前途。"
USA_focus13_desc:"法西斯作为人类毒瘤，我们必须将他彻底消灭在摇篮里。"
USA_focus14_desc:"为了解决美国危机，所有人都必须忠诚于政府"
