mtg_usa_civil_war_democrats.103.t:"路易斯安那的朗家族"
mtg_usa_civil_war_democrats.103.desc:"虽然王鱼休伊·朗已经死去，但是明显他的政治遗产仍然丰厚--路易斯安那以及周边几个州一直尊敬且缅怀他\n如今，这笔遗产发挥了作用：休伊·朗的弟弟厄尔·K·朗带领朗的支持者揭竿而起，他们既不喜欢罗斯福的新政，也不愿意当法西斯分子；他们的唯一诉求就是摆脱贫穷，实现休伊·朗的口号：“人人皆国王”。"
mtg_usa_civil_war_democrats.103.a:"说的好听--不过一群叛国者！"

mtg_usa_civil_war_democrats.104.t:"基督教阵线起义！"
mtg_usa_civil_war_democrats.104.desc:"查尔斯·考夫林神父，一位虔诚的基督教徒。他反犹、反共、反罗斯福，主张“基督教经济民族主义”。而他的这套说辞确实吸引了大批追随者：他的听众每周都以百万计\n这位神父显然不愿意继续当橡木镇的一位普通神父：准军事组织基督教阵线已经在他的领导下独立。"
mtg_usa_civil_war_democrats.104.a:"或许我们能与他交涉？"

