usa_extra.14.t:"前线弹药紧缺状况加重！"
usa_extra.14.desc:"我们对重启生产线的忽视终于带来了苦果--前线噩耗频传，部队缺少弹药，无法完成大部分作战计划。国防部对此十分不满，他们督促我们重视生产，务必要在最坏的情况到来前重启产线。"
usa_extra.14.a:"真糟糕..."

usa_extra.15.t:"出乎意料的捷报"
usa_extra.15.desc:"出乎意料的是，战争反而帮助我们解决了大量失业问题。换而言之，战争助燃经济，大量失业人员进入工厂，停滞许久的生产线再次高速运转起来，为我们带来了大萧条结束的一抹希望。"
usa_extra.15.a:"nice！！"
