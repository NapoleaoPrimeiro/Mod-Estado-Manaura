USA_maixiang_fuli_guojia:"迈向福利国家"
USA_3rd_indus_revolution:"第三次工业革命"
USA_taikong_shidai:"太空时代"

USA_zhunbei_37_xuanju_desc:"随着经济大萧条的阴云仍未完全散去，民粹主义与孤立主义的暗流正在涌动。我们必须为即将到来的总统选举铺平道路，决定是延续‘新政’的路线，还是选择另一条道路。本次选举的结果将深刻影响合众国在未来四年应对国内外挑战的方式。"
USA_zuigao_fayuan_kuorong_desc:"我们的‘新政’法案屡次遭到最高法院保守派大法官的否决，这严重阻碍了国家复兴的步伐。为了恢复政府职能，我们计划向国会提出法案，增加最高法院的大法官人数。这并非对司法独立的攻击，而是对民主进程的必要纠正，确保人民的声音能在最高法院得到倾听。"
USA_gongye_fuxing_choubei_desc:"以《国家工业复兴法》为核心，我们号召全美企业共同制定公平竞争法规，取消童工，确立最低工资与最长工时。通过‘蓝鹰’标志，我们将凝聚工业界、劳工与政府的力量，稳定生产，刺激消费，引领美国工业从萧条走向复兴。"
USA_jianxiao_xinzheng_guimo_desc:"‘新政’虽然缓解了危机，但其庞大的政府开支和对市场的干预引发了越来越多的担忧。我们必须回归财政保守主义，削减成效不彰的救济与公共工程计划，精简政府机构，释放私营企业的活力，让市场重新成为经济增长的主导力量。"
USA_quanguo_laogong_guanxifa_desc:"这部法律将明确赋予工人组织工会、集体谈判的权利，并设立全国劳工关系委员会来监督选举、制止不公劳工行为。通过保障劳资双方平等的对话地位，我们有望减少产业冲突，为社会稳定与工业和平奠定坚实的法律基础。"
USA_chongqi_caizheng_ciji_desc:"尽管此前一度尝试缩减开支，但当前经济复苏的势头仍然脆弱。我们决定再次启用积极的财政政策，增加政府支出，向关键领域注入资金，以刺激需求、创造就业，确保经济不会因过早收紧而重陷衰退。"
USA_liangyang_diqu_touzi_desc:"从大西洋沿岸到太平洋沿岸，我们的沿海城市是贸易与创新的桥头堡。我们将加大对东西两岸港口、基础设施与新兴产业的投入，充分发挥其连接全球市场的优势，以两翼带动全国经济的整体腾飞。"
USA_zhongbu_touzi_desc:"广袤的中部地区是国家农业与制造业的根基。我们将重点投资中部的交通网络、能源设施与农业现代化项目，缩小区域发展差距，让‘粮仓’与‘工厂’焕发新的活力，巩固合众国的腹地力量。"
USA_nanfang_jianshe_desc:"南方拥有丰富资源与巨大发展潜力。我们将通过基础设施建设、工业化布局和教育资源倾斜，推动南方经济结构转型，提升就业水平，使这片土地真正融入国家繁荣的整体进程。"
USA_minsheng_jianshe_desc:"人民的福祉是国家的基石。我们将扩大公共卫生服务，改善住房条件，完善社会保障体系，让每一位公民都能在危机中感受到国家的保护。民生建设既是道义责任，也是社会长期稳定的前提。"
USA_junshi_jianshe_desc:"在动荡的国际局势下，强大的国防是和平最可靠的保障。我们将拨款用于军队现代化、装备更新与要塞工事建设，提升各军种的协同作战能力，确保合众国在任何风暴面前都能巍然不动。"
USA_guojia_anquan_huiyi_desc:"召集军政高层举行年度国防会议，全面评估国家安全形势。我们将整合情报、调整战略部署、明确军备发展优先级，确保国家军事政策与外部威胁保持同步，为未来可能发生的冲突做好充分准备。"
USA_zhunbei_40_xuanju_desc:"欧洲战火纷飞，世界格局剧烈震荡。即将到来的总统选举不仅关乎内政走向，更将决定美国在国际舞台上的角色。各党派需加紧整合纲领，推举能够带领国家度过危局的领袖，向人民阐明未来的外交与国防方略。"
USA_roosvelt_3rd_term_desc:"富兰克林·罗斯福打破传统，成功连任。人民选择相信他的领导经验与‘新政’遗产，期待他能在国际风暴中稳住舵轮。罗斯福将继续推行干预主义政策，加强援英力度，并为可能到来的战争做好动员准备。"
USA_duwei_term_desc:"共和党候选人温德尔·威尔基以黑马之姿赢得大选。他虽在国际事务上反对孤立主义，但更强调通过商业与贸易维护和平。威尔基政府将在国内减少政府干预，对外采取‘除战争外的一切援助’方针，谨慎平衡各方力量。"
USA_landeng_2nd_term_desc:"阿尔夫·兰登击败罗斯福，成功连任。这位堪萨斯州长以财政保守派著称，上任后将继续缩减‘新政’规模，严守中立主义立场。他的连任意味着美国在短期内不太可能卷入海外冲突，国内经济也将走上更加自由化的道路。"
USA_gongpin_jiuye_shijian_weiyuanhui_desc:"我们设立这一委员会，旨在禁止国防工业中的种族歧视，确保所有公民无论肤色都能公平获得就业机会。这既是提升战时生产效率的需要，也是向国家理想迈出的重要一步，为战后更广泛的社会改革奠定基础。"
USA_jungong_zhuanchan_desc:"随着国际局势紧张，我们将引导民用工业转向军工生产。汽车工厂将开始组装坦克，造船厂全力建造军舰，飞机生产线昼夜不息。这场‘民主兵工厂’的转型将极大增强国防能力，同时彻底终结大萧条时期的失业问题。"
USA_jinzhi_zhongzu_qishi_desc:"在工作场所，能力与贡献应成为唯一标准。我们将通过行政命令与立法，明确禁止基于种族、肤色或信仰的就业歧视。这不仅是对基本人权的捍卫，也将释放全体美国人的潜力，为国家凝聚最广泛的力量。"
USA_qianghua_laogong_quanyi_desc:"工人是国家建设的脊梁。我们将进一步强化劳工权益，包括扩大集体谈判覆盖范围、提高最低工资标准、加强职业安全保障。强大的工会与负责任的资方相结合，才能构建持久和谐的劳资关系，为经济繁荣提供稳定基础。"
USA_baofashi_zengzhang_desc:"在国防订单与内需扩张的双重驱动下，美国经济正经历前所未有的爆发式增长。工厂满负荷运转，就业率飙升，技术创新层出不穷。我们必须抓住这一历史机遇，将战时繁荣转化为持久的经济活力。"
USA_qiangda_gonghui_desc:"我们将推广工会与企业管理层协同决策的先进生产模式。通过劳资合作委员会、利润分享计划与技术培训项目，大幅提升劳动生产率。这种模式不仅使工人分享发展成果，也让企业在效率上获得竞争优势。"
USA_zhuran_jingji_desc:"军事开支正如同助燃剂，将国民经济推向沸腾。我们应当将军工订单作为核心引擎，拉动钢铁、机械、化工、电子等全产业链的扩张。这不仅是打赢战争的需要，更是塑造战后强大工业体系的战略投资。"
USA_tuidong_shehui_baozhang_desc:"我们将扩大《社会保障法》的覆盖范围，增加养老金、失业保险与弱势群体救助的力度。一个健全的社会保障体系，既是公民抵御风险的‘安全网’，也是国家在动荡时期维持内部凝聚力的关键支柱。"
USA_daxiyang_xianzhang_desc:"我们与英国联合发表《大西洋宪章》，向世界宣告两国战后重建的愿景_desc:民族自决、经济合作、贸易自由与免于恐惧的自由。这份文件不仅是战时联盟的象征，更将为战后建立新的国际秩序奠定原则基础。"
USA_pingheng_yusuan_desc:"连年的赤字开支令国家债务高企。我们必须痛下决心，通过削减非必要支出、提高税收效率与精简行政机构，逐步恢复预算平衡。稳健的财政是美元信用的基石，也是国家长期安全与繁荣的前提。"
USA_jiaoting_gonggong_gongcheng_desc:"许多公共工程已完成了其历史使命，继续投入只会造成资源浪费。我们决定叫停那些成效低下或已竣工的项目，将财政资源转用于更紧迫的领域，如国防建设与直接救济，确保每一分钱都用在刀刃上。"
USA_zhengfu_jiuji_desc:"对于最困难的群体，政府必须承担起直接救济的责任。我们将设立专项救济金，为失业者、贫困家庭与失依老人提供基本生活保障。这是一种朴素的道德义务，也是防止社会动荡的最后防线。"
USA_xianzhi_gonghui_desc:"部分工会的过度膨胀已威胁到经济秩序。我们将通过立法限制工会的罢工权、强制会费与政治活动，防止其滥用权力阻碍生产。自由市场的正常运转，需要劳资双方都保持适度约束。"
USA_jianshui_desc:"我们相信，减税是最有效的经济刺激手段。通过降低个人所得税与企业所得税，让民众手中留下更多资金，让企业有更多资本扩大生产与雇佣。更低的税负将激发创业热情，带动新一轮增长。"
USA_guli_touzi_desc:"通过税收减免、加速折旧与投资补贴等政策，我们大力鼓励私人资本投向新兴产业与关键技术。政府将与企业家携手，共同创造有利于长期投资的制度环境，为经济注入源源不断的活力。"
USA_youhuoli_shichang_desc:"一个充满活力的市场，需要有公平的规则、低度的壁垒与充分的竞争。我们将推动反垄断执法、破除地方保护、降低准入门槛，让优胜劣汰的机制充分发挥作用，释放市场经济的原生动力。"
USA_yanchi_zhengbing_desc:"目前国际局势尚未迫使我们动用征兵制。我们决定暂缓实施义务兵役，继续依靠志愿兵与国民警卫队维持国防力量。这有助于保障工业生产所需的人力资源，同时尊重民众对强制服役的顾虑。"
USA_qianghua_dongyuan_desc:"战争阴云密布，我们必须提前构建全国动员体系。从人力普查、工业转产到物资储备，每一个环节都需要周密规划。通过立法与行政手段建立高效动员机制，确保一旦需要，整个国家能迅速转入战时轨道。"
USA_zhunbei_44_xuanju_desc:"战火中的选举，是对民主制度最严峻的考验。我们将确保大选顺利进行，同时不影响战争努力。各党派需就战时领导权、战后重建与国际秩序等重大议题展开辩论，由人民决定未来四年的舵手。"
USA_roosvelt_4th_term_desc:"富兰克林·罗斯福第四次赢得大选。民众仍信任这位战时领袖，希望他带领国家打完最后一段艰苦的战争。罗斯福将集中精力处理战后安排与联合国创建，但他的健康问题也为未来埋下隐忧。"
USA_duwei_2nd_term_desc:"纽约州长托马斯·杜威击败民主党候选人，成为新一任总统。杜威年轻而富有活力，承诺以高效管理推进战争并平稳过渡到和平时期。他的胜利意味着战后政策将更倾向于国际主义与自由企业制度。"
USA_macarthur_term_desc:"道格拉斯·麦克阿瑟将军以战争英雄的身份赢得总统职位。民众渴望一位强势领袖结束战争并确立战后秩序。麦克阿瑟政府将拥有强烈的军事色彩，对内强调纪律，对外奉行强硬路线，深刻改变美国的政治风格。"
USA_weierji_2nd_term_desc:"温德尔·威尔基成功连任。他将国际主义与自由经济相结合的理念获得选民认可。威尔基政府将继续推动‘一个世界’的愿景，深化与盟国合作，同时在国内维持较为温和的干预政策。"
USA_zhiwo_zuiwo_qiwei_chunqiu_desc:"历史将如何评价我们？或许有赞誉，或许有毁谤。但我们坚信，今日所做的一切——无论是战争决策还是和平建设——都源于对国家与人民的责任。功过是非，留待后人书写。我们只求无愧于这个时代。"
USA_mac_fuck_jap_desc:"我们决定任命麦克阿瑟将军为盟军最高司令，负责对日本的占领与改造。他将以非凡的威望与执行力，在日本推行非军事化、民主化改革与战后重建。这是一项艰巨的使命，也将重塑太平洋地区的未来格局。"
USA_anti_com_desc:"面对共产主义的扩张，我们必须采取坚决的反制措施。从国内忠诚调查到海外遏制战略，我们将建立一套完整的反共政策体系，捍卫自由制度与资本主义秩序。这是一场意识形态的长期较量。"
USA_dulumen_term_desc:"哈里·杜鲁门这位来自密苏里的朴实政治家，如今肩负起总统的重任。他将延续前任的基本方针，但以更加直率务实的方式应对国内外挑战。杜鲁门的任期将是战后秩序奠基的关键时期。"
USA_maxieer_plan_desc:"欧洲经济的废墟是共产主义滋生的温床。我们提出一项大规模经济援助计划，帮助欧洲国家重建工业、恢复贸易、稳定社会。这不仅出于人道主义，更是为了培植稳定的盟友，为自由世界建立坚实的经济屏障。"
USA_united_nations_desc:"在旧金山会议上，我们与盟国共同签署《联合国宪章》。这一新的国际组织旨在维护世界和平与安全，促进国际合作。我们将全力支持联合国，并希望它成为防止战争悲剧重演的永久机制。"
USA_help_the_kid_desc:"在重大危机面前，昔日的对手也选择了罕见地联手。无论是党派之间的妥协，还是产业界的联合行动，抑或是国际舞台上的超越分歧，这种团结将使我们战胜一切挑战。团结，就是力量。"
USA_peace_love_and_world_desc:"战后一代呼唤的是和平、爱与对世界的拥抱。我们将推动文化交流、教育交换与人道援助，用善意取代猜忌，用合作取代对抗。这是建立长久和平的精神基石，也是美国作为国际社会一员的应有姿态。"
USA_quanqiuhua_desc:"技术的进步与贸易的扩展，正将世界前所未有地紧密联结。我们将主导建立开放的国际贸易体系，推动资本与商品自由流动。拥抱全球化，意味着美国的繁荣将与世界紧密相连，我们愿意成为这股浪潮的引领者。"
USA_guoji_kateer_desc:"为了保护关键产业与战略资源，我们将在部分领域建立国家支持的产业卡特尔。通过协调生产、统一定价、共享技术，增强国际竞争力，同时确保国家安全利益不受国际市场波动的冲击。"
USA_yuanzhu_mengyou_desc:"在国际体系中，我们有责任援助那些弱小但与我们拥有共同价值观的盟友。通过军事援助、经济扶持与技术转移，增强他们的自卫能力与自生能力。这些伙伴将构成我们全球战略的重要支点。"
USA_final_war_desc:"我们正迈向一场决定性冲突，这或许是‘最后的战争’。我们将倾尽国力，确保彻底击败敌人，并在此后建立永久的和平秩序。为此，任何牺牲都将是值得的。"
USA_no_more_war_desc:"战争已带来太多伤痛。我们选择伸出和解之手，与曾经的敌人化干戈为玉帛。通过对话、经济合作与制度化的互信机制，我们致力于让‘不再有战争’从理想变为现实。"
USA_cold_war_focus_desc:"我们与对立阵营之间已陷入一场全面冷战。这不是热战，却是意识形态、经济、科技与影响力的全方位较量。我们将建立长期战略，通过遏制、联盟与价值观输出，在这场持久战中占据上风。"
USA_hot_war_focus_desc:"外交与威慑已经失效，我们必须为大规模热战做好准备。军队全面整备，工业转入战时体制，全民动员体系激活。一旦战争爆发，我们将以全部国力投入，确保最终的胜利。"
USA_maixiang_fuli_guojia_desc:"我们正在完成一次历史性转变_desc:从应急性的救济走向制度化的福利国家。通过建立全民医保、扩大教育投入、完善养老体系，让每一位公民都能享有体面的生活。这不仅是社会正义的体现，也是现代国家的基本责任。"
USA_3rd_indus_revolution_desc:"计算机、自动化与核能正引领我们进入第三次工业革命。我们将加大对科研与教育的投入，鼓励颠覆性技术创新，抢占新科技革命的制高点。这场革命将重塑生产方式、社会结构与国家竞争力。"
USA_taikong_shidai_desc:"抬头仰望，太空已成为人类的新边疆。我们将整合军事、科研与民用航天力量，启动雄心勃勃的太空计划。从卫星到载人航天，从登月到深空探测，太空时代的大幕已经拉开，美国必须走在最前列。"


