USA_shachenbaoyingxiang:"黑色风暴"
USA_shachenbaoyingxiang2:"黑色风暴"
USA_shachenbaoyingxiang3:"黑色风暴"
USA_shachenbaosilue:"沙尘暴肆虐"

usa.501.t:"黑色风暴再次来袭"
usa.501.desc:"我们以为最坏的情况已经过去，但我们错了。来自农业部的紧急报告指出，土壤保护计划尚未显现效果，而新的、更具破坏力的沙尘暴再次席卷了中部大平原。\n这次的“黑色风暴”比之前的任何一次都要猛烈。电报中描述，正午时分“天地如同黑夜”，能见度降至零，铁路被掩埋，新兴的移民城镇几乎被从地图上抹去。更糟糕的是，风暴的范围正在向东蔓延，开始威胁到密西西比河流域的农业地带。\n绝望的情绪正在发酵。第一批西迁的移民在加州边境遭遇了敌意与“本地人优先”的抵制，而现在，更多的人正被困在故土与未知之间，无路可走。我们正面临一场不仅是生态的，更是社会与道德的全面崩溃。"
usa.501.a:"我马上就要见到调查报告。"

usa.502.t:"沙尘暴影响调查报告"
usa.502.desc:"一份关于沙尘暴影响的内部报告已呈交您的案头。报告详细描述了中部农业州遭受的毁灭性打击：大量农田被毁，数十万难民流离失所，正向西海岸迁移。这不仅是一场生态灾难，更严重削弱了国家的经济与稳定。\n报告里充斥着令人窒息的细节：家中地板上积着厚厚的尘土，即使紧闭门窗也无法阻挡；牲畜因尘土吸入肺部成批死亡；孩子们患上“尘土肺炎”，在咳嗽中艰难呼吸。曾经孕育着“世界面包篮”的大地，如今正将自己和人民的未来一并埋葬。"
usa.502.a:"批准紧急援助，设立安置营。"
usa.502.b:"我们现在无力处理此事。"

USA_jurendejuexing2_idea:"巨人的觉醒"
USA_meiguoyouxian2_idea:"美国优先"
USA_meishishehuizhuy2_idea:"美式社会主义"

usa.0.t:"欢迎来到美利坚合众国"
usa.0.desc:"总统先生，欢迎来到白宫。\n\n您所继承的不是一个职位，而是一场席卷全国的灾难。四分之一的劳动力失去工作，无数家庭在绝望中挣扎。曾经轰鸣的工厂如今寂静无声，如同这个国家被冻结的心跳。\n\n中西部，被称作“世界面包篮”的肥沃土地，如今正被无尽的沙尘暴吞噬，成千上万的农民被迫背井离乡，成为自己国土上的难民。\n\n在政治舞台上，战斗从您就职前就已经打响。左翼指责您过于温和，右翼则视您为社会主义的先锋。手握宪法的最高法院，正以怀疑的目光审视着您的每一项新政。而在大洋彼岸，世界经济摇摇欲坠，独裁者的阴影正在旧大陆上迅速蔓延。\n\n这个国家曾相信的永恒繁荣，如今已是一个破碎的梦。现在，轮到您来回答这个问题：一个自由的国家，能否做出伟大的事业？"
usa.0.a:"我们唯一需要恐惧的，就是恐惧本身。"

usa_news.12.t:"巨人的觉醒"
usa_news.12.desc:"在一场被全球观察家称为“决定性转折点”的仪式上，总统[ROOT.GetLeader]今日正式签署了极具争议的《全国工业再动员法案》。此举标志着美国已正式放弃其孤立主义的旁观者姿态，其庞大的工业潜力开始以前所未有的速度转化为实实在在的战争力量。\n\n“时代的幻想已经结束，”总统在签署仪式后的简短讲话中宣称，“我们选择不再做世界舞台上的观众。从今天起，美国的每一座熔炉、每一台车床、每一位工人的双手，都将为捍卫我们珍视的生活方式而服务。”"
usa_news.12.a:"希望这是民主兵工厂开始运转的齿轮声，而不是为时已晚的补救。"
usa_news.12.b:"一个被经济萧条和内部矛盾撕裂的巨人，试图穿上它过时的盔甲。"
usa_news.12.c:"我们必须捍卫民主。"

usa.811.t:"政治角逐：与谁同行？"
usa.811.desc:"随着内战的尘埃落定，财团与总统的矛盾开始日益突出。总统想要将国家打造为上下一体，忠诚于他的国家机器；而财团则只是想让美国成为资本家的天堂。骰子已经掷下，美国的命运，现在正取决于我们。"
usa.811.a:"站在总统身边显然是最佳答案。"
usa.811.b:"企业国的时代该到来了。"

USA_bop_moheizongtong:"抹黑总统"
usa.821.t:"针对总统的指控"
USA_bop_shouquanmimijingcha:"授权秘密警察"
USA_bop_gonggongshiyekonggufa:"再次提出《公共事业控股公司法》"
usa_841a_tt:"我们将与§Y财团§!站在同一战线"
usa_841b_tt:"我们将与§Y总统§!站在同一战线"

usa.822.t:"他们为你的孩子准备了什么？"
usa.822.desc:"一份在工业区散发的传单写道："当他在广播里承诺未来时，他的华尔街伙伴正在清算我们的未来。"传单指控总统家族基金在军火与医药股中秘密持仓，而"不幸的是"，近期边境冲突与工厂事故恰好让这些股票翻了四倍。\n"每口棺材里都有他的股息"，传单底部的标语如同淬毒的匕首。尽管财政部立即出具了总统的资产证明，但怀疑的种子已在酒馆与车间里发芽。"
usa.822.a:"现在有好戏看了。"

usa.823.t:"将军们的警告"
usa.823.desc:"一份秘密备忘录的"泄露件"在首都精英圈中疯狂传播。文件中，一位"深感忧虑的"四星上将警告同僚，总统的心理状态"不稳定"且"对军队怀有平民式的蔑视"，并暗示其可能清洗不绝对忠诚的指挥官。\n尽管军方发言人斥之为"彻头彻尾的伪造"，但这份文件精准地挑拨了军队与文官政府之间最敏感的神经。"
usa.823.a:"难道还要再来一次内战？"

usa.824.t:"他在为谁演奏？"
usa.824.desc:"由"爱国阵线"制作的广播剧在夜间播出，剧中一位声音酷似总统的演员，与一个口音浓重的外国特工进行着肮的交易。"这个国家只是跳板"，剧中人轻蔑地说，"真正的目标，是更伟大的国际革命。"\n尽管内容荒诞，但其精良的制作和充满细节的对话，让许多听众深信不疑。人们开始在街头巷尾质问：他究竟是谁的总统？"
usa.824.a:"或许这就是现实..."

usa.825.t:"消失的博士论文"
usa.825.desc:"大学校园里流传着一份据称是总统青年时代的博士论文副本，其中充斥着对某些极端思想的推崇。档案管理员"意外"发现，官方档案中这份论文的关键章节已不翼而飞。\n反对派议员在议会质询："是他否定了自己的过去，还是他的过去揭示了他的本质？""
usa.825.a:"总统也许不是那样诚实.."

usa.826.t:"军工厂的空白订单"
usa.826.desc:"一份来自"士兵母亲协会"的请愿书在民间流传，其中附有一份模糊的军工生产报告复印件。报告显示，在总统亲信视察某兵工厂后，该厂为前线部队生产的步枪订单被无故取消了20%。\n"我们的孩子在用生命保卫国家，而有人却在克扣他们的武器！"协会发言人在街头演讲中哭诉，"这是背叛，是用爱国者的鲜血做交易！""
usa.826.a:"总统带头叛国？"

usa.831.t:"前线的劣质钢铁"
usa.831.desc:"一份来自内部调查委员会的绝密报告被送至您的案头。报告指出，"国家钢铁与铸造公司"为陆军生产的装甲板存在系统性质量问题。通过降低铬含量并使用劣质废钢，该公司在最近六个月中非法获利数百万。\n更令人愤怒的是，有证据表明公司管理层早已知情，并压下了内部工程师的警告。这直接导致了三艘驱逐舰的早期沉没与数百辆坦克的额外战损。"
usa.831.a:"立即国有化，并以叛国罪起诉负责人。"
usa.831.b:"压处以巨额罚款，并强制其更换管理层。"
usa.831.c:"压下消息，命令他们限期整改。"

usa.832.t:"扼杀创新的协议"
usa.832.desc:"内部调查委员会经过长达数月的调查，终于取得了决定性突破。调查显示，包括"通用电气"与"威斯汀豪斯"在内的六大工业巨头，通过一个秘密的"技术共享协议"，系统地扼杀了新兴企业在无线电与涡轮机领域的技术创新。\n他们通过收购专利后雪藏、统一压低能效标准，甚至联手抵制采用新技术的下游厂商等方式，人为延缓了整个国家的产业升级。"
usa.832.a:"成立国家技术标准委员会。"
usa.832.b:"逼迫他们缴纳‘创新罚金’。"

usa.833.t:"矿井下的童工"
usa.833.desc:"内部调查委员会潜入"中西部煤炭联合体"的矿区，带回了令人心碎的证据。调查显示，该公司不仅普遍雇佣未满14岁的童工从事井下作业，还通过公司商店、暴力威胁等方式，构建了一个现代奴隶制体系。\n与此同时，调查员发现该公司连续五年通过做假账，偷逃了巨额税款，这些资金被用于贿赂地方官员以掩盖真相。"
usa.833.a:"吊销其特许状，资产充公。"
usa.833.b:"推动《工作场所安全与公平法案》。"

usa.834.t:"通往敌人的输油管"
usa.834.desc:"内部调查委员会通过拦截的通信和航运记录，发现了一个令人震惊的事实：我国某石油公司通过一系列位于中立国的空壳公司作为中转，持续向我们的潜在敌国出口航空燃油。\n该公司高管在内部通信中直言不讳："意识形态是暂时的，而利润是永恒的。"而我们的飞行员，未来很可能要在空中面对由我们自己的燃料驱动的敌机。"
usa.834.a:"将其国有化，并转为专属军需供应商。"
usa.834.b:"秘密警告，勒令其终止交易并缴纳罚款。"

usa.841.t:"《公共事业控股公司法》"
usa.841.desc:"为遏制财团势力的日益强大，总统不顾反对，再次提出申请通过《公共事业控股公司法》。此法案最初由前总统罗斯福提出，被指责是试图摧毁自由企业制度。\n该条款规定，到1940年1月1日，所有公共事业控股公司必须将其业务整合为一个单一的、一体化的系统。这意味着，一个控股公司只能控制一个在地理上和经济上相互关联的电力系统。任何无法证明其对社会公众有益的控股公司都将被强制解散。"
usa.841.a:"无论如何不能让此法案通过。"
usa.841.b:"通过此法案将大大提升我们的胜算。"

usa.842.t:"电力战争：第一周"
usa.842.desc:"总统在昨晚的“炉边谈话”中，以不容置疑的语气宣布将向国会提交新版《公共事业控股公司法》，旨在“拆解盘踞在美国家庭之上的能源寡头”。话音未落，舆论的火山已然爆发。\n【第一天】\n支持者的欢呼与反对者的怒吼同时充斥电台波段。消费者权益组织与工会走上街头，称此为“迟来的正义”；而商业协会则紧急召开记者会，警告此举将“扼杀投资，让美国灯光熄灭”。\n【第三天】\n资本市场剧烈震荡，公用事业板块股价暴跌，带动大盘下行。反对派议员在国会山前合影，手持《宪法》高声朗读，指控总统“滥用权力”。\n【第五天】\n一场精心策划的舆论反击开始了。全国各地的报纸上出现了由“美国电力消费者选择联盟”（背后由控股公司资助）购买的整版广告，画面是一位忧心忡忡的老妇人，配文是：“他关心你的账单，但谁关心你的养老金？（我们的股票为数百万退休账户供电）”\n......"
usa.842.a:"我们必须掌控叙事——启动我们的宣传机器！"
usa.842.b:"让事实说话，敦促国会尽快投票。"

usa.843.t:"法案已递交"
usa.843.desc:"今天，在国会联席会议的讲台上，气氛凝重得如同暴风雨前的宁静。没有过多的寒暄，您直接将一份厚重的文件举起——那就是《公共事业控股公司法》的草案。\n“议长先生，各位议员先生女士，”您的声音通过广播传遍全国，“我今天站在这里，不是为了宣布一场战争，而是为了结束一场战争——一场被强加在普通美国家庭与小企业主身上的、不宣而战的战争。”\n“这场战争的武器是过高的电费账单，它的战壕是那些跨越州界、错综复杂而无人能监督的公司结构，它的俘虏，就是被垄断权力所束缚的自由市场本身！”\n随着您逐条阐述法案的核心——强制拆分庞大的公用事业帝国、建立严格的联邦监管，会场中的裂痕清晰可见。一侧的议员席上爆发出热烈的掌声，另一侧则是一片死寂，间或传来响亮的嘘声。走廊里，公用事业公司的说客们面色阴沉，正与关键的委员会主席进行着紧急的耳语。\n战斗的号角已经吹响。现在，法案的命运交给了国会。"
usa.843.a:"联系我们的议员，确保法案无法通过"
usa.843.b:"用行政命令先行一步，施加压力。"

usa.844.t:"王国的崩塌"
usa.844.desc:"经过数日惨烈的政治厮杀，无数的演讲、妥协、威胁与深夜投票，《公共事业控股公司法》终于获得了国会的最终通过。今天，在数百名支持者、记者与内阁成员的注视下，总统用那支著名的钢笔，在文件上签下了自己的名字。\n空气中弥漫着一种近乎革命性的狂喜。就在总统放下笔的瞬间，广播里传来了纽约证券交易所的即时消息：公用事业控股公司的股价一泻千里，而更广泛的工业指数却应声上扬。市场给出了它最真实的反应——旧时代的垄断秩序，已然终结。\n窗外，聚集的人群爆发出雷鸣般的欢呼。他们手中的标语不再是抗议，而是庆祝——“光明终于到来！”、“人民赢了！”。在那一刻，总统不仅签署了一项法案，更击碎了一个看似不可战胜的金融王国。白宫的电力，似乎都因此而变得更加明亮、更加廉价。\n权力的结构被永久地改变了。总统证明了，即便是最根深蒂固的利益集团，在坚定的意志面前，也并非无懈可击。"
usa.844.a:"此乃总统之胜"

usa.845.t:"铁幕落下"
usa.845.desc:"最终计票结果宣布的那一刻，国会大厅内爆发出两股截然不同的声浪——一边是胜利的欢呼，另一边是绝望的叹息。尽管用尽了所有的政治资本，发动了全国的民意，《公共事业控股公司法》最终还是被埋葬在了冗长的辩论和无情的游说之中。\n消息像野火般传开。广播里，反对派的评论员用胜利的口吻宣布：“理性战胜了民粹！”而在股市，公用事业巨头的股价应声飙升，仿佛在嘲笑着白宫的失败。\n这不仅仅是一项法案的失败。这是对总统执政纲领的全面否定，是特殊利益集团对公共意志的一次公然胜利。它传递出一个冰冷刺骨的信号：在这个国家，有些力量，甚至比总统更为强大。\n权力的天花板已然显现，而且是由金钱铸成的。"
usa.845.a:"距离我们的胜利又近一步"

usa.846.t:"伤痕累累的胜利"
usa.846.desc:"经过最后一轮筋疲力尽的马拉松式谈判，当计票器上显示出那微不足道的多数优势时，没有人欢呼。为了争取这关键的几票，总统付出了巨大的代价：法案的执行期限被延长，最严格的拆分条款被弱化，大量的例外情况被写入文本。\n总统手中的笔，签署的不再是那份旨在“拆解巨头”的雷霆法案，而是一份充满了妥协、例外和延迟的复杂协议。核心的支持者们感到被背叛，指责这是一场“假胜利”；而反对派则冷眼旁观，宣称他们“从灾难中挽救了半个行业”。\n法案通过了，法律书籍上会记录下它的名字。但所有人都心知肚明，真正的战争从现在才正式开始——一场与那些被激怒、却未被驯服的巨兽之间，关于法律解释、执行力度和持久消耗的战争。"
usa.846.a:"此乃未竟之事。"

usa.847.t:"揭晓答案"
usa.847.desc:"总统与财团均尽了最大努力。现在答案已经显而易见了。"
usa.847.a:"结果是："
