US_can_us_influence:0"美国的指引" 
US_can_us_influence_tt:0"大大§Y增加§!与§Y美国§!保持§Y良好关系§!的欲望！" 
US_can_us_influence_desc:0"虽然我们的国防与外交均以英国为核心，但是美国的逐渐崛起使我们不得不考虑调整外交方向。英国可能对此不高兴，但是有了美国的指引，我们终有一日能摆脱英国。" 

usa_extra.16.t:"我们的电影风靡全世界！"
usa_extra.16.desc:"虽然大萧条让我们的电影事业收到了严重打击，但是好莱坞依然屹立不倒。过去的几年，美国电影依旧风靡全球，吸引越来越多的人了解美式生活、美国文化\n如今大萧条的影响渐渐淡去，我们的电影事业也逐渐再次焕发生机。《最后的莫西干人》、《飞侠哥顿》等电影不仅在我们国内取得了好成绩，在国外亦然。事实上，我们已经引领了国际电影潮流。"
usa_extra.16.a:"Niceeeee！"

usa_extra.17.t:"扩大军火贸易的必要"
usa_extra.17.desc:"虽然在我们的努力下，大萧条缓解了。但是目前我们的国家经济状况却依旧糟糕。我们需要大笔创收手段\n而随着世界局势日益紧张，各国紧需武器来扩充国防。这是我们的机会。我们可以利用中立的身份将武器卖给其他国家换取外汇。但是这可能引起国民不满：一方面，我们自身部队也很薄弱；另一方面，此举近乎战争贩子。"
usa_extra.17.a:"这是必要之举。"
usa_extra.17.b:"还是算了把。"

usa_extra.18.t:"加拿大寻求重新签订双边贸易协定"
usa_extra.18.desc:"鉴于此前的双边贸易协定使我们两国都获得了巨大优惠，加拿大外贸部长几乎在条约到期的同时便致电我方，希望再次续约\n上次条约美加双方在各种关税协定上达成了初步一致，我们停止贸易保护，他们则视我们为最重要的贸易伙伴。那么我们的答复是？"
usa_extra.18.a:"当然，我们合作共赢！"
usa_extra.18.b:"还是重新考量吧。"

