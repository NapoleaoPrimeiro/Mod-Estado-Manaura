end_the_cold_war:0"赢得冷战" 
end_the_cold_war_desc:0"美国与苏联之间的竞争已经不仅仅是意识形态之争，更是决定人类未来命运的路口。将美苏冷战看作是帝国主义之间的利益争夺，是看扁了这两个伟大的文明。美国要赢得不仅仅是苏联，而且要证明民主、自由的普世价值是正确的。"


USA_jingji_tingzhi_desc:0"由于国内的孤立主义加上大萧条的摧残，我国的军备生产早已停滞。若想再次启动我们的生产机器，我们的决心与资金缺一不可。"
USA_jingji_tingzhi2_desc:0"由于国内的孤立主义加上大萧条的摧残，我国的军备生产早已停滞。若想再次启动我们的生产机器，我们的决心与资金缺一不可。"
USA_great_depression_over_desc:0"困扰我国多年的“大萧条”终于进入尾声，民众对未来充满了希望，国家再度恢复生机。"
USA_gongpin_jiuye_shijian_weiyuanhui_idea_desc:0"尽管社会福利制度不含有歧视性条款，却由于社会状况与政治势能，形成经济事实上的歧视性结构，进而深远地影响着公民意识与社会文化。这是我们一直致力于解决的问题。"
USA_maxier_jihua_desc:0"二战结束后，作为主战场的欧洲受到较大的战争冲击，生产凋敝，财政崩溃，资产阶级政权濒临危机。为防止共产主义在欧洲蔓延，我们必须介入。" 
USA_cold_war_desc:"\n\n\n\n\n£GFX_usa_vs_sov\n\n\n\n\n\n\n冷战是两个超级大国之间的对抗时期，涵盖了政治、军事、经济及意识形态上的长期斗争。双方通过发展核武器和其他先进军备来保持战略上的平衡，同时在各个领域展开广泛的竞争。讽刺的是，这也是人类发展速度最快的时期。" 
USA_hot_war_desc:"\n\n\n\n\n£GFX_usa_vs_sov\n\n\n\n\n\n\n两种意识形态之间的冲突终究无法弥合，他们会互相厮杀直到一方毁灭。" 
USA_roosevelt_yichan_desc:"有人说我是独裁的暴君，有人说我是社会主义分子。但无论如何，历史的风终将吹走我墓前的垃圾。"
USA_home_of_free_desc:"\n\n\n\n£GFX_usa_home_of_free_text\n\n\n\n\n\n在这片土地上，自由不仅是写在独立宣言中的理想，更是每一个公民呼吸的空气、行走的权利与奋斗的尊严。从列克星敦的枪声到葛底斯堡的演说，从圣胡安山的冲锋到诺曼底的滩头，一代代美国人用勇气守护着这份自由。这里不问出身，只问梦想；不惧挑战，只畏退缩。正是这种对自由的信仰与面对危难时的勇敢，铸就了美利坚合众国的灵魂。只要自由的火炬仍在高举，这片家园就永远是勇敢者的归宿。"

