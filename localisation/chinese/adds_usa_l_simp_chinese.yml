HAW_wangguo_shiwu_desc:"几十年的沉沦，夏威夷王国终于再次复国。但留给我们庆祝的时间不多了，日本与美国无时不刻不对我们虎视眈眈--日本想要控制我们作为太平洋战略重心，将海军力量投射至美国本土；美国则想要卷土重来，再次将夏威夷纳入版图\n我们能做的便是在这两者之间周旋，利用我们的价值攫取更多资源来发展我们自身，只有夏威夷强大起来，才不会再次亡国。"
