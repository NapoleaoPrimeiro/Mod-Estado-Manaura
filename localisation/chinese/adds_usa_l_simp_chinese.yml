USA_max1_desc:0"卡尔·马克思，全名卡尔·海因里希·马克思（德语：Karl Heinrich Marx，1818年5月5日－1883年3月14日），马克思主义的创始人之一，第一国际的组织者和领导者，马克思主义政党的缔造者之一，全世界无产阶级和劳动人民的革命导师，无产阶级的精神领袖，国际共产主义运动的开创者。"
USA_max2_desc:0"1857年，爆发了世界性的经济危机。马克思认为，随着经济危机而来的可能是革命，在这之前要用科学理论武装工人阶级。因此，马克思在给恩格斯的信中说：我现在发狂似地通宵总结我的经济学研究，为的是在洪水之前至少把一些基本问题搞清楚。"
USA_max3_desc:0"唯物辩证法 即“马克思主义辩证法”。以自然界、人类社会和思维的运动形式的一般转化环节为研究对象，是辩证法思想发展的高级形态，是马克思主义哲学的重要组成部分。认为物质世界是普遍联系和不断运动变化的统一整体；辩证规律是物质世界自己运动的规律；主观辩证法或辩证的思维是客观辩证法在人类思维中的反映。是最全面、最丰富、最深刻的发展学说。"

USA_engs1_desc:0"弗里德里希·恩格斯（德语：Friedrich Engels，1820年11月28日－1895年8月5日），德国思想家、哲学家、革命家、教育家、军事理论家，是全世界无产阶级和劳动人民的伟大导师和领袖、马克思主义创始人之一。"
USA_engs2_desc:0"该书运用历史唯物主义基本观点，对资本主义经济、政治制度和阶级关系作了全面剖析，分析了资本主义生产方式必然导致的后果：周期性经济危机的爆发，产业后备军的形成，以及随着资本主义生产的发展，资产阶级日益加强对无产阶级和劳动群众的剥削等，从而揭示了资本主义本质及其必然灭亡的客观规律。还论述了现代无产阶级随着产业革命而发展的历史过程，以实地调查的大量事实，详尽地描述了英国无产阶级的悲惨生活，对资本主义和资产阶级进行了严厉的控诉。"
USA_engs3_desc:0"恩格斯式规划体系"

USA_liening1_desc:0"弗拉基米尔·伊里奇·列宁（1870年4月22日—1924年1月21日），原名弗拉基米尔·伊里奇·乌里扬诺夫，俄国辛比尔斯克人（现乌里扬诺夫斯克市） [56]。伟大的无产阶级革命家、政治家、理论家、思想家，曾任苏联人民委员会主席（即苏联总理）、工农国防委员会主席等重要职务。"
USA_liening2_desc:0"民主集中制"
USA_liening3_desc:0"和平、土地与面包"

USA_stalin1_desc:0"约瑟夫·维萨里奥诺维奇·斯大林（俄语：Иосиф Виссарионович Сталин，英语：Joseph Vissarionovich Stalin，），格鲁吉亚人，苏联无产阶级革命家、政治家、军事家，苏联大元帅，苏联党和国家最高领导人"
