USA_secure_china2:"援助中共"
USA_secure_china2_desc:"援助中共"

usa.503.t:"[From.GetNameDefCap]的最后通牒"
usa.503.desc:"[From.GetLeader]日前送来了信函，他们认为共产主义是人类最美好的前途。[From.GetNameDef]已完成了向共产主义国家的转变，并且声称中国需要共产主义政府。他们建议我们重组政府机构。但如果我们拒绝，他们届时将采取“他们所认为必要的措施”。"
usa.503.a:"娘希匹..."
usa.503.b:"娘希匹！让美国佬放马过来！"

usa.504.t:"[FROM.GetLeader]妥协"
usa.504.desc:"经过不懈的外交谈判，[From.GetLeader]已经同意重组政府机构，使其完成向共产主义政府的转变。毛泽东同志已于昨日抵达南京，与[From.GetLeader]商讨国家事宜。"
usa.504.a:"为我们的中国朋友干杯！"

usa.505.t:"[FROM.GetLeader]拒绝我方提议"
usa.505.desc:"[From.GetLeader]在回信中指责我方试图干预中国内部事务。他们认为我方提议并不适合中国。"
usa.505.a:"我们别无选择"

usa_news.13.t:"美国干预中国局势"
usa_news.13.desc:"昨日，白宫正式宣布将介入亚洲局势。他们极力想将中国打造为下一个共产主义大国，并已经向中国政府致函。\n中国政府的回应我们尚未可知，但是毫无疑问，共产主义势力正在逐步壮大。"
usa_news.13.a:"为共产主义干杯！"
usa_news.13.b:"红色美国向我们亮出了獠牙。"
usa_news.13.c:"为人类解放而奋斗！"
