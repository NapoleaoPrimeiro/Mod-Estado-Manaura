usa_communism.1.t:"厄尔·白劳德的命运"
usa_communism.1.desc:"作为美共前任总书记，厄尔·白劳德提出与民主党进步人士、温和工会、民权团体结成广泛跨阶级联盟；暂时搁置激进夺权纲领，支持新政劳工法案、失业救济，依靠合法议会竞选扩大美共群众基础。但其行为却过度向资产阶级妥协、消解无产阶级独立斗争路线。更是有放弃无产阶级专政倾向\n如今，他已经从位置上退下，我们该如何处置他？"
usa_communism.1.a:"开除党籍！"
usa_communism.1.b:"给他个闲职"

usa_communism.2.t:"少数派当选"
usa_communism.2.desc:"虽然我们成功赢得了领导者的位置，但是我们的影响力相比其他几个派系实在是太过弱小。这导致我们的政府办公效率低下、行政人员懒散。更糟糕的是，大量官员仍然听从在野党派，对我们的政令不屑一顾。如此下去，我们无法长久维持政府！"
usa_communism.2.a:"必须扩大我们的影响力！"

usa_communism.3.t:"我们的农业蒸蒸日上！"
usa_communism.3.desc:"我们之前的一系列农业改革措施终于发挥了作用，我们的农业引来了大爆发：市场里摆满了各种各样的农产，游行抗议的农民们也再次回到了田里。\n最重要的是，农业红利辐射到了各个方面，我们的财政缓解，社会也稳定了下来。"
usa_communism.3.a:"人人都有拖拉机！"

usa_communism.4.t:"美共现状"
usa_communism.4.desc:"虽然大萧条为美共带来了机会，但美共内部巨大的分歧却使其徘徊不前。本应团结的激进左翼如今彻底分裂为三支路线完全对立的核心派系，各自争夺工人运动领导权，严重削弱全美激进力量。\n\n作为美国共产党现任总书记，白劳德完全贯彻1935年共产国际新出台的人民阵线总路线，主张放弃第三时期极端宗派主义，缓和革命口号，全面靠拢罗斯福新政自由派。\n\n福斯特是美共开国元老、老牌工人运动组织者，长期主管党内工会工作，与白劳德形成持久路线冲突。他认可共产国际人民阵线反法西斯大方向，但坚决反对白劳德无底线妥协新政、淡化阶级斗争的修正倾向，坚持政党的纯洁性。\n\n1928年因公开支持托洛茨基左翼反对派被美共开除后，詹姆斯·坎农建立独立托派组织美国工人党，彻底与斯大林主导的共产国际决裂，成为完全独立于美共体系的第三支左翼力量。坎农全盘否定白劳德人民阵线、同时批判福斯特对斯大林官僚制的妥协。"
usa_communism.4.a:"如此如何能壮大？"

usa_communism.5.t:"与托派分子合作？"
usa_communism.5.desc:"自从1928年詹姆斯·坎农被开除美共党籍，他便成立了美国工人党与我们分庭抗礼。虽然我们对其十分厌恶，但是此时是美国革命的关键时机，我们需要团结一切可以团结的左翼力量。如今，詹姆斯·坎农也再度开始宣传他们的托派学说。那么，我们是否该拉拢他们作为革命助力？"
usa_communism.5.a:"非常之时行非常之事！"
usa_communism.5.b:"绝对不行！"

usa_communism.6.t:"美国立宪大会"
usa_communism.6.desc:"我们胜利了！如今也是时候进行一系列体制改革来迎接新美国了！"
usa_communism.6.a:"来吧！"

usa_communism.7.t:"对资产阶级的态度"
usa_communism.7.desc:"虽然我们赢得了内战，但是由于美国的国情，短期内资产阶级的存在难以改变。\n在对此问题的处理上，白劳德认为美国正走向进步资本主义，该与资产阶级长期合作，主张共产党放弃独立的政治纲领\n福斯特坚持“资本主义本质不变”的经典立场，认为帝国主义和阶级压迫依然存在，必须坚持无产阶级政党的独立性，反对任何形式的阶级调和。"
usa_communism.7.a:"资本主义已经发生根本变化。"
usa_communism.7.b:"资本主义本质不变！"
usa_communism.7.c:"怎么可以对资本阶级妥协？"

usa_communism.8.t:"国际主义与阶级立场"
usa_communism.8.desc:"由于美国独特的地理位置，关于我们的外交方向其实一直是重点讨论问题\n白劳德强调“美国例外论”，倾向于淡化国际无产阶级的共性，强调与国际资本合作对抗法西斯\n福斯特则强调国际主义，坚持无产阶级的国际团结，并强烈反对为了美苏合作而牺牲共产党的独立性与斗争目标。"
usa_communism.8.a:"法西斯才是头号大敌！"
usa_communism.8.b:"必须保护我们政党的独立！"
usa_communism.8.c:"一国建成社会主义绝不可取！"

usa_communism.9.t:"党的组织原则"
usa_communism.9.desc:"我们的政党内部到底该如何组织一直没有定论。虽然我们是共产主义政党，但是自由却是美国人的天性\n在此问题上，福斯特派系主张强化党的传统组织纪律，保持“先锋队”的纯洁性。白劳德则倾向于放宽组织限制，试图将党改造为一个更广泛的“政治协会”以适应和平时期的斗争。"
usa_communism.9.a:"和平时期就该和和气气"
usa_communism.9.b:"不能让别有用心的人污染党的纯洁！"
usa_communism.9.c:"先锋队是革命的先锋！"

usa_communism.10.t:"大会闭幕"
usa_communism_10.bailaode:"经过一番表决，尽管福斯特万般不愿，但是白劳德依然以压倒性优势取得胜利\n白劳德不仅巩固了权力，更是在几个重大问题上确定了全党前进方向，美国共产党从此迈步进入了新的篇章\n但是反对者却对白劳德的主张嗤之以鼻，在大会最后，不少反对者甚至直接离席...由此可见，要彻底掌控美共，白劳德未来还有许多要做。"
usa_communism_10.bailaode2:"令人意外的事情发生了，几个派系居然势均力敌，没人能够稳压一头。白劳德因此紧急宣布行使美共总书记权力，要求其他派系放下芥蒂，暂时团结以应对国内局势。白劳德承诺，各个派系在政府中均有一席之地--以此组成一个大联盟暂时确保权力。而几个坚定的反对者派系却不为所动，他们拒绝支持白劳德，眼见从政无望，再度离去。"
usa_communism_10.fusite:"经过一番表决，福斯特成功击败白劳德成为美共主席。白劳德虽然还想抓住权力不放，但随着投票结果的慢慢揭露，白劳德再也不能继续\n福斯特公开驳斥了白劳德的错误言论，他指出美共必须坚定纯洁性、独立性，为美国赢得一个更美好的未来。同时指出美苏有很多互补的地方，美苏合作乃是双赢。最后，他提出必须支持外国左翼力量，让共产主义传播开。"
usa_communism_10.kannong:"令人意想不到的是托派居然赢得了领导权。詹姆斯·坎农随即发表讲话，会彻底改造美国，让美国成为一个无产阶级专政的国家。他也全盘否定白劳德人民阵线、同时批判福斯特对斯大林官僚制的妥协\n但是白劳德与福斯特的影响依然在，美国共产党的影响力依然在--由此可见，詹姆斯·坎农与他的美国工人党任重而道远。"
usa_communism.10.a:"白劳德继续行使权力！"
usa_communism.10.b:"福斯特捍卫共产党纯洁！"
usa_communism.10.c:"坎农让托派再次伟大！"
usa_communism.10.d:"白劳德宣布紧急接管权力！"


usa_communism.11.t:"詹姆斯·坎农扩大托派宣传活动"
usa_communism.11.desc:"随着我们的宣传活动如火如荼进行，美国工人党的詹姆斯·坎农也不甘示弱。他扩大托派宣传活动，隐隐有与我们分庭抗礼之态\n糟糕的是，他依然坚持他的托派路线。"
usa_communism.11.a:"这该死的家伙！"
usa_communism.11.b:"让警察对付他！"

usa_communism.12.t:"与洛夫斯通派和解？"
usa_communism.12.desc:"杰伊·洛夫斯通，美共创始人之一。他因反对斯大林被开除党籍。后又成立洛夫斯通派。但该组织一直表示愿意与美共统一。如今我们的革命迫在眉睫，是否要与之和解？毕竟正如那句话，众人拾柴火焰高。现在多一份力量都是好的。"
usa_communism.12.a:"我们需要他的力量。"
usa_communism.12.b:"叛党者不容宽恕。"

usa_communism.13.t: "[FROM.GetName]请求武器"
usa_communism.13.desc: "[FROM.GetNameDef]向我们求助，鉴于其国内即将发生一场大革命，他们请求我们提供装备来确保胜利。"
usa_communism.13.a: "把多余的援助他们"
usa_communism.13.b: "我们提供不了任何东西"
usa_communism.14.t: "[FROM.GetName]送来援助"
usa_communism.14.desc: "[FROM.GetNameDefCap]已同意运送我们请求的装备。这批大规模物资将使我们能够组建数个新师，并为我们提供组建支援连所需的特种装备。"
usa_communism.14.a: "太好了，我们会好好利用的。"
usa_communism.15.t: "[FROM.GetName]拒绝提供援助"
usa_communism.15.desc: "我们向[FROM.GetNameDef]请求援助的要求遭到拒绝，[FROM.GetAdjective]官员表示[FROM.GetNameDef]在近期重组后已无多余装备可以提供。"
usa_communism.15.a: "我们必须另外寻找别的来源。"

usa_communism.16.t: "[FROM.GetName]送来援助"
usa_communism.16.desc: "[FROM.GetNameDefCap]向我们提供支援。这批大规模物资将使我们能够组建数个新师，并为我们提供组建支援连所需的特种装备。"
usa_communism.16.a: "太好了，我们会好好利用的。"

usa_news.16.t:"威廉·福斯特拨乱反正"
usa_news.16.desc:"美国立宪大会今日闭幕，大会以压倒性多数通过决议，正式摒弃厄尔·白劳德的修正主义理论及政策。威廉·Z·福斯特同志重新当选为美国共产党主席。\n\n白劳德的错误路线自始便遭到以福斯特为首的众多共产党员的坚决反对。本次大会上，福斯特领导正统派力量展开激烈斗争，最终投票否决其修正主义路线。\n\n大会决定重建美国无产阶级的政党——美国共产党，恢复马克思主义的领导地位。福斯特在会后发表声明，号召全党同志团结一致，清算白劳德主义流毒，重新确立工人阶级政党的革命路线。"
usa_news.16.a:"恭喜福斯特同志！"
usa_news.16.b:"赤色版图再次扩张。"
usa_news.16.c:"我们迎来新的篇章。"

usa_news.17.t:"厄尔·白劳德巩固权力"
usa_news.17.desc:"美国立宪大会今日闭幕，现任主席厄尔·白劳德以压倒性多数赢得信任投票，成功巩固其党内绝对领导权。大会正式通过决议，重申白劳德提出的“资本主义与社会主义和平共存”及阶级合作路线，并宣布一切反对言论均为“宗派分裂行为”。\n\n福斯特及其追随者在大会上遭到全面围剿，其提交的大部分提案被否决。大会同时授权白劳德对党内“左倾冒险分子”进行整肃，以维护美国共产党的统一。"
usa_news.17.a:"他至少不是最差的选择"
usa_news.17.b:"居然让这个机会主义者巩固权力？"
usa_news.17.c:"我们迎来新的篇章。"

usa_news.18.t:"詹姆斯·坎农赢得美国大权"
usa_news.18.desc:" 社会主义工人党领袖詹姆斯·P·坎农今日正式入主白宫，宣告美国进入革命新纪元。在席卷全国的总罢工与工人武装护卫队起义中，坎农领导的托洛茨基主义力量推翻旧秩序，夺取了国家权力。\n\n坎农在就职演说中宣布，新政权将彻底清算白劳德主义的“阶级合作”路线与福斯特派的“斯大林主义残余”，建立真正的革命马克思主义领导。他同时呼吁全球无产阶级联合起来，推动“不断革命”。\n\n观察人士指出，作为第四国际创始人与美国托洛茨基主义运动主要领袖，坎农的上台意味着美国彻底脱离莫斯科轨道，转而拥抱托派革命路线。"
usa_news.18.a:"该死！怎么会是他？"
usa_news.18.b:"最差的结果。"
usa_news.18.c:"我们迎来新的篇章。"

usa_communism.17.t: "选择我们的旗帜"
usa_communism.17.desc: "新天地，新气象"
usa_communism.17.a: "1号旗帜"
usa_communism.17.b: "2号旗帜"
usa_communism.17.c: "3号旗帜"
usa_communism.17.d: "4号旗帜"

usa_communism.18.t: "威廉·福斯特宣布辞职"
usa_communism.18.desc: "由于政见不同，党内几个派系一直有着重大分歧。\n革命未成功时，几个派系尚且能够以大局为重，相忍为革命；但如今，随着革命成功，分歧再也无法无视。\n威廉·福斯特，这位自诩正统马克思主义的共产主义者，已经彻底对我们的政府失望。他公开表示将会辞职。"
usa_communism.18.a: "会有人接替他们的工作。"

usa_communism.19.t: "詹姆斯·坎农号召反对派"
usa_communism.19.desc: "詹姆斯·坎农，一个铁杆托派。不得不说他能够与我们合作共同发起革命都是一个奇迹。但如今，奇迹再也无法继续。在见识了我们政府的执政方针后，他失望透顶，且严肃批评我们的错误。\n就如以前一样，詹姆斯·坎农宣布脱离我们的政府，并号召反对派一起离开。"
usa_communism.19.a: "托派分子有多远滚多远！"

usa_communism.20.t: "白劳德派系宣布脱离"
usa_communism.20.desc: "自从白劳德被处理后，白劳德派系的剩余成员便一直心怀不安。\n现在，这种不安渐渐蔓延开来，随着新政府冷落前白劳德派系的成员，他们最终选择自行脱离政府，以避免日后被处理。"
usa_communism.20.a: "会有人接替他们的工作！"

usa_communism.21.t: "执政危机"
usa_communism.21.desc: "虽然我们取得了领导权，但是党内分歧并没有改善，各个派系的矛盾依旧重重。\n如果想要让他们继续留在政府中效力，那么就必须提拔他们为政府顾问，以此安抚该派系。\n但如果我们迟迟没有动作，那么一场执政危机便不可避免，反对派可能会集体出走以此反抗。"
usa_communism.21.a: "天还能塌下来不成？"

usa_communism.22.t: "银衫军在德克萨斯州游行"
usa_communism.22.desc: "银衫军为了反抗我们的政策，公然在德克萨斯举行了大规模游行示威\n数千名银衫军分子在大街上游行，严重扰乱当地治安。当地警察已经前往驱散人群，防止扩大事态。\n当晚，银衫军便公开宣称我们的政府正在违背宪法，而他们银衫军会将人民从暴政中解放。"
usa_communism.22.a: "该死的..."
