USA_focus130:"最后的民主灯塔"
USA_focus131:"大洋铁幕"
USA_focus132:"为国捐躯..."
USA_focus133:"直至最后一刻..."
USA_focus130_desc:"当全世界都臣服于暴政的阴影，我们必须成为那束刺破黑暗的光。让所有仍在抵抗的意志，无论多么微弱，都能看到希望的方向。这不仅是战略，更是我们存在的意义——向世界证明，自由，永不沉沦。"
USA_focus131_desc:"大洋将不再是屏障，而是我们的防线！我们将用钢铁与火焰，筑起一道任何敌人都无法逾越的死亡之墙。让他们的舰队在我们的铜墙铁壁前撞得粉碎，让大洋成为埋葬他们野心的铁幕坟墓。"
USA_focus132_desc:"征召每一个能拿起武器的人，动员最后一间工厂的生产线。自由的价值，需要用生命去衡量。我们已无暇计算代价，因为失败的代价将是整个文明。此刻，牺牲不是选择，而是荣耀。"
USA_focus133_desc:"没有投降，没有谈判。我们将战斗在滩头，战斗在街道，战斗在每一座山丘。即使首都化为废墟，我们的意志也绝不屈服。只要还有一个美国人在呼吸，自由的旗帜就不会落下。这，就是我们的最终誓言。"
USA_focus132_tt:"12支国土守备队将被紧急征召"
USA_dengta1:"最后的民主灯塔"
USA_dengta2:"最后的民主灯塔"
USA_dengta3:"最后的民主灯塔"
USA_dengta4:"最后的民主灯塔"
USA_dengta1_desc:"旧大陆的烽火已然熄灭，最后的民主之光，在新大陆的海岸线上摇曳。这不是我们选择的战争，却是我们必须赢得的决战。自由已无路可退，身后即是家园。在这里，我们将证明，一个自由民族的意志，比任何铁幕都更加坚不可摧。每一寸土地都将成为他们的坟墓，每一个公民都是最后的士兵。要么在自由中永生，要么在黑暗中一同湮灭。"
