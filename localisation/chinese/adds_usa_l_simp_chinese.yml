US_bond_can_desc:"我们的北方邻居拥有大量矿产资源。如果说英国是加拿大矿业发展的启蒙者，那我们就是其现代化、工业化的根本推动者。\n我们不仅提供了资本和技术，更重要的是创造了庞大市场。这种深刻而广泛的介入，让美国成为了加拿大矿业发展背后决定性的力量。"
