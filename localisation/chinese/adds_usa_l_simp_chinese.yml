USA_tank_out2:0"先进装甲科技研发"
USA_airforce_desc:0"\n\n\n\n\n£GFX_us_air_text\n\n\n\n\n\n\n军事空中力量的根本目标是赢得战争。用更具破坏性的武器进行战略轰炸，要么能够打破敌人抵抗的意志，要么能够使他们物理上无法做到抵抗这一点。"
USA_air_desc:0"\n\n\n\n\n£GFX_us_air_text\n\n\n\n\n\n\n军事空中力量的根本目标，是让地面部队占领并维持地面战线。其它一切都是辅助性的。"
USA_navy_desc:0"\n\n\n\n\n£GFX_us_navy_text\n\n\n\n\n\n\n美国海军由海军和海军陆战队两个独立的军种组成。海军可分为舰艇部队、舰队航空兵、海上勤务部队和岸基部队4个兵种，一般按照行政管理和作战指挥两个系统进行编组和行动。"

