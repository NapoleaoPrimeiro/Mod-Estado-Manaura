mtg_usa_civil_war_democrats.100.t:"共产党暴动"
mtg_usa_civil_war_democrats.100.desc:"最糟糕的事情发生了，五大湖地区发起了叛乱。他们指责我们是在缔造一个军政府，这是对美国宪法的公然违背与对美国人权的无情侵犯。五大湖地区的工人已经全副武装起来，当地官员无力抵抗，现在那里已经被美国共产党完全占领。"
mtg_usa_civil_war_democrats.100.a:"该死！"

mtg_usa_civil_war_democrats.101.t:"推进策略"
mtg_usa_civil_war_democrats.101.desc:"这场内战并非如我们所料般轻松。指挥部的决定开始决定一切。前线部队汇报，称敌军近日攻势已然衰竭。我们已经来到了决定命运的关头--是速战速决，一战定乾坤；还是稳扎稳打，逐步扩大优势，最终奠定胜局？"
mtg_usa_civil_war_democrats.101.a:"速战速决！"
mtg_usa_civil_war_democrats.101.b:"还是稳定吧。"

mtg_usa_civil_war_democrats.102.t:"夏威夷王国独立！"
mtg_usa_civil_war_democrats.102.desc:"随着美国内战的愈演愈烈，夏威夷复国组织看到了希望。他们趁着我们在檀香山防御空虚，煽动对我们当局不满的驻军起义，宣布夏威夷王国复国并且独立。\n更糟糕的是，日本已经开始接触夏威夷王国高层，并帮助他们建设以削弱我们的影响。我们目前无法出手，只能寄希望与内战快点结束。"
mtg_usa_civil_war_democrats.102.a:"他们这是在玩火。"
mtg_usa_civil_war_democrats.102.b:"属于我们的自由！（游玩夏威夷）"

haw_extra.1.t:"夏威夷的蔗糖交易"
haw_extra.1.desc:"夏威夷王国蔗糖局的部长刚刚接触我们，他们称可以与我方进行廉价蔗糖交易。夏威夷自从独立后，身处太平洋中心的他们便成为各方势力拉拢目标。如果能促成这次交易，我们在夏威夷的影响力想必会大大提高。"
haw_extra.1.a:"为什么不呢？"
haw_extra.1.b:"让这群土著自己玩去。"

haw_extra.2.t:"[From.GetNameDefCap]同意了蔗糖交易"
haw_extra.2.desc:"[From.GetNameDefCap]外贸部长刚刚来电，他们称与我方交易是一件荣幸且实惠的事情。我们双方都能从此次交易获利，这样的交易多多益善。他们已经同意了这次交易，并希望我方加大交易份额。"
haw_extra.2.a:"很好！"

haw_extra.3.t:"[From.GetNameDefCap]拒绝了蔗糖交易"
haw_extra.3.desc:"[From.GetNameDefCap]外贸部长刚刚来电，他们称介于国际局势，他们无法与我们达成合作。"
haw_extra.3.a:"混蛋！"

haw_extra.4.t:"日本的接触"
haw_extra.4.desc:"我们刚独立不久，日本方面就已经放出了会晤邀请。事实上，我们的独立大大削弱了美国在太平洋的影响力，这是日本十分愿意看到的。他们称愿意帮助我们进行工业化建设，并资助我们打造一支军队防备美国人卷土重来。\n但我们必须知道，日本人不会安有好心。他们对我们的每笔投资在未来都会有不可否认的代价。"
haw_extra.4.a:"只要能够帮助我们发展..."
haw_extra.4.b:"不可接受虎狼的礼物。"

haw_extra.5.t:"日本对我们的影响加深！"
haw_extra.5.desc:"我们接受日本的投资后，虽然确实发展了不少，但是近日，越来越多的官员反馈，我们的工业、经济越来越依赖日本。"
haw_extra.5.a:"这群家伙果然没安好心！"

haw_extra.6.t:"日本提议加大投资"
haw_extra.6.desc:"日本看到了我们的需求，他们提议加大对我们经济的投资。"
haw_extra.6.a:"为什么不接受呢？"
haw_extra.6.b:"这次还是算了..."

haw_extra.7.t:"首相的人选"
haw_extra.7.desc:"鉴于我国已经选择君主立宪，一位首相不可或缺。但问题在于，我们需要一个能让各方满意的首相。目前首相人选有三位，他们分别是日方人员松冈洋右，美国流亡派塞缪尔·怀尔德·金，以及华裔律师邝友良。我们需要权衡利弊，做出周全选择。"
haw_extra.7.a:"松岗洋右是最合适的人选。"
haw_extra.7.b:"我们需要美国流亡者的支持。"
haw_extra.7.c:"华裔首相能更好平衡三方势力。"

haw_extra.8.t:"我们的货币"
haw_extra.8.desc:"在我们的努力下，我国已经成功建立了一套脱离于美国的经济体系，因此，美元体系对我们来说已经不是那么重要。现在，我们该决定我们国家未来的货币体系：是继续沿用美元，还是采取日元来讨好日本，抑或是发行新货币让我们保留自主性？"
haw_extra.8.a:"沿用美元能让国家保持稳定。"
haw_extra.8.b:"采纳日元能让日本加大对我们的投资。"
haw_extra.8.c:"我们必须保证独立自主。"

haw_extra.9.t:"美国流亡者抵达"
haw_extra.9.desc:"随着美利坚军团政府的势如破竹，美利坚宪政国败下阵来\n但这并不是结束，不少前宪政国将领不愿让美国变成人间地狱，他们辗转来到我国，希望在此安定下来，并伺机反攻。虽然我们收留这些将领的行为无异于触了美国逆鳞，但是敌人的敌人就是朋友。在这种危急的情况下，任何有益的事情都是值得冒险的。"
haw_extra.9.a:"天佑夏威夷..."

haw_extra.10.t:"[From.GetNameDefCap]要求我方结束经济控制"
haw_extra.10.desc:"[From.GetNameDefCap]致电我方，他们要求我们结束长期以往的经济控制\n自从夏威夷独立以来，我们便对其经济领域进行了无所不在的渗透，这也为我们带来了数不清的好处。但随着夏威夷统一美国，他们便有了摆脱我们的底气\n如果我们放任他们，那么或许我们还有继续友好的可能。但如果我们坚持不退半步，一场战争便无法避免。"
haw_extra.10.a:"还是为长久考虑。"
haw_extra.10.b:"他们胆敢威胁我们？"

haw_extra.11.t:"[From.GetNameDefCap]接受了"
haw_extra.11.desc:"经过深思熟虑，[From.GetNameDefCap]最终决定允许我们经济独立\n所有日方把控的关键领域已经由我方人员全权接管，日本答应提供后续技术支持。"
haw_extra.11.a:"还算他们讲理"

haw_extra.12.t:"[From.GetNameDefCap]拒绝"
haw_extra.12.desc:"[From.GetNameDefCap]来电据理力争，他们声称[From.GetNameDefCap]在我们的复国之路上担任了不可或缺的角色，这理应得到补偿\n他们拒绝退让，并劝告我们不要进行一场没有胜算的战争。"
haw_extra.12.a:"自寻死路"

usa_news.15.t:"夏威夷王国试图摆脱日本经济控制"
usa_news.15.desc:"夏威夷王国，这个自再次独立以来便被日本多次关照的国家，在成功反攻北美大陆后选择与日方谈判，摆脱其经济控制\n谈判几天前便已经开始，目前双方剑拔弩张，局势一片紧张\n谈判结果尚未向外界公布，但夏威夷王国这一举动无疑让太平洋再次陷入战争的阴霾中。"
usa_news.15.a:"螳臂当车，不自量力。"
usa_news.15.b:"他们拥有无比的勇气。"

haw_extra.13.t:"[From.GetNameDefCap]提供武器"
haw_extra.13.desc:"[From.GetNameDefCap]大使刚刚联系我们，愿意提供武器来帮助我们建立一支军队。他们的武器已经装箱，只要我们同意，随时可以运到\n虽然这些武器确实是我们目前需要的，但日本并非出于好心，如果我们一直接受他们的提议，日本在我国的影响也会越来越大，渐渐左右我国外交局势。"
haw_extra.13.a:"这批武器可以帮我们巩固国防。"
haw_extra.13.b:"日本有这么好心？"

haw_extra.14.t:"[From.GetNameDefCap]操控我国经济！"
haw_extra.14.desc:"我们的财政部长刚刚发现[From.GetNameDefCap]竟然毫不知耻的操控我国经济，他们买通底层干部，利用金钱诱惑从我们的仓库带走了远超出贸易份额的货物\n虽然这次我们发现的及时，但是日本已经携带货物离开，并且矢口否认他们的恶行。"
haw_extra.14.a:"这群不要脸的家伙！"

haw_extra.15.t:"[From.GetNameDefCap]提供技术支持"
haw_extra.15.desc:"[From.GetNameDefCap]大使刚刚联系我们，愿意提供技术支持帮助我们进行科技研究。自从美国离开，我们的科学技术研究早已陷入停滞\n日本的支援虽然能够帮助我们暂时缓解这一情况，但是这并非无价。我们的科技不能依赖日本支援。"
haw_extra.15.a:"仅此一次。"
haw_extra.15.b:"一次也不行！"

haw_extra.16.t:"[From.GetNameDefCap]要求臣服"
haw_extra.16.desc:"[From.GetNameDefCap]大使刚刚联系我们，几十年前夏威夷就与美国展开了亲密无间的合作，并巩固了强大不可捍卫的关系\n虽然前段时间美国内战让夏威夷脱离了合众国，但美国对此尊重理解，现在合众国再次统一，夏威夷也该再次加入合众国\n美国承诺我们高度的自治权，但如果我们拒绝，美国宣称“将用我们无法拒绝的方式”强迫我们回归"
haw_extra.16.a:"我们无法抵抗美国"
haw_extra.16.b:"1898绝不重演！"

haw_extra.17.t:"[From.GetNameDefCap]同意"
haw_extra.17.desc:"[From.GetNameDefCap]刚刚回复，他们同意再次以自治州的形式加入我们。"
haw_extra.17.a:"算他们识相"

haw_extra.18.t:"[From.GetNameDefCap]拒绝"
haw_extra.18.desc:"[From.GetNameDefCap]刚刚义正言辞地拒绝了我们的要求。他们指出美国在1898年强占夏威夷，这是对夏威夷的赤裸裸的侵略。夏威夷从未对此展开清算。如今他们赢得了自由，我们不该抱有再次吞并夏威夷的妄想。"
haw_extra.18.a:"自寻死路"
