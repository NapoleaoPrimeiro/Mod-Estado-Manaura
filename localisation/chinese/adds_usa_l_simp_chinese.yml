eco_touzi:"投资国内企业"

usa.506.t:"对国内军工设计商的投资"
usa.506.desc:"随着世界战火将至，我们不得不与国内军火巨头们合作，让他们生产更多武器以武装我们的部队。同时，政府也通过了一系列利好国内企业的法案，并将于近日选择一类最为紧要的军火企业进行投资。\n现在，专门成立的委员会已经将资金准备完毕。并将于近日发放投资基金。那么，我们该投资哪一类企业呢？"
usa.506.a:"很明显，我们该注资装甲生产商。"
usa.506.b:"舰船企业一直与我们有良好的合作关系。"
usa.506.c:"飞行器产业应该更受关注。"
usa.506.d:"没有足够的枪支弹药，一切都是空谈。"

USA_jiaerwen_organization:"加尔文制造公司"
USA_fmc_company_organization:"食品机械化学公司"
USA_lima_company_organization:"美国利马机车厂"
USA_armored_car_mot_design_company:"装甲运兵车设计商"

USA_meishi_shehuizhuyi_tt:0"§Y美式社会主义§!追加效果:\n"

usa_union.1.t:"女性平权？"
usa_union.1.desc:"随着我们的政府对人民进行共产主义教育，越来越多的进步女性对我们的政府发起了疑问：既然共产主义想要解放人类，那么在那之前是否能先解放女性？\n她们称女性也该拥有男性享有的一系列特权与义务，革命女性不怕吃苦，但求公平--我们该如何回应这个问题？"
usa_union.1.a:"她们说得对：妇女能顶半边天！"
usa_union.1.b:"我看现在还不是谈这个的时候..."

usa_union.2.t:"推广全民医保？"
usa_union.2.desc:"曾经的资产阶级政府对我们的人民进行了残酷的剥削与压榨，导致许多平民虽然身患恶疾，却因无法支付天价医疗费用而悲惨的死在不知名角落。现在，作为崭新的政府，我们是否该推广一个为广大贫民服务的、利好人民大众的医疗保障服务？这可能为我们的财政带来严重负担，但从长远看，这项举措能显著巩固我们的民心，并让人民从此摆脱医疗难题。"
usa_union.2.a:"如果不这样做，我们与资产阶级何异？"
usa_union.2.b:"现在的经济状况不支持我们这样做..."

usa_union.3.t:"扩大工会权力？"
usa_union.3.desc:"作为一个强调工人福利的国家，扩大工会权力或许能显著激发工人们的生产积极性。但这也会为我们带来负面影响：工会权力过大，可能会让未来我们的政策执行起来有更大的难度。那么，我们是否该让权给工会，还是保持现状？"
usa_union.3.a:"工人总是第一位的。"
usa_union.3.b:"还是为未来多考虑。"

USA_renmindahui_desc:"起来  饥寒交迫的奴隶  起来  全世界受苦的人\n\n满腔的热血已经沸腾  要为真理而斗争\n\n旧世界打个落花流水  奴隶们起来  起来\n\n不要说我们一无所有  我们要做天下的主人" 
USA_zhanzhengxuanchuan_desc:"沉睡的巨人睁开了双眼，他翻身站起，活动着足以撼动世界的筋骨。他的呼吸是熔炉的风吼，他的脉搏是生产线的轰鸣。他将对旧世界的暴政，挥出凝聚了整个新世界工业、技术与意志的钢铁重拳。" 
USA_gonggonggongcheng_desc:"在这个国家最深沉的暗夜中，我们并未选择屈服于绝望。通过电台中那沉稳而充满希望的声音，一项史无前例的‘新政’如春风般吹遍了这片土地。联邦政府以前所未有的力度干预经济，为数百万失业者提供工作岗位——修建水坝、铺设公路、植树造林。虽然最高法院的保守派法官们对此百般阻挠，质疑其合法性，但这项大胆的社会实验已然重燃了美利坚的精神。它稳定了摇摇欲坠的金融体系，为工业注入了微弱的活力，并在人民心中重新播下了‘希望’的种子。尽管前路依然布满荆棘，但复苏的进程已经艰难地开始了。"
