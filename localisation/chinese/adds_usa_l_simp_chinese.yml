usa_news.9.t:"共产党在美国夺权"
usa_news.9.desc:"在经历了长期的政治和经济改革之后，美国政府的大部分官员已经承认共产党是政府中的唯一政党，他们被要求辞职或者立即加入共产党。\n\n与此同时，来自许多大型国有工厂的武装的工人很快占领了全国各地具有战略价值的地点。听令于白宫的军队在军营中按兵不动并拒绝干预。\n\n到傍晚的时候，共产主义已经取得成功，新的政府牢牢确保了权力。"
usa_news.9.a:"激进派夺权了。"
usa_news.9.b:"大革命终于落幕了。"
usa_news.9.c:"他们以一种最坏的选择规避了法西斯主义。"
usa_news.9.d:"革命胜利了！"
usa_news.9.e:"又多了个威胁。"

usa_news.10.t:"新罗马的召唤"
usa_news.10.desc:"当旧世界的秩序在民族主义的喧嚣和停滞的官僚主义中步履蹒跚时，一股强大而沉默的力量正在重塑全球经济的版图。资本，这一世界上最敏锐、最无情的逐利者，正以其最朴素的逻辑做出选择：跨越重洋，涌入由“企业理事会”所治理的美利坚企业国——这个被投资者们称为“新罗马”的应许之地。\n\n历史的车轮正在转动。当旧世界在意识形态的枷锁中挣扎时，新罗马的灯塔已经点亮。全球资本用脚投票的洪流，或许正在宣告一个由效率、资本与强权定义的崭新时代的来临。"
usa_news.10.a:"该死！美国佬果然靠不住。"
usa_news.10.b:"一个世界强权的崛起。"
usa_news.10.c:"Fall to my name！"

usa_news.11.t:"军团国启动“共荣经济圈”"
usa_news.11.desc:"近日，美利坚军团国宣布正式启动“共荣经济圈”计划。此历史性举措旨在终结世界数个世纪以来的经济低效与资源浪费，将一个分裂的大陆锻造为一个统一、强大且目标一致的单一经济战场。\n\n此乃迈向在军团国领导下，繁荣、有序且不可战胜的世界新秩序的决定性一步。任何阻碍此伟大进程的个人或实体，都将被视为大陆公敌并被无情碾碎。"
usa_news.11.a:"荣耀归于军团！"
usa_news.11.b:"一个世界强权的崛起。"
usa_news.11.c:"Fall to my name！"

usa.999.t:"北大西洋公约组织"
usa.999.desc:"随着迫在眉睫的全球威胁得到解决，[SOV.GetNameDef]与其西方盟国之间的松散盟约开始瓦解。\n\n为了遏制共产主义在欧洲的传播，白宫已致电我方，提出了一项军事性合作组织。"
usa.999.a:"必须遏制来自东方的威胁。"
usa.999.b:"我们不需要另一场战争……"

usa.1000.t:"[From.GetNameDefCap]同意加入北约"
usa.1000.desc:"[From.GetAdjective]政府对我方此前的照会作出回应，保证其政府将为我们共同的未来努力。我们驻[From.GetNameDef]的大使现已被晋升为特别代表，全权负责确保[From.GetAdjective]与白宫的通讯。"
usa.1000.a:"非常好！"

usa.1001.t:"[From.GetNameDefCap]拒绝"
usa.1001.desc:"我们此前发送给[From.GetNameDef]的外交照会现在被披露给了媒体，造成了舆论的一片哗然。如今，甚至是国际新闻都刊载了令人不快的社论，将我们合理的诉求抹黑为“扰乱世界局势”，“危险的先例”甚至是“赤裸裸的帝国主义行径”。\n\n更不用说，[From.GetAdjective]政府也拒绝就此事展开进一步讨论，还警告称若是胆敢再提此事，便即刻中止双方的外交往来。"
usa.1001.a:"我们无可奈何"

usa.331.t:"美国想要团结北美"
usa.331.desc:"[From.GetLeader]日前送来了信函，他们认为共产主义是人类最美好的前途。[From.GetNameDef]已完成了向共产主义国家的转变，并邀请我们与他们一道。但如果我们拒绝，他们届时将采取“他们所认为必要的措施”。"
usa.331.a:"我们别无选择。"
usa.331.b:"让这群赤色暴徒一边凉着去"

usa.332.t:"[From.GetNameDefCap]认可共产主义"
usa.332.desc:"[From.GetAdjective]政府对我方此前的照会作出回应，保证其政府将向共产主义迈向一大步。我们驻[From.GetNameDef]的大使现已被晋升为特别代表，全权负责确保[From.GetAdjective]的共产主义改造。"
usa.332.a:"非常好！我们一道向共产主义前进！"

usa.333.t:"[From.GetNameDefCap]反对我方提议"
usa.333.desc:"我们此前发送给[From.GetNameDef]的外交照会现在被披露给了媒体，造成了舆论的一片哗然。如今，甚至是国际新闻都刊载了令人不快的社论，将我们合理的诉求抹黑为“插手他国内政”，“危险的先例”甚至是“赤裸裸的帝国主义行径”。\n\n更不用说，[From.GetAdjective]政府也拒绝就此事展开进一步讨论，还警告称若是胆敢再提此事，便即刻中止双方的外交往来。"
usa.333.a:"必须给他们带来解放！"

usa.701.t:"美国军火商的建议"
usa.701.desc:"来自美国的军火商日前提出，基于世界日益紧张的局势，他们愿意与我国进行一笔物超所值的军火买卖，来确保我国在日后不会因军备松弛而受到威胁。"
usa.701.a:"他们言之有理。"
usa.701.b:"我们显然需要更多军火。"
usa.701.c:"我们的内政不需要美国佬指点。"

usa.702.t:"[From.GetNameDefCap]同意"
usa.702.desc:"[From.GetAdjective]政府对于我们提出的军火贸易持怀疑态度，但是仍然愿意先与我们进行一次试探性交易。"
usa.702.a:"为什么不呢？"

usa.703.t:"[From.GetNameDefCap]想要加大贸易份额"
usa.703.desc:"[From.GetAdjective]政府对于我们提出的军火贸易表示十分欢迎。他们想要更多军备来确保国家的安全。"
usa.703.a:"很好！"

usa.704.t:"[From.GetNameDefCap]拒绝交易"
usa.704.desc:"[From.GetAdjective]政府对于我们提出的军火贸易表示不耐烦。他们认为自己有充足的军备来面对战争。"
usa.704.a:"让他们自生自灭吧。"

usa.711.t:"美国想要投资我国"
usa.711.desc:"来自美国的商人们带来了厚厚的项目建议书和一份诚意十足的信誉证明。\n\n他们直言不讳地表示，他们看到了在我国政府治理下所展现出的“非凡效率”与“稳定的商业环境”。他们有意绕过传统民族国家的繁琐程序，直接对我们投资。"
usa.711.a:"我们的人民需要更多福利。"
usa.711.b:"我们显然需要更多军火。"
usa.711.c:"我们不需要美国佬帮忙。"

usa.712.t:"[From.GetNameDefCap]同意"
usa.712.desc:"[From.GetAdjective]政府对于我们提出的投资十分感兴趣。他们想要我们投资民用工厂。"
usa.712.a:"交给山姆大叔。"

usa.713.t:"[From.GetNameDefCap]同意"
usa.713.desc:"[From.GetAdjective]政府对于我们提出的投资十分感兴趣。他们想要我们投资军用工厂。"
usa.713.a:"交给山姆大叔。"

usa.714.t:"[From.GetNameDefCap]拒绝交易"
usa.714.desc:"[From.GetAdjective]政府对于我们提出的投资表示不感兴趣。他们甚至认为我们是在进行商业间谍行为。"
usa.714.a:"他们怎敢如此无礼？"

usa.721.t:"审计部门的发现"
usa.721.desc:"近日，审计部门在核查“市场开拓部”的特别行动资金时，发现了一个巨大的、无法解释的缺口。初步调查指向部门的负责人，他似乎是挪用巨额资金，用于在海外建立完全由其个人控制的秘密账户和影子公司。\n\n这些资金本应用于支持与我们结盟的海外政权，但现在，他可能正在用我们的钱，构建一个属于他自己的、能够随时脱离理事会独立运作的商业王国。这不仅是贪污，更是叛变。"
usa.721.a:"叛徒必须清除！"

usa.722.t:"内部调查科的发现"
usa.722.desc:"根据“内部调查科”为期数月的秘密行动，我们已完成本季度的财务审计。结果令人震惊，但也证实了之前的某些流言。\n\n我们的高官中确实存在大量贪腐行为，他们构成了一张大网，通过设立虚假的次级承包商、虚报原材料成本、以及直接出售军方报废的装备，在过去几个月中侵吞了数额惊人的资产。"
usa.722.a:"清除他们..并将财产充公。"

usa.723.t:"外国商人的投资"
usa.723.desc:"一个外国财团代表团，带来了厚厚的项目建议书和一份诚意十足的信誉证明。\n\n他们直言不讳地表示，他们看到了在“企业理事会”治理下所展现出的“非凡效率”与“稳定的商业环境”。他们有意绕过传统民族国家的繁琐程序，直接与我们合作，在五大湖区投资兴建一座全新的、采用欧洲最新技术的精密仪器工厂。\n\n当然，这笔交易附带着条件。他们要求获得为期五年的税收豁免、对工厂管理的完全自主权、以及使用他们自己的安保人员。作为回报，他们承诺将一半的产出以内部价格供应给理事会，并支付一笔可观的“市场准入费”。\n\n这是一笔巨大的投资，但也可能是一匹潜入我们花园的特洛伊木马。"
usa.723.a:"这种投资多多益善。"

usa.724.t:"外国军火商的提议"
usa.724.desc:"一个外国财团代表团，带来了厚厚的项目建议书和一份诚意十足的信誉证明。\n\n他们没有浪费时间在寒暄上。直言他们欣赏理事会“务实”的商业环境和强大的工业基础。他们提出的方案是：在我们的领土上投资建立一座先进的“光学仪器与通讯设备”工厂，而实际上，该工厂将专门生产他设计的、极具创新性的狙击镜和加密电台。\n\n他们的条件是绝对的商业机密和工厂的治外法权。作为回报，他们不仅会支付巨额费用，更会将产量的30%优先、并以“成本价”供应给我们的安保部队与远征军。他们还暗示，他们拥有的“特殊渠道”可以为我们打开一些……传统外交无法触及的市场。\n\n这是一个提升我们部队装备质量和获取灰色收入的绝佳机会，但我们也可能因此引入一个不受控制的危险因素。"
usa.724.a:"欢迎！我们需要他的技术和渠道。"

usa.725.t:"企业内斗恶化"
usa.725.desc:"为了争夺联邦（残余政府）的最后一个大型装甲订单，两个大型企业都将报价压到了成本线以下。\n\n这看似是商业行为，但后果是灾难性的：双方的利润急剧缩水，用于研发新武器的资金枯竭，工厂因为无利可图而放缓了生产。更糟糕的是，他们开始在议会里互相诋毁、揭短，严重破坏了理事会的团结形象。我们正在用自己的手，扼杀自己的利润源泉。"
usa.725.a:"强制执行‘统一定价’协议。"
usa.725.b:"让他们斗，优胜劣汰。"
usa.725.c:"劝说他们和解。"

usa.801.t:"尘埃落定"
usa.801.desc:"骚动已经平息。\n\n那些在幕后窃窃私语、以为金钱可以收买爱国精神的人，如今已尝到了失败的滋味。他们的报纸沉默了，他们的电台现在播放着庄严的进行曲，他们那些可鄙的、试图在军队与国家之间挑拨离间的阴谋，已被忠诚的士兵们彻底粉碎。\n\n这个国家曾站在悬崖边上，被无能的政客和贪婪的财阀引向混乱的深渊。是我，响应了职责更深层次的召唤，肩负起这不受欢迎却至关重要的重任。我从不怀疑胜利属于我们，因为我们的旗帜由信念织就，而他们的，只是浸满了铜臭。\n\n今天，我们不仅赢得了一场权力斗争，更为美利坚开启了一个新的纪元——一个建立在秩序、责任与民族复兴基础上的纪元。暂时的紧急状态必须继续，直到我们根除所有腐蚀我们肌体的毒素。\n\n道路已经扫清。现在，工作才真正开始。"
usa.801.a:"老兵团永不死，他们只是悄然消逝……而新的军团已然崛起。"

usa.802.t:"费城枪击案"
usa.802.desc:"一场在费城独立宫前举行的胜利日阅兵，本应是军政府力量与团结的展示。然而，在演讲达到高潮时，枪声撕裂了空气。\n\n不是精心策划的狙击，而是一场丑陋、混乱的近距离交火。一名或多名身份不明的刺客使用走私的冲锋枪，向观礼台倾泻了弹雨。总统——我们的最高统帅——在忠诚的警卫用身体组成的盾牌下生死不明，但包括宾夕法尼亚州军政府总督、陆军参谋长助理在内的多名高级官员当场身亡。护卫队和刺客在惊慌的人群中爆发了激烈的枪战，造成了大量平民伤亡。\n\n官方的广播在短暂的沉默后，开始以沉痛而愤怒的语调播报这一“针对合众国的懦夫式袭击”。然而，在官方叙事之外，流言正像野火一样蔓延。有人说这是未被清算的财团残余势力的报复；也有人低语，这是军队内部不同派系针对日益独裁的麦克阿瑟总统的一次未成功的清洗。\n\n无论真相如何，费城的枪声已经响彻全国。它暴露了军政府统治下深刻的裂痕，并预示着，表面的平静已被彻底打破。"
usa.802.a:"天哪..."

usa.803.t:"临时委员会"
usa.803.desc:"一则来自华盛顿的紧急广播中断了所有频率。伴随着低沉的哀乐，一个沉重的声音宣布：总统[ROOT.GetLeader]，美利坚军国的最高统帅，因枪击案影响，已于今日凌晨在医院不治身亡。官方公告将其誉为“国家的拯救者”，并宣布进行为期三十天的全国哀悼。\n\n然而，哀悼的帷幕尚未落下，权力的重组已悄然完成。就在元帅逝世的数小时内，一个此前一直隐藏在军政府阴影中的“临时治理委员会”迅速接管了所有国家权力。令人瞩目的是，这个委员会的核心成员并非现役将军，而是那些曾在麦克阿瑟崛起初期时与之合作的工业与金融巨头的代表。\n\n他们宣称，为了“确保国家的稳定与经济的延续”，军政府的紧急状态将继续维持，但方向将进行“必要的调整”。军队被命令返回军营，保证对委员会的忠诚。没有流血，没有枪声，只有一系列冷静的电话和签署好的文件。\n\n元帅的钢铁军团曾吞噬了这个国家的自由，而如今，铸造了这支军团的人们，从幕后走了出来，安静地拾起了掉落在宝座旁的缰绳。[ROOT.GetLeader]的时代结束了，一个更加冷酷、高效且无处不在的资本时代，正式来临。"
usa.803.a:"天佑美利坚..."
