US_hollywood_films:"引领国际电影潮流"
US_hollywood_films_desc:"1930年代，进入好莱坞大片厂的黄金时期，八大制片厂几乎垄断了整个电影业。制片人一手遮天，电影明星们风光无两，声音的引入让电影的呈现有了更多可能。\n在那个年代，电影就是制造白日梦的工具，电影院就是现实中的乌托邦。而§R好莱坞是我们这个星球最大的梦工厂§!。\n\n\n\n\n\n£GFX_us_hollywood_films\n\n\n\n\n\n\n"
US_USA_xidian_junxiao_desc:"个人要服从集体或更大的整体，服从部队，服从一个团队。\n\n纪律和军容是我们比其他学校甚至部队要求更严格的地方。\n\n最重要的是，在关键的时候能够坚持原则。\n\n恪尽职守的精神比个人的声望更重要。"
USA_new_deal_desc:"在这个国家最深沉的暗夜中，我们并未选择屈服于绝望。通过电台中那沉稳而充满希望的声音，一项史无前例的‘新政’如春风般吹遍了这片土地。联邦政府以前所未有的力度干预经济，为数百万失业者提供工作岗位——修建水坝、铺设公路、植树造林。虽然最高法院的保守派法官们对此百般阻挠，质疑其合法性，但这项大胆的社会实验已然重燃了美利坚的精神。它稳定了摇摇欲坠的金融体系，为工业注入了微弱的活力，并在人民心中重新播下了‘希望’的种子。尽管前路依然布满荆棘，但复苏的进程已经艰难地开始了。"

USA_army_desc:0"\n\n\n\n\n£GFX_us_army_text\n\n\n\n\n\n\n大萧条与孤立主义的双重枷锁下，这支陆军仍深陷一战后的迟滞。规模有限、装备陈旧、机械化与装甲化严重滞后，战术思维停留在堑壕战时代，动员与部署效率低下。但它坐拥世界第一工业潜力，一旦挣脱束缚，将爆发出碾压性的战争机器潜能。"
