 CREATE_CORE1_TOOLTIP:0 "§HNationaliser l'État§!\n\nCoût actuel : §H[This.GetCBCoringCurrentCost]§! £pol_power\n\nLe coût dépend de la population et du nombre d'usines de l'État et diminue avec l'accommodement.[This.GetCBFullComplianceBonus][This.GetCBCoringRestriction][This.GetCBCoringFundsRestriction]"
