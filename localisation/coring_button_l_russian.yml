 CREATE_CORE2_TOOLTIP:0 "§HСделать регион национальным§!\n\nСтоимость действия:\n§H10§!£pol_power если население региона меньше 50 тыс.\n §H>§! §H15§!£pol_power если население региона составляет от 50 тыс. до 100 тыс.\n§H25§!£pol_power если население региона составляет от 100 тыс. до 250 тыс.\n§H50§!£pol_power если население региона составляет от 250 тыс. до 500 тыс.\n§H75§!£pol_power если население региона составляет от 500 тыс. до 1 млн\n§H100§!£pol_power если население региона составляет от 1 млн до 5 млн\n§H150§!£pol_power если население региона составляет от 5 млн до 10 млн\n§H250§!£pol_power если население региона превышает 10 млн\n\n"
