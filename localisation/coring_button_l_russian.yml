 CREATE_CORE1_TOOLTIP:0 "§HСделать регион национальным§!\n\nТекущая стоимость: §H[This.GetCBCoringCurrentCost]§! £pol_power\n\nСтоимость зависит от населения региона и количества фабрик и снижается благодаря подчинению.[This.GetCBFullComplianceBonus][This.GetCBCoringRestriction][This.GetCBCoringFundsRestriction]"
