 reinstate_wilhelm_iv_succession_rights:0 "Reinstate Prince Wilhelm's Right of Succession"
 reinstate_wilhelm_iv_succession_rights_desc:1 "Kaiser Wilhelm III's son was forced to renounce his right of succession by desiring to marry against the approval of the then-head-of-family Wilhelm II. As Wilhelm III has now taken over that role, he might be able to pressure his exiled father in supporting a reversal of this decision."
 reinstate_wilhelm_iv_succession_rights_tt:0 "The line of succession is altered.\n"
 modernize_the_succession_laws:0 "Modernize the Succession Laws"
 modernize_the_succession_laws_desc:0 "The current Kaiser's son, the to-be Wilhelm IV, only has two daughters as heirs. We must secure the line of succession, and so the succession laws must be modernized to allow Princess Felicitas to reign, when the time comes."
 modernize_the_succession_laws_tt:0 "Women may inherit the throne.\n"
 request_restoration_of_british_titles:0 "Request Restoration of British Titles"
 request_restoration_of_british_titles_desc:0 "In 1917 the British parliament voted to revoke all British peerages and royal titles from German Royal and Princely families. Now that we are allies, and are enjoying excellent relations, perhaps it is time to request the reversal of this decision."
 hindenburg_destroyed_tt:0 "The Hindenburg is §YNOT§! destroyed.\n"
 request_restoration_of_british_titles_tt:0 "This will undoubtedly lead to unparalleled rewards...\n"
 GER_request_polish_war_participation:0 "Demand Polish War Participation"
 GER_request_polish_war_participation_desc:0 "As we are at war with the [SOV.GetName], we require passing our armies through [POL.GetAdjective] territory. As we have vowed to protect them, it is only natural that they should join our war."
 GER_reform_austro_hungarian_empire:1 "Re-form the Austro-Hungarian Empire"
 GER_reform_austro_hungarian_empire_tt:0 "Request for other Austro-Hungarian successor states to re-form the Empire.\n§RIf they accept, you will inherit all wars they are involved in!§!\n"
 GER_reformed_austro_hungarian_empire:0 "Re-formed the Austro-Hungarian Empire"
 GER_barbarossa_mission:0 "Führer Directive 21"
 emergency_factory_conversion_defensive:0 "Emergency Factory Conversion"
 emergency_factory_conversion_defensive_desc:0 "More equipment is desperately needed on the front. We urgently need to convert more factories to produce arms and vehicles to defend our country."
 emergency_factory_conversion_offensive:0 "Emergency Factory Conversion"
 emergency_factory_conversion_offensive_desc:0 "The our troops urgently need more equipment. More factories are needed to produce the equipment required to win the war."
 demolish_enemy_fortifications:0 "Demolish Enemy Fortifications"
 dismantle_maginot:0 "Dismantle Maginot"
 propaganda_efforts:0 "Propaganda Efforts"
 war_propaganda:0 "War Propaganda"
 war_propaganda_desc:0 "As the world burns around us, our people are woefully unprepared for war. We must rally their support to take up arms for our nation."
 desperate_defense:0 "Desperate Defense"
 desperate_defense_desc:0 "We can't fall back any further. Our soldiers have to dig in and hold the line."
 war_bonds:0 "War Bonds"
 war_bonds_desc:0 "We need more resources for our war economy, and war bonds are just the way to obtain these."
GER_aid_hun_rom_democratic_civil_war:0 "Fledgling Democracies"
 GER_aid_hun_democratic_civil_war:0 "Intervene in the Hungarian Civil War"
 GER_aid_rom_democratic_civil_war:0 "Intervene in the Romanian Civil War"
 GER_austro_hungarian_empire:0 "Austria-Hungary"
 GER_mefo_bills_category:0 "MEFO Bills"
 GER_mefo_bills_category_desc:0 "In order to fund our growing military industry, and to keep this secret from British and French eyes, we have been forced to use a balance sheet entity to route payments to in the form of promissory notes. If we do not use our political connections to extend the due dates of these notes, we will be forced to repay them and will no longer receive their benefits."
 GER_mefo_bills_mission:0 "MEFO Bills Due"
 GER_can_delay_mefo_payment:0 "Can delay MEFO Bills payment."
 GER_mefo_bills_mission_desc:0 "Our issued bills are soon falling due. We must decide whether to extend them or begin payments."
 GER_extend_mefo_bills:0 "MEFO Bills"
 GER_extend_mefo_bills_desc:0 "Extend the MEFO Bills due date by another 3 months, allowing us to continue to enjoy their benefits for the duration. It will, however, also increase the cost of our eventual payments."
 GER_extend_mefo_bills_tt:1 "Decide whether to extend '§YMEFO Bills§!' or begin payments.\n"
 GER_mefo_bills_mission_tt:1 "Issue a six-month extension of '§YMEFO Bills§!', to go into effect upon the due date of the current batch of MEFO bills.\n\nThe cost of each extension will progressively increase, until war breaks out, at which point reliance on MEFO bills is removed and payment is delayed until after the war's conclusion.\n\n"
 GER_mefo_bills_effect_in_days:1 "The following will happen in [?Root.days_mission_timeout@GER_mefo_bills_mission|H0] days:\n"
 GER_mefo_bills_extension_timer:0 "Before MEFO Bills due date."
 GER_mefo_bills_extension:0 "Less than 60 days since MEFO Bills were extended."
 GER_mefo_bills_extended:0 "Extended MEFO Bills"
 GER_renew_mefos:0 "Renew MEFO Bills"
 GER_renew_mefos_desc:0 "The Reichsbank is crucial in rebuilding and rearming our nation. It's clear we made an error in our decision to pay off our debts, and we should extend the MEFO Bills for another few months."
 GER_cancel_mefos:0 "Cancel MEFO Bills"
 GER_cancel_mefos_desc:0 "We have relied on the Reichsbank for the reconstruction of our arms industry for too long. It is time we made good our promissory arrangement with our arms manufacturers and end this "MEFO Bill" charade."
 GER_case_anton_category:0 "Case Anton"
 GER_case_anton_category_desc:0 "The intent behind the creation of Vichy France was always to keep the French colonies and the French fleet out of the hands of the allies. However, it is an agreement we may choose to rescind at any time. We have a plan drawn up to forcibly integrate the area, as well as making a lightning push for the French fleet's base at Toulon."
 GER_case_anton:1 "Execute Case Anton"
 GER_case_anton_tt2:2 "Does not control the majority of French states in North Africa."
 GER_case_anton_desc:0 "Our puppet state in France has outlived its usefulness. We will begin integration into the [Root.GetName] immediately, and, if we move sufficiently swiftly, we may even be able to commandeer the remnants of the French fleet."
 GER_case_anton_tt:0 "Annexes Vichy France in 7 days and seizes the French fleet.\n\n§RFrance will be able to scuttle their fleet unless German troops are in Toulon within 2 days!§!\n"
 GER_case_red:0 "Fall Rot"
 GER_operation_marita:0 "Unternehmen Marita"
 GER_sharpen_air_safety_regulations:0 "Sharpen Air Safety Regulations"
 GER_sharpen_air_safety_regulations_desc:0 "With more rigid safety regulations in place, we can prevent some of the more common causes for catastrophic accidents, including those with airships."
