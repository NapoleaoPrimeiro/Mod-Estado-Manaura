 GER_adolf_hitler_desc:0 "Adolf "Führer" Hitler Reichskanzler of Germany, President of the NSDAP Reichspräsident Führer und Reichskanzler , Oberbefehlshaber.\nHe called on the members of the Reichstag to vote for the Enabling Act on 24 March 1933. Hitler was given "temporarily" general authorisation by the Act. It gave him the freedom to act without parliamentary authorisation and even without constitutional limitations.\nUsing his characteristic mixture of negotiation and intimidation, Hitler offered the possibility of friendly co-operation and promised not to threaten the Reichstag, the president, the states or the churches if emergency powers were granted.\nThe law allowed Hitler and his Cabinet to rule by emergency decree for four years, but Hindenburg remained president. Hitler immediately began to eliminate the powers of the states and the existence of non-Nazi political parties and organisations. Non-Nazi parties were officially banned on 14 July 1933 and the Reichstag was stripped of its democratic responsibilities. Hindenburg remained commander-in-chief of the army and retained the power to negotiate foreign treaties.\nThe law did not infringe on the powers of the president, and Hitler did not achieve full dictatorial power until Hindenburg's death in August 1934. Only Hitler as head of state could remove himself as head of government. All soldiers took the Hitler Oath on the day of Hindenburg's death, swearing "unconditional obedience" to Hitler personally and not to the office or the nation. Henceforth, the time of the great Führer of Germany had begun, and now it was his turn to rule Europe."
