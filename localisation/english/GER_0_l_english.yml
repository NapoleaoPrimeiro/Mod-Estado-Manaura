GER_pax_habsburgica_category:0 "Pax Habsburgica"
GER_pax_habsburgica_category_desc:0 "After years of chaos, division, and ideological struggle, a new order rises under the banner of the Habsburgs. Otto von Habsburg seeks not conquest for its own sake, but the restoration of peace and stability through Imperial unity. From the remnants of old crowns to the disputed lands of Central Europe, the Habsburg legacy calls once more — to forge a realm where faith, tradition, and diplomacy bring lasting harmony to the heart of the continent."
