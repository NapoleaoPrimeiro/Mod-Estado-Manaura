  HRE_four_year_plan:0 "Four Year Plan"
  HRE_four_year_plan_desc:0 "The plan aims to rapidly develop the economy through state control, investment and incentives. Public works programs will reduce unemployment, while new factories and infrastructure."
  HRE_focus_on_industrialization:0 "Focus On Industrialization"
  HRE_focus_on_industrialization_desc:0 "Capacity expansion is at the heart of the Four Year Plan. The state will invest heavily in the construction of new factories and modernization of existing facilities."
  HRE_heavy_industry:0 "Heavy Industry"
  HRE_heavy_industry_desc:0 "Heavy industry is a source of national pride. These gigantic plants drive Germany's development and shape not only the national economy but also the geopolitical landscape."
  HRE_develop_rural_areas:0 "Develop Rural Areas"
  HRE_develop_rural_areas_desc:0 "Germany's prosperity depends not only on the development of its cities, but also of its rural regions. The development of these regions through the creation of new jobs will contribute to strengthening the national economy and raising overall living standards."
  HRE_civilian_industry5:0 "Increase Hiring in Factories"
  HRE_civilian_industry5_desc:0 "Increasing employment in factories will not only reduce unemployment, but also stimulate domestic demand and consumption. This will contribute to overall economic development and consolidate Germany's leading position in Europe."
  HRE_civilian_industry6:0 "Civil Industry"
  HRE_civilian_industry6_desc:0 "The development of civilian industry also encourages investment in innovation and technology. This leads to the development of new products and production methods and increases Germany's contribution to the global economy."
  HRE_focus_on_key_industries:0 "Focus on Key Industries"
  HRE_focus_on_key_industries_desc:0 "It will enable Germany to stay ahead of international competition and play a more important role in the global economy. This will enable the country to create more jobs, raise living standards and move towards a more stable future."
  HRE_focus_on_infrastructure:0 "Focus on Infrastructure"
  HRE_focus_on_infrastructure_desc:0 "Investing in infrastructure is vital for Germany's development and prosperity. Modern and efficient infrastructure stimulates economic growth, creates jobs and raises living standards."
  HRE_distribution_industry:0 "Distribution Industry"
  HRE_distribution_industry_desc:0 "It is a part of the German economy that cannot be ignored. It plays a critical role in the functioning of the supply chain, ensuring that manufactured goods reach consumers."
  HRE_infrastructure_effort:0 "Infrastructure Effort"
  HRE_infrastructure_effort_desc:0 "Investing in infrastructure is critical to Germany's prosperity and future. Modern and efficient infrastructure stimulates economic growth, creates jobs and raises living standards."
  HRE_expand_our_roads:0 "Expand our Roads"
  HRE_expand_our_roads_desc:0 "A modern and extensive road network will speed up the movement of people and goods, reduce time loss and traffic congestion. This in turn will increase the efficiency and productivity of businesses and improve their competitiveness."
  HRE_improve_railway_network:0 "Improve Railway Network"
  HRE_improve_railway_network_desc:0 "Investments should not be limited to main lines, but should also cover regional and local lines. In this way, all German citizens will have access to a modern and safe rail infrastructure."
  HRE_expand_the_airports:0 "Expand the Airports"
  HRE_expand_the_airports_desc:0 "Expanding airports is important not only for economic development, but also for the national image. Modern and developed airports will show that Germany is a modern and innovative country."
  HRE_restoration_and_development:0 "Restoration and Development"
  HRE_restoration_and_development_desc:0 "Meeting this challenge will not be easy, but it can only be achieved with the courage, determination and hard work of the German people. Through reconstruction and development, Germany can re emerge as a leader in Europe and the world."
  HRE_finish_the_four_year_plan:0 "Finish the Four Year Plan"
  HRE_finish_the_four_year_plan_desc:0 "After the end of the four year plan, the economy took off. the economic situation of the people started to get better. long live kaiser long live Germany"
  HRE_urbanize_the_capital:0 "Urbanize the Capital"
  HRE_urbanize_the_capital_desc:0 "One of the main goals of the plan is to improve the city's infrastructure. This will be done by building wide boulevards, modern buildings and an efficient public transportation system."
  #luftstreitkrafte
  HRE_army_effort:0 "Army Effort"
  HRE_army_effort_desc:0 "The German army has undergone a steady process of growth and modernization in recent years. These efforts were seen as necessary both to counter the restrictions imposed by the Treaty of Versailles and to ensure the security of the nation."
  HRE_luftstreitkrafte:0 "Luftstreitkrafte"
  HRE_luftstreitkrafte_desc:0 "New aircraft and technologies are being developed and pilots are being trained in modern tactics and doctrine. This rapid modernization demonstrates Germany's desire to regain air dominance in Europe."
  HRE_fighter_focus:0 "Fighter Focus"
  HRE_fighter_focus_desc:0 "It prioritizes the acquisition and maintenance of air dominance. To this end, Germany has invested heavily in recent years in equipping its air force with modern and powerful aircraft."
  HRE_fighter_focus_2:0 "Fighter Focus 2"
  HRE_fighter_focus_2_desc:0 "The future of the Aircraft Focus strategy remains uncertain. Time will tell how this new strategy will affect Germany's defense capability and what consequences it will have for peace and stability in Europe." 
  HRE_CAS_effort:0 "CAS Effort"
  HRE_CAS_effort_desc:0 "In recent years, close air support capability development has been of great importance. This effort is seen as necessary both to provide greater firepower and flexibility to ground troops and to keep pace with the changing needs of the modern battlefield."
  HRE_CAS_effort_2:0 "CAS Effort 2"
  HRE_CAS_effort_2_desc:0 "It is developing new aircraft and technologies to enhance its CAS capability. "
  HRE_bomber_focus:0 "Bomber Focus"
  HRE_bomber_focus_desc:0 "In recent years, it has been undergoing a significant change in its doctrine. It is shifting away from a traditional approach based predominantly on fighter aircraft to a new strategy that places greater emphasis on the use of bombers."
  HRE_bomber_focus_2:0 "Bomber Focus 2"
  HRE_bomber_focus_2_desc:0 "The future of the Bombers remains uncertain. Only time will tell how this new strategy will affect Germany's air power and what consequences it will have for the political and military balance in Europe." 
  HRE_NAV_effort:0 "Nav Effort"
  HRE_NAV_effort_desc:0 "The Naval  Bomber Effort focuses on destroying enemy ships and port facilities with aerial attacks from submarines."
  HRE_NAV_effort_2:0 "Nav Effort 2"
  HRE_NAV_effort_2_desc:0 "It explains the German navy's efforts to improve its naval power by investing in naval bombers. These aircraft are used to destroy enemy ships and ports with air strikes. "
  #army
  HRE_re_creation_of_kaiserliche_armee:0 "Re Creation of Kaiserliche Armee"
  HRE_re_creation_of_kaiserliche_armee_desc:0 "The spirit of the Kaiserliche Armee is rising again in the heart of Germany. With the desire to build a strong nation and maintain peace in Europe, the revitalization of the Kaiserliche Armee represents Germany's entry into a new era."
  HRE_truck_factories:0 "Truck Factories"
  HRE_truck_factories_desc:0 "Truck factories are the backbone of the Reich's economic development and military power. These modern plants produce the robust and reliable trucks needed to develop Germany's infrastructure, transport commercial goods and meet the needs of the military." 
  HRE_mechanisierte_factories:0 "Mechanisierte Factories"
  HRE_mechanisierte_factories_desc:0 "Only time will tell what impact this new production method will have on Germany's arms race and the political balance in Europe."
  HRE_tank_factories:0 "Tank Factories"
  HRE_tank_factories_desc:0 "With increasing demand and constant innovation, this sector is expected to continue to grow in the coming years. Tank factories will continue to play an important role in Germany's military power and the political balance in Europe."
  HRE_rifle_factories:0 "Rifle Factories"
  HRE_rifle_factories_desc:0 " Rifle factories are modern production facilities that contribute to the strength and stability of the German army. They strengthen Germany's defenses by providing soldiers with the reliable and robust rifles they need on the battlefield." 
  HRE_support_equipment_factory:0 "Support Equipment Factory"
  HRE_support_equipment_factory_desc:0 "These factories not only provide equipment to the army, but also contribute to the country's economy by creating jobs. Support equipment is indispensable for the functioning of a modern army and is vital for the survival and fulfillment of each and every soldier in combat."
  HRE_field_artillery_factories:0 "Field Artillery Factories"
  HRE_field_artillery_factories_desc:0 " Field artillery factories are modern production facilities that provide the German army with overwhelming power on the battlefield. These factories produce powerful and robust howitzers and cannons used to destroy enemy lines and pave the way for victory."
  HRE_infantry_tactics:0 "Infantry Tactics"
  HRE_infantry_tactics_desc:0 "tactics not only teaches soldiers how to survive in battle, but also instills teamwork and discipline, making them a stronger and more effective fighting force. Infantry tactics are the foundation of a modern army and are vital for every soldier to survive in battle and fulfill their mission." 
  HRE_support_equipment:0 "Support Equipment"
  HRE_support_equipment_desc:0 "Support equipment is the unsung hero, producing critical supplies that are vital to the German army's success on the battlefield. This equipment contributes to Germany's military strength by providing tanks with spare parts, soldiers with uniforms and ammunition - everything they need."
  HRE_tank_hunter:0 "Tank Hunter"
  HRE_tank_hunter_desc:0 "Tank destroyers are the next generation of combat vehicles designed to enhance the German army's ability to defend against tanks. These powerful and agile vehicles provide agility and firepower on the battlefield, helping Germany gain the upper hand against enemy armor."
  HRE_expand_the_mobilization_program:0 "Expand the Mobilization Program"
  HRE_expand_the_mobilization_program_desc:0 "Expanding the mobilization program is vital to significantly increase the Reich's military power and defense capability. The program will include increased military recruitment, the production of modern weapons and equipment, and the adaptation of the national economy to wartime needs." 
  HRE_mechanisierte_abteilung:0 "Mechanisierte Abteilung"
  HRE_mechanisierte_abteilung_desc:0 " These units replace traditional cavalry and infantry and help Germany realize its goal of becoming one of the most powerful armies in Europe. Mechanized divisions provide the mobility and firepower needed to keep pace with the complexities of modern warfare."
  HRE_tank_expert:0 "Tank Expert"
  HRE_tank_expert_desc:0 "Tank experts are an elite group of engineers and scientists at the forefront of Germany's military power and technological progress. These brilliant and creative individuals are tasked with designing, developing and testing the robust and powerful tanks needed to help the German army dominate the battlefield."
  HRE_mechanised_armies:0 "Mechanised Armies"
  HRE_mechanised_armies_desc:0 "The heavy infantry tactics of the past are being replaced by a new form of warfare based on speed and firepower. Mechanized armies can quickly break through enemy lines, cut logistics chains and turn the war in Germany's favor."
  HRE_inf_armies:0 "Infanterie armies"
  HRE_inf_armies_desc:0 "Infantry armies are the foundation of Germany's military power and national pride. These brave and disciplined soldiers fight on the front lines to defend the homeland against all threats. Infantry armies are the embodiment of Germany's spirit and represent the nation's honour and values."
  #navy
  HRE_kaiserliche_marine:0 "Kaiserliche Marine"
  HRE_kaiserliche_marine_desc:0 "The Kaiserliche Marine is a naval force with a proud tradition of ensuring the Reich's dominance at sea and national security. With their modern ships and courageous spirit, these heroic sailors open a new chapter in Germany's maritime history." 
  HRE_ensure_commercial_protection:0 "Ensure Commercial Protection"
  HRE_ensure_commercial_protection_desc:0 "Domestic shipbuilding and maritime companies can invest, innovate and create jobs while being protected from unfair competition. In this way, we can provide modern ships and qualified sailors for our navy."
  HRE_expand_shipbuilding_capacities:0 "Expand Shipbuilding Capacities"
  HRE_expand_shipbuilding_capacities_desc:0 "This initiative demonstrates the German people's commitment to their maritime tradition and their determination to become a leading nation at sea. Having a modern and powerful navy will help Germany gain prestige and power in the international arena."
  HRE_dominate_the_blue_water:0 "Dominate the Blue Water"
  HRE_dominate_the_blue_water_desc:0 "Ready to conquer the blue waters and dominate the seas. Our modern and powerful navy is the pride of our nation and plays an important role in maintaining peace and order on the world's seas." 
  HRE_protection_of_baltic_and_north_sea:0 "Protection of Baltic and North Sea"
  HRE_protection_of_baltic_and_north_sea_desc:0 "The protection of the Baltic and North Sea is vital for Germany's national security and prosperity. These seas are home to Germany's major trade routes and provide access to the country's maritime resources. Protecting them requires a strong navy and a sound maritime policy."
  HRE_produce_submarines:0 "Produce Submarines"
  HRE_produce_submarines_desc:0 "Germany is increasing its strength and deterrence at sea thanks to modern submarine production facilities. These factories produce advanced and powerful submarines capable of carrying out stealthy and deadly attacks against enemy ships."
  HRE_doctrine_effort_navy:0 "Doctrine Effort Navy"
  HRE_doctrine_effort_navy_desc:0 "The doctrinal effort was a new attempt to transform the German navy into a modern and powerful force. By updating the navy's strategy, tactics and technology, it would enable Germany to dominate the seas."
  #politics
  HRE_learn_from_old_days:0 "Learn From Old Days"
  HRE_learn_from_old_days_desc:0 "We are proud of our past and look to the future with hope. These feelings are what bind us together and make Germany a special country. We can continue to preserve and develop this spirit, guided by the lessons of the past." 
  HRE_heil_dir_im_siegerkranz:0 "Heil Dir im Siegerkranz"
  HRE_heil_dir_im_siegerkranz_desc:0 "It encourages Germans to overcome difficulties and work for the prosperity of their nation. The anthem is a message of unity and solidarity and symbolizes Germany's belief in a bright future."
  HRE_expand_conscription:0 "Expand Conscription"
  HRE_expand_conscription_desc:0 " Conscription is being expanded, increasing Germany's military strength and national security. This historic decision will give the Reich its rightful place on the international stage and reinforce its commitment to peacekeeping."
  HRE_suppress_opposite_sides:0 "Suppress Opposite Sides"
  HRE_suppress_opposite_sides_desc:0 "The German nation is on the brink of great change. Our new leadership is taking decisive steps to revitalize the country and restore prosperity. To achieve this goal, national unity and cohesion are vital. It is therefore necessary to suppress the voices of opposition and eliminate elements that threaten national unity." 
  HRE_protect_the_fatherland:0 "Protect the Fatherland"
  HRE_protect_the_fatherland_desc:0 "It is not only the duty of soldiers to defend the homeland. Every German citizen must contribute to the defense of the homeland. This can be done by showing commitment to national unity and solidarity, by supporting our military strength and by rejecting all threats to our homeland."
  HRE_support_the_church:0 "Support the Church"
  HRE_support_the_church_desc:0 "The Church is the spiritual heart of Germany and forms the moral foundation of the nation. This sacred institution contributes to the well-being of the German people by offering solace, hope and guidance in difficult times."
  HRE_preussiche_tugenden:0 "Preussiche Tugenden"
  HRE_preussiche_tugenden_desc:0 "The Prussian virtues are the core values that have shaped German character for generations and define our national spirit. They are based on hard work, discipline, integrity, honesty, patriotism and sacrifice, and are fundamental elements that have made Germany a strong and prosperous nation."
  HRE_scholastic_based_education:0 "Scholastic Based Education"
  HRE_scholastic_based_education_desc:0 "This system aims to provide students with the knowledge and skills necessary to become rational and moral individuals who are loyal to their homeland and their leaders. Scholastically educated young people will form the future generation of Germany and play an important role in the prosperity and security of our country."
  HRE_god_save_the_kaiser:0 "God Save the Kaiser"
  HRE_god_save_the_kaiser_desc:0 "It prays to God for Germany's prosperity and security and expresses faith in the wise guidance and leadership of the Kaiser. This song helps the German people to come together in difficult times and celebrate their national identity."
  HRE_neue_helle_Tage:0 "Neue Helle Tage"
  HRE_neue_helle_Tage_desc:0 "Germany is entering a period of national rebirth and prosperity. Under our leadership, our country is on the path to economic development, military strength and national pride. This new era will be one in which Germany will take its rightful place in Europe and on the world stage." 
  HRE_support_for_democratic:0 "Support for Democratic"
  HRE_support_for_democratic_desc:0 "Germany is at a historic crossroads. After periods of political and economic instability, our nation is moving towards a new future. The best way to ensure Germany's strength and prosperity in this new era is to strengthen our commitment to democratic values."
  HRE_beacon_of_liberty:0 "Beacon of Liberty"
  HRE_beacon_of_liberty_desc:0 "is a celebration of the values of freedom and democracy. The Beacon of Freedom represents the ideal of equality and justice for all people. The statue continues to inspire people all over the world."
  HRE_interventionism:0 "Interventionism"
  HRE_interventionism_desc:0 "This question is crucial for Germany's future. While some believe that Germany should intervene in the internal affairs of other countries to protect its national interests and promote its prosperity, others advocate for a more passive approach." 
  HRE_nationalism_focus:0 "Nationalism Focus"
  HRE_nationalism_focus_desc:0 "Nationalism is at the heart of Germany's rebirth and its drive towards a bright future. This powerful sentiment reinforces national unity, fosters patriotism and ensures Germany's rightful place on the international stage."
  HRE_military_youthmore:0 "Military Youthmore"
  HRE_military_youthmore_desc:0 "German youth are the heart of our nation and our future. Raising them to be strong, healthy and patriotic individuals is vital for the prosperity and security of the Reich. The Military Youth movement is a critical tool to achieve this goal."
  HRE_paramilitarism2:0 "Paramilitarism"
  HRE_paramilitarism2_desc:0 "Paramilitary training is a vital element in helping to strengthen our national strength by instilling discipline, patriotism and patriotism in German youth. These programs not only produce brave fighters, but also strengthen Germany's solidarity and unity."
  HRE_internationalism_focusmore:0 "Internationalism Focus"
  HRE_internationalism_focusmore_desc:0 "Communists reject the idea of a nation state and dream of a classless society. This dream threatens Germany's national identity and independence. Communists do not want Germany to become a strong nation and defend its own interests."
  HRE_political_correctness_more:0 "Political Correctness"
  HRE_political_correctness_more_desc:0 "In this view, political correctness becomes a form of censorship by banning certain words or phrases and limiting what people can think and say."
  HRE_political_commissars_more:0 "Political Commissars"
  HRE_political_commissars_more_desc:0 " Political commissars are a dangerous element infiltrating the German army and trying to control the ideology of the soldiers. These communist agents use insidious tactics to weaken the patriotic feelings of the soldiers and turn them towards communist ideology."
  HRE_Blood_and_Iron:0 "Blood and Iron"
  HRE_Blood_and_Iron_desc:0 "The German spirit is reviving! Blood and iron represent the rebirth of our nation and its determined march towards a bright future. These powerful elements symbolize our unity and determination and will help Germany to reach its rightful place.\n\nThe blood represents the courage and sacrifice of our ancestors. In the past, their blood ensured our freedom and independence. Today, this blood motivates our grandchildren and carries them into a greater future.\n\nIron symbolizes the strength and endurance of our nation. Iron, the foundation of German industry, enables us to build a nation that shows its will and determination to the world. Together, blood and iron show that Germany is an invincible power." 
  #idea
  HRE_four_year_plan_idea:0"Four Year Plan"
  HRE_expand_conscription_idea:0"Expand Conscription"
  HRE_preussiche_tugenden_idea:0"Preussiche Tugenden"
  HRE_support_the_church_idea:0"Support the Church"
  HRE_protect_the_fatherland_idea:0"Protect the Fatherland"
  HRE_support_the_church_idea_more:0"Support the Church"
  HRE_blood_of_iron_idea:0"Blood of Iron"
  HRE_patriation:0"Patriation"
