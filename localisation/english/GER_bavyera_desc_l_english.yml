l_english:
 ### Descriptions for the German Red / Anarchist focus tree (germany_bavyera)

 GER_socialist_realism_desc:0 "Art must serve the people. Painters, writers and filmmakers will be asked to show the struggle of the worker and the promise of the revolution instead of the doubts of the old salons."
 GER_socialist_realism_c_desc:0 "The flood has passed, and the new order needs its own images. Art, theatre and cinema will be put to work showing the people what they have won and what remains to be done."
 GER_collectivist_propaganda_desc:0 "Posters on every wall, speakers in every factory yard and a radio in every workers' hall. The case for collective work will be made daily, until nobody remembers having heard another."
 GER_collectivist_propaganda_c_desc:0 "The Party will explain to the people why the fields and factories are now theirs. Posters, pamphlets and radio talks will carry the message to every village."
 GER_industrial_cooperation2_desc:0 "The Soviet Union has the raw materials and we have the machine tools. A joint programme of factories, engineers and shared research will bind the two revolutions together."
 GER_tech_sharing2_desc:0 "Our laboratories and theirs are working on the same problems. If Moscow agrees, designs and findings will pass freely across the border."
 GER_resource_trade2_desc:0 "Soviet grain, oil and ore in exchange for German machinery. A fair trade between two socialist states, provided Moscow accepts the terms."
 GER_marx_desc:0 "Marx and Engels wrote their theory in German. By returning to the sources, the new state gains a doctrine of its own and the Politburo gains a firmer hold over the regions."
 GER_collectivize_desc:0 "The factories and fields now belong to those who work them. Mobilisation becomes cheaper and the reserves can be called up faster, though training suffers for it."
 GER_vomen_desc:0 "Half of the workers of the Republic are women, and the revolution cannot call itself finished while they have no vote. The Party gains standing, and the people hold firmer when the country must defend itself."
 GER_internationalizim_desc:0 "The revolution knows no borders. The people are asked to see themselves as one part of a worldwide class struggle, and the war effort gains support."
 GER_peace_at_europa_desc:0 "A Red Europe, at peace and governed by its own working classes, with no commissar from Moscow looking over our shoulder. We will gather the like-minded into a bloc of our own."
 GER_western_europa_inf_desc:0 "Our newspapers, unions and party delegates open offices in every western capital. For a few months, the governments there will find it hard to refuse us."
 GER_balkan_inf_desc:0 "The Balkan capitals are poor, divided and tired of their kings. Our delegates, loans and pamphlets will make our voice carry there for some time."
 GER_anti_fa_desc:0 "The reactionary governments of the north must go. Declarations of war are drawn up against Finland, Denmark, Sweden and Norway."
 GER_socialist_war_desc:0 "If Europe will not turn red by persuasion, it will turn red by the army. The call to arms brings more of the people to the Party."
 GER_join_comintern_desc:0 "The Comintern has a seat for the German Republic. Moscow must agree, and our new standing will alarm our neighbours."
 GER_our_road_desc:0 "We will not take orders from Moscow. Germany forms a Red European Bloc of its own, and the other socialist states may join it on equal terms."
 GER_soviet_doctrine_desc:0 "Soviet attachés teach our officers the methods of mass assault they developed in the civil war. Our staff gains experience and the doctrine costs fall."
 GER_soviet_invest_desc:0 "Soviet capital pays for new engine works and factories in our industrial regions. Research into engines moves faster."
 GER_innovations_desc:0 "The Party draws up a national plan for invention. Design bureaus are set up in every large works and told to prepare for the invasions to come."
 GER_red_guns_desc:0 "Rifles, machine guns and field guns for every volunteer. The plan for innovation widens, and the arsenals begin to turn out arms by the thousand."
 GER_reorganize_industry_desc:0 "Small workshops are merged into large plants, and the Republic's plan for self-sufficiency moves to its second stage."
 GER_reorganize_industry_2_desc:0 "Engineers rebuild management from the top to the shop floor. Industrial research becomes cheaper and faster."
 GER_key_industry_desc:0 "Steel, coal and machine building are taken from their owners and run for the whole nation. New complexes rise in the industrial regions."
 GER_key_industry_2_desc:0 "Civil industry is rebuilt after the first wave of nationalisation. The state takes a firmer hold of the factories, and new plants open in the regions."
 GER_key_industry_3_desc:0 "The state learns to manage the companies it has taken over. Their books are opened, their plans rewritten and their output pushed higher."
 GER_state_red_desc:0 "With the key industries secure, the state can ease its grip on daily management. Part of the burden of nationalisation is lifted and the Party gains political capital."
 GER_mark_red_desc:0 "The old currency is withdrawn in favour of state accounts and labour vouchers. Prices settle and public confidence grows."
 GER_state_handle_desc:0 "The emergency measures of the nationalisation are wound down. Factories run on stable plans, and the managers know whom they answer to."
 GER_state_handle_2_desc:0 "The planning bureaus take direct responsibility for production. The hand of the state is felt in every works, and in every pay envelope."
 GER_turn_soviet_desc:0 "We look neither to the east nor to the west. The Republic builds on its own strength, and the people feel safe with their backs to the border."
 GER_sov_market_desc:0 "Our factories are opened to the Soviet market and its enormous demand. The orders from the east keep the lathes running."
 GER_big_collectivize_desc:0 "The great collectivisation is a harsh affair and the people will not like all of it. Yet the new works it creates will feed the industry of the Republic."
 GER_soviet_aid_2_desc:0 "Soviet capital and engineers arrive to build arms works in our regions. The comrades are generous, and they will remember it."
 GER_urbanize_desc:0 "The land is poor and the factories need hands. Agricultural regions are urbanised, and the sons of the farms are called to the workshops."
 GER_urbanize_2_desc:0 "Whole villages move to the factory towns. The pool of workers deepens, and the plans of the Republic can be larger."
 GER_party_congress_desc:0 "The delegates meet in congress to decide the line of the Party. After the vote, the Republic's course is set and its people march behind it."
 GER_build_goverment_desc:0 "The Party must now govern as well as lead. Ministries are staffed with loyal and capable people, and a new government takes shape."
 GER_build_goverment_2_desc:0 "The files of the old political police are opened, and the fascist officials named in them are taken in. Hans Oster's network proves useful in the process."
 GER_foregin_policy_desc:0 "The foreign office is rebuilt for a socialist Germany. Diplomats who understand both the Party and the chancelleries of Europe are put to work."
 GER_red_advisors_desc:0 "A council of Party and army figures gathers to advise the leadership. Their words carry weight, and their lines are drawn up with the future in mind."
 GER_red_research_desc:0 "Science is placed in the service of the working class. A new research bureau is opened, and the Republic can follow another line of research."
 GER_red_research2_desc:0 "The old Bolshevik teachings on science return in new form. A research institute is founded to follow another line of work."
 GER_manevra_desc:0 "Large exercises of the army in the field test the new ideas of the war to come. The doctrine of our staff gets cheaper to refine."
 GER_air_red_desc:0 "An aviation school opens for the sons of the workers. Pilots and designers learn together, and air doctrine becomes cheaper to study."
 GER_navy_red_desc:0 "Sailors have always been among the first to raise the red flag. The navy is reformed under their influence, and naval doctrine becomes cheaper to study."
 GER_navy_red_2_desc:0 "The yards open their gates to the new fleet. Dockyards are expanded and the first orders are placed for ships worthy of a socialist Germany."
 GER_go_moscow_desc:0 "If we cannot stand alone against the world, we will not stand alone. Moscow is offered a partnership, and in return our armour designers may share in the Soviet experience."
 GER_devide_poland_desc:0 "Poland stands between two revolutions. If Moscow agrees, the two armies may meet in the middle and divide the country, provided our army is large enough to do it."
 GER_take_poland_desc:0 "The agreement is signed and the maps are drawn. Our armies and the Red Army march into Poland together."
 GER_support_jacobenizm_desc:0 "The Jacobins ask for the full power of the revolution and the scaffold. The Party gives them its backing, and the country is gripped by their zeal."
 GER_red_war_economy_desc:0 "The Jacobin war economy mobilises the whole country. Everything is put to the service of the war, and the people are asked to give more."
 GER_weltkrieg_desc:0 "A second world war is coming, whether we want it or not. The Republic must be ready to wage it as a revolutionary power."
 GER_leninizm_desc:0 "The Party declares itself the true heir of Lenin. Its advisors are renewed, its ranks rally and the country is steadier for it."
 GER_civilwar_red_desc:0 "The civil war has left cities in ruins and railways cut. It will take months to clear the rubble and put the country back to work."
 GER_red_army_2_desc:0 "A new Red Army is built on the lessons of the civil war, with its officers drawn from the ranks of those who won it."
 GER_red_doctrine_desc:0 "Commanders write down what the civil war taught them. The doctrine they publish makes further study of land warfare cheaper."
 GER_war_with_jacobens_desc:0 "The Jacobins have gone too far. The Republic prepares itself for the final struggle with those who would turn the revolution into a scaffold."
 GER_war_with_jacobens_2_desc:0 "Military production is nationalised in order to supply the war against the Jacobins. New works open in the regions closest to the front."
 GER_war_with_jacobens_3_desc:0 "Heavy industry is turned entirely to the war. Steel, coal and machine tools are made available to the army without delay."
 GER_trotsky_ideals_desc:0 "Trotsky warned of the bureaucracy that would strangle the revolution. His followers find a ready audience, and the war support of the country grows."
 GER_militarisation_red_desc:0 "The Republic arms itself in earnest. The military industry is expanded under the direction of the Party, and every factory has its quota."
 GER_soviet_multeci_desc:0 "Those who flee from Stalin find shelter in Germany. Among them are engineers, officers and old Bolsheviks who bring their skills with them."
 GER_trot_industry_desc:0 "The refugees find work in our factories. Industrial employment grows and the newcomers are put to the production lines."
 GER_trot_consumer_desc:0 "Workers must be fed and clothed as well as armed. The budget is steadied and consumer goods are made more readily available."
 GER_take_austuria_1_desc:0 "Austria is a German land and its people have long wished to join the Republic. Our government sends word to Vienna, and the Austrian cores are claimed."
 GER_take_austuria_2_desc:0 "Vienna is invited to join the German state. Its people share our language and our history, and the offer is made in good faith."
 GER_take_cze_desc:0 "Czechoslovakia sits on the border with our industrial heartland. The proposal is delivered to Prague, and the Czech cores are claimed."
 GER_take_cze_2_desc:0 "What will become of Czechoslovakia? Its cities are rich, its factories are famous and its people have to decide whether to join us or not."
 GER_balkan_dom_desc:0 "The governments of the Balkans are told they have a choice to make. Their ties to Germany will be strengthened, one way or the other."
 GER_balkan_dom_com_desc:0 "The Balkans are poor, divided and weak. We will bring them under the Red banner by force, if they will not come by themselves."
 GER_anti_soviets9_desc:0 "The Soviet Union is the enemy of the revolution. We prepare to bring it down after the Baltic states have been dealt with."
 GER_take_poland_2_desc:0 "Poland has long stood in the way of the Republic. A claim is placed on all Polish lands, and the army prepares to march."
 GER_take_baltics_desc:0 "The Baltic states are small and weak, and they lie between us and the Soviet Union. Claims are placed on Lithuania, Latvia and Estonia."
 GER_attack_benalux_desc:0 "The Maginot Line cannot be crossed, but it can be bypassed. Claims are placed on the Low Countries, and the army prepares for the march west."
 GER_attack_italy_communist_desc:0 "Italy is the last stronghold of the old order in the south. The army prepares to cross the Alps, and claims are made on the border regions."
 GER_attack_iberia_desc:0 "The Pyrenees are no obstacle for an army with a purpose. War goals are prepared against the powers of the Iberian peninsula."
 GER_attack_fra_desc:0 "France was the cradle of the revolution. A socialist Germany owes it a visit with a sword in its hand."
 GER_attack_fra2_desc:0 "Our socialist brothers in France are waiting for us. A claim is placed on the whole country, and the army marches to meet them."
 GER_attack_fra_2_desc:0 "France is falling apart from the inside. Our armies need only push at the door, and the strikes and riots will do the rest for some time."
 GER_attack_engglandd_desc:0 "Across the Channel lies the last great power of the old Europe. The navy and the air force prepare to cross the water."
 GER_attack_engglandd5_desc:0 "With the continent secured, Britain is the last obstacle. The navy and the air force prepare to cross the water."
 GER_attack_usa47_desc:0 "Beyond the ocean lies the last capitalist power. Once Europe is secure, we shall cross the Atlantic."
 GER_attack_usa49_desc:0 "Beyond the ocean lies the last capitalist power. Once Europe is secure, we shall cross the Atlantic."
 GER_anarchist_arms_desc:0 "The anarchist militias take up arms in the name of the people. Their transport network supports the war effort, and their rifles are in every town."
 GER_local_desc:0 "Society is reorganised around local councils and the free association of workers. Decisions are taken where the work is done."
 GER_war_infra_desc:0 "The war effort needs railways, depots and workshops. Incentives are offered to those who build them, and new works rise in the regions."
 GER_anarchist_council_desc:0 "The revolution does not need a leader. The councils of the workers will rule in his place, and a collective of equals will speak for Germany."
 GER_anarchist_leader_desc:0 "The unions gather to decide the future of the Republic. A leader acceptable to all is chosen, and the Party's influence is replaced by that of the unions."
 GER_anti_bolshevic_bloc_desc:0 "The refugees from the east tell us what to expect from Moscow. We form a bloc of states which will resist its influence, and invite France to join it."
 GER_anti_bolshevic_bloc3_desc:0 "A bloc is formed against the Bolsheviks, and word is sent to Mexico City."
 GER_anti_bolshevic_bloc_2_desc:0 "Our allies need investment in their industry. Funds and engineers are sent to them, and they will strengthen the bloc in return."
 GER_fate_syndicate_desc:0 "The syndicates have served their purpose, and new forms of organisation are needed. The old ones are closed, and the people are asked to take their place."
 GER_syndicate_desc:0 "The syndicates take the lead and answer the call of the people. Their response is quick, and the economy is reorganised around them."
 GER_collectivize_slots_desc:0 "The public is trusted to decide how the factories are laid out. Space is freed for new works across the country."
 GER_collectivize_slots_2_desc:0 "Roads and railways are common property. They are repaired and extended by those who use them, and new infrastructure appears across the country."
 GER_collectivize_industry_desc:0 "Private owners withdraw from industry, and the workers take over. New factories open in the former estates."
 GER_purify_desc:0 "A new society needs a clean break with the old borders. The Polish and French claims on our soil are withdrawn, and the Party's authority is made firmer."
 GER_purify_2_desc:0 "A social contract that disperses order. The Republic chooses the road of voluntary association and forms a global council to defend it."
 GER_purify_3_desc:0 "Anarchism knows no borders. Resistance is stirred in the neighbouring lands, and the people there are encouraged to rise against their governments."
 GER_purify_4_desc:0 "The red flood begins. A council of defence is proclaimed, and the workers' militias march out of the capital to meet the enemies of the revolution."
 GER_eastward_desc:0 "The road east is long, but the revolution has nothing to fear. A claim is placed on Poland, and the army prepares to march."
 GER_communal_desc:0 "The communes take over the factories and run them as common property. Output grows as the workers see the fruit of their labour."
 GER_westward_desc:0 "Danger lies in the west. The Low Countries are claimed in order to secure our borders and spread the revolution."
 GER_annex_duch_desc:0 "The Netherlands is a rich and tolerant country. Even so, it stands in our way, and the army is told to prepare for war."
 GER_annex_fra_desc:0 "The homeland of the revolution is ruled by those who have betrayed it. A claim is placed on France, and the army is told to bring it back."
 GER_menance_desc:0 "Soviet weapons and Soviet advisors are available to those who want them. A programme of armament begins, and the Red Army is its model."
 GER_join_comintern_2_desc:0 "Moscow is asked to open its doors. The German Republic wishes to take its seat in the Comintern."
 GER_soviet_research_desc:0 "The Soviets share their technology with us. A new research slot is opened for the studies this makes possible."
 GER_sieze_desc:0 "Joint income is seized by the commune and put to use for the whole. A system of common funds provides for the needs of the war."
 GER_prepare_mil_desc:0 "The communes turn their factories to the needs of war. New military works open across the country."
 GER_attack_spain_desc:0 "Our anarchist comrades in Spain have been fighting for a long time. An alliance is offered, and our armies will fight on their side."
 GER_resource_anarch_desc:0 "Raw materials are taken from the ground by the free labour of the workers. Production grows with the new methods."
 GER_resource_anarch_2_desc:0 "Collectivised production of resources increases the supply. Mines and fields are worked by the communes, and the flow of raw materials grows."
 GER_annex_ita_desc:0 "The last fascist regime must fall. A claim is placed on Italy, and the army is told to march south."
 GER_communal_anarch_desc:0 "Communal anarchism is put into practice. The workshops are run by the workers themselves, and industrial research benefits."
 GER_armor_anarch_desc:0 "German armour technology is taken out of the hands of private firms and given to the people. Research into tanks is accelerated."
 GER_wartime_industry_anarch_desc:0 "The war is coming and the factories must be ready. The communes turn to wartime production, and new works open in the regions."
 GER_conscription_anarch_desc:0 "Every worker is a fighter for the revolution. The militias grow into a guerrilla army, and the call to arms brings more volunteers."
 GER_core_anarch_desc:0 "The people of Prussia rise up to take back what is theirs. Claims are placed on the lands of the old eastern provinces."
 GER_attack_poland_anarch_desc:0 "Poland stands in the way. A claim is placed on the whole country, and the army prepares to capture it."
 GER_core_poland_anarch_desc:0 "Anarchism in Poland is a dream of many. Its lands are claimed for the Republic, and its people are invited to join us."
 GER_core_lit_anarch_desc:0 "Anarchism in Lithuania is waiting to be born. The Lithuanian lands are claimed for the Republic."
 GER_core_est_anarch_desc:0 "Anarchism in Estonia is waiting to be born. The Estonian lands are claimed for the Republic."
 GER_core_est_attack_desc:0 "Estonia lies at the end of the road. A claim is placed on the whole country, and the army prepares to take it."
 GER_core_lit_attack_desc:0 "Lithuania lies on the road. A claim is placed on the whole country, and the army prepares to take it."
 GER_devide_cze_anarch_desc:0 "What is to be done with Czechoslovakia? A decision is sent to Prague, and the checks on its fate are parsed."
 GER_core_cze_anarch_desc:0 "Bohemia and Moravia are integrated into the Republic. The claims on the Czech lands are made permanent."
 GER_attack_hol_anarch_desc:0 "The Netherlands has long been a haven of tolerance in Europe. We offer it a chance to join us before the war begins."
 GER_attack_benalux_anarch_desc:0 "Belgium and Luxembourg are liberated from their governments. Claims are placed on their lands, and the army prepares to march."
 GER_attack_aus_anarch_desc:0 "Austria is captured by the revolution. Resistance is stirred in the Austrian lands, and the Austrian cores are claimed."
 GER_roads_anarch_desc:0 "Roads must be secured against the forces of reaction. New infrastructure is built in the regions closest to the front."
 GER_mil_factories_anarch_desc:0 "Military factories are seized from their owners and run for the revolution. New capacity opens in the regions."
 GER_politic_anarch_desc:0 "The end of political authority is the goal of every anarchist. In the meantime, the Republic gathers its strength."
 GER_industry_anarch_desc:0 "Public enterprise replaces the private firm. The factories are run by those who work in them, and output improves."
 GER_social_act_renew_desc:0 "The social deal with the workers is renewed. The Republic promises them more voice in the running of industry."
 GER_social_revision_desc:0 "The social deal is taken apart. The old system is swept away, and the government is left with greater freedom of action."
 GER_social_revision_2_desc:0 "Anarchist development is carried out across the country. New works are founded in the regions."
 GER_social_revision_3_desc:0 "Production must continue, whatever happens. Measures are taken to ensure that the factories keep running."
 GER_militarize_the_industry_communist_desc:0 "Collective ownership puts the factories at the service of the army. New arms works are set up in the home regions."
 GER_formalized_army_anarch_desc:0 "The militias are given a formal structure. The army of the free people learns to fight as an army, and land doctrine becomes cheaper to study."
 GER_anarchisim_in_one_country_desc:0 "For the time being, anarchism must survive in a single country. The people are asked to resist all attempts to bring it down."
 GER_formalized_air_anarch_desc:0 "The air force is given a formal command. Air doctrine becomes cheaper to study."
 GER_formalized_navy_anarch_desc:0 "The navy is given a formal command. Naval doctrine becomes cheaper to study."
 GER_formalized_navy_anarch_2_desc:0 "The yards are expanded to build ships for the free fleet. Dockyards are extended and the first orders are placed."
 GER_expand_air_anarch_desc:0 "Arms production gets support for the air force. New works open in the regions, and aircraft production grows."
 GER_anarch_armys_fcs_desc:0 "The national guards are formed from the militias. They are trained, equipped and ready to defend the country."
 GER_jewish_anarch_desc:0 "The Jewish community of Germany, scattered and persecuted for years, is brought together again. Its scholars, craftsmen and merchants help rebuild the country's industry."
 GER_new_ind_anarch_desc:0 "Investments are put in the hands of the public. New factories open as the people decide for themselves where they are needed."
 GER_militarisation_anarch2_desc:0 "Every state in the Republic is armed and made a part of Germany. New arms factories open across the country."
 GER_militarisation_anarch3_desc:0 "The revolution is declared to the whole world. Every other country will be told of our intentions."
 GER_civilwar_anarch_desc:0 "The civil war has left cities in ruins and railways cut. It will take months to clear the rubble and put the country back to work."
 GER_the_comintern2_desc:0 "The Comintern is revived under German leadership. Our neighbours are called upon to join the cause, and the other powers watch with growing alarm."
