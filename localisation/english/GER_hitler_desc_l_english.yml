 ### Descriptions for the German Hitler tree (germany_hitler)

 GER_legion_condor2_desc:0 "As the civil war rages on the Iberian peninsula a great opportunity presents itself to us. By sending them as many volunteers as we can manage can we not only ensure that the right side wins, but also offer our troops battlefield experience and tie the [SPR.GetAdjective] people that share our ideals closer to us."
 GER_SOV_koester_nakhimov_plan2_desc:0 "$GER_naval_rearmament_desc$" #old loc
 GER_form_rome_berlin_axis2_desc:0 "$GER_italy_ally_desc$"
 GER_invade_italy2_desc:0 "While at first glance [ITA.GetNameDef] might seem a good potential ally to us, we know their true colors. At the start of the Great War they rejected to fight alongside us, and in 1915 even turned against us, despite our earlier alliance. We learned our lesson then, the mistake that is trusting them will not be made again."
 GER_reorganize_the_wehrmacht2_desc:0 "For us to be able to follow through with the Führer's ambitious plans an expansive reorganization must take place within the Wehrmacht. Too many of the current leaders spend their time voicing petty and baseless concerns instead of carrying out the Führer's orders. Only by removing these individuals can our goals be achieved!"
 GER_demand_the_return_of_southern_jutland2_desc:0 "The ownership of the Duchy of Schleswig has long been a contentious matter between us and the Danes. At the end of the Great War, despite not even taking part in it, the Entente gave Northern Schleswig away to them. We must undo this historical injustice, and demand that the Danish government hand it back to us."

 ### Focuses with no description elsewhere
 ger23_desc:0 "The NSDAP is the only party capable of ending the chaos of the Republic. The state throws its weight behind the movement and clears the way for what follows."
 GER_ban_partie_desc:0 "Rival parties are banned, and the press is brought into line. Opposition is driven underground, and the government is left to act without it for some time."
 GER_fascism_rising_desc:0 "Agents, newspapers and sympathisers abroad carry the message of the new order across our borders. For a few months, the movements in the neighbouring countries grow bolder."
 GER_anti_comitern_pact_desc:0 "A pact against the Comintern is offered to the powers who fear Moscow. It will please our friends, alarm our enemies and raise tensions in Europe."
 GER_coup_austria_desc:0 "Vienna is pressed to hold a referendum on union with Germany. The pressure from Berlin is considerable, and the other powers watch with growing unease."
 GER_hun_austria_desc:0 "Rather than take Austria for ourselves, we support Hungarian claims to it. A proposal is sent to Vienna, and the Austrian lands are claimed by Budapest."
 GER_ally_with_austria_desc:0 "Austria is offered a close alliance in place of union. A partnership with Vienna would secure our southern border without the use of force, if it accepts."
 GER_anti_soviet_tanks2_desc:0 "The coming war in the east will be a war of armour. Our tank designers study the Soviet machines, and our staff gains valuable experience."
 GER_ally_with_bugets_desc:0 "France is offered an arrangement in place of a war. If Paris is willing, the two countries can work together on the continent."
 GER_angalo_german_pact_desc:0 "Britain and Germany have more to gain from agreement than from war. A pact is offered to London, and its terms are for the British government to accept or refuse."
 GER_berlin_axis_desc:0 "With London on our side, the balance of Europe changes. The nations of the continent will have to decide where they stand."
 GER_remove_ethnic_suppresion_desc:0 "The measures against minorities within our borders are withdrawn, and the old currency burdens are lifted with them. The country can concentrate on its other tasks."
 ger24_desc:0 "Power is concentrated in the hands of the leader. The government is free to act without the limits of the old constitution, and a considerable store of political capital is gained."
 ger25_desc:0 "The Reichsbank is directed towards self-sufficiency. Imports are cut back, mining is stepped up, and the country turns inward for some time."
 ger26_desc:0 "The treaty limits on our armed forces are quietly ignored. Arms are built in secret, and the new leadership prepares for a larger army."
 ger27_desc:0 "Private companies are encouraged to invest in the industrial base of the Reich. In return, the state promises them contracts, and new capacity is added at once."
 ger28_desc:0 "The air force is formed out of the secret aviation schools. The Luftwaffe takes its place alongside the army and the navy."
 ger31_desc:0 "Turkey is encouraged to look to the regions it has lost. Claims on neighbouring territories are placed in its name, with the support of Berlin."
 ger108_desc:0 "The war has turned against us, and the nation must fight with everything it has. The people are asked to rally one last time, and the research effort is redirected."
 ger109_desc:0 "Europe has been reordered under German leadership. The new order is proclaimed, a Greater German Reich can be formed, and the people are told that the work is done."
 ger110_desc:0 "Factories are moved deep underground, out of reach of bombers. Production is dispersed and hardened against attack."
 ger111_desc:0 "Every man able to carry a rifle is called to the defence of the homeland. The Volkssturm is formed from the old, the young and the unfit."
 ger112_desc:0 "Resistance units are formed behind the lines to fight on after the front has been broken. The defence of the homeland is organised in depth."
 ger113_desc:0 "Anti-tank weapons are issued in large numbers to the last defenders. They are cheap, simple and available in quantity."
 ger200_desc:0 "If the war is lost, some will wish to leave before the end. A plan for flight to Argentina is made, and its consequences are for the leadership to bear."
 ger114_desc:0 "Japan is no longer an ally we can trust. A puppet war goal is placed on it, and the special forces are made ready."
 GER_lebensrum_achieved1_desc:0 "The continent lies within our reach. All of Europe is claimed as German territory, and the cosmetic name of the state is changed to match."
 ger115_desc:0 "The Atlantic no longer protects the United States. A puppet war goal is placed on it."
 ger116_desc:0 "China is vast and divided. A puppet war goal is placed on the Chinese states."
 ger117_desc:0 "Rocketry is the weapon of the future. Research into rockets and jet technology is given priority, and the best engineers are brought together."
 ger118_desc:0 "The nuclear age has started. Scientists are given every resource they ask for, and research into nuclear weapons and rockets is accelerated."
 ger119_desc:0 "The most advanced weapons the Reich can build are brought into the field. They are expensive, rare and impressive."
 GER_core_all_desc:0 "Every state under our control is made a part of Germany. New arms factories open across the whole territory."
 GER_demand_all_desc:0 "The other countries of the world are told of our demands. Each one will have to give its answer."
 ger_193_desc:0 "The SS is expanded into a full military force. Motorised divisions are formed, and a template for the new units is made available."
 ger_194_desc:0 "The army takes control of the Luftwaffe. Its leaders are placed under the general staff, and new advisers are added to the government."
 ger_195_desc:0 "The need for living space becomes a pillar of state policy. The idea is spread through schools, newspapers and the speeches of the leadership."
 ger_196_desc:0 "Our war machine needs oil, and there is little at home. Romania is approached with a request, and the answer will decide what follows."
 ger_h_1_desc:0 "The war in the east requires its own organisation. Forces in the occupied territories are expanded and put under special command."
