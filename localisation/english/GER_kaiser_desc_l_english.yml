 GER_attack_usaa8_desc:0 "With the vanquishing of all continental opposition to our rule, we must see to re-focusing our production effort to the creation of a huge navy, so that we may bring the fight to the British and the Americans. We shall not rest, until in God's good time, the Old World, with all its power and might, steps forth to the subjugation and humiliation of the new."
 GER_carve_up_congo2_desc:0 "The Congo is ripe for colonization, and is abundant with natural resources. Perhaps we could find an agreement with the British appeasers to divide this vast territory up among each other, as a great stepping stone in our efforts to reform our colonial empire."
 GER_claim_mexico_desc:0 "Mexico was first proclaimed an empire under the House of Iturbide, and later on, was ruled by Maximilian von Habsburg during the second empire, until he was unjustly executed. The current heir to the imperial throne is María Josepha Sophia de Iturbide who was once adopted by him, and we shall see to it that she can reclaim her crown once again!"
 GER_claim_spain_desc:0 "A long time, the Habsburgs ruled over the Spanish. We should attempt to restore the monarchy in Spain, and use the Spanish to expand the Habsburg Alliance and flank our opponents in Western Europe."
 GER_closer_sino_germanic_relations2_desc:0 "The [CHI.GetAdjective] have been a long standing ally of ours, with many seeing it likely for the [CHI.GetAdjective] government to enter the Great War on our side at the time. We should value our relationship with them, and attempt to strengthen the bond between our nations."
 GER_crossing_the_atlantic3_desc:0 "With the vanquishing of all continental opposition to our rule, we must see to re-focusing our production effort to the creation of a huge navy, so that we may bring the fight to the British and the Americans. We shall not rest, until in God's good time, the Old World, with all its power and might, steps forth to the subjugation and humiliation of the new."
 GER_divide_and_conquer2_desc:0 "We and the [CHI.GetAdjective] have our desired spheres of influence in the far east, and at some point borders will have to be drawn up and respected. As such we should do that as soon as possible, so that both of our imperial dreams can be recognized."
 GER_enact_agrarian_reform_desc:0 "Our agrarian sector has ample room for improvement. Streamlining it and improving its efficiency will free up work forces that can be employed in other sectors, such as construction and arms production."
 GER_expand_african_reach2_desc:0 "There are regions of Africa that we lay claim to that are not under the control of our current enemies. We should make sure that our claims are made clear, and demand these territories from them right away."
 GER_expand_pacific_holdings2_desc:0 "With a bloodied tooth for an empire in the Pacific Ocean, our politicians are advocating for the expansion of our reach across the region, with a goal of establishing [ROOT.GetAdjective] hegemony in the far east. We should support this initiative, and go on the offensive."
 GER_industrial_investments2_desc:0 "[CHI.GetNameDefCap] is very underdeveloped and lacks the industrialization it would need to properly stand on the world stage as a great power. We should send over engineers to aid in their industrialization, as well as fund up and coming [CHI.GetAdjective] corporations in an attempt to aid them in their industrial growth."
 GER_japanese_naval_cooperation_bav_desc:0 "We have much to learn from the [JAP.GetAdjective], particularly regarding naval matters. By establishing a joint technology effort we can make sure to make the most out of each others knowledge and reduce the amount of time spent on reinventing what we, as a joint force, already have access to."
 GER_kings_guard_desc:0 "The King has ambitions of military leadership, and who better for him to lead than his own personal royal guard?"
 GER_kings_guard_bav_desc:0 "The King has ambitions of military leadership, and who better for him to lead than his own personal royal guard?"
 GER_launch_sino_germanic_joint_research_program2_desc:0 "The [CHI.GetAdjective] possess knowledge that would be valuable to know, and we know a lot that would be useful for them as well. Therefore we should endeavor to establish a joint research and development team that can aid the progress of both our nations cooperatively."
 GER_multi_ethnic_empire_desc:0 "Our Empire encompasses many different people and cultures, and it is something that we must embrace fully, granting large autonomy to the different localities of our realm, making our people want to stay a part of us for the years to come."
 GER_our_place_in_the_sun2_desc:0 "Let everyone know that [ROOT.GetNameDef] once more asserts its right to take its place in the sun! Our people will no longer be humiliated in the shadows, under the thumb of the Empire on which the sun never sets!"
 GER_petition_for_the_return_of_old_colonies2_desc:0 "Our newfound British friends may be open to discussing the return of our colonies which they took over at the end of the Great War. They may demand compensations of some kind, but it is something that we would be willing to do if it could mean the restoration of our old claims."
 GER_realize_mittelafrika2_desc:0 "Our colonial empire will reach far and wide, and the riches of central Africa have always been alluring. We should realize our dreams of a German Mittelafrika as soon as possible, so that we can make use of the heart of Africa."
 GER_request_the_return_of_qingdao2_desc:0 "Tsingtao was one of the many treaty ports gained from China during their century of humiliation. Though we lost the city at the end of the Great War, a city which had been ceded to us so many years ago, we may now find the opportunity to ask for it back from [CHI.GetNameDef], provided we have the right compensations ready."
 GER_send_military_aid2_desc:0 "Our friends in [CHI.GetNameDef] are surrounded by enemies, many of which seek to threaten the very existence of their state. We must send over ammunition and equipment to them, so that they can secure their borders and prove useful to us in the years to come."
 GER_send_volunteers2_desc:0 "Many [ROOT.GetAdjective]s yearn for adventure, and wish to go fight for a good cause. We should thus establish a legion of 'volunteers' that will go off to aid our [CHI.GetAdjective] friends in their wars."
 GER_take_balticss_desc:0 "Historically there has been a sizeable [ROOT.GetAdjective] diaspora living in the Baltics. It is in their best interest, much like it is in ours, to bring them back home to [ROOT.GetNameDef]!" 
 GER_take_balticss2_desc:0 "Historically there has been a sizeable [ROOT.GetAdjective] diaspora living in the Baltics. It is in their best interest, much like it is in ours, to bring them back home to [ROOT.GetNameDef]!" 
 GER_the_bastion_of_catholicism_desc:0 "Our nation is majority catholic, and so is its monarch. It is high time that the Apostolic Kingdom of Hungary take up its position of defender of Christianity, and drive out the godless communists from our continent."
 GER_the_central_powerss_desc:0 "We require allies if we are to stand against the West. We will create our own faction to stand against the oppression of the democracies."
 GER_the_final_blow_to_communism_bav_desc:0 "Dealing with [SOV.GetNameDef] cannot be the end of our crusade against communism in Europe. So long as communist nations exist in our vicinity we must keep up the fight. We cannot rest until the red menace is fully eradicated!"
 GER_the_sino_germanic_pact2_desc:0 "The time has finally come to officially recognize the [CHI.GetAdjective] government as an ally. We should formalize this alliance immediately, so that we can together stand up against all those who seek to oppress us!"
 GER_unify_west_africa2_desc:0 "Our dreams of Mittelafrika are currently hindered by the existence of the Angolan region. In order to connect our territories in South-West Africa with our Congolese holdings, we must send an ultimatum demanding the immediate recognition of our rule over the territory."

 ### Variants whose base focus has no description
 GER_annex_old_lands_desc:0 "The crown of Bohemia and the Habsburg lands once belonged to the same empire. Austria and Czechoslovakia are folded into the Reich, and their lands are claimed as German core territory."
 GER_anti_soviet_bav_desc:0 "The Bolshevik state in the east is the enemy of every throne in Europe. We prepare for a great winter campaign, and a puppet war goal is placed on the Soviet Union."
 GER_anti_soviets5_desc:0 "The Bolshevik state in the east is the enemy of every throne in Europe. We prepare for a great winter campaign, and a puppet war goal is placed on the Soviet Union."
 GER_anti_soviets6_desc:0 "The Bolshevik state in the east is the enemy of every throne in Europe. We prepare for a great winter campaign, and a puppet war goal is placed on the Soviet Union."
 GER_anti_soviets_k_desc:0 "The Bolshevik state in the east is the enemy of every throne in Europe. We prepare for a great winter campaign, and a puppet war goal is placed on the Soviet Union."
 GER_anti_sovietss2_desc:0 "The Bolshevik state in the east is the enemy of every throne in Europe. We prepare for a great winter campaign, and a puppet war goal is placed on the Soviet Union."
 GER_ata_all_desc:0 "The peace imposed on the old empires was a humiliation, and it will be answered. War goals are prepared against Britain and France, and the people are ready for the call."
 GER_attack_allies_desc:0 "The victors of the last war have grown comfortable. War goals are prepared against Britain and France, and the people rally to the idea of revenge."
 GER_attack_uk_general_desc:0 "The general staff has drawn up its plans for the crossing. Preparations for Sea Lion begin, and war goals are placed on Britain and France."
 GER_attack_benelux_general_desc:0 "The staff plans for the west require the Low Countries. The army prepares to move on the Netherlands, Belgium and Luxembourg."
 GER_attack_den_holy_desc:0 "The northern kingdoms are small and cannot resist the Reich. War goals are prepared against Finland, Denmark, Sweden and Norway."
 GER_attack_den_kaiser_desc:0 "With the Alpine question settled, the Kaiser turns his attention north. War goals are prepared against Finland, Denmark, Sweden and Norway."
 GER_attack_scand_bav_desc:0 "The Bavarian crown looks to the northern kingdoms. War goals are prepared against Finland, Denmark, Sweden and Norway."
 GER_attack_scand_habsburg_desc:0 "The Habsburg court wants the Baltic and the north secured. War goals are prepared against Finland, Denmark, Sweden and Norway."
 GER_attack_france_desc:0 "France has been the enemy of the German crown for centuries. A puppet war goal is placed on it, and the army prepares to march."
 GER_attack_france_bav_desc:0 "With the Frankish empire declared, France must be brought to heel. A puppet war goal is placed on the country."
 GER_attack_hungary_bav_desc:0 "Hungary was once part of the same crown, and it can be brought back. A puppet war goal is placed on it."
 GER_integrate_hun_desc:0 "The Hungarian crown joins the Reich. Its government is dissolved, its army transferred to ours and its lands are claimed as German core territory."
 GER_integrate_hun2_desc:0 "Hungary is offered a place in the Reich. Its lands are claimed as German core territory, and Budapest must decide how to answer."
 GER_coup_austria5_desc:0 "Vienna is asked to hold a referendum on union. The threat of the Reich hangs over the question, and the neighbouring capitals watch with alarm."
 GER_coup_cze5_desc:0 "Prague is asked to hold a referendum on union. The threat of the Reich hangs over the question, and the neighbouring capitals watch with alarm."
 GER_demand_swi_kaiser_desc:0 "The Alpine passes are of great value to the Reich. A demand is sent to Bern, and the Swiss must decide how to respond."
 GER_factorie_desc:0 "The member states of the federation rebuild their factories under a common programme. Industry is renewed in Bavaria, Württemberg, Hanover, Schleswig-Holstein and Mecklenburg."
 GER_local2_desc:0 "A common industrial project is launched across the federation. The same local industry programme is extended to Bavaria, Württemberg, Hanover, Schleswig-Holstein and Mecklenburg."
 GER_militarism_idea2_desc:0 "The army is the pride of the nation and the school of its youth. Soldierly values are taught from the first year, and military affairs gain a place in public life."
 GER_militarism_idea_bav_desc:0 "The army is the pride of the nation and the school of its youth. Soldierly values are taught from the first year, and military affairs gain a place in public life."
 GER_militarism_idea_general_desc:0 "The generals are given a greater say in the running of the state. Soldierly values are taught from the first year, and military affairs gain a place in public life."
 GER_militarism_idea_habsburg_desc:0 "The army is the pride of the nation and the school of its youth. Soldierly values are taught from the first year, and military affairs gain a place in public life."
 GER_second_four_year_plan3_desc:0 "A second plan is drawn up to prepare the economy for war. For the next four years, the Reich will concentrate on industry and the supply of raw materials."
 GER_second_four_year_plan_habsburg_desc:0 "A second plan is drawn up to prepare the economy for war. For the next four years, the Reich will concentrate on industry and the supply of raw materials."
 GER_take_baltics_bav_desc:0 "The Baltic states are small and cannot resist for long. Those already under our influence are annexed, and war goals are placed on the others."
 GER_take_balticss3_desc:0 "The Baltic states are small and cannot resist for long. Those already under our influence are annexed, and war goals are placed on the others."
 GER_attack_iberia_bav_desc:0 "The Pyrenees are no obstacle for an army with a purpose. Puppet war goals are placed on Spain and Portugal."
 GER_militarism_idea2_new_desc:0 "Conscription is widened, and more men are called to the colours. The army grows, and so does the demand placed on the nation."
 GER_militarism_idea2_new2_desc:0 "The old Prussian virtues of duty, order and sacrifice are held up as the model for the nation. They replace the broader conscription programme."
 GER_militarism_idea2_new3_desc:0 "Blood and iron forged the empire, and blood and iron will keep it. The nation is told that its future will be decided on the battlefield."
 GER_civillian_factory_habsburg_desc:0 "The Habsburg lands are rich in agriculture, and the countryside is brought into the industrial plans. New civilian industry takes root in the core states."
 GER_military_factory_habsburg_desc:0 "The capital supplies the army, and new arms works are raised in the cities. Military production grows in the core states."
