 ### Descriptions for variant focuses in the German Kaiser tree (germany_kaiser)

 GER_african_allies2_desc:0 "The people of Africa yearn for liberation from the Europeans. Perhaps we can lure them to our side with promises of autonomy if they join us."
 GER_all_for_the_front_bav_desc:0 "Every man will have to give his heart, blood and soul to the German nation if he wishes for his fatherland to reclaim its former glory. Everything we make should be for the front, and it is a reality our people will have to understand with time."
 GER_all_for_the_front_habsburg_desc:0 "Every man will have to give his heart, blood and soul to the German nation if he wishes for his fatherland to reclaim its former glory. Everything we make should be for the front, and it is a reality our people will have to understand with time."
 GER_anglo_germanic_cooperation_program2_desc:0 "The Royal Navy possesses vast knowledge of shipbuilding and naval combat. Thanks to our close cooperation, we may be able to gain and make use of knowledge that the British have previously kept a close-guarded secret."
 GER_anglo_germanic_defense_pact2_desc:0 "The British have been our enemies for a long time, but with recent developments, we may be able to score a defensive agreement with them stating that if anyone attacks one of us, they attack both. This will be a great step in the normalization of relations with their state."
 GER_asian_allies2_desc:0 "There are many minor nations in Asia that have not fallen under control of our enemies. Perhaps with promises of a secure future and territorial gains, they would be willing to aid us in our global conflict."
 GER_attack_beneluxx_desc:0 "If we want to ensure a tactical advantage against France we need to be able to hit them from all sides. They will not expect an attack from the North, which is exactly where we will hit them from, once we've disposed of a few obstacles."
 GER_attack_beneluxx2_desc:0 "If we want to ensure a tactical advantage against France we need to be able to hit them from all sides. They will not expect an attack from the North, which is exactly where we will hit them from, once we've disposed of a few obstacles."
 GER_attack_uk_desc:0 "The geographical position of [ENG.GetNameDef] has proven a complicating factor in our current war effort. Launching an all out offensive operation from both the air and the sea seems the best course of action to finally break the [ENG.GetAdjective]!"
 GER_attack_uk2_desc:0 "The geographical position of [ENG.GetNameDef] has proven a complicating factor in our current war effort. Launching an all out offensive operation from both the air and the sea seems the best course of action to finally break the [ENG.GetAdjective]!"
 GER_attack_uk3_desc:0 "The geographical position of [ENG.GetNameDef] has proven a complicating factor in our current war effort. Launching an all out offensive operation from both the air and the sea seems the best course of action to finally break the [ENG.GetAdjective]!"
 GER_attack_uk_bav_desc:0 "The geographical position of [ENG.GetNameDef] has proven a complicating factor in our current war effort. Launching an all out offensive operation from both the air and the sea seems the best course of action to finally break the [ENG.GetAdjective]!"
 GER_attack_usa_bav_desc:0 "With the vanquishing of all continental opposition to our rule, we must see to re-focusing our production effort to the creation of a huge navy, so that we may bring the fight to the British and the Americans. We shall not rest, until in God's good time, the Old World, with all its power and might, steps forth to the subjugation and humiliation of the new."
 GER_attack_usaa_desc:0 "With the vanquishing of all continental opposition to our rule, we must see to re-focusing our production effort to the creation of a huge navy, so that we may bring the fight to the British and the Americans. We shall not rest, until in God's good time, the Old World, with all its power and might, steps forth to the subjugation and humiliation of the new."
