l_english:
GFTR_E_independence.1.t: "War for Independence!"
GFTR_E_independence.1.d: "Our patience has run out. This is our land, and we will decide its fate as we see fit. Today we begin the fight against the invaders and occupiers who came to our soil, imposed their will and culture upon us, enslaved our people, and planted their flag in our earth."
GFTR_E_independence.1.a: "Let their blood flow!"
# # # # # # # # # # # # # # #
GFTR_E_independence.2.t: "A Letter of Request"
GFTR_E_independence.2.d: "Today we received an official appeal from our puppet state. They demand a revision of our influence, wish to have their own voice in foreign and domestic policy, and are effectively declaring their desire to become a fully independent nation. The message is still restrained and diplomatic—for now—but at the snap of a finger it could turn into open war."
GFTR_E_independence.2.a: "No concessions!"
GFTR_E_independence.2.b: "We are prepared to grant them independence."
GFTR_E_independence.2.c: "Traitors! Out of our alliance!"
GFTR_E_independence.2.d: "The army will restore order."
# # # # # # # # # # # # # # #
GFTR_E_independence_response.0.t: "Bad News"
GFTR_E_independence_response.0.d: "This morning began with a knife in the back: our former puppet state has suddenly declared independence and attacked the troops we had stationed on their territory. Our attempts at negotiation were flatly rejected."
GFTR_E_independence_response.0.a: "They want war? They shall have it!"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.1.t: "Refusal"
GFTR_E_independence_response.1.d: "A few days ago we sent a request for independence, but today we received a categorical refusal. The overlord has no intention of letting us go and has rejected any discussion of the matter. Diplomacy has reached a dead end."
GFTR_E_independence_response.1.a: "Then we shall fight!"
GFTR_E_independence_response.1.b: "Very well…"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.2.t: "We Are Free!"
GFTR_E_independence_response.2.d: "Good news! The overlord has officially recognised our independence. From this day forward we chart our own destiny. For our people this is a historic day that will be written in the history books."
GFTR_E_independence_response.2.a: "Hooray! Hooray! HOORAY!"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.3.t: "Freedom with a Bitter Taste"
GFTR_E_independence_response.3.d: "Today we received an ambiguous reply from the overlord. We have been branded traitors! Although we have obtained independence, our former master has severed all diplomatic ties with us. We are free, but alone in these turbulent times. Despite the harsh words, we have avoided armed conflict."
GFTR_E_independence_response.3.a: "The important thing is that it ended peacefully."
# # # # # # # # # # # # # # #
GFTR_E_independence_response.4.t: "War for Independence"
GFTR_E_independence_response.4.d: "Our hopes for a diplomatic resolution to our subjugation collapsed today. Following our recent request, the overlord has moved troops to the border and is preparing an invasion to crush our desire for sovereignty. From this moment on, we fight not merely for the survival of our state."
GFTR_E_independence_response.4.a: "We shall endure!"
# # # # # # # # # # # # # # #
GFTR_E_change_of_power.1.t: "Elections are Over"
GFTR_E_change_of_power.1.d: "Honest democratic elections have taken place in the country. The people have made their choice."
GFTR_E_change_of_power.1.a: "Good"
# # # # # # # # # # # # # #
GFTR_E_change_of_power.2.t: "Seizure of Power"
GFTR_E_change_of_power.2.d: "The expected confrontation did not occur. The old regime acknowledged its defeat and relinquished its powers, handing control to the new government without a fight."
GFTR_E_change_of_power.2.a: "The Right Decision"
# # # # # # # # # # # # # #
GFTR_E_change_of_power.3.t: "Civil War!"
GFTR_E_change_of_power.3.d: "The political crisis has reached its limit. The country has split into two warring factions, and the struggle for power has escalated into open armed conflict."
GFTR_E_change_of_power.3.a: "We Will Prevail"