 RP_GER_initiateoperationreuss:0 "Initiate §YOperation Reuss§!"
 RP_GER_initiateoperationreuss_reffect_tt:0 "After the timer concludes, all nations under the §YParticipants§! list will declare war on all selected §RTargets§!. Additionally, these targets will be unable to join a faction.\n\nAll §gNon-Combatants§!, who rejected joining the operation, will leave the faction and will be unable to join a faction until you take the §YDeclare Victory§! decision, after which they will be added back.\n\n§RDev Note: I know this seems weird, but there isn't a reliable way to keep AI from joining the war against specific nations, that we know of§!." 
