 # Mittelafrika

 RP_realizing_mittelafrika:0 "Realizing Mittelafrika"
 RP_realizing_mittelafrika_desc:0 "As German dominance expands around the world, it has become possible to restore an old idea of the Kaiser.\n\nMittelafrika was once a dream of [GER.GetNameDef]. Spanning from the Ivory Coast to the Indian Ocean and from Namibia to Tanzania, it would be focused on exploiting local resources and funding the Kaiserreich.\n\nMittelafrika, if established, will be a show of prestige for the whole world to see, and will no doubt fund the greater conquests of [GER.GetNameDef]."
