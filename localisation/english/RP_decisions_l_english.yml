 # i am Leopold and this is my Plot

 RP_leopoldplot:0 "The Leopold Plot"
 RP_leopoldplot_desc:0 "The Spanish Civil War opened a unique opportunity to expand our sphere of influence even further into Southern Europe. If we build enough influence in war battered Spain, we could force the overthrow of the new government, and install a new pro-German government.\n\nWe can build influence by aiding the new government with money, volunteers, and military advisors. Additionally, we can pressure local Spanish settlements and spread pro-german propaganda across Iberia.\n\nFurthmore, we will need to manage Spanish awareness of the project, as to prevent interference or crackdowns on our growing influence. We can do this through bribing Spanish officials to look away, managing our caution levels in the project, or through brute force.\n\nAverage Influence: [?RP_leopoldplot_averageinfluence| %%Y0..1]\n        - Military Influence: [?RP_leopoldplot_militaryinfluence| %%Y0..1]\n        - Economy Influence: [?RP_leopoldplot_economyinfluence| %%Y0..1]\n        - Political Influence: [?RP_leopoldplot_administrativeinfluence| %%Y0..1]\n\nChance for Spanish Interference: [?RP_leopoldplot_crackdownchance| %%Y0..1]"
