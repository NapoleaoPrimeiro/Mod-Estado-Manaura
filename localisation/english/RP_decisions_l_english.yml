 # Operation Ruess

 RP_operation_reuss:0 "Operation Reuss"
 RP_operation_reuss_desc:0 "The Balkans are one of the last remaining holdouts that is not under our direct control or influence in Europe. We need to make sure our enemies can not take advantage of the region, and launch an operation to end enemy influence there."
