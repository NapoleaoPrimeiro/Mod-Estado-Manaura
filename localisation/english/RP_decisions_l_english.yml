 # Second-Russo German War

 RP_second_russo_german_war:0 "Second Russo-German War"
 RP_second_russo_german_war_desc:0 "The time has arrived once more to overcome the Russian bear. Our victory against the Russian Empire in 1917 proves it is possible, but we face more challenges this time. A more experienced army, a people dedicated to defending their great leader and nation, and an advancement in warfare technology means it will not be as easy as the Great War.\n\nOur generals have prepared their finest plans, and our people are ready for war. Here, you can manage the objectives for the war, as well as manage any territories you might occupy.\n\nAfter we have dealt a big enough blow to the enemy, it is likely their government, and with it, their war effort, will collapse.\n\n§YDeveloper Note§!: It is HIGHLY recommended to use micromanagement heavily during the conflict, to maximize the benefits of completing objectives. Once a city falls without it's objective being selected, you lose that objectives' bonuses."
 RP_rgw_declarevictory_overrussia:0 "The Smolensk Proclamation"
 RP_rgw_declarevictory_overrussia_trigger_tt.1:0 "Controls all of §YLithuania§!, §YEastern Poland§!, §YBelarus§!, and §YWestern Ukraine§!. States that aren't owned by [SOV.GetNameDef] don't count."
 RP_rgw_declarevictory_overrussia_trigger_tt.3:0 "One of the following must be true:\n    Controls all of §YLatvia§! and §YEstonia§!\n    Controls all of §YEastern Ukraine§!"
 RP_rgw_declarevictory_overrussia_trigger_tt.2:0 "At least §Y4§! objectives outside of the §YHighlighted Region§! have been §Gcompleted§!."
 RP_rgw_declarevictory_overrussia_effect_tt.1:0 "Over the next ~6 months, we will gradually decrease operational fighting on the eastern front, until we have secured a de-facto border with our enemies and relative peace across the front.\n\nDuring this time, we will need to focus on consolidating our conquered territories, removing resistance and justifying our annexation of these lands."
 RP_rgw_declarevictory_overrussia_effect_tt.2:0 "Our offensive will halt almost entirely, and all bonuses of a deorganized enemy will be lost."
 RP_rgw_declarevictory_overrussia_effect_tt.3:0 "A relative, tenuous peace will be achieved across the front. However, any instability might trigger extensive fighting once more.."
 RP_rgw_declarevictory_overrusia_effect_wewillannex_tt:0 "We will annex all of the following at the end of the timer:\n    §YFormer Lithuanian Territories§!\n    §YEastern Poland§!\n    §YBessarabia§!"
