 RP_puppets_integrateterritory:0 "Territorial Integration Process"
 RP_puppets_integrateterritory_desc:0 "Just because a nation, or new government, is established, it does not mean the people will accept it.\n\nIn order to be any use to [GER.GetNameDef], we must integrate our population, whether through peaceful means or not, to allow our economy and military industry to benefit our overlords. This will take alot of time and coordination between our various administrative departments. However, it will eventually succeed, just as we always do."
