KLV_austrian_support:0 "If §YCatholic§! support is at §Y100§!, §YAustria§! will also side with us"
KLV_army_generals:0 "Recruits 3 §YGenerals§! and a §YChief of the Army§!"
KLV_rebuildthearmy:0 "We must begin rapidly rearming ourselves in order to secure both our internal security and our borders against any resurgent §RRussian threat§!. \n\nHowever, our military capacity remains insufficient for any sizable rearmament program, therefore we shall call upon §YGermany§! to provide §Gweapons and equipment§! to supply our armed forces. \n\nShould §YGermany§! §Rreject§! this, we will have to arm our army ourselves."
KLV_jewel_of_the_east_tooltip:0 "Utilizing our new §Gindustrial capacity§!, we will undertake a §Ymassive revitalization and development project§!, aiming to significantly increase the standard of living within the §YBaltic Duchy§!. \n\nAdditionally, the project intends to cultivate a §Ythriving tourism industry§!, positioning the §4Baltic coast§! as the premier destination for German tourists and a §Yshowcase of what our young nation has achieved§!. \n\nHowever, this project will be incredibly costly and difficult to undertake alone, therefore we will petition §YGermany§! to provide §Gfinancial backing§!."
KLV_estonian_development_tooltip:0 "Adds §G1§! §YInfrastructure§!, and §G2§! §YCivilian Factories§! and §YBuilding Slots§! in every §YEstonian State§!"
KLV_latvian_development_tooltip:0 "Adds §G2§! §YInfrastructure§! and §G1§! §YCivilian Factory§! and §YBuilding slot§! in every §YLatvian State§!"
KLV_dotted_line_tooltip:0 "-----------------------------------------------------------------"
KLV_dockyard_development_tooltip:0 "Adds §G1§! §CDockyard§! in §YRiga, Harju, and Kurzeme§!"
KLV_integrate_into_germany_tooltip:0 "Ever since the §4Northern Crusades§! of the 12th and 13th centuries, the §YBaltics§! have had significant §YGerman§! minorities. \n\nChristianized by the §YLivonian Order§! and governed under the §YState of the Teutonic Order§!, the region was administered as a §YGerman state§!, with the §YGerman§! ruling class established during this period lasting all the way until the conclusion of the §YGreat War§! and the §YBaltic§! wars of independence. \n\nNow, with the completion of our §RGermanization programs§!, and our §Geconomic integration§! into §YGermany§!, the time has come to officially unite once more with the §YGerman Empire§!."
KLV_germanize_focus:0 "The [KLV.GetName] will go down the §YDestroy Baltic Nationalism§! path, along with instituting §RGermanization programs§!. This will take §Y140§! days in total to complete, but it will completely remove the §YBaltic Resistance§! national modifier."
KLV_cooperation_focus:0 "The [KLV.GetName] will go down the §YPeaceful Coexistence§! path, along with granting concessions to the §YBaltic Nationalists§!. This will only take §Y70§! days in total to complete, but it will not entirely remove the §YBaltic Resistance§! national modifier."
KLV_germanize_integration_focus:0 "The [KLV.GetName] will go down the §YDestroy Baltic Nationalism§! path, along with instituting §RGermanization programs§!. This will take §Y140§! days in total to complete, but it will completely remove the §YBaltic Resistance§! national modifier. \n\nAdditionally, they will integrate into the §YGerman Empire§!."



