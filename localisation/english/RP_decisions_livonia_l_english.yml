KUK_breadbasket_tooltip:0 "§YUkraine's§! black earth soil, or §YChernozem§!, has long made §YUkraine§! one of the most §Gfertile lands§! in §YEurope§!. Being referred to as the §GBreadbasket§! of §YEurope§!, §YUkraine§! plays a crucial role in the global wheat trade. \n\nNow, with the defeat of §RSoviet Russia§!, and the total solidification of §YGerman hegemony§! over the east, §YGermany§! intends to restart their program of §Ygrain requisitioning§!, ensuring they can never fall victim to another §4naval blockade§!. \n\nHowever, if this program is §Rmismanaged§!, it could have §Rdire effects§! on the §YUkrainian§! populace, already scarred from the tragedies of the §RHolodomor§!."

