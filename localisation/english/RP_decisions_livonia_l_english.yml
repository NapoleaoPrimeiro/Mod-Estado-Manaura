# Categories
 KLV_bavarian_rebellion_category:0 "The Bavarian Rebellion"
 KLV_bavarian_rebellion_category_desc:0 "In order to defeat Germany, we should begin coordinating a Catholic rebellion. \n\nThe best place to do such a thing is Bavaria, having a predominately Catholic population. Additionally, it may be worth it to investigate the possibility of gaining Austria's support. \n\nBy forming pro-Catholic militias in Bavaria, collaborating with regional officials, and constructing preliminary fortifications, we'll be able to create a pretty formidable ally in the south in the event of war with Germany. \n\nCatholic Support: [?KLV_bavarian_catholic_support| %%Y0..1]"

 KLV_army_managment:0 "Armed forces of the Livonian Order"
 KLV_army_managment_desc:0 "The state of our army, is to put it bluntly, disgraceful. Should we have any hope at fulfilling our ambitions, we'll need to put serious effort into raising a proper army. \n\nHowever, our generals have already devised a strategy in which to wage warfare. By utilizing Ritterbrüder or "Knight Brother" divisions as mobile shock infantry creating openings in frontlines, we can then quickly exploit them using light cavalry Dienstbrüder or "Serving Brother" divisions. In order to not overstretch our frontlines during war times, we should also raise regional Gastbrüder or "Guest Brother" Militias, serving similar roles to the German Freikorps, a temporary volunteer force."

 RP_bread_basket_europe:0 "The Breadbasket of Europe"
 RP_bread_basket_europe_desc:0 "Ukraine, also known as the Breadbasket of Europe, holds some of the most valuable agricultural regions in the entirety of Europe. In 1908, Ukraine accounted for 21% of the global wheat trade, and 71% of the Russian Empire's surplus wheat supply. \n\nNow, with the fertile lands of Ukraine firmly under our control once more, we can restart the process of grain requisitions, ensuring our independence from international wheat trade. \n\nHowever, we have to be careful with our requisitions, as not too long ago the Ukrainians faced an extreme famine caused by the Soviet Union, and should we cause another famine, our grip on Ukraine may falter. \n\nCurrently, we have requisitioned [?KUK_requisitioned_amount| %%Y0] of Ukraine's surplus grain, and if we reach [?KUK_requisitioning_limit| %%Y0], Ukraine will enter a famine."

 KUK_ukrainian_border_raids:0 "Ukrainian Border Raids"

