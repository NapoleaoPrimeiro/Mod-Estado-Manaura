 RP_newsevents.1.t:0 "[FRA.GetNameDefCap] Signs Peace with [GER.GetNameDef]"
 RP_newsevents.1.d:0 "\nEarlier today, [FRA.GetLeader] and [GER.GetLeader] formally signed the Treaty of Sedan, ending the war between the two countries.\n\nThe treaty comes after the crippling defeat of Allied forces in Western Europe, ultimately resulting in the Fall of Paris and the installation of a provisional government in Marseilles. Following the defeat, an armistace was signed and peace negotiations began. [GER.GetNameDefCap] and it's allies has expanded greatly into French territory, which will certainly help in any future war efforts.\n\nWhatever happens next, it is clear German dominance in Western Europe is secured."
 RP_newsevents.1.a:0 "Retribution for the Great War!"
 RP_newsevents.1.b:0 "We did what we had to do.."
 RP_newsevents.1.c:0 "Traitors!"
 RP_newsevents.1.e:0 "There is blood in the water, and I am the shark.."
 RP_newsevents.1.f:0 "Fuck!"
 RP_newsevents.1.g:0 "What an interesting turn of events"

 RP_newsevents.2.t:0 "The Smolensk Proclamation"
 RP_newsevents.2.d:0 "This morning, [GER.GetLeader] announced the end of military operations on the Eastern Front in a speech to his constituents in Smolensk, Russia.\n\nFighting has been gradually decreasing for the last 6 months, which some believed was in an attempt to coerce [SOV.GetNameDef] into a peace deal. If this were the reason, it failed in it's goals. [SOV.GetLeader] had been very uncooperative in the proposal of an armistace between the two powers.\n\nAlthough an official treaty was not signed, [GER.GetNameDef] announced the annexation of most occupied territories, effectively securing a new, de-facto border in the east."
 RP_newsevents.2.a:0 "For the second time in 40 years, we have killed the Russian bear."
 RP_newsevents.2.b:0 "This isn't even a real treaty! It's fake news!"
 RP_newsevents.2.c:0 "Let's hope the [SOV.GetAdjective]s don't do anything too drastic.."

 # Paris Peace Treaty

 RP_parispeaceevents.1.t:0 "Paris Falls"
 RP_parispeaceevents.1.d:0 "As the war with [GER.GetNameDef] grows increasingly against our favor, the resolve of our great nation to continue the war, just like the frontlines, collapses. \n\nToday, the frontline reached Paris, the capital of our government. German troops stormed the destroyed Elysee Palace in the morning, followed by the Palais Bourbon and Palais du Luxembourg in the afternoon. This, coupled with the capture of major bridges in the Seine, means Paris is effectively under German control.\n\nWhat remains of the Parisian government has fleed South, and are now housed in Marseille. Now, many in the government and military are demanding a peace treaty, and threatening a full coup d'etat if we refuse. What should we do?"
 RP_parispeaceevents.1.a:0 "Peace with Honor.. right?"
 RP_parispeaceevents.1.b:0 "To hell with them! We will go on to the end!"

 RP_parispeaceevents.2.t:0 "The French Plead for Peace"
 RP_parispeaceevents.2.d:0 "Following our glorious victory over the French in the Battle of Paris, what remains of the government has begun begging for an armistace and a peace treaty.\n\nWith the frontline quickly collapsing for the French, we could make some heavy demands in the treaty, and punish them just as they punished us 20 years ago. However, we could also make a lighter peace deal, annexing only what we lost, and a few colonies.\n\nAlternately, we could reject the peace treaty entirely, wait to overrun the entirety of France and her allies, and make much harsher demands."
 RP_parispeaceevents.2.a:0 "We will agree to an armistice!"
 RP_parispeaceevents.2.b:0 "We will accept nothing less than the full destruction of the enemy!"
 RP_parispeaceevents.armistaceeffect_tt:0 "An armistace will be enacted with §Y[FRA.GetNameDefCap]§!, which will have the following effects:\n1.      All French territory occupied by us or our allies will be demilitarized and France will not be able to continue their alliance with our enemies.\n\n2.      In the event this armistace is accepted, it is very likely [FRA.GetLeader] will be replaced by a Provisional Government."

 RP_parispeaceevents.3.t:0 "[GER.GetNameDefCap] Rejects.."
 RP_parispeaceevents.3.d:0 "[GER.GetNameDefCap] has rejected our offer for a conditional peace, stating they will only accept an unconditional surrender. War rages on.."
 RP_parispeaceevents.3.a:0 "Oh.."

 RP_parispeaceevents.4.t:0 "Deciding our Terms - Mainland France"
 RP_parispeaceevents.4.d:0 "The first part of deciding our terms is the fate of mainland france. Our generals and advisors have given us 3 options:\n\n1 - Annex [28.GetName] and perhaps even the [29.GetName].\n\n2 - Establish a buffer state in Northern France centered around the Seine River, as well as [15.GetName].\n\n3 - Continue our occupation in the northern half of France, under [KFR.GetLeader]. The new border would go from southern Brittany to the Swiss Alps.\n\n\nIn addition to this, we will annex whatever other territory we control in Western Europe."
 RP_parispeaceevents.4.a:0 "We will force only minor concessions"
 RP_parispeaceevents.minormainlandconcessions_tt:0 "We will annex §Y[28.GetName]§! and §Y[29.GetName]§! if at war with §Y[BEL.GetNameDef]§!.\n\nIf §Y[ITA.GetNameDef]§! is in our faction, they will annex §Y[735.GetName]§! and §Y[1.GetName]§!.\n\n§Y[FRA.GetNameDefCap]§! will be forced to recognize our control over §Y[LUX.GetNameDef]§!, §Y[BEL.GetNameDef]§!, §Y[HOL.GetNameDef]§!, and §Y[SWI.GetNameDef]§! if we happen to be occupying them at the signing of the treaty.\n\n§Y[FRA.GetNameDefCap]§! will be §GVery Likely§! to accept this proposal."
 RP_parispeaceevents.4.e:0 "We will establish a buffer state"
 RP_parispeaceevents.bufferstate_tt:0 "We will annex all French territory up to the §YSeine River§!, as well as §Y[15.GetName]§!.\n\nIf §Y[ITA.GetNameDef]§! is in our faction, they will annex §Y[735.GetName]§! and §Y[1.GetName]§!.\n\n§Y[FRA.GetNameDefCap]§! will be forced to recognize our control over §Y[LUX.GetNameDef]§!, §Y[BEL.GetNameDef]§!, §Y[HOL.GetNameDef]§!, and §Y[SWI.GetNameDef]§! if we happen to be occupying them at the signing of the treaty.\n\n§Y[FRA.GetNameDefCap]§! will be §YLikely§! to accept this proposal."
 RP_parispeaceevents.4.b:0 "We will continue our occupation in the North"
 RP_parispeaceevents.northernmainland_tt:0 "We will annex all French territory in the northern half of the country§!.\n\nIf §Y[ITA.GetNameDef]§! is in our faction, they will annex §Y[735.GetName]§! and §Y[1.GetName]§!.\n\n§Y[FRA.GetNameDefCap]§! will be forced to recognize our control over §Y[LUX.GetNameDef]§!, §Y[BEL.GetNameDef]§!, §Y[HOL.GetNameDef]§!, and §Y[SWI.GetNameDef]§! if we happen to be occupying them at the signing of the treaty.\n\n§Y[FRA.GetNameDefCap]§! will be §OSomewhat Likely§! to accept this proposal."
 RP_parispeaceevents.4.c:0 "We will take it all!"
 RP_parispeaceevents.fullmainland_tt:0 "We will annex §YALL§! French territory on the Mainland, including §Y[1.GetName]§!.\n\nIf §Y[ITA.GetNameDef]§! is in our faction, they will annex §Y[735.GetName]§! and §Y[1.GetName]§!.\n\n§Y[FRA.GetNameDefCap]§! will be forced to recognize our control over §Y[LUX.GetNameDef]§!, §Y[BEL.GetNameDef]§!, §Y[HOL.GetNameDef]§!, and §Y[SWI.GetNameDef]§! if we happen to be occupying them at the signing of the treaty.\n\n§Y[FRA.GetNameDefCap]§! will be §RUnlikely§! to accept this proposal."

 RP_parispeaceevents.5.t:0 "Deciding our Terms - French Colonial Empire"
 RP_parispeaceevents.5.d:0 "The second part of deciding our terms is the fate of the French Colonial Empire. Our generals and advisors have given us 4 options:\n\n1 - Annex no colonies of the French Empire\n\n2 - Annex colonies stolen from us following the end of the Great War, including Togoland and Cameroon\n\n3 - Annex the entirety of the French Congo as well as French Syria and Lebanon\n\nWhich should we choose?"
 RP_parispeaceevents.5.a:0 "No colonial concessions are necessary."
 RP_parispeaceevents.nocolonialconcessions_tt:0 "We will not force any concessions involving the §YFrench Empire§!\n\n§Y[FRA.GetNameDefCap]§! will be §GExtremely Likely§! to accept this proposal."
 RP_parispeaceevents.5.b:0 "We will only take what we lost."
 RP_parispeaceevents.minorcolonialconcessions_tt:0 "We will only annex the territory of §Y[773.GetName]§!, §Y[776.GetName]§!, and §Y[777.GetName]§!\n\nIf §Y[ITA.GetNameDef]§! is in our faction, they will annex §Y[458.GetName]§! and §Y[268.GetName]§!\n\n§Y[FRA.GetNameDefCap]§! will be §GVery Likely§! to accept this proposal."
 RP_parispeaceevents.5.c:0 "We will demand major concessions!"
 RP_parispeaceevents.majorcolonialconcessions_tt:0 "We will annex the French colonies in and around the §YCongo§! and §YTogoland§!\n\nIf §Y[ITA.GetNameDef]§! is in our faction, they will annex §Y[458.GetName]§! and §Y[268.GetName]§!\nIf §Y[TUR.GetNameDef]§! is in our faction, they will annex §Y[SYR.GetNameDef]§! and §Y[LEB.GetNameDef]§!. Otherwise, we will annex it.\n\n§Y[FRA.GetNameDefCap]§! will be §YSomewhat Likely§! to accept this proposal."
 RP_parispeaceevents.5.e:0 "We will take all of it!"
 RP_parispeaceevents.allfrenchcolonies_tt:0 "We will annex all French colonies in the world.\n\nIf §Y[ITA.GetNameDef]§! is in our faction, they will annex §Y[458.GetName]§! and §Y[268.GetName]§!\nIf §Y[TUR.GetNameDef]§! is in our faction, they will annex §Y[SYR.GetNameDef]§! and §Y[LEB.GetNameDef]§!. Otherwise, we will annex it.\n\n§Y[FRA.GetNameDefCap]§! will be §RUnlikely§! to accept this proposal.\n\nIf there are not any troops in the §YFrench West Indies§! within §Y4 weeks§! of this proposal being signed, §Y[USA.GetNameDef]§! will enact §YOperation Bastille§! and seize it.\n\nIf we do not have troops in the §YFrench East Indies§! within §Y8 Weeks§! of the proposal being signed, §Y[JAP.GetNameDef]§! will initiate §YKinsen Sakusen§! and annex it."

 RP_parispeaceevents.11.t:0 "Deciding our Terms - Economic Subjugation"
 RP_parispeaceevents.11.d:0 "The last major piece of the treaty is deciding what we should do to the French economy. The war has brought major devastation to our nation and allies, and we could very easily get some "free loans" from France.\n\nAdditionally, we could restrict their economy even more, instating restrictions on production and construction."
 RP_parispeaceevents.11.a:0 "No economic restrictions will be imposed"
 RP_parispeaceevents.noreparations_tt:0 "We will not enforce any restrictions or reparations against the French economy.\n\n§Y[FRA.GetNameDefCap]§! will be §GVery Likely§! to accept this proposal."
 RP_parispeaceevents.11.b:0 "We will force war reparations."
 RP_parispeaceevents.warreparations_tt:0 "§Y[FRA.GetNameDefCap]§! will be forced to give us supplies and funds to assist in rebuilding the nation.\n\n§Y[FRA.GetNameDefCap]§! will be §GLikely§! to accept this proposal."
 RP_parispeaceevents.11.c:0 "We will slightly restrict their economy."
 RP_parispeaceevents.minoreconomicsubjugation_tt:0 "§Y[FRA.GetNameDefCap]§! will be forced to give us supplies and funds to assist in rebuilding the nation. Additionally, the production of goods and factories will be somewhat restricted.\n\n§Y[FRA.GetNameDefCap]§! will be §YSomewhat Likely§! to accept this proposal."
 RP_parispeaceevents.11.e:0 "We will install major economic restrictions."
 RP_parispeaceevents.completeeconomicsubjugation_tt:0 "§Y[FRA.GetNameDefCap]§! will be forced to give us supplies and funds to assist in rebuilding the nation. Additionally, the production of goods and factories will be incredibly restricted.\n\n§Y[FRA.GetNameDefCap]§! will be §RLess Likely§! to accept this proposal."

 RP_parispeaceevents.6.t:0 "[GER.GetNameDefCap] Dictates Peace"
 RP_parispeaceevents.6.d:0 "[GER.GetNameDefCap] has returned to the table with it's terms for peace."
 RP_parispeaceevents.6.a:0 "View Terms and Accept"
 RP_parispeaceevents.6.b:0 "View Terms and Reject"
 RP_parispeaceevents.minormainlandconcessions_tt.2:0 "§Y[GER.GetNameDefCap]§! will annex §Y[28.GetName]§! as well as the §Y[29.GetName]§! if they are currently occupying §Y[BEL.GetNameDef]§!.\n\nIf §Y[ITA.GetNameDef]§! was involved in the war and is allied with §Y[GER.GetNameDef]§!, they will annex §Y[735.GetName]§! and §Y[1.GetName]§!.\n\nWe will be forced to recognize German control over the territories they currently occupy in Western Europe."
 RP_parispeaceevents.northernmainland_tt.2:0 "§Y[GER.GetNameDefCap]§! will annex all French lands up to §Y[30.GetName]§!, §Y[24.GetName]§!, §Y[27.GetName]§!, and §Y[17.GetName]§!.\n\nIf §Y[ITA.GetNameDef]§! was involved in the war and is allied with §Y[GER.GetNameDef]§!, they will annex §Y[735.GetName]§! and §Y[1.GetName]§!\n\nWe will be forced to recognize German control over the territories they currently occupy in Western Europe."
 RP_parispeaceevents.fullmainland_tt.2:0 "§Y[GER.GetNameDefCap]§! will annex the entire French mainland as well as §Y[1.GetName]§!.\n\nIf §Y[ITA.GetNameDef]§! was involved in the war and is allied with §Y[GER.GetNameDef]§!, they will annex §Y[735.GetName]§! and §Y[1.GetName]§!\n\nWe will be forced to recognize German control over the territories they currently occupy in Western Europe."
 RP_parispeaceevents.nocolonialconcessions_tt.2:0 "§Y[GER.GetNameDefCap]§! will not annex any of our colonies"
 RP_parispeaceevents.minorcolonialconcessions_tt.2:0 "§Y[GER.GetNameDefCap]§! will annex the territory we took in Versailles, including §Y[773.GetName]§!, §Y[776.GetName]§!, and §Y[777.GetName]§!.\n\nIf §Y[ITA.GetNameDef]§! was involved in the war and is allied with §Y[GER.GetNameDef]§!, they will annex §Y[458.GetName]§! and §Y[268.GetName]§!."
 RP_parispeaceevents.majorcolonialconcessions_tt.2:0 "§Y[GER.GetNameDefCap]§! will annex the entirety of the French Congo as well as Togoland.\n\nIf §Y[ITA.GetNameDef]§! was involved in the war and is allied with §Y[GER.GetNameDef]§!, they will annex §Y[458.GetName]§! and §Y[268.GetName]§!.\n\nIf §Y[TUR.GetNameDef]§! was involved in the war and is allied with §Y[GER.GetNameDef]§!, they will annex §Y[SYR.GetNameDef]§! and §Y[LEB.GetNameDef]§!, otherwise it will be given to §Y[GER.GetNameDef]§!."
 RP_parispeaceevents.allfrenchcolonies_tt.2:0 "§Y[GER.GetNameDefCap]§! will annex all French colonies throughout the world.\n\nIf §Y[ITA.GetNameDef]§! was involved in the war and is allied with §Y[GER.GetNameDef]§!, they will annex §Y[458.GetName]§! and §Y[268.GetName]§!.\n\nIf §Y[TUR.GetNameDef]§! was involved in the war and is allied with §Y[GER.GetNameDef]§!, they will annex §Y[SYR.GetNameDef]§! and §Y[LEB.GetNameDef]§!, otherwise it will be given to §Y[GER.GetNameDef]§!."
 RP_parispeaceevents.warreparations_tt.2:0 "§Y[FRA.GetNameDefCap]§! will be forced to give §Y[GER.GetNameCap]§! supplies and funds to assist in rebuilding the war-torn nation."
 RP_parispeaceevents.minoreconomicsubjugation_tt.2:0 "§Y[FRA.GetNameDefCap]§! will be forced to give §Y[GER.GetNameCap]§! supplies and funds to to assist in rebuilding the war-torn nation. Additionally, the production of factories and goods will be slightly restricted."
 RP_parispeaceevents.completeeconomicsubjugation_tt.2:0 ""§Y[FRA.GetNameDefCap]§! will be forced to give §Y[GER.GetNameCap]§! supplies and funds to to assist in rebuilding the war-torn nation. Additionally, the production of factories and goods will be restricted by a major amount."
 
 RP_parispeaceevents.7.t:0 "[FRA.GetNameDefCap] Accepts Terms!"
 RP_parispeaceevents.7.d:0 "[FRA.GetNameDefCap] has accepted our terms for peace. Our gains are secured, with peace alongside it. \n\n[FRA.GetLeader] and [GER.GetLeader] have begun their trip to Sedan to officially sign the treaty. The symbolic city, the site of one of the largest defeats in the Franco-Prussian war, as well as the Great War.\n\nBritish Officials have so far been silent about the treaty, and it is unknown how they will respond"
 RP_parispeaceevents.7.a:0 "This will never happen again!"

 RP_parispeaceevents.8.t:0 "[FRA.GetNameDefCap] Rejects Terms"
 RP_parispeaceevents.8.d:0 "[FRA.GetNameDefCap] has rejected our terms of surrender. [FRA.GetLeader] issued a statement stating that the conditions for peace were too radical to accept, and that the war will continue."
 RP_parispeaceevents.8.a:0 "We have already crushed them."

 RP_parispeaceevents.9.t:0 "Offer a White Peace?"
 RP_parispeaceevents.9.d:0 "As the war develops increasingly in favor of [GER.GetNameDef], many in Parliament are growing unfaithful in the ability of the military to win the war.\n\nThis feeling of unrest has been fanned by the recent Treaty of Sedan, in which our French allies abandoned the war following the Fall of Paris. Additionally, it seems there is little to no hope of reinstating our European allies any time in the next few years, and the Germans have, effectively, established a Fortress in Europe.\n\nEven more concerningly, protests and even riots have broken out across major cities and the countryside, with our own citizens chanting 'Why Die For Traitors?', in reference to the Treaty of Sedan.\n\nA new faction has formed in the government, demanding an end to the war. Their solution? A full white peace between our two nations. We recognize German control over the territories they currently occupy in Europe, and no border changes occur in our colonial empire.\n\nShould we make a proposal to [GER.capital.GetCapitalVictoryPointName]?"
 RP_parispeaceevents.9.a:0 "We will. Peace with Honor, they say."
 RP_parispeaceevents.9.b:0 "We will never surrender!"
 
 RP_parispeaceevents.10.t:0 "[ENG.GetNameDefCap] offers a White Peace?"
 RP_parispeaceevents.10.d:0 "As the war grew in our favor, so too did unrest in [ENG.GetNameDefCap]. In parliament, [ENG.GetAdjective] politicians formed a new group dedicated to ending the war. Additionally, protests and riots have broken out, with citizens chanting 'Why Die For Traitors!', a reference to their allies abandoning them in the war.\n\nIt seems [ENG.GetLeader] has given in, and sent a direct message to [GER.GetLeader], requesting negotiations for a white peace.\n\nShould we accept?"
 RP_parispeaceevents.10.a:0 "Yes, it's the better option."
 RP_parispeaceevents.10.b:0 "No, they will fold under little pressure anyways"

 RP_parispeaceevents.12.t:0 "Attack French Morocco?"
 RP_parispeaceevents.12.d:0 "As the war in Western Europe comes to an end, and [FRA.GetNameDef] becomes too weak to defend themselves, an opportunity has been opened.\n\nDespite being our former allies, the new government under [FRA.GetLeader] has been deemed hostile by our advisors. The new leadership will definitely be looking to rebuild and begin expanding, and we are their easiest target.\n\nHowever, they are currently disorganized and unable to wage war. We could launch a pre-emptive strike against the French Protectorate of Morocco, to disable their ability to wage war for even longer.\n\nShould we go ahead with this plan?"
 RP_parispeaceevents.12.a:0 "Yes. It is necessary for our survival."
 RP_parispeaceevents.12.b:0 "No, they are our allies!"

 RP_parispeaceevents.13.t:0 "[SFC.GetNameDefCap] attacks Morocco!"
 RP_parispeaceevents.13.d:0 "This morning, ground troops of [SFC.GetNameDef] crossed the border into French Morocco. Their government, led by [SFC.GetLeader] announced they aren't confident in our new government to protect their independence and are instead choosing to take over Morocco.\n\nOur government is now in chaos, after the recent defeats in Europe and now the new war in Africa. We are unable to defend our own territory and it might be best to let them annex Morocco. However, this might send a message to other nations that we are too weak to defend ourselves.\n\nWhat should we do?"
 RP_parispeaceevents.13.a:0 "We couldn't fight Germany, but we can fight you!"
 RP_parispeaceevents.13.b:0 "There is no point in trying."

 RP_parispeaceevents.14.t:0 "[SYR.GetNameDefCap] Breaks Off"
 RP_parispeaceevents.14.d:0 "This morning, the leader of [SYR.GetNameDef], [SYR.GetLeader], informed us that their confidence in our ability to protect them from foreign and internal threats has waned, and that they are declaring the Free State of Syria, independent from the French Empire.\n\nIt seems [LEB.GetNameDef] is considering similar actions, and we might lose our influence in the middle-east altogether. Do we invade to re-establish control over the Levant, or accept defeat once more?"
 RP_parispeaceevents.14.a:0 "War!"
 RP_parispeaceevents.14.b:0 "We are unable to defend ourselves in the Mainland, no way we will attack them too!"

 RP_parispeaceevents.15.t:0 "[LEB.GetNameDefCap] Breaks Off"
 RP_parispeaceevents.15.d:0 "This morning, the leader of [LEB.GetNameDef], [LEB.GetLeader], informed us that their confidence in our ability to protect them from foreign and internal threats has waned, and that they are declaring the Republic of Lebanon, independent from the French Empire."
 RP_parispeaceevents.15.a:0 "War!"
 RP_parispeaceevents.15.b:0 "We are unable to defend ourselves in the Mainland, no way we will attack them too!"

 RP_parispeaceevents.16.t:0 "Petain Storms [FRA.capital.GetCapitalVictoryPointName]!"
 RP_parispeaceevents.16.d:0 "Following the Treaty of Sedan, the general populace and the military have grown increasingly unhapy with the defeatist-ruled government. The national humiliation of the country and the stipulation posed by the treaty have cripped the once great nation.\n\nThe colonial government is in crisis, with locals growing eager to split from the French Empire, and the garrisons of our colonies are beginning to develop ideas of their own. Additionally, other major powers are eyeing our overseas territories, whether to protect themselves or expand their empire into our weakened nation.\n\nThis morning, former Minister of War and Chief of the Army Staff, Philippe Pétain, led a group of militia into [FRA.capital.GetCapitalVictoryPointName] and surrounded key government offices, demanding the resignation of the current government and the installation of himself as leader of a military-led government. \n\nWe have no choice to accept, as crowds of French citizens are gathering in all major cities and joining his demands, and will very likely become violent if we refuse."
 RP_parispeaceevents.16.a:0 "There is nothing we can do.."

 RP_parispeaceevents.17.t:0 "De Gaulle Coup!"
 RP_parispeaceevents.17.d:0 "Following the signing of the Treaty of Sedan, confidence in the new government is basically non-existent. The French people believe the government sold out their constituents to protect themselves and their grip on power.\n\nLate last night, various officers in the military publicly declared the creation of a new government, led by Charles de Gaulle. In addition to this, we are receiving word of French citizens revolting against the legitimate government.\n\nWe must, unfortunately, dissolve the government."
 RP_parispeaceevents.17.a:0 "There is nothing we can do.."

 RP_newsevents.3.t:0 "The French Republic Collapses!"
 RP_newsevents.3.d:0 "Yesterday, a French militia led by Philippe Pétain, a former commander of the French army, surrounded government offices in the city of [FRA.capital.GetCapitalVictoryPointName] and demanded the resignation of the old government.\n\nUnrest has been growing exponentially since the Treaty of Sedan, signed just a few weeks ago. French citizens began supporting the Petain coup after learning of it, causing violence to break out across major cities in France.\n\nThe former government announced the dissolution of the Third Republic after the hours long standoff between the republicans and the militia."
 RP_newsevents.3.a:0 "It was necessary"
 RP_newsevents.3.b:0 "Hopefully the new government is more beneficial than the last.."
 RP_newsevents.3.c:0 "A major blow to democracy"

 RP_newsevents.4.t:0 "The French Socialist Republic Collapses!"
 RP_newsevents.4.d:0 "Yesterday, the dissolution of the French Socialist Republic was officially announced. This comes just weeks after the Treaty of Sedan, and the international humiliation of France on the world stage.\n\nThe night before, multiple French generals declared the establishment of a new government, led by General Charles de Gaulle. Immediately after, multiple cities began revolting against the government, further pressuring the government to step down.\n\nThe Socialist government, which itself had only been in power for a few years, declared their intentions to step down, and are believed to have fled to [SOV.GetNameDef]."
 RP_newsevents.4.a:0 "It was necessary"
 RP_newsevents.4.b:0 "French instability continues.."
 RP_newsevents.4.c:0 "A major blow to socialism"
 
 # Russo German War

 RP_sovietwarevents.1.t:0 "A Message From Hell"
 RP_sovietwarevents.1.d:0 "Hi, Reichspakt+ Developers here again. Just popping in to ask, do you want to have a harder war? Personally, I've never been a fan of how easy it is to beat [SOV.GetNameDef] so quickly. So I made this option. The national spirit will last for 2 years, and will decrease offensive capabilities for both you and [SOV.GetNameDef]. Or not, either way, have fun!"
 RP_sovietwarevents.1.a:0 "No thanks, I don't wanna larp."
 RP_sovietwarevents.1.b:0 "Yes please! More hell!"

 RP_sovietwarevents.2.t:0 "Operation Pheonix"
 RP_sovietwarevents.2.d:0 "The clock had just struck the 9th hour of [?global.date.GetDateStringNoHourLong]. [SOV.GetLeader] and his workers at just begun working. However, 2 miles away, the final preparations were being made for a coup that will undoubtably define the next 60 years.\n\nIn less than an hour, [SOV.capital.GetName] has gone from a peaceful, quiet city, to a warzone. It started with a rain of gunfire upon multiple official buildings across the city. Following that, a barrage of explosions and smoke grenades and then an overwhelming force of militiamen capturing strategic bridges and roads throughout the entire area.\n\nLavrentiy Beria, along with multiple generals and senior officials of the government, have evidently grown underwhelmed with the lack of progress in the war, and are looking to dissolve the government and install a new one in it's place. The situation is dire and control over the city is waning. Should we surrender the government, or fight to the death?"
 RP_sovietwarevents.2.a:0 "It is hopeless.. we must give in. But we shall return!"
 
 # Leopold Plot

