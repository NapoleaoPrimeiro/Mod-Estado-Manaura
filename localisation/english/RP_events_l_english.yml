 RP_brazilian_empire.2.a:0 "They have proved a worth ally, give them the land"
 RP_brazilian_empire.2.b:0 "We have other plans for Uruguay."
 
 RP_LOFP.1.t:0 "Restore the Federal League?"
 RP_LOFP.1.d:0 "With the enlargement of [KUG.GetNameDef], the local administration simply cannot keep up. Some local collaborators have suggested re-establishing the Federal League. This would, strangely, involve the establishment of a democratic confederal state ruled by German colonists. While this may seem unsavory, we have ways of getting them to collaborate."
