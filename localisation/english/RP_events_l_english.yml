 # Yugoslav Restoration

 RP_yugoslavrestoration.1.t:0 "[KSR.GetNameDefCap] requests the Reunification of Yugoslavia"
 RP_yugoslavrestoration.1.d:0 "Yugoslavia, despite having been torn apart by ourselves and our allies, is still a prominent thought in many minds of the South Slavs. This has been made more true by the repeated declarations of [KSR.GetLeader], stating he will work towards the re-establishment of a South Slavic Kingdom for his people's.\n\nToday, [KSR.GetLeader] officially proposed the beginning of talks to restore Serbian control over Illyria, Slovenia, Bulgaria, and even Albania. This will without a doubt anger our vassal states, but it might be worth it, as Yugoslavia could make the stabilization of the region easier.\n\nUltimately, it is up to the Kaiser what we should do."
 RP_yugoslavrestoration.1.a:0 "We will throw them a bone."
 RP_yugoslavrestoration.1.b:0 "It is best to keep the region divided."
 RP_GER_yugoslavrestoration_tt.1:0 "Over the next few weeks, a conference will begin to discuss the future of the Balkans."

 RP_yugoslavrestoration.2.t:0 "Belgrade Conference - Fate of Illyria and Montenegro"
 RP_yugoslavrestoration.2.d:0 "As talks begin in Belgrade, the question of the regions of Croatia, Bosnia, and Montenegro are among the most important.\n\nThese territories were a part of the Kingdom of Yugoslavia just a few years ago, and it is the issue that [KSR.GetLeader] has been pressing for the most. Should we restore Serbian control over the region, or keep it under our influence?\n\nDenying this claim would effectively conclude reunification talks, and end the conference itself."
 RP_yugoslavrestoration.2.a:0 "It is rightfully theirs."
 RP_yugoslavrestoration.2.b:0 "We actually don't want a Yugoslavia.."
 RP_GER_yugoslavrestoration_tt.2:0 "\nAt the end of the conference, §Y[KSR.GetNameDef]§! will annex the territories in question.\n\nTalks will continue.."

 RP_yugoslavrestoration.3.t:0 "Belgrade Conference - Fate of Bulgaria"
 RP_yugoslavrestoration.3.d:0 "The Bulgarian people's are part of the Slavic group, however they were never a part of Yugoslavia, taking up the mantle of "Prussia of the Balkans", avoiding the unification of a South Slavic State up until the end of the Great War, where it was forced upon them.\n\nHowever, the opinion of the public is changing, as the speeches of [KSR.GetLeader] have emboldened the Bulgarian peoples, establishing the thought of Bulgarian and Serbian unity, rather than rivalry. \n\nShould we integrate our Bulgarian vassal into this new Yugoslav state, or conclude talks here?"
 RP_yugoslavrestoration.3.a:0 "It is the Kingdom of the South Slavs, no?"
 RP_yugoslavrestoration.3.b:0 "No, Bulgaria was never even a part of Yugoslavia!"
 RP_GER_yugoslavrestoration_tt.3:0 "\nAt the end of the conference, §Y[KSR.GetNameDef]§! will annex the territories in question.\n\nTalks will continue.."

 RP_yugoslavrestoration.4.t:0 "Belgrade Conference - Fate of Albania"
 RP_yugoslavrestoration.4.d:0 "Albania, despite not being part of the Slavic ethnicity, holds an incredibly strategic position to Yugoslavia. Allowing for control over the chokepoint into the Adriatic, which could be a major producer of wealth for the nation. Additionally, it would allow for an easier defense of it's coast, by blocking enemy ships into the Adriatic.\n\nShould we grant Albania into the Yugoslav Realm, or keep it's independence intact?"
 RP_yugoslavrestoration.4.a:0 "Just because it's the Kingdom of the South Slavs does not mean they have to be slavs."
 RP_yugoslavrestoration.4.b:0 "They're not even slavic!"
 RP_GER_yugoslavrestoration_tt.4:0 "\nAt the end of the conference, §Y[KSR.GetNameDef]§! will annex the territories in question.\n\nTalks will continue.."

 RP_yugoslavrestoration.5.t:0 "Belgrade Conference - Talks Conclude"
 RP_yugoslavrestoration.5.d:0 "The Conference in Belgrade, discussing the establishment of a Yugoslav state, have concluded after the months long discussion. The governments to be dissolved are now concluding the process to do so, and [KSR.GetLeader] has declared the Kingdom of Yugoslavia. \n\nIt will be a difficult process to reintegrate the Slavic peoples, and re-establish authority in the region, but it will be worth it long term."
 RP_yugoslavrestoration.5.a:0 "Wonderful!"

 # German Focuses

 RP_focustreeevents.5.t:0 "The Yemeni Question"
 RP_focustreeevents.5.d:0 "Two options are available for the future of Yemen. Option A involves making a deal with Yemen to sign into our alliance, in exchange for a guarantee to annex South Yemen. Option B involves a direct invasion, seizing control of the ports to control the Red Sea directly."
 RP_focustreeevents.5.a:0 "Option A"
 RP_focustreeevents.5.b:0 "Option B"

 RP_focustreeevents.10.t:0 "[GER.GetNameDefCap] Demands Galicia!"
 RP_focustreeevents.10.d:0 "[GER.GetNameDefCap] has demanded we hand over control of Galicia, as well as Krakow. Despite no real claim to the region, they say they believe the region deserves independence from ourselves.\n\nShould we give in, or should we fight?"
 RP_focustreeevents.10.a:0 "We must give in."
 RP_focustreeevents.10.b:0 "We will never surrender!"

 RP_focustreeevents.11.t:0 "[FROM.GetNameDefCap] Folds!"
 RP_focustreeevents.11.d:0 "[FROM.GetNameDefCap] has responded to our demands for Galicia, and have given in to our claims."
 RP_focustreeevents.11.a:0 "Perfect!"

 RP_focustreeevents.12.t:0 "[FROM.GetNameDefCap] Refuses!"
 RP_focustreeevents.12.d:0 "[FROM.GetNameDefCap] has refused our request to hand over the territories we claim. This is obviously an act of war."
 RP_focustreeevents.12.a:0 "They must be aware of the consequences"
 RP_focustreeevents.12.b:0 "We have bigger things to deal with"

 RP_focustreenewsevents.1.t:0 "[GER.GetFactionName] announces Operation Ruess!"
 RP_focustreenewsevents.1.d:0 "[GER.GetFactionName] has announced Operation Ruess, the invasion of [ROM.GetNameDef] and [YUG.GetNameDef]!\n\n[GER.GetNameDefCap] announced the full-scale invasion of the two nations early this morning. Several allied nations quickly joined in, and soon bombing raids began over Belgrade and Bucharest.\n\n[USA.GetNameDefCap] and [SOV.GetNameDef] both issued public denunciations of the invasion; however, with Europe in the firm grip of Germany, there is not much they can do."
 RP_focustreenewsevents.1.a:0 "We will crush them quickly!"
 RP_focustreenewsevents.1.b:0 "Good luck to them."
 RP_focustreenewsevents.1.c:0 "Long live our great nations!"
 RP_focustreenewsevents.1.e:0 "They can't keep getting away with this!"

 RP_frenchcollapsenews.1.t:0 "The Congolese Revolt"
 RP_frenchcollapsenews.1.d:0 "This morning, Congolese militiamen carried out raids against the Belgian colonial administration, now in exile after Germany’s victory in Europe. The deadliest attack came when five armed men stormed a government building in Brazzaville, killing twelve and injuring more than forty before escaping into the outskirts.\n\nThe assault reflects mounting resentment toward the exiled Belgian government, which relocated to Brazzaville after the armistice with Germany. Officials denounced the raids as “acts of treachery” and pledged to restore order, but with unrest spreading and Europe still unsettled, many fear the Congo is sliding into open revolt."
 RP_frenchcollapsenews.1.a:0 "Does this mean the Colonial Age for Africa is coming to an end?"

 RP_frenchcollapse.1.t:0 "[BEL.GetNameDef] moves government to Léopoldville"
 RP_frenchcollapse.1.d:0 "After Belgian forces were expelled from Europe, the former Belgian government relocated to Léopoldville. With this relocation now complete, [COG.GetNameDef] has been removed from power, and direct Belgian authority has been installed in its place."
 RP_frenchcollapse.1.a:0 "Fine.."
 
 RP_frenchcollapse.2.t:0 "The Congolese Revolt Begins"
 RP_frenchcollapse.2.d:0 "Earlier this morning, Congolese militiamen launched raids against our government. The most significant of these occurred when five men entered a government building in Léopoldville and opened fire. So far, 12 people have been killed and more than 40 injured.\n\nIt is clear that the Congo is now in full revolt."
 RP_frenchcollapse.2.a:0 "We will give in, the Belgian government will be no more."
 RP_frenchcollapse.2.b:0 "We will fight on, if necessary for years, if necessary alone!"

 RP_frenchcollapse.3.t:0 "Indochina Cuts Ties!"
 RP_frenchcollapse.3.d:0 "Georges Cautrox, leader of our colony in Indochina, has declared that the current regime is illegitimate and illegal. Because of this, they have stopped adhering to our government and declared independence from the French Empire.\n\nWe do not have the resources available to respond, and we will very likely have to accept our losses. Our government is too fresh and our nation itself is too unstable to effectively respond."
 RP_frenchcollapse.3.a:0 "We will return!"

 RP_frenchcollapse.4.t:0 "Invade Indochina?"
 RP_frenchcollapse.4.d:0 "The new regime in Indochina has opened an opportunity for us. They are weak and have little support from major powers. Should we begin a military operation to take the territories for ourselves?"
 RP_frenchcollapse.4.a:0 "We will seize the moment!"
 RP_frenchcollapse.4.b:0 "We have bigger problems to deal with."

 RP_frenchcollapse.5.t:0 "Invade Indochina?"
 RP_frenchcollapse.5.d:0 "The new regime in Indochina has opened an opportunity for us. They are weak and have little support from major powers. Should we begin a military operation to take the territories for ourselves?"
 RP_frenchcollapse.5.a:0 "We will seize the moment!"
 RP_frenchcollapse.5.b:0 "We have bigger problems to deal with."

 RP_frenchcollapse.6.t:0 "Seize the French West Indies?"
 RP_frenchcollapse.6.d:0 "As the [FRA.GetNameDef] continues to grow more unstable, many in the government have been calling to seize control of the French West Indies, securing them from the grasp of enemy regimes which could take the colony for themselves.\n\nThis could lead to a war with [FRA.GetNameDef]. However, it looks very unlikely, due to the instability of the new regime."
 RP_frenchcollapse.6.a:0 "For the protection of our country."
 RP_frenchcollapse.6.b:0 "We have bigger problems to deal with."

 RP_frenchcollapse.7.t:0 "[USA.GetNameDefCap] Invades the West Indies!"
 RP_frenchcollapse.7.d:0 "[USA.GetNameDefCap] has announced Operation Fauna, the invasion and annexation of our colonies in the Caribbean and South America, justifying this as a response to growing instability in the West Indies and the French Empire as a whole. \n\nShould we respond with a declaration of war, or let it be?"
 RP_frenchcollapse.7.a:0 "We have to let it go."
 RP_frenchcollapse.7.b:0 "We will protect our empire at any cost!"

 RP_frenchcollapse.8.t:0 "Formation of the United Arab Republic"
 RP_frenchcollapse.8.d:0 "[LEB.GetNameDefCap] has folded into our government, as planned at the declaration of our two nations' independence. This has resulted in the declaration of a new, joint government, and we shall call ourselves the United Arab Republic!"
 RP_frenchcollapse.8.a:0 "For the people!"

 RP_frenchcollapse.9.t:0 "Seize French India?"
 RP_frenchcollapse.9.d:0 "As tensions rise within [FRA.GetNameDef], it has become a priority to make sure no rebellion in the French Empire can spill into our own. One of the first points of tension is in French India. [RAJ.GetNameDef] has requested we invade the region and annex it, under their authority."
 RP_frenchcollapse.9.a:0 "Of course."
 RP_frenchcollapse.9.b:0 "Not at the moment."

 RP_frenchcollapse.10.t:0 "[ENG.GetNameDefCap] Invades French India!"
 RP_frenchcollapse.10.d:0 "[ENG.GetNameDefCap], along with [RAJ.GetNameDef], has launched an operation to invade and annex our colony in India. Should we respond militarily?"
 RP_frenchcollapse.10.a:0 "We have to let it go."
 RP_frenchcollapse.10.b:0 "We will protect our empire at any cost!"

 RP_frenchcollapse.11.t:0 "Seize French East Indies?"
 RP_frenchcollapse.11.d:0 "[JAP.GetNameDefCap]s expansionism has led to rising concerns of a possible Japanese invasion of the French East Indies. Should we launch a pre-emptive strike against [FRA.GetNameDef] in order to prevent such an attack?"
 RP_frenchcollapse.11.a:0 "Of course."
 RP_frenchcollapse.11.b:0 "Not at the moment."

 RP_frenchcollapse.12.t:0 "[ENG.GetNameDefCap] Invades the French East Indies!"
 RP_frenchcollapse.12.d:0 "[ENG.GetNameDefCap] has launched an attack against our colonies in the Pacific Ocean. Should we let the territory go or respond with force?"
 RP_frenchcollapse.12.a:0 "We have to let it go."
 RP_frenchcollapse.12.b:0 "We will protect our empire at any cost!"

 RP_frenchcollapse.13.t:0 "The Fall of Madagascar"
 RP_frenchcollapse.13.d:0 "Tensions in Madagascar have flared to an unbearable amount. Attacks on government offices and assassinations are happening almost weekly. Our government is just too overwhelmed with other problems to deal with it at the moment. Thus, it is time to pull our military out of the region."
 RP_frenchcollapse.13.a:0 "We will return!"

 RP_frenchcollapse.14.t:0 "Seize Madagascar?"
 RP_frenchcollapse.14.d:0 "The French have been unable to control Madagascar following the signing of the Treaty of Sedan, and have now resorted to pulling out of the region entirely, leaving it to near anarchy. Should we take the region and secure it's stability, or leave it alone?"
 RP_frenchcollapse.14.a:0 "For the safety of the people there."
 RP_frenchcollapse.14.b:0 "Not at the moment."

 RP_frenchcollapse.15.t:0 "West African Revolt"
 RP_frenchcollapse.15.d:0 "A major rebellion has begun in the Upper Volta and Niger regions. If we can not get this under control within the next few months, we will have to pull out and accept defeat."
 RP_frenchcollapse.15.a:0 "We will still fight!"
 RP_frenchcollapse.15_effect_tt:0 "If we can't defeat this rebellion within 2 months, we will peace out with them."

 RP_frenchcollapse.16.t:0 "Djibouti Breaks Away"
 RP_frenchcollapse.16.d:0 "Our colony in Djibouti has declared independence from us, stating they have no confidence in our ability to protect them anymore."
 RP_frenchcollapse.16.a:0 "We can't even reach them."
 RP_frenchcollapse.16.b:0 "War it is."

 RP_frenchcollapse.17.t:0 "Return of De Gaulle"
 RP_frenchcollapse.17.d:0 "After the rebellion in West Africa, a Republican coup overthrew the colonial government in Central Africa, declaring the Committee of National Liberation, led by De Gaulle."
 RP_frenchcollapse.17.a:0 "We defeated you once, we can do it again!"
 RP_frenchcollapse_addthirtydays_tt:0 "The amount of time until we have to pull out of the region will be increased by 30 days."

 RP_frenchcollapse.18.t:0 "Coup in the Ivory Coast"
 RP_frenchcollapse.18.d:0 "A second coup has occured in the Ivory Coast, and they have also declared their loyalty to the new government."
 RP_frenchcollapse.18.a:0 "We can still turn this around!"
 RP_frenchcollapse_addtendays_tt:0 "The amount of time until we have to pull out of the region will be increased by 10 days."

 RP_frenchcollapse.19.t:0 "West Africa Secedes"
 RP_frenchcollapse.19.d:0 "After a joint conference in Algiers, 4 nations that compromise the remainder of French West Africa have declared their independence from the French Empire, with their intentions to form an alliance with each other to protect against the new threats."
 RP_frenchcollapse.19.a:0 "They will die without us."

 RP_frenchcollapse.20.t:0 "Formation of the Confederation of the Sahel"
 RP_frenchcollapse.20.d:0 "We have formed an alliance with our neighbors, and they have become integrated into our new confederation."
 RP_frenchcollapse.20.a:0 "Together we stand."

 RP_frenchcollapse.21.t:0 "Central African Revolt"
 RP_frenchcollapse.21.d:0 "After the rebellion in West Africa, a militia force in Central Africa declared a revolt against our government."
 RP_frenchcollapse.21.a:0 "We will crush them quickly."

 # Balkan Sweep 

 RP_balkansweepevents.1.t:0 "[GER.GetNameDefCap] Proposes Operation Reuss"
 RP_balkansweepevents.1.d:0 "[GER.GetNameDefCap] met with us in [ROOT.capital.GetCapitalVictoryPointName] today. There, they proposed an interesting plan.\n\nGerman dominance in Europe is on the verge of being secured. However, the Balkans have remained a threat to this growing influence. [ROM.GetNameDefCap], [YUG.GetNameDef], and [GRE.GetNameDef] all support or formerly supported the French government. A surprise attack by the Balkan nations would threaten Vienna, Bavaria, and even Berlin. \n\nAdditionally, the Balkans hold a large amount of resources, crucial to both the German war economy and the civilian economy. If these are cutoff because of an embargo or state of war, it could threaten the war effort of [GER.GetNameDef].\n\nBecause of this, [GER.GetNameDef] has developed a plan to launch a pre-emptive strike against the Balkan powers. Essentially, it would consist of a swift "sweep" down the peninsula, taking out their enemies quick enough to prevent a foreign intervention. \n\nThey are requesting we support their war efforts, and join the operation when it begins. Should we do this, or should we stay out of it?"
 RP_balkansweepevents.1.a:0 "We will support our allies!"
 RP_balkansweepevents.1.b:0 "This will obviously only support them, we will stay out of it!"

 RP_balkansweepevents.2.t:0 "[FROM.GetNameDefCap] Accepts Participation in Operation Reuss!"
 RP_balkansweepevents.2.d:0 "Yesterday, we met with [FROM.GetNameDef] in [ROOT.capital.GetCapitalVictoryPointName] and revealed our plan to them. Today, [ROOT.capital.GetCapitalVictoryPointName] has informed us they will support Operation Reuss and have started military exercises and are currently drawing up their plans."
 RP_balkansweepevents.2.a:0 "Wonderful!"

 RP_balkansweepevents.3.t:0 "[FROM.GetNameDefCap] Rejects Participation in Operation Reuss"
 RP_balkansweepevents.3.d:0 "Yesterday, we met with [FROM.GetNameDef] in [ROOT.capital.GetCapitalVictoryPointName] and revealed our plan to them. Today, [ROOT.capital.GetCapitalVictoryPointName] has informed us they will not be participating in Operation Reuss, however they will not interfere with our efforts."
 RP_balkansweepevents.3.a:0 "A shame, but we will still win without them!"

 RP_balkansweepnews.1.t:0 "[GER.GetFactionName] Announces Operation Reuss!"
 RP_balkansweepnews.1.d:0 "After significant military exercises across Eastern Europe, which had been undergoing for 3 months, a coalition of nations within [GER.GetFactionName] declared war on various Balkan states. \n\nAs the Balkan Peninsula shattered into a symphony of gunfire and explosions, this coalition made a joint statement in [GER.capital.GetCapitalVictoryPointName], announcing the start of operations in the region. The main reasons of this new conflict were mostly to end enemy influence in these Balkan nations, as well as secure resources crucial to the war effort.\n\nWhatever the result of this military operation, it will clearly make or break the German war effort, and result in a large crisis for the civilian population of the Balkans."
 RP_balkansweepnews.1.a:0 "The European War expands further.."

 # Russian Civil War

 RP_russiancivilwarnewsevents.1.t:0 "Terror in Russia!"
 RP_russiancivilwarnewsevents.1.d:0 "[SOV.GetAdjective] officials confirmed to a committee based in Kalinin this morning that a series of devastating attacks against key [SOV.GetAdjective] cities were carried out by a militia comprised of members of the growing All-Russian Anti-Stalinist Bloc.\n\nThe All-Russian Anti-Stalinist Bloc is a political organization formed after the end of fighting in Russia. They have made several moves against Stalin in the months since their formation, however this has been the first major escalation of tension between the two.\n\nThe NKVD announced they were not aware of any of the plans to carry out such an attack, and that it was most likely organized by the [GER.GetAdjective]s in an attempt to restart operations on the front."
 RP_russiancivilwarnewsevents.1.a:0 "How much longer must their people suffer?"
 RP_russiancivilwarnewsevents.1.b:0 "Everything is fine over here!"