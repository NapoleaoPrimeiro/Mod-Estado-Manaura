 # Polish-Lithuanian Unification
 
 RP_plc_unification.1.t:0 "Restore the Polish-Lithuanian Commonwealth?"
 RP_plc_unification.1.d:0 "The Polish-Lithuanian Commonwealth was once Eastern Europe's most dominant power. The Ottomans, Russians, Swedes, and even our own proud people once trembled at the feet of their mighty hussars. Centuries later, the Poles and Lithuanians are mere husks of what they were. Now, a new threat looms from the steppes; a Russian one. We may very well need a new ally in the east..."
 RP_plc_unification.1.a:0 "They've beat them once, and with our help they'll beat them again!"
 RP_plc_unification.1.b:0 "We have other plans for them..."
 
 RP_plc_unification.2.t:0 "Fate of [KCS.GetNameDef]"
 RP_plc_unification.2.d:0 "Now that we are beginning the reformation of the Polish-Lithuanian Commonwealth, we must decide what to do with [KCS.GetNameDef]"
 RP_plc_unification.2.a:0 "Give it to [KPO.GetNameDef]"
 RP_plc_unification.2.b:0 "[KCS.GetNameDefCap] will remain under German Subjugation"
 
 RP_plc_unification.3.t:0 "Fate of [KGZ.GetNameDef]"
 RP_plc_unification.3.d:0 "Now that we are beginning the reformation of the Polish-Lithuanian Commonwealth, we must decide what to do with [KGZ.GetNameDef]"
 RP_plc_unification.3.a:0 "Give it to [KPO.GetNameDef]"
 RP_plc_unification.3.b:0 "[KGZ.GetNameDefCap] will remain under German Subjugation"
 
 RP_plc_unification.4.t:0 "The Spoils of War"
 RP_plc_unification.4.d:0 "Thanks to our faithful Commonwealth allies, we were finally able to defeat the Russian menace once and for all. However, the Poles do not expect their work to go unrewarded... Many Commonwealth nationalists are eyeing up their former territories in the east. In the end, it's our choice."
 RP_plc_unification.4.a:0 "They've more than earned their own place in the sun!"
 RP_plc_unification.4.b:0 "Let them know who their masters are." 
 
 RP_plc_unification.5.t:0 "Fuel for the Fires"
 RP_plc_unification.5.d:0 "Ever since we granted the Poles Courland, nationalist elements from within the Commonwealth had been eyeing up the Baltics. Recently, during a meeting with high ranking officals in [KLV.GetNameDef], they proposed a trade of sorts; Lativa for a rather generous investment. They claim Polish-Lithuanian rule would help quell resistance and strengthen their contribution to Mitteleuropa. The details have all been worked out, but in the end it's our decision."
 RP_plc_unification.5.a:0 "A strong Poland means a strong eastern flank!"
 RP_plc_unification.5.b:0 "Did they forget who's in charge?"  

 # Iberian Unification

 RP_iberianunification.1.t:0 "Unification of Iberia?"
 RP_iberianunification.1.d:0 "Earlier today, in a meeting between [KSP.GetLeader], [KPR.GetLeader], and [GER.GetLeader], the two Iberian powers made an interesting request.\n\nThe request was simple. The unification of the two powers into a single state, in which the leader would be chosen by us, and the capital would be in Madrid.\n\nWhat do we choose?"
 RP_iberianunification.1.a:0 "We shall accept this proposal!"
 RP_iberianunification.1.b:0 "It is best the two remain seperate.."

 RP_iberianunification.2.t:0 "Who shall lead?"
 RP_iberianunification.2.d:0 "It is now time to choose a leader for the Iberian Union."
 RP_iberianunification.2.a:0 "[KPR.GetLeader]"
 RP_iberianunification.2.b:0 "[KSP.GetLeader]"

 # Italian Collab

 RP_italianrestoration.1.t:0 "Reignite the Mare Nostrum Idea?"
 RP_italianrestoration.1.d:0 "The Kingdom of Italy, formed in 1861, has always had grand ambitions to install a hegemony over the Mediterranean. Their attempts at fulfilling the idea of Mare Nostrum were successful for the most part during the first decade of the century, annexing Tripolitania and Rhodes from the Ottomans, as well as Tyrol and Istria from the Austrians.\n\nThe monarchy was, however, hijacked by ultranationalists who believed that what they gained was not enough. The invasion of Ethiopia in 1935 showed the clear greed of the new Italian regime. But now, they have been crushed under our hand.\n\nWith the reestablishment of the old Italian regime, many are beginning to propose a very interesting settlement with [KIT.GetLeader]. [KIT.GetNameDefCap] would be granted far greater autonomy, as well as other lands from our conquered territories, in exchange for remaining loyal to their overlord and keeping their own territories in check.\n\nThis would be beneficial to us in the long term. Our grip on Europe is becoming tighter, but it very possibly can't hold forever. Granting more autonomy to regional powers could make our chances of survival far higher, but some believe it could spiral into a full collapse of our grip in Southern Europe. \n\nUltimately, it is up to the Kaiser to decide."
 RP_italianrestoration.1.a:0 "It is a wonderful idea, but we will keep our eyes on them."
 RP_italianrestoration.1.b:0 "No! We have an eternal empire, we don't need collaboration."

 RP_italianrestoration.2.t:0 "Integrate [KCR.GetNameDef] into [KIT.GetNameDef]?"
 RP_italianrestoration.2.d:0 "Croatia has a very close history with Italy. Under the Roman Empire, Croatia was part of the Roman Province of Illyricum. Both regions spent much of the 19th century under the rule of the Habsburg Monarchy.\n\nAs we work on expanding [KIT.GetNameDef], the question of Croatia comes up. [KIT.GetLeader] wishes to install a Savoy prince, Aiome, as the new king of the region. Additionally, he wishes to annex parts of the region into [KIT.GetNameDef] itself, specifically the territories of Dalmatia, Zadar, as well as the city of Ljubliana.\n\nShould we accept his claims to this land, or keep it under German control?"
 RP_italianrestoration.2.a:0 "We will install a new monarchy, but we will not give them any land."
 RP_italianrestoration.2.b:0 "We will accept all of his requests!"
 RP_italianrestoration.2.c:0 "It is best for the region to remain under our sphere."
 KCR_savoy_neutrality_party:0 "House of Savoy"

 RP_italianrestoration.3.t:0 "Integrate [KBS.GetNameDef] into [KIT.GetNameDef]?"
 RP_italianrestoration.3.d:0 "The region of Bosnia has undergone major changes in the last 100 years. From an Ottoman Province, to occupied by Austria-Hungary, to annexed by Austria-Hungary, to annexed by Serbia to form the Kingdom of Yugoslavia, and now under our supervision.\n\n[KIT.GetLeader] has proposed to transfer supervised control of Bosnia to his new and growing empire. Should we accept his request, or keep it under our control?"
 RP_italianrestoration.3.a:0 "He can manage it better."
 RP_italianrestoration.3.b:0 "It is best for the region to remain under our sphere."

 RP_italianrestoration.4.t:0 "Integrate [KNT.GetNameDef] into [KIT.GetNameDef]?"
 RP_italianrestoration.4.d:0 "The Kingdom of Albania has significant claims to the region of Montenegro. In addition, the Kingdom of Italy has claims to Albania and even helped secure their independence.\n\nShould we transfer governance of [KNT.GetNameDef] to Rome, or keep it under our control?"
 RP_italianrestoration.4.a:0 "It will become Italian."
 RP_italianrestoration.4.b:0 "It is best for the region to remain under our sphere."

 RP_italianrestoration.5.t:0 "Integrate [KSR.GetNameDef] into [KIT.GetNameDef]?"
 RP_italianrestoration.5.d:0 "The region of Sebia was once ruled by the Roman Empire, and it has been made clear the rightful successor to Rome is [KIT.GetNameDef].\n\nShould we transfer control of Serbia to [KIT.GetNameDef], or keep it with us?"
 RP_italianrestoration.5.a:0 "Once a part of Rome, always a part of Rome."
 RP_italianrestoration.5.b:0 "It is best for the region to remain under our sphere."

 RP_italianrestoration.6.t:0 "Integrate [KAB.GetNameDef] into [KIT.GetNameDef]?"
 RP_italianrestoration.6.d:0 "The Kingdom of Italy has had a claim to Albania for quite some time now. After the collapse of the Ottoman Empire, Italy helped establish Albanian independence from the Sultanate. If they gained control of it, they'd control the chokepoint into the Adriatic Sea. Should we restore Italian control over the nation, or keep it under our own sphere?"
 RP_italianrestoration.6.a:0 "They have a good claim."
 RP_italianrestoration.6.b:0 "Sure, and we'll give them direct control."
 RP_italianrestoration.6.c:0 "It is best for the region to remain under our sphere."

 RP_italianrestoration.7.t:0 "Integrate [KBU.GetNameDef] into [KIT.GetNameDef]?"
 RP_italianrestoration.7.d:0 "Giovanna of Savoy is the former Tsarita Consort of Bulgaria, who served from 1930 to the end of the Bulgarian Regime. Because of this, [KIT.GetLeader] is requesting she is installed as the Queen of Bulgaria, granting influence in Bulgaria to [KIT.GetNameDef]. Should we accept?"
 RP_italianrestoration.7.a:0 "Why not?"
 RP_italianrestoration.7.b:0 "It is best for the region to remain under our sphere."
 KBU_savoy_neutrality_party:0 "House of Savoy"

 RP_italianrestoration.8.t:0 "Integrate [KGR.GetNameDef] into [KIT.GetNameDef]?"
 RP_italianrestoration.8.d:0 "[KIT.GetNameDefCap] has very significant claims to the Greek peninsuila, and have had them for nearly all of history. However, if we grant it to them, it could grant them control over the Bosphorus Strait and influence in the Suez Canal. Should we install an Italian puppet regime in [KGR.GetNameDef], or keep it with us?"
 RP_italianrestoration.8.a:0 "We will accept this proposal."
 RP_italianrestoration.8.b:0 "We will accept this proposal, and grant them control over the Greek Islands."
 RP_italianrestoration.8.c:0 "It is best for the region to remain under our sphere."
 KGR_savoy_neutrality_party:0 "Collaborative Party"

 RP_italianrestoration.9.t:0 "Integrate [KLB.GetNameDef] into [KIT.GetNameDef]?"
 RP_italianrestoration.9.d:0 "The Libyan Region has been a colony of the Kingdom of Italy since 1911. However, after our conquest of Italy, it fell into our hands. Now, [KIT.GetLeader] is requesting the region be returned to him. What do we do?"
 RP_italianrestoration.9.a:0 "It is rightfully his."
 RP_italianrestoration.9.b:0 "We will give them direct control."
 RP_italianrestoration.9.c:0 "It is best for the region to remain under our sphere."

 RP_italianrestoration.10.t:0 "Integrate [KEG.GetNameDef] into [KIT.GetNameDef]?"
 RP_italianrestoration.10.d:0 "In the event that we return Libya and Abyssinia to Italian authority, it might be beneficial to lend them control over our colony in Egypt. Doing so would connect the two colonies, making administration easier. However, it might risk our control over Africa entirely."
 RP_italianrestoration.10.a:0 "We will give them control."
 RP_italianrestoration.10.b:0 "It is best for the region to remain under our sphere."

 RP_italianrestoration.11.t:0 "Integrate [KBY.GetNameDef] into [KIT.GetNameDef]?"
 RP_italianrestoration.11.d:0 "Abyssinia has been Italy's long fought over colony. After the opening of the suez canal, an Italian colony was established in Eritrea, to control shipping in the Strait. After the defeat in the Italo-Ethiopian War, they remained in Eritrea and Somalia. However, they were able to take control of it just a few years ago. Should we grant Italian authority over the area, or keep it under our control?"
 RP_italianrestoration.11.a:0 "It is rightfully theirs."
 RP_italianrestoration.11.b:0 "It is best for the region to remain under our sphere."

 RP_italianrestoration.12.t:0 "Integrate [342.GetName] into [KIT.GetNameDef]?"
 RP_italianrestoration.12.d:0 "The area in and around Antalya was part of Italy's claims over Anatolia following the collapse of the Ottoman Empire. However, they never got control over their claimed territory. Now, we have the opportunity to give it to them. Should we?"
 RP_italianrestoration.12.a:0 "They fought for it, they should get it."
 RP_italianrestoration.12.b:0 "It is best for the region to remain under our sphere."

 # French Collab
 
 RP_france_collab.1.t:0 "Restore the House of Orléans?"
 RP_france_collab.1.d:0 "Ever since the day the armistace was signed, the occupation of France has been a disaster. Resistance fighters have taken the lives of many of our valiant warriors, and day by day the populace grows more discontent. Recently, we have been approached by the exiled House of Orléans, who offer to take the throne from the currently unpopular Hohenzollern king. In the end, it's our decision."
 RP_france_collab.1.a:0 "We could use some allies in France..."
 RP_france_collab.1.b:0 "Never again will France rise to challenge us." 

 # Dutch Collab

 RP_dutch_collab.1.t:0 "Restore the United Kingdom of the Netherlands?"
 RP_dutch_collab.1.d:0 "As memories of the Battle of the Benelux fade, many in the governments of [KHO.GetNameDef] and our own are calling for the restoration of the House of Orange, and expansion of the Dutch realm.\n\nAlternatively, we could proclaim the United Kingdom of the Netherlands, led by the current government."
 RP_dutch_collab.1.a:0 "Yes, but we will not install a new monarchy."
 RP_dutch_collab.1.b:0 "Yes! This will only benefit us!"
 RP_dutch_collab.1.c:0 "What a preposterous proposition!"

 RP_dutch_collab.2.t:0 "Territorial Expansion of [KHO.GetNameDef]"
 RP_dutch_collab.2.d:0 "[KHO.GetNameDefCap] has announced their claims over the entirety of the Benelux region and Northern France. They have requested we recognize these claims and force the transfer of these territories.\n\nHowever, the governments of [KFR.GetNameDef] and [KBE.GetNameDef] have protested this. We could compromise and give control of some territories to the [KHO.GetNameDef], and keep some under their current governments."
 RP_dutch_collab.2.a:0 "We will transfer control of Flanders."
 RP_dutch_collab.2.b:0 "We will transfer all of Belgium."
 RP_dutch_collab.2.c:0 "We will give them all of it!"
 RP_dutch_collab.2.e:0 "We will not make any further concessions."

 # South Africa Collab

 RP_southafrica_collab.1.t:0 "Install Manie Maritz in [KSA.GetNameDef]?"
 RP_southafrica_collab.1.d:0 "Manie Maritz led the Maritz Rebellion during the starting years of the Great War. Along with independence from the British Empire, his goal was to re-establish the Transvaal Republic in northeastern South Africa. However, he might serve as a useful collaborator for the entirety of [KSA.GetNameDef]. Should we install him as the leader?"
 RP_southafrica_collab.1.a:0 "An anti-brit is a pro-german!"
 RP_southafrica_collab.1.b:0 "He's going to be a problem."

 RP_southafrica_collab.2.t:0 "Incorporate [KSD.GetNameDef] into [KSA.GetNameDef]?"
 RP_southafrica_collab.2.d:0 "After the regime switch in [KSA.GetNameDef], [KSA.GetLeader] has requested the integration of [KSD.GetNameDef] into the new government."
 RP_southafrica_collab.2.a:0 "Of course! It is "South Africa" after all."
 RP_southafrica_collab.2.b:0 "That has always been our land."

 # Japanese Restoration
 
 RP_empireofjapan_mainlandexpansionlocked_tt:0 "[KJP.GetAdjective] Expansion into §YMainland Asia§! will be §RLocked§!"

 RP_japanese_restoration.1.t:0 "Restore the Empire of Japan?"
 RP_japanese_restoration.1.d:0 "The region of East Asia and the Pacific is nearly 9000 kilometers away. The management of such a large piece of territory so far away is becoming very costly. However, [KJP.GetLeader] has come to us with an offer.\n\nIn exchange for the expansion of [KJP.GetNameDef], they will manage the resources of the region and stay loyal to us. \n\nThis will result in Japan becoming less dependent on us, however it will make management of the region easier. Ultimately, it is up to the Kaiser."
 RP_japanese_restoration.1.a:0 "What a great offer!"
 RP_japanese_restoration.1.b:0 "Are they insane? No!"

 RP_japanese_restoration.2.t:0 "Fate of [KRA.GetNameDef]"
 RP_japanese_restoration.2.d:0 "Korea, only part of the Empire of Japan a few years ago, is an important part of East Asia. It has very strategic ports which grant access to Beijing, Vladivostok, Port Arthur, and the Home Islands.\n\nShould we grant control of the region to Japan?"
 RP_japanese_restoration.2.a:0 "We will give them full control!" 
 RP_japanese_restoration.2.b:0 "They can get partial control of the region."
 RP_japanese_restoration.2.c:0 "No, that is too far"

 RP_japanese_restoration.3.t:0 "Fate of [KMN.GetNameDef]"
 RP_japanese_restoration.3.d:0 "Manchuria was one of the first Japanese conquests following the start of the Sino-Japanese War in 1931. The territory was ruled under Emperor Puyi, who we happen to have in control of the region now. Should we officially push the regime to align with [KJP.GetNameDef]?"
 RP_japanese_restoration.3.a:0 "It is rightfully their land." 
 RP_japanese_restoration.3.b:0 "No, we own that land"

 RP_japanese_restoration.4.t:0 "Fate of [KTM.GetNameDef]"
 RP_japanese_restoration.4.d:0 "Transamur was once occupied by the Empire of Japan during the Russian Civil War. However, this land was unlawfully stolen from them and was given to the USSR.\n\nShould we return this land to their control, give it to [KMN.GetNameDef], or keep control of it?"
 RP_japanese_restoration.4.a:0 "We will give them control." 
 RP_japanese_restoration.4.b:0 "We'll give it to [KMN.GetNameDef]!" 
 RP_japanese_restoration.4.c:0 "No, we need that."

 RP_japanese_restoration.5.t:0 "Fate of [KMJ.GetNameDef]"
 RP_japanese_restoration.5.d:0 "Menjiang was once owned by the Japanese just a few years ago. However, after their fall, Menjiang was taken by other powers. Should we return control of it to Japan, or keep them under our control?"
 RP_japanese_restoration.5.a:0 "We will restore their control."
 RP_japanese_restoration.5.b:0 "No, this is too far."
 
 RP_japanese_restoration.6.t:0 "Fate of [KCI.GetNameDef]"
 RP_japanese_restoration.6.d:0 "China has been a dream of the Japanese for many centuries. Their conquests have mostly failed time and time again. But now, they are both under our subjugation. While restoring the Empire, should we finally give them control of China, or keep it for ourselves?"
 RP_japanese_restoration.6.a:0 "We will give them control."
 RP_japanese_restoration.6.b:0 "No, they didn't earn it."

 ## North American Collabs
 
 # Canada

 RP_reunite_canada.1.t:0 "Reunite the Canadian Confederation?"
 RP_reunite_canada.1.d:0 "The Canadian Confederation was a territorial giant for nearly 80 years. During this time, it served as a british puppet and the main colony of British America.\n\nToday, the question of the region came up once again. [KRP.GetLeader] has requested we restore the old governments borders, and dissolve all other governments in the region.\n\nUltimately, it is up to the Kaiser."
 RP_reunite_canada.1.a:0 "Yes, we will restore it."
 RP_reunite_canada.1.b:0 "No, that is a bad idea."

 RP_reunite_canada.2.t:0 "Integrate [KNP.GetNameDef] into [KRP.GetNameDef]?"
 RP_reunite_canada.2.d:0 "The region of New England has a close history to Canada, and arguably has more ties to Nova Scotia and Ontario than Dixieland. Should we give control of the region to the newly formed government in Canada, or keep it as it is?"
 RP_reunite_canada.2.a:0 "This is a great idea."
 RP_reunite_canada.2.b:0 "It is best to keep it independent."

 RP_reunite_canada.3.t:0 "Integrate [KFQ.GetNameDef] into [KRP.GetNameDef]?"
 RP_reunite_canada.3.d:0 "When we reunited the Canadian Confederation, we decided to leave the Fate of Quebec for a later date. Now, it is time to decide what happens to it once and for all."
 RP_reunite_canada.3.a:0 "It should merge with Canada."
 RP_reunite_canada.3.b:0 "It is best to keep it independent."

 RP_quebeccollab.1.t:0 "Grant [KFQ.GetNameDef] Special Autonomy?"
 RP_quebeccollab.1.d:0 "Despite being primarily French-speaking, Quebec has been a part of Canada for almost 200 years now. Multiple attempts to break off and even merge with the United States have failed, they have never achieved this goal. Now, we have the opportunity to decide what to do with it. Should we install a Quebec leader, or keep it under our rule?"
 RP_quebeccollab.1.a:0 "Long Live Quebec!"
 RP_quebeccollab.1.b:0 "No! They don't even deserve a country."

 # United States + Confederacy

 RP_USA_westward_expansion_blocked_tt:0 "If we take this option, we will be §Runable to expand§! §Y[KFM.GetNameDef]§! any further west."

 RP_reunite_unitedstates.1.t:0 "Reform the Federal Republic?" 
 RP_reunite_unitedstates.1.d:0 "The United States of America was once the giant of the Western Hemisphere, looming over any colonial expansion into the Americas. However, as always, we managed to overcome the might of the American superpower.\n\nDespite the crushing defeat we inflicted on America, some government authorities still want a democratic government intact. Alf Landon, former leader of the Republican Party, has made an unprecendented move towards us.\n\nIn exchange for continuing cooperation with [GER.GetNameDef], Alf Landon has requested we reinstate the Constitutional Government, and a democratic republic. This could benefit us greatly, by easing tensions with former American citizens. However, letting them grow too strong could backfire, resulting in a complete loss of control in the area.\n\nAdditionally, we could form a large American Empire, under the control of [KFM.GetLeader], which could benefit us by making administration easier, but would not appease the American people.\n\nIn a desperate time, we must use desperate measures, however it is up to the Kaiser to decide what happens next." 
 RP_reunite_unitedstates.1.a:0 "It's worth a shot, a Second American Experiment." 
 RP_reunite_unitedstates.1.b:0 "We will form the Kingdom of America." 
 RP_reunite_unitedstates.1.c:0 "Absolutely not!" 

 RP_reunite_unitedstates.2.t:0 "Restore American Control over the Northwest Territory?" 
 RP_reunite_unitedstates.2.d:0 "The Northwest Territory, also known as the Old Northwest, was one of the first non-state pieces of land owned by the United States. After the destruction and resurrection of the American government, the question of what to do with the area has arisen once more. Should we return it to [KFM.GetNameDef]?" 
 RP_reunite_unitedstates.2.a:0 "It still belongs to [KFM.GetNameDef]." 
 RP_reunite_unitedstates.2.b:0 "No, we have granted them enough already." 

 RP_reunite_unitedstates.3.t:0 "Restore the Louisiana Purchase?" 
 RP_reunite_unitedstates.3.d:0 "The Louisiana Purchase was the largest purchase of land by one power from another in history. It cemented the United States as a great power and practically guaranteed the eventual annexation of Cascadia and California. Should we return this piece of land to [KFM.GetNameDef], or keep it as it's own government?" 
 RP_reunite_unitedstates.3.a:0 "It still belongs to [KFM.GetNameDef]." 
 RP_reunite_unitedstates.3.b:0 "No, we have granted them enough already." 

 RP_reunite_unitedstates.4.t:0 "Restore the Mexican Cession?"
 RP_reunite_unitedstates.4.d:0 "The Mexican Cession was the piece of land annexed by the United States from Mexico in 1848 after the Mexican-American War. Nearly a century later, we have the opportunity to decide the future of the land. Should we give it back to [KFM.GetNameDef]?"
 RP_reunite_unitedstates.4.a:0 "It still belongs to [KFM.GetNameDef]." 
 RP_reunite_unitedstates.4.b:0 "No, we have granted them enough already." 

 RP_reunite_unitedstates.5.t:0 "Restore American Control over Cascadia?"
 RP_reunite_unitedstates.5.d:0 "The region of Cascadia is one of, if not the most, vital pieces of land on the West Coast. It is so vital that it nearly kickstarted a third war between the British Empire and the United States in the 1800s. Should we give it back to [KFM.GetNameDef], or keep it as a sovereign state?"
 RP_reunite_unitedstates.5.a:0 "It still belongs to [KFM.GetNameDef]." 
 RP_reunite_unitedstates.5.b:0 "No, we have granted them enough already." 

 RP_reunite_unitedstates.6.t:0 "Restore American Control over The South?"
 RP_reunite_unitedstates.6.d:0 "The Southern United States has always been culturally and economically seperate from the North and the West. A region mostly comprised of cash crop farms and mining towns, it has seen severe economic decline since before the Great Depression. Should it remain independent, or be returned to the government in [ROOT.capital.GetCapitalVictoryPointName]?"
 RP_reunite_unitedstates.6.a:0 "It still belongs to [KFM.GetNameDef]." 
 RP_reunite_unitedstates.6.b:0 "No, we have granted them enough already." 

 RP_reunite_unitedstates.7.t:0 "Restore American Control over Texas?"
 RP_reunite_unitedstates.7.d:0 "Texas is the only state in the former Union to be independent from any nation for a significant amount of time. However, only 12 years after it's integration in the Union, it declared independence and joined the Confederacy during the American Civil War. Should we guarantee Texan independence, or force it into the Union once more?"
 RP_reunite_unitedstates.7.a:0 "It still belongs to [KFM.GetNameDef]." 
 RP_reunite_unitedstates.7.b:0 "No, we have granted them enough already." 

 RP_restore_confederacy.1.t:0 "Reform the Confederate States?"
 RP_restore_confederacy.1.d:0 "The Confederate States of America was the only real time in American history that the United States was truly at risk of a complete collapse. Formed because of Southern unease with the pro-abolitionist Abraham Lincoln, they would soon go to war with the Union, which would eventually lead to them being reintegrated.\n\nIt has been nearly a century since the start of the American Civil War. However, Southern Pride is still strong, and some policies of the Confederacy remained up until the collapse of the United States. For this reason, some in [KDL.capital.GetCapitalVictoryPointName] are calling for the revival of the Confederacy.\n\nShould we reinstall a Confederate leader in [KDL.GetNameDef], or leave it as it is?"
 RP_restore_confederacy.1.a:0 "I like these people already!"
 RP_restore_confederacy.1.b:0 "Never!"

 RP_restore_mexicanempire.1.t:0 "Restore the Empire of Mexico?"
 RP_restore_mexicanempire.1.d:0 "The Empire of Mexico existed from 1821-1823 and was the first government of Mexico, separate from the Spanish Empire. Ruled by a royal military officer, it was the first country to gain it's independence from Spain by becoming a Monarchy. However, the military soon became unhappy with the monarchy, leading to the establishment of a provisional government and eventually the First Mexican Republic.\n\nAfter our conquest of Mexico, we established the monarchy once again. However, the monarchy is still ambitious. They have requested we allow them more autonomy and land, and in exchange it will take pressure from the locals off our hands.\n\nShould we accept, or keep them as a full vassal?"
 RP_restore_mexicanempire.1.a:0 "It's worth a shot."
 RP_restore_mexicanempire.1.b:0 "No! They don't deserve our time."

 RP_restore_mexicanempire.2.t:0 "Reincorporate Texas into the Empire of Mexico?"
 RP_restore_mexicanempire.2.d:0 "Texas was one of the reasons Mexico had a major fall from glory. After the Texan Revolution, Mexico lost a huge amount of land. After that, the Mexican-American War started because of border conflicts with the Republic of Texas. Eventually, Mexico would be reduced to the Rio Grande.\n\nShould we give Texas back to Mexico once and for all, or keep it as an independent government?"
 RP_restore_mexicanempire.2.a:0 "They can have it back."
 RP_restore_mexicanempire.2.b:0 "They don't deserve it."

 RP_restore_mexicanempire.3.t:0 "Reverse the Mexican Cession?"
 RP_restore_mexicanempire.3.d:0 "The Mexican Cession is the area of land in the Western United States that was annexed after the Mexican-American war, nearly a century ago. However, many Mexican descendants still live in the area. Should we reverse the treaty and give it back to [KMX.GetNameDef]?"
 RP_restore_mexicanempire.3.a:0 "Of course!"
 RP_restore_mexicanempire.3.b:0 "They don't deserve it."

 RP_restore_mexicanempire.4.t:0 "Reincorporate Central America into the Empire of Mexico?"
 RP_restore_mexicanempire.4.d:0 "Central America is one of the only parts of the Empire of Mexico to gain independence peacefully. Right after independence, they formed a Federal Republic that lasted only a few years. Now, we can determine it's fate forever. Should we give it back to [KMX.GetNameDef]?"
 RP_restore_mexicanempire.4.a:0 "Of course!"
 RP_restore_mexicanempire.4.b:0 "No, they never even fought for it!"

 RP_restore_mexicanempire.5.t:0 "Transfer the Carribean to the Empire of Mexico?"
 RP_restore_mexicanempire.5.d:0 "Despite never actually controlling it as an independent nation, we have the opportunity to give the Carribean to Mexico. Should we take this opportunity?"
 RP_restore_mexicanempire.5.a:0 "Of course!"
 RP_restore_mexicanempire.5.b:0 "They don't have any real claim to it."

 RP_restore_mexicanempire.6.t:0 "Declare the Viceroyalty of New Spain?"
 RP_restore_mexicanempire.6.d:0 "With the recent expansion we've given to [KMX.GetNameDef], they are closer to the borders of New Spain than Mexico itself. Should we officially recognize [KMX.GetNameDef] as the Viceroyalty of New Spain?"
 RP_restore_mexicanempire.6.a:0 "Of course!"
 RP_restore_mexicanempire.6.b:0 "That won't be necessary."

 RP_centralamericancollab.1.t:0 "Restore the Federal Republic?"
 RP_centralamericancollab.1.d:0 "The Federal Republic of Central America existed from 1823 to 1841 and consisted of every Central American country besides Panama. Following a civil war, the federation dissolved.\n\nHowever, only a decade ago, a second Federation was established but only lasted for 2 years before a military coup caused the collapse of the nation. Today, we have the option to restore this republic for good, under the control of a former President of Honduras. Should we take this opportunity?"
 RP_centralamericancollab.1.a:0 "What a great idea!"
 RP_centralamericancollab.1.b:0 "We have no reason to do so."

 RP_carribeancollaborator.1.t:0 "Install a Collaborator in [KCB.GetNameDef]?"
 RP_carribeancollaborator.1.d:0 "The idea of Caribbean unity has never been fully realized, however many in [KCB.GetNameDef] still call for it. Today, we have the option to declare a Federation of West Indies Republics, under a new government. Should we do this, or keep it as a colony?"
 RP_carribeancollaborator.1.a:0 "We'll give it a try."
 RP_carribeancollaborator.1.b:0 "No thanks."

