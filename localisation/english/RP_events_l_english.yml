 RP_militarystateevents.1.t:0 "Establish a Militärstaat in Rostov?"
 RP_militarystateevents.1.d:0 "Rostov holds strategic importance on the Eastern Front. Shall we establish direct military control, or entrust it to one of our regional puppets?"
 RP_militarystateevents.1.a:0 "Ja! This is a great idea!"
 RP_militarystateevents.1.b:0 "Nein! Give it to [KRU.GetNameDef]"
 RP_militarystateevents.1.c:0 "Nein! Give it to [KKA.GetNameDef]"
 RP_militarystateevents.1.e:0 "Nein! Give it to [KUK.GetNameDef]"
 RP_militarystateevents.1.f:0 "Nein! Give it to [KDH.GetNameDef]"

 RP_militarystateevents.2.t:0 "Establish a Marinestaat in Malta?"
 RP_militarystateevents.2.d:0 "Malta is a vital naval chokepoint in the Mediterranean. Should we administer it directly through a naval authority, or entrust it to one of our southern allies?"
 RP_militarystateevents.2.a:0 "Ja! This is a great idea!"
 RP_militarystateevents.2.b:0 "Nein! Give it to [KIT.GetNameDef]"
 RP_militarystateevents.2.c:0 "Nein! Give it to [KSZ.GetNameDef]"

 RP_militarystateevents.3.t:0 "Establish a Marinestaat in Sussex?"
 RP_militarystateevents.3.d:0 "Sussex, with its key coastal position, could serve as a valuable naval outpost. Shall we place it under direct naval administration, or leave it to our English collaborators?"
 RP_militarystateevents.3.a:0 "Ja! This is a great idea!"
 RP_militarystateevents.3.b:0 "Nein! Give it to [KBR.GetNameDef]"

 RP_militarystateevents.4.t:0 "Establish a Marinestaat in Suez?"
 RP_militarystateevents.4.d:0 "The Suez Canal is a vital artery of Imperial power. Should we place it under direct naval control, or entrust it to our North African administration?"
 RP_militarystateevents.4.a:0 "Ja! This is a great idea!"
 RP_militarystateevents.4.b:0 "Nein! Give it to [KEG.GetNameDef]"
 
 RP_militarystateevents.5.t:0 "Establish a Marinestaat in Masandam?"
 RP_militarystateevents.5.d:0 "The Masandam Peninsula, a strategic point controlling the Strait of Hormuz, is now in our hands. Shall we secure it with a direct naval administration, or entrust it to our allies in the Trucial States?"
