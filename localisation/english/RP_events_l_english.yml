l_english:

 RP_countryevents.1.t:0 "Fate of Belgium (Page One)"
 RP_countryevents.1.d:0 "Belgium lies under our control. We must now determine its future—shall it remain united, be split along ethnic lines, or shall we consider further options?"
 RP_countryevents.1.a:0 "Establish [KBE.GetNameDef]"
 RP_countryevents.1.b:0 "Split Belgium"
 RP_countryevents.1.e:0 "Occupation will work best"
 RP_countryevents.1.c:0 "Next Page"

 RP_countryevents.2.t:0 "Fate of Belgium (Page Two)"
 RP_countryevents.2.d:0 "Alternative plans for Belgium's governance are available, utilizing our allies and puppets in the region."
 RP_countryevents.2.b:0 "Give it all to [KFR.GetNameDef]"
 RP_countryevents.2.c:0 "Split it between [KHO.GetNameDef] and [KFR.GetNameDef]"
 RP_countryevents.2.e:0 "Last Page"

 RP_countryevents.3.t:0 "Fate of the Netherlands"
 RP_countryevents.3.d:0 "With the Netherlands under Imperial occupation, we must decide its fate. Should we establish a loyal Dutch regime, or transfer the territory to our administration in France?"
 RP_countryevents.3.a:0 "Establish [KHO.GetNameDef]"
 RP_countryevents.3.b:0 "Give it all to [KFR.GetNameDef]"
 RP_countryevents.3.c:0 "Occupation will work best"

 RP_countryevents.4.t:0 "Fate of Austria"
 RP_countryevents.4.d:0 "With Austria under Imperial control, we must decide its future. Shall we integrate it directly into the German Empire, or establish a loyal puppet state to govern the region?​"
 RP_countryevents.4.a:0 "Annex it"
 RP_countryevents.4.b:0 "Establish [KAU.GetNameDef]"

 RP_countryevents.5.t:0 "Fate of Bohemia and Moravia"
 RP_countryevents.5.d:0 "With Czechia under our control, we must determine its destiny. Should we divide it, absorb it fully, or entrust it to one of our loyal vassals?"
 RP_countryevents.5.a:0 "Annex the Sudetenland, form a puppet state in the rest"
 RP_countryevents.5.b:0 "Annex it all"
 RP_countryevents.5.c:0 "Give it to [KAU.GetNameDef]"
 RP_countryevents.5.e:0 "Establish [KCZ.GetNameDef]"

 RP_countryevents.6.t:0 "Fate of Slovakia"
 RP_countryevents.6.d:0 "With Slovakia now in our hands, we must decide how to govern it. Should it be handed over to one of our existing puppets, or should we establish a Slovak state of our own?"
 RP_countryevents.6.a:0 "Give it to [KHU.GetNameDef]"
 RP_countryevents.6.b:0 "Give it to [KCZ.GetNameDef]"
 RP_countryevents.6.c:0 "Establish [KSL.GetNameDef]"

 RP_countryevents.7.t:0 "Fate of Romania"
 RP_countryevents.7.d:0 "Romania is now under our control, and we must decide how best to manage the territory. Should we unite the country under a single puppet, or divide it into its historical regions?"
 RP_countryevents.7.a:0 "Keep them united"
 RP_countryevents.7.b:0 "Split it"

 RP_countryevents.8.t:0 "Fate of Norway"
 RP_countryevents.8.d:0 "Norway has had a complicated history. It has been subjugated by many different empires, including Denmark, Sweden, the British, and many more. Now we can finally decide who will get the claim once and for all."
 RP_countryevents.8.a:0 "Establish [KNO.GetNameDef]"
 RP_countryevents.8.b:0 "Give it to [KDE.GetNameDef]"
 RP_countryevents.8.c:0 "Give it to [KSW.GetNameDef]"

 RP_countryevents.9.t:0 "Fate of Kurdistan"
 RP_countryevents.9.d:0 "The Kurdish territories are now in our hands. Should we recognize Kurdish autonomy, or entrust the region to our loyal Turkish allies?"
 RP_countryevents.9.a:0 "Establish [KKR.GetNameDef]"
 RP_countryevents.9.b:0 "Give it to [KAN.GetNameDef]"

 RP_countryevents.10.t:0 "Fate of Nepal"
 RP_countryevents.10.d:0 "The territories of the former Kingdom of Nepal have fallen under our control. Should we reinstate the Kingdom under our control, or hand it over to the Indian Colony?"
 RP_countryevents.10.a:0 "Establish [KKN.GetNameDef]"
 RP_countryevents.10.b:0 "Give it to [KIN.GetNameDef]"

 RP_countryevents.11.t:0 "Fate of Bhutan"
 RP_countryevents.11.d:0 "The territories of the former Kingdom of Bhutan have fallen under our control. Should we reinstate the Kingdom under our control, or hand it over to the Indian Colony?"
 RP_countryevents.11.a:0 "Establish [KBH.GetNameDef]"
 RP_countryevents.11.b:0 "Give it to [KIN.GetNameDef]"

 RP_countryevents.12.t:0 "Fate of Brittany"
 RP_countryevents.12.d:0 "The ancient region of Brittany lies under our control. Shall we restore a Breton kingdom, or place it under the authority of our French puppet?"
 RP_countryevents.12.a:0 "Establish [KBI.GetNameDef]"
 RP_countryevents.12.b:0 "Give it to [KFR.GetNameDef]"
 RP_countryevents.12.c:0 "Give it to [KIR.GetNameDef]"

 RP_countryevents.13.t:0 "Fate of Ireland"
 RP_countryevents.13.d:0 "Ireland stands at a crossroads under our occupation. Shall we grant it autonomy under a new regime, or hand it over to our loyal English puppet?"
 RP_countryevents.13.a:0 "Establish [KIR.GetNameDef]"
 RP_countryevents.13.b:0 "Give it to [KBR.GetNameDef]"

 RP_countryevents.14.t:0 "Fate of Burma"
 RP_countryevents.14.d:0 "As we finish conquering the Province of Burma, the question of what to do with it arises. What should we do with it?"
 RP_countryevents.14.a:0 "Establish [KBM.GetNameDef]"
 RP_countryevents.14.b:0 "Give it to [KIN.GetNameDef]"

 RP_countryevents.15.t:0 "Fate of Wales"
 RP_countryevents.15.d:0 "Wales is now under Imperial control. We must decide its fate—shall it stand on its own, or fall under the rule of one of our neighboring puppet states?"
 RP_countryevents.15.a:0 "Establish [KWE.GetNameDef]"
 RP_countryevents.15.b:0 "Give it to [KBR.GetNameDef]"
 RP_countryevents.15.c:0 "Give it to [KIR.GetNameDef]"

 RP_countryevents.16.t:0 "Fate of Scotland"
 RP_countryevents.16.d:0 "Scotland lies subdued, and its future must be decided. Should it gain autonomy, or be placed under one of our existing puppet regimes in the Isles?"
 RP_countryevents.16.a:0 "Establish [KSC.GetNameDef]"
 RP_countryevents.16.b:0 "Give it to [KBR.GetNameDef]"
 RP_countryevents.16.c:0 "Give it to [KIR.GetNameDef]"

 RP_countryevents.17.t:0 "Fate of Venice"
 RP_countryevents.17.d:0 "With Veneto under Imperial control, we must decide its future. Should it be granted to one of our loyal puppets, or shall we restore Venice as a state of its own?"
 RP_countryevents.17.a:0 "Establish [KVE.GetNameDef]"
 RP_countryevents.17.b:0 "Give it to [KIT.GetNameDef]"
 RP_countryevents.17.c:0 "Give it to [KAU.GetNameDef]"
 
 RP_countryevents.18.t:0 "Fate of Italy"
 RP_countryevents.18.d:0 "Now that the glorious Imperial Army has finished it's conquest of the Italian peninsula, many in the government are starting to wonder what we should do with our new land. We have two options. We can either:\n\nA. Unite the peninsula under the old government of [KIT.GetLeader].\n\nB. Install a number of puppet regimes across the land, which would, in practice, reverse the Risorgimento."
 RP_countryevents.18.a:0 "Reform the Kingdom of Italy"
 RP_countryevents.18.b:0 "Reverse the Risorgimento!"

 RP_countryevents.19.t:0 "Fate of Transylvania"
 RP_countryevents.19.d:0 "The contested region of Transylvania is now ours to shape. Shall we restore its historical autonomy, or divide it between our neighboring puppet states?"
 RP_countryevents.19.a:0 "Establish [KTR.GetNameDef]"
 RP_countryevents.19.b:0 "Give it to [KHU.GetNameDef]"
 RP_countryevents.19.c:0 "Give it to [KRO.GetNameDef]"
 RP_countryevents.19.e:0 "Divide the territories"

 RP_countryevents.20.t:0 "Fate of Lemberg"
 RP_countryevents.20.d:0 "Lemberg, the historic heart of Galicia, lies at a crossroads. Should we revive the old crownland of Galicia and Lodomeria, or grant the territory to one of our eastern puppets?"
 RP_countryevents.20.a:0 "Establish [KGZ.GetNameDef]"
 RP_countryevents.20.b:0 "Give it to [KPO.GetNameDef]"
 RP_countryevents.20.c:0 "Give it to [KUK.GetNameDef]"

 RP_countryevents.21.t:0 "Fate of Naples"
 RP_countryevents.21.d:0 "Southern Italy is under Imperial authority. Shall we restore the historic Kingdom of Naples, or unify it with Sicily to revive the Kingdom of the Two Sicilies?"
 RP_countryevents.21.a:0 "Establish [KNE.GetNameDef]"
 RP_countryevents.21.b:0 "Give it to [KSZ.GetNameDef]"

 RP_countryevents.22.t:0 "Fate of Rome"
 RP_countryevents.22.d:0 "Rome—eternal and symbolic—now lies within our grasp. Shall we restore the Papal States, hand it to Naples, or divide its lands between the two?"
 RP_countryevents.22.a:0 "Establish [KVC.GetNameDef]"
 RP_countryevents.22.b:0 "Give it to [KNE.GetNameDef]"
 RP_countryevents.22.c:0 "Split the Lands"
 
 RP_countryevents.23.t:0 "Fate of Finland"
 RP_countryevents.23.d:0 "Finland stands at a strategic crossroads between East and West. Should we reestablish its monarchy, or hand it over to one of its powerful neighbors?"
 RP_countryevents.23.a:0 "Establish [KFI.GetNameDef]"
 RP_countryevents.23.b:0 "Give it to [KSW.GetNameDef]"
 RP_countryevents.23.c:0 "Give it to [KRU.GetNameDef]"

 RP_countryevents.24.t:0 "Fate of Don-Kuban Region"
 RP_countryevents.24.d:0 "The area just north of the Caucasus has been under immense instability for the last 20 years. Now, we finally have the opportunity to put it to rest. Should we divide the region, or unite it?"
 RP_countryevents.24.a:0 "We will unite it into one state."
 RP_countryevents.24.b:0 "A two-state solution should work fine."

 RP_countryevents.25.t:0 "Fate of Grozny Region"
 RP_countryevents.25.d:0 "The volatile Grozny region lies under our control. Should we establish a separate administration there, or entrust the territory to the loyal Kuban Host?"
 RP_countryevents.25.a:0 "Establish [KNC.GetNameDef]"
 RP_countryevents.25.b:0 "Give it to [KKH.GetNameDef]"
 RP_countryevents.25.c:0 "Give it to [KDH.GetNameDef]"
 
 RP_countryevents.26.t:0 "Fate of the Middle East"
 RP_countryevents.26.d:0 "Our occupation of the Fertile Crescent under Nahost has largely been a success. However, the cracks are beginning to show. The administration simply can't handle the plethora of nationalities in the area, and protests and riots are becoming ever more common. Some in the government are suggesting we fragment Nahost into smaller states under local monarchs to ease strain. Ultimately, the decision is up to the Kaiser."
 RP_countryevents.26.a:0 "This can only benefit us!"
 RP_countryevents.26.b:0 "They can handle it"
 RP_countryevents.26.effect_tt:0 "Seperates §Y[KNH.GetNameDef]§! into regional puppet states"

 RP_countryevents.27.t:0 "Fate of [KEP.GetNameDef]"
 RP_countryevents.27.d:0 "Now that we have established puppet states in Ukraine and White Russia, we can decide what to do with the territory under the control of [KEP.GetNameDef]. Should we give it all to Poland, or split it between Ukraine and White Russia?"
 RP_countryevents.27.a:0 "Give it all to [KPO.GetNameDef]"
 RP_countryevents.27.b:0 "Nope, split it."
 RP_countryevents.27.c:0 "There is no need to get rid of it."

 RP_countryevents.28.t:0 "Fate of South Turkestan"
 RP_countryevents.28.d:0 "South Turkestan, rich in culture and history, is now under Imperial authority. Will we unite the Turkic peoples with [KAO.GetNameDef] and form a United Turkestan, or establish a new Islamic kingdom in the region?"
 RP_countryevents.28.a:0 "Establish [KTU.GetNameDef]"
 RP_countryevents.28.b:0 "Uniting South Turkestan with [KAO.GetNameDef] is the obvious choice"
 
 RP_countryevents.29.t:0 "Fate of West Siberia"
 RP_countryevents.29.d:0 "The vast expanse of West Siberia is now under Imperial control. Should we administer it through our Russian puppet, or establish a new local authority?"
 RP_countryevents.29.a:0 "Establish [KWS.GetNameDef]"
 RP_countryevents.29.b:0 "Give it to [KRU.GetNameDef]"

 RP_countryevents.30.t:0 "Fate of Crimea"
 RP_countryevents.30.d:0 "Crimea, with its strategic location and complex history, is now under our control. Shall we establish a separate puppet state, or assign it to our Ukrainian allies?"
 RP_countryevents.30.a:0 "Establish [KRI.GetNameDef]"
 RP_countryevents.30.b:0 "Give it to [KUK.GetNameDef]"
 RP_countryevents.30.c:0 "Give it to [KKA.GetNameDef]"

 RP_countryevents.31.t:0 "Fate of Volga Germany"
 RP_countryevents.31.d:0 "The Volga German region has fallen under our rule. Should we reestablish a German-aligned authority there, or hand it over to our Russian puppet?"
 RP_countryevents.31.a:0 "Establish [KVG.GetNameDef]"
 RP_countryevents.31.b:0 "Give it to [KRU.GetNameDef]"

 RP_countryevents.32.t:0 "Fate of the Far East"
 RP_countryevents.32.d:0 "The distant lands of the Russian Far East now lie within our grasp. Shall we establish a local authority, or assign the region to one of our existing eastern puppets?"
 RP_countryevents.32.a:0 "Establish [KFE.GetNameDef]"
 RP_countryevents.32.b:0 "Give it to [KWS.GetNameDef]"
 RP_countryevents.32.c:0 "Give it to [KRU.GetNameDef]"

 RP_countryevents.33.t:0 "Fate of Courland and Semigallia"
 RP_countryevents.33.d:0 "Courland was a proposed client state following the Brest-Litovsk treaty in the Great War. Now that we control the area once more, we can choose what to do with it."
 RP_countryevents.33.a:0 "Establish [KCS.GetNameDef]"
 RP_countryevents.33.b:0 "Give it to [KLV.GetNameDef]"
 RP_countryevents.33.c:0 "Give it to [KLI.GetNameDef]"

 RP_countryevents.34.t:0 "Fate of Indochina"
 RP_countryevents.34.d:0 "The former French Colony of Indochina has fallen under our control. What should we do with it?"
 RP_countryevents.34.a:0 "Seperate it into 3 kingdoms"
 RP_countryevents.34.b:0 "Form a United Indochina"
 RP_countryevents.34.c:0 "Give it to [KEA.GetNameDef]"

 RP_countryevents.35.t:0 "Fate of the Western China Region"
 RP_countryevents.35.d:0 "As control over China grows, so too does the question of what to do with it. The nation has been de-facto split between multiple warring factions for the last 30 years, but now we can bring it under one united government. \n\nHowever, this morning, Alexander von Falkenhausen approached the Kaiser with an offer. The former military advisor to China under the previous regime requested control over the region of Western China, based in Chongqing. Should we accept, or give it to [KCI.GetNameDef]?"
 RP_countryevents.35.a:0 "Yes, but only with the territories under our control"
 RP_countryevents.35.b:0 "Yes, and we will give him the entirety of [KCI.GetNameDef]"
 RP_countryevents.35.c:0 "No! It will go directly to [KCI.GetNameDef]"

 RP_countryevents.36.t:0 "Fate of New Zealand"
 RP_countryevents.36.d:0 "As control over the pacific grows, so does the need to decide who gets what. In the case of new zealand, the options are simple, establish a colony in Wellington, seperate from [KUT.GetNameDef], or give it to our colonial government in Canberra"
 RP_countryevents.36.a:0 "Establish [KNZ.GetNameDef]"
 RP_countryevents.36.b:0 "Give it to [KUT.GetNameDef]"
 
 RP_countryevents.37.t:0 "Fate of Menjiang"
 RP_countryevents.37.d:0 "The region of Menjiang, a portion of the Mongolian Steppe, has been a territory fought for constantly for nearly 30 years.\n\nToday, the question of who to give the region to came to the Kaiser. Should we reinstall the old leadership of the Menjiang United Autonomous Government, or give it to one of their neighbors?"
 RP_countryevents.37.a:0 "Establish [KMJ.GetNameDef]"
 RP_countryevents.37.b:0 "Give it to [KMI.GetNameDef]"
 RP_countryevents.37.c:0 "Give it to [KCI.GetNameDef]"
 RP_countryevents.37.e:0 "Give it to [KFH.GetNameDef]"

 RP_countryevents.38.t:0 "Fate of Transamur"
 RP_countryevents.38.d:0 "Following the end of military operations in Transamur, an interesting proposal has been brought to the Kaiser.\n\nGrigory Mikhaylovich Semyonov, former commander of the Far Eastern Army, has offered to work for the Germans in exchange for the establishment of an autonomous republic in the region.\n\nShould we accept, or kick him out of Berlin?"
 RP_countryevents.38.a:0 "Establish [KTM.GetNameDef]"
 RP_countryevents.38.b:0 "Give it to [KMN.GetNameDef]"
 RP_countryevents.38.c:0 "Give it to [KFE.GetNameDef]"
 RP_countryevents.38.e:0 "Give it to [KWS.GetNameDef]"
 RP_countryevents.38.f:0 "Give it to [KRU.GetNameDef]"

 RP_countryevents.39.t:0 "Fate of Cascadia"
 RP_countryevents.39.d:0 "The natural beauty of Cascadia is only one of the many desirable traits of the region. The rivers that flow through the area create a massive hunting and fishing industry, and the west coast is vital for shipping lanes in British Columbia. Who should gain control of this vital area?"
 RP_countryevents.39.a:0 "Establish [KRK.GetNameDef]"
 RP_countryevents.39.b:0 "Give it to [KWC.GetNameDef]"
 RP_countryevents.39.c:0 "Give it to [KDK.GetNameDef]"

 RP_countryevents.40.t:0 "Fate of the Amazon"
 RP_countryevents.40.d:0 "The Amazon Rainforest is the heart of South America. It is largely unexplored, uninhabitable, and unuseable. But what we do know is this; the Amazon contains untold deposits of natural resources untouched by European hands. Some business executives are lobbying for the formation of a massive industrial conglomerate to harvest the countless natural resources. Unsuprisingly, the Brazilian locals wouldn't be too happy with this."
 RP_countryevents.40.a:0 "The Factory Must Grow"
 RP_countryevents.40.b:0 "Are they insane?!"

 RP_countryevents.41.t:0 "Fate of Bosnia"
 RP_countryevents.41.d:0 "Bosnia, once a joint occupation zone of the Austro-Hungarian Empire, was the region where WW1 first began. After many years of fighting, it has fallen under our influence once more. What should we do with it?"
 RP_countryevents.41.a:0 "Establish [KBS.GetNameDef]"
 RP_countryevents.41.b:0 "Give it to [KCR.GetNameDef]"
 RP_countryevents.41.c:0 "Give it to [KSR.GetNameDef]"

 RP_countryevents.42.t:0 "Fate of Montenegro"
 RP_countryevents.42.d:0 "Montenegro was once it's own independent kingdom before it was forcefully stolen by the Serbians, who later became the Kingdom of Yugoslavia. Now that they are free from their Serbian oppresors, should we install a Montenegrin King?"
 RP_countryevents.42.a:0 "Establish [KNT.GetNameDef]"
 RP_countryevents.42.b:0 "Give it to [KCR.GetNameDef]"
 RP_countryevents.42.c:0 "Give it to [KSR.GetNameDef]"
 RP_countryevents.42.e:0 "Give it to [KAB.GetNameDef]"

 RP_countryevents.43.t:0 "Fate of Libya"
 RP_countryevents.43.d:0 "The region of Libya has fallen into our hands. First conquered by the Ottomans, then the Italians just a few decades ago, Libya has a rich history. Not only that, it has a strategic position, located on the crossroads of Africa and Europe. \n\nNow the question arises. Should we restore a Senussi puppet, or transfer it to an already existing state?"
 RP_countryevents.43.a:0 "Establish [KLB.GetNameDef]"
 RP_countryevents.43.b:0 "Give it to [KNA.GetNameDef]"
 RP_countryevents.43.c:0 "Give it to [KEG.GetNameDef]"

 RP_countryevents.44.t:0 "Fate of Novgorod"
 RP_countryevents.44.d:0 "Novgorod is a very important piece of Russian history. Until the end of the 1400s, Novgorod served as the center of art and literature for Russia. Following the end of the Novgorod Republic, it declined slowly throughout the period of the Tsar. However, we now have the opportunity to reinstall it's statehood and restore Novgorod. What should we do?"
 RP_countryevents.44.a:0 "Establish [KNV.GetNameDef]"
 RP_countryevents.44.b:0 "Give it to [KRU.GetNameDef]"

 RP_countryevents.45.t:0 "Fate of Severia"
 RP_countryevents.45.d:0 "Severia is a vital region in the Russian heartland, serving as a bridge between Ukraine, Belarus, and Russia itself. Should we grant it statehood, or return it to it's Russian owners?"
 RP_countryevents.45.a:0 "Establish [KWI.GetNameDef]"
 RP_countryevents.45.b:0 "Give it to [KRU.GetNameDef]"

 RP_countryevents.46.t:0 "Fate of Caucasia"
 RP_countryevents.46.d:0 "Caucasia is one of the most important areas in the entirety of Eurasia. The oil produced from the region fuels it's owners war machine. Should we divide the region into multiple different states, so that they can develop faster, or should we unite it together?"
 RP_countryevents.46.a:0 "Divide the region"
 RP_countryevents.46.b:0 "Establish a single state"
 RP_countryevents.46.c:0 "We shall unite it with [KDH.GetNameDef] to form one state!"

 RP_countryevents.47.t:0 "Fate of Texas"
 RP_countryevents.47.d:0 "Texas was one of the only states in the former Union that had any independence at all, let alone for multiple years. Multiple different of their neighbors are claiming the land, and it is time to decide who actually deserves it."
 RP_countryevents.47.a:0 "Establish [KTX.GetNameDef]"
 RP_countryevents.47.b:0 "Unite it with [KWC.GetNameDef] to form a grand puppet!"
 RP_countryevents.47.c:0 "Give it to [KMT.GetNameDef]"
 RP_countryevents.47.e:0 "Give it to [KDL.GetNameDef]"

 RP_countryevents.48.t:0 "Fate of Newfoundland"
 RP_countryevents.48.d:0 "Newfoundland was the first part of North America discovered by Europeans. However, the colony there did not last, and was lost to time. After that, it was conquered by the British 700 years later. Now, we can finally decide what happens to it."
 RP_countryevents.48.a:0 "Establish [KFN.GetNameDef]"
 RP_countryevents.48.b:0 "Give it to [KFQ.GetNameDef]"
 RP_countryevents.48.c:0 "Give it to [KDE.GetNameDef]"

 RP_territorialevents.1.t:0 "Calais Question"
 RP_territorialevents.1.d:0 "The occupation of Calais has left major players in the Occupational Government and German Cabinet debating what to do with it."
 RP_territorialevents.1.a:0 "Give it to [KFR.GetNameDef]"
 RP_territorialevents.1.b:0 "Give it to [KBE.GetNameDef]"
 RP_territorialevents.1.c:0 "Give it to [KHO.GetNameDef]"

 RP_territorialevents.2.t:0 "Greater Prussia Question"
 RP_territorialevents.2.d:0 "The occupation of Greater Prussia has left major players in the Occupational Government and German Cabinet debating what to do with it."
 RP_territorialevents.2.a:0 "Annex it into the Reich"
 RP_territorialevents.2.b:0 "Give it to [KPO.GetNameDef]"

 RP_territorialevents.3.t:0 "Burgenland Question"
 RP_territorialevents.3.d:0 "The occupation of Burgenland has left major players in the Occupational Government and German Cabinet debating what to do with it."
 RP_territorialevents.3.a:0 "Give it to [KHU.GetNameDef]"
 RP_territorialevents.3.b:0 "Give it to [KAU.GetNameDef]"
 RP_territorialevents.3.c:0 "We'll take it"

 RP_territorialevents.4.t:0 "South Slovakia Question"
 RP_territorialevents.4.d:0 "The occupation of South Slovakia has left major players in the Occupational Government and German Cabinet debating what to do with it."
 RP_territorialevents.4.a:0 "Give it to [KHU.GetNameDef]"
 RP_territorialevents.4.b:0 "Give it to [KSL.GetNameDef]"
 RP_territorialevents.4.c:0 "Give it to [KCZ.GetNameDef]"

 RP_territorialevents.5.t:0 "Carpathia Question"
 RP_territorialevents.5.d:0 "The occupation of Carpathia has left major players in the Occupational Government and German Cabinet debating what to do with it."
 RP_territorialevents.5.a:0 "Give it to [KHU.GetNameDef]"
 RP_territorialevents.5.b:0 "Give it to [KSL.GetNameDef]"
 RP_territorialevents.5.c:0 "Give it to [KCZ.GetNameDef]"
 RP_territorialevents.5.e:0 "Give it to [KUK.GetNameDef]"

 RP_territorialevents.6.t:0 "Ardennes Question"
 RP_territorialevents.6.d:0 "The occupation of Ardennes has left major players in the Occupational Government and German Cabinet debating what to do with it."
 RP_territorialevents.6.a:0 "Give it to [KBE.GetNameDef]"
 RP_territorialevents.6.b:0 "Give it to [KFR.GetNameDef]"
 RP_territorialevents.6.c:0 "Give it to [KHO.GetNameDef]"
 RP_territorialevents.6.e:0 "We'll take it"
 
 RP_territorialevents.7.t:0 "Krakow Question"
 RP_territorialevents.7.d:0 "The occupation of Krakow has left major players in the Occupational Government and German Cabinet debating what to do with it."
 RP_territorialevents.7.a:0 "Give it to [KPO.GetNameDef]"
 RP_territorialevents.7.b:0 "Give it to [KGZ.GetNameDef]"

 RP_territorialevents.8.t:0 "Bessarabia Question"
 RP_territorialevents.8.d:0 "The occupation of Bessarabia has left major players in the Occupational Government and German Cabinet debating what to do with it."
 RP_territorialevents.8.a:0 "Give it to [KUK.GetNameDef]"
 RP_territorialevents.8.b:0 "Give it to [KRO.GetNameDef]"
 RP_territorialevents.8.c:0 "Give it to [KMO.GetNameDef]"

 RP_territorialevents.9.t:0 "Odessa Question"
 RP_territorialevents.9.d:0 "The occupation of Odessa has left major players in the Occupational Government and German Cabinet debating what to do with it."
 RP_territorialevents.9.a:0 "Give it to [KUK.GetNameDef]"
