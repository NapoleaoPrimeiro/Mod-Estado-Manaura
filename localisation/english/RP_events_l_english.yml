 RP_spanishcrackdownevents.1.t:0 "Spanish Inteference in the Leopold Plot"
 RP_spanishcrackdownevents.1.d:0 "Despite our best efforts to keep our growing influence in the dark, [SPR.GetNameDef] has caught wind of some portions of the project. After doing so, they have replaced some pro-German government officials, and secured various financial deposits in and outside of the country.\n\nBecause of this, we have lost some of our grip in the country, and we must work to regain the influence we had before. However, what we did once, we can do again."
 RP_spanishcrackdownevents.1.a:0 "This is just a minor setback in a major operation!"
 RP_leopoldplot_crackdowneffect_tt:0 "§YInfluence§! in §Y[SPR.GetNameDef]§! will §Rdecrease§! by a random amount. The amount removed will be proportional to the §Yinterference chance§! shown in the category.\n\n§Y[SPR.GetNameDefCap]§! will be less likely to interfere again anytime soon, however this could become more likely again as time goes on.."

 RP_spanishcoupevents.1.t:0 "The Leopold Plot - Success!"
 RP_spanishcoupevents.1.d:0 "At midnight yesterday, members of the [SPR.GetAdjective] government and military, as well as die Deutsches Heer stormed the Palacio de Capitanía. The battle lasted for a few hours, but eventually, we won.\n\nRemnants of the Nationalist Governments has fled to Portugal, and military leaders loyal to the previous regime have pledged to continue the fight. Leopoldist forces have formed a joint military command to administer the nation until an official leader can be assigned."
 RP_spanishcoupevents.1.a:0 "The story has just begun."
 RP_leopoldplot_coupsuccessful:0 "The §YLeopold Plot§! was a success"

 RP_spanishcoupevents.2.t:0 "Spanish Officer Counter-Coup in Ceuta"
 RP_spanishcoupevents.2.d:0 "Remaining Spanish Garrisons in Ceuta and the surrounding area, led by Carlos Pedemonte Sabín, have stormed the city and established a military junta. They have declared their loyalty to the Nationalist Government in Exile.\n\n[ENG.GetNameDefCap] and [FRA.GetNameDef] have sent a message to us and the [SPR.GetNameDef], stating that if we attempt to retake the land, we will enter a state of war with the coalition.\n\nShould we take our chances, or accept defeat?"
 RP_spanishcoupevents.2.a:0 "We need that land for our future plans!"
 RP_spanishcoupevents.2.b:0 "You can have your sand."

 RP_spanishcoupevents.3.t:0 "The Leopold Plot - Failure"
 RP_spanishcoupevents.3.d:0 "Yesterday, battles broke out in [SPR.capital.GetCapitalVictoryPointName] between forces loyal to [SPR.GetNameDef] and to us. German and Spanish forces, dubbed "Leopoldists" attempted to storm the Palacio de Capitanía, but, disorganized and under-equipped, they were beaten back, eventually retreatingto the outskirts of the city.\n\nConsequently, the Leopold Plot has been a near complete failure. We now have two options. We could either attempt to continue the fight, while being severely weakened and demoralized, or pull the leopoldist forces out of Iberia entirely."
 RP_spanishcoupevents.3.a:0 "We will fight on if necessary for years and alone"
 RP_leopoldplot_coupfailure_tt:0 "Some of our underground forces, as well as some Spanish officers loyal to us, will revolt against §Y[SPR.GetNameDef]§!"
 RP_spanishcoupevents.3.b:0 "It is a hopeless situation"

 RP_spanishcoupevents.4.t:0 "Seize the [177.GetName]?"
 RP_spanishcoupevents.4.d:0 "As the region of Iberia becomes more and more unstable as time passes on, the strength of Spanish defenses has grown smaller and weaker. This, combined with our ambitions for Southern Europe, provide a potential opportunity.\n\n[177.GetName] is a strategic location for the Mediterranean, the port city of Palma could enable us to restrict the flow of ships in the region, especially to and from the French coast.\n\nMilitary officers have proposed the following plan: The Regia Marina surrounds the city of Palma while ground troops occupy the port itself. Following this, [177.owner.GetNameDef] will be given a demand, to either hand over the islands or start a full-scale war.\n\nShould we greenlight this plan, or is it too ambitious?"
 RP_spanishcoupevents.4.a:0 "Send them in!"
 RP_spanishcoupevents.4.b:0 "We cannot risk a war at the moment."

 RP_spanishcoupevents.5.t:0 "[ITA.GetNameDefCap] demands the [177.GetName]!"
 RP_spanishcoupevents.5.d:0 "As the war in Iberia devastates the region even more, [ITA.GetNameDef] has evidently identified a weakness.\n\nEarlier this morning, the Regia Marina surrounded the city of Palma, a strategic port city in the [177.GetName]. Following this, ground troops stormed the port. The area fell quickly, with little resistance.\n\n[ITA.GetNameDefCap] has demanded we surrender the islands, or face war. What do we do?"
 RP_spanishcoupevents.5.a:0 "We are too weak, we must surrender."
 RP_spanishcoupevents.5.b:0 "We will never give in!"

 RP_spanishcoupevents.6.t:0 "Question of the New Regime"
 RP_spanishcoupevents.6.d:0 "The time has come. After months of preparing, executing, and fighting, we are now ready to choose the fate of the Spanish government.\n\nThe first option - Friedrich Viktor Pius. He is the grandson of Prince Leopold, of which the Leopold Plot is named after, and is one of the causes of the Franco-Prussian war.\n\nThe second option - Infante Juan. The son of Alfonso VIII, he is the heir to the Bourbon-Spanish throne.\n\nThe third option - Keep the joint military government as leader of [KSP.GetNameDef] indefinitely."
 RP_spanishcoupevents.6.a:0 "The Hohenzollerns, of course! Gott mit uns!"
 RP_fateofspainthrone_fredrickhohenzollern_effect_tt:0 "A §YGerman King§! will be installed as the leader of [KSP.GetNameDef].\n\nAll states will have to undergo an integration process to earn cores."
 RP_spanishcoupevents.6.b:0 "A local king is the best choice."
 RP_fateofspainthrone_infantejuan_effect_tt:0 "A §YSpanish King§! will be installed as the leader of [KSP.GetNameDef].\n\nAll states will be immediately cored."
 RP_spanishcoupevents.6.c:0 "We will keep the current government."
 RP_fateofspainthrone_militarydictatorship_effect_tt:0 "The current government will be kept intact.\n\nAll states will have to undergo an integration process to earn cores."

 RP_leopoldplot_newsevents.1.t:0 "Hohenzollerns in Spain!"
 RP_leopoldplot_newsevents.1.d:0 "Yesterday, pro-German forces, which had been building strength for the last few months in secret, stormed the city in the early morning and seized key points along the city. By the late evening, the so-called "Leopoldist" divisions, named after Leopold, Prince of Hohenzollern, stormed the Palacio de Capitanía, residence of the former government.\n\nGovernment officials who survived the coup have fled to countries across Europe, specifically Portugal and Italy. Most of the military has declared their loyalty to the new government, a joint administrative council between German and Spanish officers.\n\nThe future of Iberia is unclear, but evidently it will be led by Germany."
 RP_leopoldplot_newsevents.1.a:0 "Our grip on Europe tightens.."
 RP_leopoldplot_newsevents.1.b:0 "Spain will not be German!"
 RP_leopoldplot_newsevents.1.c:0 "Blantant disregard for peace!"
 RP_leopoldplot_newsevents.1.e:0 "What will come of this?"

 RP_leopoldplot_newsevents.2.t:0 "Pro-German Uprising in [SPR.GetNameDef]"
 RP_leopoldplot_newsevents.2.d:0 "Yesterday, fighting broke out across major cities in Western Spain. Pro-German forces, refered to as "Leopoldist" divisions, named after Leopold, Prince of Hohenzollern, attempted to storm the Palacio de Capitanía in Burgos, however they were unable to gain a foothold in the city, and were forced to retreat outside of the city.\n\n[GER.GetNameDefCap] has not made a formal statement about the ongoing situation, but they are reportedly preparing to send a more advanced military force to Iberia. \n\nWhether or not the fighting will last is unknown, but it is clear this will shatter the balance of power in Europe."
 RP_leopoldplot_newsevents.2.a:0 "A minor setback."
 RP_leopoldplot_newsevents.2.b:0 "Spain will not be German!"
 RP_leopoldplot_newsevents.2.c:0 "Blantant disregard for peace!"
 RP_leopoldplot_newsevents.2.e:0 "What will come of this?"

 RP_leopoldplot_newsevents.3.t:0 "Spanish Officer Counter-Coup in Ceuta!"
 RP_leopoldplot_newsevents.3.d:0 "Yesterday, with the assistance of [FRA.GetNameDef] and [ENG.GetNameDef], Governor of Spanish Morocco Carlos Pedemonte Sabín and his troops launched a surprise attack against the city of Ceuta, seizing key buildings and ports. Following this, he announced the restoration of the Nationalist government, and multiple revolts led by Spanish garrisons broke out across Equatorial Guinea and Saharan Morocco.\n\n[FRA.GetNameDefCap] and [ENG.GetNameDef] were quick to send messages to any governments that might threaten the existance of [SFC.GetNameDef], warning them against any aggression."
 RP_leopoldplot_newsevents.3.a:0 "We earned that land!"
 RP_leopoldplot_newsevents.3.b:0 "That is rightful Spanish territory!"
 RP_leopoldplot_newsevents.3.c:0 "Don't touch them!"
 RP_leopoldplot_newsevents.3.e:0 "Interesting.."

 RP_leopoldplot_newsevents.4.t:0 "[ITA.GetNameDefCap] seizes the [177.GetName]!"
 RP_leopoldplot_newsevents.4.d:0 "As tensions continue to escalate and relations continue to deteriorate across Europe, a new crisis has begun.\n\nEarlier this morning, ships of the Regia Marina surrounded the Port of Palma and sent a message to the small military garrison and governor on the island, demanding they surrender control of the archipelago to the [ITA.GetAdjective] regime.\n\nAfter much deliberation between the government of [177.owner.GetNameDef] and their military, they decided to surrender control of the islands to [ITA.GetNameDef]."
 RP_leopoldplot_newsevents.4.a:0 "They can have it, who wants some useless islands anyway?"
 RP_leopoldplot_newsevents.4.b:0 "Those are our islands!"
 RP_leopoldplot_newsevents.4.c:0 "Please stop.."
 RP_leopoldplot_newsevents.4.e:0 "Will this be the last crisis?"
 RP_leopoldplot_newsevents.4.f:0 "We rule the Meditteranian!"

 RP_leopoldplot_newsevents.5.t:0 "The Balearic War!"
 RP_leopoldplot_newsevents.5.d:0 "Tensions in Europe have finally boiled over, and a new war has broken out in the Meditteranian.\n\nEarlier this morning, ships of the Regia Marina surrounded the Port of Palma and sent a message to the small military garrison and governor on the island, demanding they surrender control of the archipelago to the [ITA.GetAdjective] regime.\n\nAfter discussing for hours amongst themselves, [177.owner.GetNameDef] decided they would not surrender control of the islands, citing their own security and the strategic location of Palma. Following this, the Italian fleet opened fire on Palma, leading to a declaration of war on [ITA.GetNameDef]."
 RP_leopoldplot_newsevents.5.a:0 "Do not touch our land!"
 RP_leopoldplot_newsevents.5.b:0 "For the Spanish people!"
 RP_leopoldplot_newsevents.5.c:0 "We have to do something about this!"
 RP_leopoldplot_newsevents.5.e:0 "Of course.."
 RP_leopoldplot_newsevents.5.f:0 "It is our rightful territory!"

 # Misc Events
 
 RP_miscevents.1.t:0 "Alfried Krupp Approaches Us"
 RP_miscevents.1.d:0 "Alfried Krupp, owner of Friedrich Krupp AG Hoesch-Krupp, has approached us today with a proposal.\n\nHis company, with himself as the leader, will setup a government in [KKA.GetNameDef], dissolving the current government there. He says he will take control of the resources and manage the region to turn it into a massive Corporate State.\n\nShould we accept, or should we get rid of him?"
 RP_miscevents.1.a:0 "It's so weird.. I love it!"
 RP_miscevents.1.b:0 "What the hell? No!"

 RP_miscevents.2.t:0 "Install an Ethiopian Monarch?"
 RP_miscevents.2.d:0 "We have received a request from the Emperor of Ethiopia. \n\nHaile Selassie, emperor of Ethiopia since 1930, has approached the government and requested to be put in charge of [KBY.GetNameDef]. This would make resistance much easier to manage; however, it could upset other members of the German government.\n\nWhat should we do?"
 RP_miscevents.2.a:0 "This is a great idea!"
 RP_miscevents.2.b:0 "No! [KBY.GetNameDefCap] will remain a colony!"

 RP_miscevents.6.t:0 "The Eiffel Tower Collapses"
 RP_miscevents.6.d:0 "As the frontline passed Paris, not all fighting ceased in the city. This was shown in an incident that occured today.\n\nUnder the leadership of Reichsgouverneur [KFR.GetLeader], Guerilla Warfare has not been crushed as the government would've hoped. Today, a horrific and unfortunate series of events transpired that resulted in the complete destruction of the Eiffel Tower.\n\nThis morning, a group of French Resistance fighters opened fire on German Garrisons in the city center. The entire garrison was massacred, and their equipement was stolen. Later, German troops spotted a small group of French citizens near the Eiffel Tower. Despite repeated warnings, they didn't stop. Eventually, after a soldier opened fire, they ran up the stairs of the landmark, barricading themselves in the top and attacking any troops they could.\n\nA German Engineer Corp setup explosives near the Southwest Base of the tower, intending to bring the tower down. At 1:02 PM today, the tower collapsed after a massive explosion rang out across Paris.\n\nThis has been quite an unfortunate event, and [KFR.GetLeader] has made a formal apology."
 RP_miscevents.6.a:0 "Oh well.."

 RP_miscevents.7.t:0 "A Strange Woman Appears.."
 RP_miscevents.7.d:0 "Marie-Adélaïde, former Grand Duchess of Luxembourg, who was believed to be dead, has approached the Kaiser, shocking him and his family.\n\nMarie-Adélaïde was the Grand Duchess of Luxembourg during the Great War and throughout our occupation of our nation. Despite never collaborating with our nation, she was rumored be loyal to the Kaiser, causing mass hatred for her and her regime. Because of this, she was pressured into abdication in early 1919. 5 years later, she died.\n\nHowever, here she is, standing in front of the Kaiser. She has explained that she became aware of a plot to assassinate her by Catholic extremist militias funded by Britain and planned by the NKVD. Thus, her only option was to fake her death and flee to Little St. James, a small island in the Virgin Islands.\n\nAfter our occupation of her home country, she took a plane to Ecuador, then Guam, and then to Japan. From there, she was assisted by the Imperial Japanese government to secretly fly to Brandenburg. Now, she has declared her official loyalty to the Kaiser, and has requested she be installed as Grand Duchess of a vassal state in Luxembourg."
 RP_miscevents.7.a:0 "We will give it a shot."
 RP_miscevents.7.b:0 "She is an enemy! Kill her!"

