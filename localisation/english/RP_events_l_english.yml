 RP_gran_colombia.1.t:0 "Restore Gran Colombia?"
 RP_gran_colombia.1.d:0 "The oil-rich region of Northern South America has been nothing but a headache for our administration. Terrorists and rebels run rampant in the jungle, leaving our forces clueless in a hostile land. However, our time in the region has earned us some valuable allies. With the right moves, we could sway local leaders into collaboration in exchange for the reformation of Gran Columbia. Realizing Bolivar's dream would no doubt increase our popularity with the locals."
 RP_gran_colombia.1.a:0 "A noble cause, surely."
 RP_gran_colombia.1.b:0 "We can manage without them."
 
 RP_brazilian_empire.1.t:0 "Restore the Empire of Brazil?"
 RP_brazilian_empire.1.d:0 "The vast and populous Brazilian colony has quickly became a hotbead of anti-government resistance. By restoring the old Brazilian emperor, we can create legitimacy for German rule."
 RP_brazilian_empire.1.a:0 "Brazil would be best governed by Brazilians..."
 RP_brazilian_empire.1.b:0 "We can handle it."
 
 RP_brazilian_empire.2.t:0 "Fate of Uruguay"
