l_english:
 RP_livoniaevents.1.t:0 "Should [KLV.GetNameDef] Restore the Livonian Order?"
 RP_livoniaevents.1.d:0 "If you select yes, [KLV.GetNameDef] will go down the Livonian focus branch, eventually breaking free and declaring war on Germany. If you select no, they will go down their imperial German branch, solidifying German influence and securing their eastern border."
 RP_livoniaevents.1.a:0 "Yes"
 RP_livoniaevents.1.b:0 "Are you insane? No"

 RP_livoniaevents.2.t:0 "[KLV.GetName] Declares Independence!"
 RP_livoniaevents.2.d:0 "[KLV.GetNameDefCap] delivered a message to the German government today, formally declaring independence from both Germany and Mitteleuropa. We have also lost contact with all of our officials in Livonia, with current intelligence suggesting they may have been executed. The German High Command has outlined three options for dealing with our unruly subject. \n\nOption 1 involves imposing a full embargo on Livonia and blocking all trade, an attempt to starve them back into submission. This is considered the least risky course of action. \n\nOption 2 calls for military intervention. Once Livonia has been subdued, the German Army would administer the region directly until loyalty is firmly re-established. \n\nInterestingly, a small minority within the High Command has put forward Option 3; to simply ignore the matter. They argue that Livonia will eventually see the error of its ways and return to Germany on its own. Most within the High Command, however, doubt this proposal has any chance of success. \n\nHigh command's opinion aside, the final decision is up to you, Your Majesty."
 RP_livoniaevents.2.a:0 "We'll go with option 1, starve them out!"
 RP_livoniaevents.2.b:0 "Option 2 makes the most sense, mobilize the army!"
 RP_livoniaevents.2.c:0 "Option 3, best not get involved"

 RP_livoniaevents.3.t:0 "Livonian Forces Cross Lithuanian Border!"
 RP_livoniaevents.3.d:0 "We've just received confirmed reports of Livonian armed forces crossing the Lithuanian border. Minimal resistance was offered, due to widespread shock among both the populace and local defenses, as well as the overwhelming numbers Livonia committed to the attack. \n\nEarly predictions within the High Command suggested they would push onward into Prussia, although it appears they have halted at the Prussian border. Their official justification is the protection of the largely Catholic population of Lithuania from the Protestant led German Empire. \n\nThese recent developments have caused significant panic within the German cabinet, and the army has already been mobilized along the Prussian-Lithuanian border. \n\nThey now await your response, Your Majesty."
 RP_livoniaevents.3.a:0 "Send in the army!"
 RP_livoniaevents.3.b:0 "Demand reparations"
 RP_livoniaevents.3.c:0 "Whatever..."

 RP_livoniaevents.4.t:0 "Germany Demands Compensation"
 RP_livoniaevents.4.d:0 "Following our annexation of [KLI.GetNameDef], Germany demanded a significant amount of money as compensation for the lost territory. Of course, we could always reject, however that would risk serious escalation of the already fragile relations with Germany."
 RP_livoniaevents.4.a:0 "Agree to German terms"
 RP_livoniaevents.4.b:0 "Never!"

 RP_livoniaevents.5.t:0 "Livonia Rejects!"
 RP_livoniaevents.5.d:0 "[KLV.GetNameDefCap] has rejected our demands for compensation for their annexation of our Lithuanian puppet. They should very well know what the next course of action is."
 RP_livoniaevents.5.a:0 "War!"

 RP_livoniaevents.6.t:0 "[KLV.GetNameDefCap] Proposes Population Exchange Program"
 RP_livoniaevents.6.d:0 "[KLV.GetNameDefCap] recently delivered a rather interesting proposal to our government. \n\nAlthough our relations with Livonia have been rather strained recently, they have proposed cooperation in a population exchange program. Livonia would deport some of their radical Protestant citizens to Germany, and we would send them some of our radical Catholic citizens in exchange. \n\nThey claim that it would benefit both nations and help to stabilize europe. However, the offer should be approached with caution due to the recent political manuevering of Livonia."
 RP_livoniaevents.6.a:0 "Sure"
 RP_livoniaevents.6.b:0 "What? Absolutely not"

 RP_livoniaevents.7.t:0 "[KLV.GetNameDefCap] Requests Occupation of Lithuania"
 RP_livoniaevents.7.d:0 "[KLV.GetNameDefCap] has requested we turn over all of Lithuania to them. Citing the majority Catholic population as the main basis for the request. We have no real reason to accept this, however it may be worth while to demand compensation for Lithuania rather then flat out refusing."
 RP_livoniaevents.7.a:0 "No!"
 RP_livoniaevents.7.b:0 "Demand compensation"
 RP_livoniaevents.7.c:0 "They can have it"

 RP_livoniaevents.8.t:0 "The 2nd German Civil War!"
 RP_livoniaevents.8.d:0 "Localized religious unrest in Bavaria has escalated into a coordinated uprising. Church bells, once symbols of spiritual devotion now serve as signals to organize and mobilize resistance. Religious networks have repurposed parishes and monasteries into regional headquarters, uniting the clergy, rural militias, and sympathetic local officials in open defiance of the German Empire. \n\nCalling for an independent Bavarian state, they've already begun sabotaging rail lines, ambushing German army units, and driving out what few imperial officials still remain. Rural militias roam the countryside, gathering volunteers as they go, severing communication lines, sowing chaos among regional commands, and further delaying a coherent response.\n\nTo make matters worse, Livonian forces have been spotted crossing the Prussian border, and it's rumored that Austria may support the rebels.\n\nThe very legitimacy and integrity of the German Empire is at stake here.\n\nWe must crush these rebels."
 RP_livoniaevents.8.a:0 "Für das Vaterland!"

 RP_livoniaevents.9.t:0 "Austria sides with Bavaria!"
 RP_livoniaevents.9.d:0 "Austrian army units across the Alps have begun declaring their loyalty to the rebellion. Large Catholic miltiias have crossed the Bavarian border to aid in the conflict, while units bearing Livonian insignia secure vital supply networks. \n\nAlong with this, Otto von Habsburg has proclaimed his support for the rebellion, which has significantly damaged German legitimacy in the region."
 RP_livoniaevents.9.a:0 "Gott mit uns!"

 RP_livoniaevents.10.t:0 "Bavarian Rebellion Succeeds!"
 RP_livoniaevents.10.d:0 "With large portions of the German Army tied up un Bavaria, along with the chaos in Berlin, we can now begin our invasion of Prussia!"
 RP_livoniaevents.10.a:0 "Wunderbar!"

 RP_livoniaevents.11.t:0 "Germany Accepts Population Exchange Program"
 RP_livoniaevents.11.d:0 "Germany has accepted our proposal to exchange Protestant radicals for Catholic Germans."
 RP_livoniaevents.11.a:0 "Yay"

 RP_livoniaevents.12.t:0 "[KLV.GetNameDefCap] Offers Peace"
 RP_livoniaevents.12.d:0 "Having made decent head-way against the German Army, the Livonian Government has delivered their terms for peace. Their terms are as follows \n\nGermany will transfer all former Bavarian territory to [BAY.GetNameDefCap], along with granting independence to [WUR.GetNameDefCap]. Germany is also to surrender Eastern Prussia, Danzig, and Gdynia to the Livonian Order, and recognize the governments of Livonia and their allies. \n\nThese terms practically undo all of our work over the last 70 years, accepting this would surely cause massive public outrage and destroy the legitimacy of our governemnt."
 RP_livoniaevents.12.a:0 "We have no choice but to accept"
 RP_livoniaevents.12.b:0 "Absolutely not!"

 RP_livoniaevents.13.t:0 "Germany Accepts!"
 RP_livoniaevents.13.d:0 "The German Government has agreed to sign a peace treaty under our terms! The terms we proposed are as follows \n\nGermany will transfer all former Bavarian territory to [BAY.GetNameDefCap], along with granting independence to [WUR.GetNameDefCap]. Germany is also to surrender Eastern Prussia, Danzig, and Gdynia to the Livonian Order, and recognize the governments of Livonia and their allies."
 RP_livoniaevents.13.a:0 "Catholicism shall dominate once more!"

 RP_livoniaevents.14.t:0 "Germany Rejects!"
 RP_livoniaevents.14.d:0 ""
 RP_livoniaevents.14.a:0 "NO"

 RP_livoniaevents.15.t:0 "[KLV.GetNameDefCap] Requests Weapon Shipments"
 RP_livoniaevents.15.d:0 "Citing internal instability and the need for defenses along the eastern border, [KLV.GetNameDefCap] has requested German weapons and equipment to rebuild the Baltische Landeswehr."
 RP_livoniaevents.15.a:0 "Yes of course, we will fully commit to supporting them"
 RP_livoniaevents.15.b:0 "We will commit to limited arms shipments"
 RP_livoniaevents.15.c:0 "We can't spare anything"

 RP_livoniaevents.16.t:0 "Germany Commits Fully to our Rearmament!"
 RP_livoniaevents.16.d:0 "Germany has agreed to fully supply our new plans to rebuild the Baltic army, agreeing to send us 12,500 rifles, 1,000 pieces of support equipment, and 1,350 pieces of artillery."
 RP_livoniaevents.16.a:0 "Wonderful!"

 RP_livoniaevents.17.t:0 "Germany Agrees to Limited Rearmament"
 RP_livoniaevents.17.d:0 "Germany has agreed to our rearmament, just not on as large a scale as we had wished and originally proposed. Stating that the equipment is needed elsewhere and that eastern defenses aren't necessary at the moment, with them stating we should focus on internal stability instead. They have sent us 7,500 rifles, 500 pieces of support equipment, and 600 pieces of artillery."
 RP_livoniaevents.17.a:0 "Anything helps"

 RP_livoniaevents.18.t:0 "Germany Rejects our Request for Equipment"
 RP_livoniaevents.18.d:0 "Germany has denied our requests for equipment, stating they do not have any to spare."
 RP_livoniaevents.18.a:0 "Damn!"

 RP_livoniaevents.19.t:0 "[KLV.GetNameDefCap] Seeks Investments"
 RP_livoniaevents.19.d:0 "[KLV.GetNameDefCap] has requested we provide funding for their development projects. Doing so could significantly speed up their construction efforts, however it would of course come at a cost."
 RP_livoniaevents.19.a:0 "We shall make major investments"
 RP_livoniaevents.19.b:0 "We shall make minor investments"
 RP_livoniaevents.19.c:0 "No"

 RP_livoniaevents.20.t:0 "[KLV.GetNameDefCap] Requests Control Over [KCS.GetNameDefCap]"
 RP_livoniaevents.20.d:0 "Citing the historical unification of both states in the wake of the Great War, along with [KCS.GetNameDefCap]'s population being almost entirely made up of Latvians, [KLV.GetNameDefCap] has requested that the two states merge once more."
 RP_livoniaevents.20.a:0 "Yes, we will give them Courland"
 RP_livoniaevents.20.b:0 "No"
 RP_livoniaevents.20.c:0 "We will give them both Courland and Riga"

 RP_livoniaevents.21.t:0 "The Fate of the Baltic Resistance"
 RP_livoniaevents.21.d:0 "The [KLV.GetName] has been plagued with nationalist resistance for some time now, factory workers strike, civilians protest, and underground independence movements continue to gain popularity. However, the government of [KLV.GetNameDefCap] believes it is ready to tackle the problem, and has laid out two paths in dealing with the resistance. \n\nThe destruction of Baltic Nationalism: The Baltic army is deployed in a brutal campaign against resistance forces, officials with nationalist sympathies are purged, and a sweeping Germanization program re-establishes Germans as the dominant people within the region. This path would take significantly longer, but upon completion would eliminate all negative modifiers stemming from nationalist resistance. \n\nPeaceful Coexistence: The Baltic government attempts to bridge the divide among Latvian, Estonian, and German peoples, collaborating with locals and granting measured concessions. This path is significantly faster, however it will never truly remove the threat of nationalist resistance within the Baltics. \n\nUltimately, the choice is up to you, Your Majesty."
 RP_livoniaevents.21.a:0 "We do not negotiate with terrorists"
 RP_livoniaevents.21.b:0 "Peaceful cooperation will be better for long term stability"
 RP_livoniaevents.21.c:0 "Germanization must be achieved. Additionally, they should prioritize integration into Germany"

 RP_livoniaevents.23.t:0 "The Baltic Jewel"
 RP_livoniaevents.23.d:0 "The United Baltic Duchy has completed their sweeping revitalization program, reforming infrastructure, completely overhauling the Baltic coast, and greatly increasing the nation's industrial output. The project additionally invests heavily into the tourism industry, positioning the Baltic coast as the premier vacation destination for a triumphant Germany. \n\nThe Baltic Duchy stands as a testament to German economic prosperity and hegemony over the east, adding one more success to an ever-growing list."
 RP_livoniaevents.23.a:0 "Ok"

 RP_livoniaevents.24.t:0 "Integration of [KLV.GetNameDefCap]"
 RP_livoniaevents.24.d:0 "After extensive Germanization programs, along with the brutal destruction of any lingering resistance or otherwise nationalist elements within the Baltic states, it is finally time to integrate our Baltic brethren."
 RP_livoniaevents.24.a:0 "Nice"

 RP_livoniaevents.25.t:0 "[KLV.GetNameDef] Requests Funding"
 RP_livoniaevents.25.d:0 "The [KLV.GetName]'s government has presented us with a plan to completely rebuild and revitalize the Baltic economy and standard of living. Their plan entails sweeping housing reforms, extensive infrastructure expansion, and renewed maritime investment programs. \n\nThis would position the Baltic States as one of the region's leading cultural and economic centers, with the Baltic government aiming to complete it within a year. This, of course, comes with a catch, that being they have requested significant financial aid from Germany to complete it in a timely fashion. \n\nThis project would ensure long-term stability within the Baltic states, along with potential financial benefits on our end upon its completion. But ultimately, the decision is up to the Kaiser."
 RP_livoniaevents.25.a:0 "We can't spare anything"
 RP_livoniaevents.25.b:0 "We will fund their project"






















 RP_ukrainianevents.1.t:0 "Establish the Grand Duchy of Ukraine?"
 RP_ukrainianevents.1.d:0 "Instead of restoring the Ukrainian State under Pavlo Skoropadsky, we could give the Ukrainian throne to Archduke Wilhelm of Austria. He is definitely more popular among the Ukrainian people, however his loyalty to Germany is questionable at best. \n\nNote for the player, clicking Yes will unlock a couple extra focuses for the Ukrainian AI to do, along with allowing you to give Ukraine to the Austro-Hungarian forced ally. However, there may be other downsides..."
 RP_ukrainianevents.1.a:0 "This is a great idea!"
 RP_ukrainianevents.1.b:0 "Absolutely not"

 RP_ukrainianevents.2.t:0 "Incorporate the Grand Duchy of Ukraine into the Austrian Realm?"
 RP_ukrainianevents.2.d:0 "With the restoration of the Austro-Hungarian Empire, alongside an Austrian noble being placed on the throne of Ukraine, we now have the option to grant overlordship over Ukraine to Austria."
 RP_ukrainianevents.2.a:0 "Sure"
 RP_ukrainianevents.2.b:0 "Absolutely not!"

 RP_ukrainianevents.3.t:0 "The Breadbasket of Europe"
 RP_ukrainianevents.3.d:0 "Ukraine's black earth soil, or Chernozem, has long made Ukraine one of the most fertile lands in Europe. Being referred to as the Breadbasket of Europe, Ukraine plays a crucial role in the global wheat trade. \n\nNow, with the defeat of Soviet Russia, and the total solidification of German hegemony over the east, We can now restart our program of grain requisitioning, ensuring We can never fall victim to another naval blockade. \n\nHowever, if this program is mismanaged, it could have dire effects on the Ukrainian populace, already scarred from the tragedies of the Holodomor."
 RP_ukrainianevents.3.a:0 "Okay"
 RP_ukrainianevents.3.b:0 "No thanks, I don't want access to the decision minigame"

 RP_ukrainianevents.4.t:0 "The Second Ukrainian Famine"
 RP_ukrainianevents.4.d:0 "The extensive exploitation, diversion, and reappropriation of Ukrainian grain has resulted in the total collapse of the Ukrainian food supply. Thousands of rural communities starve as German soldiers continue to take their produce. Urban markets are mobbed with hungry civilians as the last remaining stock dries up. Droves of starving peasants wander the country side, searching for new homes safe from German requisition detachments. \n\nWe must act swiftly, if we intend to retain control over Ukraine, as extensive aid will need to be provided. Any provocation of the Ukrainian People could result in the total collapse of any remaining semblance of social order. \n\nThe famine is only just beginning."
 RP_ukrainianevents.4.a:0 "May God have mercy on the Ukrainian people"

 RP_ukrainianevents.5.t:0 "The Ukrainian Famine Ends"
 RP_ukrainianevents.5.d:0 "Our relief programs have proved successful! Starvation is no longer commonplace, peasants no longer roam the countryside in search of food, and the angry mobs sacking the major cities have settled down. \n\nThe recovery did not come easy, however. Emergency grain shipments combined with the halting of requisition quotas have drained our grain reserves. \n\nThe Ukrainian people may never trust us again, but for now, our control remains."
 RP_ukrainianevents.5.a:0 "Yay"

 RP_ukrainianevents.6.t:0 "Collapse of Civil Order in Ukraine"
 RP_ukrainianevents.6.d:0 "A little over a week ago, several of our Requisition Detachments performing their routine patrols near the city of Kyiv were ambushed. Immediately afterward, several of our officials directly in Kyiv were assassinated, and a group calling itself the "Revolutionary Insurgent Army of Ukraine" seized the city in its entirety. Armed peasant militias began combing the region, slaughtering the remaining German patrols, who were unaware of the situation unfolding. \n\nA few days after Kyiv fell to the anarchists, the city of Vinnytsia fell to a militia calling themselves the "Ukrainian People's Army". They then reinstated the government in-exile of the Ukrainian People's Republic, which had backed and orchestrated the uprising in Vinnytsia. After which, the Ukrainian People's Army launched offensives into the neighboring regions of Zhytomyr and Proskuriv, catching our garrisons off guard and woefully underprepared. Welcomed by cheering peasants, the army advanced as the German garrisons were forced to withdraw. \n\nMost peculiarly, Tukhachevsky, who was thought to be dead, has seized parts of eastern Ukraine, and is now threatening the Ukrainian State's eastern flank with a surprisingly well-equipped army. \n\nWhether this will mark the decline of Imperial German influence over the east remains to be seen."
 RP_ukrainianevents.6.a:0 "Verdammt!"

 RP_ukrainianevents.7.t:0 "Ukraine Requests Western Ukraine"
 RP_ukrainianevents.7.d:0 "Citing the regions majority Ukrainian population, the government of [KUK.GetNameDefCap] has requested the territory be transferred to their administration."
 RP_ukrainianevents.7.a:0 "Sure"
 RP_ukrainianevents.7.b:0 "They can have Bucovina too"
 RP_ukrainianevents.7.c:0 "No"

 RP_ukrainianevents.8.t:0 "Ukraine Proposes Unification"
 RP_ukrainianevents.8.d:0 ""
 RP_ukrainianevents.8.a:0 "Ok"

 RP_ukrainianevents.9.t:0 "Ukraine and Crimea Propose Unification"
 RP_ukrainianevents.9.d:0 "Over the past few weeks, the governments of both Ukraine and Crimea have been discussing the proposal of a federation of their two nations. The talks have since concluded with both nations agreeing, and they now seek the blessing of Berlin."
 RP_ukrainianevents.9.a:0 "Sure"
 RP_ukrainianevents.9.b:0 "Nope"