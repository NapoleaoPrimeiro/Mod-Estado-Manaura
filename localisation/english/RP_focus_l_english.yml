l_english:
 RP_GER_operation_oscar:0 "Unternehmen Oskar"
 RP_GER_operation_oscar_desc:0 "Dutch Ports and Supply Hubs in the Netherlands are crucial in the war against France and the United Kingdom. With the invasion of Belgium, we now have a clear path to Amsterdam and The Hague."

 RP_GER_finalvictory:0 "Final Victory"
 RP_GER_finalvictory_desc:0 "We have avenged our fallen brothers from the Great War, and finally put an end to the horrific French subjugation we were subjected to for so long. Now, it's time to impose our will on our enemies."

 RP_GER_operationanton:0 "Case Anton"
 RP_GER_operationanton_desc:0 "Despite the signing of the Treaty of Sedan just a year ago, the new French government still serves as a threat to the New Order. It is time we finish them off entirely."
 RP_GER_operationanton_requirement_tt:0 "It has been more than a year since the §YTreaty of Sedan§! was signed."

 RP_GER_operation_leopold:0 "Leopold Plot"
 RP_GER_operation_leopold_desc:0 "The Spanish Civil War opened a unique opportunity to expand our sphere of influence even further into Southern Europe. If we build enough influence in war battered Spain, we could force the overthrow of the new government, and install a new pro-German government."

 RP_GER_balkan_sweep:0 "Sweep the Balkans"
 RP_GER_balkan_sweep_desc:0 "The Balkans are one of the last remaining holdouts that is not under our direct control or influence in Europe. We need to make sure our enemies can not take advantage of the region, and launch an operation to end enemy influence there."

 RP_GER_betraybrothers:0 "Backstab our Brothers"
 RP_GER_betraybrothers_desc:0 "The alliance with our neighbors to the south was always meant to be one of convenience. They hold lands which belong to us, and thus their government must fall."
 RP_betrayedanally:0 "Betrayed an Ally"
 
 RP_GER_thekingdomofgalicialodermania:0 "The Kingdom of Galicia-Lodomeria"
 RP_GER_thekingdomofgalicialodermania_desc:0 "To continue our conquests east, we can demand the former lands of Galicia-Lodermania. Once a kingdom controlled by the Austrian Empire, it was stolen by the Kingdom of Poland. Now, it's time to take it back."

 RP_GER_operation_portal:0 "Operation Portal"
 RP_GER_operation_portal_desc:0 "[POR.GetNameDefCap] has been an ally of the British for far too long and pose a significant threat to our interests, ourselves, and our allies. We must take care of the problem before it takes care of us."

 RP_GER_operation_vanilla:0 "Operation Vanilla"
 RP_GER_operation_vanilla_desc:0 "[SFC.GetNameDefCap] is a stain on our record of victories across the world. Now is the time to avenge our loss, and retake what was stolen from us."

 RP_GER_retakebalearicislands:0 "Retake the Balearic Islands"
 RP_GER_retakebalearicislands_desc:0 "[ITA.GetNameDefCap], a nation aiming to dominate Southern Europe, took the Balearic Islands from us with force. It is now time to retake the islands."

 RP_GER_strikeatthecradle:0 "Strike at the Cradle"
 RP_GER_strikeatthecradle_desc:0 "Controlling the region of Iraq would open the gateway to the Persian Gulf and the Indian Ocean, making international trade easier."

 RP_GER_occupyarabia:0 "Occupy Arabia"
 RP_GER_occupyarabia_desc:0 "Britain has held control over colonies in Arabia for far too long, and occupying these colonies would be a major blow to the British Empire, as well as opening access to Egypt and India. However, to access them all, we first have to strike at [SAU.GetNameDef]."

 RP_GER_yemeniquestion:0 "The Yemeni Question"
 RP_GER_yemeniquestion_desc:0 "[YEM.GetNameDefCap] is in a unique place that we can exploit. If we occupy them, we can control a major chokepoint in the Red Sea, cutting off Britain's route to Asia through the Suez. However, we might not have to occupy them. We could make an offer to guarantee control over South Yemen and Aden in exchange for an alliance. Alternatively, we could just invade them."

 RP_GER_operationajax:0 "Operation Ajax"
 RP_GER_operationajax_desc:0 "Iran holds a strategic location in the Eastern Hemisphere. If we controlled the region, it'd open access to India, as well as Central Asia and into China. We must take control of the region, no matter the cost."

 RP_GER_proclaim_germaneurope:0 "Proclaim the New Europe"
 RP_GER_proclaim_germaneurope_desc:0 "We have been liberated from our shame of the Great War. Our enemies have been defeated and we have reclaimed the land we have lost and we have taken even more. Europe is ours."
 RP_GER_germaneurope:0 "The New Europe"

 RP_GER_endthesoutherncrisis:0 "End The Southern Crisis"
 RP_GER_endthesoutherncrisis_desc:0 "The Italian Peninsula holds a strategic point in the crossroads between Europe and Africa. If we control it, we could restrict shipping through the mediterranean with it's 3 major chokepoints. The war that is tearing themselves apart could make the establishment of a friendly regime easier."
 RP_focustreeevents.9.t:0 "Intervention in the Italian Civil War"
 RP_focustreeevents.9.d:0 "The Italian Peninsula holds a strategic point in the crossroads between Europe and Africa. If we control it, we could restrict shipping through the mediterranean with it's 3 major chokepoints. \n\nThe war that is tearing themselves apart could make the establishment of a friendly regime easier. We could either attack the old regime, getting rid of the fascists and making ourselves friendlier with the new regime, or attack the new regime and ally with the fascists.\n\nAdditionally, we could attack both and reinstall the king."
 RP_focustreeevents.9.a:0 "Attack the Fascists"
 RP_focustreeevents.9.b:0 "Attack the Socialists"
 RP_focustreeevents.9.c:0 "Let's go with the third option.."

 RP_GER_operationemerald:0 "Operation Emerald"
 RP_GER_operationemerald_desc:0 "Ireland is a gateway into the North Atlantic and the British Isles. If we can control the island, we can establish a full blockade around the British Isles, and use western ports as a jumping place for Atlantic operations."

 # Nordic Stuff

 RP_GER_securethenorthsea:0 "Secure the North Sea"
 RP_GER_securethenorthsea_desc:0 "If we control the North Sea, we can establish a blockade along the entirety of Eastern Britain. To most efficiently gain control, we must take the strategic ports in Norway."

 RP_GER_fallj:0 "Fall J"
 RP_GER_fallj_desc:0 "If we control Denmark, we can effectively cutoff Northern Russia from international supply routes. Additionally, it creates a much shorter coastline for the British to attack us from."

 RP_GER_dismantle_hanssoncabinet:0 "Dismantle the Hansson Cabinet"
 RP_GER_dismantle_hanssoncabinet_desc:0 "Gustaf V is being unfairly limited by the democratic institutions of Sweden. It is time we liberate our old friend from liberalism."
 RP_focustreeevents.1.t:0 "[GER.GetNameDefCap] Demands Dissolution of Democratic Institutions!"
 RP_focustreeevents.1.d:0 "[GER.GetNameDefCap], led by [GER.GetLeader], recently sent a list of demands to us, which consisted of joining the [GER.GetFactionName] and giving Gustaf V complete power, in place of democracy.\n\nThese demands are obviously outrageous, and clearly intend on turning us into a puppet of [GER.capital.GetCapitalVictoryPointName]. However, we may not have a choice. Over the last few years, the German military has been growing stronger, and it might not be worth it to start such a risky war with our neighbor.\n\nWhat do we do?"
 RP_focustreeevents.1.a:0 "We have no choice.."
 RP_focustreeevents.1.b:0 "No! We will fight for our liberty!"
 RP_focustreeevents.2.t:0 "[SWE.GetNameDefCap] Caves"
 RP_focustreeevents.2.d:0 "[SWE.GetNameDefCap] has informed us they believe they have no choice but to accept our demands, and have begun to dissolve the Republic."
 RP_focustreeevents.2.a:0 "Wunderbar!"
 RP_focustreeevents.3.t:0 "[SWE.GetNameDefCap] Refuses!"
 RP_focustreeevents.3.d:0 "[SWE.GetNameDefCap] has replied to our demands, stating they will not comply with demands that so obviously turn them into a vassal state."
 RP_focustreeevents.3.a:0 "This is an act of war.."

 # Generic Puppet Focus Tree

 RP_GEN_establishanewgovernment:0 "Establish a New Government"
 RP_GEN_establishanewgovernment_desc:0 "Every country needs a government, and we are now a completely seperate political entity from both [GER.GetNameDef] and the region we occupy. We must organize a new administration, and quickly."

 RP_GEN_reinstate_former_officials:0 "Reinstate Former Officials"
 RP_GEN_reinstate_former_officials_desc:0 "Despite the opposition most officials of the independent government have towards us, some advisors still have some loyalties to their homeland itself, and might choose to join us rather than oppose us."
 RP_returnofformerofficials:0 "Return of Former Officials"

 RP_GEN_loyalist_advisors:0 "Install Loyalist Advisors"
 RP_GEN_loyalist_advisors_desc:0 "By filling our new government with loyalist officials, we can ensure no dissent or anti-german corruption in cooperation with the previous regimes."
 RP_loyalistadvisors:0 "Installation of Loyalist Advisors"

 RP_GEN_ecip:0 "Emergency Constituent Integration Programs"
 RP_GEN_ecip_desc:0 "There are various areas under our control that are in desperate need of integration into the government. It is very likely any dissent could boil over into full rebellion. We must solve these problems immediately."
 RP_ecip:0 "Emergency Constituent Integration Programs"
 add_1_to_integration_atatime_counter_tt:0 "We will be able to integrate §Y1§! more state at a time"

 RP_GEN_establish_state_police:0 "Establish the State Police"
 RP_GEN_establish_state_police_desc:0 "Many local law enforcement agencies throughout the country might not be willing to crack down on dissent as much as we require them to. For this reason we must establish a national police force to do what the locals cannot."
 RP_statepolice:0 "State Police"

 RP_GEN_crush_defeatist_opposition:0 "Crush Defeatist Opposition"
 RP_GEN_crush_defeatist_opposition_desc:0 "No matter how badly the war turns against us, we must never consider abandoning the Kaiserreich to protect our own interests."
 RP_crushdefeatists:0 "Stamping Out Defeatism"

 RP_GEN_political_trials:0 "Political Trials"
 RP_GEN_political_trials_desc:0 "Despite our best efforts, there are always traitors in the government. We must focus on dismantling this corruption and imprisoning them, or worse."

 RP_GEN_dismantle_organized_resistance:0 "Dismantle Organized Resistance"
 RP_GEN_dismantle_organized_resistance_desc:0 "There are multiple resistance militias that are in the process of building up and recruiting members. These groups are becoming a problem and must be crushed before they can spark a rebellion."
 RP_crushorganizedresistance:0 "Crushing Organized Resistance"

 RP_GEN_invest_nongovernmental_facilities:0 "Invest in Independent Facilities"
 RP_GEN_invest_nongovernmental_facilities_desc:0 "To please our population and keep them under control, we must invest in sectors that we don't fully participate in. Housing, hospitals, schools, commercial centers, and other important parts of daily life needs major funding."
 RP_nongovernmentalfunding:0 "Non-Governmental Facility Funding"

 RP_GEN_propagandacampaigns:0 "Propaganda Campaigns"
 RP_GEN_propagandacampaigns_desc:0 "Our government works not just for [GER.GetNameDef], but also our people. Unfortunately, some of our constituents don't seem to realize this fact. We must ensure their knowledge of the saying "By the People, For the People""

 RP_GEN_integration_deutchesheer:0 "Integrate with the Deutches Heer"
 RP_GEN_integration_deutchesheer_desc:0 "The Germany Army is, without a doubt, one of the greatest fighting forces on the planet. In order to continue existing, we must integrate their forces with our own and learn from their military advisors."
 RP_deutchesheer_i:0 "Deutches Heer"
 
 RP_GEN_trainingcooperation:0 "Training Cooperation with Germany"
 RP_GEN_trainingcooperation_desc:0 "We are in desperate need of an army, and we must initiate training exercises with our overlord and their superior fighting force to establish our own."
 RP_deutchesheer_ii:0 "Deutches Heer"

 RP_GEN_jointmilitaryoperations:0 "Joint Command Operations"
 RP_GEN_jointmilitaryoperations_desc:0 "In order to have a successful military operation, we need to cooperate with our allies to ensure we have enough organization to succeed."
 RP_deutchesheer_iii:0 "Deutches Heer"

 RP_GEN_autonomousmilitaryoperations:0 "Autonomous Command Operations"
 RP_GEN_autonomousmilitaryoperations_desc:0 "Despite the glory of the German army, no coalition can succeed by focusing on joint operations alone. We must become capable of our own operational planning and executions."
 RP_autonomousmilitary:0 "Autonomous Military"

 RP_GEN_forcedconscription:0 "Forced Conscription"
 RP_GEN_forcedconscription_desc:0 "Our nation is too small to rely on volunteer troops for a sizeable defense force. Instead, an indefinite draft must be enacted immediately to bring in fresh troops."
 RP_forcedconscription:0 "Forced Conscription"

 RP_GEN_voluntaryenlistment:0 "Voluntary Enlistment"
 RP_GEN_voluntaryenlistment_desc:0 "Forced troops are inefficient troops, and the only effective way to get fresh troops is those who are willing to serve their great country."
 RP_voluntaryenlistment:0 "Voluntary Enlistment"

 RP_GEN_establish_defenseindustry:0 "Establish the Defense Industry"
 RP_GEN_establish_defenseindustry_desc:0 "Our nation is in desperate need of a defense army. In order to have an army, we need guns, and in order to have guns, we need factories."
 RP_defenseindustry:0 "Defense Industry"

 RP_GEN_urban_military_development:0 "Urban Military Development"
 RP_GEN_urban_military_development_desc:0 "The best place for an arms factory is the city, where the population can easily commute to the factory and where the factory is easily defendable from above."

 RP_GEN_prisoner_labor:0 "Prisoner Labor"
 RP_GEN_prisoner_labor_desc:0 "We have an extensive surplus of prisoners who are not being put to work in the capacity that they could be."
 RP_prisoner_labor:0 "Prisoner Labor"

 RP_GEN_improvedworkerefficiency:0 "Improved Worker Efficiency"
 RP_GEN_improvedworkerefficiency_desc:0 "Our workers, while quick already, can be quicker. To do this, we should invest in improving the quality of their factories."
 RP_improvedworkerefficiency:0 "Improved Worker Efficiency"

 RP_GEN_integration_mitteleuropa:0 "Integration with Mitteleuropa"
 RP_GEN_integration_mitteleuropa_desc:0 "The economic alliance of Mitteleuropa is what will boost our chances of economic success. Therefore, we must work with our overlord to integrate our economy into this new alliance."
 RP_mitteleuropa_i:0 "Mitteleuropa"

 RP_GEN_introduce_reichsmark:0 "Introduce the Reichsmark"
 RP_GEN_introduce_reichsmark_desc:0 "In order to continue integrating into Mitteleuropa, we need to begin efforts to normalize the use of the Reichsmark for our nation. There will be some resistance, but eventually, our populace will fold."
 RP_mitteleuropa_ii:0 "Mitteleuropa"

 RP_GEN_resourceexploitation:0 "Resource Exploitation"
 RP_GEN_resourceexploitation_desc:0 "The area under our control is full of vast amounts of resources. We must exploit this as much as possible, and benefit the new economy."
 RP_mitteleuropa_iii:0 "Mitteleuropa"

 RP_GEN_improveminingconditions:0 "Improve Mining Conditions"
 RP_GEN_improveminingconditions_desc:0 "A healthy miner is a good miner, so we must improve the conditions that our mine workers are in."
 RP_mitteleuropa_iv:0 "Mitteleuropa"
 
 RP_GEN_disbandworkersunion:0 "Disband Worker Unions"
 RP_GEN_disbandworkersunion_desc:0 "Worker Unions do nothing except promote socialism and hurt their nations economy. They are, at it's core, unpatriotic. They must go."
 RP_mitteleuropa_v:0 "Mitteleuropa"

 RP_GEN_improvesupplycapabilities:0 "Improve Supply Capabilities"
 RP_GEN_improvesupplycapabilities_desc:0 "In order to integrate with Mitteleuropa, we needd to be able to send resources and supplies to our neighbors. We are unable to construct new supply routes and this must be a top priority."
 RP_improvingsupplylines:0 "Improving Supply Lines"

 RP_GEN_ourownautobahn:0 "Our Own Autobahn"
 RP_GEN_ourownautobahn_desc:0 "The German model for a highway system is the greatest in the world, and by constructing our own, we can ensure our nation will have little issues with moving supplies around."
 RP_autobahn:0 "The Autobahn"

 RP_GEN_economicsubjugation:0 "Economic Subjugation"
 RP_GEN_economicsubjugation_desc:0 "Despite everything we have done, we are still a puppet to [GER.GetNameDef], and most of our economy should be directed towards them."
 RP_economicsubjugation:0 "Economic Subjugation"

 RP_GEN_limitedeconomicautonomy:0 "Limited Economic Autonomy"
 RP_GEN_limitedeconomicautonomy_desc:0 "We are still a semi-independent nation from Germany, and our economy will remain intact."
 RP_economicautonomy:0 "Limited Economic Autonomy"

 RP_GEN_expandindustrialcapacity:0 "Expand the Industrial Capacity" 
 RP_GEN_expandindustrialcapacity_desc:0 "Our economic stability depends on the presence of enough factories to ensure that one being bombed leaves us with nothing. Therefore, it is important we construct multiple throughout the nation." 

 RP_GEN_costalconstruction:0 "Coastal Construction"
 RP_GEN_costalconstruction_desc:0 "The water is the best way to transport goods and men, but to do that, we need ships."

 RP_GEN_highwayontheseas:0 "Highway on the Seas"
 RP_GEN_highwayontheseas_desc:0 "Our vast network of shipping routes have all joined together to create one large "highway" on the ocean."
 RP_seashighway:0 "Highway on the Seas"

 RP_GEN_buildjointresearchfacilities:0 "Build Joint Research Facilities"
 RP_GEN_buildjointresearchfacilities_desc:0 "The German Scientific Community is among one of the greatest in the world, and we must piggyback off of their success to benefit ourselves."
 RP_jointresearchfacilities:0 "Joint Research Facilities"

 # KFR Focus Tree 

 RP_KFR_devastationofwar:0 "Devastation of War"
 RP_KFR_devastationofwar_desc:0 "The Second Weltkrieg, while obviously a german victory, resulted in catastrophic damage to the territories conquered by the German Empire. It is imperative we establish a sector of government dedicated to rebuilding and growing the economy past pre-war levels."
 KFR_office_nationalrevitalization:0 "Office of National Revitalization"

 RP_KFR_reapmitteleuropa:0 "Reap the Benefits of Mitteleuropa"
 RP_KFR_reapmitteleuropa_desc:0 "Mitteleuropa, and it's subsequent economic sphere, is of great significance to anyone who is a member of it. It is time we begin benefiting from the alliance as well."
 KFR_benefitsofmitteleuropa_i:0 "The Benefits of Mitteleuropa"
 KFR_benefitsofmitteleuropa_ii:0 "The Benefits of Mitteleuropa"
 KFR_benefitsofmitteleuropa_iii:0 "The Grand Industry"

 RP_KFR_developthemetropol:0 "Develop the Metropol"
 RP_KFR_developthemetropol_desc:0 "The metropolitan region of France has always been the most important part of it. Starting in the late 1700s, this began to change upon the arrival of the French revolution. This obviously means a more powerful lower class will result in revolution, so we must develop the cities even more."
 RP_KFR_developthemetropol_effect_tt:0 "Adds §Y2 Civillian Factories§! to every state with at least §Y80% Infrastructure§!.\n\nCurrent Effect:"

 RP_KFR_thehongkongofthewest:0 "The Singapore of the West"
 RP_KFR_thehongkongofthewest_desc:0 "Singapore is a significant trading port in the East. In addition to it's location inbetween the rich East Indies, India, China, Japan, and the Western World, it also holds a strategic chokehold which can determine the fate of empires. We are in such a position to copy this idea, and become a significant trading partner that every major power will surely attempt to dominate."
 RP_KFR_hongkongofthewest_idea:0 "Singapore of the West"

 RP_KFR_frenchautobahn:0 "Construct the French Autobahn"
 RP_KFR_frenchautobahn_desc:0 "The Germans have built one of the most advanced road/railway networks that the world has ever seen. Thankfully, we are in a position to replicate this futuristic architecture."

 RP_KFR_establishthethinktanks:0 "Establish the Think Tanks"
 RP_KFR_establishthethinktanks_desc:0 "The great minds in Europe which have fled around the world as a result of the previous conflict are very important to us. We must make sure they return."

 RP_KFR_exploitthesteelmills:0 "Exploit the Steel Mills"
 RP_KFR_exploitthesteelmills_desc:0 "Northeastern France has an incredibly large share of Iron deposits. We should exploit this to further boost our economy."
 KFR_exploitationofthesteelmills:0 "Exploitation of the Steel Mills"

 RP_KFR_grandindustry:0 "The Grand Industry"
 RP_KFR_grandindustry_desc:0 "Our economy has improved greatly since the start of reconstruction. We can now confidently say we've accomplished our goals and are prepared to move on to different sectors of the nation."

 RP_KFR_ludendorfplan:0 "The Ludendorff Plan"
 RP_KFR_ludendorfplan_desc:0 "Before his death just a few years ago, Erich Ludendorff laid out his plans for the expansion of the military industry in Western Europe following an eventual German victory. In honor of him, we can use pieces of his plans to develop the military industry."
 KFR_ludendorfplan:0 "Ludendorff Plan"

 RP_KFR_defendingthechannel:0 "Defending the Channel"
 RP_KFR_defendingthechannel_desc:0 "Submarines are the greatest weapon against a future attack from across the channel. We must invest in the technology before it's too late."
 KFR_defenseofthechannel:0 "Defense of the North"

 RP_KFR_defenseofthesouthernborder:0 "Defense of the Southern Border"
 RP_KFR_defenseofthesouthernborder_desc:0 "Despite the Treaty of Sedan, [FRA.GetNameDef] still poses a threat to our government. While we are currently unable to launch a strike against them, we can still defend."
 KFR_defenseofthesouthernborder:0 "Defense of the South"

 RP_KFR_rivaloftheroyalnavy:0 "Rival of the Royal Navy"
 RP_KFR_rivaloftheroyalnavy_desc:0 "The British Empire is obviously in her final few years, and it would be very smart to begin building our own navy to take advantage of their inevitable collapse."

 RP_KFR_expandthearmy:0 "Expand the Standing Army"
 RP_KFR_expandthearmy_desc:0 "While the glory of the German Army is undoubtable, it is not smart to be dependent on another nations military for survival. It is time we begin building our own."
 KFR_ludendorfplan_ii:0 "Ludendorff Plan"

 RP_KFR_gloryofprussia:0 "The Glory of Prussia"
 RP_KFR_gloryofprussia_desc:0 "Prussia, and consequently the German Empire, has long had a reputation as the best fighting force on the planet. It is time we import that reputation to our own nation."
 KFR_gloryofprussia:0 "Glory of the Prussian Army"

 RP_KFR_finishtheplan:0 "Finish the Ludendorff Plan"
 RP_KFR_finishtheplan_desc:0 "The development of the military has been a success, and it is now time to move onto different sectors of the nation."

 RP_KFR_questionofthenewregime:0 "Question of the New Regime"
 RP_KFR_questionofthenewregime_desc:0 "Following the establishment of our administration, officials have almost immediately begun calling for a new government."
 RP_KFR_focustreeevents.1.t:0 "Question of the New Regime"
 RP_KFR_focustreeevents.1.d:0 "Following the establishment of our administration, officials almost immediately began calling for a new government.\n\nThe French nation has had multiple different governments throughout it's long history. From a province of the Roman Empire, to a dominate kingdom, to the first Republic, to the Napoleonic Empire, to the Paris Commune, it has a very rich history of governments. But now there is no doubt that the new empire will last for a thousand years and beyond.\n\nHowever, we do know that a military government can not last, and we must give some autonomy to the people. We have many different options for a government, some more easy to install than others. However all of our options will take time to prepare, but we have some other things to do while we wait."
 RP_KFR_focustreeevents.1.a:0 "We should stick with full German alignment."
 RP_KFR_focustreeevents.1a.effect_tt:0 "We will work towards installing a §gHohenzollern Prince§! or keeping the §LMilitary Dictatorship§!.\n\nThis will take around §Y90 days§! to prepare."
 RP_KFR_focustreeevents.1.b:0 "We should aim for an independent kingdom."
 RP_KFR_focustreeevents.1b.effect_tt:0 "We will work towards installing a §3Bourbon King§!.\n\nThis will take around §Y120 days§! to prepare."
 RP_KFR_focustreeevents.1.c:0 "Perhaps we could go a different route?"
 RP_KFR_focustreeevents.1c.effect_tt:0 "We will work towards re-establishing the §2French Republic§!.\n\nThis will take around §Y180 days§! to prepare."
 
 RP_KFR_frenchrepublic:0 "The French Republic"
 RP_KFR_frenchrepublic_desc:0 "The possibility of reinstalling a semi-democratic government is a long shot, but it is the best option for our people and thus, our government."
 RP_KFR_frenchrepublic_requirement_tt:0 "Preparations for re-establishing the §2French Republic§! are finished"
 RP_KFR_focustreeevents.2.t:0 "[KFR.GetNameDefCap] requests the return of democracy?"
 RP_KFR_focustreeevents.2.d:0 "Following the establishment of the military government in [KFR.capital.GetCapitalVictoryPointName], they immediately began preparations for a new government to be put in place to appease the people.\n\nToday, they approached us with a very interesting request. In return for limited supervision of the government, they proposed they reinstall the French Republic and write a constitution.\n\nWhile it's not a communist state, it could lead to a socialist revolt in the future, but it would also make controlling the people easier. What should we do?"
 RP_KFR_focustreeevents.2.a:0 "It's such an insane idea, it might work!"
 RP_KFR_focustreeevents.2.b:0 "No! That is insane!"
 RP_KFR_focustreeevents.3.t:0 "[GER.GetNameDefCap] accepts the establishment of the French Republic!"
 RP_KFR_focustreeevents.3.d:0 "In a somewhat surprising turn of events, [GER.GetLeader] has accepted the return of democracy in France.\n\nThe final preparations are being made to restore the republic, and the military council is currently being dissolved."
 RP_KFR_focustreeevents.3.a:0 "Wait.. really?"
 RP_KFR_focustreeevents.4.t:0 "[GER.GetNameDefCap] Germany refuses the return of the Republic"
 RP_KFR_focustreeevents.4.d:0 "[KFR.capital.GetCapitalVictoryPointName] has informed us they will not support a liberal government in France, and we will have to find a different option."
 RP_KFR_focustreeevents.4.a:0 "Unsurprising, but unfortunate."
 RP_KFR_frenchrepublic_requirement_tt_2:0 "§Y[GER.GetNameDefCap]§! has not already refused a democratic government"
 RP_KFR_frenchrepublic_democratic:0 "Fourth French Republic"
 RP_KFR_frenchrepublic_democratic_DEF:0 "the Fourth French Republic"
 RP_KFR_frenchrepublic_fascism:0 "French State"
 RP_KFR_frenchrepublic_fascism_DEF:0 "the French State"
 RP_KFR_frenchrepublic_communism:0 "French Socialist Republic"
 RP_KFR_frenchrepublic_communism_DEF:0 "the French Socialist Republic"
 RP_KFR_frenchrepublic_neutrality:0 "Fourth French Republic"
 RP_KFR_frenchrepublic_neutrality_DEF:0 "the Fourth French Republic"
 KFR_frenchrepublic_neutrality_party:0 "Liberal Collaborative Party"

 RP_KFR_returnoftheexiles:0 "Return of the Exiles"
 RP_KFR_returnoftheexiles_desc:0 "Over the course of the war and the subsequent military occupation, multiple civillians and key officials fled France across the channel. We must convince them to come back, as they are the true representatives of democracy"
 KFR_returningexiles:0 "Returning Exiles"
 
 RP_KFR_coalitionproblem:0 "The Coalition Problem"
 RP_KFR_coalitionproblem_desc:0 "Since the invention of socialism, it has been a major factor in the French political sphere, with some breakaway states even being communist nations, such as the Paris Commune or the Alsace Lorraine Soviet Republic. While some socialists fled the military occupation, there are still many that are demanding their voices be heard."
 RP_KFR_focustreeevents.5.t:0 "The Coalition Problem"
 RP_KFR_focustreeevents.5.d:0 "Since the invention of socialism, it has been a major factor in the French political sphere, with some breakaway states even being communist nations, such as the Paris Commune or the Alsace Lorraine Soviet Republic.\n\nWhile some socialists fled the military occupation, there are still many that are demanding their voices be heard. Should we allow them to join the government, or ban them altogether?"
 RP_KFR_focustreeevents.5.a:0 "This is a democracy."
 RP_KFR_negative_coalitionproblem:0 "Negligence of Socialism"
 RP_KFR_focustreeevents.5.b:0 "We are still a German Satellite."
 RP_KFR_positive_coalitionproblem:0 "Supporting our Interests"
 
 RP_KFR_freerepublic:0 "A Free Republic"
 RP_KFR_freerepublic_desc:0 "We have finally secured our republic, largely independent to [GER.GetNameDefCap]. We can now work towards improving the lives of our people."
 
 RP_KFR_dissolvethekbi:0 "Retake Brittany"
 RP_KFR_dissolvethekbi_desc:0 "The Breton Peninsula is an incredibly strategic piece of land that was taken from us, and now it is time to retake it."
 RP_KFR_focustreeevents.6.t:0 "[KFR.GetNameDefCap] Requests Control over Brittany"
 RP_KFR_focustreeevents.6.d:0 "This morning, [KFR.GetLeader] approached the Kaiser with a request. The new government has requested we support the dissolution of [KBI.GetNameDef] and return the territory to French control. What do we say?"
 RP_KFR_focustreeevents.6.a:0 "Sure, why not?"
 RP_KFR_focustreeevents.6.b:0 "We've already given into enough of their ridiculous requests!"
 RP_KFR_focustreeevents.7.t:0 "[GER.GetNameDefCap] Accepts!"
 RP_KFR_focustreeevents.7.d:0 "[GER.GetNameDefCap] has informed us that they will support the reintegration of Brittany into [KFR.GetNameDef]"
 RP_KFR_focustreeevents.7.a:0 "Perfect!"
 RP_KFR_focustreeevents.8.t:0 "[GER.GetNameDefCap] Refuses"
 RP_KFR_focustreeevents.8.d:0 "[GER.GetNameDefCap] has informed us that they will not support the reintegration of Brittany into [KFR.GetNameDef]"
 RP_KFR_focustreeevents.8.a:0 "To be expected.."

 RP_KFR_hohenzollernking:0 "The Hohenzollern King"
 RP_KFR_hohenzollernking_desc:0 "A military administration cannot last forever, especially for a region as big as France. Our best option is to install a Hohenzollern king and strengthen our ties with Berlin."
 RP_KFR_hohenzollernking_requirement_tt_2:0 "§Y[GER.GetNameDefCap]§! has not already refused a Hohenzollern government"
 RP_KFR_hohenzollernking_requirement_tt:0 "Preparations for establishing a §gHohenzollern Kingdom§! are finished"
 RP_KFR_focustreeevents.9.t:0 "[KFR.GetNameDefCap] requests installation of a Hohenzollern King"
 RP_KFR_focustreeevents.9.d:0 "The military government in [KFR.GetNameDefCap] has sent a message to the House of Hohenzollern requesting that Eitel Friedrich, son of Wilhelm II, be installed to the throne of a new Kingdom of France. This would be preceeded by the dissolution of the military government in France.\n\nWhile this would significantly strengthen our grip in Western Europe, it is possible that it might increase resistance to our garrisoning forces in the French region."
 RP_KFR_focustreeevents.9.a:0 "What a great idea!"
 RP_KFR_focustreeevents.9.b:0 "No, it is too risky.."
 RP_KFR_focustreeevents.10.t:0 "[GER.GetNameDefCap] accepts installation of a Hohenzollern King"
 RP_KFR_focustreeevents.10.d:0 "[GER.GetNameDefCap] has accepted our request to install Eitel Friedrich of Prussia as King of France. He is now on his way to Paris."
 RP_KFR_focustreeevents.10.a:0 "Fantastic"
 RP_KFR_focustreeevents.11.t:0 "[GER.GetNameDefCap] rejects installation of a Hohenzollern King"
 RP_KFR_focustreeevents.11.d:0 "[GER.GetNameDefCap] has informed us that they will not accept a Hohenzollern King in France, citing the possibility that installing one might cause even more instability and resistance in France."
 RP_KFR_focustreeevents.11.a:0 "Shame.."
 RP_KFR_hohenzollernkingcosmetictag:0 "Königreich Frankreich"
 RP_KFR_hohenzollernkingcosmetictag_DEF:0 "das Hohenzollern Königreich Frankreich"
 KFR_hohenzollernking_neutrality_party:0 "House of Hohenzollern"

 RP_KFR_anewcapital:0 "A New Capital"
 RP_KFR_anewcapital_desc:0 "The city of Paris is a problematic spot for the capital of our new government, and it might be in our best interest to relocate our capital somewhere else."
 RP_KFR_focustreeevents.12.t:0 "A New Capital?"
 RP_KFR_focustreeevents.12.d:0 "The city of Paris is a problematic spot for the capital of our new government. Located at the center of French culture and the origin of the French revolution, it has given our subordinates some ideas. Multiple attacks against the government have already been carried out in the short time since it's installment.\n\nOur advisors are offering a new capital. The city of Versailles, located just 20 kilometers away. It would offer a new place for our government, and make the management of terrorist cells easier to control. It even has a Palace.\n\nAdditionally, the city of Versailles would be, what the Americans call, a "power move" to the French, as it is the city where the treaty ending the great war, and the Franco-Prussian war, was signed. It would humiliate the French and remind them that they are not led by themselves, but rather, us."
 RP_KFR_focustreeevents.12.a:0 "We will stay with Paris."
 RP_KFR_focustreeevents.12.b:0 "Off we go!"

 RP_KFR_dissuaderevolution:0 "Dissuade Revolution"
 RP_KFR_dissuaderevolution_desc:0 "A revolution at this crucial moment in our history will not benefit anyone, and we must remind our populace of that."

 RP_KFR_expatriatetheopposition:0 "Expatriate the Opposition"
 RP_KFR_expatriatetheopposition_desc:0 "The French Underground is slowly building beneath our noses, and arresting them won't be a solution. We need to get rid of them, through any means necessary."
 KFR_deportingopposition:0 "Deporting Opposition"

 RP_KFR_germanizationofthenorth:0 "Germanization of the North"
 RP_KFR_germanizationofthenorth_desc:0 "[GER.GetNameDefCap] has offered to give our government payments in exchange for the "germanization" of our northern territories. This deal is unfortunate, but will provide crucial payments for the development of this nation."
 RP_KFR_focustreeevents.13.t:0 "Deportations Continue"
 RP_KFR_focustreeevents.13.d:0 "To heavy resistance, we have successfully forced more locals out of the Northern France region and sent them south to make way for the incoming Germans.\n\nShould we stop letting sending them away?"
 RP_KFR_focustreeevents.13.a:0 "Keep going"
 RP_KFR_focustreeevents.13.b:0 "We must end this"
 RP_KFR_focustreeevents.14.t:0 "German Immigrants Arrive"
 RP_KFR_focustreeevents.14.d:0 "German immigrants from Alsace-Lorraine, Luxembourg, and the Rhine region have moved into North France."
 RP_KFR_focustreeevents.14.a:0 "Excellent"

 RP_KFR_outoldinnew:0 "Out With The Old\nIn With The New"
 RP_KFR_outoldinnew_desc:0 "The new government is obviously much more beneficial than the old, and the French people are lucky for us to have granted them such freedoms."
 KFR_thenewbeginning:0 "The New Beginning"

 RP_KFR_continuethedictatorship:0 "Continue the Dictatorship"
 RP_KFR_continuethedictatorship_desc:0 "We do not have time to secure a fresh government for the people, our best option is to keep the ruling military administration."
 RP_KFR_continuedictatorship_requirement_tt:0 "We have made the decision to keep the §LMilitary Dictatorship§!"
 RP_KFR_militarydictatorship_democratic:0 "Government of National Defense"
 RP_KFR_militarydictatorship_democratic_DEF:0 "Government of National Defense"
 RP_KFR_militarydictatorship_fascism:0 "French State"
 RP_KFR_militarydictatorship_fascism_DEF:0 "French State"
 RP_KFR_militarydictatorship_communism:0 "Socialist Republic of France"
 RP_KFR_militarydictatorship_communism_DEF:0 "Socialist Republic of France"
 RP_KFR_militarydictatorship_neutrality:0 "Deutsche-Militärstaat Frankreich"
 RP_KFR_militarydictatorship_neutrality_DEF:0 "der Deutsche-Militärstaat Frankreich"

 RP_KFR_fateofthemilitarycouncil:0 "Fate of the Military Council"
 RP_KFR_fateofthemilitarycouncil_desc:0 "A military council, while useful for short-term provisional administration, is not reliable for a long-term governance. We might consider installing a single head of state above all."
 RP_KFR_focustreeevents.15.t:0 "Fate of the Military Council"
 RP_KFR_focustreeevents.15.d:0 "A military council, while useful for short-term provisional administration, is not reliable for a long-term governance. Our overlord has suggested we install a single leader with complete power.\n\nIn discussing who this person should be, one name kept coming up. Walther Luttwitz has been an officer since 1878, with notable performance in the Battle of Champagne and the Spring Offensive during the First Weltkrieg. Additionally, he was one of the leaders of the attempted Kapp Putsch, in an attempt to reinstall the Kaiser as leader of Germany during the early 20s.\n\nShould we install him as leader, or keep the current government system?"
 RP_KFR_focustreeevents.15.a:0 "There is no need to limit power."
 RP_KFR_focustreeevents.15.b:0 "We will give full power to Walther Luttwitz."

 RP_KFR_restartthereignofterror:0 "Restart the Reign of Terror"
 RP_KFR_restartthereignofterror_desc:0 "The Reign of Terror following the French Revolution was one of the greatest periods in the history of the country, where all was improving at a rapid rate, including the government popularity. It's time to bring this back."
 RP_KFR_secondreignofterror:0 "Second Reign of Terror"

 RP_KFR_closertogermany:0 "Move Closer to Germany"
 RP_KFR_closertogermany_desc:0 "Our overlords will be the source of our success, and it's time we start building our ties even more."
 RP_KFR_closertogermany_idea:0 "Leaning Further to [GER.GetNameDef]"
 RP_KFR_closertogermany_opinionmodifier:0 "Leaning Further to Us"

 RP_KFR_prepareforcaseanton:0 "Prepare for Case Anton"
 RP_KFR_prepareforcaseanton_desc:0 "The German government clearly won't be uniting all the French lands anytime soon, but we must take advantage of French weakness before they attack us first."
 RP_KFR_secretpreparations:0 "Secret Preparations"

 RP_KFR_preemptivestrike:0 "Pre-emptive Strike"
 RP_KFR_preemptivestrike_desc:0 "The French government will very obviously strike our government eventually, and we must take advantage of surprise. Even if our overlord doesn't approve of it."
 RP_KFR_focustreeevents.16.t:0 "[KFR.GetNameDefCap] launches Operation Anton!"
 RP_KFR_focustreeevents.16.d:0 "This morning, we recieved word from our garrisons along the French border that the North French army, led by [KFR.GetLeader], had crossed the line and invaded [FRA.GetNameDef]. A few hours later, [KFR.GetLeader] announced Operation Anton, the full-scale invasion into the former French Republic.\n\nThis was without consultation or advisement with our government, and it has led them to enter a war which they could very easily lose without our support. If they lose, we'd lose an enormously large strategic position in western Europe, and that is something we cannot risk.\n\nShould we force the military to stand down, offer limited support, or join the war to ensure a victory?"
 RP_KFR_focustreeevents.16.a:0 "They will stand down now!"
 RP_KFR_focustreeevents.16.b:0 "We will support them indirectly. It's best to not get too invested."
 RP_KFR_focustreeevents.16.c:0 "Only a full-scale intervention will force a victory!"
 RP_KFR_operationanton:0 "Operation Anton"
 RP_KFR_limitedgermansupport:0 "Limited German Support"

 RP_KFR_returnofthebourbons:0 "Return of the Bourbons"
 RP_KFR_returnofthebourbons_desc:0 "The French people need a French king, so we shall give them one."
 RP_KFR_bourbonking_requirement_tt:0 "Preparations for the return of the §3Bourbon Monarchy§! are complete."
 RP_KFR_bourbonking_requirement_tt_2:0 "§Y[GER.GetNameDefCap]§! has not already refused a Bourbon Monarchy"
 RP_KFR_focustreeevents.17.t:0 "[KFR.GetNameDefCap] requests a Bourbon King?"
 RP_KFR_focustreeevents.17.d:0 "The House of Bourbon ruled the Kingdom of France for nearly 600 years. Following the French Revolution, the final French branch of the dynasty were executed, and France has remained a republic for most of the rest of it's history.\n\nToday, the Provisional Administration in France made an interesting request. One to bring back the legitimist Bourbons. Pretender to the throne, Infante Jaime, has been chosen for the role of king. Installing a ruler so closely tied to France might be useful to keep resistance low.\n\nHowever, it could be seen by our allies as reinstalling enemy governments in territories that we conquered. Additionally, it could backfire on us and result in a betrayal. Should we choose to accept it, or turn them away?"
 RP_KFR_focustreeevents.17.a:0 "It's worth a shot."
 RP_KFR_focustreeevents.17.b:0 "No! Are they insane?"
 RP_KFR_focustreeevents.18.t:0 "[GER.GetNameDefCap] Accepts!"
 RP_KFR_focustreeevents.18.d:0 "[GER.GetNameDefCap] has responded to our request with curiosity, but caution, and accepted the installation of a Bourbon king."
 RP_KFR_focustreeevents.18.a:0 "Perfect!"
 RP_KFR_focustreeevents.19.t:0 "[GER.GetNameDefCap] Refuses!"
 RP_KFR_focustreeevents.19.d:0 "[GER.GetNameDefCap] has informed us they will not accept the installation of a Bourbon king, and insulted us and our carelessness directly."
 RP_KFR_focustreeevents.19.a:0 "To be expected.."
