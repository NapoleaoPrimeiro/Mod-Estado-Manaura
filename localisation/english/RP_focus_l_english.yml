 RP_KFR_forgettingourdifferences:0 "Forgetting Our Differences"
 RP_KFR_forgettingourdifferences_desc:0 "Coming closer to Germany is in our best interests, even if it means betraying the trust of our people."

 RP_KFR_neveranotherbonaparte:0 "Never Another Bonaparte"
 RP_KFR_neveranotherbonaparte_desc:0 "Napoleon Bonaparte launched a Europe wide war that ended in the destruction and humiliation of France. We need to make sure that can never happen again."

