 RP_gamesettings_devmessage_loc:0 "Hello! Thank you for playing Reichspakt+! This mod was the first major mod I (the lead dev), have managed to keep going for so long. Here are some settings to change the way this mod operates, whether to add mod compatibility or just make the game less or more challenging."
 
