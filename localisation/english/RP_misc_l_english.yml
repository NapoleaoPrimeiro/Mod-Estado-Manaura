 # LEADER DESCRIPTIONS
 KLV_leader_desc:0 "Born October 10th, 1873, in Mecklenburg-Schwerin, Germany. \n\nAdolf Friedrich was a prominent figure in the exploration and documentation of the African continent, leading scientific explorations of the Central African Graben and traversing Africa from east to west during 1907 and 1908. He also led an expedition in 1910 and 1911 to Lake Chad, the Congo, and the Nile. From 1912 to 1914 he served as the 5th and last governor of Togoland. \n\nOn November 5th of 1918, with the proclamation of the United Baltic Duchy, Adolf Friedrich was offered the throne. However, with Friedrich still in Germany, a regency council was established in his stead. With Germany's surrender only a few days later, Friedrich never got the chance to assume the throne, leaving his reign unrealized as the Duchy collapsed shortly after Germany's defeat."

 KUK_austrian_leader_desc:0 "Born February 10th, 1895, in Lötzing, Austria-Hungary. \n\nUpon his graduation of the Vienna War College in 1915, Archduke Wilhelm entered the 13th Galicia Ulan Regiment, which was made up of majority Ukrainian soldiers. During this time, Wilhelm read the works of many Ukrainian authors, even requesting his men refer to him as Vasyl. His soldiers gifted him a traditional Ukrainian embroidered shirt, which he would wear underneath his uniform, earning him the nickname Vyshyvanyi. \n\nFollowing the collapse of the Russian Empire, Vasyl Vyshyvanyi was promoted to Captain, and given his own "Battle Group Archduke Wilhelm", and was stationed in Kherson, and then later Aleksandrovsk. During this time, Vasyl worked closely with the local population, launching a local newspaper, organizing cultural activities for the local peasantry, and visiting Cossack heritage sites for his Ukrainian soldiers. Additionally, Vasyl blocked the requistiioning of grain by Austrian forces within land under his occupation, even offering refuge to Ukrainians who had resisted German or Austrian requisitions elsewhere. \n\nVasyl had supported the idea of resolving the "Ukrainian question" through the creation of a Grand Duchy of Ukraine, which would include Eastern Galicia and Bukovina. However with the collapse of both Ukraine and the Habsburg Monarchy, Vasyl never got the chance to establish his envisioned Grand Duchy."

 KUK_leader_desc:0 "Born May 15th, 1873, in Wiesbaden, Germany. \n\nHaving been born in Germany, Skoropadsky learnt German as his first language before being moved to Trostianets, Ukraine, at age five. In Trostianets, Skoropadsky was deeply immersed in Ukrainian culture, being particularly fascinated by the old portraits of former Ukrainian hetmans, as he was directly related to many of them. \n\nDuring the Russo-Japanese War, Skoropadsky's military career took off; starting as a lieutenant, he was promoted to serve as adjutant to General F. E. Keller in May. \n\nAfter the Russo-Japanese War, Emperor Nikolai II promoted Skoropadsky to the rank of Colonel and made him a Flügel-Adjutant as part of His Imperial Majesty's Retinue, serving as an aide-de-camp to the Emperor. In 1911, Skoropadsky was placed in command of the Leib-Guard Cavalry Regiment, Russia's elite guards of the Emperor. A year later, Skoropadsky was promoted to the rank of Major General. \n\nUpon the outbreak of the Great War, Skoropadsky was placed in command of the 1st Brigade within the 1st Cavalry Guard Division, taking part in the Russian invasion of East Prussia. In 1916, Skoropadsky was promoted to the rank of Lieutenant General and placed in charge of the 1st Cavalry Guard Division. In January of the next year, Skoropadsky was made commander of the 34th Army Corps. In July of 1917, Skoropadsky met with the new supreme commander of the Russian army, Lavr Kornilov, who ordered Skoropadsky to Ukrainise his army corps, transforming the 34th Army Corps into the 1st Ukrainian Corps. \n\nIn April of 1918, due to the extreme unpopularity of the socialist Central Rada's administration of Ukraine, protests began breaking out, in which they called for Skoropadsky to be made Hetman and the dissolution of the Central Rada. With a majority of the Ukrainian government already arrested by the German army, which backed the coup, the protesters were met with little resistance, culminating in the creation of the Ukrainian State and the declaration of Skoropadsky as Hetman of all Ukraine. \n\nHis reign didn't last long, however, with a counter-coup being launched shortly after Germany's surrender in the Great War, restoring the Ukrainian People's Republic. Skoropadsky officially signed his abdication on December 14th, 1918, and fled alongside the retreating German army."