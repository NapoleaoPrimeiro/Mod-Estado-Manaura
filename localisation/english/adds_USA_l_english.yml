mtg_usa_civil_war_democrats.100.t:"Great Lakes Rebellion"
mtg_usa_civil_war_democrats.100.desc:"The worst has happened. The Great Lakes region has risen in rebellion. They accuse us of creating a military junta, a blatant violation of the American Constitution and a ruthless infringement on American human rights. The workers of the Great Lakes are fully armed, local officials are powerless to resist, and the area has now been completely occupied by the rebels."
mtg_usa_civil_war_democrats.100.a:"Damn!"

mtg_usa_civil_war_democrats.101.t:"Advance Strategy"
mtg_usa_civil_war_democrats.101.desc:"This civil war is not as easy as we expected. The decisions of the high command now determine everything. Frontline troops report that the enemy's offensive has recently weakened. We have reached a critical moment—should we seek a quick, decisive victory, or steadily advance, gradually expanding our advantage to ultimately secure victory?"
mtg_usa_civil_war_democrats.101.a:"Blitzkrieg!"
mtg_usa_civil_war_democrats.101.b:"Better to be steady."

mtg_usa_civil_war_democrats.102.t:"Kingdom of Hawaii Independent!"
mtg_usa_civil_war_democrats.102.desc:"As the American civil war intensifies, the Hawaiian restoration movement sees hope. Taking advantage of our weak defense in Honolulu, they incite the garrison, which is dissatisfied with our government, to revolt, declaring the restoration and independence of the Kingdom of Hawaii.\nWorse still, Japan has already begun contacting the high-level officials of the Kingdom of Hawaii and helping them build up to weaken our influence. We cannot intervene for now; we can only hope for a swift end to the civil war."
mtg_usa_civil_war_democrats.102.a:"They are playing with fire."
mtg_usa_civil_war_democrats.102.b:"Our freedom! (Play as Hawaii)"

haw_extra.1.t:"Hawaii Sugar Trade"
haw_extra.1.desc:"The minister of the Kingdom of Hawaii Sugar Bureau has just contacted us. He says they can conduct a low-cost sugar trade with us. Since its independence, Hawaii, located in the center of the Pacific, has become a target of courtship by various powers. If we can facilitate this trade, our influence in Hawaii is bound to increase significantly."
haw_extra.1.a:"Why not?"
haw_extra.1.b:"Let these natives play by themselves."

haw_extra.2.t:"[From.GetNameDefCap] Agreed to Sugar Trade"
haw_extra.2.desc:"The foreign trade minister of [From.GetNameDefCap] has just called. They say it is an honorable and beneficial deal for us. Both sides can profit from this trade, and more such trades would be welcome. They have agreed to this trade and hope we will increase our share."
haw_extra.2.a:"Excellent!"

haw_extra.3.t:"[From.GetNameDefCap] Rejected Sugar Trade"
haw_extra.3.desc:"The foreign trade minister of [From.GetNameDefCap] has just called. They say that due to the international situation, they cannot reach a cooperation with us."
haw_extra.3.a:"Bastards!"

haw_extra.4.t:"Japanese Contact"
haw_extra.4.desc:"Shortly after our independence, Japan has already extended an invitation for a meeting. In fact, our independence has greatly weakened American influence in the Pacific, which Japan is very pleased to see. They claim they are willing to help us with industrialization and fund us to build an army to guard against an American return.\nBut we must know that the Japanese have no good intentions. Every investment they make in us will carry undeniable costs in the future."
haw_extra.4.a:"As long as it helps us develop..."
haw_extra.4.b:"Cannot accept the gift of wolves."

haw_extra.5.t:"Japanese Influence Deepens!"
haw_extra.5.desc:"After accepting Japanese investment, we have indeed developed quite a bit. However, recently more and more officials report that our industry and economy have become increasingly dependent on Japan."
haw_extra.5.a:"These guys really had ill intentions!"

haw_extra.6.t:"Japan Proposes Increased Investment"
haw_extra.6.desc:"Japan sees our needs and proposes to increase investment in our economy."
haw_extra.6.a:"Why not accept?"
haw_extra.6.b:"Let's skip this time..."

haw_extra.7.t:"Choice of Prime Minister"
haw_extra.7.desc:"Given that we have chosen a constitutional monarchy, a prime minister is indispensable. The problem is that we need a prime minister who can satisfy all parties. Currently, there are three candidates: the Japanese-favored Yōsuke Matsuoka, the American exile Samuel Wilder King, and the Chinese-American lawyer Hiram Fong. We must weigh the pros and cons and make a well-rounded choice."
haw_extra.7.a:"Yōsuke Matsuoka is the most suitable choice."
haw_extra.7.b:"We need the support of American exiles."
haw_extra.7.c:"A Chinese-American prime minister can better balance the three forces."

haw_extra.8.t:"Our Currency"
haw_extra.8.desc:"Through our efforts, we have successfully established an economic system independent of the United States. Therefore, the dollar system is no longer that important to us. Now, we must decide on the future currency system of our country: continue using the dollar, adopt the yen to please Japan, or issue a new currency to maintain our autonomy?"
haw_extra.8.a:"Continuing to use the dollar keeps the country stable."
haw_extra.8.b:"Adopting the yen will make Japan increase investment in us."
haw_extra.8.c:"We must ensure independence and autonomy."

haw_extra.9.t:"American Exiles Arrive"
haw_extra.9.desc:"With the American Military Government sweeping forward, the Constitutional State of America has fallen.\nBut this is not the end. Many former generals of the Constitutional State, unwilling to let America become a living hell, have made their way to our country, hoping to settle here and wait for an opportunity to counterattack. Although sheltering these generals is tantamount to provoking the American dragon, the enemy of my enemy is my friend. In this critical situation, anything beneficial is worth the risk."
haw_extra.9.a:"God save Hawaii..."

haw_extra.10.t:"[From.GetNameDefCap] Demands We End Economic Control"
haw_extra.10.desc:"[From.GetNameDefCap] has called us, demanding that we end our long-term economic control. Since Hawaii's independence, we have pervasively infiltrated its economic sphere, which has brought us countless benefits. But now that Hawaii has unified America, they have the confidence to break free from us. If we let them go, perhaps there may still be room for continued friendship. But if we refuse to back down, a war will be unavoidable."
haw_extra.10.a:"Better to think long-term."
haw_extra.10.b:"How dare they threaten us?"

haw_extra.11.t:"[From.GetNameDefCap] Accepted"
haw_extra.11.desc:"After careful consideration, [From.GetNameDefCap] finally decided to allow us economic independence.\nAll key areas previously controlled by the Japanese have been fully taken over by our personnel, and Japan has promised to provide follow-up technical support."
haw_extra.11.a:"At least they're reasonable"

haw_extra.12.t:"[From.GetNameDefCap] Refused"
haw_extra.12.desc:"[From.GetNameDefCap] called and argued forcefully, claiming that [From.GetNameDefCap] played an indispensable role in our restoration and deserves compensation.\nThey refuse to back down and advise us not to start a war we cannot win."
haw_extra.12.a:"Courting death"

usa_news.15.t:"Kingdom of Hawaii Attempts to Shake Off Japanese Economic Control"
usa_news.15.desc:"The Kingdom of Hawaii, a nation that has received much Japanese attention since its second independence, chose to negotiate with Japan to break free from economic control after successfully counterattacking the North American continent.\nNegotiations began several days ago, and the situation is now tense with both sides at a standoff.\nThe results have not yet been announced, but this move by the Kingdom of Hawaii has undoubtedly cast the Pacific back into the shadow of war."
usa_news.15.a:"A mantis trying to stop a chariot — overestimating itself."
usa_news.15.b:"They possess immense courage."

haw_extra.13.t:"[From.GetNameDefCap] Offers Weapons"
haw_extra.13.desc:"The ambassador of [From.GetNameDefCap] just contacted us, offering weapons to help us build an army. Their weapons are already crated and can be shipped anytime if we agree.\nAlthough these weapons are indeed what we currently need, Japan's intentions are not kind. If we keep accepting their offers, Japanese influence in our country will grow and gradually steer our foreign policy."
haw_extra.13.a:"These weapons can help us strengthen our national defense."
haw_extra.13.b:"Is Japan really that kind?"

haw_extra.14.t:"[From.GetNameDefCap] Manipulates Our Economy!"
haw_extra.14.desc:"Our finance minister just discovered that [From.GetNameDefCap] has shamelessly manipulated our economy. They bribed low-level officials and, using monetary temptations, took goods far exceeding the trade quota from our warehouses.\nAlthough we discovered it in time this time, Japan has already left with the goods and flatly denies their misdeeds."
haw_extra.14.a:"These shameless bastards!"

haw_extra.15.t:"[From.GetNameDefCap] Offers Technical Support"
haw_extra.15.desc:"The ambassador of [From.GetNameDefCap] just contacted us, offering technical support to help us with scientific research. Since the Americans left, our scientific and technological research has been stagnant.\nJapanese support may temporarily alleviate this, but it is not without cost. Our technology cannot depend on Japanese assistance."
haw_extra.15.a:"Just this once."
haw_extra.15.b:"Not even once!"
