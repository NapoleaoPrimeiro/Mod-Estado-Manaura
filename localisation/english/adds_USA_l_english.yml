USA_max1_desc:"Karl Marx, full name Karl Heinrich Marx (German:Karl Heinrich Marx, May 5, 1818 – March 14, 1883), was one of the founders of Marxism, an organizer and leader of the First International, one of the architects of Marxist political parties, the revolutionary teacher of the global proletariat and working people, the spiritual leader of the proletariat, and the pioneer of the international communist movement."
USA_max2_desc:"In 1857, a worldwide economic crisis erupted. Marx believed that revolution might follow the economic crisis, and before that, the working class needed to be armed with scientific theory. Therefore, Marx wrote in a letter to Engels:'I am working like mad through the night to summarize my economic studies so that I can at least have a clear idea of the basic issues before the deluge.'"
USA_max3_desc:"Materialist Dialectics, also known as 'Marxist Dialectics,' studies the general transformative links in the movement forms of nature, human society, and thought. It represents the advanced stage of dialectical thought and is a crucial component of Marxist philosophy. It holds that the material world is a unified whole of universal connections and constant motion; dialectical laws are the laws of the material world's self-movement; and subjective dialectics or dialectical thinking is the reflection of objective dialectics in human thought. It is the most comprehensive, rich, and profound doctrine of development."

USA_engs1_desc:"Friedrich Engels (German:Friedrich Engels, November 28, 1820 – August 5, 1895) was a German thinker, philosopher, revolutionary, educator, and military theorist. He was a great teacher and leader of the global proletariat and working people, and one of the founders of Marxism."
USA_engs2_desc:"This work applies fundamental perspectives of historical materialism to provide a comprehensive analysis of the capitalist economy, political system, and class relations. It examines the inevitable consequences of the capitalist mode of production:the outbreak of periodic economic crises, the formation of an industrial reserve army, and the increasing exploitation of the proletariat and working masses by the bourgeoisie as capitalist production develops. Thereby, it reveals the essence of capitalism and the objective laws leading to its inevitable demise. It also discusses the historical development of the modern proletariat alongside the industrial revolution, using extensive field-surveyed facts to detail the悲惨生活 (miserable life) of the British proletariat and issuing a严厉的控诉 (stern indictment) against capitalism and the bourgeoisie."
USA_engs3_desc:"Engels-Style Planning System"

USA_liening1_desc:"Vladimir Ilyich Lenin (April 22, 1870 – January 21, 1924), originally named Vladimir Ilyich Ulyanov, was from Simbirsk, Russia (now Ulyanovsk). He was a great proletarian revolutionary, politician, theorist, and thinker, who served as the Chairman of the Council of People's Commissars of the Soviet Union (i.e., Soviet Premier) and Chairman of the Workers' and Peasants' Defense Council, among other important positions."
USA_liening2_desc:"Democratic Centralism"
USA_liening3_desc:"Peace, Land, and Bread"

USA_stalin1_desc:"Joseph Vissarionovich Stalin (Russian:Иосиф Виссарионович Сталин), a Georgian, was a Soviet proletarian revolutionary, politician, military strategist, Generalissimo of the Soviet Union, and the supreme leader of the Soviet party and state."
USA_stalin2_desc:"Five-Year Plan"
USA_stalin3_desc:"Defense Industry"

