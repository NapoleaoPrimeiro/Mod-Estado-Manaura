usa.506.t:"Investment in Domestic Defense Contractors"
usa.506.desc:"With the world on the brink of war, we are compelled to collaborate with the nation's major arms manufacturers to produce more weapons for our armed forces. Simultaneously, the government has passed a series of bills favoring domestic industries and will soon select the most critical sector for investment. A specially established committee has now prepared the funds, which will be disbursed shortly. So, which sector should we invest in?"
usa.506.a:"Clearly, we should inject capital into armor manufacturers."
usa.506.b:"Shipbuilding enterprises have always maintained a good cooperative relationship with us."
usa.506.c:"The aircraft industry deserves more attention."
usa.506.d:"Without sufficient firearms and ammunition, everything else is meaningless."

USA_jiaerwen_organization:"Galvin Manufacturing Corporation"
USA_fmc_company_organization:"FMC"
USA_lima_company_organization:"Lima Locomotive Works"
USA_armored_car_mot_design_company:"Armored Personnel Carrier Designer"

USA_meishi_shehuizhuyi_tt:0"§YAmerican Socialism§! additional effects:\n"

USA_renmindahui_desc:"Arise, ye prisoners of starvation!\nArise, ye wretched of the earth!\n\nFor justice thunders condemnation, a better world's in birth!\n\nNo more tradition's chains shall bind us, arise, ye slaves! No more in thrall!\n\nThe earth shall rise on new foundations, we have been naught, we shall be all."

USA_zhanzhengxuanchuan_desc:"The sleeping giant has opened its eyes, rising to its feet and flexing muscles that could shake the world. His breath is the roar of the furnace, his pulse the thunder of the production line. Against the tyranny of the old world, he shall unleash a steel fist—forged from the industry, technology, and will of an entire new world."

USA_gonggonggongcheng_desc:"In the nation's darkest hour, we refused to surrender to despair. Through the calm, hopeful voice on the radio, an unprecedented 'New Deal' swept across the land like a spring breeze. The federal government intervened in the economy with unprecedented force, providing jobs for millions of unemployed—building dams, paving roads, planting forests. Though conservative justices on the Supreme Court obstructed and questioned its legality, this bold social experiment had already rekindled the American spirit. It stabilized the faltering financial system, injected faint vitality into industry, and replanted the seeds of 'hope' in the people's hearts. Though the road ahead remains thorny, the arduous process of recovery has begun."

usa_union.1.t:"Equal Rights for Women?"
usa_union.1.desc:"As our government educates the people in communist ideology, a growing number of progressive women are questioning our administration: Since communism aims to liberate humanity, shouldn't women be liberated first?\nThey argue that women should share both the privileges and the obligations that men possess. Revolutionary women do not fear hardship, but they demand fairness. How should we respond to this question?"
usa_union.1.a:"They are right: Women hold up half the sky!"
usa_union.1.b:"This isn't the right time for this..."

usa_union.2.t:"Universal Healthcare?"
usa_union.2.desc:"The former bourgeois government ruthlessly exploited our people, leaving countless civilians suffering from severe illnesses, dying in obscurity because they could not afford exorbitant medical costs. Now, as a new government, should we establish a healthcare system that serves the poor and benefits the masses? This may place a heavy burden on our finances, but in the long run, it will significantly solidify our popular support and free the people from medical hardships."
usa_union.2.a:"If we don't do this, how are we different from the bourgeoisie?"
usa_union.2.b:"The current economic situation doesn't support this..."

usa_union.3.t:"Expand Union Power?"
usa_union.3.desc:"As a nation that emphasizes workers' welfare, expanding the power of trade unions could significantly boost their production enthusiasm. However, this could also have negative consequences: excessive union power might make it more difficult to implement our policies in the future. So, should we devolve power to the unions, or maintain the status quo?"
usa_union.3.a:"Workers always come first."
usa_union.3.b:"We must consider the future."
