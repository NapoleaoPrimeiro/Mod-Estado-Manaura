usa_news.9.t:"Communists Seize Power in the United States"
usa_news.9.desc:"After a prolonged period of political and economic reforms, the majority of officials in the U.S. government have acknowledged the Communist Party as the sole governing party. They were required to either resign or immediately join the Communist Party.\n\nSimultaneously, armed workers from numerous large state-owned factories swiftly occupied strategic locations across the nation. Military forces loyal to the White House remained in their barracks and refused to intervene.\n\nBy evening, the Communists had achieved success, with the new government firmly securing power."
usa_news.9.a:"The radicals have taken power."
usa_news.9.b:"The great revolution has finally concluded."
usa_news.9.c:"They have avoided fascism in the worst possible way."
usa_news.9.d:"The revolution is victorious!"
usa_news.9.e:"Another threat has emerged."

usa_news.10.t:"The Call of the New Rome"
usa_news.10.desc:"As the old world order stumbles amidst nationalist clamor and stagnant bureaucracy, a powerful yet silent force is reshaping the landscape of the global economy. Capital, the world's most astute and relentless profit-seeker, is making its choice with primal logic:crossing oceans and flooding into the American Corporate State, governed by the 'Corporate Council'—a promised land investors call the 'New Rome'.\n\nThe wheels of history are turning. While the old world struggles in the chains of ideology, the beacon of New Rome shines bright. The tidal wave of global capital voting with its feet may well herald the dawn of a new era defined by efficiency, capital, and power."
usa_news.10.a:"Damn it! The Americans are unreliable after all."
usa_news.10.b:"The rise of a world power."
usa_news.10.c:"Fall to my name!"

usa_news.11.t:"Legion State Launches 'Co-Prosperity Economic Sphere'"
usa_news.11.desc:"Recently, the American Legion State announced the official launch of the 'Co-Prosperity Economic Sphere' plan. This historic move aims to end centuries of global economic inefficiency and resource waste, forging a divided continent into a unified, powerful, and single-minded economic battlefield.\n\nThis is a decisive step toward a new world order of prosperity, order, and invincibility under the leadership of the Legion State. Any individual or entity obstructing this great process will be deemed an enemy of the continent and crushed without mercy."
usa_news.11.a:"Glory to the Legion!"
usa_news.11.b:"The rise of a world power."
usa_news.11.c:"Fall to my name!"

usa.999.t:"North Atlantic Treaty Organization"
usa.999.desc:"As the imminent global threat is resolved, the loose alliance between [SOV.GetNameDef] and its Western allies begins to disintegrate.\n\nTo contain the spread of communism in Europe, the White House has contacted us, proposing a military cooperation organization."
usa.999.a:"We must contain the threat from the East."
usa.999.b:"We don't need another war..."

usa.1000.t:"[From.GetNameDefCap] Agrees to Join NATO"
usa.1000.desc:"The [From.GetAdjective] government has responded to our previous diplomatic note, assuring that their administration will work towards our shared future. Our ambassador to [From.GetNameDef] has now been promoted to Special Representative, with full authority to ensure communication between [From.GetAdjective] and the White House."
usa.1000.a:"Excellent!"

usa.1001.t:"[From.GetNameDefCap] Refuses"
usa.1001.desc:"The diplomatic note we previously sent to [From.GetNameDef] has now been leaked to the media, causing a public uproar. Even international news outlets are publishing unpleasant editorials, misrepresenting our reasonable requests as 'disrupting the world situation,' a 'dangerous precedent,' or even 'blatant imperialism.'\n\nNot to mention, the [From.GetAdjective] government has refused further discussion on the matter and warned that any further mention would lead to an immediate suspension of diplomatic relations."
usa.1001.a:"There's nothing we can do."

usa.331.t:"The United States Seeks to Unify North America"
usa.331.desc:"[From.GetLeader] recently sent a letter asserting that communism is humanity's brightest future. [From.GetNameDef] has completed its transition to a communist state and invites us to join them. However, if we refuse, they will take 'measures they deem necessary.'"
usa.331.a:"We have no other choice."
usa.331.b:"Let these red thugs go pound sand"

usa.332.t:"[From.GetNameDefCap] Endorses Communism"
usa.332.desc:"The [From.GetAdjective] government has responded to our previous diplomatic note, assuring that their administration will take a significant step towards communism. Our ambassador to [From.GetNameDef] has now been promoted to Special Representative, with full authority to oversee the communist transformation of [From.GetAdjective]."
usa.332.a:"Excellent! Let us advance towards communism together!"

usa.333.t:"[From.GetNameDefCap] Opposes Our Proposal"
usa.333.desc:"The diplomatic note we previously sent to [From.GetNameDef] has now been leaked to the media, causing a public uproar. Even international news outlets are publishing unpleasant editorials, misrepresenting our reasonable requests as 'interfering in internal affairs,' a 'dangerous precedent,' or even 'blatant imperialism.'\n\nNot to mention, the [From.GetAdjective] government has refused further discussion on the matter and warned that any further mention would lead to an immediate suspension of diplomatic relations."
usa.333.a:"We must bring liberation to them!"

usa.701.t:"Proposal from American Arms Manufacturers"
usa.701.desc:"American arms manufacturers have recently suggested that, given the increasingly tense global situation, they are willing to offer our country a cost-effective arms deal to ensure we are not threatened by inadequate military preparedness in the future."
usa.701.a:"They make a valid point."
usa.701.b:"We clearly need more arms."
usa.701.c:"We don't need Americans meddling in our internal affairs."

usa.702.t:"[From.GetNameDefCap] Agrees"
usa.702.desc:"The [From.GetAdjective] government is skeptical about the arms trade we proposed but is still willing to engage in a tentative transaction with us."
usa.702.a:"Why not?"

usa.703.t:"[From.GetNameDefCap] Wants to Increase Trade Volume"
usa.703.desc:"The [From.GetAdjective] government has expressed great enthusiasm for the arms trade we proposed. They desire more military equipment to ensure national security."
usa.703.a:"Excellent!"

usa.704.t:"[From.GetNameDefCap] Rejects the Deal"
usa.704.desc:"The [From.GetAdjective] government has shown impatience with the arms trade we proposed. They believe they have sufficient military equipment to face any war."
usa.704.a:"Let them fend for themselves."

usa.711.t:"The United States Seeks to Invest in Our Country"
usa.711.desc:"American businessmen have arrived with thick project proposals and solid credentials.\n\nThey candidly stated that they recognize the 'remarkable efficiency' and 'stable business environment' demonstrated under our government's governance. They intend to bypass the cumbersome procedures of traditional nation-states and invest directly in us."
usa.711.a:"Our people need more welfare."
usa.711.b:"We clearly need more military supplies."
usa.711.c:"We don't need help from the Americans."

usa.712.t:"[From.GetNameDefCap] Agrees"
usa.712.desc:"The [From.GetAdjective] government is very interested in the investment we proposed. They want us to invest in civilian factories."
usa.712.a:"Leave it to Uncle Sam."

usa.713.t:"[From.GetNameDefCap] Agrees"
usa.713.desc:"The [From.GetAdjective] government is very interested in the investment we proposed. They want us to invest in military factories."
usa.713.a:"Leave it to Uncle Sam."

usa.714.t:"[From.GetNameDefCap] Rejects the Deal"
usa.714.desc:"The [From.GetAdjective] government has expressed no interest in the investment we proposed. They even suspect us of engaging in commercial espionage."
usa.714.a:"How dare they be so rude?"

usa.721.t:"Discovery by the Auditing Department"
usa.721.desc:"Recently, while auditing the special operations funds of the 'Market Development Department,' the Auditing Department uncovered a massive, unexplained shortfall. Preliminary investigations point to the department head, who appears to have embezzled huge sums to establish secret accounts and shadow companies overseas under his personal control.\n\nThese funds were intended to support allied overseas regimes, but now he may be using our money to build a commercial empire of his own—one that could operate independently of the Council at any time. This is not just corruption; it is treason."
usa.721.a:"The traitor must be eliminated!"

usa.722.t:"Findings of the Internal Investigation Unit"
usa.722.desc:"According to a months-long covert operation by the 'Internal Investigation Unit,' we have completed this quarter's financial audit. The results are shocking, yet they confirm certain earlier rumors.\n\nSubstantial corruption indeed exists among our senior officials, forming a vast network. Through the establishment of fake subcontractors, inflated raw material costs, and direct sales of military decommissioned equipment, they have embezzled an astonishing amount of assets over the past few months."
usa.722.a:"Purge them... and confiscate their assets."

usa.723.t:"Investment from Foreign Businessmen"
usa.723.desc:"A delegation from a foreign consortium has arrived with thick project proposals and solid credentials.\n\nThey candidly stated that they recognize the 'remarkable efficiency' and 'stable business environment' demonstrated under the governance of the 'Corporate Council.' They intend to bypass the cumbersome procedures of traditional nation-states and cooperate directly with us to invest in building a brand-new precision instrument factory in the Great Lakes region, utilizing the latest European technology.\n\nNaturally, this deal comes with conditions. They demand a five-year tax exemption, complete autonomy in factory management, and the use of their own security personnel. In return, they promise to supply half of the output to the Council at internal prices and pay a substantial 'market access fee.'\n\nThis is a massive investment, but it could also be a Trojan horse sneaking into our garden."
usa.723.a:"The more such investments, the better."

usa.724.t:"Proposal from Foreign Arms Merchants"
usa.724.desc:"A delegation from a foreign consortium has arrived with thick project proposals and solid credentials.\n\nThey wasted no time on pleasantries, stating outright their appreciation for the Council's 'pragmatic' business environment and strong industrial base. Their proposal is to invest in building an advanced 'Optical Instruments and Communication Equipment' factory on our territory, which, in reality, will specialize in producing his innovative sniper scopes and encrypted radios.\n\nTheir conditions are absolute commercial confidentiality and extraterritoriality for the factory. In return, they will not only pay a huge fee but also prioritize supplying 30% of the output to our security forces and expeditionary army at 'cost price.' They also hinted that their 'special channels' could open up markets... inaccessible through traditional diplomacy.\n\nThis is an excellent opportunity to enhance our troops' equipment quality and gain grey income, but we might also be introducing an uncontrollable and dangerous element."
usa.724.a:"Welcome! We need his technology and channels."

usa.725.t:"Corporate Infighting Escalates"
usa.725.desc:"In the competition for the last major armored vehicle order from the Federal (remnant government), two large corporations have driven their bids below cost.\n\nWhile this appears to be standard business practice, the consequences are disastrous:profits for both sides have plummeted, funds for developing new weapons have dried up, and factories are slowing production due to lack of profitability. Worse still, they have begun slandering and exposing each other's secrets in the parliament, severely damaging the Council's united image. We are strangling our own profit source with our own hands."
usa.725.a:"Enforce a 'Unified Pricing' agreement."
usa.725.b:"Let them fight; survival of the fittest."
usa.725.c:"Mediate and persuade them to reconcile."

usa.801.t:"The Dust Settles"
usa.801.desc:"The turmoil has subsided.\n\nThose who whispered in the shadows, believing money could buy patriotism, have now tasted defeat. Their newspapers are silent, their radios now play solemn marches, and their despicable plots to sow discord between the military and the nation have been utterly crushed by loyal soldiers.\n\nThis nation once stood on the brink, led toward chaos by incompetent politicians and greedy plutocrats. It was I who answered the deeper call of duty, shouldering this unpopular yet crucial responsibility. I never doubted victory would be ours, for our flag is woven from conviction, while theirs is soaked in the stench of money.\n\nToday, we have not only won a power struggle but have also ushered in a new era for America—an era built on order, responsibility, and national revival. The temporary state of emergency must continue until we eradicate all toxins corroding our fabric.\n\nThe path is cleared. Now, the real work begins."
usa.801.a:"Old soldier gangs never die, they just fade away... and a new legion has risen."

usa.802.t:"The Philadelphia Shooting"
usa.802.desc:"A Victory Day parade in front of Independence Hall in Philadelphia was meant to be a display of the junta's strength and unity. However, as the speech reached its climax, gunfire tore through the air.\n\nIt was not a carefully planned sniper attack but an ugly, chaotic close-range firefight. One or more unidentified assassins unleashed a hail of bullets toward the viewing stand using smuggled submachine guns. The President—our Supreme Commander—remains in critical condition, shielded by loyal guards who formed a human barricade, but several senior officials, including the Military Governor of Pennsylvania and the Assistant Chief of Staff of the Army, were killed on the spot. Fierce gun battles erupted between the security detail and the assassins amid the panicked crowd, causing significant civilian casualties.\n\nAfter a brief silence, official broadcasts began reporting this 'cowardly attack on the United States' in a somber and angry tone. Yet, beyond the official narrative, rumors are spreading like wildfire. Some say it was retaliation by remnants of the unvanquished conglomerates; others whisper that it was an unsuccessful purge by factions within the military against the increasingly dictatorial President MacArthur.\n\nWhatever the truth, the gunshots in Philadelphia have echoed across the nation. They have exposed the deep fissures beneath the junta's rule and signaled that the surface calm has been shattered entirely."
usa.802.a:"My God..."

usa.803.t:"Provisional Committee"
usa.803.desc:"An emergency broadcast from Washington interrupted all frequencies. Accompanied by低沉哀乐 (dī chén āi yuè - solemn funeral music), a grave voice announced:President [ROOT.GetLeader], Supreme Commander of the American Military State, has succumbed to his injuries from the shooting and passed away in the hospital early this morning. The official statement hailed him as the 'Savior of the Nation' and declared a thirty-day period of national mourning.\n\nHowever, even before the curtains of mourning fully descended, the restructuring of power was quietly completed. Within hours of the Marshal's death, a 'Provisional Governance Committee,' previously lurking in the shadows of the junta, swiftly assumed all state powers. Notably, the core members of this committee are not active-duty generals but representatives of the industrial and financial titans who collaborated with MacArthur during his early rise.\n\nThey declared that to 'ensure national stability and economic continuity,' the junta's state of emergency would remain in effect, but its direction would undergo 'necessary adjustments.' The military was ordered back to their barracks, pledging loyalty to the Committee. There was no bloodshed, no gunfire—only a series of calm phone calls and pre-signed documents.\n\nThe Marshal's iron legion once devoured this nation's freedoms, and now, those who forged that legion have stepped out from behind the scenes, quietly picking up the reins dropped beside the throne. The era of [ROOT.GetLeader] is over. A colder, more efficient, and omnipresent era of capital has officially arrived."
usa.803.a:"God bless America..."
