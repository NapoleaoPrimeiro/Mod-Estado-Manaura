usa.503.t:"[From.GetNameDefCap]'s Ultimatum"
usa.503.desc:"[From.GetLeader] recently sent a letter, stating that they consider communism the best path for humanity. [From.GetNameDef] has completed the transition to a communist state and claims that China needs a communist government. They suggest that we reorganize government institutions. But if we refuse, they will take 'the measures they deem necessary.'"
usa.503.a:"Damn it..."
usa.503.b:"Damn it! Let the Americans come at us!"

usa.504.t:"[FROM.GetLeader] Compromise"
usa.504.desc:"After relentless diplomatic negotiations, [From.GetLeader] has agreed to reorganize government institutions to complete the transition to a communist government. Comrade Mao Zedong arrived in Nanjing yesterday to discuss national affairs with [From.GetLeader]."
usa.504.a:"Here's to our friends in China!"

usa.505.t:"[FROM.GetLeader] rejected our proposal"
usa.505.desc:"[From.GetLeader] accused us in their reply of trying to interfere in China's internal affairs. They believe our proposal is not suitable for China."
usa.505.a:"We have no other choice"

usa_news.13.t:"US Intervenes in China's Situation"
usa_news.13.desc:"Yesterday, the White House officially announced that it will intervene in Asian affairs. They are making every effort to turn China into the next communist superpower and have already sent a letter to the Chinese government. We do not yet know China's response, but there is no doubt that communist forces are gradually growing stronger."
usa_news.13.a:"Cheers to communism!"
usa_news.13.b:"Red America has bared its fangs at us."
usa_news.13.c:"Fight for the liberation of humanity!"
