usa_extra.14.t:"Frontline Ammunition Shortage Worsens!"
usa_extra.14.desc:"Our neglect of restarting production lines has finally borne bitter fruit—frequent bad news from the front, troops lacking ammunition and unable to complete most combat plans. The Department of Defense is deeply dissatisfied and urges us to prioritize production, to restart the lines before the worst arrives."
usa_extra.14.a:"How terrible..."

usa_extra.15.t:"Unexpected Good News"
usa_extra.15.desc:"Unexpectedly, the war has helped us solve the massive unemployment problem. In other words, war fuels the economy—a large number of unemployed workers have entered factories, and the long‑stalled production lines are once again running at full speed, bringing a glimmer of hope for the end of the Great Depression."
usa_extra.15.a:"Nice!!"
