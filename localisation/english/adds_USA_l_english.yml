USA_focus3_desc:"Communism has finally been achieved. Now we must thoroughly reshape America."
USA_focus4_desc:"Agriculture is our nation's foundation. We must protect farmers' rights."
USA_focus5_desc:"The roots of communism are not yet firm. We must remain moderate, both internally and externally."
USA_focus6_desc:"The essential path to remaking America is to eradicate the big capitalists. We must persuade the centrists, and marginalize or eliminate the hardliners."
USA_focus7_desc:"All farmers must realize they are the foundation of America. Without food security, American freedom and equality are empty words."
USA_focus8_desc:"In a land of freedom, our minds must remain free. It is time to emancipate our thinking and create a future for our homeland."
USA_focus9_desc:"Building socialism with American characteristics requires improving the ideological, moral, scientific, and cultural qualities of the entire nation. This provides powerful spiritual motivation and intellectual support for economic development and overall social progress, cultivating generations of citizens with ideals, morality, culture, and discipline, suited for socialist modernization. This is a long-term and arduous task for our cultural development."
USA_focus10_desc:"Developing socialism in America cannot rely solely on elites. We must unite the grassroots. Workers and peasants are the primary targets we need to mobilize at this stage."
USA_focus11_desc:"All workers must realize they are producing for the great motherland—a glorious and monumental task. Our development depends on every swing of the workers' hammers. Simultaneously, we need to mobilize more unemployed individuals to power the nation's machines."
USA_focus12_desc:"As the world's leading industrial power, we must hold ourselves to a higher standard. We must build socialism faster and better than the Soviets, leading the American people and the people of the world toward the brightest future."
USA_focus13_desc:"Fascism is a cancer on humanity. We must eradicate it in its cradle."
USA_focus14_desc:"To resolve the American crisis, everyone must pledge loyalty to the government."
USA_focus15_desc:"To resolve the American crisis, people must be liberated from consumerism."
USA_focus16_desc:"To resolve the American crisis, we must establish legions loyal to us."
USA_focus17_desc:"Extraordinary times call for extraordinary measures."
USA_focus18_desc:"Colored people have acquired vast wealth in America through improper means. It is time to make them give it back."
USA_focus19_desc:"White people are the superior race. We must utilize this innate advantage to its fullest potential."
USA_focus20_desc:"To promote socialism, we can reorganize the national broadcasting system, using media to deepen our people's understanding of socialism."
USA_focus21_desc:"Strengthening socialist ideological education is essential for fundamentally transforming the state and its people."
USA_focus22_desc:"We must expand socialist academies to enhance education for future generations."
USA_focus23_desc:"Due to the lingering effects of the Great Depression and the Civil War, the President has declared a state of national emergency."
USA_focus24_desc:"The nation's survival is at stake. To ensure America endures, we must amend the War Powers Act to allow emergency seizure of key enterprises like banks and railroads."
USA_focus25_desc:"As the elite classes are deeply influenced by capitalist ideology, we must turn our attention to the grassroots. The working and peasant classes, being the largest, hold limitless potential. We need to unite them to counterbalance the upper classes."
USA_focus26_desc:"To get the state machinery running again, entrepreneurs must contribute more. The new progressive tax law will levy higher taxes on large corporations."
USA_focus27_desc:"Reactionaries have openly declared war on us. For the future of the American people, we must defend America."
USA_focus28_desc:"To ensure victory, temporary oppression is an unfortunate necessity."
USA_focus30_desc:"The civil war is over. It is time to rebuild America."
USA_focus31_desc:"Our powerful industry can produce a continuous stream of armored units, capable of rapidly tearing through enemy lines."
USA_focus32_desc:"We are leaping into the future..."
USA_focus33_desc:"Germany has already begun rocket research. Our nation must keep pace."
USA_focus34_desc:"Although the Great Depression is winding down, the Fireside Chats still hold significant influence. We can use them to prepare for war."
USA_focus35_desc:"Belligerent nations can purchase American supplies and weapons with cash but must transport them using their own ships."
USA_focus36_desc:"Freedom of speech, freedom of worship, freedom from want, and freedom from fear."
USA_focus37_desc:"Now, the entire nation must serve the war effort. Every man, woman, and child has a duty to contribute."
USA_focus38_desc:"To win the war, issuing war bonds is a necessary measure."
USA_focus39_desc:"All Americans have the right and duty to know the progress and outcome of the war, both at home and abroad."
USA_focus40_desc:"Extraordinary times call for extraordinary measures."
USA_focus41_desc:"All Americans must contribute to the war effort, regardless of gender."
USA_focus42_desc:"Advanced weaponry can save countless lives."
USA_focus43_desc:"It is time to establish a Joint Chiefs of Staff within the Allied forces."
USA_focus44_desc:"America needs you."
USA_focus45_desc:"The current international situation is dire. We must intervene promptly."
USA_focus46_desc:"Defense Contractors."
USA_focus47_desc:"The military-industrial complex is a double-edged sword, and moreover, a slumbering monster."
USA_focus48_desc:"Binding Cooperation."
USA_focus49_desc:"Increase Defense Contracts."
USA_focus50_desc:"This act allows us to recapture excess profits, set lower profit margins, and reinvest the reclaimed funds into soldier welfare or post-war recovery funds."
USA_focus51_desc:"This is crucial to prevent conflicts of interest."
USA_focus52_desc:"The government will guarantee union rights in exchange for workers renouncing the right to strike during wartime."
USA_focus53_desc:"Expand the Union."
USA_focus54_desc:"This agency will allow us to allocate and mobilize national resources, directing them where they are most needed."
USA_focus55_desc:"The war is over. We must guide large corporations to convert their production lines and expertise to civilian use."
USA_focus56_desc:"Anti-Fascist United Front."
USA_focus57_desc:"The Japanese, a scourge on humanity. They have committed monstrous crimes against the people of Asia. Now it is time for them to face the world's wrath."
USA_focus58_desc:"Completely eradicate the global cancer of fascism."
USA_focus60_desc:"Communists have gained control of Congress. It is time to abolish Congress and replace it with a People's Assembly."
USA_focus61_desc:"The old constitution is merely a tool for capitalists to exploit the people. Now, we should enact a constitution oriented towards socialism."
USA_focus62_desc:"For socialism to survive in the current environment, we must prioritize heavy industrialization and arm ourselves."
USA_focus64_desc:"As armor is the weapon of the future, America and the Soviet Union should invest more funds in this area."
USA_focus65_desc:"To prepare for the coming war, America and the Soviet Union should expand industrial cooperation."
USA_focus66_desc:"The time has come to liberate all of North America."
USA_focus67_desc:"The people of North America should stand united forever."
USA_focus68_desc:"The time has come. We must prepare to turn the whole world into a proletarian paradise."
USA_focus69_desc:"Invite communists from all nations to help build America."
