USA_shachenbaoyingxiang:"The Black Blizzard"
USA_shachenbaoyingxiang2:"The Black Blizzard"
USA_shachenbaoyingxiang3:"The Black Blizzard"
USA_shachenbaosilue:"Dust Storm Devastation"

usa.501.t:"The Black Blizzard Returns"
usa.501.desc:"We thought the worst was over, but we were wrong. Emergency reports from the Department of Agriculture indicate that the Soil Conservation Program has yet to yield results, and a new, more destructive dust storm has once again swept across the Central Plains.\nThis 'Black Blizzard' is more violent than any before. Telegrams describe midday turning 'dark as night,' with visibility dropping to zero. Railways are buried, and newly established migrant towns are nearly wiped off the map. Even worse, the storm's reach is expanding eastward, beginning to threaten the agricultural lands of the Mississippi River Basin.\nDesperation is brewing. The first wave of migrants heading west encountered hostility and 'Locals First' resistance at the California border. Now, even more people are trapped between their homeland and the unknown, with nowhere to go. We are facing not just an ecological collapse, but a comprehensive social and moral breakdown."
usa.501.a:"I expect the investigation report immediately."

usa.502.t:"Dust Storm Impact Investigation Report"
usa.502.desc:"An internal report on the dust storm's impact has landed on your desk. It details the devastating blow to the central agricultural states:vast farmlands destroyed, hundreds of thousands of refugees displaced, and a mass migration toward the West Coast. This is not just an ecological disaster—it has severely crippled the nation's economy and stability.\nThe report is filled with suffocating details:homes with thick dust coating the floors, impossible to keep out even with sealed windows and doors; livestock dying en masse from dust inhalation; children suffering from 'dust pneumonia,' struggling to breathe through fits of coughing. The land that once nurtured the 'Breadbasket of the World' is now burying itself—and the future of its people."
usa.502.a:"Approve emergency aid and establish relief camps."
usa.502.b:"We cannot handle this right now."

USA_jurendejuexing2_idea:"Awakening of the Giant"
USA_meiguoyouxian2_idea:"America First"
USA_meishishehuizhuy2_idea:"American Socialism"

usa.0.t:"Welcome to the United States of America"
usa.0.desc:"Mr. President, welcome to the White House.\nWhat you have inherited is not a position, but a catastrophe sweeping the nation. A quarter of the workforce is jobless, countless families struggle in despair. Factories that once roared now lie silent, like the frozen heartbeat of this country.\nIn the Midwest, the fertile land once called the 'World's Breadbasket' is now being swallowed by endless dust storms. Hundreds of thousands of farmers are forced to leave their homes, becoming refugees in their own land.\nOn the political stage, the battle began even before your inauguration. The left accuses you of being too moderate, the right sees you as the vanguard of socialism. The Supreme Court, holding the Constitution, watches your every New Deal initiative with a skeptical eye. And across the oceans, the world economy teeters on the brink, while the shadows of dictators spread rapidly across the Old Continent.\nThe eternal prosperity this nation once believed in is now a shattered dream. Now, it falls to you to answer the question:Can a free nation accomplish great deeds?"
usa.0.a:"The only thing we have to fear is fear itself."

usa_news.12.t:"The Awakening of the Giant"
usa_news.12.desc:"In a ceremony hailed by global observers as a 'decisive turning point,' President [ROOT.GetLeader] today formally signed the highly controversial National Industrial Remobilization Act. This move marks America's official abandonment of its isolationist stance as a bystander, as its vast industrial potential begins converting into tangible war-making capacity at an unprecedented rate.\n'The illusion of an era is over,' the President declared in a brief speech following the signing ceremony. 'We choose no longer to be spectators on the world stage. From this day forward, every American furnace, every lathe, and the hands of every worker shall serve to defend the way of life we hold dear.'"
usa_news.12.a:"Let this be the sound of gears turning for the Arsenal of Democracy, not a remedy applied too late."
usa_news.12.b:"A giant, torn by economic depression and internal strife, attempts to don its outdated armor."
usa_news.12.c:"We must defend democracy."

usa.811.t:"Political Contest:With Whom Do We Stand?"
usa.811.desc:"As the dust of the civil war settles, the conflict between the Consortium and the President is becoming increasingly pronounced. The President wants to forge the nation into a monolithic machine loyal to him; the Consortium merely wishes America to be a paradise for capitalists. The die is cast, and America's fate now rests in our hands."
usa.811.a:"Standing by the President is clearly the best answer."
usa.811.b:"The era of the Corporate State must dawn."

USA_bop_moheizongtong:"Smear the President"
usa.821.t:"Accusations Against the President"
USA_bop_shouquanmimijingcha:"Authorize the Secret Police"
USA_bop_gonggongshiyekonggufa:"Reintroduce the Public Utility Holding Company Act"
usa_841a_tt:"We will stand with the §YConsortium§!"
usa_841b_tt:"We will stand with the §YPresident§!"

usa.822.t:"What Have They Prepared for Your Children?"
usa.822.desc:"A leaflet distributed in industrial districts reads:'While he promises the future on the radio, his Wall Street partners are liquidating our future.' It alleges the President's family fund holds secret stakes in armament and pharmaceutical stocks, and 'unfortunately,' recent border clashes and factory accidents have恰好 quadrupled the value of those shares.\n'Every coffin contains his dividends,' the slogan at the bottom of the leaflet strikes like a poisoned dagger. Although the Treasury promptly produced the President's asset records, seeds of doubt have already sprouted in taverns and workshops."
usa.822.a:"Now the show begins."

usa.823.t:"The Generals' Warning"
usa.823.desc:"A 'leaked' copy of a secret memo is circulating wildly among the capital's elite. In it, a 'deeply concerned' four-star general warns his colleagues that the President's mental state is 'unstable' and 'holds a civilian's contempt for the military,' hinting he might purge commanders who are not absolutely loyal.\nAlthough a military spokesman denounced it as an 'outright forgery,' the document precisely exploits the most sensitive nerve between the army and the civilian government."
usa.823.a:"Could another civil war be upon us?"

usa.824.t:"For Whom Does He Play?"
usa.824.desc:"A radio drama produced by the 'Patriotic Front' airs at night. In it, an actor whose voice is uncannily similar to the President's engages in a sordid deal with a foreign agent with a thick accent. 'This country is merely a stepping stone,' the character scoffs, 'the real target is a greater international revolution.'\nDespite its absurd content, its high production value and detailed dialogue have convinced many listeners. People are beginning to ask in streets and alleys:Whose President is he, really?"
usa.824.a:"Perhaps this is the reality..."

usa.825.t:"The Vanished Doctoral Thesis"
usa.825.desc:"A copy, alleged to be from the President's youth, is circulating on university campuses, filled with praise for certain extremist ideologies. An archivist 'accidentally' discovered that key chapters of this thesis are missing from the official records.\nAn opposition MP questioned in parliament:'Has he disavowed his past, or does his past reveal his true nature?'"
usa.825.a:"The President might not be that honest..."

usa.826.t:"The Blank Weapons Order"
usa.826.desc:"A petition from the 'Soldiers' Mothers Association' is circulating among the populace,附带 attached with a blurred copy of a military production report. The report indicates that after the President's confidant inspected an arms factory, 20% of the rifle orders produced there for frontline troops were canceled without reason.\n'Our children are defending the nation with their lives, yet someone is skimping on their weapons!' a spokesperson for the association cried during a street speech, 'This is betrayal, it's trading with the blood of patriots!'"
usa.826.a:"Is the President leading the treason?"

usa.831.t:"Inferior Steel from the Front"
usa.831.desc:"A top-secret report from an internal investigative committee lands on your desk. It points out systemic quality issues with the armor plates produced for the Army by 'National Steel & Foundry Company.' By reducing chromium content and using inferior scrap steel, the company illegally profited millions in the last six months.\nMore infuriatingly, evidence suggests company management knew about it early on and suppressed warnings from internal engineers. This directly led to the premature sinking of three destroyers and额外 battle losses of hundreds of tanks."
usa.831.a:"Nationalize it immediately and prosecute those responsible for treason."
usa.831.b:"Impose a massive fine and force a change in management."
usa.831.c:"Suppress the news and order them to rectify within a deadline."

usa.832.t:"The Innovation-Stifling Agreement"
usa.832.desc:"After months of investigation, the internal investigative committee has finally achieved a decisive breakthrough. The inquiry reveals that six industrial giants, including 'General Electric' and 'Westinghouse,' have systematically stifled technological innovation by emerging companies in radio and turbine fields through a secret 'Technology Sharing Agreement.'\nThey artificially slowed the nation's industrial upgrade by acquiring patents and shelving them, uniformly suppressing energy efficiency standards, and even jointly boycotting downstream manufacturers that adopted new technologies."
usa.832.a:"Establish a National Technical Standards Committee."
usa.832.b:"Force them to pay an 'Innovation Fine.'"

usa.833.t:"Child Labor in the Mines"
usa.833.desc:"The internal investigative committee infiltrated the mines of the 'Midwest Coal Consortium' and brought back heartbreaking evidence. The investigation shows the company not only commonly employs children under 14 for井下 work but has also built a modern system of slavery through company stores, violent threats, and other means.\nMeanwhile, investigators found the company has evaded massive taxes for five consecutive years through fraudulent accounting, using these funds to bribe local officials to cover up the truth."
usa.833.a:"Revoke its charter and confiscate its assets."
usa.833.b:"Promote the 'Workplace Safety and Fairness Act.'"

usa.834.t:"The Pipeline to the Enemy"
usa.834.desc:"Through intercepted communications and shipping records, the internal investigative committee uncovered a shocking fact:a domestic oil company, using a series of shell companies in neutral nations as transit points, has been continuously exporting aviation fuel to our potential enemy nation.\nThe company's executives stated bluntly in internal communications:'Ideology is temporary, profit is eternal.' Our pilots might soon face enemy aircraft in the skies, powered by fuel from our own land."
usa.834.a:"Nationalize it and convert it into an exclusive military supplier."
usa.834.b:"Issue a secret warning, order them to cease transactions and pay a fine."

usa.841.t:"The Public Utility Holding Company Act"
usa.841.desc:"To curb the growing power of the consortiums, the President, despite opposition, has once again applied to pass the Public Utility Holding Company Act. This act, originally proposed by former President Roosevelt, was accused of attempting to destroy the free enterprise system.\nThe clause stipulates that by January 1, 1940, all public utility holding companies must consolidate their operations into a single, integrated system. This means a holding company can only control one geographically and economically interconnected electric system. Any holding company unable to prove its benefit to the public will be forcibly dissolved."
usa.841.a:"We must not allow this act to pass, no matter what."
usa.841.b:"Passing this act will greatly increase our chances of success."

usa.842.t:"The Electricity War:Week One"
usa.842.desc:"In last night's 'Fireside Chat,' the President announced in an uncompromising tone that he would submit a new version of the Public Utility Holding Company Act to Congress, aiming to 'dismantle the energy oligarchs looming over American households.' Before he finished speaking, the volcano of public opinion erupted.\n[Day 1]\nCheers from supporters and roars from opponents simultaneously filled the airwaves. Consumer rights groups and trade unions took to the streets, calling it 'long-overdue justice'; business associations held emergency press conferences, warning it would 'strangle investment and plunge America into darkness.'\n[Day 3]\nCapital markets fluctuated violently, utility stocks plummeted, dragging down the broader market. Opposition MPs gathered in front of Capitol Hill, holding the Constitution, reading aloud, and accusing the President of 'abuse of power.'\n[Day 5]\nA meticulously planned counter-narrative began. Full-page ads purchased by the 'American Electricity Consumer Choice Alliance' (backed by holding companies) appeared in newspapers nationwide, depicting a worried elderly woman with the caption:'He cares about your bill, but who cares about your pension? (Our stocks power millions of retirement accounts.)'\n......"
usa.842.a:"We must control the narrative – activate our propaganda machine!"
usa.842.b:"Let the facts speak for themselves, urge Congress to vote quickly."

usa.843.t:"The Bill is Submitted"
usa.843.desc:"Today, on the podium at the joint session of Congress, the atmosphere was as heavy as the calm before a storm. Without much ado, you directly raised a hefty document – the draft of the Public Utility Holding Company Act.\n'Mr. Speaker, members of Congress,' your voice broadcast across the nation, 'I stand here today not to declare a war, but to end a war – a war waged without declaration upon ordinary American families and small business owners.'\n'The weapons of this war are exorbitant electricity bills, its trenches are those complex, cross-state corporate structures beyond oversight, and its captives are the free markets themselves, bound by monopolistic power!'\nAs you elaborated on the core of the bill – forced breakup of vast utility empires, establishment of strict federal regulation – the rift in the chamber was clear. One side erupted in warm applause, the other was deathly silent, punctuated by loud boos. In the corridors, utility lobbyists looked grim, whispering urgently with key committee chairs.\nThe battle trumpet has sounded. Now, the fate of the bill lies with Congress."
usa.843.a:"Contact our legislators, ensure the bill cannot pass."
usa.843.b:"Take the first step with an executive order, apply pressure."

usa.844.t:"The Kingdom Crumbles"
usa.844.desc:"After days of brutal political struggle, countless speeches, compromises, threats, and late-night votes, the Public Utility Holding Company Act finally passed Congress. Today, under the gaze of hundreds of supporters, journalists, and cabinet members, the President signed his name on the document with that famous pen.\nThe air was filled with a near-revolutionary euphoria. The moment the President put down the pen, broadcasts carried immediate news from the New York Stock Exchange:utility holding company stocks plummeted, while the broader industrial index rose. The market gave its most honest reaction – the monopolistic order of the old era was终结.\nOutside the window, the gathered crowd erupted in thunderous cheers. Their signs no longer protested but celebrated – 'Light Finally Arrives!', 'The People Win!'. In that moment, the President not only signed a bill but shattered a seemingly invincible financial kingdom. The White House's electricity seemed to grow brighter and cheaper because of it.\nThe structure of power was permanently altered. The President proved that even the most entrenched interests are not impregnable in the face of determined will."
usa.844.a:"This is the President's Victory"

usa.845.t:"The Iron Curtain Falls"
usa.845.desc:"The moment the final vote count was announced, two截然 different waves of sound erupted in the Congressional hall – one of victorious cheers, the other of despairing sighs. Despite exhausting all political capital and mobilizing national public opinion, the Public Utility Holding Company Act was ultimately buried under protracted debate and relentless lobbying.\nNews spread like wildfire. On the radio, opposition commentators declared victoriously:'Reason has triumphed over populism!' In the stock market, utility giants' stocks soared, as if mocking the White House's failure.\nThis was more than the failure of a single bill. It was a comprehensive rejection of the President's agenda, a blatant victory of special interests over public will. It sent a chilling signal:in this country, some forces are even more powerful than the President.\nThe ceiling of power had been revealed, and it was forged from money."
usa.845.a:"One step closer to our victory"

usa.846.t:"A Scarred Victory"
usa.846.desc:"After a final round of exhausting marathon negotiations, when the vote counter showed that微不足道 majority, no one cheered. To secure those crucial few votes, the President paid a heavy price:the bill's implementation timeline was extended, the strictest breakup clauses were weakened, numerous exceptions were written into the text.\nThe pen in the President's hand no longer signed the thunderous bill meant to 'dismantle the giants,' but a complex agreement full of compromises, exceptions, and delays. Core supporters felt betrayed, calling it a 'hollow victory'; opponents watched coldly, claiming they 'saved half the industry from disaster.'\nThe bill passed, its name recorded in the law books. But everyone knew the real war was just beginning – a war of legal interpretation, enforcement, and protracted attrition against the enraged, yet untamed, beasts."
usa.846.a:"This is unfinished business."

usa.847.t:"The Answer is Revealed"
usa.847.desc:"Both the President and the Consortium have done their utmost. The answer is now clear."
usa.847.a:"The result is:"
