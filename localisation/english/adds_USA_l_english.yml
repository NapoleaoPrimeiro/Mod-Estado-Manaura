US_can_us_influence:0"Guidance of the United States" 
US_can_us_influence_tt:0"Greatly §Yincreases§! the desire to maintain §Ygood relations§! with the §YUnited States§!" 
US_can_us_influence_desc:0"Although our national defense and foreign policy are centered on the United Kingdom, the gradual rise of the United States forces us to consider adjusting our diplomatic direction. The UK may not be pleased, but with the guidance of the United States, we will one day break free from Britain."

usa_extra.16.t:"Our Films Are a Global Sensation!"
usa_extra.16.desc:"Although the Great Depression dealt a severe blow to our film industry, Hollywood stands tall. Over the past few years, American films have remained a global craze, attracting more and more people to understand the American lifestyle and culture. Now, as the effects of the Great Depression gradually fade, our film industry is once again reviving. Films such as 'The Last of the Mohicans' and 'Flash Gordon' have achieved great success not only at home but also abroad. In fact, we have already set the international film trend."
usa_extra.16.a:"Niceeeee!"

usa_extra.17.t:"The Necessity of Expanding Arms Trade"
usa_extra.17.desc:"Although we have alleviated the Great Depression through our efforts, our national economic situation remains dire. We need substantial revenue streams. As tensions rise worldwide, countries urgently need weapons to bolster their national defense. This is our opportunity. We can leverage our neutral status to sell weapons to other countries in exchange for foreign currency. However, this may cause discontent among our citizens: on one hand, our own military is still weak; on the other hand, this would be tantamount to war profiteering."
usa_extra.17.a:"This is necessary."
usa_extra.17.b:"Let's forget it."

usa_extra.18.t:"Canada Seeks to Renew Bilateral Trade Agreement"
usa_extra.18.desc:"Given that the previous bilateral trade agreement brought huge benefits to both countries, the Canadian Foreign Trade Minister called us almost as soon as the treaty expired, hoping to renew it. In the last treaty, the US and Canada reached a preliminary consensus on various tariff agreements. We stopped trade protectionism, and they regarded us as their most important trading partner. So, what is our answer?"
usa_extra.18.a:"Of course! Let's cooperate for mutual benefit!"
usa_extra.18.b:"We need to reconsider."

