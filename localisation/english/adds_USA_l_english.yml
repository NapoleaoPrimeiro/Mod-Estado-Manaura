US_can_cooperate_desc:0"Facing the economic crisis, Canada began seeking change. In 1935, the United States and Canada signed an important bilateral trade agreement, systematically lowering tariff barriers, marking the end of Canada's long-held protectionist 'National Policy' and opening the door to North American economic integration." 
