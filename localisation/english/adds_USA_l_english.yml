US_bond_can:"Investment in Canada"
US_bond_can_desc:"Our northern neighbor possesses vast mineral resources. If Britain was the enlightener of Canadian mining development, then we are the fundamental driver of its modernization and industrialization. We not only provided capital and technology, but more importantly, created a vast market. This deep and extensive involvement has made the United States the decisive force behind Canadian mining development."
