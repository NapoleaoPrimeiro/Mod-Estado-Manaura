usa_extra.1.t:"Confrontation with the Supreme Court"
usa_extra.1.desc:"Supreme Court Justice Hughes has publicly opposed our recently proposed court-packing plan. Moreover, the opposition has united the Republican Party and various figures from all walks of life to attack us. They accuse us of trying to create a dictator and distort the U.S. Constitution.\nIt is reported that the plan aims to increase the number of justices supportive of the president's New Deal, thereby changing the conservative stance of the Supreme Court. President Roosevelt has already argued vigorously for it, doing his utmost to push the plan through.\nSo, what will the final outcome be?"
usa_extra.1.a:"A bitter victory."
usa_extra.1.b:"Both sides make concessions."

usa_extra.2.t:"The Necessity of Cutting Spending"
usa_extra.2.desc:"After several years of effort, the Great Depression has entered its final phase. The New Deal and numerous public works have proven remarkably effective. They not only saved the nation from crisis but also left the United States a precious legacy—thousands of miles of highways, hundreds of bridges, and tunnels—forming the foundation for American industrial takeoff. However, this legacy did not come without cost; these projects consumed enormous government expenditure.\nNow, an opportunity presents itself: we can cut spending to alleviate the pressure the government has faced for years. But this step carries risks. If we are not careful, the Great Depression could even worsen.\nWhat should we choose?"
usa_extra.2.a:"Taking risks is the American way."
usa_extra.2.b:"Let's play it safe."

usa_extra.3.t:"The Great Depression Worsens"
usa_extra.3.desc:"The worst-case scenario has come to pass—after we cut spending, the Great Depression rapidly worsened, and unemployment soared again. States have reported to the federal government that if we do not intervene, the situation could deteriorate further, potentially undoing years of effort in an instant."
usa_extra.3.a:"Damn it!"

usa_extra.4.t:"Government Priorities"
usa_extra.4.desc:"After reducing public works, the next government priorities are on everyone's mind. Today, America faces numerous challenges: a nation in ruins, people suffering, military in disrepair, and trade in crisis. Every direction is a point of pain.\nWhile the government would like to solve all problems at once, that is clearly unrealistic. So, which direction should we focus on?"
usa_extra.4.a:"Without a people to support us, there is no nation, no home."
usa_extra.4.b:"Without a strong military, there is a home, but no nation."
usa_extra.4.c:"Let's keep these funds for subsequent policies."

usa_extra.71.t:"[?global.year|0] National Security Conference Commences"
usa_extra.71.desc:"With storm clouds gathering over the world, though isolationist sentiment still dominates Capitol Hill, senior military officials and some far-sighted politicians have already sensed the approaching tempest. At the behest of U.S. President [ROOT.GetLeader], the most influential members of the American military and civilian leadership have been summoned. The [?global.year|0] National Security Conference officially begins.\nThe conclusions of this conference will determine U.S. defense policy for years to come and will also shape the destiny of the entire world. The red arrows on the map seem to be spreading, and time is running out."
usa_extra.71.a:"Let us begin."

usa_extra.5.t:"National Security Conference: Rearmament"
usa_extra.5.desc:"The Army Chief of Staff is the first to speak, submitting a lengthy report and stating bluntly that the active-duty strength of the U.S. Army is even smaller than that of Romania, and its armored forces are virtually nonexistent—a national disgrace. The Navy, meanwhile, emphasizes the potential risks of two-ocean warfare in the Pacific and Atlantic, requesting approval for a new fleet expansion plan.\nShould we continue to maintain 'peacetime' fiscal austerity, or make limited preparations for an unknown war? This is not only a military strategic choice but also a critical vote on future national policy."
usa_extra.5.a:"As they say, preparedness prevents calamity."
usa_extra.5.b:"Let's do some rearmament."
usa_extra.5.c:"We simply don't have the money to spare."

usa_extra.6.t:"National Security Conference: Arnold's Proposal"
usa_extra.6.desc:"Brigadier General Henry H. Arnold, Deputy Chief of the Army Air Corps, subsequently submits a cautiously worded yet sharply pointed memorandum to the President. This document, later known as the 'Arnold Memorandum,' cuts to the chase: air power is being severely stifled under the current Army structure—funds are misappropriated, and procurement processes are blocked by Army generals.\nArnold proposes a seemingly technical yet far-reaching solution: establish an 'Air Combat Command,' granting the Air Corps autonomy over equipment procurement, tactical training, and operational command."
usa_extra.6.a:"Arnold is right. We should entrust him with full authority."
usa_extra.6.b:"The Air Force deserves greater autonomy."
usa_extra.6.c:"The Air Force is merely an auxiliary. The Army and Navy are the decisive forces."

usa_extra.7.t:"National Security Conference: Diplomatic Strategy"
usa_extra.7.desc:"After discussing the above issues, an even more critical question arises: how should we position ourselves in the world? Should we intervene cautiously, avoiding missed opportunities, or maintain diplomatic neutrality, waiting for the right moment?\nThe President knows that America cannot remain aloof forever, but how to convince Congress and the people? Before him lie two starkly different suggestions: the interventionist faction advocates pushing a limited intervention bill through Congress, opening a window to aid Britain and France; the other faction argues that the United States should not take sides in the European war and must strictly adhere to neutrality."
usa_extra.7.a:"The world needs America."
usa_extra.7.b:"But not right now."

usa_extra.72.t:"[?global.year|0] National Security Conference Concludes"
usa_extra.72.desc:"After discussing a series of issues, the National Security Conference formally ends. Before adjournment, President [ROOT.GetLeader] delivers a brief but powerful speech: Gentlemen, what we have done here is not preparation for war, but laying the foundation for peace. History will remember that when the storm came, America chose to remain vigilant, not asleep; chose unity, not division.\nRegardless of the choices we made, one thing is undeniable: an era has ended, and another has begun."
usa_extra.72.a:"Let's hope we made the right choice."

usa_extra.8.t:"The Unions' Proposal"
usa_extra.8.desc:"On [?global.year|0] Labor Day, President Roosevelt appealed to workers, emphasizing the need to 'build a strong national defense.' Leaders of the American Federation of Labor and the Congress of Industrial Organizations quickly responded, pledging to 'fully support the defense program' as long as labor rights are guaranteed. They assured that they would try their best to reach 'a unified agreement' between unions and management, ensuring war production would not be disrupted by strikes.\nIt is reported that the two union leaders have been invited to the White House for direct negotiations with the President. So, what is our response to this proposal?"
usa_extra.8.a:"This is a necessary step."
usa_extra.8.b:"Why should we cooperate with them?"

usa_extra.9.t:"Unions Encourage Workers to Support the Defense Plan"
usa_extra.9.desc:"Our series of efforts have finally paid off.\nThe American Federation of Labor and the Congress of Industrial Organizations have publicly declared their support for the President's defense plan. They stated that in this time of national crisis, labor-management conflicts are 'foolish and dangerous.' They called on all union members to work wholeheartedly for the nation, cease conflicts, and ensure war production is not interrupted by strikes.\nAlthough our policies have drawn criticism from many, at least now some are beginning to recognize the necessity and correctness of our approach."
usa_extra.9.a:"Good work!"

usa_extra.10.t:"Unions Dissatisfied with Us"
usa_extra.10.desc:"Our series of actions have made the American Federation of Labor and the Congress of Industrial Organizations increasingly dissatisfied and uneasy. They have protested our policies to relevant authorities. Their leaders have even openly cooperated, encouraging workers to fight for their rights.\nSome concessions might appease the restless workers and prevent worse outcomes."
usa_extra.10.a:"Alright... throw them a bone."
usa_extra.10.b:"They won't get a single cent."

usa_extra.11.t:"General Strike!"
usa_extra.11.desc:"Because we previously restricted most union powers, unions have organized hundreds of thousands of workers to strike and march. This has undoubtedly dealt a devastating blow to our industry. Factories are idle, production lines are halted, and the society that had just recovered is once again plunged into chaos."
usa_extra.11.a:"Damn it!"

usa_extra.12.t:"National Security Conference: Defense Contracting Act"
usa_extra.12.desc:"Shortly after Arnold sits down, the War Department and Navy Department jointly submit a proposal—the so-called 'Defense Contracting Act.' This act aims to streamline the military procurement process, allowing the government to offer private enterprises long-term contracts, tax breaks, and even subsidies for factory expansion in exchange for production priority during wartime.\nThe President must choose: cater to industrial giants to accelerate the gears of industrial mobilization, or yield to the isolationists and maintain the posture of an 'offshore balancer'? Silence is not an option either, as the draft contract awaits his signature."
usa_extra.12.a:"We do need them."
usa_extra.12.b:"But not right now."

usa_extra.13.t:"Truman's Term"
usa_extra.13.desc:"The sudden passing of President Roosevelt dealt a heavy blow to the American people. But at this moment, we cannot be consumed by this immense sorrow; someone must step up to assume the presidency.\nTruman, as the sitting Vice President, logically took over the presidency. In fact, he himself was quite surprised. When a reporter asked how he felt, he replied:"
usa_extra.13.a:"'I felt like the moon, the stars, and all the planets had fallen on me.'"

usa_news.14.t:"United Nations Founded"
usa_news.14.desc:"The United Nations (UN) is an intergovernmental international organization. Its core purpose is to maintain international peace and security and to foster international cooperation. It is the most universal, authoritative, and representative intergovernmental organization, open to all peace-loving states that accept the obligations of the Charter.\n\nThe United Nations provides a mechanism for the world to find solutions to various disputes or problems and to take action on issues of concern to humanity. It plays a vital role in easing international tensions, preventing conflict, stopping ongoing wars, and addressing issues related to the environment, food, human rights, refugees, climate change, and natural disasters."
usa_news.14.a:"May humanity have no more wars"

