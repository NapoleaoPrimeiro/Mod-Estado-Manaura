US_hollywood_films:"Leading International Film Trends"
US_hollywood_films_desc:"In the 1930s, the golden age of Hollywood studios arrived. The Big Eight studios monopolized the film industry. Producers held absolute power, movie stars enjoyed unparalleled glory, and the introduction of sound opened up new possibilities for cinematic expression.\nIn that era, movies were tools for creating daydreams, and cinemas were utopias in reality. And §RHollywood is the greatest dream factory on our planet§!.\n\n\n\n\n\n£GFX_us_hollywood_films\n\n\n\n\n\n\n"
US_USA_xidian_junxiao_desc:"The individual must submit to the collective or larger whole, to the military, to a team.\n\nDiscipline and military bearing are where we are stricter than other schools or even military units.\n\nMost importantly, one must uphold principles at critical moments.\n\nThe spirit of dedication to duty is more important than personal reputation."
USA_new_deal_desc:"In the deepest darkness of this nation, we did not choose to succumb to despair. Through the calm yet hopeful voice on the radio, an unprecedented 'New Deal' swept across the land like a spring breeze. The federal government intervened in the economy with unprecedented intensity, providing jobs for millions of unemployed — building dams, laying roads, planting trees. Although conservative judges on the Supreme Court obstructed it at every turn, questioning its legitimacy, this bold social experiment has already reignited the American spirit. It stabilized the teetering financial system, injected faint vitality into industry, and replanted the seed of 'hope' in the hearts of the people. Though the road ahead remains thorny, the process of recovery has begun, against all odds."
USA_army_desc:0"\n\n\n\n\n£GFX_us_army_text\n\n\n\n\n\n\nUnder the double yoke of the Great Depression and isolationism, this army remains mired in the stagnation of the post-WWI era. Limited in size, outdated in equipment, severely lagging in mechanization and armor, with tactical thinking stuck in the trench warfare age, and plagued by low mobilization and deployment efficiency. Yet it possesses the world's greatest industrial potential, which, once unleashed, will explode into an overwhelming war machine."
USA_army_modifier_tt:0"[GetUsaArmyideaDesc]\n"
USA_tank_out:0"Inadequate Armor R&D Investment"
USA_tank_out2:0"Advanced Armor Technology R&D"
USA_airforce_desc:0"\n\n\n\n\n£GFX_us_air_text\n\n\n\n\n\n\nThe fundamental goal of military air power is to win wars. Strategic bombing using increasingly destructive weapons can either break the enemy's will to resist or physically render them incapable of resistance."
USA_air_desc:0"\n\n\n\n\n£GFX_us_air_text\n\n\n\n\n\n\nThe fundamental goal of military air power is to enable ground forces to seize and hold ground. Everything else is secondary."
USA_navy_desc:0"\n\n\n\n\n£GFX_us_navy_text\n\n\n\n\n\n\nThe United States Navy consists of two separate services: the Navy and the Marine Corps. The Navy can be divided into four branches: surface ship forces, fleet air arm, maritime service forces, and shore-based forces. It is generally organized and operates along two systems: administrative command and operational command."

US_arms_trade:0"Expand Arms Trade"
US_arms_trade_desc:0"Given that our current economic situation has not yet improved, expanding the arms trade is one way to alleviate our economic woes. Although this may be criticized as war profiteering, we must stop at nothing to make the nation wealthy."
US_arms_trade_tt:0"Greatly §Yincreases§! the desire of other countries to §Ypurchase§! our §Yavailable weapons§!"

