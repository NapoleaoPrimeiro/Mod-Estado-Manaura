##事件
usa_communism.1.t:"The Fate of Earl Browder"
usa_communism.1.desc:"As the former General Secretary of the Communist Party USA, Earl Browder proposed forming a broad cross-class alliance with progressive Democrats, moderate labor unions and civil rights groups. He temporarily set aside the radical platform for seizing power, supported New Deal labor laws and unemployment relief, and expanded the mass base of the CPUSA through legal parliamentary campaigns. However, his actions represented excessive compromise with the bourgeoisie and undermined the independent struggle line of the proletariat, even carrying a tendency to abandon the dictatorship of the proletariat.\nNow that he has stepped down from his post, what shall we do with him?"
usa_communism.1.a:"Expel him from the Party!"
usa_communism.1.b:"Assign him a sinecure post"

usa_communism.2.t:"Minority Faction in Power"
usa_communism.2.desc:"Though we have successfully seized leadership, our influence pales in comparison with other factions. This leads to low efficiency within our government and slack civil servants. Worse still, numerous officials remain loyal to opposition parties and disregard our decrees. If things continue like this, our government cannot sustain itself for long!"
usa_communism.2.a:"We must expand our influence!"

usa_communism.3.t:"Our Agriculture Booms!"
usa_communism.3.desc:"Our previous rounds of agricultural reforms have finally borne fruit, triggering an agricultural boom. Markets are filled with all kinds of farm produce, and farmers who once staged protests have returned to their fields.\nMost importantly, the dividends of agricultural development have spread across all sectors, easing our fiscal strain and stabilizing society."
usa_communism.3.a:"Tractors for Everyone!"

usa_communism.4.t:"Current State of the CPUSA"
usa_communism.4.desc:"While the Great Depression opened opportunities for the Communist Party USA, deep internal rifts held the party back. The once united radical left has completely split into three core factions with diametrically opposed lines, each vying for leadership of the labor movement and severely weakening radical forces nationwide.\n\nAs the incumbent General Secretary of the CPUSA, Browder fully implemented the Popular Front general line newly issued by the Communist International in 1935. He advocated abandoning the ultra-sectarianism of the Third Period, softening revolutionary slogans, and fully aligning with liberal supporters of Roosevelt's New Deal.\n\nWilliam Z. Foster, a founding veteran of the CPUSA and long-serving labor movement organizer in charge of the party's union work, had sustained line conflicts with Browder. He endorsed the Popular Front’s overarching anti-fascist direction set by the Comintern, yet firmly opposed Browder’s unprincipled compromises with the New Deal and revisionist tendency to downplay class struggle, insisting on the party’s ideological purity.\n\nAfter being expelled from the CPUSA in 1928 for publicly supporting Trotsky’s Left Opposition, James Cannon founded the independent Trotskyist organization Workers Party of America, completely breaking with the Stalin-led Communist International and emerging as a third leftist force separate from the CPUSA system. Cannon rejected Browder’s Popular Front in its entirety while criticizing Foster’s compromises with Stalinist bureaucracy."
usa_communism.4.a:"How can we grow under such divisions?"

usa_communism.5.t:"Cooperate with the Trotskyists?"
usa_communism.5.desc:"Ever since James Cannon was expelled from the CPUSA in 1928, he founded the Workers Party of America to rival us. Though we hold deep disdain for them, this is a pivotal moment for the American revolution, and we must unite all leftist forces we can. Now James Cannon has resumed propagating their Trotskyist doctrines. Should we court them as allies for the revolution?"
usa_communism.5.a:"Extreme times call for extreme measures!"
usa_communism.5.b:"Absolutely not!"

usa_communism.6.t:"American Constitutional Convention"
usa_communism.6.desc:"We have won! It is time to roll out a series of institutional reforms to build a new United States!"
usa_communism.6.a:"Let us begin!"

usa_communism.7.t:"Attitude Toward the Bourgeoisie"
usa_communism.7.desc:"Although we won the civil war, the existence of the bourgeoisie cannot be eliminated in the short term given America’s national conditions.\nOn handling this issue, Browder argued that the United States was advancing toward progressive capitalism and that long-term cooperation with the bourgeoisie was necessary, urging the Communist Party to abandon its independent political platform.\nFoster stuck to the classic stance that “capitalism’s essence remains unchanged”. He maintained that imperialism and class oppression persist, that the proletarian party must uphold its independence, and rejected all forms of class conciliation."
usa_communism.7.a:"Capitalism has undergone fundamental transformation."
usa_communism.7.b:"Capitalism’s essence remains unchanged!"
usa_communism.7.c:"How can we compromise with the bourgeoisie?"

usa_communism.8.t:"Internationalism and Class Standpoint"
usa_communism.8.desc:"Due to America's unique geographical location,\nour diplomatic orientation has long been a key topic of debate\nBrowder emphasized American Exceptionalism, tending to downplay the shared identity of the international proletariat, emphasizing cooperation with international capital to resist fascism\nFoster, however, stands firm on internationalism, upholding the international solidarity of the proletariat, and strongly opposes sacrificing the Communist Party’s independence and struggle goals merely for U.S.-Soviet cooperation."
usa_communism.8.a:"Fascism is our primary foe!"
usa_communism.8.b:"We must preserve the independence of our party!"
usa_communism.8.c:"Socialism in one country is entirely untenable!"

usa_communism.9.t:"The Party's organizational principles"
usa_communism.9.desc:"There’s still no conclusion on how exactly our party should be organized. Even though we’re a communist party, freedom is just part of the American nature. \nOn this issue, the Foster faction advocates strengthening the party’s traditional organizational discipline to maintain the purity of the 'vanguard.' \nBrowder, on the other hand, leans toward loosening organizational restrictions, trying to transform the party into a broader 'political association' to suit peacetime struggles."
usa_communism.9.a:"During peacetime, we should get along nicely."
usa_communism.9.b:"We can't let people with ulterior motives taint the party's purity!"
usa_communism.9.c:"The vanguard is the pioneer of the revolution!"

usa_communism.10.t:"Congress Adjourned"
usa_communism_10.bailaode:"After a series of votes, despite Foster's reluctance, Browder won with an overwhelming majority. Not only did Browder consolidate his power, but he also set the party's course on several major issues, and the Communist Party USA thus entered a new chapter.\nHowever, opponents scoffed at Browder's propositions, and at the end of the congress, many even walked out... Clearly, Browder still has much to do to fully control the CPUSA."
usa_communism_10.bailaode2:"Something unexpected happened: several factions were evenly matched, and no one could gain the upper hand. Browder therefore urgently announced the exercise of his power as General Secretary of the CPUSA, demanding that other factions set aside their differences and temporarily unite to deal with the domestic situation. Browder promised that each faction would have a place in the government – thus forming a grand coalition to temporarily secure power. However, several staunch opposition factions remained unmoved; they refused to support Browder, and seeing no hope of political participation, they left once again."
usa_communism_10.fusite:"After a series of votes, Foster successfully defeated Browder to become Chairman of the CPUSA. Although Browder still wanted to cling to power, as the voting results were gradually revealed, he could no longer continue.\nFoster publicly refuted Browder's erroneous statements, pointing out that the CPUSA must maintain its purity and independence to win a better future for the United States. He also noted that the US and the Soviet Union have many complementary aspects, and that US-Soviet cooperation is a win-win. Finally, he proposed that foreign leftist forces must be supported to spread communism."
usa_communism_10.kannong:"Unexpectedly, the Trotskyists won the leadership. James Cannon immediately gave a speech, vowing to completely transform the United States into a state of the dictatorship of the proletariat. He also completely rejected Browder's Popular Front and criticized Foster's compromise with Stalin's bureaucracy.\nHowever, the influence of Browder and Foster still remained, and the CPUSA's influence persisted – thus, James Cannon and his Workers Party of the United States have a long and arduous road ahead."
usa_communism.10.a:"Browder continues to exercise power!"
usa_communism.10.b:"Foster defends the purity of the Communist Party!"
usa_communism.10.c:"Cannon makes the Trotskyists great again!"
usa_communism.10.d:"Browder announces emergency takeover of power!"

usa_communism.11.t:"James Cannon expands Trotskyist propaganda activities"
usa_communism.11.desc:"As our propaganda activities are in full swing, James Cannon of the Workers Party of the United States is not to be outdone. He expands Trotskyist propaganda, and it seems he is beginning to rival us.\nUnfortunately, he still adheres to his Trotskyist line."
usa_communism.11.a:"That damn guy!"
usa_communism.11.b:"Let the police deal with him!"

usa_communism.12.t:"Reconcile with the Lovestoneites?"
usa_communism.12.desc:"Jay Lovestone, one of the founders of the CPUSA, was expelled for opposing Stalin. Later he formed the Lovestoneite faction. However, this organization has always expressed willingness to reunify with the CPUSA. Now that our revolution is imminent, should we reconcile with them? After all, as the saying goes, many hands make light work. Every additional bit of strength is welcome now."
usa_communism.12.a:"We need his strength."
usa_communism.12.b:"Traitors to the party are unforgivable."

usa_communism.13.t:"[FROM.GetName] requests weapons"
usa_communism.13.desc:"[FROM.GetNameDef] has asked us for help. In view of an impending great revolution in their country, they request equipment from us to ensure victory."
usa_communism.13.a:"Send them the surplus as aid"
usa_communism.13.b:"We can't provide anything"
usa_communism.14.t:"[FROM.GetName] sends aid"
usa_communism.14.desc:"[FROM.GetNameDefCap] has agreed to ship the equipment we requested. This large shipment will enable us to form several new divisions and provide the specialized equipment needed to form support companies."
usa_communism.14.a:"Great, we'll put it to good use."
usa_communism.15.t:"[FROM.GetName] refuses to provide aid"
usa_communism.15.desc:"Our request for aid from [FROM.GetNameDef] has been refused. [FROM.GetAdjective] officials stated that [FROM.GetNameDef] has no surplus equipment available after its recent reorganization."
usa_communism.15.a:"We must find other sources."

usa_communism.16.t:"[FROM.GetName] sends aid"
usa_communism.16.desc:"[FROM.GetNameDefCap] has provided us with support. This large shipment will enable us to form several new divisions and provide the specialized equipment needed to form support companies."
usa_communism.16.a:"Great, we'll put it to good use."

usa_news.16.t:"William Foster Sets Things Right"
usa_news.16.desc:"The U.S. Constitutional Convention closed today, and by an overwhelming majority, the convention passed a resolution officially rejecting Earl Browder's revisionist theories and policies. Comrade William Z. Foster was re-elected as Chairman of the Communist Party USA.\n\nBrowder's erroneous line had been firmly opposed from the start by numerous Communist Party members led by Foster. At this convention, Foster led the orthodox faction in fierce struggle, and ultimately the revisionist line was voted down.\n\nThe convention resolved to rebuild the proletarian party of the United States – the Communist Party USA – and restore the leading position of Marxism. After the convention, Foster issued a statement calling on all comrades in the party to unite, eliminate the poisonous influence of Browderism, and re-establish the revolutionary line of the working-class party."
usa_news.16.a:"Congratulations, Comrade Foster!"
usa_news.16.b:"The red map expands once again."
usa_news.16.c:"We usher in a new chapter."

usa_news.17.t:"Earl Browder Consolidates Power"
usa_news.17.desc:"The U.S. Constitutional Convention closed today, and incumbent Chairman Earl Browder won a vote of confidence by an overwhelming majority, successfully consolidating his absolute leadership within the party. The convention formally passed a resolution reaffirming Browder's line of "peaceful coexistence between capitalism and socialism" and class collaboration, and declared all opposition statements as "sectarian divisive acts."\n\nFoster and his followers were thoroughly routed at the convention, with most of their proposals rejected. The convention also authorised Browder to purge "left-adventurists" within the party to safeguard the unity of the Communist Party USA."
usa_news.17.a:"He's at least not the worst choice."
usa_news.17.b:"Letting this opportunist consolidate power?"
usa_news.17.c:"We usher in a new chapter."

usa_news.18.t:"James Cannon Wins Power in America"
usa_news.18.desc:"Socialist Workers Party leader James P. Cannon officially entered the White House today, proclaiming a new revolutionary era for the United States. In a wave of general strikes and uprisings by armed worker militias sweeping the nation, Cannon's Trotskyist forces overthrew the old order and seized state power.\n\nIn his inaugural address, Cannon declared that the new regime would thoroughly liquidate the Browderite "class collaboration" line and the Fosterite "remnants of Stalinism," and establish genuine revolutionary Marxist leadership. He also called on the global proletariat to unite and advance "permanent revolution."\n\nObservers noted that as a founder of the Fourth International and a key leader of the American Trotskyist movement, Cannon's rise signified America's complete break from Moscow's orbit and its embrace of the Trotskyist revolutionary path."
usa_news.18.a:"Damn! How could it be him?"
usa_news.18.b:"The worst outcome."
usa_news.18.c:"We usher in a new chapter."

usa_communism.17.t:"Choose Our Flag"
usa_communism.17.desc:"New world, new spirit"
usa_communism.17.a:"Flag No.1"
usa_communism.17.b:"Flag No.2"
usa_communism.17.c:"Flag No.3"
usa_communism.17.d:"Flag No.4"

usa_communism.18.t:"William Foster Announces Resignation"
usa_communism.18.desc:"Due to political differences, several factions within the party have long had major disagreements.\nBefore the revolution succeeded, the factions were able to put the overall situation first and endure for the sake of the revolution; but now, with the revolution accomplished, the differences can no longer be ignored.\nWilliam Foster, a communist who fancies himself an orthodox Marxist, has become utterly disillusioned with our government. He has publicly announced that he will resign."
usa_communism.18.a:"Someone will take over their work."

usa_communism.19.t:"James Cannon Calls on the Opposition"
usa_communism.19.desc:"James Cannon, a hardcore Trotskyist. It's a miracle that he was even able to cooperate with us to launch the revolution. But now, the miracle can no longer continue. After seeing our government's policies, he is deeply disappointed and severely criticises our errors.\nAs before, James Cannon announces his withdrawal from our government and calls on the opposition to leave with him."
usa_communism.19.a:"Trotskyists, get out of here!"

usa_communism.20.t:"Browderite Faction Announces Withdrawal"
usa_communism.20.desc:"Ever since Browder was dealt with, the remaining members of the Browderite faction have been uneasy.\nNow, this unease has gradually spread. As the new government neglects former Browderite members, they have finally chosen to voluntarily withdraw from the government to avoid being dealt with later."
usa_communism.20.a:"Someone will take over their work!"

usa_communism.21.t:"Governing Crisis"
usa_communism.21.desc:"Although we have taken the leadership, intra-party divisions have not improved, and conflicts between factions remain severe.\nIf we want to keep them serving in the government, we must promote them to government advisers to appease those factions.\nBut if we delay action, a governing crisis will be inevitable, and the opposition may collectively walk out in protest."
usa_communism.21.a:"What's the worst that could happen?"

usa_communism.22.t: "Silver Shirts March in Texas"
usa_communism.22.desc: "To resist our policies, the Silver Shirts openly held large-scale demonstrations in Texas.\nThousands of Silver Shirts marched through the streets, severely disrupting local order. Local police have been dispatched to disperse the crowds and prevent the situation from escalating.\nThat night, the Silver Shirts publicly declared that our government was violating the Constitution and that they would liberate the people from tyranny."
usa_communism.22.a: "Damn it..."
