end_the_cold_war:0"Win the Cold War"
end_the_cold_war_desc:0"The competition between the United States and the Soviet Union is no longer merely an ideological struggle, but a crossroads determining the future of humanity. To view the Cold War merely as a conflict of imperialist interests is to underestimate these two great civilizations. America must not only defeat the Soviet Union, but also prove that the universal values of democracy and freedom are correct."

USA_jingji_tingzhi_desc:0"Due to domestic isolationism compounded by the ravages of the Great Depression, our nation's armament production has long since stalled. To restart our production machine once again, both our determination and our funding are indispensable."

USA_jingji_tingzhi2_desc:0"Due to domestic isolationism compounded by the ravages of the Great Depression, our nation's armament production has long since stalled. To restart our production machine once again, both our determination and our funding are indispensable."

USA_great_depression_over_desc:0"The 'Great Depression' that has plagued our nation for years is finally coming to an end. The people are filled with hope for the future, and the country is revitalized once more."

USA_gongpin_jiuye_shijian_weiyuanhui_idea_desc:0"Although the social welfare system contains no discriminatory clauses, due to social conditions and political dynamics, a de facto discriminatory economic structure has formed, profoundly influencing civic consciousness and social culture. This is a problem we have long been committed to solving."

USA_maxier_jihua_desc:0"After the end of World War II, Europe, as the main theater of war, suffered severe destruction. Production collapsed, finances were in ruin, and bourgeois regimes faced crisis. To prevent the spread of communism in Europe, we must intervene."

USA_cold_war_desc:"\n\n\n\n\n£GFX_usa_vs_sov\n\n\n\n\n\n\nThe Cold War was a period of confrontation between two superpowers, encompassing a prolonged struggle in politics, military affairs, economics, and ideology. Both sides maintained strategic balance through the development of nuclear weapons and other advanced armaments, while engaging in extensive competition across various fields. Ironically, this was also a period of the fastest human development."

USA_home_of_free_desc:"\n\n\n\n£GFX_usa_home_of_free_text\n\n\n\n\n\nOn this land, freedom is not merely an ideal inscribed in the Declaration of Independence—it is the very air each citizen breathes, the right to walk unshackled, and the dignity to strive. From the shot heard round the world at Lexington to the words spoken at Gettysburg, from the charge up San Juan Hill to the beaches of Normandy, generation after generation of Americans have defended this freedom with courage. Here, we ask not of one’s origin, but of their dreams; we fear not challenges, only retreat. It is this faith in freedom and the bravery to face adversity that have forged the soul of the United States of America. As long as the torch of liberty is held high, this homeland will forever be a haven for the brave."

USA_hot_war_desc:"\n\n\n\n\n£GFX_usa_vs_sov\n\n\n\n\n\n\nThe conflict between these two ideologies could ultimately not be reconciled; they would fight each other until one was destroyed."

USA_roosevelt_yichan_desc:"Some call me a dictatorial tyrant, some call me a socialist. But no matter what, the wind of history will eventually blow the rubbish away from my grave."

