USA_zhunbei_37_xuanju_desc:"As the shadow of the Great Depression has not yet fully lifted, undercurrents of populism and isolationism are surging. We must pave the way for the upcoming presidential election, deciding whether to continue the path of the 'New Deal' or to choose another course. The outcome of this election will profoundly shape how the nation addresses domestic and international challenges over the next four years."

USA_zuigao_fayuan_kuorong_desc:"Our 'New Deal' legislation has repeatedly been struck down by conservative justices on the Supreme Court, gravely hindering the pace of national recovery. To restore government functionality, we plan to introduce a bill to Congress to increase the number of justices on the Supreme Court. This is not an attack on judicial independence, but a necessary correction to the democratic process, ensuring the people's voice is heard in the highest court."

USA_gongye_fuxing_choubei_desc:"Centered around the National Industrial Recovery Act, we call upon enterprises across America to jointly establish fair competition codes, abolish child labor, and set minimum wages and maximum working hours. Through the 'Blue Eagle' emblem, we will unite industry, labor, and government to stabilize production, stimulate consumption, and lead American industry from depression to recovery."

USA_jianxiao_xinzheng_guimo_desc:"Although the 'New Deal' alleviated the crisis, its massive government spending and intervention in the market have sparked growing concerns. We must return to fiscal conservatism, cut ineffective relief and public works programs, streamline government agencies, and unleash the vitality of private enterprise, allowing the market to once again become the main driver of economic growth."

USA_quanguo_laogong_guanxifa_desc:"This law will explicitly grant workers the right to organize unions and engage in collective bargaining, and will establish the National Labor Relations Board to oversee elections and remedy unfair labor practices. By ensuring equal footing in dialogue between labor and management, we can reduce industrial conflict and lay a solid legal foundation for social stability and industrial peace."

USA_chongqi_caizheng_ciji_desc:"Although we previously attempted to cut spending, the current economic recovery remains fragile. We have decided to reinstate an active fiscal policy, increasing government expenditure and injecting funds into key sectors to stimulate demand, create jobs, and ensure the economy does not relapse into recession due to premature tightening."

USA_liangyang_diqu_touzi_desc:"From the Atlantic coast to the Pacific coast, our coastal cities are the bridgeheads of trade and innovation. We will increase investment in ports, infrastructure, and emerging industries on both shores, fully leveraging their advantages in connecting to global markets, so that the two wings drive the overall economic takeoff of the nation."

USA_zhongbu_touzi_desc:"The vast central region is the foundation of our agriculture and manufacturing. We will focus investment on transportation networks, energy facilities, and agricultural modernization projects in the central area, narrowing regional development gaps, revitalizing the 'breadbasket' and 'factories', and consolidating the heartland of the United States."

USA_nanfang_jianshe_desc:"The South possesses abundant resources and immense development potential. Through infrastructure construction, industrialization, and educational investment, we will drive the transformation of the Southern economy, raise employment levels, and truly integrate this region into the nation's overall prosperity."

USA_minsheng_jianshe_desc:"The well-being of the people is the cornerstone of the nation. We will expand public health services, improve housing conditions, and enhance the social security system, so that every citizen can feel the protection of the state in times of crisis. Livelihood construction is both a moral duty and a prerequisite for long-term social stability."

USA_junshi_jianshe_desc:"In a turbulent international situation, a strong national defense is the most reliable guarantee of peace. We will allocate funds for military modernization, equipment updates, and fortress construction, enhancing the joint combat capability of all services, ensuring the United States stands firm against any storm."

USA_guojia_anquan_huiyi_desc:"Convene senior military and political officials for the annual National Security Conference to comprehensively assess the national security situation. We will integrate intelligence, adjust strategic deployments, and clarify priorities for armament development, ensuring that national military policy remains aligned with external threats and that we are fully prepared for possible future conflicts."

USA_zhunbei_40_xuanju_desc:"With war raging in Europe and the world order in dramatic upheaval, the upcoming presidential election concerns not only domestic policy but will also determine America's role on the international stage. Parties must intensify efforts to consolidate their platforms, nominate leaders capable of steering the nation through the crisis, and articulate their foreign policy and defense strategies to the people."

USA_roosvelt_3rd_term_desc:"Franklin D. Roosevelt broke tradition and successfully won re-election. The people chose to trust his leadership experience and 'New Deal' legacy, expecting him to steady the helm amidst the international storm. Roosevelt will continue interventionist policies, increase aid to Britain, and prepare for possible war mobilization."

USA_duwei_term_desc:"Republican candidate Wendell Willkie won the election as a dark horse. Although he opposed isolationism in international affairs, he emphasized maintaining peace through commerce and trade. The Willkie administration will reduce government intervention at home and adopt a policy of 'all aid short of war' abroad, carefully balancing various forces."

USA_landeng_2nd_term_desc:"Alf Landon defeated Roosevelt and successfully won re-election. This Kansas governor, known for fiscal conservatism, will continue to scale back the 'New Deal' and maintain a strict neutralist stance. His re-election means the United States is unlikely to become embroiled in overseas conflicts in the short term, while the domestic economy will move towards greater liberalization."

USA_gongpin_jiuye_shijian_weiyuanhui_desc:"We establish this committee to prohibit racial discrimination in the defense industry, ensuring that all citizens, regardless of color, have fair access to employment opportunities. This is necessary to enhance wartime production efficiency, and it represents an important step toward our national ideals, laying the groundwork for broader social reform after the war."

USA_jungong_zhuanchan_desc:"With rising international tensions, we will guide civilian industries to shift to military production. Automobile factories will begin assembling tanks, shipyards will focus on building warships, and aircraft production lines will operate day and night. This transformation into an 'arsenal of democracy' will greatly enhance national defense capabilities while finally ending the unemployment of the Great Depression."

USA_jinzhi_zhongzu_qishi_desc:"In the workplace, ability and contribution should be the only criteria. We will use executive orders and legislation to explicitly ban employment discrimination based on race, color, or creed. This is not only a defense of basic human rights but will also unleash the potential of all Americans, uniting the broadest possible strength for the nation."

USA_qianghua_laogong_quanyi_desc:"Workers are the backbone of national development. We will further strengthen labor rights, including expanding collective bargaining coverage, raising minimum wage standards, and enhancing occupational safety. Strong unions combined with responsible management are the foundation for building lasting and harmonious labor relations and providing a stable foundation for economic prosperity."

USA_baofashi_zengzhang_desc:"Driven by both defense orders and expanding domestic demand, the American economy is experiencing unprecedented explosive growth. Factories are running at full capacity, employment is soaring, and technological innovation is emerging in waves. We must seize this historic opportunity to convert wartime prosperity into lasting economic vitality."

USA_qiangda_gonghui_desc:"We will promote an advanced production model featuring joint decision-making between unions and management. Through labor-management cooperation committees, profit-sharing plans, and technical training programs, we will significantly boost labor productivity. This model not only allows workers to share in the fruits of development but also gives enterprises a competitive advantage in efficiency."

USA_zhuran_jingji_desc:"Military spending is acting as an accelerant, bringing the national economy to a boil. We should use defense contracts as the core engine to drive expansion across entire industrial chains—steel, machinery, chemicals, electronics, and beyond. This is necessary not only to win the war but also to strategically shape a powerful post-war industrial system."

USA_tuidong_shehui_baozhang_desc:"We will expand the coverage of the Social Security Act, increasing old-age pensions, unemployment insurance, and assistance to vulnerable groups. A robust social security system serves as a 'safety net' for citizens against risks and a key pillar for maintaining national cohesion in turbulent times."

USA_daxiyang_xianzhang_desc:"Together with the United Kingdom, we issue the Atlantic Charter, declaring to the world our vision for the post-war world: self-determination, economic cooperation, freedom of trade, and freedom from fear. This document is not only a symbol of the wartime alliance but will also lay the foundational principles for a new international order after the war."

USA_pingheng_yusuan_desc:"Years of deficit spending have left the national debt dangerously high. We must make the hard decision to gradually restore budget balance by cutting non-essential expenditures, improving tax efficiency, and streamlining administrative agencies. Sound finances are the cornerstone of the dollar's credibility and a prerequisite for the nation's long-term security and prosperity."

USA_jiaoting_gonggong_gongcheng_desc:"Many public works have fulfilled their historical mission, and continued investment would only waste resources. We have decided to halt those projects with low effectiveness or those already completed, reallocating fiscal resources to more urgent areas such as national defense and direct relief, ensuring every dollar is used where it is most needed."

USA_zhengfu_jiuji_desc:"For the most destitute groups, the government must take responsibility for direct relief. We will establish special relief funds to provide basic living guarantees for the unemployed, impoverished families, and dependent elderly. This is a simple moral obligation and a last line of defense against social unrest."

USA_xianzhi_gonghui_desc:"The excessive growth of some unions has begun to threaten economic order. We will pass legislation to restrict unions' strike rights, compulsory dues, and political activities, preventing them from abusing their power to hinder production. The healthy functioning of a free market requires appropriate constraints on both labor and management."

USA_jianshui_desc:"We believe tax cuts are the most effective economic stimulus. By reducing personal and corporate income taxes, we leave more money in the hands of the people and give businesses more capital to expand production and hiring. Lower tax burdens will ignite entrepreneurial spirit and drive a new wave of growth."

USA_guli_touzi_desc:"Through tax reductions, accelerated depreciation, and investment subsidies, we strongly encourage private capital to invest in emerging industries and key technologies. The government will work with entrepreneurs to create an institutional environment conducive to long-term investment, injecting continuous vitality into the economy."

USA_youhuoli_shichang_desc:"A dynamic market requires fair rules, low barriers, and ample competition. We will promote antitrust enforcement, dismantle local protectionism, and lower entry barriers, allowing the mechanism of survival of the fittest to fully play its role and unleashing the inherent power of the market economy."

USA_yanchi_zhengbing_desc:"The current international situation does not yet compel us to resort to conscription. We have decided to postpone the implementation of compulsory military service, continuing to rely on volunteers and the National Guard to maintain national defense. This will help preserve the human resources needed for industrial production while respecting public concerns about compulsory service."

USA_qianghua_dongyuan_desc:"With the clouds of war gathering, we must construct a nationwide mobilization system in advance. Every aspect—from manpower registration and industrial conversion to material stockpiling—requires meticulous planning. Through legislation and executive measures, we will establish an efficient mobilization mechanism to ensure that, if needed, the entire nation can swiftly shift onto a wartime footing."

USA_zhunbei_44_xuanju_desc:"An election amidst the flames of war is the severest test of democracy. We will ensure the election proceeds smoothly without undermining the war effort. Parties must debate major issues such as wartime leadership, post-war reconstruction, and the international order, letting the people decide who will steer the nation for the next four years."

USA_roosvelt_4th_term_desc:"Franklin D. Roosevelt won the election for a fourth time. The people still trusted this wartime leader to guide the nation through the final arduous phase of the war. Roosevelt will focus on post-war arrangements and the creation of the United Nations, though his health problems foreshadow future concerns."

USA_duwei_2nd_term_desc:"New York Governor Thomas E. Dewey defeated the Democratic candidate to become the new president. Dewey, young and energetic, promised to manage the war efficiently and facilitate a smooth transition to peacetime. His victory signals that post-war policy will lean more toward internationalism and free enterprise."

USA_macarthur_term_desc:"General Douglas MacArthur won the presidency as a war hero. The people longed for a strong leader to end the war and establish post-war order. The MacArthur administration will have a strong military character, emphasizing discipline at home and a tough stance abroad, profoundly changing America's political style."

USA_weierji_2nd_term_desc:"Wendell Willkie successfully won re-election. His vision combining internationalism with a free economy won voter approval. The Willkie administration will continue to promote the 'One World' vision, deepen cooperation with allies, while maintaining relatively moderate interventionist policies at home."

USA_zhiwo_zuiwo_qiwei_chunqiu_desc:"How will history judge us? There may be praise or blame. But we firmly believe that everything we do today—whether wartime decisions or peacetime construction—stems from a sense of responsibility to the nation and its people. Let future generations judge our merits and faults. We seek only to be worthy of our time."

USA_mac_fuck_jap_desc:"We have decided to appoint General MacArthur as Supreme Commander for the Allied Powers, responsible for the occupation and transformation of Japan. With his extraordinary prestige and executive ability, he will demilitarize Japan, promote democratic reforms, and oversee post-war reconstruction. This is a monumental mission that will reshape the future of the Pacific region."

USA_anti_com_desc:"Faced with the expansion of communism, we must take resolute countermeasures. From domestic loyalty investigations to an overseas containment strategy, we will establish a comprehensive anti-communist policy system to defend the free system and the capitalist order. This is a long-term ideological contest."

USA_dulumen_term_desc:"Harry S. Truman, this plain-speaking politician from Missouri, now shoulders the weight of the presidency. He will continue the basic policies of his predecessor but will address domestic and international challenges in a more straightforward and pragmatic manner. Truman's term will be a critical period for laying the foundations of the post-war order."

USA_maxieer_plan_desc:"The ruins of the European economy are a breeding ground for communism. We propose a large-scale economic aid program to help European nations rebuild their industries, restore trade, and stabilize their societies. This is motivated not only by humanitarian concerns but also by the need to cultivate stable allies and establish a solid economic bulwark for the free world."

USA_united_nations_desc:"At the San Francisco Conference, we, together with our allies, signed the United Nations Charter. This new international organization aims to maintain international peace and security and promote international cooperation. We will fully support the United Nations and hope it becomes a permanent mechanism to prevent the tragedy of war from recurring."

USA_help_the_kid_desc:"In the face of great crises, former adversaries have also chosen an unprecedented alliance. Whether compromises between parties, joint actions across industries, or transcending differences on the international stage, this unity will enable us to overcome all challenges. Unity is strength."

USA_peace_love_and_world_desc:"The post-war generation calls for peace, love, and an embrace of the world. We will promote cultural exchange, educational exchange, and humanitarian aid, replacing suspicion with goodwill and confrontation with cooperation. This is the spiritual foundation for building lasting peace and the proper posture for the United States as a member of the international community."

USA_quanqiuhua_desc:"Technological progress and the expansion of trade are binding the world together more closely than ever before. We will lead the establishment of an open international trading system, promoting the free flow of capital and goods. Embracing globalization means America's prosperity will be closely linked to that of the world, and we are willing to be at the forefront of this tide."

USA_guoji_kateer_desc:"To protect key industries and strategic resources, we will establish state-supported industrial cartels in certain sectors. By coordinating production, unifying pricing, and sharing technology, we aim to enhance international competitiveness while safeguarding national security interests from fluctuations in the international market."

USA_yuanzhu_mengyou_desc:"In the international system, we have a responsibility to aid those weaker allies who share our values. Through military assistance, economic support, and technology transfer, we will enhance their self-defense capabilities and self-sustaining capacity. These partners will form important pillars of our global strategy."

USA_final_war_desc:"We are heading toward a decisive conflict—perhaps 'the final war.' We will devote the full strength of the nation to ensure the complete defeat of the enemy and thereafter establish a permanent peace order. For this, any sacrifice will be worthwhile."

USA_no_more_war_desc:"War has brought too much pain. We choose to extend a hand of reconciliation, turning swords into plowshares with our former enemies. Through dialogue, economic cooperation, and institutionalized confidence-building measures, we are committed to making 'no more war' a reality rather than an ideal."

USA_cold_war_focus_desc:"We have entered a comprehensive Cold War with the opposing camp. This is not a hot war, but an all-out contest of ideology, economy, technology, and influence. We will establish a long-term strategy to gain the upper hand in this protracted struggle through containment, alliances, and the export of values."

USA_hot_war_focus_desc:"Diplomacy and deterrence have failed; we must prepare for large-scale hot war. The military is to be fully reorganized, industry placed on a wartime footing, and the system of total mobilization activated. If war breaks out, we will commit the nation's full strength to ensure final victory."

USA_maixiang_fuli_guojia_desc:"We are completing a historic transformation: from emergency relief to an institutionalized welfare state. Through establishing universal healthcare, expanding investment in education, and improving the pension system, we aim to ensure every citizen enjoys a dignified life. This is not only an expression of social justice but also a fundamental responsibility of a modern state."

USA_3rd_indus_revolution_desc:"Computers, automation, and nuclear energy are leading us into the Third Industrial Revolution. We will increase investment in research and education, encourage disruptive technological innovation, and seize the commanding heights of the new technological revolution. This revolution will reshape production methods, social structures, and national competitiveness."

USA_taikong_shidai_desc:"Looking upward, space has become humanity's new frontier. We will integrate military, scientific, and civilian space efforts to launch an ambitious space program. From satellites to manned spaceflight, from lunar landings to deep space exploration, the space age has begun, and America must be at the forefront."


