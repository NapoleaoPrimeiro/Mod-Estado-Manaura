USA_landeng_term_tt:0"Congratulations to §YAlfred 'Alf' Mossman Landon§! on winning the §Ypresidential§! election!"

USA_weierji_term_tt:0"Congratulations to §YWendell Willkie§! on winning the §Ypresidential§! election!"

USA_duwei_term_tt:0"Congratulations to §YThomas Dewey§! on winning the §Ypresidential§! election!"

USA_macarthur_term_tt:0"Congratulations to §YDouglas MacArthur§! on winning the §Ypresidential§! election!"

USA_dulumen_term_tt:0"Congratulations to §YHarry S. Truman§! on beginning his §Ypresidential§! term!"

USA_release_the_monster_flag:0"The issue of §YDefense Contractors§! was not immediately passed at the §YNational Security Conference§!"

USA_taikong_shidai_ttt:0"Humanity is ready to step into the §bSpace Age§!"

USA_taikong_shidai_tt:0"§R...They gazed for a long time. From the first human who walked upright, from the first one who looked up at night, the moon reflected in their eyes. It was an ancient nostalgia, a longing for the pull of tides, a dream of walking in silence...\n§!"

USA_air_war_plans_division_TT:0"If §YHenry Arnold§!'s proposal at the §YNational Security Conference§! is passed, the effects of the §YAir Force§! branch national focuses will be enhanced!"

USA_zuigao_fayuan_kuorong_tt:0"If the §YCourt Packing§! plan succeeds, our subsequent reform plans will become much easier!"

USA_peace_love_and_world_tt:0"§RThis world is not perfect. Yet precisely because it is imperfect, it needs love to mend it, peace to soothe it, and us—each and every one of us—to be the light in those cracks.\n§!"

