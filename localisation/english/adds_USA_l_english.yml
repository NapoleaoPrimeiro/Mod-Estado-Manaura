USA_focus130_desc:"As the world succumbs to the shadow of tyranny, we must become the light that pierces the darkness. Let every resisting will, no matter how faint, see the direction of hope. This is not just strategy—it is the very meaning of our ex
USA_focus131_desc:"The ocean will no longer be a barrier but our line of defense! We shall forge a wall of steel and fire, an impenetrable curtain of death that no enemy can breach. Let their fleets shatter against our bulwarks, let the sea become an iron curtain tomb for their ambitions."  
USA_focus132_desc:"Conscript every soul capable of bearing arms, mobilize the last production line of the last factory. The price of freedom must be measured in lives. We no longer have the luxury to count the cost, for the cost of failure is civilization itself. Now, sacrifice is not a choice—it is an honor."  
USA_focus133_desc:"No surrender, no negotiation. We will fight on the beaches, fight in the streets, fight on every hill. Even if the capital lies in ruins, our will shall never yield. As long as one American still draws breath, the flag of freedom will not fall. This is our final vow."  

