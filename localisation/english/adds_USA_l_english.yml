HAW_wangguo_shiwu:"Kingdom of Hawaii Affairs"
HAW_wangguo_shiwu_desc:"After decades of decline, the Kingdom of Hawaii has finally been restored. But there is little time to celebrate—Japan and the United States eye us constantly. Japan seeks to control us as a strategic pivot in the Pacific, projecting naval power toward the American mainland. The United States wants to return and reclaim Hawaii. What we can do is maneuver between the two, using our value to extract more resources for our own development. Only when Hawaii grows strong can it avoid being conquered again."
