call_back_hawaii:"Demand Hawaii's Return"

haw_extra.16.t:"[From.GetNameDefCap] Demands Submission"
haw_extra.16.desc:"The ambassador of [From.GetNameDefCap] has just contacted us. Decades ago, Hawaii worked closely with the United States and forged a strong, unbreakable relationship.\nAlthough Hawaii left the Union during the recent American Civil War, the United States has respected and understood this. Now that the Union is reunified, Hawaii should rejoin it.\nThe United States promises us a high degree of autonomy. But if we refuse, America declares it will force our return 'in a way we cannot refuse.'"
haw_extra.16.a:"We cannot resist the United States"
haw_extra.16.b:"1898 Will Not Repeat!"

haw_extra.17.t:"[From.GetNameDefCap] Agrees"
haw_extra.17.desc:"[From.GetNameDefCap] has just replied. They agree to rejoin us as an autonomous state."
haw_extra.17.a:"They know what's good for them"

haw_extra.18.t:"[From.GetNameDefCap] Refused"
haw_extra.18.desc:"[From.GetNameDefCap] has just righteously refused our demand. They point out that the United States forcibly seized Hawaii in 1898, a blatant act of aggression against Hawaii. Hawaii has never settled accounts for this. Now that they have won their freedom, we should not harbor delusions of annexing Hawaii again."
haw_extra.18.a:"Courting death"


