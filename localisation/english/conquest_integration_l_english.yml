l_english:
 conquest_integration.1.t:0 "Spoils of Conquest"
 conquest_integration.1.desc:0 "With [event_target:ci_conquered_country.GetName] now under our control, their officer corps, commanders, and political figures stand idle. We may bring them into our service - their experience need not be wasted."
 conquest_integration.1.advisors:0 "Integrate their advisors"
 conquest_integration.1.commanders:0 "Integrate their commanders"
 conquest_integration.1.scientists:0 "Integrate their scientists"
 conquest_integration.1.industry:0 "Integrate their war industry"
 conquest_integration.1.all:0 "Integrate all of them"
 conquest_integration.1.decline:0 "We have no use for them"
 ci_integrated_industry:0 "Integrated War Industry"
 ci_integrated_industry_desc:0 "The absorbed factories, design bureaus and skilled workers of the nations we have conquered. Each integrated industry strengthens our war economy."
 conquest_integration.2.t:0 "The War Trials"
 conquest_integration.2.desc:0 "The officers and advisors we sought to recruit must first answer for their conduct. Tribunals, purges and old grudges take their toll - only a handful are cleared to enter our service. The rest will not be joining us."
 conquest_integration.2.a:0 "So be it"
 conquest_integration.5.t:0 "Seize Their Fleet"
 conquest_integration.5.desc:0 "[event_target:ci_capitulated_navy_country.GetName] has capitulated, and their warships now lie at anchor with no flag to serve. We could fold their fleet into our own navy. (Carriers cannot be seized.)"
 conquest_integration.5.a:0 "Seize their fleet"
 conquest_integration.5.b:0 "Let it rust"
 conquest_integration.6.t:0 "Captured Blueprints"
 conquest_integration.6.desc:0 "The design bureaus of [event_target:ci_defeated_licensor.GetName] have fallen into our hands, and their tank, aircraft and warship blueprints with them. We can license their designs for production in our own factories."
 conquest_integration.6.a:0 "Seize their production licenses"
 conquest_integration.6.b:0 "Our own designs will suffice"
 RULE_GROUP_CI:0 "Conquest Integration"
 RULE_CI_WAR_TRIALS:0 "War Trials Survival Rate"
 RULE_CI_WT_25:0 "Harsh (25%)"
 RULE_CI_WT_25_DESC:0 "About a quarter of integrated advisors and generals survive the tribunals. The default."
 RULE_CI_WT_10:0 "Brutal (10%)"
 RULE_CI_WT_10_DESC:0 "Only a tenth survive. Most of the enemy's officers and advisors are purged."
 RULE_CI_WT_50:0 "Lenient (50%)"
 RULE_CI_WT_50_DESC:0 "Half of the integrated advisors and generals are cleared to serve."
 RULE_CI_WT_75:0 "Generous (75%)"
 RULE_CI_WT_75_DESC:0 "Most of the enemy's officers and advisors join us. Very little culling."
 RULE_CI_AI:0 "AI Conquest Integration"
 RULE_CI_AI_OFF:0 "Player Only"
 RULE_CI_AI_OFF_DESC:0 "Only you may integrate the spoils of conquest. AI nations ignore this mod's mechanics. The default."
 RULE_CI_AI_ON:0 "Player and AI"
 RULE_CI_AI_ON_DESC:0 "AI nations also integrate conquered advisors, commanders and industry, and seize enemy fleets on capitulation."
 RULE_CI_LICENSE:0 "Captured Production Licenses"
 RULE_CI_LIC_FREE:0 "Free"
 RULE_CI_LIC_FREE_DESC:0 "Licenses seized from defeated nations carry no production penalty - build their tanks, planes and ships as if they were your own. The spoils of war. The default."
 RULE_CI_LIC_HALF:0 "Discounted (50%)"
 RULE_CI_LIC_HALF_DESC:0 "Seized licenses carry half the usual production penalty."
 RULE_CI_LIC_FULL:0 "Full Cost"
 RULE_CI_LIC_FULL_DESC:0 "Seized licenses carry the same production penalty as a normally negotiated license."
 RULE_CI_LIC_OFF:0 "Disabled"
 RULE_CI_LIC_OFF_DESC:0 "Defeated nations grant no production licenses."
