l_english:
# DEMOCRATIC & SHARED
  new_usa_pacify_mexican_turmoil.1.t: "[USA.GetNameDefCap] demands we become their protectorate"
  new_usa_pacify_mexican_turmoil.1.desc: "President [USA.GetLeader] has summoned our ambassador to hand over a set of demands from the US government. Amongst them are special consultation rights for the [USA.GetAdjective] Ambassador. In effect, these rights would give the [USA.GetAdjective] government a veto on any decision we make.\n\nIn the event that we refuse, the note goes on, the [USA.GetAdjective] government would be forced to \"enact such measures as it sees necessary to guarantee the national security\". "
  new_usa_pacify_mexican_turmoil.1.a: "We must accept the unacceptable to avoid bloodshed."
  new_usa_pacify_mexican_turmoil.1.b: "Never!"
  new_usa_pacify_mexican_turmoil.2.t: "[MEX.GetLeader] accepts"
  new_usa_pacify_mexican_turmoil.2.desc: "Realizing the hopelessness of their position, the government of [MEX.GetLeader] have accepted our proposal and agreed to consult us before any major policy decision."
  new_usa_pacify_mexican_turmoil.2.a: "Destiny manifest."
  new_usa_pacify_mexican_turmoil.3.t: "[MEX.GetLeader] refuses"
  new_usa_pacify_mexican_turmoil.3.desc: "In a long-winded speech, recalling the heroics of past generations of Mexicans in the face of \"blatant American aggression\", [MEX.GetLeader] has refused to even consider our requests and told our ambassador that the Mexican people would never bow to foreign invaders."
  new_usa_pacify_mexican_turmoil.3.a: "It matters not- destiny will strive forward!"
  new_usa_pacify_mexican_turmoil.3.b: "War is not currently in our best interest."
  
  new_usa_preempt_a_southern_invasion.1.t: "[USA.GetNameDefCap] demands Control over Foreign Policy"
  new_usa_preempt_a_southern_invasion.1.desc: "The [USA.GetAdjective] ambassador has handed over a note from President [USA.GetLeader] informing us that his government expects us to consult them in any future foreign policy decisions, \"in the interest of the continued peace and goodwill between our nations\"."
  new_usa_preempt_a_southern_invasion.1.a: "We have no choice."
  new_usa_preempt_a_southern_invasion.1.b: "We'll stand firm!"
  new_usa_preempt_a_southern_invasion.2.t: "[From.GetNameDefCap] accepts subjugation"
  new_usa_preempt_a_southern_invasion.2.desc: "The government of [From.GetLeader] has agreed to our requests and will allow our ambassador a veto on any major policy decision they make."
  new_usa_preempt_a_southern_invasion.2.a: "A wise choice."
  new_usa_preempt_a_southern_invasion.3.t: "[From.GetNameDefCap] Refuses"
  new_usa_preempt_a_southern_invasion.3.desc: "[From.GetLeader] has reacted with deep consternation to our diplomatic note. In his answer, he declared that [From.GetNameDef] has a long and proud history of independence and sovereignty and would never permit a foreign power to enforce its will on them.\n\nHe further implored President [USA.GetLeader] to consider the ramifications of a war on this issue, which would surely see [USA.GetNameDef] labeled the largest threat to peace and would have unimaginable consequences."
  new_usa_preempt_a_southern_invasion.3.a: "Brave words from someone so weak."
  new_usa_preempt_a_southern_invasion.3.b: "Perhaps he is right."
  
  new_usa_central_american_bastion.1.t: "[USA.GetNameDefCap] demands necessary Subjugation"
  new_usa_central_american_bastion.1.desc: "The [USA.GetAdjective] ambassador has handed over a note from President [USA.GetLeader] stating that we are to immediately cede control over our foreign policy to [USA.GetNameDefCap] or face a necessary attack from [USA.GetAdjective] forces."
  new_usa_central_american_bastion.1.a: "We have no choice."
  new_usa_central_american_bastion.1.b: "We will stand firm."
  new_usa_central_american_bastion.2.t: "[From.GetNameDefCap] accepts subjugation"
  new_usa_central_american_bastion.2.desc: "The government of [From.GetLeader] has agreed to our requests and will subject their government to us."
  new_usa_central_american_bastion.2.a: "A wise choice."
  new_usa_central_american_bastion.3.t: "[From.GetNameDefCap] Refuses"
  new_usa_central_american_bastion.3.desc: "[From.GetLeader] has reacted with deep consternation to our diplomatic note. In his answer, he declared that [From.GetNameDef] has a long and proud history of independence and sovereignty and would never permit a foreign power to enforce its will on them.\n\nHe further implored President [USA.GetLeader] to consider the ramifications of a war on this issue, which would surely see [USA.GetNameDef] labeled the largest threat to peace and would have unimaginable consequences."
  new_usa_central_american_bastion.3.a: "Brave words from someone so weak."
  new_usa_central_american_bastion.3.b: "Perhaps we went too far."
  
  new_usa_dominate_south_america.1.t: "[USA.GetNameDefCap] demands necessary Subjugation"
  new_usa_dominate_south_america.1.desc: "The [USA.GetAdjective] ambassador has handed over a note from President [USA.GetLeader] stating that we are to immediately cede control over our foreign policy to [USA.GetNameDefCap] or face a necessary attack from [USA.GetAdjective] forces."
  new_usa_dominate_south_america.1.a: "We have no choice."
  new_usa_dominate_south_america.1.b: "We will stand firm."
  new_usa_dominate_south_america.2.t: "[From.GetNameDefCap] accepts subjugation"
  new_usa_dominate_south_america.2.desc: "The government of [From.GetLeader] has agreed to our requests and will subject their government to us."
  new_usa_dominate_south_america.2.a: "A wise choice."
  new_usa_dominate_south_america.3.t: "[From.GetNameDefCap] Refuses"
  new_usa_dominate_south_america.3.desc: "[From.GetLeader] has reacted with deep consternation to our diplomatic note. In his answer, he declared that [From.GetNameDef] has a long and proud history of independence and sovereignty and would never permit a foreign power to enforce its will on them.\n\nHe further implored President [USA.GetLeader] to consider the ramifications of a war on this issue, which would surely see [USA.GetNameDef] labeled the largest threat to peace and would have unimaginable consequences."
  new_usa_dominate_south_america.3.a: "Brave words from someone so weak."
  new_usa_dominate_south_america.3.b: "Perhaps we went too far."
  
  new_usa_bribe_the_canadian_government.1.t: "The [USA.GetAdjective] Government Offers Payments for the Corridor"
  new_usa_bribe_the_canadian_government.1.desc: "[USA.GetNameDefCap] has sent a message saying that they are willing to funnel a dramatic portion of their economic output into our country in exchange for ceding the Canadian Corridor separating the mainland US from Alaska. If we choose to accept, we would gain a very large amount of resources."
  new_usa_bribe_the_canadian_government.1.a: "It is a fair offer"
  new_usa_bribe_the_canadian_government.1.b: "Tempting, but we won't trade away our land"
  new_usa_bribe_the_canadian_government.2.t: "[FROM.GetNameDefCap] Agrees"
  new_usa_bribe_the_canadian_government.2.desc: "The [FROM.GetAdjective] government has agreed to cede their control over the gap."
  new_usa_bribe_the_canadian_government.2.a: "An excellent trade indeed!"
  new_usa_bribe_the_canadian_government.3.t: "[FROM.GetNameDefCap] Refuses to Take the Bribe"
  new_usa_bribe_the_canadian_government.3.desc: "The [FROM.GetAdjective] government has turned down our generous offer."
  new_usa_bribe_the_canadian_government.3.a: "It was worth a shot"
  
  new_usa_secure_corridor.1.t: "[USA.GetNameDefCap] Demands Control over the Corridor"
  new_usa_secure_corridor.1.desc: "[USA.GetNameDefCap] has sent a very strongly-worded message through secure channels that we are to hand over all territory within the Canadian Corridor immediately. The message follows that, if control is not relinquished, the [USA.GetAdjective] government will be forced to resort to more drastic measures to ensure its own security."
  new_usa_secure_corridor.1.a: "It isn't worth the trouble. We'll comply."
  new_usa_secure_corridor.1.b: "We won't relinquish our land without a fight!"
  new_usa_secure_corridor.2.t: "[FROM.GetNameDefCap] Agrees to Hand Over the Corridor"
  new_usa_secure_corridor.2.desc: "Soon after receiving our message, the [FROM.GetAdjective] government sent back their prompt response, highlighting a desire for continuing peace between our two nations. Effective immediately, their control over the Corridor would pass to us, in exchange for guarantees for no further conflict."
  new_usa_secure_corridor.2.a: "Simple, easy, and no bloodshed."
  new_usa_secure_corridor.3.t: "[FROM.GetNameDefCap] Refuses to Hand Over Control of the Corridor"
  new_usa_secure_corridor.3.desc: "The [FROM.GetAdjective] government has outright rejected our posturing and has made it clear that any attempt to violate their territory sovereignty will be met with force. Their reply urged a desire not to create more conflict, highlighting a want to maintain peaceful relations between our countries, and they hope that this incident will merely pass by without further strife."
  new_usa_secure_corridor.3.a: "We'll show them strife."
  new_usa_secure_corridor.3.b: "We went too far."
  
  new_usa_bargain_canada.1.t: "[USA.GetNameDefCap] Offers to Purchase [CAN.GetNameDefCap]"
  new_usa_bargain_canada.1.desc: "[USA.GetAdjective] envoys have relayed a message from the President that [USA.GetNameDefCap] is seriously considering making an offer to purchase [CAN.GetNameDefCap] and is willing to pay quite well for it. Should the [FROM.GetAdjective] government go through with the deal, the payout would be well worth the exchange."
  new_usa_bargain_canada.1.a: "Approve the trade"
  new_usa_bargain_canada.1.b: "Kindly turn down the offer"
  new_usa_bargain_canada.2.t: "[FROM.GetNameDefCap] Agrees to Trade [CAN.GetNameDefCap]"
  new_usa_bargain_canada.2.desc: "We have received confirmation from the [FROM.GetAdjective] government that our offer to purchase [CAN.GetNameDefCap] has been approved!"
  new_usa_bargain_canada.2.a: "Excellent!"
  new_usa_bargain_canada.3.t: "[FROM.GetNameDefCap] Turns Down the Trade Deal"
  new_usa_bargain_canada.3.desc: "Unfortunately, our offer to purchase [CAN.GetNameDefCap] from [FROM.GetNameDefCap] has been promptly though kindly turned down. The letter confirming as much also makes clear the intent on cooperation that the [FROM.GetAdjective] enjoys with us and is keen on seeing it continue regardless."
  new_usa_bargain_canada.3.a: "At least they weren't rude"
  
  new_usa_buy_newfoundland.1.t: "[USA.GetNameDefCap] Offers to Purchase Newfoundland"
  new_usa_buy_newfoundland.1.desc: "After securing Canada, the [USA.GetAdjective] administration has come once more to offer to buy the territories of Newfoundland and Labrador in order to secure continental integrity."
  new_usa_buy_newfoundland.1.a: "We may as well"
  new_usa_buy_newfoundland.1.b: "We'll be holding onto it"
  new_usa_buy_newfoundland.2.t: "[FROM.GetNameDefCap] Agrees to sell us Newfoundland"
  new_usa_buy_newfoundland.2.desc: "[FROM.GetNameDefCap] has agreed to our final terms to further purchase the remaining territory of the Canadians."
  new_usa_buy_newfoundland.2.a: "North America is ours"
  new_usa_buy_newfoundland.3.t: "[FROM.GetNameDefCap] Turns Down our last request"
  new_usa_buy_newfoundland.3.desc: "Unfortunately, our offer to purchase Newfoundland from [FROM.GetNameDefCap] has been promptly though kindly turned down. The letter confirming as much also makes clear the intent on cooperation that the [FROM.GetAdjective] enjoys with us and is keen on seeing it continue regardless."
  new_usa_buy_newfoundland.3.a: "Unfortunate"
  
  
  new_usa_conquer_north.1.b.tt: "§Y[FROM.GetNameDefCap]§! may immediately §Rdeclare war!§!"
  new_usa_conquer_north.1.t: "[FROM.GetNameDefCap] Demands Immediate Subjugation"
  new_usa_conquer_north.1.desc: "The [FROM.GetAdjective] government has issued a demand to our capital demanding the immediate subjugation of our country to them. This brazen threat seems to be well-backed, as the demand includes various examples of potential targets that the [FROM.GetAdjective] military plans to hit first in the event they are drawn to use force.\n\nHow do we respond?"
  new_usa_conquer_north.1.a: "It's hopeless..."
  new_usa_conquer_north.1.b: "If it's a fight they want, it's a fight they'll get!"
  new_usa_conquer_north.2.t: "[FROM.GetNameDefCap] has Accepted our Demands"
  new_usa_conquer_north.2.desc: "Just minutes ago, word has come in that the [FROM.GetAdjective] government has acquiesced to our demands and has now declared themselves to be under our direct supervision."
  new_usa_conquer_north.2.a: "Perfect"
  new_usa_conquer_north.3.t: "[FROM.GetNameDefCap] Refuses Subjugation"
  new_usa_conquer_north.3.desc: "In a display of amusing bravery and foolishness, the [FROM.GetAdjective] government has publicly refused our tempered demands. However, they should've understood that these demands were not made in a vacuum, and we intend to follow through with them. War was not our first choice, but it is now our only choice."
  new_usa_conquer_north.3.a: "They knew what they were getting themselves into"
  new_usa_conquer_north.3.b: "They called our bluff..."
  
  
  new_usa_carribean.1.t: "[FROM.GetNameDefCap] Demands Integration into [FROM.GetAdjective] Sphere of Influence"
  new_usa_carribean.1.desc: "[FROM.GetNameDefCap] has publicly made a claim on our country, stating the necessity of bringing our foreign policy firmly within their sphere of influence in order to promote mutual prosperity and prevent a possible attack on [FROM.GetAdjective] land.\n\nHow should we respond?"
  new_usa_carribean.1.a: "It's easier to accede"
  new_usa_carribean.1.b: "We won't be bullied"
  new_usa_carribean.2.t: "[FROM.GetNameDefCap] agrees to enter our sphere of influence"
  new_usa_carribean.2.desc: "We have received news from the [FROM.GetAdjective] embassy that effective immediately the [FROM.GetAdjective] government will submit all matters of foreign policy to us for inspection and approval, effectively bringing them firmly into the [THIS.GetAdjective] sphere of influence."
  new_usa_carribean.2.a: "Simple and easy"
  new_usa_carribean.3.t: "[FROM.GetNameDefCap] rejects our demands"
  new_usa_carribean.3.desc: "Unfortunately, it would appear that the [FROM.GetAdjective] government has decided not to adhere to our demands and will not be joining our sphere of influence. While their decision has been made, we must now respond ourselves.\n\nDoes the threat of invasion still stand?"
  new_usa_carribean.3.a: "We must follow through"
  new_usa_carribean.3.b: "It's alright, we'll be just fine without them"
  
  new_usa_london_treaty.1.a.tt: "§YFree our colonial holdings§! in the middle and southern americas."
  new_usa_london_treaty.1.t: "[FROM.GetNameDefCap] invites us to sign the London Treaty"
  new_usa_london_treaty.1.desc: "The [FROM.GetAdjective] government has made a grand proposal for freeing the Caribbean and South America from European colonialism once and for all. During the conference, [FROM.GetAdjective] diplomats spoke dramatically about the great importance of self-determination for the peoples of their hemisphere and how our countries have enough to worry about to have to get involved in maintaining good connections across the globe, especially when [FROM.GetNameDefCap] has taken it upon themselves to maintain peace and security in the region already. Our own holdings in the Americas would be freed from our influence were we to sign the treaty."
  new_usa_london_treaty.1.a: "Freedom for the Americas has been a long time coming"
  new_usa_london_treaty.1.b: "Our interests support a continued presence there"
  new_usa_london_treaty.2.t: "[FROM.GetNameDefCap] has signed the London Treaty"
  new_usa_london_treaty.2.desc: "After much back and forth, the [FROM.GetAdjective] diplomat present at the conference finally agreed to sign the treaty and establish free republics in their western territories. A great day for freedom!"
  new_usa_london_treaty.2.a: "Diplomacy at work"
  new_usa_london_treaty.3.t: "[FROM.GetNameDefCap] has declined to sign the London Treaty"
  new_usa_london_treaty.3.desc: "Despite our efforts to try to win over the powers still involved in the new world, [FROM.GetNameDefCap] has not agreed to free their holdings. However, relations have been kept cool and are yet to sour. Perhaps there is still time to win them over."
  new_usa_london_treaty.3.a: "What if we make it worth their while?"
  new_usa_london_treaty.3.b: "It's no use"
  new_usa_london_treaty.4.t: "[FROM.GetNameDefCap] offers payments to sign treaty"
  new_usa_london_treaty.4.desc: "Not giving up just yet, the lead [FROM.GetAdjective] diplomat has approached us with an offer to pay for our releasing of our holdings in the new world. If we sign the London Treaty, they pledge to pay us handsomely for it."
  new_usa_london_treaty.4.a: "Now that's a deal worth taking"
  new_usa_london_treaty.4.b: "Tempting, but our holdings are too important"
  new_usa_london_treaty.5.t: "[FROM.GetNameDefCap] agrees to sign for payment"
  new_usa_london_treaty.5.desc: "Our diplomatic maneuvering has paid off and we have finally managed to get a signature from the [FROM.GetAdjective] diplomat. Though we had to put some of our resources on the line to accomplish it, the Americas are now just that little bit freer."
  new_usa_london_treaty.5.a: "Finally"
  new_usa_london_treaty.6.t: "[FROM.GetNameDefCap] still refuses to sign"
  new_usa_london_treaty.6.desc: "Despite everything, the [FROM.GetAdjective] diplomat has turned down signing the London Treaty. We must accept that their influence will continue to linger in the Americas."
  new_usa_london_treaty.6.a: "Unfortunate"
  new_usa_london_treaty.6.b: "No, this isn't over..."
  
  new_usa_shield_pan.1.t: "[FROM.GetNameDefCap] requests direct involvement in protecting the Canal"
  new_usa_shield_pan.1.desc: "[FROM.GetNameDefCap] has sent us a letter with a military attaché requesting that we enter into a close alliance with them and help them in protecting the Panama Canal. In exchange, we would receive financial backing and military assistance."
  new_usa_shield_pan.1.a: "This is in our interest"
  new_usa_shield_pan.1.b: "We would rather maintain our sovereignty"
  new_usa_shield_pan.2.t: "[FROM.GetNameDefCap] has agreed to our requests"
  new_usa_shield_pan.2.desc: "Earlier this morning, we received an official communique from the [FROM.GetAdjective] government informing us that the proposal for a unified defense of the Canal and closer national ties has been accepted."
  new_usa_shield_pan.2.a: "Excellent"
  new_usa_shield_pan.3.t: "[FROM.GetNameDefCap] has refused our request"
  new_usa_shield_pan.3.desc: "We have received word from the [FROM.GetAdjective] government that our request for a close partnership in defending the Panama Canal has been denied. The sticking point appears to have centered around a feeling of loss of control over their own country."
  new_usa_shield_pan.3.a: "We'll just have to secure it ourselves"
  new_usa_shield_pan.3.b: "The canal's security is too important"
  
  new_usa_monroe_neutrality.1.t: "[FROM.GetNameDefCap] Requests Peace Commitments"
  new_usa_monroe_neutrality.1.desc: "Our [FROM.GetAdjective] embassy has relayed a new accord which the [FROM.GetAdjective] president has issued to [CAN.GetName], [MEX.GetName], and the European great powers, requesting a signed commitment to continuing peace between our two nations and a promise to respect the independence of the Americas."
  new_usa_monroe_neutrality.1.a: "We will sign it"
  new_usa_monroe_neutrality.1.b: "This sounds like a threat"
  new_usa_monroe_neutrality.2.t: "[FROM.GetNameDefCap] Signs the Accord"
  new_usa_monroe_neutrality.2.desc: "The [FROM.GetAdjective] chief diplomat in the capitol has just relayed to our minister of state a signed copy of the treaty we issued to them just a few days ago. It would appear that we should have peace for our time with [FROM.GetNameDefCap]."
  new_usa_monroe_neutrality.2.a: "Wonderful"
  new_usa_monroe_neutrality.3.t: "[FROM.GetNameDefCap] Refuses to Sign the Accord"
  new_usa_monroe_neutrality.3.desc: "Whether our message was misheard or the [FROM.GetAdjective] government really does have plans to do us harm, our peace accord with [FROM.GetNameDefCap] has been outright refused. What this will mean for our diplomatic relationship with them going forward is not known yet."
  new_usa_monroe_neutrality.3.a: "Our enemy is revealed"
  
  new_usa_american_alliance.1.t: "[FROM.GetNameDefCap] Invites us to join the American Security Alliance"
  new_usa_american_alliance.1.desc: "[FROM.GetNameDefCap] has sent its top diplomats to inform us that they are building a military alliance focused on the defense of the Americas and would like [THIS.GetNameDefCap] to join it and enter into solidarity with the [FROM.GetAdjective] sphere."
  new_usa_american_alliance.1.a: "This is a necessary step for security"
  new_usa_american_alliance.1.b: "We won't pledge ourselves to [FROM.GetName]"
  new_usa_american_alliance.2.t: "[FROM.GetNameDefCap] Joins the American Security Alliance"
  new_usa_american_alliance.2.desc: "With the inclusion of [FROM.GetNameDefCap] into the American Security Alliance, our ability to power project across the continent has been greatly bolstered. More allies and fellow security-minded nations means that any potential foe will need to tangle with all of us combined."
  new_usa_american_alliance.2.a: "Excellent"
  new_usa_american_alliance.3.t: "[FROM.GetNameDefCap] Refuses to Join the American Security Alliance"
  new_usa_american_alliance.3.desc: "It is not yet clear whether it is hubris or ill intent, but whatever the reason [FROM.GetName] has declined our invitation to join the American Security Alliance. This represents not only a diplomatic slap in the face, but also a serious point of consideration in deciding on the fate of our national security. A local nation which sees no benefit in aiding our mutual defense is one which could easily become a threat down the road."
  new_usa_american_alliance.3.a: "Disturbing"
  
  new_usa_vigilance_pact.1.t: "[FROM.GetNameDefCap] Invites us to join the Intercontinental Vigilance Pact"
  new_usa_vigilance_pact.1.desc: "Our [FROM.GetAdjective] embassy has received word that [FROM.GetNameDefCap] has initiated the creation of a formal cooperative military alliance which seeks to mobilize the Americas in mutual defense of the continents."
  new_usa_vigilance_pact.1.a: "We will join this pact"
  new_usa_vigilance_pact.1.b: "They can have their little pact"
  new_usa_vigilance_pact.2.t: "[FROM.GetNameDefCap] Joins the Intercontinental Vigilance Pact"
  new_usa_vigilance_pact.2.desc: "We've just received word from our embassy in [FROM.GetName] that the [FROM.GetAdjective] government has formally acknowledged our invitation to the IVP and has declared their support of it. With their official joining of our mutual defense pact, we rest easier knowing that we have more friends on our side."
  new_usa_vigilance_pact.2.a: "Great to hear"
  new_usa_vigilance_pact.3.t: "[FROM.GetNameDefCap] Declines to Join the Intercontinental Vigilance Pact"
  new_usa_vigilance_pact.3.desc: "In a somewhat unsurprising move, the [FROM.GetAdjective] government has acknowledged our new military alliance but has declined to throw their flag in with ours. While this does rob the pact of some of its potential strength, perhaps it will turn out for the best in the long run as its cohesion won't have to rest on parties with shaky resolve, such as with [FROM.GetNameDefCap]."
  new_usa_vigilance_pact.3.a: "That's alright"
  
  new_usa_purchase_gap.1.t: "[FROM.GetNameDefCap] Offers to Purchase the Canadian Corridor"
  new_usa_purchase_gap.1.desc: "The [FROM.GetAdjective] government has sent us a good offer to purchase the Western Corridor for a decent sum. Our cooperation seems to have them thinking that they can just buy land off of us. ... Can they? Perhaps it would be a good trade."
  new_usa_purchase_gap.1.a: "This is a worthy trade"
  new_usa_purchase_gap.1.b: "We appreciate the offer, but we're not interested"
  new_usa_purchase_gap.2.t: "[FROM.GetName] Agrees to Sell the Canadian Corridor"
  new_usa_purchase_gap.2.desc: "Our offer to purchase the Canadian Corridor from [FROM.GetNameDefCap] has been received and accepted. Effective immediately, the western gap is now under American ownership. America's holding on the continent are finally completely contiguous."
  new_usa_purchase_gap.2.a: "That's excellent!"
  new_usa_purchase_gap.3.t: "[FROM.GetNameDefCap] Declines our offer to purchase the Western Gap"
  new_usa_purchase_gap.3.desc: "Unfortunately, our diplomatic and economic play to purchase the Canadian Corridor seems to have fallen on rather deaf ears. While this transaction won't be going through today, perhaps there will come some time in the future when the opportunity will once again arise. Until then, we may continue on with our amicable relations with the [FROM.GetAdjective] administration."
  new_usa_purchase_gap.3.a: "Unfortunate"
  
  new_usa_purchase_holdovers.1.a.tt: "§YSell our colonial holdings§! in the middle and southern americas."
  new_usa_purchase_holdovers.1.t: "[FROM.GetNameDefCap] Offers to Purchase our American Colonies"
  new_usa_purchase_holdovers.1.desc: "The [FROM.GetAdjective] government is offering to purchase our remaining colonies in the Americas. They are offering good money for them. However, our colonial holdings are not mere chips to be thrown around. Any decision to part with them must be done with serious consideration."
  new_usa_purchase_holdovers.1.a: "We accept the deal"
  new_usa_purchase_holdovers.1.b: "We aren't ready to part with them"
  new_usa_purchase_holdovers.2.t: "[FROM.GetNameDefCap] has Agreed to transfer their American holdings to us"
  new_usa_purchase_holdovers.2.desc: "It's a beautiful day for freedom knowing that the colonies in the Americas of [FROM.GetNameDefCap] will no longer be under the yoke of European powers. Finally, these regions are separated from the old world."
  new_usa_purchase_holdovers.2.a: "Excellent"
  new_usa_purchase_holdovers.3.t: "[FROM.GetNameDefCap] has declined the deal"
  new_usa_purchase_holdovers.3.desc: "While we had hoped to purchase the last remaining American colonies of the [FROM.GetAdjective], we will have to seek out another opportunity at another time."
  new_usa_purchase_holdovers.3.a: "Unfortunate"
  
  new_usa_econ_1.2.t: "Policy on Economic Recovery"
  new_usa_econ_1.2.desc: "As the country's economy begins to recover, we need to decide how we're going to approach it. Will the government intervene in the economy to try and get it up and running again sooner or will it step back and try its best to allow for a natural recovery?"
  new_usa_econ_1.2.a: "Natural Recovery"
  new_usa_econ_1.2.a.tt: "Will work towards completing the §Y$USA_natural_recovery$§! focus. \n\n§YThis focus will improve growth but will take longer.§!"
  #new_usa_econ_1.2.a.tt_2: "Completion Time: §Y399§! days\n§YEffect§!:\n Daily Political Power Cost: §G-0.45§!\n Resource Gain Efficiency: §G+40.0%§!\n Recruitable Population Factor: §G+30.0%§!\n Consumer Goods Factories factor: §Y-10.0%§!\n Stability §G+5.0%§!\n War Support §G+5.0%§!\n Construction Speed: §G+5.0%§!\n Production"
  new_usa_econ_1.2.b: "Accelerated Recovery"
  new_usa_econ_1.2.b.tt: "Will work towards completing the §Y$USA_accelerated_recovery$§! focus. \n\n§YThis focus will be beneficial and fast.§!"
  
  new_usa_econ_2.2.t: "Policy on Economic Growth"
  new_usa_econ_2.2.desc: "The country's economy is recovering quickly and effectively, and soon it will come back into its former glory. Do we let it continue on along its current path, or do we apply strategic interventions in order to bring it up to par more immediately?"
  new_usa_econ_2.2.a: "Eagle of the Free Market"
  new_usa_econ_2.2.a.tt: "Will work towards completing the §Y$USA_eagle_of_the_free_market$§! focus. \n\n§YThis focus will maximize growth but will take a very long time!§!"
  new_usa_econ_2.2.b: "Timely Intervention"
  new_usa_econ_2.2.b.tt: "Will work towards completing the §Y$USA_timely_intervention$§! focus. \n\n§YThis focus will be very strong and much quicker to complete.§!"
  
  error_debug.1.t: "Something went wrong"
  error_debug.1.desc: "Le darn"
  error_debug.2.a: "Oof"
  debug.1.t: "Debug"
  debug.1.desc: "This event has been fired to mark some point of continuity."
  debug.1.a: "Gotcha"
  
  debug.2.t: "[FROM.GetName] sent to [ROOT.GetName]"
  debug.2.desc: "Good"
  debug.2.a: "Great"
  
  new_usa_new_world_market.1.t: "[FROM.GetNameDefCap] invites us to the New World Market System"
  new_usa_new_world_market.1.desc: "We are being invited to join the [FROM.GetName] in an economic pact that will encourage mutual trade and cooperation in the economy. Should we join, we can expect great returns on whatever we invest into the alliance."
  new_usa_new_world_market.1.a: "This is a worthy endeavor"
  new_usa_new_world_market.1.b: "It wouldn't be wise to commit to this"
  new_usa_new_world_market.2.t: "[FROM.GetNameDefCap] Joins the New World Market System"
  new_usa_new_world_market.2.desc: "We've just received word from our [FROM.GetAdjective] ambassador that [FROM.GetNameDefCap] has elected to join us in this new economic sphere. How this will shape the future remains to be seen."
  new_usa_new_world_market.2.a: "Incredible"
  new_usa_new_world_market.3.t: "[FROM.GetNameDefCap] has declined to join the New World Market System"
  new_usa_new_world_market.3.desc: "Unfortunately, [FROM.GetNameDefCap] has decided that it would not be in their present interest to join our novel economic pact."
  new_usa_new_world_market.3.a: "That's too bad"
  
  new_usa_continental_citadel.1.t: "[FROM.GetNameDefCap] invites us to the Continental Citadel Coalition"
  new_usa_continental_citadel.1.desc: "[FROM.GetNameDefCap] has extended an invitation to partake in a joint military defense initiative to attempt to safeguard the Western Hemisphere from outside threats, named the Continental Citadel Coalition. If we join, we can expect some decent boosts to our own military industries."
  new_usa_continental_citadel.1.a: "This is in our interest"
  new_usa_continental_citadel.1.b: "We will not be joining"
  new_usa_continental_citadel.2.t: "[FROM.GetNameDefCap] Joins the Continental Citadel Coalition"
  new_usa_continental_citadel.2.desc: "We've just received word from our [FROM.GetAdjective] ambassador that [FROM.GetNameDefCap] has elected to join us in this new defensive sphere. How this will shape the future remains to be seen."
  new_usa_continental_citadel.2.a: "Great"
  new_usa_continental_citadel.3.t: "[FROM.GetNameDefCap] has declined to join the Continental Citadel Coalition"
  new_usa_continental_citadel.3.desc: "Unfortunately, [FROM.GetNameDefCap] has decided that it would not be in their present interest to join our novel military defense pact."
  new_usa_continental_citadel.3.a: "That's not ideal"
  
  
  new_usa_acquire_pacific_territories.0.t: "Do we pursue purchasing or claiming?"
  new_usa_acquire_pacific_territories.0.desc: "When we reach out to those nations that own the Oceanic territories we are aiming to acquire, will be attempt to buy these lands off of them or will we make claims on them?"
  new_usa_acquire_pacific_territories.0.a: "We will buy them"
  new_usa_acquire_pacific_territories.0.b: "We will demand them"
  new_usa_acquire_pacific_territories.1.t: "[FROM.GetNameDefCap] Offers to Purchase Our Oceanic Territories"
  new_usa_acquire_pacific_territories.1.desc: "[FROM.GetNameDefCap] has reached out to our administration with an offer to purchase the territories we own across the continental region of Oceania. The [FROM.GetAdjective] ambassador to [ROOT.GetName] has stressed that their administration has become very interested in extending its influence across the Pacific and sees a purchase of our islands there as a high priority investment for [FROM.GetNameDef]. \nIf we accept the transfer of land, they will pay us generously for the deal. However, it would mean giving significant influence in the Pacific.\n\nWhat's our response?"
  new_usa_acquire_pacific_territories.1.a: "This deal is in our interest."
  new_usa_acquire_pacific_territories.1.b: "This is an unfair trade."
  new_usa_acquire_pacific_territories.2.t: "[FROM.GetNameDefCap] agrees to sell Oceanic holdings"
  new_usa_acquire_pacific_territories.2.desc: "We have just received confirmation that [FROM.GetNameDefCap] has accepted our offer to purchase their territories in the Oceanic region. With these new holdings, [THIS.GetAdjective] influence will spread farther across the Pacific."
  new_usa_acquire_pacific_territories.2.a: "Perfect"
  new_usa_acquire_pacific_territories.3.t: "[FROM.GetNameDefCap] rejects the sale of Oceanic holdings"
  new_usa_acquire_pacific_territories.3.desc: "[FROM.GetNameDefCap] has declined to go through with our offer to purchase [FROM.GetAdjective] island territories across the Pacific. Luckily, this offer was made kindly, so no diplomatic fallout is expected from this decision on their part. The status quo is maintained, though [THIS.GetName] has not gained from this move."
  new_usa_acquire_pacific_territories.3.a: "Unfortunate"
  new_usa_acquire_pacific_territories.4.t: "[FROM.GetNameDefCap] Demands Transfer of Oceanic Territories"
  new_usa_acquire_pacific_territories.4.desc: "[FROM.GetNameDefCap] has issued a statement to the [THIS.GetAdjective] government demanding that we cede our colonial holdings across Oceania and the Pacific in order to protect their sphere of influence. This is a brash demand made by an unusually aggressive administration."
  new_usa_acquire_pacific_territories.4.a: "It would be unwise to make them our enemy"
  new_usa_acquire_pacific_territories.4.b: "These are empty threats"
  new_usa_acquire_pacific_territories.5.t: "[FROM.GetNameDefCap] cedes Oceanic territories"
  new_usa_acquire_pacific_territories.5.desc: "The [FROM.GetAdjective] administration has agreed to our demands and has handed over their holdings across the Pacific. We stand stronger because of these cessions."
  new_usa_acquire_pacific_territories.5.a: "They made the right choice"
  new_usa_acquire_pacific_territories.6.t: "[FROM.GetNameDefCap] refuses to cede territories"
  new_usa_acquire_pacific_territories.6.desc: "In a brazen act of defiance, the [FROM.GetAdjective] government has chosen to ignore our demands and has openly refused to cede their holdings in the Pacific to us. However, we have made our position on this matter clear, and we may indeed be back."
  new_usa_acquire_pacific_territories.6.a: "They don't know what they've done"
  
  new_usa_liberty_over_east_asia.1.t: "[FROM.GetNameDefCap] demands control over our foreign policy"
  new_usa_liberty_over_east_asia.1.desc: "Our administration has just received an envoy from [FROM.GetNameDefCap] informing us that they are pursuing a new policy of 'liberty over Asia', and as part of this new policy they are requesting control over our own foreign policy. Though the presentation was peaceable and even quaint, several ministers couldn't help but notice the not-so-subtle undertones the [FROM.GetAdjective] diplomats were using. It appears that they aren't particularly interested in negotiating this point with us, but rather are demanding this shift of policy effective immediately."
  new_usa_liberty_over_east_asia.1.a: "Perhaps it would be for the best"
  new_usa_liberty_over_east_asia.1.b: "This brash tact won't sway us!"
  new_usa_liberty_over_east_asia.2.t: "[FROM.GetNameDefCap] transfers control of foreign policy"
  new_usa_liberty_over_east_asia.2.desc: "The [FROM.GetAdjective] administration has submitted their response to our envoy concerning our new foreign policy position, and the response has been a full acceptance of our diplomatic pursuits in the region. The foreign policy systems of [FROM.GetNameDefCap] are now under our supervision."
  new_usa_liberty_over_east_asia.2.a: "Excellent, this will help ensure our mutual prosperity"
  new_usa_liberty_over_east_asia.3.t: "[FROM.GetNameDefCap] refuses to submit control over foreign policy to us"
  new_usa_liberty_over_east_asia.3.desc: "The [FROM.GetAdjective] administration has responded to our diplomatic delegation with a punitive rejection of our generous offer for mutual prosperity and have refused to continue talks. There is only one course of action which lies ahead of us now- we must extend liberty to them by force."
  new_usa_liberty_over_east_asia.3.a: "Then by force it shall be extended"
  new_usa_liberty_over_east_asia.3.b: "We may have gone too far"
  new_usa_liberty_over_east_asia.4.t: "[USA.GetNameDefCap] demands overlordship of [FROM.GetNameDefCap]"
  new_usa_liberty_over_east_asia.4.desc: "A [USA.GetAdjective] delegation to our government has informed us that [USA.GetNameDefCap] has set its sights on a new foreign policy goal of securing East Asia and the Pacific. In this pursuit, they are aiming to get from us the foreign policy control that we currently maintain over [FROM.GetNameDefCap]. Though the delegation used flowery and cooperative language and stressed its points of general security and prosperity and much ado about liberty, our ministers couldn't help but feel unnerved by the strangely aggressive undertones of their delivery. It seems that their administration is pursuing this objective with force, and therefore they may very well resort to force if we don't give in."
  new_usa_liberty_over_east_asia.4.a: "We should maintain good terms with the Americans"
  new_usa_liberty_over_east_asia.4.b: "This is a transparent bluff"
  new_usa_liberty_over_east_asia.5.t: "[FROM.GetNameDefCap] cedes foreign policy control East Asian state"
  new_usa_liberty_over_east_asia.5.desc: "Our delegation to the [FROM.GetAdjective] government has succeeded in transferring control over one of their Asiatic puppet states to us. This is a big step towards securing our hegemony across the Pacific."
  new_usa_liberty_over_east_asia.5.a: "Excellent!"
  new_usa_liberty_over_east_asia.6.t: "[FROM.GetNameDefCap] has refused to cede foreign policy rights"
  new_usa_liberty_over_east_asia.6.desc: "With this harsh rejection by the [FROM.GetAdjective] government, we have to expect that our pursuit of liberty over East Asia will have to run into their own policies. Conflict is likely to follow from this move, unfortunately."
  new_usa_liberty_over_east_asia.6.a: "They won't stop us"
  new_usa_liberty_over_east_asia.6.b: "We outplayed our hand..."
  
  new_usa_cross_pacific_alliance.1.t: "[FROM.GetNameDefCap] Invites us to the Cross-Pacific Pact"
  new_usa_cross_pacific_alliance.1.desc: "We have received word from several different [FROM.GetAdjective] ambassadors that [FROM.GetNameDefCap] is looking to enter into an economic and defensive pact with [THIS.GetNameDefCap] and her allies. Clearly, they believe that the tensions that have existed between our two countries have cooled, and their respect for us is evident. It should be noted that accepting this proposal would dramatically shake up our present geostrategic position. How should be respond?"
  new_usa_cross_pacific_alliance.1.a: "We see no reason not to!"
  new_usa_cross_pacific_alliance.1.b: "Not at this time, no"
  new_usa_cross_pacific_alliance.2.t: "[FROM.GetNameDefCap] agrees to join a pact with us"
  new_usa_cross_pacific_alliance.2.desc: "Our [FROM.GetAdjective] diplomats in Washington have confirmed that the government of [FROM.GetName] has accepted our proposal for a mutual economic and defensive pact between our nations and our allies. This is a great day for the West!"
  new_usa_cross_pacific_alliance.2.a: "Tremendous!"
  new_usa_cross_pacific_alliance.3.t: "[FROM.GetNameDefCap] refuses to enter a pact with us"
  new_usa_cross_pacific_alliance.3.desc: "Unfortunately, despite the best efforts of our diplomats in Tokyo, the [FROM.GetAdjective] administration has politely turned down our offer for a mutual economic and defensive pact between our nations."
  new_usa_cross_pacific_alliance.3.a: "Unfortunate indeed"
  
  new_usa_protect_the_pacific.1.t: "[FROM.GetNameDefCap] requests access to strategic infrastructure"
  new_usa_protect_the_pacific.1.desc: "[FROM.GetNameDefCap] has adopted a strategy to protect the Pacific, and in the pursuit of this policy they have requested access to our naval bases and air fields. The [FROM.GetAdjective] diplomats have stressed their intent to increase the ability of their fleets to patrol for hostile actors in the sea lanes of the Pacific, aiming to protect shipping and infrastructure."
  new_usa_protect_the_pacific.1.a: "This benefits us as well"
  new_usa_protect_the_pacific.1.b: "Our infrastructure isn't just open to anyone"
  new_usa_protect_the_pacific.2.t: "[FROM.GetNameDefCap] agrees to give access to strategic infrastructure"
  new_usa_protect_the_pacific.2.desc: "The [FROM.GetAdjective] administration has agreed to our request to give us access to their military and shipping infrastructures. With these new dots added to the map, the range and effectiveness of our naval patrols will be increased."
  new_usa_protect_the_pacific.2.a: "Great"
  new_usa_protect_the_pacific.3.t: "[FROM.GetNameDefCap] refuses to give access to bases"
  new_usa_protect_the_pacific.3.desc: "Despite having made our case to them, the [FROM.GetAdjective] government has not agreed to provide us access to their strategic infrastructure. Though this does not reflect well on future relations between our two nations, this is still only a minor setback and shouldn't affect our strategic situation."
  new_usa_protect_the_pacific.3.a: "Oh well"
  
  new_usa_the_firestar_project.1.t: "The USA offers to fund our war effort"
  new_usa_the_firestar_project.1.desc: "[FROM.GetNameDefCap] has approached our government with a very tempting offer: in exchange for letting in cultural influences from their country, America will supply our military with a dramatic supply of weaponry and will bolster our militarized industries with modern equipment and production methods. Should we take up this deal, our war will be as good as won, but it would come alongside some pretty dramatic cultural incursions for us. Is that worth it?"
  new_usa_the_firestar_project.1.a: "Certainly"
  new_usa_the_firestar_project.1.b: "It's not worth it"
  new_usa_the_firestar_project.2.t: "[FROM.GetNameDefCap] has accepted our assistance"
  new_usa_the_firestar_project.2.desc: "The [FROM.GetAdjective] government has accepted our material and intellectual aid in fighting their defensive war. The next step is to begin supplying them with a veritable mountain of funds and weaponry and get very involved in aiding their war effort. Our hope is that these efforts will also help to bleed American culture and ideals into China and spur on similar sentiments there, ready to flourish once this war is at its end."
  new_usa_the_firestar_project.2.a: "Excellent"
  new_usa_the_firestar_project.3.t: "[FROM.GetNameDefCap] has declined our assistance"
  new_usa_the_firestar_project.3.desc: "While we did our best to stress the usefulness and wisdom in accepting our aid, the [FROM.GetAdjective] government has turned down our offers of assistance. We can only hope for the best in their war, that they may make it to the other side as well as possible."
  new_usa_the_firestar_project.3.a: "Let's hope they can hold out"
  
  new_usa_alliance_with_a_united_china.1.t: "[FROM.GetNameDefCap] Proposes the Dragon-Eagle Treaty"
  new_usa_alliance_with_a_united_china.1.desc: "[FROM.GetNameDefCap] has proposed that our two nations enter into a formal military alliance that will give us a strategic edge over the rest of the world, ensuring control over the entire hemisphere for the Americans and ensuring territorial sovereignty over all of China for us. The offer is quite bold and quite vast, but it is also quite tempting."
  new_usa_alliance_with_a_united_china.1.a: "China accepts [FROM.GetName] as an ally"
  new_usa_alliance_with_a_united_china.1.b: "What a silly suggestion"
  new_usa_alliance_with_a_united_china.2.t: "[FROM.GetNameDefCap] has Signed the Treaty"
  new_usa_alliance_with_a_united_china.2.desc: "On this day, a new world-shaking alliance has been forged between [FROM.GetNameDefCap] and [ROOT.GetNameDefCap]. With this treaty, our two nations stand to secure complete geostrategic control over this entire hemisphere, ensuring our mutual protection and opening the door for our two nations to share in each other's full might of economy, population, military, and more."
  new_usa_alliance_with_a_united_china.2.a: "Perfect"
  new_usa_alliance_with_a_united_china.3.t: "[FROM.GetNameDefCap] refused to sign the treaty"
  new_usa_alliance_with_a_united_china.3.desc: "We did what we could to provide a tempting proposal to the [FROM.GetAdjective] government, but it would seem that our efforts have been in vain."
  new_usa_alliance_with_a_united_china.3.a: "Unfortunate..."
  new_usa_alliance_with_a_united_china.0.t: "[USA.GetNameDefCap] and [FROM.GetNameDefCap] Form the Dragon-Eagle Alliance"
  new_usa_alliance_with_a_united_china.0.desc: "Shocking news has come from Washington today. A new military alliance has been formed between [USA.GetNameDefCap] and [FROM.GetNameDefCap], bringing up questions about America's place in the world and what the final aim of its foreign policy might be.\n\nWhat will come from this new pact is yet to be seen, but government officials in administrations around the world have not been quiet in voicing their general dismay at this development."
  new_usa_alliance_with_a_united_china.0.a: "I see"
  
  new_usa_promote_peace.1.t: "[FROM.GetNameDefCap] Asks Us to Sign Onto the Declaration of Enduring Peace"
  new_usa_promote_peace.1.desc: "The [FROM.GetAdjective] government has drafted a series of articles for national conduct of foreign policy which it has given out to the countries of Europe. Collectively, they effectively require European nations to commit to peace and mutual cooperation with their neighbors, and the general tone of the declaration is one of avoiding another Great War at any cost. While signing on would put us on good terms with the Americans, it would also seriously hamstring any efforts we untake to mobilize our nation."
  new_usa_promote_peace.1.a: "We are for peace"
  new_usa_promote_peace.1.b: "It is just meaningless idealism"
  new_usa_promote_peace.2.t: "[FROM.GetNameDefCap] Signs the Declaration of Enduring Peace"
  new_usa_promote_peace.2.desc: "[FROM.GetNameDefCap] has added its official signatures to the Declaration, assuring us and their neighbors that they intend to carry forward a benevolent and genial attitude in geopolitics. This is a step towards maintaining peace around the world."
  new_usa_promote_peace.2.a: "This is a good day"
  new_usa_promote_peace.3.t: "[FROM.GetNameDefCap] Refuses to Sign the Declaration of Enduring Peace"
  new_usa_promote_peace.3.desc: "With the refusal to sign onto the declaration now a matter of public knowledge, [FROM.GetNameDefCap] is making a clear statement that it does not have peaceful intentions in mind for the world, and possibly for America itself."
  new_usa_promote_peace.3.a: "Do they want conflict?"
  
  new_usa_overwhelming_material_support.1.t: "[FROM.GetNameDefCap] Offers to Give Overwhelming Material Support"
  new_usa_overwhelming_material_support.1.desc: "The [FROM.GetAdjective] government is offering to support us in our conflicts by supplying us with a severe portion of its war producers and factory production. It would not look particularly good to be seen bowing down to their aid, but we could certainly use this economic boon."
  new_usa_overwhelming_material_support.1.a: "We accept"
  new_usa_overwhelming_material_support.1.b: "We can handle our fights ourselves"
  new_usa_overwhelming_material_support.2.t: "[FROM.GetNameDefCap] Accepts Our Support"
  new_usa_overwhelming_material_support.2.desc: "Our advisors have already scheduled flights to arrive in Siberia to support the [FROM.GetAdjective]s in the further development of their war industry. Hopefully, over the course of this partnership, we will be able to help them see eye to eye with us."
  new_usa_overwhelming_material_support.2.a: "Let's see where this goes"
  new_usa_overwhelming_material_support.3.t: "[FROM.GetNameDefCap] Rejects Our Support"
  new_usa_overwhelming_material_support.3.desc: "Somewhat unsurprisingly, [FROM.GetNameDefCap] have turned down our offer to assist them in the development of their war economy. They have stated that they have a full handle on their war efforts and don't require our help."
  new_usa_overwhelming_material_support.3.a: "Okay"
  
  new_usa_new_deal_1.2.t: "Policy on the New Deal"
  new_usa_new_deal_1.2.desc: "As the country's economy begins to recover, we need to decide how we're going to approach it. Will we be heavy-handed with the New Deal and enforce its ideals, or will we use it as a guide?"
  new_usa_new_deal_1.2.a: "Fair Labour Standards Act"
  new_usa_new_deal_1.2.a.tt: "Will work towards completing the §Y$USA_new_fair_labour_standards_act$§! focus. \n\n§YThis focus is historical and will calm down the crisis.§!"
  new_usa_new_deal_1.2.b: "Union Defense Act"
  new_usa_new_deal_1.2.b.tt: "Will work towards completing the §Y$USA_union_defense_act$§! focus. \n\n§YThis focus will be more controversial, but it will also be more effective.§!"
  
  new_usa_new_deal_2.2.t: "Policy on the New Deal"
  new_usa_new_deal_2.2.desc: "The country's economy is recovering quickly and effectively, and soon it will come back into its former glory. Do we pursue legislation that builds new homes for those who can't find any, or do we pursue legislation that eases restrictions of construction and enables it?"
  new_usa_new_deal_2.2.a: "Federal Housing Act"
  new_usa_new_deal_2.2.a.tt: "Will work towards completing the §Y$USA_new_federal_housing_act$§! focus. \n\n§YThis focus is historical and will provide for the American people.§!"
  new_usa_new_deal_2.2.b: "Federal Zoning Reform"
  new_usa_new_deal_2.2.b.tt: "Will work towards completing the §Y$USA_federal_zoning_reform$§! focus. \n\n§YThis focus will prioritize focused development.§!"
  
  new_usa_gold_standard_1.2.t: "Policy on Funding"
  new_usa_gold_standard_1.2.desc: "As the country's economy begins to recover, we need to decide how we're going to approach it. Should we maintain greater tariffs on imports in order to stimulate growth within our market, or should we make use of our large military to provide both jobs and works projects?"
  new_usa_gold_standard_1.2.a: "Protectionist Tariffs"
  new_usa_gold_standard_1.2.a.tt: "Will work towards completing the §Y$USA_new_protectionist_tariffs$§! focus. \n\n§YThis focus will prioritize economic recovery.§!"
  new_usa_gold_standard_1.2.b: "Guns and Shovels"
  new_usa_gold_standard_1.2.b.tt: "Will work towards completing the §Y$USA_guns_and_shovels$§! focus. \n\n§YThis focus will look to get Americans back to work through military employment.§!"
  
  new_usa_gold_standard_2.2.t: "Policy on Incomes"
  new_usa_gold_standard_2.2.desc: "The country's economy is recovering quickly and effectively, and soon it will come back into its former glory. Would it be better to reduce the monetary burden on citizens and reform the income tax, or should be improve the pay and pension systems for our military members?"
  new_usa_gold_standard_2.2.a: "Income Tax Reform"
  new_usa_gold_standard_2.2.a.tt: "Will work towards completing the §Y$USA_new_income_tax_reform$§! focus. \n\n§YThis focus will lead to a healthy economy.§!"
  new_usa_gold_standard_2.2.b: "Military Pensions"
  new_usa_gold_standard_2.2.b.tt: "Will work towards completing the §Y$USA_military_pensions$§! focus. \n\n§YThis focus will direct recovery towards military development.§!"
  
  new_usa_war_is_business.1.t: "[FROM.GetNameDefCap] Offers Special Trade Deal for Military Support"
  new_usa_war_is_business.1.desc: "The [FROM.GetAdjective] government has sent special envoys to their embassy here in our capital, relaying a unique trade deal for our administration to bolster and support our military, our defense, and our wars. The envoys carried gifts for various members of our upper cabinets and departments, a rather overt act. The offer from the [FROM.GetAdjective] administration is supposed to be on the quieter side- a military industry partnership that would see [ROOT.GetNameDefCap] gain near total access to the arms-producing might of [FROM.GetNameDefCap]. They would stand to benefit financially, we would stand to benefit in all aspects of our military's efficiency."
  new_usa_war_is_business.1.a: "Accept the offer"
  new_usa_war_is_business.1.b: "Not at this time"
  new_usa_war_is_business.2.t: "[FROM.GetNameDefCap] Accepts our Initial Offer"
  new_usa_war_is_business.2.desc: "[FROM.GetNameDefCap] has sent word back to our embassy in their capital that they formally accept our initial offer of partnership."
  new_usa_war_is_business.2.a: "So it begins..."
  new_usa_war_is_business.3.t: "[FROM.GetNameDefCap] Declines our Initial Offer"
  new_usa_war_is_business.3.desc: "Our smooth talk and extensive promises and offers have not managed to win over the [FROM.GetAdjective] administration this time."
  new_usa_war_is_business.3.a: "We can wait..."
  
  new_usa_army_auto_focus_select.1.t: "What should the US Army focus on?"
  new_usa_army_auto_focus_select.1.desc: "As the army grows its ranks and takes on new challenges, we need to determine where we will put our focus for development."
  new_usa_army_auto_focus_select.1.a: "Improve the whole army"
  new_usa_army_auto_focus_select.1.a_tt: "This will be considerably more expensive"
  new_usa_army_auto_focus_select.1.b: "Invest in the officer corps"
  new_usa_army_auto_focus_select.1.b_tt: "We will train up our leadership"
  new_usa_army_auto_focus_select.1.c: "Focus on the common soldier"
  new_usa_army_auto_focus_select.1.c_tt: "We will keep the backbone of the army strong"
  
  new_usa_propose_canadian_unification.1.t: "[FROM.GetNameDefCap] Proposes the Unification of [FROM.GetName] and [THIS.GetName]"
  new_usa_propose_canadian_unification.1.desc: "The [FROM.GetAdjective] government has relayed to our own government a proposal for the joint governing of our two countries and the national unification of North America. Both of our countries have rather similar cultural heritages, we are very friendly with one another, and we are economically tied together. A broad unification of our countries would have various benefits, though it would mean the loss of our own personal sovereignty."
  new_usa_propose_canadian_unification.1.a: "Let us join together!"
  new_usa_propose_canadian_unification.1.b: "No thanks, we would rather remain separate"
  new_usa_propose_canadian_unification.2.t: "[FROM.GetNameDefCap] Accepts Unification"
  new_usa_propose_canadian_unification.2.desc: "[FROM.GetNameDefCap] has sent word back to our embassy in their capital that they formally accept our offer of national unification!"
  new_usa_propose_canadian_unification.2.a: "Excellent!"
  new_usa_propose_canadian_unification.3.t: "[FROM.GetNameDefCap] Declines our Proposal for National Unification"
  new_usa_propose_canadian_unification.3.desc: "Despite not taking up our proposal, the [FROM.GetAdjective] government has nonetheless stretched out several gestures of thanks and well wishes towards us and treated our diplomatic suite to a state dinner, stressing their interest in continuing forward our mutual friendship."
  new_usa_propose_canadian_unification.3.a: "At least they were nice about it"

# NATIONALIST COMMUNIST
  new_usa_nc_secure_peace_guarantees_event.1.t: "[FROM.GetNameDefCap] Asks for Peace Guarantees"
  new_usa_nc_secure_peace_guarantees_event.1.desc: "The [FROM.GetAdjective] government has invited our diplomatic delegation to a meeting where they have requested that our two nations enter into a formal non-aggression pact. The [FROM.GetAdjective] government has placed serious stress on their intent to remain peaceful themselves and to do what they can to stay out of the quagmires that are quickly spreading across the world. All they ask from us is that we honor their peaceful intentions and put them at ease by promising to respect their sovereignty."
  new_usa_nc_secure_peace_guarantees_event.1.a: "Let us sign for peace"
  new_usa_nc_secure_peace_guarantees_event.1.b: "We have other intentions"
  new_usa_nc_secure_peace_guarantees_event.2.t: "[FROM.GetNameDefCap] Signs the NAP"
  new_usa_nc_secure_peace_guarantees_event.2.desc: "[FROM.GetNameDefCap] has sent word back to our embassy in their capital that they formally accept request for a mutual peace treaty between our two nations."
  new_usa_nc_secure_peace_guarantees_event.2.a: "Excellent!"
  new_usa_nc_secure_peace_guarantees_event.3.t: "[FROM.GetNameDefCap] Declines to Sign the NAP"
  new_usa_nc_secure_peace_guarantees_event.3.desc: "Our delegation which met with the [FROM.GetAdjective] diplomats were very dismayed and unnerved to find that [FROM.getName] does not appear to have a keen interest in promising peace with us."
  new_usa_nc_secure_peace_guarantees_event.3.a: "Unnerving indeed"

  new_usa_nc_the_whiskey_jay_compatriot_event.1.t: "[FROM.GetNameDefCap] Requests We Integrate Into Their Sphere"
  new_usa_nc_the_whiskey_jay_compatriot_event.1.desc: "The [FROM.GetAdjective] government has proposed that we join them in their sphere of influence, along with its communist leanings."
  new_usa_nc_the_whiskey_jay_compatriot_event.1.a: "A great idea!"
  new_usa_nc_the_whiskey_jay_compatriot_event.1.b: "We'll take our chances"
  new_usa_nc_the_whiskey_jay_compatriot_event.2.t: "[FROM.GetNameDefCap] Joins [THIS.GetNameDefCap]"
  new_usa_nc_the_whiskey_jay_compatriot_event.2.desc: "[FROM.GetNameDefCap] has sent word back to our embassy in their capital that they formally accept our offer to join our sphere."
  new_usa_nc_the_whiskey_jay_compatriot_event.2.a: "Excellent!"
  new_usa_nc_the_whiskey_jay_compatriot_event.3.t: "[FROM.GetNameDefCap] Declines to Join Us"
  new_usa_nc_the_whiskey_jay_compatriot_event.3.desc: "The [FROM.GetAdjective] government has declined to answer the call of its people and of liberty herself. There can be only one recourse!"
  new_usa_nc_the_whiskey_jay_compatriot_event.3.a: "Liberty must reign!"

  new_usa_nc_red_july_1.2.t: "How Will We Heal from the Great Depression?"
  new_usa_nc_red_july_1.2.desc: "It is clear that the policies in place in the country today have failed the American people and that a change in course is necessary. However, it is not necessarily clear just how much of a change is warranted. Should we pursue socialist policies to help the millions of struggling people who have been crushed by the Great Depression, or should we abandon the greedy ways that led to the stock market crash in the first place and seek a more progressive utopia?"
  new_usa_nc_red_july_1.2.a: "Representation Reform"
  new_usa_nc_red_july_1.2.a.tt: "Will work towards completing the §Y$USA_representation_reform$§! focus. \n\n§YThis path will lead down a more socialist progression for America.§!"
  new_usa_nc_red_july_1.2.b: "Property Reform"
  new_usa_nc_red_july_1.2.b.tt: "Will work towards completing the §Y$USA_property_reform$§! focus. \n\n§YThis will lead down a communistic path that will likely spark a§! §Rcivil war§!§Y!§! "

  new_usa_southern_crisis_1.2.t: "The Question of Our National Character"
  new_usa_southern_crisis_1.2.desc: "America is on the road to recovery, its people have regained their vigor, and the continent is beginning to find its footing once more. However, as we rise from the ashes of the Great Depression, we find that the mire has been wiped from our eyes. America's destiny lies before us, clearer than ever before, and the question of what path she will embark on is now open for debate. On one extreme, America may be guided towards the road to complete self-dependency, unmoored and unchained from the rest of the world, ready to make good her promises and firmly secure her position. On the other hand, we are loosened from the false tide of history and foreign influence- does America instead lift her head above the tallest mountains and set her gaze beyond the horizon, striking forth to claim her own destiny from amidst the rubble? Every gate is open, and the paths lay before us."
  new_usa_southern_crisis_1.2.a: "Visions of a New Frontier"
  new_usa_southern_crisis_1.2.a.tt: "Will work towards completing the §Y$USA_visions_of_a_new_frontier$§! focus. \n\n§YThis path will guide America towards a self-deterministic autarky§!"
  new_usa_southern_crisis_1.2.b: "A New America"
  new_usa_southern_crisis_1.2.b.tt: "Will work towards completing the §Y$USA_a_new_america$§! focus. \n\n§YThis will set us on a path of conflict which will likely spark a§! §Rcivil war§!§Y!§! "

  usa_new_nc_civil_war_event.1.t: "A Second American Civil War"
  usa_new_nc_civil_war_event.1.d: "Earlier today, a special session of Congress was called. Its aim was simple and concise: the complete banning of communism in the United States of America. Many senators and congressmen openly declared that the red menace within our borders must be quelled at once, that it cannot be allowed to continue festering, that anyone caught espousing its precepts must be fined or jailed. Proceedings moved quickly, but perhaps the most striking piece of the debate was the complete lack of any debate at all; dozens of representatives, those not in favor, were absent, all having left for a provisional congressional meeting in New York City. \n\nThe event was hosted in the haphazardly-rearranged Savoy Ballroom, where senators and congressmen from across the country discussed the specifics of a new national government. It was clear that war was coming and the politicians, leaders, and officers present quickly made preparations for a unified front. \n\nJust a few hours after both meetings had begun, the former concluded and immediately declared a state of emergency, rallying the national guard and the military to shut down the New York Congress. In response, nationalist communist loyalists from across the country have been mobilized in preprepared units to defend against this threat. \n\nA second American Civil War is upon us."
  usa_new_nc_civil_war_event.1.a: "For the people!"
  usa_new_nc_civil_war_event.1.a.tt: "The democratic supporters start a civil war."
  usa_new_nc_civil_war_event.2.t: "Roosevelt as Acting Leader"
  usa_new_nc_civil_war_event.2.desc: "FDR has been a longstanding member of the political elite in this country and a true friend of the people. He has repeatedly demonstrated his willingness to fight for the rights, liberties, and happiness of the average American against hostile large interests, though many of his more ambitious measures have been struck down by reactionary conservatives. \n\nHowever, with the outbreak of war, he has become somewhat reluctant to openly represent our ideals and to fight against fellow countrymen for them. While this is understandable, it could also be a problem in the future. Nonetheless, we have the option to retain him as the head of the government and as the chief representative of the American people."
  usa_new_nc_civil_war_event.2.a: "Keep Roosevelt"
  usa_new_nc_civil_war_event.2.b: "He's too moderate"
  usa_new_nc_civil_war_event.4.t: "The Second American Civil War"
  #usa_new_nc_civil_war_event.4.desc: "Earlier yesterday, fighting broke out across the United States, centered in the New England region around Maryland and New York. The nationalist communists within the US have risen in opposition to the established democratic government and the Federal government has declared war on them and their ideology. \n\nMajor fighting is taking place in urban centers across the continent, with skirmishes breaking out between armed citizens in major cities and counties on both coasts, in the North and South, within and without communities. Military forces have split between the rival governments. \n\nFrom initial bystander reports, it is clear that the nationalist communists, whose government is currently headquartered in the Savoy Ballroom in New York City, have been preparing for this fight for longer than the legacy government, and therefore it is expected that the revolutionaries may actually come to have the upper hand in this conflict."
  usa_new_nc_civil_war_event.4.desc: "Earlier yesterday, fighting broke out across the United States, centered in the New England region and around Maryland and New York. The nationalist communists within the US have risen in opposition to the established democratic government and the Federal government has declared war on them and their ideology. \n\nMajor fighting is taking place in urban centers across the continent, with skirmishes breaking out between armed citizens in major cities and counties on both coasts, in the North and South, within and without communities. Military forces have split between the rival governments."
  usa_new_nc_civil_war_event.4.a: "The new world is under threat..."
  usa_new_nc_civil_war_event.4.b: "May the people be heard"
  usa_new_nc_civil_war_event.4.c: "Troubling"
  usa_new_nc_civil_war_event.5.t: "Red July"
  usa_new_nc_civil_war_event.5.desc: "With the final capitulation of the old American government, [USA.GetNameDef] rises from the ashes of civil war in its place. The war has caused terrible devastation across the continent and tens if not hundreds of thousands are currently reported to be missing or dead. How this will affect the country going forward remains to be seen, but it would appear that a Red July has dawned over America as its nationalist communists take the reins."
  usa_new_nc_civil_war_event.5.a: "Understood"
  usa_new_nc_civil_war_event.6.t: "Nationalist Communists Defeated in America"
  usa_new_nc_civil_war_event.6.desc: "In an impressive turn of events, the beleaguered American government and military have successfully quelled the nationalist communist uprising across the continent. Thousands lie dead after the bloody civil war, but the country is now finally able to pursue its own course once more."
  usa_new_nc_civil_war_event.6.a: "Understood"
  usa_new_nc_civil_war_event.7.t: "Rise of the United States People's Republic"
  usa_new_nc_civil_war_event.7.desc: "Following the political upheavals brought about by the Great Depression, the United States has transitioned its civilian government towards the ideology of communism. Though the movement elicited fierce conservative resistance, its supporters won over the general public via their staunch patriotism and displays of decency. How this new shift in the political sphere of the New World will affect the global balance of power remains to be seen."
  usa_new_nc_civil_war_event.7.a: "Uh oh..."
  usa_new_nc_civil_war_event.7.b: "Excellent"
  usa_new_nc_civil_war_event.7.c: "Interesting"

# AMERICAN NATIONALIST
  new_usa_an_establish_the_rio_grande_event.1.t: "[FROM.GetNameDefCap] Wishes to Pay Us for our Territory in the Rio Grande"
  new_usa_an_establish_the_rio_grande_event.1.desc: "The [FROM.GetAdjective] government has made it known to us that they wish to purchase our territory in the northeast of Mexico to turn it into a new, independent state. They are offering to pay top dollar for it, too. Should we sell these territories to them?"
  new_usa_an_establish_the_rio_grande_event.1.a: "A good deal"
  new_usa_an_establish_the_rio_grande_event.1.b: "We think not"
  new_usa_an_establish_the_rio_grande_event.2.t: "[FROM.GetNameDefCap] Agree to Sell Us their Territory in the Rio Grande"
  new_usa_an_establish_the_rio_grande_event.2.desc: "The [FROM.GetAdjective] government has accepted our proposal and is ready to transfer full control of these territories to us as soon as we uphold our end of the deal and pay them for the service."
  new_usa_an_establish_the_rio_grande_event.2.a: "Excellent"
  new_usa_an_establish_the_rio_grande_event.2.a_tt: "Creates the §YRio Grande§! in our purchased territories."
  new_usa_an_establish_the_rio_grande_event.3.t: "[FROM.GetNameDefCap] Refuse to Sell Us their Territory in the Rio Grande"
  new_usa_an_establish_the_rio_grande_event.3.desc: "Unfortunately, the [FROM.GetAdjective] government has turned down our offer to purchase their territory."
  new_usa_an_establish_the_rio_grande_event.3.a: "Darn"

  new_usa_an_establish_sonora_event.1.t: "[FROM.GetNameDefCap] Wishes to Pay Us for our Territory Around Sonora"
  new_usa_an_establish_sonora_event.1.desc: "The [FROM.GetAdjective] government has made it known to us that they wish to purchase our territory in the northwest of Mexico to turn it into a new, independent state. They are offering to pay top dollar for it, too. Should we sell these territories to them?"
  new_usa_an_establish_sonora_event.1.a: "A good deal"
  new_usa_an_establish_sonora_event.1.b: "We think not"
  new_usa_an_establish_sonora_event.2.t: "[FROM.GetNameDefCap] Agree to Sell Us their Territory Around Sonora"
  new_usa_an_establish_sonora_event.2.desc: "The [FROM.GetAdjective] government has accepted our proposal and is ready to transfer full control of these territories to us as soon as we uphold our end of the deal and pay them for the service."
  new_usa_an_establish_sonora_event.2.a: "Excellent"
  new_usa_an_establish_sonora_event.2.a_tt: "Creates the §YSonoran State§! in our purchased territories."
  new_usa_an_establish_sonora_event.3.t: "[FROM.GetNameDefCap] Refuse to Sell Us their Territory Around Sonora"
  new_usa_an_establish_sonora_event.3.desc: "Unfortunately, the [FROM.GetAdjective] government has turned down our offer to purchase their territory."
  new_usa_an_establish_sonora_event.3.a: "Darn"

  new_usa_country_roads_through_the_north_event.1.t: "[FROM.GetNameDefCap] Wishes to Purchase the Western Gap From Us"
  new_usa_country_roads_through_the_north_event.1.desc: "The [FROM.GetAdjective] government has made it known to us that they wish to purchase the territory we control between Alaska and the mainland of America. They are offering to pay top dollar for it, too. Should we sell these territories to them?"
  new_usa_country_roads_through_the_north_event.1.a: "A good deal"
  new_usa_country_roads_through_the_north_event.1.b: "We think not"
  new_usa_country_roads_through_the_north_event.2.t: "[FROM.GetNameDefCap] Agree to Sell Us their Territory in the Western Gap"
  new_usa_country_roads_through_the_north_event.2.desc: "The [FROM.GetAdjective] government has accepted our proposal and is ready to transfer full control of these territories to us as soon as we uphold our end of the deal and pay them for the service."
  new_usa_country_roads_through_the_north_event.2.a: "Excellent"
  new_usa_country_roads_through_the_north_event.3.t: "[FROM.GetNameDefCap] Refuse to Sell Us their Territory in the Western Gap"
  new_usa_country_roads_through_the_north_event.3.desc: "Unfortunately, the [FROM.GetAdjective] government has turned down our offer to purchase their territory."
  new_usa_country_roads_through_the_north_event.3.a: "Darn"

  new_usa_an_peace_guarantees_for_neighbors_event.1.t: "[From.GetNameDefCap] Wishes to Establish Mutual Peace Arrangments"
  new_usa_an_peace_guarantees_for_neighbors_event.1.desc: "The [from.GetAdjective] administration has delivered a message to us concerning its intent on securing a ring of peace around itself. The Americans seem to wish for a mutual pact of cooperation and friendship with their surrounding neighbors, no doubt on account of their recent turmoil."
  new_usa_an_peace_guarantees_for_neighbors_event.1.a: "Let us keep the peace"
  new_usa_an_peace_guarantees_for_neighbors_event.1.b: "We don't trust them"
  new_usa_an_peace_guarantees_for_neighbors_event.2.t: "[From.GetNameDefCap] Agrees on a Mutual Peace Agreement"
  new_usa_an_peace_guarantees_for_neighbors_event.2.desc: "The [from.GetAdjective] government has agreed to establish a set of peace accords with us. This will help ensure the continued safety and prosperity of the American people."
  new_usa_an_peace_guarantees_for_neighbors_event.2.a: "Wonderful"
  new_usa_an_peace_guarantees_for_neighbors_event.3.t: "[From.GetNameDefCap] Rejects a Mutual Peace Agreement"
  new_usa_an_peace_guarantees_for_neighbors_event.3.desc: "Disturbingly, the [From.GetAdjective] government has turned down our offer for mutual peace agreements. What this means for the future is unclear, but we may have to watch our backs."
  new_usa_an_peace_guarantees_for_neighbors_event.3.a: "This could be a problem"

  new_usa_an_the_philadelphia_fiasco_event.1.t: "The Philadelphia Fiasco"
  new_usa_an_the_philadelphia_fiasco_event.1.desc: "At [GetDateText], the roof of the new Ambleton Theater in Philadelphia collapsed, killing 72 Americans and wounding 40 more. Immediately following this tragedy, local and state officials began looking into the public works project that created this theater. The project, funded by dozens of Congressmen, involved the development of city parks, subsidies, and relief funds, and it involved the construction of the theater and a new bridge. However, upon closer investigation, it has been discovered that of the millions of dollars that were earmarked for the project's different pieces, the vast majority of them never ended up in the light. Furthermore, significant funds that were able to be traced were found to have ended up in the pockets of businessmen, clerks, officials, and even other Congressmen close to the organizers. The point that has caused the most outrage, however, is the discovery that significant resources that were supposed to have gone into the theater's construction were diverted or retained and its timeline was greatly accelerated by 'overly-generous' stamping of different safety regulations.\n\nIn other words, corrupt federal officials have let their greed run rampant, and now more than 100 Americans have paid for that corruption."
  new_usa_an_the_philadelphia_fiasco_event.1.a: "Our leaders are fools and crooks!"

  usa_new_an_parkerite_act_event.1.t: "The United States Ratifies the 22nd Amendment"
  usa_new_an_parkerite_act_event.1.desc: "Following years of unreliable governance and recent tragedies attributed to widespread corruption in the Federal Government, the US has formally ratified the Parkerite Act, the 22nd Amendment to the Constitution.\nThe act lays out various new rights for the union's individual states. Most notably, it gives states an authoritative veto over all federal projects and federal funding which acts within their jurisdiction. Furthermore, all federal actions taken within a state are subject to full inspection and transparency by that state, which may also append or modify the project accordingly.\n\nIn practice, the Parkerite Act will dramatically shift the governmental balance of power in America."
  usa_new_an_parkerite_act_event.1.a: "The people are in control"
  usa_new_an_parkerite_act_event.1.b: "Interesting"

  usa_new_an_civil_war_event.1.t: "A Second American Civil War"
  usa_new_an_civil_war_event.1.d: "Earlier today, multiple states across the Union have simultaneously put forward official notices of secession. In a townhouse in Richmond, Virginia, representatives from each of these states gathered together to sign a document that has already been months in the making, officially declaring the creation of and their support for a new nation of states. Calling themselves the Free American States, a dozen representatives then took a copy of this document directly to the US capitol at Washington DC. However, upon arrival, the representatives were all arrested and a special session of Congress was called between those states that remained. Within hours, the United States declared war against the Free American States.\n\nWar is now upon this land, and we are under attack. We did everything we could to let the federal government remain in peace, unwilling to strike it down, but now it has come for us! Their treachery and corruption knows no limits. However, this has not surprised us- we knew exactly what their response would look like. Unfortunately for them, we have been preparing."
  usa_new_an_civil_war_event.1.a: "For the Republic!"
  usa_new_an_civil_war_event.1.a.tt: "The democratic supporters start a civil war."
  usa_new_an_civil_war_event.2.t: "The Second American Civil War"
  usa_new_an_civil_war_event.2.desc: "Earlier yesterday, fighting broke out across the United States, centered on the old divide between the North and the South. The American nationalists within the US have once again seceded and the Federal government has declared war on them in response. \n\nMajor fighting is taking place in urban centers across the continent, with skirmishes breaking out between armed citizens in major cities and counties on both coasts, in the North and South, within and without communities. Military forces have split between the rival governments."
  usa_new_an_civil_war_event.2.a: "Not again..."
  usa_new_an_civil_war_event.2.b: "At least they know why they fight"
  usa_new_an_civil_war_event.2.c: "Again?"
  usa_new_an_civil_war_event.3.t: "Golden Dawn"
  usa_new_an_civil_war_event.3.desc: "With the final capitulation of the old American government, [USA.GetNameDef] rises from the ashes of civil war in its place. The war has caused terrible devastation across the continent and tens if not hundreds of thousands are currently reported to be missing or dead.\n\nHow this will affect the country going forward remains to be seen, but it would appear that the states have wrested the reins of power away from the Federal Government."
  usa_new_an_civil_war_event.3.a: "Hopefully this won't be a problem"
  usa_new_an_civil_war_event.3.b: "Understood"
  usa_new_an_civil_war_event.4.t: "American Nationalists Defeated in America"
  usa_new_an_civil_war_event.4.desc: "In an impressive turn of events, the beleaguered American government and military have successfully quelled this second attempt at secession. Thousands lie dead after the bloody civil war, but the country is now finally able to pursue its own course once more."
  usa_new_an_civil_war_event.4.a: "Understood"
  usa_new_an_civil_war_event.5.t: "Rise of the [USA.GetNameDef]"
  usa_new_an_civil_war_event.5.desc: "\nFollowing the political upheavals brought about by the Great Depression, the United States has moved its primary seat of authority away from the central Federal Government and towards the states. What the Confederacy was unable to do 80 years ago, the states and the new administration in DC has now accomplished."
  usa_new_an_civil_war_event.5.a: "Ah..."
  usa_new_an_civil_war_event.5.b: "Understood"

  new_usa_an_americas_rightful_claims_event.1.t: "[FROM.GetNameDefCap] Demands Our Annexation"
  new_usa_an_americas_rightful_claims_event.1.desc: "The [FROM.GetAdjective] government has sent us an ultimatum through our embassy in America. They assert that [THIS.GetNameDefCap] and its territory are among the rightful claims of the American people. They have also demonstrated that they are more than willing to back up these claims.\n\nHow do we respond?"
  new_usa_an_americas_rightful_claims_event.1.a: "We have no choice"
  new_usa_an_americas_rightful_claims_event.1.b: "We will stand firm"
  new_usa_an_americas_rightful_claims_event.2.t: "[FROM.GetNameDefCap] Accepts Our Claim of Annexation"
  new_usa_an_americas_rightful_claims_event.2.desc: "The [FROM.GetAdjective] government has accepted our claim on their territories and have fully submitted their administration to ours."
  new_usa_an_americas_rightful_claims_event.2.a: "Excellent"
  new_usa_an_americas_rightful_claims_event.3.t: "[FROM.GetNameDefCap] Rejects Our Claims"
  new_usa_an_americas_rightful_claims_event.3.desc: "The [FROM.GetAdjective] government has rejected our claim on their territories and have furthered their response by declaring that they are willing to risk war with [THIS.getName] to defend their sovereignty."
  new_usa_an_americas_rightful_claims_event.3.a: "We are not impressed"
  new_usa_an_americas_rightful_claims_event.3.b: "It's not the right time"
  new_usa_an_americas_rightful_claims_event.3.c: "Perhaps we were too ambitious"
  new_usa_an_americas_rightful_claims_event.4.t: "[FROM.GetNameDefCap] Demands Our Subjugation"
  new_usa_an_americas_rightful_claims_event.4.desc: "The [FROM.GetAdjective] government has sent us an ultimatum through our embassy in America. They assert that [THIS.GetNameDefCap] and its territory are among the rightful claims of the American people. They have also demonstrated that they are more than willing to back up these claims.\n\nHow do we respond?"
  new_usa_an_americas_rightful_claims_event.4.a: "We have no choice"
  new_usa_an_americas_rightful_claims_event.4.b: "We will stand firm"
  new_usa_an_americas_rightful_claims_event.5.t: "[FROM.GetNameDefCap] Accepts Our Claim of Subjugation"
  new_usa_an_americas_rightful_claims_event.5.desc: "The [FROM.GetAdjective] government has accepted our claim on their territories and have fully submitted their administration to ours."
  new_usa_an_americas_rightful_claims_event.5.a: "Excellent"
  new_usa_an_americas_rightful_claims_event.6.t: "[FROM.GetNameDefCap] Rejects Our Claims"
  new_usa_an_americas_rightful_claims_event.6.desc: "The [FROM.GetAdjective] government has rejected our claim on their territories and have furthered their response by declaring that they are willing to risk war with [THIS.getName] to defend their sovereignty."
  new_usa_an_americas_rightful_claims_event.6.a: "We are not impressed"
  new_usa_an_americas_rightful_claims_event.6.b: "It's not the right time"
  new_usa_an_americas_rightful_claims_event.6.c: "Perhaps we were too ambitious"

  new_usa_an_americas_rightful_claims_event.7.t: "[FROM.GetNameDefCap] Demands the Annexation of Our American Territories"
  new_usa_an_americas_rightful_claims_event.7.desc: "The [FROM.GetAdjective] government has sent us an ultimatum through our embassy in America. They assert that our holdings in the Americas are among the rightful claims of the American people and they have also demonstrated that they are more than willing to back up these claims by force if necessary.\n\nHow do we respond?"
  new_usa_an_americas_rightful_claims_event.7.a: "It would be wise to avoid war"
  new_usa_an_americas_rightful_claims_event.7.b: "They don't know their place"
  new_usa_an_americas_rightful_claims_event.8.t: "[FROM.GetNameDefCap] Hands Over Their American Territories"
  new_usa_an_americas_rightful_claims_event.8.desc: "The [FROM.GetAdjective] government has accepted our claim on their territories and have fully submitted them to us."
  new_usa_an_americas_rightful_claims_event.8.a: "Excellent"
  new_usa_an_americas_rightful_claims_event.9.t: "[FROM.GetNameDefCap] Rejects Our Claims"
  new_usa_an_americas_rightful_claims_event.9.desc: "The [FROM.GetAdjective] government has rejected our claim on their American territories and they have stated that they are more than willing to cut us down to size if we keep pressing."
  new_usa_an_americas_rightful_claims_event.9.a: "We'll teach the Old World a lesson"
  new_usa_an_americas_rightful_claims_event.9.b: "We worded that wrong"
  new_usa_an_americas_rightful_claims_event.9.c: "They're right..."
  new_usa_an_americas_rightful_claims_event.10.t: "[FROM.GetNameDefCap] Demands the Subjugation of Our American Territories"
  new_usa_an_americas_rightful_claims_event.10.desc: "The [FROM.GetAdjective] government has sent us an ultimatum through our embassy in America. They assert that our holdings in the Americas are among the rightful claims of the American people and they have also demonstrated that they are more than willing to back up these claims by force if necessary.\n\nHow do we respond?"
  new_usa_an_americas_rightful_claims_event.10.a: "It would be wise to avoid war"
  new_usa_an_americas_rightful_claims_event.10.b: "They don't know their place"
  new_usa_an_americas_rightful_claims_event.11.t: "[FROM.GetNameDefCap] Hands Over Their American Territories"
  new_usa_an_americas_rightful_claims_event.11.desc: "The [FROM.GetAdjective] government has accepted our claim on their territories and have fully submitted them to us."
  new_usa_an_americas_rightful_claims_event.11.a: "Excellent"
  new_usa_an_americas_rightful_claims_event.12.t: "[FROM.GetNameDefCap] Rejects Our Claims"
  new_usa_an_americas_rightful_claims_event.12.desc: "The [FROM.GetAdjective] government has rejected our claim on their American territories and they have stated that they are more than willing to cut us down to size if we keep pressing."
  new_usa_an_americas_rightful_claims_event.12.a: "We'll teach the Old World a lesson"
  new_usa_an_americas_rightful_claims_event.12.b: "We worded that wrong"
  new_usa_an_americas_rightful_claims_event.12.c: "They're right..."

  new_usa_an_our_saftey_before_yours_event.1.t: "[FROM.GetNameDefCap] Demands We Accept American Trade Hegemony"
  new_usa_an_our_saftey_before_yours_event.1.desc: "The [FROM.GetAdjective] administration has embarked on a campaign to establish themselves as the titan of trade in the Western Hemisphere. To this effect, they have demanded that [THIS.getName] submit to their new trade laws, which would give them a significant advantage in negotiations and would require us to open our infrastructure to use by their military. In return, the [from.GetAdjective] government would further ensure our safety against foreign forces.\n\nHowever, seeing as how they have previously already upheld their Monroe Doctrine, this is really just a service we now have to give to them for the pleasure."
  new_usa_an_our_saftey_before_yours_event.1.a: "This is in our interest"
  new_usa_an_our_saftey_before_yours_event.1.b: "We won't be bullied"
  new_usa_an_our_saftey_before_yours_event.2.t: "[FROM.GetNameDefCap] Accepts Our Trade Hegemony"
  new_usa_an_our_saftey_before_yours_event.2.desc: "The [FROM.GetAdjective] administration has officially accepted our requirements for [FROM.getName] to increase its trade privileges towards [THIS.GetNameDefCap]. They have also opened their internal infrastructure to our use."
  new_usa_an_our_saftey_before_yours_event.2.a: "Excellent"
  new_usa_an_our_saftey_before_yours_event.3.t: "[FROM.GetNameDefCap] Rejects Our Demands"
  new_usa_an_our_saftey_before_yours_event.3.desc: "The [FROM.GetAdjective] administration has rejected our claims of hemispheric trade hegemony. They are flaunting their refusal in our face with this rejection."
  new_usa_an_our_saftey_before_yours_event.3.a: "How ungrateful..."

  new_usa_an_USA_the_second_confederation_event.1.t: "The First President of the Second Confederation"
  new_usa_an_USA_the_second_confederation_event.1.desc: "As the Confederation takes shape and the central administration of the Confederal government finishes moving into the new capital at Richmond, the first presidential election is already underway. Hundreds of candidates have stepped forward, but the two with the most momentum behind them have shown themselves to be William Dudley Pelley and Smedley Butler.\n\nPelley is putting himself forward as \"America's Fuhrer\", taking after the style and organization of Hitler's regime in Germany. He's charismatic and devoted, though a bit fanatical in some of his views compared to the average American.\n\nButler is a military commander who was nearly previously implicated in an attempted coup against the old regime, and he has now arrived once more at the precipice of the highest office, offering to be a citizen commander for the nation.\n\nAnd the winner is..."
  new_usa_an_USA_the_second_confederation_event.1.a: "William Dudley Pelley"
  new_usa_an_USA_the_second_confederation_event.1.b: "Smedley Butler"
  new_usa_an_USA_the_goldstar_federation_event.1.t: "The First President of the Federation"
  new_usa_an_USA_the_goldstar_federation_event.1.desc: "As the Federation takes shape and the new government reorganizes itself in Washington, the first presidential election is already underway. Many different candidates from across the country have stepped forward and made their play, but the two with the most momentum behind them have shown themselves to be John Aubitz and Robert E. Wood.\n\nAubitz is the recently-famous founder of the Goldstar Network itself, the spiritual backbone of our new governmental structure. A former military engineer and a burgeoning philosopher, his supporters have christened him the \"Goldstar Phoenix.\"\n\nWood is a Wall Street figure with an impressive resume, the former Sears head, and a leading member of the America First movement. His background and connections would likely have well-prepared him for this role.\n\nAnd the winner is..."
  new_usa_an_USA_the_goldstar_federation_event.1.a: "John Aubitz"
  new_usa_an_USA_the_goldstar_federation_event.1.b: "Robert E. Wood"

  new_usa_the_eagle_flies_alone_event.1.t: "[FROM.GetNameDefCap] Moves to Secure Hegemony Over the Americas"
  new_usa_the_eagle_flies_alone_event.1.desc: "The [FROM.GetAdjective] government has begun making overtures about its complete and total dominance in the Americas, declaring that their will is to reign absolute over the hemisphere. Following these declarations, they have sent direct signals to the [ROOT.GetAdjective] administration and leadership demanding that we comply with their control and authority, or else."
  new_usa_the_eagle_flies_alone_event.1.a: "We will recognize their authority"
  new_usa_the_eagle_flies_alone_event.1.b: "We will not submit"
  new_usa_the_eagle_flies_alone_event.2.t: "[FROM.GetNameDefCap] Recognizes our Authority"
  new_usa_the_eagle_flies_alone_event.2.desc: "The [FROM.GetAdjective] state has officially and publicly recognized our position as Hegemon of the West, and they have agreed to the terms we have sent them as concerns trade and industrial cooperation and joint security."
  new_usa_the_eagle_flies_alone_event.2.a: "Excellent"
  new_usa_the_eagle_flies_alone_event.3.t: "[FROM.GetNameDefCap] Rejects Our Claims"
  new_usa_the_eagle_flies_alone_event.3.desc: "The [FROM.GetAdjective] state has defied us, stating that they refuse to yield to [ROOT.GetAdjective] pressure and would rather fight to preserve their status quo."
  new_usa_the_eagle_flies_alone_event.3.a: "They will not escape us"
  new_usa_the_eagle_flies_alone_event.3.b: "We will remember this"

  usa_new_an_song_for_the_horizon_event.1.t: "[FROM.GetNameDefCap] Declares Intentions for \"the Great Manifest Destiny\""
  usa_new_an_song_for_the_horizon_event.1.desc: "\nThe [FROM.GetAdjective] government has announced a new initiative. A \"Song for the Horizon,\" as they call it, will apparently see the [FROM.GetAdjective] people extending their influence and domination across the entire world. What this will actually mean in practice is yet to be seen.\n\nThe [ENG.GetAdjective], [GER.GetAdjective], [JAP.GetAdjective], [SOV.GetAdjective], and other governments have responded with varying degrees of dismay, dismissal, or denouncement various world leaders have begun to seek preemptive solutions to this possible new threat.\n\nIf the Americans are serious, their song may be the anthem of a new, larger conflict."
  usa_new_an_song_for_the_horizon_event.1.a: "Saddle up!"
  usa_new_an_song_for_the_horizon_event.1.b: "God help us all..."

