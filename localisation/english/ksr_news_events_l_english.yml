l_english:
 #KSR 1.0.0
 ksr_news.1.t:0 "Return of [LIT.GetName]"
 ksr_news.1.desc:0 "The vigorous legend that was Grand Duke Algirdas took Eastern Europe by storm in the 14th century. After besieging Moscow several times with his armies, Algirdas went down in history as the creator of the largest Lithuanian state in history. Albeit ruled by a small Baltic Lithuanian tribe, this state was a direct rival of Muscovy, the predecessor of Russia. The Grand Duchy of Lithuania was finally absorbed by Russia in 1795.\n\nWith the return of the ducal government in Vilnius, many believe that the Lithuanians are once again trying to restore their rule over the Slavs of Eastern Europe. Their further progress is anybody's guess."
 ksr_news.1.a:0 "Long live the legend of the Iron Wolf."
 ksr_news.1.b:0 "Why would they need Poland anyway?"
 ksr_news.1.c:0 "They will be absorbed once again."
 
 ksr_news.2.t:0 "[LIT.GetNameDef] restores control over Vilnius"
 ksr_news.2.desc:0 "[LIT.GetLeader] had congratulated the citizens of Vilnius today on their city finally rejoining the fatherland. The government had already begun preparing to move all head institutions back to the city.\n\nLithuania had lost it's historical and de jure capital Vilnius to an advancing Polish army lead by Żeligowski in 1920. Since then, Vilnius and it's surroundings have been a disputed area and accumulated to the overall worst period of Polish-Lithuanian relations in centuries.\n\nIt is unsure how this will impact further relations between Lithuanians and Poles, but according to analysts this is most probably not the last time that borders in Eastern Europe are being redrawn."
 ksr_news.2.a:0 "Grand Duke Gediminas' city is back."
 ksr_news.2.b:0 "We will not forget Wilno."
 ksr_news.2.c:0 "Good for them."
 
 ksr_news.3.t:0 "[KOR.GetName] Declares Independence"
 ksr_news.3.desc:0 "[KOR.GetLeader] has announced to a massive cheering crowd in [KOR.capital.GetCapitalVictoryPointName] today the birth of [KOR.GetNameDef] - a newly established independent state on the Korean peninsula. With endorsement from the American government, the Koreans have finally achieved full sovereignity with security guarantees from their former administrators. The nation is happy to no longer be under the gruelling occupation of the Japanese imperialists.\n\nWhile the Koreans celebrate an astonishing political victory for their nation, there is growing worry by democratic world leaders that the newly established [KOR.GetNameDef] is still vulnerable to foreign influence and expansion."
 ksr_news.3.a:0 "A new dawn for Korea!"
 ksr_news.3.b:0 "They need protection..."
 
 ksr_news.4.t:0 "DPRK Declares Independence"
 ksr_news.4.desc:0 "[DPK.GetLeader] gave a patriotic speech to his fellow countrymen and a strong message to foreign communist diplomats today - the global Marxist movement is now joined by [DPK.GetNameDef]. Supervised by strong foreign military administration, [DPK.GetLeader] has managed to gain enough trust to rule over the Korean workers with his new communist state.\n\nEven though there are already alarming reports of disloyal dissidents and other unaligned political activists being detained, the Korean people are slowly starting to accept communist governance in this area of former occupation. Whether [DPK.GetLeader] will be a strong communist figurehead remains to be seen."
 ksr_news.4.a:0 "Korean workers join the revolution!"
 ksr_news.4.b:0 "From one oppressive regime to another."
 
 ksr_news.5.t: "Formation of [FROM.GetNameDef]"
 ksr_news.5.desc: "[FROM.GetLeader] has announced to the cheering crowds in [FROM.CAPITAL.GetCapitalVictoryPointName] that the region of New England will now stand as one nation and will represent all of the original six states of Connecticut, Maine, Massachussetts, New Hampshire, Rhode Island and Vermont as a strong unitary state.\n\nThe main streets of [FROM.CAPITAL.GetCapitalVictoryPointName] are now covered with flags of the symbolic New Englander tree, representing the state's beautiful nature and landscape. Ever since the first Pilgrim colonies in 1620, New England has been a unique, European-like cultural region compared to the rest of the union. With strong education, industry and maritime presence, New England's future seems bright."
 ksr_news.5.a: "Nunquam libertas gratior extat."
 ksr_news.5.b: "Happy Pilgrims."
 ksr_news.5.c: "Our enemy is renovating?"