l_english:
# Modular localizations
    USA_homeland_defense_emergency_act_focus-general_title: "Homeland Defense Emergency Act"
    USA_homeland_defense_emergency_act_focus-general_desc: "The shores of America have been breached; the enemy has stepped foot on our land. We will not accept this state of affairs, nor will we allow those set against us to wage war against our people in their homes. They shall be repelled by any means necessary. The American people will rise up to throw them out!\nThe home of the brave shall remain the land of the free!"

    USA_coordinate_militia_defenses-general_title: "Coordinate Militia Defenses"
    USA_coordinate_militia_defenses-general_desc: "Millions of American citizens have answered the call to arms and are already doing what they can to mobilize against the invaders, but they are presently acting independently and without a greater cohesion. We need to reach out to our people now and begin organizing their collective spirits into a singular will."

    USA_establish_strongholds_in_the_rockies-general_title: "Establish Strongholds in the Rockies"
    USA_establish_strongholds_in_the_rockies-general_desc: "The natural mountain geography we enjoy in the West will serve us well as a wall that will cut off the advance of our foes. We don't intend to let them get that far, but should some salient reach the Rockies, they will obliterate themselves against our resolve."

    USA_the_mississippi_bastions-general_title: "The Mississippi Bastions"
    USA_the_mississippi_bastions-general_desc: "Running the whole length of the Mississippi, we will establish formidable defenses that will stall any foe. The lifeline of the Midwest will be the lifeline of the republic."

    USA_evacuate_civilians_and_industry-general_title: "Evacuate Civilians and Industry"
    USA_evacuate_civilians_and_industry-general_desc: "We must rapidly evacuate everything we can from those regions that are most at risk of being besieged or captured by the enemy. We can't afford to stall or lie idle, we need to act while we still can."

    USA_launch_the_counteroffensive-general_title: "Launch the Counteroffensive"
    USA_launch_the_counteroffensive-general_desc: "It is time to retaliate and reclaim our lands and captured people. Our backs are secure, and in front of us we will destroy whatever stands in our way."

    USA_spirit_of_defiance-general_title: "Spirit of Defiance"
    USA_spirit_of_defiance-general_desc: "We are no mere backwater nation ripe for the taking- ours is the land of the free and the home of the brave! Let there be a rifle behind every blade of grass, a blade under every roof, and bravery that defies the odds in every heart and mind. Our enemy will come to understand the impossible nature of the task they have set out upon."

    USA_regional_strategic_commands-general_title: "Regional Strategic Commands"
    USA_regional_strategic_commands-general_desc: "In order to better secure our vast homeland and provide unassailable hurdles for our attackers, we will establish regional strategic commands that can closely support and coordinate their local defensive operations and make way for decisive counterpushes. Each command will be a bastion for our leadership and a source of refuge for our hurt and injured soldiers and civilians."

    TBA_TT: "§CTO-COMPLETE§!"

    USA_AN_FREE_ALL_V_tt: "\nAll §9Sectors§! suffer a §Rslight penalty§! §Y([?FREE_points_V])§!."
    USA_AN_FREE_ALL_VV_tt: "\nAll §9Sectors§! suffer a §Rsizeable penalty§! §Y([?FREE_points_VV])§!."
    USA_AN_FREE_ALL_VVV_tt: "\nAll §9Sectors§! suffer a §Rsevere penalty§! §Y([?FREE_points_VVV])§!."

#    Stealth / Fake / Side-Message Focuses
    USA_SM_NC_decrease_conservative_resistance: "Conservative Resistance"

# Other
    USA_government_de_intervention: "Government De-Intervention"
    USA_government_de_intervention_desc: "The Great Depression struck hard and fast less than a decade ago, and its consequences remain stifling. However, the government response to it has not improved our situation but made it worse. In order to fix the problem, we must start by halting further harm."

    USA_repeal_the_new_deal: "Repeal the New Deal"
    USA_repeal_the_new_deal_desc: "FDR's plan to fix the country by taking over general control of it has not shown promise. Housing is needed, but isn't being built, food is being left to spoil as Americans go hungry, and populated areas have their savings sent to irrelevant backwaters. These policies sounded nice but must continue no longer."

    USA_market_information_authority: "Establish the MIA"
    USA_market_information_authority_desc: "In order to maximize the ability of individuals to make wise and well-informed decisions within the market, the Market Information Authority will be established to provide a general and all-encompassing series of updates on the state of the whole economy, allowing sellers to find buyers and vice versa."

    USA_reorganize_the_fed: "Reorganize the Fed"
    USA_reorganize_the_fed_desc: "For decades, the federal government has slowly encroached more and more upon the private lives and activities of our citizens. At the same time, new ideologies have begun to take root that are disrupting the affairs of the government. A general reorganization is necessary."

    USA_glass_act: "Glass Act"
    USA_glass_act_desc: "The Glass Act will see every non-security related expenditure and internal plan of the federal government fully disclosed to the public and in a form which doesn't read like ancient latin. If every individual bureaucrat can be scrutinized by those who are paying his salaries, less corruption will ensue."

    USA_doge: "DOGE"
    USA_doge_desc: "The Department of Governmental Efficiency will see to it that no part of the fed is needlessly wasting resources on useless endeavors, pet projects, or spendthrift civil servants."

    USA_double_down: "Double Down on the Constitution"
    USA_double_down_desc: "The founding ideals of this country are what set it apart. Entropy has naturally drifted the US away from some of its high goals, but all it needs is a correction and to have its sights once again set on becoming the grand city on a hill for the world to look up to."

    USA_innovation_prizes: "Innovation Prizes"
    USA_innovation_prizes_desc: "Outside of direct military application, government subsidies don't help industries in the long run. Stagnation always follows free money. However, incentivizing the development of in-demand technology would go a long way, and the practice would become more pronounced if a war were to break out as well."

    USA_spurred_growth: "Spurred Growth"
    USA_spurred_growth_desc: "The Depression has done great damage to the country, but the people of America are strong! By pushing forward and staying the course, our people have begun to recover from this tragedy. If we focus our efforts on providing a level and effective playing field, we can ensure that our industries recover in record time."

    USA_american_excellence: "American Excellence"
    USA_american_excellence_desc: "If Americans are needed to fight the wars of this world, they shall do so with the utmost skill, equipped with the most modern weapons, bolstered by the greatest leaders, all to save the blood of our sons in the pursuit of the world's freedom."

    USA_american_juggernaught: "American Juggernaut"
    USA_american_juggernaught_desc: "The might of the United States of America shall be placed behind our sons in uniform. Wherever our troops find themselves, the full strength of the Arsenal of Democracy shall stand with them, and the enemies of freedom will be defeated soundly."

    USA_natural_recovery: "Natural Recovery"
    USA_natural_recovery_desc: "The American economy has naturally recovered on its own, the industrial strain inflicted by the Great Depression now healed, and the cultural shocks now beginning to fade from memory. Thanks to this recovery, the United States of America once again stands strong in the world, its place secure... and perhaps the world will soon be in need of this firm foundation."
    USA_natural_recovery_tt: "\nIt will still take more than a §Ryear§! before the country will be able to resume full growth, though if needed the government could attempt to step in and give aid to certain sectors in a little more than §Rhalf a year§!."

    USA_accelerated_recovery: "Accelerated Recovery"
    USA_accelerated_recovery_desc: "The American people are quickly putting their lives back together, but the world will not wait for us to feel ready to rejoin it. We will utilize limited inflation to jumpstart the activities of business and bring our industry back sooner rather than later."

    USA_eagle_of_the_free_market: "Eagle of the Free Market"
    USA_eagle_of_the_free_market_desc: "The economic excellence of the American people has long been known to be among the greatest in the world. Left to their own devices, American business and industry, as well as our foreign friends and allies, have reawakened the full might of the USA, now further bolstered by the years we've recovered from."

    USA_timely_intervention: "Timely Intervention"
    USA_timely_intervention_desc: "The Great Depression has effectively ended completely in the United States. Across the world, fires are beginning to burn brighter and brighter, and the mighty arsenal of democracy remains cold. We need to bring our industrial base online now, even if it wouldn't be the most efficient option available- the world isn't leaving us the option."
    USA_school_funding_used: "School Funding"
    USA_school_funding_used_desc: "American students and researchers can be greatly benefitted from resources from private funding and specific government investment. These systems will be extremely effective in the long run."

    USA_national_curiosity_journal: "National Curiosity Journal"
    USA_national_curiosity_journal_desc: "Investing into a community of scholars, inventors, tinkerers, engineers, and scientists that will inspire new projects and breakthroughs can only serve to benefit the country. Not only can we better combat the Great Depression with the help of new methods of production and new goods, but our armed forces will benefit from having a brighter population supporting them."

    USA_reborn_american_philanthropy: "Reborn American Philanthropy"
    USA_reborn_american_philanthropy_desc: "The general state of the American economy has recovered to the point that the American culture of philanthropy is quickly reawakening. Independent donations, community kindness, and charity organizations are growing daily, and our society and industry are benefitting."

    USA_lowered_taxes: "Lowered Taxes"
    USA_lowered_taxes_desc: "Government expansion keeps demanding higher and higher taxes. Though it won't allow for the same ramp up of government response in the event of an emergency, it will allow for a healthier natural growth of the economy."

    USA_infrastructure_projects: "Infrastructure Projects"
    USA_infrastructure_projects_desc: "Significant institutions have already been put in place for building infrastructure across the country. Continuing these works where useful would benefit the country."

    USA_retirement_stocks: "Retirement Stocks"
    USA_retirement_stocks_desc: "Huge amounts of citizens' money have been put into social security for future use. However, rather than just let it collect interest over time, let's put these funds into the stock market, allowing them to be periodically withdrawn as well."

    USA_repeal_smoot_hawley: "Reverse Smoot-Hawley"
    USA_repeal_smoot_hawley_desc: "Debatably the real start of the Great Depression, these sanctions on trade collapsed the world economy overnight and devastated both the US market and dozens of foreign markets along with it. Though it will be unpopular for many, we ought to work to undo these sanctions and reopen the American market to the world as best we can."

    USA_state_federal_joint_research_initiative: "State-Federal Joint Research Initiative"
    USA_state_federal_joint_research_initiative_desc: "Innovation is a natural part of American culture, and all sorts of initiatives are taken all the time at every level. If we can coordinate these existing projects so that they share insights and skills, the progress of all projects could be drastically improved."

    USA_us_science_network: "US Science Network"
    USA_us_science_network_desc: "Focusing our scientific investments into concentrated projects will improve our ability to develop new technologies at the cutting edge of research."

    USA_national_statistics_department: "National Statistics Department"
    USA_national_statistics_department_desc: "Expanding the MIA with a team to go about and collect data from across the country will better the ability of consumers, employees, and employers to find niches in the market and make excellent choices."

    USA_gradual_subsidy_relief: "Gradual Subsidy Relief"
    USA_gradual_subsidy_relief_desc: "Various programs are in effect to alleviate the pressures on farmers and other producers, but the results have not met with expectations. Americans are hungry and poor while food is burned in the field. Though it will have some biting short-term effects, a calm and gradual release of the wide subsidies of recent years will help to restore the balance of the market."

    USA_medical_reform: "Medical Reform"
    USA_medical_reform_desc: "Removing restrictions of doctors' licenses and removing federal involvement with established medical systems will allow the best and the ready to act in the medical industry."

    USA_international_free_markets: "International Free Markets"
    USA_international_free_markets_desc: "Thanks to the reopening of the US to the world market, the American economy and the rest of the world are recovering quickly. Though the damage will take more time to fully resolve, the natural wealth and stunning strength of the US is already bearing fruit."

    USA_oss_expansion: "OSS Expansion"
    USA_oss_expansion_desc: "Development of our intelligence agency will be paramount to keep up in the modern world, and the Office of Strategic Services will safeguard the secrets of America."

    USA_defense_focus: "Defense Focus"
    USA_defense_focus_desc: "Our strategic services will put their efforts into safeguarding the US and her people."

    USA_offense_focus: "Offense Focus"
    USA_offense_focus_desc: "Our strategic services will put their efforts into delving into the affairs of foreign states."

    USA_wartime_intelligence_operations: "Wartime Intelligence Operations"
    USA_wartime_intelligence_operations_desc: "The US is now at war, and our intelligence services are now needed desperately to defend our military interests while investigating theirs. The OSS must be at peak effectiveness in order to disrupt the actions of our enemies."

    USA_rose_club: "Rose Club"
    USA_rose_club_desc: "The Rose Club is a special service within the intelligence agency dedicated to defending against and promoting resistance organizations. Its existence will be kept quiet and its operatives will remain even quieter."

    USA_industrial_recovery: "Industrial Recovery"
    USA_industrial_recovery_desc: "With the dollar regaining its value, jobs growing again and workers finding pay, the gears of industry are whirring back to life."

    USA_dynamism_unlocked: "Dynamism Unlocked"
    USA_dynamism_unlocked_desc: "The economy has recovered to the point that it is operating close to normal again. Were a crisis to strike again, we now have the momentum necessary to respond well. The American people will continue to rebound from their lost years and restore the country to its former prosperity!"

    USA_treaty_of_international_reconciliation: "Treaty of International Reconciliation"
    USA_treaty_of_international_reconciliation_desc: "The damage caused by our initial tariffs strained many of our diplomatic relationships. Let's try and fix this situation by bringing together our friends and allies and reconciling our defensive actions against each other."

    USA_industrial_expansion: "Industrial Growth"
    USA_industrial_expansion_desc: "US industry is booming and returning to its old rates of expansion. New industries seem to rise every week, and the base of our industrial might never ceases to improve."
    USA_industrial_expansion_tt: "§YUnlocks§! the §Y$USA_general_motors$§! industrial concern."

    USA_wartime_economy: "Wartime Economy"
    USA_wartime_economy_desc: "The world is on fire and our stronghold of democracy will not remain so isolated from the flames. Already, embers dash towards us and threaten to light North America ablaze, so we must ready to fight the fire."

    USA_oil_industry_development: "Oil Industry Development"
    USA_oil_industry_development_desc: "In the interest of bolstering the country's ability to extract and produce resources necessary for war, a special attention should be given to domestic synthetics. This will give us a native production of items required to produce modern vehicles and to allow them to continue fighting."

    USA_energy_industry_investment: "Energy Industry Investment"
    USA_energy_industry_investment_desc: "As our industry continues to grow and advance, we are in need of ever-increasing amounts of energy. America holds more than enough resources to see this expansion through, we just need to start tapping our reserves."

    USA_strategic_focus: "Strategic Focus"
    USA_strategic_focus_desc: "With the economy now moving once again, it is necessary to tool our expectations and policies towards anticipating conflict in the near future. Perhaps a bolstered defense will keep us safe, but it may also become necessary to reach out and help our friends. In either case, we need to prepare for the eventuality."

    USA_domestic_focus: "Domestic Focus"
    USA_domestic_focus_desc: "This country was built on the backs of hardworking individuals, and once again it has risen against the odds through the hard work of those same individuals. We must do what we can to further facilitate the progress and growth of our state, for the benefit of our citizens. It will be through our own native strength that we will stand firm."

    USA_the_east: "The East"
    USA_the_east_desc: "The heartland of the United States has numerous sites of activity that are yet to fully regain their strength since the market crash. Directing focus to these centers and attending to the needs of the dense populations will be more than worthwhile."

    USA_the_west: "The West"
    USA_the_west_desc: "All across the frontier and reaching to the far coast of the continent, the Great Depression has borne terrible maladies for our people. General investment into the regions most affected will aid in them returning to their former strength more effectively."

    USA_shipping_industry: "Shipping Industry"
    USA_shipping_industry_desc: "With the shutting down of international trade and the Great Depression wreaking havoc on every sector of the economy, our shipping industry has been hit from all sides at the same time. Now that funds are once again flowing, coordinating their effect on our maritime sector would be well-timed."
    USA_shipping_industry_tt: "Having §YFree Trade§! will make this focus more impactful"

    USA_consumer_market: "Consumer Market"
    USA_consumer_market_desc: "As prosperity returns, so does the efficiency and productivity of America's workers. With renewed wealth, consumer products are once again flying off the shelves and civilian industry is growing to match pace."

    USA_military_spending_adjustment: "Military Spending Adjustment"
    USA_military_spending_adjustment_desc: "Given rising tensions in the world, it would be unwise to further shrink our military's size. However, budget cuts are necessary where there is fat holding up the works."

    USA_deregulation: "Deregulation"
    USA_deregulation_desc: "It is the natural cycle of government to increase control over time, but quite often these new measures are counterproductive and hinder growth. Removing various parts of government expansion from recent years will help to alleviate wholly avoidable pressures."

    USA_general_advancement: "General Advancement"
    USA_general_advancement_desc: "Tuning our efforts to a singular, narrow task risks missing out on the dynamic potentials open to us, ones that both our allies and our enemies may take advantage of. A general investment into the development of our industries and capabilities will serve us better in the long run."

    USA_coordinated_advancement: "Coordinated Advancement"
    USA_coordinated_advancement_desc: "While any inquisitive mind can take a look at the world and see the obvious ways in which it could be changed, it is those special insights that dramatically change the world which are so rare. Focusing on pursuing those more fantastical ideas of advancement will be our method of getting ahead."

    USA_civilian_industry_investment: "Civilian Industry Investment"
    USA_civilian_industry_investment_desc: "Investing into the light machinery used in producing most consumer goods would benefit the country."

    USA_military_industry_investment: "Military Industry Investment"
    USA_military_industry_investment_desc: "Investing into the heavy machinery used in the military industry would be a wise move."

    USA_housing_reform: "Housing Reform"
    USA_housing_reform_desc: "By providing support for design and zoning regulations across the country, we can relax the stress imposed by red tape on housing developments. When people are secure at home, their output and outlook improve."

    USA_engineering_grants: "Engineering Grants"
    USA_engineering_grants_desc: "The bridges, dams, and engines of tomorrow are sitting in some engineers' notebooks today. Let's fund those notebooks."

    USA_school_of_mines: "School of Mines"
    USA_school_of_mines_desc: "The Colorado School of Mines is a long-standing, illustrious institution which produces some of our best engineers. With an ever growing need for high-quality engineers, investment in this college has the potential to pay great dividends down the line."

    USA_banking_reform: "Banking Reform"
    USA_banking_reform_desc: "The economic crash that first led to the Great Depression originated from a problem in credit lending in the banks and stock market bubbles. The stock market has yet to recover, but helping banks return to fluidity and promoting sound lending strategies will help reinvigorate the people's trust in them."

    USA_stock_market_invigoration: "Stock Market Invigoration"
    USA_stock_market_invigoration_desc: "With the reawakening of the American market and the return of international trade, the prosperity borne of the stock market can also return to normalcy for people all over the world."

    USA_global_charity: "Global Charity"
    USA_global_charity_desc: "With America's foreign markets open once again, those countries open to our trade are ripe to be invested in by the American people once again."

    USA_foreign_funds: "Foreign Funds"
    USA_foreign_funds_desc: "The reopening of America to the world means that it is ripe for foreign investment once again. The best funds in the world will flow into the country soon."
    USA_foreign_funds_decisions_unlock_tt: "Unlocks §Ydecisions§! to perform §Ymutual investments§! with other countries."

    USA_trade_recovery: "Trade Recovery"
    USA_trade_recovery_desc: "With resources now flowing through the market as they used to, those industries that were shut down by the Great Depression have returned in full force, now able to resume their growth and benefit international trade."

    USA_consumerism: "Consumerism"
    USA_consumerism_desc: "The free market of the United States of America is focusing its growth and investment towards the material prosperity of the people. American citizens' individual wealths are far exceeding all previous standards, and an air of consumerism is now taking the national spotlight."

    USA_advanced_industrialization: "Advanced Industrialization"
    USA_advanced_industrialization_desc: "Focusing the development of our industry towards the future and improving its ability to tackle the largest projects is paramount to securing a permanent position as the world's most advanced and able economy."

    USA_spending_reform: "Spending Reform"
    USA_spending_reform_desc: "The way that resources ought to be used by the country and its administration need to be curtailed so that spending is done effectively. This will be very unpopular and will upset many people, but the long-term benefits outweigh those complaints."

    USA_grand_industrialization: "Grand Industrialization"
    USA_grand_industrialization_desc: "The expanding economic power of the people is beginning to make valuable those vast tracts of land that have so far remained dormant, and those places where infrastructure is already established are being improved in value themselves. The industrial might of this nation grows ever further."

    USA_awoken_economy: "Awoken Economy"
    USA_awoken_economy_desc: "The booming market benefits us and our allies, and the growth of America's economic might is a beacon to all other peoples who would wish to share in our prosperity."
    USA_awoken_economy_tt: " The US receives §Ytwo§! factories for every faction member."
    USA_awoken_economy_no_fac_tt: " Every faction member will receive §Yinvestment§!."

    USA_world_industrial_superiority: "World Industrial Superiority"
    USA_world_industrial_superiority_desc: "No nation has enjoyed the economic and industrial might and wealth that we now possess. Leading the world in material excellency, we stand as a bright city on a hill and an inspiration for everyone to see what is possible."

    USA_state_action_reduction: "State Action Reduction"
    USA_state_action_reduction_desc: "Every dollar Washington wastes is a dollar squeezed from a working man's pocket. We'll spend less and spend smarter."

    USA_reform_the_defense_act: "Reform the Defense Act"
    USA_reform_the_defense_act_desc: "Reviewing and modernizing America's armed forces is becoming an ever more apparent need as the situation in the world deteriorates."

    USA_westpoint_expansion: "Westpoint Expansion"
    USA_westpoint_expansion_desc: "The officer corps of the USAA is the key to success on the battlefield, and having the best officers we can and having enough of them will be crucial to withstanding future conflicts."

    USA_recruitment_drive: "Recruitment Drive"
    USA_recruitment_drive_desc: "An army on paper doesn't win wars. We need boots, and we need them by the thousand."

    USA_officer_focus: "Officer Focus"
    USA_officer_focus_desc: "Being the leaders on the ground, the officers of the USAA should receive top priority in doctrine design and investment."
    #USA_officer_focus_tt: "Taking an above focus will reduce the time this focus takes by §G14§! days each."

    USA_soldier_focus: "Soldier Focus"
    USA_soldier_focus_desc: "The man on the ground is the one that does the actual fighting, and they derive from the greater American people as a whole. They should receive special attention to make sure they are able to act at the top of their ability."

    USA_international_armed_forces_study: "International Armed Forces Study"
    USA_international_armed_forces_study_desc: "As we determine the best course forward for the revitalization and modernization of our forces, it would be especially prudent to see what advances have been made by others. A wise man learns from mistakes; the wiser man learns from others' mistakes."

    USA_joint_action: "Joint Focus"
    USA_joint_action_desc: "An army requires both its soldiers on the ground and the officers that lead them. Without the thorough cooperation and coordination of both, any force will suffer."

    USA_doctrine_development: "Doctrine Development"
    USA_doctrine_development_desc: "Fighting has changed since the Great War, and our army must be kept up to date in all the best forms of dealing with those changes."

    USA_strategy_development: "Strategy Development"
    USA_strategy_development_desc: "Wars are fought at a high level, and they must be approached from the top down. Each battle is important only in so far as it advances an overall strategy. The final objectives of an assault are determined via precise formulations of war doctrine."

    USA_tactics_development: "Tactics Development"
    USA_tactics_development_desc: "When the bullets start flying, the coordination and planning of an army become the only thing that matters. When the objectives are clear, victory is in sight. An army that knows how to win the smaller battles is one that can try to take on the whole fight."

    USA_battle_logistics: "Battle Logistics"
    USA_battle_logistics_desc: "From the commander's perspective, war is about strategy and outthinking your opponents. However, in the midst of battle, the only thing that matters is survival and victory. Ensuring our troops' morale is high and their rifles are loaded will help keep them safe and victorious."

    USA_promote_heroism: "Promote Heroism"
    USA_promote_heroism_desc: "Americans have a long tradition of heroics, whether in their normal lives or on the battlefield, and often it is the actions of one valiant man or squad that secures a hard fought fight. Our administration should not hold back praising these excellent showings and promoting the courageous spirit of our heritage."

    USA_force_modernization: "Force Modernization"
    USA_force_modernization_desc: "Though America has not sat idly by for the past two decades, our military is still behind the times. New innovations are arising in speed, mobility, and armor, and the US is poised to take advantage of these technologies and ideas, should it choose to."
    USA_force_modernization_tt: "§YUnlocks§! the §Y$detroit_arsenal$§! Military Industrial Organization."

    USA_special_service_branch: "Special Service Branch"
    USA_special_service_branch_desc: "With fighting becoming more and more specialized and soldiers being organized more and more tightly, the role of a special forces branch starts to become clear. Our soldiers will be expected to fight in new and extreme circumstances, and top-level training and planning will help prepare our best for whatever they'll deal with."

    USA_spec_ops: "Spec Ops"
    USA_spec_ops_desc: "Within the realm of advanced operations, there exists a cutout for a set of men tasked with doing the impossible. These special operations require operators of extraordinary skill and courage to accomplish, and luckily we are in no short supply."

    USA_mechanization_initiative: "§RMechanization Initiative§!"
    USA_mechanization_initiative_desc: "Powerful armored vehicles have the potential to deliver crushing blows to our opponents. Developing the technology necessary to wield such a weapon is crucial."

    USA_advanced_tank_designs: "Advanced Tank Designs"
    USA_advanced_tank_designs_desc: "With domestic armor knowledge spreading rapidly and growing in maturity, it would be prudent to put extra attention into perfecting the field and ensuring a competitive edge against any adversary in this domain."
    USA_advanced_tank_designs_tt: "§YUnlocks§! the §Y$tank_destroyer_board$§! Military Industrial Organization."

    USA_logistical_focus: "Logistical Focus"
    USA_logistical_focus_desc: "He who has the better logistics isn't guaranteed to win, but he whose logistics fail first is guaranteed to lose, and we don't intend on placing second."

    USA_art_of_war: "Art of War"
    USA_art_of_war_desc: "By honing our methods of doctrinal analysis and design, we can better prepare ourselves for the moments where all of our hard work and plans inevitably fly out the window. Building up methods of problem solving will always be useful, however, and planning will fill in the gaps for wrecked plans."

    USA_democracys_vanguard: "Democracy's Vanguard"
    USA_democracys_vanguard_desc: "The people of the United States of America hold an indomitable spirit. Though war may be far from our shores, we owe it to humanity to hold their righteous struggles close to our hearts. We now call on our great people to rise to the occasion and hold the line, wherever it may be drawn."

    USA_kittyhawk_exhibition: "Kittyhawk Exhibition"
    USA_kittyhawk_exhibition_desc: "The United States was first in flight, and we've remained at the cutting edge of aviation for decades. However, since the Great Depression, our spirit has been hit hard. Putting on an air show with all of our best pilots and greatest aircraft could revitalize that part of our will and provide some much needed levity for our people."
    USA_mastery_bonus_kittyhawk_exhibition_tt: "$USA_kittyhawk_exhibition$"

    USA_air_training: "Air Training"
    USA_air_training_desc: "In order to fly well, it isn't enough to have modern equipment, you must also be capable to use it. What matters more than the plane is the pilot, and despite setbacks we still have the resources to keep our people operating at the top of their level."
    USA_mastery_bonus_air_training_tt: "$USA_air_training$"

    USA_american_designs: "American Designs"
    USA_american_designs_desc: "Improving the quality of our airpower is paramount to remaining competitive in warfare and defense. The rest of the world is making strides and advances around us, and we can't let ourselves fall behind."

    USA_cutting_edge_aircraft: "Cutting-Edge Aircraft"
    USA_cutting_edge_aircraft_desc: "Top-of-the-line aircraft will give our pilots the best chances of coming home alive while making sure their opponents don't. Integrating the learned experiences and insights of our own experts and those of foreign nations will give us a keen advantage in designing the next generation of aerial technologies."

    USA_foreign_aircraft_innovations: "Foreign Aircraft Innovations"
    USA_foreign_aircraft_innovations_desc: "It isn't enough to approach a fight or task from just one angle. No matter how effective and competent you are, no one person can see the whole picture, nor can one group of engineers win every design race in isolation. Learning from the advances made by others will further those we ourselves can achieve."

    USA_british_design_focus: "British Design Focus"
    USA_british_design_focus_desc: "In studying foreign plane development, we should take special note of those effective strategies and technologies invented by our neighbors across the pond. British aerospace has produced top-of-the-line engines and safety-oriented flying techniques that will benefit our pilots."

    USA_german_design_focus: "German Design Focus"
    USA_german_design_focus_desc: "In studying foreign plane development, we should take special note of those effective strategies and technologies invented by the power of Germany. Love or hate their style of engineering design, German aerospace pioneers are developing new methods of integrating airpower in mission support roles and their air force is excelling in the training of individual pilots; ideas and methods we could take note of."

    USA_japanese_design_focus: "Japanese Design Focus"
    USA_japanese_design_focus_desc: "In studying foreign plane development, we should take special note of those effective strategies and technologies invented by the rising Japanese Empire. Their formidable tradition and military culture have resulted in aviation priorities revolving around excellence in combat, and their pilots are trained to embody that heritage. Such an aggressive form of instruction could greatly enhance our pilots."

    USA_encourage_civilian_air_industry: "Encourage Civilian Air Industry"
    USA_encourage_civilian_air_industry_desc: "Though we have our focus on developing our military airpower, it is from the civilian side of the system that great innovations often appear and new methods of applying industry are born. Promoting the expansion of transit flights and market aerospace manufacturing will prove a boon both to the economy and the military."

    USA_support_the_air_industry: "Support the Air Industry"
    USA_support_the_air_industry_desc: "With the need to develop our airpower growing ever faster, the advantages of promoting a homegrown aviation industry become more and more apparent. Though costly, the benefits of this approach will become clear soon enough."

    USA_extreme_air_investments: "Extreme Air Investments"
    USA_extreme_air_investments_desc: "With more and more funds at our disposal to develop our armed forces, airpower is one of our top priorities. Our forces must be bolstered by a competent and overwhelming fleet of aircraft ready to seize the skies. However, our opponents are not waiting patiently for us to be ready to meet them, and we must act fervently and ferociously to stay a step ahead."

    USA_found_the_mechanical_mastery_institute: "Found the Mechanical Mastery Institute"
    USA_found_the_mechanical_mastery_institute_desc: "Born out of the heart of American special industry, this foundation will centralize the best and brightest minds in various engineering fields and provide them the resources and incentives necessary to work at maximum efficiency, whilst also allowing different fields to cross over with each other and provide new ways of approaching innovation."

    USA_war_chest_act: "War Chest Act"
    USA_war_chest_act_desc: "The United States finds itself in a state of war. Regardless of how it started, it's here now, and the only proper response is to give it our all! It is now time for the full might and will of America and her people to crash down upon our enemies, and her full resources will be dedicated to the task."

    USA_close_air_support_planes: "Close Air Support Planes"
    USA_close_air_support_planes_desc: "Though not a wholly novel concept, in recent years the focus on close air support has become a major point of investment for many countries around the world, including many possible adversaries. The ability to assist troops by providing direct fire support from above is certainly an appealing one, and we have the resources to make it happen."

    USA_the_bomber_mafia: "The Bomber Mafia"
    USA_the_bomber_mafia_desc: "Within the halls of our top air leaders, there exists a group of visionaries deemed the 'Bomber Mafia'. These men hold one idea high above all others, that wars can be won through the application of precision, strategic bombing. This is a very unpopular opinion, to put it mildly, so investing in it would take some convincing for many elements of both our high command and government."

    USA_true_strategic_bombing: "True Strategic Bombing"
    USA_true_strategic_bombing_desc: "The idea is simple: what wins a war is stopping what fights it, so what if you destroyed the enemy's ability to fight before they ever even arrived at the front? Striking at the heart of material production in a country could cripple its ability to prosecute any conflict. With the help of new technology, namely new sights and frames, the efficiency of our bombs can be dramatically improved."
    USA_mastery_bonus_true_strategic_bombing_tt: "$USA_true_strategic_bombing$"

    USA_exotic_conditions_training: "Exotic Conditions Training"
    USA_exotic_conditions_training_desc: "Air combat is taking place at more and more extreme altitudes, at higher and higher speeds, with stronger and more reliable equipment. In order to prepare our pilots for real fighting, we must develop and implement ways of exposing them to the extreme conditions they will have to deal with in the skies and helping them learn ahead of time how to best handle them."

    USA_angel_warriors: "Angel Warriors"
    USA_angel_warriors_desc: "Though our pilots will be backed by the Arsenal of Democracy, it is essential that we approach combat with the aim to not lose our own people needlessly. Not only do we intend to bring our boys home, we intend to make them into the finest pilots in the world, whose skill encourages our troops, dazzles our allies, and intimidates our foes."
    USA_mastery_bonus_angel_warriors_tt: "$USA_angel_warriors$"


    USA_improved_cargo_planes: "Improved Cargo Planes"
    USA_improved_cargo_planes_desc: "Bigger transports mean more supplies can move farther, faster, and in greater quantities. If developed far enough, they could also sustain large-scale airborne operations the likes of which have never before been seen in warfare."

    USA_airborne_logistics: "Airborne Logistics"
    USA_airborne_logistics_desc: "Perhaps the most fraught and difficult method of delivering supplies to the front line, air transports represent a monstrously complex challenge of logistics, but they also offer the ability to get equipment to where it's needed immediately, including to surround men with no other avenues of approach."

    USA_airpower_identity: "Airpower Identity"
    USA_airpower_identity_desc: "With its skills and efforts now being tested, our air force has begun to come into its own. What identity will it pursue?"

    USA_united_states_army_aircorp: "United States Army Air Corps"
    USA_united_states_army_aircorp_desc: "The primary objective of America's airpower is to assist troops on the ground and sailors at sea. The total domination of these historic theaters will be easier to achieve than ever with the help of death from above. Our planes' true purpose is to strike at the enemy's most important assets, which are the surface forces capable of actually holding territory."

    USA_united_states_airforce: "United States Air Force"
    USA_united_states_airforce_desc: "The domain of the skies is too vast and too vital to make its domination a subordinate role in a branch that doesn't even have a hand in it. The airpower of the United States will be reorganized into its own branch of the military, ready to seize the skies above. From the heavens, American aircraft will pour down destruction, and with security in the air every battle will have a starting advantage."
    USA_united_states_airforce_tt: "The §YUSAA§! will now be known as the §YUSAF§!"

    USA_xaf_development: "XAF Development"
    USA_xaf_development_desc: "The US has been a leader in the field of radar technology, but with improved research at home and studying foreign systems abroad, we can broaden our understanding of the physics and mechanics behind the system and leapfrog our competitors in sophistication."

    USA_turbine_innovations: "Turbine Innovations"
    USA_turbine_innovations_desc: "American scientists and engineers have developed new methods of focusing air flow at high speeds and injecting fuel into the stream to create incredible amounts of thrust. With this brand new jet technology, we are close to being able to develop extreme aircraft able to fly higher, farther, and faster than ever before."

    USA_naval_asset_assessment: "Naval Asset Assessment"
    USA_naval_asset_assessment_desc: "With America being an ocean away from any major adversaries, it is paramount that she be able to defend those oceans, both to stunt aggressors and to enable her own action. Though our fleets are mighty, we must not wait idly by and let tradition carry on alone. Our navy must be kept ready to act."

    USA_leadership_reorganization: "Leadership Reorganization"
    USA_leadership_reorganization_desc: "The present war cabinet for America's navy is weighed down by layers of unnecessary and harmful bureaucracy and old methods of fighting. Times have changed since the Great War, and that requires a change in course."

    USA_department_of_naval_systems: "Department of Naval Systems"
    USA_department_of_naval_systems_desc: "Feedback from sailors has commonly included complaints about the quality of the equipment they are being given and the obtusiveness of the government when asked to fix problems it creates with this equipment. The M14 torpedo is a perfect example, something that exists out of momentum and laziness rather than usefulness and effectiveness. Our fleet must be better equipped."

    USA_cross_sector_communication: "Cross-Sector Communication"
    USA_cross_sector_communication_desc: "In operating a vast fleet across multiple different oceans spanning across the globe, we have the opportunity and capacity to coordinate the experiences and learnings of completely different theaters in order to better understand how to maximize the effectiveness of our navy."

    USA_invest_in_the_navy: "Invest in the Navy"
    USA_invest_in_the_navy_desc: "By investing reserves into our shipbuilding industry, we can kickstart an expansion of the navy. Hopefully, this investment will act as a worthy deterrent, but should conflict emerge new dockyards will be needed regardless."

    USA_drydock_expansion: "Drydock Expansion"
    USA_drydock_expansion_desc: "Doubling down on the production capacity of our drydocks will dramatically improve the efficiency of our fleets and help us to field ever increasing numbers of vessels."

    USA_littoral_retooling: "Littoral Retooling"
    USA_littoral_retooling_desc: "Though a costly and time-consuming move, with newly developed machine tools and industrial experience, we could afford to completely redesign significant sections of the ship production industry and create facilities capable of handling far greater volumes of work."

    USA_shipping_investment: "Shipping Investment"
    USA_shipping_investment_desc: "Expanding the effectiveness of the civilian shipping industry and our merchant marine will ensure that our equipment and supplies can reach their destinations on time and in good conditions."

    USA_war_production: "War Production"
    USA_war_production_desc: "It is time to unleash the titanic might of America's shipbuilding industry upon those forces that threaten her. The capacity of America's tonnage output needs a dramatic expansion."

    USA_armada_act: "Armada Act"
    USA_armada_act_desc: "The Armada Act grants the US Navy the funds and autonomy necessary to dramatically upscale its strength and power projection. Though it will drain our funds considerably, it is clear that this expansion is utterly necessary to face off against our foes abroad."

    USA_semper_fi: "Semper Fi"
    USA_semper_fi_desc: "The oldest of America's military forces, our marines have a long legacy of excellence in combat. Dedicating more resources to expand their ranks and strength will be a worthy focus."

    USA_improved_transport_models: "Improved Transport Models"
    USA_improved_transport_models_desc: "In order to guarantee that our troops and equipment can cross the ocean safely and arrive supported and ready to fight, they need better ships capable of surviving waves and fire."

    USA_amphibious_assaults: "Amphibious Assaults"
    USA_amphibious_assaults_desc: "Being across an ocean from potential foes, our troops will need to be ready to make hard fought landings in enemy territory. They will be supported by the best equipment and training available, and by the ever growing ranks of the Marine Corps."
    USA_amphibious_assaults_tt_add_nav_caps: "This focus will complete §Y1 naval branch§!"

    USA_modern_crew_training: "Modern Crew Training"
    USA_modern_crew_training_desc: "The quality of our sailors' training cannot afford to become stale. We must make sure that our personnel remain at peak readiness for combat and sailing- anything less would be a disservice towards our countrymen."

    USA_combat_drills: "Large-Scale Combat Drills"
    USA_combat_drills_desc: "One tradition of the navy that has kept it in peak condition over its history is its focus on being prepared for anything. The world is rapidly changing, as is potential naval combat. Our men will be ready."
    USA_mastery_bonus_combat_drills_tt: "$USA_combat_drills$"

    USA_veteran_damage_control: "Veteran Damage Control"
    USA_veteran_damage_control_desc: "In every fight, there will be shots that get through, no matter the training or technology. How a crew responds to those shots, however, is the difference between staying in the fight, limping to port, and burning to the waterline. Our crews will be trained and equipped to see to the former, and our ships will be equipped with systems to assist them."

    USA_large_scale_exercises: "Large-Scale Exercises"
    USA_large_scale_exercises_desc: "Being ready for combat is about practice and more practice. The plans for an engagement will inevitably fail to reflect the situation, but the ability to draft them on the fly is what helps keep the focus on victory in reality."

    USA_naval_force_exertion: "Naval Force Exertion"
    USA_naval_force_exertion_desc: "The ability of our fleets to project power and secure the globe's waters will ensure safe passage for friendly vessels across the seas and effective deployment of our forces to where they're needed most."

    USA_commando_sections: "Commando Sections"
    USA_commando_sections_desc: "Integrating high-level fleet command with the operational planning of the marine corps will enable far smoother and more effective amphibious assaults and will help to keep our ships informed as to the security of different island chains and coastal regions."

    USA_us_naval_invention_complex: "US Naval Invention Complex"
    USA_us_naval_invention_complex_desc: "Our boys down in San Francisco have been developing revolutionary new ideas for augmenting our influence over the seas. Dedicating a facility to developing these ideas further will give them the resources necessary to bring their ideas to light."

    USA_advanced_tonnage: "Advanced Tonnage"
    USA_advanced_tonnage_desc: "An extremely powerful, modern ship model would greatly bolster our navy. Deciding where to put our research efforts will determine how our resources will benefit us."

    USA_fleet_modernization: "Fleet Modernization"
    USA_fleet_modernization_desc: "Our fleet remains in a similar form as to how it was a decade ago, still designed to fight in the Great War. Our adversaries are fielding more and more capable warships, and we must invest in retrofitting and upgrading our fleet if we are to remain strong."

    USA_submarine_experimentation: "Submarine Experimentation"
    USA_submarine_experimentation_desc: "Submarines remain a relatively untested and unsophisticated tool within the navy. Pushing the bounds of what is possible with undersea warfare could yield fascinating and valuable results."
    USA_mastery_bonus_submarine_experimentation_tt: "$USA_submarine_experimentation$"


    USA_steel_sharks: "Steel Sharks"
    USA_steel_sharks_desc: "The primary role of our submarine fleet will be to attack the enemy. Our submarine crews are itching to strike out at their foes before their foes even know they're there, a strategy we must invest into."

    USA_the_silent_service: "The Silent Service"
    USA_the_silent_service_desc: "The ability for our submarines to quietly infiltrate enemy waters and even ports and sneak up on their most valuable assets without warning represents a strategic power of enormous consequence. Training our crews to operate in a way that maximizes their stealth is key."

    USA_fanged_raiders: "Fanged Raiders"
    USA_fanged_raiders_desc: "New designs for a so-called 'fleet submarine' demonstrate a capacity to reach across an ocean and devastate an enemy with a silent touch. Though a costly investment, it is important the America is the preeminent fielder of this new type of technology, lest we fall victim to it in the hands of an enemy."

    USA_invisible_will: "Invisible Will"
    USA_invisible_will_desc: "The primary role of our submarine fleet will be to support our strike groups. The ability for submarines to defend a region of ocean from below and relay their insights to any nearby ally will prove a massive help for our warships."

    USA_undersea_escorts: "Undersea Escorts"
    USA_undersea_escorts_desc: "Our convoys are at the greatest risk of attack from concealed enemy submarines. However, using our own subs for escorting those convoys would allow us to counter the enemy's tactics and create unease for enemy sailors, unsure of whether or not any convoy is truly left defenseless just because no other silhouettes appear."

    USA_the_oceans_eyes: "The Ocean's Eyes"
    USA_the_oceans_eyes_desc: "Submarine patrols are perfectly suited for gathering intel on enemy movements and tactics, and employing swarming nets of invisible underwater assets to watch our enemy's every move will make their next more apparent."

    USA_carrier_rnd: "Carrier R&D"
    USA_carrier_rnd_desc: "Though we've made use carriers for quite some time now, we have never put serious effort into working out effective fighting doctrines for them. Working on improved efficiency in their operations and design is necessary to move forward."
    USA_mastery_bonus_carrier_rnd_tt: "$USA_carrier_rnd$"


    USA_new_carrier_yards: "New Carrier Yards"
    USA_new_carrier_yards_desc: "We will build massive new facilities to produce carriers for the fleet. These wharves will allow us to greatly expand our ability to project naval air power."

    USA_naval_air_focus: "Naval Air Focus"
    USA_naval_air_focus_desc: "Planes over the water are quite the sight, and ours will be outfitted with the tools they need to reach their targets, escort their friends, and sink their enemies."

    USA_carrier_aircraft: "Carrier Aircraft"
    USA_carrier_aircraft_desc: "Airplanes designed specifically to fly off the decks of aircraft carriers and to be supported by them are a necessity for modern naval warfare. It's a tough job to make sure that they can operate in the right environment, with far more constraints than otherwise, but advanced and effective carrier planes will prove decisive in maximizing the strength of our carriers."

    USA_advanced_carriers: "Advanced Carriers"
    USA_advanced_carriers_desc: "The carriers of tomorrow will be capable of extending the reach of America's influence and power projection across every ocean and every battlefront. Expanded hangar bays, improved logistics, better training, and extended range will allow our naval aircraft to dive into the deepest enemy waters."

    USA_pinnacle_advancement: "Pinnacle Advancement"
    USA_pinnacle_advancement_desc: "Thanks to our brilliant scientists and engineers, we have begun work on new designs for advanced submarine and carrier technology which would dramatically increase our advantages on the ocean. As usual, cheapness is not expected."

    USA_silverstar_fleet: "Silverstar Fleet"
    USA_silverstar_fleet_desc: "Our naval forces will be defined by their excellence and efficiency on the water. Through superior skill and focus, America's fleets will dominate the waves and hold fast our place in the world."

    USA_fleet_of_the_deep: "Fleet of the Deep"
    USA_fleet_of_the_deep_desc: "America's naval forces will drown out her enemies, swelling like the tide to overtake any foe. Her industry will power a relentless and unending surge of ships and guns."

    USA_airborne_operations: "Airborne Operations"
    USA_airborne_operations_desc: "With new and improved aerial transports, we are able to do what armies have wished to do for all of history: fly. Our boys can be sent directly to where they're needed in a hurry, they can deploy behind enemy lines, and they can even be actively supported and kept organized via help from the air."

    USA_scientific_industrial_showcase: "Scientific-Industrial Showcase"
    USA_scientific_industrial_showcase_desc: "The innovative industries of the United States will be able to make a quick recovery once they catch their grip. In the meantime, taking stock of what creative assets we actually have and getting everyone excited about them will help the rekindle that flame and put it in the public consciousness."

    USA_accelerated_research_industries: "Accelerated Research Industries"
    USA_accelerated_research_industries_desc: "Already, private companies, entrepreneurs, and independent scientists and engineers are pushing the bounds of science and technology, and as their available resources improve, so does their effectiveness. We should further invest in these bright minds while allowing them space to grow."

    USA_support_military_contractors: "Support Military Contractors"
    USA_support_military_contractors_desc: "Our arms industry was hit hard by the depression like all others. However, as the civilian markets recover, those that serve military interests will still have to wait for the military itself to come knocking again. We need to help them stay afloat just a bit earlier than otherwise since the government is their only buyer."

    USA_early_mic_investment: "Early MIC Investment"
    USA_early_mic_investment_desc: "Pumping the limited funds we have into our military industrial complex may or might not be the wisest move, but it will be necessary if we intend to keep our military well-equipped and modern."
    USA_early_mic_investment_tt: "If the economy has begun to §Yrecover§!, this focus will be §Gcheaper§!."

    USA_dynamic_lines_initiative: "Dynamic Lines Initiative"
    USA_dynamic_lines_initiative_desc: "As our needs and designs change, our industries need to be adaptive. As they are getting back up to speed, keeping this in mind early will help to instantiate it later on."

    USA_address_urgent_defense_needs: "Address Urgent Defense Needs"
    USA_address_urgent_defense_needs_desc: "An active military industry is necessary at this time. We need to be able to arm troops soon, regardless of the cost."
    USA_address_urgent_defense_needs_tt: "If the economy is £GFX_usa_star_overlay_2_texticon §Yrecovering§!, this focus will be §Gmore effective and less costly§!."

    USA_encourage_creative_approaches: "Encourage Creative Approaches"
    USA_encourage_creative_approaches_desc: "We have some of the best minds working to equip our men, and their ability to come up with new solutions to problems we haven't even reached yet is a great boon. If we relax the regulations and requirements we have for the gear we requisition, we may find it to be far more effective."

    USA_defense_hardware_symposium: "Defense Hardware Symposium"
    USA_defense_hardware_symposium_desc: "Dyanmism follows in the wake of our recovering scientific and engineering institutions. Let's get our best and brightest together in the same room and see what they can come up with."

    USA_futuristic_military_assets: "Futuristic Military Assets"
    USA_futuristic_military_assets_desc: "Staying ahead is key to maintaining an effective defense and offense. The modern world is moving fast, so we'll have to be faster. We will accomplish this by continuing to meld together every lead we can identify in every field we can."

    USA_aggressive_technology_funding: "Aggressive Technology Funding"
    USA_aggressive_technology_funding_desc: "We are in dire need of a technological edge. Resources must be diverted to this cause immediately."

    USA_found_darpa: "Found DARPA"
    USA_found_darpa_desc: "The Defense Advanced Research Projects Agency will be tasked with pursuing the weapons and systems of tomorrow. It will bring together the most effective creatives the United States has to offer and will work on initiatives too secret to let surface."

    USA_nuclear_research: "Nuclear Research"
    USA_nuclear_research_desc: "Various scientists in the US have been proposing ideas of splitting an atom, an idea previously thought impossible. If it could be done, and if the process could be harnessed, it could yield incredible results. What those results may look like... we'll have to see."

    USA_the_manhattan_project: "The Manhattan Project"
    USA_the_manhattan_project_desc: "The Manhattan Project, as it'll be referred to, will be the US's nuclear research and development program for the creation and testing of a possible atomic bomb. If successful, the United States of America would become the owner of the world's first ever superweapon, a device capable of deterring all foes and of destroying any army. It is a top priority that this project remain a secret to everyone."

    USA_invest_in_equipment_manufacturers: "Invest in Equipment Manufacturers"
    USA_invest_in_equipment_manufacturers_desc: "We have dozens of independent companies contributing resources and equipment to our armed forces. The free market applies just as much to the war industry as any other, and if we want the highest quality of gear for our men then we'll need to invest into it."

    USA_increase_armor_spending: "Increase Armor Spending"
    USA_increase_armor_spending_desc: "America's tank companies are still relatively young and their equipment remains mostly untested. However, making sure they have the resources to learn and grow well will help them provide this country with the best tanks around."

    USA_west_coast_aircraft_armories: "West Coast Aircraft Armories"
    USA_west_coast_aircraft_armories_desc: "Expanding and adding to our numerous aircraft plants is vital to boost the size and quality of our air fleet."

    USA_expand_shipyards: "Expand Shipyards"
    USA_expand_shipyards_desc: "America has the capacity to produce top-of-the-line ships like no other nation on the planet, and we ought to make use of that incredible power by building up the shipbuilding industry to prepare it for what's ahead."

    USA_cross_disciplinary_industrial_network: "Cross-Disciplinary Industrial Network"
    USA_cross_disciplinary_industrial_network_desc: "In order to better solve problems in one industry, the skills and learnings of other industries can be used as inspiration or even for direct answers. By creating an organizational network to help different companies in non-competing industries share their expertise with each other, we can achieve this goal."
    USA_cross_disciplinary_industrial_network_tt: "We will gain §Y2 factories/dockyards§! for each industry previously invested into."
    USA_cross_disciplinary_industrial_network_tt_2: "Every §Ycompany§! previously invested into will get:\n  Gain §G+1§! Size\n  Military Industrial Organization Research Bonus: §G+10.0%§!"

    USA_capital_industrial_arsenal: "Capital Industrial Arsenal"
    USA_capital_industrial_arsenal_desc: "Directed by the flow of funds from the military to private capital, America's military industrial complex is growing into a powerful entity that can hardly be rivaled by the finest of the old powers. America's forces will stand equipped and ready to take on the world."
    USA_capital_industrial_arsenal_tt: "We will gain §Y2 factories/dockyards§! and §Y1 civilian factory§! for each industry previously invested into."
    USA_capital_industrial_arsenal_tt_2: "Every §Ycompany§! previously invested into will get:\n  Gain §G+1§! Size\n  Funds Gain: §G+15.0%§!\n  Design Team Assign Cost: §G-10.0%§!"

    USA_military_industrial_complex: "Military Industrial Complex"
    USA_military_industrial_complex_desc: "To arm her forces, America has undertaken the creation of the largest, most advanced, and most robust military industrial complex in history. The Arsenal of Democracy has fully awoken and is ready to supply any conflict the Stars and Stripes shall fly in."

    USA_ivy: "Ivy"
    USA_ivy_desc: "Operation 'Ivy Mike' will be the top-secret effort to further develop our superweapon arsenal. This will be extremely costly, but if we can successfully use an atomic bomb as a primary explosive for an even larger nuclear payload, the destructive potential of America's blade will be sharpened further than anyone could imagine."

    USA_advanced_physics_grants: "Advanced Physics Grants"
    USA_advanced_physics_grants_desc: "The field of physics has become a very important topic recently, and the bright minds in America are perfectly suited to answer the newest questions it poses. We should encourage exploits in this area."

    USA_approach_the_jet_propulsion_laboratory: "Approach the Jet Propulsion Laboratory"
    USA_approach_the_jet_propulsion_laboratory_desc: "Founded in 1936 by Caltech students, this group has been at the cutting edge of aeronautics technology in a few ways and their ability to innovate has been well proven. Perhaps if they were to receive more exotic funding and project requests, they may be able to push the envelope further than we can yet imagine."

    USA_supersonic_studies: "Supersonic Studies"
    USA_supersonic_studies_desc: "Newly-developed wind tunnels allow our engineers to experiment with supersonic airflow and develop new technologies around fluid dynamics. Applied to the sky, we could see innovations in jet engine technology and airfoil wings."

    USA_in_flight_avionics: "In-Flight Avionics"
    USA_in_flight_avionics_desc: "The boys in our defense research institutes have figured out how to guide machines autonomously towards targets or along flight paths. Using newly-developed in-flight avionics systems, we can create devices that can reach out to strike targets with incredible precision."

    USA_heirs_of_prometheus: "Heirs of Prometheus"
    USA_heirs_of_prometheus_desc: "Unmatched power, like man has never dreamed, rests at our fingertips, but its method of delivery is still a logistical nightmare that requires our pilots to be put at risk. However... suppose a weapon of mass destruction could be mounted on an autonomous rocket. Such a thing would be an incredible feat of engineering... and an unmatchable weapon."

    USA_washington_institute_of_modern_science: "Washington Institute of Modern Science"
    USA_washington_institute_of_modern_science_desc: "Creating a dedicated facility for the convening of our top scientists will help us to uncover the mysteries of physics and the world at large."

    USA_the_clean_energy_act: "The Clean Energy Act"
    USA_the_clean_energy_act_desc: "With the boon of nuclear power now at our fingertips, we should make it a top priority to rapidly electrify the nation with this incredible new technology. The effectiveness of these plants will dramatically benefit our industry."

    USA_school_funding: "School Funding"
    USA_school_funding_desc: "Making sure the youth can become literate and capable of operating in an advanced, industrial society is crucial for building up the next generation and ensuring continuing growth and prosperity in the future."

    USA_soft_power_oriented_designs: "Soft Power-Oriented Designs"
    USA_soft_power_oriented_designs_desc: "While a bigger gun firing more rounds of a larger caliber at a greater range is always good to have, it is even more important whether the gun jams after its first shot or not. Putting a focus on weaponry and equipment that serves our soldiers well is more important than being cutting-edge."

    USA_rigorous_training: "Rigorous Training"
    USA_rigorous_training_desc: "During the Great War, we took fresh troops and sent them by the thousands into machine guns. The results were many lost Americans whose families never saw them again. We will not take for granted our forces, nor the vast numbers of men we may employ. Our soldiers will be properly trained for combat."

    USA_house_to_house_combat: "House-to-House Combat"
    USA_house_to_house_combat_desc: "While heavy weapons reign supreme on the battlefield, urban environments demand a new and far more tactical approach to warfare. Training our soldiers to methodically clear out enemy strongpoints will help to reduce their effectiveness against our forces."
    USA_house_to_house_combat_tt: "Enables §YUrban Infantry Tactics \nInfantry (Urban)§! \n   Attack: §G+10.0%§! \n   Defence: §G+10.0%§! \n§YInfantry (Fort)§! \n   Attack: §G+5.0%§! \n   Defence: §G+5.0%§!"

    USA_unceasing_innovation: "Unceasing Innovations"
    USA_unceasing_innovation_desc: "Powered by more and more sophisticated equipment and hardware, American soldiers will fight with both the finest weapons and the finest training."

    USA_the_best_of_the_best: "The Best of the Best"
    USA_the_best_of_the_best_desc: "The American military is not an institution of faceless men sent off to the meat grinder, it is a professional fighting force that exerts the finest of America's strength and might. It isn't just for anyone, it's for the best."

    USA_futuristic_warfare: "Futuristic Warfare"
    USA_futuristic_warfare_desc: "America's war industry will always be one step ahead of her competitors, to ensure continuing combat supremacy."

    USA_freedoms_blade: "Freedom's Blade"
    USA_freedoms_blade_desc: "America's armed forces are the backbone of our way of life, of securing and protecting what we hold dear. They will hold the line across the world, for freedom. Where her brave soldiers depart to, her might will follow."

    USA_plains_fighting: "Plains Fighting"
    USA_plains_fighting_desc: "Our forces' training will specialize in engagements over fields and deserts, in wide open battlefields where the full force of our artillery can rain down on our foes."

    USA_close_quarters: "Close Quarters"
    USA_close_quarters_desc: "Our foes are most likely to be encountered in regions of dense vegetation or fortifications. Ensuring our men are trained to effectively handle this sort of combat will be crucial."

    USA_rough_terrain: "Rough Terrain"
    USA_rough_terrain_desc: "Combat is fought in regions either naturally or artificially made difficult due to geography and defenses. Though modern combat is often fast and aggressive, the Great War also taught the value of maintaining a solid defensive line."

    USA_raining_fire: "Raining Fire"
    USA_raining_fire_desc: "Artillery is the queen of battle, a wholly destructive force capable of raining fire down on foes from beyond their reach. Developing greater heavy weapons will allow our troops to destroy enemy strongpoints before the first man even reaches it."

    USA_rapid_strike: "Rapid Strike"
    USA_rapid_strike_desc: "A massive speed advantage contributes to enemies not being able to properly respond to our moves. If our strikes are faster than their reactions, our army will win every time."

    USA_north_american_waves: "North American Waves"
    USA_north_american_waves_desc: "We have at our disposal an unending bank of manpower capable of overwhelming all opponents. Furthermore, we have the industrial might necessary to equip each and every citizen, if necessary. Let's use these to our advantage."

    USA_interservice_cooperation: "Interservice Cooperation"
    USA_interservice_cooperation_desc: "Though the troops on ground, in the air, and on the sea may not always cross paths so often, their unique insights can still benefit each other greatly. Setting up an organized system of branch attachés would help each one learn from the others."

    USA_mass_production: "Mass Production"
    USA_mass_production_desc: "America possesses the world's greatest industrial might, and we can focus it into unending waves of material for our war effort. Flooding our enemies in a torrent of bullets is our method of victory."

    USA_unceasing_pressure: "Unceasing Pressure"
    USA_unceasing_pressure_desc: "Maintaining an attack prevents the enemy from regaining their form, constantly draining them of their strength until they break. Though it requires finesse and organization on the part of the attacker to maintain constant pressure, our soldiers will be able to make use of our limitless equipment to continuously throw fire down range."

    USA_e_pluribus_unum: "E Pluribus Unum"
    USA_e_pluribus_unum_desc: "Americans are not afraid of war, they are not afraid of fighting, and they are not afraid of winning. It is our duty to rally behind the ideals of liberty wherever she may be under threat. Americans will surge to meet the enemies of freedom, and they will not sit idle behind their guns."

    USA_the_age_after_victory: "The Age After Victory"
    USA_the_age_after_victory_desc: "America has recovered from her wounds and has awoken from her slumber. With her faculties now fully formed and her might fully recognized, where will she go from here?"

    USA_the_american_dream: "The American Dream"
    USA_the_american_dream_desc: "The innovations of inventors and entrepreneurs in these great American states has led to a quality of life for the average person higher than anything ever seen before in history. The primary role of our economy is to increase the standard of living and to develop the prosperity still yet to come."

    USA_the_forge_beneath_her_torch: "The Forge Beneath Her Torch"
    USA_the_forge_beneath_her_torch_desc: "War is coming, and America needs to be ready. The unparalleled might of the Arsenal of Democracy is ready and fired up to build the implements of destruction the United States needs to win any conflict and ensure continual safety and security."

    USA_the_americas: "The Americas"
    USA_the_americas_desc: "Our relationship with our neighbors in the Americas is an important focus of our foreign diplomacy and should be given special attention."

    USA_fulfill_manifest_destiny: "Fulfill Manifest Destiny"
    USA_fulfill_manifest_destiny_desc: "The United States is the guardian of the continent, and our will should be extended to reflect this. Our borders need not stop growing or become stagnant."

    USA_pacify_mexican_turmoil: "Pacify Mexican Turmoil"
    USA_pacify_mexican_turmoil_desc: "Mexico has been in a continual state of turmoil for decades, and their recent revolution has not helped that. Their instability poses a threat to us, one which the Germans made use of during the Great War already. We need to remove that threat."

    USA_preempt_a_southern_invasion: "Preempt a Southern Invasion"
    USA_preempt_a_southern_invasion_desc: "Enemy forces could use the weakness of our southern neighbors to launch a massive invasion of the country. We must make sure we cannot come under threat from Middle America."

    USA_central_american_bastion: "Central American Bastion"
    USA_central_american_bastion_desc: "The region around the Panama Canal is vital for the health and safety of the country. We must make sure that it remains under our firm protection."

    USA_dominate_south_america: "Dominate South America"
    USA_dominate_south_america_desc: "South America has been a chaotic mess for years now, and dictatorships abound as well in this miasma. There is no telling whether or not they would join any potential enemies of the US. Furthermore, with our guidance, the continent could be made far more secure and peaceful."

    USA_united_protectorate_of_the_south: "United Protectorates of the South"
    USA_united_protectorate_of_the_south_desc: "The many countries and cultures who have accepted our protection are now in a good position to be integrated into the wider American sphere of influence. Connecting their economies with our own and investing in their development will benefit us all."
    USA_united_protectorate_of_the_south_tt: "Every §YSouthern subject§! we have will be turned into an §Yintegrated puppet§! with an additional national spirit."

    USA_southern_states: "Southern States"
    USA_southern_states_desc: "The southern half of the Western Hemisphere is now more secure than it has ever been before. The peoples there aren't so different from us, and given time they could fully integrate and assimilate into American culture. We should begin that process by formally welcoming our newest territories into the union to begin the long process."
    USA_southern_states_tt: "Every §YSouthern puppet§! we have will be §Yannexed§!."

    USA_bribe_the_canadian_government: "Bribe the Canadian Government"
    USA_bribe_the_canadian_government_desc: "The territories of the corridor aren't very valuable on their own, so perhaps we could simply offer a fair exchange of goods for them. Of course, in order to bypass the politics of the thing, we will have to effectively bribe the Canadian government, which will be very expensive, but we can manage."
    USA_bribe_the_canadian_government_tt: " §YEffects if they agree:§!"

    USA_secure_the_canadian_corridor: "Secure the Canadian Corridor"
    USA_secure_the_canadian_corridor_desc: "The corridor separating the two parts of our country is too valuable to negotiate for. We must strike for it, if necessary. Hopefully, our neighbors to the north will understand and come to their senses before anything untoward were to happen."

    USA_bargain_for_canada: "Bargain for Canada"
    USA_bargain_for_canada_desc: "[CAN.GetNameDefCap] and [ROOT.GetNameDefCap] have always had close ties. With our mutual interests and their strategic role in protecting the entire north of the continent, it would make sense to try and gain their union. We will approach their masters with an offer they surely can't refuse."
    USA_bargain_for_canada_tt: " §YEffects if they agree:§!"
    USA_bargain_for_canada_tt_2: "If our purchase is accepted, we may §Gbe able§! to §Ycore Canada§!"

    USA_conquer_the_north: "Conquer the North"
    USA_conquer_the_north_desc: "Our northern flank is too wide and vulnerable to leave its defence to others. We must act now or face a threat in the future. The north must be ours."
    USA_conquer_the_north_tt: " If they refuse and we go to §Ywar§!:"
    USA_conquer_the_north_tt_2: "If we take Canada by force or under duress, we may §Rnot be able§! to §Ycore Canada§!"

    USA_welcome_the_canadians: "Welcome the Canadians"
    USA_welcome_the_canadians_desc: "With our northern neighbors now part of our sphere of influence, we can extend our hands and begin to bring them properly into the union! Welcome to [USA.GetNameDefCap]!"

    USA_bring_in_the_Caribbean: "Bring in the Caribbean"
    USA_bring_in_the_Caribbean_desc: "The islands to the south represent both opportunity and danger. Their coasts represent ideal port location from which our navy and trade could be bolstered, or from which enemies could stage their own plays against us. Furthermore, their peoples fall under our sphere of protection in this region, and in their current state we aren't able to protect them as much as we may need to. We must act."

    USA_treaty_of_london: "The Treaty of London"
    USA_treaty_of_london_desc: "For many years, the US has stood as the sentinel over the Americas, protecting them from European influence. Under the Monroe Doctrine, it has been our prerogative to keep Europe out of colonial affairs here. However, small vestiges of European influence remain. It is time to finally remove the old world from the new."

    USA_shield_the_panama_canal: "Shield the Panama Canal"
    USA_shield_the_panama_canal_desc: "The Panama Canal is one of the most important pieces of infrastructure in the world, and controlling it and keeping it operational is utterly vital to the operations of our commerce and navy. We will approach the [PAN.GetAdjective] government and request a more active presence around it. Ideally, Panama itself could also be brought on board to help."
    USA_shield_the_panama_canal_tt: "§YEffects if they accept§!:\n  Build §Ybunkers§! and §Ycoastal bunkers§! around the canal"

    USA_revisit_the_monroe_doctrine: "Revisit the Monroe Doctrine"
    USA_revisit_the_monroe_doctrine_desc: "The US has taken upon itself the duty to guard the Americas from European interference. However, there is still work left to do in order to ensure an independent new world."

    USA_demand_peace_guarantees: "Demand Peace Guarantees"
    USA_demand_peace_guarantees_desc: "The great power of the Old World threaten our safety with the continuous wars and conquests. We would rather that the Americas remain safe from their aggression. In order to secure this peace diplomatically, we will secure guarantees from our neighbors and the major countries of Europe."

    USA_defence_of_the_hemisphere: "Defense of the Hemisphere"
    USA_defence_of_the_hemisphere_desc: "Our top priority needs to be securing our lands and our waters, making sure that foreign invaders and hostile powers are unable to set foot in this hemisphere."

    USA_pacific_atlantic_shield: "Pacific-Atlantic Shield"
    USA_pacific_atlantic_shield_desc: "Any approach at our continent must be made by way of the two oceans besides us. To protect our coasts, we will build a force capable of halting any invaders before they ever see our shores."

    USA_american_alliance: "American Alliance"
    USA_american_alliance_desc: "In order to secure the continent, we will coordinate with our continental neighbors and establish a unified front to repel any attackers."

    USA_american_customs_union: "American Customs Union"
    USA_american_customs_union_desc: "In order to safeguard the continent from military threats but also threats of a more civil variety, it seems necessary to involve ourselves in the commercial actions of our allies. We must ensure that the countries surrounding us do not fall to foreign meddling and remain stable."

    USA_intercontinental_vigilance_pact: "Intercontinental Vigilance Pact"
    USA_intercontinental_vigilance_pact_desc: "In order to safeguard the new world from foreign threats, we must work closely with our neighbors in both North and South America to ensure a mutually-defended coastline and airspace. Cooperation will be our method of diplomatic action."

    USA_empower_the_guardians: "Empower the Guardians"
    USA_empower_the_guardians_desc: "Close military cooperation will be necessary in order to facilitate and effective defense against overseas foes. To this end, the US military will work closely with our other American allies in order to prop up all available capable fighting forces."

    USA_pursue_american_prosperity: "Pursue American Prosperity"
    USA_pursue_american_prosperity_desc: "As the world's largest economy and the strongest military power of the region, it is incumbent on us to help those in need. We are surrounded by neighbors who have suffered much in recent decades, whether by chance, by their own making, or even as a result of our own actions. We will aim towards supporting them."

    USA_bolster_liberty_in_the_south: "Bolster Liberty in the South"
    USA_bolster_liberty_in_the_south_desc: "We have a duty to spread the light of democracy to our neighbors and help spark the ideals of independence and freedom."

    USA_support_the_great_white_north: "Support the Great White North"
    USA_support_the_great_white_north_desc: "We already have a lot of connection with our neighbors to the north. Let's share some of our prosperity with them and help them to recover from the Great Depression."

    USA_purchase_the_western_gap: "Purchase the Western Gap"
    USA_purchase_the_western_gap_desc: "The Canadian Corridor splits the continental United States from her Alaskan territories. Given the relative value of that land to us and it's relative emptiness for the Canadians, perhaps we can strike a deal with them for it."

    USA_the_crowns_helmet: "The Crown's Helmet"
    USA_the_crowns_helmet_desc: "Canada has been a good ally for many years now and their presence helps to prevent any attacks from our north. We should work with them to bolster our military strengths and improve our abilities to defend North America."

    USA_purchase_colonial_holdovers: "Purchase Colonial Holdovers"
    USA_purchase_colonial_holdovers_desc: "The old powers of Europe still hold clay in the Americas, even despite being slowly pushed out of the region for years. Now, however, we have an opportunity to finish their withdrawal, but we won't make it painful. Rather, we'll pay in gold for these colonial holdovers."
    USA_purchase_colonial_holdovers_tt: "§YEffects if they accept§!:"

    USA_support_mexico: "Support Mexico"
    USA_support_mexico_desc: "Mexico has been experiencing trouble for years due to all sorts of problems. The most recent problems in economics haven't helped them either. We could offer support to help them grow."

    USA_finance_mexican_renewal: "Finance Mexican Renewal"
    USA_finance_mexican_renewal_desc: "By directly investing in the development and growth of Mexico, we can raise the country up from its historical slump and help it recover fully and then grow further. In this process, we can also guide it with our ideals and bring it into our sphere."

    USA_invest_in_mesoamerica: "Invest in Mesoamerica"
    USA_invest_in_mesoamerica_desc: "The many small countries to our south have not fared particularly well in recent history. Though we ourselves have suffered recently, we can extend some of the resources of our recovery to bolstering these countries for their own advantage, and perhaps our own later on."

    USA_south_american_industrialization: "South American Industrialization"
    USA_south_american_industrialization_desc: "We can invest in South America to help promote American ideals. By building up infrastructure and civilian industries, we can spread goodwill as we build up future wealth for our southern neighbors."

    USA_promote_trade: "Promote Trade"
    USA_promote_trade_desc: "As we reopen our economy to the world, we can prioritize trade with our neighbors in the hemisphere."

    USA_the_miami_conference: "The Miami Conference"
    USA_the_miami_conference_desc: "We will hold a grand conference in Miami to bring together our friends in the hemisphere. The aim is rather straight-forward: to encourage cooperation and friendliness."

    USA_bolster_the_continent: "Bolster the Continent"
    USA_bolster_the_continent_desc: "Cooperations between the countries of the New World will allow for a bolstering of general defense and security. Coordinating these actions and agreements will optimize the exchange of equipment."

    USA_new_world_market_system: "New World Market System"
    USA_new_world_market_system_desc: "With so many different areas of interest shared between us and our continental neighbors, it would be worth bringing together our nearby friends to participate in a shared economic sphere that would directly link together our different markets and peoples."

    USA_continental_citadel: "Continental Citadel"
    USA_continental_citadel_desc: "It's clear that foreign aggression poses the greatest threat to the security and prosperity of the New World. A defense military alliance between us and our aligned neighbors would provide a solid foundation for protecting against any such threat."

    USA_european_diplomacy: "European Diplomacy"
    USA_european_diplomacy_desc: "Europe has had a turbulent time recently. Since the Great War, Europe has suffered through much, and our own people have not forgotten the trauma we were dragged into. Now, however, it is finally time to return. In what manner? We shall see..."

    USA_write_war_plan_black: "Write War Plan Black"
    USA_write_war_plan_black_desc: "[GER.GetName] has already been a major source of conflict on the continent for decades, and this hasn't stopped with the Great War. There is little chance that Germany won't cause conflict once again, and in that inevitable event we ought to be ready ahead of time."

    USA_write_war_plan_red: "Write War Plan Red"
    USA_write_war_plan_red_desc: "Though we have seen them as an ally in recent times, [ENG.GetNameDefCap] still represents a major potential threat to America. Were she to return to her old views, this entire hemisphere would be in danger. Friendly now, we will be prepared for such a conflict, just in case."

    USA_write_war_plan_white: "Write War Plan White"
    USA_write_war_plan_white_desc: "Few countries or regions have exerted such constant pressure or trepidation as that of Russia. The rise of the Soviets and the present form of [SOV.GetNameDefCap] does not lend itself towards prosperity in the future. However, theirs is a terrible foe to fight. In that event, we must be prepared for victory."

    USA_write_war_plan_silver: "Write War Plan Silver"
    USA_write_war_plan_silver_desc: "[ITA.GetName] has not seen tremendous success in its recent history, and time itself has not been terribly kind to her. In the most recent years, she has endeavored to reach out once more and try to seize upon those weaker than her, and her aggression has been laid bare to see. Italy remains a threat, one that may have to be dealt with in time."

    USA_write_war_plan_gold: "Write War Plan Gold"
    USA_write_war_plan_gold_desc: "[FRA.GetName] has struggled under a Great War and the depression, and political turmoil continues to seize at its internals constantly. Her future is never sure, and precedent holds that she may yet become aggressive towards us. War with France will not be taken carelessly."

    USA_victory_act: "Victory Act\n(European Theater)"
    USA_victory_act_desc: "Wars are now being fought on a scale and at a tempo that demands complete engagement- they are Total Wars. America can not stand by and attempt to simply play by the rules of yesterday's wars. Though we will keep an eye on not becoming monsters ourselves, we must be willing to do whatever it takes to destroy those monsters besetting us."

    USA_write_war_plan_chrome: "Write War Plan Chrome"
    USA_write_war_plan_chrome_desc: "Europe as a whole remains something that has left a bad taste in our mouth. Instability, war, and extreme ideologies are commonplace over there, but if we're to tackle another conflict on the continent then we should devise a set of plans ahead of time."

    USA_the_far_eastern_realm: "The Far-Eastern Realm"
    USA_the_far_eastern_realm_desc: "East Asia has held interest for America for decades, and even despite the short history of the US it has still managed to make significant impacts in the region. Now, tensions are rising fast and threats seem to loom over the horizon. The importance of our diplomatic stance here shouldn't be underestimated."

    USA_write_war_plan_orange: "Write War Plan Orange"
    USA_write_war_plan_orange_desc: "[JAP.GetNameDefCap] has grown quickly and dramatically, however its recent actions and tumults have left it in a very unstable and aggressive position. Whether the Japanese will remain peaceful or become belligerent, we need to be ready."

    USA_victory_act_asia: "Victory Act\n(Asian Theater)"
    USA_victory_act_asia_desc: "Asia demands a scale of warfare that is difficult to grasp, with hordes of soldiers too numerous to count, terrain which is itself hostile to troops, and distances impressive to scale. If we intend to fight a major war across the Pacific, we must not hold back- every tool available to us must be available."

    USA_write_war_plan_yellow: "Write War Plan Yellow"
    USA_write_war_plan_yellow_desc: "China finds itself in a state of civil war between imperialist factions who have not been quiet about their intent to expand and return to a state of dominance. Though it is unlikely that we would find ourselves in a war against them, they could pose a serious threat that we would have to be able to readily respond to."

    USA_write_war_plan_crimson: "Write War Plan Crimson"
    USA_write_war_plan_crimson_desc: "We have enjoyed a long and productive peace with the Canadians up north, but the length of our border with them and the threat that a northern invasion could pose still leaves a bitter possibility. In the event of a conflict with our neighbors, we shouldn't be caught unprepared."

    USA_victory_act_americas: "Victory Act\n(American Theater)"
    USA_victory_act_americas_desc: "War on our shores demands that we strike as hard as we can. Our homeland has been put under threat by our neighbors. Nothing short of absolute victory is acceptable, and we must do whatever is in our power to achieve it."
    USA_victory_act_americas_tt: "Our §YWar Plans§! will become extremely powerful."

    USA_write_war_plan_green: "Write War Plan Green"
    USA_write_war_plan_green_desc: "Continuous upheaval to our south has been a potential problem for a long time. Even as recently as the Great War, Mexico was nearly coaxed into war against the US. A fight against them could be on the horizon."

    USA_write_war_plan_turquoise: "Write War Plan Turquoise"
    USA_write_war_plan_turquoise_desc: "The region connecting North and South America has significant strategic importance for both us and the rest of the world. Any threat to the region broadly or to the Panama Canal specifically must be met on time, lest we lose our control and security."

    USA_write_war_plan_jade: "Write War Plan Jade"
    USA_write_war_plan_jade_desc: "A painful colonial legacy still wracks the culture of Brazil. Luckily, whatever problems may have arisen from this over time have not had much of an impact on America. However, should the US become involved in a war in the Amazon, we need to be ready for it."

    USA_write_war_plan_mint: "Write War Plan Mint"
    USA_write_war_plan_mint_desc: "A lot of development has taken place in Argentina, but there exists the potential for aggressive powers to arise there. A war in the south of the continent would represent a difficult logistical task for us, but one we must be able to achieve nonetheless."

    USA_write_war_plan_teal: "Write War Plan Teal"
    USA_write_war_plan_teal_desc: "The dramatic coastline of Chile would make a war there an interesting affair. A full plan would be very useful to try and be prepared for any such event."

    USA_write_war_plan_vermilion: "Write War Plan Vermilion"
    USA_write_war_plan_vermilion_desc: "The Chinese communists have not held their tongue as to what they intend to do if they gain power. War or conflict against them is quite possible and in that case we will be ready."

    USA_write_war_plan_lime: "Write War Plan Lime"
    USA_write_war_plan_lime_desc: "An ancient foe of the whole world, the Mongolians could yet again rise to become a major threat."

    USA_write_war_plan_scarlet_garnet: "Write War Plan Scarlet Garnet"
    USA_write_war_plan_scarlet_garnet_desc: "Australia and New Zealand would be difficult to attack, though a war against them wouldn't be very likely in most scenarios. If war should come for whatever reason, we should draft up a general plan of attack."

    USA_write_war_plan_ruby: "Write War Plan Ruby"
    USA_write_war_plan_ruby_desc: "There is a chance that we become involved in a war in the Indian subcontinent. If that happens, it could escalate very quickly, so we need to be able to arrive and fight properly in short order."

    USA_guided_munitions: "Guided Munitions"
    USA_guided_munitions_desc: "Using newly-developed rocket technology, we can now equip our aircraft with ordinance capable of being guided into its target. Moving ships and hard-to-hit strongpoints will no longer remain untouched."

    USA_write_war_plan_onyx: "Write War Plan Onyx"
    USA_write_war_plan_onyx_desc: "The Americas lie within our sphere of protection, and that means we must be prepared to intervene in any unstable regimes across these continents. In that event, we will have a slew of detailed battle plans prepared for whatever conflict may result."

    USA_write_war_plan_diamond: "Write War Plan Diamond"
    USA_write_war_plan_diamond_desc: "Whatever our stance with our west might be, we need to be ready and able to act militarily across the Pacific, should circumstances require it. War Plan Diamond will encompass our collective efforts to take on the smaller territories across the region."

    USA_enforce_continental_security: "Enforce Continental Security"
    USA_enforce_continental_security_desc: "It is imperative that we maintain the stability and security of the Americas. If a country in this hemisphere takes it upon itself to become disruptive or dangerous to the continent, it is our job to intervene."
    USA_enforce_continental_security_unlock_tt: "Unlocks §Ydecisions§! to §Yenforce continental security§! against disruptive countries in the Americas."

    USA_build_up_pacific_territories: "Build Up Pacific Territories"
    USA_build_up_pacific_territories_desc: "The various islands we control across the Pacific represent our foothold across the waves. It would be remiss of us not to develop these territories and ensure we maintain our secure control over them."

    USA_reinforce_pearl_harbor: "Reinforce Pearl Harbor"
    USA_reinforce_pearl_harbor_desc: "The core of our Pacific power projection, the security and effectiveness of our Pearl Harbor naval base in Hawaii needs to be upheld. Adding defenses and improved base systems to Pearl Harbor should assist in our power projection capabilities."
    USA_reinforce_pearl_harbor_tt: "If §Yradar§! has been researched, a radar station can be added to Hawaii."

    USA_maintain_the_calm_waves: "Maintain the Calm Waves"
    USA_maintain_the_calm_waves_desc: "Despite rising tensions, we can leverage our naval superiority over the Pacific in order to maintain a peaceful status quo across the ocean. By focusing our foreign policy on reducing aggression and securing international trade routes, we should be able to maintain our own neutrality."

    USA_mutual_investment_in_east_asia: "Mutual Investment in East Asia"
    USA_mutual_investment_in_east_asia_desc: "Our industries stand to gain much by investing in those markets across the Pacific from us, and those markets have much to gain from a reopended American economy. Let us open up large-scale mutual investments with friendly nations across the waters!"
    USA_mutual_investment_in_east_asia_tt: "Unlocks §YDecisions§! for Mutual Investment in friendly East Asian countries \n§YWhen completed§!: \n §YUnited States§!:\n  Consumer Goods Factories Factor: §Y-5.0%§!\n §YInvestment Nation§!: \n  Gain §G1§! offsite civilian factory.\n  Political Power: §G+50§! \n  Gain Base Stability: §G+3.0%§!"

    USA_extend_american_hegemony: "Extend American Hegemony"
    USA_extend_american_hegemony_desc: "The United States has interests to our west and it is in our interest to pursue these claims. America is the greatest power in the Pacific and ought to extend its hegemony across it."

    USA_acquire_pacific_territories: "Acquire Pacific Territories"
    USA_acquire_pacific_territories_desc: "By exerting our influence across the waves, we can expand the sphere of power we project across the Pacific. In order to cement this growth of power, we will expand the territorial holdings we claim across the ocean. These lands will join us under the stars and stripes either willingly or by force."

    USA_cooperative_outreach: "Cooperative Outreach"
    USA_cooperative_outreach_desc: "We ought to apply a policy of cooperation and diplomatic partnerships to those countries across Asia and the Pacific. In this way, we will help to secure our strategic position there and we will promote a general peace and security across the region."
    USA_cooperative_outreach_tt: "§YEastern countries§! with a strong positive opinion of us will receive a §Ybonus§!."

    USA_expeditionary_industrialization: "Expeditionary Industrialization"
    USA_expeditionary_industrialization_desc: "By working with the major companies of East Asia, we can expand our industrial markets and dip our expertise into untapped regions. We have much to gain by working with other countries in their specialized industries."

    USA_spread_democracy_in_asia: "Spread Democracy in Asia"
    USA_spread_democracy_in_asia_desc: "It is our mission to share our ideals and our way of life with the nations and peoples of East Asia, showing them the benefits of democracy and liberty. Exporting these ideals should help to sway these peoples to our side."

    USA_liberty_over_east_asia: "Liberty Over East Asia"
    USA_liberty_over_east_asia_desc: "Eastern Asia, Oceania, the Pacific- this section of the globe has lagged behind Western civilization for centuries, and now it finds itself in significant risk of massive turmoil. Europe is too distant and turbulent, so the duty to protect these regions falls to us."
    USA_liberty_over_east_asia_tt: "Sends an §Rultimatum§! to Asian and Oceanic countries to demand overlordship, and to overlords of existing puppets in the region to transfer overlordship."

    USA_outback_offensive: "Outback Offensive"
    USA_outback_offensive_desc: "Now that we have landed in Australia, we need to focus our combat efforts to sweep across the open plains of the outback as rapidly as possible. Speed and maneuver will be our method of victory."

    USA_oceanic_dominance: "Oceanic Dominance"
    USA_oceanic_dominance_desc: "With our footholds established across Asia and Oceania, we will put our resources into subduing local resistance and improving local support. The sooner we get the good will of those living in these regions, the sooner we'll be able to securely move on and take more territory."

    USA_conquer_the_subcontinent: "Conquer the Subcontinent"
    USA_conquer_the_subcontinent_desc: "The vast realms of the Indian subcontinent demand a level of military operation that far exceeds maybe anything else America has ever faced. The population densities of the region and the strength and resolve of its defenders will require our focus to oust."

    USA_the_vast_frontier: "The Vast Frontier"
    USA_the_vast_frontier_desc: "The lands of the Middle Kingdom are famously vast, and her people are expansive as well. In our war against the different realms of China, we need to ensure that our troops can gain the supplies they need at every turn. However, we will also bolster our efforts by crippling the Chinese lines, giving us a window to exploit this weakness."

    USA_slay_the_dragon: "Slay the Dragon"
    USA_slay_the_dragon_desc: "In our war against China, we have determined the Middle Kingdom to be an existential threat to the United States and her allies and have made the decision to strive for victory at any cost. The beast's firey breath must be quenched; the dragon must be slain."

    USA_operation_downfall: "Operation Downfall"
    USA_operation_downfall_desc: "Our war with Japan has reached a critical juncture. Their resolve has led to their use of kamikazes against us, an ill omen for a full invasion of their home islands. However, such an invasion has been left as our only remaining course. Perhaps some other option lies in the shadows, but for now we must see to the enactment of our Operation Downfall, the invasion of Japan."

    USA_island_hopping: "Island Hopping"
    USA_island_hopping_desc: "In warring against Japan, a series of island footholds will be necessary to advance against their centers of industry and weaponry. However, the resistance we will meet will require a brutal campaign of slowly and methodically making our way across the atolls of the Pacific. We'll need to ready ourselves for an island hopping campaign."

    USA_quench_the_flames: "Quench the Flames"
    USA_quench_the_flames_desc: "We cannot allow the Chinese communists to keep their strength in Asia. They represent a heavily destabilizing factor in the region and, if left unchecked, may become a major threat to the United States. Warring against them will require a deft ability to surmount the mountains of northern China."

    USA_steppe_warfare: "Steppe Warfare"
    USA_steppe_warfare_desc: "The longtime masters of steppe warfare, the Mongolians fight effectively with mounted warriors and excel in rapid tactics. We'll meet them on the battlefield with superior speed."

    USA_america_of_the_orient: "America of the Orient"
    USA_america_of_the_orient_desc: "Ever since opening up in the 1860s, Japan has demonstrated itself to be a formidable country, able to go from a medieval society and economy to a world-class power with a mighty military. They have created a modern nation out of nothing but will in a tiny amount of time. We see reflected in their society a similar dynamism found in our own, and we can help fuel that drive further."

    USA_cross_pacific_alliance: "Cross-Pacific Alliance"
    USA_cross_pacific_alliance_desc: "The Japanese people have many similarities to the American people, and as our two nations grow closer together and our goals begin to align, we find a curious prospect: a cross-pacific alliance between countries. The land of the rising sun and the land of the brave may enter into a joint pact to secure our mutual interests and to protect and safeguard the whole of the Pacific."

    USA_anglo_eastern_investment: "Anglo-Eastern Investment"
    USA_anglo_eastern_investment_desc: "By investing capital into the territories of British Empire to our west, we can strengthen our relations to Great Britain proper and boost the development of our friends across the Pacific and past."

    USA_south_eastern_naval_actions: "South-Eastern Naval Actions"
    USA_south_eastern_naval_actions_desc: "In order to safeguard our strategic positions in the Pacific, we will work closely with our allies there to develop joint naval strategies, readying us for any potential conflicts."
    USA_south_eastern_naval_actions_tt: "South-Eastern Naval Actions"

    USA_protect_the_pacific: "Protect the Pacific"
    USA_protect_the_pacific_desc: "The islands that dot the Pacific lie vulnerable to bad actors who want to stretch their influence across the ocean. With rising tensions from major powers across the world, it is imperative that we take steps to ensure the sovereignty of the Pacific from hostile nations."

    USA_arteries_of_the_world: "Arteries of the World"
    USA_arteries_of_the_world_desc: "Incredible amounts of trade and resources move through the waters of the Pacific. If any of these trade lanes were shut off, like in other parts of the world, we would suffer terribly. We cannot allow this scenario to play out- we must invest in escorts for merchant vessels and design flotillas that will deter any threats."

    USA_the_flying_tigers: "\"The Flying Tigers\""
    USA_the_flying_tigers_desc: "With China under siege, various groups across America are raising funds in aid and others are wishing to get involved, to help directly. One such group is a wing of pilots who wish to assist the Chinese in the air against their aggressors. While sending forces directly would be beyond our scope of action, we could however permit a set of volunteer forces to find their way across the Pacific and into China..."

    USA_the_firestar_project: "The 'Firestar Project'"
    USA_the_firestar_project_desc: "There is a proposal for bolstering the military strength of China in order to allow them to resist the aggressive powers that threaten to conquer it. This so-called 'Firestar Project' would be a drain on our resources, but we have resources to spare. Furthermore, this material support to China would give us the leverage to significantly sway their politics and ideals, further aligning them with us."

    USA_guerilla_support: "Guerilla Support"
    USA_guerilla_support_desc: "We can aid the Chinese communists in their defensive war by sending them both material aid for their war effort, but also by sending them military advisors and volunteers who can help them push back their attackers."

    USA_strategic_foothold: "Strategic Foothold"
    USA_strategic_foothold_desc: "The PRC represents an advantageous position from which we might station our forces. Of course, in the pursuit of this close cooperation, we will also open our own assets to their use as well, so that we may be able to benefit from joint actions against our mutual enemies."

    USA_a_red_free_orient: "A Red-Free Orient"
    USA_a_red_free_orient_desc: "[PRC.GetNameDefCap] cannot be allowed to continue to exist. It's existence has become an existential threat to the world, and we must not delay in wiping it away."

    USA_trade_in_inner_asia: "Trade in Inner Asia"
    USA_trade_in_inner_asia_desc: "Since the rise of the Soviet Union, Mongolia has suffered tremendously and has had little to no growth or prosperity. Yet, the Mongolians remain a strong people and represent a good candidate for opening up trade and diplomatic missions to. We can't be as formal as we may like, due to the current geopolitical landscape, but we can still find some opportunities."
    USA_mastery_bonus_trade_in_inner_asia_tt: "$USA_trade_in_inner_asia$"


    USA_alliance_with_a_united_china: "The \"Dragon-Eagle Treaty\""
    USA_alliance_with_a_united_china_desc: "With our ties to China becoming closer and closer, we have drafted up a very bold and ambitious treaty that aims to cement our control over the Pacific and reaching into Asia. This treaty, which we are calling the \"Dragon-Eagle Treaty\", would bring the Chinese into our sphere of influence and establish between our two nations a military and economic alliance which would upset the global balance of power."
    USA_alliance_with_a_united_china_tt: "We will try to form an §Yalliance§! with one of the Chinese powers."

    USA_sino_american_order: "Sino-American Order"
    USA_sino_american_order_desc: "With our alliance established, let's make use of the opportunities now at our disposals. The might of a China-America partnership will be felt by the world."

    USA_reopen_trade: "Reopen Trade"
    USA_reopen_trade_desc: "It's time to make direct overtures to our old trade partners in Europe, now that our own economy is open to trade again."

    USA_extend_american_charity: "Extend American Charity"
    USA_extend_american_charity_desc: "With American charity now flowing freely once again, we can put a particular focus on enabling American citizens to extend their charitable efforts to our old trade partners across the Atlantic."

    USA_american_influence: "American Influence"
    USA_american_influence_desc: "America has done its best to retreat from Europe since the end of the Great War and the start of the Great Depression, but in our absence extreme ideologies have erupted across Europe. Regardless of the path we choose to pursue now, it would be in our interest to reintroduce our influence to the continent and try to sway things in our favor."
    USA_american_influence_tt: "Our §Yideals§! will spread to European countries we have positive relations with."

    USA_pick_a_side: "Pick a Side"
    USA_pick_a_side_desc: "The conflict that has erupted in Spain brings up a lot of questions as to what we should do in response. There are voices advocating for each side, each with their own reasons. Perhaps we should get involved..."
    USA_pick_a_side_tt: "If §Ywar support§! and §Ycongressional approval§! are §Rtoo low§!, this will be §Rpolitically costly§!."

    USA_cross_the_pond: "Cross the Pond"
    USA_cross_the_pond_desc: "We've tried our best to stay out of the worst aspects of European affairs for years now, but as we survey the lands across the Atlantic, we are forced to concede that, whether we wish for it or not, we may yet be dragged into yet another conflagration. We cannot be caught unaware."

    USA_prepare_for_another_great_war: "Prepare for Another Great War"
    USA_prepare_for_another_great_war_desc: "Once again, war is upon us.\nPeace has failed.\nAmerica must respond."

    USA_avoid_conflict: "Avoid Conflict"
    USA_avoid_conflict_desc: "The Great War has scarred us too badly for us to risk getting involved in another European conflagration. Talks of peace may not be enough, we need to take action to stay out of any potential conflict that may be brewing."

    USA_great_power_attaches: "Great Power Attaches"
    USA_great_power_attaches_desc: "We have lagged behind the great powers of Europe in our military experience and designs. We should reach out to our contacts in other major militaries to try and bring our doctrines up to par with our peers."

    USA_fund_resistance_abroad: "Fund Resistance Abroad"
    USA_fund_resistance_abroad_desc: "There are various people groups who are being oppressed abroad even as we speak, and we may be able to do something about that. We can use our special services to both support those groups who need help and to undermine those states whose expansionist policies don't align with us."

    USA_seek_regime_change: "Seek Regime Change"
    USA_seek_regime_change_desc: "Using every trick in the book, we can work towards destabilizing hostile actors from the inside out, striking at the heart of their administrations without a shot fired on our end."
    USA_seek_regime_change_tt: "The rest of the world will §Rdisapprove§! of this policy stance."

    USA_the_old_world: "The Old World"
    USA_the_old_world_desc: "A century and a half ago, we declared our independence from the old world and established the greatest nation on Earth here in the new world. Now, the old world lies in a horrid and weakened state. Perhaps it is time the sun set on the old powers and time for the United States of America to take the reins of Europe."

    USA_fell_the_warring_giants: "Fell the Warring Giants"
    USA_fell_the_warring_giants_desc: "The Old Powers are at it again, another grandiose war that will wipe them out for another 20 years. If not out of our own self interest, then we must consider intervening in Europe to save the Europeans themselves. Every argument that presents itself is on the side of stepping in."
    USA_fell_the_warring_giants_tt: "We will get §Ywargoals§! against warring European Majors"

    USA_subvert_foreign_adversaries: "Subvert Foreign Adversaries"
    USA_subvert_foreign_adversaries_desc: "Our intelligence services have already identified various points of infiltration in adversarial nations which we could exploit in order to try and disrupt their actions. These subtle strikes would be beyond the public's perception and could be taken without incurring their wrath. Why shouldn't we trip up our foes?"

    USA_promote_peace: "Promote Peace"
    USA_promote_peace_desc: "In the interest of avoiding another Great War, Congress has drafted the Declaration of Enduring Peace, a proclamation stating that a country will not use force to get its way and that it will not incite conflict. We will enlist the diplomats of the nations of Europe to sign onto the declaration in order to promote peace and geniality across the continent."

    USA_embody_peace: "Embody Peace"
    USA_embody_peace_desc: "By signing Congress' Declaration of Enduring Peace, we are making a public declaration to the country that this administration will not pursue conflict of any kind, that we intend to stay out of wars that don't concern us, that we aren't gung-ho to lose more men on another continent without a clear purpose."

    USA_embargo_hostile_actors: "Embargo Hostile Actors"
    USA_embargo_hostile_actors_desc: "We won't abide by new wars in Europe. We need to distance ourselves from these violent actors. We won't let our resources fund foreign wars."
    USA_embargo_hostile_actors_tt: "We will §Yembargo§! hostile actors and we'll receive §Ypolitical power§! for each embargo."

    USA_international_red_cross: "International Red Cross"
    USA_international_red_cross_desc: "There is great need to make sure that, despite the cruelties of war, individual soldiers maintain their rights. We will provide dramatic funding to the Red Cross to help ensure that men from any country can receive medical treatment."
    USA_international_red_cross_tt: "European nations §Ycurrently at war§! will receive IRC support."

    USA_maintain_neutrality: "Maintain Neutrality"
    USA_maintain_neutrality_desc: "We cannot engage in violence abroad- we are more civilized than that. Europe can have its wars, but we will not be a part of them."

    USA_enforce_the_naval_treaties: "Enforce the Naval Treaties"
    USA_enforce_the_naval_treaties_desc: "The London Naval Treaties are a safeguard put in place to prevent another naval arms race that could lead to yet another Great War. Those nations which flagrantly disregard it are showing their hand, revealing their latent hostilities. We must ensure the treaties are held to."
    USA_enforce_the_naval_treaties_tt: "Unlocks §Ydecisions§! to enforce the naval treaties against other nations"

    USA_withdraw_from_the_naval_treaties: "Withdraw from the Naval Treaties"
    USA_withdraw_from_the_naval_treaties_desc: "With oceans on either side of the continent, America is entirely reliant on a strong navy to be able to have any influence across the world. Though a noble cause, we can't let ourselves hamstring our abilities or our security by limiting our naval strength arbitrarily."

    USA_punish_aggression: "Punish Aggression"
    USA_punish_aggression_desc: "Our expeditionary forces will be allowed and equipped to intervene in foreign wars to stop aggressor nations directly."

    USA_operation_unthinkable: "Operation Unthinkable"
    USA_operation_unthinkable_desc: "It's been a long time coming... we must destroy [SOV.GetNameDefCap]. They represent an unavoidable threat, and we must deal with them before they go completely out of control. The scale of this war will be humungous, but we must commit all that is necessary to win."

    USA_eastern_infiltration: "Eastern Infiltration"
    USA_eastern_infiltration_desc: "Regardless of what we get from them in diplomacy, we can't really trust the [SOV.GetAdjective]s at their word. We need to have eyes on the inside that can deliver the full truth."

    USA_overwhelming_material_support: "Overwhelming Material Support"
    USA_overwhelming_material_support_desc: "[SOV.GetNameDefCap] finds itself surrounded by monstrous enemies and likely won't be able to survive the onslaught coming for them. We are willing to aid them with a great amount of our material support in order to ensure their sovereignty."

    USA_flank_the_maginot: "Flank the Maginot"
    USA_flank_the_maginot_desc: "In order to take the heartland of France, we'll need to be ready to take their coastal ports and be able to strike effectively from the air."

    USA_challenge_the_empire: "Challenge the Empire"
    USA_challenge_the_empire_desc: "It is time for the British Empire to come to a close. It has stretched its influence across the world for long enough, but now its tyranny can no longer be tolerated."

    USA_shatter_the_crown: "Shatter the Crown"
    USA_shatter_the_crown_desc: "We must push this war to its final stage. The sun must set on the British Empire."

    USA_destroy_the_reich: "Destroy the Reich"
    USA_destroy_the_reich_desc: "[GER.GetNameDefCap] has proven itself to be a terrible threat to America. We must act quickly, swiftly to remove their leadership from power and end the threat that the Germans pose."

    USA_duel_of_the_eagles: "Duel of the Eagles"
    USA_duel_of_the_eagles_desc: "There is no place for [GER.GetNameDefCap] in the world of tomorrow. We will spend every drop of blood and every spent casing necessary to decimate the black eagle."

    USA_strike_the_soft_underbelly: "Strike the Soft Underbelly"
    USA_strike_the_soft_underbelly_desc: "Whether for foothold or for containment, we are drawn to secure the Italian peninsula. This effort will need to be concentrated and effective if we are to maintain whatever breaches we establish. Should we succeed, Rome will no longer fly the [ITA.GetAdjective] flag."

    USA_join_the_allies: "Join the Allies"
    USA_join_the_allies_desc: "With the state of the world growing more and more distrustful and chaotic, having good allies is a necessity. We will apply to join in the military alliance of [ENG.GetNameDefCap] and her allies in order to both safeguard our own position and help to maintain global stability."

    USA_approach_russia: "Approach Russia"
    USA_approach_russia_desc: "In order to expand our diplomatic connections with [SOV.GetNameDefCap], we need to first reach out to them and begin building those connections directly."

    USA_no_more_american_blood: "No More American Blood"
    USA_no_more_american_blood_desc: "We're fed up with the chaos and destruction of the rest of the world. We will not get involved. Their wars are not our wars. We refuse to lose any more American blood. We refuse to bury any more of our sons."
    USA_no_more_american_blood_tt: "§RThe US commits to§! §Ypacifism§!"

    USA_arising_opportunities: "Arising Opportunities"
    USA_arising_opportunities_desc: "Though we aren't getting involved overseas directly... perhaps we don't have to. Perhaps there is more to be gained by playing the role of a merely peripheral power that picks and chooses what pieces of conflict it takes an interest in. Our intelligence services are particularly interested in what might be possible here."

    USA_pledge_for_the_axis: "Pledge for the Axis"
    USA_pledge_for_the_axis_desc: "The order led by [GER.GetName] is far more stable and holds much more potential than those rivaled against them. We would have more to gain by siding with the Germans than some other international order."

    USA_new_order: "New World Order"
    USA_new_order_desc: "Between Germany and America, the world could belong to us. Why should we limit our ambitions so much? We can take on the old powers side by side and make a new world order of our own."

    USA_a_world_split_in_two: "A World Split In Two"
    USA_a_world_split_in_two_desc: "The new world order is upon us, but our German allies don't seem very interested in sharing it with us, nor do we feel very interested in maintaining it with them. Until we eventually schism, however, we need to race ahead and claim whatever we can with the support of the Germans before they do it themselves."
    USA_a_world_split_in_two_tt: "If §Y[USA.GetNameDefCap]§! and §Y[GER.GetNameDefCap]§! are not in the same faction, §Y[GER.GetNameDefCap]§! will §Rdeclare war§! on §Y[USA.GetNameDefCap]§!."

    USA_foreign_policy: "Foreign Policy"
    USA_foreign_policy_desc: "Regardless of our internal stances, we do not exist in a vacuum. We'll need to decide how to interact with the rest of the world."
    USA_foreign_policy_tt: "Starting down a §Ypolitical path§! will reduce the completion time of this focus by §G35 days§!."

    USA_unheilige_politik: "Unheilige Politik"
    USA_unheilige_politik_desc: "As our two nations' militaries grow closer and closer, we are presented with an opportunity: a full alliance with [SOV.GetNameDefCap]. This is not a decision to be made lightly, nor perhaps is it one to make known beforehand either... but this is a game of politics, and we intend to win."
    USA_the_central_intelligence_agency: "The Central Intelligence Agency"
    USA_the_central_intelligence_agency_desc: "It's clear that we must take a more active role in the behind-the-scenes activities that dictate so much of what happens in the world. Our current investments in our intelligence agencies won't do; we require a completely new effort at this role entirely. Effective immediately, the OSS will be transformed into the CIA, which will be tasked with effectuating America's will abroad, under the radar."
    USA_the_central_intelligence_agency_tt: "The §YOSS§! will be reorganized into the §YCIA§!"

    USA_libertys_last_refuge: "Liberty's Last Refuge"
    USA_libertys_last_refuge_desc: "America still stands as the shining city on a hill... but now it seems to be the only city left shining. Those forces which extinguished democracy abroad aren't finished, and we are under no illusions of what fate they wish to bring about. Our existence is under threat.\nWe stand as the last hope of liberty in the world.\nWe must not fall... we must stand steadfast."

    USA_militia_readiness_act: "Militia Readiness Act"
    USA_militia_readiness_act_desc: "With the world temperature getting ever hotter, American citizens ought to be ready for whatever storm may await them. Volunteer defense organizations should be appraised to make sure that they would be an asset in a bad scenario rather than a barrier to work around."

    USA_federal_funding_for_citizen_defense_groups: "Federal Funding for Citizen Defense Groups"
    USA_federal_funding_for_citizen_defense_groups_desc: "To better prepare our people for a potential war at home, we'll provide funding to existing defense groups to help them maintain high standards and readiness."

    USA_public_training_programs: "Public Training Programs"
    USA_public_training_programs_desc: "In the event of a conflict, it is necessary that anyone capable of fighting knows how to fight properly. Furthermore, the more people know how to hold a gun, the easier it will be to enlist them should the need arise."

    USA_expand_the_national_guard: "Expand the National Guard"
    USA_expand_the_national_guard_desc: "In order to protect our country, we'll focus on improving the quality of our national guard and increase its funding and size."

    USA_interstate_highways: "Interstate Highways"
    USA_interstate_highways_desc: "America is a vast continent, and any conflict which reaches it will demand our ability to rapidly move across it. Creating an interstate highway network would facilitate the logistical flexibility necessary to ensure this capacity, and it would improve the overall quality of our infrastructure."

    USA_national_security_initiative: "National Security Initiative"
    USA_national_security_initiative_desc: "Threats abroad demand that we take preemptive measures to ensure the territorial integrity of the United States. We will be prepared for the worst should it arrive, and hopefully our preparedness could serve to dissuade any attacks against us in the first place."

    USA_homeland_defense_emergency_act_focus: "$USA_homeland_defense_emergency_act_focus-general_title$"
    USA_homeland_defense_emergency_act_focus_desc: "$USA_homeland_defense_emergency_act_focus-general_desc$"

    USA_coordinate_militia_defenses: "$USA_coordinate_militia_defenses-general_title$"
    USA_coordinate_militia_defenses_desc: "$USA_coordinate_militia_defenses-general_desc$"
    USA_coordinate_militia_defenses_tt: "Unlocks §Ydecisions§! to raise §Ymilitia groups§! across the country.\nDepending on how §Yprepared§! we are, a number of divisions will initially spawn.\nThe more §Yprepared§! we are, the more effectively we'll be able to raise §Ymilitia§!."

    USA_establish_strongholds_in_the_rockies: "$USA_establish_strongholds_in_the_rockies-general_title$"
    USA_establish_strongholds_in_the_rockies_desc: "$USA_establish_strongholds_in_the_rockies-general_desc$"
    USA_establish_strongholds_in_the_rockies_tt_1: "If the §Ystronghold network§! special project has been completed, build §Ystronghold networks§! across the Rockies."
    USA_establish_strongholds_in_the_rockies_tt_2: "If the §Yradar§! special project has been completed, build §Yradar stations§! across the Rockies."
    USA_establish_strongholds_in_the_rockies_tt_3: "§YNew Mexico, Colorado, Wyoming, Idaho, Montana§!:\nAdd §Y$USA_establish_strongholds_in_the_rockies_modifier$§! which grants:\nEnemy Divisions speed: §G-15.00%§!\nLocal Supplies: §G+10%§!\nEnemy Local Supplies: §G-10%§!\nDivision Attrition: §G-10.0%§!\n§YSupply Hub§! construction speed: §G+20.00%§!\n§YRailway§! construction speed: §G+20.00%§!\n§YLand Fort§! construction speed: §G+20.00%§!"

    USA_the_mississippi_bastions: "$USA_the_mississippi_bastions-general_title$"
    USA_the_mississippi_bastions_desc: "$USA_the_mississippi_bastions-general_desc$"
    USA_the_mississippi_bastions_tt_1: "If the §Ystronghold network§! special project has been completed, build §Ystronghold networks§! along the Mississippi."
    USA_the_mississippi_bastions_tt_2: "If the §Yradar§! special project has been completed, build §Yradar stations§! along the Mississippi."
    USA_the_mississippi_bastions_tt_3: "§YLouisiana, Arkansas, Missouri, Iowa, Minnesota§!:\nAdd §Y$USA_the_mississippi_bastions_modifier$§! which grants:\nEnemy Divisions speed: §G-15.00%§!\nLocal Supplies: §G+10%§!\nEnemy Local Supplies: §G-10%§!\nDivision Attrition: §G-10.0%§!\n§YSupply Hub§! construction speed: §G+20.00%§!\n§YRailway§! construction speed: §G+20.00%§!\n§YLand Fort§! construction speed: §G+20.00%§!\n"

    USA_evacuate_civilians_and_industry: "$USA_evacuate_civilians_and_industry-general_title$"
    USA_evacuate_civilians_and_industry_desc: "$USA_evacuate_civilians_and_industry-general_desc$"
    USA_evacuate_civilians_and_industry_tt: "Unlocks §Ydecisions§! to §Yevacuate civilians and industry§! from states.\nThe more states are §Yevacuated§!, the more §Rimpact§! it will have on the country."

    USA_launch_the_counteroffensive: "$USA_launch_the_counteroffensive-general_title$"
    USA_launch_the_counteroffensive_desc: "$USA_launch_the_counteroffensive-general_desc$"

    USA_spirit_of_defiance: "$USA_spirit_of_defiance-general_title$"
    USA_spirit_of_defiance_desc: "$USA_spirit_of_defiance-general_desc$"
    USA_spirit_of_defiance_tt: "Unlocks §Ydecisions§! to §Ysabotage§! the enemy in our territory and §Ylaunch attacks§! against them."

    USA_regional_strategic_commands: "$USA_regional_strategic_commands-general_title$"
    USA_regional_strategic_commands_desc: "$USA_regional_strategic_commands-general_desc$"
