    USA_regional_strategic_commands_center_tt: "Creates a §YFortified Command Center§! in the state."

    USA_america_the_proud: "America the Proud"
    USA_america_the_proud_desc: "In the 11th hour, we hold fast. We will not be pushed back, we will not fall, we will not fail. We will drive the invaders out to the sea and defeat them. Democracy will hold fast!"
    USA_america_the_proud_tt: "If we can't push the enemy out, we will start suffering §Rpenalties§!."

    USA_political_shift: "Political Shift"
    USA_political_shift_desc: "Recent upsets in the political landscape are leading to strange and unusual policies, the pursuit of democracy by different means."
    USA_political_shift_tt: "The §Ytime§! to complete this focus can be §Greduced§! based on the initial choice of path."

    USA_roosevelt_stays: "Roosevelt Stays"
    USA_roosevelt_stays_desc: "FDR has the will of the American people behind him, and his loyal government and powerful governance will carry us forward."

    USA_alf_landons_government: "Alf Landon's Government"
    USA_alf_landons_government_desc: "Alf Landon has secured the support of America, and his policies and leadership will bring America out of its malaise and into a bright new era."

    USA_asymmetric_operations: "Asymmetric Operations"
    USA_asymmetric_operations_desc: "Our intelligence agency should be specialized to work behind the scenes in other countries, to sway their publics according to our own opinions. We can use our might and wealth to demonstrate our values on the surface, and the OSS to push them underneath it."

    USA_counter_espionage: "Counter-Espionage"
    USA_counter_espionage_desc: "There is a serious threat being posed to us by foreign agents in our land. We will make sure that the enemy is unable to learn anything useful."

    USA_trade_policy: "Trade Policy"
    USA_trade_policy_desc: "We can dramatically improve the efficiency and coordination of our various trade relations by setting standards for our trade policies."
    USA_trade_policy_tt: "The §Ytime§! to complete this focus can be §Greduced§! by the §Y$USA_trade_policy$§! focus."

    USA_encourage_domestic_trade: "Encourage Domestic Trade"
    USA_encourage_domestic_trade_desc: "As the economy recovers, Americans will be able to engage in interstate commerce more frequently again. This will further improve the rate of recovery and help to restore the previous rate of growth we experienced."

    USA_grow_export_market: "Grow Export Market"
    USA_grow_export_market_desc: "We should put a special emphasis on trying to increase the goods that we can sell overseas and to help enrich America's industries."

    USA_subsidize_imports: "Subsidize Imports"
    USA_subsidize_imports_desc: "In order to bring in the materials and goods we need, we will ensure that every American can afford the best that the rest of the world has to offer."

    USA_tax_imports: "Tax Imports"
    USA_tax_imports_desc: "Fundamentally, we need to be able to be self-reliant and should try and push as much of our growth and trade to be internal as possible. For what we do bring in, we should maximize its value for us."

    USA_boost_imports: "Boost Imports"
    USA_boost_imports_desc: "America is not the only source of material wealth in the world, and in growing and developing our own wealth we should be open to receiving help from others."

    USA_emphasize_trade_leverage: "Emphasize Trade Leverage"
    USA_emphasize_trade_leverage_desc: "Our emphasis should be on getting leverage over those countries with whom we do business."

    USA_emphasize_trade_security: "Emphasize Trade Security"
    USA_emphasize_trade_security_desc: "Our emphasis should be on making sure that our economy cannot be put at risk by the actions or upsets of foreign actors."

    USA_emphasize_trade_growth: "Emphasize Trade Growth"
    USA_emphasize_trade_growth_desc: "Our emphasis should be on using foreign trade in order to maximize domestic growth."

    USA_prioritize_state_trade_authority: "Prioritize State Trade Authority"
    USA_prioritize_state_trade_authority_desc: "Fundamentally, trade authority ought to rest in the states themselves. It is from their localized economies that the whole of the country benefits."

    USA_prioritize_market_trade_authority: "Prioritize Market Trade Authority"
    USA_prioritize_market_trade_authority_desc: "Fundamentally, trade authority ought to rest with the market itself. The flow of goods and the exchange of value is too large of a process to be handled by singular organized groups."

    USA_prioritize_federal_trade_authority: "Prioritize Federal Trade Authority"
    USA_prioritize_federal_trade_authority_desc: "Fundamentally, trade authority ought to rest with the federal government. It is from the national level that the US does business with other countries, and it is from the national level that our interests need to be secured and maintained."

    USA_expand_resource_production: "Expand Resource Production"
    USA_expand_resource_production_desc: "America is full of vast reserves of yet-untapped and undiscovered resources ready to enrich our people and the world. We ought to do what we can to invest in our basic resource market. This will provide a solid base from which our advanced industries can grow."

    USA_develop_higher_quality_products: "Develop Higher Quality Products"
    USA_develop_higher_quality_products_desc: "One of the things that the American economy does best is produce high-quality equipment. We need to reinvigorate our precision machining industries to further this standard."

    USA_formalize_arms_trading: "Formalize Arms Trading"
    USA_formalize_arms_trading_desc: "With our market presence secured, we can now fully lean our industries into selling arms to countries in need of tools of defense."

    USA_international_industrial_tutelage: "International Industrial Tutelage"
    USA_international_industrial_tutelage_desc: "America's expertise in mass industry and production puts it in an excellent position to assist other countries who haven't developed their industries to the same degree we have. Why not assist them in growing too? It would stand to be a very popular move."
    USA_international_industrial_tutelage_tt: "Unlocks §Ydecisions§! to develop and grow the §Yindustries§! of other nations, in turn boosting public approval of the government."

    USA_department_of_territorial_integrity: "Department of Territorial Integrity"
    USA_department_of_territorial_integrity_desc: "The DTI will oversee our range of actions regarding how we administer those lands which we come into possession of. This is a very critical function- we aim to promote peace and liberty, but we need to be vigilant in order to not put our own people at risk."

    USA_focus_on_civil_administration: "Focus On Civil Administration"
    USA_focus_on_civil_administration_desc: "We have a duty to improve and protect the territories we control around the world, regardless of how we came to control them. We must ensure that we design any sort of occupation policy correctly, with the aim to uphold our values and the sanctity of those we govern."

    USA_apple_pie_diplomacy: "Apple Pie Diplomacy"
    USA_apple_pie_diplomacy_desc: "In dealing with foreign lands, we embody our American values and spread them wherever we go. We will win over the hearts and minds of our foes and detractors with the ease of offering them a delicious apple pie!"
    USA_apple_pie_diplomacy_tt: "Unlocks the §Y$apple_pie_occupation$§! occupation law."

    USA_reconstruction_efforts: "Reconstruction Efforts"
    USA_reconstruction_efforts_desc: "We find ourselves occupying territory that has been ravaged by conflict. We have a duty to help the people there and restore to them their way of life as best we can and as soon as possible."

    USA_foreign_development_projects: "Foreign Development Projects"
    USA_foreign_development_projects_desc: "Producing equipment, building infrastructure, and establishing safe environments in foreign territory is an entirely different beast from domestic regions. The International Development Company will be created in order to devise and coordinate the building up of our controlled territories in order to ensure good order and efficiency."
    USA_foreign_development_projects_tt: "Unlocks the §Y$international_development_company$§! industrial concern."

    USA_focus_on_maintaining_security: "Focus On Maintaining Security"
    USA_focus_on_maintaining_security_desc: "Our first priority in managing occupied lands is to see to the protection of American citizens, allies, and interests there. Once those are secured, then we can look towards supporting the existing peoples there."

    USA_industrial_continuity: "Industrial Continuity"
    USA_industrial_continuity_desc: "It's important that the regions we take control of are kept up to spec for what they are able to produce. There is no reason to let the industries of our controlled lands go to waste."
    USA_industrial_continuity_tt: "Unlocks the §Y$continuity_occupation$§! occupation law."

    USA_support_occupation_police_forces: "Support Occupation Police Forces"
    USA_support_occupation_police_forces_desc: "Our occupation troops and police are constantly under threat from extremists and radicals who would wish them harm. We'll invest in providing our law enforcement abroad with the tools and funding they need to keep the peace."

    USA_spread_american_ideals: "Spread American Ideals"
    USA_spread_american_ideals_desc: "We will embody the ideals we choose to hold sacred and promote them whenever and wherever we can. If we do so properly, then everyone else will see that the fruits of our labor are tied to the truths we profess."
    USA_spread_american_ideals_tt: "§GImproves§! the §Y$apple_pie_occupation$§! occupation law.\n§GImproves§! the §Y$international_development_company$§! industrial concern."

    USA_establish_regional_administrations: "Establish Regional Administrations"
    USA_establish_regional_administrations_desc: "We'll govern our foreign holdings with an eye towards efficiency and good management, providing for the people there, protecting our own interests, and ultimately benefiting the United States of America."
    USA_establish_regional_administrations_tt: "§GImproves§! the §Y$continuity_occupation$§! occupation law.\n§GImproves§! the §Y$international_development_company$§! industrial concern."

    USA_advanced_decryption_department: "Codebreaking"
    USA_advanced_decryption_department_desc: "Now that we have access to physical devices capable of computing mass quantities of algebraic equations in a mere fraction of the time it used to take, we can afford to develop new methods of cypher-breaking that will allow us to sneak through even the toughest codes and delve into the secrets of our adversaries."

    USA_restore_the_kadets: "Restore the Kadets"
    USA_restore_the_kadets_desc: "Once [SOV.GetNameDefCap] is defeated, it will be our mission to reestablish their short and ill-fated democratic movement and restore it to the seat of government. A blue Russia will dominate the steppes."

    USA_cold_world: "Cold World"
    USA_cold_world_desc: "With our extreme mights combined, America and [SOV.GetNameDefCap] stand poised to control the entire world. A new era is upon us, one which sees the domination of the globe by its two greatest powers, united in purpose, though perhaps not in ideology."

    USA_extensive_support_operations: "Extensive Support Operations"
    USA_extensive_support_operations_desc: "We will supply [SOV.GetNameDefCap] with a deluge of equipment and every bit of intel we can muster. We will work closely with them in order to ensure their ultimate victory against our mutual foes. However, our support will remain at that level- we don't see eye to eye on how to approach the world, we just need this war to be won."

    USA_joint_operations: "Joint Operations"
    USA_joint_operations_desc: "We will work closely with the allies in order to prosecute this war with maximum efficiency. By working together with the top military leaders of our allies, we will develop new plans of action that will allow us reach victory."

    USA_the_united_nations_alliance: "The United Nations Alliance"
    USA_the_united_nations_alliance_desc: "Our cause is one to wipe away destructive forces across the world. Every people on every continent may join our cause. We are the voice of humanity against the darkness of tyranny."
    USA_the_united_nations_alliance_tt: "United Nations Alliance"

    USA_homecoming_of_liberty: "Homecoming of Liberty"
    USA_homecoming_of_liberty_desc: "It is time for the United States of America to return to the old world, and to bring liberty with it. What the Founders began in 1776, we will now finish."

    USA_secure_europes_industries: "Secure Europe's Industries"
    USA_secure_europes_industries_desc: "As the most wealthy and industrialized continent on Earth, Europe is a supreme gift to our Union. Its vast populations and its mighty industries will contribute to the American way of life now."

    USA_stars_and_stripes_beyond_the_rhine: "Stars and Stripes Beyond the Rhine"
    USA_stars_and_stripes_beyond_the_rhine_desc: "It's time to finish our advance and push through the whole of Europe. The red, white and blue will fly from Paris to Berlin and Warsaw."
    USA_stars_and_stripes_beyond_the_rhine_trigger_tt: " Controls a state in §YEurope§!"
    USA_stars_and_stripes_beyond_the_rhine_tt: "We will get §Ywargoals§! against every §YEuropean nation§! which we are neither at war with nor allied to."

    USA_vanguard_of_the_atlantic: "Vanguard of the Atlantic"
    USA_vanguard_of_the_atlantic_desc: "Once secure, the Atlantic will no longer be just an impenetrable wall of water for our fleets, it will be the connecting tissue that ties our two continents together. It will flow over with ships carrying people, goods, machinery, knowledge, and everything else, and all the while it will be flanked and cut through by our might navy."

    USA_dawn_over_europe: "Dawn Over Europe"
    USA_dawn_over_europe_desc: "At last, Europe is under our control. Now begins the hardest part- integration. However, our culture is an amalgamation of primarily European cultures, so we will have a lot of leverage to work with in helping the old world truly adapt to and enjoin with the new world."
    #USA_dawn_over_europe_trigger_tt: " We, or our Faction members, control Paris, London, Berlin, Warsaw, Rome, and Madrid and the states they reside in."
    USA_dawn_over_europe_trigger_tt: "We, or our Subjects, control §YParis§!, §YLondon§!, §YBerlin§!, §YRome§!, and §YMadrid§! and the states they reside in."
    USA_dawn_over_europe_tt: "Unlocks §Ydecisions§! to §Gcore§! §YWestern European§! states with high §Ycompliance§!."

    USA_war_is_business: "War is Business"
    USA_war_is_business_desc: "War is many things: cruel, destructive, horrible... and profitable. We don't even need to engage in the fighting, we can let other nations fight their own conflicts while we absorb the difference in gains."
    war_is_business_flag: " Hasn't taken focus §Y$USA_casting_cinders$§! in the last §Y180§! days"
    USA_war_is_business_tt: "Unlocks §Ydecisions§! to establish other countries as §Y'Partners in Arms'§! and develop trade with them.\n  - $USA_establish_official_partnership_decision_tooltip_tt$"

    USA_balanced_carnage: "Balanced Carnage"
    USA_balanced_carnage_desc: "War may be profitable, but when war ends, so does the flow of equipment necessary to support it. In order to ensure a steady stream of profits, it may be in our interest to encourage or persuade new participants to join in, or perhaps we could even engineer our own conflicts."
    War_Credits_tt: "§YWar Credits§!"
    War_Credit_tt: "§YWar Credit§!"
    USA_balanced_carnage_tt: "Unlocks £usa_war_credits_texticon $War_Credits_tt$ \n  - Every $War_Credit_tt$ we have will net us §G5§! §YEconomic Capacity Surplus§! at the end of each month. $War_Credits_tt$ can also be spent on other things."
    USA_balanced_carnage_tt_2: "Unlocks §Ydecisions§! to interfere in the wars of our §YPartners in Arms§!, slowing them down and earning us $War_Credits_tt$."

    USA_casting_cinders: "Casting Cinders"
    USA_casting_cinders_desc: "Where there is peace abroad, we see only markets closed to the products of our war industry. This will not do. The world is just a series of powderkegs, and all they need is a spark."
    casting_cinders_flag: " Hasn't taken focus §Y$USA_war_is_business$§! in the last §Y180§! days"

    USA_aid_all_sides: "Aid All Sides"
    USA_aid_all_sides_desc: "In order to sustain war, we need to make sure that the fights don't end prematurely. Regardless of what side they aid, we need to keep each participant fighting as long as possible to bring us as much money as possible."

    USA_mutually_assured_profits: "Mutually Assured Profits"
    USA_mutually_assured_profits_desc: "Wars are such good moneymakers, but it's a shame that all of those profits don't flow to us and us alone! We'll outcompete every foreign arms-trading-nation or take over their markets ourselves, that way we end up on the positive end of whatever conflicts occur in the world. We'll watch the action and get paid to do so!"
    USA_mutually_assured_profits_trigger_tt: " Has §G[?USA.usa_arms_partners_variable]§! out of at least §R5§! §YPartners in Arms§!"
    USA_mutually_assured_profits_tt: "Unlocks §Ydecisions§! to upgrade the spirit for our §YPartners in Arms§!, holding them tightly within our grasp and benefiting us at their expense.\n  - For each §YPartner in Arms§! we have, we will now receive §G1250§! §YEconomic Capacity Surplus§! each month.\n  - Every $War_Credit_tt$ we have will now net us §G10§! §YEconomic Capacity Surplus§! at the end of each month."

    USA_orchestrate_the_infernos: "Orchestrate the Infernos"
    USA_orchestrate_the_infernos_desc: "Our war industry has matured and has grown rather competent at arranging fights between other parties. We no longer need to rely on the rivalries of other nations- we can pick and choose our customers and bring them into our market as we see fit."
    USA_orchestrate_the_infernos_trigger_tt: " Has §G[?USA.usa_arms_partners_variable]§! out of at least §R3§! §YPartners in Arms§!"
    USA_orchestrate_the_infernos_trigger_tt_2: " Has §G[?USA.usa_war_credits_var]§! out of at least £usa_war_credits_texticon §R10§! §YWar Credits§!"
    USA_orchestrate_the_infernos_tt: "Unlocks §Ydecisions§! to spend §YWar Credits§! to orchestrate §Ywars§! between countries we have significant influence over.\n\nWe will be able to reach out to form §YPartnerships§! with §Gmore countries§!."

    USA_new_continue_the_new_deal: "Continue the New Deal"
    USA_new_continue_the_new_deal_desc: "The policies of the New Deal will be furthered and its effects will be given the time they need to see fruition. This is how we will rise from the Great Depression."

    USA_double_down_on_the_new_deal: "Double Down on the New Deal"
    USA_double_down_on_the_new_deal_desc: "Though there are voices that are not supportive of the New Deal and its sweeping reforms, it is by doubling down on them that we will finally be able to relieve the American people of the Great Depression and see the United States begin to recover."

    USA_new_agricultural_adjustment_act: "Agricultural Adjustment Act"
    USA_new_agricultural_adjustment_act_desc: "The depression has struck all corners of society hard, but one of the hardest hit groups are the farmers. Not only are they struggling, but there is an absolute necessity that they continue to be able to produce food at this time. We need to boost their funds and ensure that our food supply continues to remain healthy, despite the pains being felt."
    agri_adj_act_tt: "Once successfully passed, it will still be §Rsome time§! before further §YNew Deal§! legislation can be passed."

    USA_new_fair_labour_standards_act: "Fair Labor Standards Act"
    USA_new_fair_labour_standards_act_desc: "It is important that we make sure that the average American worker gets to benefit from the economic recovery now taking place. We must ensure that no employer takes advantage of their employees, and we will back this ideal with federal law."
    USA_new_fair_labour_standards_act_tt: "\nMore legislation will have to be drafted before the §YNew Deal§! will be in full effect, though this will §Rtake time§!."

    USA_federal_zoning_reform: "Federal Zoning Reform"
    USA_federal_zoning_reform_desc: "Due to the economic downturn, there are far fewer houses being built than there should be. By easing building restrictions, expanding available land, and subsidizing construction, we will help ensure that there will be enough homes for every American."

    USA_union_defense_act: "Union Defense Act"
    USA_union_defense_act_desc: "The pain inflicted by the Great Depression has brought many people to take desperate and unkind actions towards those around them. Workers have suffered under desperate employers and are in need of protection in many cases. To this end, we will pass legislation that ensures the safety and effectiveness of worker unions across the country."

    USA_new_federal_housing_act: "Federal Housing Act"
    USA_new_federal_housing_act_desc: "The Great Depression has left millions of Americans without homes. We will spend as needed to procure new houses for our people to ensure they can at least find themselves a home. No hard-working man should need to worry about where he'll sleep at night."

    USA_restore_the_gold_standard: "Restore the Gold Standard"
    USA_restore_the_gold_standard_desc: "Though we made the decision to abandon the gold standard in order to better find the funds necessary to recover our economy, this has not worked out as hoped. We need to backtrack and restore the gold standard to reintroduce security to the dollar."

    USA_rebalancing_finances: "Rebalancing Finances"
    USA_rebalancing_finances_desc: "In restricting federal spending, we need to completely reevaluate our monetary and fiscal policies. This won't be simple, nor will it be painless, but it is necessary."

    USA_new_adjusted_compensation_act: "Adjusted Compensation Act"
    USA_new_adjusted_compensation_act_desc: "Though we don't intend to get too involved in the one-on-one transactions of our citizens, we have a duty to help the greater American nation as a whole and so will intervene in the market in order to ensure fair and honest payments to employees. As growth resumes, it shouldn't just go to business owners."
    adj_comp_act_tt: "Once successfully passed, it will still be §Rsome time§! before new §Ypolicies§! can be crafted."

    USA_new_protectionist_tariffs: "Protectionist Tariffs"
    USA_new_protectionist_tariffs_desc: "It remains necessary to prioritize American trade before that of other countries. Once we see to our own growth and recovery, then we'll have the room necessary to start investing in other economies."
    USA_new_protectionist_tariffs_tt: "\nThe government will have to pass new §Ypolicies§! before the country will fully recover, which will still §Rtake time§!."

    USA_guns_and_shovels: "Guns and Shovels"
    USA_guns_and_shovels_desc: "By making use of our men in uniforms to work on public projects, we can provide jobs for the public at the same time as we maintain our strength of deterrence against rivals overseas."

    USA_new_income_tax_reform: "Income Tax Reform"
    USA_new_income_tax_reform_desc: "By reducing the amount of taxes that flow into useless schemes and letting those who earned their dollars keep them, we can help get the average American back on his feet."

    USA_military_pensions: "Military Pensions"
    USA_military_pensions_desc: "Service to this country should come with a notion of security for those who give their time and their strength to the community. Investing in earlier and more extensive pensions for our soldiers will encourage recruiting and provide yet another source of fiscal opportunity."

    USA_new_war_propaganda: "War Propaganda"
    USA_new_war_propaganda_desc: "Conflict is coming to the American people, and they need to be ready for it. Whether a popular position or not, we have to prepare."

    USA_sway_the_public: "Sway the Public"
    USA_sway_the_public_desc: "Even with the current state of the world, much of America's population remain aligned against any sort of conflict. Unfortunately, this is not a tenable position to be in anymore. We'll have to put effort into swaying their opinion."

    USA_hollywood_endorsements: "Hollywood Endorsements"
    USA_hollywood_endorsements_desc: "We can use our massive media industry to our advantage to rally the American people together for whatever cause we need to champion."

    USA_family_films: "Family Films"
    USA_family_films_desc: "Hollywood films that center around American family values will help support the public consciousness and provide some much needed relief from the tumult of the last several years."

    USA_war_bond_campaigns: "War Bond Campaigns"
    USA_war_bond_campaigns_desc: "In order to prosecute this war effectively, we'll need the full backing and support of the American people. We'll need every asset at our disposal."

    USA_congressional_rallies: "Congressional Rallies"
    USA_congressional_rallies_desc: "With Landon's victory, the Republican party is in a prime position to rally further support across the nation and secure a dominant position across the government."

    USA_state_empowerment: "State Empowerment"
    USA_state_empowerment_desc: "It's important to ensure that the many states of the USA maintain their authority and autonomy, even in the face of an ever-expanding federal government."

    USA_support_titans_of_industry: "Support Titans of Industry"
    USA_support_titans_of_industry_desc: "By supporting our powerful industries, we can put resources into the places where they can grow the fastest and be the most effective." 

    USA_audit_emergency_programs: "Audit Emergency Programs"
    USA_audit_emergency_programs_desc: "Many different three-letter agencies and emergency programs were made in response to the crises we've faced recently, but now that we're beginning to be past those events they have begun to outlive their purpose. Though unpopular, we can't afford to hemorrhage millions of taxpayer dollars on schemes without reason."

    USA_national_parks_infrastructure: "National Parks Infrastructure"
    USA_national_parks_infrastructure_desc: "Our vast and numerous national parks could do with an upgrade in the quality of their amenities and upkeep, and we have millions of people in need of work. The federal government could fund make-work programs to satisfy both concerns at the same time."

    USA_new_wpa: "WPA"
    USA_new_wpa_desc: "The Worker Protection Agency will provide services to employees across the country to protect and empower them."

    USA_fdic: "Establish the FDIC"
    USA_fdic_desc: "After the damage caused by irresponsible banking practices, it's clear that that sort of catastrophe can't happen again. The Federal Deposit Insurance Corporation will provide monetary backing to the nations banks and regulate their policies, protecting from another potential run on the banks."

    USA_expand_social_security: "Expand Social Security"
    USA_expand_social_security_desc: "Americans' pocket books are empty far more often than they ought to be. It is the duty of the government to give its citizens prosperity. No one should have to go hungry or poor."

    USA_new_build_the_pentagon: "Build the Pentagon"
    USA_new_build_the_pentagon_desc: "The Pentagon will be the seat of America's military leadership. This facility will bolster our organizational ability and give a space for the close and efficient work of all aspects of prosecuting a war."

    USA_host_the_remnants_of_democracy: "Host the Remnants of Democracy"
    USA_host_the_remnants_of_democracy_desc: "The shores of America are the only safe haven left for those people who harbor the spirit of democracy inside of them. We must open our arms to every desperate refugee ready to fight for this cause, and we must be certain that no dangerous threats try to sneak their way in prematurely."
    USA_host_the_remnants_of_democracy_tt: "Host the Remnants of Democracy"

    USA_the_weight_of_the_world: "The Weight of the World"
    USA_the_weight_of_the_world_desc: "We've fought and bickered over many different issues for as long as this country has been around, but now we must put aside these minor concerns for the time being. At this moment, fate itself demands our attention and our focus. We must put come together and unite ourselves against the threats that now face us."

    USA_every_chip_down: "Every Chip Down"
    USA_every_chip_down_desc: "The clock has struck midnight- it is time to act. The forces of darkness crest our shores and threaten our people. Everything at our disposal must be rallied to this cause, to defeat this great evil that seeks to wipe out every trace of freedom in the world. America will rise to the occasion and strike swiftly. We must strike back."
    USA_every_chip_down_tt: "§RRemove§! §Y$tot_economic_mobilisation$§!. Gain §Y$the_eagles_might_economy$§!."

    USA_crusade_for_freedom: "Crusade for Freedom"
    USA_crusade_for_freedom_desc: "Though we have done what we can to demonstrate our own merits and raise up a grand nation here, we must now act proactively to save the world from the dangers that have engulfed it. The United States of America must extend its will across the globe and support humanity's fight for freedom everywhere. We will not stop until the forces of destruction have been silenced, and we must silence them."
    USA_crusade_for_freedom_tt: "Gain §Ywargoals§! against every country that has §Rgenerated tension§!."

    USA_political_funding: "Political Funding"
    USA_political_funding_desc: "Politics in the US is a messy business, like anywhere else. Sometimes all it takes to get the wheels moving is to give them some grease."

    USA_support_the_phillipines: "Support the Philippines"
    USA_support_the_phillipines_desc: "[PHI.GetNameDefCap] have been under our protection for decades, but now we are quickly approaching the time for them to set out on their own. In this process of developing independence, we will support their economy, administration, and defense, that way they can springboard into the wider world with ample opportunity."

    USA_new_neutrality_act: "$USA_neutrality_act$"
    USA_new_neutrality_act_desc: "$USA_neutrality_act_desc$"

    USA_new_limited_intervention: "$USA_limited_intervention$"
    USA_new_limited_intervention_desc: "$USA_limited_intervention_desc$"

    USA_new_lend_lease_act:0 "$USA_lend_lease_act$"
    USA_new_lend_lease_act_desc: "$USA_lend_lease_act_desc$"

    USA_new_arsenal_of_democracy: "$USA_arsenal_of_democracy$"
    USA_new_arsenal_of_democracy_desc: "$USA_arsenal_of_democracy_desc$"

    USA_duty_to_act: "Duty to Act"
    USA_duty_to_act_desc: "Regardless of whether or not we choose to pursue peace or war, we need to move. The world will not wait for us to make up our mind."

    USA_socialized_medical_care: "Socialized Medical Care"
    USA_socialized_medical_care_desc: "Part of what it means to live in the United States is that a person should have access to all the best that the modern world has to offer. No citizen should be denied lifesaving medical care. The government will cover the costs for those who can't afford it, that way everyone can benefit."

    USA_bolster_suffrage: "Bolster Suffrage"
    USA_bolster_suffrage_desc: "There are millions of people around the country who have the right to vote but who have not yet done so. We need to encourage everyone to do their part to represent their communities."

    USA_joint_wargaming: "Joint Wargaming"
    USA_joint_wargaming_desc: "Our military leadership needs to be prepared for conflict. We have plenty of resources to empower our men to be ready for more modern combat."

    USA_support_democracy_around_the_world: "Support Democracy Around the World"
    USA_support_democracy_around_the_world_desc: "Democracy dies alone. Wherever it still breathes, America should be standing beside it."

    USA_ramp_up_government_spending: "Ramp Up Government Spending"
    USA_ramp_up_government_spending_desc: "In order to accomplish everything on our long list of goals, Washington will need far deeper pockets."

    USA_public_works_projects: "Public Works Projects"
    USA_public_works_projects_desc: "By employing millions of Americans in public works projects around the country, Americans will be able to quickly recover from the Great Depression while they also serve and enrich their own communities."

    USA_increase_social_spending: "Increase Social Spending"
    USA_increase_social_spending_desc: "More work is needed to help the American people, and it's the job of the government to boost them up out of the ditch so many have found themselves in. The government will pay for various services for Americans across the nation so that prosperity can return."

    USA_gunnery_innovations: "Gunnery Innovations"
    USA_gunnery_innovations_desc: "New technology demands new ways of using it to fight battles, and the sea remains a realm of ever-developing strategy. Our ships are not currently designed to defend themselves from aircraft, and to this end we will develop the 'VT Fuse' in order to swat enemy dive bombers out of the air before they can strike us."

    USA_the_jeep: "The Jeep"
    USA_the_jeep_desc: "In an effort to design a new, general off-roading vehicle, we have created the ultimate role-filling automobile: the Jeep. This simple, reliable, ultra-versatile motorized vehicle will allow all aspects of our military to move about the battlefield with rapid speed and high efficiency. It might not be glamorous, but it's simple things like this that really win wars."

    USA_propose_canadian_unification: "Propose Canadian Unification"
    USA_propose_canadian_unification_desc: "With Canada having now gained its independence from Europe, we can make an offer to their government to join together our kindred nations and their peoples into a unified whole, a steadfast North America."

    USA_rotory_innovations: "Rotary Innovations"
    USA_rotory_innovations_desc: "The potentials attached to a rotorcraft which can hold a position in the air, fly slow and low, navigate terrain features, and perform close air support roles of various kinds is extremely enticing. Vehicles of this sort could fight in combat, deliver equipment, perform medical evacuations, serve as roving communication hubs and more. Though still experimental, we should put effort into maturing this technology."

    USA_DEBUG_BRANCH: "DEBUG BRANCH"
    USA_DEBUG_BRANCH_desc: "The most glorious debug branch that there ever was!"

    USA_IDEA_TEST_FOCUS: "IDEA TEST FOCUS"
    USA_IDEA_TEST_FOCUS_desc: "Tests to make sure all ideas are functioning properly."

    USA_IDEA_TEST_ECO_MODIFIERS: "TEST ECO MODIFIERS"
    USA_IDEA_TEST_ECO_MODIFIERS_desc: "Tests to show all modifiers that can be on the eco dynamic modifiers"

    USA_IDEA_TEST_GOV_MODIFIERS: "TEST GOV MODIFIERS"
    USA_IDEA_TEST_GOV_MODIFIERS_desc: "Tests to show all modifiers that can be on the gov dynamic modifiers"

    USA_IDEA_TEST_SPY_MODIFIERS: "TEST SPY MODIFIERS"
    USA_IDEA_TEST_SPY_MODIFIERS_desc: "Tests to show all modifiers that can be on the spy dynamic modifiers"

    USA_IDEA_TEST_MIC_MODIFIERS: "TEST MIC MODIFIERS"
    USA_IDEA_TEST_MIC_MODIFIERS_desc: "Tests to show all modifiers that can be on the mic dynamic modifiers"

    USA_IDEA_TEST_ARM_MODIFIERS: "TEST ARM MODIFIERS"
    USA_IDEA_TEST_ARM_MODIFIERS_desc: "Tests to show all modifiers that can be on the arm dynamic modifiers"

    USA_IDEA_TEST_NAV_MODIFIERS: "TEST NAV MODIFIERS"
    USA_IDEA_TEST_NAV_MODIFIERS_desc: "Tests to show all modifiers that can be on the nav dynamic modifiers"

    USA_IDEA_TEST_AIR_MODIFIERS: "TEST AIR MODIFIERS"
    USA_IDEA_TEST_AIR_MODIFIERS_desc: "Tests to show all modifiers that can be on the air dynamic modifiers"

    USA_new_two_ocean_navy_act: "Two-Ocean Navy Act"
    USA_new_two_ocean_navy_act_desc: "With war on the horizon, we must ensure that no enemy can ever set foot on American shores. Our navy must be able to fight any enemy in either of the two great oceans that form our borders."

    USA_burden_lessening: "Burden-Lessening"
    USA_burden_lessening_desc: "Across the country, the American people are starving and suffering. Honest men look for work but find none, strong women seek to help but haven't enough to give... It is our duty to relieve our noble people of their suffering. The government must take extraordinary measures to ensure every family can eat tonight. We will worry about tomorrow when it comes, but first we must be able to get there."

    USA_an_american_five_year_plan: "An American Five-Year Plan"
    USA_an_american_five_year_plan_desc: "The stock market crash and the failure of banks and economies worldwide have demonstrated that capitalism does not have what it takes to sustain a nation on its own. We should take note of the more novel economic systems being implemented in other countries which seem to be allowing them to continue growing and surviving despite the current chaos."
    USA_an_american_five_year_plan_tt: "- Every §Y210 days§!, the momentum of the conservative resistance against socialism will §Glessen§!."

    USA_entertain_the_radicals: "Entertain the Radicals"
    USA_entertain_the_radicals_desc: "The world feels as though it has fallen apart, and despite the best attempts of our leaders in every field and office, the American people and the people of the world suffer on. There are voices which cry out that there is a new and better path forward... perhaps it is our duty to listen."

    USA_southern_crisis: "Southern Crisis"
    USA_southern_crisis_desc: "The famine caused by the Dust Bowl is causing unsustainable damage to communities across the country, but now it has received a response from several major communities in the south. In the face of these crises, a new unified spirit is taking hold in the South, and spreading."

    USA_banner_clubs: "Banner Clubs"
    USA_banner_clubs_desc: "Across the nation, states have begun directing local communities to come together and form 'banner clubs', localized support groups of people who are caring for and tending to the needs of one another. The Federal Government in DC has lost the confidence of the people, and the states have taken it upon themselves individually to pick up the slack."

    USA_the_question_of_our_national_character: "The Question of Our National Character"
    USA_the_question_of_our_national_character_desc: "As we rebuild our nation and recover from the Great Depression, we find a new purpose for the Federal Government. Whether or not it takes center stage or yields to the states now seems to favor the latter, but it's not the only new thing to consider. America is being reborn, but how shall the phoenix rise? Do we further isolate ourselves from the world, or do we dare to stake a revolutionary new claim?"

    USA_visions_of_a_new_frontier: "Visions of a New Frontier"
    USA_visions_of_a_new_frontier_desc: "America's future lies in the development of a new frontier. That is, a future of excellence in service of the American people, in producing a better tomorrow for every citizen, in securing those conditions most conducive towards nurturing and maturing the American Dream for all."

    USA_state_autarky_movement: "State Autarky Movement"
    USA_state_autarky_movement_desc: "We will become wholly self-sufficient. A great many nations have attempted to do such a thing throughout history, but none was so blessed and prosperous as our own. North America is its own breadbasket, its rolling hills and wheat fields the palette for a multitudinous people with an insatiable hunger for adventure and growth. The great city on the hill will rise ever higher."

    USA_a_new_america: "A New America"
    USA_a_new_america_desc: "The America of yesterday was a brilliant flame atop a flickering candle, but that old light has died out. Our eyes have adjusted at last, and we now kindle a new flame, a stronger, more permanent flame, one which will not die out when the winds come biting at it. Sparks fill the Eagle's eye, and our wings unfurl for a new flight."

    USA_brotherhood_spirit: "Brotherhood Spirit"
    USA_brotherhood_spirit_desc: "In restoring our former resolve and building it up stronger than ever, we must unify and come together. We will ignite a deep, familial spirit within our nation, so that every breast may hold within it a courageous and valiant song which beats in lockstep with its every neighbor. We are a nation of settlers, explorers, inventors, warriors- brothers."
    USA_brotherhood_spirit_tt: "If a §Rcivil war§! breaks out after this focus has been §Ycompleted§!, the fighting will §Ggreatly favor§! the §YAmerican Nationalists§!."

    USA_a_golden_west: "A Golden West"
    USA_a_golden_west_desc: "The great American Eagle flies gracefully once more over its North American dominion. The New World has risen above and beyond the ashes of the Old, and a new star shines brilliantly for the whole world to see. We have dawned upon a golden west, and now all that's left to do is to ride into that glorious sunrise."

    USA_the_george_may_proposal: "The George-May Proposal"
    USA_the_george_may_proposal_desc: "Despite the general collapse of both the American and world banking systems, Wall Street appears to have a plan for recovery. Various banks, real estate companies, fund groups, corporations and private businessmen have gathered in New York to draft a plan for the stabilization of the national economy, though the plan is, at best, experimental. Is it worth a shot?"

    USA_the_capitol_hill_disaster: "The Capitol Hill Disaster"
    USA_the_capitol_hill_disaster_desc: "America is being choked out. Irresponsible banks, foolish politicians, bad policies, inflammatory media, crony influence and more have broken the back of the American economy and her people. Now, a new debacle has hit Capitol Hill and resulted in fights breaking out between our representatives. The American people need stronger, smarter, sturdier leadership."

    USA_a_fallen_roost_among_the_cinders: "A Fallen Roost Among the Cinders"
    USA_a_fallen_roost_among_the_cinders_desc: "Four years ago, the atom was split for the first time. A new danger lurks beyond the horizon and threatens to swallow up not just the US but the entire world while it is in the midst of collapse and tragedy. War is coming and humanity is not ready. Those with the eyes to see what approaches must act."
# Nationalist Communist
    USA_labor_councils: "Labor Councils"
    USA_labor_councils_desc: "Across the country, labor councils will be formed in order to protect workers' rights and to coordinate a network of economic activity that will help kickstart the country back into action."

    USA_graduated_taxation: "Graduated Taxation"
    USA_graduated_taxation_desc: "In order to raise the funds necessary for proper state action and intervention, we will encourage the rich to pay their fair share through a more progressive tax system."

    USA_representation_reform: "Representation Reform"
    USA_representation_reform_desc: "American citizens need to be more able to influence the actions of their representatives in Congress. Furthermore, more Americans need to be able to have their voices heard. Young, foreign, forgotten, it doesn't matter- one's voice is what matters. Furthermore, the peoples' unions need to be given their own voices as well, so that each group is properly heard."

    USA_american_economic_industrial_organization: "American Economic Industrial Organization"
    USA_american_economic_industrial_organization_desc: "Private industry and banking was at fault for the Great Depression, but it isn't all bad. Amongst the weeds there are a few healthy stalks. As for the rest of the private sector, however, their affairs and their conduct will be closely monitored and guided by the watchful guardian of the people."

    USA_industrial_recovery_NC: "Industrial Recovery"
    USA_industrial_recovery_NC_desc: "The nation is slowly beginning to recover from the Great Depression, and thanks to the new spending programs of the government and the hard work of the people, America's industrial capabilities are coming back online."

    USA_red_july: "Red July"
    USA_red_july_desc: "America has recovered from the Great Depression and has found a new path forward into the future. The United States People's Republic will now take on the mantle of the USA before it and guide her people to a greater, more prosperous tomorrow!"

    USA_homeland_defense_emergency_act_focus_NC: "$USA_homeland_defense_emergency_act_focus-general_title$"
    USA_homeland_defense_emergency_act_focus_NC_desc: "$USA_homeland_defense_emergency_act_focus-general_desc$"

    USA_coordinate_militia_defenses_NC: "$USA_coordinate_militia_defenses-general_title$"
    USA_coordinate_militia_defenses_NC_desc: "$USA_coordinate_militia_defenses-general_desc$"

    USA_establish_strongholds_in_the_rockies_NC: "$USA_establish_strongholds_in_the_rockies-general_title$"
    USA_establish_strongholds_in_the_rockies_NC_desc: "$USA_establish_strongholds_in_the_rockies-general_desc$"

    USA_the_mississippi_bastions_NC: "$USA_the_mississippi_bastions-general_title$"
    USA_the_mississippi_bastions_NC_desc: "$USA_the_mississippi_bastions-general_desc$"

    USA_evacuate_civilians_and_industry_NC: "$USA_evacuate_civilians_and_industry-general_title$"
    USA_evacuate_civilians_and_industry_NC_desc: "$USA_evacuate_civilians_and_industry-general_desc$"

    USA_launch_the_counteroffensive_NC: "$USA_launch_the_counteroffensive-general_title$"
    USA_launch_the_counteroffensive_NC_desc: "$USA_launch_the_counteroffensive-general_desc$"

    USA_spirit_of_defiance_NC: "$USA_spirit_of_defiance-general_title$"
    USA_spirit_of_defiance_NC_desc: "$USA_spirit_of_defiance-general_desc$"

    USA_regional_strategic_commands_NC: "$USA_regional_strategic_commands-general_title$"
    USA_regional_strategic_commands_NC_desc: "$USA_regional_strategic_commands-general_desc$"

    USA_red_new_deal: "Red New Deal"
    USA_red_new_deal_desc: "After Roosevelt was elected to office, he and the Democrats pursued a suite of legislation known as the New Deal in order to combat the problems facing the nation. However, their efforts were stalled by various groups and individuals who weren't comfortable with the changes being made. When we are sick, we cannot let ourselves be afraid of the medicine necessary to heal us."

    USA_engines_of_industry: "Engines of Industry"
    USA_engines_of_industry_desc: "Now that the country is beginning to recover to its previous levels of output before the Great Depression, we can start focusing on more specific sections of the economy and the population. We should ensure that we are able to fully restore our industrial base and fully heal the wounds inflicted on American communities."
    USA_engines_of_industry_tt: "§YUnlocks§! the §Y$USA_general_motors$§! industrial concern."

    USA_industrialize_the_south: "Industrialize the South"
    USA_industrialize_the_south_desc: "Since the founding of this country, the American South has been left behind in its industrial and technological maturity. It is a region that needs to be brought up to speed."

    USA_restore_the_north: "Restore the North"
    USA_restore_the_north_desc: "The North is the historical core of our industrial might and has been hit hard by the Great Depression. It'll take significant action to turn it all back on."

    USA_TVA_expansion: "TVA Expansion"
    USA_TVA_expansion_desc: "The Tennessee Valley Authority was created to help electrify the countryside of Tennessee, but it's clear that its work should extend beyond the state's borders."
    USA_TVA_expansion_tt: "§Y[367.getName]§!, §Y[368.getName]§!, §Y[369.getName]§!, §Y[370.getName]§!, §Y[372.getName]§!, §Y[373.getName]§!: \n   Add §G1§! Building Slots. \n   Add §G1§! §Y$energy_infrastructure$§!. \n   Add §Y$USA_tva_expansion_modifier$§! which grants: \nConstruction Speed: §G+5.00%§! \n§Y$infrastructure$§! construction speed: §G+15.00%§! \n§Y$rail_way$§! construction speed: §G+15.00%§!"

    USA_grand_public_works: "Grand Public Works"
    USA_grand_public_works_desc: "The legacy of America's productive capacity will carry us forward as we shape nature to suit our will."

    USA_protecting_our_land: "Protecting Our Land"
    USA_protecting_our_land_desc: "The vast stretches of America, the rolling fields and grand mountain ranges, its beautiful, untapped natural excellence- it is the duty of the American people to respect this glorious terrain and preserve it for our posterity."

    USA_funds_to_reopen_factories: "Funds to Reopen Factories"
    USA_funds_to_reopen_factories_desc: "In order to fully restore our industrial prowess, we'll need to bring in resources from every part of the country, from every able community, from every stockpile of funds available to us. It will be a costly endeavor, but one that will more than pay out in the long run."

    USA_the_western_project: "The Western Project"
    USA_the_western_project_desc: "The vast majority of America is not just unsettled, but utterly untouched. A vast frontier ripe for development, for projects of such incredible scales as which have never before been seen. We will make use of our abundance."
    USA_the_western_project_tt: "Unlocks §Ydecisions§! to develop the American Midwest."

    USA_the_frontier_sandbox: "The Frontier Sandbox"
    USA_the_frontier_sandbox_desc: "The American Midwest remains an open canvas for our imagination; we will build great works there and use the land to build the future."
    USA_the_frontier_sandbox_tt: "Unlocks additional, §Gmore powerful§! §Ydecisions§! to develop the American Midwest."

    USA_state_labor_associations: "State Labor Associations"
    USA_state_labor_associations_desc: "A great many workers in this country have never participated in unions and so may be unfamiliar with how to join them and make their voices heard. By having each individual state establish its own set of standardized unions, we can help alleviate that ignorance."

    USA_spread_expertise: "Spread Expertise"
    USA_spread_expertise_desc: "One of the problems with uncontrolled capitalism is the isolation of expertise to select figures who monopolize their knowledge and skills at everyone else's expense. By creating community programs to spread specialized knowledge to the general public, we can stop these trends."

    USA_light_machinery_training: "Light Machinery Training"
    USA_light_machinery_training_desc: "By focusing the technical training of new workers on light machinery, we can more quickly output basic consumer goods and simpler products."

    USA_heavy_machinery_training: "Heavy Machinery Training"
    USA_heavy_machinery_training_desc: "By focusing on training up workers to operate heavy machinery, we can continue to maintain our industrial edge in the world."

    USA_employ_the_boy_scouts: "Employ the Boy Scouts"
    USA_employ_the_boy_scouts_desc: "There are thousands of capable young men who have already taken early steps towards greater maturity in our society. Those who go far enough to become Eagle Scouts demonstrate their competency at an early age. Why not introduce some new and productive merit badges?"

    USA_liberty_rides_the_rivers: "Liberty Rides the Rivers"
    USA_liberty_rides_the_rivers_desc: "The natural water arteries of North America are a huge boon to America. Utilizing these avenues to the fullest will further our ability to make use of our vast territories."
    USA_liberty_rides_the_rivers_tt: "For every midwestern state that has had the §YEncourage Growth§! decision made on it, we will gain §G15§! §Ypolitical power§! and §G1%§! §Ystability§!. \nFuture uses of the decision will also refund §G5§! §Ypolitical power§! on completion."

    USA_heal_the_heart_of_rural_america: "Heal the Heart of Rural America"
    USA_heal_the_heart_of_rural_america_desc: "After the Great Depression, the Dust Bowl, and decades of neglect from the coastal elites, the countryside and small-town America felt left behind and discarded, but now we can help alleviate these woes with proper care, funding, and focus. We will not abandon anyone in this country, great or small, near or far."

    USA_that_well_never_be_wanting: "...That We'll Never Be Wanting"
    USA_that_well_never_be_wanting_desc: "By investing so heavily into our people, we can decentralize significant amounts of industrial systems and allow communities across the country to handle ad-hoc substitutes which directly benefit those doing the work while also creating more opportunities for new and inventive solutions to any and all problems."
    USA_that_well_never_be_wanting_tt: "For every midwestern state that has had a §Y$USA_the_frontier_sandbox$§! decision made on it, we will gain §G1§! §Yoff-map civilian factory§! and §G1§! §Yoff-map military factory§!. \nFuture uses of these decisions will also give §G1§! §Yoff-map civilian factory§! on completion."

    USA_that_well_never_go_hungry: "...That We'll Never Go Hungry"
    USA_that_well_never_go_hungry_desc: "Following the terrible times of the Dust Bowl, it is imperative that we do not let the American people come into risk of famine or starvation ever again. Perhaps the most essential duty of a good community and government is to make sure that every man, woman and child can put food on the table. We will ensure our farms are bolstered and better-funded."

    USA_meritocratic_managers: "Meritocratic Managers"
    USA_meritocratic_managers_desc: "While capitalism is far from perfect, it does nominally profess that those who lead or run companies and factories ought to be those who are best suited for the job, to maximize results. The industrial progress America has made up until now is proof that this principle was at least in view, and now we can focus in on it far better."

    USA_representative_work_leaders: "Representative Work Leaders"
    USA_representative_work_leaders_desc: "In every gathering of like-minded people, there will always naturally arise leaders amongst them. These spirited individuals, peers of their fellows and capable by position, ought to be encouraged to take on the mantles of greater leadership in the American industry at large."

    USA_american_exceptionalism: "American Exceptionalism"
    USA_american_exceptionalism_desc: "We have a long history of forward thinking and innovative problem-solving, and now that we are free from those top-down forces which would've ignorantly and fearfully repressed the creativity of the general public, we are free to pursue the technologies and methods of tomorrow!"

    USA_resource_security: "Resource Security"
    USA_resource_security_desc: "There remain forces around the world which are not pleased with the pursuits of the American people, and even more forces which are jealous of our prosperity. We should make sure that none of these potential belligerants are in a position to force our hand by withholding essential goods that we need from them."

    USA_advanced_machining: "Advanced Machining"
    USA_advanced_machining_desc: "Maintaining the edge when it comes to high-quality machine tools will ensure that American factories outproduce those who would wish to rival us."

    USA_a_truly_democratic_economy: "A Truly Democratic Economy"
    USA_a_truly_democratic_economy_desc: "America has been the world's largest economy for decades now, but now it is also the world's freest and most fair. Lady Liberty's torch illuminates a thousand factory floors filled with the hardest-working, most-ingenious, most-industrious citizens on Earth."

    USA_no_one_left_behind: "No One Left Behind"
    USA_no_one_left_behind_desc: "It is part of the American way that everyone should have the opportunity to make a great life for themselves. No American should be excluded from the opportunity to better their life."

    USA_america_for_her_people: "America For Her People"
    USA_america_for_her_people_desc: "While America stands as a beacon of progress and opportunity among the nations, her chief concern is for her own people, for stability, progress, and opportunity at home."

    USA_give_me_your_poor_your_tired_masses: "Give Me Your Poor, Your Tired Masses"
    USA_give_me_your_poor_your_tired_masses_desc: "The American Dream extends to every man, woman and child across the globe who seeks a better life and is willing to work for it. Lady Liberty opens her arms to the great masses of the world, ready to extend the same promise to them all."

    USA_elevate_the_common_american: "Elevate the Common American"
    USA_elevate_the_common_american_desc: "The American tradition has always emphasized the importance of the individual, of self-determination, of the inalienable rights afforded to each person. With the changes that have been made to the government and the economy, we stand in a better position to respect that tradition to the fullest."

    USA_unrestricted_specialization: "Unrestricted Specialization"
    USA_unrestricted_specialization_desc: "The excellent standards which we strive for in America are the byproduct of the incredible focus and hard work that the average American displays in their day-to-day efforts. Now that every citizen has more access to high-level training and experience than every before, we are able to achieve new heights of output and quality."

    USA_every_worker_finds_their_voice: "Every Worker Finds Their Voice"
    USA_every_worker_finds_their_voice_desc: "Across history and especially since the start of the industrial revolution, the workplace has often been a very harsh environment for the workers who've occupied it, but now that we have better sorted out the role of authority there, American workers are now freer than ever to find a new comfort and purpose in their duties."

    USA_protecting_our_peace: "Protecting Our Peace"
    USA_protecting_our_peace_desc: "The American people must be ready to defend our hard-won peace if the day ever comes when we are truly threatened at home."

    USA_2a_chapters: "2A Chapters"
    USA_2a_chapters_desc: "The 2nd Amendment is one of the defining characteristics of American culture as distinct from the rest of the world, and it means that, should the American nation be threatened from without, there are many citizens able to rise up to help defend the country. To this end, coordinating more dedicated chapters of citizen defenders will help protect us from that eventuality."

    USA_community_stockpiles: "Community Stockpiles"
    USA_community_stockpiles_desc: "In the event of an intrusion into our homeland, each community will have to do its part to protect themselves and the whole of the American people. Therefore, it is important that communities around the country put together their own independent stockpiles of rations, equipment, arms, and general supplies."

    USA_rural_simeon_crucibles: "Rural Simeon Crucibles"
    USA_rural_simeon_crucibles_desc: "Developed by American patriots in the southwest, 'Simeon Crucibles' are small manufacturies capable of allowing small towns to produce decent volumes of basic munitions and small arms with general materials. Teaching people around the country how to make these setups will ensure that we can always continue to defend ourselves, even when our concentrated forces are short on supply."

    USA_border_plans: "Border Plans"
    USA_border_plans_desc: "To defend against an invasion of the continent, we need to put effort into building up our border defenses."

    USA_shoreline_plans: "Shoreline Plans"
    USA_shoreline_plans_desc: "To defend against an invasion of the continent, we need to put effort into preparing our coastline to repel a seaborne assault."

    USA_external_politics_NC: "External Politics"
    USA_external_politics_NC_desc: "Regardless of our stances internally, we do not live in a vacuum. We must decide how we are going to interact with the rest of the world."

    USA_learning_from_others: "Learning from Others"
    USA_learning_from_others_desc: "There is a certain peril that comes from trying to play the game of nationhood without noting the actions or positions of the other players. We'll need to make sure that we stay one step ahead of our enemies."

    USA_educate_our_protectorates: "Educate Our Protectorates"
    USA_educate_our_protectorates_desc: "Thanks to our position with regards to our client states, we can help modernize and progress their governments and cultures."

    USA_protect_american_liberty: "Protect American Liberty"
    USA_protect_american_liberty_desc: "America is not chiefly concerned with what goes on in the rest of the world- we are busy building the future at home. As such, our focus will remain on building the future and ensuring our own continued peace."

    USA_focus_on_domestic_prosperity: "Focus On Domestic Prosperity"
    USA_focus_on_domestic_prosperity_desc: "America is for its people, and the people are for America. We will spare no expense in building up this country for this generation and every generation after."

    USA_rose_tinted_lampstand: "Rose-Tinted Lampstand"
    USA_rose_tinted_lampstand_desc: "Immigrants have sought out America as a land of opportunity, and they were right to do so, but now we have furthered that station by adopting a more equitable set of policies and ways of living. We intend to surpass even our previous heights of fame and serve as a true example of freedom and excellence that the rest of the world may follow."

    USA_the_eagles_bulwark: "The Eagle's Bulwark"
    USA_the_eagles_bulwark_desc: "The prosperity we now enjoy will inevitably become too tempting for foreign actors to leave well alone. We cannot simply engender greatness; we must protect what we have earned."

    USA_throw_out_the_forces_of_tyranny: "Throw Out the Forces of Tyranny"
    USA_throw_out_the_forces_of_tyranny_desc: "The time is now! We must mount every effort we have to remove these foreign invaders and despots from our lands! We must not fail, we must give it everything we can."

    USA_secure_peace_guarantees: "Secure Peace Guarantees"
    USA_secure_peace_guarantees_desc: "We will host a conference of nations in order to secure mutual peace guarantees from the world's major players, which will help to maintain our safety at home."

    USA_peaceful_and_proud: "Peaceful and Proud"
    USA_peaceful_and_proud_desc: "While America does have a long history of warfare, we are now turning our eyes inwards and are focusing on bettering the lives of our own people. We are strong and we feel no need to have to outwardly prove that."

    USA_proselytize_north_america: "Proselytize North America"
    USA_proselytize_north_america_desc: "We will spread our more-fully-realized vision of progress and prosperity, liberty for all, to the entire continent of North America. The New World will be bathed in the warm red glow of freedom."

    USA_wheatstock_international: "Wheatstock International"
    USA_wheatstock_international_desc: "The Wheatstock station here in America has become a striking hit and a great example of proper messaging done right. If it and other cultural objects had their reach extended beyond our borders, they could prove extremely effective in spreading our values elsewhere."

    USA_liberty_abroad: "Liberty Abroad"
    USA_liberty_abroad_desc: "Though our resources are focused on inwards development, we ought to spare a penny to lift up our ideals in other countries and places around the world."

    USA_sons_of_liberty_brigades: "'Sons of Liberty' Brigades"
    USA_sons_of_liberty_brigades_desc: "The American people feel for the oppressed and the attacked around the world, and they are lining up voluntarily forming groups of like-minded individuals and setting off for foreign battlefields, hoping to make a positive impact in the world."

    USA_crimson_flag_crimson_hearts: "Crimson Flag, Crimson Hearts"
    USA_crimson_flag_crimson_hearts_desc: "The Canadian people have a similar past and culture to our own. We will bring them into the light and into our sphere."

    USA_a_revolution_across_the_border: "A Revolution Across the Border"
    USA_a_revolution_across_the_border_desc: "We will support the Mexican people and bring them into the light alongside us!"

    USA_the_whiskey_jay_compatriot: "The Whiskey Jay Compatriot"
    USA_the_whiskey_jay_compatriot_desc: "Now that the Canadians have seen the light of true liberty, we will attempt to integrate them into our sphere."
    USA_the_whiskey_jay_compatriot_tt: " - If they §Rrefuse§!, we will be given a §Rwargoal§! against them!"

    USA_the_golden_eagle_compatriot: "The Golden Eagle Compatriot"
    USA_the_golden_eagle_compatriot_desc: "Now that the Mexicans have risen up and engendered liberty in their hearts, it is time to reach out to them to bring them into our sphere."
    USA_the_golden_eagle_compatriot_tt: " - If they §Rrefuse§!, we will be given a §Rwargoal§! against them!"

    USA_the_western_peoples_coalition: "The Western Peoples' Coalition"
    USA_the_western_peoples_coalition_desc: "It is time for North America to set itself apart from the world and demonstrate that it has found the truest path to liberty on its own road, separate from the Old World."

    USA_arsenal_of_liberty: "Arsenal of Liberty"
    USA_arsenal_of_liberty_desc: "America has built itself into a city on a hill, one which upholds the greatest values of liberty and freedom. However, these values are not shared across the world and may indeed come under threat. Furthermore, there may come a day when Americans must venture forth from their homes to free the peoples of other lands as well. America must become the arsenal of liberty to support these ventures."

    USA_internal_politics_NC: "Internal Politics"
    USA_internal_politics_NC_desc: "If this country is going to see itself through the Depression, it will take significant focus and energy to guide its course."

    USA_wheatstock_radio: "Wheatstock Radio"
    USA_wheatstock_radio_desc: "Broadcasting from an anonymous location somewhere in Missouri, the 'Wheatstock' broadcasts have gained significant audiences in places of gathering across the country. Playing in bars, hotels, clubs and even expensive mobile sets, its messages upholding the virtues of more socialist-oriented democratic systems are swaying hearts and minds throughout the nation."

    USA_destigmatize_socialism: "Destigmatize Socialism"
    USA_destigmatize_socialism_desc: "Even despite the failures of capitalist doctrines in our country, socialism still carries a very negative connotation for most people. It'll take some work to fix that chasm in the public consciousness, even if it stings a little."

    USA_socialist_womens_organizations: "Socialist Women's Organizations"
    USA_socialist_womens_organizations_desc: "By leveraging the socialist bent that's already present in many feminist groups around the country, we can get the nation's women to fall in behind our messaging."

    USA_lift_the_peoples_spirits: "Lift the Peoples' Spirits"
    USA_lift_the_peoples_spirits_desc: "One tragedy after another has hit this country for several years at this point, leading to a general sense of pessimism and hard luck. However, we know that the future could be bright. We can rouse the spirits of the public and get them motivated to do their parts to get out of these troubles."

    USA_organize_new_unions: "Organize New Unions"
    USA_organize_new_unions_desc: "The backbone of any sort of socialist system is a network of work unions which allow every productive citizen to channel their energies usefully."

    USA_stand_up_for_the_unemployed: "Stand Up for the Unemployed"
    USA_stand_up_for_the_unemployed_desc: "A great many able-bodied people workers have had no opportunity to earn a living and provide for themselves and those around them, to no fault of their own. They must be taken care of."
    USA_stand_up_for_the_unemployed_tt: "Only §Yone§! of this focus and §Y$USA_homeless_relief_funds$§! will §Ylower§! conservative resistance.\n "

    USA_homeless_relief_funds: "Homeless Relief Funds"
    USA_homeless_relief_funds_desc: "In the Home of the Brave, the brave ought to have homes. No one should have to stir in their sleep because they couldn't find a loft under which to rest their heads."
    USA_homeless_relief_funds_tt: "Only §Yone§! of this focus and §Y$USA_stand_up_for_the_unemployed$§! will §Ylower§! conservative resistance.\n "

    USA_socialist_patriot_parades: "Socialist Patriot Parades"
    USA_socialist_patriot_parades_desc: "We do not intend to adopt the violent revolutions that have gripped other countries around the world, nor engage in any sort of 'reign of terror'. We are Americans, proud patriots of our gleaming national legacy. The ways of yesterday were not old or wrong, they were simply incomplete; we strive to complete them in the American tradition."

    USA_denounce_capitalism: "Denounce Capitalism"
    USA_denounce_capitalism_desc: "America has charted a great course up until now, but the insidious forces of capitalism has nipped at its heels until it fell. The Great Depression was the clearest sign of the failures of this form of economic organization, and we must set ourselves against it!"
    USA_denounce_capitalism_tt: "We will gain a §Ydecision§! to §Rstart a civil war early§!. The less §Yconservative resistance§! there is, the worse it will be for them."

    USA_demand_government_action: "Demand Government Action"
    USA_demand_government_action_desc: "In line with our inspiring social movements, the Roosevelt administration has put forward an amendment to the constitution to be voted on which will enshrine union representatives into Congress and increase their authority in the workplace. The common American citizen will finally have their full voice allotted to them!"

    USA_protect_productive_entrepreneurs: "Protect Productive Entrepreneurs"
    USA_protect_productive_entrepreneurs_desc: "Many socialists and communists will argue that everyone in the capitalist class is evil by definition, but really our problems just stem from those greedy individuals who've never actually contributed anything to get their wealth. On the other hand, those whose hard work improves everyone's lives- they should be venerated for the work they've done."
    USA_protect_productive_entrepreneurs_tt: "Only §Yone§! of this focus, §Y$USA_american_worker_guilds$§!, and §Y$USA_federal_honor_programs$§! will §Ylower§! conservative resistance.\n "

    USA_american_worker_guilds: "American Worker Guilds"
    USA_american_worker_guilds_desc: "The American people harbor some of the greatest industrial and technical expertise in the world. By combining local business unions into larger trade guilds, we can coordinate the knowledge and skills of an entire industry to help it grow more effectively."
    USA_american_worker_guilds_tt: "Only §Yone§! of this focus, §Y$USA_protect_productive_entrepreneurs$§!, and §Y$USA_federal_honor_programs$§! will §Ylower§! conservative resistance.\n "

    USA_federal_honor_programs: "Federal Honor Programs"
    USA_federal_honor_programs_desc: "For those individuals who have just gotten a rotten deal in life, we can create national honor programs that will give housing, food, and support while providing training, experience, and real productive work to help get them up onto their own two feet."
    USA_federal_honor_programs_tt: "Only §Yone§! of this focus, §Y$USA_protect_productive_entrepreneurs$§!, and §Y$USA_american_worker_guilds$§! will §Ylower§! conservative resistance.\n "

    USA_culmination_of_the_founding_fathers: "Culmination of the Founding Fathers"
    USA_culmination_of_the_founding_fathers_desc: "At the founding of our country, we set out to secure peace, justice, and opportunity for all who came to America. It has been a long journey, but we have finally arrived. The Founding Fathers would be proud of what we have achieved here."

    USA_property_reform: "Property Reform"
    USA_property_reform_desc: "If we are to truly heal this nation, we cannot simply act in the name of 'reform', but rather we must fundamentally alter those systems of power in this country which are responsible for our troubles. We do not wish to completely abolish private property, but we do intend to make public those items which are being unduly hoarded and restricted."

    USA_soviet_style_policies: "Soviet-Style Policies"
    USA_soviet_style_policies_desc: "The Soviet Union has demonstrated the economic policies necessary to run a more centralized-economy. While we aren't quite so centralized as they are, it's become clear that the capitalist class cannot be left alone to their own devices and must be managed and overseen."

    USA_rally_disaffected_militias: "Rally Disaffected Militias"
    USA_rally_disaffected_militias_desc: "Many communities around the country remain disillusioned with how the government has so far tried to handle their problems. Given what we are aiming for, it would be prudent to go ahead and start organizing resistance groups who will be ready to take charge if things turn hot."
    USA_rally_disaffected_militias_tt: "When the §Ycivil war starts§!, we will gain an additional §Y8 militia units§! and §Y75k manpower§!."

    USA_apple_pie_barns: "'Apple Pie' Barns"
    USA_apple_pie_barns_desc: "In rural locations in areas with strong support, we'll help establish what we'll call 'apple pie' barns. Using apple crates and other food containers, we'll smuggle serious amounts of military hardware into safehouses across the country which will help our future cause. Of course, to the uninformed, it'll all just look like some neighborly baking projects."
    USA_apple_pie_barns_tt: "When the §Ycivil war starts§!, we will gain §Y10k infantry equipment§!, §Y1k support equipment§!, and §Y1k towed artillery§!."

    USA_invite_foreign_freedom_fighters: "Invite Foreign Freedom Fighters"
    USA_invite_foreign_freedom_fighters_desc: "Our cause is shared with millions across the world. We will call on the support of foreign freedom fighters to assist in our struggle!"
    USA_invite_foreign_freedom_fighters_tt: "Two weeks after the §Ycivil war starts§!, we will gain §Y6 foreign volunteer divisions§!."
    USA_invite_foreign_freedom_fighters_tt_2: "A week after completing this focus, we will gain §Y6 foreign volunteer divisions§!."

    USA_the_people_rise_up: "The People Rise Up!"
    USA_the_people_rise_up_desc: "Now is the time to act! Rush for victory, secure our future, rise up against the corporatist oppressors!"
    USA_the_people_rise_up_tt: "  Our §Yopponent§! in the civil war will suffer the following: "
    USA_the_people_rise_up_tt_2: "  for §Y180§! day(s)."

    USA_redistribute_the_vieux_riches: "Redistribute the Vieux Riches"
    USA_redistribute_the_vieux_riches_desc: "Thousands of wealthy capitalists in this country have never contributed a single cent in their lives. They live off of the backs of hardworking Americans and use their resources to make the people's lives harder. The European societies may tolerate this, but we will not."

    USA_bury_the_robberbarons: "Bury the Robberbarons"
    USA_bury_the_robberbarons_desc: "Many of the newer elites in this country became such by monopolizing and wrecking large industries at the layman's expense. These 'Roberbarons' have hurt the lives of millions of Americans and must be gotten rid of, their assets seized for the good of the people."

    USA_amnesty_for_the_ignorant: "Amnesty for the Ignorant"
    USA_amnesty_for_the_ignorant_desc: "A great many Americans rose against our cause without any malice in their hearts. They were simply ignorant of the arc of history, yet they remain our brothers and sisters. We must forgive those who stand with us who previously thought themselves our enemies."

    USA_manifest_equality: "Manifest Equality"
    USA_manifest_equality_desc: "The American experiment set out to create a land of opportunity where anyone and everyone would be free to pursue their own prosperity and be untrampled on by harsh authorities. Now that we have progressed beyond the limits imposed on us by our European heritage, we can fulfill that experiment."

    USA_the_vision_of_1776_achieved: "The Vision of 1776 Achieved"
    USA_the_vision_of_1776_achieved_desc: "In 1776, a revolution against the old ways of Europe was officially declared. It sought to take lessons learned from the Old World and build off of them to create a New World, one where the individual is maximized and in so doing the greater community was maximized. What was started more than 150 years ago, we have now achieved! The New World will be a utopia."

# American Nationalist
    USA_industrial_recovery_AN: "Industrial Recovery"
    USA_industrial_recovery_AN_desc: "The spinning of gears, the steam of engines, the shrill of whistles- the pace of the country is returning to a lively state once again. It has been greatly helped by those groups of Americans who have set upon themselves to work for their communities and cooperate with those groups beyond their towns."

    USA_homeland_defense_emergency_act_focus_AN: "$USA_homeland_defense_emergency_act_focus-general_title$"
    USA_homeland_defense_emergency_act_focus_AN_desc: "$USA_homeland_defense_emergency_act_focus-general_desc$"

    USA_coordinate_militia_defenses_AN: "$USA_coordinate_militia_defenses-general_title$"
    USA_coordinate_militia_defenses_AN_desc: "$USA_coordinate_militia_defenses-general_desc$"

    USA_establish_strongholds_in_the_rockies_AN: "$USA_establish_strongholds_in_the_rockies-general_title$"
    USA_establish_strongholds_in_the_rockies_AN_desc: "$USA_establish_strongholds_in_the_rockies-general_desc$"

    USA_the_mississippi_bastions_AN: "$USA_the_mississippi_bastions-general_title$"
    USA_the_mississippi_bastions_AN_desc: "$USA_the_mississippi_bastions-general_desc$"

    USA_evacuate_civilians_and_industry_AN: "$USA_evacuate_civilians_and_industry-general_title$"
    USA_evacuate_civilians_and_industry_AN_desc: "$USA_evacuate_civilians_and_industry-general_desc$"

    USA_launch_the_counteroffensive_AN: "$USA_launch_the_counteroffensive-general_title$"
    USA_launch_the_counteroffensive_AN_desc: "$USA_launch_the_counteroffensive-general_desc$"

    USA_spirit_of_defiance_AN: "$USA_spirit_of_defiance-general_title$"
    USA_spirit_of_defiance_AN_desc: "$USA_spirit_of_defiance-general_desc$"

    USA_regional_strategic_commands_AN: "$USA_regional_strategic_commands-general_title$"
    USA_regional_strategic_commands_AN_desc: "$USA_regional_strategic_commands-general_desc$"

    USA_defend_our_homeland: "Defend Our Homeland!"
    USA_defend_our_homeland_desc: "The hour has arrived: it is time to expel our foes from our homeland once and for all! We will deliver justice against the invaders and drown them in the waters that flank our country. They will not be able to resist us."

    USA_tend_to_the_nation: "Tend to the Nation"
    USA_tend_to_the_nation_desc: "We need to direct our focus to the future of the nation. America's history is a grand one against the backdrop of history, and it may be the case that these most recent disasters are just the thing we need to open our eyes and chart a better course forward."

    USA_the_goldstar_network: "The Goldstar Network"
    USA_the_goldstar_network_desc: "Founded in 1934 by John Aubitz, the Goldstar Network is a patriotic American newspaper and radio channel that has become a mainstay in bars, homes, worksites, and political chapters across the country. It has inspired millions of Americans in these dire times and has fundraised for the needy, provided a work-worker-connector service, and has helped get future-oriented officials elected."

    USA_community_aid_programs: "Community Aid Programs"
    USA_community_aid_programs_desc: "Communities across the country continue to struggle as the institutions and infrastructure they depend on continue to be unreliable. It would be best if the states themselves coordinated the efforts to recover our local regions."

    USA_our_place_in_the_world: "Our Place in the World"
    USA_our_place_in_the_world_desc: "As we begin to recover, the question of just what our destiny ought to be is starting to ring clear. Are we destined to remain just another one of the world's many countries, or ought we to strive to set ourselves apart and claim some as-of-yet unseen mantle?"

    USA_properly_account_for_the_carpetbaggers: "Properly Account for the Carpetbaggers"
    USA_properly_account_for_the_carpetbaggers_desc: "The 'Reconstruction' of the South after the 1860's civil war was a tremendous circus, one which left the South even worse off than it would've been if the haughty North hadn't tried so hard to 'help'. We need to account for the damage caused by those most insidious opportunists which we called Carpetbaggers."
    USA_properly_account_for_the_carpetbaggers_tt: "§Y[366.getName]§!, §Y[365.getName]§!, §Y[364.getName]§!, §Y[363.getName]§!, §Y[367.getName]§!, §Y[370.getName]§!, §Y[371.getName]§!, §Y[368.getName]§!, §Y[369.getName]§!, §Y[362.getName]§!:"

    USA_the_gettysburg_debate: "The Gettysburg Debate"
    USA_the_gettysburg_debate_desc: "Since our revolution, we have technically made two attempts at confederalizing. The first was a failure of ignorance, and the second was, admittedly, a failure of form, but the second one found in itself a stability and a comradery that we could certainly use today. It may be useful to revisit the nature of that failed confederation and decide if it ought to be tried once more."
    USA_the_gettysburg_debate_tt: "The §YAmerican People§! will begin considering the prospect of §YConfederalizing§!."

    USA_a_question_of_confidence: "A Question of Confidence"
    USA_a_question_of_confidence_desc: "The governing, economic, and political practices that led us to this point have failed us and have repeatedly demonstrated their inability to act decisively and effectively. A change in course is the only wise option."

    USA_america_on_its_own: "America On Its Own"
    USA_america_on_its_own_desc: "America was originally founded by those who were distressed by the Old World and wished to seek out a New one, and the wisdom of our forefathers continues to bear truth. The world outside continues to fail its people and us. We cannot rely on them- America's path forward, wherever it shall lead, must be walked alone."

    USA_first_among_equals: "First Among Equals"
    USA_first_among_equals_desc: "America was originally founded by those who were distressed by the Old World and wished to seek out a New one, and the wisdom of our forefathers continues to bear truth. It's clear that the Old World is not capable of rising above its long and troubled histories and conflicts, but we can see beyond their tumults. America will take its place at the helm of civilization."
    USA_first_among_equals_tt: "This §Yfocus§! will push us towards §Ystarting§! a §Rcivil war§!!"

    USA_patriot_parades: "Patriot Parades"
    USA_patriot_parades_desc: "In this time of uncertainty and worry, gatherings of those who find themselves able-bodied and spirited will do wonders to lift the soul of this nation from the rubble. Dark times have borne out against us, but through strength and determination, we will see our way through to a new dawn!"

    USA_patriots_stand_ready: "Patriots Stand Ready"
    USA_patriots_stand_ready_desc: "Conflict is brewing and only those who see what is coming will be able to handle any responsibility for it. We will preemptively organize militia groups and army outfits across the country for the inevitable flare up, so when the hour comes we will be ready to strike out and seize the moment."
    USA_patriots_stand_ready_tt: "When the §Ycivil war starts§!, we will gain more §Yforces§! and §Yequipment§!."

    USA_the_philadelphia_fiasco: "The Philadelphia Fiasco"
    USA_the_philadelphia_fiasco_desc: "Dozens of senators and house representatives have put forward a project bill in Congress for general development in the city of Philadelphia. The jewel of the spending package is the construction of the Ambleton Theater, which will offer top-rate amenities for the city."

    USA_the_parkerite_act: "The Parkerite Act"
    USA_the_parkerite_act_desc: "After the tragedy in Philadelphia, the public has been in open outcry against DC. In response, several southern senators have put forward the Parkerite Act, which will ensconce into the Constitution the 22nd Amendment, which gives states the right to an authoritative veto and oversight over all federal projects and funding within their borders or jurisdiction."

    USA_what_the_future_holds: "What the Future Holds"
    USA_what_the_future_holds_desc: "After the tragedy in Philadelphia, the public has had enough of the federal government's failures. The time is fast approaching that the match will be lit. The federal government needs to be reorganized fundamentally, and those currently seated in power will never hand over their reins willingly."
    USA_what_the_future_holds_tt: "\nThis §Yspirit§! will be §Yremoved§! at the start of the §Ycivil war§!."

    USA_paul_revere_rides_again: "Paul Revere Rides Again"
    USA_paul_revere_rides_again_desc: "The federal government of the United States of America has lost its right to rule. It and the country as a whole must be restructured to ensure the continuity of the nation. Unfortunately, that will require a temporary schism that will have to be mended with blood and iron, but Americans love a challenge."
    USA_paul_revere_rides_again_tt: "We will §Rstart a civil war§!!\nThe more §Yfascism support§! we have, the more §Ystates§! will side with us."

    USA_the_goldstar_federation: "The Goldstar Federation"
    USA_the_goldstar_federation_desc: "The old system was strong, but not strong enough- too weak to survive the onslaught of crisis, too weak to resist the failings of the Old World. A new order is necessary, one which places the American people and their vision and their future first above all else and all others. The old America could not seize its destiny- we will not make that mistake again."
    USA_the_goldstar_federation_tt_2: "As long as the §YUSA§! remains in the §Y$USA_the_goldstar_federation_tt$§! faction, the §YUSA§! and its §Ypuppets§! will have the §Y$USA_goldstar_dynamic_modifier$§! dynamic modifier.\nThis modifier will be §Rlost§! if the §YUSA§! is no longer at the head of the §Y$USA_the_goldstar_federation_tt$§! faction."
    USA_the_goldstar_federation_tt_3: "Create Faction: §Y$USA_the_goldstar_federation_tt$§!."

    USA_the_second_confederation: "The Second Confederation"
    USA_the_second_confederation_desc: "It has become clear that the separation of powers intrinsic to our identity was not given its proper due. The rights of the states will supersede the power of the central government. It's time we lay down the groundwork for a more perfect union, rectifying the failures of the old, improving upon the spirit and the vision of the first Confederation."

    USA_swift_and_lethal: "Swift and Lethal"
    USA_swift_and_lethal_desc: "Either we must act now or we must not act, but we cannot continue to make decisions about how and where we attack and make real our objectives. If we give our opponents time, they will reorganize and mount a more hearty defense, and we don't want to lose any more lives than is necessary."

    USA_peace_guarantees_for_our_neighbors: "Peace Guarantees for Our Neighbors"
    USA_peace_guarantees_for_our_neighbors_desc: "Having resolved the brunt of our internal turbulence, it would be wise to reach out to our friends and neighbors and reassure them of our calm and homely nature. It is right to keep them from worrying, but it is equally important that we ensure our flanks do not become vulnerable."

    USA_our_safety_before_yours: "Our Safety Before Yours"
    USA_our_safety_before_yours_desc: "Our neighbors' safety is inseparable from our own — and they should be made to understand that such safety comes at a price. Garrisons, concessions, and a firm hand in their affairs are a small toll for the protection only we can offer. Our resource security will be molded by our control of this hemisphere's resources."

    USA_the_sun_has_already_set: "The Sun Has Already Set"
    USA_the_sun_has_already_set_desc: "London and Paris cling to empires they can no longer afford to hold. We will let them. While the old powers exhaust themselves on more fruitless wars, the hemisphere lies open before us. A nation unwilling to seize its moment does not deserve one, and we will seize the dawn itself."

    USA_americas_rightful_claims: "America's Rightful Claims"
    USA_americas_rightful_claims_desc: "The destiny of the West is a path through Washington. There is no need to be tactful with what is plainly obvious. We will seize what is rightfully ours."
    USA_americas_rightful_claims_tt: "Unlocks §Ydecisions§! to §Ytake control of territory§! in §YNorth§! and §YCentral America§!.\n\nIf §Y$USA_peace_guarantees_for_our_neighbors$§! is taken, we will be able to §Ybuild trust§! with our neighbors.\n\nIf §Y$USA_our_safety_before_yours$§! is taken, we will be able to §Yintimidate§! our neighbors."

    USA_golden_opportunities: "Golden Opportunities"
    USA_golden_opportunities_desc: "The Americas belong to us, and if our neighbors refuse to yield then we will take them by surprise when they least expect it. As the golden sun dawns, it will cast long shadows, and we will work in that darkness to bring the entire continent into the burgeoning light."
    USA_golden_opportunities_tt: "Unlocks §Ydecisions§! to §Yinfiltrate American countries§! and take them over from the inside, eventually allowing the §YUS§! to §Rcoup§! their governments and §Yassert control§! over them."

    USA_ballads_between_brothers: "Ballads Between Brothers"
    USA_ballads_between_brothers_desc: "Due to our close proximity and the abundant cultural mixing between our countries, it shouldn't be a chore to reach out and further improve our relations with the Canadians and Mexicans. Besides, both have much that we desire, and we choose to go about getting those things through peace, diplomacy, and apple pie."

    USA_establish_the_new_southern_states: "Establish the New Southern States"
    USA_establish_the_new_southern_states_desc: "We will aim to establish the Rio Grande and Sonora to our South, bringing greater autonomy and market access to these regions and their peoples whilst also granting ourselves a buffer."
    USA_establish_the_new_southern_states_tt: "  Will §Ysecure§! our flank."

    USA_country_roads_through_the_north: "Country Roads Through the North"
    USA_country_roads_through_the_north_desc: "The Western Gap that separates the American homeland and our Alaskan territories is extremely sparsely populated by the Canadians. We will make an effort to reach out and offer a heavy sum of cash and investments in exchange for these lands, so that we may connect our entire continental territories and secure our position in the North."

    USA_prudence_across_the_land: "Prudence Across the Land"
    USA_prudence_across_the_land_desc: "With our flanks better secured, we can now pay heed to protecting our peace and making ourselves particularly prickly to any would-be aggressors."

    USA_secure_the_gulf: "Secure the Gulf"
    USA_secure_the_gulf_desc: "So long as the Gulf remains unsecured, our enemies can take advantage of our southern coastline. We will cover up this insecurity and take control of our rightful claims in our near waters."

    USA_the_rush_for_the_canal: "The Rush for the Canal"
    USA_the_rush_for_the_canal_desc: "Whoever controls the Panama Canal controls naval power on either side of the hemisphere. Not only is it entirely necessary for us to secure it fully in order to maintain our power projection capabilities, the canal itself is our property and legacy, and we won't let it fall."

    USA_seize_the_great_flanks: "Seize the Great Flanks"
    USA_seize_the_great_flanks_desc: "We will take those vast territories and oceans that surround America and assert our complete control over the continent."

    USA_realize_the_golden_circle: "Realize the Golden Circle"
    USA_realize_the_golden_circle_desc: "Long ago, an elite society in America called the Knights of the Golden Circle imagined a continental empire that stretched out and reigned supreme over the whole of North America. Today, we realize that dream and proclaim its reality."
    USA_realize_the_golden_circle_trigger_tt_NOT: "Controls all §YNorth American§! states"
    USA_realize_the_golden_circle_trigger_tt_2_NOT: "Controls all §YCentral American§! and §YGulf§! states"
    USA_realize_the_golden_circle_trigger_tt_3_NOT: "Controls the §YSouthern Crest§! states"

    USA_no_place_for_traitors: "No Place for Traitors"
    USA_no_place_for_traitors_desc: "As we prepare to strike forth into the world, we cannot tolerate subversive elements already within us. Those who would wish to see the great American project fail will be given no freedom of movement. As we bring about our new dawn, we will leave them no shadow to hide in."

    USA_pledge_for_the_new_order: "Pledge for the New Order"
    USA_pledge_for_the_new_order_desc: "Berlin offers a partnership between equals — a New Order built on strength answering strength. There is no shame in standing beside the only powers unafraid to build a new world."

    USA_renaissance_and_retribution: "Renaissance and Retribution"
    USA_renaissance_and_retribution_desc: "The Old World is in its death throes, but we are in the ascendency. Even as [GER.GetNameDefCap] tries to rise above Europe's stagnation one more time, we see past their futile attempt. A New World is being forged, and we will be the ones wielding the hammer; Germany will merely be our anvil."
    USA_renaissance_and_retribution_tt: " - This idea will be §Rlost§! if at war with §Y[GER.getName]§!."
    USA_renaissance_and_retribution_tt_2: "Unlocks §Ydecisions§! to usurp §Y[GER.GetName]§!'s authority and take control of the §YAxis§! or §Ydominate Germany outright§!."

    USA_throw_in_with_the_old: "Throw in with the Old"
    USA_throw_in_with_the_old_desc: "We have not forgotten our roots. Our culture and history run tightly with the English and the French, and we are nothing if not steadfast. In this desperate hour, we will arrive to hold high the torch Europe can no longer carry."

    USA_do_our_part: "Do Our Part"
    USA_do_our_part_desc: "Despite our reservations, the war we face requires international cooperation on a scale never before attempted. However, we have the resources and the spirit to persevere, maintaining our own security as we stride outwards to protect that of our allies."
    USA_do_our_part_tt: "Unlocks the ABDACOM §YJoint Focus Tree§!"
    USA_do_our_part_tt_2: "If we are in a §Yfaction§! with §Y[ENG.getName]§!, our §Yfaction members§! will gain:"

    USA_the_eagle_flies_alone: "The Eagle Flies Alone"
    USA_the_eagle_flies_alone_desc: "We will not wait to ask for permission from the Old World before we act. Our future lies in our own hands, our destiny is ours to take hold of, and we will not let any rivals stand in our way."

    USA_imperial_roost: "Imperial Roost"
    USA_imperial_roost_desc: "[ROOT.GetNameDefCap] is the destined inheritor of the Western Hemisphere. It is the Eagle's fief, and here it makes its roost. No enemy may be allowed to strike at it, and it holds full control and dominance over the farthest extents of its territory. The skies, lands and seas of North and South America belong to us."
    USA_imperial_roost_tt: "Every §YAmerican§! country under our §Yhegemony§!:\n---------------------------------------------------------\n\n"
    USA_imperial_roost_tt_2: "Becomes a §Ypuppet§! of §Y[USA.GetNameDefCap]§! if not one already.\n§YJoins§! the §Y[USA.GetAdjective]§!'s faction.\n\n---------------------------------------------------------"

    USA_a_song_for_the_horizon: "A Song for the Horizon"
    USA_a_song_for_the_horizon_desc: "\"...There's a line on the map where the old world ends, and the young world starts to grow — Well I've got a truck full of stars and stripes, and nowhere left to go. From the Rio Grande to the Bering Strait, from the plains to the foreign shore, if the Lord gave us this whole wide world, then I reckon we ain't done, no, we ain't done yet,\n we're just gonna go Manifest Destiny once more...\""

    USA_stars_on_the_horizon: "Stars on the Horizon"
    USA_stars_on_the_horizon_desc: "In the last several years, despair has gripped the American people, but they did not give up- they held out and persevered. Now we are beginning to see the full fruits of that perseverance, which is not satisfied with a return to the status quo but which will only be satiated by the charting of a new, more glorious course."

    USA_the_eagle_lifts_its_wings: "The Eagle Lifts its Wings"
    USA_the_eagle_lifts_its_wings_desc: "The economy is once again soaring above what anyone thought possible! The American people have fully awoken from their slumber and thrown off the pains of the Great Depression. The rest of the world watches in awe at our great resilience and grit."
    USA_the_eagle_lifts_its_wings_tt: "§YUnlocks§! the §Y$USA_general_motors$§! industrial concern."

    USA_lady_libertys_arsenal: "Lady Liberty's Arsenal"
    USA_lady_libertys_arsenal_desc: "The economy has fully recovered and our spirit is once again free. The world situation continues to grow hotter by the day, and we are now in need of a more established and top-of-the-line military industry to keep up."

    USA_federal_recovery_emergency_enterprise: "Federal Recovery Emergency Enterprise"
    USA_federal_recovery_emergency_enterprise_desc: "The Federal Recovery Emergency Enterprise, or FREE, will facilitate the allocation of federal funds and the focus and attention of the people's state towards the recovery, growth, and future protection of the American economy. It will be given sweeping authority both in what it can demand and in what it can allow."
    USA_federal_recovery_emergency_enterprise_tt: "Adds §Y$USA_FREE_dynamic_modifier$§!, which grants the current [USAGetFREETitle] policies:\n  §Y(-6)§! [USA_federal_recovery_emergency_enterprise_SL_a]\n  §Y(-6)§! [USA_federal_recovery_emergency_enterprise_SL_b]\n  §Y(-6)§! [USA_federal_recovery_emergency_enterprise_SL_c]\n  §Y(-6)§! [USA_federal_recovery_emergency_enterprise_SL_d]\n  §Y(-6)§! [USA_federal_recovery_emergency_enterprise_SL_e]\n  §Y(-6)§! [USA_federal_recovery_emergency_enterprise_SL_f]\n"
    USA_federal_recovery_emergency_enterprise_tt_2: "Every §Y10 points§! of §Yfunding§! can modify a §9Sector§!, from §R-30§! to §G+50§! points. Most §Yfocuses§! will §Yshift funding§!."

    USA_crisis_of_dependency: "Crisis of Dependency"
    USA_crisis_of_dependency_desc: "With the collapse of global trade and the world's shared economies, we have been plunged into crisis here at home. While trade has great benefits when done conservatively, it's clear we cannot afford to lean our well-being on the industries of others."

    USA_the_bay_otzen_plan: "The Bay-Otzen Plan"
    USA_the_bay_otzen_plan_desc: "The economist Oswald Bay has partnered with the newly-founded Otzen Institute of Economics to deliver a plan for the future to Congress. It details a radical departure from our historical policies: clamping down on exports, increasing tariffs, subsidizing root-level industries, and integrating FREE into public works projects across the nation. This plan may be our only hope for normalcy and stability."

    USA_invest_in_infrastructure: "Invest in Infrastructure"
    USA_invest_in_infrastructure_desc: "Every piece of the country interacts with every other piece by way of our shared infrastructure. If we are going to be able to rely on ourselves, we'll need to be able to reliably reach our neighbors."

    USA_reinforce_interstate_routes: "Reinforce Interstate Routes"
    USA_reinforce_interstate_routes_desc: "We need a comprehensive network of high-speed roads and systems across our country. The Interstate Project will supply the necessary focus."

    USA_finance_new_mines_and_refineries: "Finance New Mines and Refineries"
    USA_finance_new_mines_and_refineries_desc: "As our industries recover and our economy grows once more, we'll need more resources than ever before. The world of tomorrow is made of rubber tires, oil engines, and advanced alloys of the finest materials."

    USA_establish_new_forestry_zones: "Establish New Forestry Zones"
    USA_establish_new_forestry_zones_desc: "By issuing a vast amount of new forestry licenses, we can open up a significant portion of our natural resources to industrial use and employ tens of thousands of ready Americans. Our national parks will remain sacred realms of tranquility, but we will make use of our forests besides."

    USA_tap_old_gold_mines: "Tap Old Gold Mines"
    USA_tap_old_gold_mines_desc: "With new tools at our disposal, we can take another look at our old quarries and mines and try accessing those resources that were, before, too difficult to extract."

    USA_the_continental_grid: "The Continental Grid"
    USA_the_continental_grid_desc: "As our mechanical mastery and technical knowledge increases, we are able to more effectively exploit the natural riches of the continent and use them for the benefit of the average American. By creating a unified network of resource-extraction and development entities, we will be able to coordinate the general enrichment of our national coffers."

    USA_american_wellspring_administration: "American Wellspring Administration"
    USA_american_wellspring_administration_desc: "FREE will develop a sub-entity: The American Wellspring Administration. Its role will be to facilitate broad organization and partnership in the extraction, refinement, and use of natural resources."
    USA_american_wellspring_administration_tt: "§YUnlocks§! the §Y$FREE_american_wellspring_administration$§! industrial concern."

    USA_american_architectural_administration: "American Architectural Administration"
    USA_american_architectural_administration_desc: "FREE will develop a sub-entity: The American Architectural Administration. Its role will be to connect and standardize various construction practices across the country, improving the range of territories that can be developed and improving the rate at which they are able to be utilized."
    USA_american_architectural_administration_tt: "§YUnlocks§! the §Y$FREE_american_architectural_administration$§! industrial concern."

    USA_ohio_mechanical_complex: "Ohio Mechanical Complex"
    USA_ohio_mechanical_complex_desc: "Huge industry sits just west of New England, waiting to be restarted and boosted. Millions of steadfast Americans are ready to be put to work building the future of America."

    USA_strive_for_the_present: "Strive for the Present"
    USA_strive_for_the_present_desc: "We will focus our attention on immediately pulling the nation out of its stupor, though some of efforts will borrow credit we'll have to pay for down the line."
    USA_strive_for_the_present_tt: "When we §Gcomplete§! the focus §Y$USA_north_american_autarky$§!, we will §Ggain§! a §Ysmall bonus§!."

    USA_rapid_growth: "Rapid Growth"
    USA_rapid_growth_desc: "In order to get our industries moving again, it is necessary that we skip some steps in a few places and prioritize action above all else. There is no time to waste!"

    USA_protect_our_tomorrow: "Protect Our Tomorrow"
    USA_protect_our_tomorrow_desc: "We will focus our attention on addressing the needs of the nation and preparing to get it back on its feet, fully recovered and able."
    USA_protect_our_tomorrow_tt: "When we §Gcomplete§! the focus §Y$USA_north_american_autarky$§!, we will §Ggain§! a §Ymoderate bonus§!."

    USA_promote_the_national_will: "Promote the National Will"
    USA_promote_the_national_will_desc: "We need to remember why we do what we do and whom we do it for. In time, funding will become available to assist our families and small communities, upon which our entire culture and society rests."

    USA_steady_economic_policies: "Steady Economic Policies"
    USA_steady_economic_policies_desc: "Pragmatic economic policies will help shape the growth trends of the economy and ensure that savings will mature, properties will develop, resources will be available. As long as one knows they can count on a stable future, they can put in their fullest for it in the present."

    USA_plan_for_the_future: "Plan for the Future"
    USA_plan_for_the_future_desc: "We will focus our attention on long-term plans that will net us the largest returns, though these will take time."
    USA_plan_for_the_future_tt: "In §Y250 days§!, we will gain:\n"
    USA_plan_for_the_future_tt_2: "§Y250 days§! after getting this idea, we will gain:\n"
    USA_plan_for_the_future_tt_3: "$special_v_consumer_goods_factor_tt$§Y-25.0%§!\n$production_speed_buildings_factor_tt$§G+10.0%§!\n$production_factory_max_efficiency_factor_tt$§G+10.0%§!"
    USA_plan_for_the_future_tt_4: "for §Y250§! day(s)."
    USA_plan_for_the_future_tt_5: "When we §Gcomplete§! the focus §Y$USA_north_american_autarky$§!, we will §Ggain§! a §Ylarge bonus§!."

    USA_invest_in_long_term_schemes: "Invest in Long-Term Schemes"
    USA_invest_in_long_term_schemes_desc: "By its nature, investments for the future are not expected to mature immediately. We must be patient as we build towards that hoped-for tomorrow."

    USA_blue_districts: "Blue Districts"
    USA_blue_districts_desc: "Taking a term out of Oswald Bay's work, 'Blue Districts' are state-regulated economic zones designed to maximize the efficiency and opportunity of our best and brightest. Regulations and red tape are applied in an innocent-till-proven-guilty manner, taxes and profits are required to be reinvested at high rates, and effective infrastructure is a top priority."
    USA_blue_districts_tt: "Unlocks §Ydecisions§! to establish §YBlue Districts§! in populated states."

    USA_increase_technological_funding: "Increase Technological Funding"
    USA_increase_technological_funding_desc: "Our investments into the economy and the people have already begun to pay themselves back, and we find now an excess of capital and talent ready to be deployed. As our nation's genius expands, so too does our industry, our security, and our standard of living. Putting these returns into further investments for the future will help to secure our sons and daughters a more prosperous tomorrow."

    USA_north_american_autarky: "North American Autarky"
    USA_north_american_autarky_desc: "We have built an eden for our own posterity. Between our two coasts now lies a self-sufficient people capable of withstanding the world's fiercest storms. Our industry has rocketed upwards to new heights, empowering America to build whatever her heart yearns after."
    USA_north_american_autarky_tt_1: "This focus will be §Ymore valuable§! depending on what §Yinvestment timescale§! was chosen."
    #USA_north_american_autarky_tt_2: "If §Y$USA_strive_for_the_present$§! was taken:"
    USA_north_american_autarky_tt_2_i: "If §Y$USA_strive_for_the_present$§! is taken:"
    USA_north_american_autarky_tt_2_c: "§Y$USA_strive_for_the_present$§! grants:"
    #USA_north_american_autarky_tt_2_y: "§3If $USA_strive_for_the_present$ was taken:§!"
    #USA_north_american_autarky_tt_2_n: "§gIf $USA_strive_for_the_present$ was taken:§!"
    #USA_north_american_autarky_tt_3: "If §Y$USA_protect_our_tomorrow$§! was taken:"
    USA_north_american_autarky_tt_3_i: "If §Y$USA_protect_our_tomorrow$§! is taken:"
    USA_north_american_autarky_tt_3_c: "§Y$USA_protect_our_tomorrow$§! grants:"
    #USA_north_american_autarky_tt_3_y: "§3If §Y$USA_protect_our_tomorrow$§! was taken:§!"
    #USA_north_american_autarky_tt_3_n: "§gIf $USA_protect_our_tomorrow$ was taken:§!"
    #USA_north_american_autarky_tt_4: "If §Y$USA_plan_for_the_future$§! was taken:"
    USA_north_american_autarky_tt_4_i: "If §Y$USA_plan_for_the_future$§! is taken:"
    USA_north_american_autarky_tt_4_c: "§Y$USA_plan_for_the_future$§! grants:"
    #USA_north_american_autarky_tt_4_y: "§3If §Y$USA_plan_for_the_future$§! was taken:§!"
    #USA_north_american_autarky_tt_4_n: "§gIf $USA_plan_for_the_future$ was taken:§!"

    USA_kickstart_the_steel_belt: "Kickstart the Steel Belt"
    USA_kickstart_the_steel_belt_desc: "The heart of our heavy industry just needs the right kick in the pants and the right funding to get itself off the ground and standing tall once again."

    USA_focus_on_our_fleets: "Focus on our Fleets"
    USA_focus_on_our_fleets_desc: "As a country flanked on either side by grand oceans, the effectiveness of our fleets is paramount to our projection and security. We need to make sure that our fleets receive their proper attention."
    USA_focus_on_our_fleets_tt: "If this focus is taken §Gbefore§! §Y$USA_focus_on_our_army$§!:\n\n§Y1x§! §G100%§! Research bonus for: §YShips§!."
    USA_focus_on_our_fleets_tt_2: " Dockyard Output: §G+5.0%§!\n\n---------------------------------------------------------\nIf this focus is taken §Rafter§! §Y$USA_focus_on_our_army$§!:\n\n§Y1x§! §G50%§! Research bonus for: §YShips§!."
    USA_focus_on_our_fleets_tt_3: " Dockyard Output: §G2.0%§!"

    USA_increase_naval_funding: "Increase Naval Funding"
    USA_increase_naval_funding_desc: "As always, more money and investment is needed to get our fleet into tip-top shape. Modernizing old hulls, building new ones, and keeping crews trained and ready is an expensive undertaking."
    USA_increase_naval_funding_tt: "If §Y$USA_focus_on_our_fleets$§! has been completed, this §Yfocus§! will be §Gmore effective§!.\n "

    USA_shipwreckers: "Shipwreckers"
    USA_shipwreckers_desc: "Training our dock specialists and damage control parties to handle the worst of the worst will prepare our ships for high-intensity combat."

    USA_special_investments_in_annapolis: "Special Investments in Annapolis"
    USA_special_investments_in_annapolis_desc: "As America's navy matures, it has become apparent that it has need of ever more numerous and ever more talented officers."

    USA_focus_on_our_army: "Focus on our Army"
    USA_focus_on_our_army_desc: "America's army has seen action on and off for more than a century, and it remains a crucial aspect of our nation's ability to defend its claims and its home. We need to make sure that our troops receive proper attention."
    USA_focus_on_our_army_tt: "If this focus is taken §Gbefore§! §Y$USA_focus_on_our_fleets$§!:\n\n§Y1x§! §G100%§! Research bonus for: §YInfantry technology and Truck§!."
    USA_focus_on_our_army_tt_2: " Factory Output: §G+5.0%§!\n\n---------------------------------------------------------\nIf this focus is taken §Rafter§! §Y$USA_focus_on_our_fleets$§!:\n\n§Y1x§! §G50%§! Research bonus for: §YInfantry technology and Truck§!."
    USA_focus_on_our_army_tt_3: " Factory Output: §G+2.0%§!"

    USA_increase_army_funding: "Increase Army Funding"
    USA_increase_army_funding_desc: "As always, more money and investment is needed to keep our divisions equipped with modern and effective equipment, and advanced training requires ever more extensive resources. Maintaining a modern army is an expensive endeavor."
    USA_increase_army_funding_tt: "If §Y$USA_focus_on_our_army$§! has been completed, this §Yfocus§! will be §Gmore effective§!.\n "

    USA_precision_mechanisms: "Precision Mechanisms"
    USA_precision_mechanisms_desc: "In modern warfare, it is becoming obvious that victory may rest in one's technological and material advancement. Designing equipment that can take advantage of our furthest advancements will give our troops the best chance we can."

    USA_special_investments_in_westpoint: "Special Investments in Westpoint"
    USA_special_investments_in_westpoint_desc: "As America's army matures, it has become apparent that it has need of ever more numerous and ever more talented officers."

    USA_industrialize_california: "Industrialize California"
    USA_industrialize_california_desc: "Creating a large industrial base of operations in California will allow us to commit resources to the West far more efficiently. It will also help us secure our hold over our Pacific territories."

    USA_industrial_funding: "Industrial Funding"
    USA_industrial_funding_desc: "Our factories don't run on speeches. We'll open the treasury and let industry decide what it needs."

    USA_wonder_workshops: "Wonder Workshops"
    USA_wonder_workshops_desc: "The manufacturies of America produce some of the most elegant and sophisticated equipment and luxuries in the world. We stand to benefit from all the world's talent, and investing further into our pinnacle designs will serve us well going forward."

    USA_improve_military_training: "Improve Military Training"
    USA_improve_military_training_desc: "With such a large army fielded, we need to ensure that our training methods are not only effective but also able to grow with our ranks."

    USA_county_militias: "County Militias"
    USA_county_militias_desc: "If war should ever reach our shores, it will be the American people themselves who will most surely hold the line."

    USA_independently_funded_armories: "Independently-Funded Armories"
    USA_independently_funded_armories_desc: "By granting increased rights to individuals and communities to procure defensive equipment, civilian groups and state-funded militias will be able to field modern and sophisticated equipment and weaponry, allowing them to stand against even the most powerful invaders."

    USA_civilian_logistics_contracts: "Civilian Logistics Contracts"
    USA_civilian_logistics_contracts_desc: "Having better logistics doesn't win wars, but whoever's logistics fail first will certainly lose. Given the scope at which we may be called upon to fight, expanding the ranks of our logistics systems to include broad civilian apparatuses will give us the strategic flexibility necessary to keep fighting at every hour, at every point."

    USA_terrain_navigation_courses: "Terrain Navigation Courses"
    USA_terrain_navigation_courses_desc: "Being able to navigate through dense forests, across rolling plains, and through harsh mountains gives one a tremendous advantage in war. If an army plans to fight us at home, they will have to contend with our vast diversity of environments, and our vast populations able to adeptly act across them."

    USA_cloth_and_rope_ramparts: "Cloth and Rope Ramparts"
    USA_cloth_and_rope_ramparts_desc: "Even the most basic and essential home items can be used to create fortifications and concealed positions almost anywhere. It's all about creativity, and sparking that in our people now will help them be more imaginative later."

    USA_confederalized_asset_procurement: "Confederalized Asset Procurement"
    USA_confederalized_asset_procurement_desc: "Splitting the responsibility and duty for developing arms stockpiles between the federal government, state governments, and local detachments will be an expensive and initially daunting organizational task, but once it's been fully decentralized, every group and every individual will be able to apply their own expertise and knowledge in situ to further our total readiness."

    USA_FREE_improved_focus: "Improved Focus"
    USA_FREE_improved_focus_desc: "When FREE invests time and resources into some Sector, it requires the mobilization of hundreds of thousands of people. These large-scale operations are difficult to coordinate, but as the department works and acts, it and its leadership will become more effective."
    USA_FREE_improved_focus_tt: "§GImproves the value§! of [USAGetFREETitle]'s §Yfocus§! by §Y(+1§!,§Y+2§!,§Y+3)§! respectively going forward.\n§R(Does not modify existing funds)§!"

    USA_FREE_recovery_funds: "Recovery Funds"
    USA_FREE_recovery_funds_desc: "With the funding and attention from the Federal Government being directed primarily by FREE, areas of special interest not in its focus tend to be forgotten on the periphery. Therefore, a new subcommittee is necessary to properly account for those Sectors that have been accidentally left behind."
    USA_FREE_recovery_funds_tt: "Every §9Sector§! that is currently §Ysuffering§! under [USAGetFREETitle] will receive §Gadditional funding§! §Y(+[?FREE_recovery_funds_S])§! (§G$S_LOC$§!). \n§9Sectors§! that are currently §Yprospering§! will receive a §Gsmall amount of funding§! §Y(+[?FREE_recovery_funds_P])§! (§G$P_LOC$§!)."

    USA_FREE_expert_guidance: "Expert Guidance"
    USA_FREE_expert_guidance_desc: "Especially for a large government agency, it is impossible to know exactly how to operate in the finest details of every single aspect of an entire country's actions. Therefore, whenever dealing in a particular Sector, FREE will contract out specialists and experts in that field to offer direction."
    USA_FREE_expert_guidance_tt: "Every §9Sector§! that is currently §Yprospering§! under [USAGetFREETitle] will receive §Gadditional funding§! §Y(+[?FREE_expert_guidance_P])§! (§G$P_LOC$§!). \n§9Sectors§! that are currently §Ysuffering§! will receive a §Gsmall amount of funding§! §Y(+[?FREE_expert_guidance_S])§! (§G$S_LOC$§!)."

    USA_FREE_improved_focus_II: "Improved Focus II"
    USA_FREE_improved_focus_II_desc: "The effort that goes into promoting a Sector can be further improved by creating independent groups of contractors and experts to oversee the distribution of funds and the apportionment of talent and resources within their fields."
    USA_FREE_improved_focus_II_tt: "§GFurther improves the value§! of [USAGetFREETitle]'s §Yfocus§! by §Y(+1§!,§Y+2§!,§Y+3)§! respectively going forward.\n§R(Does not modify existing funds)§!"

    USA_FREE_funds_management: "Funds Management"
    USA_FREE_funds_management_desc: "In an organization as grandiose as FREE, there is bound to be a significant amount of money that ends up going nowhere for one reason or another. Paying mind to this at the outset of every new project will help to reduce overall waste."
    USA_FREE_funds_management_tt: "§GReduces the severe penalty§! of [USAGetFREETitle]'s §Yfocus§! by §Y(-1)§! going forward.\n§R(Does not modify existing funds)§!"

    USA_FREE_top_end_funds_management: "Top-End Funds Management"
    USA_FREE_top_end_funds_management_desc: "The administration of FREE will focus their attention on the proper allocation of funds and resources to the organization's grandest endeavors."
    USA_FREE_top_end_funds_management_tt: "§GFurther reduces the severe penalty§! of [USAGetFREETitle]'s §Yfocus§! by §Y(-1)§! going forward.\n§R(Does not modify existing funds)§!"

    USA_FREE_lower_end_funds_management: "Lower-End Funds Management"
    USA_FREE_lower_end_funds_management_desc: "The administration of FREE will focus their attention on the proper distribution and delegation of roles and resources to those projects that make up the bulk of the organization's output."
    USA_FREE_lower_end_funds_management_tt: "§GReduces the sizeable penalty§! of [USAGetFREETitle]'s §Yfocus§! by §Y(-1)§! going forward.\n§R(Does not modify existing funds)§!"

    USA_FREE_department_expansion: "Department Expansion"
    USA_FREE_department_expansion_desc: "With new offices, new personnel, and new bounds, FREE will be able to broaden its reach and its effects."
    USA_FREE_department_expansion_tt: "Allows for [USAGetFREETitle] to have its §Yfocus§! or its §Yfunds management§! §Gimproved§!.\n\nAll §9Sectors§! suffer a §Rslight penalty§! §Y([?FREE_points_V])§!."
    USA_FREE_department_expansion_tt_3: "Allows for [USAGetFREETitle] to have its §Yfocus§! or its §Yfunds management§! §Gimproved§!."
    USA_FREE_department_expansion_tt_2: "§YUnlocks§! the §YFREE§! industrial concern."

    USA_FREE_raise_taxes_for_reinvestment: "Raise Taxes for Reinvestment"
    USA_FREE_raise_taxes_for_reinvestment_desc: "The Federal Government will improve and expand the capabilities and capacity of FREE by raising taxes to pay for it. While this won't be the most popular choice, it will be the most responsible."
    USA_FREE_raise_taxes_for_reinvestment_tt: "Allows for [USAGetFREETitle] to have its §Yfocus§! or its §Yfunds management§! §Gfurther improved§!."
    USA_FREE_raise_taxes_for_reinvestment_tt_2: "§GImproves§! the §YFREE§! industrial concern."

    USA_FREE_print_money_to_fund_FREE: "Print Money to Fund FREE"
    USA_FREE_print_money_to_fund_FREE_desc: "The Federal Government will simply print money to pay for FREE's new systems and workforce. This will be more effective in the short run, though its negative effects might be felt later on, in which case FREE will just have to make itself valuable to that further extent."
    USA_FREE_print_money_to_fund_FREE_tt: "Allows for [USAGetFREETitle] to have its §Yfocus§! or its §Yfunds management§! §Gfurther improved§!."
    USA_FREE_print_money_to_fund_FREE_tt_2: "§GImproves§! the §YFREE§! industrial concern."

    USA_FREE_undersecretariat_for_sectoral_administration: "Undersecretariat for Sectoral Administration"
    USA_FREE_undersecretariat_for_sectoral_administration_desc: "FREE's influence and scale has grown to the point that it has become unwieldly. In response, the Undersecretariat for Sectoral Administration will be founded in order to act as a further layer of direction and management that will permit FREE to operate effectively at its current and still-expanding scope."
    USA_FREE_undersecretariat_for_sectoral_administration_tt: "The §Y$USA_FREE_dynamic_modifier$§! becomes the §Y$USA_FREE_dynamic_modifier_2$§!.\n\nAllows for [USAGetFREETitle] to have its §Yfocus§! and its §Yfunds management§! §Gfully improved§!."
    USA_FREE_undersecretariat_for_sectoral_administration_tt_2: "§GImproves§! the §YFREE§! industrial concern."

    USA_FREE_recovery_achieved: "Recovery Achieved"
    USA_FREE_recovery_achieved_desc: "The economy is flourishing, the American people have recovered, money flows freely once again! Now that we don't need to keep such a tight hold over our purse strings, FREE is free to promote Sectors at a greater pace and with more resources behind every proposal."
    USA_FREE_recovery_achieved_tt: "This focus will give §Ylarger benefits§! the more §Ypositive funding§! from [USAGetFREETitle] is in play.\n\n"
    USA_FREE_recovery_achieved_tt_2: "§GImproves all values§! of [USAGetFREETitle]'s §Yfocus§! by §Y(+1)§! going forward.\n§GRemoves all slight penalties§! of [USAGetFREETitle]'s §Yfocus§! going forward.\n§R(Does not modify existing funds)§!"

    USA_grange_auxiliary_corps: "Grange Auxiliary Corps"
    USA_grange_auxiliary_corps_desc: "The Grange has been a longstanding boon to rural elements of the country for a very long time- they know their stuff. We could employ them to repair our infrastructure and fix up our towns and streets, and they already have the resources necessary for much of that work."

    USA_protect_against_foreign_interference: "Protect Against Foreign Interference"
    USA_protect_against_foreign_interference_desc: "There are many outside forces that seek to sap away at our city on a hill for their own benefit, or even poison its wells and crumble it from within. We cannot allow the American people to be subject to any subversive foreign influences."
