 # DYNAMIC MODIFIERS
    USA_economy_dynamic_modifier_great_depression: "The Great Depression"
    USA_economy_dynamic_modifier_great_depression_desc: "Although a worldwide phenomenon, the Great Depression started with a stock market crash in the United States and has caused unemployment rates to soar and tax revenue to plummet. The American people and their government have enough to worry about without getting involved in another war."
    USA_economy_dynamic_modifier_bad: "Intense Recovery"
    USA_economy_dynamic_modifier_bad_desc: "The economy is slowly recovering, but its troubles aren't over yet."
    USA_government_dynamic_modifier: "The Federal Government"
    USA_government_dynamic_modifier_desc: "The federal government of the United States consists of the White House, the House and Senate in Congress, the Supreme Court, and the numerous federal institutions under these bodies."
    USA_government_dynamic_modifier_2: "Reorganized Federal Government"
    USA_government_dynamic_modifier_2_desc: "The federal government of the United States has been reorganized in order to improve efficiency and to uphold its constitutional duties."
    USA_economy_dynamic_modifier_good: "American Economy"
    USA_economy_dynamic_modifier_good_desc: "The economy is coming into its own and will soon shine brightly."
    USA_economy_dynamic_modifier_great: "American Economy"
    USA_economy_dynamic_modifier_great_desc: "The American economy has reawoken and risen from the ashes of the Great Depression. It now stands mighty and brilliant, a beacon for the world."
    USA_agency_dynamic_modifier: "OSS"
    USA_agency_dynamic_modifier_desc: "American foreign and domestic intelligence services fall under the purview of the Office of Strategic Services, whose reach grows with every day."
    USA_agency_dynamic_modifier_2: "CIA"
    USA_agency_dynamic_modifier_2_desc: "The Central Intelligence Agency is America's foreign intelligence department, entrusted to take control of the affairs of foreign adversaries while the government focuses on its own matters."
    USA_mic_dynamic_modifier: "American Military Industrial Complex"
    USA_mic_dynamic_modifier_desc: "Built off of the incredible economic strength natural to the US, the military industrial complex spans hundreds of interests in every industry there is, all working towards the development of more numerous and more effective military systems."
    USA_arm_dynamic_modifier: "United States Army"
    USA_arm_dynamic_modifier_desc: "Despite its relatively young legacy, the United States Army has been a continuous entity since the birth of the nation. Its relative inexperience compared to the legacy forces of Europe and Asia have not stopped America's army from proving itself time and time again."
    USA_nav_dynamic_modifier: "United States Navy"
    USA_nav_dynamic_modifier_desc: "Being a nation flanked by oceans on either side, the United States Navy stands as one of the country's most important assets. Its strength has grown greater in recent decades in order to ensure the security of America's interests at home and abroad."
    USA_air_dynamic_modifier: "United States Army Air Corps"
    USA_air_dynamic_modifier_desc: "A premier asset of the United States' army. The airpower of America will dominate the skies, allowing the army and navy to make quick work of their opponents."
    USA_air_dynamic_modifier_2: "United States Air Force"
    USA_air_dynamic_modifier_2_desc: "A new and premier asset of the United States' military. The airpower of America will dominate the skies, support the troops, and patrol the seas. The American Eagle soars through the clouds and owns the heights."
    USA_economy_dynamic_modifier_great_communist: "American Economy"
    USA_economy_dynamic_modifier_great_communist_desc: "The American Peoples' economy has reawoken and risen from the ashes of the Great Depression. It now stands mighty and brilliant, a beacon for the world."
