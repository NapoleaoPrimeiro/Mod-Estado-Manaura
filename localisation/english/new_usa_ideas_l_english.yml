    USA_renaissance_and_retribution_cat_desc: "We do not intend to remain mere equals with [GER.GetNameDefCap]- we intend to stake our claims and take control of this vanguard Axis. To that end, we will establish influence with its members, take ownership over important pieces of its framework, demonstrate our centrality to its being, and ultimately usurp [GER.GetAdjective] authority within it. If we play our cards just right, we may even be able to seize the heart of Germany's governing institutions as well.\n\n§Y[GER.GetNameDefCap]§! will periodically increase §Rits own§! influence within the §YAxis§!.\n  -  Influence §YGermany§! has taken back: £autonomy_texticon §R[?USA.USA_RR_german_recovered_influence]§!\n\n   ------------------------------------------------------------------------\n\n  §YTotal§! Influence within the §YAxis§!: £autonomy_texticon §Y[?USA.USA_RR_total_influence]§!\n    -  Influence needed to usurp control of the §YAxis§!: £autonomy_texticon §Y[?USA.USA_RR_influence_to_usurp]§! (§Y70%§!)\n    -  Influence needed to dominate §YGermany§!: £autonomy_texticon §Y[?USA.USA_RR_influence_to_puppet]§! (§Y95%§!)\n\n  §Y[USA.GetAdjective]§! Influence: £autonomy_texticon §G[?USA.USA_RR_current_influence]§! (§Y[?USA.USA_RR_current_influence_percentage|%1]§!)\n\n  §Y[GER.GetAdjective]§! Influence: £autonomy_texticon §R[?USA.USA_RR_german_influence]§!\n"
