l_english:
 NO_LAG_GRE_byzantine_prosperity:0 "Byzantine Economic Revival"
 NO_LAG_GRE_byzantine_prosperity_desc:0 "With Constantinople restored as the heart of the Empire, its workshops, resources and commercial institutions can sustain a new age of prosperity."
 NO_LAG_GRE_byzantine_prosperity_spirit:0 "Byzantine Prosperity"
 NO_LAG_GRE_byzantine_prosperity_spirit_desc:0 "The restored imperial administration is directing new land, labor and investment toward an expanding industrial base."

 NO_LAG_GRE_avenge_justinian:0 "Avenge Justinian the Great"
 NO_LAG_GRE_avenge_justinian_desc:0 "The reconquest of Rome would reunite the eastern and western legacies of the Empire and complete the ambition once pursued by Justinian."
 NO_LAG_GRE_avenge_justinian_tt:0 "Unlocks the §YGreek Imperial Restoration§! decisions and the possibility of restoring the §YRoman Empire§!."

 NO_LAG_GRE_roman_restoration_category:0 "Greek Imperial Restoration"
 NO_LAG_GRE_roman_restoration_category_desc:0 "From Constantinople, the restored Byzantine state may claim the full inheritance of Rome once it controls the historic Mediterranean heartlands."
 NO_LAG_GRE_restore_roman_empire:0 "Restore the Roman Empire"
 NO_LAG_GRE_restore_roman_empire_desc:0 "The Mediterranean has returned to imperial rule. We can now proclaim the restoration of the Roman Empire and integrate its historic territories."
