l_english:
 NO_LAG_GER_incomplete_victory:0 "The Incomplete Victory"
 NO_LAG_GER_incomplete_victory_desc:0 "Victory in the west has not brought the promised peace. Rivalries inside the Reich and the demands of an unfinished war now threaten the regime's cohesion."
 NO_LAG_GER_guide_italy:0 "Guide Italy"
 NO_LAG_GER_guide_italy_desc:0 "Italian instability is undermining the common war effort. Berlin will place Rome under firmer supervision, provided no human player is displaced."
 NO_LAG_GER_secure_hungary:0 "Secure Hungary"
 NO_LAG_GER_secure_hungary_desc:0 "Hungary's armies and administration must answer to a unified command if the alliance is to endure."
 NO_LAG_GER_secure_romania:0 "Secure Romania"
 NO_LAG_GER_secure_romania_desc:0 "Romanian oil and its strategic position are too important to leave outside direct German supervision."
 NO_LAG_GER_endsieg:0 "Endsieg — The Final Victory"
 NO_LAG_GER_endsieg_desc:0 "With the front collapsing, propaganda promises a final victory. The remaining reserves will be gathered for a desperate defence of Germany."
 NO_LAG_GER_volkssturm:0 "The Volkssturm"
 NO_LAG_GER_volkssturm_desc:0 "The last pools of manpower will be organized into local defence formations. Quantity must now compensate for lost time and training."
 NO_LAG_GER_fortress_reich:0 "Fortress Reich"
 NO_LAG_GER_fortress_reich_desc:0 "Every city, river and industrial district must become part of a defence in depth around the German heartland."
 NO_LAG_GER_last_offensive:0 "To the Front Lines!"
 NO_LAG_GER_last_offensive_desc:0 "The remaining mobile formations will be concentrated for one final counterstroke. If it fails, there will be no second attempt."

 NO_LAG_SOV_great_patriotic_war:0 "The Great Patriotic War"
 NO_LAG_SOV_great_patriotic_war_desc:0 "The entire Union must be mobilized against a major invader. Every factory, railway and citizen now serves the defence of the motherland."
 NO_LAG_SOV_study_our_losses:0 "Study Our Losses"
 NO_LAG_SOV_study_our_losses_desc:0 "The cost of war has exposed failures in command and doctrine. Hard lessons must be turned into battlefield experience."
 NO_LAG_SOV_coordinate_wartime_industry:0 "Coordinate Wartime Industry"
 NO_LAG_SOV_coordinate_wartime_industry_desc:0 "Closer coordination between planners, factories and the front will keep production moving without conjuring entire industries from nothing."
 NO_LAG_SOV_open_great_war_stockpiles:0 "Open the Great War Stockpiles"
 NO_LAG_SOV_open_great_war_stockpiles_desc:0 "Older rifles and support equipment can still arm replacements while modern production is reserved for the decisive sectors."
 NO_LAG_SOV_our_blood_our_soil:0 "Our Blood, Our Soil"
 NO_LAG_SOV_our_blood_our_soil_desc:0 "Even after terrible losses, the people will defend every remaining city and field until the invader is driven back."
 NO_LAG_SOV_bind_mongolia:0 "An Irrevocable Union"
 NO_LAG_SOV_bind_mongolia_desc:0 "Mongolia must be bound more tightly to the Soviet security system. Allies may accept direct supervision; others will face a formal demand."
 NO_LAG_SOV_secure_iran:0 "The Caucasus Corridor"
 NO_LAG_SOV_secure_iran_desc:0 "Control of the Iranian corridor will protect the Caucasus and preserve a vital route for men and materiel."
 NO_LAG_SOV_secure_afghanistan:0 "Secure the Southern Flank"
 NO_LAG_SOV_secure_afghanistan_desc:0 "A dependable government in Kabul will close a vulnerable approach to Central Asia."

 NO_LAG_SOV_russian_federation:0 "The Russian Federation"
 NO_LAG_SOV_russian_federation_desc:0 "The Zemsky Sobor has outlived its purpose. A federal republic, representative government and regular elections will give Russia a durable constitutional order."
 NO_LAG_SOV_federal_constitution:0 "A Federal Constitution"
 NO_LAG_SOV_federal_constitution_desc:0 "A written constitution must balance the authority of the central government with the rights of Russia's many republics and peoples."
 NO_LAG_SOV_open_the_economy:0 "Open the Economy"
 NO_LAG_SOV_open_the_economy_desc:0 "Measured access to private initiative and foreign expertise will help rebuild the civilian economy after the civil war."
 NO_LAG_SOV_reorganize_security_service:0 "Reorganize the Security Service"
 NO_LAG_SOV_reorganize_security_service_desc:0 "The security apparatus will be placed under civilian law and redirected toward counter-espionage instead of political terror."
 NO_LAG_SOV_federal_breadbasket:0 "The Federal Breadbasket"
 NO_LAG_SOV_federal_breadbasket_desc:0 "Restoring transport, machinery and local administration in the agricultural regions will stabilize food supplies and support reconstruction."
 NO_LAG_SOV_league_of_free_republics:0 "League of Free Republics"
 NO_LAG_SOV_league_of_free_republics_desc:0 "Russia will organize its diplomacy around cooperation between sovereign republics rather than compulsory annexation."
 NO_LAG_SOV_mobilize_the_federation:0 "Mobilize the Federation"
 NO_LAG_SOV_mobilize_the_federation_desc:0 "A democratic federation must still be able to defend itself. A common military structure will unite the republics without reviving the old coercive system."
 NO_LAG_SOV_federation_secured:0 "The Federation Secured"
 NO_LAG_SOV_federation_secured_desc:0 "Constitutional government, economic recovery and a common defence have given the new federation firm foundations."
 NO_LAG_SOV_federation_faction:0 "Federation of Free Republics"

 NO_LAG_ENG_for_king_and_country:0 "For King and Country!"
 NO_LAG_ENG_for_king_and_country_desc:0 "A war against multiple great powers demands that Britain prepare its people and institutions for the defence of the home islands."
 NO_LAG_ENG_open_1914_stockpiles:0 "The Stockpiles of 1914"
 NO_LAG_ENG_open_1914_stockpiles_desc:0 "Weapons stored since the last war can equip new formations while modern factories focus on current designs."
 NO_LAG_ENG_all_subjects_to_arms:0 "All Subjects to Arms!"
 NO_LAG_ENG_all_subjects_to_arms_desc:0 "The whole realm must contribute to the defence of Britain, even at a measured cost to industrial output."
 NO_LAG_ENG_last_defence_of_freedom:0 "The Last Defence of Freedom"
 NO_LAG_ENG_last_defence_of_freedom_desc:0 "If the home islands stand on the brink, every remaining reserve will be committed to keep the government and the war alive."
 NO_LAG_ENG_continue_to_the_end:0 "We Shall Continue to the End"
 NO_LAG_ENG_continue_to_the_end_desc:0 "A small reserve of off-map industry and an imperial continuity plan will ensure that capitulation does not end British resistance."
 NO_LAG_ENG_emergency_imperial_administration:0 "Emergency Imperial Administration"
 NO_LAG_ENG_emergency_imperial_administration_desc:0 "With the principal regions of Britain lost, an emergency administration must prepare Canada to receive the institutions needed to continue the war."
 NO_LAG_ENG_transfer_war_industry_to_canada:0 "Transfer War Industry to Canada"
 NO_LAG_ENG_transfer_war_industry_to_canada_desc:0 "Machine tools, technical staffs and production plans will be evacuated across the Atlantic to establish a new arsenal in Southern Ontario."
 NO_LAG_ENG_ottawa_war_cabinet:0 "The Ottawa War Cabinet"
 NO_LAG_ENG_ottawa_war_cabinet_desc:0 "Ministers, civil servants and the remaining organs of state will assemble in Ottawa to restore a functioning centre of government."
 NO_LAG_ENG_canadian_redoubt:0 "The Canadian Redoubt"
 NO_LAG_ENG_canadian_redoubt_desc:0 "Canada will become the secure base from which British forces can be rebuilt, supplied and returned to the fight."
 NO_LAG_ENG_empire_beyond_the_seas:0 "The Empire Beyond the Seas"
 NO_LAG_ENG_empire_beyond_the_seas_desc:0 "The Crown and the Canadian government will unite their administrations. Ottawa shall serve as the capital of a British Empire determined to fight on from across the Atlantic."
 NO_LAG_ENG_at_war_with_two_majors_tt:0 "At war with at least §Y2 Major Countries§!"
 NO_LAG_ENG_canadian_exile_annexation_tt:0 "The United Kingdom will §Yintegrate Canada§!, gain cores on Canadian core states, establish its government-in-exile in §YOttawa§!, and increase the Victory Point value of §YOttawa§!, §YToronto§!, §YMontréal§! and §YVancouver§!."
 NO_LAG_ENG_canadian_industry_boost_tt:0 "After the integration, §Y24 Military Factories§! and §Y8 Civilian Factories§! will be established in Canada."

 NO_LAG_GER_incomplete_victory_spirit:0 "An Incomplete Victory"
 NO_LAG_GER_incomplete_victory_spirit_desc:0 "The expected short war has become a struggle without a clear end, draining political authority and disrupting operational planning."
 NO_LAG_GER_endsieg_spirit:0 "Endsieg"
 NO_LAG_GER_endsieg_spirit_desc:0 "A promise of final victory holds together the last reserves and stiffens resistance on German soil."
 NO_LAG_GER_volkssturm_spirit:0 "Volkssturm Mobilization"
 NO_LAG_GER_volkssturm_spirit_desc:0 "Rapid mobilization fills the ranks, but the new formations lack the cohesion of the army they replace."
 NO_LAG_GER_fortress_reich_spirit:0 "Fortress Reich"
 NO_LAG_GER_fortress_reich_spirit_desc:0 "Construction crews and local commands are focused on fortifying the German heartland."
 NO_LAG_GER_last_offensive_spirit:0 "The Last Offensive"
 NO_LAG_GER_last_offensive_spirit_desc:0 "For a brief period, every mobile reserve is committed to attack, leaving little depth for defence."

 NO_LAG_SOV_patriotic_mobilization_spirit:0 "Patriotic Mobilization"
 NO_LAG_SOV_patriotic_mobilization_spirit_desc:0 "The invasion has transformed the war into a national struggle for survival."
 NO_LAG_SOV_lessons_from_losses_spirit:0 "Lessons Paid in Blood"
 NO_LAG_SOV_lessons_from_losses_spirit_desc:0 "Costly failures are being translated into better organization and preservation of battlefield experience."
 NO_LAG_SOV_wartime_industry_spirit:0 "Coordinated Wartime Industry"
 NO_LAG_SOV_wartime_industry_spirit_desc:0 "Factories and planners work to common priorities set by the needs of the front."
 NO_LAG_SOV_our_blood_our_soil_spirit:0 "Our Blood, Our Soil"
 NO_LAG_SOV_our_blood_our_soil_spirit_desc:0 "Emergency mobilization strengthens the defence of Soviet territory, though it draws workers away from production."

 NO_LAG_ENG_home_defence_spirit_1:0 "Home Defence Preparations"
 NO_LAG_ENG_home_defence_spirit_1_desc:0 "Local commands, civil authorities and the armed forces are preparing the home islands for attack."
 NO_LAG_ENG_home_defence_spirit_2:0 "The Realm Under Arms"
 NO_LAG_ENG_home_defence_spirit_2_desc:0 "Wider mobilization reinforces the home islands while placing a limited burden on wartime production."
 NO_LAG_ENG_home_defence_spirit_3:0 "The Last Defence of Freedom"
 NO_LAG_ENG_home_defence_spirit_3_desc:0 "Britain's final reserves defend the realm with determination, accepting a heavier economic cost."
 NO_LAG_ENG_imperial_continuity_spirit:0 "Imperial Continuity"
 NO_LAG_ENG_imperial_continuity_spirit_desc:0 "Dispersed administration and industry allow the government to keep directing the war after a disaster at home."
 shadow_scheme_focus_tt:1 "When entering a war, grants §G16§! Building Slots, §Y8 Military Factories§! and §Y8 Civilian Factories§! in total across two states.\n"
 NO_LAG_ENG_communist_empire_preserved_tt:0 "§GCommunist Britain may preserve the Empire.§! No territory or subject will be released, and the civil-war threat for failing to decolonize will be removed."

 NO_LAG_BRA_south_american_research_network:0 "South American Research Network"
 NO_LAG_BRA_south_american_research_network_desc:0 "A unified South America must connect its universities, laboratories and industrial research centers into a continental scientific network."
 NO_LAG_BRA_ulasr_academy_of_sciences:0 "ULASR Academy of Sciences"
 NO_LAG_BRA_ulasr_academy_of_sciences_desc:0 "The socialist republics will pool their scientists and technical institutions in a common academy dedicated to continental development."
