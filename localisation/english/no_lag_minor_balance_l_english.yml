l_english:
 NO_LAG_BALANCE_RULE_GROUP: "NO LAG — Player Balance"
 NO_LAG_MINOR_PLAYER_BONUS_RULE_NAME: "Minor Player Support"
 NO_LAG_MINOR_PLAYER_BONUS_OFF_TEXT: "Disabled"
 NO_LAG_MINOR_PLAYER_BONUS_OFF_DESC: "Human-controlled minor countries receive no additional support."
 NO_LAG_MINOR_PLAYER_BONUS_ON_TEXT: "Enabled for Human Minors"
 NO_LAG_MINOR_PLAYER_BONUS_ON_DESC: "Every human-controlled country that begins the campaign as a minor receives one permanent research slot and, for the first 730 days, the exact pre-remake §YMinor Player Support§! national spirit. AI countries and majors are unaffected."
 NO_LAG_minor_player_bonus: "Minor Player Support"
 NO_LAG_minor_player_bonus_desc: "For the first two years: §G+150%§! construction speed, §G+30%§! production-efficiency retention when changing lines, §G+0.50§! daily political power, §G+10%§! recruitable population factor and §G-20%§! training time. This reproduces the pre-remake player-minor bonus."
 NO_LAG_AUS_HABSBURG_DIPLOMACY: "Imperial Diplomatic Preparations"
 NO_LAG_AUS_HABSBURG_DIPLOMACY_desc: "Streamlined diplomatic groundwork for restoring Habsburg influence without bypassing the neighboring country's final decision."
 NO_LAG_AUS_prepare_imperial_outreach: "Prepare Outreach to [FROM.GetNameDef]"
 NO_LAG_AUS_prepare_imperial_outreach_desc: "A coordinated month of industrial cooperation and joint staff talks will make [FROM.GetNameDef] more receptive to a Habsburg settlement for the next five years. This improves the odds of acceptance, but does not guarantee submission or annexation."
