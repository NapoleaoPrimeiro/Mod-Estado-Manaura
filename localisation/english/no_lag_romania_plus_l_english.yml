l_english:
 ROM_natural_borders:0 "Natural Borders of Romania"
 ROM_natural_borders_desc:0 "Guided by the ideal of 'De la Nistru până la Tisa'—the dream of a Romania defined by natural borders—we can now fulfill this nationalist vision that emerged in the aftermath of the Great War."
 ROM_appeal_to_european_capitalists:0 "Appeal to European Capitalists"
 ROM_appeal_to_european_capitalists_desc:0 "With King Carol II's influence curtailed and democratic reforms bringing stability to our nation, we can reach out to Europe's great industrial powers. A modern, open economy will attract the investment needed to strengthen our industry and infrastructure."
 ROM_the_red_menace:0 "The Red Menace"
 ROM_the_red_menace_desc:0 "The Soviet demand for Bessarabia reveals its intention to dominate Eastern Europe. Romania will defend its sovereignty, push beyond the Dniester and refuse to bow to the Red Menace."
 ROM_expand_resita_steel_works:0 "Expand the Reșița Steel Works"
 ROM_expand_resita_steel_works_desc:0 "The Reșița Steel Works have long been a cornerstone of our industrial capacity. Modernizing and expanding them will increase steel production and support further military and industrial growth."
 ROM_air_defense_network:0 "Air Defense Network"
 ROM_air_defense_network_desc:0 "Romania's skies, especially those above our vital oil fields, must remain secure. A robust air-defense network will protect our industry and deter enemy bombing campaigns."
 ROM_beyond_the_black_sea:0 "Beyond the Black Sea"
 ROM_beyond_the_black_sea_desc:0 "With the modernization of our navy complete, Romania can project power beyond the Black Sea. Stronger naval forces and expanded dockyards will let us meet threats on the open seas."
 ROM_new_eastern_borders:0 "New Eastern Borders"
 ROM_new_eastern_borders_desc:0 "Victory over the Soviet Union allows us to consolidate the Transnistrian region. Integrating these territories will secure the stability and prosperity of Romania's new eastern borders."
 ROM_fight_tyranny:0 "Fight Against Tyranny"
 ROM_fight_tyranny_desc:0 "The spread of fascism across Europe threatens freedom and self-determination. Romania must stand against this danger and help liberate those suffering under its rule."
 ROM_subsidized_national_industrialization:0 "Subsidized National Industrialization"
 ROM_subsidized_national_industrialization_desc:0 "Alignment with the Soviet Union creates opportunities for economic cooperation. Its support can accelerate our industrial development and strengthen the economy for the challenges ahead."
 ROM_soviet_military_exercises:0 "Soviet Military Exercises"
 ROM_soviet_military_exercises_desc:0 "As a member of the Comintern, Romania can benefit from Soviet military expertise. Joint exercises will improve our armed forces and prepare us to defend socialism in Europe."

 ROM_bessarabian_war:0 "The Bessarabian War"
 ROM_bessarabian_war_desc:0 "Romania faces a critical war against the Soviet Union over Bessarabia. We must defend our homeland, exploit any opportunity for victory and remain prepared for the worst."
 ROM_demand_peace_negotiations:0 "Demand Peace Negotiations"
 ROM_demand_peace_negotiations_desc:0 "Our forces have advanced deep into Soviet territory. It is time to demand peace and assert our claims in Transnistria."
 ROM_sue_for_peace:0 "Sue for Peace"
 ROM_sue_for_peace_desc:0 "With Bessarabia and additional Romanian territory lost, we must seek peace before the situation becomes a complete disaster."

 NO_LAG_ROM_bessarabian_war:0 "$ROM_bessarabian_war$"
 NO_LAG_ROM_bessarabian_war_desc:0 "$ROM_bessarabian_war_desc$"
 NO_LAG_ROM_demand_peace_negotiations:0 "$ROM_demand_peace_negotiations$"
 NO_LAG_ROM_demand_peace_negotiations_desc:0 "$ROM_demand_peace_negotiations_desc$"
