 NO_LAG_ROM_sue_for_peace_desc:0 "$ROM_sue_for_peace_desc$"

 NO_LAG_ROM_peace.1.t:0 "Romanian Peace Proposal"
 NO_LAG_ROM_peace.1.desc:0 "Romania has offered peace after making major advances into Soviet territory. In exchange for ending hostilities, it demands the Transnistrian region."
 NO_LAG_ROM_peace.1.a:0 "Accept their demands."
 NO_LAG_ROM_peace.1.b:0 "Reject their demands."
 NO_LAG_ROM_peace.2.t:0 "Romania Sues for Peace"
 NO_LAG_ROM_peace.2.desc:0 "With its forces retreating and key territories under Soviet control, Romania has requested peace. Its government is prepared to concede Bessarabia to avoid complete defeat."
 NO_LAG_ROM_peace.2.a:0 "Accept their surrender."
 NO_LAG_ROM_peace.2.b:0 "Demand harsher terms."
 NO_LAG_ROM_peace.3.t:0 "The Soviets Reject the Romanian Proposal"
 NO_LAG_ROM_peace.3.desc:0 "The Soviet leadership has rejected Romania's peace proposal and chosen to continue the war."
 NO_LAG_ROM_peace.3.a:0 "Prepare for further fighting."
 NO_LAG_ROM_peace.4.t:0 "The Soviets Accept the Peace Terms"
 NO_LAG_ROM_peace.4.desc:0 "The Soviet Union has accepted Romania's terms and agreed to cede the Transnistrian region."
 NO_LAG_ROM_peace.4.a:0 "A triumph for Romania."
 NO_LAG_ROM_peace.5.t:0 "Romania Accepts the Soviet Terms"
 NO_LAG_ROM_peace.5.desc:0 "Faced with overwhelming Soviet advances, Romania has accepted the loss of Bessarabia in exchange for peace."
 NO_LAG_ROM_peace.5.a:0 "A bitter price for peace."

 NO_LAG_ROM_transnistrian_peace_terms_tt:0 "§Y[ROM.GetNameDefCap]§! and §Y[SOV.GetNameDef]§! will make peace. Romania will receive §YOdessa§!, §YBalta-Tiraspol§! and §YVinnytsia§! if those states remain Soviet-owned."
 NO_LAG_ROM_soviet_peace_terms_tt:0 "§Y[ROM.GetNameDefCap]§! and §Y[SOV.GetNameDef]§! will make peace. The Soviet Union will receive §YSouthern Bessarabia§!, §YBessarabia§! and §YBukovina§! if those states remain Romanian-owned. Romania will lose stability and war support."
 NO_LAG_ROM_natural_borders_tt:0 "If the territories claimed by Romania at the §YTrianon Conference§! are controlled by Romania or one of its subjects, they will become Romanian cores."

 NO_LAG_ROM_red_officers:0 "Romanian Red Officers"
 NO_LAG_ROM_red_officers_desc:0 "Joint exercises and Soviet military instruction have modernized Romania's command structure."
 NO_LAG_ROM_soviet_threat:0 "The Soviet Threat"
 NO_LAG_ROM_soviet_threat_desc:0 "Romania is prepared to defend its eastern frontier and carry the war beyond the Dniester."
 NO_LAG_ROM_fight_against_tyranny:0 "The Fight Against Tyranny"
 NO_LAG_ROM_fight_against_tyranny_desc:0 "Romania has committed its state and armed forces to the struggle against fascist tyranny in Europe."
 NO_LAG_ROM_horthyist_royal_guard:0 "The Royal Guard"
