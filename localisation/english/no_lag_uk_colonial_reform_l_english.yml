l_english:
 ENG_the_three_nation_solution:0 "A New Settlement for India"
 ENG_the_three_nation_solution_desc:0 "A stable settlement for the Indian subcontinent must strengthen its common institutions instead of creating a patchwork of weak states. Investment and administrative support will prepare India for the future while preserving the existing Commonwealth structure."
 ENG_towards_indian_independence:0 "Indian Self-Government"
 ENG_towards_indian_independence_desc:0 "We will gradually transfer administrative responsibilities and invest in India without partitioning the subcontinent or abruptly severing its ties to the Commonwealth."
 ENG_self_government_for_the_mediterranean:0 "Self-Government for the Mediterranean"
 ENG_self_government_for_the_mediterranean_desc:0 "Expanded local administration in our Mediterranean territories will improve cooperation and reduce resistance without creating additional states."
 ENG_self_government_for_africa:0 "Self-Government for Africa"
 ENG_self_government_for_africa_desc:0 "Regional councils and administrative investment will improve cooperation across our African territories while preserving existing borders."
 ENG_self_government_for_the_middle_east:0 "Self-Government for the Middle East"
 ENG_self_government_for_the_middle_east_desc:0 "A measured expansion of local administration will stabilize our Middle Eastern territories without a sudden political fragmentation."
 ENG_self_government_for_the_americas:0 "Self-Government for the Americas"
 ENG_self_government_for_the_americas_desc:0 "Administrative reform in our American territories will build local confidence and reduce resistance without creating additional countries."
 ENG_self_government_for_asia:0 "Self-Government for Asia"
 ENG_self_government_for_asia_desc:0 "Local institutions in our Asian territories will receive greater responsibility, strengthening cooperation while keeping the regional map intact."
 ENG_decolonization:0 "Commonwealth Reform"
 ENG_decolonization_desc:0 "We will answer demands for reform through political concessions, stronger local institutions and a renewed Commonwealth. The empire will not be shattered into dozens of new states."
 ENG_enforce_decolonization:0 "Champion Colonial Reform"
 ENG_enforce_decolonization_desc:0 "Our own reforms give us the credibility to promote political modernization abroad through example and diplomacy rather than forced fragmentation."
 NO_LAG_ENG_COLONIAL_REFORM_NO_RELEASE_TT:0 "§GNo new country will be released or puppeted.§! This focus strengthens administration without changing borders or subject autonomy."
