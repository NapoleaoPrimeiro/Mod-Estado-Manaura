# shackles
 remove_shackles:0 "Remove Shackles"
 remove_shackles_desc:0 "In order to make the game playable until the 1960s the minor's ability to field massive armies and produce massive ammounts of equipment was limited. If you want to play with a minor or medium power that has been limited in any way, this decision will remove those shackles."
  
 shackles.1.t:0 "Welcome to NO LAG BR!"
 shackles.1.d:0 "This remake keeps the game close to Vanilla while improving multiplayer performance.\n\n§YMain changes§!\n- AI Shackles limits the production and recruitment of selected AI countries; human countries never retain these limitations.\n- Human minor countries receive, by default, one permanent research slot and the exact pre-remake two-year support spirit (+150% construction, +30% line-change retention, +0.50 daily political power, +10% recruitable population factor and -20% training time).\n- The Soviet Union/Russia begins with one additional research slot.\n- Division-template XP costs are zero for creating brigade groups, replacing brigades and adding support companies.\n- Colored Puppets is active, with aligned colors for the Chinese factions.\n- The original SPOT Host Tool starts with Germany selected as controller.\n- Only the 1936 scenario is supported.\n\nConfirm below to apply the AI limits and begin."
 shackles.1.a:0 "Apply AI limits and continue"
 shackles.1.a.d:0 "Applies the optimization limits only to the AI; human countries remain unrestricted."
 
 unindustrialized:0 "Unindustrialized"
 unindustrialized_desc:0 "Reduces industrial expansion and equipment output for a shackled AI country."
 uninterested:0 "Uninterested"
 uninterested_desc:0 "Limits recruitment, fuel use and aggressive diplomacy for a shackled AI country."
 
 unshackle_congo:0 "Remove Congo's shackles"

