 #KSR
 KSR_demand_hultschiner_landchen: "The Hultschiner Ländchen Question"
 KSR_demand_hultschiner_landchen_desc: "Hultschiner Ländchen has been stripped away from us and given to Czechoslovakia in 1920. While seemingly insignificant, it is still our former imperial territory and we need to consider our territorial standing in Silesia."
 
 KSR_state_transfer_cat: "Territorial Disputes"
 KSR_state_transfer_cat_desc: "There is some territory in question that has been a subject of dispute between us and other countries. We could take additional steps to find a solution that will benefit us in one way or another."
 
 KSR_form_grand_duchy_lithuania_cat: "Resurrect the Grand Duchy"
 KSR_form_grand_duchy_lithuania_cat_desc: "There was a time when Lithuania was territorially the largest country in Europe. The real glorydays of the past can be traced back to the inter-sea empire lead by the powerful and militant Baltic Lithuanian tribe - the ruler of many Slavs. Perhaps we shall bring the Ruthenians back into the fold once again."
 KSR_form_grand_duchy_lithuania: "Re-form the Grand Duchy of Lithuania"
 
 LIT_move_capital_to_vilnius_desc: "Vilnius is back under our judicial control. As it is our traditional capital and the one outlined in our constitution, we must restore our government there at once."
 LIT_move_capital_to_kaunas: "Move temporary capital to Kaunas"
 LIT_move_capital_to_kaunas_desc: "Vilnius is no longer under our control. To ensure that the government of Lithuania continues to function, we need to establish it in our second most important city."
 
