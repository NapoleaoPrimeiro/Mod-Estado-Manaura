l_english:
 UK_integrate_lands:0 "Expansion of the Relam"
 UK_integrate_lands_desc:0 "With lands, new and old, now under our control, we must officially integrate them into our Empire."
 UK_form_uk_gb_france:0 "Form the §HUnited Kingdom of Great Britain and France§!"
 UK_form_uk_gb_france_desc:0 "Now is the time, we have finally asserted our dominance over those dammed French and they can now be our new loyal subjects!"
 UK_reintegrate_hanover:0 "The New Electorate of Hanover"
 UK_reintegrate_hanover_desc:0 "Hanover was once a part of our relam, but they have since distanced themselves from us. However, it is now time to bring them back into the fold."
 UK_reintegrate_ireland:0 "Reintegrate Ireland"
 UK_reintegrate_ireland_desc:0 "Ireland was once a part of our relam, but they have since distanced themselves from us. However, it is now time to bring them back into the fold."
 
 UK_BAF_countercoup_decisions:0 "The BAF Countercoup"
 UK_BAF_countercoup_decisions_desc:0 "While the monarchy is no longer with us, loyalists of it still are. Since the communist takeover, large portions of the army have been planning a countercoup to oppose the regime."
 UK_organize_baf_in_state:0 "Organize Military Cell in §H[FROM.getname]§!"
 UK_anti_communist_propoganda:0 "Anti-Communist Propoganda"
 UK_anti_communist_propoganda_desc:0 "The evils and dangers of communism cannot be understated. Join us, and face against it!"
 UK_execute_coup:0 "Execute the Coup"
 UK_execute_coup_desc:0 "The time is nigh! We have gathered enough support and we are ready to execute our coup!"

 UK_parliament_decisions:0 "Parliament"
 UK_parliament_guide:0 "§HParliament Guide§!"
 UK_parliament_guide_desc:0 "Welcome to Parliament! Here, laws are passed by an elected §7House of Commons§! and an appointed §tHouse of Lords§!.\n\nEach tab, that being the §tHouse of Lords§!, §7House of Commons§!, and §HParliamentary Acts§! can be accessed by clicking on their respective icon.\n\n§HActs§! require §H55%§! support from both houses to pass. You will also lose some support if they are passed.\n\nBoth houses can be manipulated with decisions that can §Gincrease§! support. This will be necessary as events will occur that will cause you to §Rlose§! (but sometimes §Ggain§!) support."
 UK_fill_empty_seat_lords:0 "Fill Vacancies"
 UK_fill_empty_seat_lords_desc:0 "\n§tHOUSE OF LORDS§!\n\nSometimes, Members of the House of Lords die or retire. This is unfortunate, but it is how it is. However, this can spell opportunity for us. We can select people loyal to the [ROOT.getrulingparty] to fill in the vacancies."
 UK_lobby_commons:0 "Political Lobbying"
 UK_lobby_commons_desc:0 "\n§7HOUSE OF COMMONS§!\n\nThe House of Commons may have to be convinced to join the cause of [ROOT.getleader]'s government, even if it means paying individuals to do so."
 UK_political_briberies_lords:0 "Political Briberies"
 UK_political_briberies_lords_desc:0 "\n§tHOUSE OF LORDS§!\n\nSometimes those in the House of Lords must be convinced with other means to follow the government's proposals. While possible leakages can happen, that's just politics."
 UK_political_briberies_commons:0 "Political Briberies"
 UK_political_briberies_commons_desc:0 "\n§7HOUSE OF COMMONS§!\n\nSometimes those in the House of Lords must be convinced with other means to follow the government's proposals. While possible leakages can happen, that's just politics."
 UK_government_slander_commons:0 "Slander the Government"
 UK_government_slander_commons_desc:0 "\n§7HOUSE OF COMMONS§!\n\nThe government's proposals are nothing but rediculous. We must speak out against them."
 UK_pm_speech_commons:0 "Prime Mister Speech"
 UK_pm_speech_commons_desc:0 "\n§7HOUSE OF COMMONS§!\n\nThe Prime Minister shall hold a great speech before the House of Commons, to help convince them to vote for government policy."
 UK_pm_speech_lords:0 "Prime Mister Speech"
 UK_pm_speech_lords_desc:0 "\n§tHOUSE OF LORDS§!\n\nThe Prime Minister shall hold a great speech before the House of Lords, to help convince them to vote for government policy."
 UK_military_training_act:0 "Military Training Act"
 UK_military_training_act_desc:0 "The Military Training Act will call up males aged 20 and 21 years old for six months' full-time military training, and then transferred to the Reserve."
 UK_promote_federalization_in_britain:0 "Promote Federalization in Great Britain"
 UK_promote_federalization_in_britain_desc:0 "Federalization is popular abroad, but not so much at home due to Atlanticists. If we want to make our union work, we must support it at home."
 UK_factory_act:0 "Factory Act"
 UK_factory_act_desc:0 "The Factory Act improves working conditions, especially for women and children."
 UK_emergency_powers_act:0 "Emergency Powers Act"
 UK_emergency_powers_act_desc:0 "In times of crisis, we must consolidate power to ensure our nation is safe and can continue functioning."
 UK_national_service_act:0 "National Service Act"
 UK_national_service_act_desc:0 "We must expand our military conscription, to help with the war effort."
 UK_education_act:0 "Education Act"
 UK_education_act_desc:0 "While it may be costly, we must reform our schools, as it will allow for a smarter populace in the long run."
 UK_nhs_act:0 "National Healthcare Service Act"
 UK_nhs_act_desc:0 "The National Healthcare Service will allow for free healthcare for all, but it will definitely be a costly endeavor."
 UK_new_spending_resolution:0 "Amend the Budget"
 UK_new_spending_resolution_desc:0 "It is necessary that we create a new budget that allows for more government spending to complete our goals."
 UK_increase_bureaucracy:0 "Increase Bureaucracy"
 UK_increase_bureaucracy_desc:0 "We should increase funding to our government institutions."

 UK_commonwealth_protectorate_decisions:0 "Expanding the Protectorate"
 UK_create_protectorate:0 "Create the §HProtectorate of [FROM.GetNonIdeologyNameDEF]§!"
 UK_integrate_protectorate:0 "Integrate the §HProtectorate of [FROM.GetNonIdeologyNameDEF]§!"

 UK_europe_alliance_decisions:0 "Alliance of Democracies"
 UK_europe_alliance_decisions_desc:0 "Now, more than ever, the democracies of Europe need to unite together to protect from the aggressions of communism and fascism."
 UK_invite_country_to_alliance:0 "Invite §H[FROM.getname]§! to §H[ROOT.getfactionname]§!"
 UK_invite_country_to_alliance_desc:0 "A great storm is brewing in Europe. It is in our best interest to invite [FROM.getnamedef] to our faction to ensure their, and our, protection."
 UK_propose_federalization_to_country:0 "Propose Federalization to §H[FROM.getname]§!"
 UK_propose_federalization_to_country_desc:0 "European unity is our end goal. To achieve this, we shall bring [FROM.getnamedef] into our fold."
 UK_integrate_country_eu:0 "Integrate §H[FROM.getname]§!"
 UK_integrate_country_eu_desc:0 "With our governemnts now so closely intertwined, let us remove the now husk of a barrier that seperates us and [FROM.getnamedef] as a part to achieve European unity."
 UK_promote_federalization_in_britain:0 "Promote Federalization in the Homeland"
 UK_promote_federalization_in_britain_desc:0 "While federalization is popular abroad, at home, it remains a dividing subject. If we want to achieve true unity, we must get our own people on our side."

 UK_form_atlantic_union_decisions:0 "Forming an Atlantic Union"
 UK_form_atlantic_union_decisions_desc:0 "We should pursue an Atlantic Union for the betterment of the peoples accross the Atlantic! It will take a tremendous political effort, but through time we can achieve a great political union!"
 UK_form_atlantic_union:0 "Form the Atlantic Union"
 UK_form_atlantic_union_desc:0 "Our time is nigh! With all the lands accross the North Atlantic secured, we can officially form the Atlantic Union!"
 UK_propose_greater_coop_with_country:0 "Propose Greater Cooperation with §H[PREV.getname]§!"
 UK_propose_greater_coop_with_country_desc:0 "We shall start with trans-atlantic unity by beginning to integrate [FROM.getnameDEF] as a part of our plans for a great trans-atlantic state!"
 UK_integrate_country_nato:0 "Integrate §H[FROM.getname]§!"
 UK_integrate_country_nato_desc:0 "With our governemnts now so closely intertwined, let us remove the now husk of a barrier that seperates us and [FROM.getnamedef] as a part to achieve trans-atlantic unity."

 UK_integrate_the_german_kingdoms_decisions:0 "Recreate the Kaiserreich"
 UK_integrate_the_german_kingdoms_decisions_desc:0 "Risen from the ashes of the British and German Empires, we shall re-create the Kaiserreich!"
 UK_integrate_preussen:0 "Re-Establish the §HKingdom of Prussia§!"
 UK_integrate_bayern:0 "Re-Establish the §HKingdom of Bavaria§!"
 UK_integrate_westfalen:0 "Establish the §HKingdom of Westphalia§!"
 UK_integrate_hanover:0 "Re-Establish the §HKingdom of Hanover§!"
 UK_integrate_rhein:0 "Establish the §HPrincipality of the Rhine§!"
 UK_integrate_sachsen:0 "Re-Establish the §HKingdom of Saxony§!"
 UK_integrate_wuerttemburg:0 "Re-Establish the §HKingdom of Württemburg§!"
 UK_integrate_hessen:0 "Establish the §HPrincipality of Hesse§!"
 UK_integrate_baden:0 "Re-Establish the §HKingdom of Baden§!"
 UK_integrate_mecklenburg_schwerin:0 "Re-Establish the §HKingdom of Mecklenburg-Schwerin§!"
 UK_integrate_thueringen:0 "Re-Establish the §HKingdom of Thuringia§!"
 UK_integrate_schleswig_holstein:0 "Establish the §HSchleswig-Holstein§!"
 UK_declare_the_kaiserreich_united:0 "The United Kaiserreichs"
 UK_expand_prussia:0 "Re-Expand the §HKingdom of Prussia§!"
 UK_integrate_alsace_lorraine:0 "Reintegrate Alsace-Lorraine"
 UK_integrate_luxembourg_german:0 "Integrate Luxembourg"
 UK_integrate_north_schleswig:0 "Reintegrate North Schleswig"

 UK_integrate_schweiz_decisions:0 "Integrate Switzerland"
 UK_integrate_schweiz_decisions_desc:0 "Switzerland has a large German-speaking population, and they are home of the Habsburg Castle, therefore it is only right that they are part of us!"
 UK_integrate_swiss_state:0 "Integrate §H[FROM.getname]§!"

 UK_integrate_habsburg_lands_decisions:0 "Integrate the Habsburg Lands"
 UK_integrate_habsburg_lands_decisions_desc:0 "With the union of the Habsburg and the Wittelsbach Houses solidified, we now have a claim over their former empire. Let us not waste time, and we must get to reconquering it as soon as possible!"
 UK_integrate_hungary:0 "Integrate Hungary"
 UK_integrate_bohemia:0 "Integrate Bohemia"
 UK_integrate_galicia:0 "Integrate Galicia"
 UK_integrate_north_italy:0 "Integrate North Italy"
 UK_integrate_slovakia:0 "Integrate Slovakia"
 UK_integrate_transylvania:0 "Integrate Transylvania"
 UK_integrate_illyria:0 "Integrate the Illyrian Slavs"
 UK_integrate_italian_slavs:0 "Integrate the Italian Slavs"
 UK_integrate_south_tyrol:0 "Integrate South Tyrol"
 UK_declare_the_empires_united:0 "The United Empires"

 form_hre_category_desc:0 "For over a century now, the lands that were once the Holy Roman Empire have been disunited. This is unacceptable, but thankfully, we can fix this."

 UK_netherland_decisions:0 "Restoring the Greatness of the Netherlands"
 UK_netherland_decisions_desc:0 "The Treaty of London broke up what was once the great Kingdom of the Netherlands, removing Belgium and Luxembourg from it. This humiliation must be revenged, and we must restore the Netherlands to not just its former glory, but make it even better!"
 UK_integrate_belgium:0 "Integrate Belgium"
 UK_integrate_luxembourg:0 "Integrate Luxembourg"
 UK_integrate_frisia:0 "Integrate German Frisia"
 UK_integrate_low_germany:0 "Integrate Low Germany"
 UK_integrate_orange:0 "Integrate Orange"
 UK_integrate_nassau:0 "Integrate Nassau"
 UK_integrate_pennsylvania:0 "Integrate the Pennsylvania Dutch"
 UK_integrate_new_amsterdam:0 "Re-establish New Amsterdam"
 
 UK_german_usa_decisions:0 "13 German-American Colonies"
 UK_german_usa_decisions_desc:0 "Much of America contains lands with historical German settlements and populations. Now that we control America, we must re-integrate our peoples into our empire!"
 UK_integrate_german_new_york:0 "Integrate New York"
 UK_integrate_german_pennsylvania:0 "Integrate Pennsylvania"
 UK_integrate_german_ohio:0 "Integrate Ohio"
 UK_integrate_german_illinois:0 "Integrate Illinois"
 UK_integrate_german_michigan:0 "Michigan"
 UK_integrate_german_missouri:0 "Integrate Missouri"
 UK_integrate_german_indiana:0 "Integrate Indiana"
 UK_integrate_german_wisconsin:0 "Integrate Wisconsin"
 UK_integrate_german_iowa:0 "Integrate Iowa"
 UK_integrate_german_minnesota:0 "Integrate Minnesota"
 UK_integrate_german_nebraska:0 "Integrate Nebraska"
 UK_integrate_german_dakota_north:0 "Integrate North Dakota"
 UK_integrate_german_dakota_south:0 "Integrate South Dakota"
 
 UK_hofbrauhaus_international_decisions:0 "Hofbräuhaus International"
 UK_hofbrauhaus_international_decisions_desc:0 "Hofbräuhaus needs to not only be in Munich, it should be all over the globe! Let's make an effort to expand our breweries to to turn Hofbräuhaus from a Munich favorite into the beer of the world.\n\nIt is possible to construct Hofbräuhaus breweries in the following cities (each of the following are historical locations):\n§H[261.GetCapitalVictoryPointName]§!, §H[395.GetCapitalVictoryPointName]§!, §H[379.GetCapitalVictoryPointName]§!, §H[366.GetCapitalVictoryPointName]§!, §H[525.GetCapitalVictoryPointName]§!, §H[59.GetCapitalVictoryPointName]§!, §H[64.GetCapitalVictoryPointName]§!, §H[51.GetCapitalVictoryPointName]§!, §H[658.GetCapitalVictoryPointName]§!, §H[158.GetCapitalVictoryPointName]§!, §H[358.GetCapitalVictoryPointName]§!, §H[289.GetCapitalVictoryPointName]§!, §H[394.GetCapitalVictoryPointName]§!."
 UK_proclaim_hofbrauhaus:0 "Construct §HHofbräuhaus [FROM.GetCapitalVictoryPointName]§!"
 
 UK_the_greater_british_empire_decisions:0 "Provinces of the Greater British Empire"
 UK_the_greater_british_empire_decisions_desc:0 "A nation reborn from the ashes, the British state must seek to expand back to its original lands, and restoring them as rightful provinces of the Empire.\n\n§HDecisions§! with the £ENG_canada_icon icon were provinces in §HCanada§!, or the §HHudson Bay Company§!.\n§HDecisions§! with the £ENG_america_icon icon were provinces of the §HThirteen Colonies§!, or §Hother American possessions§!.\n§HDecisions§! with the £ENG_australia_icon icon were, or were potential, provinces of §HAustralia§!."
 UK_integrate_ruperts_land_empire:0 "The Province of Rupert's Land"
 UK_integrate_bc_empire:0 "The Province of British Columbia"
 UK_integrate_new_brunswick_empire:0 "The Province of New Brunswick"
