 UK_imperial_protectorates:0 "Imperial Protectorates"
 UK_imperial_protectorates_desc:0 "With our position in the world, we should seek to create protectorates, to expand our influence or maybe even to restore old allies..."
 UK_create_iroquois_protectorate:0 "Re-Create the §HIroquois Confederacy§!"
 UK_create_hannover_protectorate:0 "Re-Create the §HElectorate of Hannover§!"

 UK_motorways:0 "Motorways"
 UK_motorways_desc:0 "We shall create a new system of roads, that shall connect cities from all parts of the country. Motorways will revolutionize automobile transportation in our country, and their inspiration by the German Reichsautobahn will make them good for transporting military vehicles as well.."
 UK_open_motorway_in_state:0 "Expand Motorways to §H[FROM.getname]§!"

 UK_get_path_guide:0 "Path Guides"
 UK_secret_path_guide:0 "Secret Paths"

 UK_german_confederation_decisions:0 "Manage the German Confederation"
 UK_german_confederation_decisions_desc:0 "Long ago, there was a union of German states under a confederation. Now that we are the hegemon of the region, we should re-establish it."
 UK_germany_integrate_austria:0 "Integrate §HAustria§! into the §HGerman Confederation§!"
 UK_germany_integrate_slovenia:0 "Integrate §HCarniola§! into the §HGerman Confederation§!"
 UK_germany_integrate_czechia:0 "Integrate §HBohemia§! into the §HGerman Confederation§!"
 UK_germany_integrate_tyrol_sued:0 "Integrate §HSouth Tyrol§! into the §HGerman Confederation§!"
 UK_germany_integrate_luxembourg:0 "Integrate §HLuxemburg§! into the §HGerman Confederation§!"

 UK_nse_decisions:0 "Reform the North Sea Empire"
 UK_nse_decisions_desc:0 "With us reinvigorating or past viking spirit, we can claim to be the true successor-state to the North Sea Federation, and therefore reform it!"
 UK_declare_north_sea_empire:0 "Declare the reformation of the North Sea Empire"
 UK_integrate_normandy:0 "Normandy is Norman!"
 UK_pan_scandinavianism:0 "Pan-Scandinavianism"
 UK_integrate_finland:0 "Expand the Definition of Scandinavian"
 UK_integrate_the_islands:0 "Integrate the Islands"
 UK_integrate_vinland:0 "Re-Establish Vinland"
 UK_integrate_karelia:0 "Declare Karelia to be Nordic"
 UK_integrate_ingria:0 "Re-Establish Ingria"
 UK_integrate_baltics:0 "Reintegrate the Baltic States"

 UK_germanic_empire_decisions:0 "A West-Germanic State"
 UK_germanic_empire_decisions_desc:0 "Our Anglo-Saxon roots stem from the continent, in what is now West-Germanic states. We should seek to re-unify these lands!"
