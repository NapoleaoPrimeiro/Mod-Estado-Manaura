l_english:
 mtg_britain.22.b:0 "A dissolution of Parliament and a snap election would be more preferable."

 ukrework.1.t:0 "The British General Election, [GetMonth] of [GetYear]"
 ukrework.1.desc:0 "Following a motion of no confidence against Prime Minister Chamberlain's government, many expected Winston Churchill to become prime minister in his place. However, the decision was made to dissolve Parliament instead, and a snap election was held.\nThe papers are expecting a Labour landslide due to Clement Attlee's tough stance against appeasement, compared to a divided Conservative Party."
 ukrework.1.a:0 "The Labour Party wins big!"

 ukrework.2.t:0 "Fate of the Isles"
 ukrework.2.desc:0 "With the government moving into Germany, and with it, the Monarch, many are wondering why we are even holding on to the British Isles. Many have suggested that we allow the King's brother to rule over a dominion there."
 ukrework.2.a:0 "That's probably for the best."
 ukrework.2.b:0 "There is no need for that."

 ukrework.3.t:0 "Conspiracy in the BAF"
 ukrework.3.desc:0 "Royalists in the BAF have risen up, capturing London and raising the old Union Jack over it. The government has fleed, and this is only the beginning..."
 ukrework.3.a:0 "The Reds shall rule us no more!"

 ukrework.4.t:0 "The Communist Party forms the "Red Guards""
 ukrework.4.desc:0 "The Communist Party has formed a group of both militia and professionals loyal to the communist cause, in an effort to stop the events in London. Meanwhile, the BAF has started to organize their own loyalist cells in order to gain enough support to fully overthrow the government."
 ukrework.4.a:0 "If those bastards want their fight then let them have it!"

 ukrework.5.t:0 "The End of the Counter-revolution"
 ukrework.5.desc:0 "The coup has succeeded, and a provisional military government has formed in London. Members of the former government have fled into exile, and now there is much work to do to bring our country back to normalcy."
 ukrework.5.a:0 "Jolly good job, boys!"

 ukrework.6.t:0 "Communist Opposition"
 ukrework.6.desc:0 "Shortly following the military's consolidation over the island, communist opposition groups have formed to rally against the government. They will continue to be a problem for a while, unless we destroy them soon."
 ukrework.6.a:0 "Damn!"

 ukrework.7.t:0 "Union Leaders Call for Strike"
 ukrework.7.desc:0 "A month-long strike has been ordered by socialist union leaders resulting in factory output screeching to a halt. The communists continue to ruin our country..."
 ukrework.7.a:0 "They just can't help themselves!"
 
 ukrework.8.t:0 "Factory Bombings"
 ukrework.8.desc:0 "There have been reports around the country of communists bombing our factories! We must put a stop to this..."
 ukrework.8.a:0 "This is terrorism!"

 ukrework.9.t:0 "Communist Rally"
 ukrework.9.desc:0 "A communist rally has been held recently. While previously secret, its existence is quite obvious now."
 ukrework.9.a:0 "Oh please, nobody could possibly still be listening to these fools."
 
 ukrework.10.t:0 "Calls for Democracy"
 ukrework.10.desc:0 "Several former Members of Parliament from the Conservative, Liberal, and Labor Parties have meet with the Provisional Government, requesting for democratic elections to be held in the future."
 ukrework.10.a:0 "Thank them for their time but deny their requests."
 ukrework.10.b:0 "Let the people be heard."

 ukrework.11.t:0 "An Uncertain Future"
 ukrework.11.desc:0 "Many have been concerned with the future of our nation, as currently the military government has been rather silent on its plans."
 ukrework.11.a:0 "Those who wait, prosper."

 ukrework.12.t:0 "The British General Election, [GetMonth] of [GetYear]"
 ukrework.12.desc:0 "National Elections have returned! The people are excited to cast their votes under some time under both communist and later military dictatorships. With the political landscape having vastly changed, polling has not revealed a clear victor. Who will win?"
 ukrework.12.a:0 "The Labor Party finally returns!"
 ukrework.12.b:0 "The Conservative Party continues their interrupted reign."
 ukrework.12.c:0 "The Liberal Party squeezes out a win!"

 ukrework.13.t:0 "A Banner for the Republic"
 ukrework.13.desc:0 "With a republic being established, many have asked the question of what flag we should fly. Many like the Union Jack, but with its ties to the monarchy, it may be better to pick something else."
 ukrework.13.a:0 "The Union Jack suits us just fine."
 ukrework.13.b:0 "We should fly the old republican colors!"
 ukrework.13.c:0 "Maybe we should return to the Commonwealth flag?"

 ukrework.14.t:0 "A New Monarchy"
 ukrework.14.desc:0 "Since the fall of the communist regime, many have wished for a return to a monarchy. However, with the Windsors out of the question, we will have to find other royal families to rule over the nation.\nIn addition, a decree by the military government has declared that once a monarch has been selected, elections to Parliament shall be held."
 ukrework.14.a:0 "The House of Wittelsbach from Bavaria are the most legitimate choice."
 ukrework.14.b:0 "The House of Orange-Nassau from the Netherlands once ruled over our nation."
 ukrework.14.c:0 "The House of Hohenzollern from Germany is closely related to the old Windsors."

 ukrework.15.t:0 "[ENG.getnameDEFcap] Wants Our Monarch!"
 ukrework.15.desc:0 "Ever since the fall of the communists in [ENG.getnameDEF], many have wanted a return to the monarchy. This has come to fruition, but with a twist. The times have changed now, and they have selected us, the House of Orange-Nassau, for their royal family. Do we accept?"
 ukrework.15.a:0 "Maybe this could give us a close ally?"
 ukrework.15.b:0 "This is not in our best interest."

 ukrework.16.t:0 "[HOL.getnamedefcap] Accepts!"
 ukrework.16.desc:0 "Our ambassador to [HOL.getnamedefcap] has returned from his diplomatic mission, and he has stated that our proposition to have their monarch as our own has been accepted!"
 ukrework.16.a:0 "Fantastic!"

 ukrework.17.t:0 "[HOL.getnamedefcap] Declines!"
 ukrework.17.desc:0 "Our ambassador to [HOL.getnamedefcap] has returned from his diplomatic mission, and he has stated that our proposition to have their monarch as our own has been declined!"
 ukrework.17.a:0 "Unfortunate, but thankfully we have other choices."

 ukrework.18.t:0 "[ENG.getnameDEFcap] Wants Our Monarch!"
 ukrework.18.desc:0 "Ever since the fall of the communists in [ENG.getnameDEF], many have wanted a return to the monarchy. This has come to fruition, but with a twist. The times have changed now, and they have selected us, the House of Hohenzollern, for their royal family, for a possible Queen Victoria II. Do we accept?"
 ukrework.18.a:0 "We cannot decline this opportunity."
 ukrework.18.b:0 "Not possible."

 ukrework.19.t:0 "[GER.getnamedefcap] Accepts!"
 ukrework.19.desc:0 "Our ambassador to [GER.getnamedefcap] has returned from his diplomatic mission, and he has stated that our proposition to have Princess Victoria as our monarch has been accepted!"
 ukrework.19.a:0 "Fantastic!"

 ukrework.20.t:0 "[GER.getnamedefcap] Declines!"
 ukrework.20.desc:0 "Our ambassador to [GER.getnamedefcap] has returned from his diplomatic mission, and he has stated that our proposition to have have Princess Victoria as our monarch has been declined!"
 ukrework.20.a:0 "Unfortunate, but thankfully we have other choices."

 ukrework.21.t:0 "[ENG.getnameDEFcap] holds a vote for union with us!"
 ukrework.21.desc:0 "[ENG.getnameDEFcap], ever since abandoning the monarchy has held more republican ideals. This has made a union with them very popular among our people. This has all culminated in a referendum, and the Unionists won in a landslide. Do we accept the vote?"
 ukrework.21.a:0 "The people's will is what matters."
 ukrework.21.b:0 "Declare the vote to be illegal."

 ukrework.22.t:0 "[IRE.getnameDEFcap] Accepts Referendum Results"
 ukrework.22.desc:0 "[IRE.getnameDEFcap] has decided to recognize the results of the referendum we held in them for our union. The Prime Minister is expected to travel to Dublin tomorrow to organize the agreements."
 ukrework.22.a:0 "I love democracy."

 ukrework.23.t:0 "[IRE.getnameDEFcap] Rejects Referendum Results"
 ukrework.23.desc:0 "[IRE.getnameDEFcap] has decided to not recognize the results of the referendum we held in them for our union, declaring it illegal.\nIntelligence has reported that they have rallied their troops, in case of war."
 ukrework.23.a:0 "A war isn't in our interest."
 ukrework.23.b:0 "Such oppresive measures cannot be tolerated!"

 ukrework.24.t:0 "The Sun Never Sets"
 ukrework.24.desc:0 "In the wake of the new royal family, [ROOT.getneutralparty], headed by [ROOT.getleader], many suspected that [ROOT.getnamedef] would find itself under a different name. Yet, it seems that [ROOT.getleader] has sought to follow the legacy of the old royal family, the Windsors. As such, the Union Jack still reigns above our great and glorious nation.\n\nThe sun never sets on the British Empire."
 ukrework.24.a:0 "Rule Britannia, Britannia rule the waves!"

 ukrework.25.t:0 "The Orange Pennant Flies Proudly"
 ukrework.25.desc:0 "Today in London, royal guards were seen rasing a Dutch flag with an orange pennant above it. A symbol of the Dutch monarchy, it being raised presents a new era for [ROOT.getnamedef]. While largely a symbolic gesture, many loyal to the old Union Jack have been very angered about it.\n\nWhat will this mean for our future? Only time can tell."
 ukrework.25.a:0 "Oranje Boven!"

 ukrework.26.t:0 "The Imperial Banner Over London"
 ukrework.26.desc:0 "A nation almost always defined as a kingdom is no longer. Today, [ROOT.getleader] held a ceremony in London, declaring [ROOT.getleader.GetHerselfHimself] now the Kaiser of what we once knew as [ROOT.getnamedef]. In the ceremony, the German Imperial flag was symbolically raised over London, signifying a new era for our nation.\n\nThis only marks the start of what the now Kaiser claims to be [ROOT.getleader.GetHersHis] "grand ambitions"."
 ukrework.26.a:0 "Gott Mit Uns!"

 ukrework.27.t:0 "Rautenflagge Raised"
 ukrework.27.desc:0 "Many observe as the Lozenge flag, also known as the Rautenflagge, of Bavaria has been ceremonially risen over London today. It came as a great shock to most, as it was expected that [ROOT.getleader], descendant of the House of Stuart, would stick with the traditions of [ROOT.getnamedef].\n\nIt is certain that the reign of [ROOT.getleader] will be significantly more interesting than many had once expected."
 ukrework.27.a:0 "In Treue Fest!"

 ukrework.28.t:0 "[FROM.getnamedefcap] Reviews Arctic Security"
 ukrework.28.desc:0 "[FROM.getnamedefcap]'s foreign minister has meet us today, requesting that we relenquish our arctic territories. This would help us with our security, but if we deny the proposition we may face a military intervention."
 ukrework.28.a:0 "It would be one less thing to worry about..."
 ukrework.28.b:0 "We are perfectly capable of protecting these territories."

 ukrework.29.t:0 "[FROM.getnamedefcap] Accepts Our Demands"
 ukrework.29.desc:0 "[FROM.getnamedefcap]'s government has decided to agreee to our proposal, handing over their Arctic territories to us. A ceremony is planned later this week, for us to plant our flag in their former lands."
 ukrework.29.a:0 "Thank you for your cooperation, [FROM.getleader]!"

 ukrework.30.t:0 "[FROM.getnamedefcap] Rejects Our Demands"
 ukrework.30.desc:0 "[FROM.getnamedefcap]'s government has decided to reject our proposal, foolishly holding on to their Arctic territories. They seem to be building up their defences, in case we retaliate."
 ukrework.30.a:0 ""No" isn't really a valid answer."
 ukrework.30.b:0 "Well, that's just too bad..."

 ukrework.31.t:0 "[FROM.getnamedefcap] Wants us to Increase Ties with Them!"
 ukrework.31.desc:0 "[FROM.getnamedefcap] has recently hinted at the policy of a union between us and many other countries, and as part of that they want us to join them. It wouldn't be immediate, but over time we will be fully integrated into them if we accept.\nHowever, a rejection could lead to retaliation."
 ukrework.31.a:0 "We will be better together!"
 ukrework.31.b:0 "This threatens our independence!"

 ukrework.32.t:0 "[FROM.getnamedefcap] Begins to Integrate with Us"
 ukrework.32.desc:0 "[FROM.getnamedefcap] has accepted our request for them to slowly join with us."
 ukrework.32.a:0 "United we stand, divided we fall."

 ukrework.33.t:0 "[FROM.getnamedefcap] Rejects Our Proposition!"
 ukrework.33.desc:0 "[FROM.getnamedefcap] has decided to fully reject any possibility of uniting with us in the future. How should we respond?"
 ukrework.33.a:0 "A house divided amongst itself cannot stand!"
 ukrework.33.b:0 "Oh well..."

 ukrework.34.t:0 "The Brexit Movement"
 ukrework.34.desc:0 "A movement promoting the British exit form [ROOT.getnamedef] has gone into full speed, and they now demand full independence, or else. We must consider our decisions carefully.\nTo help compromise, they did state that if they were granted full independence, they would consider joining our alliance. Otherwise, they might start a rebellion."
 ukrework.34.a:0 "Let them leave... if they want to..."
 ukrework.34.b:0 "Sure, but we'll make sure we have control over their foreign policy!"
 ukrework.34.c:0 "They can't be serious!"
 ukrework.34.d:0 "Free Britannia!"

 ukrework.35.t:0 "[FROM.getnamedefcap] Wants to Unite with Us!"
 ukrework.35.desc:0 "Being from the same royal house, it's only right that our countries unify. Or, at least, that's what the [FROM.getnameADJ] foreign minister said in our meeting today. The question is, how do we respond?"
 ukrework.35.a:0 "We must seek our unification, now!"
 ukrework.35.b:0 "Sure, but let's not be just too drastic yet."
 ukrework.35.c:0 "We didn't agree to this!"

 ukrework.36.t:0 "[FROM.getnamedefcap] Accepts Full Unity"
 ukrework.36.desc:0 "[FROM.getnamedefcap] has decided that unification is in the best interest for our peoples, and has therefore accepted our proposition to unify, in full."
 ukrework.36.a:0 "Together, we will stand undefeated!"

 ukrework.37.t:0 "[FROM.getnamedefcap] Accepts Partial Unity"
 ukrework.37.desc:0 "[FROM.getnamedefcap] has decided that unification is in the best interest for our peoples, and has therefore accepted our proposition to unify, in part."
 ukrework.37.a:0 "Soon, we will stand together!"

 ukrework.38.t:0 "[FROM.getnamedefcap] Denies Unity"
 ukrework.38.desc:0 "The fools from [FROM.getnamedef] have decided that unification is not in the interests of their greedy government, and has decided that we will stay disunited as a result."
 ukrework.38.a:0 "Their words cannot defeat our rifles."

 ukrework.39.t:0 "The Habsburg-Wittelsbach Royal Marriage"
 ukrework.39.desc:0 "Members from the Habsburg and Wittelsbach royal families celebrate at Hofburg Palace as Prince Ludwig Karl Maria of Wittelsbach and Archduchess Adelheid of Habsburg marry. This solidifies a tie between the two families, and it is announced that [ROOT.getnamedef] shall reclaim the lands of the former Austrian Empire."
 ukrework.39.a:0 "Hurrah!"

 ukrework.40.t:0 "The Fate of Switzerland"
 ukrework.40.desc:0 "Switzerland, now a territory of ours as a result of our reclaimation of Habsburg Castle, has an uncertain fate ahead of it. While some suggest that it would be a good idea to reinstate Switzerland as a satellite state, others argued it should be integrated as another German part of the relam."
 ukrework.40.a:0 "There is no reason it shouldn't be a part of the empire."
 ukrework.40.b:0 "It is better off as a semi-independent state."

 ukrework.41.t:0 "Meeting with the Pope"
 ukrework.41.desc:0 "Today, our great King, [ROOT.getleader], has meet with the Pope. [ROOT.getnamedefcap] has been disconnected from the Catholic Church for centuries as a result of the former Henry VIII, and our current King has wanted to reconcile the nation.\nThe meeting with the Pope was successful, and with that our future ambitions can be legitimized."
 ukrework.41.a:0 "A great step for our nation."

 ukrework.42.t:0 "Federal or Unitary?"
 ukrework.42.desc:0 "With the Kaiserreich being unified, many ask the question: should it continue to use the same federal system that the old kaiserreich used, or a more unitary system like that of the former United Kingdom?"
 ukrework.42.a:0 "The rights of each of the kingdoms is very important!"
 ukrework.42.b:0 "Unity is what we need."

 ukrework.43.t:0 "Capital Question"
 ukrework.43.desc:0 "Many question where the capital should be. While many argue that London suits the Kaiserreich just fine, others argue that Berlin would be a better choice for historical reasons."
 ukrework.43.a:0 "London will serve us just fine!"
 ukrework.43.b:0 "Berlin is the historical choice."
 ukrework.43.c:0 "Frankfurt's central location could be a good compromise."

 ukrework.44.t:0 "The Question of Democracy"
 ukrework.44.desc:0 "Many question where the how democratic the government should be. Most suggest either a semi-democratic or absolutist government, but radicals propose a full return to democracy!"
 ukrework.44.a:0 "Prussian democracy will be just fine."
 ukrework.44.b:0 "Prussian absolutism would be better."
 ukrework.44.c:0 "Maybe a return to democratic ideals is the right choice."

 ukrework.45.t:0 "The Social Labour Party"
 ukrework.45.desc:0 "In preparations for the elections coming up, the Social Democratic Party of Germany and the Labour Party of Great Britain have merged to form the new Social Labour Party. The question is, who should be its leader?"
 ukrework.45.a:0 "Clement Attlee"
 ukrework.45.b:0 "Hans Vogel"

 ukrework.46.t:0 "The National Conservative Party"
 ukrework.46.desc:0 "In preparations for the elections coming up, the Centre Party of Germany and the Conservative Party of Great Britain have merged to form the new National Conservative Party. The question is, who should be its leader?"
 ukrework.46.a:0 "Winston Churchill"
 ukrework.46.b:0 "Konrad Adenauer"

 ukrework.47.t:0 "The German-British General Election, [GetMonth] of [GetYear]"
 ukrework.47.desc:0 "The people are excited to vote as the great country of [ROOT.getnamedef] has finally decided to open up free, democratic elections. Question is, who will win?"
 ukrework.47.a:0 "The National Conservative Party"
 ukrework.47.b:0 "The Social Labour Party"

 ukrework.48.t:0 "The New German-American Capital"
 ukrework.48.desc:0 "The new nation of [USA.getnamedef] is quite different with its predecessor, and therefore, many call for the capital to be moved to a city with great German significance."
 ukrework.48.a:0 "Cincinnati has a large German community."
 ukrework.48.b:0 "Philadelphia, for sea access."
 ukrework.48.c:0 "Bismarck, a hero for German patriots!"
 ukrework.48.d:0 "Washington was a hero for the Americans, keep it there."

 ukrework.49.t:0 "Demands for Democracy"
 ukrework.49.desc:0 "Americans find democracy to be a sacred institution. When we established Neu Preußen, many American politicians voiced their concerns! They stated if we allow for democracy, they will stay loyal to us! Otherwise, they will voice their concerns."
 ukrework.49.a:0 "I'll allow it."
 ukrework.49.b:0 "A compromise is possible."
 ukrework.49.c:0 "Just who do they think they are?"

 ukrework.50.t:0 "Pirate Radios"
 ukrework.50.desc:0 "Due to many of our newly-constructed Maunsell Forts being unmanned, as we are not in a state of war, several have been occupied by civilians and "Pirate Radios" have been set up. This has angered the primary broadcasting station, the BBC, but is it even worth the effort to shut it down?"
 ukrework.50.a:0 "It's not worth our time."
 ukrework.50.b:0 "We need to shut these down as soon as possible!"
 
 ukrework.51.t:0 "King Denounced on Paddy Roy Bates' Radio"
 ukrework.51.desc:0 "One of the "Pirate Radio" operaters, a young Paddy Roy Bates, have denounced the Kings' government. While normally a music station, yesterday he also aired anti-Windsor propoganda."
 ukrework.51.a:0 "It's just a small radio station, it's still not worth our time!"
 ukrework.51.b:0 "Arrest Bates at once!"

 ukrework.52.t:0 "Paddy Roy Bates Declares the Principality of Sealand"
 ukrework.52.desc:0 "On a regular training exercise, naval ships spotted a new flag waving over Roughs Tower, and it was later confirmed on Bates' radio that a new principality, Sealand, had been formed, with Bates as its prince. Many of his listeners have supported this move, leaving the government with little to do unless they want revolt."
 ukrework.52.a:0 "Uh oh."

 ukrework.53.t:0 "Paddy Roy Bates Stages Coup"
 ukrework.53.desc:0 "Today, hundreds of thousands of Bates loyalists marched on London, demanding for the King to step down, and for the country to submit to the Principality of Sealand. With little choice, Edward VIII was forced to accept, and now the entirety of the British Empire has been absorbed into the Principality of Sealand."
 ukrework.53.a:0 "E Mare Libertas!"

 ukrework.54.t:0 "Fate of the Countries"
 ukrework.54.desc:0 "Many have questioned the fate of the countries of the United Kingdom since the new monarchy has been instated. What shall we do with them?"
 ukrework.54.a:0 "We're really only one kingdom."
 ukrework.54.b:0 "Devolution is the best choice."
 ukrework.54.c:0 "Create new kingdoms, and assign our own royal family to them."
 ukrework.54.d:0 "Create new kingdoms, and assign our local royal families to them."

 ukrework.55.t:0 "The return of the monarchy"
 ukrework.55.desc:0 "Finally, after some time of seperation and of exile to Canada, the royal family has returned to their true home in Windsor palace."
 ukrework.55.a:0 "God save the King!"

 ukrework.56.t:0 "The Royal Family returns home"
 ukrework.56.desc:0 "Finally, after some time of seperation and of exile to Canada, the royal family has returned to their true home in Windsor palace."
 ukrework.56.a:0 "We bid them farewell."

 ukrework.57.t:0 "Communist Civil War"
 ukrework.57.desc:0 "Civil war has officially broken out, as communist leaders demanded for a change of government. This change was obviously not listened to, and war has broken out as socialist militias have started to open fire against local police."
 ukrework.57.a:0 "For the revolution!"
 
 ukrework.58.t:0 "Dominions assume control of colonies"
 ukrework.58.desc:0 "The Dominions have officially assumed control of the colonies, in accordance with a request by Parliament. Is our country doomed?"
 ukrework.58.a:0 "Has the sun set?"

 ukrework.59.t:0 "Dominions assume control of colonies"
 ukrework.59.desc:0 "The Dominions have officially assumed control of the colonies, in accordance with a request by Parliament. Is [FROM.getnameDEF] doomed?"
 ukrework.59.a:0 "Maybe we can achieve independence too?"

 ukrework.60.t:0 ""The Worst Strike Ever""
 ukrework.60.desc:0 "Is what the papers would have called it, if they weren't shut down. Unions accross the country demand for drastic reforms that cannot be implemented without a change of government. Is the country ruined?"
 ukrework.60.a:0 "Uh oh."

 ukrework.61.t:0 "Fall of an Empire"
 ukrework.61.desc:0 "Today, the British Empire has officially fallen. All of the Dominions, and the Raj, have declared independence, leaving the British Isles left alone with a few outposts."
 ukrework.61.a:0 "We have more important issues at home!"

 ukrework.62.t:0 "Fall of an Empire"
 ukrework.62.desc:0 "Today, the British Empire has officially fallen. All of the Dominions, and the Raj, have declared independence, leaving the British Isles left alone with a few outposts."
 ukrework.62.a:0 "This is a great thing - or is it?"

 ukrework.63.t:0 "Form the Commonwealth of Nations?"
 ukrework.63.desc:0 "Many officials in our country suggest that the former British colonies unite, in the face of an ever-radicalizing world. Should we?"
 ukrework.63.a:0 "We must!"
 ukrework.63.b:0 "No!"

 ukrework.64.t:0 "The Civil War Ends"
 ukrework.64.desc:0 "Our civil war has finally ended. Now we can fix our country, and liberate the workers!"
 ukrework.64.a:0 "For the revolution!"

 ukrework.65.t:0 "The Second Great War"
 ukrework.65.desc:0 "Once again, the European continent has dragged itself into a total war, and we are a major part of it. Whatever the result may be, the history of Europe will change forever."
 ukrework.65.a:0 "Appeasenent has failed."
 ukrework.65.b:0 "We must stop the [GER.getnamedef] war machine!"

 ukrework.66.t:0 "The Second Great War Ends"
 ukrework.66.desc:0 "Once again, the a great European war has ended, with us being the victors. The nation eyes the East, as [SOV.getnamedef] now threatens peace."
 ukrework.66.a:0 "Let's try to prevent another."

 ukrework.67.t:0 "Northern Ireland for Alliance"
 ukrework.67.desc:0 "[ENG.getnamedefcap] wants us to join their war, but as compensation, we will get Northern Ireland! Shall we accept?"
 ukrework.67.a:0 "Great deal!"
 ukrework.67.b:0 "Not possible."

 ukrework.68.t:0 "Northern Ireland for Alliance - Accepted"
 ukrework.68.desc:0 "[IRE.getnamedefcap] has decided to accept our proposal - let us unite against the enemy!"
 ukrework.68.a:0 "Let's hope this pays off."

 ukrework.69.t:0 "Northern Ireland for Alliance - Declined"
 ukrework.69.desc:0 "[IRE.getnamedefcap] has unfortunately decided to decline our proposal - stating that their commitment to neutrality is too important."
 ukrework.69.a:0 "Too bad..."

 ukrework.70.t:0 "Future of [IRE.getnamedef]"
 ukrework.70.desc:0 "Obviously, we want to secure [IRE.getnamedef], but what shall be their fate once we bring them back under our control?"
 ukrework.70.a:0 "A loyal Dominon."
 ukrework.70.b:0 "Perhaps we can bring them back as a part of the Empire!"

 ukrework.71.t:0 "[FROM.getnamedefcap] Campaign for an Alliance"
 ukrework.71.desc:0 "[FROM.getnamedefcap] wants us to unite with them against the fascist menace in this world in the form of an alliance. Shall we join?"
 ukrework.71.a:0 "The cause is noble."
 ukrework.71.b:0 "Our people do not want another war."

 ukrework.72.t:0 "[FROM.getnamedefcap] Join [ROOT.GetFactionName]"
 ukrework.72.desc:0 "[FROM.getnamedefcap] has decided to join [ROOT.GetFactionName] to face against the menace of fascism. Let us march together."
 ukrework.72.a:0 "Fantastic!"

 ukrework.73.t:0 "[FROM.getnamedefcap] decides to not join [ROOT.GetFactionName]"
 ukrework.73.desc:0 "[FROM.getnamedefcap] has decided to not join [ROOT.GetFactionName] to face against the menace of fascism. We will have to fight alone, for now."
 ukrework.73.a:0 "Unfortunate."

 ukrework.74.t:0 "Convention of the British Union of Fascists, [GetYear]"
 ukrework.74.desc:0 "The party has convened today, to decide on policy. A primary issue was the focus on expansion of the state or focus on internal problems. What should the ultimate decision be?"
 ukrework.74.a:0 "Domestic policy is more important."
 ukrework.74.b:0 "Expansion of the State!"

 ukrework.75.t:0 "Mosley Seeks a Higher Status"
 ukrework.75.desc:0 "With our unification of the Anglosphere, many - including Mosley himself - call for the leader of the nation to be called a "Big Brother" and for us to become a new nation, Oceania. Should we accept this proposal?"
 ukrework.75.a:0 "What?"
 ukrework.75.b:0 "Big Brother is Always Watching."

 ukrework.76.t:0 "The Formation of Oceania"
 ukrework.76.desc:0 "§RREDACTED§!"
 ukrework.76.a:0 "All will submit to the Party and Big Brother in due time."

 ukrework.77.t:0 "The London Conference"
 ukrework.77.desc:0 "Today, delegates from several European powers were invited to London to discuss the future of Africa. However, only our delegates arrived. By default, that means all of Africa is ours!"
 ukrework.77.a:0 "More land for us, I guess."

 ukrework.78.t:0 "Deal with the Green Shirts"
 ukrework.78.desc:0 "The Green Shirts are a paramilitary organization, but to say the least, they have interesting practices. Should we work with them and take advantage of their paramilitary organization, or should we rid of them?"
 ukrework.78.a:0 "Lock up those loony bastards!"
 ukrework.78.b:0 "Despite their odd ways, we can work with them."

 ukrework_parliament.1.t:0 "Managing Parliament"
 ukrework_parliament.1.desc:0 "Hello! In this mod, there is separate decisions for the House of Commons and the House of Lords for you to manage. Would you like to access the House of Lords or the House of Commons decisons first?\n\nNOTE: You can switch decisions at any time by clicking on the icon for the respective House, as well as the Acts."
 ukrework_parliament.1.a:0 "The House of Commons"
 ukrework_parliament.1.b:0 "The House of Lords"
 ukrework_parliament.1.c:0 "Let's focus on the Parliamentary Acts"

 ukrework_parliament.2.t:0 "House of Commons Member Criticizes Government"
 ukrework_parliament.2.desc:0 "Recently, one of the members of the House of Commons has criticized the government. A few government supporters have unfortunately joined his cause."
 ukrework_parliament.2.a:0 "It will make little difference."

 ukrework_parliament.3.t:0 "House of Commons Member Leaves [ROOT.GetRulingParty]"
 ukrework_parliament.3.desc:0 "One of the members of [ROOT.GetRulingPartyLong] has announced their resignation from the party, stating that the ideals of the party no longer align with him."
 ukrework_parliament.3.a:0 "He will not be missed."

 ukrework_parliament.4.t:0 "Opposition Member Supports Government"
 ukrework_parliament.4.desc:0 "One of the members of the Opposition has announced their support for the government's recent initiatives. A few other members have announced their support as well."
 ukrework_parliament.4.a:0 "Let's hope the momentum carries!"

 ukrework_parliament.5.t:0 "House of Lords Member Dies"
 ukrework_parliament.5.desc:0 "A supporter of our government in the House of Lords has recently passed away, with several important cabinet members attending his funeral."
 ukrework_parliament.5.a:0 "Goodbye, old friend. Your vote will be missed."

 ukrework_parliament.6.t:0 "House of Lords Scandal"
 ukrework_parliament.6.desc:0 "Several members of [ROOT.GetRulingPartyLong] have recently been caught in a widespread scandal. They have been forced to resign their positiions as a result."
 ukrework_parliament.6.a:0 "At least I wasn't caught."

 ukrework_parliament.7.t:0 "House of Lords Member Supports Initiative"
 ukrework_parliament.7.desc:0 "One of the Members of Opposition in the House of Lords has decided to support the government's efforts. Others have followed his lead."
 ukrework_parliament.7.a:0 "Great!"
 
 ukrework_parliament.8.t:0 "The British General Election, [GetMonth] of [GetYear]"
 ukrework_parliament.8.desc:0 "Today the polls have opened and the people are very excited to vote for their Prime Minister. Which party will win?"
 ukrework_parliament.8.a:0 "Labor"
 ukrework_parliament.8.b:0 "Conservative"
 ukrework_parliament.8.c:0 "Liberal"

 ukrework_parliament.9.t:0 "Election Rescheduled due to War"
 ukrework_parliament.9.desc:0 "Due to our war with [GER.getnameDEF], we have decided that now is not a good time to hold an election. We will have to wait until they are defeated."
 ukrework_parliament.9.a:0 "OK"

 ukrework_parliament.10.t:0 "Election Scheduled Soon"
 ukrework_parliament.10.desc:0 "Due to our war with [GER.getnameDEF] ending, we have decided that now is a good time to hold an election. The polls will open in about 2 months."
 ukrework_parliament.10.a:0 "Good"

 ukrework_willkommen.1.t:0 "Welcome to GermanyLuxembourg's UK Rework!"
 ukrework_willkommen.1.desc:0 "First I want to say, thank you for playing my mod! The next thing is, do you want to be allowed to see the secret paths guides?"
 ukrework_willkommen.1.a:0 "I'll figure them out myself!"
 ukrework_willkommen.1.b:0 "May I see the guide?"

 ukrework_utility.1.t:0 "Secret Paths"
 ukrework_utility.1.desc:0 "Want to get the secret paths in the mod but don't know how? Fret not, my friend, for this guide is for you!\n\n§tSEALAND§!\nComplete "The Kings Party", then complete the focus "Construct the Maunsell Forts" while not at war. Soon you will get an event about illegal radios, ignore them. Then when Bates' radio denounces the King, ignore that too. After that, Sealand will be created and eventually Bates' supporters will overthrow the King. A new focus will also unlock, allowing for you to turn Sealand into a casino.\n\n§3Monarchist EU§!\nGet the Bavarian King, and then Restore the Austrian Relam. Once you form the United Empires of Europe while controlling Brussels, a new focus will unlock that will let you form the EU.\n\n§ORoman Empire§!\nGet the Bavarian King, and then if you form the HRE while controlling Rome, a new focus will unlock that will let you form the Roman Empire.\n\n§4German-British Democracy§!\nIn the event chain for Formalize the Kaiserreich, an option will appear to restore democracy. After that, a new focus will unlock.\n\n§RINGSOC§!\nForm the Imperial Federation while being fasicst, do not complete the focus "A European Identity"."
 ukrework_utility.1.a:0 "Thanks!"