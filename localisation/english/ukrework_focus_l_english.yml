l_english:
 ENG_national_government:0 "The National Government"
 ENG_national_government_desc:0 "Several National Governments have been serving since the start of the thirties. Currently, Stanley Baldwin is leading one that consists of the Conservative Party and the supporting Liberal Party."
 ENG_rekindle_german_relations:0 "Rekindle [GER.getadjective] Relations"
 ENG_rekindle_german_relations_desc:0 "Many within the Party, including Prime Minister Mosley himself, antagonize [GER.getnamedef]. The truth is, this viewpoint is untenable. Being at odds with [GER.getnamedef] can only cause problems for us, so it is best that we try to befriend them."
 ENG_london_berlin_axis:0 "Berlin-London Axis"
 ENG_london_berlin_axis_desc:0 "Our goals do not differ much from those of the Germans. Expanding our empire? Uniting our peoples? These ideas are not to foreign to us. Maybe it is in our best interest to form an alliance with our [GER.getadjective] friends."
 ENG_destroy_france:0 "Destroy France"
 ENG_destroy_france_desc:0 "[FRA.getnameDEF] has been a historical enemy of not only us, but the Germans as well. And while they will certainly be no more than a pushover, their continued existence as a "great power" has been nothing more than an embarrassment, and a thorn in our side."
 ENG_secure_scandinavian_resources:0 "Secure Nordic Resources"
 ENG_secure_scandinavian_resources_desc:0 "The Nordic countries are rich in several natural resources. While they currently stand neutral, changes in the world could affect that. Allowing any sort of enemy, especially the Soviets, to control such resources would be detrimental."
 ENG_secure_med:0 "Secure the Mediterranean"
 ENG_secure_med_desc:0 "With [ITA.getnamedef] poised to make an empire that encompasses much of our Mediterranean land, we must seek to take out the threat that they could prove to be, before they strike first!"
 ENG_a_european_identity:0 "A European Identity"
 ENG_a_european_identity_desc:0 "The truth is, the only way we can ever hope for an end to any sort of European conflict is a united Europe. While this has been proposed numerous times, it has never been brought into fruition. Let us change this."
 ENG_britannia_first:0 "Britannia First"
 ENG_britannia_first_desc:0 "For too long we have brought our nation into other foreign entanglements. We must have a new foreign policy, inspired by that of our past. Keep out of continental politics, unless it suits our best interests."
 ENG_remember_tudors:0 "Remember the House of Tudor"
 ENG_remember_tudors_desc:0 "King Henry VIII is probably one of our best known monarchs, but he is known for... less fortunate... reasons. However, he can be remembered for a different reason. Henry had always had a historical claim over France. We shall inherit this claim, and embrace the Tudors as a result."
 ENG_remember_house_of_hanover:0 "Remember the House of Hanover"
 ENG_remember_house_of_hanover_desc:0 "Following Queen Victoria's passing, the House of Hanover's name was changed to the House of House of Saxe-Coburg and Gotha, and later the House of Windsor. We cannot forget our German origins. We shall be known as the House of Hanover again!"
 ENG_reclaim_hanover:0 "Reclaim Hannover"
 ENG_reclaim_hanover_desc:0 "Now's the time: time for us to retake OUR lands... the lands of Hannover, so we can re-establish the days of the electorate."
 ENG_reclaim_france:0 "Reclaim France"
 ENG_reclaim_france_desc:0 "For many centuries, we have seen France as ours, but have never been able to actually take it. But now, France is no longer a formidable foe, they are a weak enemy. France shall finally be ours!"
 ENG_anglo_pact:0 "Anglo Alliance"
 ENG_anglo_pact_desc:0 "It is time for a new bloc to come about - that has [ROOT.getadjective] interests first, and [ROOT.getadjective] interests only."
 ENG_malta_base_of_operations:0 "Malta Base of Operations"
 ENG_malta_base_of_operations_desc:0 "Recent developments in the Med require advancemements of the bases that we have there. Malta is one of these bases, and we must reinforce our military presence there."
 ENG_expand_revolution_to_the_dominions:0 "Expand the Revolution to the Dominions"
 ENG_expand_revolution_to_the_dominions_desc:0 "Maybe we have made the mistake of decolonizing. The Dominions still recognize the monarchy, and don't follow the ways of the Revolution! We need to fix this, and expand the revolution to them."
 ENG_anglo_peoples_union:0 "The Union of Anglo Socialist Republics"
 ENG_anglo_peoples_union_desc:0 "Now that we have united all Anglo peoples of our former Dominions, we should establish a new nation, inspired by the Soviets, the Union of Anglo Socialist Republics!"
 ENG_expand_revolution_to_america:0 "Expand the Revolution to America"
 ENG_expand_revolution_to_america_desc:0 "America. Claimant of the title of "Land of the Free" and the "Home of the Brave". The truth is, they are neither of these things as they have abused their working population for well over a century now and have been cowardly avoiding the ideals of the Revolution. We must fix this, and bring the greatness of communism to America!"
 ENG_expand_revolution_to_ireland:0 "Expand the Revolution to Ireland"
 ENG_expand_revolution_to_ireland_desc:0 "Ireland was once a bastion of Revolution, but ever since they broke away from us, they have embraced the old-fashioned ideals of the bourgeoisie. We will have to bring back the revolutionary spirit to them, by force."
 ENG_north_american_federative_socialist_republic:0 "Consolidate North America"
 ENG_north_american_federative_socialist_republic_desc:0 "Now that we control all Anglo lands on the North American contintent, we must establish a new republic within us - the North American Federative Socialist Republic. It will comprise of the former lands of the United States and Canada, and will have subdivisions of its own."
 ENG_irish_socialist_republic:0 "Consolidate Ireland"
 ENG_irish_socialist_republic_desc:0 "Ireland was once a part of us under the days of the crown, and they can be again. Now, however, they will have a more equal part in our Union!"
 ENG_army_countercoup:0 "Conspiracy in the Armed Forces"
 ENG_army_countercoup_desc:0 "There remains large amount of those in the Army that oppose the communists. And yes, while the monarchy is gone, that hasn't stopped many from wanting to bring glory back to our great nation!"
 ENG_secure_the_government:0 "Secure the Government"
 ENG_secure_the_government_desc:0 "With the communist threat still around, we must secure the government so we can ensure that we can stop them and assure stability in our relam."
 ENG_britannia_for_people:0 "Britannia for the People"
 ENG_britannia_for_people_desc:0 "It is in our best interest to secure the interests of our people. Any sort of absolute, military dictatorship will bring horrendous problems to our country."
 ENG_britannia_for_glory:0 "Britannia for Glory"
 ENG_britannia_for_glory_desc:0 "Foolish ideas of democracy have failed our nation for over a century now. It is time that we return to the past, to restore our glory."
 ENG_the_new_cromwell:0 "The New Cromwell"
 ENG_the_new_cromwell_desc:0 "[ROOT.getnameDEFcap] being under a military dictatorship is nothing new. We should look back to another leader, Oliver Cromwell, Protector of the Commonwealth."
 ENG_reopen_national_elections:0 "Reopen National Elections"
 ENG_reopen_national_elections_desc:0 "It is imperitave that we return democratic systems to our country. Otherwise, we will find ourselves treading down the dangerous path of autocracy, which has plagued so many other nations..."
 ENG_consolidate_the_BAF:0 "United Military Dictatorship"
 ENG_consolidate_the_BAF_desc:0 "While Bernard Montgomery has served us well as our leader, our country would ultimately be better off with a government with representatives from all branches of our military, not just the army."
 ENG_new_monarchy:0 "A New Monarchy"
 ENG_new_monarchy_desc:0 "The people want a return to the monarchy, but we cannot, in good faith, reinstate the Windsors. Therefore, we shall find ourselves a new royal family to lead [ENG.getnameDEF]."
 ENG_crush_the_communists:0 "Crush the Communists"
 ENG_crush_the_communists_desc:0 "Those communist rebels seek to destroy our great nation even more! We must take them out, before they become even more of a threat."
 ENG_recover_ireland:0 "Recover Ireland"
 ENG_recover_ireland_desc:0 "Ireland was once one of the key components of our great Empire for a long time. Recently, they have made the mistake of breaking away from us. While we let them get away with it then, such acts of treason will be punished now."
 ENG_ireland_vote:0 "The Irish Referendum"
 ENG_ireland_vote_desc:0 "Ever since the overthrow of the monarchy and the establishment of a republic, popular support of reunion between us and Ireland has been steadily growing. Many in the government suggest that a referendum for our union would be in our best interest."
 ENG_reestablish_irish_commonwealth:0 "Take Back the Irish Commonwealth"
 ENG_reestablish_irish_commonwealth_desc:0 "The boundaries of the old Protectorate did not disclude the nation of Ireland, which is currently independent. Their existence as an independent nation is a mistake, however. Therefore, we must bring them back into the fold."
 ENG_establish_the_overseas_territories:0 "Establish the Overseas Territories"
 ENG_establish_the_overseas_territories_desc:0 "There are certain smaller lands under our control that feel a lot closer to the crown than fully independent states. It is with that in mind that we establish the Overseas Territories."
 ENG_establishing_new_protectorates:0 "Expanding the Protectorate"
 ENG_establishing_new_protectorates_desc:0 "Our greatness needs not to only stay here, in [ROOT.getnameDEF]. No, we must expand the Protectorate to other nations."
 ENG_new_flag_over_london:0 "A Different Banner Waves"
 ENG_new_flag_over_london_desc:0 "The Union Jack represents a time of recent failures and humiliation for our nation. We must abandon it, for an era of renewed greatness!"
 ENG_the_union_jack_forever:0 "Long Live the Union Jack"
 ENG_the_union_jack_forever_desc:0 "We have maintained peak greatness and power under the Union Jack and British Empire. There is no need to fix something that isn't broken."
 ENG_atlanticism:0 "Atlanticism"
 ENG_atlanticism_desc:0 "It is necessary for us to pursue the policy of Atlanticism, that being that we choose to align ourselves more with our American brothers."
 ENG_embrace_the_special_partnership:0 "Embrace the Special Relationship"
 ENG_embrace_the_special_partnership_desc:0 "Ever since the Great War, there has been an idea of a "Special Relationship" between us and [USA.getnamedef], that being of the many similarities that we have. In times like these it would only make sense that we cement this alliance."
 ENG_europeanism:0 "Europeanism"
 ENG_europeanism_desc:0 "Many within the government suggest that we take the policy of focusing on our European neighbours, rather than the Americans overseas."
 ENG_european_alliance:0 "A European Alliance"
 ENG_european_alliance_desc:0 "The time has come to officialize our position as the leading liberal power in Europe. Therefore, we must ally with the great Democracies of Europe."
 ENG_arctic_security:0 "Arctic Security"
 ENG_arctic_security_desc:0 "Many underestimate the importance of the Arctic lands for our security. In addition, [CAN.getnamedef] offers a valuable position for defense, and they are sandwiched between us and [USA.getnamedef]. All must be put under our defence."
 ENG_the_german_menace:0 "The German Menace"
 ENG_the_german_menace_desc:0 "Time and time again, [GER.getnamedef] has been able to get away with numerous heinous acts. And because of our previous governments turning a blind eye to it, they have gotten away with it. But now, we are prepared to dismantle this terrible aggressor."
 ENG_the_italian_menace:0 "The Italian Menace"
 ENG_the_italian_menace_desc:0 "While it has been proven through several centuries of warfare that [ITA.getnameDEF] is little more than a pushover, their stance as an expansionist state in the Mediterranean poses a problem to peace and security in the region. We will extinguish their aggression quickly."
 ENG_the_japanese_menace:0 "The Japanese Menace"
 ENG_the_japanese_menace_desc:0 "Ever since [JAP.getnamedef] opened up to the world, they have been poised to create an ambitious empire. However, the Japanese seek too commit various atrocities to fufill their ambitions, and we mustn't turn a blind eye to it!"
 ENG_the_soviet_menace:0 "The Soviet Menace"
 ENG_the_soviet_menace_desc:0 "What was once thought to be a joke of a revolution has now turned into an aggressive, evil empire. [SOV.getnamedefcap] has committed various atrocities to spead their evil socialist revolution, and we cannot let it continue! Therefore, we must shoot it down."
 ENG_alliance_of_democacies:0 "An Alliance of Democracies"
 ENG_alliance_of_democacies_desc:0 "Now, more than ever, the democracies of Europe need to unite together to protect from the aggressions of communism and fascism."
 ENG_preparations_for_a_european_union:0 "Preparations for a European Union"
 ENG_preparations_for_a_european_union_desc:0 "Now that we have united Europe under a great democratic alliance, we should unite Europe under one political union as well."
 ENG_destroy_fascism:0 "Destroy Fascism"
 ENG_destroy_fascism_desc:0 "Fascism is a radical, authoritarian, and racist ideology that needs to be purged from existence. Therefore, we must take the stance that no country should ever be intoxicated by it, and remove it from those that are."
 ENG_destroy_communism:0 "Destroy Communism"
 ENG_destroy_communism_desc:0 "Communism is a sickening illness that has struck several nations, even us. Since we have cleansed ourselves from it, we should take the responsibility of clearing other nations from it, too."
 ENG_form_atlantic_union:0 "Dreams of an Atlantic Union"
 ENG_form_atlantic_union_desc:0 "We have so much in common with our brothers "accross the pond", wouldn't it only make sense for us to unite with them?"
 ENG_war_is_coming:0 "War on the Horizon"
 ENG_war_is_coming_desc:0 "There is no doubt that war will eventually come to us, whether we are on the offence for, or defending, democracy. Therefore, we must prepare our industries for war production."
 ENG_orange_pennant:0 "Oranje Boven!"
 ENG_orange_pennant_desc:0 "Today in London, royal guards were seen rasing a Dutch flag with an orange pennant above it. A symbol of the Dutch monarchy, it being raised presents a new era for [ROOT.getnamedef]. While largely a symbolic gesture, many loyal to the old Union Jack have been very angered about it. What will this mean for our future?"
 ENG_reichs_flag:0 "God Save the Kaiser"
 ENG_reichs_flag_desc:0 "A nation almost always defined as a kingdom is no longer. Today, [ROOT.getleader] held a ceremony in London, declaring [ROOT.getleader.GetHerselfHimself] now the Kaiser of what we once knew as [ROOT.getnamedef]. In the ceremony, the German Imperial flag was symbolically raised over London, signifying a new era for our nation."
 ENG_lozenge_flag:0 "Raise the Lozenge Flag"
 ENG_lozenge_flag_desc:0 "Many observe as the Lozenge flag, also known as the Rautenflagge, of Bavaria has been ceremonially risen over London today. It came as a great shock to most, as it was expected that [ROOT.getleader], descendant of the House of Stuart, would stick with the traditions of [ROOT.getnamedef]."
 ENG_reclaim_the_homeland:0 "Reclaim the Homeland"
 ENG_reclaim_the_homeland_desc:0 "It is not possible for us to reclaim our homeland without war. Therefore, a force of arms must be taken, and it shall be taken swiftly!"
 ENG_reclaim_the_homeland_peacefully:0 "Peaceful Reunion"
 ENG_reclaim_the_homeland_peacefully_desc:0 "A war against our own bretheren to retake our lands? Foolish. Instead, let us initiate talks, for a peaceful reunion."
 ENG_bastion_of_european_democracy:0 "The Bastion of Democracy"
 ENG_bastion_of_european_democracy_desc:0 "It's about time that the world sees us as the democratic superpower we are."
 ENG_restore_bavaria:0 "The Alpine Kingdom"
 ENG_restore_bavaria_desc:0 "We have finally reclaimed our homeland, Bavaria. Let us establish a new kingdom, with both the British Isles and Bavaria in mind."
 ENG_restore_netherlands:0 "Lowlands Restoration"
 ENG_restore_netherlands_desc:0 "We have finally reclaimed our homeland, the Netherlands. Let us establish a new kingdom, with both the British Isles and Bavaria in mind."
 ENG_restore_deutschland:0 "Restore the Kaiserreich"
 ENG_restore_deutschland_desc:0 "To truly reform the great Kaiserreich of the past, we must reform the kingdoms that it consisted of. We cannot waste any time doing so."
 ENG_unite_south_germany:0 "Unite South Germany"
 ENG_unite_south_germany_desc:0 "To achieve our goals, we must unite south Germany, at all costs!"
 ENG_royal_marriage_habsburg:0 "Habsburg Royal Marriage"
 ENG_royal_marriage_habsburg_desc:0 "Now that we control many significant locations for the Habsburgs, we must propose our plan of a new empire consisting of Britannia, Bavaria, and the former Austrian lands. A royal marriage shall be arranged so we can have a claim."
 ENG_restore_austria:0 "Restore the Austrian Relam"
 ENG_restore_austria_desc:0 "The time has come for us to restore the lands of the Austrian relam to their rightful owners, and former glory."
 ENG_meet_the_pope:0 "Meeting with the Pope"
 ENG_meet_the_pope_desc:0 "Our great king wants to meet with the Pope. [ROOT.getnamedefcap] has been disconnected from the Catholic Church for centuries as a result of the former Henry VIII, and our current king, who is the first Catholic since, has wanted to reconcile the nation."
 ENG_restore_the_hre:0 "Restore the Holy Roman Empire"
 ENG_restore_the_hre_desc:0 "Napoleon may have doomed it, and the Congress of Vienna killed it off for good, but the Holy Roman Empire shall not be forgotten! No, we shall re-create it, and make it even better!"
 ENG_correct_the_treaty_of_london:0 "Correct the Treaty of London"
 ENG_correct_the_treaty_of_london_desc:0 "The Treaty of London ruined the Netherlands! Now that we, the House of Orange-Nassau, have control over [ROOT.getnamedef] where the treaty was signed, we can officially nullify it and take back our rightful lands!"
 ENG_recognize_the_low_germans:0 "Recognize the Low Germans"
 ENG_recognize_the_low_germans_desc:0 "The Low German minority, which is in the Netherlands and Germany, constitutes a small part of our population. By granting concessions to them in the Dutch part of our kingdom, we can secure their support and would also give us a justification to expand even more. Considering their large population, it may destabilize our country a little."
 ENG_recognize_the_frisians:0 "Recognize the Frisians"
 ENG_recognize_the_frisians_desc:0 "The Frisian minority, which is in the Netherlands and Germany, constitutes a small part of our population. By granting concessions to them in the Dutch part of our kingdom, we can secure their support and would also give us a justification to expand even more."
 ENG_liberate_low_germans:0 "Liberate the Low Germans"
 ENG_liberate_low_germans_desc:0 "The Low Germans have always been a minority in Germany, but under our empire, they will have much better rights. Therefore, we will have to bring them into our fold."
 ENG_liberate_frisia:0 "Liberate the Frisians"
 ENG_liberate_frisia_desc:0 "The Frisians have always been a minority in Germany, but under our empire, they will have much better rights. Therefore, we will have to bring them into our fold."
 ENG_take_back_orange_and_nassau:0 "Retake Orange and Nassau"
 ENG_take_back_orange_and_nassau_desc:0 "The provinces of Orange and Nassau, where our royal house gets its name, are currently under the control of foreign nations. Let's fix that."
 ENG_reclaim_new_amsterdam:0 "Reclaim New Amsterdam"
 ENG_reclaim_new_amsterdam_desc:0 "Great Britain and the Netherlands, both kingdoms in our empire, once had colonies in what today is New York in the [USA.getnamedef]. If we want to restore our glory, we must bring New Amsterdam back into the fold!"
 ENG_free_pennsylvania_dutch:0 "Reunite with the Pennsylvania Dutch"
 ENG_free_pennsylvania_dutch_desc:0 "There resides a large group of Low Germans in Pennsylvania called the Pennsylvania Dutch. Now that the Low Germans are a important represented part of our country, isn't it only right that they can reunite?"
 ENG_formalize_kaiserreich:0 "Formalize the Kaiserreich"
 ENG_formalize_kaiserreich_desc:0 "As everything begins to come together, some questions are left, needing an answer. We'll need to figure these out to ensure our nation is great!"
 ENG_reinstate_democratic_elections:0 "Reinstate Democratic Elections"
 ENG_reinstate_democratic_elections_desc:0 "The time has come. We must bring the power back to the people, by reinstating democratic elections."
 ENG_retake_ost_preussen:0 "Restore Eastern Prussia"
 ENG_retake_ost_preussen_desc:0 "Prussia's eastern lands were unlawfully stolen away from it after the Great War. Now that we have rebuilt since, and are the most dominant power in Europe, we can right this wrong."
 ENG_retake_alsace_lorraine:0 "Restore Alsace-Lorraine to the Relam"
 ENG_retake_alsace_lorraine_desc:0 "Those dastardly French stole Alsace-Loarraine from us after the Great War! We must correct this injustice, by taking it back, by force."
 ENG_schlieffen_but_better:0 "The New Schlieffen Plan"
 ENG_schlieffen_but_better_desc:0 "There is a better way to get to [FRA.getnameDEF], and that is by going around the Maginot, and into the Benelux. Yet unlike the past that resulted in great failure, we shall also incorporate [HOL.getnameDEF] into our plans, allowing for an easier passage."
 ENG_retake_north_schleswig:0 "Retake North Schleswig"
 ENG_retake_north_schleswig_desc:0 "North Schleswig was taken from us in an illegitimate referendum after the Great War. Every day that we do not control it Germans get suppressed, which cannot be allowed. Let us bring what is rightfully ours back to us!"
 ENG_liberate_german_americans:0 "Liberate German Americans"
 ENG_liberate_german_americans_desc:0 "Germans once prospered in [USA.getnameDEF], but this is no longer the case. Since the days of the Great War, they have often been shamed or even persecuted because of their ancestry. We must free them from the self-proclaimed "land of the free", and bring them back home - to the Vaterland."
 ENG_hofbraeuhaus_breweries:0 "Hofbräuhaus Breweries"
 ENG_hofbraeuhaus_breweries_desc:0 "We, in Bavaria, have the talent of making the best beer in the entire world! In München lies the greatest brewery of them all, run by the monarchy. With the opportunity to bring greatness to the whole world, why not open new Hofbräuhaus locations elsewhere?"
 ENG_thirteen_german_colonies:0 "13 German-American Colonies"
 ENG_thirteen_german_colonies_desc:0 "Much of America contains lands with historical German settlements and populations. Now that we control America, we must re-integrate our peoples into our empire!"
 ENG_establish_a_german_american_state:0 "Foundations for a German-American State"
 ENG_establish_a_german_american_state_desc:0 "We know that directly controlling America will never go well. But, establishing a German-American state can give us a sort of control over America, but also a sort of freedom for the people."
 ENG_restore_pax_britannica:0 "Restore Pax Britannica"
 ENG_restore_pax_britannica_desc:0 "There was once a time where we were so powerful, that hardly any nation would challenge us, and we could stay at peace. Since then, this has unfortunately no longer been the case. However, with great effort, we can bring our nation back to our former glory."
 ENG_new_royal_titles:0 "Issue Royal Titles"
 ENG_new_royal_titles_desc:0 "We definitely need to issue new royal titles, this will help us get the monarch's qualified advisors easier."
 ENG_restore_the_dominions:0 "Reclaim the Dominions"
 ENG_restore_the_dominions_desc:0 "The Dominions have certainly committed treason to us by breaking away from us. We will have to take them back now, but this time ensure that they shall never revolt again!"
 ENG_revenge_for_the_tea_party:0 "Revenge for the Boston Tea Party"
 ENG_revenge_for_the_tea_party_desc:0 "The Americans destroyed a great amount of our favourite beverage, tea, during the Boston Tea Party. They then declared an illegal war of independence, ruining the reputation of our empire forever.\nThe scars have yet to heal. We must Make America British Again!"
 ENG_the_crown_jewel:0 "The Crown Jewel"
 ENG_the_crown_jewel_desc:0 "[RAJ.getnamedefcap] was quite possibly our most prized colony (often being called the Crown Jewel), and now it is no longer ours. We should make an effort to bring it back to us, by any means possible!"
 ENG_east_india_company:0 "The East India Company Returns"
 ENG_east_india_company_desc:0 "Clearly the colonial administration didn't work out so well. Maybe it's time to give the East India Company a second try?"
 ENG_greater_british_empire:0 "The Greater British Empire"
 ENG_greater_british_empire_desc:0 "While many once called for a sort of "Imperial Federation", this does not suit our nation properly. Rather, we should declare ourselves to be an even greater Britain, and integrate only the former Anglo imperial lands."
 ENG_imperial_protectorates:0 "New Imperial Protectorates"
 ENG_imperial_protectorates_desc:0 "The establishment of protectorates will help us obtain new allies and ensure the security of our empire."
 ENG_the_real_roman_empire:0 "The Real Roman Empire"
 ENG_the_real_roman_empire_desc:0 "No European power has matched the power that the Roman Empire once had. We must restore it, if we want to become the most powerful nation in the entire world!"
 ENG_a_union_of_european_states:0 "A Union of European States"
 ENG_a_union_of_european_states_desc:0 "Why be so exclusive? We should not be just the union of European empires, but also the union of every European nation!"
 ENG_maunsell_forts:0 "Construct the Maunsell Forts"
 ENG_maunsell_forts_desc:0 "It's true that the enemies of our nation may seek to invade us by sea. If this is the case, then we must be prepared, by constructing fortifications on our south-east coast."
 ENG_expand_chinese_influence:0 "Expand Chinese Influence"
 ENG_expand_chinese_influence_desc:0 "With our successes in the 2 Opium Wars, we have a large presence in China. However, with other powers competing our influence, we must stake our claim!"
 ENG_once_and_for_all:0 "Settle the Fight"
 ENG_once_and_for_all_desc:0 "It is now or never. We must crush the silly French, to end our dispute, once and for all!"
 ENG_fate_of_the_lands:0 "Fate of the Countries"
 ENG_fate_of_the_lands_desc:0 "Since the establishment of the new monarchy, many have questioned the fate of the countries that comprise of the United Kingdom. Let us resolve this problem now."
 ENG_puppet_monarch:0 "Puppet Monarch"
 ENG_puppet_monarch_desc:0 "Reinstating the old Windsor monarchy, now in Canada, will help give the people back a sense of national pride that they currently don't have."
 ENG_figurehead_presidency:0 "Figurehead Presidency"
 ENG_figurehead_presidency_desc:0 "To give people a false sense of a sort of democracy, we must install a figurehead president, which can also increase our national unity."
 ENG_conscription_increase:0 "Increase the Draft"
 ENG_conscription_increase_desc:0 "To ensure that our professional army always has a strong fighting force, we must increase our draft, to allow more young men to enter the military."
 ENG_military_school:0 "New Military Schools"
 ENG_military_school_desc:0 "A massive expansion of our military must also come with new military schools. That is, if we want well trained soldiers."
 ENG_invite_exiled_scientists:0 "Invite Exiled Scientists"
 ENG_invite_exiled_scientists_desc:0 "If we want to be ahead in the research game, than we must accept the scientists that were rejected in other countries."
 ENG_topple_the_empires:0 "Topple the Empires"
 ENG_topple_the_empires_desc:0 "Foolish ideas of empires cannot be allowed. We must topple them, and bring the military revolution to them."
 ENG_military_prescence:0 "Military with a State"
 ENG_military_prescence_desc:0 "Any resemblance of a civilian government is foolish. We should seek to become a military with a state, just like the Prussians, instead."
 ENG_limited_reforms:0 "Limited Reform"
 ENG_limited_reforms_desc:0 "To prevent another revolution, we must implement new reforms for a limited time."
 ENG_work_with_the_tuc:0 "Work with the TUC"
 ENG_work_with_the_tuc_desc:0 "Getting the support of the TUC, the largest trade union in the entire country, on our side will ensure the popularity of our government, as long as we make a few concessions."
 ENG_destroy_trade_unions:0 "Crush the Trade Unions"
 ENG_destroy_trade_unions_desc:0 "There is no way we can continue to allow these terrible, communist trade unions to ruin our economy! We must crush them, at once!"
 ENG_join_the_axis:0 "Join the Axis"
 ENG_join_the_axis_desc:0 "Like the Germans, we are a military-state. Maybe it's time to join them."
 ENG_join_the_comintern:0 "Join the Comintern"
 ENG_join_the_comintern_desc:0 "Like the Soviets, we want to spread the revolution. Maybe it's time to join them."
 ENG_the_commonwealth_alliance:0 "Commonwealth Alliance"
 ENG_the_commonwealth_alliance_desc:0 "Our position in this world is very unique. Perhaps we should set up our own sphere?"
 ENG_appoint_pro_soviet_govt:0 "Appoint Pro-Soviet Government"
 ENG_appoint_pro_soviet_govt_desc:0 "To keep ourselves more in line with our allies, we should implement a socialist government."
 ENG_appoint_pro_axis_govt:0 "Appoint Pro-Axis Government"
 ENG_appoint_pro_axis_govt_desc:0 "To keep ourselves more in line with our allies, we should implement a fascist government."
 ENG_unite_the_anglos:0 "Unite the Anglos"
 ENG_unite_the_anglos_desc:0 "We should spread the Protectorate to our Anglo brothers, too. It is only right."
 ENG_destroy_european_empires:0 "Destroy European Empires"
 ENG_destroy_european_empires_desc:0 "Many European empires, in many cases with monarchs, have colonies where the locals are oppressed and pillaged. We cannot allow this!"
 ENG_commonwealth_of_europe_form:0 "The Commonwealth of Europe"
 ENG_commonwealth_of_europe_form_desc:0 "We must start a new nation: a United Europe, ruled by the Protectorate. This way, war shall never grace Europe ever again!"
 ENG_commonwealth_of_nations_form:0 "The Ultimate Commonwealth"
 ENG_commonwealth_of_nations_form_desc:0 "It's time to form a unified state between all Anglo peoples, under the Protectorate."
 ENG_independent_air_effort:0 "Independent Research Efforts"
 ENG_independent_air_effort_desc:0 "Rather than asking other nations for assistance in our research efforts, we shall make our own investments."
 ENG_independent_nuclear_effort:0 "Nuclear Effort"
 ENG_independent_nuclear_effort_desc:0 "Our scientists have theorized that so-called "atomic bombs" could bring major devastation to our enemies. Perhapsm we should invest into this."
 ENG_industrial_legacy:0 "Industrial Legacy"
 ENG_industrial_legacy_desc:0 "Our nation has had a long history with industry, as we were the birthplace of the Steam Engine. Let us keep our industrial efforts going." 
 ENG_the_railway_industry:0 "The Railway Industry"
 ENG_the_railway_industry_desc:0 "Just like industry as a whole, we are the creator of railways. Perhaps it's time to look back on our transportation."
 ENG_inspiration_from_autobahn:0 "Take Inspiration from the Reichsautobahn"
 ENG_inspiration_from_autobahn_desc:0 "We shall send a team of officials from the transportation department to see how the Germans construct their highway system, the Reichsutobahn. This should help us significantly with our infrastructure efforts."
 ENG_increased_infrastructure:0 "Improve Infrastructure"
 ENG_increased_infrastructure_desc:0 "Improving the infrastructure spending in our less developed lands will not only keep them up to speed with our other lands, but also create new jobs for the unemployed."
 ENG_automobile_investment:0 "Invest in the Automobile Industry"
 ENG_automobile_investment_desc:0 "We should invest in the Midlands and South-East automobile industry, as this will create new jobs and grow our economy."
 ENG_encourage_urban_growth:0 "Encourage Urban Growth"
 ENG_encourage_urban_growth_desc:0 "Encouraging urban growth will allow for easier industrial planning, and can create more industry towns."
 ENG_sterling_area:0 "The Sterling Area"
 ENG_sterling_area_desc:0 "The Sterling Area is a group of countries that have their currency tied to the British Pound Sterling. We should ensure the members' confidence in that."
 ENG_new_roads:0 "New Roads"
 ENG_new_roads_desc:0 "We should construct new roads to help connect areas of our country that are rather disconnected."
 ENG_motorways:0 "Motorways"
 ENG_motorways_desc:0 "We shall create a new system of roads, that shall connect cities from all parts of the country: Motorways."
 ENG_casino_haven:0 "Fort Roughs Casino"
 ENG_casino_haven_desc:0 "Paddy Roy Bates has suggested that we should construct a casino on Fort Roughs, to bring in some extra income. Some people may get addicted, however."
 ENG_second_great_war:0 "The Second Great War"
 ENG_second_great_war_desc:0 "Our former policy of appeasement has done no good, and has failed. Was war inevitable?"
 ENG_save_norway:0 "Save Norway"
 ENG_save_norway_desc:0 "The Germans clearly have the objective of securing [NOR.getnamedef] for their ore, and for easy passage of [SWE.getadjective] ore. We must save them, to help stop the [GER.getadjective] War Machine from expanding even more!"
 ENG_secure_norway:0 "Secure Norway"
 ENG_secure_norway_desc:0 "[NOR.getnamedefcap]'s continous ignorance towards the [GER.getadjective] threat has been rather concerning. With their easy access to [SWE.getadjective] ore, and having some themselves, we must ensure they do not reside in the wrong hands."
 ENG_secure_sweden:0 "Secure Sweden"
 ENG_secure_sweden_desc:0 "[SWE.getnamedefcap] has huge deposits of ore in the north. With the Germans contininuing to have access to it, we must invade [SWE.getnamedef] to secure their natural resources before the Germans can lay a finger!"
 ENG_finnish_problem:0 "The Finnish Problem"
 ENG_finnish_problem_desc:0 "The Finnish have blatant ties to the [GER.getadjective] menace. Their current government can not be allowed to continue under these circumstances."
 ENG_pre_empt_italy:0 "Pre-Empt Italy"
 ENG_pre_empt_italy_desc:0 "[ITA.getnamedefcap]'s position as a "reliable" [GER.getadjective] ally are no doubt non-compatible with our security in the Mediterranean. If we catch them by suprise now, their capabilities to fight us will be more limited."
 ENG_workers_revolution:0 "Organize a Nationwide Strike"
 ENG_workers_revolution_desc:0 "It is clear that the current government has no intentions of bringing the power to the workers. Therefore, we must start a nationwide strike, to show them what the true power of the hammer and sickle are."
 ENG_operation_compass:0 "Operation Compass"
 ENG_operation_compass_desc:0 "We must seek to breach through North Africa, so we can secure an assault towards [ITA.getnamedef]."
 ENG_operation_torch:0 "Operation Torch"
 ENG_operation_torch_desc:0 "We must seek to take all of North Africa to allow for an easy access into [ITA.getnamedef]."
 ENG_operation_husky:0 "Operation Husky"
 ENG_operation_husky_desc:0 "With the Axis powers distracted, we can make our re-entrance into Europe by landing in southern Italy."
 ENG_operation_overlord:0 "Operation Overlord"
 ENG_operation_overlord_desc:0 "We must now seek out to complete the grandest operation ever - the liberation of Europe. Through overseas invasions into Normandy, we can accomplish this."
 ENG_operation_dragoon:0 "Operation Dragoon"
 ENG_operation_dragoon_desc:0 "We must land in southern France, to surround the Germans."
 ENG_operation_market_garden:0 "Operation Market Garden"
 ENG_operation_market_garden_desc:0 "We must create a route of invasion into Germany proper, which we can accomplish with special air and armored forces operations in the Netherlands."
 ENG_race_for_berlin:0 "Race for Berlin"
 ENG_race_for_berlin_desc:0 "We must reach Berlin before those [SOV.getadjective] fools do!"
 ENG_end_of_ww2:0 "Peace at Last"
 ENG_end_of_ww2_desc:0 "After a long and brutal war, we must focus on securing democracy on the European continent and containing the [RUS.getadjective] menace!"
 ENG_war_cabinet:0 "War Cabinet"
 ENG_war_cabinet_desc:0 "We must have a war cabinet that consists of the Conservative, Liberal, and Labour parties to unite the people in the face of the [GER.GetAdjective] enemy."
 ENG_propose_fra_bri_union:0 "Campaign for Franco-British Unity"
 ENG_propose_fra_bri_union_desc:0 "Times of crisis like these call for unity like never before. A surrender by the [FRA.getadjective] is imminent, so we should take the chance to fully unify with them to protect democracy in the future."
 ENG_island_hopping_campaigns:0 "Island Hopping Campaigns"
 ENG_island_hopping_campaigns_desc:0 "The only way to subdue the [JAP.getadjective] menace may be by invading each of their islands, as difficult as it may be."
 ENG_romanticize_imperialism:0 "Romanticize Imperialism"
 ENG_romanticize_imperialism_desc:0 "Many do not realize how great imperialism is. We must re-instill the ideas of it in our populace to help bring back Pax Britannica!"
 ENG_global_hegemony:0 "Global Hegemony"
 ENG_global_hegemony_desc:0 "We must not let the world forget that we are the most powerful nation. Since other powers are now trying to change that, we must re-assert our position!"
 ENG_extinguish_the_communist_threat:0 "Extinguish the Communist Threat"
 ENG_extinguish_the_communist_threat_desc:0 "The dammed communists continue to threaten the security of our empire, so we must seek to restore democracy to them to ensure continued peace."
 ENG_asian_intervention:0 "Asian Intervention"
 ENG_asian_intervention_desc:0 "There are certain Asian nations that seek to threaten peace in the region. We will have to strike first before they attack us, too."
 ENG_ulster_for_alliance:0 "Ulster for Alliance"
 ENG_ulster_for_alliance_desc:0 "To secure the British Isles, we must bring [IRE.getnamedef] into our alliance, even if that means giving up some land to them."
 ENG_protect_ireland:0 "British Isles Security"
 ENG_protect_ireland_desc:0 "[IRE.getnamedefcap]'s continued existence as an independent state is very threatening as it may allow foreign enemies into the isles! We must forcefully take them back, to prevent that from happening."
 ENG_war_propoganda_films:0 "[USA.getadjective] War Propaganda Films"
 ENG_war_propoganda_films_desc:0 "[USA.getadjective] film companies are some of the best in the world, by hiring them we can have them make us extremely useful propaganda, as the [USA.getadjective] government already does."
 ENG_appeasement_forever:0 "Take Appeasement to the Extreme"
 ENG_appeasement_forever_desc:0 "Some ministers in our government, notably a certain Neville Chamberlain, call for the continuation of appeasement. In addition, the scars of the Great War remain in many people's heads. With this in mind, we should continue appeasement forever to keep our populace out of any wars."
 ENG_true_neutality:0 "Colonial Appeasement"
 ENG_true_neutality_desc:0 "It is clear that [JAP.getnamedef] has its eyes on our colonies. We must remove our connections to them, to avoid war!"
 ENG_fortify_the_empire_desperate:0 "Desperate Fortifications"
 ENG_fortify_the_empire_desperate_desc:0 "It is clear that foreign powers are out to get us. We must construct fortifications, immediately!"
 ENG_back_into_action:0 "Back Into Action"
 ENG_back_into_action_desc:0 "The failures of appeasement were once pretty visible, but they are now obvious. With the safety of our nation on the line, we must get back into action - whatever the cost may be!"
 ENG_democracys_last_stand:0 "The Final Stand of Democracy"
 ENG_democracys_last_stand_desc:0 "We are the final stand of democracy. The fate of the entire world depends on us."
 ENG_beg_for_usa_alliance:0 "[USA.getadjective] Overtures"
 ENG_beg_for_usa_alliance_desc:0 "In our great fight against fascism, we need allies. [FRA.getnamedefcap] alone will simply not be enough, so we must look across the pond."
 ENG_union_of_fascists:0 "Convene the BUF"
 ENG_union_of_fascists_desc:0 "The future of the Party also happens to be the future of our nation. Therefore, we must finalize our policies."
 ENG_reclaim_the_empire:0 "Reclaim the Empire"
 ENG_reclaim_the_empire_desc:0 "The British State has been on a constant state of decline as we have lost many key components of the empire since it was founded. With a nationalist government in place, our objective should be to restore these lands back to the Crown!"
 ENG_imperial_security:0 "Imperial Security"
 ENG_imperial_security_desc:0 "The defence of our empire is of the upmost importance, even if that means going to war to ensure it."
 ENG_end_the_great_game:0 "End the Great Game"
 ENG_end_the_great_game_desc:0 "The purpose of [AFG.getnamedef] was to be a buffer state between our Empire, and the Russians'. However, now that we are at war with them, we should bring [AFG.getnamedef] under our "influence"."
 ENG_secure_oil:0 "Secure the Middle Eastern Oil"
 ENG_secure_oil_desc:0 "Oil is found quite a lot in the Middle East, and any enemy controlling it would be a major problem! Therefore, we must secure it for our war machine."
 ENG_claim_siam:0 "Absorb [SIA.getnamedef]"
 ENG_claim_siam_desc:0 "[SIA.getnamedefcap]'s existence cannot be allowed to continue, as it should be a part of our empire!"
 ENG_form_oceania:0 "Oceania"
 ENG_form_oceania_desc:0 "§RREDACTED§!"
 ENG_re_ally_with_spain:0 "Reform the Spanish Alliance"
 ENG_re_ally_with_spain_desc:0 "Long ago, we once had an alliance with Spain under the Tudors. It eventually fell, but we can bring it back!"
 ENG_papal_reconciliation:0 "Papal Reconciliation"
 ENG_papal_reconciliation_desc:0 "Henry VIII made enemies with the Catholic Church due to his divorces, but we should look back to what he was before: a Catholic loyalist. We should meet with the Pope, to bring back those good old days."
 ENG_papal_revenge:0 "Revenge for Excommunication"
 ENG_papal_revenge_desc:0 "The Pope challenged the Kingdom of England half a millenium ago by excommunicating it. We shall avenge it, by taking Rome!"
 ENG_henrys_revenge:0 "Revive the Glory of Henry VIII"
 ENG_henrys_revenge_desc:0 "We have finally gotten revenge on those who have wronged the great Henry VIII."
 ENG_only_one_rome:0 "One Rome"
 ENG_only_one_rome_desc:0 "Many states have proclaimed themselves to be the successor to the Roman Empire. Let us keep this under control, by taking control of all claimants ourselves!"
 ENG_re_ally_with_russia:0 "Rekindle the Russian Alliance"
 ENG_re_ally_with_russia_desc:0 "Under the House of Hanover, we were good friends with the Russians. We should seek to bring that friendship back."
 ENG_the_historical_enemy:0 "The Historical Enemy"
 ENG_the_historical_enemy_desc:0 "[FRA.getnamedefcap] has been our prime nemesis for a long time. With their weakened state, now may be the best time to strike!"
 ENG_form_the_hre_hanover:0 "Restore the Holy Roman Empire"
 ENG_form_the_hre_hanover_desc:0 "With Hannover under our control, we should bring up the question of reforming the Holy Roman Empire, as Hanover was once a part of it."
 ENG_new_german_confederation:0 "New German Confederation"
 ENG_new_german_confederation_desc:0 "We should establish a new German Confederation, to consolidate our holdings in Germany."
 ENG_danube_dominance:0 "Danube Dominance"
 ENG_danube_dominance_desc:0 "In order to secure our hegemony over Central Europe, we must conquer its most important river, that being the Rhine River."
 ENG_battle_for_bosporus:0 "Battle for the Bosporus"
 ENG_battle_for_bosporus_desc:0 "Due to its vital stategic importance, we must secure the Bosporus, even if it means war!"
 ENG_africa_shall_be_ours:0 "London Conference"
 ENG_africa_shall_be_ours_desc:0 "We shall hold a conference to decide the future borders of Africa, because the Berlin Conference is completely outdated these days."
 ENG_look_to_the_continent:0 "Look to the Continent"
 ENG_look_to_the_continent_desc:0 "With tensions at an all-time high on the continent, we need to consider our options there."
 ENG_domestic_policy:0 "Domestic Policy"
 ENG_domestic_policy_desc:0 "Mosley has some great ideas that could help improve the British state. We should take time to implement them."
 ENG_take_care_of_spain:0 "Neutralize Spain"
 ENG_take_care_of_spain_desc:0 "It's clear that Spain is very unstable, with its civil war over we should now seek to install a friendly government to ensure that their instabilty doesn't effect us."
 ENG_gateway_to_the_continent:0 "Gateway to the Continent"
 ENG_gateway_to_the_continent_desc:0 "Currently, we don't have any parts of our empire on the continent. However, we could change that, and make an easy gateway to expand our influence by taking over the Benelux."
 ENG_green_shirts_alliance:0 "Deal with the Green Shirts"
 ENG_green_shirts_alliance_desc:0 "The Green Shirts are a quite eccentric society. But, they are a large paramilitary organization, could working with them bear fruits?"
 ENG_corporate_state:0 "A Corporatist State"
 ENG_corporate_state_desc:0 "Collaboration with the largest of companies will wield the greatest results for our nation."
 ENG_militarized_youth:0 "Militarized Youth"
 ENG_militarized_youth_desc:0 "Creating fanatics of the younger generation will allow for the strengthening of the state and military."
 ENG_look_back_to_the_past:0 "Look Back to the Past"
 ENG_look_back_to_the_past_desc:0 "As we have our return to an absolute monarchy, the nation should look even further back to the past, and look back to what created England as we know it today."
 ENG_look_to_the_anglo_saxons:0 "Look Back to the Anglo-Saxons"
 ENG_look_to_the_anglo_saxons_desc:0 "The Anglo-Saxons were the one of the original populations of England, we should look back to them to guide our nation!"
 ENG_look_to_the_vikings:0 "Look Back to the Vikings"
 ENG_look_to_the_vikings_desc:0 "Ultimately, it was the Vikings that conquered England and united it, perhaps it is best we look back to them."
 ENG_weapons_of_conquest:0 "Weapons of Conquest"
 ENG_weapons_of_conquest_desc:0 "We must create the industrial capacity necessary to produce the weapons needed to take back our rightful lands!"
 ENG_dreams_of_a_north_sea_empire:0 "Dreams of a North Sea Empire"
 ENG_dreams_of_a_north_sea_empire_desc:0 "The once great North Sea Empire controlled what is now England, Denmark, and Norway. With Viking ideals being embraced, and our nation strong, perhaps it's time to fix what's wrong and restore it!"
 ENG_operation_north_strike:0 "Operation North Strike"
 ENG_operation_north_strike_desc:0 "With the current [DEN.getadjective] and [NOR.getadjective] states rather weak, we must seize the opportunity to unite the former main lands of the Vikings!"
 ENG_retake_sweden:0 "Memories of a Scandinavian Union"
 ENG_retake_sweden_desc:0 "At one point, the Nordic countries were all united in a Scandinavian Union. [SWE.getnamedef] should be reminded of what such a united state looks like."
 ENG_an_empire_of_the_north:0 "An Empire of the North"
 ENG_an_empire_of_the_north_desc:0 "Our proclamation of the North Sea Empire has brought even greater ambitions. What if we united all of northern Europe?"
 ENG_restore_rule_of_normandy:0 "Reclaim Normandy"
 ENG_restore_rule_of_normandy_desc:0 "Normandy is our rightful land! Once home to the old Normans, the conquerors and uniters of England, it is only right that we take it back from those dastardly French!"
 ENG_reconquer_finland:0 "Finland is Scandinavian!"
 ENG_reconquer_finland_desc:0 "[FIN.getnamedef] stands on the principles of its independence, after being controlled by both the Russians and Swedes for quite some time. But the truth is obvious - Finland is a rightful Scandinavian land!"
 ENG_russian_revenge:0 "Take Revenge Against Russia"
 ENG_russian_revenge_desc:0 "Russia may have humiliated the Scandinavian state of [SWE.getnamedef] during the Great Northern War, but they are very weak these days. Perhaps now is the time to show the Russians their place!"
 ENG_destroy_the_baltics:0 "Conquer the Baltic States"
 ENG_destroy_the_baltics_desc:0 "The Baltic States have all once had some sort of involvement in a Scandinavian empire - now is the time that we return them to their rightful owners."
 ENG_dreams_of_a_west_germanic_state:0 "Dreams of a West-Germanic State"
 ENG_dreams_of_a_west_germanic_state_desc:0 "Our Anglo-Saxon roots stem from the continent, in what is now West-Germanic states. We should seek to re-unify these lands!"
 ENG_the_low_countries_germanic:0 "The Germanic Peoples of the Dutch Relam"
 ENG_the_low_countries_germanic_desc:0 "We must seek to unite the people of the former Dutch relam into our nation, by any means possible."
 ENG_north_germany_germanic:0 "The Germanic Peoples of the North German Relam"
 ENG_north_germany_germanic_desc:0 "We must seek to unite the people of the former North German relam into our nation, by any means possible."
 ENG_south_germany_germanic:0 "The Germanic Peoples of the South German Relam"
 ENG_south_germany_germanic_desc:0 "We must seek to unite the people of the former South German relam into our nation, by any means possible."
 ENG_blitz_the_benelux:0 "Crush the Benelux"
 ENG_blitz_the_benelux_desc:0 "The people of the Benelux nations have their rightful spot in our federation, but they currently reside in illegitimate governments. Let us fix this."
 ENG_annex_the_german_state:0 "Annex the German State"
 ENG_annex_the_german_state_desc:0 "[GER.getnamedefcap] made a good effort of unifying all of Germany, but they failed to unite all of West-Germania. This is a problem that we can solve."
 ENG_annex_the_south_german_states:0 "Conquer the Southern German Nations"
 ENG_annex_the_south_german_states_desc:0 "[AUS.getnamedefcap] and [SWI.getnamedef] cite the necessity of their neutrality, but we all know that this is a sad excuse to prevent themselves from entering a Germanic state. We shall fix this."

 ENG_steady_as_she_goes_shortcut:0 "Protect Democracy"
 ENG_industrial_legacy_shortcut:0 "Economic Improvement"
 limited_rearmament_focus_shortcut:0 "Mobilize the Nation"
 uk_empire_focus_shortcut:0 "Where the Sun Never Sets"
 ENG_revisit_colonial_policy_shortcut:0 "The Sun Sets"
 ENG_the_kings_party_shortcut:0 "Turn Back the Clock"
 ENG_organize_the_blackshirts_shortcut:0 "Rise of the Blackshirts"
 ENG_eliminate_the_upper_class_shortcut:0 "Workers, Rise!"
 ENG_army_countercoup_shortcut:0 "A New British State Rises"