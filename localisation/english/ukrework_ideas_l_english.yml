l_english:
 ENG_gas_masks_idea:0 "Gas Masks"
 ENG_gas_masks_idea_desc:0 "We have issued gas masks to keep our civilians safe on the home front of the war."
 ENG_european_identity_idea:0 "European Identity"
 ENG_european_identity_idea_desc:0 "We have a new policy. We should not see ourselves as British, but instead European."
 ENG_house_of_hanover_idea:0 "Remembering the House of Hanover"
 ENG_house_of_hanover_idea_desc:0 "The German past has been embraced. Long shall the days of Haus Hannover be remembered!"
 ENG_house_of_tudor_idea:0 "Remembering the House of Tudor"
 ENG_house_of_tudor_idea_desc:0 "We have embraced the old days of the House of Tudor, we must have France!"
 ENG_socialist_opposition_idea:0 "Communist Opposition"
 ENG_socialist_opposition_idea_desc:0 "We may have secured our country, but the Red threat still lingers. The damned commies will stop at nothing to oppose us, so we must stop them!"
 ENG_socialists_call_for_strikes_idea:0 "General Strike"
 ENG_socialists_call_for_strikes_idea_desc:0 "Socialist leaders have called for a strike, bringing our country's economy to a screeching halt."
 ENG_uncertain_future_idea:0 "Uncertain Future"
 ENG_uncertain_future_idea_desc:0 "The military government has its lips sealed on what they plan to do, and many are concerned as a result..."\
 ENG_glory_britannia_idea:0 "Britannia for Glory"
 ENG_glory_britannia_idea_desc:0 "Foolish ideas of democracy have failed our nation for over a century now. It is time that we return to the past, to restore our glory."
 ENG_peoples_britannia_idea:0 "Britannia for the People"
 ENG_peoples_britannia_idea_desc:0 "It is in our best interest to secure the interests of our people. Any sort of absolute, military dictatorship will bring horrendous problems to our country."
 ENG_conservative_party_in_power_idea:0 "Conservative Party in Power"
 ENG_liberal_party_in_power_idea:0 "Liberal Party in Power"
 ENG_labor_party_in_power_idea:0 "Labor Party in Power"
 ENG_protectorate_idea:0 "Protectorate of [FROM.GetNonIdeologyNameDEF]"
 ENG_protectorate_idea_desc:0 "We are a protectorate of [ENG.getnameDEF], making us a more military-aligned state."
 ENG_integration_idea:0 "Integration into [ENG.getnameDEF]"
 ENG_integration_idea_desc:0 "We have agreed to integrate ourselves with [ENG.getnameDEF], for the betterment of all of our peoples."
 ENG_bastion_of_democracy_idea:0 "The Bastion of Democracy"
 ENG_bastion_of_democracy_idea_desc:0 "We must show the world how much of a free country we, [ENG.getnamedef] are!"
 ENG_reclaim_the_habsburg_empire_idea:0 "Reclaim the Habsburg Empire"
 ENG_reclaim_the_habsburg_empire_idea_desc:0 "We must reclaim the old Habsburg Empire to bring greatness to our nation."
 ENG_pan_germanicism_idea:0 "Pan-Germanicism"
 ENG_pan_germanicism_idea_desc:0 "With the idea of such a grand nation that consists of both the relams of the Anglo-Saxons and the Germans, we must embrace the idea of Pan-Germanicism to unite our peoples."
 ENG_frisian_minority_embraced_idea:0 "Frisian Minority Embraced"
 ENG_frisian_minority_embraced_idea_desc:0 "The Frisian minority, which is in the Netherlands and Germany, constitutes a small part of our population. By granting concessions to them in the Dutch part of our kingdom, we can secure their support and would also give us a justification to expand even more."
 ENG_north_german_minority_embraced_idea:0 "Low German Minority Embraced"
 ENG_north_german_minority_embraced_idea_desc:0 "The Low German minority, which is in the Netherlands and Germany, constitutes a small part of our population. By granting concessions to them in the Dutch part of our kingdom, we can secure their support and would also give us a justification to expand even more. Considering their large population, it may destabilize our country a little."
 ENG_kingdoms_rights_idea:0 "Federal Kaiserreich"
 ENG_kingdoms_rights_idea_desc:0 "The rights of each kingdom is of the upmost importance to us! Therefore, we must ensure that our kaiserreich is federal."
 ENG_big_govt_idea:0 "Unitary Kaiserreich"
 ENG_big_govt_idea_desc:0 "We cannot repeat the same mistakes that the old Kaiserreich did! Therefore, we must create a unitary Kaiserreich."
 ENG_absolutism_german_idea:0 "Prussian Absolutism"
 ENG_absolutism_german_idea_desc:0 "For a strong nation, we need a strong government. Giving significantly more power to the Kaiser will allow for this."
 ENG_constitutionalism_german_idea:0 "Prussian Democracy"
 ENG_constitutionalism_german_idea_desc:0 "For the ideas of absolutism and full democracy are corrupt, we must find a compromise, in the policies of Prussian Democracy."
 ENG_return_to_democracy_idea:0 "Return to Democracy"
 ENG_return_to_democracy_idea_desc:0 "We must restore democracy and return power back to where it rightfully belongs: the people."
 ENG_return_to_pax_britannica_idea:0 "Return to Pax Britannica"
 ENG_return_to_pax_britannica_idea_desc:0 "There was once a time where we were so powerful, that hardly any nation would challenge us, and we could stay at peace. Since then, this has unfortunately no longer been the case. However, with great effort, we can bring our nation back to our former glory."
 ENG_new_titles_idea:0 "New Royal Titles"
 ENG_new_titles_idea_desc:0 "By establishing new royal titles, it will ease the process for us to get advisors for our monarch."
 ENG_devolution:0 "Devolution"
 ENG_devolution_desc:0 "By giving each kingdom in our United Kingdom its own rights, we can ensure the continued unity of our nation."
 ENG_one_crown_many_monarchs:0 "One Crown, Many Monarchs"
 ENG_one_crown_many_monarchs_desc:0 "We have decided that appointing princes and princesses of our royal family to Kings and Queens of the many kingdoms is the best idea for the continued unity of our nation."
 ENG_many_crowns_one_nation:0 "One Nation, Many Crowns"
 ENG_many_crowns_one_nation_desc:0 "We have decided that appointing princes and princesses of local royal families to Kings and Queens of the many kingdoms is the best idea for the continued unity of our nation."
 ENG_puppet_president:0 "Figurehead President"
 ENG_puppet_president_desc:0 "To give people a false sense of a sort of democracy, we must install a figurehead president, which can also increase our national unity."
 ENG_expand_conscription_budget:0 "Expanded Conscription"
 ENG_expand_conscription_budget_desc:0 "While costly, expanding our conscruption can ensure that there will always be enough manpower for the military."
 ENG_military_school_idea:0 "Military Schools"
 ENG_military_school_idea_desc:0 "An expansion of the military also requires an expansion of military schools. If we want great soldiers, they must be properly taught."
 ENG_exiled_scientists_idea:0 "Home of Exiled Scientists"
 ENG_exiled_scientists_idea_desc:0 "Our nation hosts revolutionary scientists from not-so-free countries. Unfortunately many of them bring their radical ideas with them."
 ENG_topple_the_empires_idea:0 "Topple the Empires"
 ENG_topple_the_empires_idea_desc:0 "Foolish ideas of empires cannot be allowed. We must topple them, and bring the military revolution to them."
 ENG_military_with_a_state_idea:0 "Military with a State"
 ENG_military_with_a_state_idea_desc:0 "Just like the Prussians, we should model ourselves as a military with a state."
 ENG_limited_reforms_idea:0 "Limited Reforms"
 ENG_limited_reforms_idea_desc:0 "To appease the people, we should implement limited reforms."
 ENG_work_with_the_tuc_idea:0 "Work with the Trade Unions Congress"
 ENG_work_with_the_tuc_idea_desc:0 "Getting the support of the TUC, the largest trade union in the entire country, on our side will ensure the popularity of our government, as long as we make a few concessions."
 ENG_crush_trade_unions_idea:0 "Crush the Trade Unions"
 ENG_crush_trade_unions_idea_desc:0 "There is no way we can continue to allow these terrible, communist trade unions to ruin our economy! We must crush them, at once!"
 ENG_factory_act_idea:0 "Factory Act"
 ENG_factory_act_idea_desc:0 "The Factory Act improves working conditions, especially for women and children."
 ENG_emergency_powers_act_idea:0 "Emergency Powers Act"
 ENG_emergency_powers_act_idea_desc:0 "In times of crisis, we must consolidate power to ensure our nation is safe and can continue functioning."
 UK_national_service_act_idea:0 "National Service Act"
 UK_national_service_act_idea_desc:0 "We must expand our military conscription, to help with the war effort."
 UK_education_act_idea:0 "Education Act"
 UK_education_act_idea_desc:0 "While it may be costly, we must reform our schools, as it will allow for a smarter populace in the long run."
 UK_nhs_act_idea:0 "National Healthcare Service"
 UK_nhs_act_idea_desc:0 "The National Healthcare Service will allow for free healthcare for all, but it will definitely be a costly endeavor."
 ENG_great_western_railway:0 "Great Western Railway"
 UK_inspiration_from_autobahn_idea:0 "Reichsautobahn Inspiration"
 UK_inspiration_from_autobahn_idea_desc:0 "We have sent officials over to [GER.getnameDEF] to see how their Reichsautobahn is constructed. This will help us improve our own infrastructure."
 UK_lingering_great_depression_idea:0 "The Lingering Great Depression"
 UK_lingering_great_depression_idea_desc:0 "The Great Depression is still around, but thankfully it's almost gone. Only a few small reforms and it can be a thing of the past."
 UK_lingering_great_depression_less_idea:0 "The Lingering Great Depression"
 UK_lingering_great_depression_less_idea_desc:0 "The Great Depression is still around, but thankfully it's almost gone. Only a few small reforms and it can be a thing of the past."
 UK_urbanization_idea:0 "Urbanization Efforts"
 UK_urbanization_idea_desc:0 "Urbanizing our country will allow for easier industrial planning, and can create new industry towns."
 UK_sterling_area_idea:0 "Member of the Sterling Area"
 UK_sterling_area_idea_desc:0 "This country is a member of the Sterling Area, a group of countries that have their currency tied to the British Pound Sterling."
 UK_motorways_idea:0 "Motorways"
 UK_motorways_idea_desc:0 "We shall create a new system of roads, that shall connect cities from all parts of the country: Motorways."
 UK_casino_empire_idea:0 "Widespread Casinos"
 UK_casino_empire_idea_desc:0 "Now that Fort Roughs has also been transformed into a casino, much of the nation has followed in this gambling haven."
 UK_save_norway_idea:0 "Save Norway"
 UK_save_norway_idea_desc:0 "[NOR.getnamedefcap] is certainly in a difficult situation, with the current [GER.GetAdjective] invasion. We need to defend them at all costs!"
 UK_worst_strike_ever_idea:0 "The Worst Strike Ever"
 UK_worst_strike_ever_idea_desc:0 "We have just been hit by the worst strike that [ENG.getnameDEF] has ever seen, as workers demand for drastic reforms that cannot be implemented without a change of government. Is the country ruined?"
 UK_operation_compass_idea:0 "Operation Compass"
 UK_operation_compass_idea_desc:0 "We must seek to breach through North Africa, so we can secure an assault towards [ITA.getnamedef]."
 UK_operation_torch_idea:0 "Operation Torch"
 UK_operation_torch_idea_desc:0 "We must seek to take all of North Africa to allow for an easy access into [ITA.getnamedef]."
 UK_operation_husky_idea:0 "Operation Husky"
 UK_operation_husky_idea_desc:0 "With the Axis powers distracted, we can make our re-entrance into Europe by landing in southern Italy."
 UK_operation_overlord_idea:0 "Operation Overlord"
 UK_operation_overlord_idea_desc:0 "We must now seek out to complete the grandest operation ever - the liberation of Europe. Through overseas invasions into Normandy, we can accomplish this."
 UK_operation_dragoon_idea:0 "Operation Dragoon"
 UK_operation_dragoon_idea_desc:0 "We must land in southern France, to surround the Germans."
 UK_operation_market_garden_idea:0 "Operation Market Garden"
 UK_operation_market_garden_idea_desc:0 "We must create a route of invasion into Germany proper, which we can accomplish with special air and armored forces operations in the Netherlands."
 UK_race_for_berlin_idea:0 "Race for Berlin!"
 UK_race_for_berlin_idea_desc:0 "We must reach Berlin before those [SOV.getadjective] fools do!"
 ENG_war_cabinet_idea:0 "War Cabinet"
 ENG_war_cabinet_idea_desc:0 "We must have a war cabinet that consists of the Conservative, Liberal, and Labour parties to unite the people in the face of the [GER.GetAdjective] enemy."
 UK_island_hopping_campaigns_idea:0 "Island Hopping Campaigns"
 UK_island_hopping_campaigns_idea_desc:0 "The only way to subdue the [JAP.getadjective] menace may be by invading each of their islands, as difficult as it may be."
 ENG_american_war_propoganda_idea:0 "[USA.getadjective] War Propaganda Films"
 ENG_american_war_propoganda_idea_desc:0 "[USA.getadjective] film companies are some of the best in the world, by hiring them we can have them make us extremely useful propaganda, as the [USA.getadjective] government already does."
 ENG_appeasement_forever_idea:0 "Appeasement Forever"
 ENG_appeasement_forever_idea_desc:0 "Some ministers in our government, notably a certain Neville Chamberlain, call for the continuation of appeasement. In addition, the scars of the Great War remain in many people's heads. With this in mind, we should continue appeasement forever to keep our populace out of any wars."
 ENG_fortify_the_empire_desperate_idea:0 "Desperate Fortifications"
 ENG_fortify_the_empire_desperate_idea_desc:0 "It is clear that foreign powers are out to get us. We must construct fortifications, immediately!"
 ENG_socio_economic_shock_idea:0 "Socio-Economic Shock"
 ENG_socio_economic_shock_idea_desc:0 "Now we have to recover our economy and our people after demobilizing our nation for so long..."
 ENG_imperial_revaunchism_idea:0 "Imperial Revaunchism"
 ENG_imperial_revaunchism_idea_desc:0 "We need to return to the ways of our good old empire at any cost! God save the King!"
 ENG_imperial_security_idea:0 "Imperial Security"
 ENG_imperial_security_idea_desc:0 "The defence of our empire is of the upmost importance, even if that means going to war to ensure it."
 ENG_anglican_church_outraged:0 "Outraged Anglican Church"
 ENG_anglican_church_outraged_desc:0 "The Anglican Church is outraged about our recent decision to bring ourselves closer to the Catholic Church!"
 ENG_green_shirts_idea:0 "Alliance with the Green Shirts"
 ENG_green_shirts_idea_desc:0 "The British Union of Fascists and the Green Shirts have formed a deal, despite the... interesting... practices of the Green Shirts."
 ENG_corporate_state_idea:0 "Corporatist State"
 ENG_corporate_state_idea_desc:0 "Collaboration with the largest of companies will wield the greatest results for our nation."
 ENG_viking_legacy_idea:0 "Legacy of the Vikings"
 ENG_viking_legacy_idea_desc:0 "Ultimately, it was the Vikings that conquered England and united it, perhaps it is best we look back to them."
 ENG_anglo_saxon_legacy_idea:0 "Legacy of the Anglo-Saxons"
 ENG_anglo_saxon_legacy_idea_desc:0 "The Anglo-Saxons were the one of the original populations of England, we should look back to them to guide our nation!"
 ENG_aggressive_rearmenment_idea:0 "Aggressive Rearmament"
 ENG_aggressive_rearmenment_idea_desc:0 "In order to conquer our rightful lands, we must remilitarize quickly, even if the people may not like it."