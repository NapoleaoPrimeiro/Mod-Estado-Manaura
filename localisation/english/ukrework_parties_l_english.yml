 ENG_liberalism_desc:0 "\n£ENG_liberal_icon §HLiberal Party§!\n\nThe £ENG_liberal_icon §HLiberal Party§! is one of the three major political parties in the §WUnited Kingdom§!, along with the £ENG_conservative_icon §3Conservative§! and £ENG_labor_icon §tLabor§! Party, in the 19th and 20th centuries. Beginning as an alliance of §WWhigs§!, free trade–supporting §WPeelites§!, and reformist §WRadicals§! in the 1850s, by the end of the 19th century, it had formed four governments under §WWilliam Ewart Gladstone§!. Despite being divided over the issue of §WIrish Home Rule§!, the party returned to government in 1905 and won a landslide victory in the 1906 general election. Under prime ministers §WHenry Campbell-Bannerman§! and §WH. H. Asquith§!, the §HLiberal Party§! passed reforms that created a basic welfare state. Although Asquith was the party leader, its dominant figure was §WDavid Lloyd George§!."
 ENG_conservatism_desc:0 "\n£ENG_conservative_icon §3Conservative Party§!\n\nThe £ENG_conservative_icon §3Conservative and Unionist Party§!, commonly the §3Conservative Party§! and colloquially known as the §3Tories§!, is one of the three main political parties in the §WUnited Kingdom§!, along with the £ENG_liberal_icon §HLiberal§! and £ENG_labor_icon §tLabour§! Party. The party sits on the §Wcentre-right§! to §Wright-wing§! of the left-right political spectrum."
 ENG_socialism_desc:0 "\n£ENG_labor_icon §tLabour Party§!\n\nThe £ENG_labor_icon §tLabour Party§!, often referred to as §tLabour§!, is a political party in the §WUnited Kingdom§! that sits on the §Wcentre-left§! of the political spectrum. The party has been described as an alliance of §Wsocial democrats§!, §Wdemocratic socialists§! and §Wtrade unionists§!. It is one of the three dominant political parties in the United Kingdom; the others being the £ENG_conservative_icon §3Conservative§! and £ENG_liberal_icon §HLiberal§! Party."
 ENG_nazism:0 "English Socialism"
 ENG_nazism_desc:0 "§RAll must submit to the Party and Big Brother!§!"

