 #Shared Tree
 GER_die_ruhrlade:0 "Die Ruhrlade"
 GER_die_ruhrlade_desc:0 "To feed our war machine, we must bring the industrial giants of the Ruhr valley to the same table. However, these industrialists will undoubtedly demand political concessions in exchange for their full cooperation."
 GER_cooperate_with_stahlwerke:0 "Cooperate with Stahlwerke"
 GER_cooperate_with_stahlwerke_desc:0 "Anyone can manufacture a weapon, but only Vereinigte Stahlwerke can provide the steel to build it. By supporting their infrastructure and resource extraction operations, we will make our industrial base unshakable."
 GER_cooperate_with_krupp:0 "Cooperate with Krupp"
 GER_cooperate_with_krupp_desc:0 "The Krupp family has been the forge of the Reich for generations. By granting them a complete monopoly on weapon and armor production contracts, we can maximize the striking power of our armed forces."
 GER_die_rustungsoligarchie:0 "Die Rüstungsoligarchie"
 GER_die_rustungsoligarchie_desc:0 "The barons have become a state within a state. Our production figures have reached colossal proportions, but the insatiable greed of these corporations is placing a heavy burden on the people. A crisis is brewing."
 GER_destory_barons:0 "Destroy the Barons"
 GER_destory_barons_desc:0 "No corporation is greater than the State! We will seize their facilities, break their monopolies, and place heavy industry under direct state control through the Reichswerke."
 GER_integrate_the_barons:0 "Integrate the Barons"
 GER_integrate_the_barons_desc:0 "We cannot afford an open war with the industrialists. By integrating them into an official state armament council, we can guarantee their profits while bringing their operations under government oversight."
 GER_nationalize_resource_industries:0 "Nationalize Resource Industries"
 GER_nationalize_resource_industries_desc:0 "We must create open spaces to build more factories in our country."
 GER_schwerer_gustav:0 "Schwerer Gustav"
 GER_schwerer_gustav_desc:0 "The art of war evolves, yet the need for overwhelming firepower remains timeless. Our engineers have undertaken an unprecedented project — the construction of a railway gun so massive it defies imagination. Schwerer Gustav will stand as a testament to German industrial genius and the sheer might of our armies. No fortress will stand unshaken, no enemy trench safe from the thunder of its shells."
 GER_Standard_panzer:0 "Standard Panzer"
 GER_Standard_panzer_desc:0 "German tanks were an important part of the Wehrmacht and played a fundamental role during the whole war, and especially in the blitzkrieg battle strategy."
 GER_underground_mil_factories:0 "Underground Factories"
 GER_underground_mil_factories_desc:0 "Surface factories are targets. When war comes, enemy bombers will strike at the Reich’s industrial heart before the first soldier crosses a border. The solution is simple: move production where they cannot reach it. " 
