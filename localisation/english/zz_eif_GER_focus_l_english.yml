 #NEW WEHRMACHT
 GER_wehrmacht_focus:0 "[Root.GetWehrmachtFocus]"
 GER_wehrmacht_focus_desc:0 "New German Army in Field. Lets go. Conquer."
 GER_enigma_focus:0 "Enigma"
 GER_enigma_focus_desc:0 "The Enigma machine is our encryptor. It must be developed and used so that we can see what the enemy is doing and they cannot see what we are doing."
 GER_abwehr_focus:0 "The Abwehr"
 GER_abwehr_focus_desc:0 "The Abwehr was created in 1920 as part of the German Ministry of Defence when the German government was allowed to form the Reichswehr, the military organization of the Weimar Republic. The first head of the Abwehr was Major Friedrich Gempp, a former deputy to Colonel Walter Nicolai, the head of German intelligence during World War I, who proved mostly ineffectual. In the 1930s, with the rise of the Nazi movement, the Ministry of Defence was reorganised; surprisingly, on 7 June 1932, a naval officer, Captain Conrad Patzig, was named chief of the Abwehr, despite the fact that it was staffed largely by army officers."
 #Navy
 GER_the_kriegsmarine:0 "[Root.GetKriegsmarineFocus]"
 GER_the_kriegsmarine_desc:0 "Kriegsmarine is the naval branch of the German forces."
 GER_crizmarine:0 "Schlachtschiffe"
 GER_crizmarine_desc:0 "Give More Resources of German Navy."
 GER_new_bismarck:0 "Knights of Atlantic"
 GER_new_bismarck_desc:0 "Atlantic Ocean is very important. Secure them."
 GER_donits_ubot_effort:0 "Dönitz's U-Boat Effort"
 GER_donits_ubot_effort_desc:0 "Commodore Dönitz advocates a strategy of unrestricted submarine warfare as the best way of bringing Britain to its knees. With enough U-boats, we might be able to starve the British home industries of all the required resources from its far-flung empire."
 GER_H_klasse:0 "H Klasse"
 GER_H_klasse_desc:0 "New German Navy is stronger!"
 GER_Flugzeugtrager:0 "Flugzeugträger"
 GER_Flugzeugtrager_desc:0 "Enact the New Plans."
 #Army
 GER_the_heer:0 "[Root.GetTheHeerFocus]"
 GER_the_heer_desc:0 "Heinz Guderian and other radical theorists are pushing for daring new doctrines emphasizing communication, identification of 'Schwerpunkt' and local concentrations of combined arms forces. Giving them free reins might help avoid the meat grinder horrors of the Great War."
 GER_new_infantry_tactics:0 "New Infantry Tactics"
 GER_new_infantry_tactics_desc:0 "Infantry tactics have come a long way since the Great War. If we apply the General Staff's recent advancements in military thought to real-life experiences, the backbone of the Wehrmacht may become more unshakable than ever before."
 GER_artillery_modernization:0 "Artillery Modernization"
 GER_artillery_modernization_desc:0 "The Treaty of Versailles sought to limit Germany's field artillery to just 284 pieces in total, but this laughable restriction is no obstacle to the Reich now. A powerful Germany needs a powerful Heer, and a powerful Heer needs modernized powerful guns!"
 GER_motorize_and_modernize_the_infantry:0 "Motorize and Modernize the Infantry"
 GER_motorize_and_modernize_the_infantry_desc:0 "Designed to be low-cost and easy to build, the MG 42 proved to be highly reliable and easy to operate. It is most notable for its very high rate of fire of 1,200 rounds per minute. This ability makes it extremely effective in providing suppresing fire. We need to realize these cheap ways of spewing swarms of rounds upon the enemy are the key to victory and develop new support weapons."
 GER_Panzerwaffe:0 "Panzerwaffe"
 GER_Panzerwaffe_desc:0 "Blitzkrieg needs armoured warfare. It needs the Panzerwaffe. More importantly for the lebensraum.  Now is the time to put more emphasis on armoured units. More Panzers."
 GER_panzergrenadiers:0 "Panzergrenadiers"
 GER_panzergrenadiers_desc:0 "To those who look further than our propaganda, it is no secret that our army remains one of the horse and train. It should be one of our main goals to increase our use of both mobile and armored infantry."
 GER_build_up_panzer_divisions:0 "Build Up Panzer Divisions"
 GER_build_up_panzer_divisions_desc:0 "The old "Leichte Divisions" have proven too thin-skinned to do their jobs as armor, but not maneuverable enough to fully replace cavalry. The next generation of tanks must have tougher armor and more powerful armaments, even if there is a slight cost in speed."
 GER_counter_armor:0 "Counter Armor"
 GER_counter_armor_desc:0 "Armour shouldn't be in our way. If we destroy what our opponents are counting on, no one can stand against us!"
 GER_oberkommando_des_heeres:0 "Oberkommando des Heeres"
 GER_oberkommando_des_heeres_desc:0 "Oberkommando des Heeres OKH is a Wehrmacht Army High Command. For the armed forces. Stronger OKH, for Germany!"
 #Air
 GER_the_luftwaffe:0 "[Root.GetLuftwaffeFocus]"
 GER_the_luftwaffe_desc:0 "Expand the Luftwaffe Air Forces!"
 GER_Fallschirmjager:0 "Fallschirmjäger"
 GER_Fallschirmjager_desc:0 "Powerful Fallschirmjager should be used more."
 GER_expand_air_bases:0 "Expand the Luftwaffe's Capabilities"
 GER_expand_air_bases_desc:0 "Luftwaffe II. It was the air combat unit of the German Wehrmacht troops during World War II. Imperial Army air power, the air forces of the German Empire during World War I."
 GER_Geschwader:0 "Geschwader"
 GER_Geschwader_desc:0 "Geschwader should be given more importance."
 GER_entfalten_jagdgeschwader:0 "Expand The Jagdgeschwader"
 GER_entfalten_jagdgeschwader_desc:0 "Expand The Jagdgeschwader."
 GER_expand_Sturzkampfgeschwader:0 "Expand The Sturzkampfgeschwader"
 GER_expand_Sturzkampfgeschwader_desc:0 "Expand The Sturzkampfgeschwader."
 GER_bomber_production:0 "Bomber Production"
 GER_bomber_production_desc:0 "Give more important the bomber production."
 GER_Strahlflugzeug_plan:0 "Strahlflugzeug Plan"
 GER_Strahlflugzeug_plan_desc:0 "Enact the Strahlflugzeug Plan."
 GER_Amerika_bomber:0 "Amerika-Bomber"
 GER_Amerika_bomber_desc:0 "Amerika-Bomber will be a grave for enemies."
 #SS
 GER_Schutzstaffel_focus:0 "The Schutzstaffel"
 GER_Schutzstaffel_focus_desc:0 "The Schutzstaffel, is a paramilitary group that directly serves Adolf Hitler and the Nazi Party. What began as a simple security detachment for NSDAP meetings has grown under the leadership of Heinrich Himmler into a powerful and feared tool for Hitler's totalitarian regime."
 GER_RHSA_focus:0 "Establish Reich Security Main Office"
 GER_RHSA_focus_desc:0 "The Reich Security Main Office RHSA was an organisation under Heinrich Himmler in his dual capacity as Reichsführer-SS, Chief of the German Police and head of the Nazi Party's Schutzstaffel. The stated mission of the organisation was to combat all "Enemies of the Reich" within and outside the borders of Nazi Germany. "
 GER_Waffen_SS_focus:0 "Modernize the Waffen-SS"
 GER_Waffen_SS_focus_desc:0 "The Waffen-SS is the armed group of the organisation. We have to modernise to conscript men from Nazi Germany and men from the occupied territories."
 GER_Waffen_SS_recruitment:0 "Recruit SS Divisions"
 GER_Waffen_SS_recruitment_desc:0 "More soldiers and less mutiny! The SS has to grow up now. For that we must reinforce the SS. Forward to the Holocaust and more! Sieg Heil!"
 GER_create_ss_panzer_divisions:0 "Build Up SS Panzer-Divisions"
 GER_create_ss_panzer_divisions_desc:0 "More SS Panzers became a necessity in the field. Panzergrenadiers on duty! Forward relentlessly for Lebensraum."
 GER_Einsatzgruppen:0 "Form Einsatzgruppen"
 GER_Einsatzgruppen_desc:0 "Einsatzgruppen were the Schutzstaffel (SS) paramilitary death squads of Nazi Germany. They are primarily responsible for mass murder by shooting in occupied Europe. The Einsatzgruppen were integral to the implementation of the so-called "Final Solution to the Jewish question" in the territories conquered by Nazi Germany.\nThe Einsatzgruppen had their origins in the Einsatzkommando, created by SS officer Reinhard Heydrich in 1938 to secure government buildings and documents following the Anschluss of Austria in March 1938. This was expanded into several Einsatzgruppen, consisting of several Einsatzkommando in 1939 they became part of the Reich Main Security Office of the SS."
 GER_ethnic_cleansing:0 "Ethnic Cleansing" #Unused
 GER_ethnic_cleansing_desc:0 "For the Aryans! Death to Jews and traitors! We must deport them all to Madagascar. The SS will help us with that. Fucking people and races."
 GER_holocaust_focus:0 "Establish Concentration Camps"
 GER_holocaust_focus_desc:0 "Europe is ours and will remain ours! Now it is time to glorify our race. Kill those who are not ours."
 ###########
 GER_incorporate_rheinmetall:0 "Incorporate Rheinmetall"
 GER_incorporate_rheinmetall_desc:0 "Rheinmetall Company was a military company. It was founded by Reichsminister of Aviation Hermann Goring. Now we need to give more authority so that resource gains and our industry can develop."
 GER_Rheinmetall_attempt_tt:0 "\n §YWith these decisions§!, you will §Ybe able to§! extract §Lresources§! from the places you invest in the §Y$GER_prioritize_the_four_year_plan$§! focus, with the §LRheinmetall Company§! led by §YHermann Göring§!."
 GER_Rheinmetall_attempt_state_modifier1:0 "Rheinmetall Initiative"
 GER_Rheinmetall_attempt_state_modifier2:0 "Bigger Rheinmetall Initiative"
 GER_Rheinmetall_attempt_state_modifier3:0 "Maximum Rheinmetall Initiative"
 GER_rustung_und_ruhm:0 "Rüstung und Ruhm"
 GER_rustung_und_ruhm_desc:0 "Glory is not won with words, but with steel. Under the Kaiser's rule, we shall embark upon a new era of armament—disciplined, deliberate and defiant. Our factories will thunder with life, our workers will serve the Fatherland with pride and our enemies shall tremble at the might we forge. The legacy of Bismarck and Moltke demands no less."
 GER_albert_speer_ascended:0 "Albert Speer Ascended"
 GER_albert_speer_ascended_desc:0 "While others plotted with slogans, uniforms and fear, Albert Speer moved quietly — with precision, calculation and intent. Now, the silence has ended. Speer has risen not by fire, but by function. The Reich is no longer a stage for madmen, but a system in the hands of its architect."
 GER_depoliticize_the_reich:0 "Depoliticize the Reich"
 GER_depoliticize_the_reich_desc:0 "To restore sanity, we must remove the rot of ideology from every corner of the administration. Loyalty to order, competence and continuity — these will be our new principles."
 GER_reorganize_the_four_year_plan:0 "Reorganize the Four-Year Plan"
 GER_reorganize_the_four_year_plan_desc:0 "Initially built to prepare Germany for war, the Four Year Plan is outdated and bloated. Under Speer’s guidance, it will be transformed into a streamlined national economic engine — focused on function over ideology."
 GER_purge_the_fanatics:0 "Purge the Fanatics"
 GER_purge_the_fanatics_desc:0 "The ideological madmen who once gripped the Reich must be removed if order is to prevail. The SS, the zealots, the manipulators all will be sidelined for the survival of the state."
 GER_a_deal_with_the_black_order:0 "A Deal with the Black Order"
 GER_a_deal_with_the_black_order_desc:0 "The architect chose not to demolish the black citadel, but to renovate its corridors. In a cold and calculated agreement, Speer has accepted several demands from Himmler and the SS leadership. In return for their loyalty, the SS has been granted greater influence within the military hierarchy, internal security and administration. It is not an alliance of belief, but of necessity. Order demands compromise."
 GER_modernize_the_wehrmacht:0 "Modernize the Wehrmacht"
 GER_modernize_the_wehrmacht_desc:0 "The army must serve the Reich — not a party, not a man and certainly not a cult. We will restore the Wehrmacht to a professional, obedient institution, loyal only to the German state."
 GER_industrial_modernization:0 "Industrial Modernization"
 GER_industrial_modernization_desc:0 "War has changed, and so must we. Outdated production models will be replaced with mechanized efficiency. From steel to synthetic rubber, the Reich will be modernized — not for glory, but for endurance."
 GER_architect_of_a_new_order:0 "Architect of a New Order"
 GER_architect_of_a_new_order_desc:0 "The Reich has shed its ideological skin. In its place stands a system of order, efficiency and cold design. Not a utopia — but a state that functions. A state worth preserving. A state we built from the ruins."
 GER_hermann_goring_ascended:0 "Hermann Göring Ascended"
 GER_hermann_goring_ascended_desc:0 "Since Hermann Göring was the pioneer of the development of the German economy, the leader of the Luftwaffe and Hitler's right-hand man, his rise was inevitable. Long live our new führer."
 GER_preserve_the_party:0 "Preserve the Party"
 GER_preserve_the_party_desc:0 "The NSDAP is the spine of the Reich. Its structures will remain intact and its loyalty reinforced—our power drawn from tradition as much as force."
 GER_militarizing_the_four_year_plan:0 "Militarizing the Four-Year Plan"
 GER_militarizing_the_four_year_plan_desc:0 "The original Four-Year Plan laid the groundwork for economic rearmament. Now, under Göring’s direct control, it will evolve into a full-fledged military-industrial complex. Every ton of steel, every drop of fuel—redirected toward the Reich’s arsenal.
 GER_the_marshals_parade:0 "The Marshal's Parade"
 GER_the_marshals_parade_desc:0 "In a grand show of unity, discipline, and martial pride, the Marshals of the Reich parade through Berlin. Göring leads them not just as a political figure, but as a military man—commanding the admiration of both soldier and citizen alike."
 GER_reichswerke_revival:0 "Reichswerke Revival"
 GER_reichswerke_revival_desc:0 "The Reichswerke Hermann Göring, once a bloated industrial experiment, will now be streamlined and reborn. With direct state supervision, it shall become the beating heart of German war production."
 GER_legacy_of_the_black_eagle:0 "Legacy of the Black Eagle"
 GER_legacy_of_the_black_eagle_desc:0 "The black eagle of Prussia once soared over the fields of Europe, a symbol of discipline, tradition and military excellence. Under Göring’s leadership, we now seek to rekindle that legacy — to reshape the Wehrmacht in the image of the old Prussian order. Through drill, order and iron command, the spirit of Frederick the Great shall march once more."
 GER_the_goring_doctrine:0 "The Göring Doctrine"
 GER_the_goring_doctrine_desc:0 "Blending nationalism, centralized planning and personal authority, the Göring Doctrine defines a new path for the Reich—one where efficiency serves ideology and ideology bends to the will of the state. The age of rigid dogma is over; the age of results begins."
 GER_heinrich_himmler_ascended:0 "Heinrich Himmler Ascended"
 GER_heinrich_himmler_ascended_desc:0 "With Hitler dead and the old guard fractured, Heinrich Himmler ascends to power. As Reichsführer-SS, his vision for the state is rooted in blood, obedience and myth. A new era begins—shrouded in black."
 GER_reshape_the_volkskorper:0 "Reshape the Volkskörper"
 GER_reshape_the_volkskorper_desc:0 "To cleanse and reforge the body of the nation, we must impose new ideals. Race, loyalty and purpose—these are the pillars upon which the SS will redefine the German people."
 GER_ss_economic_order:0 "SS Economic Order"
 GER_ss_economic_order_desc:0 "The economy must be restructured to reflect SS values—order, hierarchy and loyalty. Civilian institutions are gradually absorbed into a shadowy apparatus managed by Himmler’s inner circle."
 GER_night_of_the_iron_crosses:0 "Night of the Iron Crosses"
 GER_night_of_the_iron_crosses_desc:0 "In a single, swift purge, the remaining opposition within the state and military is eliminated. The Iron Cross—a symbol once of honor—now becomes a silent tombstone for those who defied Himmler's vision. With no dissenters left, the SS holds undisputed control."
 GER_rise_of_the_waffen_ss:0 "Rise of the Waffen-SS"
 GER_rise_of_the_waffen_ss_desc:0 "With the Wehrmacht dissolved into irrelevance, the Heer has been fully absorbed into the ever-expanding Waffen-SS. The Black Corps now stands as the sole military power in the Reich."
 GER_reich_youth_reborn:0 "The Himmlerjugend"
 GER_reich_youth_reborn_desc:0 "No longer a tool of the party, the youth of Germany now march to the rhythm of the SS. Discipline, ideology, and racial purity are instilled from the earliest age under Himmler’s direct oversight."
 GER_the_shadow_bureaucracy:0 "The Shadow Bureaucracy"
 GER_the_shadow_bureaucracy_desc:0 "Not all power resides in open sight. The SS forms parallel institutions, court systems and a growing web of silent enforcers. Soon, the original state will be a hollow shell."
 GER_the_black_order_triumphant:0 "The Black Order Triumphant"
 GER_the_black_order_triumphant_desc:0 "The transformation is absolute. The Reich no longer exists as a nation, but as an ideological crusade. The Black Order rules supreme, its vision enforced not by law—but by oath, blood and iron."
 GER_return_of_the_archduke:0 "The Return of the Archduke"
 GER_return_of_the_archduke_desc:0 "The old Kaiser’s throne stood empty, but the idea of empire did not die with him. In the quiet halls of Bavaria, Otto von Habsburg accepted our call—not as a conqueror, but as a unifier. His arrival in Berlin was met with solemn crowds and guarded hope. The young Archduke carries with him the legacy of centuries past, yet he speaks of a future built on reconciliation rather than revenge. The double-headed eagle soars once again—not for dominion, but for renewal."
 GER_imperial_legitimacy:0 "Imperial Legitimacy"
 GER_imperial_legitimacy_desc:0 "Otto’s coronation has not silenced all voices of dissent. To some, he is a foreign prince wearing a borrowed crown; to others, he is the only man capable of healing the wounds left by the Hohenzollerns’ fall. The new Emperor must now earn the loyalty of Germany’s generals, nobles, and people alike. Through symbolic gestures, fair governance, and a promise of stability, the Archduke seeks to turn uncertainty into faith. In his words, ‘Legitimacy is not inherited—it is granted by the will of a united people.’"
 GER_invite_scholars_and_reformers:0 "Invite Scholars and Reformers"
 GER_invite_scholars_and_reformers_desc:0 "Kaiser Otto seeks to strengthen Germany not only through military might but through knowledge and enlightened governance. Leading scholars and reformers are invited to the court to advise on industry, infrastructure, and society."
 GER_reclaim_the_crown_of_st_stephen:0 "Reclaim the Crown of St. Stephen"
 GER_reclaim_the_crown_of_st_stephen_desc:0 "With Austria now under his control, Kaiser Otto turns his gaze toward Budapest. As the rightful heir to the Hungarian throne, he demands the crown, seeking to unite the German and Hungarian peoples under a single imperial rule. The decision of Regent Horthy will determine whether this union is realized peacefully or by force."
 GER_faith_and_empire:0 "Faith and Empire"
 GER_faith_and_empire_desc:0 "The Church remains a pillar of our society, guiding the hearts and minds of the people. Strengthening the bonds between faith and state ensures stability, unity, and moral guidance across the realm."
 GER_strengthen_the_crown:0 "Strengthen the Crown"
 GER_strengthen_the_crown_desc:0 "Central authority must be reinforced to maintain order and ensure the efficiency of government. By consolidating power and streamlining administration, the throne secures the nation’s future against internal division and external threats."
 GER_imperial_federation:0 "Federal Restoration"
 GER_imperial_federation_desc:0 "In the spirit of the old Holy Roman Empire, Kaiser Wilhelm seeks to restore the autonomy of the constituent kingdoms and principalities. While unity under the crown remains, each realm is granted its historic rights and privileges, reviving traditions long thought dormant."
 GER_imperial_diet_restored:0 "The Imperial Diet Restored"
 GER_imperial_diet_restored_desc:0 "Representatives from the constituent kingdoms and duchies shall once again convene under imperial supervision. Though debate may delay progress, it ensures every realm’s voice is heard within the new order."
 GER_imperial_development_plan:0 "The Imperial Development Plan"
 GER_imperial_development_plan_desc:0 "The Empire shall fund local industries and infrastructure across its member states, ensuring every duchy and kingdom benefits from the renewed federal structure."
 GER_a_bohemian_protectorate:0 "A Bohemian Protectorate"
 GER_a_bohemian_protectorate_desc:0 "For centuries, the Czech people have been intertwined with the fate of the House of Habsburg. Instead of a forceful integration, we shall offer them a place of honor as a loyal protectorate. By allowing them internal autonomy under our imperial protection, we will secure a stable, friendly neighbor and a valuable industrial asset, avoiding the strife of full annexation while strengthening our influence in Central Europe."
 GER_reclaim_the_crown_of_wenceslaus:0 "Reclaim the Crown of Wenceslaus"
 GER_reclaim_the_crown_of_wenceslaus_desc:0 "The Bohemian Crown is a jewel in the heart of Europe, and its rightful place is with the Habsburgs. While we seek to mend relations, we will not tolerate the continued fragmentation of our historical domains."
 GER_reclaim_galicia_lodomeria:0 "Reclaim Galicia-Lodomeria"
 GER_reclaim_galicia_lodomeria_desc:0 "The territories of the old Kingdom of Galicia and Lodomeria were a vital part of the Empire, and their loss weakened our people. Today, these lands are a source of untapped resources and a connection to Eastern Europe. We must reclaim them from their current masters to restore our former glory and bring their peoples back into the fold of the new Kaiserreich."
 GER_restore_the_papal_states:0 "Restore the Papal States"
 GER_restore_the_papal_states_desc:0 "For too long, the Holy Father has been a prisoner in his own city. As the rightful Catholic monarch of a new great empire, it is our sacred duty to protect the spiritual leader of the world and restore his temporal power. We will seize the Italian lands and return them to the Holy See, not as a puppet of our will, but as a sovereign state under our protection. This act will secure our divine right to rule and earn the blessing of the Church."
 GER_integrate_the_wenceslaus_crown:0 "Integrate the Wenceslaus Crown"
 GER_integrate_the_wenceslaus_crown_desc:0 "The Bohemian people have proven their loyalty and their worth as a key partner in our new Empire. The time has come to formalize our bond and complete the unification of our ancient lands. By integrating the Crown of St. Wenceslaus directly into the Reich, we will end centuries of fragmentation and ensure the economic and military might of this industrial heartland becomes a permanent asset to the Kaiserreich."
 GER_reclaim_the_burgundian_inheritance:0 "Reclaim the Burgundian Inheritance"
 GER_reclaim_the_burgundian_inheritance_desc:0 "For centuries, the Low Countries were a crucial part of the Habsburg patrimony, a testament to our dynasty's broad reach. The Dutch, though they have long gone their own way, remain a vital part of our legacy. As we restore our empire, we must not forget the lands that were once ours."
 GER_pax_habsburgica_achieved:0 "Pax Habsburgica Achieved"
 GER_pax_habsburgica_achieved_desc:0 "The Great War left Europe a shattered continent, with empires broken and nations divided. Yet, from the ashes of the old world, a new order has risen. The House of Habsburg, once cast aside by the tides of history, has returned to its rightful place. Through diplomacy, force, and a renewed imperial vision, the core of our ancestral lands has been reclaimed. From the shores of the Adriatic to the highlands of Bohemia and the vast plains of Hungary, a new German Empire stands tall—a beacon of stability in a world yearning for peace. The dream of a united Central Europe is no longer a dream; it is a reality born of blood and steel. The Pax Habsburgica, a new age of peace and prosperity under the Kaiser's benevolent rule, has been achieved."
 GER_imperial_economic_assistance:0 "Imperial Economic Assistance"
 GER_imperial_economic_assistance_desc:0 "The Habsburg realms can only thrive if all their members stand on firm economic foundations. We shall extend financial aid and industrial expertise to our loyal subjects, ensuring prosperity flows through every corner of the Empire."
 EF_around_maginot:0 "Cannot be taken if all Benelux states are controlled by countries in a faction with [GER.GetNameDef] and we are at war with [FRA.GetNameDef]."
 EF_around_maginot_bypass:0 "All Benelux states are either controlled by [GER.GetNameDef] or their controllers are at war with Germany."
 GER_integrate_czech_manufacturers_ww:0 "Integrate Czech Manufacturers"
 GER_integrate_czech_manufacturers_ww_desc:0 "The industry located in Bohemia is a goldmine of manufacturing expertise and industrial resources for our economy. The additional industrial power that Bohemia Manufacturers would add would be a huge boost to our armament industry. It makes perfect sense to integrate them into our production lines."