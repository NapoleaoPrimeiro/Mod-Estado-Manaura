 GER_italian_friends:0 "Alliance with Italy"
 GER_italian_friends_desc:0 "Italians are old enemies, new friends"
 GER_rebuild_italia:0 "Rebuild German Italy"
 GER_rebuild_italia_desc:0 "They were dependent on our government at the time of the Italians, but now they are free. For now"
 GER_start_crusade:0 "Last Crusade"
 GER_start_crusade_desc:0 "The last crusade. We need to start a final crusade to retake the holy cities"
 GER_fully_catholc:0 "Conversion to the Catholic Religion"
 GER_fully_catholc_desc:0 "Even if our country is orthodox, I can make our country Catholic."
 GER_slav_country:0 "Tripartite Monarchy"
 GER_slav_country_desc:0 "The slavic population occupies a large place in his empire and it would be a logical solution to switch to the triple monarchy method to keep the slavs happy."
 GER_way_to_kusen:0 "AUSTRALIA?"
 GER_way_to_kusen_desc:0 "Austria or Australia, it doesn't matter, as Habsburgs we are present in almost every country in the world, why not in Australia?"
