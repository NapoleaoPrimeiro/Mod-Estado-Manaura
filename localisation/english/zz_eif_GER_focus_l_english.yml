 GER_proclaim_the_restoration_of_austria_hungary_desc:0 "The time has come for us to declare the German-Hungarian empire and establish a claim on the former Austrian-Hungarian lands."
 GER_protect_czechoslovakia:0 "Protect Czechoslovakia"
 GER_protect_czechoslovakia_desc:0 "We must protect Czechoslovakia, we cannot let other countries take it over."
 GER_claim_transylvania:0 "Claim Transylvania"
 GER_claim_transylvania_desc:0 "Transylvania is the old Hungarian land let's send an ultimatum to the novels"
 GER_march_to_the_shore:0 "What is Yugoslavia"
 GER_march_to_the_shore_desc:0 "Yugoslavia? We have to destroy this creature"
