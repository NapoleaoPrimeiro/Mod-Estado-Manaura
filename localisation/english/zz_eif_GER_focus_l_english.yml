l_english:
 #Starter
 GER_fuhrer_legacy:0 "Legacy of Führer"
 GER_fuhrer_legacy_desc:0 "We are ready to take on the whole world behind our führer, who put a Germany whose people broke from hunger and misery on the world stage again and protected the honor of the Germans."
 GER_old_empire:0 "The Old Empire"
 GER_old_empire_desc:0 "The failures of the Weimar government and the corruption of the NSDAP government contrast against Germany's glorious imperial history. We must restore Germany to its former imperial glory to ensure our place as a world power."
 GER_kill_hitler:0 "Slipping Führer"
 GER_kill_hitler_desc:0 "We just learned that there was an assassination attempt on our fuhrer."
 GER_manace_spreading:0 "Menace Spreading"
 GER_manace_spreading_desc:0 "Red Danger is Spreading in Our Country"
 GER_ally_with_the_SPD:0 "Ally With the SPD"
 GER_ally_with_the_SPD_desc:0 "" #TODO HYPNO
 GER_crush_the_communist_threat:0 "Crush the Communist Threat"
 GER_crush_the_communist_threat_desc:0 ""
 GER_ein_volk_ein_reich_ein_fuhrer:0 "Ein Volk, ein Reich, ein Führer"
 GER_ein_volk_ein_reich_ein_fuhrer_desc:0 "Germany stands united under one people, one state, and one leader. The divisions of the past have been swept away by the unstoppable force of national unity. This is the culmination of the vision promised to the German people—a singular Reich, indivisible in purpose and destiny, under the eternal guidance of the Führer."
 GER_gott_mit_uns:0 "Gott Mit Uns"
 GER_gott_mit_uns_desc:0 "As the smoke clears and our enemies fall one by one, the German people march forward under the unwavering guidance of the Führer. This is no longer just a war—it is a sacred mission. With history as our witness and divine providence on our side, we shall forge a new order from the ashes of the old. God is with us, and nothing shall stand in our way."
 GER_lebensraum_achieved:0 "Lebensraum Achieved"
 GER_lebensraum_achieved_desc:0 "At last we have succeeded, the German people have won their rightful land with blood, sweat and tears. Thanks to our Führer, we no longer have treaties imposed on us that dishonor us. Long live our great Führer. Heil Hitler."
 GER_the_new_order:0 "The New Order"
 GER_the_new_order_desc:0 "Now that the whole of Europe is at our feet, the rich resources of Europe and millions of humble slaves are ready to serve the great German race. As the great Germans who will lead these vast resources, NOW WE WILL CREATE THE NEW WORLD ORDER."
 GER_increase_the_air_force_budget:0 "Increase the Luftwaffe's Budget"
 GER_increase_the_air_force_budget_desc:0 "The Luftwaffe needs to achieve technological superiority in order to deal with the world powers. Faster, more powerful, better maneuverable planes can leave the whole sky under German control. But for this, the Luftwaffe budget needs to be increased"
 #Führer Path First Focus
 GER_help_italians:0 "Help the Italians"
 GER_help_italians_desc:0 "Italy is a fascist country, we have to help them"
 GER_help_etihopyans:0 "Help the Ethiopians"
 GER_help_etihopyans_desc:0 "We must prevent Italy from acquiring a colony."
 GER_support_military_research:0 "Support Military Research"
 GER_support_military_research_desc:0 "Industry alone does not win wars. The Reich’s scientists are given what they need — time, funding, and clear objectives. What they return will be worth far more than the investment."
 GER_help_natinal_spain:0 "Help Nationalist Spain"
 GER_help_natinal_spain_desc:0 "Another fascist state has risen, we must help them quickly"
 GER_kill_cominist:0 "Purge the Communists"
 GER_kill_cominist_desc:0 "Communism should disappear in the country"
 GER_black_wearing_dudes:0 "Men in Black"
 GER_black_wearing_dudes_desc:0 "We must include our new military power, the SS, in the army"
 GER_lebensraum_focus:0 "Lebensraum"
 GER_lebensraum_focus_desc:0 "It is necessary to gather all the Germans under one roof, the Germans are the superior race!"
 GER_make_coal:0 "Produce Coal in Alternative Ways"
 GER_make_coal_desc:0 "Our coal needs have reached the line stage, we need to apply to alternative coal productions."
 GER_war_economi:0 "German War Economy"
 GER_war_economi_desc:0 "We need to switch to a war economy, more guns, more motorized more tanks for the soldiers."
 GER_war_sweden:0 "War with Sweden"
 GER_war_sweden_desc:0 "We have been importing tungsten and iron from Sweden for years; the enemy's threat to [SWE.GetNameDef] is also a threat to [GER.GetNameDef]'s military and expansion. We must secure [SWE.GetNameDef] to ensure these vital resources do not fall into enemy hands."
 GER_war_finland:0 "War with Finland"
 GER_war_finland_desc:0 "[FIN.GetNameDefCap]'s influence in [SOV.GetNameDef] and Scandinavia makes it vital to [GER.GetNameDef]'s further expansion. Securing this stronghold will be a massive blow to our enemies."
 GER_swedish_steel:0 "Swedish Steel Treaty"
 GER_swedish_steel_desc:0 "The Scandinavian countries are like dominoes; they stand and fall together. With Norway and Denmark in our sphere, Sweden will surely follow."
 GER_FIN_the_finnish_lion:0 "Finnish Lion"
 GER_FIN_the_finnish_lion_desc:0 "[FIN.GetNameDefCap] has long been an enemy of [SOV.GetNameDef] and may prove to be a vital link to the Northern Front and the rest of Scandinavia."
 GER_war_with_iceland:0 "Operation Ikarus"
 GER_war_with_iceland_desc:0 "Iceland is too important as a base for North Atlantic Shipping to be left unoccupied. We must seize it at once!"
 GER_austrian_iron:0 "Alpine Montan Investments"
 GER_austrian_iron_desc:0 "As the backbone of Austrian heavy industry, the Alpine Montangesellschaft represents a vital strategic asset for the Reich's rearmament. By pouring German capital and technical expertise into their mining operations, we can secure a steady flow of iron ore while effectively integrating the Austrian economy into our own. This economic entanglement will serve as a Trojan horse, weakening the Federal Government's sovereignty and paving the way for our eventual reunification."
 GER_otto_von:0 "Czech-Polish Autobahn"
 GER_otto_von_desc:0 "Motorways in Germany, federal motorways in Germany. The construction of highways goes back to the Nazi era."
 GER_biger:0 "Bigger Tanks"
 GER_biger_desc:0 "Nien nien nien should be bigger and stronger add five ship guns if needed"
 GER_ITA_stahlpakt:0 "Pact of Steel"
 GER_ITA_stahlpakt_desc:0 "Pact of steel. Ideology to move our brother Italians to better days"
 GER_swedish_tungston:0 "Swedish Tungsten Treaty"
 GER_swedish_tungston_desc:0 "We want to expand our trade agreement with our old friend Sweden"
 GER_coup_on_aus:0 "Orchestrate a Coup in Austria"
 GER_coup_on_aus_desc:0 "Kurt doesnt a good leader. Start a coup prepared. Save the austrians."
 GER_war_with_ireland:0 "Operation Green"
 GER_war_with_ireland_desc:0 "Launch operation green."
 GER_ally_ireland:0 "Alliance with Ireland"
 GER_ally_ireland_desc:0 "The Irish may have ambitions for the British. Why not?"
 GER_plan_sealion:0 "Operation Sea Lion"
 GER_plan_sealion_desc:0 "Operation Sea Lion, also written as Operation Sealion, was Nazi Germany's code name for the plan for an invasion of the United Kingdom during the Battle of Britain in the Second World War. Following the Battle of France, Adolf Hitler, the German Führer and Supreme Commander of the Armed Forces, hoped the British government would accept his offer to end the war"
 GER_ally_with_iceland:0 "Befriend Iceland"
 GER_ally_with_iceland_desc:0 "Iceland may also have ambitions over England. Why not?"
 GER_war_with_bal:0 "Invade the Baltics"
 GER_war_with_bal_desc:0 "Protect the Baltic peoples against Soviets."
 GER_war_with_italy:0 "War with Italy"
 GER_war_with_italy_desc:0 "Italy is our most ancient enemy, we have not forgotten what they did to our brother Austrian state in the first world war and we are coming to take revenge."
 GER_war_with_spain:0 "Clean up Iberia"
 GER_war_with_spain_desc:0 "Franco and Salazar friend or death."
