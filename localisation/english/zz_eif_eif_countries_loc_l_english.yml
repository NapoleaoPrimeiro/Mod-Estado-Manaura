 #ALW
 ALW_the_lion_of_allahs_sovereignty_ns:0 "The Lion of Allah's Sovereignty"
 ALW_the_lion_of_allahs_sovereignty_ns_desc:0 "Drawing inspiration from the indomitable spirit of Ali, the Lion of God, our people recognize no master but the Divine. This unyielding commitment to spiritual and physical freedom instills a fierce bravery in our soldiers, ensuring they would rather perish in honor than live in chains. In the face of oppression, we stand as a bastion of justice, as sharp and decisive as the Zulfiqar itself."
 ALW_tradition_of_taqiya_ns:0 "Tradition of Taqiya"
 ALW_tradition_of_taqiya_ns_desc:0 "Through centuries of navigating hostile environments, we have mastered the art of religious and political dissimulation. By veiling our true intentions and blending seamlessly into any landscape, our operatives remain ghosts to the enemy. This legacy of strategic silence and hidden identity ensures that our secrets are never broken, and our presence is never felt until it is too late."
 ALW_change_your_flag:0 "Adopt the New §YAlawite Banner§!"
 ALW_change_your_flag_desc:0 "Our current banners, while rich in history, share a visual palette that causes frequent confusion on the diplomatic stage and within our own administrative ranks. To assert our distinct Alawite heritage and ensure our sovereignty is recognized without ambiguity, we must formalize a unique national flag. This new design will place our specific symbols—the Zulfiqar and our sacred colors—at the forefront, distinguishing our struggle from all others in the region."
 ALW_change_your_flag_tt:0 "Changes our §YNational Flag§! to a distinct design to reflect our unique heritage"
 ALW_ali_ibn_sulayman_al_assad:0 "Ali ibn Sulayman Al-Assad"

 #SOVIET COUNTRIES
 eif_soviet_russian_minority_high_ns:0 "Russian Minorites in Country"
 eif_soviet_russian_minority_high_ns_desc:0 "Our borders may be drawn, but our society remains deeply divided. A significant portion of our population still identifies with the fallen metropole, viewing our independence not as a liberation, but as a temporary fracture. These 'Imperial Residues' hold key positions in our bureaucracy and industry, their loyalties often lying across the border. Until we can achieve a national consensus and prove our stability, their presence remains a ticking time bomb that Moscow could detonate at any moment.\n\n§YIf Stability above %80, this national spirit will be removed§!"

 eif_soviet_russian_minority_medium_ns: "Russian Minorites in Country"
 eif_soviet_russian_minority_medium_ns_desc:0 "Our borders may be drawn, but our society remains deeply divided. A significant portion of our population still identifies with the fallen metropole, viewing our independence not as a liberation, but as a temporary fracture. These 'Imperial Residues' hold key positions in our bureaucracy and industry, their loyalties often lying across the border. Until we can achieve a national consensus and prove our stability, their presence remains a ticking time bomb that Moscow could detonate at any moment.\n\n§YIf Stability above %80, this national spirit will be removed§!"

