 #CIN
 CIN_legacy_of_abreks:0 "Legacy of Abreks"
 CIN_legacy_of_abreks_desc:0 "The Abreks are the lone wolves of the Caucasus; men who have renounced their past to wage a perpetual war for honor and freedom. Their knowledge of the hidden trails and their refusal to surrender make our mountains a deathtrap for any invader."

 #KBK
 KBK_the_knightly_code_of_khabze:0 "Knightly Code of Khabze"
 KBK_the_knightly_code_of_khabze_desc:0 "More than just a law, Adyghe Khabze is the soul of the Circassian people. It dictates honor, hospitality, and a mastery of warfare that has earned them the title of 'Knights of the Caucasus.' From the mountain passes to the Black Sea shores, every Circassian fights with the discipline of an ancient elite."

 #YAK
 YAK_sentinels_of_the_permafrost:0 "Sentinels of the Permafrost"
 YAK_sentinels_of_the_permafrost_desc:0 "In the land of Sakha, the ground never thaws and the spirits of the ancestors guard the taiga. We have learned not only to survive in the world's most brutal cold but to use it as our strongest ally. Any invader who steps into our frozen plains will find that the very air they breathe is a weapon turned against them."

 #TAT
 TAT_iron_heart_of_volga:0 "Iron Heart of Volga"
 TAT_iron_heart_of_volga_desc:0 "As the historic soul of the Idel-Ural, Tatarstan stands as a titan of industry and intellect. From the refineries of Kazan to the strategic banks of the Volga, the Iron Hearth fuels the ambitions of our nation. We are the center of gravity in the East, turning raw resources into the steel of independence."

 #EVE - NEN
 EVE_NEN_silent_stalkers_of_the_taiga:0 "Silent Stalkers of the Taiga"
 EVE_NEN_silent_stalkers_of_the_taiga_desc:0 "From the frozen shores of the Arctic to the deepest reaches of the Siberian forest, the Nenets and Evenks move like shadows. To the outsider, the taiga is a silent, deadly maze; to us, it is a provider. We do not just fight in the wilderness; we are the wilderness. When the wind howls through the trees, it carries our warning—and our arrows"

 #KAR
 KAR_karjalan_armeija:0 "Karjalan Armeija"
 KAR_karjalan_armeija_desc:0 "Born between the Great Lakes and the dense northern woods, the Karelian Army is a force forged in the taiga. Utilizing the natural labyrinth of our homeland, our soldiers are experts in delaying superior forces through hit-and-run tactics and unyielding forest defense. To attack Karelia is to fight the trees themselves."

 #ALT
 ALT_heart_of_the_turks:0 "Heart of the Turks"
 ALT_heart_of_the_turks_desc:0 "Hidden within the majestic peaks of the Altai lies the cradle of our civilization. It is here, according to the ancient legends, that the grey wolf led our ancestors to freedom. As the sacred heart of the Turkic world, the Altai is more than just territory; it is a spiritual fortress that fuels the resolve of every soldier and calls out to our brothers across the steppes."

 #DON - KUB
 KUB_DON_cossack_host_tradition:0 "Cossack Host Tradition"
 KUB_DON_cossack_host_tradition_desc:0 "The Cossack does not enlist in the army; he is born into it. For centuries, the 'Hosts' of the Don, Kuban, and Terek have lived by the saber, guarding the frontiers of the wild steppes. This tradition is a blend of egalitarian democracy and strict military discipline. Every farm is a barracks, every peasant is a cavalryman, and every Ataman is a father to his men. They fight not for a distant Tsar or a Commissar, but for their land, their faith, and their ancient freedom. When the Cossack Host rides, the very earth trembles under the beat of ten thousand hooves."

 #KAZ
 KAZ_soldiers_of_the_steppe:0 "Soldiers of the Steppe"
 KAZ_soldiers_of_the_steppe_desc:0 "The vastness of Kazakhstan is not a weakness, but a weapon. Like the unstoppable hordes of old, our modern divisions are built for the infinite horizon. We are the Juggernaut of the Steppe; a nation that moves with the weight of steel and the speed of a dust storm. Any army that tries to halt our advance will be swallowed by the dust of the plains and the crushing tracks of our engines."
 
