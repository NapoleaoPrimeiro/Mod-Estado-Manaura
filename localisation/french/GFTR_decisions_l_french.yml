l_french:
# # # # # # # # # # # # # # #
GFTR_categories_settings: "Paramètres"
GFTR_categories_settings_desc: "Bonjour ! Je suis très heureux que vous ayez souscrit au mod §YGeneric Focus Tree: Redux!§! Si mon travail vous plaît, merci de soutenir le mod sur sa page de l’Atelier Steam :) \nVous y trouverez aussi les dernières mises à jour, et vous pourrez me signaler des problèmes ou bugs."
# # # # # # # # # # # # # # #
GFTR_D_set_focus_tree_SHOW: "1. Installer un arbre de focalisation ?"
GFTR_D_set_focus_tree_SHOW_tt: "Ici, vous pouvez installer ou supprimer différents arbres de focalisation pour votre pays et les autres."
GFTR_D_set_focus_tree_HIDE: "1. §RFermer la section§!"
GFTR_D_set_gftr_a: "          1. Installer (GFT: Redux)"
GFTR_D_set_gftr_a_tt: "Le pays actuel recevra ou mettra à jour §YGeneric Focus Tree: Redux§!. \n~~~ \nAttention : si vous remplacez l’arbre de focalisation de pays disposant d’arbres uniques vanilla ou DLC (ex : Allemagne, France, Iran, etc.), vous ne pourrez restaurer leurs arbres d’origine qu’en §Ldémarrant une nouvelle partie§! ou §Lvia la console§!."
GFTR_D_set_gftr_b: "          1. Installer (GFT: Redux) pour l’IA"
GFTR_D_set_gftr_b_tt: "§YGeneric Focus Tree: Redux§! sera installé ou mis à jour sur ABSOLUMENT TOUS les pays contrôlés par l’IA. \n~~~ \n§LAttention§! : cette décision donne le nouvel arbre à tous les pays IA sans exception. §GRecommandé§! uniquement au tout début de la partie, et de préférence après avoir retiré les esprits nationaux et mécaniques spéciales (décisions ci-dessous)."
GFTR_D_set_generic_focus: "          1. Installer l’arbre générique vanilla"
GFTR_D_set_generic_focus_tt: "Le pays actuel recevra ou mettra à jour l’arbre générique §Gvanilla§!.\n~~~ \nCette fonction charge l’arbre vanilla actuel de votre jeu, qui peut avoir été modifié par d’autres gros mods. Dans ce cas, c’est l’arbre modifié qui sera installé."
GFTR_D_deleted_focus_tree: "          1. Supprimer l’arbre de focalisation"
GFTR_D_deleted_focus_tree_tt: "L’arbre de focalisation du pays actuel sera §Rsupprimé§!. Plus précisément, il sera remplacé par un arbre totalement vide (sans aucun focus sauf les « continus »). \n~~~ \nJe ne sais pas vraiment à quoi cela peut servir §YXD§!, mais cela peut légèrement améliorer les performances en rendant un pays « inactif."
GFTR_D_test_focus_tree: "          1. Tester le mod"
GFTR_D_test_focus_tree_tt: "Une copie exacte de §YGeneric Focus Tree: Redux§! sera installée, mais chaque focus ne prendra que 1 jour. \n~~~ \nPrincipalement conçu pour tester le comportement de l’IA rapidement. N’hésitez pas à l’utiliser pour m’aider à repérer des problèmes d’IA. \n~~~ \nPeut aussi être amusant en partie normale."
# # # # # # # # # # # # # # #
GFTR_D_remove_national_spirits_SHOW: "2. Retirer les esprits nationaux ?"
GFTR_D_remove_national_spirits_SHOW_tt: "Ici, vous pouvez retirer divers esprits nationaux de votre pays et des autres."
GFTR_D_remove_national_spirits_HIDE: "2. §RFermer la section§!"
GFTR_D_remove_gftr_national_spirits_a: "          2. Retirer les esprits (GFT: Redux)"
GFTR_D_remove_gftr_national_spirits_a_tt: "Tous les esprits nationaux ajoutés par §YGeneric Focus Tree: Redux§! seront retirés du pays actuel. \n~~~ \nLes esprits techniques ne seront pas touchés."
GFTR_D_remove_gftr_national_spirits_b: "          2. Retirer les esprits (GFT: Redux) de l’IA"
GFTR_D_remove_gftr_national_spirits_b_tt: "Tous les esprits nationaux ajoutés par §YGeneric Focus Tree: Redux§! seront retirés de TOUS les pays contrôlés par l’IA. \n~~~ \nLes esprits techniques ne seront pas touchés. \n~~~ \n§RAttention§! : cela peut provoquer un léger freeze."
GFTR_D_remove_vanilla_national_spirits_a: "          2. Retirer les esprits vanilla"
GFTR_D_remove_vanilla_national_spirits_a_tt: "Tous les esprits nationaux de départ §Gvanilla§! seront retirés du pays actuel ! \n~~~ \nLe jeu n’a pas de fonction simple « tout retirer », donc seule une liste prédéfinie (celle de 1936) est supprimée. Utiliser plus tard n’aura probablement aucun effet. §GRecommandé§! uniquement au tout début de la partie."
GFTR_D_remove_vanilla_national_spirits_b: "          2. Retirer les esprits vanilla de l’IA"
GFTR_D_remove_vanilla_national_spirits_b_tt: "Tous les esprits nationaux de départ §Gvanilla§! seront retirés de TOUS les pays contrôlés par l’IA. \n~~~ \nMême limitations que la décision précédente. §GRecommandé§! uniquement au tout début de la partie. \n~~~ \n§RAttention§! : peut provoquer un léger freeze."
# # # # # # # # # # # # # # #
GFTR_D_remove_unique_mechanics_SHOW: "3. Retirer les mécaniques uniques ?"
GFTR_D_remove_unique_mechanics_SHOW_tt: "Ici, vous pouvez supprimer des mécaniques spéciales, décisions et modificateurs qui gênent quand on remplace les arbres natifs."
GFTR_D_remove_unique_mechanics_HIDE: "3. §RFermer la section§!"
GFTR_D_remove_state_modifier_a: " 3. Retirer les modificateurs d’État"
GFTR_D_remove_state_modifier_a_tt: "Certains modificateurs d’États seront retirés du pays actuel. \n~~~ \n§YModificateurs d’État§! : modificateurs appliqués à certaines provinces seulement (ex : « Décentralisation » en Éthiopie, « Séparatisme kurde » en Turquie). \n~~~ \n§GQuand on remplace§! l’arbre natif d’un pays, ces modificateurs deviennent permanents. Cette décision les supprime. \n~~~ \nPays concernés listés dans « Conditions » ci-dessus. §L(Valable aussi pour la version IA)§! \n~~~ \n§GRecommandé§! au démarrage de la partie."
GFTR_D_remove_state_modifier_b: " 3. Retirer les modificateurs d’État de l’IA"
GFTR_D_remove_state_modifier_b_tt: "Les modificateurs d’État seront retirés des régions possédées par des pays IA. \n~~~ \nVoir la décision précédente pour détails. La possession actuelle n’importe pas. \n~~~ \n§GRecommandé§! uniquement si vous remplacez les arbres natifs de toute l’IA."
GFTR_D_remove_special_mechanics_a: "          3. Retirer les mécaniques spéciales"
GFTR_D_remove_special_mechanics_a_tt: "Les mécaniques spéciales seront retirées du pays actuel. \n~~~ \n§YMécaniques spéciales§! : systèmes uniques gérés uniquement par des focus (ex : Balance des pouvoirs en Éthiopie/Danemark, Paranoia en URSS, Révolte paysanne en Pologne). \n~~~ \n§GQuand on remplace§! l’arbre natif, elles deviennent impossibles à retirer autrement. \n~~~ \nPays concernés listés dans « Conditions » ci-dessus."
GFTR_D_remove_special_mechanics_b: "          3. Retirer les mécaniques spéciales de l’IA"
GFTR_D_remove_special_mechanics_b_tt: "Les mécaniques spéciales seront retirées de certains pays contrôlés par l’IA. \n~~~ \nVoir décision précédente. \n~~~ \n§GRecommandé§! uniquement si vous remplacez les arbres natifs de toute l’IA."
# # # # # # # # # # # # # # #
GFTR_D_ai_management_SHOW: "4. Configurer le comportement de l’IA ?"
GFTR_D_ai_management_SHOW_tt: "Ici, vous contrôlez le comportement des pays gérés par l’IA."
GFTR_D_ai_management_HIDE: "4. §RFermer la section§!"
GFTR_D_ai_political_freedom: "          4. \"Liberté politique\""
GFTR_D_ai_political_freedom_tt: "Toutes les nations IA recevront l’esprit national §Y$GFTR_idea_ai_political_freedom$§!. \n~~~ \nPar défaut dans le mod, l’IA préfère légèrement la branche correspondant à son idéologie actuelle et, en mode historique, ne change jamais d’idéologie ni ne forme d’alliances non-historiques. \n§YLiberté politique§! supprime ces restrictions — l’IA sera plus libre et imprévisible même en mode historique. \n~~~ \nPeu utile en vanilla, mais parfait pour les mods ajoutant beaucoup de pays (ex : §L\"Every State Independent\"§!). \n~~~ \nUtilisez si vous voulez que l’IA choisisse les branches avec probabilité égale ou ignore le mode historique."
GFTR_D_ai_limit: "          4. Limiter l’IA"
GFTR_D_ai_limit_tt: "Le pays actuel recevra l’esprit national §Y$GFTR_idea_ai_limit$§!. \n~~~ \nUtile pour « désactiver » l’IA d’un pays et améliorer les performances (nécessite la console et la commande \"observe\"). \n~~~ \n§GRappel§! : décision ci-dessus pour supprimer totalement l’arbre de focalisation et limiter encore plus."
GFTR_D_ai_madness_mode: "          4. Mode \"Folie\""
GFTR_D_ai_madness_mode_tt: "Toutes les nations IA recevront l’esprit national §Y$GFTR_idea_ai_madness_mode$§!. \n~~~ \n§YMode \"Folie\"§! force l’IA à choisir uniquement les chemins menant à la guerre. Plongez dans le chaos total ! §RAttention§! : ne concerne que les pays ayant §YGeneric Focus Tree: Redux§!."
GFTR_D_remove_management_ideas: "           4. Retirer les esprits techniques"
GFTR_D_remove_management_ideas_tt: "Tous les esprits nationaux techniques ajoutés par ce mod seront retirés de tous les pays."
