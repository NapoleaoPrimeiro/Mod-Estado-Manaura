l_french:
GFTR_E_independence.1.t: "Guerre d’indépendance !"
GFTR_E_independence.1.d: "Notre patience est à bout. C’est notre terre, et c’est nous qui déciderons de son sort comme bon nous semble. Aujourd’hui, nous commençons la lutte contre les envahisseurs et les occupants qui ont foulé notre sol, nous ont imposé leur volonté et leur culture, ont réduit notre peuple en esclavage et ont planté leur drapeau sur notre terre."
GFTR_E_independence.1.a: "Que leur sang coule !"
# # # # # # # # # # # # # # #
GFTR_E_independence.2.t: "Lettre de demande"
GFTR_E_independence.2.d: "Nous avons reçu aujourd’hui une requête officielle de notre État fantoche. Ils exigent une révision de notre influence, souhaitent disposer de leur propre voix en politique étrangère et intérieure et déclarent de fait leur volonté de devenir un pays pleinement indépendant. Pour l’instant, le ton reste mesuré et diplomatique, mais la situation peut basculer en guerre d’un claquement de doigts."
GFTR_E_independence.2.a: "Aucune concession !"
GFTR_E_independence.2.b: "Nous sommes prêts à leur accorder l’indépendance."
GFTR_E_independence.2.c: "Traîtres ! Hors de notre alliance !"
GFTR_E_independence.2.d: "L’armée rétablira l’ordre."
# # # # # # # # # # # # # # #
GFTR_E_independence_response.0.t: "Mauvaises nouvelles"
GFTR_E_independence_response.0.d: "Ce matin a commencé par un coup de poignard dans le dos : notre ancien État fantoche a soudainement proclamé son indépendance et attaqué nos troupes stationnées sur son territoire. Toutes nos tentatives de négociation ont été rejetées."
GFTR_E_independence_response.0.a: "Ils veulent la guerre ? Ils l’auront !"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.1.t: "Refus"
GFTR_E_independence_response.1.d: "Il y a quelques jours, nous avions envoyé une demande d’indépendance, mais nous avons reçu aujourd’hui un refus catégorique. La métropole refuse de nous lâcher et a rejeté toute discussion sur le sujet. La diplomatie est dans une impasse."
GFTR_E_independence_response.1.a: "Il faudra se battre !"
GFTR_E_independence_response.1.b: "Très bien…"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.2.t: "Nous sommes libres !"
GFTR_E_independence_response.2.d: "Bonne nouvelle ! La métropole a officiellement reconnu notre indépendance. Désormais, nous traçons nous-mêmes notre destin. Pour notre peuple, c’est un jour historique qui entrera dans les livres d’histoire."
GFTR_E_independence_response.2.a: "Hourra ! Hourra ! HOURRA !"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.3.t: "Une liberté au goût amer"
GFTR_E_independence_response.3.d: "Nous avons reçu aujourd’hui une réponse ambiguë de la métropole. On nous a accusés de trahison ! Nous avons obtenu notre indépendance, mais l’ancienne métropole a rompu toutes relations diplomatiques avec nous. Nous sommes libres, mais seuls en ces temps troublés. Malgré la dureté des propos, nous avons évité le conflit armé."
GFTR_E_independence_response.3.a: "L’essentiel est que tout se soit terminé pacifiquement."
# # # # # # # # # # # # # # #
GFTR_E_independence_response.4.t: "Guerre d’indépendance"
GFTR_E_independence_response.4.d: "Nos espoirs d’une solution diplomatique à notre assujettissement se sont effondrés aujourd’hui. Après notre récente demande, la métropole a déployé ses troupes à la frontière et se prépare à envahir pour écraser notre aspiration à devenir un État souverain. À partir de cet instant, nous ne luttons plus seulement pour la liberté, mais pour la survie même de notre nation."
GFTR_E_independence_response.4.a: "Nous tiendrons bon !"
# # # # # # # # # # # # # # #
GFTR_E_change_of_power.1.t: "Les élections sont terminées"
GFTR_E_change_of_power.1.d: "Des élections démocratiques honnêtes ont eu lieu dans le pays. Le peuple a fait son choix."
GFTR_E_change_of_power.1.a: "Très bien"
# # # # # # # # # # # # # #
GFTR_E_change_of_power.2.t: "Prise de pouvoir"
GFTR_E_change_of_power.2.d: "Le affrontement attendu n’a pas eu lieu. L’ancien régime a reconnu sa défaite et a remis ses pouvoirs, transférant le contrôle au nouveau régime sans résistance."
GFTR_E_change_of_power.2.a: "Décision sage"
# # # # # # # # # # # # # #
GFTR_E_change_of_power.3.t: "Guerre civile !"
GFTR_E_change_of_power.3.d: "La crise politique a atteint son paroxysme. Le pays s’est divisé en deux camps ennemis et la lutte pour le pouvoir a dégénéré en affrontement armé ouvert."
GFTR_E_change_of_power.3.a: "Nous triompherons"