 FRW_collective_security_faction:0 "Kollektive Sicherheit"
 FRW_political_cat:0 "Innere Angelegenheiten"
 FRW_political_cat_desc:0 "Maßnahmen, um Frankreich im Inneren zu stabilisieren und besser auf einen Krieg vorzubereiten."
 FRW_dec_national_rally:0 "Nationale Kundgebung"
 FRW_dec_national_rally_desc:0 "In den größten Städten werden große öffentliche Kundgebungen abgehalten, um Unterstützung für die Regierung zu gewinnen."
 FRW_dec_war_propaganda:0 "Kampagne zur Landesverteidigung"
 FRW_dec_war_propaganda_desc:0 "Plakate, Wochenschauen und Rundfunksendungen bereiten die Öffentlichkeit auf die Möglichkeit eines Krieges vor."
 FRW_dec_colonial_recruitment:0 "Rekrutierung im Empire"
 FRW_dec_colonial_recruitment_desc:0 "Werbebüros in Nord- und Westafrika verpflichten Freiwillige für die Armee."
 FRW_colonial_purchases_cat:0 "Kolonialkäufe"
 FRW_colonial_purchases_cat_desc:0 "Frankreich bietet anderen Kolonialmächten Gold und politische Unterstützung im Austausch gegen afrikanisches Territorium. Über jedes Angebot entscheidet der Verkäufer; im Mehrspielermodus ist das der Spieler, dem das Land gehört."
 FRW_buy_spanish_morocco:0 "Spanisch-Marokko kaufen"
 FRW_buy_spanish_morocco_desc:0 "Madrid wird französisches Gold im Austausch gegen die Rif-Zone angeboten."
 FRW_buy_ifni_rio_de_oro:0 "Ifni und Río de Oro kaufen"
 FRW_buy_ifni_rio_de_oro_desc:0 "Spaniens Wüstengebiete an der Atlantikküste liegen zwischen Französisch-Marokko und Mauretanien."
 FRW_buy_spanish_guinea:0 "Spanisch-Guinea kaufen"
 FRW_buy_spanish_guinea_desc:0 "Río Muni ist landseitig von Französisch-Äquatorialafrika umschlossen."
 FRW_buy_portuguese_guinea:0 "Portugiesisch-Guinea kaufen"
 FRW_buy_portuguese_guinea_desc:0 "Die portugiesische Kolonie in Westafrika ist fast vollständig von französischem Gebiet umgeben."
 FRW_buy_gambia:0 "Gambia kaufen"
 FRW_buy_gambia_desc:0 "Der schmale britische Streifen entlang des Gambia-Flusses teilt Senegal in zwei Hälften."
 FRW_buy_sierra_leone:0 "Sierra Leone kaufen"
 FRW_buy_sierra_leone_desc:0 "Freetown würde Französisch-Westafrika einen ausgezeichneten Atlantikhafen verschaffen."
 FRW_buy_belgian_congo:0 "Eine Kongo-Konzession kaufen"
 FRW_buy_belgian_congo_desc:0 "Brüssel werden Bedingungen für die Abtretung eines Teils des Kongo an Frankreich angeboten."
 FRW_buy_fezzan:0 "Den Fessan kaufen"
 FRW_buy_fezzan_desc:0 "Der Fessan, Italiens Wüstenhinterland in Libyen, grenzt sowohl an Algerien als auch an den Tschad."
 FRW_union_francaise_cat:0 "Die Französische Union"
 FRW_union_francaise_cat_desc:0 "Das Kolonialreich wird zu einer Union umgestaltet, in der die Protektorate Tunesien und Marokko vollwertige Bestandteile Frankreichs werden."
 FRW_form_union_francaise:0 "Die Französische Union ausrufen"
 FRW_form_union_francaise_desc:0 "Tunesien und Marokko werden zu Kerngebieten Frankreichs."
 FRW_europe_cat:0 "Europäische Föderation"
 FRW_europe_cat_desc:0 "Pläne für ein geeintes Europa unter französischer Führung, ob demokratisch oder sozialistisch."
 FRW_form_european_federation:0 "Die Europäische Föderation gründen"
 FRW_form_european_federation_desc:0 "Die Beneluxländer und das Rheinland werden zu Kerngebieten einer von Frankreich geführten Föderation."
 FRW_grand_empire_cat:0 "Le Grand Empire"
 FRW_grand_empire_cat_desc:0 "Die Wiederherstellung des Kaiserreichs der Franzosen in den Grenzen, die es unter Napoleon besaß."
 FRW_form_grand_empire:0 "Das Grand Empire ausrufen"
 FRW_form_grand_empire_desc:0 "Die Beneluxländer, das Rheinland und das Piemont werden zu Kerngebieten des Kaiserreichs."
 FRW_francia_cat:0 "Das Fränkische Reich"
 FRW_francia_cat_desc:0 "Von Aachen aus herrschte Karl der Große über die Lande zwischen Pyrenäen und Elbe. Frankreich beansprucht, sein rechtmäßiger Erbe zu sein."
 FRW_form_francia:0 "Das Reich Karls des Großen wiederherstellen"
 FRW_form_francia_desc:0 "Erfordert die Kontrolle über Belgien, Holland, das Rheinland, Westfalen und Baden. Diese werden zu Kerngebieten."
 FRW_latin_cat:0 "Das Lateinische Reich"
 FRW_latin_cat_desc:0 "Pläne, Frankreich, Italien und Spanien, die Erben Roms, unter einer einzigen Krone oder Führung zu vereinen."
 FRW_form_latin_empire:0 "Das Lateinische Reich ausrufen"
 FRW_form_latin_empire_desc:0 "Erfordert die Kontrolle über Rom, Madrid und das Piemont. Alle italienischen, spanischen und portugiesischen Kerngebiete in unserem Besitz werden zu unseren Kerngebieten."
 FRW_eurafrique_cat:0 "Die Eurafrikanische Föderation"
 FRW_eurafrique_cat_desc:0 "Pläne, Europa und Afrika in einer einzigen Föderation unter französischer Führung zu vereinen."
 FRW_form_eurafrican_federation:0 "Die Eurafrikanische Föderation gründen"
 FRW_form_eurafrican_federation_desc:0 "Die Sahara, Französisch-Sudan und Guinea werden zu Kerngebieten."
 frw.1.t:0 "Die Krise der Dritten Republik"
 frw.1.d:0 "Seit den Unruhen vom 6. Februar 1934 kommt das Land nicht zur Ruhe. Kabinette kommen und gehen, die Ligen marschieren durch die Straßen, die Kommunisten gewinnen an Boden, und die Wirtschaft stagniert. In den Salons und Kasernen erörtern Offiziere und Politiker offen, was an die Stelle der Republik treten soll."
 frw.1.a:0 "Recht und Ordnung wahren."
 frw.1.b:0 "Wir brauchen entschlossenes Handeln."
 frw.2.t:0 "Die Kommune ist ausgerufen!"
 frw.2.d:0 "Über dem Hôtel de Ville wehen rote Fahnen. In Paris haben Arbeiter, Soldaten und die Kommunistische Partei die Macht ergriffen und anstelle der Republik eine sozialistische Regierung errichtet. Die anderen Hauptstädte Europas erwarten den nächsten Schritt mit Sorge."
 frw.2.a:0 "Ein Gespenst geht um in Europa."
 frw.2.b:0 "Vive la Commune!"
 frw.3.t:0 "Nationale Revolution in Frankreich"
 frw.3.d:0 "Nach wochenlangen Unruhen haben die vereinten Ligen die Regierung gestürzt. Kammer und Senat wurden aufgelöst, und eine nationale Regierung hat die Macht übernommen."
 frw.3.a:0 "Frankreich hat sich verändert."
 frw.3.b:0 "Frankreich erwacht!"
 frw.4.t:0 "Die französischen Kammern vertagt"
 frw.4.d:0 "Unerwartet hat die Regierung Kammer und Senat auf unbestimmte Zeit vertagt. Ein Kabinett „über den Parteien“ führt nun das Land, und noch ist unklar, welches Regime an die Stelle der Republik treten wird."
 frw.4.a:0 "Was kommt als Nächstes?"
 frw.5.t:0 "Das Kaiserreich der Franzosen!"
 frw.5.d:0 "Louis, Prinz Napoléon, ist in Notre-Dame zu Napoleon VI., Kaiser der Franzosen, gekrönt worden. Die Garde ist über die Champs-Élysées paradiert, und die Adler sind auf die Regimentsstandarten zurückgekehrt."
 frw.5.a:0 "Die Geschichte wiederholt sich."
 frw.5.b:0 "Vive l’Empereur!"
 frw.6.t:0 "Ein König in Paris"
 frw.6.d:0 "Henri d’Orléans, Graf von Paris, ist aus dem Exil zurückgekehrt und hat als Heinrich VI. den Thron bestiegen. Frankreich hat zum ersten Mal seit 1848 einen König."
 frw.6.a:0 "Interessant."
 frw.6.b:0 "Vive le Roi!"
 frw.10.t:0 "Frankreich beantragt die Mitgliedschaft"
 frw.10.d:0 "Die französische Regierung hat offiziell um Aufnahme in unser Bündnis ersucht. Frankreich bringt eine große Armee und eine mächtige Flotte mit."
 frw.10.a:0 "Willkommen, Frankreich."
 frw.10.b:0 "Wir lehnen ab."
 frw.11.t:0 "Mitgliedschaft bestätigt"
 frw.11.d:0 "Unser Antrag wurde angenommen, und Frankreich hat nun Verbündete an seiner Seite."
 frw.11.a:0 "Ausgezeichnet."
 frw.12.t:0 "Antrag abgelehnt"
 frw.12.d:0 "Unser Beitrittsantrag wurde abgewiesen. Frankreich wird ohne dieses Bündnis auskommen müssen."
 frw.12.a:0 "Dann stehen wir allein."
 frw.16.t:0 "Ein Bündnisangebot aus Paris"
 frw.16.d:0 "Frankreich hat ein neues Bündnis gegründet und lädt uns zum Beitritt ein."
 frw.16.a:0 "Wir treten bei."
 frw.16.b:0 "Wir bleiben unabhängig."
 frw.17.t:0 "Bündnisangebot angenommen"
 frw.17.d:0 "[From.GetNameDefCap] hat unser Angebot angenommen und tritt dem Bündnis bei."
 frw.17.a:0 "Gemeinsam sind wir stark."
 frw.18.t:0 "Bündnisangebot abgelehnt"
 frw.18.d:0 "[From.GetNameDefCap] hat unser Bündnisangebot abgelehnt."
 frw.18.a:0 "Bedauerlich."
 frw.20.t:0 "Eine Französisch-Britische Union?"
 frw.20.d:0 "Paris schlägt eine Union der beiden Nationen vor, mit gemeinsamen Verteidigungs- und Wirtschaftsministerien, einer gemeinsamen Staatsbürgerschaft und einem einzigen Kriegskabinett."
 frw.20.a:0 "Eine unauflösliche Union."
 frw.20.b:0 "Das geht zu weit."
 frw.21.t:0 "London stimmt zu!"
 frw.21.d:0 "Die britische Regierung hat der Union zugestimmt, und die beiden Weltreiche werden fortan als eines handeln."
 frw.21.a:0 "Vive l’Union!"
 frw.22.t:0 "London lehnt ab"
 frw.22.d:0 "London hält eine Union für verfrüht. Die Entente wird fortbestehen, jedoch nur zu ihren bisherigen Bedingungen."
 frw.22.a:0 "Perfides Albion."
 frw.25.t:0 "Ein französisches Protektorat?"
 frw.25.d:0 "Frankreich bietet an, unsere Schulden zu übernehmen und unsere Sicherheit zu garantieren, unter der Bedingung, dass wir ein französisches Protektorat werden."
 frw.25.a:0 "Wir nehmen an."
 frw.25.b:0 "Unsere Unabhängigkeit ist nicht verhandelbar."
 frw.26.t:0 "Liberia nimmt an"
 frw.26.d:0 "Liberia steht nun unter französischem Schutz."
 frw.26.a:0 "Sehr gut."
 frw.27.t:0 "Liberia lehnt ab"
 frw.27.d:0 "Die liberianische Regierung hat unser Angebot zurückgewiesen."
 frw.27.a:0 "Schade."
 frw.50.t:0 "Ein französisches Kaufangebot"
 frw.50.d:0 "Ein Gesandter aus Paris ist mit einem Angebot eingetroffen. Frankreich möchte an seine afrikanischen Besitzungen grenzendes Kolonialgebiet erwerben und bietet dafür eine großzügige Summe in Gold sowie politische Unterstützung."
 frw.50.a:0 "Wir verkaufen."
 frw.50.b:0 "Dieses Land ist nicht zu verkaufen."
 frw.51.t:0 "Kauf abgeschlossen"
 frw.51.d:0 "Die Verhandlungen waren erfolgreich, und das Gebiet ist nun Teil des französischen Kolonialreichs, auch wenn der Kauf den Haushalt belastet hat."
 frw.51.a:0 "Ein gutes Geschäft."
 frw.52.t:0 "Angebot abgelehnt"
 frw.52.d:0 "Unser Kaufangebot wurde zurückgewiesen. Ein Teil des Geldes ist in die Staatskasse zurückgeflossen."
 frw.52.a:0 "Vielleicht ein andermal."
 frw.60.t:0 "Die Europäische Föderation ist gegründet"
 frw.60.d:0 "In Straßburg wurde die Gründungscharta einer Europäischen Föderation unterzeichnet. Unter französischer Führung sollen die Nationen Westeuropas zu einem einzigen Staat verschmelzen."
 frw.60.a:0 "Ein neues Zeitalter."
 frw.61.t:0 "Le Grand Empire"
 frw.61.d:0 "Der kaiserliche Adler weht wieder von der Nordsee bis zu den Alpen. Napoleons Grand Empire ist wiederhergestellt."
 frw.61.a:0 "Das Vermächtnis des Kaisers."
 frw.62.t:0 "Die Französische Union"
 frw.62.d:0 "Frankreich hat die Französische Union ausgerufen, und Tunesien und Marokko sind nun gleichberechtigte Teile der Republik."
 frw.62.a:0 "Eine neue Ordnung für das Kolonialreich."
 frw.63.t:0 "Das Reich Karls des Großen wiederhergestellt"
 frw.63.d:0 "Im Aachener Dom, wo Karl der Große begraben liegt, hat Frankreich die Wiederherstellung des Fränkischen Reiches ausgerufen. Die Lande zwischen Pyrenäen und Rhein sind wieder vereint."
 frw.63.a:0 "Karolus Magnus wäre stolz."
 frw.64.t:0 "Das Lateinische Reich ausgerufen"
 frw.64.d:0 "Frankreich, Italien und Spanien stehen nun unter einer einzigen Regierung. In Rom wurde das Lateinische Reich ausgerufen, das sich auf die Abstammung von den Cäsaren beruft."
 frw.64.a:0 "Rom erhebt sich erneut."
 frw.65.t:0 "Die Eurafrikanische Föderation"
 frw.65.d:0 "Frankreich hat seine afrikanischen Gebiete zu einer Eurafrikanischen Föderation vereinigt, einem einzigen Staat, der von Dünkirchen bis zum Niger reicht."
 frw.65.a:0 "Eurafrique!"
 frw.70.t:0 "Frankreich fordert die Vereinigung"
 frw.70.d:0 "Die französische Regierung fordert unter Berufung auf gemeinsame Sprache und Geschichte, dass [Root.GetNameDef] mit Frankreich vereinigt wird. Paris hat deutlich gemacht, dass einer Weigerung mit Gewalt begegnet werden könnte."
 frw.70.a:0 "Wir stimmen der Vereinigung zu."
 frw.70.b:0 "Niemals!"
 frw.71.t:0 "Frankreich fordert Gebiete"
 frw.71.d:0 "Frankreich fordert die Abtretung von Grenzbezirken, die es als historisch französisch betrachtet. Sollten wir ablehnen, könnte Paris Gewalt anwenden."
 frw.71.a:0 "Wir treten das Gebiet ab."
 frw.71.b:0 "Keinen Fußbreit unseres Bodens!"
 frw.72.t:0 "Unsere Forderungen angenommen"
 frw.72.d:0 "Unseren Forderungen wurde entsprochen, und französische Truppen überschreiten die neue Grenze, ohne dass ein Schuss fällt."
 frw.72.a:0 "Vive la France!"
 frw.73.t:0 "Vereinigung abgelehnt"
 frw.73.d:0 "[From.GetNameDefCap] hat die Vereinigung mit Frankreich abgelehnt. Der Generalstab hält Pläne bereit, um mit Gewalt zu nehmen, was uns verweigert wurde."
 frw.73.a:0 "Dann nehmen wir es mit Gewalt."
 frw.73.b:0 "Deswegen fangen wir keinen Krieg an."
 frw.74.t:0 "Forderungen abgelehnt"
 frw.74.d:0 "[From.GetNameDefCap] weigert sich, die geforderten Gebiete abzutreten. Die Armee kann sie noch immer einnehmen, wenn die Regierung den Befehl dazu gibt."
 frw.74.a:0 "Auf den Krieg vorbereiten."
 frw.74.b:0 "Lassen wir es dabei – vorerst."
 frw.75.t:0 "Frankreich fordert unsere Gefolgschaft"
 frw.75.d:0 "Paris fordert, dass sich [Root.GetNameDef] unter französischen Schutz stellt und unsere Außenpolitik und unsere Armee Frankreich unterstellt werden. Der französische Botschafter hat durchblicken lassen, dass man sich an eine Weigerung erinnern würde und dass die französische Armee in Bereitschaft steht."
 frw.75.a:0 "Wir nehmen den französischen Schutz an."
 frw.75.b:0 "Wir bleiben souverän!"
 frw.76.t:0 "Schutz abgelehnt"
 frw.76.d:0 "[From.GetNameDefCap] hat unser Schutzangebot zurückgewiesen. Die Regierung muss entscheiden, ob sie ihn mit Gewalt durchsetzen will."
 frw.76.a:0 "Dann werden sie gehorchen lernen."
 frw.76.b:0 "Keinen Krieg wert."
 frw.80.t:0 "Ein geheimes Angebot aus Paris"
 frw.80.d:0 "Unter strengster Vertraulichkeit hat die französische Regierung angeboten, Savoyen und die Alpen an die Eidgenossenschaft abzutreten. Im Gegenzug würden die Schweizer Banken ihre Tresore für die französische Industrie öffnen. Die Angelegenheit liegt nun beim Bundesrat in Bern."
 frw.80.a:0 "Annehmen – die Kantone Savoyen und Alpen treten der Eidgenossenschaft bei."
 frw.80.b:0 "Die Schweiz handelt nicht mit Land."
 frw.81.t:0 "Der Kapitän aus Genf"
 frw.81.d:0 "Er kam mit einem einzigen Koffer und einem polnischen Offizierssäbel am Gare de Lyon an. Malo Kervadec wurde in Genf geboren, als Sohn eines bretonischen Kapitäns aus Saint-Malo und einer polnischen Exilantin aus Krakau, und wuchs zwischen den Kais des Genfersees und den Erzählungen seiner Mutter über ein Land auf, das auf keiner Landkarte mehr verzeichnet war. 1917 trat er in Frankreich der Blauen Armee General Hallers bei, und 1920 stand er an der Weichsel, als die Rote Armee vor Warschau zurückgeschlagen wurde.\n\nSeither hat er für die Privatbanken von Zürich und Genf gearbeitet und ihr Gold durch ein unruhiges Europa bewegt. Nun bringt er dieses Gold nach Paris, überzeugt, dass Polen nur überleben kann, wenn Frankreich stark ist."
 frw.81.a:0 "Volle Fahrt voraus."
 frw.82.t:0 "Der Alpenhandel ist besiegelt"
 frw.82.d:0 "Die Schweiz hat angenommen. Savoyen und die Alpen sind unter Schweizer Verwaltung übergegangen, und Schweizer Gold erreicht bereits die französischen Fabriken."
 frw.82.a:0 "Ein guter Handel."
 frw.83.t:0 "Bern lehnt ab"
 frw.83.d:0 "Der Bundesrat hat unser Angebot abgelehnt. Die Alpen bleiben französisch, und die Öffentlichkeit wird nie erfahren, wie nahe die Regierung daran war, sie wegzugeben."
 frw.83.a:0 "Vielleicht ist es besser so."
 FRW_CORSAIR:0 "Königreich Francia"
 FRW_CORSAIR_DEF:0 "das Königreich Francia"
 FRW_CORSAIR_ADJ:0 "francianisch"
 FRW_corsair_cat:0 "Das Königreich Francia"
 FRW_corsair_cat_desc:0 "Frankreich und die Iberische Halbinsel, vereint unter der Korsarenflagge von Saint-Malo mit Hermelin, Totenkopf und Löwe. Kein Eindringling, der an unseren Küsten landet, wird sie lebend verlassen."
 FRW_form_corsair_empire:0 "Das Königreich Francia ausrufen"
 FRW_form_corsair_empire_desc:0 "Erfordert die Kontrolle über Paris, Madrid, Burgos und Lissabon sowie mehr als 50 % Kriegsunterstützung. Gewährt Kerngebiete auf alle eigenen spanischen und portugiesischen Staaten und den Nationalgeist Le Pavillon Corsaire (+30 % Angriff und Verteidigung auf Kerngebiet)."
 frw.90.t:0 "Intervention in Spanien"
 frw.90.d:0 "Spanien ist in einen Bürgerkrieg gestürzt, und französische Truppen sind entlang der Pyrenäen zusammengezogen. Die Regierung muss nun entscheiden, welche Seite Frankreich unterstützen und welche es zerschlagen helfen wird."
 frw.90.a:0 "Für die Republik – zerschlagt die Nationalisten!"
 frw.90.b:0 "Für die Nationalisten – zerschlagt die Republik!"
 frw.90.c:0 "Für die rechtmäßige Regierung – zerschlagt die Rebellen!"
 frw.92.t:0 "Frankreich fordert die Vereinigung"
 frw.92.d:0 "Französische Divisionen stehen entlang unserer gesamten Grenze, von Galicien bis Andalusien. Paris fordert, dass sich Portugal Frankreich anschließt – auf friedlichem Wege, wie die Note betont. Der Generalstab in Lissabon meldet, dass Widerstand aussichtslos wäre."
 frw.92.a:0 "Wir haben keine Wahl. Portugal schließt sich Frankreich an."
 frw.92.b:0 "Portugal wird kämpfen!"
 frw.93.t:0 "Lissabon lehnt ab"
 frw.93.d:0 "[From.GetNameDefCap] hat die Vereinigung abgelehnt. Unsere Divisionen erwarten den Befehl zum Vormarsch."
 frw.93.a:0 "Dann marschieren wir auf Lissabon."
 frw.93.b:0 "Nicht jetzt."
 frw.95.t:0 "Das Königreich Francia"
 frw.95.d:0 "Vom Ärmelkanal bis Gibraltar weht über den Ministerien eine neue Flagge mit den Lilien Frankreichs und dem Hermelin von Saint-Malo. Frankreich und die Iberische Halbinsel wurden zu einem einzigen Staat ausgerufen, dem Königreich Francia. Der Kapitän aus Saint-Malo hat seinen Offizieren erklärt, dies sei erst der Anfang."
 frw.95.a:0 "Eine neue Macht im Westen."
 frw.95.b:0 "Montjoie Saint-Denis!"
 FRW_leader_corsair:0 "Malo Kervadec"
 FRW_leader_corsair_desc:0 "Malo Kervadec wurde in Genf geboren, als Sohn eines bretonischen Kapitäns aus Saint-Malo und einer polnischen Exilantin. Er kämpfte in Hallers Blauer Armee, schaffte Gold für die Privatbanken Zürichs und segelte, so heißt es, vor den Küsten Afrikas unter der schwarzen Flagge. Er regiert Frankreich, wie ein Korsarenkapitän sein Schiff regiert: nach schriftlichen Artikeln und mit einem Anteil an der Beute für jeden Mann."
 frw.96.t:0 "Frankreich bittet um die Shetlandinseln"
 frw.96.d:0 "Unter Berufung auf die Auld Alliance und die herzlichen Beziehungen zwischen unseren Ländern ersucht Paris die Regierung Seiner Majestät, die Shetlandinseln als Marinestützpunkt an Frankreich abzutreten."
 frw.96.a:0 "Nun gut – der Freundschaft zuliebe."
 frw.96.b:0 "Großbritannien verschenkt seine Inseln nicht."
 frw.97.t:0 "Frankreich bittet um die Highlands"
 frw.97.d:0 "Der französische Botschafter schlägt vor, die schottischen Highlands und Aberdeenshire unter französische Verwaltung zu stellen – zum Gedenken, wie er es ausdrückt, an die Auld Alliance."
 frw.97.a:0 "Wenn es Frankreich an unserer Seite hält ..."
 frw.97.b:0 "Ausgeschlossen."
 frw.98.t:0 "London sagt Nein"
 frw.98.d:0 "[From.GetNameDefCap] hat unser Ersuchen höflich, aber bestimmt abgelehnt."
 frw.98.a:0 "Vielleicht, wenn sie uns mehr mögen."
 FRW_BURGUNDY:0 "Königreich Burgund"
 FRW_BURGUNDY_DEF:0 "das Königreich Burgund"
 FRW_BURGUNDY_ADJ:0 "burgundisch"
 FRW_WESTUNION:0 "Westunion"
 FRW_WESTUNION_DEF:0 "die Westunion"
 FRW_WESTUNION_ADJ:0 "westlich"
 FRW_burgundy_cat:0 "Das burgundische Erbe"
 FRW_burgundy_cat_desc:0 "Im fünfzehnten Jahrhundert besaßen die Valois-Herzöge von Burgund Lande von Dijon bis Amsterdam, die zu den reichsten Europas zählten. Frankreich ist nun in der Lage, sie wieder zu vereinen."
 FRW_form_burgundy:0 "Das Königreich Burgund wiederherstellen"
 FRW_form_burgundy_desc:0 "Erfordert die Kontrolle über Flandern, Holland, Luxemburg, Wallonien und Burgund (nicht kommunistisch). Gewährt Kerngebiete in den Beneluxländern und den Nationalgeist Burgundisches Erbe."
 FRW_western_union_cat:0 "Die Westunion"
 FRW_western_union_cat_desc:0 "Frankreich und die Beneluxländer, verbunden durch eine Zollunion und eine gemeinsame Verteidigung."
 FRW_form_western_union:0 "Die Westunion ausrufen"
 FRW_form_western_union_desc:0 "Erfordert eine demokratische Regierung, mehr als 50 % Stabilität und die Kontrolle über Flandern, Holland, Luxemburg und Wallonien. Gewährt Kerngebiete in den Beneluxländern und den Nationalgeist Die Westunion."
 frw.99.t:0 "Burgund wiedergeboren"
 frw.99.d:0 "Fast fünf Jahrhunderte nachdem Karl der Kühne 1477 bei Nancy gefallen ist, sind die Lande zwischen Rhein und Somme wieder vereint, diesmal unter Paris. Das Königreich Burgund ist ausgerufen worden."
 frw.99.a:0 "Das Goldene Zeitalter kehrt zurück."
 frw.100.t:0 "Die Westunion"
 frw.100.d:0 "Frankreich und die Beneluxländer haben in Brüssel den Vertrag über die Westunion unterzeichnet. Er sieht einen gemeinsamen Markt und eine integrierte Armee für die Demokratien Westeuropas vor, mit einem gemeinsamen Parlament, das beide beaufsichtigt."
 frw.100.a:0 "Ein neuer Anfang."
 FRW_ETERNAL:0 "Ewiges Königreich Francia"
 FRW_ETERNAL_DEF:0 "das Ewige Königreich Francia"
 FRW_ETERNAL_ADJ:0 "Francianisch"
 FRW_leader_admiral_king:0 "Aymeric Kervadec"
 FRW_leader_admiral_king_desc:0 "Aymeric Kervadec wurde 1894 in Genf geboren und wuchs an Bord der Schiffe seines Vaters auf, die zwischen den Schweizer Banken und den Häfen von Tanger und Danzig verkehrten. 1920 gehörte er zu den ersten Offizieren der neuen polnischen Marine und erlernte sein Handwerk in den kalten Gewässern vor Gdingen. Später befehligte er die Flotte, die die Armeen seines Vaters nach Lissabon und Leith brachte. In Reims als Aymeric I. gekrönt, ist er beim Volk als „le Roi-Amiral“ bekannt. Anders als sein Vater zieht er Verträge den Raubzügen vor, und er will eine Dynastie, die ihn überdauert. Er hat noch nie eine Seeschlacht verloren."
 FRW_admiral_king:0 "Le Roi-Amiral"
 frw.101.t:0 "Das Ewige Königreich Francia"
 frw.101.d:0 "In der Kathedrale von Reims ist Admiral Aymeric Kervadec, Sohn des verstorbenen „Corsaire Noir“, zu Aymeric I., König der Franken, gekrönt worden. Frankreich und seine Eroberungen wurden zum Ewigen Königreich Francia ausgerufen, unter einer neuen Flagge mit den Lilien, dem königlichen Wappen und dem Kreuz der Kreuzfahrer.\n\nIn seiner ersten Rede versprach der König, das Werk seines Vaters zu vollenden. Frankreich, so sagte er, müsse so stark werden, dass nie wieder ein Feind seinen Boden betrete, und Polen dürfe nie wieder allein gelassen werden."
 frw.101.a:0 "Eine neue Krone in Europa."
 frw.101.b:0 "Pro Rege et Patria!"
 frw.84.t:0 "Ein Brief aus Genf"
 frw.84.d:0 "Seit Monaten herrscht im Élysée Schweigen. Dann trifft ein Brief auf schwerem Papier ein, mit dem Wasserzeichen einer Genfer Privatbank und in altmodischer Handschrift verfasst.\n\n„Messieurs, Frankreich treibt dahin, und ein Schiff ohne Kapitän endet auf den Klippen. Ich habe Schiffe, und ich habe Gold. Ich habe einst für eine Nation gekämpft, die von der Landkarte getilgt worden war, und ich weiß, was es kostet, sein Land zu verlieren. Lassen Sie nach mir schicken, und ich werde kommen.\n\nM. Kervadec, Capitaine“\n\nIn Paris kennt niemand den Namen. In Zürich ist er wohlbekannt.\n\n§GEine neue Entscheidung ist verfügbar: Kapitän Kervadec gewinnen.§!"
 frw.84.a:0 "Vielleicht sollten wir ihm antworten."
 frw.102.t:0 "Le Corsaire Noir est mort"
 frw.102.d:0 "Malo Kervadec ist auf See gestorben. In einer stürmischen Nacht vor Gdingen versagte sein Herz an Bord des Schiffes, das zwanzig Jahre lang sein Gold und seine Armeen getragen hatte. Seine Offiziere berichten, seine letzten Worte seien polnisch gewesen.\n\nSein Sarg ist in der Kathedrale von Saint-Malo aufgebahrt, bewacht von französischen Marineinfanteristen und polnischen Matrosen, die aus Gdingen gekommen sind, um ihn heimzugeleiten. Ein Regentschaftsrat wird Frankreich bis zur Krönung regieren. Sein Sohn, Admiral Aymeric Kervadec, ist auf dem Weg nach Reims."
 frw.102.a:0 "Ruhe auf See, Kapitän."
 FRW_req_european_federation_tt:0 "§gErfordert die Kontrolle über §YBelgien§!, die §YNiederlande§! und §YLuxemburg§! sowie §YItalien§! oder §YDeutschland§! (annektiert oder als Satelliten, sofern nicht anders angegeben). Kontrolliert Frankreich sie noch nicht, wird die Nation automatisch gegründet, sobald dies der Fall ist.§!"
 FRW_req_western_union_tt:0 "§gErfordert die Kontrolle über §YBelgien§!, die §YNiederlande§! und §YLuxemburg§! (annektiert oder als Satelliten, sofern nicht anders angegeben). Kontrolliert Frankreich sie noch nicht, wird die Nation automatisch gegründet, sobald dies der Fall ist.§!"
 FRW_req_latin_empire_tt:0 "§gErfordert die Kontrolle über §YItalien§!, §YSpanien§! und §YPortugal§! (annektiert oder als Satelliten, sofern nicht anders angegeben). Kontrolliert Frankreich sie noch nicht, wird die Nation automatisch gegründet, sobald dies der Fall ist.§!"
 FRW_req_eurafrica_tt:0 "§gErfordert die Kontrolle über Französisch-Nordafrika (§YAlgerien§!, §YMarokko§! und §YTunesien§!) – militärische Kontrolle genügt. Kontrolliert Frankreich sie noch nicht, wird die Nation automatisch gegründet, sobald dies der Fall ist.§!"
 FRW_req_francia_tt:0 "§gErfordert die Kontrolle über das §YRheinland§!, §YMoselland§!, §YBelgien§! und die §YNiederlande§! (annektiert oder als Satelliten, sofern nicht anders angegeben). Kontrolliert Frankreich sie noch nicht, wird die Nation automatisch gegründet, sobald dies der Fall ist.§!"
 FRW_req_burgundy_tt:0 "§gErfordert die Kontrolle über ganz §YBelgien§!, die §YNiederlande§! und §YLuxemburg§! (annektiert, nicht als Satelliten). Kontrolliert Frankreich sie noch nicht, wird die Nation automatisch gegründet, sobald dies der Fall ist.§!"
 FRW_req_grand_empire_tt:0 "§gErfordert die Kontrolle über den §YRhein§! (Rheinland, Moselland), §YPiemont§!, §YBelgien§! und die §YNiederlande§! (annektiert oder als Satelliten, sofern nicht anders angegeben). Kontrolliert Frankreich sie noch nicht, wird die Nation automatisch gegründet, sobald dies der Fall ist.§!"
 FRW_plunder_cat_desc:0 "Jede Nation, die sich Frankreich unterworfen hat, sei es als Satellit oder nach ihrer Kapitulation, verwahrt Gold in ihrer Zentralbank. Der Kapitän aus Saint-Malo gedenkt es einzusammeln."
 FRW_seize_the_treasury:0 "Die Staatskasse von [FROM.GetName] beschlagnahmen"
 FRW_seize_the_treasury_desc:0 "Die Goldreserven von [FROM.GetNameDef] werden auf französische Schiffe verladen.\n\nFrankreich: §G+75§! politische Macht, eine §GZivilfabrik§! und §YKorsarengold§! für 180 Tage.\n[FROM.GetNameDefCap]: §RGeplünderte Staatskasse§! für 365 Tage. Jedes Land kann einmal pro Jahr geplündert werden."
 FRW_corsair_gold_desc:0 "Beschlagnahmtes Gold fließt in die königliche Schatzkammer."
 FRW_plundered_treasury_desc:0 "Französische Korsaren haben unsere Goldreserven fortgeschafft."
 FRW_saint_malo_shipyards_desc:0 "Die Werften des alten Korsarenhafens bauen wieder Schiffe, und zwar schneller als je zuvor in ihrer Geschichte."
 FRW_prize_economy_desc:0 "Das Geld aus erbeuteten Prisen fließt in Fabriken und Werkzeugmaschinen."
 FRW_econ_dirigiste_2_desc:0 "Der Plan erfasst nun jede Region, und neue Fabriken entstehen dort, wo die Planer es bestimmen."
 FRW_econ_dirigiste_3_desc:0 "Die Wirtschaft ist vollständig durchgeplant, vom Kohlepreis bis zur Produktion jeder einzelnen Fabrik."
 FRW_econ_liberal_1_desc:0 "Privatkapital und offene Märkte treiben die französische Industrie an."
 FRW_econ_liberal_2_desc:0 "Investoren und Ingenieure konkurrieren um Aufträge, und Frankreich streicht den Gewinn ein."
 FRW_econ_liberal_3_desc:0 "Kredit ist billig, und die Auftragsbücher der französischen Firmen sind voll."
 FRW_econ_rearmament_1_desc:0 "Jeder entbehrliche Franc fließt in die Arsenale."
 FRW_econ_rearmament_2_desc:0 "Die Rüstungsproduktion hat Vorrang vor allen anderen Industriezweigen."
 FRW_econ_rearmament_3_desc:0 "Frankreich ist zu einem einzigen großen Arsenal geworden."
 FRW_colonial_integration_cat:0 "Koloniale Integration"
 FRW_colonial_integration_cat_desc:0 "Gebiete in Afrika zu besitzen, macht sie noch nicht französisch. Diese Entscheidungen stellen die afrikanischen Ländereien, die Frankreich besitzt, unter eine geordnete Kolonialverwaltung, die aus jedem Staat mehr Soldaten und mehr Ressourcen gewinnt. Nur §YAlgerien§!, seit 1848 französisch, wird zum §GKerngebiet§!; mit dem Fokus §YAlgerien ist Frankreich§! folgen die überseeischen Départements. Die Entscheidungen können erneut genutzt werden, sobald Frankreich weiteres Land in einer Region gewinnt."
 FRW_integrate_maghreb:0 "Französisch-Nordafrika integrieren"
 FRW_integrate_maghreb_desc:0 "Marokko, Tunesien und die algerische Sahara werden nach dem Vorbild von Algier und Oran in Départements gegliedert.\n\nStellt alle Staaten dieser Region, die Frankreich besitzt, unter §YKolonialverwaltung§!. §YAlgerien§! wird zum §GKerngebiet§!."
 FRW_integrate_aof:0 "Französisch-Westafrika integrieren"
 FRW_integrate_aof_desc:0 "Von Dakar bis Niamey gilt in der AOF nun französisches Zivilrecht, und ihre Bewohner werden Staatsbürger.\n\nStellt alle Staaten dieser Region, die Frankreich besitzt, unter §YKolonialverwaltung§!."
 FRW_integrate_aef:0 "Französisch-Äquatorialafrika integrieren"
 FRW_integrate_aef_desc:0 "Brazzaville, Libreville, Fort-Lamy und das Mandatsgebiet Kamerun werden der direkten Hoheit von Paris unterstellt.\n\nStellt alle Staaten dieser Region, die Frankreich besitzt, unter §YKolonialverwaltung§!."
 FRW_integrate_indian_ocean:0 "Die Gebiete im Indischen Ozean integrieren"
 FRW_integrate_indian_ocean_desc:0 "Madagaskar, Réunion, die Komoren und Dschibuti werden in das überseeische Frankreich eingegliedert.\n\nStellt alle Staaten dieser Region, die Frankreich besitzt, unter §YKolonialverwaltung§!."
 FRW_integrate_spanish:0 "Die ehemaligen spanischen Kolonien integrieren"
 FRW_integrate_spanish_desc:0 "Das Rif, Ifni, Río de Oro und Río Muni gehen endgültig in französische Verwaltung über.\n\nStellt alle Staaten dieser Region, die Frankreich besitzt, unter §YKolonialverwaltung§!."
 FRW_integrate_portuguese:0 "Die ehemaligen portugiesischen Kolonien integrieren"
 FRW_integrate_portuguese_desc:0 "Guinea, Angola, Mosambik und die Atlantikinseln des einstigen portugiesischen Kolonialreichs werden Frankreich angegliedert.\n\nStellt alle Staaten dieser Region, die Frankreich besitzt, unter §YKolonialverwaltung§!."
 FRW_integrate_congo:0 "Den Kongo integrieren"
 FRW_integrate_congo_desc:0 "Belgisch-Kongo wird zusammen mit Ruanda und Burundi an Französisch-Äquatorialafrika angeschlossen.\n\nStellt alle Staaten dieser Region, die Frankreich besitzt, unter §YKolonialverwaltung§!."
 FRW_integrate_libya:0 "Libyen integrieren"
 FRW_integrate_libya_desc:0 "Tripolitanien, die Cyrenaika und der Fessan verschaffen Frankreich nun eine durchgehende Verbindung zwischen Tunesien und dem Tschad.\n\nStellt alle Staaten dieser Region, die Frankreich besitzt, unter §YKolonialverwaltung§!."
 FRW_integrate_british_west:0 "Britisch-Westafrika integrieren"
 FRW_integrate_british_west_desc:0 "Gambia, Sierra Leone und Nigeria werden der AOF angegliedert.\n\nStellt alle Staaten dieser Region, die Frankreich besitzt, unter §YKolonialverwaltung§!."
 FRW_integrate_african_territories:0 "Die überseeischen Départements"
 FRW_integrate_african_territories_desc:0 "Algerien, die Antillen, Guayana und Réunion werden zu Départements Frankreichs wie alle anderen. Das übrige Afrika wird unter Kolonialverwaltung gestellt."
 RULE_FRW_FRANCE_AI:0 "Frankreich (France Rework)"
 RULE_FRW_FRANCE_AI_HISTORICAL:0 "Historisch"
 RULE_FRW_FRANCE_AI_HISTORICAL_DESC:0 "Frankreich bleibt eine Demokratie, meist unter der Volksfront. Empfohlen."
 RULE_FRW_FRANCE_AI_DEMOCRATIC:0 "Demokratisch"
 RULE_FRW_FRANCE_AI_DEMOCRATIC_DESC:0 "Frankreich folgt einem der demokratischen Pfade (Blum oder Reynaud/de Gaulle)."
 RULE_FRW_FRANCE_AI_COMMUNIST:0 "Kommunistisch"
 RULE_FRW_FRANCE_AI_COMMUNIST_DESC:0 "Frankreich folgt einem der kommunistischen Pfade (Thorez oder Pivert)."
 RULE_FRW_FRANCE_AI_FASCIST:0 "Faschistisch"
 RULE_FRW_FRANCE_AI_FASCIST_DESC:0 "Frankreich folgt einem der faschistischen Pfade (La Rocque oder Doriot)."
 RULE_FRW_FRANCE_AI_NONALIGNED:0 "Blockfrei"
 RULE_FRW_FRANCE_AI_NONALIGNED_DESC:0 "Frankreich folgt einem der blockfreien Pfade (Pétain, Orléans oder die Bonapartes)."
 RULE_FRW_FRANCE_AI_RANDOM:0 "Zufällig"
 RULE_FRW_FRANCE_AI_RANDOM_DESC:0 "Die KI wählt mit gleicher Wahrscheinlichkeit eine der vier Ideologien."
 FRW_shortcut_democratic:0 "Demokratische Pfade"
 FRW_shortcut_communist:0 "Kommunistische Pfade"
 FRW_shortcut_fascist:0 "Faschistische Pfade"
 FRW_shortcut_nonaligned:0 "Blockfreie Pfade"
 FRW_shortcut_secret:0 "Geheimer Pfad"
 FRW_shortcut_economy:0 "Wirtschaft"
 FRW_shortcut_military:0 "Militär"
 FRW_shortcut_diplomacy:0 "Diplomatie"
 FRW_shortcut_colonies:0 "Kolonialreich"
 FRW_plunder_cat:0 "Kriegsbeute"
 FRW_econ_dirigiste_1_desc:0 "Der Staat stellt Investitionspläne auf und lenkt die Schlüsselindustrien."
 FRW_union_francaise_formed_desc:0 "Die Kolonien von Dakar bis Saigon sind nun Mitglieder einer einzigen Französischen Union."
 FRW_european_federation_desc:0 "Ein föderales Europa unter französischer Führung, mit einem Binnenmarkt und einem gemeinsamen Parlament."
 FRW_western_union_idea_desc:0 "Die Demokratien Westeuropas teilen einen gemeinsamen Markt und eine gemeinsame Armee."
 FRW_latin_empire_idea_desc:0 "Mare Nostrum. Die lateinischen Flotten beherrschen das Mittelmeer."
 FRW_eurafrican_federation_idea_desc:0 "Europa und Afrika bilden einen einzigen Wirtschaftsraum, der von Paris aus gelenkt wird."
 FRW_francia_idea_desc:0 "Als Erbe Karls des Großen herrscht der König von den Pyrenäen bis zum Rhein."
 FRW_burgundy_idea_desc:0 "Die reichen Provinzen des alten burgundischen Staates sind wieder vereint."
 FRW_grand_empire_idea_desc:0 "Napoleons Europa ist wiederhergestellt, und die Grande Armée ist erneut auf dem Marsch."
 FRW_franco_british_union_spirit_desc:0 "Frankreich und Großbritannien haben ihre beiden Weltreiche zu einer einzigen Union verschmolzen."
 FRW_drapeau_noir_desc:0 "Unter der schwarzen Flagge der Korsaren verteidigen unsere Soldaten jeden Fußbreit heimatlichen Bodens."
 FRW_eternal_kingdom_spirit_desc:0 "Die Krone ist wiederhergestellt, und der König, der sie trägt, hat noch nie eine Seeschlacht verloren."
 FRW_decolonisation_cat:0 "Die antikoloniale Revolution"
 FRW_decolonisation_cat_desc:0 "Eine Arbeiterrepublik kann andere Völker nicht mit Gewalt beherrschen. Jede befreite Kolonie wird zu einem sozialistischen Verbündeten und hebt das Ansehen der Kommune bei den Kolonialvölkern in aller Welt.\n\nJede Befreiung stärkt §YBrudervölker§! um eine Stufe (bis zu drei)."
 FRW_free_north_africa:0 "Nordafrika befreien"
 FRW_free_north_africa_desc:0 "Marokko, Tunesien und Algerien werden unabhängige sozialistische Republiken, verbündet mit der Französischen Kommune.\n\nEntlässt sie als §Ykommunistische Satelliten§! (nur dort, wo Frankreich ihr Gebiet hält) und stärkt §YBrudervölker§!."
 FRW_free_west_africa:0 "Westafrika befreien"
 FRW_free_west_africa_desc:0 "Die Gebiete der AOF vom Senegal bis zum Niger und das Mandatsgebiet Togo wählen eigene Räte und verlassen das Kolonialreich.\n\nEntlässt sie als §Ykommunistische Satelliten§! (nur dort, wo Frankreich ihr Gebiet hält) und stärkt §YBrudervölker§!."
 FRW_free_equatorial_africa:0 "Äquatorialafrika befreien"
 FRW_free_equatorial_africa_desc:0 "Tschad, Kamerun, Gabun, Mittelkongo und Ubangi-Schari werden zu freien Republiken ausgerufen.\n\nEntlässt sie als §Ykommunistische Satelliten§! (nur dort, wo Frankreich ihr Gebiet hält) und stärkt §YBrudervölker§!."
 FRW_free_indian_ocean:0 "Madagaskar und Dschibuti befreien"
 FRW_free_indian_ocean_desc:0 "Madagaskar und die Küste von Dschibuti gehen in die Hände ihrer eigenen Völker über.\n\nEntlässt sie als §Ykommunistische Satelliten§! (nur dort, wo Frankreich ihr Gebiet hält) und stärkt §YBrudervölker§!."
 FRW_free_indochina:0 "Indochina befreien"
 FRW_free_indochina_desc:0 "Mit französischer Unterstützung übernehmen die indochinesischen Kommunisten die Macht in Hanoi, Phnom Penh und Vientiane.\n\nEntlässt sie als §Ykommunistische Satelliten§! (nur dort, wo Frankreich ihr Gebiet hält) und stärkt §YBrudervölker§!."
 FRW_free_levant:0 "Die Levante befreien"
 FRW_free_levant_desc:0 "Die Mandate über Syrien und den Libanon enden, und Damaskus und Beirut regieren sich nun selbst.\n\nEntlässt sie als §Ykommunistische Satelliten§! (nur dort, wo Frankreich ihr Gebiet hält) und stärkt §YBrudervölker§!."
 FRW_european_community_faction:0 "Europäische Gemeinschaft"
 FRW_neutral_bloc_faction:0 "Lateinischer Neutralitätsblock"
 frw.120.t:0 "Frankreich schlägt einen neutralen Block vor"
 frw.120.d:0 "Der Gesandte des Marschalls hat einen Vorschlag aus Paris überbracht. Die lateinischen Nationen, sagt er, sollten zusammenstehen und sich aus dem kommenden Krieg zwischen Berlin, London und Moskau heraushalten. Frankreich bietet eine gemeinsame Verteidigung an und verlangt nichts weiter."
 frw.120.a:0 "Wir nehmen an."
 frw.120.b:0 "Wir stehen lieber allein."
 frw.121.t:0 "Die Europäische Föderation"
 frw.121.d:0 "Paris fordert die Mitglieder der Europäischen Gemeinschaft auf, den letzten Schritt hin zu einer Bundesregierung mit einer einzigen Armee und Währung zu tun. Unsere Minister säßen in Paris, und unsere Flagge hinge neben den anderen in der Bundesversammlung."
 frw.121.a:0 "Wir treten der Föderation bei."
 frw.121.b:0 "Wir bewahren unsere Souveränität."
 FRW_imperial_redoubt_desc:0 "Sollte das französische Mutterland fallen, wird die Regierung den Krieg von Nordafrika aus fortsetzen."
 FRW_imperial_redoubt_2_desc:0 "Jede Kolonie wurde befestigt und ihre Garnison in Alarmbereitschaft versetzt."
 FRW_marshals_france_desc:0 "Disziplin im Inneren und Frieden hinter gut bewaffneten Grenzen."
 FRW_continental_empire_spirit_desc:0 "Das Reich erstreckt sich vom Atlantik bis zur Weichsel und zum Nil."
 FRW_free_france_spirit_desc:0 "Die Regierung setzt den Krieg von den Kolonien aus fort, bis Paris befreit ist."
 FRW_brazzaville_spirit_desc:0 "In Brazzaville wurde den Kolonien für die Zeit nach dem Krieg ein neuer Platz in der französischen Gemeinschaft versprochen."
 FRW_liberation_spirit_desc:0 "Paris ist befreit, und die Regierung ist in die Hauptstadt zurückgekehrt."
 FRW_european_partner_desc:0 "Die Mitgliedschaft in der Europäischen Gemeinschaft öffnet französischen Unternehmen und Wissenschaftlern ausländische Märkte und Labore."
 FRW_european_market_desc:0 "Waren zirkulieren nun frei zwischen den Mitgliedstaaten der Gemeinschaft."
 FRW_fraternal_peoples_desc:0 "Die befreiten Kolonien stehen an der Seite der Kommune."
 FRW_fraternal_peoples_2_desc:0 "Die befreiten Kolonien stehen an der Seite der Kommune."
 FRW_fraternal_peoples_3_desc:0 "Die befreiten Kolonien stehen an der Seite der Kommune."
 FRW_diplomatic_overture:0 "Französische diplomatische Annäherung"
 FRW_royal_ties:0 "Bindungen an die französische Krone"
 FRW_fascist_friendship:0 "Faschistische Freundschaft"
 FRW_lend_lease_spirit_desc:0 "Amerikanische Ausrüstung erreicht die Freien Franzosen über Großbritannien."
 FRW_resistance_spirit_desc:0 "Die Widerstandsnetze im besetzten Frankreich berichten nach London."
 FRW_provisional_government_spirit_desc:0 "Die Republik besteht im Exil fort und bereitet ihre Rückkehr vor."
 FRW_fight_on_spirit_desc:0 "Der Waffenstillstand wird nicht anerkannt. Jeder Soldat der Freien Franzosen kämpft, als hinge Frankreichs Schicksal allein von ihm ab."
 FRW_oath_of_kufra_desc:0 "In Kufra schworen Leclercs Männer, die Waffen nicht niederzulegen, bevor die Fahne über Straßburg weht."
 FRW_liberation_cat:0 "Der Befreiungskrieg"
 FRW_liberation_cat_desc:0 "Sobald die Freien Franzosen die wichtigsten Regionen ihres Landes halten, können sie dem Besatzer einen Frieden entlang der aktuellen Frontlinie anbieten oder für den Rest weiterkämpfen."
 FRW_liberation_metropole:0 "Frieden anbieten: Französisches Mutterland"
 FRW_liberation_metropole_desc:0 "Erfordert die Kontrolle über §YParis§!, §YPas-de-Calais§!, §YElsass-Lothringen§!, §YAquitanien§! und §YMarseille§!."
 FRW_liberation_africa:0 "Frieden anbieten: Nordafrika"
 FRW_liberation_africa_desc:0 "Erfordert die Kontrolle über §YAlgerien§!, §YTunesien§! und §YMarokko§!."
 frw.130.t:0 "Der Besatzer ersucht um Bedingungen"
 frw.130.d:0 "Da das Kernland Frankreichs wieder unter der Trikolore steht, treffen die Gesandten des Feindes in unserem Hauptquartier ein. Sie schlagen einen Waffenstillstand entlang der aktuellen Frontlinie vor. Unsere Generäle glauben, auch der Rest des Landes ließe sich einnehmen, wenn auch zu einem Preis."
 frw.130.a:0 "Den Frieden unterzeichnen."
 frw.130.a.tt:0 "Jeder §YStaat mit französischem Kerngebiet§!, den Frankreich kontrolliert, wird wieder französisch.\n§YWeißer Frieden§! mit jedem Feind, der einen davon besaß. Die Hauptstadt kehrt nach §YParis§! zurück, sofern Frankreich es hält."
 frw.130.b:0 "Weiterkämpfen, bis Frankreich frei ist."
 frw.130.b.tt:0 "Der Krieg geht weiter. §YWir kämpfen weiter§! für 180 Tage (falls nicht bereits aktiv). Das Angebot kann in 90 Tagen erneut unterbreitet werden."
 FRW_latin_destiny_spirit_desc:0 "Korsika, Sardinien und die provenzalische Küste sichern Frankreich das westliche Mittelmeer."
 FRW_leader_alfonso_desc:0 "Alfons von Bourbon verließ Madrid im April 1931, ohne abzudanken. Als ranghöchster männlicher Erbe Ludwigs XIV. ist er für die französischen Legitimisten König Alphonse I. von Frankreich und Navarra."
 FRW_legitimist_party:0 "Legitimisten"
 FRW_legitimist_party_long:0 "Royalistische Legitimistische Union"
 FRW_bourbon_pact_faction:0 "Bourbonischer Familienpakt"
 FRW_BOURBON:0 "Königreich Frankreich und Spanien"
 FRW_BOURBON_DEF:0 "das Königreich Frankreich und Spanien"
 FRW_BOURBON_ADJ:0 "Französisch-Spanisch"
 FRW_legitimist_crown_desc:0 "Zum ersten Mal seit 1830 regiert die ältere Linie der Bourbonen in Frankreich."
 FRW_legitimist_crown_2_desc:0 "Kirche und Krone stützen einander in beiden Königreichen."
 FRW_two_crowns_spirit_desc:0 "Frankreich und Spanien teilen sich einen König, einen Flottenplan und ihre Rüstungsfabriken."
 FRW_bourbon_partner_desc:0 "Spanien profitiert von seinem Bündnis mit dem bourbonischen König von Frankreich."
 FRW_grand_siecle_desc:0 "Ein Bourbone herrscht vom Ärmelkanal bis Gibraltar, wie zu Zeiten des Sonnenkönigs."
 FRW_double_monarchy_idea_desc:0 "Frankreich und Spanien sind ein Königreich unter einem bourbonischen König."
 FRW_req_bourbon_tt:0 "§gErfordert die Kontrolle über §YMadrid§! (annektiert oder als Satellit). Kontrolliert Frankreich es noch nicht, wird das Königreich automatisch gegründet, sobald dies der Fall ist.§!"
 frw.140.t:0 "Der König von Frankreich beansprucht Spanien"
 frw.140.d:0 "Der bourbonische König in Paris erinnert Madrid daran, dass er nie auf den spanischen Thron verzichtet hat. Er fordert Spanien auf, ihn erneut als seinen König anzuerkennen. Eine Annahme würde Spanien unter französischen Schutz stellen; eine Ablehnung könnte Krieg bedeuten."
 frw.140.a:0 "Es lebe der König."
 frw.140.b:0 "Spanien wird sich nicht von Paris aus regieren lassen."
 frw.141.t:0 "Ein Bourbonenkönig in Paris"
 frw.141.d:0 "Die Legitimisten haben Alfons von Bourbon, den exilierten König von Spanien, zum König von Frankreich ausgerufen. Der orléanistische Thronprätendent hat aus Brüssel protestiert, und in Madrid beobachtet die republikanische Regierung die Lage mit Sorge."
 frw.141.a:0 "Zwei Throne, ein König?"
 frw.142.t:0 "Die Kronen Frankreichs und Spaniens vereint"
 frw.142.d:0 "Mehr als zwei Jahrhunderte nachdem der Frieden von Utrecht es verboten hatte, sind Frankreich und Spanien unter einem einzigen bourbonischen König vereint. Das neue Königreich erstreckt sich von Dünkirchen bis Cádiz."
 frw.142.a:0 "Es gibt keine Pyrenäen mehr."
 frw.143.t:0 "Spanien erkennt den König an"
 frw.143.d:0 "Madrid hat unseren König als König von Spanien anerkannt und das Land unter französischen Schutz gestellt."
 frw.143.a:0 "Vive le Roi! ¡Viva el Rey!"
 frw.144.t:0 "Spanien lehnt den König ab"
 frw.144.d:0 "Madrid hat den Anspruch unseres Königs zurückgewiesen. Die Armee steht an den Pyrenäen bereit."
 frw.144.a:0 "Dann nehmen wir es uns."
 FRW_disjointed_2_desc:0 "Das Kabinettskarussell steht still, doch die Minister misstrauen einander noch immer, und die Verwaltung gehorcht nur langsam."
 FRW_disjointed_3_desc:0 "Die Regierung hat Tritt gefasst. Einige alte Streitigkeiten bleiben."
 FRW_victors_2_desc:0 "Die Armee hat begonnen, die Doktrinen von 1918 zu hinterfragen, doch alte Gewohnheiten verschwinden nur langsam."
 FRW_dec_consolidate_government:0 "Die Regierung festigen"
 FRW_dec_consolidate_government_desc:0 "Die Ministerien von verfeindeten Cliquen säubern und dem Kabinett eine feste Mehrheit verschaffen.\n\nVerfügbar ab §Y1937§!, frühestens §Y6 Monate§! nach Beginn der Reform, bei §Y40 %§! Stabilität: Aus §YEine fragile Regierung§! wird §YEine sich stabilisierende Regierung§!."
 FRW_dec_stable_government:0 "Eine stabile Regierung"
 FRW_dec_stable_government_desc:0 "Die Ministerien führen die Kabinettserlasse ohne Verzögerung aus.\n\nVerfügbar ab §Y1938§!, frühestens §Y6 Monate§! nach dem letzten Schritt, bei §Y50 %§! Stabilität: entfernt §YEine sich stabilisierende Regierung§!."
 FRW_dec_backer_blum:0 "Léon Blum gewinnen"
 FRW_dec_backer_blum_desc:0 "Die Gespräche mit Léon Blum, der SFIO und der Volksfront dauern etwa sechs Wochen. Es kann jeweils nur ein Anführer dieses Lagers umworben werden.\n\nErfordert §Y45 %§! Unterstützung für die Partei und §Y30 %§! Stabilität. Danach kann im Fokusbaum der Pfad von Léon Blum gewählt werden."
 FRW_dec_backer_reynaud:0 "Paul Reynaud gewinnen"
 FRW_dec_backer_reynaud_desc:0 "Die Gespräche mit Paul Reynaud, der Alliance Démocratique und der rechten Mitte dauern etwa sechs Wochen. Es kann immer nur ein Anführer dieses Lagers umworben werden.\n\nErfordert §Y45 %§! Unterstützung für die Partei und §Y30 %§! Stabilität. Danach kann im Fokusbaum der Weg von Paul Reynaud gewählt werden."
 FRW_dec_backer_thorez:0 "Maurice Thorez gewinnen"
 FRW_dec_backer_thorez_desc:0 "Die Gespräche mit Maurice Thorez, der PCF und ihrer Moskauer Linie dauern etwa sechs Wochen. Es kann immer nur ein Anführer dieses Lagers umworben werden.\n\nErfordert §Y35 %§! Unterstützung für die Partei und §Y30 %§! Stabilität. Danach kann im Fokusbaum der Weg von Maurice Thorez gewählt werden."
 FRW_dec_backer_pivert:0 "Marceau Pivert gewinnen"
 FRW_dec_backer_pivert_desc:0 "Die Gespräche mit Marceau Pivert und der Gauche Révolutionnaire dauern etwa sechs Wochen. Es kann immer nur ein Anführer dieses Lagers umworben werden.\n\nErfordert §Y35 %§! Unterstützung für die Partei und §Y30 %§! Stabilität. Danach kann im Fokusbaum der Weg von Marceau Pivert gewählt werden."
 FRW_dec_backer_larocque:0 "François de La Rocque gewinnen"
 FRW_dec_backer_larocque_desc:0 "Die Gespräche mit François de La Rocque, den Croix-de-Feu und der PSF dauern etwa sechs Wochen. Es kann immer nur ein Anführer dieses Lagers umworben werden.\n\nErfordert §Y35 %§! Unterstützung für die Partei und §Y30 %§! Stabilität. Danach kann im Fokusbaum der Weg von François de La Rocque gewählt werden."
 FRW_dec_backer_doriot:0 "Jacques Doriot gewinnen"
 FRW_dec_backer_doriot_desc:0 "Die Gespräche mit Jacques Doriot und der PPF dauern etwa sechs Wochen. Es kann immer nur ein Anführer dieses Lagers umworben werden.\n\nErfordert §Y35 %§! Unterstützung für die Partei und §Y30 %§! Stabilität. Danach kann im Fokusbaum der Weg von Jacques Doriot gewählt werden."
 FRW_dec_backer_petain:0 "Marschall Pétain gewinnen"
 FRW_dec_backer_petain_desc:0 "Die Gespräche mit Marschall Pétain, den Veteranen und der Armee dauern etwa sechs Wochen. Es kann immer nur ein Anführer dieses Lagers umworben werden.\n\nErfordert §Y35 %§! Unterstützung für die Partei und §Y30 %§! Stabilität. Danach kann im Fokusbaum der Weg von Marschall Pétain gewählt werden."
 FRW_dec_backer_orleans:0 "Den Grafen von Paris gewinnen"
 FRW_dec_backer_orleans_desc:0 "Die Gespräche mit dem Grafen von Paris, den Orléanisten und der Action Française dauern etwa sechs Wochen. Es kann immer nur ein Anführer dieses Lagers umworben werden.\n\nErfordert §Y35 %§! Unterstützung für die Partei und §Y30 %§! Stabilität. Danach kann im Fokusbaum der Weg des Grafen von Paris gewählt werden."
 FRW_dec_backer_bonaparte:0 "Prinz Louis Napoléon gewinnen"
 FRW_dec_backer_bonaparte_desc:0 "Die Gespräche mit Prinz Louis Napoléon und den bonapartistischen Komitees dauern etwa sechs Wochen. Es kann immer nur ein Anführer dieses Lagers umworben werden.\n\nErfordert §Y35 %§! Unterstützung für die Partei und §Y30 %§! Stabilität. Danach kann im Fokusbaum der Weg von Prinz Louis Napoléon gewählt werden."
 FRW_dec_backer_legit:0 "Alfons von Bourbon gewinnen"
 FRW_dec_backer_legit_desc:0 "Die Gespräche mit Alfons von Bourbon und den Legitimisten dauern etwa sechs Wochen. Es kann immer nur ein Anführer dieses Lagers umworben werden.\n\nErfordert §Y35 %§! Unterstützung für die Partei und §Y30 %§! Stabilität. Danach kann im Fokusbaum der Weg von Alfons von Bourbon gewählt werden."
