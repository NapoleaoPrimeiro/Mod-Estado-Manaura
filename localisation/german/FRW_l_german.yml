 frw_sys.61.d:0 "Kolonnen des Freien Frankreichs haben mit Unterstützung alliierter Schiffe und Flugzeuge die Hauptstadt der Region erreicht. In Dakar hat der Generalgouverneur die Seiten gewechselt. Der große Hafen, das Schlachtschiff in seinem Becken und die Senegalschützen dienen nun dem Freien Frankreich."
