 FRW_adv_cot:0 "Pierre Cot"
 FRW_adv_cot_desc:0 "Pierre Cot wurde 1933 mit siebenunddreißig Jahren erstmals Luftfahrtminister und half, die Armée de l’Air zu einer eigenständigen Teilstreitkraft zu machen. Er will die Flugzeugfabriken verstaatlichen und eine Generation junger Piloten in volkstümlichen Fliegerclubs ausbilden."
 FRW_trait_cot:0 "Verfechter der Luftmacht"
 FRW_trait_cot_desc:0 "Der junge Radikale, der die Armée de l'Air als eigenständige Teilstreitkraft gründete und die Flugzeugindustrie verstaatlichte."
