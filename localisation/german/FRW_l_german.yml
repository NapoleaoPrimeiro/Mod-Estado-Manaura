l_german:
 # ---------- Fokusse (generiert) ----------
 FRW_crisis_of_the_republic:0 "Die Krise der Dritten Republik"
 FRW_crisis_of_the_republic_desc:0 "Die Unruhen vom 6. Februar 1934 forderten auf der Place de la Concorde fünfzehn Tote und stürzten das Kabinett Daladier. Zwei Jahre später sind sich die Parteien noch immer uneins darüber, welchen Weg das Land einschlagen soll."
 FRW_defend_the_republic:0 "Die Republik verteidigen"
 FRW_defend_the_republic_desc:0 "Die Dritte Republik hat die vier Kriegsjahre von 1914 bis 1918 überstanden. Ihre Verteidiger sind überzeugt, dass sie auch den Ligen und der Wirtschaftskrise standhalten kann."
 FRW_social_truce:0 "Der soziale Burgfrieden"
 FRW_social_truce_desc:0 "Im Juni 1936 besetzen zwei Millionen Arbeiter ihre Fabriken. Die Gewerkschaftsführer und der Arbeitgeberverband werden ins Hôtel Matignon gerufen, und niemand geht, bevor eine Einigung erzielt ist."
 FRW_social_truce_tt:0 "Schützt Frankreich vor dem §Rkommunistischen Aufstand§!, den eine niedrige Stabilität sonst auslösen würde.\nBeendet die §YStreikwelle§!.\nVerfügbar ab §YJuni 1936§!."
 FRW_end_disjointed_government:0 "Das Kabinettskarussell beenden"
 FRW_end_disjointed_government_desc:0 "Seit 1930 hat Frankreich mehr als ein Dutzend Kabinette erlebt, von denen kaum eines länger als ein Jahr hielt. Die Minister haben sich kaum in ihre Ressorts eingearbeitet, da stürzen sie schon."
 FRW_end_disjointed_government_tt:0 "§YZerstrittene Regierung§! wird zu §YEine fragile Regierung§!. Zwei Entscheidungen (ab 1937 und ab 1938, jeweils mindestens 6 Monate auseinander) beseitigen sie vollständig – oder §YEine neue Verfassung§! beendet sie sofort."
 FRW_front_populaire:0 "Die Volksfront"
 FRW_front_populaire_desc:0 "Nach den Wahlen vom Mai 1936 bildet Léon Blum eine Regierung aus Sozialisten und Radikalen, die von den Kommunisten in der Kammer unterstützt wird und sich sozialen Reformen verschrieben hat."
 FRW_front_populaire_tt:0 "Erfordert die Unterstützung von §YLéon Blum§! (Entscheidung §YLéon Blum gewinnen§!, 45 Tage)."
 FRW_union_nationale:0 "Die Nationale Union"
 FRW_union_nationale_desc:0 "Paul Reynaud sammelt die rechte Mitte hinter einem Programm aus ausgeglichenen Haushalten und Aufrüstung."
 FRW_union_nationale_tt:0 "Erfordert die Unterstützung von §YPaul Reynaud§! (Entscheidung §YPaul Reynaud gewinnen§!, 45 Tage)."
 FRW_matignon_reforms:0 "Die Matignon-Abkommen"
 FRW_matignon_reforms_desc:0 "Die Matignon-Abkommen vom Juni 1936 gewähren höhere Löhne und Tarifverhandlungen. Die besetzten Fabriken leeren sich, und die Arbeit wird wieder aufgenommen."
 FRW_nationalize_arms_industry:0 "Die Rüstungsindustrie verstaatlichen"
 FRW_nationalize_arms_industry_desc:0 "Mit dem Gesetz vom August 1936 übernimmt der Staat die wichtigsten Rüstungswerke, und die Kriegsproduktion geht in öffentliche Hand über."
 FRW_conges_payes:0 "Bezahlter Urlaub"
 FRW_conges_payes_desc:0 "Jeder Arbeiter hat nun Anspruch auf zwei Wochen bezahlten Urlaub im Jahr. In diesem Sommer sind die Züge an die Küste voller Familien, die das Meer noch nie gesehen haben."
 FRW_republican_volunteers:0 "Freiwillige für die Republik"
 FRW_republican_volunteers_desc:0 "Französische Freiwillige überqueren die Pyrenäen, um für die Spanische Republik zu kämpfen, und kehren mit harten Erfahrungen im modernen Krieg zurück."
 FRW_plan_de_relance:0 "Der Konjunkturplan"
 FRW_plan_de_relance_desc:0 "Die Regierung startet ein umfangreiches Programm öffentlicher Arbeiten und Investitionen, um Frankreich aus der Depression zu führen."
 FRW_reynaud_rearmament:0 "Reynauds Aufrüstung"
 FRW_reynaud_rearmament_desc:0 "Jahrelang warnte Reynaud die Kammer vor der deutschen Aufrüstung. Im Amt kann er nun umsetzen, was er in der Opposition gefordert hat."
 FRW_decree_laws:0 "Regieren per Dekret"
 FRW_decree_laws_desc:0 "Mit Dekretvollmachten ausgestattet, kann die Regierung Maßnahmen beschließen, ohne auf ein gespaltenes Parlament warten zu müssen."
 FRW_armee_de_metier:0 "Auf dem Weg zur Berufsarmee"
 FRW_armee_de_metier_desc:0 "In „Vers l’armée de métier“ (1934) forderte Oberstleutnant de Gaulle eine Berufsarmee, die auf Panzerdivisionen aufbaut. Reynaud griff die Idee im folgenden Jahr in der Kammer auf. Frankreich schafft eine kleinere Armee aus langdienenden Berufssoldaten."
 FRW_gaullist_presidency:0 "Eine Präsidialrepublik"
 FRW_gaullist_presidency_desc:0 "Charles de Gaulle wird Staatsoberhaupt, mit Befugnissen, die weit über die jedes Präsidenten unter der Verfassung von 1875 hinausgehen."
 FRW_republican_mobilization:0 "Die Republik unter Waffen"
 FRW_republican_mobilization_desc:0 "Im ganzen Land werden Reservisten einberufen, und die Fabriken stellen sich auf die Bedürfnisse der Landesverteidigung um."
 FRW_entente_cordiale:0 "Die Entente cordiale erneuern"
 FRW_entente_cordiale_desc:0 "Die Entente von 1904 hielt vier Jahre an der Westfront. Paris schlägt vor, daraus ein ständiges Bündnis mit London zu machen."
 FRW_entente_cordiale_tt:0 "Frankreich und §YGroßbritannien§! treten einer gemeinsamen Fraktion bei (sofern Großbritannien demokratisch ist):\n- Führt Großbritannien eine Fraktion an, tritt Frankreich ihr bei.\n- Andernfalls gründet Frankreich die §YEntente§!, und Großbritannien tritt bei.\nEin von einem Spieler gesteuertes Großbritannien entscheidet per Ereignis."
 FRW_union_francaise:0 "Die Französische Union"
 FRW_union_francaise_desc:0 "Paris schlägt vor, das Kolonialreich in eine Union assoziierter Völker umzuwandeln, an deren Spitze weiterhin Frankreich steht."
 FRW_union_francaise_tt:0 "Gründet die §YUnion Française§!: neuer Name und neue Flagge, Nationalgeist und §GKerngebiete in Algerien und den überseeischen Départements§! (Antillen, Guayana, Réunion), die Frankreich besitzt (auch später), sowie §YAnsprüche§! auf die übrigen.\nErsetzt jede Nation, die Frankreich zuvor gebildet hat (deren Nationalgeist wird entfernt). Ist Frankreich bereits das §YEwige Königreich Francia§!, bleibt es dabei."
 FRW_little_entente_guarantees:0 "Die Kleine Entente einbinden"
 FRW_little_entente_guarantees_desc:0 "Die Tschechoslowakei, Jugoslawien und Rumänien verlassen sich bereits auf französische Garantien. Der Quai d’Orsay lädt sie nun zu einem förmlichen Bündnis ein."
 FRW_franco_british_union:0 "Französisch-Britische Union"
 FRW_franco_british_union_desc:0 "Jean Monnet und Winston Churchill sprachen beide davon, die zwei Nationen unter einer Regierung zu vereinen. Paris unterbreitet London nun dieses Angebot."
 FRW_franco_british_union_tt:0 "Schlägt London die §YFranzösisch-Britische Union§! vor (ein KI-gesteuertes Großbritannien nimmt immer an, ein Spieler entscheidet selbst):\n- Beide Länder erhalten §YFranzösisch-Britische Union§!.\n- Frankreich übernimmt Namen und Flagge der Union (dies ersetzt jede zuvor gebildete Nation, außer dem §YEwigen Königreich Francia§!). Die Union bringt keine neuen Kerngebiete."
 FRW_colonial_assembly:0 "Die Kolonialversammlung"
 FRW_colonial_assembly_desc:0 "Abgeordnete aus den Kolonien nehmen ihre Sitze in einer beratenden Versammlung in Paris ein."
 FRW_colonial_assembly_tt:0 "Alle Staaten, die kein Kerngebiet sind: §G+10 %§! Kooperation."
 FRW_council_of_europe:0 "Der Briand-Plan"
 FRW_council_of_europe_desc:0 "1929 schlug Aristide Briand in Genf eine europäische Union vor. Seine Nachfolger holen den Plan aus den Akten des Quai d’Orsay hervor."
 FRW_council_of_europe_tt:0 "Gründet die §YEuropäische Gemeinschaft§! (sofern Frankreich keiner Fraktion angehört) und lädt §YBelgien§!, die §YNiederlande§!, §YLuxemburg§! und die §YSchweiz§! ein.\nDie §YEuropäische Föderation§! selbst wird später ausgerufen, sobald die Gemeinschaft zusammengewachsen ist."
 FRW_rhine_guarantee:0 "Wächter des Rheins"
 FRW_rhine_guarantee_desc:0 "Zweimal in siebzig Jahren sind deutsche Armeen in Frankreich eingefallen. Der Rhein soll als Sicherheitsgrenze des Landes gehalten werden."
 FRW_rhine_guarantee_tt:0 "Falls §YDeutschland§! faschistisch ist: Kriegsziel §YRegierung stürzen§! gegen Deutschland."
 FRW_arsenal_of_democracy:0 "Waffen für die freien Nationen"
 FRW_arsenal_of_democracy_desc:0 "Französische Fabriken liefern Waffen für jede Demokratie in Europa, die noch Widerstand leistet."
 FRW_european_defence_community:0 "Ein gemeinsamer Verteidigungsrat"
 FRW_european_defence_community_desc:0 "Frankreich und seine Partner bündeln die Rüstungsforschung und entwerfen gemeinsame Verteidigungspläne."
 FRW_franco_belgian_customs:0 "Zollunion mit Belgien"
 FRW_franco_belgian_customs_desc:0 "Eine Zollunion bindet die Volkswirtschaften Belgiens und Luxemburgs an die Frankreichs."
 FRW_franco_belgian_customs_tt:0 "Gründet die §YWestunion§!: neuer Name und neue Flagge, Nationalgeist und §GKerngebiete auf den Ländereien Belgiens, der Niederlande und Luxemburgs§!, die Frankreich besitzt (auch auf allen, die es dort später erwirbt), sowie §YAnsprüche§! auf den Rest.\nErsetzt jede Nation, die Frankreich zuvor gebildet hat (deren Nationalgeist wird entfernt). Ist Frankreich bereits das §YEwige Königreich Francia§!, bleibt es dabei.\nErfordert die Kontrolle über §YBelgien§!, die §YNiederlande§! und §YLuxemburg§! (annektiert oder als Satelliten, sofern nicht anders angegeben). Kontrolliert Frankreich sie noch nicht, wird die Nation automatisch gegründet, sobald dies der Fall ist."
 FRW_fourth_republic:0 "Eine neue Verfassung"
 FRW_fourth_republic_desc:0 "Die Gesetze von 1875 waren eine Notlösung, die sechzig Jahre hielt. Eine neue Verfassung gibt Frankreich eine stärkere Exekutive und langlebigere Kabinette."
 FRW_aid_spanish_republic:0 "Die Spanische Republik unterstützen"
 FRW_aid_spanish_republic_desc:0 "1936 wollte Blum Madrid helfen, wurde aber von London und seinen eigenen Radikalen zurückgehalten. Diesmal fliegen die Flugzeuge nach Süden."
 FRW_aid_spanish_republic_tt:0 "Schickt §Y2.000 Gewehre§! an die Spanische Republik und gibt Frankreich das Kriegsziel §YRegierung stürzen§! gegen die Nationalisten."
 FRW_european_customs_union:0 "Die Europäische Zollunion"
 FRW_european_customs_union_desc:0 "Kohle, Stahl und Getreide überqueren die Grenzen der Gemeinschaft nun zollfrei. Monnets Planer bezeichnen dies als bloßen Anfang."
 FRW_european_customs_union_tt:0 "Jedes Mitglied der Fraktion Frankreichs erhält §YEuropäischer Partner§! (+5 % Fabrikleistung, +3 % Forschungsgeschwindigkeit).\nErfordert §YJean Monnet§! als politischen Berater (Entscheidung §YJean Monnet ernennen§! im §YMinisterrat§!, Ressort §YWirtschaft§!)."
 FRW_european_federation_focus:0 "Die Europäische Föderation"
 FRW_european_federation_focus_desc:0 "Die Mitgliedstaaten werden aufgefordert, ihre Armeen und Währungen einer Bundesregierung mit Sitz in Paris zu übertragen. Die meisten stimmen zu."
 FRW_european_federation_focus_tt:0 "Jede demokratische Kleinmacht Europas in der Fraktion Frankreichs oder unter französischer Garantie wird zum Beitritt zur Föderation aufgefordert (eine Zustimmung bedeutet eine friedliche Annexion). Das Angebot kann mit der Entscheidung §YFöderationsangebot erneuern§! wiederholt werden.\nGründet die §YEuropäische Föderation§!: neuer Name und neue Flagge, Nationalgeist und §GKerngebiete auf den Ländereien der Beneluxländer, der Schweiz, Italiens, Deutschlands und des Rheinlands§!, die Frankreich besitzt (auch auf allen, die es dort später erwirbt), sowie §YAnsprüche§! auf den Rest.\nErsetzt jede Nation, die Frankreich zuvor gebildet hat (deren Nationalgeist wird entfernt). Ist Frankreich bereits das §YEwige Königreich Francia§!, bleibt es dabei.\nErfordert die Kontrolle über §YBelgien§!, die §YNiederlande§! und §YLuxemburg§! (annektiert, als Satelliten oder über die Föderation beigetreten) – nach diesem Fokus werden §YItalien§! oder §YDeutschland§! nicht mehr benötigt. Kontrolliert Frankreich sie noch nicht, wird die Nation automatisch gegründet, sobald dies der Fall ist."
 FRW_forty_hour_week:0 "Die Vierzigstundenwoche"
 FRW_forty_hour_week_desc:0 "Das Gesetz vom Juni 1936 begrenzt die Wochenarbeitszeit auf vierzig Stunden. Die Arbeiter begrüßen es, die Arbeitgeber beklagen die Kosten."
 FRW_pierre_cot_aviation:0 "Volksluftfahrt"
 FRW_pierre_cot_aviation_desc:0 "Luftfahrtminister Pierre Cot verstaatlicht die Flugzeugwerke und öffnet die Fliegerclubs für Arbeitersöhne."
 FRW_jean_zay_reforms:0 "Die Reformen Jean Zays"
 FRW_jean_zay_reforms_desc:0 "Bildungsminister Jean Zay hebt das Schulabgangsalter an und gründet den Forschungsdienst, aus dem das CNRS hervorgehen wird."
 FRW_relax_forty_hours:0 "Vorrang für die Arsenale"
 FRW_relax_forty_hours_desc:0 "Die Vierzigstundenwoche bleibt Gesetz, doch die Rüstungsfabriken werden ausgenommen und dürfen Überstunden leisten."
 FRW_bread_peace_liberty:0 "Brot, Frieden und Freiheit"
 FRW_bread_peace_liberty_desc:0 "„Brot, Frieden und Freiheit“ war 1936 der Wahlslogan der Volksfront. Die Regierung macht ihn nun zu ihrem Programm."
 FRW_reynaud_recovery:0 "Die Reynaud-Dekrete"
 FRW_reynaud_recovery_desc:0 "Als Finanzminister lockert Reynaud die Vierzigstundenwoche, stellt das Vertrauen der Investoren wieder her und holt Kapital nach Frankreich zurück."
 FRW_mandel_colonies:0 "Mandels Kolonialministerium"
 FRW_mandel_colonies_desc:0 "Georges Mandel, Minister für die Kolonien, verspricht, eine große Kolonialarmee zur Verteidigung des Mutterlandes aufzustellen."
 FRW_mandel_colonies_tt:0 "Erfordert §YGeorges Mandel§! als politischen Berater (Entscheidung §YGeorges Mandel ernennen§! im §YMinisterrat§!, Ressort §YPolitik§!)."
 FRW_edge_of_the_sword:0 "Die Schneide des Schwertes"
 FRW_edge_of_the_sword_desc:0 "Die Panzerdivision, die de Gaulle beschrieben hat, wird zum Vorbild für den Rest der Armee. „Le Fil de l’épée“, de Gaulles Essay über die Führung von 1932, wird in die Pflichtlektüre der École de Guerre aufgenommen."
 FRW_certaine_idee:0 "Eine gewisse Idee von Frankreich"
 FRW_certaine_idee_desc:0 "De Gaulle ist seit Langem überzeugt, dass Frankreich nur dann es selbst ist, wenn es in der ersten Reihe der Nationen steht. Als Präsident macht er sich daran, auf dieser Überzeugung eine Republik zu errichten."
 FRW_deat_neosocialism:0 "Ordnung, Autorität, Nation"
 FRW_deat_neosocialism_desc:0 "Auf dem sozialistischen Parteitag von 1933 erklärten Adrien Marquet und Marcel Déat der Partei, sie müsse die Mittelschichten mit „Ordnung, Autorität, Nation“ gewinnen. Blum ließ sie ausschließen. Die Neosozialisten bieten der Republik einen starken Staat und eine Planwirtschaft."
 FRW_deat_neosocialism_tt:0 "Erfordert die Unterstützung von §YMarcel Déat§! (Entscheidung §YMarcel Déat gewinnen§!, 45 Tage)."
 FRW_deat_labour_plan:0 "Der Plan der Arbeit"
 FRW_deat_labour_plan_desc:0 "In Belgien hat Henri de Man den Weg gewiesen: Kredit, Energie und Schwerindustrie unter öffentlicher Leitung, alles Übrige in privater Hand. Die Planer der Neosozialisten arbeiten eine französische Fassung aus."
 FRW_deat_national_credit:0 "Ein Nationales Kreditamt"
 FRW_deat_national_credit_desc:0 "Die Banque de France und die großen Depositenbanken werden einem Nationalen Kreditamt unterstellt. Die „zweihundert Familien“ verlieren ihren Einfluss auf das Schatzamt, und der Staat entscheidet, wohin das Geld fließt."
 FRW_deat_strong_state:0 "Der starke Staat"
 FRW_deat_strong_state_desc:0 "Die Notverordnungen werden zur Regel. Das Parlament beschließt einmal im Jahr den Haushalt und den Plan, dazwischen regiert die Exekutive. Déats Kritiker auf der Linken sagen, sein Sozialismus der Ordnung blicke eher nach Rom als zu Jaurès."
 FRW_deat_die_for_danzig:0 "Sterben für Danzig?"
 FRW_deat_die_for_danzig_desc:0 "„Müssen wir für Danzig sterben?“, fragt Déat in der Zeitung L’Œuvre. Die französischen Bauern, schreibt er, würden nicht für eine Freie Stadt an der Ostsee in den Krieg ziehen. Der Artikel spaltet das Land, und seine Kritiker nennen ihn den ersten Schritt auf dem Weg nach Berlin."
 FRW_deat_die_for_danzig_tt:0 "Die Neosozialisten müssen sich nun entscheiden: in der §YRepublik§! bleiben oder die §YEinheitspartei§! gründen."
 FRW_deat_planist_republic:0 "Die planistische Republik"
 FRW_deat_planist_republic_desc:0 "Déat bleibt im Rahmen der Republik. Der Plan wird gesetzlich verankert, die Kammer behält ihr Stimmrecht darüber, und ein Wirtschaftsrat bringt Gewerkschaften, Arbeitgeber und Ingenieure an einen Tisch."
 FRW_deat_x_crise:0 "Die Ingenieure von X-Crise"
 FRW_deat_x_crise_desc:0 "Die Polytechniker des Kreises X-Crise, unter ihnen Jean Coutrot, Louis Vallon und der junge Alfred Sauvy, verlassen ihre Studiengruppen und gehen in die Ministerien. Zum ersten Mal wird Frankreich von Planern regiert."
 FRW_deat_republic_of_order:0 "Die Republik der Ordnung"
 FRW_deat_republic_of_order_desc:0 "Zum ersten Mal seit dem Krieg überdauert ein Kabinett seinen Haushalt, und der Plan erfüllt seine Ziele. Déats Anhänger sagen, kein Parlament hätte so viel erreichen können."
 FRW_deat_single_party:0 "Die Einheitspartei"
 FRW_deat_single_party_desc:0 "Sozialisten, Frontkämpfer und die Männer der Ligen, so argumentiert Déat, wollen alle dasselbe: eine nationale und volkstümliche Revolution. Er ruft sie auf, sich in einer einzigen Partei zusammenzuschließen, dem Rassemblement National Populaire, und die Kammer für immer zu schließen."
 FRW_deat_single_party_tt:0 "Erfordert mindestens §Y15 %§! Popularität für §YFaschismus§!."
 FRW_deat_labour_front:0 "Die Arbeitsfront"
 FRW_deat_labour_front_desc:0 "Die Gewerkschaften und die Arbeitgeberverbände werden zu einer einzigen Arbeitsfront verschmolzen. Streiks und Aussperrungen sind gleichermaßen verboten; der Plan legt Löhne und Preise fest."
 FRW_deat_national_legion:0 "Die Nationale Volkslegion"
 FRW_deat_national_legion_desc:0 "Der RNP stellt eine eigene Freiwilligenlegion auf. Sie marschiert mit Spaten ebenso wie mit Gewehren, und ihre Rekruten kommen ebenso aus den Fabriken wie aus den alten Ligen."
 FRW_deat_new_europe:0 "Die Neue Europäische Ordnung"
 FRW_deat_new_europe_desc:0 "Déat träumt von einem Europa, das zugleich sozialistisch und national ist, von Brest bis Bukarest, mit Paris als zweiter Hauptstadt. Brüssel, Den Haag, Bern und Kopenhagen werden zum Beitritt eingeladen."
 FRW_deat_new_europe_tt:0 "Gründet die §YNeue Europäische Ordnung§! (falls Frankreich keiner Fraktion angehört) und lädt §YBelgien§!, die §YNiederlande§!, §YLuxemburg§!, die §YSchweiz§! und §YDänemark§! ein."
 FRW_deat_continental_economy:0 "Die Kontinentalwirtschaft"
 FRW_deat_continental_economy_desc:0 "Eine europäische Verrechnungsunion, ein gemeinsamer Plan für Kohle und Stahl und ein einziger Markt vom Atlantik bis zur Weichsel. Déat nennt es kontinentalen Sozialismus."
 FRW_deat_lvf:0 "Die Legion Französischer Freiwilliger"
 FRW_deat_lvf_desc:0 "In einem Punkt sind sich Déat und seine Rivalen aus den anderen Parteien zumindest einig: Französische Freiwillige sollen den Bolschewismus im Ausland bekämpfen. Die Legion wirbt in den Büros des RNP an und zieht dorthin, wo immer der Kreuzzug geführt wird."
 FRW_deat_ministry_of_labour:0 "Das Arbeitsministerium"
 FRW_deat_ministry_of_labour_desc:0 "Déat übernimmt das Arbeitsministerium selbst. Arbeitsämter, Lehrstellen und Lohntabellen unterstehen einer einzigen Behörde in der Rue de Grenelle."
 FRW_deat_revolutionary_front:0 "Die Revolutionäre Nationalfront"
 FRW_deat_revolutionary_front_desc:0 "Die letzten rivalisierenden Bewegungen gehen unter Déats Führung in einer einzigen Revolutionären Nationalfront auf. Ehemalige Sozialisten, Syndikalisten und die Männer der Ligen besitzen nun dasselbe Mitgliedsbuch."
 FRW_deat_european_revolution:0 "Die Europäische Revolution"
 FRW_deat_european_revolution_desc:0 "Ein nationales und sozialistisches Europa darf nicht an der belgischen Grenze haltmachen, schreibt Déat. Brüssel und Den Haag werden eingeladen, sich als erste Provinzen des neuen Kontinents unter französischen Schutz zu stellen."
 FRW_protect_austria:0 "Österreichs Unabhängigkeit schützen"
 FRW_protect_austria_desc:0 "Österreich liegt schutzlos zwischen Berlin und Rom. Paris bietet seinen Schutz an und erwartet im Gegenzug, dass Wien der französischen Politik folgt."
 FRW_libyan_border:0 "Die Beneluxländer garantieren"
 FRW_libyan_border_desc:0 "Wie 1925 in Locarno tritt Frankreich als Garantiemacht für seine Nachbarn ein. Paris wird einen Angriff auf Brüssel, Den Haag oder Luxemburg als Angriff auf Frankreich betrachten."
 FRW_workers_popular_front:0 "Die Arbeiterfront"
 FRW_workers_popular_front_desc:0 "Die PCF bricht mit ihren bürgerlichen Partnern in der Volksfront und ruft die Arbeiter auf, selbst die Macht zu ergreifen."
 FRW_truce_unity_of_action:0 "Aktionseinheit"
 FRW_truce_unity_of_action_desc:0 "1934 unterzeichneten PCF und SFIO einen Pakt, sich nicht länger gegenseitig anzugreifen und gemeinsam gegen die Ligen zu marschieren. Die Partei verpflichtet die Arbeiter nun darauf, unter ihrem eigenen Banner."
 FRW_truce_unity_of_action_tt:0 "Schützt Frankreich vor dem §Rkommunistischen Aufstand§!, den eine niedrige Stabilität sonst auslösen würde.\nBeendet die §YStreikwelle§!.\nVerfügbar ab §YJuni 1936§!."
 FRW_cgt_general_strike:0 "Der Generalstreik der CGT"
 FRW_cgt_general_strike_desc:0 "Millionen Arbeiter legen auf Aufruf der CGT die Arbeit nieder, und die Fabriken verstummen. Die Regierung übersteht die Woche womöglich nicht."
 FRW_proclaim_the_commune:0 "Die Kommune ausrufen"
 FRW_proclaim_the_commune_desc:0 "1871 erhob sich Paris allein und wurde niedergeschlagen. Diesmal erheben sich die Provinzen gemeinsam mit der Hauptstadt."
 FRW_proclaim_the_commune_tt:0 "§YZerstrittene Regierung§! wird zu §YEine fragile Regierung§!. Zwei Entscheidungen (ab 1937 und ab 1938, jeweils mindestens 6 Monate auseinander) beseitigen sie vollständig."
 FRW_thorez_party_line:0 "Thorez übernimmt die Macht"
 FRW_thorez_party_line_desc:0 "Unter Maurice Thorez richtet Frankreich seine Politik eng an der Moskaus aus."
 FRW_thorez_party_line_tt:0 "Erfordert die Unterstützung von §YMaurice Thorez§! (Entscheidung §YMaurice Thorez gewinnen§!, 45 Tage)."
 FRW_pivert_revolution:0 "Alles ist möglich!"
 FRW_pivert_revolution_desc:0 "Marceau Pivert und die Gauche Révolutionnaire fordern eine Demokratie der Arbeiterräte, unabhängig von Moskau."
 FRW_pivert_revolution_tt:0 "Erfordert die Unterstützung von §YMarceau Pivert§! (Entscheidung §YMarceau Pivert gewinnen§!, 45 Tage)."
 FRW_five_year_plan_fr:0 "Der französische Fünfjahresplan"
 FRW_five_year_plan_fr_desc:0 "Nach dem Vorbild des sowjetischen Gosplan legen Kommissare in jedem Département Quoten für Kohle, Stahl und Getreide fest. Die Renault-Werke in Billancourt erhalten ihre Aufträge nun vom Plan statt vom Markt."
 FRW_soviet_military_mission:0 "Sowjetische Militärmission"
 FRW_soviet_military_mission_desc:0 "Offiziere der Roten Armee treffen in Paris ein, um den französischen Stab in der Theorie der tiefen Operation zu unterweisen."
 FRW_join_comintern:0 "Der Komintern beitreten"
 FRW_join_comintern_desc:0 "Die Partei ist überzeugt, dass die Revolution nicht in einem Land allein siegen kann. Paris schließt sich in der Kommunistischen Internationale Moskau und den Arbeiterbewegungen im Ausland an."
 FRW_join_comintern_tt:0 "Bittet die §YSowjetunion§!, ihrer Fraktion beitreten zu dürfen. Führen die Sowjets keine Fraktion an, gründet Frankreich die §YRote Front§! und lädt sie ein."
 FRW_red_army_of_france:0 "Die Rote Armee Frankreichs"
 FRW_red_army_of_france_desc:0 "Die Armee wird nach sowjetischem Vorbild umgebaut, und ihren Einheiten werden Politkommissare zugeteilt."
 FRW_workers_councils:0 "Arbeiterräte"
 FRW_workers_councils_desc:0 "Gewählte Arbeiterräte übernehmen die Leitung der Fabriken."
 FRW_revolutionary_militias:0 "Revolutionäre Milizen"
 FRW_revolutionary_militias_desc:0 "Die Kommune von 1871 begann, als die Regierung in Versailles versuchte, die Kanonen vom Montmartre abzuziehen. Diesmal unterhält jede Fabrik und jedes Viertel eine bewaffnete Arbeitermiliz."
 FRW_export_the_revolution:0 "Die Revolution exportieren"
 FRW_export_the_revolution_desc:0 "Die Parteiführer argumentieren, dass sich die Revolution nicht auf Frankreich beschränken lässt."
 FRW_iberian_revolution:0 "Revolution auf der Iberischen Halbinsel"
 FRW_iberian_revolution_desc:0 "Die spanischen Kommunisten und die Gewerkschaften bitten Paris um Waffen gegen die Generäle."
 FRW_iberian_revolution_tt:0 "Kriegsziel §YRegierung stürzen§! gegen §YSpanien§! (sofern Spanien nicht kommunistisch oder verbündet ist)."
 FRW_red_navy_of_toulon:0 "Die Rote Flotte und Luftwaffe"
 FRW_red_navy_of_toulon_desc:0 "Die Meuterei im Schwarzen Meer von 1919, unter anderem von André Marty angeführt, ist in der Flotte unvergessen. Die Matrosen von Toulon halten die Schiffe nun für das Volk. Junge Arbeiter lernen in den Fliegerclubs der Partei das Fliegen."
 FRW_red_industry:0 "Rote Industrie"
 FRW_red_industry_desc:0 "Le Creusot und die Stahlwerke der de Wendel gehen in Staatsbesitz über. Produktionsziele ersetzen die Dividenden."
 FRW_liberate_colonies:0 "Die Kolonien befreien"
 FRW_liberate_colonies_desc:0 "Ein sozialistisches Frankreich kann keine Kolonien mit Gewalt halten. Marokko und Tunesien werden unabhängige Bruderrepubliken."
 FRW_liberate_colonies_tt:0 "§YMarokko§! und §YTunesien§! werden als kommunistische Satelliten entlassen (sofern Frankreich sie besitzt), und §YBrudervölker§! steigt um eine Stufe."
 FRW_union_of_european_socialist_republics:0 "Vereinigte Sozialistische Staaten von Europa"
 FRW_union_of_european_socialist_republics_desc:0 "Die Partei nimmt eine sozialistische Union Europas ins Visier, frei von Grenzen und Kapitalisten."
 FRW_union_of_european_socialist_republics_tt:0 "Kriegsziel §YRegierung stürzen§! gegen §YBelgien§!, die §YNiederlande§! und §YLuxemburg§! (sofern sie nicht bereits kommunistisch, französische Satelliten oder Verbündete sind).\nGründet die §YEuropäische Föderation§!: neuer Name und neue Flagge, Nationalgeist und §GKerngebiete auf den Ländereien der Beneluxländer, der Schweiz, Italiens, Deutschlands und des Rheinlands§!, die Frankreich besitzt (auch auf allen, die es dort später erwirbt), sowie §YAnsprüche§! auf den Rest.\nErsetzt jede Nation, die Frankreich zuvor gebildet hat (deren Nationalgeist wird entfernt). Ist Frankreich bereits das §YEwige Königreich Francia§!, bleibt es dabei.\nErfordert die Kontrolle über §YBelgien§!, die §YNiederlande§! und §YLuxemburg§! sowie §YItalien§! oder §YDeutschland§! (annektiert oder als Satelliten, sofern nicht anders angegeben). Kontrolliert Frankreich sie noch nicht, wird die Nation automatisch gegründet, sobald dies der Fall ist."
 FRW_peoples_science:0 "Wissenschaft für das Volk"
 FRW_peoples_science_desc:0 "Frédéric Joliot-Curie und andere Wissenschaftler stellen ihre Laboratorien in den Dienst der Revolution."
 FRW_internationale_victory:0 "Das letzte Gefecht"
 FRW_internationale_victory_desc:0 "Auf den Straßen erklingt die Internationale, als die Rote Armee Frankreichs ausrückt."
 FRW_purge_deviationists:0 "Die Abweichler säubern"
 FRW_purge_deviationists_desc:0 "Trotzkisten, Anhänger Piverts und andere „Feinde der Partei“ werden aus der PCF und der CGT ausgeschlossen."
 FRW_fils_du_peuple:0 "Sohn des Volkes"
 FRW_fils_du_peuple_desc:0 "Thorez’ Autobiografie „Fils du peuple“ wird in Millionenauflage gedruckt. Der Bergmannssohn aus dem Pas-de-Calais blickt in jedem Parteibüro von den Plakaten herab."
 FRW_second_five_year_plan:0 "Der zweite Fünfjahresplan"
 FRW_second_five_year_plan_desc:0 "Der zweite Plan stellt die Schwerindustrie und die Elektrifizierung über alles andere."
 FRW_political_commissars:0 "Politkommissare"
 FRW_political_commissars_desc:0 "Jedem Regiment wird ein Kommissar zugeteilt, und die Armee ist nun der Partei verantwortlich."
 FRW_bastion_of_the_west:0 "Bastion der Revolution"
 FRW_bastion_of_the_west_desc:0 "Paris ist die Hauptstadt des Sozialismus in Westeuropa. Mit jedem Zug treffen Arbeiterdelegationen aus London, Brüssel und Barcelona ein."
 FRW_federation_of_communes:0 "Eine Föderation der Kommunen"
 FRW_federation_of_communes_desc:0 "Die Präfekten werden abgeschafft, und jede Kommune verwaltet sich selbst durch ihren gewählten Rat. In Städten in ganz Frankreich öffnen Abendschulen. Die Arbeiter, die die Fabriken übernommen haben, füllen nun die Hörsäle."
 FRW_aid_the_poum:0 "Den iberischen Genossen helfen"
 FRW_aid_the_poum_desc:0 "Gewehre, Lastwagen und Freiwillige überqueren die Pyrenäen, um die POUM und die antistalinistische Linke in Barcelona zu erreichen."
 FRW_workers_army:0 "Von Milizen zur Arbeiterarmee"
 FRW_workers_army_desc:0 "Die Milizen erhalten Offiziere, regelmäßigen Drill und schwere Waffen, behalten aber ihre gewählten Komitees."
 FRW_republic_of_labour:0 "Die Republik der Arbeit"
 FRW_republic_of_labour_desc:0 "Piverts Anhänger beschreiben den neuen Staat als freie Assoziation der Produzenten, die weder von Kapitalisten noch von Bürokraten gelenkt wird."
 FRW_cgt_unions_take_power:0 "Alle Macht den Gewerkschaften"
 FRW_cgt_unions_take_power_desc:0 "1906 erklärte die CGT in Amiens, die Gewerkschaft und nicht die Partei werde die Keimzelle der künftigen Gesellschaft sein. Pierre Besnard und die revolutionären Syndikalisten nehmen die Bewegung nun beim Wort: Die Partei mag im Hôtel de Ville sitzen, aber die Gewerkschaften werden Frankreich lenken."
 FRW_cgt_unions_take_power_tt:0 "Erfordert die Unterstützung von §YPierre Besnard§! (Entscheidung §YPierre Besnard gewinnen§!, 45 Tage)."
 FRW_cgt_factory_committees:0 "Die Betriebskomitees"
 FRW_cgt_factory_committees_desc:0 "In jedem Werk übernimmt ein in der Werkhalle gewähltes Komitee die Leitung. Ingenieure und Vorarbeiter bleiben, doch sie sind nun den Männern und Frauen an den Werkbänken verantwortlich."
 FRW_cgt_local_unions:0 "Die Ortsgewerkschaften regieren"
 FRW_cgt_local_unions_desc:0 "Die Präfekten werden nach Hause geschickt. In jeder Stadt übernehmen die örtliche Gewerkschaft und ihre Delegierten die Aufgaben des Rathauses, von der Brotration bis zur Straßenbahn."
 FRW_cgt_bourses_du_travail:0 "Die Bourses du Travail"
 FRW_cgt_bourses_du_travail_desc:0 "Fernand Pelloutier wollte, dass die Arbeitsbörsen die Schulen der Arbeiterklasse sind. Dazu öffnen in jeder Stadt Bibliotheken, Abendschulen und technische Lehrgänge."
 FRW_cgt_confederal_congress:0 "Der Konföderationskongress"
 FRW_cgt_confederal_congress_desc:0 "Die Delegierten aller Verbände treten in der Mutualité zusammen. Entscheidungen steigen von der Fabrik zum Kongress auf, statt von einem Zentralkomitee herabzukommen. Die Fabrikbesetzungen enden, da die Besetzer die Betriebe nun selbst führen."
 FRW_cgt_confederal_congress_tt:0 "Beendet die §YStreikwelle§! und schützt Frankreich vor dem §Rkommunistischen Aufstand§!, den eine niedrige Stabilität sonst auslösen würde."
 FRW_cgt_red_black_columns:0 "Die Rot-Schwarzen Kolonnen"
 FRW_cgt_red_black_columns_desc:0 "Die Gewerkschaftsmilizen bilden Kolonnen unter der rot-schwarzen Fahne. Sie wählen ihre Offiziere und kämpfen verbissen, doch Befehle nehmen sie nur ungern entgegen."
 FRW_cgt_iwa:0 "Die Internationale Arbeiter-Assoziation"
 FRW_cgt_iwa_desc:0 "Besnard war Sekretär der Internationalen Arbeiter-Assoziation, der syndikalistischen Internationale. Nun, da Frankreich in der Hand der Gewerkschaften ist, finden ihre Kongresse in Paris statt."
 FRW_cgt_aid_the_cnt:0 "Hilfe für die CNT"
 FRW_cgt_aid_the_cnt_desc:0 "Gewehre und Lastwagen überqueren die Pyrenäen für die CNT und die anarchistischen Kolonnen Kataloniens und Aragoniens."
 FRW_cgt_collectivise_land:0 "Kollektivierung des Bodens"
 FRW_cgt_collectivise_land_desc:0 "Landarbeiter übernehmen die großen Güter der Beauce und des Midi. Kleinbauern können sich den Kollektiven anschließen oder ihre Felder behalten."
 FRW_cgt_workers_self_defence:0 "Arbeiterselbstverteidigung"
 FRW_cgt_workers_self_defence_desc:0 "Der Kongress kommt überein, dass die Revolution doch eine Armee braucht, aber eine, die die Kommunen verteidigt und keinen eigenen Generalstab hat."
 FRW_cgt_iberian_federation:0 "Die Iberische Föderation"
 FRW_cgt_iberian_federation_desc:0 "In Barcelona spricht die CNT von einer freien Föderation der iberischen Völker. Paris verspricht, bei ihrer Verwirklichung zu helfen."
 FRW_cgt_iberian_federation_tt:0 "Kriegsziel §YRegierung stürzen§! gegen §YSpanien§! (sofern Spanien nicht kommunistisch oder verbündet ist)."
 FRW_cgt_libertarian_commune:0 "Die Libertäre Kommune"
 FRW_cgt_libertarian_commune_desc:0 "Frankreich hat weder Bosse noch Bürokraten, nur Föderationen freier Produzenten. Ob eine solche Gesellschaft einen modernen Krieg führen kann, ist eine Frage, die der Kongress lieber nicht stellt."
 FRW_workers_belgium:0 "Nieder mit Salazar"
 FRW_workers_belgium_desc:0 "In Lissabon unterdrückt Salazars Estado Novo die Arbeiterbewegung. Mit Spanien in revolutionärer Hand wird Portugal sich isoliert wiederfinden."
 FRW_smash_italian_fascism:0 "Den italienischen Faschismus zerschlagen"
 FRW_smash_italian_fascism_desc:0 "Mussolini herrscht seit 1922 über Italien, länger als jeder andere faschistische Führer in Europa. Italienische Exilanten in Frankreich berichten, dass die Arbeiter in der Heimat zum Aufstand bereit sind."
 FRW_red_switzerland:0 "Die Internationalen Brigaden"
 FRW_red_switzerland_desc:0 "Freiwillige vieler Nationen verlassen den Gare d’Austerlitz in Richtung Spanien, Franzosen Seite an Seite mit Deutschen, Polen und Amerikanern. Paris ist zum Rekrutierungsbüro der Weltrevolution geworden."
 FRW_red_switzerland_tt:0 "Erfordert §YAndré Marty§! als politischen Berater (Entscheidung §YAndré Marty ernennen§! im §YMinisterrat§!, Ressort §YPolitik§!)."
 FRW_national_renewal:0 "Nationale Erneuerung"
 FRW_national_renewal_desc:0 "Die Ligen marschieren wieder und rufen der Republik „À bas les voleurs!“ entgegen."
 FRW_truce_labour_charter:0 "Die korporative Ordnung"
 FRW_truce_labour_charter_desc:0 "Streiks und Aussperrungen werden verboten. Arbeiter und Arbeitgeber jedes Gewerbes sitzen gemeinsam in einer Korporation, und der Staat entscheidet, worüber sie sich nicht einigen können."
 FRW_truce_labour_charter_tt:0 "Schützt Frankreich vor dem §Rkommunistischen Aufstand§!, den eine niedrige Stabilität sonst auslösen würde.\nBeendet die §YStreikwelle§!.\nVerfügbar ab §YJuni 1936§!."
 FRW_february_sixth:0 "Sturm auf das Palais Bourbon"
 FRW_february_sixth_desc:0 "Am 6. Februar 1934 wurden die Ligen an der Pont de la Concorde aufgehalten. Diesmal wollen sie sie überqueren."
 FRW_national_revolution:0 "Die Nationale Revolution"
 FRW_national_revolution_desc:0 "Die Republik fällt, und eine autoritäre nationalistische Regierung tritt an ihre Stelle."
 FRW_national_revolution_tt:0 "§YZerstrittene Regierung§! wird zu §YEine fragile Regierung§!. Zwei Entscheidungen (ab 1937 und ab 1938, jeweils mindestens 6 Monate auseinander) beseitigen sie vollständig."
 FRW_la_rocque_psf:0 "Arbeit, Familie, Vaterland"
 FRW_la_rocque_psf_desc:0 "Oberst de La Rocque und sein Parti Social Français wollen einen katholischen, nationalen Staat, der sich aus ausländischen Abenteuern heraushält."
 FRW_la_rocque_psf_tt:0 "Erfordert die Unterstützung von §YFrançois de La Rocque§! (Entscheidung §YFrançois de La Rocque gewinnen§!, 45 Tage)."
 FRW_doriot_ppf:0 "Die Französische Volkspartei"
 FRW_doriot_ppf_desc:0 "Jacques Doriot, 1934 aus der Kommunistischen Partei ausgeschlossen, führt nun den PPF und strebt einen totalitären Massenstaat an."
 FRW_doriot_ppf_tt:0 "Erfordert die Unterstützung von §YJacques Doriot§! (Entscheidung §YJacques Doriot gewinnen§!, 45 Tage)."
 FRW_corporatist_state:0 "Der korporatistische Staat"
 FRW_corporatist_state_desc:0 "Arbeitgeber und Arbeiter jedes Gewerbes werden unter staatlicher Aufsicht in Korporationen zusammengeführt."
 FRW_latin_bloc:0 "Der Lateinische Block"
 FRW_latin_bloc_desc:0 "Frankreich, Spanien, Portugal und Italien schließen sich zu einem Block der lateinischen Nationen zusammen, der zwischen Berlin und Moskau steht."
 FRW_latin_bloc_tt:0 "Gründet die Fraktion §YLateinischer Block§! und lädt §YItalien§!, §YSpanien§! und §YPortugal§! ein.\nDas §YLateinische Reich§! selbst wird später mit §YFührung Lateineuropas§! ausgerufen."
 FRW_colonial_legions:0 "Koloniallegionen"
 FRW_colonial_legions_desc:0 "Rekruten aus dem Senegal, Madagaskar und Indochina werden unter französischen Offizieren zu Legionen formiert."
 FRW_restore_french_honour:0 "Das savoyische Erbe"
 FRW_restore_french_honour_desc:0 "Savoyen und Nizza sind seit dem Vertrag von Turin 1860 französisch. Auch Genf, lange von den Herzögen von Savoyen beansprucht, wird gefordert. Das Piemont bleibt Rom überlassen, Frankreichs Partner im Lateinischen Block."
 FRW_totalitarian_party:0 "Die Einheitspartei"
 FRW_totalitarian_party_desc:0 "Die Kammern, die Ligen und die alten Parteien werden per Dekret aufgelöst. Der PPF wird zur einzigen legalen Partei Frankreichs."
 FRW_totalitarian_party_tt:0 "Erfordert §YPaul Marion§! als politischen Berater (Entscheidung §YPaul Marion ernennen§! im §YMinisterrat§!, Ressort §YPolitik§!)."
 FRW_approach_germany:0 "Annäherung an Berlin"
 FRW_approach_germany_desc:0 "Doriot glaubt, dass Europa von den faschistischen Mächten geführt werden wird, und will Frankreich an ihrer Seite sehen."
 FRW_greater_france_claims:0 "Großfrankreich"
 FRW_greater_france_claims_desc:0 "In der Romandie und im Wallis spricht man Französisch, und Mussolini begehrt Nizza, Savoyen und Korsika. Paris antwortet mit einer eigenen Karte: die Romandie, das Piemont und das Aostatal sowie Sardinien jenseits der Meerenge vor Korsika."
 FRW_march_on_brussels:0 "Ultimatum an Genf"
 FRW_march_on_brussels_desc:0 "Genf beherbergt den Völkerbund, politische Emigranten und ausländisches Gold, das dem Regime feindlich gesinnt ist. Doriot hat sein Ultimatum einmal gestellt und gedenkt nicht, ein zweites zu stellen."
 FRW_march_on_brussels_tt:0 "Kriegsziel §YAnnexion§! gegen die §YSchweiz§! (sofern nicht verbündet).\nVerfügbar ab §YJanuar 1937§!."
 FRW_national_rearmament:0 "Nationale Wiederaufrüstung"
 FRW_national_rearmament_desc:0 "Die Regierung macht sich daran, die französische Armee wieder zur stärksten des Kontinents zu machen."
 FRW_mediterranean_ambition:0 "Herr des Mittelmeers"
 FRW_mediterranean_ambition_desc:0 "Toulon, Bizerta, Algier und Beirut verschaffen Frankreich Häfen an jeder Küste des Mittelmeers. Von Rom wird erwartet, die französische Vorherrschaft zur See anzuerkennen, als Partner unter La Rocque oder als besiegter Rivale unter Doriot."
 FRW_mediterranean_ambition_tt:0 "Wenn §YJacques Doriot§! Frankreich führt: §YAnsprüche§! auf §YTripolitanien§! und den §YFessan§!."
 FRW_french_state_youth:0 "Die Nationale Jugend"
 FRW_french_state_youth_desc:0 "Schulen und Jugendgruppen werden unter staatliche Kontrolle gestellt und lernen, der Nation zu dienen."
 FRW_french_imperium:0 "Die imperiale Mission"
 FRW_french_imperium_desc:0 "Von Dakar bis Hanoi untersteht das Kolonialreich allein Paris."
 FRW_nouvel_ordre:0 "Führung Lateineuropas"
 FRW_nouvel_ordre_desc:0 "Rom, Madrid und Lissabon blicken auf Paris als Führungsmacht. Frankreich schlägt einen Block der lateinischen Nationen unter seiner Leitung vor."
 FRW_nouvel_ordre_tt:0 "Kriegsziel §YSatellit§! gegen §YSpanien§! und §YPortugal§! (sofern sie nicht französische Satelliten oder Verbündete sind).\nBildet das §YLateinische Reich§!: neuer Name und neue Flagge, Nationalgeist sowie §GKerngebiete auf den Ländereien Italiens, Spaniens und Portugals§!, die Frankreich besitzt (auch auf allen, die es dort später hinzugewinnt), und §YAnsprüche§! auf den Rest.\nErsetzt jede Nation, die Frankreich zuvor gebildet hat (deren Nationalgeist wird entfernt). Ist Frankreich bereits das §YEwige Königreich Francia§!, bleibt es dies.\nErfordert die Kontrolle über §YItalien§!, §YSpanien§! und §YPortugal§! (annektiert oder als Satelliten, sofern nicht anders angegeben). Kontrolliert Frankreich sie noch nicht, wird die Nation automatisch gegründet, sobald dies der Fall ist."
 FRW_african_empire_fascist:0 "Die tunesische Frage"
 FRW_african_empire_fascist_desc:0 "Im November 1938 riefen italienische Abgeordnete in der Kammer in Rom „Tunisi, Corsica, Nizza!“. Die Antwort aus Paris ist handfest: Die Mareth-Linie im Süden Tunesiens wird gehalten werden."
 FRW_corporative_chambers:0 "Die Korporativen Kammern"
 FRW_corporative_chambers_desc:0 "Kammern der Arbeitgeber und Arbeiter übernehmen die Rolle des Senats in der Wirtschaftsgesetzgebung."
 FRW_volontaires_nationaux:0 "Die Nationalen Freiwilligen"
 FRW_volontaires_nationaux_desc:0 "Die Volontaires Nationaux, die Jugendorganisation des PSF, werden zu einer disziplinierten nationalen Reserve ausgebildet."
 FRW_volontaires_nationaux_tt:0 "Erfordert §YJean Ybarnégaray§! als politischen Berater (Entscheidung §YJean Ybarnégaray ernennen§! im §YMinisterrat§!, Ressort §YPolitik§!)."
 FRW_social_catholicism:0 "Sozialkatholizismus"
 FRW_social_catholicism_desc:0 "Nächstenliebe, Familienbeihilfen und katholische Gewerkschaften sind das Heilmittel des PSF gegen den Klassenkampf."
 FRW_friendship_with_lisbon:0 "Freundschaft mit Lissabon und Madrid"
 FRW_friendship_with_lisbon_desc:0 "Salazar regiert Portugal seit 1932, ohne den Krieg zu suchen. La Rocque verweist auf den Estado Novo als Beweis, dass Ordnung und Frieden miteinander vereinbar sind."
 FRW_french_social_state:0 "Der Französische Sozialstaat"
 FRW_french_social_state_desc:0 "La Rocque verspricht ein Frankreich, das auf Arbeit, Familie und katholischem Glauben gründet, in Ordnung regiert wird und mit sich selbst in Frieden lebt."
 FRW_purge_the_reds:0 "Die Roten säubern"
 FRW_purge_the_reds_desc:0 "Doriot war einst der kommunistische Bürgermeister von Saint-Denis. Er kennt seine früheren Genossen beim Namen und hat nun die Polizei, um sie verhaften zu lassen."
 FRW_purge_the_reds_tt:0 "Popularität der Kommunisten: §R-10 %§!"
 FRW_anti_bolshevik_crusade:0 "Der antibolschewistische Kreuzzug"
 FRW_anti_bolshevik_crusade_desc:0 "Doriot ruft die Nationen Europas auf, sich gegen Moskau zu vereinen."
 FRW_party_militia:0 "Die Parteimiliz"
 FRW_party_militia_desc:0 "Der Service d'ordre des PPF wird bewaffnet und zur Garde des Regimes."
 FRW_pact_with_berlin:0 "Der Pakt mit Berlin"
 FRW_pact_with_berlin_desc:0 "Zweimal in siebzig Jahren zogen Frankreich und Deutschland gegeneinander in den Krieg. Nun bittet Paris um Aufnahme in das deutsche Bündnis."
 FRW_pact_with_berlin_tt:0 "Bittet §YDeutschland§!, Frankreich in seine Fraktion aufzunehmen (sofern Deutschland faschistisch ist und eine anführt)."
 FRW_cult_of_the_chef:0 "Der Führerkult"
 FRW_cult_of_the_chef_desc:0 "In jedem Rathaus hängt ein Porträt Doriots. Partei und Staat werden allein vom Chef gelenkt."
 FRW_seize_libya:0 "Libyen einnehmen"
 FRW_seize_libya_desc:0 "Tripolis und der Fessan würden Tunesien mit Französisch-Westafrika und Französisch-Äquatorialafrika verbinden. Italien soll gezwungen werden, sie abzutreten."
 FRW_swiss_protectorate:0 "Mare Nostrum"
 FRW_swiss_protectorate_desc:0 "Mussolini nennt das Mittelmeer „mare nostrum“. Paris sieht das anders: Toulon, Bizerta und Mers-el-Kébir werden zu Stützpunkten für eine Flotte ausgebaut, die es beherrschen kann."
 FRW_demand_spanish_morocco:0 "Den Fessan fordern"
 FRW_demand_spanish_morocco_desc:0 "In den Laval-Mussolini-Abkommen vom Januar 1935 versprach Frankreich Italien einen Streifen der Sahara. Die neue Regierung sagt sich davon los und fordert stattdessen den Fessan."
 FRW_above_the_parties:0 "Über den Parteien"
 FRW_above_the_parties_desc:0 "Viele in Frankreich haben den Glauben an die Kommunisten, die faschistischen Ligen und ein von Skandalen beflecktes Parlament verloren. Sie wollen eine feste Hand an der Spitze."
 FRW_truce_national_concord:0 "Der Parteienfrieden"
 FRW_truce_national_concord_desc:0 "Nach den Unruhen vom Februar 1934 regierte Gaston Doumergue mit Ministern aus allen Lagern unter einem Parteienfrieden. Es ist Zeit, erneut einen auszurufen."
 FRW_truce_national_concord_tt:0 "Schützt Frankreich vor dem §Rkommunistischen Aufstand§!, den eine niedrige Stabilität sonst auslösen würde.\nBeendet die §YStreikwelle§!.\nWird im §YJuni 1936§! verfügbar."
 FRW_suspend_the_chambers:0 "Vertagung der Kammern"
 FRW_suspend_the_chambers_desc:0 "Präsident Lebrun weigert sich, noch ein weiteres Kabinett zu ernennen. Abgeordnetenkammer und Senat werden auf unbestimmte Zeit vertagt."
 FRW_suspend_the_chambers_tt:0 "§YZerstrittene Regierung§! wird zu §YEine fragile Regierung§!. Zwei Entscheidungen (ab 1937 und ab 1938, jeweils mindestens 6 Monate auseinander) beseitigen sie vollständig.\nDie Kammern werden nach Hause geschickt. Niemand weiß, was eine solche Stille füllt ..."
 FRW_etat_francais:0 "Der Französische Staat"
 FRW_etat_francais_desc:0 "Marschall Pétain, der Sieger von Verdun 1916, übernimmt als Staatschef die Macht."
 FRW_etat_francais_tt:0 "Erfordert die Unterstützung von §YMarschall Pétain§! (Entscheidung §YMarschall Pétain gewinnen§!, 45 Tage)."
 FRW_return_to_the_land:0 "Rückkehr zur Scholle"
 FRW_return_to_the_land_desc:0 "„La terre, elle, ne ment pas.“ Das Regime setzt auf das Bauerntum, um Frankreich zu erneuern."
 FRW_fortress_france:0 "Festung Frankreich"
 FRW_fortress_france_desc:0 "In Verdun lernte Pétain 1916, dass die Feuerkraft die Schlachten entscheidet. Danach plant er die Verteidigung Frankreichs. Die Veteranen von 1914–1918 werden in einer einzigen Legion zusammengefasst und zur wichtigsten Stütze des Regimes."
 FRW_corporation_paysanne:0 "Die Bauernkorporation"
 FRW_corporation_paysanne_desc:0 "Eine nationale Bauernkorporation wird gegründet, um die Landwirtschaft zu organisieren und die Lebensmittelversorgung zu sichern."
 FRW_weygand_staff:0 "General Weygands Stab"
 FRW_weygand_staff_desc:0 "General Weygand überarbeitet die Verteidigungsdoktrin der Armee und modernisiert ihre Ausrüstung."
 FRW_armee_d_afrique:0 "Die Afrikaarmee"
 FRW_armee_d_afrique_desc:0 "Die Divisionen der Armée d'Afrique in Algerien, Marokko und Tunesien werden zur strategischen Reserve des Kolonialreichs."
 FRW_armed_neutrality:0 "Bewaffnete Neutralität"
 FRW_armed_neutrality_desc:0 "Frankreich erklärt, sich an keinem fremden Krieg zu beteiligen. Jedem Angriff auf sein Territorium wird mit Gewalt begegnet."
 FRW_redoubt_of_the_empire:0 "Das Bollwerk des Kolonialreichs"
 FRW_redoubt_of_the_empire_desc:0 "Es werden Pläne ausgearbeitet, den Krieg von Algier aus fortzusetzen, sollte das französische Mutterland überrannt werden."
 FRW_charte_du_travail:0 "Die Arbeitscharta"
 FRW_charte_du_travail_desc:0 "Streiks und Aussperrungen werden verboten. Gemischte Ausschüsse aus Arbeitgebern und Arbeitern schlichten Streitigkeiten in jedem Gewerbe."
 FRW_charte_du_travail_tt:0 "Erfordert §YJean Bichelonne§! als politischen Berater (Entscheidung §YJean Bichelonne ernennen§! im §YMinisterrat§!, Ressort §YWirtschaft§!)."
 FRW_chantiers_de_jeunesse:0 "Jugendarbeitslager"
 FRW_chantiers_de_jeunesse_desc:0 "Jeder junge Mann von zwanzig Jahren verbringt acht Monate in den Lagern, fällt Holz und lernt das Exerzieren."
 FRW_cult_of_the_marshal:0 "Marschall, hier sind wir!"
 FRW_cult_of_the_marshal_desc:0 "Schulkinder lernen „Maréchal, nous voilà“ zu singen. In vielen Rathäusern hängt sein Porträt nun dort, wo einst die Büste der Marianne stand."
 FRW_darlan_admiralty:0 "Darlan an der Spitze der Admiralität"
 FRW_darlan_admiralty_desc:0 "Admiral Darlan hält die Flotte intakt. Für ein neutrales Frankreich ist sie der stärkste Trumpf in Verhandlungen."
 FRW_unconquerable_france:0 "Unbezwingbares Frankreich"
 FRW_unconquerable_france_desc:0 "Die Verteidigungsanlagen reichen von der Maginot-Linie bis zu den Pässen des Atlas. Ein Eindringling würde für jeden Meter teuer bezahlen."
 FRW_order_in_the_rif:0 "Ordnung im Rif"
 FRW_order_in_the_rif_desc:0 "1925 übernahm Pétain das Kommando gegen Abd el-Krim und beendete den Rifkrieg. Spanien hat die Region nie fest im Griff gehabt, und Frankreich bietet nun an, dies zu übernehmen."
 FRW_latin_neutral_bloc:0 "Der Lateinische Neutralitätsblock"
 FRW_latin_neutral_bloc_desc:0 "Franco, Salazar und der Schweizer Bundesrat teilen das Ziel des Marschalls, sich aus dem nächsten Krieg herauszuhalten. Gemeinsam könnte es ihnen gelingen."
 FRW_latin_neutral_bloc_tt:0 "Gründet den §YLateinischen Neutralitätsblock§! (sofern Frankreich keiner Fraktion angehört) und lädt, sofern Frankreich seine Fraktion anführt, §YSpanien§!, §YPortugal§! und die §YSchweiz§! ein."
 FRW_empire_stands_guard:0 "Das Kolonialreich hält Wache"
 FRW_empire_stands_guard_desc:0 "Weygand inspiziert die Garnisonen von Dakar bis Beirut. Die Kolonialarmee erhält den Befehl, für einen Angriff aus beiden Lagern bereit zu sein."
 FRW_marshals_peace:0 "Der Frieden des Marschalls"
 FRW_marshals_peace_desc:0 "Während sich die Großmächte gegenseitig zermürben, baut Frankreich hinter seinen Grenzen wieder auf. Der Marschall hat versprochen, dass kein Franzose für Danzig oder für Moskau sterben wird."
 FRW_orleanist_restoration:0 "Die orléanistische Restauration"
 FRW_orleanist_restoration_desc:0 "Henri d’Orléans, Graf von Paris, kehrt aus dem Exil zurück und wird zum König Heinrich VI. ausgerufen."
 FRW_orleanist_restoration_tt:0 "Erfordert die Unterstützung §Ydes Grafen von Paris§! (Entscheidung §YDen Grafen von Paris gewinnen§!, 45 Tage)."
 FRW_charter_of_1830:0 "Die Charte erneuern"
 FRW_charter_of_1830_desc:0 "Eine neue Verfassung nach dem Vorbild der Charte von 1830 bindet die Krone an die besitzenden Klassen."
 FRW_royal_diplomacy:0 "Königliche Diplomatie"
 FRW_royal_diplomacy_desc:0 "Das Haus Orléans ist durch Heirat mit vielen regierenden Familien Europas verwandt."
 FRW_action_francaise_ministers:0 "Minister der Action Française"
 FRW_action_francaise_ministers_desc:0 "Zum ersten Mal treten Mitglieder von Charles Maurras' Action Française in die Regierung ein."
 FRW_royal_army:0 "Die Königliche Armee"
 FRW_royal_army_desc:0 "Die Offiziere leisten einen Eid auf den König. Im Gegenzug erhalten sie die Mittel, die ihnen die Republik vorenthielt."
 FRW_parliamentary_monarchy:0 "Parlamentarische Monarchie"
 FRW_parliamentary_monarchy_desc:0 "Nach britischem Vorbild herrscht der König, während seine Minister regieren."
 FRW_absolute_crown:0 "Die Krone regiert"
 FRW_absolute_crown_desc:0 "Heinrich VI. regiert persönlich und stützt sich dabei auf Armee und Kirche."
 FRW_crown_of_the_franks:0 "Das Erbe Karls des Großen"
 FRW_crown_of_the_franks_desc:0 "Wallonien und Luxemburg gehörten einst der französischen Krone, und Karl der Große hielt Hof in Aachen."
 FRW_crown_of_the_franks_tt:0 "Kriegsziel gegen §YDeutschland§! für das §YRheinland§! und §YMoselland§! (sofern Frankreich sie nicht bereits besitzt).\nBildet das §YFränkische Reich§!: neuer Name und neue Flagge, Nationalgeist sowie §GKerngebiete auf den Ländereien der Beneluxländer, des Rheinlands, der Schweiz und Norditaliens§!, die Frankreich besitzt (auch auf allen, die es dort später hinzugewinnt), und §YAnsprüche§! auf den Rest.\nErsetzt jede Nation, die Frankreich zuvor gebildet hat (deren Nationalgeist wird entfernt). Ist Frankreich bereits das §YEwige Königreich Francia§!, bleibt es dies.\nErfordert die Kontrolle über das §YRheinland§!, §YMoselland§!, §YBelgien§! und die §YNiederlande§! (annektiert oder als Satelliten, sofern nicht anders angegeben). Kontrolliert Frankreich sie noch nicht, wird die Nation automatisch gegründet, sobald dies der Fall ist."
 FRW_catholic_revival:0 "Katholische Erneuerung"
 FRW_catholic_revival_desc:0 "Die Kirche erteilt der wiederhergestellten Monarchie ihren Segen."
 FRW_holy_alliance:0 "Eine neue Heilige Allianz"
 FRW_holy_alliance_desc:0 "Die Monarchien Europas schließen sich zu einem Bund gegen Revolution und Krieg zusammen."
 FRW_holy_alliance_tt:0 "Gründet die Fraktion §YHeilige Allianz§!."
 FRW_kings_government:0 "Die Regierung des Königs"
 FRW_kings_government_desc:0 "Der König ernennt ein Kabinett der nationalen Eintracht, das die Kammer anschließend bestätigt. Die Académie des Sciences findet im neuen König einen großzügigen Förderer."
 FRW_conseil_du_roi:0 "Der Rat des Königs"
 FRW_conseil_du_roi_desc:0 "Wie einst Ludwig XIV. regiert der König mit einem kleinen Rat vertrauter Berater."
 FRW_provinces_restored:0 "Wiederherstellung der Provinzen"
 FRW_provinces_restored_desc:0 "Die 1790 geschaffenen Départements weichen erneut den historischen Provinzen wie der Normandie und der Bretagne."
 FRW_most_christian_king:0 "Der Allerchristlichste König"
 FRW_most_christian_king_desc:0 "Heinrich VI. wird in der Kathedrale von Reims gesalbt, wo die französischen Könige jahrhundertelang gekrönt wurden."
 FRW_belgian_crown:0 "Die Marine des Königs"
 FRW_belgian_crown_desc:0 "Die Marine war lange die königstreueste Teilstreitkraft Frankreichs. Unter der Lilie soll sie ihr altes Ansehen zurückgewinnen."
 FRW_luxembourg_protectorate:0 "Die Königlichen Akademien"
 FRW_luxembourg_protectorate_desc:0 "Ludwig XIV. gründete 1666 die Académie des sciences. Die Krone will erneut ihre Schirmherrin sein."
 FRW_bonapartist_appeal:0 "Der Ruf des Adlers"
 FRW_bonapartist_appeal_desc:0 "Bonapartistische Komitees fordern die Rückkehr von Prinz Louis Napoléon."
 FRW_bonapartist_appeal_tt:0 "Erfordert die Unterstützung von §YPrinz Louis Napoléon§! (Entscheidung §YPrinz Louis Napoléon gewinnen§!, 45 Tage)."
 FRW_proclaim_the_empire:0 "Ausrufung des Kaiserreichs"
 FRW_proclaim_the_empire_desc:0 "Louis Napoléon wird in Notre-Dame als Napoléon VI. zum Kaiser der Franzosen gekrönt."
 FRW_code_napoleon:0 "Ein neuer Code Napoléon"
 FRW_code_napoleon_desc:0 "Recht und Verwaltung werden nach dem Vorbild des Ersten Kaiserreichs vereinheitlicht."
 FRW_imperial_guard:0 "Die Kaiserliche Garde"
 FRW_imperial_guard_desc:0 "Wie unter dem Ersten Kaiserreich werden die besten Soldaten Frankreichs für die Garde des Kaisers ausgewählt."
 FRW_grande_armee_reborn:0 "Die Wiedergeburt der Grande Armée"
 FRW_grande_armee_reborn_desc:0 "Der Stab studiert Austerlitz und Jena und überträgt ihre schnellen Manöver und konzentrierten Schläge auf Panzer und Flugzeuge."
 FRW_marshals_of_the_empire:0 "Die Marschälle des Kaiserreichs"
 FRW_marshals_of_the_empire_desc:0 "Beförderungen erfolgen wieder nach Verdienst, und jeder einfache Soldat darf hoffen, den Marschallstab im Tornister zu tragen."
 FRW_marshals_of_the_empire_tt:0 "§YPrinz Louis Napoléon§! zieht selbst als §YFeldmarschall§! ins Feld (Offensivdoktrin)."
 FRW_continental_system:0 "Die Kontinentalsperre"
 FRW_continental_system_desc:0 "Frankreich errichtet einen abgeschlossenen europäischen Handelsraum unter seiner Führung."
 FRW_continental_system_tt:0 "Gründet die Fraktion §YDie Kontinentalsperre§! (sofern Frankreich keiner Fraktion angehört) und lädt §YPolen§! und §YDänemark§! ein, die alten Verbündeten des Kaisers."
 FRW_imperial_university:0 "Die Kaiserliche Universität"
 FRW_imperial_university_desc:0 "Die Grandes Écoles werden in den Dienst genommen, um die Ingenieure und Beamten des Kaiserreichs auszubilden."
 FRW_imperial_university_tt:0 "Schaltet den politischen Berater §YFrédéric Joliot-Curie§! frei (Direktor der kaiserlichen Wissenschaft: Forschungsgeschwindigkeit §G+15 %§!, 150 politische Macht)."
 FRW_natural_borders:0 "Die natürlichen Grenzen"
 FRW_natural_borders_desc:0 "Rhein und Pyrenäen bilden die natürlichen Grenzen Frankreichs, wie schon die Revolution verkündete."
 FRW_hundred_days_spirit:0 "Der Geist der Hundert Tage"
 FRW_hundred_days_spirit_desc:0 "1815 versprach Napoleon, der Adler werde von Kirchturm zu Kirchturm bis zu den Türmen von Notre-Dame fliegen. Sein Erbe wiederholt diese Worte."
 FRW_kingdom_of_holland:0 "Das Königreich Holland"
 FRW_kingdom_of_holland_desc:0 "Louis Bonaparte war von 1806 bis 1810 König von Holland. Die Niederlande sollen wieder ein Vasallenkönigreich des Kaiserreichs werden."
 FRW_kingdom_of_holland_tt:0 "Kriegsziel §YSatellit§! gegen die §YNiederlande§! (sofern unabhängig und nicht verbündet)."
 FRW_rhine_confederation:0 "Der Rheinbund"
 FRW_rhine_confederation_desc:0 "Das linke Rheinufer und Baden werden erneut unter den Schutz des Kaisers gestellt."
 FRW_rhine_confederation_tt:0 "Kriegsziel gegen §YDeutschland§! für §YMoselland§!, das §YRheinland§! und §YBaden§! (sofern nicht verbündet)."
 FRW_kingdom_of_italy_napoleon:0 "Das Königreich Italien"
 FRW_kingdom_of_italy_napoleon_desc:0 "Das Piemont war unter dem Ersten Kaiserreich ein französisches Département und Mailand die Hauptstadt von Napoleons Königreich Italien. Sein Erbe will beides wiederherstellen."
 FRW_kingdom_of_italy_napoleon_tt:0 "Kriegsziel gegen §YItalien§! für das §YPiemont§! (sofern nicht verbündet)."
 FRW_grand_empire:0 "Das Grand Empire"
 FRW_grand_empire_desc:0 "Das Kaiserreich der Franzosen reichte einst von Hamburg bis Rom. Napoléon VI. macht sich daran, es wiederaufzubauen."
 FRW_grand_empire_tt:0 "Bildet das §YGroße Französische Kaiserreich§!: neuer Name, kaiserliche Flagge, dunkelblaue Kartenfarbe, Nationalgeist sowie §GKerngebiete auf den Ländereien der Beneluxländer, des Rheinlands, der Schweiz, Norditaliens, Sardiniens und Kataloniens§!, die Frankreich besitzt (auch auf allen, die es dort später hinzugewinnt), und §YAnsprüche§! auf den Rest.\nErsetzt jede Nation, die Frankreich zuvor gebildet hat (deren Nationalgeist wird entfernt). Ist Frankreich bereits das §YEwige Königreich Francia§!, bleibt es dies.\nErfordert die Kontrolle über den §YRhein§! (Rheinland, Moselland), das §YPiemont§!, §YBelgien§! und die §YNiederlande§! (annektiert oder als Satelliten, sofern nicht anders angegeben). Kontrolliert Frankreich sie noch nicht, wird die Nation automatisch gegründet, sobald dies der Fall ist."
 FRW_iron_crown:0 "Die Eiserne Krone"
 FRW_iron_crown_desc:0 "Napoleon wurde 1805 in Mailand mit der Eisernen Krone der Langobarden gekrönt. Auch sein Erbe will sie tragen."
 FRW_legion_of_honour:0 "Die Ehrenlegion"
 FRW_legion_of_honour_desc:0 "Wie der erste Napoleon belohnt der Kaiser Tapferkeit im Feld mit der Légion d'honneur."
 FRW_imperial_navy:0 "Die Kaiserliche Marine"
 FRW_imperial_navy_desc:0 "Die Niederlage von Trafalgar 1805 wurde nie gerächt. Das Kaiserreich gibt eine Flotte in Auftrag, die seinen Ambitionen gerecht wird."
 FRW_emperor_of_the_west:0 "Kaiser des Westens"
 FRW_emperor_of_the_west_desc:0 "Das Wort des Kaisers gilt nun vom Atlantik bis zur Elbe und von der Nordsee bis zum Tiber, unter einem einzigen Gesetzbuch."
 FRW_act_of_mediation:0 "Die Mediationsakte"
 FRW_act_of_mediation_desc:0 "1803 gab Napoleon den Schweizern eine Verfassung und seinen Schutz. Sein Erbe erneuert diese Ordnung."
 FRW_duchy_of_warsaw:0 "Das Herzogtum Warschau"
 FRW_duchy_of_warsaw_desc:0 "Polnische Ulanen folgten Napoleon von Madrid bis Moskau. Polen soll erneut der Vorposten des Kaiserreichs im Osten werden."
 FRW_egyptian_campaign:0 "Der Ägyptenfeldzug"
 FRW_egyptian_campaign_desc:0 "Bonaparte führte seine Armee 1798 zu den Pyramiden. Sein Erbe hat den Sueskanal im Blick."
 FRW_egyptian_campaign_tt:0 "Ansprüche auf §YKairo§!, §YAlexandria§! und das Gebiet um §YSues§! sowie ein Kriegsziel gegen den Besitzer Alexandrias (Ägypten oder Großbritannien)."
 FRW_road_to_moscow:0 "Der Weg nach Moskau"
 FRW_road_to_moscow_desc:0 "Der Feldzug von 1812 endete im Schnee. Diesmal hat die Grande Armée Panzer, und Warschau ist bereits ein Verbündeter."
 FRW_road_to_moscow_tt:0 "Ansprüche auf §YMinsk§!, §YWitebsk§!, §YSmolensk§! und §YMoskau§! sowie ein Kriegsziel gegen die §YSowjetunion§!."
 FRW_continental_empire:0 "Das Kontinentale Kaiserreich"
 FRW_continental_empire_desc:0 "Die Dynastie herrscht nun von Cádiz bis zum Nil und vom Ärmelkanal bis zur Weichsel."
 FRW_legitimate_heir:0 "Der rechtmäßige Erbe"
 FRW_legitimate_heir_desc:0 "Für die Legitimisten sind die Orléans Usurpatoren. Der rechtmäßige König ist der älteste Erbe Ludwigs XIV.: Alfons von Bourbon, der exilierte König von Spanien, den sie Alphonse I. nennen."
 FRW_legitimate_heir_tt:0 "§YAlfons von Bourbon§! (nach seinem Tod 1941: sein Sohn §YJacques II.§!) wird König von Frankreich. Die Legitimisten bilden die Regierung.\nErfordert die Unterstützung von §YAlfons von Bourbon§! (Entscheidung §YAlfons von Bourbon gewinnen§!, 45 Tage)."
 FRW_white_flag:0 "Die weiße Fahne"
 FRW_white_flag_desc:0 "Heinrich V. verzichtete 1873 lieber auf den Thron, als die Trikolore anzunehmen. Seine Erben bringen das weiße Banner der Bourbonen zurück, zumindest auf die Dächer der Paläste."
 FRW_spanish_bourbons:0 "Die Bourbonen von Madrid"
 FRW_spanish_bourbons_desc:0 "Der neue König ist zugleich der exilierte König von Spanien. Monarchisten auf beiden Seiten der Pyrenäen blicken nach Paris."
 FRW_spanish_bourbons_tt:0 "Jede spanische Bürgerkriegspartei erhält zudem §YBindungen an die französische Krone§!."
 FRW_requetes:0 "Die Requetés von Navarra"
 FRW_requetes_desc:0 "Karlistische Freiwillige mit roten Baskenmützen überqueren die Pyrenäen, um dem König zu dienen. Sie sind fromm, diszipliniert und kampfbegierig."
 FRW_secure_crown_of_spain:0 "Die spanische Krone sichern"
 FRW_secure_crown_of_spain_desc:0 "Alfons verließ Madrid 1931, ohne abzudanken. Paris fordert Spanien auf, seinen König zurückzunehmen, wenn möglich auf friedlichem Weg."
 FRW_secure_crown_of_spain_tt:0 "Falls Spanien sich im Bürgerkrieg befindet: Kriegsziel §YSatellit§! gegen jede spanische Seite, die nicht mit Frankreich verbündet ist.\nAndernfalls wird §YSpanien§! aufgefordert, den König von Frankreich als eigenen König anzuerkennen (es wird ein französischer Satellit). Eine Ablehnung verschafft Frankreich ein Kriegsziel."
 FRW_unite_the_crowns:0 "Die Kronen vereinen"
 FRW_unite_the_crowns_desc:0 "Philipp V. musste 1713 auf den französischen Thron verzichten, damit die beiden Kronen niemals vereint würden. Der Vertrag von Utrecht ist nun toter Buchstabe, und Frankreich und Spanien werden ein einziges Königreich."
 FRW_unite_the_crowns_tt:0 "Annektiert alle spanischen Satelliten Frankreichs.\nGründet das §YBourbonische Königreich Frankreich und Spanien§!: neuer Name und neue Flagge, Nationalgeist §YDie Doppelmonarchie§! sowie §GKerngebiete auf den spanischen Gebieten§!, die Frankreich besitzt (auch auf allen, die es dort später hinzugewinnt), und §YAnsprüche§! auf den Rest.\nErsetzt jede Nation, die Frankreich zuvor gebildet hat. Erfordert die Kontrolle über §YMadrid§! (annektiert oder als Satellit); kontrolliert Frankreich es noch nicht, wird das Königreich gegründet, sobald dies der Fall ist."
 FRW_two_crowns:0 "Zwei Länder, zwei Kronen"
 FRW_two_crowns_desc:0 "Ein König, zwei Königreiche: Frankreich und Spanien behalten ihre eigenen Regierungen und Armeen, stehen aber gemeinsam unter dem Haus Bourbon."
 FRW_two_crowns_tt:0 "Spanien wird wieder unabhängig (falls es ein französischer Satellit war) und tritt gemeinsam mit Frankreich dem §YBourbonischen Familienpakt§! bei. Beide Königreiche behalten ihre eigenen Regierungen."
 FRW_no_more_pyrenees:0 "Es gibt keine Pyrenäen mehr"
 FRW_no_more_pyrenees_desc:0 "„Il n'y a plus de Pyrénées“, soll Ludwig XIV. bemerkt haben, als sein Enkel König von Spanien wurde. Straßen, Eisenbahnen und Zölle behandeln die Berge nun, als gäbe es sie nicht."
 FRW_no_more_pyrenees_tt:0 "Spanien, falls es an Frankreichs Seite steht: §YBourbonischer Partner§! (+5 % Fabrikleistung, +5 % Stabilität)."
 FRW_catholic_kings:0 "Die Allerkatholischsten Könige"
 FRW_catholic_kings_desc:0 "Die Kirche erhält ihre Schulen und ihre Sitze in den Staatsräten zurück. Im Gegenzug predigen die Bischöfe beider Königreiche Treue zur Krone."
 FRW_portuguese_alliance:0 "Ein Angebot an Lissabon"
 FRW_portuguese_alliance_desc:0 "Allein Lissabon steht auf der Halbinsel noch abseits. Paris und Madrid bieten Salazar einen Platz unter der bourbonischen Krone an, und sie werden nicht lange auf eine Antwort warten."
 FRW_heirs_of_louis_xiv:0 "Die Erben Ludwigs XIV."
 FRW_heirs_of_louis_xiv_desc:0 "Zum ersten Mal seit dem Sonnenkönig herrscht ein Bourbone vom Ärmelkanal bis Gibraltar. Die Höflinge sprechen von einem neuen Grand Siècle."
 FRW_rock_of_gibraltar:0 "Der Felsen von Gibraltar"
 FRW_rock_of_gibraltar_desc:0 "Spanien verlor Gibraltar 1704 an die Briten, als es für den Anspruch Philipps von Anjou kämpfte, des ersten bourbonischen Königs von Spanien. Seine Erben herrschen nun in Paris und Madrid, und sie wollen den Felsen zurück."
 FRW_rock_of_gibraltar_tt:0 "Kriegsziel gegen §YGroßbritannien§! um §YGibraltar§! (außer Großbritannien ist ein Verbündeter)."
 FRW_two_sicilies:0 "Die Krone beider Sizilien"
 FRW_two_sicilies_desc:0 "Bis 1861 herrschte ein bourbonischer König in Neapel und Palermo. Die Savoyer nahmen ihm sein Königreich mit Gewalt, und der älteste Bourbone beansprucht es nun als Erbe seiner Familie."
 FRW_two_sicilies_tt:0 "Kriegsziel gegen §YItalien§! um §YKampanien, Sizilien, Kalabrien und Apulien§! (außer Italien ist ein Verbündeter)."
 FRW_family_compact_fleet:0 "Die Flotte des Familienpakts"
 FRW_family_compact_fleet_desc:0 "1761 vereinten die bourbonischen Könige Frankreichs und Spaniens ihre Flotten gegen Großbritannien. Brest, Toulon, Ferrol und Cartagena bauen nun wieder für eine einzige Marine."
 FRW_family_compact_fleet_tt:0 "Wenn Frankreich §YGalicien§! (Ferrol) und §YMurcia§! (Cartagena) besitzt: jeweils §G+2§! Werften."
 FRW_house_of_parma:0 "Das Haus Bourbon-Parma"
 FRW_house_of_parma_desc:0 "Prinz Félix von Bourbon-Parma ist der Gemahl der Großherzogin von Luxemburg, und Parma selbst war bis 1859 ein bourbonisches Herzogtum. Beide werden aufgefordert, in den Schoß der Familie heimzukehren."
 FRW_nec_pluribus_impar:0 "Nec Pluribus Impar"
 FRW_nec_pluribus_impar_desc:0 "„Vielen nicht ungleich“ lautete der Wahlspruch Ludwigs XIV. Vom Ärmelkanal bis Sizilien ist das Haus Bourbon wieder jeder Koalition gewachsen, die Europa gegen es aufbieten kann."
 FRW_nec_pluribus_impar_tt:0 "§YLe Grand Siècle§! wird zu §YNec Pluribus Impar§!."
 FRW_devalue_the_franc:0 "Den Franc abwerten"
 FRW_devalue_the_franc_desc:0 "Frankreich kann den Goldblock nicht länger zusammenhalten. Eine Abwertung soll die französischen Exporte wieder wettbewerbsfähig machen."
 FRW_econ_dirigisme:0 "Die gelenkte Wirtschaft"
 FRW_econ_dirigisme_desc:0 "Von den Verstaatlichungen der Volksfront bis zu den Planungsämtern späterer Regierungen haben französische Minister aller Parteien darauf vertraut, dass Paris die Wirtschaft lenkt. Kredite, Investitionen und Produktion werden Plänen folgen, die der Staat aufstellt."
 FRW_econ_dirigisme_tt:0 "Wählt die §YGelenkte Wirtschaft§! als Wirtschaftsmodell Frankreichs. Ihr Geist wird durch §YIndustriekartelle§! und §YWirtschaftliche Unabhängigkeit§! gestärkt."
 FRW_econ_liberal:0 "Wirtschaftsliberalismus"
 FRW_econ_liberal_desc:0 "Die Eisenhüttenherren des Comité des Forges wollen den Franc von Kontrollen befreien und die Märkte sich selbst überlassen. Man lasse ihnen freie Hand, sagen sie, und die Fabriken werden wachsen."
 FRW_econ_liberal_tt:0 "Wählt den §YWirtschaftsliberalismus§! als Wirtschaftsmodell Frankreichs (nicht für Kommunisten). Sein Geist wird durch §YIndustriekartelle§! und §YWirtschaftliche Unabhängigkeit§! gestärkt."
 FRW_econ_rearmament:0 "Aufrüstung zuerst"
 FRW_econ_rearmament_desc:0 "Deutschlands Fabriken arbeiten seit 1935 für die Armee. Paris zieht nun nach, und der Haushalt der Arsenale hat Vorrang vor allem anderen."
 FRW_econ_rearmament_tt:0 "Wählt §YAufrüstung zuerst§! als Wirtschaftsmodell Frankreichs. Sein Geist wird durch §YIndustriekartelle§! und §YWirtschaftliche Unabhängigkeit§! gestärkt."
 FRW_economic_plan:0 "Der Wirtschaftsplan"
 FRW_economic_plan_desc:0 "Welchen Kurs die Regierung auch einschlägt, sie muss entscheiden, was gebaut werden soll, wo und wer dafür bezahlt."
 FRW_public_works:0 "Große öffentliche Bauvorhaben"
 FRW_public_works_desc:0 "Straßen, Brücken und Häfen werden ausgeschrieben; das gibt Arbeitslosen Arbeit und hinterlässt ein besser ausgestattetes Land."
 FRW_rationalize_industry:0 "Die Industrie rationalisieren"
 FRW_rationalize_industry_desc:0 "Viele französische Firmen sind noch kleine Familienbetriebe mit veralteten Maschinen. Fusionen und moderne Produktionsmethoden werden gefördert."
 FRW_rationalize_industry_tt:0 "Leidet Frankreich noch unter §YIneffiziente Wirtschaft§!, wird diese um eine Stufe verringert."
 FRW_reform_banque_de_france:0 "Die Banque de France reformieren"
 FRW_reform_banque_de_france_desc:0 "Die 200 größten Aktionäre verlieren ihren Einfluss auf die Banque de France, deren Rat nun größtenteils vom Staat ernannt wird."
 FRW_autoroutes_nationales:0 "Die Nationalstraßen"
 FRW_autoroutes_nationales_desc:0 "Die alten Routes Nationales werden verbreitert, neu asphaltiert und miteinander verbunden. Lastwagen und Militärkonvois durchqueren das Land nun in Stunden statt in Tagen."
 FRW_sncf_modernization:0 "Die SNCF gründen"
 FRW_sncf_modernization_desc:0 "Am 1. Januar 1938 werden die großen privaten Eisenbahngesellschaften zur Société Nationale des Chemins de fer Français zusammengelegt."
 FRW_modern_management:0 "Wissenschaftliche Betriebsführung"
 FRW_modern_management_desc:0 "Ausgebildete Ingenieure übernehmen Vorstandsetagen, die lange von Gründerfamilien geführt wurden, und die französische Industrie beginnt, ihre Kosten zu kalkulieren."
 FRW_modern_management_tt:0 "Entfernt §YIneffiziente Wirtschaft§! vollständig.\nErfordert alle Fokusse der darüberliegenden Reihe sowie eine Industrie von mindestens §Y40§! Zivil- und §Y25§! Militärfabriken.\nAlle tieferen Fokusse des Wirtschaftsbaums bauen darauf auf."
 FRW_industrial_cartels:0 "Industriekartelle"
 FRW_industrial_cartels_desc:0 "Ausschüsse für jeden Industriezweig teilen die Rohstoffe auf und stimmen Investitionen ab."
 FRW_industrial_cartels_tt:0 "Hebt den Geist des gewählten §YWirtschaftsmodells§! auf die nächste Stufe."
 FRW_hydroelectric_alps:0 "Wasserkraft in den Alpen"
 FRW_hydroelectric_alps_desc:0 "Staudämme an der Rhône und in den Alpentälern liefern billigen Strom für neue Fabriken."
 FRW_electrification:0 "Elektrifizierung"
 FRW_electrification_desc:0 "Kraftwerke an Rhône und Rhein leiten Strom bis zu den entlegensten Höfen des Zentralmassivs. Entlang der Leitungen siedelt sich neue Industrie an."
 FRW_lorraine_steel:0 "Lothringer Stahl"
 FRW_lorraine_steel_desc:0 "Neue Abbau- und Verhüttungsverfahren nutzen das minderwertige Minette-Erz Lothringens besser."
 FRW_heavy_industry_nord:0 "Schwerindustrie im Norden"
 FRW_heavy_industry_nord_desc:0 "Zechen und Stahlwerke in den Departements Nord und Pas-de-Calais werden erweitert."
 FRW_renault_and_citroen:0 "Renault und Citroën"
 FRW_renault_and_citroen_desc:0 "Renault und Citroën stellen ihre Fließbänder auf Lastwagen, Traktoren und Panzerfahrzeuge um."
 FRW_research_institutes:0 "Das CNRS gründen"
 FRW_research_institutes_desc:0 "Das neue Centre National de la Recherche Scientifique fasst die Laboratorien des Landes unter einer Verwaltung zusammen."
 FRW_bauxite_provence:0 "Bauxit der Provence"
 FRW_bauxite_provence_desc:0 "Bauxit, benannt nach Les Baux in der Provence, wird dort für das Aluminium abgebaut, das die Flugzeugbauer benötigen."
 FRW_rearmament_plan:0 "Das Aufrüstungsprogramm von 1936"
 FRW_rearmament_plan_desc:0 "Vierzehn Milliarden Franc werden für vier Jahre Aufrüstung bewilligt. Renault soll Panzer bauen, Schneider Geschütze und Dewoitine Flugzeuge."
 FRW_rearmament_plan_tt:0 "Erfordert §YRaoul Dautry§! als politischen Berater (Entscheidung §YRaoul Dautry ernennen§! im §YMinisterrat§!, Ressort §YWirtschaft§!)."
 FRW_aviation_industry:0 "Die Flugzeugindustrie neu ordnen"
 FRW_aviation_industry_desc:0 "Flugzeugfabriken werden vom Staat übernommen und in regionalen SNCA-Gesellschaften zusammengefasst."
 FRW_atomic_research:0 "Das Laboratorium Joliot-Curie"
 FRW_atomic_research_desc:0 "Frédéric und Irène Joliot-Curie, Nobelpreisträger von 1935, stehen an der Spitze der Kernforschung."
 FRW_ecole_polytechnique:0 "Die Grandes Écoles ausbauen"
 FRW_ecole_polytechnique_desc:0 "Polytechnique, Centrale und die École des Mines verdoppeln ihre Aufnahmezahlen. Ihre Absolventen werden die Waffen des Landes entwerfen und seine Fabriken leiten."
 FRW_iraqi_oil:0 "Die Ölkonzession von Mossul"
 FRW_iraqi_oil_desc:0 "Über die Compagnie Française des Pétroles besitzt Frankreich fast ein Viertel der Iraq Petroleum Company. Rohöl aus Kirkuk gelangt per Pipeline nach Tripoli und wird von dort zu Raffinerien bei Marseille verschifft."
 FRW_dockyards_brest:0 "Die Arsenale von Brest"
 FRW_dockyards_brest_desc:0 "Die Arsenale von Brest und Lorient erhalten neue Maschinen und neue Hellingen. Hier werden die Schiffe der Atlantikflotte gebaut."
 FRW_consumer_economy:0 "Die Konsumgüterindustrie"
 FRW_consumer_economy_desc:0 "Mehr Haushalte der Mittelschicht können sich einen Kühlschrank, ein Radiogerät oder ein Automobil leisten."
 FRW_thomson_electronics:0 "Die Funkindustrie"
 FRW_thomson_electronics_desc:0 "Thomson-Houston, SFR und das Laboratoire Central des Télécommunications erhalten Staatsaufträge für Funkgeräte und frühe Radaranlagen."
 FRW_war_economy:0 "Die Kriegswirtschaft"
 FRW_war_economy_desc:0 "Fabriken werden für die Umstellung vorbereitet, Vorräte angelegt und Arbeitskräfte für den Arbeitseinsatz erfasst. Sollte es zum Krieg kommen, ist die Industrie binnen Wochen bereit."
 FRW_dispersed_industry:0 "Die Rüstungsindustrie dezentralisieren"
 FRW_dispersed_industry_desc:0 "Neue Werke entstehen in Toulouse, Bordeaux und Marseille, außerhalb der Reichweite von in Deutschland stationierten Bombern."
 FRW_paris_expo:0 "Pariser Weltausstellung 1937"
 FRW_paris_expo_desc:0 "Die Internationale Ausstellung von 1937 zeigt französische Kunst und Ingenieurskunst am Ufer der Seine."
 FRW_economic_modernization:0 "Wirtschaftliche Modernisierung"
 FRW_economic_modernization_desc:0 "Ein breit angelegtes Investitionsprogramm soll die französische Industrie auf britisches und deutsches Niveau bringen."
 FRW_arsenal_de_la_republique:0 "Arsenal der Republik"
 FRW_arsenal_de_la_republique_desc:0 "Die staatlichen Arsenale arbeiten im Schichtbetrieb rund um die Uhr und produzieren Waffen in Mengen, wie man sie in Friedenszeiten nie gesehen hat."
 FRW_strategic_stockpiles:0 "Strategische Vorräte"
 FRW_strategic_stockpiles_desc:0 "Depots werden für den Tag der Mobilmachung mit Gewehren, Granaten und Ersatzteilen gefüllt."
 FRW_regional_development:0 "Regionalplanung"
 FRW_regional_development_desc:0 "Kredite und öffentliche Bauvorhaben werden in die vernachlässigten Departements Zentralfrankreichs gelenkt."
 FRW_war_production_board:0 "Rüstungsministerium"
 FRW_war_production_board_desc:0 "Raoul Dautrys Rüstungsministerium übernimmt die Leitung der gesamten Kriegsproduktion."
 FRW_economic_independence:0 "Wirtschaftliche Unabhängigkeit"
 FRW_economic_independence_desc:0 "Frankreich strebt an, seinen Bedarf aus dem Boden des Mutterlandes und des Kolonialreichs zu decken."
 FRW_economic_independence_tt:0 "Hebt den Geist des gewählten §YWirtschaftsmodells§! um eine Stufe an (auf die letzte Stufe, wenn auch §YIndustriekartelle§! abgeschlossen ist)."
 FRW_franc_treasury_crisis:0 "Die Krise der Staatskasse"
 FRW_franc_treasury_crisis_desc:0 "Die Staatskasse lebt von Monat zu Monat von Vorschüssen der Banque de France. Bevor irgendeine Reform beginnen kann, muss jemand herausfinden, wie viel Geld der Staat tatsächlich besitzt."
 FRW_franc_treasury_crisis_tt:0 "Inflation: §G-5§!"
 FRW_franc_stabilisation_fund:0 "Der Währungsstabilisierungsfonds"
 FRW_franc_stabilisation_fund_desc:0 "Ein Fonds aus Gold und Devisen wird eingerichtet, um den Franc an den Märkten zu verteidigen, wie es London und Washington bereits tun. Spekulanten müssen nun neben der Banque de France auch mit dem Schatzamt rechnen."
 FRW_franc_stabilisation_fund_tt:0 "Goldreserven: §G+100 t§!\nVon nun an §G+5 t§! Gold pro Monat."
 FRW_franc_defence_bonds:0 "Anleihen der Landesverteidigung"
 FRW_franc_defence_bonds_desc:0 "Die Staatskasse verkauft Anleihen in jedem Postamt Frankreichs. Sparer leihen ihre Francs dem Staat, statt sie auszugeben, und die Plakate versprechen, dass jeder Franc eine Granate kauft."
 FRW_franc_defence_bonds_tt:0 "Inflation: §G-8§!"
 FRW_franc_fiscal_reform:0 "Die Finanzreform"
 FRW_franc_fiscal_reform_desc:0 "Das Parlament beschließt neue Steuern, streicht Ausnahmen und verabschiedet den Haushalt ausnahmsweise fristgerecht. Das Defizit schrumpft und mit ihm die Vorschüsse der Banque de France."
 FRW_franc_fiscal_reform_tt:0 "Von nun an sinkt die Inflation um weitere §G0,25§! Punkte pro Monat."
 FRW_franc_safe_havens:0 "Sichere Häfen für das Gold"
 FRW_franc_safe_havens_desc:0 "Ein Teil der Reserven wird in aller Stille in Tresore in Dakar, Fort-de-France und Ottawa gebracht, außer Reichweite jedes Eindringlings."
 FRW_franc_safe_havens_tt:0 "Die Goldreserven sind in Sicherheit: Wenn Frankreich kapituliert, kann das §YFreie Frankreich§! sie weiterhin ausgeben."
 FRW_franc_colonial_gold:0 "Das Gold des Kolonialreichs"
 FRW_franc_colonial_gold_desc:0 "Geologen und Ingenieure werden in die Goldfelder Guineas und des Französischen Sudans entsandt. Die Ausbeute ist gering, doch jede Unze wird innerhalb der Franc-Zone gefördert."
 FRW_franc_colonial_gold_tt:0 "Goldreserven: §G+50 t§!\nVon nun an §G+5 t§! Gold pro Monat."
 FRW_franc_strong_franc:0 "Ein starker Franc"
 FRW_franc_strong_franc_desc:0 "Mit einem ausgeglichenen Haushalt und vollen Tresoren behält der Franc seinen Wert, und Kapital, das nach London und New York geflohen war, kehrt zurück. Kredit wird billig, und die Baustellen öffnen wieder."
 FRW_franc_strong_franc_tt:0 "Inflation: §G-10§!"
 FRW_franc_war_finance:0 "Die Finanzierung des Krieges"
 FRW_franc_war_finance_desc:0 "Der Krieg wird mit Steuern, Anleihen und Kontrollen bezahlt statt mit der Notenpresse. Die Minister erinnern sich, was die Kriegsschulden nach 1918 dem Franc angetan haben."
 FRW_franc_war_finance_tt:0 "Inflation: §G-8§!\nNur §Yim Krieg§! verfügbar."
 FRW_lessons_of_verdun:0 "Die Lehren von Verdun"
 FRW_lessons_of_verdun_desc:0 "Stabsoffiziere studieren die Feldzüge von 1914 bis 1918, damit die Armee deren Fehler nicht wiederholt."
 FRW_beyond_victory:0 "Die Selbstzufriedenheit des Siegers überwinden"
 FRW_beyond_victory_desc:0 "Seit dem Sieg von 1918 ist sich die Armee ihrer Methoden sicher. Ihre Offiziere müssen sie nun hinterfragen."
 FRW_beyond_victory_tt:0 "Die verbleibenden Zweifel (§YDie Zweifel des Siegers§!) werden erst durch §YEine moderne Armee§! am Ende des Heereszweigs beseitigt."
 FRW_methodical_battle:0 "Die methodische Schlacht"
 FRW_methodical_battle_desc:0 "Die Armee kämpft nach sorgfältigem Plan, mit massierter Artillerie und einer durchgehenden, gut gehaltenen Front."
 FRW_methodical_battle_tt:0 "§YDie Generäle von 1918§! wird zu §YEin Oberkommando im Umbruch§! abgeschwächt. §YDen Generalstab reformieren§! beseitigt diesen Geist."
 FRW_war_of_movement:0 "Der Bewegungskrieg"
 FRW_war_of_movement_desc:0 "Panzer, Lastwagen und Funk werden den nächsten Krieg entscheiden, und er wird schnell verlaufen."
 FRW_war_of_movement_tt:0 "§YDie Generäle von 1918§! wird zu §YEin Oberkommando im Umbruch§! abgeschwächt. §YDen Generalstab reformieren§! beseitigt diesen Geist."
 FRW_maginot_extension:0 "Die Maginot-Linie verlängern"
 FRW_maginot_extension_desc:0 "Die Maginot-Linie endet an der belgischen Grenze, wie der deutsche Generalstab sehr wohl weiß. Neue Kasematten und Hindernisse sollen nun von Montmédy bis zum Meer reichen."
 FRW_heavy_artillery:0 "Schwere Artillerie"
 FRW_heavy_artillery_desc:0 "Schneider und das Atelier de Puteaux liefern neue Geschütze, die die Bestände des letzten Krieges ersetzen."
 FRW_mas_rifles:0 "Das MAS-36"
 FRW_mas_rifles_desc:0 "Das MAS-36 ist kürzer und leichter als das alte Lebel und schneller nachzuladen. Es soll an jedes Infanterieregiment ausgegeben werden."
 FRW_mechanized_divisions:0 "Leichte mechanisierte Divisionen"
 FRW_mechanized_divisions_desc:0 "Die Kavallerie stellt leichte mechanisierte Divisionen auf, die vor der Armee aufklären und einen geschlagenen Feind verfolgen sollen. Lastwagen lösen die Pferdekolonnen ab, die noch immer den Nachschub der Armee befördern."
 FRW_divisions_cuirassees:0 "Panzerdivisionen"
 FRW_divisions_cuirassees_desc:0 "Nach den Ideen von Oberst de Gaulle werden Panzer in selbstständigen Panzerdivisionen zusammengefasst. Die Arbeit an einem schwereren Durchbruchspanzer als Nachfolger des Char B1 geht weiter."
 FRW_chasseurs_alpins:0 "Chasseurs Alpins und Spahis"
 FRW_chasseurs_alpins_desc:0 "Die Chasseurs Alpins, die „Blauen Teufel“ des letzten Krieges, zählen zu den besten Gebirgstruppen Europas. Alle Alpendivisionen sollen nach ihrem Standard ausgebildet werden. Die berittenen Spahi-Regimenter Nordafrikas werden als Aufklärungseinheiten neu ausgerüstet."
 FRW_colonial_troops:0 "Kolonialtruppen"
 FRW_colonial_troops_desc:0 "Senegalesische Tirailleurs und nordafrikanische Spahis werden zur Verstärkung der Armee herangezogen."
 FRW_general_staff_reform:0 "Den Generalstab reformieren"
 FRW_general_staff_reform_desc:0 "Ältere Generäle werden in den Ruhestand versetzt, und jüngere Offiziere erhalten Kommandos."
 FRW_foreign_legion:0 "Die Fremdenlegion"
 FRW_foreign_legion_desc:0 "Die Fremdenlegion, deren Wahlspruch Legio Patria Nostra lautet, wird vergrößert und zu einer Elitetruppe ausgebildet."
 FRW_reserve_system:0 "Das Reservesystem"
 FRW_reserve_system_desc:0 "Reservisten werden zu regelmäßigen Übungen einberufen, damit sie schnell wieder zu ihren Einheiten stoßen können."
 FRW_reserve_system_tt:0 "Erfordert §YAlfred Sauvy§! als politischen Berater (Entscheidung §YAlfred Sauvy ernennen§! im §YMinisterrat§!, Ressort §YWirtschaft§!)."
 FRW_combined_arms:0 "Verbundene Waffen"
 FRW_combined_arms_desc:0 "Infanterie, Panzer, Artillerie und Flugzeuge üben gemeinsam und lernen, im Verbund zu kämpfen. Die 47-mm-SA 37 durchschlägt die Panzerung jedes derzeit in Europa eingesetzten Panzers. Jede Infanteriedivision soll genug davon erhalten, um einen Panzerangriff aufzuhalten."
 FRW_paratroopers:0 "Fallschirmjäger und Corps Francs"
 FRW_paratroopers_desc:0 "Frankreich stellte 1937 seine ersten Fallschirmkompanien auf, die Infanterie de l'Air – eine der ersten weltweit. Kleine Stoßtrupps werden für Aufklärung und Handstreiche ausgebildet."
 FRW_desert_warfare:0 "Wüstenkrieg"
 FRW_desert_warfare_desc:0 "Die Lehren aus den Feldzügen in Marokko und der Sahara werden gesammelt und vermittelt."
 FRW_artillery_barrage:0 "Die Feuerwalze"
 FRW_artillery_barrage_desc:0 "Im Detail geplantes und eng mit der Infanterie abgestimmtes Feuer bleibt die Grundlage der französischen Taktik."
 FRW_army_of_the_republic:0 "Eine moderne Armee"
 FRW_army_of_the_republic_desc:0 "Abgesehen von ihren Fahnen hat die Armee von 1940 wenig mit der von 1918 gemein. Ein gemeinsamer Stab wird eingerichtet, um Heer, Marine und Luftwaffe zu koordinieren."
 FRW_tank_production_lines:0 "Panzerfertigungsstraßen"
 FRW_tank_production_lines_desc:0 "In Issy-les-Moulineaux und Vénissieux werden neue Panzermontagelinien eröffnet."
 FRW_darlan_programme:0 "Das Darlan-Programm"
 FRW_darlan_programme_desc:0 "Frankreich besitzt die viertgrößte Marine der Welt, und ihre Schiffe müssen auf dem neuesten Stand gehalten werden. Admiral Darlan, ab 1937 Chef des Admiralstabs, drängt auf eine hochseefähige Flotte."
 FRW_darlan_programme_tt:0 "§YEine gespaltene Flotte§! wird zu §YEine Flotte im Umbau§! abgeschwächt. §YDie Werften von Toulon und Brest§! beseitigt diesen Geist.\nSchaltet das Ressort §YMarine§! im §YMinisterrat§! frei."
 FRW_richelieu_class:0 "Die Richelieu-Klasse"
 FRW_richelieu_class_desc:0 "Die Dunkerque und die Strasbourg waren nur die ersten der neuen Schlachtschiffe. Die Richelieu-Klasse wird allem gewachsen sein, was Italien oder Deutschland in See schicken können. Die Richelieu und ihre Schwesterschiffe werden die stärksten Schlachtschiffe sein, die Frankreich je gebaut hat."
 FRW_mediterranean_fleet:0 "Die Mittelmeerflotte"
 FRW_mediterranean_fleet_desc:0 "Französische Kreuzer und Großzerstörer gehören zu den schnellsten Kriegsschiffen der Welt. Der Seeweg nach Nordafrika muss um jeden Preis offengehalten werden."
 FRW_atlantic_squadrons:0 "Die Atlantikgeschwader"
 FRW_atlantic_squadrons_desc:0 "Die Marine investiert massiv in U-Boote, von der riesigen Surcouf bis zu kleinen Küstenbooten. Brest wird zum Hauptstützpunkt der Atlantikflotte."
 FRW_carrier_programme:0 "Das Flugzeugträgerprogramm"
 FRW_carrier_programme_desc:0 "Die alte Béarn ist der einzige Träger der Marine und für moderne Operationen zu langsam. Die neue Joffre-Klasse wird der Flotte eigene Flugzeuge verschaffen."
 FRW_naval_aviation:0 "Marineflieger"
 FRW_naval_aviation_desc:0 "Die Aéronavale erhält eigene Flugzeuge, Piloten und Fliegerhorste. Torpedobomber und Aufklärungsflugzeuge werden für die Flotte aufklären und angreifen."
 FRW_toulon_brest_yards:0 "Die Werften von Toulon und Brest"
 FRW_toulon_brest_yards_desc:0 "In Toulon und Brest werden neue Trockendocks für die nächste Generation von Kriegsschiffen gebaut."
 FRW_convoy_escorts:0 "Geleitschutz"
 FRW_convoy_escorts_desc:0 "Avisos und Korvetten geleiten die Handelsschiffe auf den Routen zu den Kolonien."
 FRW_coastal_defence:0 "Küstenverteidigung"
 FRW_coastal_defence_desc:0 "Die Fusiliers Marins, unvergessen für ihr Standhalten bei Diksmuide 1914, werden als moderne Landungstruppe neu aufgestellt. Küstenbatterien und Minenfelder schützen die Häfen Frankreichs und des Kolonialreichs."
 FRW_fleet_in_being:0 "Eine ausgewogene Flotte"
 FRW_fleet_in_being_desc:0 "Schlachtschiffe, Kreuzer, Zerstörer und U-Boote werden in ausgewogener Zahl gebaut, damit die Flotte in jedem Meer operieren kann."
 FRW_naval_treaties_end:0 "Abschied von den Flottenverträgen"
 FRW_naval_treaties_end_desc:0 "Frankreich betrachtet sich nicht länger an die Flottenverträge von Washington und London gebunden."
 FRW_plan_v:0 "Plan V"
 FRW_plan_v_desc:0 "Die Armée de l'Air ist erst seit 1934 eine eigenständige Teilstreitkraft. Plan V sieht 2.400 moderne Flugzeuge vor."
 FRW_plan_v_tt:0 "§YEine veraltete Luftwaffe§! wird zu §YEine Luftwaffe im Umbruch§! abgeschwächt. §YFlugschulen§! beseitigt diesen Geist.\nSchaltet das Ressort §YLuftwaffe§! im §YMinisterrat§! frei."
 FRW_dewoitine_fighters:0 "Dewoitine-Jäger"
 FRW_dewoitine_fighters_desc:0 "Die Dewoitine D.520 soll sich gegen jeden Jäger behaupten, dem sie begegnet."
 FRW_bomber_command:0 "Die Bomberstreitmacht"
 FRW_bomber_command_desc:0 "Die Staffeln werden mit modernen zweimotorigen Bombern wie der LeO 45 neu ausgerüstet."
 FRW_air_doctrine:0 "Luftkriegsdoktrin"
 FRW_air_doctrine_desc:0 "Der Stab legt schriftlich fest, was die Luftwaffe in einem künftigen Krieg zu leisten hat."
 FRW_colonial_air_bases:0 "Luftstützpunkte im Kolonialreich"
 FRW_colonial_air_bases_desc:0 "Flugplätze in Nordafrika erweitern die Luftdeckung über das westliche Mittelmeer."
 FRW_close_air_support:0 "Luftnahunterstützung"
 FRW_close_air_support_desc:0 "Sturzkampfbomber und Schlachtflugzeuge werden überall dorthin geschickt, wo die Infanterie sie anfordert. Zum ersten Mal übt die Armée de l'Air ernsthaft mit dem Heer."
 FRW_air_defence_paris:0 "Luftverteidigung von Paris"
 FRW_air_defence_paris_desc:0 "Flugabwehrgeschütze und Horchgeräte umgeben die Hauptstadt."
 FRW_pilot_schools:0 "Flugschulen"
 FRW_pilot_schools_desc:0 "Neue Flugschulen in Istres und Salon-de-Provence bilden jährlich mehrere hundert Piloten aus, während Pierre Cots Aviation Populaire jungen Männern in örtlichen Fliegerclubs das Fliegen beibringt."
 FRW_jet_research:0 "Strahltriebwerke"
 FRW_jet_research_desc:0 "Der Ingenieur René Leduc arbeitet an einem Staustrahltriebwerk."
 FRW_strategic_air_force:0 "Strategische Luftwaffe"
 FRW_strategic_air_force_desc:0 "Viermotorige Bomber erhalten den Befehl, Fabriken, Eisenbahnen und Häfen weit hinter den feindlichen Linien anzugreifen."
 FRW_strategic_air_force_tt:0 "Erfordert §YPierre Cot§! als politischen Berater (Entscheidung §YPierre Cot ernennen§! im §YMinisterrat§!, Ressort §YForschung§!)."
 FRW_air_superiority:0 "Luftüberlegenheit"
 FRW_air_superiority_desc:0 "Die jüngsten Kämpfe in Spanien haben gezeigt, dass Armeen ohne Deckung aus der Luft schwere Verluste erleiden. Die Armée de l'Air braucht mehr und schnellere Jäger."
 FRW_air_staff:0 "Der Luftwaffenstab"
 FRW_air_staff_desc:0 "Ein ständiger Luftwaffenstab plant nun den Einsatz von Jagd-, Bomben- und Aufklärungsstaffeln gemeinsam. Die Befehle werden von Offizieren kommen, die etwas von Flugzeugen verstehen."
 FRW_quai_d_orsay:0 "Der Quai d'Orsay"
 FRW_quai_d_orsay_desc:0 "Der Quai d'Orsay verfügt über mehr Erfahrung in der europäischen Diplomatie als jedes andere Außenministerium, und seine Botschafter werden in die Pflicht genommen."
 FRW_league_of_nations:0 "Den Völkerbund stärken"
 FRW_league_of_nations_desc:0 "Paris setzt sein Vertrauen in den Völkerbund in Genf und in gemeinsames Handeln gegen jeden Angreifer."
 FRW_eastern_alliances:0 "Das östliche Bündnissystem"
 FRW_eastern_alliances_desc:0 "Im Osten sollen Polen und die Staaten der Kleinen Entente Deutschland in Schach halten."
 FRW_mediterranean_policy:0 "Mittelmeerpolitik"
 FRW_mediterranean_policy_desc:0 "Gespräche mit Rom, Madrid und Ankara sollen das Mittelmeer ruhig und die Seewege nach Afrika offen halten."
 FRW_belgian_alliance:0 "Das belgische Bündnis"
 FRW_belgian_alliance_desc:0 "Der alte Invasionsweg nach Frankreich führt durch Belgien. Seine Verteidigung gilt als französische Angelegenheit."
 FRW_franco_polish_pact:0 "Französisch-polnischer Pakt"
 FRW_franco_polish_pact_desc:0 "Das Bündnis von 1921 wird erneuert und um neue militärische Klauseln ergänzt. Ein deutscher Vorstoß nach Osten würde einen Zweifrontenkrieg bedeuten."
 FRW_franco_soviet_pact:0 "Französisch-sowjetischer Pakt"
 FRW_franco_soviet_pact_desc:0 "Der 1935 unterzeichnete Beistandspakt wird endlich durch Stabsgespräche und praktische Verpflichtungen untermauert."
 FRW_franco_soviet_pact_tt:0 "Schließt einen §YNichtangriffspakt§! mit der §YSowjetunion§!."
 FRW_turkish_friendship:0 "Freundschaft mit der Türkei"
 FRW_turkish_friendship_desc:0 "Die Übergabe des Sandschaks Alexandrette an die Türkei sichert das Wohlwollen Ankaras."
 FRW_turkish_friendship_tt:0 "§YHatay§! wird an die §YTürkei§! übergeben (falls es Frankreich oder Französisch-Syrien gehört)."
 FRW_swiss_talks:0 "Gespräche mit Bern"
 FRW_swiss_talks_desc:0 "Paris nimmt Gespräche mit Bern auf, damit keine Armee Schweizer Gebiet nutzen kann, um die französischen Verteidigungsanlagen zu umgehen."
 FRW_balkan_guarantees:0 "Den Balkanpakt unterstützen"
 FRW_balkan_guarantees_desc:0 "Garantien für Griechenland und die Türkei schließen den Ring der französischen Bündnisse im Südosten."
 FRW_arms_exports:0 "Waffenexporte"
 FRW_arms_exports_desc:0 "Aufträge für französische Gewehre, Geschütze und Flugzeuge treffen von zahlreichen ausländischen Regierungen ein."
 FRW_deuxieme_bureau:0 "Das Deuxième Bureau"
 FRW_deuxieme_bureau_desc:0 "Der militärische Nachrichtendienst erhält mehr Personal und Geld. Seit 1931 gibt Hauptmann Bertrand Enigma-Unterlagen, die er einem deutschen Informanten abkauft, an das polnische Chiffrierbüro weiter."
 FRW_american_credits:0 "Amerikanische Kredite"
 FRW_american_credits_desc:0 "Darlehen und Fertigungslizenzen aus Washington beschleunigen die französische Aufrüstung."
 FRW_vatican_concordat:0 "Aussöhnung mit dem Vatikan"
 FRW_vatican_concordat_desc:0 "Ein Konkordat mit dem Heiligen Stuhl beendet den langen Streit zwischen der Republik und der Kirche."
 FRW_rhineland_response:0 "Antwort auf den Rheinland-Coup"
 FRW_rhineland_response_desc:0 "Im März 1936 setzte Hitler darauf, dass Frankreich sich nicht rühren würde, und gewann. Der nächste Bruch der Verträge wird nicht nur mit Protesten, sondern auch mit Truppen beantwortet."
 FRW_collective_security:0 "Kollektive Sicherheit"
 FRW_collective_security_desc:0 "Paris ruft jede Regierung, die eine Aggression fürchtet, dazu auf, sich Frankreich in einer gemeinsamen Front anzuschließen."
 FRW_collective_security_tt:0 "Ein demokratisches Frankreich, das keiner Fraktion angehört, gründet die §YKollektive Sicherheit§!."
 FRW_diplomatic_shield:0 "Diplomatischer Schild"
 FRW_diplomatic_shield_desc:0 "Jeder Staat, der Frankreich angreift, wird überall als Aggressor gelten."
 FRW_great_power_status:0 "La Grande Nation"
 FRW_great_power_status_desc:0 "Mit einer wiederaufgerüsteten Armee und erneuerten Bündnissen im Osten wird keine europäische Frage mehr ohne den Quai d’Orsay entschieden."
 FRW_empire_colonial:0 "Das Kolonialreich"
 FRW_empire_colonial_desc:0 "Frankreich besitzt das zweitgrößte Kolonialreich der Welt, und seine Menschen und Ressourcen sind die größte Reserve des Landes."
 FRW_ministry_of_colonies:0 "Das Kolonialministerium"
 FRW_ministry_of_colonies_desc:0 "Das Kolonialministerium in der Rue Oudinot wird neu organisiert. Ausgebildete Gouverneure, Ingenieure und Ärzte treten an die Stelle von Abenteurern und Spekulanten."
 FRW_african_development:0 "Nordafrika erschließen"
 FRW_african_development_desc:0 "In Algier, Oran und Casablanca entstehen Kraftwerke, Hafenanlagen und Fabriken, die Nordafrika zur industriellen Basis des Kolonialreichs machen."
 FRW_colonial_purchases:0 "Kolonialkäufe"
 FRW_colonial_purchases_desc:0 "Manches Gebiet ist für Geld zu haben. Spanien, Portugal, Belgien, Großbritannien und Italien besitzen Ländereien, die Französisch-Afrika abrunden würden."
 FRW_aof_federation:0 "Föderation Französisch-Westafrika"
 FRW_aof_federation_desc:0 "Die Kolonien Französisch-Westafrikas werden als eine einzige Föderation von Dakar aus regiert."
 FRW_trans_saharan_railway:0 "Die Transsahara-Bahn"
 FRW_trans_saharan_railway_desc:0 "Die Arbeiten an einer Eisenbahn quer durch die Sahara von Algier bis zum Niger beginnen, die Nord- und Westafrika verbinden soll."
 FRW_saharan_oil:0 "Das Öl der Sahara"
 FRW_saharan_oil_desc:0 "Geologen vermuten große Ölvorkommen unter der algerischen Sahara, und Erkundungstrupps werden nach Süden entsandt."
 FRW_tonkin_industry:0 "Industrie in Tonkin"
 FRW_tonkin_industry_desc:0 "Japan blickt nach Süden. Die Garnison Indochinas wird verstärkt. Die Kohlengruben und Arbeitskräfte Tonkins werden für die örtliche Industrie genutzt."
 FRW_moroccan_question:0 "Lyauteys Erbe"
 FRW_moroccan_question_desc:0 "Marschall Lyautey errichtete das marokkanische Protektorat auf der Achtung vor dem Sultan sowie auf Straßen, Häfen und Schulen. Seine Nachfolger sollen das Werk vollenden."
 FRW_moroccan_question_tt:0 "Marokkanische Staaten: §G+10 %§! Kooperation."
 FRW_liberia_protectorate:0 "Protektorat über Liberia"
 FRW_liberia_protectorate_desc:0 "Liberia ist hoch verschuldet. Frankreich bietet ihm Kredite und Schutz an."
 FRW_dakar_naval_base:0 "Marinestützpunkt Dakar"
 FRW_dakar_naval_base_desc:0 "Von Dakar aus kann die Marine die atlantische Meerenge zwischen Afrika und Südamerika überwachen."
 FRW_dakar_naval_base_tt:0 "§G+1§! Werft und Bauplatz in einem Küstenstaat in Afrika."
 FRW_mauritanian_iron:0 "Das Eisenerz Mauretaniens"
 FRW_mauritanian_iron_desc:0 "Untersuchungen bestätigen, dass der Berg Kediet ej Jill bei Zouérat fast vollständig aus Eisenerz besteht. Eine Bahnlinie zur Küste wird es zu den französischen Hochöfen bringen."
 FRW_pacific_bases:0 "Stützpunkte im Pazifik"
 FRW_pacific_bases_desc:0 "Neue Flugplätze in Indochina decken die asiatischen Besitzungen des Kolonialreichs."
 FRW_libyan_question:0 "Die Saharagrenze"
 FRW_libyan_question_desc:0 "Von Tindouf bis zum Fessan wird die Wüstengrenze von einer Handvoll Méharisten bewacht. Die Armée d'Afrique fordert Forts, Flugplätze und Brunnen."
 FRW_colonial_development_fund:0 "Der Kolonialinvestitionsfonds"
 FRW_colonial_development_fund_desc:0 "Ein öffentlicher Fonds wird eingerichtet, um Straßen, Eisenbahnen und Häfen in Afrika zu finanzieren."
 FRW_colonial_development_fund_tt:0 "§G+1§! Zivilfabrik und Bauplatz in einem Staat in Afrika."
 FRW_algerian_departments:0 "Algerien ist Frankreich"
 FRW_algerian_departments_desc:0 "Seit 1848 ist Algerien in Départements gegliedert, und Paris behandelt es als Teil Frankreichs selbst."
 FRW_djibouti_railway:0 "Die Bahn Dschibuti–Addis Abeba"
 FRW_djibouti_railway_desc:0 "Die französische Bahn von Dschibuti nach Addis Abeba ist Äthiopiens einzige Verbindung zum Meer."
 FRW_indochina_rubber:0 "Kautschuk aus Indochina"
 FRW_indochina_rubber_desc:0 "Kautschuk von den Michelin-Plantagen in Indochina ist der Armee vorbehalten."
 FRW_levant_mandates:0 "Die Levante-Mandate eingliedern"
 FRW_levant_mandates_desc:0 "Syrien und der Libanon werden der direkten französischen Verwaltung unterstellt."
 FRW_levant_mandates_tt:0 "Annektiert die französischen Mandate §YSyrien§! und §YLibanon§!, falls sie französische Satelliten sind. Verwaltet Frankreich die Levante bereits direkt (z. B. in Road to 56), erhält es lediglich den Verwaltungsbonus."
 FRW_eurafrique:0 "Eurafrika"
 FRW_eurafrique_desc:0 "Planer in Paris schlagen einen einheitlichen Wirtschaftsraum aus Europa und Afrika vor, mit Frankreich an der Spitze."
 FRW_colonial_war_production:0 "Kriegsproduktion im Kolonialreich"
 FRW_colonial_war_production_desc:0 "In Afrika errichtete Fabriken liegen außerhalb der Reichweite feindlicher Bomber."
 FRW_imperial_preference:0 "Imperiale Präferenz"
 FRW_imperial_preference_desc:0 "Innerhalb des Kolonialreichs sinken die Zölle, an seinen Grenzen steigen sie. Baumwolle, Kautschuk und Erz aus den Kolonien gehen zuerst an französische Fabriken."
 FRW_madagascar_development:0 "Madagaskar erschließen"
 FRW_madagascar_development_desc:0 "Madagaskar erhält neue Häfen und Straßen."
 FRW_national_cohesion:0 "Nationaler Zusammenhalt"
 FRW_national_cohesion_desc:0 "Seit den Unruhen vom 6. Februar 1934 liegen Rechte und Linke einander in den Haaren."
 FRW_end_political_violence:0 "Die Ligen auflösen"
 FRW_end_political_violence_desc:0 "Die Croix-de-Feu, die Camelots du Roi und die Milizen der Linken werden aufgelöst und ihre Waffen beschlagnahmt. Die Ordnung auf den Straßen wird der Polizei überlassen."
 FRW_radio_propaganda:0 "Radio Paris"
 FRW_radio_propaganda_desc:0 "Radio-Paris und die Regionalsender tragen die Botschaft der Regierung landesweit in Wohnungen, Cafés und Kasernen."
 FRW_code_de_la_famille:0 "Das Familiengesetzbuch"
 FRW_code_de_la_famille_desc:0 "Der Code de la famille von 1939 bietet Beihilfen und Anreize, um Frankreichs niedrige Geburtenrate zu heben."
 FRW_civil_defence:0 "Zivilschutz"
 FRW_civil_defence_desc:0 "Die Städte graben Luftschutzräume und halten Verdunkelungsübungen ab."
 FRW_mobilization_laws:0 "Das Gesetz über die Kriegsorganisation"
 FRW_mobilization_laws_desc:0 "Das Gesetz vom Juli 1938 über die Organisation der Nation in Kriegszeiten legt fest, wie Menschen und Industrie zu mobilisieren sind."
 FRW_rural_modernization:0 "Die Landwirtschaft modernisieren"
 FRW_rural_modernization_desc:0 "Traktoren und Dünger erreichen die Höfe und setzen Arbeitskräfte für die Fabriken frei."
 FRW_national_service:0 "Nationaler Dienst"
 FRW_national_service_desc:0 "Zivilisten wie Soldaten werden Pflichten auferlegt, entweder an der Front oder in den Rüstungsbetrieben."
 FRW_women_in_industry:0 "Frauen in der Industrie"
 FRW_women_in_industry_desc:0 "Wie 1914 übernehmen Frauen einen Großteil der Arbeit in den Fabriken."
 FRW_union_sacree:0 "Die Union sacrée"
 FRW_union_sacree_desc:0 "Im August 1914 stellten die Parteien ihre Streitigkeiten für die Dauer des Krieges zurück. Nun bittet die Regierung Arbeiter und Arbeitgeber, Katholiken und Antiklerikale, es ihnen gleichzutun."
 FRW_secret_captain:0 "Der Kapitän aus Saint-Malo"
 FRW_secret_captain_desc:0 "Der Brief aus Genf liegt auf dem Schreibtisch eines verwaisten Ministeriums. Sein Verfasser, ein bretonischer Kapitän mit polnischem Blut und einem Vermögen ungewisser Herkunft, bittet nur darum, gerufen zu werden. Er trifft mit einem einzigen Koffer ein, mit einem polnischen Offizierssäbel und einer schwarzen Flagge, die zusammengefaltet ganz unten in seiner Seekiste liegt. Niemand sonst hat angeboten, Frankreich zu regieren."
 FRW_secret_captain_tt:0 "§YMalo Kervadec§! wird Anführer Frankreichs.\nFrankreich und §YPolen§! nähern sich an.\nEin verborgener Pfad öffnet sich: die §YKüstenbrüder§!, die §YInseln§! und §YIberien§!."
 FRW_brethren_of_the_coast:0 "Die Küstenbrüder"
 FRW_brethren_of_the_coast_desc:0 "In den Tavernen von Saint-Malo, Brest und Toulon unterzeichnen die Männer des Kapitäns die alten Artikel der Küstenbrüder: ein Anteil an jeder Prise, eine Stimme bei jeder Kapitänswahl, eine Rente für jede Wunde. Vor den Anwerbebüros der Marine stehen Freiwillige Schlange."
 FRW_shipyards_of_saint_malo:0 "Die Werften von Saint-Malo"
 FRW_shipyards_of_saint_malo_desc:0 "Im alten Korsarenhafen wird wieder gebaut: Fregatten, Frachter und die Fabriken, die sie versorgen."
 FRW_sea_wolves:0 "Die Seewölfe"
 FRW_sea_wolves_desc:0 "Schnelle Kaperschiffe und U-Boote mit großer Reichweite legen sich auf den Seewegen auf die Lauer. Der Kapitän will, dass jeder Handelskapitän Europas sich ständig über die Schulter blickt."
 FRW_corsair_economy:0 "Die Prisenwirtschaft"
 FRW_corsair_economy_desc:0 "Gold, Schiffe und Ladungen, die auf See erbeutet wurden, werden an Land in Stahl und Maschinen verwandelt. Die Prisengerichte von Saint-Malo tagen Tag und Nacht."
 FRW_privateer_squadrons:0 "Kapergeschwader"
 FRW_privateer_squadrons_desc:0 "Jeder Reeder der Bretagne und der Normandie darf seine Schiffe unter einem französischen Kaperbrief bewaffnen. Der Staat bezahlt die Geschütze; die Reeder behalten die Hälfte ihrer Beute."
 FRW_boarding_parties:0 "Die Enterkommandos"
 FRW_boarding_parties_desc:0 "Marineinfanteristen, ausgebildet, ein Schiff oder einen Hafen im Handstreich zu nehmen: Enterhaken, Maschinenpistolen und keine Fragen."
 FRW_new_tortuga:0 "Ein neues Tortuga"
 FRW_new_tortuga_desc:0 "Saint-Malo wird zum Freihafen ohne Zoll und ohne Kontrollen erklärt. Jede Ladung Europas, die an einer Blockade vorbei muss, kann gegen eine Gebühr durch den Hafen des Kapitäns laufen."
 FRW_black_admiralty:0 "Die Schwarze Admiralität"
 FRW_black_admiralty_desc:0 "Die alten Admirale werden in den Ruhestand versetzt, und die eigenen Männer des Kapitäns übernehmen die Brücken der Flotte. Le Goff, Morvan und Duroc sind unter Flaggen gesegelt, die in keiner Marineliste verzeichnet sind."
 FRW_black_admiralty_tt:0 "Drei neue Admirale stoßen zur Flotte: §YYann Le Goff§! (Seewolf), §YCorentin Morvan§! (Blockadebrecher) und §YAnatole Duroc§! (Eiserne Flanke)."
 FRW_jolly_roger:0 "Unter dem Jolly Roger"
 FRW_jolly_roger_desc:0 "Die schwarze Flagge weht vom Großmast des Flaggschiffs. Die Flotte kämpft wie einst die Korsaren von Saint-Malo, sucht sich ihre Beute selbst und behält die Prise."
 FRW_letters_of_marque:0 "Kaperbriefe"
 FRW_letters_of_marque_desc:0 "Die Korsaren von Saint-Malo kämpften stets für Beute ebenso wie für Ruhm. Jeder besiegte Feind und jede beschützte Nation wird in die Kriegskasse des Kapitäns einzahlen, und jede Insel, die einen Seeweg beherrscht, ist eine lohnende Prise."
 FRW_letters_of_marque_tt:0 "Schaltet §YDie Staatskasse beschlagnahmen§! frei: Die Goldreserven jedes Landes, das ein §Yfranzösischer Satellit§! ist oder im Krieg mit Frankreich §Ykapituliert§! hat, werden eingezogen.\nFrankreich erhält §G+75§! politische Macht, eine Zivilfabrik und §YKorsarengold§! (180 Tage); das Opfer erleidet §RGeplünderte Staatskasse§! (365 Tage). Jedes Land kann einmal pro Jahr geplündert werden."
 FRW_isles_balearics:0 "Überfall auf die Balearen"
 FRW_isles_balearics_desc:0 "Mallorca und Menorca liegen quer zu jeder Route von Marseille nach Gibraltar. Der Kapitän will seine Fregatten in Port Mahón vor Anker legen, wo französische Schiffe zuletzt 1756 die Lilien führten."
 FRW_isles_balearics_tt:0 "§YAnsprüche§! auf die §YBalearen§! und ein §YKriegsziel§! gegen ihren Besitzer Spanien."
 FRW_isles_fortunate:0 "Die Glücklichen Inseln"
 FRW_isles_fortunate_desc:0 "Die Kanaren und Madeira bewachen den Weg nach Afrika und Amerika. Die Korsaren vergangener Zeiten nahmen sie sich wegen ihres Weins und ihres Zuckers; der Kapitän will ihre Häfen."
 FRW_isles_fortunate_tt:0 "§YAnsprüche§! auf die §YKanarischen Inseln§! und §YMadeira§! sowie §YKriegsziele§! gegen ihre Besitzer (Spanien, Portugal)."
 FRW_isles_keys_med:0 "Die Schlüssel des Mittelmeers"
 FRW_isles_keys_med_desc:0 "Malta und Gibraltar sind die beiden Schlösser des Binnenmeers, und die Royal Navy hält beide Schlüssel. Der Kapitän hat die Royal Navy noch nie gefürchtet."
 FRW_isles_keys_med_tt:0 "§YAnsprüche§! auf §YMalta§! und §YGibraltar§! und ein §YKriegsziel§! gegen Großbritannien."
 FRW_isles_azores:0 "Die Atlantikinseln"
 FRW_isles_azores_desc:0 "Die Azoren, die Kapverdischen Inseln und São Tomé würden es einer französischen Flotte erlauben, den Atlantik zu überqueren, ohne jemanden um Kohle bitten zu müssen."
 FRW_isles_azores_tt:0 "§YAnsprüche§! auf die §YAzoren§!, §YKap Verde§! und §YSão Tomé§! und ein §YKriegsziel§! gegen Portugal."
 FRW_isles_spanish_main:0 "Der Spanish Main"
 FRW_isles_spanish_main_desc:0 "Tortuga, Port Royal, Nassau: Die Karibik war das Königreich der Küstenbrüder. Der Kapitän schickt seine Schiffe zurück in die alten Jagdgründe um Jamaika, die Bahamas, Trinidad, Curaçao und die Inseln dazwischen."
 FRW_isles_spanish_main_tt:0 "§YAnsprüche§! auf die Karibikinseln und §YKriegsziele§! gegen ihre Besitzer:\n- §YGroßbritannien§!: Jamaika, die Bahamas, Trinidad, die Inseln über dem Winde, Bermuda\n- die §YNiederlande§!: Curaçao\n- §YHaiti§!, die §YDominikanische Republik§! und §YKuba§!"
 FRW_isles_libertalia:0 "Libertalia"
 FRW_isles_libertalia_desc:0 "Der Legende nach gründeten die Piraten des Indischen Ozeans einst an der Küste Madagaskars eine freie Republik. Der Kapitän will die Legende wahr machen, angefangen mit Mauritius und den Seychellen."
 FRW_isles_libertalia_tt:0 "§YAnsprüche§! auf §YMauritius§! und die §YSeychellen§! und ein §YKriegsziel§! gegen Großbritannien.\n§YMadagaskar§!, §YRéunion§! und die §YKomoren§! (falls französisch): §G+10 %§! Kooperation."
 FRW_isles_north:0 "Die Nordinseln"
 FRW_isles_north_desc:0 "Shetland, die Färöer und Island verschließen den Nordatlantik wie ein Tor. Wer sie hält, kann die Geleitzüge dreier Nationen abwürgen."
 FRW_isles_north_tt:0 "§YAnsprüche§! auf §YShetland§!, die §YFäröer§! und §YIsland§! und §YKriegsziele§! gegen ihre Besitzer (Großbritannien, Dänemark, Island)."
 FRW_isles_republic:0 "Die Republik der Inseln"
 FRW_isles_republic_desc:0 "Von den Balearen bis zu den Seychellen werden die Inseln des Kapitäns als eine freie Föderation von Häfen regiert. Sie zahlen keine Steuern an Paris und stellen stattdessen Schiffe und Seeleute."
 FRW_isles_republic_tt:0 "§GKerngebiete§! auf jeder Insel in Frankreichs Besitz unter den Balearen, Kanaren, Madeira, Azoren, Kap Verde, São Tomé, Malta, Gibraltar, den Karibikinseln, Mauritius, den Seychellen, Shetland und den Färöern."
 FRW_iberian_ambitions:0 "Die iberische Frage"
 FRW_iberian_ambitions_desc:0 "Jenseits der Pyrenäen gleitet Spanien in den Bürgerkrieg ab. Die Kontrolle über die Halbinsel würde dem Kapitän den westlichen Zugang zum Mittelmeer und die besten Häfen des Atlantiks verschaffen."
 FRW_intervene_in_spain:0 "In Spanien intervenieren"
 FRW_intervene_in_spain_desc:0 "Die Spanier bringen sich gegenseitig um. Frankreich will eingreifen und den Krieg zu seinen eigenen Bedingungen beenden, gleich welche Fraktion sich ihm in den Weg stellt."
 FRW_intervene_in_spain_tt:0 "Kriegsziel §YAnnexion§! gegen §Yjede Seite§! des Spanischen Bürgerkriegs, die nicht mit Frankreich verbündet ist."
 FRW_spanish_protectorate:0 "Ein Protektorat über Spanien"
 FRW_spanish_protectorate_desc:0 "Ob mit oder ohne Bürgerkrieg: Spanien ist schwach und Paris ist nah. Ein französisches Protektorat wird vorgeschlagen."
 FRW_one_iberia:0 "Ein Iberien unter Frankreich"
 FRW_one_iberia_desc:0 "Die Waffen schweigen. Was von Spanien übrig ist, geht an Frankreich über – wenn möglich durch Vertrag, wenn nicht mit Gewalt."
 FRW_one_iberia_tt:0 "Jeder spanische Staat, der bereits ein §YSatellit Frankreichs§! ist, wird §Yvollständig annektiert§!, einschließlich seiner Armee.\nGegen jedes §Yunabhängige§! Spanien erhält Frankreich stattdessen ein §YKriegsziel§!.\nExistiert Spanien nicht mehr, wird dieser Fokus übersprungen."
 FRW_portuguese_question:0 "Die portugiesische Frage"
 FRW_portuguese_question_desc:0 "Lissabon steht nun isoliert am Rand einer französischen Halbinsel. Französische Divisionen an der Grenze verleihen den Argumenten der französischen Diplomaten Nachdruck."
 FRW_portuguese_question_tt:0 "§YPortugal§! muss sich entscheiden: sich Frankreich friedlich anschließen oder Krieg riskieren.\nJe stärker die französische Armee im Vergleich zur portugiesischen ist, desto eher gibt Lissabon nach. Lehnt Portugal ab, erhält Frankreich ein Kriegsziel §YAnnexion§!."
 FRW_raise_the_black_flag:0 "Das Königreich Francia"
 FRW_raise_the_black_flag_desc:0 "Der Kapitän aus Saint-Malo vereint Frankreich und Iberien unter einem Banner, das die Lilien Frankreichs und den Hermelin der Bretagne trägt. Vorerst nennt er es ein Königreich – für seinen Sohn ein ewiges."
 FRW_raise_the_black_flag_tt:0 "Ruft das §YKönigreich Francia§! aus, den Vorläufer des Ewigen Königreichs, mit einem Banner aus Lilien und bretonischem Hermelin, §YLe Pavillon Corsaire§! (+15 % Angriff und Verteidigung auf Kerngebiet) sowie §GKerngebieten in den Ländern Spaniens und Portugals§!, die Frankreich besitzt (auch auf allen, die es dort später erwirbt), und §YAnsprüchen§! auf den Rest.\nErsetzt jede Nation, die Frankreich zuvor gebildet hat (deren Nationalgeist wird entfernt). Ist Frankreich bereits das §YEwige Königreich Francia§!, bleibt es dies."
 FRW_iberian_cores:0 "Eine Halbinsel, eine Nation"
 FRW_iberian_cores_desc:0 "Von Calais bis Cádiz und von Brest bis Lissabon sollen die Länder als eine einzige Nation regiert werden."
 FRW_iberian_cores_tt:0 "§GKerngebiete§! in jedem eigenen Staat, der ein Kerngebiet von §YSpanien§! oder §YPortugal§! ist, und dort §G+15 %§! Kooperation."
 FRW_asturian_steel:0 "Asturische Kohle und andalusisches Erz"
 FRW_asturian_steel_desc:0 "Die Gruben und Hochöfen Asturiens und die alten Kupferminen von Río Tinto arbeiten nun für Frankreich."
 FRW_catalan_industry:0 "Die Fabriken Barcelonas"
 FRW_catalan_industry_desc:0 "Katalonien war die Werkstatt Spaniens, und seine Spinnereien und Fabriken dienen nun den französischen Bedürfnissen im Süden."
 FRW_port_of_lisbon:0 "Der Hafen von Lissabon"
 FRW_port_of_lisbon_desc:0 "Der Hafen von Lissabon, einer der besten am Atlantik, wird zur Heimat des Atlantikgeschwaders des Kapitäns."
 FRW_iberian_arsenal:0 "Das iberische Arsenal"
 FRW_iberian_arsenal_desc:0 "Arsenale in Madrid und Burgos produzieren Gewehre, Geschütze und Panzer für die kaiserlichen Armeen."
 FRW_eternal_kingdom:0 "Das Ewige Königreich Francia"
 FRW_eternal_kingdom_desc:0 "Von den Alpen bis Gibraltar, von Brest bis in die Highlands und von der Karibik bis zum Indischen Ozean wird die alte Krone unter einem Admiral wiederhergestellt, der nie eine Seeschlacht verloren hat. Frankreich wird zum Ewigen Königreich Francia."
 FRW_eternal_kingdom_tt:0 "Bildet das §YEwige Königreich Francia§!: neue Flagge, dunkelblaue Kartenfarbe, Nationalgeist §YDas Ewige Königreich§! und §GKerngebiete auf den Ländereien Spaniens, Portugals und der schottischen Inseln§!, die Frankreich besitzt (auch auf allen, die es dort später hinzugewinnt), sowie §YAnsprüche§! auf den Rest.\nEs ersetzt jede zuvor gebildete Nation – und kann selbst niemals ersetzt werden.\nMalo Kervadec stirbt, wenn dieser Fokus beginnt; sein Sohn §YAymeric Kervadec§! wird gekrönt, wenn er abgeschlossen ist."
 FRW_appeal_of_18_june:0 "Der Appell vom 18. Juni"
 FRW_appeal_of_18_june_desc:0 "„Frankreich hat eine Schlacht verloren, aber Frankreich hat nicht den Krieg verloren.“ Aus London ruft ein wenig bekannter General jeden Franzosen auf, weiterzukämpfen."
 FRW_appeal_of_18_june_tt:0 "Dieser Zweig erscheint, sobald Frankreich §Ykapituliert§! oder die Kontrolle über §YParis§! verloren hat – auch wenn bereits ein Frieden unterzeichnet wurde. Seine Fokusse können auch nach der Kapitulation gewählt werden.\nDas Prestige des Freien Frankreichs beginnt bei §Y20§! von 100, und die Entscheidungen §YFreies Frankreich§! werden freigeschaltet. Entfernt §YDefätismus§!."
 FRW_continue_the_fight:0 "Den Kampf fortsetzen"
 FRW_continue_the_fight_desc:0 "Ein in Bordeaux unterzeichneter Waffenstillstand bindet in London niemanden. Die Freien Franzosen erklären, dass der Krieg weitergeht."
 FRW_continue_the_fight_tt:0 "Frankreich erklärt demjenigen, der §YParis§! hält, erneut den Krieg (falls es sich nicht mehr mit ihm im Krieg befindet) und tritt der Fraktion von §YGroßbritannien§! bei (falls Großbritannien eine anführt).\nPrestige des Freien Frankreichs: §G+5§!"
 FRW_free_french_forces:0 "Die Forces françaises libres"
 FRW_free_french_forces_desc:0 "Aus Narvik zurückgekehrte Legionäre, aus Brest entkommene Matrosen und Kolonialschützen aus dem Tschad bilden den Kern einer neuen Armee."
 FRW_free_french_forces_tt:0 "§G+2§! Militärfabriken im Exil (britische und koloniale Werkstätten).\nPrestige des Freien Frankreichs: §G+5§!"
 FRW_rally_the_colonies:0 "Die Kolonien sammeln"
 FRW_rally_the_colonies_desc:0 "Im August 1940 erklärten sich der Tschad, Kamerun und Mittelkongo für de Gaulle. Die übrigen Gouverneure werden aufgefordert, ihnen zu folgen."
 FRW_rally_the_colonies_tt:0 "§YAnsprüche§! auf jede französische Kolonie in Afrika, die von jemand anderem gehalten wird, und ein §YKriegsziel§! gegen jedes Land (außerhalb der Fraktion Frankreichs), das eine hält.\nPrestige des Freien Frankreichs: §G+10§!"
 FRW_lend_lease:0 "Hilfe aus Washington"
 FRW_lend_lease_desc:0 "Roosevelts Leih- und Pachtgesetz erreicht die Freien Franzosen über Großbritannien: Gewehre, Lastwagen und Uniformen."
 FRW_lend_lease_tt:0 "§G+3§! Militärfabriken im Exil (amerikanische Leih- und Pachtproduktion)."
 FRW_leclerc_column:0 "Leclercs Kolonne"
 FRW_leclerc_column_desc:0 "1941 durchquerte Leclerc vom Tschad aus die Sahara und nahm das italienische Fort bei Kufra ein. In der Oase schworen seine Männer, weiterzukämpfen, bis die Flagge über Straßburg weht."
 FRW_leclerc_column_tt:0 "Ansprüche auf §YFessan§! und §YSirte§! sowie ein Kriegsziel gegen §YItalien§! um diese.\nPrestige des Freien Frankreichs: §G+5§!"
 FRW_algiers_capital:0 "Algier, Hauptstadt Frankreichs"
 FRW_algiers_capital_desc:0 "Die Ministerien ziehen in die Villen oberhalb der Bucht von Algier. Vorerst wird Frankreich von hier aus regiert."
 FRW_algiers_capital_tt:0 "§G+2§! Zivilfabriken im Exil.\nVerlegt die Hauptstadt nach §YAlgier§! (oder nach §YBrazzaville§!, falls Frankreich Algerien nicht hält)."
 FRW_the_resistance:0 "Die Résistance"
 FRW_the_resistance_desc:0 "Jean Moulin springt über der Provence mit dem Fallschirm ab, um die Widerstandsbewegungen zu einen. Eisenbahner, Studenten und Kommunisten beginnen, den Besatzer zu sabotieren."
 FRW_brazzaville_conference:0 "Die Konferenz von Brazzaville"
 FRW_brazzaville_conference_desc:0 "De Gaulle verspricht den Kolonien nach dem Krieg einen neuen Platz in der französischen Gemeinschaft. Im Gegenzug gibt ihm Afrika Männer und Rohstoffe."
 FRW_brazzaville_conference_tt:0 "Jeder eigene Staat in §YAfrika§!: §G+10 %§! Kooperation.\nPrestige des Freien Frankreichs: §G+10§!"
 FRW_mobilise_the_empire:0 "Das Kolonialreich mobilisieren"
 FRW_mobilise_the_empire_desc:0 "In Casablanca und Dakar werden behelfsmäßig Fabriken eingerichtet, und die Eisenbahnen des Maghreb fahren Tag und Nacht."
 FRW_mobilise_the_empire_tt:0 "§G+2§! Militärfabriken im Exil."
 FRW_army_of_africa_marches:0 "Die Afrika-Armee marschiert"
 FRW_army_of_africa_marches_desc:0 "Nach Tunesien von den Amerikanern neu bewaffnet, wird die Armée d’Afrique in Italien und in der Provence gebraucht."
 FRW_eurafrican_federation_focus:0 "Die Eurafrikanische Föderation"
 FRW_eurafrican_federation_focus_desc:0 "Mit dem besetzten Paris ist das Kolonialreich Frankreich. Algier schlägt vor, Europa und Afrika in einer Föderation zu vereinen – für die Dauer des Krieges und vielleicht darüber hinaus."
 FRW_eurafrican_federation_focus_tt:0 "Optional – schließt §YDie Provisorische Regierung§! aus.\nGründet die §YEurafrikanische Föderation§!: neuer Name und neue Flagge, Nationalgeist sowie §GKerngebiete in Französisch-Nordafrika, Dakar und den überseeischen Départements§!, die Frankreich besitzt (auch später), und §YAnsprüche§! auf die übrigen.\nErsetzt jede Nation, die Frankreich zuvor gebildet hat (deren Nationalgeist wird entfernt). Ist Frankreich bereits das §YEwige Königreich Francia§!, bleibt es dies.\nErfordert die Kontrolle über eine Hauptstadt in Afrika – §YAlgier§!, §YDakar§!, §YBrazzaville§! oder §YTschad§! (gewinne sie mit den Entscheidungen des §YFreien Frankreichs§!). Hält Frankreich noch keine davon, wird die Nation automatisch gegründet, sobald dies der Fall ist."
 FRW_provisional_government:0 "Die Provisorische Regierung"
 FRW_provisional_government_desc:0 "Die Freien Franzosen bilden die Provisorische Regierung der Französischen Republik. Sie verspricht Wahlen und eine neue Verfassung, sobald das Land befreit ist."
 FRW_provisional_government_tt:0 "Optional – schließt §YDie Eurafrikanische Föderation§! aus. Frankreich bleibt Frankreich und behält die Republik."
 FRW_liberation_of_paris:0 "Die Befreiung von Paris"
 FRW_liberation_of_paris_desc:0 "Die Glocken von Notre-Dame läuten zum ersten Mal seit vier Jahren. Die Regierung kehrt in die Hauptstadt zurück."
 FRW_liberation_of_paris_tt:0 "Die Forces de l'Intérieur schließen sich der Armee an: §G+50.000§! Mannstärke.\nErfordert Kontrolle über §YParis§!. Paris wird wieder französisch und die Hauptstadt kehrt dorthin zurück."
 FRW_ff_chequers:0 "Das Abkommen von Chequers"
 FRW_ff_chequers_desc:0 "Churchill und de Gaulle unterzeichnen ein Abkommen: Großbritannien wird die Freien Franzosen bezahlen, bewaffnen und versorgen, und Frankreich behält im Kommando seine Unabhängigkeit."
 FRW_ff_chequers_tt:0 "§G+1§! Militärfabrik im Exil.\nPrestige des Freien Frankreichs: §G+5§!"
 FRW_ff_national_committee:0 "Das Französische Nationalkomitee"
 FRW_ff_national_committee_desc:0 "In London werden die verstreuten Dienste des Freien Frankreichs zu einer echten Regierung, mit Kommissaren für Krieg, Finanzen, Auswärtiges und die Kolonien."
 FRW_ff_national_committee_tt:0 "Prestige des Freien Frankreichs: §G+5§!"
 FRW_ff_bcra:0 "Das BCRA"
 FRW_ff_bcra_desc:0 "Oberst Passy baut das Bureau Central de Renseignements et d'Action auf. Seine Agenten führen Netzwerke von der Bretagne bis nach Marseille."
 FRW_ff_cnr:0 "Der Nationale Rat des Widerstands"
 FRW_ff_cnr_desc:0 "In einer Wohnung in der Rue du Four treffen sich die Bewegungen, Parteien und Gewerkschaften des Widerstands zum ersten Mal unter einer gemeinsamen Führung."
 FRW_ff_cnr_tt:0 "Jeder besetzte französische Staat in Europa: Widerstand §G+15§!.\nPrestige des Freien Frankreichs: §G+10§!"
 FRW_ff_first_division:0 "Die 1. Division der Freien Franzosen"
 FRW_ff_first_division_desc:0 "Legionäre, Marinesoldaten, Kolonialinfanterie und Freiwillige aus allen Winkeln des Imperiums werden zu einer einzigen Division zusammengefasst."
 FRW_ff_bir_hakeim:0 "Bir Hakeim"
 FRW_ff_bir_hakeim_desc:0 "Sechzehn Tage lang hält Koenigs Brigade ein zerstörtes Fort in der libyschen Wüste gegen Rommels Panzer. Die Welt erfährt, dass die Franzosen wieder kämpfen."
 FRW_ff_bir_hakeim_tt:0 "Prestige des Freien Frankreichs: §G+5§!"
 FRW_ff_second_armoured:0 "Die 2. Panzerdivision"
 FRW_ff_second_armoured_desc:0 "Leclercs Wüstenveteranen werden in Marokko mit amerikanischen Shermans und Halbkettenfahrzeugen neu ausgerüstet."
 FRW_ff_fafl:0 "Die Luftstreitkräfte des Freien Frankreichs"
 FRW_ff_fafl_desc:0 "Einige hundert aus Frankreich geflohene Piloten und Mechaniker fliegen mit der Royal Air Force unter ihrer eigenen Kokarde."
 FRW_ff_groupe_lorraine:0 "Die Groupe Lorraine"
 FRW_ff_groupe_lorraine_desc:0 "In Großbritannien und Syrien ausgebildete französische Bomberbesatzungen bilden eine eigene Gruppe und fliegen mit Bostons Einsätze gegen Ziele in Frankreich und den Beneluxländern."
 FRW_ff_normandie_niemen:0 "Normandie-Njemen"
 FRW_ff_normandie_niemen_desc:0 "Eine Staffel französischer Jagdflieger zieht an die Ostfront und kämpft in sowjetischen Jaks gegen die Luftwaffe."
 FRW_ff_fnfl:0 "Die Seestreitkräfte des Freien Frankreichs"
 FRW_ff_fnfl_desc:0 "Admiral Muselier sammelt die Schiffe, die in britische Häfen entkommen sind, vom U-Boot Surcouf bis zu einer Handvoll Fischdampfer."
 FRW_ff_corvettes:0 "Korvetten aus Großbritannien"
 FRW_ff_corvettes_desc:0 "Die Admiralität leiht der Marine des Freien Frankreichs Korvetten der Flower-Klasse. Sie geleiten die Atlantikkonvois."
 FRW_ff_corvettes_tt:0 "§G+1§! Werft im Exil."
 FRW_ff_richelieu:0 "Die Richelieu kehrt in den Kampf zurück"
 FRW_ff_richelieu_desc:0 "Das große Schlachtschiff, das beschädigt in Dakar lag, fährt zur Reparatur nach New York und kehrt unter der Trikolore in den Krieg zurück."
 FRW_ff_richelieu_tt:0 "§G+2§! Werften im Exil (amerikanische Werften)."
 FRW_ff_maquis:0 "Der Maquis"
 FRW_ff_maquis_desc:0 "Junge Männer, die vor der Zwangsarbeit in Deutschland fliehen, ziehen sich in das Bergland des Vercors, des Limousin und der Alpen zurück, wo der Widerstand sie bewaffnet und ausbildet."
 FRW_ff_maquis_tt:0 "Jeder besetzte französische Staat in Europa: Widerstand §G+10§!.\nPrestige des Freien Frankreichs: §G+5§!"
 FRW_ff_colonial_recruitment:0 "Rekrutierung in den Kolonien"
 FRW_ff_colonial_recruitment_desc:0 "Von Dakar bis Madagaskar öffnen Rekrutierungsbüros. Tirailleurs, Goumiers und Spahis werden die Hälfte der Armee stellen, die Frankreich befreit."
 FRW_ff_cfln:0 "Das Französische Komitee der Nationalen Befreiung"
 FRW_ff_cfln_desc:0 "In Algier schließen sich im Juni 1943 de Gaulles Freie Franzosen und Girauds Afrikaarmee unter einem gemeinsamen Komitee zusammen, und ihre Truppen werden zu einer einzigen Armee vereinigt."
 FRW_ff_cfln_tt:0 "Prestige des Freien Frankreichs: §G+10§!"
 FRW_ff_consultative_assembly:0 "Die Beratende Versammlung"
 FRW_ff_consultative_assembly_desc:0 "Im November 1943 treten Delegierte des Widerstands, der Parteien und des alten Parlaments in Algier zusammen. Es ist die erste Versammlung seit 1940, die für Frankreich spricht, auch wenn ihre Mitglieder ernannt und nicht gewählt sind."
 FRW_ff_cef:0 "Das Französische Expeditionskorps"
 FRW_ff_cef_desc:0 "General Juins Korps aus Gebirgstruppen und Kolonialdivisionen durchbricht die deutsche Linie in den Bergen Italiens, wo andere gescheitert waren."
 FRW_ff_dragoon:0 "Landung in der Provence"
 FRW_ff_dragoon_desc:0 "Zweihunderttausend französische Soldaten landen zwischen Toulon und Saint-Raphaël und stoßen das Rhônetal hinauf in Richtung Lyon und Vogesen vor."
 FRW_ff_epuration:0 "Die Épuration"
 FRW_ff_epuration_desc:0 "Sondergerichte in jedem Département verhandeln gegen die der Kollaboration Beschuldigten."
 FRW_ff_votes_for_women:0 "Frauenwahlrecht"
 FRW_ff_votes_for_women_desc:0 "Durch die Verordnung von Algier vom April 1944 erhalten die Französinnen das aktive und passive Wahlrecht."
 FRW_ff_securite_sociale:0 "Die Sécurité Sociale"
 FRW_ff_securite_sociale_desc:0 "Gemäß dem Programm des Widerstands wird jeder Arbeiter gegen Krankheit, Alter und Arbeitsunfälle versichert."
 FRW_ff_securite_sociale_tt:0 "Inflation: §R+5§!"
 FRW_ff_reconstruction:0 "Der Wiederaufbau Frankreichs"
 FRW_ff_reconstruction_desc:0 "Brücken, Eisenbahnen, Häfen und ganze Städte liegen in Trümmern. Das Ministerium für Wiederaufbau macht sich an die Arbeit."
 FRW_ff_reconstruction_tt:0 "Inflation: §R+10§! (der Wiederaufbau wird auf Kredit bezahlt)."
 FRW_ff_fourth_republic:0 "Die Vierte Republik"
 FRW_ff_fourth_republic_desc:0 "Eine neue Verfassung wird per Referendum angenommen. Die Provisorische Regierung übergibt die Macht an eine gewählte Versammlung."
 FRW_ff_fourth_republic_tt:0 "Erfordert §YDie Provisorische Regierung§!."
 FRW_ff_eurafrican_assembly:0 "Die Eurafrikanische Versammlung"
 FRW_ff_eurafrican_assembly_desc:0 "Abgeordnete aus Dakar, Algier, Brazzaville und Paris tagen zum ersten Mal gemeinsam in einer Versammlung."
 FRW_ff_eurafrican_assembly_tt:0 "Erfordert §YDie Eurafrikanische Föderation§!.\nJeder eigene Staat in §YAfrika§!: §G+10 %§! Kooperation."
 FRW_qol_state_reform:0 "Die Kommission für Staatsreform"
 FRW_qol_state_reform_desc:0 "In jedem Ministerium stapeln sich die Akten, und ein einfaches Dekret kann Monate brauchen, um die Ämter der Dritten Republik zu durchlaufen. Eine Kommission hoher Beamter wurde beauftragt, die Verfahren zu vereinfachen."
 FRW_qol_state_reform_tt:0 "Schaltet die Abteilung §YPolitik§! im §YMinisterrat§! frei (Entscheidungen)."
 FRW_qol_cabinet:0 "Ein schlankeres Kabinett"
 FRW_qol_cabinet_desc:0 "Die Zahl der Ministerien wird verringert und ihre Zuständigkeiten werden neu geordnet, damit der Ministerrat schneller zu Entscheidungen gelangt."
 FRW_qol_cabinet_tt:0 "Schaltet die Abteilung §YWirtschaft§! im §YMinisterrat§! frei."
 FRW_qol_staff_college:0 "Die Generalstabsakademie"
 FRW_qol_staff_college_desc:0 "Die École Supérieure de Guerre überarbeitet ihre Lehrgänge, um jüngere Offiziere auf die Führung in einem modernen Krieg vorzubereiten."
 FRW_qol_staff_college_tt:0 "Schaltet die Abteilung §YArmee§! im §YMinisterrat§! frei."
 FRW_qol_logistics:0 "Das Logistikbüro"
 FRW_qol_logistics_desc:0 "Ein einziges Amt in Paris plant nun den Einsatz von Eisenbahnen, Lastwagen und Versorgungsdepots für die gesamte Armee."
 FRW_qol_standards:0 "Standardisierte Ausrüstung"
 FRW_qol_standards_desc:0 "Die Rüstungsfabriken werden angewiesen, nach gemeinsamen Normen zu fertigen, damit Gewehre, Granaten und Ersatzteile zur Ausrüstung jedes Regiments passen."
 FRW_qol_research_council:0 "Der Oberste Forschungsrat"
 FRW_qol_research_council_desc:0 "Dem Amt des Ministerpräsidenten wird ein Rat von Wissenschaftlern angegliedert, nach dem Vorbild des Unterstaatssekretariats für Forschung, das Irène Joliot-Curie 1936 leitete."
 FRW_qol_research_council_tt:0 "Schaltet die Abteilung §YForschung§! im §YMinisterrat§! frei."
 FRW_qol_special_projects:0 "Das Direktorat für Sonderprojekte"
 FRW_qol_special_projects_desc:0 "Raketen, Strahltriebwerke und das Atom sind zu wichtig, um sie privaten Werkstätten zu überlassen. Ein Direktorat im Rüstungsministerium übernimmt sie."
 FRW_qol_special_projects_tt:0 "Schaltet die Abteilung §YSonderprojekte§! im §YMinisterrat§! frei."
 FRW_qol_deuxieme_bureau:0 "Das Deuxième Bureau reorganisieren"
 FRW_qol_deuxieme_bureau_desc:0 "Der militärische Nachrichtendienst und seine Spionageabwehr erhalten neue Mittel, neue Büros und einen direkten Draht zur Regierung."
 FRW_qol_deuxieme_bureau_tt:0 "Schaltet die Abteilung §YGeheimdienst§! im §YMinisterrat§! frei."
 FRW_qol_modern_state:0 "Der moderne Staat"
 FRW_qol_modern_state_desc:0 "Nach Jahren der Reform erreicht ein Erlass die Präfekturen in Wochen statt in Monaten."
 FRW_rhine_question:0 "Die Rheinfrage"
 FRW_rhine_question_desc:0 "Poincaré besetzte 1923 das Ruhrgebiet und unterstützte die rheinischen Separatisten, und das Saargebiet blieb bis 1935 unter der Verwaltung des Völkerbunds, seine Gruben in französischer Hand. Viele in Paris sind noch immer überzeugt, dass die Sicherheit Frankreichs vom Rhein abhängt."
 FRW_demand_the_saar:0 "Das Saargebiet fordern"
 FRW_demand_the_saar_desc:0 "Paris bezeichnet die Volksabstimmung vom Januar 1935 nun als Farce unter nationalsozialistischem Druck und fordert die Abtretung des Saargebiets an Frankreich."
 FRW_rhenish_republic:0 "Die Rheinische Republik"
 FRW_rhenish_republic_desc:0 "Die Separatisten von 1923 scheiterten mangels Unterstützung. Nun will Frankreich dem Rheinland diese Unterstützung gewähren und es unter französische Kontrolle bringen."
 FRW_pyrenees_question:0 "Die Pyrenäenfrage"
 FRW_pyrenees_question_desc:0 "In Barcelona kämpfen die Arbeiter denselben Kampf wie ihre Genossen in Paris. Ein rotes Frankreich denkt nicht daran, Blums Politik der Nichteinmischung zu wiederholen."
 FRW_demand_catalonia:0 "Die Katalanische Kommune"
 FRW_demand_catalonia_desc:0 "Die CNT und die POUM halten Barcelona. Paris schlägt vor, dass Katalonien, das 1812 unter Napoleon Frankreich angegliedert wurde, der französischen Arbeiterrepublik beitritt."
 FRW_iberian_protectorate:0 "Ein sowjetisches Iberien"
 FRW_iberian_protectorate_desc:0 "Paris wird Spanien nicht Franco überlassen. Der Plan ist, die gesamte Halbinsel zu einer von Paris gelenkten Bruderrepublik zu machen."
 FRW_alpine_question:0 "Die Alpenfrage"
 FRW_alpine_question_desc:0 "In Genf, im Wallis und im Aostatal spricht man Französisch, während Rom Anspruch auf Nizza und Savoyen erhebt. Die Ligen wollen, dass Frankreich in den Alpen nicht länger zurückweicht und sich zurückholt, was sie für französisch halten."
 FRW_demand_romandy:0 "Die Romandie fordern"
 FRW_demand_romandy_desc:0 "Die Ligen beanspruchen Genf, Lausanne und den Rest der französischsprachigen Schweiz für Frankreich."
 FRW_demand_aosta_nice:0 "Piemont und Aosta fordern"
 FRW_demand_aosta_nice_desc:0 "Das Haus Savoyen erhielt seinen Namen von Ländereien auf der französischen Seite der Alpen. Paris beansprucht nun das Piemont und das Aostatal."
 FRW_swiss_anschluss:0 "Union mit der Schweiz"
 FRW_swiss_anschluss_desc:0 "Die Neutralität der Schweiz ruht seit Jahrhunderten auf ihren Bergen und ihrer Miliz. Paris gedenkt nicht länger, sie zu respektieren."
 FRW_corsica_and_sardinia:0 "Korsika und Sardinien"
 FRW_corsica_and_sardinia_desc:0 "Sardinien liegt jenseits der Straße von Bonifacio nur wenige Meilen südlich von Korsika. Paris argumentiert, dass beide Inseln gemeinsam regiert werden sollten."
 FRW_latin_destiny:0 "Ein lateinisches Schicksal"
 FRW_latin_destiny_desc:0 "Frankreich, Italien und Spanien teilen das Erbe Roms. Gemeinsam besitzen sie den größten Teil der Küsten des westlichen Mittelmeers, von Gibraltar bis Sizilien."
 FRW_latin_destiny_tt:0 "§GKerngebiete§! auf §YSardinien§! (falls Frankreich es besitzt)."
 FRW_rome_accords:0 "Die Abkommen von Rom"
 FRW_rome_accords_desc:0 "Im Januar 1935 legten Laval und Mussolini ihre Streitigkeiten in Afrika bei. Frankreich trat einen Wüstenstreifen an Libyen ab, und Italien willigte ein, den Sonderstatus seiner Siedler in Tunesien aufzugeben. La Rocque will Rom an diese Abmachung binden."
 FRW_stresa_front:0 "Die erneuerte Stresa-Front"
 FRW_stresa_front_desc:0 "In Stresa standen Frankreich, Großbritannien und Italien im April 1935 zusammen, um Österreichs Freiheit zu bewahren. La Rocque will diese Front wiederherstellen, mit Rom als Frankreichs erstem Verbündeten."
 FRW_stresa_front_tt:0 "Lädt §YItalien§! in die Fraktion Frankreichs ein (sofern Frankreich eine anführt)."
 FRW_latin_naval_pact:0 "Der Lateinische Flottenpakt"
 FRW_latin_naval_pact_desc:0 "Toulon und La Spezia stimmen ihre Pläne ab. Die französische Flotte sichert das westliche Mittelmeer, die italienische das zentrale Becken und die Straße von Sizilien."
 FRW_latin_union:0 "Die Lateinische Union"
 FRW_latin_union_desc:0 "La Rocque will seine lateinischen Nachbarn nicht erobern. Er bietet Rom und Madrid eine Zollunion und eine gemeinsame Verteidigung von Lissabon bis Triest an, mit Paris an der Spitze."
 FRW_latin_union_tt:0 "Ein in der Fraktion Frankreichs verbündetes §YItalien§! gilt nun für das §YLateinische Reich§! als kontrolliert (Spanien und Portugal werden weiterhin benötigt)."
 FRW_benelux_question:0 "Das burgundische Erbe"
 FRW_benelux_question_desc:0 "Louise d'Orléans war die erste Königin der Belgier, und die Beneluxländer lagen einst im Herzen der burgundischen Lande. Ein König von Frankreich kann sich auf alte Ansprüche und familiäre Bande in Brüssel und Luxemburg berufen."
 FRW_union_with_luxembourg:0 "Union mit Luxemburg"
 FRW_union_with_luxembourg_desc:0 "Eingekeilt zwischen Frankreich und Deutschland hat das Großherzogtum kaum Aussicht, allein zu bestehen. Paris bietet ihm die Union an."
 FRW_demand_wallonia:0 "Wallonien fordern"
 FRW_demand_wallonia_desc:0 "Paris verlangt, dass die französischsprachigen Provinzen Südbelgiens an Frankreich zurückgegeben werden."
 FRW_belgian_union:0 "Union mit Belgien"
 FRW_belgian_union_desc:0 "Belgien gehörte von 1795 bis 1814 zu Frankreich. Brüssel wird nun gefragt, ob es wieder französisch werden möchte."
 FRW_batavian_union:0 "Union mit den Niederlanden"
 FRW_batavian_union_desc:0 "1810 gliederte Napoleon das Königreich Holland Frankreich an. Paris beabsichtigt nun dasselbe."
 FRW_batavian_union_tt:0 "Sind die §YNiederlande§! unabhängig, erhalten sie eine Unionsforderung (Annahme = Annexion). Sind sie ein französischer Satellit, annektiert Frankreich sie.\nBildet das §YKönigreich Burgund§!: neuer Name und neue Flagge, Nationalgeist und §GKerngebiete auf den Ländereien Belgiens, der Niederlande und Luxemburgs§!, die Frankreich besitzt (auch auf allen, die es dort später hinzugewinnt), sowie §YAnsprüche§! auf den Rest.\nErsetzt jede Nation, die Frankreich zuvor gebildet hat (deren Nationalgeist wird entfernt). Ist Frankreich bereits das §YEwige Königreich Francia§!, bleibt es dies.\nErfordert Kontrolle über ganz §YBelgien§!, die §YNiederlande§! und §YLuxemburg§! (annektiert, nicht als Satelliten). Kontrolliert Frankreich sie noch nicht, wird die Nation automatisch gegründet, sobald dies der Fall ist."
 FRW_reunions_complete:0 "Das burgundische Reich wiederhergestellt"
 FRW_reunions_complete_desc:0 "Die alten burgundischen Lande von Flandern bis Luxemburg sind wieder unter der französischen Krone vereint."
