 FRW_gold_p400_tt:0 "Goldreserven: §G+400 t§!"
 FRW_inf_tt_m35:0 "Inflation: §G-35§!"
 frw_sys.3.t:0 "Hyperinflation"
 frw_sys.3.d:0 "Banknoten werden in Körben getragen, und die Preise ändern sich zweimal am Tag. Der Franc steht kurz vor dem Zusammenbruch. Die Experten des Finanzministeriums schlagen eine radikale Währungsreform vor: einen neuen Franc, hundert alte für einen neuen."
 frw_sys.3.a:0 "Den neuen Franc einführen."
 frw_sys.3.b:0 "Nicht jetzt. Wir sitzen es aus."
 frw_sys.4.t:0 "Das Gold ist verloren"
 frw_sys.4.d:0 "Das Gold der Banque de France wurde nicht rechtzeitig außer Landes gebracht. Es liegt nun in den Händen des Besatzers, und das Freie Frankreich muss ohne es auskommen."
 frw_sys.4.a:0 "Wir hätten es nach Dakar schicken sollen."
 frw_sys.50.t:0 "Die Alliierten erkennen das Freie Frankreich an"
 frw_sys.50.d:0 "London und Washington behandeln das Freie Frankreich nun als echten Verbündeten. Waffen, Kredite und Fabrikflächen in Großbritannien werden uns zur Verfügung gestellt."
 frw_sys.50.a:0 "Frankreich sitzt wieder mit am Tisch."
 frw_sys.51.t:0 "Das Kämpfende Frankreich"
 frw_sys.51.d:0 "Die alliierten Regierungen verhandeln mit dem Komitee des Freien Frankreichs als der Regierung Frankreichs. Botschafter, die früher in Vichy vorsprachen, gehen nun nach Carlton Gardens."
 frw_sys.51.a:0 "Vive la France combattante!"
 frw_sys.5.t:0 "Die Tresore leeren sich"
 frw_sys.5.d:0 "Der Gouverneur der Banque de France überbringt schlechte Nachrichten: Weniger als fünfhundert Tonnen Gold liegen noch in den Tresoren. Ohne Gold steht hinter dem Franc nichts mehr – und jeder Spekulant in Europa weiß das."
 frw_sys.5.a:0 "Die Grenzen für Kapital schließen."
 frw_sys.5.b:0 "London um eine Goldanleihe bitten."
 frw_sys.5.c:0 "Wir werden schon irgendwie zurechtkommen."
 frw_sys.1.t:0 "Der Franc fällt"
 frw_sys.1.d:0 "Die Preise in Paris haben sich binnen eines Jahres verdoppelt. Hausfrauen stehen Schlange für Brot, die Gewerkschaften fordern höhere Löhne, und die Zeitungen sprechen von 1926. Der Finanzminister verlangt Notmaßnahmen."
 frw_sys.1.a:0 "Die bittere Medizin schlucken."
 frw_sys.1.b:0 "Die Nation wird es ertragen – Frankreich hat andere Sorgen."
 frw_sys.2.t:0 "Die Exilregierung"
 frw_sys.2.d:0 "Frankreich ist gefallen, doch die Regierung kämpft weiter. Der Zweig „Freies Frankreich“ im Fokusbaum ist nun offen, und das Entscheidungsmenü §YFreies Frankreich§! ermöglicht es, die an Vichy übergebenen Kolonien zurückzugewinnen."
 frw_sys.2.a:0 "Die Flamme des französischen Widerstands darf nicht erlöschen."
 frw_sys.10.t:0 "Die Flotte in Mers-el-Kébir"
 frw_sys.10.d:0 "Der Waffenstillstand hat die Flotte Vichy überlassen. In Mers-el-Kébir, Toulon und Alexandria liegen die Schiffe vor Anker, und ihre Besatzungen wissen nicht, wem sie gehorchen sollen. London wird nicht zulassen, dass sie in deutsche Hände fallen, und das Freie Frankreich muss entscheiden, was es den Besatzungen sagt."
 frw_sys.10.a:0 "Die Seeleute auffordern, sich uns anzuschließen."
 frw_sys.10.a.tt:0 "Chance (§Y20 %§! + 40 % des Prestiges): Ein Teil der Vichy-Flotte (§Yetwa ein Drittel§!) läuft zum Freien Frankreich über, §G+5§! Prestige. Andernfalls §R-5§! Prestige."
 frw_sys.10.b:0 "Soll die Royal Navy das regeln."
 frw_sys.10.b.tt:0 "Die Royal Navy greift die Vichy-Flotte an: Vichy verliert §Yein Schlachtschiff, einen Schlachtkreuzer und drei Zerstörer§!."
 frw_sys.10.c:0 "Französische Schiffe werden niemals auf französische Schiffe feuern."
 frw_sys.11.t:0 "Die Seeleute schließen sich uns an"
 frw_sys.11.d:0 "Mehrere Schiffe sind nachts aus dem Hafen geschlüpft und dampfen nun auf die Häfen des Freien Frankreichs zu, während ihre Besatzungen an Deck jubeln."
 frw_sys.11.a:0 "Willkommen an Bord."
 frw_sys.12.t:0 "Die Flotte bleibt bei Vichy"
 frw_sys.12.d:0 "Admiral Darlan lässt die Besatzungen auf ihren Schiffen festsetzen. Kein einziges Schiff ist unserem Ruf gefolgt."
 frw_sys.12.a:0 "Ein bitterer Schlag."
 frw_sys.40.t:0 "Ein Gouverneur ist übergelaufen"
 frw_sys.40.d:0 "Einer unserer Kolonialgouverneure ist zu den Dissidenten in London übergelaufen. Über seinem Gebiet weht nun das Lothringer Kreuz."
 frw_sys.40.a:0 "Verräter!"
 FRW_hook_devalue_the_franc_0_tt:0 "Inflation: §G-10§!"
 FRW_hook_reform_banque_de_france_0_tt:0 "Von nun an sinkt die Inflation um weitere §G0,5§! Punkte pro Monat."
 FRW_hook_war_economy_0_tt:0 "Inflation: §R+5§!"
 FRW_hook_appeal_of_18_june_0_tt:0 "Das Prestige des Freien Frankreichs beginnt bei §Y20§! von 100, und die Entscheidungen §YFreies Frankreich§! werden freigeschaltet. Entfernt §YDefätismus§!."
