 FRW_adv_langevin:0 "Paul Langevin"
 FRW_adv_langevin_desc:0 "Paul Langevin machte 1917 aus Quarzkristallen das erste Sonar und hat eine ganze Generation französischer Physiker ausgebildet. Zugleich ist er eine führende Stimme der antifaschistischen Komitees, was ihm ebenso viele Feinde wie Freunde einbringt."
