 FRW_leader_blum:0 "Léon Blum"
 FRW_leader_blum_desc:0 "Léon Blum, Vorsitzender der SFIO, ist der erste Sozialist und der erste Jude an der Spitze einer französischen Regierung. Seine Volksfront kam 1936 mit der Losung „Pain, paix, liberté“ an die Macht."
 FRW_leader_reynaud:0 "Paul Reynaud"
 FRW_leader_reynaud_desc:0 "Reynaud, ein durchsetzungsstarker Finanzpolitiker der Alliance Démocratique, warnt seit Langem vor Deutschland und ist der Förderer des jungen Oberst de Gaulle."
 FRW_leader_degaulle:0 "Charles de Gaulle"
 FRW_leader_degaulle_desc:0 "Lange ein Verfechter der Panzerkriegsführung und einer starken Exekutive, führt der hochgewachsene Offizier nun eine reformierte Republik."
 FRW_leader_thorez:0 "Maurice Thorez"
 FRW_leader_thorez_desc:0 "Thorez, Sohn eines Bergmanns aus dem Pas-de-Calais, ist Generalsekretär der PCF und hält sich eng an die von der Komintern vorgegebene Linie."
 FRW_leader_pivert:0 "Marceau Pivert"
 FRW_leader_pivert_desc:0 "Pivert, Anführer der Gauche Révolutionnaire, prägte die Losung „Tout est possible!“. Er strebt eine von Arbeiterräten getragene Revolution an, unabhängig von Moskau."
 FRW_leader_larocque:0 "François de La Rocque"
 FRW_leader_larocque_desc:0 "Oberst de La Rocque führte die Croix-de-Feu und steht nun an der Spitze des Parti Social Français. Er fordert einen katholischen und nationalen Staat mit einer starken Sozialpolitik."
 FRW_leader_doriot:0 "Jacques Doriot"
 FRW_leader_doriot_desc:0 "Doriot, einst Kommunist und noch immer Bürgermeister von Saint-Denis, gründete 1936 den Parti Populaire Français, die radikalste Massenbewegung der französischen Rechten."
 FRW_leader_petain:0 "Philippe Pétain"
 FRW_leader_petain_desc:0 "Der Sieger von Verdun ist der angesehenste Soldat Frankreichs, und viele erhoffen sich von ihm die Rettung des Landes."
 FRW_leader_comtedeparis:0 "Heinrich VI. (Graf von Paris)"
 FRW_leader_comtedeparis_desc:0 "Henri d’Orléans, Graf von Paris, ist das Oberhaupt des Hauses Orléans und der orléanistische Thronprätendent. Er regiert als Heinrich VI."
 FRW_leader_napoleon:0 "Napoleon VI."
 FRW_leader_napoleon_desc:0 "Louis, Prinz Napoléon, Oberhaupt des Hauses Bonaparte, ist jung und ehrgeizig und trägt den berühmtesten Namen der französischen Geschichte."
