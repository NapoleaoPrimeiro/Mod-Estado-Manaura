 FRW_joliot_curie_advisor:0 "Frédéric Joliot-Curie"
 FRW_imperial_scientist:0 "Direktor der Kaiserlichen Wissenschaft"
 FRW_imperial_scientist_desc:0 "Nobelpreisträger von 1935, nun mit der Organisation der Laboratorien des Kaiserreichs betraut."
 FRW_backer_captain_req:0 "Hat die Unterstützung von §YKapitän Kervadec§! gewonnen"
 FRW_dec_backer_captain:0 "Kapitän Kervadec gewinnen"
 FRW_dec_backer_captain_desc:0 "Der Verfasser des Briefes aus Genf wartet auf eine Antwort. Die Gespräche mit Malo Kervadec und seinen Zürcher Hintermännern dauern etwa sechs Wochen. Es kann immer nur ein Anführer dieses Lagers umworben werden.\n\nErfordert §Y35 %§! Unterstützung für die Partei und §Y30 %§! Stabilität. Danach öffnet sich im Fokusbaum ein verborgener Weg."
 FRW_dec_wait:0 "Abwarten"
 FRW_dec_wait_desc:0 "Die Kammern bleiben geschlossen, und die Ministerien gehen ihrer Routine nach. Einen weiteren Monat lang trifft in Paris niemand eine Entscheidung."

