 FRW_adv_sauvy:0 "Alfred Sauvy"
 FRW_adv_sauvy_desc:0 "Alfred Sauvy hat die Zahlen, die kein Minister hören will: In Frankreich gibt es mehr Todesfälle als Geburten, und einundvierzig Millionen Franzosen stehen fast siebzig Millionen Deutschen gegenüber. Er fordert Familienbeihilfen und eine ordentliche Erfassung der Mannstärke der Nation."
 FRW_trait_sauvy:0 "Der Demograf"
 FRW_trait_sauvy_desc:0 "Der Statistiker, der warnt, dass Frankreich vergreist, während Deutschland sich verjüngt."
