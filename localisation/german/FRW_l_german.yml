 frw_sys.26.t:0 "Französisch-Indochina schließt sich dem Freien Frankreich an"
 frw_sys.26.d:0 "Hanoi und Saigon haben sich dem Freien Frankreich angeschlossen. Admiral Decoux wurde auf ein Schiff in die Heimat gesetzt."
 frw_sys.26.a:0 "Vive la France libre!"
 frw_sys.36.t:0 "Französisch-Indochina bleibt Vichy treu"
 frw_sys.36.d:0 "Admiral Decoux hält Indochina für Vichy, unter den Augen der japanischen Garnison. Beim nächsten Mal werden unsere Gesandten besser vorbereitet sein."
 frw_sys.36.a:0 "Wir versuchen es erneut."
 frw_sys.66.t:0 "Unsere Truppen landen in Französisch-Indochina"
 frw_sys.66.d:0 "Kolonnen des Freien Frankreichs haben mit Unterstützung alliierter Schiffe und Flugzeuge die Hauptstadt der Region erreicht. Hanoi und Saigon haben sich dem Freien Frankreich angeschlossen. Admiral Decoux wurde auf ein Schiff in die Heimat gesetzt."
