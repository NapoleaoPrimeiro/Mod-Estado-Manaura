 FRW_dec_exped_eq_desc:0 "Truppen des Freien Frankreichs landen mit alliierter Unterstützung und versuchen, die Region einzunehmen. Manchmal genügt schon ihr Erscheinen vor der Küste.\n\nErfolgschance: §Y[?FRW_ffe_eq|0] %§!"
