 FRW_dec_franc_rates:0 "Den Diskontsatz erhöhen"
 FRW_dec_franc_rates_desc:0 "Die Banque de France erhöht ihren Zinssatz. Geld wird teuer, und die Preise beruhigen sich, ebenso wie die Arbeit auf den Baustellen."
 FRW_dec_franc_bonds:0 "Anleihen der Landesverteidigung ausgeben"
 FRW_dec_franc_bonds_desc:0 "Sparer leihen ihre Francs dem Staat, statt sie auszugeben. Patriotische Plakate bedecken die Wände jedes Postamts."
 FRW_dec_franc_controls:0 "Preis- und Lohnkontrollen"
 FRW_dec_franc_controls_desc:0 "Preise und Löhne werden per Dekret eingefroren. Die Läden murren, die Gewerkschaften murren, aber der Franc hält."
 FRW_dec_franc_gold:0 "Gold aus den Reserven verkaufen"
 FRW_dec_franc_gold_desc:0 "Ein Teil des Goldes in den Tresoren der Banque de France wird im Ausland verkauft, um Francs zurückzukaufen."
 FRW_dec_franc_reserves:0 "Die Goldreserven wieder aufbauen"
 FRW_dec_franc_reserves_desc:0 "Die Banque de France kauft mit neu ausgegebenen Francs Gold auf dem Londoner Markt. Die Tresore füllen sich wieder – doch die Geldmenge wächst."
 FRW_dec_franc_exchange:0 "Devisenkontrollen"
 FRW_dec_franc_exchange_desc:0 "Francs dürfen das Land nicht mehr ohne Genehmigung verlassen. Die Kapitalflucht endet an der Grenze – und mit ihr ein guter Teil des Handels."
 FRW_dec_franc_contracts:0 "Rüstungsaufträge im Ausland"
 FRW_dec_franc_contracts_desc:0 "Gold kauft, was die französischen Fabriken nicht rechtzeitig liefern können: amerikanische Flugmotoren, Werkzeugmaschinen und ganze Flugzeuge, bar bezahlt."
 FRW_dec_franc_austerity:0 "Ein Sparhaushalt"
 FRW_dec_franc_austerity_desc:0 "Notverordnungen kürzen die Gehälter der Beamten und die Renten der Kriegsveteranen. Der Haushalt ist ausgeglichen, zur allgemeinen Unzufriedenheit."
 FRW_dec_franc_cfa:0 "Die Kolonial-Franc-Zone"
 FRW_dec_franc_cfa_desc:0 "Die Kolonien erhalten einen eigenen Franc, der an den Franc von Paris gebunden ist. Ein Teil des Drucks auf die Währung wird auf Afrika abgewälzt."
 FRW_dec_franc_print:0 "Geld für die Aufrüstung drucken"
 FRW_dec_franc_print_desc:0 "Die Druckerpressen der Banque de France laufen Tag und Nacht. Die Fabriken werden sofort bezahlt; die Inflation präsentiert die Rechnung später."
 FRW_dec_franc_tripartite:0 "Das Dreimächte-Währungsabkommen"
 FRW_dec_franc_tripartite_desc:0 "London und Washington verpflichten sich, den abgewerteten Franc gemeinsam mit Paris stabil zu halten. Es ist das Ende des Goldblocks."
 FRW_franc_cat:0 "Der Franc"
 FRW_franc_cat_desc:0 "Die Inflation liegt bei §Y[?FRW_inflation|0] %§! und ändert sich um §Y[?FRW_inf_trend|2]§! Punkte pro Monat. Goldreserven der Banque de France: §Y[?FRW_gold|0] t§! ([?FRW_gold_trend|+0] t pro Monat).\n\nUnter 20 % beschleunigt ein stabiler Franc den Bau. Über 20 % erhöht die Inflation die Kosten für Konsumgüter, senkt die Stabilität und verlangsamt den Bau. Bei 100 %: Konsumgüter §R+12 %§!, Stabilität §R-12 %§!, Baugeschwindigkeit §R-8 %§!.\nGolddeckung: Über §Y2000 t§! stützt sie den Franc, unter §Y1000 t§! schwächt sie ihn, unter §Y400 t§! sind die Tresore leer.\n\n§YInflation pro Monat§!\n- Die Banque de France hält stand: §G-0,5§![FRW_inf_line_1][FRW_inf_line_2][FRW_inf_line_3][FRW_inf_line_4][FRW_inf_line_5][FRW_inf_line_6][FRW_inf_line_7][FRW_inf_line_8][FRW_inf_line_9][FRW_inf_line_10][FRW_inf_line_11][FRW_inf_line_12][FRW_inf_line_13][FRW_inf_line_14][FRW_inf_line_15][FRW_inf_line_16][FRW_inf_line_17][FRW_inf_line_18]\n\n§YGold pro Monat§![FRW_gold_line_0][FRW_gold_line_1][FRW_gold_line_2][FRW_gold_line_3][FRW_gold_line_4][FRW_gold_line_5][FRW_gold_line_6][FRW_gold_line_7][FRW_gold_line_8][FRW_gold_line_9][FRW_gold_line_10][FRW_gold_line_11]"
 FRW_liberation_prestige_tt:0 "Jeder französische Staat in Europa vom Feind befreit: Prestige des Freien Frankreichs §G+2§!."
 FRW_exchange_controls_tt:0 "Kapitalflucht (Volksfront, Revolution, politische Instabilität) zehrt nicht mehr an den Goldreserven."
 FRW_contracts_tt:0 "Für ein Jahr: §G+3§! Militärfabriken im Ausland (externe Produktion)."
 FRW_cfa_drift_tt:0 "Von nun an sinkt die Inflation um weitere §G0,25§! Punkte pro Monat, und die Kolonien schicken §G+5 t§! Gold pro Monat."
 FRW_tripartite_drift_tt:0 "Von nun an sinkt die Inflation um weitere §G0,25§! Punkte pro Monat, und §G+5 t§! Gold pro Monat fließen nach Paris zurück."
 FRW_tight_money_desc:0 "Kredit ist teuer. Weniger neue Projekte werden begonnen, aber der Franc ist sicher."
 FRW_austerity_desc:0 "Die Ausgabenkürzungen haben die Märkte beruhigt, doch Beamte, Veteranen und Bauarbeiter bekommen sie alle zu spüren."
 FRW_price_riots_desc:0 "Menschenmengen stürmen die Märkte und Bäckereien. Der Franc ist jede Woche weniger wert."
 FRW_new_franc_desc:0 "Eine Währungsreform hat über Nacht die Ersparnisse vernichtet. Der Franc ist wieder stabil, das Vertrauen in den Staat aber nicht."
 FRW_fighting_france_desc:0 "Die gesamte alliierte Welt erkennt nun das Kämpfende Frankreich als das wahre Frankreich an."
 FRW_exchange_controls_idea_desc:0 "Jeder Franc, der das Land verlässt, braucht eine Genehmigung. Das Gold bleibt im Land, doch Importeure und Bankiers klagen."
 FRW_foreign_contracts_desc:0 "Fabriken in Amerika arbeiten an französischen Aufträgen, bezahlt in Gold."
 FRW_gold_loan_desc:0 "London hat uns Gold geliehen. Die Zinsen müssen jeden Monat bezahlt werden."
 FRW_printing_press_desc:0 "Neues Geld strömt in die Fabriken. Die Inflation wird folgen."
 FRW_franc:0 "Der Franc"
 FRW_franc_desc:0 "Inflation: §Y[?FRW_inflation|0] %§!. Gesteuert wird sie im Entscheidungsmenü §YDer Franc§!."
 FRW_ff_prestige_mod:0 "Prestige des Freien Frankreichs"
 FRW_ff_prestige_mod_desc:0 "Prestige des Freien Frankreichs: §Y[?FRW_ff_prestige|0]§! von 100. Je höher es ist, desto eher sind Gouverneure bereit, sich anzuschließen."
 FRW_dec_rally_eq:0 "Gesandter nach Französisch-Äquatorialafrika"
 FRW_dec_rally_eq_desc:0 "Ein Gesandter des Freien Frankreichs versucht, den Gouverneur und die Garnison für sich zu gewinnen.\n\nErfolgschance: §Y[?FRW_ffc_eq|0] %§!"
