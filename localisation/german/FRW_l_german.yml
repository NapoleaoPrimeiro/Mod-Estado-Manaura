 FRW_adv_ybarnegaray:0 "Jean Ybarnégaray"
 FRW_adv_ybarnegaray_desc:0 "Jean Ybarnégaray sitzt seit 1914 in der Kammer und spricht dort für die Croix-de-Feu. Als Veteran und Sportsmann verleiht er der Bewegung das respektable Gesicht, das sie braucht, um die Provinz für sich zu gewinnen."
