 # ---------- Free France extension ----------
 FRW_ff_chequers_spirit_desc:0 "Großbritannien finanziert, bewaffnet und versorgt die Freien Franzosen und erkennt de Gaulle als ihren Anführer an."
 FRW_ff_national_committee_spirit_desc:0 "Das Französische Nationalkomitee regiert von London aus."
 FRW_ff_bcra_spirit_desc:0 "Der Nachrichtendienst des Freien Frankreichs unterhält Netzwerke im gesamten besetzten Frankreich."
 FRW_ff_cnr_spirit_desc:0 "Der Conseil National de la Résistance vereint die Bewegungen."
 FRW_ff_bir_hakeim_spirit_desc:0 "Die Armee erinnert sich an die sechzehn Tage in der Wüste."
 FRW_ff_fafl_spirit_desc:0 "Französische Piloten fliegen wieder unter dem Lothringerkreuz."
 FRW_ff_normandie_spirit_desc:0 "Französische Piloten fliegen Jaks bei den sowjetischen Luftstreitkräften."
 FRW_ff_fnfl_spirit_desc:0 "Schiffe der Freien Franzosen geleiten die Atlantikkonvois."
 FRW_ff_securite_sociale_spirit_desc:0 "Jeder Lohnempfänger ist versichert. Das ist teuer und sehr beliebt."
 FRW_ff_reconstruction_spirit_desc:0 "Frankreich baut wieder auf, was der Krieg zerstört hat."
 FRW_ff_fourth_republic_spirit_desc:0 "Eine gewählte Versammlung regiert Frankreich wieder."
 FRW_ff_eurafrican_assembly_spirit_desc:0 "Europa und Afrika teilen sich ein gemeinsames Parlament."
 FRW_ff_lorraine_spirit_desc:0 "Französische Bomberbesatzungen fliegen ihre eigenen Einsätze über Frankreich."
 FRW_ff_richelieu_spirit_desc:0 "Das modernste französische Schlachtschiff kämpft wieder."
 FRW_ff_maquis_spirit_desc:0 "Die Hügel Frankreichs sind voller bewaffneter Männer."
 FRW_ff_colonial_recruitment_spirit_desc:0 "Tirailleurs aus Afrika füllen die Reihen der Befreiungsarmee."
 FRW_ff_cfln_spirit_desc:0 "Ein Komitee, eine Armee, ein Frankreich."
 FRW_ff_cef_spirit_desc:0 "Juins Gebirgstruppen gehen voran."
 FRW_ff_dragoon_spirit_desc:0 "Die Armee weiß, wie man an einer feindlichen Küste landet."
 FRW_ff_dakar_tt:0 "§YFranzösisch-Westafrika§! (Dakar) hat sich dem Freien Frankreich angeschlossen"
 FRW_ff_sov_fights_tt:0 "Die §YSowjetunion§! befindet sich im Krieg mit §YDeutschland§!"

 # ---------- French Africa in allied hands ----------
 FRW_return_cat:0 "Französisch-Afrika in alliierter Hand"
 FRW_return_cat_desc:0 "Alliierte Truppen halten Teile Französisch-Afrikas. Bittet sie, das Gebiet an Frankreich zurückzugeben, entweder höflich oder mit einem Angebot, das sie kaum ablehnen können.\n\nPrestige des Freien Frankreichs: §Y[?FRW_ff_prestige|0]§!"
 FRW_dec_return_request:0 "[FROM.GetName] um Rückgabe Französisch-Afrikas bitten"
 FRW_dec_return_request_desc:0 "[FROM.GetName] hält französisches Gebiet in Afrika. Eine diplomatische Anfrage kostet wenig, doch sie könnte abgelehnt werden."
 FRW_dec_return_request_tt:0 "[FROM.GetName] entscheidet. Eine KI stimmt umso eher zu, je höher unser §YPrestige des Freien Frankreichs§! ist (von etwa §Y50 %§! bis zu §Y95 %§!).\nBei Zustimmung geht jeder §Yfranzösische§! Staat in §YAfrika§!, den [FROM.GetName] hält, an Frankreich."
 FRW_dec_return_buy_pp:0 "Französisch-Afrika von [FROM.GetName] zurückkaufen"
 FRW_dec_return_buy_pp_desc:0 "Frankreich bietet Zugeständnisse und Kredite im Gegenzug für seine afrikanischen Gebiete."
 FRW_dec_return_buy_tt:0 "Eine KI stimmt immer zu. [FROM.GetName] erhält §Y60§! politische Macht; bei Ablehnung erhalten wir unsere §Y100§! politische Macht zurück.\nBei Zustimmung geht jeder §Yfranzösische§! Staat in §YAfrika§!, den [FROM.GetName] hält, an Frankreich."
 FRW_dec_return_buy_gold:0 "Französisch-Afrika mit Gold bezahlen"
 FRW_dec_return_buy_gold_desc:0 "Dreihundert Tonnen Gold der Banque de France für die Rückgabe Französisch-Afrikas.\n\nVerbleibendes Gold: §Y[?FRW_gold|0] t§!"
 FRW_dec_return_gold_tt:0 "Goldreserven: §R-300 t§!. Eine KI stimmt immer zu. [FROM.GetName] erhält ein Jahr lang §YFranzösisches Gold§! (Konsumgüter §G-5 %§!); bei Ablehnung kommt das Gold zurück.\nBei Zustimmung geht jeder §Yfranzösische§! Staat in §YAfrika§!, den [FROM.GetName] hält, an Frankreich."
 frw_ret.hand_tt:0 "Jeder §Yfranzösische§! Staat in §YAfrika§!, den wir halten, geht an §YFrankreich§!."
 frw_ret.1.t:0 "Frankreich fordert seine Kolonien zurück"
 frw_ret.1.d:0 "Die französische Regierung erinnert uns daran, dass die afrikanischen Gebiete, die unsere Truppen nun halten, französisch sind. Sie bittet darum, sie wieder ihrer Verwaltung zu übergeben."
 frw_ret.1.a:0 "Sie sind unsere Verbündeten. Die Gebiete werden übergeben."
 frw_ret.1.b:0 "Nicht, solange der Krieg andauert."
 frw_ret.2.t:0 "Ein französisches Angebot"
 frw_ret.2.d:0 "Paris bietet Handelszugeständnisse und Kredite an, wenn wir die von unseren Truppen gehaltenen französischen Gebiete in Afrika zurückgeben."
 frw_ret.2.a:0 "Ein fairer Preis. Einverstanden."
 frw_ret.2.b:0 "Wir sind nicht käuflich."
 frw_ret.3.t:0 "Französisches Gold für Französisch-Afrika"
 frw_ret.3.d:0 "Die Franzosen bieten dreihundert Tonnen Gold aus den Reserven der Banque de France für die Rückgabe ihrer afrikanischen Gebiete."
 frw_ret.3.a:0 "Gold spricht lauter als Worte. Einverstanden."
 frw_ret.3.b:0 "Behaltet Euer Gold."
 frw_ret.10.t:0 "Französisch-Afrika kehrt zurück"
 frw_ret.10.d:0 "Unsere Verbündeten haben uns die französischen Gebiete in Afrika zurückgegeben. Über den Regierungsgebäuden weht wieder die Trikolore."
 frw_ret.10.a:0 "Merci, mes amis."
 frw_ret.11.t:0 "Unsere Bitte wurde abgelehnt"
 frw_ret.11.d:0 "Unsere Verbündeten werden die französischen Gebiete in Afrika vorerst nicht zurückgeben."
 frw_ret.11.a:0 "Wir werden erneut fragen."
 FRW_french_gold_payment_desc:0 "Gold, das Frankreich für die Rückgabe seiner afrikanischen Gebiete gezahlt hat."
