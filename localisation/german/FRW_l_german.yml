 frw_sys.22.t:0 "Französisch-Nordafrika schließt sich dem Freien Frankreich an"
 frw_sys.22.d:0 "Algier, Oran, Casablanca und Tunis haben sich angeschlossen. Die Afrikaarmee, hunderttausend Mann stark, kehrt in den Krieg zurück."
 frw_sys.22.a:0 "Vive la France libre!"
 frw_sys.32.t:0 "Französisch-Nordafrika bleibt Vichy treu"
 frw_sys.32.d:0 "General Weygand lässt die Verschwörer in Algier verhaften. Nordafrika bleibt beim Marschall. Beim nächsten Mal werden unsere Gesandten besser vorbereitet sein."
 frw_sys.32.a:0 "Wir versuchen es erneut."
