 FRW_adv_marty:0 "André Marty"
 FRW_adv_marty_desc:0 "André Marty führte 1919 die Meuterei der französischen Flotte im Schwarzen Meer an und hat nie aufgehört, Revolutionär zu sein. Moskau vertraut ihm; seine Freiwilligen fürchten ihn. Unter seinem Kommando werden die Internationalen Brigaden organisiert und einer harten Disziplin unterworfen."
 FRW_trait_marty:0 "Kommissar der Brigaden"
 FRW_trait_marty_desc:0 "Der Meuterer der Schwarzmeerflotte von 1919, heute Sekretär der Komintern."
