 FRW_adv_mandel:0 "Georges Mandel"
 FRW_adv_mandel_desc:0 "Georges Mandel lernte die Politik an der Seite Clemenceaus und bewahrte sich die Unerbittlichkeit seines Lehrmeisters. Als Kolonialminister plant er, in Übersee eine Armee von einer halben Million Mann aufzustellen. Frankreich, sagt er gern, sei eine Nation von 110 Millionen."
 FRW_trait_mandel:0 "Kolonialer Hardliner"
 FRW_trait_mandel_desc:0 "Clemenceaus einstige rechte Hand, nun Kolonialminister und lauteste Stimme gegen die Beschwichtigungspolitik."
