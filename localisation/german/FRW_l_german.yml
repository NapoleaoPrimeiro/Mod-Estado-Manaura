 FRW_adv_durandviel:0 "Georges Durand-Viel"
 FRW_adv_durandviel_desc:0 "Georges Durand-Viel leitet seit 1931 den Admiralstab und hat die schnellen Schlachtschiffe Dunkerque und Strasbourg durchgesetzt. Beide wurden entworfen, um die deutschen Panzerschiffe der Deutschland-Klasse zu stellen."
