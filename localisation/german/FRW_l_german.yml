 frw_sys.23.t:0 "Die Levante schließt sich dem Freien Frankreich an"
 frw_sys.23.d:0 "Nach einem kurzen und erbitterten Feldzug hat die Levantearmee die Waffen niedergelegt. Viele ihrer Soldaten haben sich entschieden, zu den Freien Franzosen überzutreten."
 frw_sys.23.a:0 "Vive la France libre!"
 frw_sys.33.t:0 "Die Levante bleibt Vichy treu"
 frw_sys.33.d:0 "General Dentz weist jedes Angebot zurück. In Damaskus werden Offiziere des Freien Frankreichs wegen Hochverrats vor Gericht gestellt. Beim nächsten Mal werden unsere Gesandten besser vorbereitet sein."
 frw_sys.33.a:0 "Wir versuchen es erneut."
 frw_sys.63.t:0 "Unsere Truppen landen in der Levante"
 frw_sys.63.d:0 "Kolonnen des Freien Frankreichs haben mit Unterstützung alliierter Schiffe und Flugzeuge die Hauptstadt der Region erreicht. Nach einem kurzen und erbitterten Feldzug hat die Levantearmee die Waffen niedergelegt. Viele ihrer Soldaten haben sich entschieden, zu den Freien Franzosen überzutreten."
