 FRW_econ_reforms_cat_desc:0 "Das von Frankreich gewählte Wirtschaftsmodell kann Schritt für Schritt vertieft werden. Jede Reform hat drei Stufen; eine neue Stufe kann erst fünf Monate nach der letzten im selben Bereich begonnen werden."
