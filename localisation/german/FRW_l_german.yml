 FRW_ralliement_cat:0 "Freies Frankreich"
 FRW_exped_eq_tt:0 "Hat mindestens §Y1.500§! Infanterieausrüstung auf Lager"
 FRW_dec_exped_tt:0 "Verbraucht §Y15.000§! Mannstärke und §Y1.500§! Infanterieausrüstung. Nach §Y45 Tagen§! meldet sich die Expedition zurück: Bei Erfolg schließt sich die Region dem Freien Frankreich an (§G+5§! Prestige, Heereserfahrung), bei Misserfolg §R-8§! Prestige."
 FRW_dec_ff_agents:0 "Agenten über Frankreich absetzen"
 FRW_dec_ff_agents_desc:0 "Funker und Organisatoren des BCRA werden nachts mit dem Fallschirm über dem besetzten Frankreich abgesetzt."
 FRW_dec_ff_agents_tt:0 "Jeder besetzte französische Staat in Europa: Widerstand §G+5§!."
 FRW_dec_ff_sabotage:0 "Die Eisenbahn sabotieren"
 FRW_dec_ff_sabotage_desc:0 "Eisenbahner der Résistance-Fer sprengen Weichen, bringen Züge zum Entgleisen und verlangsamen jeden deutschen Transport."
 FRW_dec_ff_sabotage_tt:0 "Jeder besetzte französische Staat in Europa: Widerstand §G+10§!, Infrastruktur beschädigt."
 FRW_dec_ff_gold:0 "Das Gold der Banque de France ausgeben"
 FRW_dec_ff_gold_desc:0 "Das vor dem Waffenstillstand aus Frankreich verschiffte Gold bezahlt Waffen und Werkstätten im Ausland.\n\nVerbleibendes Gold: §Y[?FRW_gold|0] t§!"
 FRW_gold_m400_tt:0 "Goldreserven: §R-400 t§!"
 FRW_ralliement_cat_desc:0 "Die Kolonien wurden Vichy übergeben, doch sie können Region für Region zurückgewonnen werden: durch einen §YGesandten§! (günstig, abhängig vom Prestige) oder durch eine §YExpedition§! (kostet Männer und Gewehre, +25 % Chance, weitere +10 %, solange Großbritannien weiterkämpft).\n\nPrestige des Freien Frankreichs: §Y[?FRW_ff_prestige|0]§! von 100\n\nDie Erfolgschance steigt mit dem Prestige (zur Hälfte angerechnet), mit jedem früheren Fehlschlag in derselben Region (je §G+10 %§!, bis zu dreimal) und durch einige Fokusse. Ein Erfolg bringt §G+5§! Prestige, ein Fehlschlag §R-5§!. Das Prestige wächst jeden Monat von selbst, solange Frankreich weiterkämpft, und schneller, wenn ein großer Verbündeter noch im Krieg ist."
 FRW_dec_rally_tt:0 "Nach §Y21 Tagen§! meldet sich der Gesandte zurück: Bei Erfolg schließt sich jeder von §YVichy§! gehaltene Staat der Region dem Freien Frankreich an, samt seinen Soldaten und deren Gewehren."
 FRW_ffp_tt_m10:0 "Prestige des Freien Frankreichs: §R-10§!"
 FRW_ffp_tt_p5:0 "Prestige des Freien Frankreichs: §G+5§!"
 frw_sys.20.t:0 "Französisch-Äquatorialafrika schließt sich dem Freien Frankreich an"
 frw_sys.20.d:0 "Gouverneur Félix Éboué hat sich in Fort-Lamy für das Freie Frankreich erklärt. Binnen weniger Tage folgen Kamerun, Mittelkongo und Gabun. Brazzaville wird die erste Hauptstadt des Freien Frankreichs."
 frw_sys.20.a:0 "Vive la France libre!"
 frw_sys.30.t:0 "Französisch-Äquatorialafrika bleibt Vichy treu"
 frw_sys.30.d:0 "Die Offiziere in Gabun bleiben Vichy treu, und der Gesandte wird auf das nächste Schiff nach Lagos gesetzt. Beim nächsten Mal werden unsere Gesandten besser vorbereitet sein."
 frw_sys.30.a:0 "Wir versuchen es erneut."
 frw_sys.60.t:0 "Unsere Truppen landen in Französisch-Äquatorialafrika"
 frw_sys.60.d:0 "Kolonnen des Freien Frankreichs haben mit Unterstützung alliierter Schiffe und Flugzeuge die Hauptstadt der Region erreicht. Gouverneur Félix Éboué hat sich in Fort-Lamy für das Freie Frankreich erklärt. Binnen weniger Tage folgen Kamerun, Mittelkongo und Gabun. Brazzaville wird die erste Hauptstadt des Freien Frankreichs."
 frw_sys.60.a:0 "Das Lothringer Kreuz weht wieder."
 frw_sys.70.t:0 "Die Expedition nach Französisch-Äquatorialafrika ist gescheitert"
 frw_sys.70.d:0 "Unsere Landung stieß auf entschlossenen Widerstand der Vichy-Garnison und musste abgebrochen werden. Männer und Material gingen verloren, und die Vichy-Propaganda jubelt."
 frw_sys.70.a:0 "Wir kommen wieder."
 frw_sys.21.t:0 "Französisch-Westafrika schließt sich dem Freien Frankreich an"
 frw_sys.21.d:0 "In Dakar hat der Generalgouverneur die Seiten gewechselt. Der große Hafen, das Schlachtschiff in seinem Becken und die Senegalschützen dienen nun dem Freien Frankreich."
 frw_sys.21.a:0 "Vive la France libre!"
 frw_sys.31.t:0 "Französisch-Westafrika bleibt Vichy treu"
 frw_sys.31.d:0 "Die Batterien von Dakar eröffnen das Feuer auf die Schiffe des Freien Frankreichs. Vichy behält Westafrika vorerst. Beim nächsten Mal werden unsere Gesandten besser vorbereitet sein."
 frw_sys.31.a:0 "Wir versuchen es erneut."
