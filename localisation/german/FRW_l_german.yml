 FRW_adv_armengaud:0 "Paul-François Armengaud"
 FRW_adv_armengaud_desc:0 "Paul-François Armengaud vertritt in seinen Büchern die Ansicht, dass die Luftwaffe erst den Himmel erobern muss, bevor sie dem Heer helfen kann. Er will zuerst eine Doktrin und dann die passenden Flugzeuge."
