 FRW_adv_bichelonne:0 "Jean Bichelonne"
 FRW_adv_bichelonne_desc:0 "Man sagt, Jean Bichelonne kenne die Produktion jeder französischen Fabrik auswendig. Er glaubt, eine Nation sei eine Maschine, die von Ingenieuren gelenkt werden muss – und das neue Regime hat ihm die Hebel in die Hand gegeben."
