 frw_sys.25.t:0 "Französisch-Somaliland schließt sich dem Freien Frankreich an"
 frw_sys.25.d:0 "Abgeschnitten und hungernd unter der britischen Blockade hat sich Dschibuti dem Freien Frankreich angeschlossen."
 frw_sys.25.a:0 "Vive la France libre!"
 frw_sys.35.t:0 "Französisch-Somaliland bleibt Vichy treu"
 frw_sys.35.d:0 "Die kleine Garnison von Dschibuti weigert sich überzulaufen, und die Blockade geht weiter. Beim nächsten Mal werden unsere Gesandten besser vorbereitet sein."
 frw_sys.35.a:0 "Wir versuchen es erneut."
