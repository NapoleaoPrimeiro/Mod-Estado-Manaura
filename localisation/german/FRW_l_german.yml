 FRW_european_research_name:0 "Europäischer Rat für Verteidigungsforschung"
 FRW_european_research_desc:0 "Laboratorien und Stäbe der europäischen Partner teilen ihre Ergebnisse über einen gemeinsamen Rat in Paris."
 FRW_latin_research_name:0 "Lateinischer Wissenschaftsrat"
 FRW_latin_research_desc:0 "Die Universitäten und Arsenale der lateinischen Nationen tauschen Ingenieure, Patente und Ergebnisse aus."
 FRW_join_european_research_tt:0 "Frankreich und seine Fraktionspartner treten dem §YEuropäischen Rat für Verteidigungsforschung§! bei (Technologieaustausch)."
 FRW_join_latin_research_tt:0 "Frankreich und seine Fraktionspartner treten dem §YLateinischen Wissenschaftsrat§! bei (Technologieaustausch)."
 FRW_trait_army_of_africa:0 "Afrikaarmee"
 FRW_trait_army_of_africa_desc:0 "Jahre in der Sahara und im Rif haben ihn gelehrt, eine Armee fernab jeder Eisenbahn zu versorgen."
 FRW_trait_ecole_de_guerre:0 "Professor an der École de Guerre"
 FRW_trait_ecole_de_guerre_desc:0 "Er lehrte eine ganze Generation von Stabsoffizieren, eine methodische Schlacht zu planen."
 FRW_trait_armoured_pioneer:0 "Pionier der Panzerdivision"
 FRW_trait_armoured_pioneer_desc:0 "Er setzte sich für eine französische Panzerdivision ein, lange bevor der Generalstab eine wollte."
 FRW_trait_alpine_school:0 "Schule des Gebirgskriegs"
 FRW_trait_alpine_school_desc:0 "Er bildete seine Chasseurs auf den Gletschern der Alpen und in den Fjorden des Nordens aus."
 frw_war.1.t:0 "Der Feind marschiert in Paris ein"
 frw_war.1.d:0 "Heute Morgen marschierten [ROOT.GetAdjective]e Truppenkolonnen die Champs-Élysées hinunter. Die Regierung hatte die Hauptstadt bereits verlassen, und die Stadt war zur offenen Stadt erklärt worden, um sie vor der Zerstörung zu bewahren. Nur wenige Pariser sahen der Parade zu; die meisten hielten ihre Fensterläden geschlossen."
 frw_war.1.a:0 "Frankreich hat eine Schlacht verloren. Es hat nicht den Krieg verloren."
 frw_war.1.b:0 "Paris gehört uns!"
 frw_war.1.c:0 "In der Stadt der Lichter gehen die Lichter aus."
 frw_war.2.t:0 "Paris befreit"
 frw_war.2.d:0 "Die Glocken von Notre-Dame läuteten über der Stadt, als französische Truppen in Paris einzogen. Nach der langen Besatzung füllten Menschenmengen die Straßen von der Porte d’Orléans bis zum Hôtel de Ville."
 frw_war.2.a:0 "Paris geschändet, Paris gebrochen – aber Paris befreit!"
 frw_war.2.b:0 "Vive la France!"

 # ---------- Game rule: secret paths ----------
 RULE_FRW_SECRET_PATHS:0 "France Rework: Geheime Pfade"
 RULE_FRW_SECRET_PATHS_ENABLED:0 "Aktiviert"
 RULE_FRW_SECRET_PATHS_ENABLED_DESC:0 "Frankreich kann die geheimen Pfade freischalten: den Korsarenkapitän aus Saint-Malo (seine Flotte, die Inselüberfälle und das iberische Königreich), indem es nach „Vertagung der Kammern“ abwartet, die revolutionären Syndikalisten der CGT, indem es die Fabriken besetzt hält, und Marcel Déats Neosozialisten, indem es sie anhört."
 RULE_FRW_SECRET_PATHS_DISABLED:0 "Deaktiviert (empfohlen für kompetitiven Mehrspielermodus)"
 RULE_FRW_SECRET_PATHS_DISABLED_DESC:0 "Die Entscheidungen, die die geheimen Pfade freischalten, erscheinen nie: kein Kapitän, kein CGT-Pfad und kein Déat-Pfad. Nur die regulären politischen Pfade sind spielbar."







































 # ---------- FRW secret ideology paths ----------
 FRW_leader_deat:0 "Marcel Déat"
 FRW_leader_deat_desc:0 "Der Normalien und Kriegsveteran Marcel Déat galt einst als Blums Nachfolger. 1933 brach er mit der SFIO und gründete die Neosozialisten, die eine Planwirtschaft, einen starken Staat und Frieden um fast jeden Preis wollen."
 FRW_leader_deat_fascist_desc:0 "Marcel Déat hat mit der parlamentarischen Demokratie gebrochen. Sein Rassemblement National Populaire will eine Einheitspartei, eine korporative Arbeitsfront und ein sozialistisches und nationales Europa."
 FRW_leader_besnard:0 "Pierre Besnard"
 FRW_leader_besnard_desc:0 "Pierre Besnard, ein Eisenbahner aus dem Anjou, führte die revolutionären Syndikalisten der CGT-SR und war Sekretär der Internationalen Arbeiter-Assoziation. Er ist überzeugt, dass die Gewerkschaften und nicht eine Partei die neue Gesellschaft lenken müssen."
 FRW_SYNDIC:0 "Syndikalistisches Frankreich"
 FRW_SYNDIC_DEF:0 "das Syndikalistische Frankreich"
 FRW_SYNDIC_ADJ:0 "syndikalistisch"
 FRW_new_europe_faction:0 "Neue Europäische Ordnung"
 FRW_backer_deat_req:0 "Hat die Unterstützung von §YMarcel Déat§! gewonnen"
 FRW_backer_besnard_req:0 "Hat die Unterstützung von §YPierre Besnard§! gewonnen"
 FRW_dec_hear_the_neos:0 "Die Neosozialisten anhören"
 FRW_dec_hear_the_neos_desc:0 "Marcel Déat und die aus der SFIO ausgeschlossenen Neosozialisten halten ihre Versammlungen in der Salle Wagram ab. Jemanden zum Zuhören zu schicken, kostet wenig, und sie haben Ideen über den Staat, die sonst niemand in der Kammer laut auszusprechen wagt."
 FRW_dec_backer_deat:0 "Marcel Déat gewinnen"
 FRW_dec_backer_deat_desc:0 "Die Gespräche mit Marcel Déat und den Neosozialisten dauern etwa sechs Wochen. Es kann jeweils nur ein Anführer dieses Lagers umworben werden.\n\nErfordert §Y45 %§! Unterstützung für die Partei und §Y30 %§! Stabilität. Danach öffnet sich im Fokusbaum ein verborgener Pfad anstelle der Pfade von Blum und Reynaud."
 FRW_dec_occupy_factories:0 "Die Fabriken besetzt halten"
 FRW_dec_occupy_factories_desc:0 "Die Streikenden weigern sich zu gehen. Rote Fahnen hängen an den Fabriktoren, und die örtlichen Gewerkschaften betreiben die Kantinen und die Nachtwachen. Mit jedem Monat, den die Besetzungen andauern, wird die CGT kühner."
 FRW_dec_backer_besnard:0 "Pierre Besnard gewinnen"
 FRW_dec_backer_besnard_desc:0 "Die Gespräche mit Pierre Besnard und den revolutionären Syndikalisten dauern etwa sechs Wochen. Es kann jeweils nur ein Anführer dieses Lagers umworben werden.\n\nErfordert §Y35 %§! Unterstützung für die Partei und §Y30 %§! Stabilität. Danach öffnet sich im Fokusbaum ein verborgener Pfad anstelle der Pfade von Thorez und Pivert."
 frw_sp.1.t:0 "Die Charta von Amiens"
 frw_sp.1.d:0 "Drei Monate später sind die Fabriken noch immer besetzt. Eine Abordnung revolutionärer Syndikalisten erscheint im Ministerium mit einer Abschrift der Charta von Amiens von 1906, ein Satz darin unterstrichen: Die Gewerkschaft, heute ein Organ des Widerstands, wird morgen das Organ der Produktion und der Verteilung sein.\n\nIhr Sprecher, ein Eisenbahner namens Pierre Besnard, nimmt kein Blatt vor den Mund. „Die Arbeiter brauchen keinen neuen Herrn im Hôtel de Ville, ob rot oder nicht. Sie brauchen ihre Gewerkschaften. Überlassen Sie die Fabriken denen, die in ihnen arbeiten, und Frankreich wird sich selbst regieren.“\n\n§GEine neue Entscheidung ist verfügbar: Pierre Besnard gewinnen.§!"
 frw_sp.1.a:0 "Lasst die Gewerkschaften sprechen."
 frw_sp.2.t:0 "Ordnung, Autorität, Nation"
 frw_sp.2.d:0 "Die Salle Wagram ist voll. Auf dem Podium wiederholt Marcel Déat die Losung, die die Neosozialisten ihren Platz in der SFIO gekostet hat: Der Sozialismus werde nur siegen, wenn er Ordnung, Autorität und Nation aufgreife und sie nicht länger den Ligen überlasse.\n\nDanach empfängt er unseren Gesandten. „Blum will auf die Revolution warten, und die Rechte will auf gar nichts warten. Ich schlage einen Plan vor und einen Staat, der stark genug ist, ihn umzusetzen. Sagen Sie der Regierung, dass die Neosozialisten bereit sind zu dienen.“\n\n§GEine neue Entscheidung ist verfügbar: Marcel Déat gewinnen.§!"
 frw_sp.2.a:0 "Die Republik braucht eine starke Hand."
 frw_sp.3.t:0 "Déat gründet die Einheitspartei"
 frw_sp.3.d:0 "In Paris hat Marcel Déat die Kammer geschlossen und den Rassemblement National Populaire zur einzigen Partei Frankreichs erklärt. Ehemalige Sozialisten marschieren Seite an Seite mit Veteranen der Ligen unter der Losung einer nationalen und volkstümlichen Revolution. Déat spricht von einem neuen Europa, und die anderen Hauptstädte fragen sich, in welche Richtung er es führen will."
 frw_sp.3.a:0 "Wieder ein Sozialist, der zum Diktator wurde."
 frw_sp.3.b:0 "Weder rechts noch links: Frankreich!"
 # ---------- /FRW secret ideology paths ----------
 # ---------- FRW pirate path ----------
 FRW_black_flag_desc:0 "Die Artikel der Küstenbrüder: ein Anteil für jeden Mann, eine Stimme für jeden Kapitän und kein Pardon für einen Kaufmann, der sich wehrt."
 FRW_black_flag_2_desc:0 "Kaperschiffe und U-Boote jagen auf jedem Seeweg Europas."
 FRW_black_flag_3_desc:0 "Die schwarze Flagge weht vom Großmast des Flaggschiffs. Die Flotte des Kapitäns gibt kein Pardon und nimmt ihren Sold in Prisen."
 FRW_boarders_desc:0 "Marineinfanteristen, ausgebildet, ein Schiff oder einen Hafen im Handstreich zu nehmen."
 FRW_free_port_desc:0 "Saint-Malo ist ein Freihafen. Kein Zöllner kommt an Bord, doch jedes Schiff zahlt eine Gebühr."
 FRW_island_bases_desc:0 "Eine Kette von Inselhäfen von den Balearen bis zu den Seychellen versorgt die Flotten und Landungstrupps des Kapitäns."
 FRW_pirate_captain:0 "Korsarenkapitän"
 FRW_pirate_captain_desc:0 "Er hat unter drei Flaggen gekämpft und unter keiner von ihnen eine Seeschlacht verloren."
 FRW_pirate_legoff:0 "Yann Le Goff"
 FRW_pirate_morvan:0 "Corentin Morvan"
 FRW_pirate_duroc:0 "Anatole Duroc"
 # ---------- /FRW pirate path ----------
 # ---------- FRW franc column ----------
 FRW_franc_below_40_tt:0 "Die Inflation liegt unter §Y40 %§!"
 FRW_strong_franc_desc:0 "Kredit ist billig, und dem Franc wird wieder vertraut. Im ganzen Land öffnen die Baustellen wieder."
 FRW_war_finance_desc:0 "Kriegsanleihen, Steuern und Preiskontrollen finanzieren den Krieg."
 # ---------- /FRW franc column ----------
 # ---------- FRW colonies ----------
 FRW_colonial_administration:0 "Kolonialverwaltung"
 FRW_colonial_administration_tt:0 "Jeder Staat dieser Region, den Frankreich besitzt (ohne Kerngebiet und noch nicht verwaltet), erhält §YKolonialverwaltung§!: mehr rekrutierbare Mannstärke und §G+15 %§! Ressourcen."
 FRW_colonial_administration_all_tt:0 "§YAlgerien§!, die §YAntillen§!, §YFranzösisch-Guayana§! und §YRéunion§! werden zu §GKerngebieten§! (die überseeischen Départements).\nJeder andere Staat in §YAfrika§!, den Frankreich besitzt, erhält §YKolonialverwaltung§!: mehr rekrutierbare Mannstärke und §G+15 %§! Ressourcen."
 FRW_free_caribbean:0 "Die Antillen und Guayana befreien"
 FRW_free_caribbean_desc:0 "Die Plantageninseln der Karibik und die Strafkolonie Guayana werden ihren eigenen Völkern übergeben.\n\nEntlässt sie als §Ykommunistische Satelliten§! (nur dort, wo Frankreich ihr Gebiet hält) und stärkt §YBrudervölker§!."
 # ---------- /FRW colonies ----------
 # ---------- FRW feedback 2 ----------
 FRW_dec_renew_federal_offer:0 "Föderationsangebot erneuern"
 FRW_dec_renew_federal_offer_desc:0 "Nicht jede Regierung war bereit, als Paris zum ersten Mal anfragte. Eine neue Delegation von Föderalisten bereist die Hauptstädte Europas mit demselben Angebot: eine Armee, eine Währung, eine Bundesversammlung."
 FRW_dec_renew_federal_offer_tt:0 "Jede demokratische Kleinmacht Europas in der Fraktion Frankreichs oder unter französischer Garantie wird erneut zum Beitritt zur §YEuropäischen Föderation§! aufgefordert."
 # ---------- /FRW feedback 2 ----------
 # ---------- FRW feedback 3 ----------
 FRW_continental_system_faction:0 "Die Kontinentalsperre"
 FRW_rhine_held_desc:0 "Als deutsche Bataillone ins Rheinland einmarschierten, machte Frankreich mobil, und Berlin zog sie zurück. Seit 1918 war sich das Land seiner selbst nicht mehr so sicher."
 frw_fb3.1.t:0 "Der Rhein gehalten"
 frw_fb3.1.d:0 "Die deutschen Kolonnen, die in die entmilitarisierte Zone eingerückt waren, marschieren über die Rheinbrücken zurück. Hitler hat zuerst geblinzelt. In Paris nennen die Zeitungen es den ersten Sieg seit Versailles, und die Abgeordneten, die für die Mobilmachung gestimmt haben, werden vor dem Palais Bourbon bejubelt."
 frw_fb3.1.a:0 "Frankreich hält weiter die Wacht am Rhein."
 FRW_dec_invite_trotsky:0 "Leo Trotzki Asyl anbieten"
 FRW_dec_invite_trotsky_desc:0 "Trotzki lebte bis 1935 in Frankreich, als die Republik ihn Moskau zuliebe auswies. Ein Frankreich der Arbeiter könnte den Mann zurückholen, der die Rote Armee aufgebaut hat, auch wenn Stalin das nicht verzeihen würde."
 FRW_dec_invite_trotsky_tt:0 "§YLeo Trotzki§! kommt nach Frankreich und kann als §Ypolitischer Berater§! ernannt werden."
 frw_fb3.2.t:0 "Trotzki in Paris"
 frw_fb3.2.d:0 "Leo Trotzki ist am Gare de Lyon aus dem Zug gestiegen, zehn Jahre nachdem Stalin ihn aus der Sowjetunion vertrieben hat. Er will Vorträge halten, schreiben und beim Aufbau unserer Armee helfen. Moskau hat seinen Botschafter zu Konsultationen zurückgerufen."
 frw_fb3.2.a:0 "Willkommen, Genosse."
 frw_fb3.2.a.tt:0 "§YLeo Trotzki§! kann als §Ypolitischer Berater§! ernannt werden.\nMit §YMarceau Pivert§!: §G+3 %§! Stabilität und kommunistische Unterstützung.\nMit §YMaurice Thorez§!: §R-5 %§! Stabilität.\nEine kommunistische §YSowjetunion§! nimmt Anstoß (§R-40§! Meinung)."
 FRW_adv_trotsky:0 "Leo Trotzki"
 FRW_trait_trotsky:0 "Gründer der Roten Armee"
 FRW_trotsky_affront:0 "Gewährt Trotzki Asyl"
