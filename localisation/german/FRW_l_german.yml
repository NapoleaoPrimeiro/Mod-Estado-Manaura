 FRW_adv_perrin:0 "Jean Perrin"
 FRW_adv_perrin_desc:0 "Jean Perrin erhielt den Nobelpreis für den Nachweis der Existenz von Atomen. Als Unterstaatssekretär für Forschung gründet er einen nationalen Dienst, der Wissenschaftler dafür bezahlt, sich ganz der Forschung zu widmen, und aus dem später das CNRS hervorgehen wird."
