 FRW_adv_marion:0 "Paul Marion"
 FRW_adv_marion_desc:0 "Paul Marion lernte die Methoden der Komintern von innen kennen, bevor er sich gegen sie wandte. Er weiß, wie eine Partei die Straße und die Presse gewinnt, und will dieses Wissen in den Dienst von Jacques Doriot stellen."
