 frw_sys.24.t:0 "Madagaskar und der Indische Ozean schließen sich dem Freien Frankreich an"
 frw_sys.24.d:0 "Der Gouverneur in Tananarive hat die Insel übergeben. Der Indische Ozean ist für die Achse gesperrt."
 frw_sys.24.a:0 "Vive la France libre!"
 frw_sys.34.t:0 "Madagaskar und der Indische Ozean bleiben Vichy treu"
 frw_sys.34.d:0 "Die Garnison von Diego-Suarez hält stand. Madagaskar bleibt Vichy treu. Beim nächsten Mal werden unsere Gesandten besser vorbereitet sein."
 frw_sys.34.a:0 "Wir versuchen es erneut."
 frw_sys.64.t:0 "Unsere Truppen landen auf Madagaskar und im Indischen Ozean"
 frw_sys.64.d:0 "Kolonnen des Freien Frankreichs haben mit Unterstützung alliierter Schiffe und Flugzeuge die Hauptstadt der Region erreicht. Der Gouverneur in Tananarive hat die Insel übergeben. Der Indische Ozean ist für die Achse gesperrt."
