 # ---------- France Rework: frontier, war, industry ----------
 FRW_dec_fort_meuse:0 "Die Maaslücke schließen"
 FRW_dec_fort_meuse_desc:0 "Der Generalstab hält die Ardennen für unpassierbar. Die Pioniere der 2. Armee sind sich weniger sicher und fordern Kasematten an der Maas zwischen Sedan und Montmédy."
 FRW_dec_fort_nord:0 "Die Nordgrenze befestigen"
 FRW_dec_fort_nord_desc:0 "Von Dünkirchen bis Maubeuge liegt die Grenze zu Belgien offen. Eine Linie aus Bunkern und Panzergräben soll den Kanälen folgen."
 FRW_dec_fort_alps:0 "Der befestigte Alpenabschnitt"
 FRW_dec_fort_alps_desc:0 "Festungen hoch über den Pässen der Maurienne und der Tinée können jede Armee aufhalten, die die Alpen zu überqueren versucht."
 FRW_dec_fort_pyrenees:0 "Wacht an den Pyrenäen"
 FRW_dec_fort_pyrenees_desc:0 "Der Krieg in Spanien könnte über die Berge übergreifen. Einige Stützpunkte bewachen die Pässe und die Küstenstraße bei Le Perthus."
 FRW_dec_fort_mareth:0 "Die Mareth-Linie"
 FRW_dec_fort_mareth_desc:0 "Zwischen dem Meer und den Matmata-Bergen südlich von Gabès riegelt eine Linie aus Bunkern die Straße von Italienisch-Libyen nach Tunesien ab."
 FRW_dec_fort_coast:0 "Küstenbatterien von Brest und Toulon"
 FRW_dec_fort_coast_desc:0 "Neue schwere Batterien und Flugabwehrgeschütze schützen die beiden großen Marinestützpunkte der Republik."
 FRW_dec_fort_paris_aa:0 "Luftverteidigung von Paris"
 FRW_dec_fort_paris_aa_desc:0 "Scheinwerfer, Horchposten und Flugabwehrbatterien umgeben die Hauptstadt, und eine neue Radarstation überwacht den nördlichen Himmel."
 FRW_dec_fort_corsica:0 "Korsika befestigen"
 FRW_dec_fort_corsica_desc:0 "Ajaccio und Bastia liegen in Reichweite der italienischen Flotte. Küstengeschütze und eine kleine Garnison sichern die Insel."
 FRW_frontier_cat:0 "Verteidigung der Grenzen"
 FRW_frontier_cat_desc:0 "Die Maginot-Linie deckt nur einen Teil Frankreichs. Diese Anlagen schließen die verbleibenden Lücken im Norden, in den Alpen, an den Pyrenäen und in Übersee. Jedes Projekt dauert einige Wochen."
 FRW_dec_war_taxis:0 "Die Taxis von Paris requirieren"
 FRW_dec_war_taxis_desc:0 "1914 brachten die Taxis von Paris eine Division an die Marne. Nun wird jeder Lastwagen, jeder Bus und jedes Auto im Großraum der Hauptstadt in den Dienst gestellt."
 FRW_dec_war_reserves:0 "Die Reservejahrgänge einberufen"
 FRW_dec_war_reserves_desc:0 "Die älteren Jahrgänge, die vor Jahren entlassen wurden, werden wieder zu den Fahnen gerufen."
 FRW_dec_war_arsenals:0 "Die Arsenale von 1918 öffnen"
 FRW_dec_war_arsenals_desc:0 "Die Depots enthalten noch Gewehre und Geschütze aus dem letzten Krieg. Alt, aber besser als nichts."
 FRW_dec_war_gold:0 "Das Gold nach Dakar verschiffen"
 FRW_dec_war_gold_desc:0 "Die Kreuzer der Marine können die Reserven der Banque de France außer Reichweite des Feindes bringen. Was auch immer in Paris geschieht, der Staat wird nicht bankrott sein."
 FRW_dec_war_loire:0 "Hinter die Loire zurückweichen"
 FRW_dec_war_loire_desc:0 "Wenn die Front nicht zu halten ist, darf die Armee nicht vernichtet werden. Sie zieht sich geordnet bis zum nächsten Fluss zurück und gräbt sich erneut ein."
 FRW_patrie_cat:0 "La Patrie en danger"
 FRW_gold_safe_tt:0 "Die Goldreserven sind in Sicherheit: Wenn Frankreich kapituliert, kann das §YFreie Frankreich§! sie weiterhin ausgeben."
 FRW_patrie_cat_desc:0 "Der Feind steht auf französischem Boden. Jede dieser Notmaßnahmen kann nur einmal ergriffen werden, also wählt den Zeitpunkt mit Bedacht."
 FRW_invaded_tt:0 "Ein Feind hält einen Teil des §Yfranzösischen Mutterlandes§!"
 FRW_gold_abroad_desc:0 "Die Reserven der Banque de France sind in Westafrika in Sicherheit. Die Regierung kann ihre Soldaten und Lieferanten weiterhin bezahlen."
 FRW_line_of_the_loire_desc:0 "Die Armee hat sich vom Feind gelöst und entlang des Flusses eingegraben. Sie wird nicht angreifen, aber sie wird auch nicht leicht zu vertreiben sein."
