 # ---------- Council of Ministers: custom advisors ----------
 FRW_adv_appoint_req:0 "Über den §YMinisterrat§! ernannt"
 FRW_dec_dismiss_tt:0 "Der Minister verlässt die Regierung und gibt seinen Beraterplatz frei. Er kann später erneut ernannt werden."
 FRW_council_cat:0 "Der Ministerrat"
 FRW_council_cat_desc:0 "Minister, Fachleute und Parteigänger bieten ihre Dienste an. Wählt ein Ressort, um zu sehen, wer verfügbar ist. Manche Reformen lassen sich ohne den richtigen Mann in der Regierung nicht durchführen.\n\nHier ernannte Minister können oben in dieser Liste wieder entlassen werden."
 FRW_dec_council_back:0 "« Zurück zum Ministerrat"
 FRW_dec_council_back_desc:0 "Zurück zur Liste der Ressorts."
 FRW_dec_council_back_tt:0 "Zurück zur Liste der Ressorts."
 FRW_dec_council_open_tt:0 "Zeigt die Kandidaten dieses Ressorts."
 FRW_dec_council_open_politics:0 "Ressort: Politik"
 FRW_dec_council_open_politics_desc:0 "Parteigänger, Ideologen und die Stimmen der Straße."
 FRW_dec_council_open_economy:0 "Ressort: Wirtschaft"
 FRW_dec_council_open_economy_desc:0 "Planer, Ingenieure und Statistiker, die die Wirtschaft lenken."
 FRW_dec_council_open_research:0 "Ressort: Forschung"
 FRW_dec_council_open_research_desc:0 "Wissenschaftler, die die französische Forschung wieder in die vorderste Reihe bringen können."
 FRW_dec_council_open_projects:0 "Ressort: Sonderprojekte"
 FRW_dec_council_open_projects_desc:0 "Ingenieure für die großen Projekte der Zukunft: Raketen und das Atom."
 FRW_dec_council_open_army:0 "Ressort: Heer"
 FRW_dec_council_open_army_desc:0 "Generalstabschefs und Reformer, die das Heer auf den nächsten Krieg vorbereiten."
 FRW_dec_council_open_navy:0 "Ressort: Marine"
 FRW_dec_council_open_navy_desc:0 "Admirale, die die Flotte aufbauen und ausbilden."
 FRW_dec_council_open_air:0 "Ressort: Luftwaffe"
 FRW_dec_council_open_air_desc:0 "Luftwaffengeneräle, die die Armée de l'Air prägen."
 FRW_dec_council_open_resistance:0 "Ressort: Nachrichtendienst"
 FRW_dec_council_open_resistance_desc:0 "Das Deuxième Bureau und die Männer, die den Widerstand organisieren würden, sollte Frankreich je besetzt werden."
 FRW_adv_monnet:0 "Jean Monnet"
 FRW_adv_monnet_desc:0 "Jean Monnet hat sein Leben damit verbracht, Regierungen davon zu überzeugen, zu bündeln, was sie allein nicht bewältigen können, von der alliierten Schifffahrt 1917 bis zu Anleihen für Polen und China. Er ist überzeugt, dass die Nationen Europas eines Tages ihre Kohle und ihren Stahl teilen müssen und mit ihnen einen Teil ihrer Souveränität."
 FRW_trait_monnet:0 "Planer Europas"
 FRW_trait_monnet_desc:0 "Ein Cognachändler, der zum internationalen Finanzier wurde, mit einunddreißig Jahren stellvertretender Generalsekretär des Völkerbundes."
 FRW_dec_appoint_monnet:0 "Jean Monnet ernennen"
 FRW_dec_appoint_monnet_desc:0 "Jean Monnet hat sein Leben damit verbracht, Regierungen davon zu überzeugen, zu bündeln, was sie allein nicht bewältigen können, von der alliierten Schifffahrt 1917 bis zu Anleihen für Polen und China. Er ist überzeugt, dass die Nationen Europas eines Tages ihre Kohle und ihren Stahl teilen müssen und mit ihnen einen Teil ihrer Souveränität."
 FRW_dec_dismiss_monnet:0 "Jean Monnet entlassen"
 FRW_dec_dismiss_monnet_desc:0 "Jean Monnet verlässt den Ministerrat."
 FRW_adv_monnet_effects_tt:0 "§YJean Monnet§! tritt der Regierung als §YPlaner Europas§! bei (politischer Berater):\nMaximale Fabrikeffizienz: §G+5 %§!\nHandelsmeinung: §G+20 %§!\nMonatlicher Meinungsgewinn: §G+10 %§!\nKriegsunterstützung: §R-3 %§!"
 FRW_adv_monnet_req:0 "§YJean Monnet§! ist politischer Berater"
 FRW_adv_dautry:0 "Raoul Dautry"
 FRW_adv_dautry_desc:0 "Raoul Dautry machte sich einen Namen mit dem Wiederaufbau der zerstörten Strecken Nordfrankreichs und der Modernisierung der Staatsbahnen. Für Ausschüsse hat er wenig Geduld; er setzt lieber ein Ziel und überlässt es seinen Ingenieuren, es zu erreichen."
 FRW_trait_dautry:0 "Rüstungsminister"
 FRW_trait_dautry_desc:0 "Der Ingenieur, der nach 1918 die nördlichen Eisenbahnen wiederaufbaute und die État-Bahn wie ein modernes Unternehmen führte."
