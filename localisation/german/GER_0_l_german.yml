 GER_adolf_hitler_desc:0 "Adolf "Führer" Hitler, Reichskanzler von Deutschland, Vorsitzender der NSDAP, Reichspräsident, Führer und Reichskanzler, Oberbefehlshaber.\nEr forderte die Mitglieder des Reichstags auf, am 24. März 1933 für das Ermächtigungsgesetz zu stimmen. Durch das Gesetz erhielt Hitler eine "vorübergehende" Generalvollmacht. Sie gab ihm die Freiheit, ohne parlamentarische Genehmigung und sogar ohne verfassungsrechtliche Einschränkungen zu handeln.\nUnter Anwendung seiner charakteristischen Mischung aus Verhandlung und Einschüchterung bot Hitler die Möglichkeit einer freundschaftlichen Zusammenarbeit an und versprach, Reichstag, Präsident, Länder oder Kirchen nicht zu bedrohen, wenn die Notstandsvollmachten gewährt würden.\nDas Gesetz erlaubte Hitler und seinem Kabinett, vier Jahre lang durch Notverordnung zu regieren, aber Hindenburg blieb Präsident. Hitler begann sofort, die Befugnisse der Länder und die Existenz nicht-nationalsozialistischer Parteien und Organisationen zu beseitigen. Nicht-nationalsozialistische Parteien wurden am 14. Juli 1933 offiziell verboten und der Reichstag seiner demokratischen Verantwortung beraubt. Hindenburg blieb Oberbefehlshaber der Armee und behielt das Recht, ausländische Verträge auszuhandeln.\nDas Gesetz schränkte die Befugnisse des Präsidenten nicht ein, und Hitler erlangte erst mit Hindenburgs Tod im August 1934 die volle diktatorische Macht. Nur Hitler als Staatsoberhaupt konnte sich selbst als Regierungschef absetzen. Alle Soldaten leisteten am Tag von Hindenburgs Tod den Hitler-Eid und schworen Hitler persönlich "bedingungslosen Gehorsam" und nicht dem Amt oder der Nation. Fortan hatte die Zeit des großen Führers von Deutschland begonnen, und nun war es an ihm, Europa zu regieren."
