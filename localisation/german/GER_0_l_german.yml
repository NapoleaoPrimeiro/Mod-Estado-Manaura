germany.899.desc:0 "Eine Gruppe von Wissenschaftlern glaubt, dass der Führer von den Habsburgern abstammt, fordert jedoch Forschungsgelder. Was sollen wir tun?"
germany.890.t:0 "Genealogische Forschung - Phase 2"
