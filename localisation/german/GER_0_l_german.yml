  HRE_four_year_plan:0 "Vierjahresplan"
  HRE_four_year_plan_desc:0 "Der Plan zielt darauf ab, die Wirtschaft durch staatliche Kontrolle, Investitionen und Anreize rasch zu entwickeln. Öffentliche Bauprogramme werden die Arbeitslosigkeit senken, während neue Fabriken und Infrastruktur entstehen."
  HRE_focus_on_industrialization:0 "Fokus auf Industrialisierung"
  HRE_focus_on_industrialization_desc:0 "Die Kapazitätserweiterung ist das Herzstück des Vierjahresplans. Der Staat wird massiv in den Bau neuer Fabriken und die Modernisierung bestehender Anlagen investieren."
  HRE_heavy_industry:0 "Schwerindustrie"
  HRE_heavy_industry_desc:0 "Die Schwerindustrie ist eine Quelle des nationalen Stolzes. Diese gigantischen Anlagen treiben Deutschlands Entwicklung voran und prägen nicht nur die Volkswirtschaft, sondern auch die geopolitische Landschaft."
  HRE_develop_rural_areas:0 "Ländliche Gebiete entwickeln"
  HRE_develop_rural_areas_desc:0 "Deutschlands Wohlstand hängt nicht nur von der Entwicklung seiner Städte, sondern auch seiner ländlichen Regionen ab. Die Entwicklung dieser Regionen durch die Schaffung neuer Arbeitsplätze wird zur Stärkung der Volkswirtschaft beitragen."
  HRE_civilian_industry5:0 "Einstellungen in Fabriken erhöhen"
  HRE_civilian_industry5_desc:0 "Die Erhöhung der Beschäftigung in Fabriken wird nicht nur die Arbeitslosigkeit senken, sondern auch die Inlandsnachfrage und den Konsum ankurbeln. Dies festigt Deutschlands führende Position in Europa."
  HRE_civilian_industry6:0 "Zivilindustrie"
  HRE_civilian_industry6_desc:0 "Die Entwicklung der Zivilindustrie fördert auch Investitionen in Innovation und Technologie. Dies führt zur Entwicklung neuer Produkte und Produktionsmethoden."
  HRE_focus_on_key_industries:0 "Fokus auf Schlüsselindustrien"
  HRE_focus_on_key_industries_desc:0 "Es wird Deutschland ermöglichen, im internationalen Wettbewerb an der Spitze zu bleiben und eine wichtigere Rolle in der Weltwirtschaft zu spielen."
  HRE_focus_on_infrastructure:0 "Fokus auf Infrastruktur"
  HRE_focus_on_infrastructure_desc:0 "Investitionen in die Infrastruktur sind lebenswichtig für Deutschlands Entwicklung und Wohlstand. Eine moderne Infrastruktur stimuliert das Wachstum und schafft Arbeitsplätze."
  HRE_distribution_industry:0 "Vertriebsindustrie"
  HRE_distribution_industry_desc:0 "Ein Teil der deutschen Wirtschaft, der nicht ignoriert werden kann. Sie spielt eine kritische Rolle beim Funktionieren der Lieferkette."
  HRE_infrastructure_effort:0 "Infrastrukturanstrengung"
  HRE_infrastructure_effort_desc:0 "Investitionen in die Infrastruktur sind entscheidend für Deutschlands Wohlstand und Zukunft."
  HRE_expand_our_roads:0 "Ausbau unserer Straßen"
  HRE_expand_our_roads_desc:0 "Ein modernes und weitreichendes Straßennetz wird den Personen- und Warenverkehr beschleunigen und Zeitverluste reduzieren."
  HRE_improve_railway_network:0 "Eisenbahnnetz verbessern"
  HRE_improve_railway_network_desc:0 "Die Investitionen sollten sich nicht auf die Hauptstrecken beschränken, sondern auch regionale und lokale Linien abdecken."
  HRE_expand_the_airports:0 "Flughäfen ausbauen"
  HRE_expand_the_airports_desc:0 "Der Ausbau der Flughäfen ist nicht nur für die wirtschaftliche Entwicklung wichtig, sondern auch für das nationale Image."
  HRE_restoration_and_development:0 "Wiederaufbau und Entwicklung"
  HRE_restoration_and_development_desc:0 "Diese Herausforderung zu meistern wird nicht einfach sein, kann aber nur durch den Mut und die harte Arbeit des deutschen Volkes erreicht werden."
  HRE_finish_the_four_year_plan:0 "Vierjahresplan abschließen"
  HRE_finish_the_four_year_plan_desc:0 "Nach dem Ende des Vierjahresplans nahm die Wirtschaft Fahrt auf. Die wirtschaftliche Lage der Menschen besserte sich. Lang lebe der Kaiser, lang lebe Deutschland."
  HRE_urbanize_the_capital:0 "Hauptstadt urbanisieren"
  HRE_urbanize_the_capital_desc:0 "Eines der Hauptziele des Plans ist die Verbesserung der städtischen Infrastruktur durch breite Boulevards und moderne Gebäude."
  #luftstreitkrafte
  HRE_army_effort:0 "Heeresanstrengung"
  HRE_army_effort_desc:0 "Die deutsche Armee hat in den letzten Jahren einen stetigen Prozess des Wachstums und der Modernisierung durchlaufen."
  HRE_luftstreitkrafte:0 "Luftstreitkräfte"
  HRE_luftstreitkrafte_desc:0 "Neue Flugzeuge und Technologien werden entwickelt und Piloten werden in modernen Taktiken geschult."
  HRE_fighter_focus:0 "Jäger-Fokus"
  HRE_fighter_focus_desc:0 "Der Fokus liegt auf der Erringung und Aufrechterhaltung der Luftherrschaft."
  HRE_fighter_focus_2:0 "Jäger-Fokus 2"
  HRE_fighter_focus_2_desc:0 "Die Zukunft der Flugzeugfokus-Strategie bleibt ungewiss. Die Zeit wird zeigen, wie sich dies auf Deutschlands Verteidigungsfähigkeit auswirkt." 
  HRE_CAS_effort:0 "Nahunterstützungsanstrengung"
  HRE_CAS_effort_desc:0 "In den letzten Jahren war die Entwicklung der Luftnahunterstützung von großer Bedeutung."
  HRE_CAS_effort_2:0 "Nahunterstützungsanstrengung 2"
  HRE_CAS_effort_2_desc:0 "Entwicklung neuer Flugzeuge und Technologien zur Verbesserung der Luftnahunterstützung (CAS)." 
  HRE_bomber_focus:0 "Bomber-Fokus"
  HRE_bomber_focus_desc:0 "Wandel in der Doktrin: Abkehr vom rein jägerbasierten Ansatz hin zu einer Strategie mit Schwerpunkt auf Bombern."
  HRE_bomber_focus_2:0 "Bomber-Fokus 2"
  HRE_bomber_focus_2_desc:0 "Nur die Zeit wird zeigen, welche Auswirkungen diese neue Strategie auf die deutsche Luftmacht haben wird." 
  HRE_NAV_effort:0 "Marinefliegeranstrengung"
  HRE_NAV_effort_desc:0 "Die Anstrengungen bei Marinebombern konzentrieren sich auf die Zerstörung feindlicher Schiffe und Hafenanlagen."
  HRE_NAV_effort_2:0 "Marinefliegeranstrengung 2"
  HRE_NAV_effort_2_desc:0 "Investitionen in Marinebomber zur Verbesserung der Seekriegsführung aus der Luft." 
  #army
  HRE_re_creation_of_kaiserliche_armee:0 "Wiederherstellung der Kaiserlichen Armee"
  HRE_re_creation_of_kaiserliche_armee_desc:0 "Der Geist der Kaiserlichen Armee erwacht im Herzen Deutschlands erneut. Dies markiert den Eintritt in eine neue Ära."
  HRE_truck_factories:0 "LKW-Fabriken"
  HRE_truck_factories_desc:0 "Lastwagenfabriken sind das Rückgrat der wirtschaftlichen Entwicklung und militärischen Macht des Reichs." 
  HRE_mechanisierte_factories:0 "Mechanisierungsfabriken"
  HRE_mechanisierte_factories_desc:0 "Nur die Zeit wird zeigen, welche Auswirkungen diese neue Produktionsmethode auf das politische Gleichgewicht in Europa haben wird."
  HRE_tank_factories:0 "Panzerfabriken"
  HRE_tank_factories_desc:0 "Dieser Sektor wird in den kommenden Jahren weiter wachsen und eine wichtige Rolle für Deutschlands militärische Macht spielen."
  HRE_rifle_factories:0 "Gewährfabriken"
  HRE_rifle_factories_desc:0 "Moderne Produktionsstätten, die die deutsche Armee mit zuverlässigen Gewehren versorgen." 
  HRE_support_equipment_factory:0 "Unterstützungsausrüstungsfabriken"
  HRE_support_equipment_factory_desc:0 "Diese Fabriken schaffen Arbeitsplätze und produzieren lebenswichtiges Gerät für die moderne Armee."
  HRE_field_artillery_factories:0 "Feldartilleriefabriken"
  HRE_field_artillery_factories_desc:0 "Fabriken für leistungsstarke Haubitzen und Kanonen, um feindliche Linien zu zerschmettern."
  HRE_infantry_tactics:0 "Infanterietaktiken"
  HRE_infantry_tactics_desc:0 "Taktiken fördern Teamarbeit und Disziplin und machen die Soldaten zu einer effektiveren Kampftruppe." 
  HRE_support_equipment:0 "Zusatzausrüstung"
  HRE_support_equipment_desc:0 "Die unbesungenen Helden der Produktion: Ersatzteile, Uniformen und Munition."
  HRE_tank_hunter:0 "Panzerjäger"
  HRE_tank_hunter_desc:0 "Kampffahrzeuge der nächsten Generation zur Abwehr feindlicher Panzerverbände."
  HRE_expand_the_mobilization_program:0 "Mobilisierungsprogramm ausweiten"
  HRE_expand_the_mobilization_program_desc:0 "Erhöhung der Rekrutierung und Anpassung der Wirtschaft an die Bedürfnisse des Krieges." 
  HRE_mechanisierte_abteilung:0 "Mechanisierte Abteilung"
  HRE_mechanisierte_abteilung_desc:0 "Diese Einheiten ersetzen traditionelle Kavallerie und sorgen für die nötige Mobilität auf dem modernen Schlachtfeld."
  HRE_tank_expert:0 "Panzerexperte"
  HRE_tank_expert_desc:0 "Elite-Ingenieure und Wissenschaftler an der Spitze des technologischen Fortschritts."
  HRE_mechanised_armies:0 "Mechanisierte Armeen"
  HRE_mechanised_armies_desc:0 "Geschwindigkeit und Feuerkraft ersetzen die schweren Infanterietaktiken der Vergangenheit."
  HRE_inf_armies:0 "Infanteriearmeen"
  HRE_inf_armies_desc:0 "Das Fundament deutscher Militärmacht und nationalen Stolzes."
  #navy
  HRE_kaiserliche_marine:0 "Kaiserliche Marine"
  HRE_kaiserliche_marine_desc:0 "Eine Seemacht mit stolzer Tradition, die die Sicherheit des Reiches auf den Meeren gewährleistet." 
  HRE_ensure_commercial_protection:0 "Handelsschutz gewährleisten"
  HRE_ensure_commercial_protection_desc:0 "Investitionen in Schiffbau werden vor unfairem Wettbewerb geschützt."
  HRE_expand_shipbuilding_capacities:0 "Schiffbaukapazitäten ausbauen"
  HRE_expand_shipbuilding_capacities_desc:0 "Bekenntnis zur maritimen Tradition und das Ziel, eine führende Nation zur See zu werden."
  HRE_dominate_the_blue_water:0 "Die Weltmeere beherrschen"
  HRE_dominate_the_blue_water_desc:0 "Bereit, die blauen Wasser zu erobern und Ordnung auf den Weltmeeren zu halten." 
  HRE_protection_of_baltic_and_north_sea:0 "Schutz von Ost- und Nordsee"
  HRE_protection_of_baltic_and_north_sea_desc:0 "Überlebenswichtig für die Sicherheit und den Wohlstand Deutschlands."
  HRE_produce_submarines:0 "U-Boote produzieren"
  HRE_produce_submarines_desc:0 "Steigerung der Abschreckung durch moderne und lautlose Angrifffswaffen zur See."
  HRE_doctrine_effort_navy:0 "Naval-Doktrin-Anstrengung"
  HRE_doctrine_effort_navy_desc:0 "Transformation der Marine in eine moderne Streitmacht durch neue Taktiken und Technologien."
  #politics
  HRE_learn_from_old_days:0 "Aus der Vergangenheit lernen"
  HRE_learn_from_old_days_desc:0 "Wir blicken stolz zurück und nutzen die Lehren der Geschichte als Wegweiser für die Zukunft." 
  HRE_heil_dir_im_siegerkranz:0 "Heil Dir im Siegerkranz"
  HRE_heil_dir_im_siegerkranz_desc:0 "Die Nationalhymne als Symbol der Einheit, Solidarität und des Glaubens an eine helle Zukunft."
  HRE_expand_conscription:0 "Wehrpflicht ausweiten"
  HRE_expand_conscription_desc:0 "Diese Entscheidung sichert Deutschlands rechtmäßigen Platz auf der Weltbühne."
  HRE_suppress_opposite_sides:0 "Opposition unterdrücken"
  HRE_suppress_opposite_sides_desc:0 "Nationale Einheit ist überlebenswichtig; störende Elemente müssen eliminiert werden." 
  HRE_protect_the_fatherland:0 "Das Vaterland schützen"
  HRE_protect_the_fatherland_desc:0 "Jeder Bürger muss seinen Teil zur Verteidigung der Heimat beitragen."
  HRE_support_the_church:0 "Die Kirche unterstützen"
  HRE_support_the_church_desc:0 "Die Kirche ist das spirituelle Herz Deutschlands und das moralische Fundament der Nation."
  HRE_preussiche_tugenden:0 "Preußische Tugenden"
  HRE_preussiche_tugenden_desc:0 "Fleiß, Disziplin, Integrität und Opferbereitschaft prägen unseren Nationalgeist."
  HRE_scholastic_based_education:0 "Scholastische Bildung"
  HRE_scholastic_based_education_desc:0 "Erziehung loyaler und moralischer Individuen, die dem Vaterland und seinem Führer dienen."
  HRE_god_save_the_kaiser:0 "Heil dem Kaiser"
  HRE_god_save_the_kaiser_desc:0 "Gebet für Wohlstand und Sicherheit unter der weisen Führung des Kaisers."
  HRE_neue_helle_Tage:0 "Neue helle Tage"
  HRE_neue_helle_Tage_desc:0 "Deutschland tritt in eine Phase der nationalen Wiedergeburt und des Stolzes ein." 
  HRE_support_for_democratic:0 "Unterstützung für Demokratie"
  HRE_support_for_democratic_desc:0 "Stärkung demokratischer Werte als Weg zu Stabilität und Wohlstand."
  HRE_beacon_of_liberty:0 "Leuchtfeuer der Freiheit"
  HRE_beacon_of_liberty_desc:0 "Feier der Werte von Freiheit, Gleichheit und Gerechtigkeit für alle Menschen."
  HRE_interventionism:0 "Interventionismus"
  HRE_interventionism_desc:0 "Soll Deutschland in anderen Ländern eingreifen, um seine Interessen zu wahren?" 
  HRE_nationalism_focus:0 "Fokus auf Nationalismus"
  HRE_nationalism_focus_desc:0 "Ein starkes Gefühl der Einheit, das Deutschland seinen rechtmäßigen Platz sichert."
  HRE_military_youthmore:0 "Militärische Jugendarbeit"
  HRE_military_youthmore_desc:0 "Die Jugend als starkes, gesundes und patriotisches Fundament der Zukunft des Reichs."
  HRE_paramilitarism2:0 "Paramilitarismus"
  HRE_paramilitarism2_desc:0 "Disziplin und Patriotismus durch paramilitärische Ausbildungsprogramme."
  HRE_internationalism_focusmore:0 "Fokus auf Internationalismus"
  HRE_internationalism_focusmore_desc:0 "Kommunisten lehnen den Nationalstaat ab und bedrohen unsere Identität."
  HRE_political_correctness_more:0 "Politische Korrektheit"
  HRE_political_correctness_more_desc:0 "Politische Korrektheit als Form der Zensur durch Einschränkung von Worten und Gedanken."
  HRE_political_commissars_more:0 "Politische Kommissare"
  HRE_political_commissars_more_desc:0 "Gefährliche kommunistische Agenten, die die Armee infiltrieren."
  HRE_Blood_and_Iron:0 "Blut und Eisen"
  HRE_Blood_and_Iron_desc:0 "Blut steht für den Mut unserer Vorfahren, Eisen für die Stärke und Ausdauer unserer Nation. Zusammen zeigen sie, dass Deutschland eine unbesiegbare Macht ist." 
