 GER_mefo_bills_category_desc:0 "Um unsere wachsende Militärindustrie zu finanzieren und dies vor britischen und französischen Augen geheim zu halten, waren wir gezwungen, eine Bilanzgesellschaft zu nutzen, um Zahlungen in Form von Schuldscheinen abzuwickeln. Wenn wir unsere politischen Verbindungen nicht nutzen, um die Fälligkeit dieser Wechsel zu verlängern, werden wir gezwungen sein, sie zurückzuzahlen und ihre Vorteile nicht länger zu erhalten."
 GER_mefo_bills_mission:0 "MEFO-Wechsel fällig"
 GER_can_delay_mefo_payment:0 "Zahlung der MEFO-Wechsel kann verzögert werden."
 GER_mefo_bills_mission_desc:0 "Unsere ausgegebenen Wechsel werden bald fällig. Wir müssen entscheiden, ob wir sie verlängern oder mit den Zahlungen beginnen."
 GER_extend_mefo_bills:0 "MEFO-Wechsel"
 GER_extend_mefo_bills_desc:0 "Die Fälligkeit der MEFO-Wechsel um weitere 3 Monate verlängern, wodurch wir ihre Vorteile für die Dauer weiterhin genießen können. Dies erhöht jedoch auch die Kosten unserer eventuellen Zahlungen."
 GER_extend_mefo_bills_tt:1 "Entscheiden Sie, ob Sie die '§YMEFO-Wechsel§!' verlängern oder Zahlungen beginnen.\n"
 GER_mefo_bills_mission_tt:1 "Eine sechsmonatige Verlängerung der '§YMEFO-Wechsel§!' ausstellen, die zum Fälligkeitsdatum der aktuellen Charge in Kraft tritt.\n\nDie Kosten jeder Verlängerung erhöhen sich schrittweise, bis der Krieg ausbricht. Zu diesem Zeitpunkt wird die Abhängigkeit von MEFO-Wechseln aufgehoben und die Zahlung bis nach Kriegsende verschoben.\n\n"
 GER_mefo_bills_effect_in_days:1 "Das Folgende wird in [?Root.days_mission_timeout@GER_mefo_bills_mission|H0] Tagen geschehen:\n"
 GER_mefo_bills_extension_timer:0 "Vor dem Fälligkeitsdatum der MEFO-Wechsel."
 GER_mefo_bills_extension:0 "Weniger als 60 Tage seit der Verlängerung der MEFO-Wechsel."
 GER_mefo_bills_extended:0 "Verlängerte MEFO-Wechsel"
 GER_renew_mefos:0 "MEFO-Wechsel erneuern"
 GER_renew_mefos_desc:0 "Die Reichsbank ist für den Wiederaufbau und die Wiederaufrüstung unserer Nation von entscheidender Bedeutung. Es ist klar, dass wir einen Fehler bei unserer Entscheidung gemacht haben, unsere Schulden zu begleichen, und wir sollten die MEFO-Wechsel um weitere Monate verlängern."
 GER_cancel_mefos:0 "MEFO-Wechsel stornieren"
 GER_cancel_mefos_desc:0 "Wir haben uns zu lange auf die Reichsbank für den Wiederaufbau unserer Rüstungsindustrie verlassen. Es ist an der Zeit, unsere Schuldscheinvereinbarung mit unseren Waffenherstellern einzuhalten und diese \"MEFO-Wechsel\"-Farce zu beenden."
 GER_case_anton_category:0 "Fall Anton"
 GER_case_anton_category_desc:0 "Die Absicht hinter der Schaffung von Vichy-Frankreich war immer, die französischen Kolonien und die französische Flotte aus den Händen der Alliierten fernzuhalten. Es ist jedoch eine Vereinbarung, die wir jederzeit aufheben können. Wir haben einen Plan zur zwangsweisen Integration des Gebiets sowie für einen Blitzvorstoß zum Stützpunkt der französischen Flotte in Toulon ausgearbeitet."
 GER_case_anton:1 "Führe Fall Anton aus"
 GER_case_anton_tt2:2 "Kontrolliert nicht die Mehrheit der französischen Staaten in Nordafrika."
 GER_case_anton_desc:0 "Unser Marionettenstaat in Frankreich hat seinen Nutzen überlebt. Wir werden sofort mit der Integration in das [Root.GetName] beginnen, und wenn wir schnell genug vorgehen, können wir möglicherweise sogar die Überreste der französischen Flotte beschlagnahmen."
 GER_case_anton_tt:0 "Annektiert Vichy-Frankreich in 7 Tagen und beschlagnahmt die französische Flotte.\n\n§RFrankreich wird seine Flotte versenken können, es sei denn, deutsche Truppen sind innerhalb von 2 Tagen in Toulon!§!\n"
 GER_case_red:0 "Fall Rot"
 GER_operation_marita:0 "Unternehmen Marita"
 GER_sharpen_air_safety_regulations:0 "Luftsicherheitsbestimmungen verschärfen"
 GER_sharpen_air_safety_regulations_desc:0 "Mit strengeren Sicherheitsbestimmungen können wir einige der häufigsten Ursachen für katastrophale Unfälle verhindern, auch solche mit Luftschiffen."
