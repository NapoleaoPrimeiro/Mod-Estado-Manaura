 GER_power_balance_himmler:0 "Reichsführer-SS im Kabinett"
 ss_coup_event.1.t:0 "Attentat auf [GER.GetLeader]"
 ss_coup_event.1.d:0 "Berichte aus dem Führerhauptquartier sind eingetroffen, wonach während eines privaten Treffens zwischen [GER.GetLeader] und Heinrich Himmler eine Art Tumult ausgebrochen sei. Details sind spärlich, aber der militärische Geheimdienst, die Abwehr, behauptet, einen geheimen Kurier abgefangen zu haben, der Befehle an eine Reihe von SS-Einheiten in ganz Deutschland enthielt, um sich auf etwas namens 'Fall Schwarz' vorzubereiten, angeblich eine Operation zur Übernahme der Kontrolle über wichtige Kommunikations- und Infrastrukturpunkte im Falle eines versuchten Militärputsches."
 ss_coup_event.1.a:0 "Deutschlands Schicksal hat sich geändert."
 ss_coup_event.2.t:0 "Der Himmler-Putsch"
 ss_coup_event.2.d:0 "Als sich der Rauch im Führerhauptquartier verzog, ging Heinrich Himmler als einziger Überlebender aus dem chaotischen Feuergefecht hervor. Seiner Aussage zufolge hatte der Führer, offensichtlich vom Wahnsinn gepackt, ihn zu einem völligen Versager als Mann und Soldat, einem Verräter und Spion erklärt, der im Morgengrauen erschossen werden sollte. Als Himmler erkannte, dass er sich zwischen seiner persönlichen Ehre und dem Überleben der Nation entscheiden musste, beschloss er, sofort zu handeln und erschoss ihn. Im Nachhinein versuchten Mitglieder der Führer-Leibwache, Himmler als Attentäter zu töten. Nur das rechtzeitige Eintreffen von Himmlers eigenen Leibwächtern rettete den Reichsführer SS.\n\nIn einer überraschenden Entscheidung beschloss die Wehrmacht jedoch, Himmler in dieser gefährlichen Zeit zu unterstützen, um die Zukunft des Landes zu sichern und einen Bürgerkrieg zu verhindern. Nun gehört Hitlers Mantel Himmler."
 ss_coup_event.2.a:0 "Heil Himmler!"
 wehrmacht_coup_event.1.t:0 "Attentat auf [GER.GetLeader]"
 wehrmacht_coup_event.1.d:0 "Unbestätigte Berichte aus dem Führerhauptquartier deuten darauf hin, dass während einer Lagebesprechung, an der [GER.GetLeader] teilnahm, jemand einen Sprengsatz zur Explosion gebracht hat. Informationen sind immer noch spärlich, und es herrscht erhebliche Verwirrung sowohl in der Wehrmacht als auch in der SS, wobei Offiziere beider Seiten sich gegenseitig beschuldigen, einen Putschversuch unternommen zu haben.\n\nHermann Göring, der im Falle von Hitlers Tod als Nachfolger bestimmt worden war, beschloss, die Führung des Reiches zu übernehmen."
 wehrmacht_coup_event.1.a:0 "Wir können nur hoffen."
 wehrmacht_coup_event.2.t:0 "Unternehmen Walküre"
 wehrmacht_coup_event.2.d:0 "Teile der Wehrmacht haben die Operation Walküre, den Notfallplan für größere zivile Unruhen in Deutschland, ausgeführt. Armeeeinheiten haben eine Reihe von Regierungsministerien umstellt und versucht, hochrangige Funktionäre der Partei zu verhaften. Kleinere Scharmützel und Feuergefechte zwischen SS-Wachdetails und Armeeabteilungen wurden in ganz Berlin gemeldet. Es scheint, dass die Wehrmacht gefordert hat, dass alle SS-Einheiten sofort die Waffen niederlegen und übergeben, was die SS-Führung rundweg abgelehnt hat.\n\nBeide Fraktionen kämpfen derzeit um die Kontrolle über Berlin. Teile der Wehrmacht haben [GER.GetLeader] die Treue erklärt und die Waffen gegen die Rebellen erhoben. \n\nDas Inferno dieses Krieges wird sich nur noch ausbreiten."
 wehrmacht_coup_event.2.a:0 "Verräter! Versager!"
