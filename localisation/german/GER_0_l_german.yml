germany_habsburg.1.t:0 "Der Habsburg-Vorschlag"
germany_habsburg.1.d:0 "Monarchisten in den Südstaaten haben sich an Otto von Habsburg gewandt. Sollen wir ihn offiziell einladen, Kaiser von Deutschland zu werden?"
germany_habsburg.1.a:0 "Einladung senden"
germany_habsburg.1.b:0 "IDee fallen lassen"
germany_habsburg.2.t:0 "Otto von Habsburg zum deutschen Kaiser gekrönt"
germany_habsburg.2.d:0 "In einer historischen Zeremonie in Berlin wurde Otto von Habsburg zum Kaiser des Deutschen Reiches gekrönt."
germany_habsburg.2.a:0 "Ein neuer Kaiser für ein neues Zeitalter!"
germany_habsburg.2.b:0 "Die Habsburger steigen erneut auf?"
germany_habsburg.2.c:0 "Könnte dies Österreichs Erlösung sein?"
germany_habsburg.3.t:0 "Eine Forderung des deutschen Kaisers"
germany_habsburg.3.d:0 "Kaiser Otto hat in Budapest die ungarische Krone gefordert."
germany_habsburg.3.a:0 "Wir gewähren Otto die Krone"
germany_habsburg.3.b:0 "Wir weisen die Forderung zurück"
germany_habsburg.4.t:0 "[From.GetNameDef] akzeptiert die Forderung des Kaisers"
germany_habsburg.4.d:0 "Budapest hat zugestimmt. Der Kaiser herrscht nun vom Rhein bis zur Donau."
germany_habsburg.4.a:0 "Lang lebe der Kaiser!"
germany_habsburg.5.t:0 "[From.GetNameDef] lehnt die Forderung des Kaisers ab"
germany_habsburg.5.d:0 "Budapest hat abgelehnt. Diplomatie muss nun gegen das Schwert gewogen werden."
germany_habsburg.5.a:0 "Militärische Maßnahmen vorbereiten"
germany_habsburg.6.t:0 "Eine königliche Union"
germany_habsburg.6.d:0 "Vorschlag an Wien für ein Schutzbündnis unter der Krone."
germany_habsburg.6.a:0 "Wir akzeptieren dieses edle Angebot"
germany_habsburg.6.b:0 "Wir müssen unabhängig bleiben"
germany_habsburg.7.t:0 "Ein Ruf nach Vereinigung"
germany_habsburg.7.d:0 "Kaiser Otto hat die Vereinigung aller deutschen Völker erklärt."
germany_habsburg.7.a:0 "Unser Schicksal annehmen"
germany_habsburg.7.b:0 "Wir werden nicht weichen"
germany_habsburg.8.t:0 "Das kaiserliche Protektorat"
germany_habsburg.8.alt.t:0 "Die Vereinigung ist vollzogen!"
germany_habsburg.8.d:0 "Wien wird ein kaiserliches Protektorat."
germany_habsburg.8.alt.d:0 "Anschluss Österreichs vollzogen. Ein großes deutsches Reich ist Realität."
germany_habsburg.8.a:0 "Die kaiserliche Autorität ist gesichert"
germany_habsburg.8.b:0 "Ein neues Deutsches Reich steigt auf!"
germany_habsburg.9.t:0 "[FROM.GetNameDefCap] lehnt unser Angebot ab"
germany_habsburg.9.d:0 "Wien hat das Schutzangebot abgelehnt."
germany_habsburg.9.alt.d:0 "Die Politiker in Wien haben die Einigung abgelehnt. Wir müssen sie mit Gewalt dazu bringen."
germany_habsburg.9.a:0 "Sie werden eine Lektion erhalten"
germany_habsburg.10.t:0 "Ein Schutzvorschlag"
germany_habsburg.10.d:0 "Kaiser Otto schlägt vor, einen Habsburger Prinzen als König von Böhmen einzusetzen."
germany_habsburg.10.a:0 "Lang lebe der König von Böhmen!"
germany_habsburg.10.b:0 "Unsere Unabhängigkeit ist nicht käuflich!"
germany_habsburg.11.t:0 "Das kaiserliche Ultimatum"
germany_habsburg.11.d:0 "Forderung nach Einsetzung eines Habsburgers und Abtretung des Sudetenlandes."
germany_habsburg.11.a:0 "Wir werden uns unterwerfen"
germany_habsburg.11.b:0 "Niemals! Wir werden um jeden Zentimeter kämpfen"
germany_habsburg.12.t:0 "[FROM.GetNameDefCap] nimmt unser Angebot an"
germany_habsburg.12.d:0 "Prag hat zugestimmt. Böhmen ist nun ein loyales Protektorat."
germany_habsburg.12.alt.d:0 "Sudetenland abgetreten, Habsburg-König auf dem Thron. Böhmen ist nun Teil unseres Kaiserreichs."
germany_habsburg.12.a:0 "Das Reich expandiert"
germany_habsburg.12.b:0 "Eine höchst erfolgreiche Verhandlung"
germany_habsburg.13.t:0 "[FROM.GetNameDefCap] lehnt unser Angebot ab"
germany_habsburg.13.d:0 "Die Führer in [FROM.Capital.GetCapitalVictoryPointName] haben abgelehnt."
germany_habsburg.13.alt.d:0 "Trotz lehnt die Herrschaft ab. Sie werden gezwungen werden müssen."
germany_habsburg.13.a:0 "Sie werden zum Nachgeben gezwungen"
germany_habsburg.14.t:0 "Das Galizien-Edikt"
germany_habsburg.14.d:0 "Anspruch auf Galizien und Lodomerien als historisches Recht."
germany_habsburg.14.a:0 "Abgabe der Gebiete aushandeln"
germany_habsburg.14.b:0 "Wir werden unser Land niemals aufgeben!"
germany_habsburg.15.t:0 "[FROM.GetNameDefCap] nimmt unser Angebot an"
germany_habsburg.15.d:0 "Galizien wurde friedlich ans Reich übertragen."
germany_habsburg.15.a:0 "Ein friedlicher Erfolg"
germany_habsburg.16.t:0 "[FROM.GetNameDefCap] lehnt unser Angebot ab"
germany_habsburg.16.d:0 "Diplomatie ist beendet. Gewalt wird folgen."
germany_habsburg.16.a:0 "Der Wille des Kaisers geschehe"
germany_habsburg.17.t:0 "[FROM.GetLeader] fordert unsere Unterwerfung"
germany_habsburg.17.alt.t:0 "[FROM.GetNameDefCap] fordert die Rückgabe kaiserlicher Lande"
germany_habsburg.17.d:0 "Forderung zur Rückkehr unter die Habsburger-Herrschaft."
germany_habsburg.17.alt.d:0 "Forderung zur Abtretung von Land an das Kaiserreich."
germany_habsburg.17.a:0 "Wir akzeptieren die Forderung des Kaisers"
germany_habsburg.17.b:0 "Niemals! Dieses Land gehört uns!"
germany_habsburg.18.t:0 "[FROM.GetNameDefCap] nimmt unser Angebot an"
germany_habsburg.18.d:0 "Reintegration der Ländereien ins Reich."
germany_habsburg.18.a:0 "Das Reich erhebt sich erneut"
germany_habsburg.19.t:0 "[FROM.GetNameDefCap] lehnt unser Angebot ab"
germany_habsburg.19.d:0 "Widerstand gegen das Ultimatum."
germany_habsburg.19.a:0 "Dann sollen sie den Preis des Widerstands lernen"
germany_habsburg.20.t:0 "Das Habsburger-Ultimatum an die Niederlande"
germany_habsburg.20.d:0 "Kaiser Otto fordert die Unterwerfung der Benelux-Staaten zum Schutz der Region."
germany_habsburg.20.a:0 "Kaiserlichen Schutz annehmen"
germany_habsburg.20.b:0 "Wir werden uns weder Wien noch Berlin beugen!"
germany_habsburg.21.t:0 "[FROM.GetNameDefCap] nimmt kaiserlichen Schutz an"
germany_habsburg.21.d:0 "Belgien tritt der kaiserlichen Sphäre bei."
germany_habsburg.21.a:0 "Ein weiteres Reich schließt sich an"
germany_habsburg.22.t:0 "[FROM.GetNameDefCap] lehnt unser Angebot ab"
germany_habsburg.22.d:0 "Belgien verweigert den Schutz. Spannungen steigen."
germany_habsburg.22.a:0 "Sie haben Widerstand statt Schicksal gewählt"
germany.10013.t:0 "[From.GetName] lehnte unser Angebot ab"
germany.10013.desc:0 "Trotz militärischer Drohungen haben sie mit Nein geantwortet."
germany.10013.a:0 "Wir werden uns daran erinnern"
germany.9923.t:0 "Deutschland will in den [GetSovietCivilWarName] intervenieren"
germany.9923.d:0 "Angebot militärischer Hilfe im Tausch gegen die Einführung der Demokratie."
germany.9923.a:0 "Akzeptabel"
germany.9923.b:0 "Absolut nicht"
germany.9922.t:0 "Die Russen haben unser Angebot angenommen"
germany.9922.t_2:0 "Die Russen haben unser Angebot abgelehnt"
germany.9922.d:0 "Mobilisierung zur Unterstützung der neuen russischen Demokratie."
germany.9922.d_2:0 "Abgelehnt. Ein Sieg ohne Demokratie wird schlecht für sie enden."
germany.9922.a:0 "Gut"
germany.9922.a_2:0 "Die Zeit wird es zeigen"
