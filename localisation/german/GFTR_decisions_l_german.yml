l_german:
# # # # # # # # # # # # # # #
GFTR_categories_settings: "Einstellungen"
GFTR_categories_settings_desc: "Hallo! Ich freue mich sehr, dass ihr den Mod §YGeneric Focus Tree: Redux§! abonniert habt! Wenn euch meine Arbeit gefällt, unterstützt den Mod bitte auf seiner Steam-Workshop-Seite :) \nDort seht ihr auch alle neuesten Änderungen und könnt mir Fehler oder Probleme melden."
# # # # # # # # # # # # # # #
GFTR_D_set_focus_tree_SHOW: "1. Fokusbaum setzen?"
GFTR_D_set_focus_tree_SHOW_tt: "Hier könnt ihr verschiedene Fokusbäume für euer Land und andere Nationen installieren oder entfernen."
GFTR_D_set_focus_tree_HIDE: "1. §RAbschnitt schließen§!"
GFTR_D_set_gftr_a: "          1. Installieren (GFT: Redux)"
GFTR_D_set_gftr_a_tt: "Das aktuelle Land erhält oder aktualisiert §YGeneric Focus Tree: Redux§!. \n~~~ \nAchtung: Ersetzt ihr den Fokusbaum von Ländern mit einzigartigen Vanilla- oder DLC-Bäumen (z. B. Deutschland, Frankreich, Iran usw.), könnt ihr die Originalbäume nur durch §LNeustart einer neuen Partie§! oder §Lüber die Konsole§! wiederherstellen."
GFTR_D_set_gftr_b: "          1. Installieren (GFT: Redux) für KI"
GFTR_D_set_gftr_b_tt: "§YGeneric Focus Tree: Redux§! wird bei ABSOLUT ALLEN KI-gesteuerten Ländern installiert oder aktualisiert. \n~~~ \n§LVorsicht§!: Alle KI-Länder erhalten den neuen Baum. §GEmpfohlen§! nur ganz am Spielanfang zu verwenden und vorher nationale Ideen und Sonder-Mechaniken zu entfernen (siehe Entscheidungen unten)."
GFTR_D_set_generic_focus: "          1. Vanilla-Baum installieren"
GFTR_D_set_generic_focus_tt: "Das aktuelle Land erhält oder aktualisiert den §Gvanilla§! generischen Fokusbaum.\n~~~ \nDie Funktion lädt den aktuell im Spiel vorhandenen Vanilla-Baum – der durch andere große Mods verändert sein kann. In solchen Fällen wird der modifizierte Baum installiert."
GFTR_D_deleted_focus_tree: "          1. Fokusbaum entfernen"
GFTR_D_deleted_focus_tree_tt: "Der Fokusbaum des aktuellen Landes wird §Rentfernt§!. Genauer: Er wird durch einen komplett leeren Baum ersetzt (ohne Fokusse außer den „dauerhaften“). \n~~~ \nIch weiß ehrlich nicht, wozu ihr das braucht §YXD§!. Vielleicht wollt ihr ein Land „deaktivieren“ – das kann die Performance leicht verbessern."
GFTR_D_test_focus_tree: "          1. Mod testen"
GFTR_D_test_focus_tree_tt: "Eine exakte Kopie von §YGeneric Focus Tree: Redux§! wird installiert, aber jeder Fokus dauert nur 1 Tag. \n~~~ \nPrimär zum schnellen Testen des KI-Verhaltens gedacht. Ihr könnt sie auch nutzen, um mir KI-Probleme zu melden. \n~~~ \nKann auch in normalen Partien Spaß machen."
# # # # # # # # # # # # # # #
GFTR_D_remove_national_spirits_SHOW: "2. Nationale Ideen entfernen?"
GFTR_D_remove_national_spirits_SHOW_tt: "Hier könnt ihr verschiedene nationale Ideen bei euch und anderen Ländern entfernen."
GFTR_D_remove_national_spirits_HIDE: "2. §RAbschnitt schließen§!"
GFTR_D_remove_gftr_national_spirits_a: "          2. Ideen entfernen (GFT: Redux)"
GFTR_D_remove_gftr_national_spirits_a_tt: "Alle vom Mod §YGeneric Focus Tree: Redux§! hinzugefügten nationalen Ideen werden beim aktuellen Land entfernt. \n~~~ \nTechnische Ideen bleiben erhalten."
GFTR_D_remove_gftr_national_spirits_b: "          2. Ideen entfernen (GFT: Redux) bei KI"
GFTR_D_remove_gftr_national_spirits_b_tt: "Alle vom Mod §YGeneric Focus Tree: Redux§! hinzugefügten nationalen Ideen werden bei ALLEN KI-Ländern entfernt. \n~~~ \nTechnische Ideen bleiben erhalten. \n~~~ \n§RVorsicht§! – kann kurze Freezes verursachen."
GFTR_D_remove_vanilla_national_spirits_a: "          2. Vanilla-Ideen entfernen"
GFTR_D_remove_vanilla_national_spirits_a_tt: "Alle Start-§Gvanilla§! nationalen Ideen werden beim aktuellen Land entfernt! \n~~~ \nEs gibt keine einfache „alles entfernen“-Funktion, daher werden nur die 1936 vorhandenen Ideen gelöscht. Später angewendet hat es meist keinen Effekt. §GEmpfohlen§! nur ganz am Spielanfang."
GFTR_D_remove_vanilla_national_spirits_b: "          2. Vanilla-Ideen bei KI entfernen"
GFTR_D_remove_vanilla_national_spirits_b_tt: "Alle Start-§Gvanilla§! nationalen Ideen werden bei ALLEN KI-Ländern entfernt. \n~~~ \nGleiche Einschränkungen wie oben. §GEmpfohlen§! nur am Spielanfang. \n~~~ \n§RVorsicht§! – kann kurze Freezes verursachen."
# # # # # # # # # # # # # # #
GFTR_D_remove_unique_mechanics_SHOW: "3. Einzigartige Mechaniken entfernen?"
GFTR_D_remove_unique_mechanics_SHOW_tt: "Hier könnt ihr spezielle Mechaniken, Entscheidungen und Modifikatoren entfernen, die beim Ersetzen nativer Fokusbäume stören würden."
GFTR_D_remove_unique_mechanics_HIDE: "3. §RAbschnitt schließen§!"
GFTR_D_remove_state_modifier_a: "          3. Staatsmodifikatoren entfernen"
GFTR_D_remove_state_modifier_a_tt: "Bestimmte Provinzmodifikatoren werden beim aktuellen Land entfernt. \n~~~ \n§YProvinzmodifikatoren§! sind spezielle Modifikatoren einzelner Provinzen (z. B. „Dezentralisierung“ in Äthiopien oder „Kurdischer Separatismus“ in der Türkei). \n~~~ \n§GBeim Ersetzen§! des §Geigenen§! Fokusbaums werden sie zum Problem, weil man sie sonst nicht loswird. Dafür gibt es diese Entscheidung. \n~~~ \nBetroffene Länder stehen oben unter „Voraussetzungen“. §L(Gilt auch für KI-Version)§! \n~~~ \n§GEmpfohlen§! am Spielstart."
GFTR_D_remove_state_modifier_b: "          3. Staatsmodifikatoren bei KI entfernen"
GFTR_D_remove_state_modifier_b_tt: "Provinzmodifikatoren werden aus allen von KI-Ländern kontrollierten Regionen entfernt. \n~~~ \nDetails siehe Entscheidung oben. Besitz spielt keine Rolle. \n~~~ \n§GEmpfohlen§! nur, wenn ihr bei allen KI-Ländern den nativen Baum ersetzen wollt."
GFTR_D_remove_special_mechanics_a: "          3. Spezialmechaniken entfernen"
GFTR_D_remove_special_mechanics_a_tt: "Spezielle Mechaniken werden beim aktuellen Land entfernt. \n~~~ \n§YSpezialmechaniken§! sind einzigartige Systeme (z. B. Machtgleichgewicht, sowjetische Paranoia, polnischer Bauernaufstand). \n~~~ \n§GBeim Ersetzen§! des nativen Baums lassen sie sich sonst nicht entfernen. \n~~~ \nBetroffene Länder oben unter „Voraussetzungen“."
GFTR_D_remove_special_mechanics_b: "          3. Spezialmechaniken bei KI entfernen"
GFTR_D_remove_special_mechanics_b_tt: "Spezialmechaniken werden bei bestimmten KI-Ländern entfernt. \n~~~ \nDetails siehe oben. \n~~~ \n§GEmpfohlen§! nur bei vollständigem Baumtausch aller KI-Länder."
# # # # # # # # # # # # # # #
GFTR_D_ai_management_SHOW: "4. KI-Verhalten anpassen?"
GFTR_D_ai_management_SHOW_tt: "Hier steuert ihr das Verhalten von KI-Nationen."
GFTR_D_ai_management_HIDE: "4. §RAbschnitt schließen§!"
GFTR_D_ai_political_freedom: "          4. \"Politische Freiheit\""
GFTR_D_ai_political_freedom_tt: "Alle KI-Nationen erhalten die nationale Idee §Y$GFTR_idea_ai_political_freedom$§!. \n~~~ \nStandardmäßig bevorzugt die KI im Mod leicht den ihrer Ideologie entsprechenden Politikweg und wechselt im historischen Modus nie die Ideologie. \n§YPolitische Freiheit§! hebt diese Einschränkungen auf – die KI wird auch im historischen Modus freier und zufälliger. \n~~~ \nIn Vanilla weniger nützlich, aber ideal für Mods mit vielen neuen Ländern (z. B. §L\"Every State Independent\"§!). \n~~~ \nNutzen, wenn die KI alle Politikwege gleich wahrscheinlich wählen oder den historischen Modus ignorieren soll."
GFTR_D_ai_limit: "          4. KI einschränken"
GFTR_D_ai_limit_tt: "Das aktuelle Land erhält die nationale Idee §Y$GFTR_idea_ai_limit$§!. \n~~~ \nNützlich, um die KI eines Landes praktisch „abzuschalten“ und Performance zu verbessern (benötigt Konsole + \"observe\"). \n~~~ \n§GHinweis§!: Oben gibt es auch die Entscheidung, den gesamten Fokusbaum zu löschen, um die KI noch stärker einzuschränken."
GFTR_D_ai_madness_mode: "          4. Modus \"Wahnsinn\""
GFTR_D_ai_madness_mode_tt: "Alle KI-Nationen erhalten die nationale Idee §Y$GFTR_idea_ai_madness_mode$§!. \n~~~ \n§YModus \"Wahnsinn\"§! zwingt die KI, nur kriegerische Wege zu wählen. Taucht ein in totales Chaos! §RBeachtet§!: betrifft nur Länder mit §YGeneric Focus Tree: Redux§!."
GFTR_D_remove_management_ideas: "          4. Technische Ideen entfernen"
GFTR_D_remove_management_ideas_tt: "Alle technischen nationalen Ideen dieses Mods werden aus ALLEN Ländern entfernt."
