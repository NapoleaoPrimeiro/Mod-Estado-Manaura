l_german:
GFTR_E_independence.1.t: "Krieg um die Unabhängigkeit!"
GFTR_E_independence.1.d: "Unsere Geduld ist am Ende. Das ist unser Land, und wir werden darüber verfügen, wie wir es für richtig halten. Heute beginnen wir den Kampf gegen die Invasoren und Besatzer, die auf unser Land kamen, uns ihre Politik und Kultur aufzwangen, unser Volk versklavten und ihre Fahne in unser Land pflanzten."
GFTR_E_independence.1.a: "Möge ihr Blut fließen!"
# # # # # # # # # # # # # # #
GFTR_E_independence.2.t: "Brief mit Bitte"
GFTR_E_independence.2.d: "Heute ist ein offizieller Brief von unserem Marionettenstaat bei uns eingetroffen. Sie fordern eine Überprüfung unseres Einflusses, wünschen sich eine eigene Stimme in Außen- und Innenpolitik und verkünden quasi ihren Wunsch, ein unabhängiger Staat zu werden. Der Ton ist noch zurückhaltend und diplomatisch, doch mit einem Fingerschnippen könnte alles in Krieg ausarten."
GFTR_E_independence.2.a: "Keine Zugeständnisse!"
GFTR_E_independence.2.b: "Wir sind bereit, ihnen die Unabhängigkeit zu gewähren."
GFTR_E_independence.2.c: "Verräter! Raus aus unserem Bündnis!"
GFTR_E_independence.2.d: "Das Militär wird für Ordnung sorgen."
# # # # # # # # # # # # # # #
GFTR_E_independence_response.0.t: "Schlechte Nachrichten"
GFTR_E_independence_response.0.d: "Der heutige Morgen begann mit einem Dolchstoß in den Rücken: unser ehemaliger Marionettenstaat hat plötzlich seine Unabhängigkeit erklärt und unsere Truppen auf seinem Territorium angegriffen. Unsere Verhandlungsversuche wurden zurückgewiesen."
GFTR_E_independence_response.0.a: "Sie wollen Krieg? Sie bekommen ihn!"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.1.t: "Ablehnung"
GFTR_E_independence_response.1.d: "Vor einigen Tagen schickten wir eine Bitte um Unabhängigkeit, doch heute kam eine kategorische Ablehnung. Die Metropole will uns nicht freigeben und hat jede Diskussion über das Thema abgeblockt. Die Diplomatie ist in einer Sackgasse."
GFTR_E_independence_response.1.a: "Wir müssen kämpfen!"
GFTR_E_independence_response.1.b: "Na gut…"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.2.t: "Wir sind frei!"
GFTR_E_independence_response.2.d: "Gute Neuigkeiten! Die Metropole hat offiziell unsere Unabhängigkeit anerkannt. Von nun an gestalten wir selbst unser Schicksal. Für unser Volk ist dies ein historischer Tag, der in die Geschichtsbücher eingehen wird."
GFTR_E_independence_response.2.a: "Hurra! Hurra! HURRA!"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.3.t: "Freiheit mit bitterem Nachgeschmack"
GFTR_E_independence_response.3.d: "Heute erhielten wir eine zweideutige Antwort von der Metropole. Man warf uns Verrat vor! Wir haben unsere Unabhängigkeit errungen, doch die ehemalige Metropole hat alle diplomatischen Beziehungen zu uns abgebrochen. Wir sind frei, aber allein in dieser turbulenten Zeit. Trotz der scharfen Worte konnten wir einen bewaffneten Konflikt vermeiden."
GFTR_E_independence_response.3.a: "Hauptsache, es verlief friedlich."
# # # # # # # # # # # # # # #
GFTR_E_independence_response.4.t: "Krieg um die Unabhängigkeit"
GFTR_E_independence_response.4.d: "Unsere Hoffnungen auf eine diplomatische Lösung unserer Unterdrückung sind heute zerstört worden. Nach unserer kürzlichen Anfrage hat die Metropole Truppen an die Grenze verlegt und bereitet eine Invasion vor, um unseren Wunsch nach Souveränität zu zerschlagen. Ab diesem Moment kämpfen wir nicht mehr nur für Freiheit, sondern für das Überleben unseres Staates selbst."
GFTR_E_independence_response.4.a: "Wir werden standhalten!"
# # # # # # # # # # # # # #
GFTR_E_change_of_power.1.t: "Die Wahlen sind vorüber"
GFTR_E_change_of_power.1.d: "Im Land wurden ehrliche demokratische Wahlen abgehalten. Das Volk hat seine Wahl getroffen."
GFTR_E_change_of_power.1.a: "In Ordnung"
# # # # # # # # # # # # # #
GFTR_E_change_of_power.2.t: "Machtergreifung"
GFTR_E_change_of_power.2.d: "Der erwartete Widerstand blieb aus. Die alte Regierung erkannte ihre Niederlage an, legte ihre Ämter nieder und übergab die Kontrolle kampflos an das neue Regime."
GFTR_E_change_of_power.2.a: "Die richtige Entscheidung"
# # # # # # # # # # # # # #
GFTR_E_change_of_power.3.t: "Bürgerkrieg!"
GFTR_E_change_of_power.3.d: "Die politische Krise hat ihren Höhepunkt erreicht. Das Land ist in zwei feindliche Lager gespalten, und der Streit um die Macht ist in einen offenen bewaffneten Konflikt umgeschlagen."
GFTR_E_change_of_power.3.a: "Wir werden siegen"