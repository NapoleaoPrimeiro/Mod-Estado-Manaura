l_german:
 conquest_integration.1.t:0 "Beute der Eroberung"
 conquest_integration.1.desc:0 "Da [event_target:ci_conquered_country.GetName] nun unter unserer Kontrolle steht, sind ihr Offizierskorps, ihre Befehlshaber und politischen Persönlichkeiten ohne Aufgabe. Wir können sie in unsere Dienste nehmen – ihre Erfahrung muss nicht verschwendet werden."
 conquest_integration.1.advisors:0 "Ihre Berater eingliedern"
 conquest_integration.1.commanders:0 "Ihre Befehlshaber eingliedern"
 conquest_integration.1.scientists:0 "Ihre Wissenschaftler eingliedern"
 conquest_integration.1.industry:0 "Ihre Rüstungsindustrie eingliedern"
 conquest_integration.1.all:0 "Alle eingliedern"
 conquest_integration.1.decline:0 "Wir haben keine Verwendung für sie"
 ci_integrated_industry:0 "Eingegliederte Rüstungsindustrie"
 ci_integrated_industry_desc:0 "Die übernommenen Fabriken, Konstruktionsbüros und Facharbeiter der von uns eroberten Nationen. Jede eingegliederte Industrie stärkt unsere Kriegswirtschaft."
 conquest_integration.2.t:0 "Die Kriegstribunale"
 conquest_integration.2.desc:0 "Die Offiziere und Berater, die wir anwerben wollten, müssen sich zunächst für ihr Verhalten verantworten. Tribunale, Säuberungen und alte Rechnungen fordern ihren Tribut – nur eine Handvoll wird für unseren Dienst freigegeben. Der Rest wird sich uns nicht anschließen."
 conquest_integration.2.a:0 "So sei es"
 conquest_integration.5.t:0 "Ihre Flotte beschlagnahmen"
 conquest_integration.5.desc:0 "[event_target:ci_capitulated_navy_country.GetName] hat kapituliert, und ihre Kriegsschiffe liegen nun vor Anker, ohne einer Flagge zu dienen. Wir könnten ihre Flotte in unsere eigene Marine eingliedern. (Flugzeugträger können nicht beschlagnahmt werden.)"
 conquest_integration.5.a:0 "Ihre Flotte beschlagnahmen"
 conquest_integration.5.b:0 "Sie rosten lassen"
 conquest_integration.6.t:0 "Erbeutete Baupläne"
 conquest_integration.6.desc:0 "Die Konstruktionsbüros von [event_target:ci_defeated_licensor.GetName] sind uns in die Hände gefallen, und mit ihnen ihre Baupläne für Panzer, Flugzeuge und Kriegsschiffe. Wir können ihre Konstruktionen für die Produktion in unseren eigenen Fabriken lizenzieren."
 conquest_integration.6.a:0 "Ihre Produktionslizenzen beschlagnahmen"
 conquest_integration.6.b:0 "Unsere eigenen Konstruktionen genügen"
 RULE_GROUP_CI:0 "Eroberungsintegration"
 RULE_CI_WAR_TRIALS:0 "Überlebensrate der Kriegstribunale"
 RULE_CI_WT_25:0 "Hart (25%)"
 RULE_CI_WT_25_DESC:0 "Etwa ein Viertel der eingegliederten Berater und Generäle überlebt die Tribunale. Der Standard."
 RULE_CI_WT_10:0 "Brutal (10%)"
 RULE_CI_WT_10_DESC:0 "Nur ein Zehntel überlebt. Die meisten feindlichen Offiziere und Berater werden gesäubert."
 RULE_CI_WT_50:0 "Nachsichtig (50%)"
 RULE_CI_WT_50_DESC:0 "Die Hälfte der eingegliederten Berater und Generäle wird für den Dienst freigegeben."
 RULE_CI_WT_75:0 "Großzügig (75%)"
 RULE_CI_WT_75_DESC:0 "Die meisten feindlichen Offiziere und Berater schließen sich uns an. Kaum Aussortierung."
 RULE_CI_AI:0 "KI-Eroberungsintegration"
 RULE_CI_AI_OFF:0 "Nur Spieler"
 RULE_CI_AI_OFF_DESC:0 "Nur Sie können die Beute der Eroberung eingliedern. KI-Nationen ignorieren die Mechaniken dieses Mods. Der Standard."
 RULE_CI_AI_ON:0 "Spieler und KI"
 RULE_CI_AI_ON_DESC:0 "KI-Nationen gliedern ebenfalls eroberte Berater, Befehlshaber und Industrie ein und beschlagnahmen bei Kapitulation feindliche Flotten."
 RULE_CI_LICENSE:0 "Erbeutete Produktionslizenzen"
 RULE_CI_LIC_FREE:0 "Kostenlos"
 RULE_CI_LIC_FREE_DESC:0 "Von besiegten Nationen erbeutete Lizenzen bringen keinen Produktionsmalus – baut ihre Panzer, Flugzeuge und Schiffe, als wären es eure eigenen. Die Kriegsbeute. Der Standard."
 RULE_CI_LIC_HALF:0 "Ermäßigt (50%)"
 RULE_CI_LIC_HALF_DESC:0 "Erbeutete Lizenzen bringen den halben üblichen Produktionsmalus."
 RULE_CI_LIC_FULL:0 "Voller Preis"
 RULE_CI_LIC_FULL_DESC:0 "Erbeutete Lizenzen bringen denselben Produktionsmalus wie eine normal ausgehandelte Lizenz."
 RULE_CI_LIC_OFF:0 "Deaktiviert"
 RULE_CI_LIC_OFF_DESC:0 "Besiegte Nationen gewähren keine Produktionslizenzen."
