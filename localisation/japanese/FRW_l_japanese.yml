 # ---------- Council of Ministers: custom advisors ----------
 FRW_adv_appoint_req:0 "Appointed through the §YCouncil of Ministers§!"
 FRW_dec_dismiss_tt:0 "The minister leaves the government and frees his advisor slot. He can be appointed again later."
 FRW_council_cat:0 "The Council of Ministers"
 FRW_council_cat_desc:0 "Ministers, experts and party men offer their services. Choose a department to see who is available. Some reforms cannot be carried out without the right man in the government.\n\nMinisters appointed here can be dismissed again at the top of this list."
 FRW_dec_council_back:0 "« Back to the Council"
 FRW_dec_council_back_desc:0 "Return to the list of departments."
 FRW_dec_council_back_tt:0 "Return to the list of departments."
 FRW_dec_council_open_tt:0 "Shows the candidates of this department."
 FRW_dec_council_open_politics:0 "Department: Politics"
 FRW_dec_council_open_politics_desc:0 "Party men, ideologues and the voices of the street."
 FRW_dec_council_open_economy:0 "Department: Economy"
 FRW_dec_council_open_economy_desc:0 "Planners, engineers and statisticians to run the economy."
 FRW_dec_council_open_research:0 "Department: Research"
 FRW_dec_council_open_research_desc:0 "Scientists who can bring French research back to the front rank."
 FRW_dec_council_open_projects:0 "Department: Special Projects"
 FRW_dec_council_open_projects_desc:0 "Engineers for the great projects of the future: rockets and the atom."
 FRW_dec_council_open_army:0 "Department: Army"
 FRW_dec_council_open_army_desc:0 "Chiefs of staff and reformers who prepare the army for the next war."
 FRW_dec_council_open_navy:0 "Department: Navy"
 FRW_dec_council_open_navy_desc:0 "Admirals who build and train the fleet."
 FRW_dec_council_open_air:0 "Department: Air Force"
 FRW_dec_council_open_air_desc:0 "Air generals who shape the Armée de l'Air."
 FRW_dec_council_open_resistance:0 "Department: Intelligence Agency"
 FRW_dec_council_open_resistance_desc:0 "The Deuxième Bureau and the men who would organise resistance if France were ever occupied."
 FRW_adv_monnet:0 "Jean Monnet"
 FRW_adv_monnet_desc:0 "Jean Monnet has spent his life persuading governments to pool what they cannot manage alone, from Allied shipping in 1917 to loans for Poland and China. He believes the nations of Europe will one day have to share their coal and steel, and with them part of their sovereignty."
 FRW_trait_monnet:0 "Planner of Europe"
 FRW_trait_monnet_desc:0 "A cognac merchant turned international financier, deputy secretary-general of the League of Nations at thirty-one."
 FRW_dec_appoint_monnet:0 "Appoint Jean Monnet"
 FRW_dec_appoint_monnet_desc:0 "Jean Monnet has spent his life persuading governments to pool what they cannot manage alone, from Allied shipping in 1917 to loans for Poland and China. He believes the nations of Europe will one day have to share their coal and steel, and with them part of their sovereignty."
 FRW_dec_dismiss_monnet:0 "Dismiss Jean Monnet"
 FRW_dec_dismiss_monnet_desc:0 "Jean Monnet leaves the Council of Ministers."
 FRW_adv_monnet_effects_tt:0 "§YJean Monnet§! joins the government as §YPlanner of Europe§! (political advisor):\nMax Factory Efficiency: §G+5%§!\nTrade Opinion: §G+20%§!\nMonthly Opinion Gain: §G+10%§!\nWar Support: §R-3%§!"
 FRW_adv_monnet_req:0 "§YJean Monnet§! is a political advisor"
 FRW_adv_dautry:0 "Raoul Dautry"
 FRW_adv_dautry_desc:0 "Raoul Dautry made his name rebuilding the shattered lines of northern France and modernising the State Railways. He has little patience for committees and prefers to set a target and leave his engineers to meet it."
 FRW_trait_dautry:0 "Minister of Armament"
 FRW_trait_dautry_desc:0 "The engineer who rebuilt the northern railways after 1918 and ran the État railway like a modern company."
 FRW_dec_appoint_dautry:0 "Appoint Raoul Dautry"
 FRW_dec_appoint_dautry_desc:0 "Raoul Dautry made his name rebuilding the shattered lines of northern France and modernising the State Railways. He has little patience for committees and prefers to set a target and leave his engineers to meet it."
 FRW_dec_dismiss_dautry:0 "Dismiss Raoul Dautry"
 FRW_dec_dismiss_dautry_desc:0 "Raoul Dautry leaves the Council of Ministers."
 FRW_adv_dautry_effects_tt:0 "§YRaoul Dautry§! joins the government as §YMinister of Armament§! (political advisor):\nMilitary Factory Construction Speed: §G+10%§!\nProduction Line Change Efficiency: §G+10%§!\nConstruction Speed: §G+3%§!\nStability: §R-2%§!"
 FRW_adv_dautry_req:0 "§YRaoul Dautry§! is a political advisor"
 FRW_adv_cot:0 "Pierre Cot"
 FRW_adv_cot_desc:0 "Pierre Cot first became Air Minister in 1933, at thirty-seven, and helped make the Armée de l'Air an independent service. He wants the aircraft factories nationalised and a generation of young pilots trained in popular flying clubs."
 FRW_trait_cot:0 "Champion of Air Power"
 FRW_trait_cot_desc:0 "The young Radical who founded the Armée de l'Air as an independent service and nationalised the aircraft industry."
 FRW_dec_appoint_cot:0 "Appoint Pierre Cot"
 FRW_dec_appoint_cot_desc:0 "Pierre Cot first became Air Minister in 1933, at thirty-seven, and helped make the Armée de l'Air an independent service. He wants the aircraft factories nationalised and a generation of young pilots trained in popular flying clubs."
