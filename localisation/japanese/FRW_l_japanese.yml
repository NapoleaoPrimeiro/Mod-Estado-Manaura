 FRW_dec_franc_rates:0 "Raise the Discount Rate"
 FRW_dec_franc_rates_desc:0 "The Banque de France raises its rate. Money becomes dear and prices settle; so does work on the building sites."
 FRW_dec_franc_bonds:0 "Issue National Defence Bonds"
 FRW_dec_franc_bonds_desc:0 "Savers lend their francs to the State instead of spending them. Patriotic posters cover the walls of every post office."
 FRW_dec_franc_controls:0 "Price and Wage Controls"
 FRW_dec_franc_controls_desc:0 "Prices and wages are frozen by decree. The shops grumble, the unions grumble, but the franc holds."
 FRW_dec_franc_gold:0 "Sell Gold from the Reserves"
 FRW_dec_franc_gold_desc:0 "Some of the gold in the vaults of the Banque de France is sold abroad to buy back francs."
 FRW_dec_franc_reserves:0 "Rebuild the Gold Reserves"
 FRW_dec_franc_reserves_desc:0 "The Banque de France buys gold on the London market with newly issued francs. The vaults fill up again, but the money supply grows."
 FRW_dec_franc_exchange:0 "Exchange Controls"
 FRW_dec_franc_exchange_desc:0 "Francs may no longer leave the country without permission. Capital flight stops at the border, and so does a good deal of trade."
 FRW_dec_franc_contracts:0 "Arms Contracts Abroad"
 FRW_dec_franc_contracts_desc:0 "Gold buys what French factories cannot deliver in time: American aero-engines, machine tools and whole aircraft, paid for in cash."
 FRW_dec_franc_austerity:0 "An Austerity Budget"
 FRW_dec_franc_austerity_desc:0 "Decree-laws cut the salaries of civil servants and the pensions of veterans. The budget is balanced, to general discontent."
 FRW_dec_franc_cfa:0 "The Colonial Franc Zone"
 FRW_dec_franc_cfa_desc:0 "The colonies get their own franc, tied to the franc of Paris. Part of the pressure on the currency is shifted onto Africa."
 FRW_dec_franc_print:0 "Print Money for Rearmament"
 FRW_dec_franc_print_desc:0 "The printing presses of the Banque de France run day and night. The factories are paid at once; inflation will present the bill later."
 FRW_dec_franc_tripartite:0 "The Tripartite Monetary Agreement"
 FRW_dec_franc_tripartite_desc:0 "London and Washington agree to keep the devalued franc stable together with Paris. It is the end of the gold bloc."
 FRW_franc_cat:0 "The Franc"
 FRW_franc_cat_desc:0 "Inflation: §Y[?FRW_inflation|0]%§! (§Y[?FRW_inf_trend|2]§! points per month). Gold reserves of the Banque de France: §Y[?FRW_gold|0] t§! ([?FRW_gold_trend|+0] t per month).\n\nBelow 20% a sound franc speeds up construction. Above 20% inflation raises the cost of consumer goods, lowers stability and slows construction. At 100% consumer goods §R+12%§!, stability §R-12%§!, construction speed §R-8%§!.\nGold cover: above §Y2000 t§! it steadies the franc, below §Y1000 t§! it weakens it, below §Y400 t§! the vaults are empty.\n\n§YInflation per month§!\n- The Banque de France holds the line: §G-0.5§![FRW_inf_line_1][FRW_inf_line_2][FRW_inf_line_3][FRW_inf_line_4][FRW_inf_line_5][FRW_inf_line_6][FRW_inf_line_7][FRW_inf_line_8][FRW_inf_line_9][FRW_inf_line_10][FRW_inf_line_11][FRW_inf_line_12][FRW_inf_line_13][FRW_inf_line_14][FRW_inf_line_15][FRW_inf_line_16][FRW_inf_line_17][FRW_inf_line_18]\n\n§YGold per month§![FRW_gold_line_0][FRW_gold_line_1][FRW_gold_line_2][FRW_gold_line_3][FRW_gold_line_4][FRW_gold_line_5][FRW_gold_line_6][FRW_gold_line_7][FRW_gold_line_8][FRW_gold_line_9][FRW_gold_line_10][FRW_gold_line_11]"
 FRW_liberation_prestige_tt:0 "Every French state in Europe liberated from the enemy: Free French Prestige §G+2§!."
 FRW_exchange_controls_tt:0 "Capital flight (Popular Front, revolution, political instability) no longer drains the gold reserves."
 FRW_contracts_tt:0 "For one year: §G+3§! military factories abroad (offsite production)."
 FRW_cfa_drift_tt:0 "From now on inflation falls by another §G0.25§! points per month and the colonies send §G+5 t§! of gold per month."
 FRW_tripartite_drift_tt:0 "From now on inflation falls by another §G0.25§! points per month and §G+5 t§! of gold per month return to Paris."
 FRW_tight_money_desc:0 "Credit is dear. Fewer new projects are started, but the franc is safe."
 FRW_austerity_desc:0 "Spending cuts have calmed the markets, but civil servants, veterans and builders all feel them."
 FRW_price_riots_desc:0 "Crowds storm the markets and the bakeries. The franc is worth less every week."
 FRW_new_franc_desc:0 "A currency reform has wiped out savings overnight. The franc is sound again, but trust in the State is not."
 FRW_fighting_france_desc:0 "The whole Allied world now recognises Fighting France as the true France."
 FRW_exchange_controls_idea_desc:0 "Every franc that leaves the country needs a permit. The gold stays at home, but importers and bankers complain."
 FRW_foreign_contracts_desc:0 "Factories in America work on French orders, paid in gold."
 FRW_gold_loan_desc:0 "London has lent us gold. The interest must be paid every month."
 FRW_printing_press_desc:0 "New money pours into the factories. Inflation will follow."
 FRW_franc:0 "The Franc"
 FRW_franc_desc:0 "Inflation: §Y[?FRW_inflation|0]%§!. Manage it in the decision menu §YThe Franc§!."
 FRW_ff_prestige_mod:0 "Prestige of Free France"
 FRW_ff_prestige_mod_desc:0 "Free French Prestige: §Y[?FRW_ff_prestige|0]§! of 100. The higher it is, the more governors are willing to rally."
 FRW_dec_rally_eq:0 "Envoy to French Equatorial Africa"
 FRW_dec_rally_eq_desc:0 "A Free French envoy tries to win over the governor and the garrison.\n\nChance of success: §Y[?FRW_ffc_eq|0]%§!"
 FRW_dec_exped_eq:0 "Expedition to French Equatorial Africa"
 FRW_dec_exped_eq_desc:0 "Free French troops land with Allied support and try to take the region. Sometimes their appearance off the coast is enough.\n\nChance of success: §Y[?FRW_ffe_eq|0]%§!"
 FRW_dec_rally_aof:0 "Envoy to French West Africa"
 FRW_dec_rally_aof_desc:0 "A Free French envoy tries to win over the governor and the garrison.\n\nChance of success: §Y[?FRW_ffc_aof|0]%§!"
 FRW_dec_exped_aof:0 "Expedition to French West Africa"
 FRW_dec_exped_aof_desc:0 "Free French troops land with Allied support and try to take the region. Sometimes their appearance off the coast is enough.\n\nChance of success: §Y[?FRW_ffe_aof|0]%§!"
 FRW_dec_rally_afn:0 "Envoy to French North Africa"
 FRW_dec_rally_afn_desc:0 "A Free French envoy tries to win over the governor and the garrison.\n\nChance of success: §Y[?FRW_ffc_afn|0]%§!"
 FRW_dec_exped_afn:0 "Expedition to French North Africa"
 FRW_dec_exped_afn_desc:0 "Free French troops land with Allied support and try to take the region. Sometimes their appearance off the coast is enough.\n\nChance of success: §Y[?FRW_ffe_afn|0]%§!"
 FRW_dec_rally_lev:0 "Envoy to The Levant"
 FRW_dec_rally_lev_desc:0 "A Free French envoy tries to win over the governor and the garrison.\n\nChance of success: §Y[?FRW_ffc_lev|0]%§!"
 FRW_dec_exped_lev:0 "Expedition to The Levant"
 FRW_dec_exped_lev_desc:0 "Free French troops land with Allied support and try to take the region. Sometimes their appearance off the coast is enough.\n\nChance of success: §Y[?FRW_ffe_lev|0]%§!"
 FRW_dec_rally_mad:0 "Envoy to Madagascar and the Indian Ocean"
 FRW_dec_rally_mad_desc:0 "A Free French envoy tries to win over the governor and the garrison.\n\nChance of success: §Y[?FRW_ffc_mad|0]%§!"
 FRW_dec_exped_mad:0 "Expedition to Madagascar and the Indian Ocean"
 FRW_dec_exped_mad_desc:0 "Free French troops land with Allied support and try to take the region. Sometimes their appearance off the coast is enough.\n\nChance of success: §Y[?FRW_ffe_mad|0]%§!"
 FRW_dec_rally_dji:0 "Envoy to French Somaliland"
 FRW_dec_rally_dji_desc:0 "A Free French envoy tries to win over the governor and the garrison.\n\nChance of success: §Y[?FRW_ffc_dji|0]%§!"
 FRW_dec_exped_dji:0 "Expedition to French Somaliland"
 FRW_dec_exped_dji_desc:0 "Free French troops land with Allied support and try to take the region. Sometimes their appearance off the coast is enough.\n\nChance of success: §Y[?FRW_ffe_dji|0]%§!"
 FRW_dec_rally_ind:0 "Envoy to French Indochina"
 FRW_dec_rally_ind_desc:0 "A Free French envoy tries to win over the governor and the garrison.\n\nChance of success: §Y[?FRW_ffc_ind|0]%§!"
 FRW_dec_exped_ind:0 "Expedition to French Indochina"
 FRW_dec_exped_ind_desc:0 "Free French troops land with Allied support and try to take the region. Sometimes their appearance off the coast is enough.\n\nChance of success: §Y[?FRW_ffe_ind|0]%§!"
 FRW_ffp_tt_p2:0 "Free French Prestige: §G+2§!"
 FRW_ffp_tt_p3:0 "Free French Prestige: §G+3§!"
 FRW_ralliement_cat:0 "Free France"
 FRW_exped_eq_tt:0 "Has at least §Y1,500§! infantry equipment in stock"
 FRW_dec_exped_tt:0 "Uses §Y15,000§! manpower and §Y1,500§! infantry equipment. After §Y45 days§! the expedition reports back: on success the region joins Free France (§G+5§! prestige, army experience), on failure §R-8§! prestige."
 FRW_dec_ff_agents:0 "Parachute Agents into France"
 FRW_dec_ff_agents_desc:0 "Radio operators and organisers of the BCRA are dropped by night over occupied France."
 FRW_dec_ff_agents_tt:0 "Every occupied French state in Europe: resistance §G+5§!."
 FRW_dec_ff_sabotage:0 "Sabotage the Railways"
 FRW_dec_ff_sabotage_desc:0 "Railway workers of the Résistance-Fer blow up points, derail trains and slow every German convoy."
 FRW_dec_ff_sabotage_tt:0 "Every occupied French state in Europe: resistance §G+10§!, infrastructure damaged."
 FRW_dec_ff_gold:0 "Spend the Gold of the Banque de France"
 FRW_dec_ff_gold_desc:0 "The gold shipped out of France before the armistice pays for weapons and workshops abroad.\n\nGold left: §Y[?FRW_gold|0] t§!"
 FRW_gold_m400_tt:0 "Gold reserves: §R-400 t§!"
 FRW_ralliement_cat_desc:0 "The colonies were handed to Vichy, but they can be won back one region at a time: by an §Yenvoy§! (cheap, depends on prestige) or by an §Yexpedition§! (costs men and rifles, +25% chance, another +10% while Britain fights on).\n\nFree French Prestige: §Y[?FRW_ff_prestige|0]§! of 100\n\nThe chance of success rises with prestige (half of it counts), with every earlier failure in the same region (§G+10%§! each, up to three) and with some focuses. A success gives §G+5§! prestige, a failure §R-5§!. Prestige grows by itself every month while France fights on, faster when a major ally is still in the war."
 FRW_dec_rally_tt:0 "After §Y21 days§! the envoy reports back: on success every state of the region held by §YVichy§! joins Free France, together with its soldiers and their rifles."
 FRW_ffp_tt_m10:0 "Free French Prestige: §R-10§!"
 FRW_ffp_tt_p5:0 "Free French Prestige: §G+5§!"
 frw_sys.20.t:0 "French Equatorial Africa Rallies to Free France"
 frw_sys.20.d:0 "Governor Félix Éboué has declared for Free France at Fort-Lamy. Within days Cameroon, the Middle Congo and Gabon follow. Brazzaville becomes the first capital of Free France."
 frw_sys.20.a:0 "Vive la France libre!"
 frw_sys.30.t:0 "French Equatorial Africa Stays Loyal to Vichy"
 frw_sys.30.d:0 "The officers in Gabon remain loyal to Vichy, and the envoy is put on the next boat to Lagos. Next time our envoys will be better prepared."
 frw_sys.30.a:0 "We will try again."
 frw_sys.60.t:0 "Our Troops Land in French Equatorial Africa"
 frw_sys.60.d:0 "Free French columns, supported by Allied ships and aircraft, have reached the capital of the region. Governor Félix Éboué has declared for Free France at Fort-Lamy. Within days Cameroon, the Middle Congo and Gabon follow. Brazzaville becomes the first capital of Free France."
 frw_sys.60.a:0 "The Cross of Lorraine flies again."
 frw_sys.70.t:0 "The Expedition to French Equatorial Africa Has Failed"
 frw_sys.70.d:0 "Our landing ran into determined resistance from the Vichy garrison and had to be called off. Men and equipment were lost, and Vichy propaganda celebrates."
 frw_sys.70.a:0 "We will be back."
 frw_sys.21.t:0 "French West Africa Rallies to Free France"
 frw_sys.21.d:0 "In Dakar the Governor-General has changed sides. The great harbour, the battleship in its basin and the Senegalese Tirailleurs now serve Free France."
 frw_sys.21.a:0 "Vive la France libre!"
 frw_sys.31.t:0 "French West Africa Stays Loyal to Vichy"
 frw_sys.31.d:0 "The batteries of Dakar open fire on the Free French ships. Vichy keeps West Africa for the time being. Next time our envoys will be better prepared."
 frw_sys.31.a:0 "We will try again."
 frw_sys.61.t:0 "Our Troops Land in French West Africa"
 frw_sys.61.d:0 "Free French columns, supported by Allied ships and aircraft, have reached the capital of the region. In Dakar the Governor-General has changed sides. The great harbour, the battleship in its basin and the Senegalese Tirailleurs now serve Free France."
 frw_sys.61.a:0 "The Cross of Lorraine flies again."
 frw_sys.71.t:0 "The Expedition to French West Africa Has Failed"
 frw_sys.71.d:0 "Our landing ran into determined resistance from the Vichy garrison and had to be called off. Men and equipment were lost, and Vichy propaganda celebrates."
 frw_sys.71.a:0 "We will be back."
 frw_sys.22.t:0 "French North Africa Rallies to Free France"
 frw_sys.22.d:0 "Algiers, Oran, Casablanca and Tunis have rallied. The Army of Africa, a hundred thousand men, returns to the war."
 frw_sys.22.a:0 "Vive la France libre!"
 frw_sys.32.t:0 "French North Africa Stays Loyal to Vichy"
 frw_sys.32.d:0 "General Weygand has the conspirators in Algiers arrested. North Africa stays with the Marshal. Next time our envoys will be better prepared."
 frw_sys.32.a:0 "We will try again."
 frw_sys.62.t:0 "Our Troops Land in French North Africa"
 frw_sys.62.d:0 "Free French columns, supported by Allied ships and aircraft, have reached the capital of the region. Algiers, Oran, Casablanca and Tunis have rallied. The Army of Africa, a hundred thousand men, returns to the war."
 frw_sys.62.a:0 "The Cross of Lorraine flies again."
 frw_sys.72.t:0 "The Expedition to French North Africa Has Failed"
 frw_sys.72.d:0 "Our landing ran into determined resistance from the Vichy garrison and had to be called off. Men and equipment were lost, and Vichy propaganda celebrates."
 frw_sys.72.a:0 "We will be back."
 frw_sys.23.t:0 "The Levant Rallies to Free France"
 frw_sys.23.d:0 "After a short and bitter campaign, the Army of the Levant has laid down its arms. Many of its soldiers chose to join the Free French."
 frw_sys.23.a:0 "Vive la France libre!"
 frw_sys.33.t:0 "The Levant Stays Loyal to Vichy"
 frw_sys.33.d:0 "General Dentz rejects every offer. In Damascus, Free French officers are tried for treason. Next time our envoys will be better prepared."
 frw_sys.33.a:0 "We will try again."
 frw_sys.63.t:0 "Our Troops Land in The Levant"
 frw_sys.63.d:0 "Free French columns, supported by Allied ships and aircraft, have reached the capital of the region. After a short and bitter campaign, the Army of the Levant has laid down its arms. Many of its soldiers chose to join the Free French."
 frw_sys.63.a:0 "The Cross of Lorraine flies again."
 frw_sys.73.t:0 "The Expedition to The Levant Has Failed"
 frw_sys.73.d:0 "Our landing ran into determined resistance from the Vichy garrison and had to be called off. Men and equipment were lost, and Vichy propaganda celebrates."
 frw_sys.73.a:0 "We will be back."
 frw_sys.24.t:0 "Madagascar and the Indian Ocean Rallies to Free France"
 frw_sys.24.d:0 "The governor in Tananarive has handed over the island. The Indian Ocean is closed to the Axis."
 frw_sys.24.a:0 "Vive la France libre!"
 frw_sys.34.t:0 "Madagascar and the Indian Ocean Stays Loyal to Vichy"
 frw_sys.34.d:0 "The garrison of Diego-Suarez stands firm. Madagascar remains loyal to Vichy. Next time our envoys will be better prepared."
 frw_sys.34.a:0 "We will try again."
 frw_sys.64.t:0 "Our Troops Land in Madagascar and the Indian Ocean"
 frw_sys.64.d:0 "Free French columns, supported by Allied ships and aircraft, have reached the capital of the region. The governor in Tananarive has handed over the island. The Indian Ocean is closed to the Axis."
 frw_sys.64.a:0 "The Cross of Lorraine flies again."
 frw_sys.74.t:0 "The Expedition to Madagascar and the Indian Ocean Has Failed"
 frw_sys.74.d:0 "Our landing ran into determined resistance from the Vichy garrison and had to be called off. Men and equipment were lost, and Vichy propaganda celebrates."
 frw_sys.74.a:0 "We will be back."
 frw_sys.25.t:0 "French Somaliland Rallies to Free France"
 frw_sys.25.d:0 "Cut off and starving under the British blockade, Djibouti has rallied to Free France."
 frw_sys.25.a:0 "Vive la France libre!"
 frw_sys.35.t:0 "French Somaliland Stays Loyal to Vichy"
 frw_sys.35.d:0 "The small garrison of Djibouti refuses to rally and the blockade continues. Next time our envoys will be better prepared."
 frw_sys.35.a:0 "We will try again."
 frw_sys.65.t:0 "Our Troops Land in French Somaliland"
 frw_sys.65.d:0 "Free French columns, supported by Allied ships and aircraft, have reached the capital of the region. Cut off and starving under the British blockade, Djibouti has rallied to Free France."
 frw_sys.65.a:0 "The Cross of Lorraine flies again."
 frw_sys.75.t:0 "The Expedition to French Somaliland Has Failed"
 frw_sys.75.d:0 "Our landing ran into determined resistance from the Vichy garrison and had to be called off. Men and equipment were lost, and Vichy propaganda celebrates."
 frw_sys.75.a:0 "We will be back."
 frw_sys.26.t:0 "French Indochina Rallies to Free France"
 frw_sys.26.d:0 "Hanoi and Saigon have rallied to Free France. Admiral Decoux has been put on a ship home."
 frw_sys.26.a:0 "Vive la France libre!"
 frw_sys.36.t:0 "French Indochina Stays Loyal to Vichy"
 frw_sys.36.d:0 "Admiral Decoux keeps Indochina for Vichy, under the eyes of the Japanese garrison. Next time our envoys will be better prepared."
 frw_sys.36.a:0 "We will try again."
 frw_sys.66.t:0 "Our Troops Land in French Indochina"
 frw_sys.66.d:0 "Free French columns, supported by Allied ships and aircraft, have reached the capital of the region. Hanoi and Saigon have rallied to Free France. Admiral Decoux has been put on a ship home."
 frw_sys.66.a:0 "The Cross of Lorraine flies again."
 frw_sys.76.t:0 "The Expedition to French Indochina Has Failed"
 frw_sys.76.d:0 "Our landing ran into determined resistance from the Vichy garrison and had to be called off. Men and equipment were lost, and Vichy propaganda celebrates."
 frw_sys.76.a:0 "We will be back."
 FRW_gold_p400_tt:0 "Gold reserves: §G+400 t§!"
 FRW_inf_tt_m35:0 "Inflation: §G-35§!"
 frw_sys.3.t:0 "Hyperinflation"
 frw_sys.3.d:0 "Banknotes are carried in baskets, and prices change twice a day. The franc is close to collapse. The experts of the Ministry of Finance propose a radical currency reform: a new franc, a hundred old ones for one new."
 frw_sys.3.a:0 "Introduce the new franc."
 frw_sys.3.b:0 "Not now. Ride it out."
 frw_sys.4.t:0 "The Gold Is Lost"
 frw_sys.4.d:0 "The gold of the Banque de France was not shipped out in time. It now lies in the hands of the occupier, and Free France must make do without it."
 frw_sys.4.a:0 "We should have sent it to Dakar."
 frw_sys.50.t:0 "The Allies Recognise Free France"
 frw_sys.50.d:0 "London and Washington now treat Free France as a real ally. Weapons, credits and factory space in Britain are put at our disposal."
 frw_sys.50.a:0 "France is back at the table."
 frw_sys.51.t:0 "Fighting France"
 frw_sys.51.d:0 "The Allied governments deal with the Free French committee as the government of France. Ambassadors who once called at Vichy go to Carlton Gardens instead."
 frw_sys.51.a:0 "Vive la France combattante!"
 frw_sys.5.t:0 "The Vaults Run Low"
 frw_sys.5.d:0 "The governor of the Banque de France brings bad news: fewer than five hundred tonnes of gold are left in the vaults. Without gold the franc has nothing behind it, and every speculator in Europe knows it."
 frw_sys.5.a:0 "Close the borders to capital."
 frw_sys.5.b:0 "Ask London for a gold loan."
 frw_sys.5.c:0 "We will manage somehow."
 frw_sys.1.t:0 "The Franc Is Falling"
 frw_sys.1.d:0 "Prices in Paris have doubled in a year. Housewives queue for bread, the unions demand higher wages and the newspapers speak of 1926. The Minister of Finance asks for emergency measures."
 frw_sys.1.a:0 "Take the bitter medicine."
 frw_sys.1.b:0 "The nation will bear it - France has other worries."
 frw_sys.2.t:0 "The Government in Exile"
 frw_sys.2.d:0 "France has fallen, but the government fights on. The Free France branch of the focus tree is now open, and the decision menu §YFree France§! lets you win back the colonies that were handed to Vichy."
 frw_sys.2.a:0 "The flame of French resistance must not go out."
 frw_sys.10.t:0 "The Fleet at Mers-el-Kébir"
 frw_sys.10.d:0 "The armistice gave the fleet to Vichy. In Mers-el-Kébir, Toulon and Alexandria the ships lie at anchor, their crews unsure whom to obey. London will not let them fall into German hands, and Free France must decide what to tell the crews."
 frw_sys.10.a:0 "Call on the sailors to join us."
 frw_sys.10.a.tt:0 "Chance (§Y20%§! + 40% of prestige): part of the Vichy fleet (§Yabout a third§!) sails to join Free France, §G+5§! prestige. Otherwise §R-5§! prestige."
 frw_sys.10.b:0 "Let the Royal Navy settle it."
 frw_sys.10.b.tt:0 "The Royal Navy attacks the Vichy fleet: Vichy loses §Ya battleship, a battlecruiser and three destroyers§!."
 frw_sys.10.c:0 "French ships will never fire on French ships."
 frw_sys.11.t:0 "The Sailors Join Us"
 frw_sys.11.d:0 "Several ships slipped out of harbour at night and are now steaming for Free French ports, with their crews cheering on deck."
 frw_sys.11.a:0 "Welcome aboard."
 frw_sys.12.t:0 "The Fleet Stays with Vichy"
 frw_sys.12.d:0 "Admiral Darlan has the crews confined to their ships. Not one vessel has answered our call."
 frw_sys.12.a:0 "A bitter blow."
 frw_sys.40.t:0 "A Governor Has Defected"
 frw_sys.40.d:0 "One of our colonial governors has gone over to the dissidents in London. His territory now flies the Cross of Lorraine."
 frw_sys.40.a:0 "Traitors!"
 FRW_hook_devalue_the_franc_0_tt:0 "Inflation: §G-10§!"
 FRW_hook_reform_banque_de_france_0_tt:0 "From now on inflation falls by another §G0.5§! points per month."
 FRW_hook_war_economy_0_tt:0 "Inflation: §R+5§!"
 FRW_hook_appeal_of_18_june_0_tt:0 "Free French Prestige starts at §Y20§! of 100 and the decisions §YFree France§! open. Removes §YDefeatism§!."
 FRW_hook_continue_the_fight_0_tt:0 "Free French Prestige: §G+5§!"
 FRW_hook_free_french_forces_0_tt:0 "Free French Prestige: §G+5§!"
 FRW_hook_rally_the_colonies_0_tt:0 "Free French Prestige: §G+10§!"
 FRW_hook_leclerc_column_0_tt:0 "Free French Prestige: §G+5§!"
 FRW_hook_brazzaville_conference_0_tt:0 "Free French Prestige: §G+10§!"
 FRW_hook_the_resistance_0_tt:0 "Free French Prestige: §G+5§!"

 # ---------- Free France extension ----------
 FRW_ff_chequers_spirit_desc:0 "Britain pays, arms and supplies the Free French, and recognises de Gaulle as their leader."
 FRW_ff_national_committee_spirit_desc:0 "The French National Committee governs from London."
 FRW_ff_bcra_spirit_desc:0 "The intelligence service of Free France runs networks across occupied France."
 FRW_ff_cnr_spirit_desc:0 "The Conseil National de la Résistance unites the movements."
 FRW_ff_bir_hakeim_spirit_desc:0 "The army remembers the sixteen days in the desert."
 FRW_ff_fafl_spirit_desc:0 "French pilots fly again under the Cross of Lorraine."
 FRW_ff_normandie_spirit_desc:0 "French pilots fly Yaks with the Red Air Force."
 FRW_ff_fnfl_spirit_desc:0 "Free French ships escort the convoys of the Atlantic."
 FRW_ff_securite_sociale_spirit_desc:0 "Every wage earner is insured. It is costly, and very popular."
 FRW_ff_reconstruction_spirit_desc:0 "France rebuilds what the war destroyed."
 FRW_ff_fourth_republic_spirit_desc:0 "An elected Assembly governs France again."
 FRW_ff_eurafrican_assembly_spirit_desc:0 "Europe and Africa share one parliament."
 FRW_ff_lorraine_spirit_desc:0 "French bomber crews fly their own missions over France."
 FRW_ff_richelieu_spirit_desc:0 "The most modern French battleship fights again."
 FRW_ff_maquis_spirit_desc:0 "The hills of France are full of armed men."
 FRW_ff_colonial_recruitment_spirit_desc:0 "Tirailleurs from Africa fill the army of liberation."
 FRW_ff_cfln_spirit_desc:0 "One committee, one army, one France."
 FRW_ff_cef_spirit_desc:0 "Juin's mountain troops lead the way."
 FRW_ff_dragoon_spirit_desc:0 "The army knows how to land on a hostile shore."
 FRW_ff_dakar_tt:0 "§YFrench West Africa§! (Dakar) has rallied to Free France"
 FRW_ff_sov_fights_tt:0 "The §YSoviet Union§! is at war with §YGermany§!"

 # ---------- French Africa in allied hands ----------
 FRW_return_cat:0 "French Africa in Allied Hands"
 FRW_return_cat_desc:0 "Allied troops hold parts of French Africa. Ask them to hand the territory back to France, either politely or with an offer they will find hard to refuse.\n\nFree French Prestige: §Y[?FRW_ff_prestige|0]§!"
 FRW_dec_return_request:0 "Ask [FROM.GetName] to Return French Africa"
 FRW_dec_return_request_desc:0 "[FROM.GetName] holds French territory in Africa. A diplomatic request costs little, but they may say no."
 FRW_dec_return_request_tt:0 "[FROM.GetName] decides. An AI accepts more readily the higher our §YFree French Prestige§! (from about §Y50%§! up to §Y95%§!).\nOn acceptance every §YFrench§! state in §YAfrica§! that [FROM.GetName] holds goes to France."
 FRW_dec_return_buy_pp:0 "Buy Back French Africa from [FROM.GetName]"
 FRW_dec_return_buy_pp_desc:0 "France offers concessions and credits in return for her African territories."
 FRW_dec_return_buy_tt:0 "An AI always accepts. [FROM.GetName] receives §Y60§! political power; if they refuse, we get our §Y100§! political power back.\nOn acceptance every §YFrench§! state in §YAfrica§! that [FROM.GetName] holds goes to France."
 FRW_dec_return_buy_gold:0 "Pay for French Africa in Gold"
 FRW_dec_return_buy_gold_desc:0 "Three hundred tonnes of the gold of the Banque de France for the return of French Africa.\n\nGold left: §Y[?FRW_gold|0] t§!"
 FRW_dec_return_gold_tt:0 "Gold reserves: §R-300 t§!. An AI always accepts. [FROM.GetName] gets §YFrench Gold§! for a year (consumer goods §G-5%§!); if they refuse, the gold comes back.\nOn acceptance every §YFrench§! state in §YAfrica§! that [FROM.GetName] holds goes to France."
 frw_ret.hand_tt:0 "Every §YFrench§! state in §YAfrica§! we hold goes to §YFrance§!."
 frw_ret.1.t:0 "France Asks for Her Colonies"
 frw_ret.1.d:0 "The French government reminds us that the African territories our troops now hold are French. It asks for them to be handed back to its administration."
 frw_ret.1.a:0 "They are our allies. Hand them over."
 frw_ret.1.b:0 "Not while the war goes on."
 frw_ret.2.t:0 "A French Offer"
 frw_ret.2.d:0 "Paris offers trade concessions and credits if we return the French territories in Africa that our troops hold."
 frw_ret.2.a:0 "A fair price. Agreed."
 frw_ret.2.b:0 "We are not for sale."
 frw_ret.3.t:0 "French Gold for French Africa"
 frw_ret.3.d:0 "The French offer three hundred tonnes of gold from the reserves of the Banque de France for the return of their African territories."
 frw_ret.3.a:0 "Gold speaks louder than words. Agreed."
 frw_ret.3.b:0 "Keep your gold."
 frw_ret.10.t:0 "French Africa Returns"
 frw_ret.10.d:0 "Our allies have handed the French territories in Africa back to us. The tricolour flies again over the government buildings."
 frw_ret.10.a:0 "Merci, mes amis."
 frw_ret.11.t:0 "Our Request Was Refused"
 frw_ret.11.d:0 "Our allies will not hand back the French territories in Africa for the time being."
 frw_ret.11.a:0 "We will ask again."
 FRW_french_gold_payment_desc:0 "Gold paid by France for the return of her African territories."
