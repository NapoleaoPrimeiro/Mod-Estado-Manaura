 FRW_french_gold_payment:0 "Gold for French Africa"
 FRW_leader_blum:0 "Léon Blum"
 FRW_leader_blum_desc:0 "Léon Blum, leader of the SFIO, is the first socialist and the first Jew to head a French government. His Popular Front came to power in 1936 on the slogan «Pain, paix, liberté»."
 FRW_leader_reynaud:0 "Paul Reynaud"
 FRW_leader_reynaud_desc:0 "A forceful finance politician of the Alliance Démocratique, Reynaud has long warned against Germany and is the patron of the young Colonel de Gaulle."
 FRW_leader_degaulle:0 "Charles de Gaulle"
 FRW_leader_degaulle_desc:0 "Long an advocate of armoured warfare and of a strong executive, the tall officer now leads a reformed Republic."
 FRW_leader_thorez:0 "Maurice Thorez"
 FRW_leader_thorez_desc:0 "The son of a miner from the Pas-de-Calais, Thorez is General Secretary of the PCF and keeps closely to the line set by the Comintern."
 FRW_leader_pivert:0 "Marceau Pivert"
 FRW_leader_pivert_desc:0 "Pivert, leader of the Gauche Révolutionnaire, coined the slogan 'Tout est possible!'. He wants a revolution run by workers' councils and independent of Moscow."
 FRW_leader_larocque:0 "François de La Rocque"
 FRW_leader_larocque_desc:0 "Colonel de La Rocque led the Croix-de-Feu and now heads the Parti Social Français. He calls for a Catholic and national state with a strong social policy."
 FRW_leader_doriot:0 "Jacques Doriot"
 FRW_leader_doriot_desc:0 "Once a communist and still mayor of Saint-Denis, Doriot founded the Parti Populaire Français in 1936, the most radical mass movement on the French right."
 FRW_leader_petain:0 "Philippe Pétain"
 FRW_leader_petain_desc:0 "The victor of Verdun is the most respected soldier in France, and many look to him to save the country."
 FRW_leader_comtedeparis:0 "Henri VI (Count of Paris)"
 FRW_leader_comtedeparis_desc:0 "Henri d'Orléans, Count of Paris, is head of the House of Orléans and the Orléanist pretender to the throne. He reigns as Henri VI."
 FRW_leader_napoleon:0 "Napoléon VI"
 FRW_leader_napoleon_desc:0 "Louis, Prince Napoléon, head of the House of Bonaparte, is young and ambitious and carries the most famous name in French history."
