 FRW_adv_mandel_req:0 "§YGeorges Mandel§! is a political advisor"
 FRW_adv_marty:0 "André Marty"
 FRW_adv_marty_desc:0 "André Marty led the mutiny of the French fleet in the Black Sea in 1919 and has never stopped being a revolutionary. Moscow trusts him; his volunteers fear him. Under his command the International Brigades will be organised and held to a hard discipline."
 FRW_trait_marty:0 "Commissar of the Brigades"
