l_japanese:
 # ---------- Fokusse (generiert) ----------
 FRW_crisis_of_the_republic:0 "The Crisis of the Third Republic"
 FRW_crisis_of_the_republic_desc:0 "The riots of 6 February 1934 left fifteen dead on the Place de la Concorde and brought down the Daladier cabinet. Two years on, the parties still disagree over where the country should go."
 FRW_defend_the_republic:0 "Defend the Republic"
 FRW_defend_the_republic_desc:0 "The Third Republic came through four years of war between 1914 and 1918. Its defenders argue that it can weather the leagues and the slump as well."
 FRW_social_truce:0 "The Social Truce"
 FRW_social_truce_desc:0 "In June 1936 two million workers occupy their factories. Union leaders and the employers' federation are called to the Hôtel Matignon, and nobody leaves until there is an agreement."
 FRW_social_truce_tt:0 "Protects France from the §Rcommunist uprising§! that low stability would otherwise trigger.\nEnds the §YStrike Wave§!.\nBecomes available in §YJune 1936§!."
 FRW_end_disjointed_government:0 "End the Cabinet Carousel"
 FRW_end_disjointed_government_desc:0 "France has seen more than a dozen cabinets since 1930, few lasting longer than a year. Ministers barely learn their briefs before they fall."
 FRW_end_disjointed_government_tt:0 "§YDisjointed Government§! becomes §YA Fragile Government§!. Two decisions (from 1937 and 1938, each at least 6 months apart) remove it completely – or §YA New Constitution§! ends it at once."
 FRW_front_populaire:0 "The Popular Front"
 FRW_front_populaire_desc:0 "After the elections of May 1936, Léon Blum forms a government of Socialists and Radicals, with Communist support in the Chamber, pledged to social reform."
 FRW_front_populaire_tt:0 "Requires the support of §YLéon Blum§! (decision §YWin Over Léon Blum§!, 45 days)."
 FRW_union_nationale:0 "The National Union"
 FRW_union_nationale_desc:0 "Paul Reynaud gathers the centre-right around a programme of balanced budgets and rearmament."
 FRW_union_nationale_tt:0 "Requires the support of §YPaul Reynaud§! (decision §YWin Over Paul Reynaud§!, 45 days)."
 FRW_matignon_reforms:0 "The Matignon Agreements"
 FRW_matignon_reforms_desc:0 "The Matignon Agreements of June 1936 grant higher wages and collective bargaining. The occupied factories empty and work resumes."
 FRW_nationalize_arms_industry:0 "Nationalise the Arms Industry"
 FRW_nationalize_arms_industry_desc:0 "Under the law of August 1936 the state takes over the principal arms works, and war production passes into public hands."
 FRW_conges_payes:0 "Paid Holidays"
 FRW_conges_payes_desc:0 "Every worker is now entitled to two weeks of paid holiday a year. That summer, trains to the coast are packed with families who have never seen the sea."
 FRW_republican_volunteers:0 "Volunteers for the Republic"
 FRW_republican_volunteers_desc:0 "French volunteers cross the Pyrenees to fight for the Spanish Republic and return with hard experience of modern war."
 FRW_plan_de_relance:0 "The Recovery Plan"
 FRW_plan_de_relance_desc:0 "The government launches a large programme of public works and investment to pull France out of the Depression."
 FRW_reynaud_rearmament:0 "Reynaud's Rearmament"
 FRW_reynaud_rearmament_desc:0 "Reynaud spent years warning the Chamber about German rearmament. In office, he can act on what he said in opposition."
 FRW_decree_laws:0 "Government by Decree"
 FRW_decree_laws_desc:0 "Armed with decree powers, the government can pass measures without waiting on a divided parliament."
 FRW_armee_de_metier:0 "Towards a Professional Army"
 FRW_armee_de_metier_desc:0 "In 'Vers l'armée de métier' (1934) Lieutenant-Colonel de Gaulle called for a professional army built around armoured divisions. Reynaud took up the idea in the Chamber the following year. France builds a smaller army of long-service professionals."
 FRW_gaullist_presidency:0 "A Presidential Republic"
 FRW_gaullist_presidency_desc:0 "Charles de Gaulle becomes head of state, with powers well beyond those of any president under the 1875 constitution."
 FRW_republican_mobilization:0 "The Republic in Arms"
 FRW_republican_mobilization_desc:0 "Across the country, reservists are recalled and factories turn to the needs of national defence."
 FRW_entente_cordiale:0 "Renew the Entente Cordiale"
 FRW_entente_cordiale_desc:0 "The Entente of 1904 held through four years on the Western Front. Paris proposes to make it a standing alliance with London."
 FRW_entente_cordiale_tt:0 "France and §YBritain§! join one faction (if Britain is democratic):\n- If Britain leads a faction, France joins it.\n- Otherwise France founds the §YEntente§! and Britain joins.\nA human-played Britain decides by event."
 FRW_union_francaise:0 "The French Union"
 FRW_union_francaise_desc:0 "Paris proposes to turn the colonial empire into a union of associated peoples, with France still at its head."
 FRW_union_francaise_tt:0 "Forms the §YUnion Française§!: new name and flag, national spirit and §Gcores on Algeria and the overseas départements§! (Antilles, Guiana, Réunion) that France owns (also later) and §Yclaims§! on the rest of them.\nReplaces any nation France has formed before (its formable spirit is removed). If France is already the §YEternal Kingdom of Francia§!, it stays that."
 FRW_little_entente_guarantees:0 "Bring in the Little Entente"
 FRW_little_entente_guarantees_desc:0 "Czechoslovakia, Yugoslavia and Romania already rely on French guarantees. The Quai d'Orsay now invites them into a formal alliance."
 FRW_franco_british_union:0 "Franco-British Union"
 FRW_franco_british_union_desc:0 "Jean Monnet and Winston Churchill both spoke of uniting the two nations under one government. Paris now puts the offer to London."
 FRW_franco_british_union_tt:0 "Proposes the §YFranco-British Union§! to London (an AI Britain always accepts, a human player decides):\n- Both countries gain §YFranco-British Union§!.\n- France takes the name and flag of the Union (this replaces any nation formed before, except the §YEternal Kingdom of Francia§!). The Union brings no new cores."
 FRW_colonial_assembly:0 "The Colonial Assembly"
 FRW_colonial_assembly_desc:0 "Delegates from the colonies take their seats in a consultative assembly in Paris."
 FRW_colonial_assembly_tt:0 "All non-core states: §G+10%§! compliance."
 FRW_council_of_europe:0 "The Briand Plan"
 FRW_council_of_europe_desc:0 "In 1929 Aristide Briand proposed a European union at Geneva. His successors take the plan out of the files of the Quai d'Orsay."
 FRW_council_of_europe_tt:0 "Founds the §YEuropean Community§! (if France is in no faction) and invites §YBelgium§!, the §YNetherlands§!, §YLuxembourg§! and §YSwitzerland§!.\nThe §YEuropean Federation§! itself is proclaimed later, once the Community has grown together."
 FRW_rhine_guarantee:0 "Guardians of the Rhine"
 FRW_rhine_guarantee_desc:0 "Twice in seventy years German armies have crossed into France. The Rhine is to be held as the country's frontier of security."
 FRW_rhine_guarantee_tt:0 "If §YGermany§! is fascist: war goal §Ytopple government§! against Germany."
 FRW_arsenal_of_democracy:0 "Arms for the Free Nations"
 FRW_arsenal_of_democracy_desc:0 "French factories turn out weapons for every democracy in Europe that still resists."
 FRW_european_defence_community:0 "A Common Defence Council"
 FRW_european_defence_community_desc:0 "France and her partners pool armament research and draw up common plans of defence."
 FRW_franco_belgian_customs:0 "Customs Union with Belgium"
 FRW_franco_belgian_customs_desc:0 "A customs union ties the economies of Belgium and Luxembourg to that of France."
 FRW_franco_belgian_customs_tt:0 "Forms the §YWestern Union§!: new name and flag, national spirit and §Gcores on the lands of Belgium, the Netherlands and Luxembourg§! that France owns (also on any it gains later there) and §Yclaims§! on the rest.\nReplaces any nation France has formed before (its formable spirit is removed). If France is already the §YEternal Kingdom of Francia§!, it stays that.\nRequires control of §YBelgium§!, the §YNetherlands§! and §YLuxembourg§! (annexed or as puppets, unless stated otherwise). If France does not control them yet, the nation is founded automatically as soon as it does."
 FRW_fourth_republic:0 "A New Constitution"
 FRW_fourth_republic_desc:0 "The laws of 1875 were a stopgap that lasted sixty years. A new constitution gives France a stronger executive and longer-lived cabinets."
 FRW_aid_spanish_republic:0 "Aid the Spanish Republic"
 FRW_aid_spanish_republic_desc:0 "In 1936 Blum wanted to help Madrid but was held back by London and his own Radicals. This time the aircraft fly south."
 FRW_aid_spanish_republic_tt:0 "Sends §Y2,000 rifles§! to the Spanish Republic and gives France a war goal §Ytopple government§! against the Nationalists."
 FRW_european_customs_union:0 "The European Customs Union"
 FRW_european_customs_union_desc:0 "Coal, steel and grain now cross the borders of the Community free of duty. Monnet's planners describe it as only a beginning."
 FRW_european_customs_union_tt:0 "Every member of France's faction receives §YEuropean Partner§! (+5% factory output, +3% research speed).\nRequires §YJean Monnet§! as political advisor (decision §YAppoint Jean Monnet§! in the §YCouncil of Ministers§!, department §YEconomy§!)."
 FRW_european_federation_focus:0 "The European Federation"
 FRW_european_federation_focus_desc:0 "Member states are asked to hand their armies and currencies to a federal government seated in Paris. Most of them accept."
 FRW_european_federation_focus_tt:0 "Every democratic minor of Europe in France's faction or under French guarantee is asked to join the federation (accepting means being annexed peacefully). The offer can be renewed with the decision §YRenew the Federal Offer§!.\nForms the §YEuropean Federation§!: new name and flag, national spirit and §Gcores on the lands of Benelux, Switzerland, Italy, Germany and the Rhineland§! that France owns (also on any it gains later there) and §Yclaims§! on the rest.\nReplaces any nation France has formed before (its formable spirit is removed). If France is already the §YEternal Kingdom of Francia§!, it stays that.\nRequires control of §YBelgium§!, the §YNetherlands§! and §YLuxembourg§! (annexed, as puppets or joined through the federation) - after this focus §YItaly§! or §YGermany§! are no longer needed. If France does not control them yet, the nation is founded automatically as soon as it does."
 FRW_forty_hour_week:0 "The Forty-Hour Week"
 FRW_forty_hour_week_desc:0 "The law of June 1936 limits the working week to forty hours. Workers welcome it, while employers complain about costs."
 FRW_pierre_cot_aviation:0 "Popular Aviation"
 FRW_pierre_cot_aviation_desc:0 "Air Minister Pierre Cot nationalises the aircraft factories and opens flying clubs to the sons of workers."
 FRW_jean_zay_reforms:0 "The Jean Zay Reforms"
 FRW_jean_zay_reforms_desc:0 "Education Minister Jean Zay raises the school-leaving age and founds the research service that will become the CNRS."
 FRW_relax_forty_hours:0 "Priority for the Arsenals"
 FRW_relax_forty_hours_desc:0 "The forty-hour week remains law, but the arms factories are exempted and may work overtime."
 FRW_bread_peace_liberty:0 "Bread, Peace and Liberty"
 FRW_bread_peace_liberty_desc:0 "«Bread, peace and liberty» was the Popular Front's election slogan in 1936. The government now treats it as its programme."
 FRW_reynaud_recovery:0 "The Reynaud Decrees"
 FRW_reynaud_recovery_desc:0 "As Finance Minister, Reynaud relaxes the forty-hour week, restores the confidence of investors and brings capital back to France."
 FRW_mandel_colonies:0 "Mandel's Colonial Ministry"
 FRW_mandel_colonies_desc:0 "Georges Mandel, Minister for the Colonies, promises to raise a large colonial army to defend metropolitan France."
 FRW_mandel_colonies_tt:0 "Requires §YGeorges Mandel§! as political advisor (decision §YAppoint Georges Mandel§! in the §YCouncil of Ministers§!, department §YPolitics§!)."
 FRW_edge_of_the_sword:0 "The Edge of the Sword"
 FRW_edge_of_the_sword_desc:0 "The armoured division de Gaulle described becomes the pattern for the rest of the army. 'Le Fil de l'épée', de Gaulle's 1932 essay on command, is placed on the reading list of the École de Guerre."
 FRW_certaine_idee:0 "A Certain Idea of France"
 FRW_certaine_idee_desc:0 "De Gaulle has long held that France is only herself when she stands in the front rank of nations. As President he sets out to build a Republic on that conviction."
 FRW_deat_neosocialism:0 "Order, Authority, Nation"
 FRW_deat_neosocialism_desc:0 "At the Socialist congress of 1933 Adrien Marquet and Marcel Déat told the party that it must win the middle classes with «order, authority, nation». Blum had them expelled. The Neo-Socialists offer the Republic a strong state and a planned economy."
 FRW_deat_neosocialism_tt:0 "Requires the support of §YMarcel Déat§! (decision §YWin Over Marcel Déat§!, 45 days)."
 FRW_deat_labour_plan:0 "The Labour Plan"
 FRW_deat_labour_plan_desc:0 "In Belgium Henri de Man has shown the way: credit, energy and heavy industry under public direction, everything else left in private hands. The planners of the Neo-Socialists draw up a French version."
 FRW_deat_national_credit:0 "A National Credit Office"
 FRW_deat_national_credit_desc:0 "The Banque de France and the great deposit banks are placed under a National Credit Office. The «two hundred families» lose their hold on the Treasury, and the state decides where the money goes."
 FRW_deat_strong_state:0 "The Strong State"
 FRW_deat_strong_state_desc:0 "The decree laws become the rule. Parliament votes the budget and the Plan once a year, and the executive governs in between. Déat's critics on the left say his socialism of order looks more to Rome than to Jaurès."
 FRW_deat_die_for_danzig:0 "Die for Danzig?"
 FRW_deat_die_for_danzig_desc:0 "«Must we die for Danzig?» asks Déat in the newspaper L'Œuvre. French peasants, he writes, will not go to war for a free city on the Baltic. The article divides the country, and his critics call it the first step on the road to Berlin."
 FRW_deat_die_for_danzig_tt:0 "The Neo-Socialists must now choose: stay in the §YRepublic§! or found the §YSingle Party§!."
 FRW_deat_planist_republic:0 "The Planist Republic"
 FRW_deat_planist_republic_desc:0 "Déat stays within the Republic. The Plan is written into law, the Chamber keeps its vote on it, and a Council of the Economy brings unions, employers and engineers to one table."
 FRW_deat_x_crise:0 "The Engineers of X-Crise"
 FRW_deat_x_crise_desc:0 "The polytechnicians of the X-Crise circle, Jean Coutrot, Louis Vallon and the young Alfred Sauvy among them, leave their study groups for the ministries. For the first time France is run by planners."
 FRW_deat_republic_of_order:0 "The Republic of Order"
 FRW_deat_republic_of_order_desc:0 "For the first time since the war a cabinet outlasts its budget and the Plan meets its targets. Déat's supporters say no parliament could have done as much."
 FRW_deat_single_party:0 "The Single Party"
 FRW_deat_single_party_desc:0 "Socialists, veterans and the men of the leagues, Déat argues, all want the same thing: a national and popular revolution. He calls on them to join one party, the Rassemblement National Populaire, and to close the Chamber for good."
 FRW_deat_single_party_tt:0 "Requires at least §Y15%§! popularity for §Yfascism§!."
 FRW_deat_labour_front:0 "The Labour Front"
 FRW_deat_labour_front_desc:0 "The trade unions and the employers' federations are merged into a single Labour Front. Strikes and lock-outs are forbidden alike; the Plan sets wages and prices."
 FRW_deat_national_legion:0 "The National Popular Legion"
 FRW_deat_national_legion_desc:0 "The RNP raises its own legion of volunteers. It marches with spades as well as rifles, and its recruits come from the factories as much as from the old leagues."
 FRW_deat_new_europe:0 "The New European Order"
 FRW_deat_new_europe_desc:0 "Déat dreams of a Europe that is both socialist and national, from Brest to Bucharest, with Paris as its second capital. Brussels, The Hague, Bern and Copenhagen are invited to join."
 FRW_deat_new_europe_tt:0 "Founds the §YNew European Order§! (if France is in no faction) and invites §YBelgium§!, the §YNetherlands§!, §YLuxembourg§!, §YSwitzerland§! and §YDenmark§!."
 FRW_deat_continental_economy:0 "The Continental Economy"
 FRW_deat_continental_economy_desc:0 "A European clearing union, a common plan for coal and steel and one market from the Atlantic to the Vistula. Déat calls it continental socialism."
 FRW_deat_lvf:0 "The Legion of French Volunteers"
 FRW_deat_lvf_desc:0 "Déat and his rivals of the other parties agree on one thing at least: French volunteers should fight Bolshevism abroad. The Legion recruits in the RNP's offices and marches off to wherever the crusade is waged."
 FRW_deat_ministry_of_labour:0 "The Ministry of Labour"
 FRW_deat_ministry_of_labour_desc:0 "Déat takes the Ministry of Labour for himself. Labour exchanges, apprenticeships and wage tables answer to one office in the Rue de Grenelle."
 FRW_deat_revolutionary_front:0 "The Revolutionary National Front"
 FRW_deat_revolutionary_front_desc:0 "The last rival movements are folded into a single Revolutionary National Front under Déat's leadership. Former socialists, syndicalists and men of the leagues now share one membership card."
 FRW_deat_european_revolution:0 "The European Revolution"
 FRW_deat_european_revolution_desc:0 "A national and socialist Europe cannot stop at the Belgian border, Déat writes. Brussels and The Hague are invited to place themselves under French protection, as the first provinces of the new continent."
 FRW_protect_austria:0 "Protect Austrian Independence"
 FRW_protect_austria_desc:0 "Austria lies exposed between Berlin and Rome. Paris offers its protection and expects Vienna to follow French policy in return."
 FRW_libyan_border:0 "Guarantee the Low Countries"
 FRW_libyan_border_desc:0 "As at Locarno in 1925, France stands guarantor for her neighbours. Paris will treat an attack on Brussels, The Hague or Luxembourg as an attack on France."
 FRW_workers_popular_front:0 "The Workers' Front"
 FRW_workers_popular_front_desc:0 "The PCF breaks with its bourgeois partners in the Popular Front and calls on the workers to take power themselves."
 FRW_truce_unity_of_action:0 "Unity of Action"
 FRW_truce_unity_of_action_desc:0 "In 1934 the PCF and the SFIO signed a pact to stop attacking each other and march together against the leagues. The Party now holds the workers to it, under its own banner."
 FRW_truce_unity_of_action_tt:0 "Protects France from the §Rcommunist uprising§! that low stability would otherwise trigger.\nEnds the §YStrike Wave§!.\nBecomes available in §YJune 1936§!."
 FRW_cgt_general_strike:0 "The CGT General Strike"
 FRW_cgt_general_strike_desc:0 "Millions of workers walk out at the call of the CGT and the factories fall silent. The government may not survive the week."
 FRW_proclaim_the_commune:0 "Proclaim the Commune"
 FRW_proclaim_the_commune_desc:0 "In 1871 Paris rose alone and was crushed. This time the provinces rise with the capital."
 FRW_proclaim_the_commune_tt:0 "§YDisjointed Government§! becomes §YA Fragile Government§!. Two decisions (from 1937 and 1938, each at least 6 months apart) remove it completely."
 FRW_thorez_party_line:0 "Thorez Takes Power"
 FRW_thorez_party_line_desc:0 "Under Maurice Thorez, France aligns her policy closely with that of Moscow."
 FRW_thorez_party_line_tt:0 "Requires the support of §YMaurice Thorez§! (decision §YWin Over Maurice Thorez§!, 45 days)."
 FRW_pivert_revolution:0 "Everything Is Possible!"
 FRW_pivert_revolution_desc:0 "Marceau Pivert and the Gauche Révolutionnaire call for a democracy of workers' councils, independent of Moscow."
 FRW_pivert_revolution_tt:0 "Requires the support of §YMarceau Pivert§! (decision §YWin Over Marceau Pivert§!, 45 days)."
 FRW_five_year_plan_fr:0 "The French Five-Year Plan"
 FRW_five_year_plan_fr_desc:0 "Following the Soviet Gosplan, commissioners in every département set quotas for coal, steel and grain. The Renault works at Billancourt now take their orders from the plan rather than the market."
 FRW_soviet_military_mission:0 "Soviet Military Mission"
 FRW_soviet_military_mission_desc:0 "Red Army officers arrive in Paris to teach French staff the theory of deep operations."
 FRW_join_comintern:0 "Join the Comintern"
 FRW_join_comintern_desc:0 "The Party holds that the revolution cannot succeed in one country alone. Paris joins Moscow and the workers' movements abroad in the Communist International."
 FRW_join_comintern_tt:0 "Asks the §YSoviet Union§! to join its faction. If the Soviets lead no faction, France founds the §YRed Front§! and invites them."
 FRW_red_army_of_france:0 "The Red Army of France"
 FRW_red_army_of_france_desc:0 "The army is reorganised on the Soviet model, with political commissars attached to its units."
 FRW_workers_councils:0 "Workers' Councils"
 FRW_workers_councils_desc:0 "Elected councils of workers take over the management of the factories."
 FRW_revolutionary_militias:0 "Revolutionary Militias"
 FRW_revolutionary_militias_desc:0 "The Commune of 1871 began when the government at Versailles tried to take away the cannon of Montmartre. This time each factory and each quarter keeps an armed workers' militia."
 FRW_export_the_revolution:0 "Export the Revolution"
 FRW_export_the_revolution_desc:0 "Party leaders argue that the revolution cannot be confined to France."
 FRW_iberian_revolution:0 "Revolution in Iberia"
 FRW_iberian_revolution_desc:0 "The Spanish Communists and the unions ask Paris for arms against the generals."
 FRW_iberian_revolution_tt:0 "War goal §Ytopple government§! against §YSpain§! (unless Spain is communist or allied)."
 FRW_red_navy_of_toulon:0 "The Red Fleet and Air Force"
 FRW_red_navy_of_toulon_desc:0 "The Black Sea mutiny of 1919, led by André Marty among others, is still remembered in the fleet. Toulon's sailors now hold the ships for the people. Young workers learn to fly in the Party's flying clubs."
 FRW_red_industry:0 "Red Industry"
 FRW_red_industry_desc:0 "Le Creusot and the de Wendel steelworks pass to the state. Output targets replace dividends."
 FRW_liberate_colonies:0 "Liberate the Colonies"
 FRW_liberate_colonies_desc:0 "A socialist France cannot hold colonies by force. Morocco and Tunisia become independent fraternal republics."
 FRW_liberate_colonies_tt:0 "§YMorocco§! and §YTunisia§! are released as communist satellites (if France owns them) and §YFraternal Peoples§! grows one level."
 FRW_union_of_european_socialist_republics:0 "United Socialist States of Europe"
 FRW_union_of_european_socialist_republics_desc:0 "The Party sets its sights on a socialist union of Europe, free of frontiers and of capitalists."
 FRW_union_of_european_socialist_republics_tt:0 "War goal §Ytopple government§! against §YBelgium§!, the §YNetherlands§! and §YLuxembourg§! (unless they are already communist, French subjects or allies).\nForms the §YEuropean Federation§!: new name and flag, national spirit and §Gcores on the lands of Benelux, Switzerland, Italy, Germany and the Rhineland§! that France owns (also on any it gains later there) and §Yclaims§! on the rest.\nReplaces any nation France has formed before (its formable spirit is removed). If France is already the §YEternal Kingdom of Francia§!, it stays that.\nRequires control of §YBelgium§!, the §YNetherlands§! and §YLuxembourg§! plus §YItaly§! or §YGermany§! (annexed or as puppets, unless stated otherwise). If France does not control them yet, the nation is founded automatically as soon as it does."
 FRW_peoples_science:0 "Science for the People"
 FRW_peoples_science_desc:0 "Frédéric Joliot-Curie and other scientists place their laboratories at the service of the revolution."
 FRW_internationale_victory:0 "The Final Struggle"
 FRW_internationale_victory_desc:0 "The Internationale is sung in the streets as the Red Army of France moves out."
 FRW_purge_deviationists:0 "Purge the Deviationists"
 FRW_purge_deviationists_desc:0 "Trotskyists, followers of Pivert and other 'enemies of the Party' are expelled from the PCF and the CGT."
 FRW_fils_du_peuple:0 "Son of the People"
 FRW_fils_du_peuple_desc:0 "Thorez's autobiography, 'Fils du peuple', is printed in millions of copies. The miner's son from the Pas-de-Calais looks down from posters in every Party office."
 FRW_second_five_year_plan:0 "The Second Five-Year Plan"
 FRW_second_five_year_plan_desc:0 "The second plan puts heavy industry and electrification ahead of everything else."
 FRW_political_commissars:0 "Political Commissars"
 FRW_political_commissars_desc:0 "A commissar is attached to every regiment, and the army now answers to the Party."
 FRW_bastion_of_the_west:0 "Bastion of the Revolution"
 FRW_bastion_of_the_west_desc:0 "Paris is the capital of socialism in Western Europe. Workers' delegations from London, Brussels and Barcelona arrive by every train."
 FRW_federation_of_communes:0 "A Federation of Communes"
 FRW_federation_of_communes_desc:0 "The prefects are abolished, and each commune governs itself through its elected council. Evening classes open in towns across France. Workers who took over the factories now fill the lecture halls."
 FRW_aid_the_poum:0 "Aid the Iberian Comrades"
 FRW_aid_the_poum_desc:0 "Rifles, lorries and volunteers cross the Pyrenees to reach the POUM and the anti-Stalinist left in Barcelona."
 FRW_workers_army:0 "From Militias to a Workers' Army"
 FRW_workers_army_desc:0 "The militias are given officers, regular drill and heavy weapons while keeping their elected committees."
 FRW_republic_of_labour:0 "The Republic of Labour"
 FRW_republic_of_labour_desc:0 "Pivert's followers describe the new state as a free association of producers, run neither by capitalists nor by bureaucrats."
 FRW_cgt_unions_take_power:0 "All Power to the Unions"
 FRW_cgt_unions_take_power_desc:0 "In 1906 the CGT declared at Amiens that the union, not the party, would be the cell of the society to come. Pierre Besnard and the revolutionary syndicalists now hold the movement to its word: the Party may sit in the Hôtel de Ville, but the unions will run France."
 FRW_cgt_unions_take_power_tt:0 "Requires the support of §YPierre Besnard§! (decision §YWin Over Pierre Besnard§!, 45 days)."
 FRW_cgt_factory_committees:0 "The Factory Committees"
 FRW_cgt_factory_committees_desc:0 "In every works a committee elected on the shop floor takes over the management. Engineers and foremen stay, but they now answer to the men and women at the benches."
 FRW_cgt_local_unions:0 "The Local Unions Govern"
 FRW_cgt_local_unions_desc:0 "The prefects are sent home. In each town the union local and its delegates take over the work of the town hall, from the bread ration to the trams."
 FRW_cgt_bourses_du_travail:0 "The Bourses du Travail"
 FRW_cgt_bourses_du_travail_desc:0 "Fernand Pelloutier wanted the labour exchanges to be the schools of the working class. Libraries, evening classes and technical courses open in every town to make them so."
 FRW_cgt_confederal_congress:0 "The Confederal Congress"
 FRW_cgt_confederal_congress_desc:0 "Delegates of every federation meet at the Mutualité. Decisions rise from the factory to the congress, not down from a central committee. The factory occupations end, since the occupiers run the works."
 FRW_cgt_confederal_congress_tt:0 "Ends the §YStrike Wave§! and protects France from the §Rcommunist uprising§! that low stability would otherwise trigger."
 FRW_cgt_red_black_columns:0 "The Red and Black Columns"
 FRW_cgt_red_black_columns_desc:0 "The union militias form columns under the red and black flag. They elect their officers and fight hard, but they do not take kindly to orders."
 FRW_cgt_iwa:0 "The International Workers' Association"
 FRW_cgt_iwa_desc:0 "Besnard was secretary of the International Workers' Association, the syndicalist international. With France in the hands of the unions, its congresses move to Paris."
 FRW_cgt_aid_the_cnt:0 "Aid the CNT"
 FRW_cgt_aid_the_cnt_desc:0 "Rifles and lorries cross the Pyrenees for the CNT and the anarchist columns of Catalonia and Aragon."
 FRW_cgt_collectivise_land:0 "Collectivise the Land"
 FRW_cgt_collectivise_land_desc:0 "Agricultural workers take over the great estates of the Beauce and the Midi. Smallholders may join the collectives or keep their fields."
 FRW_cgt_workers_self_defence:0 "Workers' Self-Defence"
 FRW_cgt_workers_self_defence_desc:0 "The congress agrees that the revolution needs an army after all, but one that defends the communes and has no general staff of its own."
 FRW_cgt_iberian_federation:0 "The Iberian Federation"
 FRW_cgt_iberian_federation_desc:0 "In Barcelona the CNT speaks of a free federation of Iberian peoples. Paris promises to help bring it about."
 FRW_cgt_iberian_federation_tt:0 "War goal §Ytopple government§! against §YSpain§! (unless Spain is communist or allied)."
 FRW_cgt_libertarian_commune:0 "The Libertarian Commune"
 FRW_cgt_libertarian_commune_desc:0 "France has neither bosses nor bureaucrats, only federations of free producers. Whether such a society can fight a modern war is a question the congress prefers not to ask."
 FRW_workers_belgium:0 "Down with Salazar"
 FRW_workers_belgium_desc:0 "In Lisbon, Salazar's Estado Novo keeps the workers' movement suppressed. With Spain in revolutionary hands, Portugal will find itself isolated."
 FRW_smash_italian_fascism:0 "Smash Italian Fascism"
 FRW_smash_italian_fascism_desc:0 "Mussolini has ruled Italy since 1922, longer than any other fascist leader in Europe. Italian exiles in France say the workers at home are ready to rise."
 FRW_red_switzerland:0 "The International Brigades"
 FRW_red_switzerland_desc:0 "Volunteers of many nations leave the Gare d'Austerlitz for Spain, Frenchmen alongside Germans, Poles and Americans. Paris has become the recruiting office of the world revolution."
 FRW_red_switzerland_tt:0 "Requires §YAndré Marty§! as political advisor (decision §YAppoint André Marty§! in the §YCouncil of Ministers§!, department §YPolitics§!)."
 FRW_national_renewal:0 "National Renewal"
 FRW_national_renewal_desc:0 "The leagues march again, shouting 'À bas les voleurs!' at the Republic."
 FRW_truce_labour_charter:0 "The Corporative Order"
 FRW_truce_labour_charter_desc:0 "Strikes and lockouts are banned. Workers and employers of each trade sit together in one corporation, and the state settles what they cannot."
 FRW_truce_labour_charter_tt:0 "Protects France from the §Rcommunist uprising§! that low stability would otherwise trigger.\nEnds the §YStrike Wave§!.\nBecomes available in §YJune 1936§!."
 FRW_february_sixth:0 "Storm the Palais Bourbon"
 FRW_february_sixth_desc:0 "On 6 February 1934 the leagues were halted at the Pont de la Concorde. This time they intend to cross it."
 FRW_national_revolution:0 "The National Revolution"
 FRW_national_revolution_desc:0 "The Republic falls, and an authoritarian nationalist government takes its place."
 FRW_national_revolution_tt:0 "§YDisjointed Government§! becomes §YA Fragile Government§!. Two decisions (from 1937 and 1938, each at least 6 months apart) remove it completely."
 FRW_la_rocque_psf:0 "Work, Family, Fatherland"
 FRW_la_rocque_psf_desc:0 "Colonel de La Rocque and his Parti Social Français want a Catholic, national state that avoids foreign adventures."
 FRW_la_rocque_psf_tt:0 "Requires the support of §YFrançois de La Rocque§! (decision §YWin Over François de La Rocque§!, 45 days)."
 FRW_doriot_ppf:0 "The French Popular Party"
 FRW_doriot_ppf_desc:0 "Jacques Doriot, expelled from the Communist Party in 1934, now leads the PPF and wants a totalitarian mass state."
 FRW_doriot_ppf_tt:0 "Requires the support of §YJacques Doriot§! (decision §YWin Over Jacques Doriot§!, 45 days)."
 FRW_corporatist_state:0 "The Corporatist State"
 FRW_corporatist_state_desc:0 "Employers and workers in each trade are brought together in corporations under state supervision."
 FRW_latin_bloc:0 "The Latin Bloc"
 FRW_latin_bloc_desc:0 "France, Spain, Portugal and Italy draw together as a bloc of Latin nations standing between Berlin and Moscow."
 FRW_latin_bloc_tt:0 "Founds the §YLatin Bloc§! faction and invites §YItaly§!, §YSpain§! and §YPortugal§!.\nThe §YLatin Empire§! itself is proclaimed later with §YLeadership of Latin Europe§!."
 FRW_colonial_legions:0 "Colonial Legions"
 FRW_colonial_legions_desc:0 "Recruits from Senegal, Madagascar and Indochina are formed into legions under French officers."
 FRW_restore_french_honour:0 "The Savoyard Inheritance"
 FRW_restore_french_honour_desc:0 "Savoy and Nice have been French since the Treaty of Turin in 1860. Geneva, long claimed by the Dukes of Savoy, is demanded as well. Piedmont is left to Rome, France's partner in the Latin Bloc."
 FRW_totalitarian_party:0 "The Single Party"
 FRW_totalitarian_party_desc:0 "The Chambers, the leagues and the old parties are dissolved by decree. The PPF becomes the only legal party in France."
 FRW_totalitarian_party_tt:0 "Requires §YPaul Marion§! as political advisor (decision §YAppoint Paul Marion§! in the §YCouncil of Ministers§!, department §YPolitics§!)."
 FRW_approach_germany:0 "Approach Berlin"
 FRW_approach_germany_desc:0 "Doriot believes Europe will be led by the fascist powers and wants France at their side."
 FRW_greater_france_claims:0 "Greater France"
 FRW_greater_france_claims_desc:0 "French is spoken in Romandy and the Valais, and Mussolini covets Nice, Savoy and Corsica. Paris answers with its own map: Romandy, Piedmont and the Aosta Valley, and Sardinia across the strait from Corsica."
 FRW_march_on_brussels:0 "Ultimatum to Geneva"
 FRW_march_on_brussels_desc:0 "Geneva is home to the League of Nations, to political émigrés and to foreign gold hostile to the regime. Doriot has sent his ultimatum once and does not intend to send another."
 FRW_march_on_brussels_tt:0 "War goal §Yannexation§! against §YSwitzerland§! (unless allied).\nAvailable from §YJanuary 1937§!."
 FRW_national_rearmament:0 "National Rearmament"
 FRW_national_rearmament_desc:0 "The government sets out to make the French army the strongest on the continent again."
 FRW_mediterranean_ambition:0 "Master of the Mediterranean"
 FRW_mediterranean_ambition_desc:0 "Toulon, Bizerte, Algiers and Beirut give France harbours on every shore of the Mediterranean. Rome is expected to accept French primacy at sea, as a partner under La Rocque or as a defeated rival under Doriot."
 FRW_mediterranean_ambition_tt:0 "If §YJacques Doriot§! leads France: §Yclaims§! on §YTripolitania§! and the §YFezzan§!."
 FRW_french_state_youth:0 "The National Youth"
 FRW_french_state_youth_desc:0 "Schools and youth groups are brought under state control and taught to serve the nation."
 FRW_french_imperium:0 "The Imperial Mission"
 FRW_french_imperium_desc:0 "From Dakar to Hanoi, the empire answers to Paris alone."
 FRW_nouvel_ordre:0 "Leadership of Latin Europe"
 FRW_nouvel_ordre_desc:0 "Rome, Madrid and Lisbon look to Paris for leadership. France proposes a bloc of the Latin nations under its guidance."
 FRW_nouvel_ordre_tt:0 "War goal §Ypuppet§! against §YSpain§! and §YPortugal§! (unless they are French subjects or allies).\nForms the §YLatin Empire§!: new name and flag, national spirit and §Gcores on the lands of Italy, Spain and Portugal§! that France owns (also on any it gains later there) and §Yclaims§! on the rest.\nReplaces any nation France has formed before (its formable spirit is removed). If France is already the §YEternal Kingdom of Francia§!, it stays that.\nRequires control of §YItaly§!, §YSpain§! and §YPortugal§! (annexed or as puppets, unless stated otherwise). If France does not control them yet, the nation is founded automatically as soon as it does."
 FRW_african_empire_fascist:0 "The Tunisian Question"
 FRW_african_empire_fascist_desc:0 "In November 1938 Italian deputies shouted 'Tunisi, Corsica, Nizza!' in the Chamber in Rome. The reply from Paris is concrete, and the Mareth Line in southern Tunisia will be held."
 FRW_corporative_chambers:0 "The Corporative Chambers"
 FRW_corporative_chambers_desc:0 "Chambers of employers and workers take over the Senate's role in economic legislation."
 FRW_volontaires_nationaux:0 "The National Volunteers"
 FRW_volontaires_nationaux_desc:0 "The Volontaires Nationaux, the youth wing of the PSF, are trained as a disciplined national reserve."
 FRW_volontaires_nationaux_tt:0 "Requires §YJean Ybarnégaray§! as political advisor (decision §YAppoint Jean Ybarnégaray§! in the §YCouncil of Ministers§!, department §YPolitics§!)."
 FRW_social_catholicism:0 "Social Catholicism"
 FRW_social_catholicism_desc:0 "Charity, family allowances and Catholic trade unions are the PSF's remedy for class conflict."
 FRW_friendship_with_lisbon:0 "Friendship with Lisbon and Madrid"
 FRW_friendship_with_lisbon_desc:0 "Salazar has ruled Portugal since 1932 without seeking war. La Rocque points to the Estado Novo as proof that order and peace can go together."
 FRW_french_social_state:0 "The French Social State"
 FRW_french_social_state_desc:0 "La Rocque promises a France built on work, family and Catholic faith, governed in order and at peace with itself."
 FRW_purge_the_reds:0 "Purge the Reds"
 FRW_purge_the_reds_desc:0 "Doriot was once the Communist mayor of Saint-Denis. He knows his former comrades by name and now has the police to arrest them."
 FRW_purge_the_reds_tt:0 "Communist popularity: §R-10%§!"
 FRW_anti_bolshevik_crusade:0 "The Anti-Bolshevik Crusade"
 FRW_anti_bolshevik_crusade_desc:0 "Doriot calls on the nations of Europe to unite against Moscow."
 FRW_party_militia:0 "The Party Militia"
 FRW_party_militia_desc:0 "The service d'ordre of the PPF is armed and becomes the guard of the regime."
 FRW_pact_with_berlin:0 "The Pact with Berlin"
 FRW_pact_with_berlin_desc:0 "Twice in seventy years France and Germany went to war. Paris now asks to join the German alliance."
 FRW_pact_with_berlin_tt:0 "Asks §YGermany§! to let France join its faction (if Germany is fascist and leads one)."
 FRW_cult_of_the_chef:0 "The Cult of the Leader"
 FRW_cult_of_the_chef_desc:0 "A portrait of Doriot hangs in every town hall. Party and state are directed by the Chef alone."
 FRW_seize_libya:0 "Seize Libya"
 FRW_seize_libya_desc:0 "Tripoli and the Fezzan would link Tunisia with French West and Equatorial Africa. Italy is to be made to give them up."
 FRW_swiss_protectorate:0 "Mare Nostrum"
 FRW_swiss_protectorate_desc:0 "Mussolini calls the Mediterranean «mare nostrum». Paris disagrees, and Toulon, Bizerte and Mers-el-Kébir are fitted out as bases for a fleet able to control it."
 FRW_demand_spanish_morocco:0 "Demand the Fezzan"
 FRW_demand_spanish_morocco_desc:0 "Under the Laval-Mussolini accords of January 1935 France promised Italy a strip of the Sahara. The new government repudiates them and demands the Fezzan instead."
 FRW_above_the_parties:0 "Above the Parties"
 FRW_above_the_parties_desc:0 "Many in France have lost faith in the Communists, the fascist leagues and a parliament stained by scandal. They want a firm hand at the top."
 FRW_truce_national_concord:0 "The Party Truce"
 FRW_truce_national_concord_desc:0 "After the riots of February 1934, Gaston Doumergue governed with ministers from every camp under a truce of the parties. It is time to call one again."
 FRW_truce_national_concord_tt:0 "Protects France from the §Rcommunist uprising§! that low stability would otherwise trigger.\nEnds the §YStrike Wave§!.\nBecomes available in §YJune 1936§!."
 FRW_suspend_the_chambers:0 "Adjourn the Chambers"
 FRW_suspend_the_chambers_desc:0 "President Lebrun refuses to appoint yet another cabinet. The Chamber of Deputies and the Senate are adjourned indefinitely."
 FRW_suspend_the_chambers_tt:0 "§YDisjointed Government§! becomes §YA Fragile Government§!. Two decisions (from 1937 and 1938, each at least 6 months apart) remove it completely.\nThe Chambers are sent home. Nobody knows what fills such a silence..."
 FRW_etat_francais:0 "The French State"
 FRW_etat_francais_desc:0 "Marshal Pétain, the victor of Verdun in 1916, takes power as Head of State."
 FRW_etat_francais_tt:0 "Requires the support of §YMarshal Pétain§! (decision §YWin Over Marshal Pétain§!, 45 days)."
 FRW_return_to_the_land:0 "Return to the Land"
 FRW_return_to_the_land_desc:0 "«La terre, elle, ne ment pas.» The regime looks to the peasantry to renew France."
 FRW_fortress_france:0 "Fortress France"
 FRW_fortress_france_desc:0 "At Verdun in 1916 Pétain learned that firepower decides battles. He plans the defence of France accordingly. The veterans of 1914-1918 are gathered into one Legion and become the main support of the regime."
 FRW_corporation_paysanne:0 "The Peasant Corporation"
 FRW_corporation_paysanne_desc:0 "A national peasant corporation is set up to organise farming and secure the food supply."
 FRW_weygand_staff:0 "General Weygand's Staff"
 FRW_weygand_staff_desc:0 "General Weygand revises the army's defensive doctrine and modernises its equipment."
 FRW_armee_d_afrique:0 "The Army of Africa"
 FRW_armee_d_afrique_desc:0 "The divisions of the Armée d'Afrique in Algeria, Morocco and Tunisia become the strategic reserve of the empire."
 FRW_armed_neutrality:0 "Armed Neutrality"
 FRW_armed_neutrality_desc:0 "France declares it will join no foreign war. Any attack on its territory will be met with force."
 FRW_redoubt_of_the_empire:0 "The Redoubt of the Empire"
 FRW_redoubt_of_the_empire_desc:0 "Plans are drawn up to carry on the war from Algiers should metropolitan France be overrun."
 FRW_charte_du_travail:0 "The Labour Charter"
 FRW_charte_du_travail_desc:0 "Strikes and lockouts are banned. Mixed committees of employers and workers settle disputes in every trade."
 FRW_charte_du_travail_tt:0 "Requires §YJean Bichelonne§! as political advisor (decision §YAppoint Jean Bichelonne§! in the §YCouncil of Ministers§!, department §YEconomy§!)."
 FRW_chantiers_de_jeunesse:0 "Youth Work Camps"
 FRW_chantiers_de_jeunesse_desc:0 "Every young man of twenty spends eight months in the camps, felling timber and learning drill."
 FRW_cult_of_the_marshal:0 "Marshal, Here We Are!"
 FRW_cult_of_the_marshal_desc:0 "Schoolchildren learn to sing «Maréchal, nous voilà». In many town halls his portrait now hangs where the bust of Marianne stood."
 FRW_darlan_admiralty:0 "Darlan at the Admiralty"
 FRW_darlan_admiralty_desc:0 "Admiral Darlan keeps the fleet intact. For a neutral France it is the strongest bargaining card."
 FRW_unconquerable_france:0 "Unconquerable France"
 FRW_unconquerable_france_desc:0 "The defences run from the Maginot Line to the passes of the Atlas. An invader would pay heavily for every metre."
 FRW_order_in_the_rif:0 "Order in the Rif"
 FRW_order_in_the_rif_desc:0 "In 1925 Pétain took command against Abd el-Krim and ended the Rif War. Spain has never held the region firmly, and France now offers to do it."
 FRW_latin_neutral_bloc:0 "The Latin Neutral Bloc"
 FRW_latin_neutral_bloc_desc:0 "Franco, Salazar and the Swiss Federal Council share the Marshal's aim of staying out of the next war. Acting together, they may succeed."
 FRW_latin_neutral_bloc_tt:0 "Founds the §YLatin Neutral Bloc§! (if France is in no faction) and, if France leads its faction, invites §YSpain§!, §YPortugal§! and §YSwitzerland§!."
 FRW_empire_stands_guard:0 "The Empire Stands Guard"
 FRW_empire_stands_guard_desc:0 "Weygand inspects the garrisons from Dakar to Beirut. The colonial army is ordered to be ready for an attack from either camp."
 FRW_marshals_peace:0 "The Marshal's Peace"
 FRW_marshals_peace_desc:0 "While the great powers wear each other down, France rebuilds behind its frontiers. The Marshal has promised that no Frenchman will die for Danzig or for Moscow."
 FRW_orleanist_restoration:0 "The Orléanist Restoration"
 FRW_orleanist_restoration_desc:0 "Henri d'Orléans, Count of Paris, returns from exile and is proclaimed King Henri VI."
 FRW_orleanist_restoration_tt:0 "Requires the support of §Ythe Count of Paris§! (decision §YWin Over the Count of Paris§!, 45 days)."
 FRW_charter_of_1830:0 "Renew the Charter"
 FRW_charter_of_1830_desc:0 "A new constitution on the model of the Charter of 1830 ties the crown to the propertied classes."
 FRW_royal_diplomacy:0 "Royal Diplomacy"
 FRW_royal_diplomacy_desc:0 "The House of Orléans is related by marriage to many of the reigning families of Europe."
 FRW_action_francaise_ministers:0 "Ministers from the Action Française"
 FRW_action_francaise_ministers_desc:0 "For the first time, members of Charles Maurras's Action Française enter the government."
 FRW_royal_army:0 "The Royal Army"
 FRW_royal_army_desc:0 "The officers swear an oath to the King. In return they receive the funds the Republic withheld."
 FRW_parliamentary_monarchy:0 "Parliamentary Monarchy"
 FRW_parliamentary_monarchy_desc:0 "On the British model, the King reigns while his ministers govern."
 FRW_absolute_crown:0 "The Crown Rules"
 FRW_absolute_crown_desc:0 "Henri VI governs in person, relying on the army and the Church for support."
 FRW_crown_of_the_franks:0 "The Legacy of Charlemagne"
 FRW_crown_of_the_franks_desc:0 "Wallonia and Luxembourg were once held by the French crown, and Charlemagne kept his court at Aachen."
 FRW_crown_of_the_franks_tt:0 "War goal against §YGermany§! for the §YRhineland§! and §YMoselland§! (unless France already owns them).\nForms the §YFrankish Empire§!: new name and flag, national spirit and §Gcores on the lands of the Low Countries, the Rhineland, Switzerland and northern Italy§! that France owns (also on any it gains later there) and §Yclaims§! on the rest.\nReplaces any nation France has formed before (its formable spirit is removed). If France is already the §YEternal Kingdom of Francia§!, it stays that.\nRequires control of the §YRhineland§!, §YMoselland§!, §YBelgium§! and the §YNetherlands§! (annexed or as puppets, unless stated otherwise). If France does not control them yet, the nation is founded automatically as soon as it does."
 FRW_catholic_revival:0 "Catholic Revival"
 FRW_catholic_revival_desc:0 "The Church gives its blessing to the restored monarchy."
 FRW_holy_alliance:0 "A New Holy Alliance"
 FRW_holy_alliance_desc:0 "The monarchies of Europe join in a league against revolution and war."
 FRW_holy_alliance_tt:0 "Founds the §YHoly Alliance§! faction."
 FRW_kings_government:0 "The King's Government"
 FRW_kings_government_desc:0 "The King appoints a cabinet of national concord, which the Chamber then confirms. The Académie des Sciences finds a generous patron in the new King."
 FRW_conseil_du_roi:0 "The King's Council"
 FRW_conseil_du_roi_desc:0 "As Louis XIV did, the King governs with a small council of trusted advisers."
 FRW_provinces_restored:0 "Restore the Provinces"
 FRW_provinces_restored_desc:0 "The départements created in 1790 give way once more to the historic provinces such as Normandy and Brittany."
 FRW_most_christian_king:0 "The Most Christian King"
 FRW_most_christian_king_desc:0 "Henri VI is anointed in Reims Cathedral, where French kings were crowned for centuries."
 FRW_belgian_crown:0 "The King's Navy"
 FRW_belgian_crown_desc:0 "The navy has long been the most royalist service in France. Under the fleur-de-lis it is to regain its old prestige."
 FRW_luxembourg_protectorate:0 "The Royal Academies"
 FRW_luxembourg_protectorate_desc:0 "Louis XIV founded the Académie des sciences in 1666. The crown means to be its patron once again."
 FRW_bonapartist_appeal:0 "The Call of the Eagle"
 FRW_bonapartist_appeal_desc:0 "Bonapartist committees call for the return of Prince Louis Napoléon."
 FRW_bonapartist_appeal_tt:0 "Requires the support of §YPrince Louis Napoléon§! (decision §YWin Over Prince Louis Napoléon§!, 45 days)."
 FRW_proclaim_the_empire:0 "Proclaim the Empire"
 FRW_proclaim_the_empire_desc:0 "Louis Napoléon is crowned in Notre-Dame as Napoléon VI, Emperor of the French."
 FRW_code_napoleon:0 "A New Napoleonic Code"
 FRW_code_napoleon_desc:0 "Law and administration are made uniform on the model of the First Empire."
 FRW_imperial_guard:0 "The Imperial Guard"
 FRW_imperial_guard_desc:0 "As under the First Empire, the best soldiers in France are picked for the Emperor's Guard."
 FRW_grande_armee_reborn:0 "The Grand Army Reborn"
 FRW_grande_armee_reborn_desc:0 "The staff studies Austerlitz and Jena and adapts their rapid manoeuvres and concentrated blows to tanks and aircraft."
 FRW_marshals_of_the_empire:0 "The Marshals of the Empire"
 FRW_marshals_of_the_empire_desc:0 "Promotion goes by merit again, and any private may hope to carry a marshal's baton in his knapsack."
 FRW_marshals_of_the_empire_tt:0 "§YPrince Louis Napoléon§! takes the field himself as a §Yfield marshal§! (Offensive Doctrine)."
 FRW_continental_system:0 "The Continental System"
 FRW_continental_system_desc:0 "France sets up a closed European trading area under its own direction."
 FRW_continental_system_tt:0 "Founds the §YContinental System§! faction (if France is in no faction) and invites §YPoland§! and §YDenmark§!, the old allies of the Emperor."
 FRW_imperial_university:0 "The Imperial University"
 FRW_imperial_university_desc:0 "The Grandes Écoles are put to work training the engineers and officials of the Empire."
 FRW_imperial_university_tt:0 "Unlocks the political advisor §YFrédéric Joliot-Curie§! (Director of Imperial Science: research speed §G+15%§!, 150 political power)."
 FRW_natural_borders:0 "The Natural Borders"
 FRW_natural_borders_desc:0 "The Rhine and the Pyrenees mark the natural frontiers of France, as the Revolution once claimed."
 FRW_hundred_days_spirit:0 "The Spirit of the Hundred Days"
 FRW_hundred_days_spirit_desc:0 "In 1815 Napoleon promised that the eagle would fly from steeple to steeple to the towers of Notre-Dame. His heir repeats the words."
 FRW_kingdom_of_holland:0 "The Kingdom of Holland"
 FRW_kingdom_of_holland_desc:0 "Louis Bonaparte was King of Holland from 1806 to 1810. The Netherlands are to become a client kingdom of the Empire again."
 FRW_kingdom_of_holland_tt:0 "War goal §Ypuppet§! against the §YNetherlands§! (if independent and not allied)."
 FRW_rhine_confederation:0 "The Confederation of the Rhine"
 FRW_rhine_confederation_desc:0 "The left bank of the Rhine and Baden are placed under the Emperor's protection once more."
 FRW_rhine_confederation_tt:0 "War goal against §YGermany§! for §YMoselland§!, §YRhineland§! and §YBaden§! (unless allied)."
 FRW_kingdom_of_italy_napoleon:0 "The Kingdom of Italy"
 FRW_kingdom_of_italy_napoleon_desc:0 "Piedmont was a French département under the First Empire, and Milan the capital of Napoleon's Kingdom of Italy. His heir means to restore both."
 FRW_kingdom_of_italy_napoleon_tt:0 "War goal against §YItaly§! for §YPiedmont§! (unless allied)."
 FRW_grand_empire:0 "The Grand Empire"
 FRW_grand_empire_desc:0 "The Empire of the French once reached from Hamburg to Rome. Napoléon VI sets out to rebuild it."
 FRW_grand_empire_tt:0 "Forms the §YGrand French Empire§!: new name, imperial flag, dark blue map colour, national spirit and §Gcores on the lands of the Low Countries, the Rhineland, Switzerland, northern Italy, Sardinia and Catalonia§! that France owns (also on any it gains later there) and §Yclaims§! on the rest.\nReplaces any nation France has formed before (its formable spirit is removed). If France is already the §YEternal Kingdom of Francia§!, it stays that.\nRequires control of the §YRhine§! (Rhineland, Moselland), §YPiedmont§!, §YBelgium§! and the §YNetherlands§! (annexed or as puppets, unless stated otherwise). If France does not control them yet, the nation is founded automatically as soon as it does."
 FRW_iron_crown:0 "The Iron Crown"
 FRW_iron_crown_desc:0 "Napoleon was crowned with the Iron Crown of Lombardy in Milan in 1805. His heir intends to wear it too."
 FRW_legion_of_honour:0 "The Legion of Honour"
 FRW_legion_of_honour_desc:0 "Like the first Napoleon, the Emperor rewards courage in the field with the Légion d'honneur."
 FRW_imperial_navy:0 "The Imperial Navy"
 FRW_imperial_navy_desc:0 "The defeat at Trafalgar in 1805 has never been avenged. The Empire orders a fleet to match its ambitions."
 FRW_emperor_of_the_west:0 "Emperor of the West"
 FRW_emperor_of_the_west_desc:0 "The Emperor's writ now runs from the Atlantic to the Elbe and from the North Sea to the Tiber, under a single code of law."
 FRW_act_of_mediation:0 "The Act of Mediation"
 FRW_act_of_mediation_desc:0 "In 1803 Napoleon gave the Swiss a constitution and his protection. His heir renews the arrangement."
 FRW_duchy_of_warsaw:0 "The Duchy of Warsaw"
 FRW_duchy_of_warsaw_desc:0 "Polish lancers followed Napoleon from Madrid to Moscow. Poland is once more to be the Empire's outpost in the East."
 FRW_egyptian_campaign:0 "The Egyptian Campaign"
 FRW_egyptian_campaign_desc:0 "Bonaparte led his army to the pyramids in 1798. His heir has his eye on the Suez Canal."
 FRW_egyptian_campaign_tt:0 "Claims on §YCairo§!, §YAlexandria§! and the §YSuez§! area, and a war goal against whoever holds Alexandria (Egypt or Britain)."
 FRW_road_to_moscow:0 "The Road to Moscow"
 FRW_road_to_moscow_desc:0 "The campaign of 1812 ended in the snow. This time the Grande Armée has tanks, and Warsaw is already an ally."
 FRW_road_to_moscow_tt:0 "Claims on §YMinsk§!, §YVitebsk§!, §YSmolensk§! and §YMoscow§! and a war goal against the §YSoviet Union§!."
 FRW_continental_empire:0 "The Continental Empire"
 FRW_continental_empire_desc:0 "The dynasty now rules from Cadiz to the Nile and from the Channel to the Vistula."
 FRW_legitimate_heir:0 "The Legitimate Heir"
 FRW_legitimate_heir_desc:0 "For the Legitimists the Orléans are usurpers. The rightful king is the senior heir of Louis XIV: Alfonso of Bourbon, the exiled King of Spain, whom they call Alphonse I."
 FRW_legitimate_heir_tt:0 "§YAlfonso of Bourbon§! (after his death in 1941: his son §YJacques II§!) becomes King of France. The Legitimists form the government.\nRequires the support of §YAlfonso of Bourbon§! (decision §YWin Over Alfonso of Bourbon§!, 45 days)."
 FRW_white_flag:0 "The White Flag"
 FRW_white_flag_desc:0 "Henri V refused the throne in 1873 rather than accept the tricolour. His heirs bring back the white banner of the Bourbons, at least on the palace roofs."
 FRW_spanish_bourbons:0 "The Bourbons of Madrid"
 FRW_spanish_bourbons_desc:0 "The new king is also the exiled King of Spain. Monarchists on both sides of the Pyrenees look to Paris."
 FRW_spanish_bourbons_tt:0 "Every Spanish faction of a civil war also gains §YTies to the French Crown§!."
 FRW_requetes:0 "The Requetés of Navarre"
 FRW_requetes_desc:0 "Carlist volunteers in red berets cross the Pyrenees to serve the king. They are devout, disciplined and eager to fight."
 FRW_secure_crown_of_spain:0 "Secure the Crown of Spain"
 FRW_secure_crown_of_spain_desc:0 "Alfonso left Madrid in 1931 without abdicating. Paris asks Spain to take back its king, peacefully if it can."
 FRW_secure_crown_of_spain_tt:0 "If Spain is in a civil war: war goal §Ypuppet§! against every Spanish side not allied with France.\nOtherwise §YSpain§! is asked to accept the King of France as its own king (becomes a French puppet). A refusal gives France a war goal."
 FRW_unite_the_crowns:0 "Unite the Crowns"
 FRW_unite_the_crowns_desc:0 "Philip V had to renounce the French throne in 1713 so that the two crowns would never be joined. The Treaty of Utrecht is a dead letter now, and France and Spain become one kingdom."
 FRW_unite_the_crowns_tt:0 "Annexes every Spanish puppet of France.\nForms the §YBourbon Kingdom of France and Spain§!: new name and flag, national spirit §YThe Double Monarchy§! and §Gcores on the lands of Spain§! that France owns (also on any it gains later there) and §Yclaims§! on the rest.\nReplaces any nation France has formed before. Requires control of §YMadrid§! (annexed or as a puppet); if France does not control it yet, the kingdom is founded as soon as it does."
 FRW_two_crowns:0 "Two Countries, Two Crowns"
 FRW_two_crowns_desc:0 "One king, two kingdoms: France and Spain keep their own governments and armies but stand together under the House of Bourbon."
 FRW_two_crowns_tt:0 "Spain becomes independent again (if it was a French puppet) and joins France in the §YBourbon Family Pact§!. Both kingdoms keep their own governments."
 FRW_no_more_pyrenees:0 "There Are No More Pyrenees"
 FRW_no_more_pyrenees_desc:0 "«Il n'y a plus de Pyrénées», Louis XIV is said to have remarked when his grandson became King of Spain. Roads, railways and tariffs now treat the mountains as if they were not there."
 FRW_no_more_pyrenees_tt:0 "Spain, if it stands with France: §YBourbon Partner§! (+5% factory output, +5% stability)."
 FRW_catholic_kings:0 "The Most Catholic Kings"
 FRW_catholic_kings_desc:0 "The Church regains its schools and its seats on the councils of state. In return the bishops of both kingdoms preach loyalty to the crown."
 FRW_portuguese_alliance:0 "An Offer to Lisbon"
 FRW_portuguese_alliance_desc:0 "Lisbon alone stands apart on the peninsula. Paris and Madrid offer Salazar a place under the Bourbon crown, and they will not wait long for an answer."
 FRW_heirs_of_louis_xiv:0 "The Heirs of Louis XIV"
 FRW_heirs_of_louis_xiv_desc:0 "For the first time since the Sun King, a Bourbon rules from the Channel to Gibraltar. The courtiers speak of a new Grand Siècle."
 FRW_rock_of_gibraltar:0 "The Rock of Gibraltar"
 FRW_rock_of_gibraltar_desc:0 "Spain lost Gibraltar to the British in 1704, fighting for the claim of Philip of Anjou, the first Bourbon King of Spain. His heirs now rule in Paris and Madrid, and they want the Rock back."
 FRW_rock_of_gibraltar_tt:0 "War goal against §YBritain§! for §YGibraltar§! (unless Britain is an ally)."
 FRW_two_sicilies:0 "The Crown of the Two Sicilies"
 FRW_two_sicilies_desc:0 "Until 1861 a Bourbon king ruled in Naples and Palermo. The Savoyards took his kingdom by force, and the senior Bourbon now claims it as his family's inheritance."
 FRW_two_sicilies_tt:0 "War goal against §YItaly§! for §YCampania, Sicily, Calabria and Apulia§! (unless Italy is an ally)."
 FRW_family_compact_fleet:0 "The Fleet of the Family Compact"
 FRW_family_compact_fleet_desc:0 "In 1761 the Bourbon kings of France and Spain joined their fleets against Britain. Brest, Toulon, Ferrol and Cartagena now build for one navy again."
 FRW_family_compact_fleet_tt:0 "If France owns §YGalicia§! (Ferrol) and §YMurcia§! (Cartagena): §G+2§! dockyards in each."
 FRW_house_of_parma:0 "The House of Bourbon-Parma"
 FRW_house_of_parma_desc:0 "Prince Félix of Bourbon-Parma is the husband of the Grand Duchess of Luxembourg, and Parma itself was a Bourbon duchy until 1859. Both are asked to come home to the family."
 FRW_nec_pluribus_impar:0 "Nec Pluribus Impar"
 FRW_nec_pluribus_impar_desc:0 "„Not unequal to many“ was the motto of Louis XIV. From the Channel to Sicily, the House of Bourbon is again a match for any coalition Europe can raise against it."
 FRW_nec_pluribus_impar_tt:0 "§YLe Grand Siècle§! becomes §YNec Pluribus Impar§!."
 FRW_devalue_the_franc:0 "Devalue the Franc"
 FRW_devalue_the_franc_desc:0 "France can no longer hold the gold bloc together. A devaluation should make French exports competitive again."
 FRW_econ_dirigisme:0 "The Directed Economy"
 FRW_econ_dirigisme_desc:0 "From the nationalisations of the Popular Front to the planning offices of later governments, French ministers of every party have trusted Paris to direct the economy. Credit, investment and output will follow plans drawn up by the state."
 FRW_econ_dirigisme_tt:0 "Chooses the §YDirected Economy§! as France's economic model. Its spirit grows stronger with §YIndustrial Cartels§! and §YEconomic Independence§!."
 FRW_econ_liberal:0 "Economic Liberalism"
 FRW_econ_liberal_desc:0 "The ironmasters of the Comité des Forges want the franc freed from controls and the markets left to themselves. Give them a free hand, they say, and the factories will grow."
 FRW_econ_liberal_tt:0 "Chooses §YEconomic Liberalism§! as France's economic model (not for communists). Its spirit grows stronger with §YIndustrial Cartels§! and §YEconomic Independence§!."
 FRW_econ_rearmament:0 "Rearmament First"
 FRW_econ_rearmament_desc:0 "Germany's factories have been working for the army since 1935. Paris now follows suit, and the budget for the arsenals comes before everything else."
 FRW_econ_rearmament_tt:0 "Chooses §YRearmament First§! as France's economic model. Its spirit grows stronger with §YIndustrial Cartels§! and §YEconomic Independence§!."
 FRW_economic_plan:0 "The Economic Plan"
 FRW_economic_plan_desc:0 "Whichever course the government takes, it must decide what is to be built, where, and who will pay for it."
 FRW_public_works:0 "Great Public Works"
 FRW_public_works_desc:0 "Roads, bridges and harbours are put out to contract, giving work to the unemployed and leaving the country better equipped."
 FRW_rationalize_industry:0 "Rationalise Industry"
 FRW_rationalize_industry_desc:0 "Many French firms are still small family businesses with old machinery. Mergers and modern production methods are encouraged."
 FRW_rationalize_industry_tt:0 "If France still suffers from §YInefficient Economy§!, it is reduced by one level."
 FRW_reform_banque_de_france:0 "Reform the Banque de France"
 FRW_reform_banque_de_france_desc:0 "The 200 largest shareholders lose their hold on the Banque de France, whose council is now largely appointed by the state."
 FRW_autoroutes_nationales:0 "The National Roads"
 FRW_autoroutes_nationales_desc:0 "The old Routes Nationales are widened, resurfaced and linked up. Lorries and army convoys can now cross the country in hours rather than days."
 FRW_sncf_modernization:0 "Found the SNCF"
 FRW_sncf_modernization_desc:0 "On 1 January 1938 the great private railway companies are merged into the Société Nationale des Chemins de fer Français."
 FRW_modern_management:0 "Scientific Management"
 FRW_modern_management_desc:0 "Trained engineers take over boardrooms long run by founding families, and French industry starts to count its costs."
 FRW_modern_management_tt:0 "Removes §YInefficient Economy§! completely.\nRequires every focus of the row above it and an industry of at least §Y40§! civilian and §Y25§! military factories.\nEvery lower focus of the economy tree builds on it."
 FRW_industrial_cartels:0 "Industrial Cartels"
 FRW_industrial_cartels_desc:0 "Committees for each branch of industry share out raw materials and agree on investment."
 FRW_industrial_cartels_tt:0 "Upgrades the spirit of your chosen §Yeconomic model§! to the next level."
 FRW_hydroelectric_alps:0 "Alpine Hydroelectricity"
 FRW_hydroelectric_alps_desc:0 "Dams on the Rhône and in the Alpine valleys supply cheap power to new factories."
 FRW_electrification:0 "Electrification"
 FRW_electrification_desc:0 "Power stations on the Rhône and the Rhine carry current to the remotest farms of the Massif Central. New industry settles along the lines."
 FRW_lorraine_steel:0 "Lorraine Steel"
 FRW_lorraine_steel_desc:0 "New mining and smelting methods make better use of the low-grade minette ore of Lorraine."
 FRW_heavy_industry_nord:0 "Heavy Industry in the North"
 FRW_heavy_industry_nord_desc:0 "Pits and steelworks in the Nord and Pas-de-Calais are enlarged."
 FRW_renault_and_citroen:0 "Renault and Citroën"
 FRW_renault_and_citroen_desc:0 "Renault and Citroën turn their assembly lines over to lorries, tractors and armoured vehicles."
 FRW_research_institutes:0 "Found the CNRS"
 FRW_research_institutes_desc:0 "The new Centre National de la Recherche Scientifique brings the country's laboratories under one administration."
 FRW_bauxite_provence:0 "Bauxite of Provence"
 FRW_bauxite_provence_desc:0 "Bauxite, named after Les Baux in Provence, is mined there for the aluminium that aircraft builders need."
 FRW_rearmament_plan:0 "The 1936 Rearmament Programme"
 FRW_rearmament_plan_desc:0 "Fourteen billion francs are voted for four years of rearmament. Renault will build tanks, Schneider guns and Dewoitine aircraft."
 FRW_rearmament_plan_tt:0 "Requires §YRaoul Dautry§! as political advisor (decision §YAppoint Raoul Dautry§! in the §YCouncil of Ministers§!, department §YEconomy§!)."
 FRW_aviation_industry:0 "Reorganise the Aircraft Industry"
 FRW_aviation_industry_desc:0 "Aircraft factories are taken over by the state and grouped into regional SNCA companies."
 FRW_atomic_research:0 "The Joliot-Curie Laboratory"
 FRW_atomic_research_desc:0 "Frédéric and Irène Joliot-Curie, Nobel laureates in 1935, stand at the front of nuclear research."
 FRW_ecole_polytechnique:0 "Expand the Grandes Écoles"
 FRW_ecole_polytechnique_desc:0 "Polytechnique, Centrale and the École des Mines double their intake. Their graduates will design the country's weapons and run its factories."
 FRW_iraqi_oil:0 "The Mosul Oil Concession"
 FRW_iraqi_oil_desc:0 "Through the Compagnie Française des Pétroles, France owns almost a quarter of the Iraq Petroleum Company. Crude from Kirkuk reaches Tripoli by pipeline and is shipped on to refineries near Marseille."
 FRW_dockyards_brest:0 "The Arsenals of Brest"
 FRW_dockyards_brest_desc:0 "The arsenals of Brest and Lorient receive new machinery and new slipways. Ships for the Atlantic fleet will be built here."
 FRW_consumer_economy:0 "The Consumer Goods Industry"
 FRW_consumer_economy_desc:0 "More middle-class households can afford a refrigerator, a wireless set or a motor car."
 FRW_thomson_electronics:0 "The Radio Industry"
 FRW_thomson_electronics_desc:0 "Thomson-Houston, SFR and the Laboratoire Central des Télécommunications receive state contracts for radio and early radar sets."
 FRW_war_economy:0 "The War Economy"
 FRW_war_economy_desc:0 "Factories are prepared for conversion, stocks laid in and labour registered for direction. Should war come, industry will be ready within weeks."
 FRW_dispersed_industry:0 "Decentralise War Industry"
 FRW_dispersed_industry_desc:0 "New plants are built in Toulouse, Bordeaux and Marseille, beyond the range of bombers based in Germany."
 FRW_paris_expo:0 "Paris World Fair 1937"
 FRW_paris_expo_desc:0 "The International Exhibition of 1937 puts French art and engineering on show beside the Seine."
 FRW_economic_modernization:0 "Economic Modernisation"
 FRW_economic_modernization_desc:0 "A broad programme of investment aims to bring French industry up to British and German standards."
 FRW_arsenal_de_la_republique:0 "Arsenal of the Republic"
 FRW_arsenal_de_la_republique_desc:0 "The state arsenals work in shifts around the clock and turn out weapons in quantities never seen in peacetime."
 FRW_strategic_stockpiles:0 "Strategic Stockpiles"
 FRW_strategic_stockpiles_desc:0 "Depots are filled with rifles, shells and spare parts against the day of mobilisation."
 FRW_regional_development:0 "Regional Planning"
 FRW_regional_development_desc:0 "Credit and public works are directed to the neglected departments of central France."
 FRW_war_production_board:0 "Ministry of Armament"
 FRW_war_production_board_desc:0 "Raoul Dautry's Ministry of Armament takes charge of all war production."
 FRW_economic_independence:0 "Economic Independence"
 FRW_economic_independence_desc:0 "France aims to supply its own needs from the soil of the metropole and the empire."
 FRW_economic_independence_tt:0 "Upgrades the spirit of your chosen §Yeconomic model§! by one level (to the final level if §YIndustrial Cartels§! is also completed)."
 FRW_franc_treasury_crisis:0 "The Treasury Crisis"
 FRW_franc_treasury_crisis_desc:0 "The Treasury lives from month to month on advances from the Banque de France. Before any reform can begin, someone must find out how much money the State actually has."
 FRW_franc_treasury_crisis_tt:0 "Inflation: §G-5§!"
 FRW_franc_stabilisation_fund:0 "The Exchange Stabilisation Fund"
 FRW_franc_stabilisation_fund_desc:0 "A fund of gold and foreign currency is set up to defend the franc on the markets, as London and Washington already do. Speculators will have to reckon with the Treasury as well as the Banque de France."
 FRW_franc_stabilisation_fund_tt:0 "Gold reserves: §G+100 t§!\nFrom now on §G+5 t§! of gold per month."
 FRW_franc_defence_bonds:0 "Bonds for National Defence"
 FRW_franc_defence_bonds_desc:0 "The Treasury sells bonds in every post office in France. Savers lend their francs to the State instead of spending them, and the posters promise that every franc buys a shell."
 FRW_franc_defence_bonds_tt:0 "Inflation: §G-8§!"
 FRW_franc_fiscal_reform:0 "The Fiscal Reform"
 FRW_franc_fiscal_reform_desc:0 "Parliament votes new taxes, cuts exemptions and for once passes the budget on time. The deficit shrinks, and so do the advances from the Banque de France."
 FRW_franc_fiscal_reform_tt:0 "From now on inflation falls by another §G0.25§! points per month."
 FRW_franc_safe_havens:0 "Safe Havens for the Gold"
 FRW_franc_safe_havens_desc:0 "Part of the reserves is quietly shipped to vaults in Dakar, Fort-de-France and Ottawa, out of reach of any invader."
 FRW_franc_safe_havens_tt:0 "The gold reserves are safe: if France capitulates, §YFree France§! can still spend them."
 FRW_franc_colonial_gold:0 "The Gold of the Empire"
 FRW_franc_colonial_gold_desc:0 "Geologists and engineers are sent to the gold fields of Guinea and the French Sudan. Output is small, but every ounce is mined inside the franc zone."
 FRW_franc_colonial_gold_tt:0 "Gold reserves: §G+50 t§!\nFrom now on §G+5 t§! of gold per month."
 FRW_franc_strong_franc:0 "A Strong Franc"
 FRW_franc_strong_franc_desc:0 "With a balanced budget and full vaults, the franc holds its value, and capital that fled to London and New York comes home. Credit becomes cheap, and the building sites reopen."
 FRW_franc_strong_franc_tt:0 "Inflation: §G-10§!"
 FRW_franc_war_finance:0 "Financing the War"
 FRW_franc_war_finance_desc:0 "The war will be paid for with taxes, loans and controls rather than with the printing press. Ministers remember what war debts did to the franc after 1918."
 FRW_franc_war_finance_tt:0 "Inflation: §G-8§!\nAvailable only §Yat war§!."
 FRW_lessons_of_verdun:0 "The Lessons of Verdun"
 FRW_lessons_of_verdun_desc:0 "Staff officers study the campaigns of 1914 to 1918 so that the army will not repeat their mistakes."
 FRW_beyond_victory:0 "Overcome the Victor's Complacency"
 FRW_beyond_victory_desc:0 "Victory in 1918 left the army sure of its methods. Its officers must now question them."
 FRW_beyond_victory_tt:0 "The remaining doubts (§YThe Victor's Doubts§!) are only removed by §YA Modern Army§! at the end of the army branch."
 FRW_methodical_battle:0 "The Methodical Battle"
 FRW_methodical_battle_desc:0 "The army fights by careful plan, with massed artillery and a continuous, well-held front."
 FRW_methodical_battle_tt:0 "§YThe Generals of 1918§! weakens to §YA Command in Transition§!. §YReform the General Staff§! removes it."
 FRW_war_of_movement:0 "The War of Movement"
 FRW_war_of_movement_desc:0 "Tanks, lorries and wireless will decide the next war, and it will move fast."
 FRW_war_of_movement_tt:0 "§YThe Generals of 1918§! weakens to §YA Command in Transition§!. §YReform the General Staff§! removes it."
 FRW_maginot_extension:0 "Extend the Maginot Line"
 FRW_maginot_extension_desc:0 "The Maginot Line stops at the Belgian border, as the German staff well knows. New casemates and obstacles will now run from Montmédy to the sea."
 FRW_heavy_artillery:0 "Heavy Artillery"
 FRW_heavy_artillery_desc:0 "Schneider and the Atelier de Puteaux deliver new guns to replace the stocks of the last war."
 FRW_mas_rifles:0 "The MAS-36"
 FRW_mas_rifles_desc:0 "The MAS-36 is shorter and lighter than the old Lebel and quicker to reload. It is to be issued to every infantry regiment."
 FRW_mechanized_divisions:0 "Light Mechanised Divisions"
 FRW_mechanized_divisions_desc:0 "The cavalry forms light mechanised divisions to scout ahead of the army and pursue a beaten enemy. Lorries take over from the horse-drawn columns that still carry the army's supplies."
 FRW_divisions_cuirassees:0 "Armoured Divisions"
 FRW_divisions_cuirassees_desc:0 "Following the ideas of Colonel de Gaulle, tanks are grouped into independent armoured divisions. Work continues on a heavier breakthrough tank to follow the Char B1."
 FRW_chasseurs_alpins:0 "Chasseurs Alpins and Spahis"
 FRW_chasseurs_alpins_desc:0 "The Chasseurs Alpins, the «Blue Devils» of the last war, are counted among the best mountain troops in Europe. All Alpine divisions are to be trained to their standard. The mounted Spahi regiments of North Africa are re-equipped as reconnaissance units."
 FRW_colonial_troops:0 "Colonial Troops"
 FRW_colonial_troops_desc:0 "Senegalese Tirailleurs and North African Spahis are brought in to strengthen the army."
 FRW_general_staff_reform:0 "Reform the General Staff"
 FRW_general_staff_reform_desc:0 "Elderly generals are retired and younger officers are given commands."
 FRW_foreign_legion:0 "The Foreign Legion"
 FRW_foreign_legion_desc:0 "The Foreign Legion, whose motto is Legio Patria Nostra, is enlarged and trained as an elite force."
 FRW_reserve_system:0 "The Reserve System"
 FRW_reserve_system_desc:0 "Reservists are called up for regular training so that they can rejoin their units quickly."
 FRW_reserve_system_tt:0 "Requires §YAlfred Sauvy§! as political advisor (decision §YAppoint Alfred Sauvy§! in the §YCouncil of Ministers§!, department §YEconomy§!)."
 FRW_combined_arms:0 "Combined Arms"
 FRW_combined_arms_desc:0 "Infantry, tanks, artillery and aircraft train together and learn to fight in concert. The 47 mm SA 37 can pierce the armour of any tank now in service in Europe. Each infantry division is to receive enough of them to halt an armoured attack."
 FRW_paratroopers:0 "Paratroopers and Corps Francs"
 FRW_paratroopers_desc:0 "France formed its first parachute companies, the Infanterie de l'Air, in 1937, among the earliest in the world. Small assault detachments are trained for reconnaissance and raids."
 FRW_desert_warfare:0 "Desert Warfare"
 FRW_desert_warfare_desc:0 "Lessons from the campaigns in Morocco and the Sahara are collected and taught."
 FRW_artillery_barrage:0 "The Rolling Barrage"
 FRW_artillery_barrage_desc:0 "Fire planned in detail and tied closely to the infantry remains the basis of French tactics."
 FRW_army_of_the_republic:0 "A Modern Army"
 FRW_army_of_the_republic_desc:0 "Apart from its flags, the army of 1940 has little in common with that of 1918. A joint staff is set up to coordinate the army, the navy and the air force."
 FRW_tank_production_lines:0 "Tank Production Lines"
 FRW_tank_production_lines_desc:0 "New tank assembly lines open at Issy-les-Moulineaux and Vénissieux."
 FRW_darlan_programme:0 "The Darlan Programme"
 FRW_darlan_programme_desc:0 "France has the fourth largest navy in the world, and its ships must be kept up to date. Admiral Darlan, chief of the naval staff from 1937, presses for a fleet able to operate on the high seas."
 FRW_darlan_programme_tt:0 "§YA Divided Fleet§! weakens to §YA Fleet in Reform§!. §YThe Yards of Toulon and Brest§! removes it.\nUnlocks the department §YNavy§! in the §YCouncil of Ministers§!."
 FRW_richelieu_class:0 "The Richelieu Class"
 FRW_richelieu_class_desc:0 "Dunkerque and Strasbourg were only the first of the new battleships. The Richelieu class will be a match for anything Italy or Germany can send to sea. The Richelieu and her sisters will be the most powerful battleships France has ever built."
 FRW_mediterranean_fleet:0 "The Mediterranean Fleet"
 FRW_mediterranean_fleet_desc:0 "French cruisers and large destroyers are among the fastest warships afloat. The sea route to North Africa must be kept open whatever the cost."
 FRW_atlantic_squadrons:0 "The Atlantic Squadrons"
 FRW_atlantic_squadrons_desc:0 "The navy invests heavily in submarines, from the giant Surcouf to small coastal boats. Brest is made the main base of the Atlantic fleet."
 FRW_carrier_programme:0 "The Carrier Programme"
 FRW_carrier_programme_desc:0 "The old Béarn is the navy's only carrier and is too slow for modern operations. The new Joffre class will give the fleet aircraft of its own."
 FRW_naval_aviation:0 "Naval Aviation"
 FRW_naval_aviation_desc:0 "The Aéronavale receives its own aircraft, pilots and air stations. Torpedo bombers and scouting planes will search and strike for the fleet."
 FRW_toulon_brest_yards:0 "The Yards of Toulon and Brest"
 FRW_toulon_brest_yards_desc:0 "New dry docks are built at Toulon and Brest for the next generation of warships."
 FRW_convoy_escorts:0 "Convoy Escorts"
 FRW_convoy_escorts_desc:0 "Avisos and corvettes escort shipping on the routes to the colonies."
 FRW_coastal_defence:0 "Coastal Defence"
 FRW_coastal_defence_desc:0 "The Fusiliers Marins, remembered for their stand at Dixmude in 1914, are rebuilt as a modern landing force. Coastal batteries and minefields protect the ports of France and the empire."
 FRW_fleet_in_being:0 "A Balanced Fleet"
 FRW_fleet_in_being_desc:0 "Battleships, cruisers, destroyers and submarines are built in balanced numbers, so that the fleet can operate in any sea."
 FRW_naval_treaties_end:0 "Farewell to the Naval Treaties"
 FRW_naval_treaties_end_desc:0 "France no longer considers itself bound by the Washington and London naval treaties."
 FRW_plan_v:0 "Plan V"
 FRW_plan_v_desc:0 "The Armée de l'Air has been a separate service only since 1934. Plan V calls for 2,400 modern aircraft."
 FRW_plan_v_tt:0 "§YAn Obsolete Air Force§! weakens to §YAn Air Force in Transition§!. §YFlight Schools§! removes it.\nUnlocks the department §YAir Force§! in the §YCouncil of Ministers§!."
 FRW_dewoitine_fighters:0 "Dewoitine Fighters"
 FRW_dewoitine_fighters_desc:0 "The Dewoitine D.520 is meant to hold its own against any fighter it meets."
 FRW_bomber_command:0 "The Bomber Force"
 FRW_bomber_command_desc:0 "Squadrons are re-equipped with modern twin-engined bombers such as the LeO 45."
 FRW_air_doctrine:0 "Air Doctrine"
 FRW_air_doctrine_desc:0 "The staff sets down in writing what the air force is to do in a future war."
 FRW_colonial_air_bases:0 "Air Bases in the Empire"
 FRW_colonial_air_bases_desc:0 "Airfields in North Africa extend air cover over the western Mediterranean."
 FRW_close_air_support:0 "Close Air Support"
 FRW_close_air_support_desc:0 "Dive bombers and ground-attack aircraft will be sent wherever the infantry calls for them. For the first time, the Armée de l'Air trains seriously with the army."
 FRW_air_defence_paris:0 "Air Defence of Paris"
 FRW_air_defence_paris_desc:0 "Anti-aircraft guns and sound locators ring the capital."
 FRW_pilot_schools:0 "Flight Schools"
 FRW_pilot_schools_desc:0 "New flying schools at Istres and Salon-de-Provence train several hundred pilots a year, while Pierre Cot's Aviation Populaire teaches young men to fly at local clubs."
 FRW_jet_research:0 "Jet Engines"
 FRW_jet_research_desc:0 "The engineer René Leduc works on a ramjet engine."
 FRW_strategic_air_force:0 "Strategic Air Force"
 FRW_strategic_air_force_desc:0 "Four-engined bombers are ordered to strike factories, railways and ports far behind the enemy lines."
 FRW_strategic_air_force_tt:0 "Requires §YPierre Cot§! as political advisor (decision §YAppoint Pierre Cot§! in the §YCouncil of Ministers§!, department §YResearch§!)."
 FRW_air_superiority:0 "Air Superiority"
 FRW_air_superiority_desc:0 "Recent fighting in Spain has shown that armies without cover from the air suffer heavily. The Armée de l'Air needs more and faster fighters."
 FRW_air_staff:0 "The Air Staff"
 FRW_air_staff_desc:0 "A permanent air staff now plans the work of fighters, bombers and reconnaissance squadrons together. Orders will come from officers who know aircraft."
 FRW_quai_d_orsay:0 "The Quai d'Orsay"
 FRW_quai_d_orsay_desc:0 "The Quai d'Orsay has more experience of European diplomacy than any other foreign ministry, and its ambassadors are put to work."
 FRW_league_of_nations:0 "Strengthen the League of Nations"
 FRW_league_of_nations_desc:0 "Paris places its trust in the League at Geneva and in collective action against any aggressor."
 FRW_eastern_alliances:0 "The Eastern Alliance System"
 FRW_eastern_alliances_desc:0 "In the east, Poland and the states of the Little Entente are expected to keep Germany in check."
 FRW_mediterranean_policy:0 "Mediterranean Policy"
 FRW_mediterranean_policy_desc:0 "Talks with Rome, Madrid and Ankara aim to keep the Mediterranean quiet and the sea lanes to Africa open."
 FRW_belgian_alliance:0 "The Belgian Alliance"
 FRW_belgian_alliance_desc:0 "The old invasion route into France runs through Belgium. Its defence is treated as a French concern."
 FRW_franco_polish_pact:0 "Franco-Polish Pact"
 FRW_franco_polish_pact_desc:0 "The alliance of 1921 is renewed and given new military clauses. A German move eastwards would mean war on two fronts."
 FRW_franco_soviet_pact:0 "Franco-Soviet Pact"
 FRW_franco_soviet_pact_desc:0 "The mutual assistance pact signed in 1935 is finally given staff talks and practical commitments."
 FRW_franco_soviet_pact_tt:0 "Signs a §Ynon-aggression pact§! with the §YSoviet Union§!."
 FRW_turkish_friendship:0 "Friendship with Turkey"
 FRW_turkish_friendship_desc:0 "Handing the Sanjak of Alexandretta to Turkey wins the goodwill of Ankara."
 FRW_turkish_friendship_tt:0 "§YHatay§! is handed over to §YTurkey§! (if it belongs to France or French Syria)."
 FRW_swiss_talks:0 "Talks with Bern"
 FRW_swiss_talks_desc:0 "Paris opens talks with Bern so that no army can use Swiss territory to go round the French defences."
 FRW_balkan_guarantees:0 "Support the Balkan Pact"
 FRW_balkan_guarantees_desc:0 "Guarantees to Greece and Turkey close the circle of French alliances in the south-east."
 FRW_arms_exports:0 "Arms Exports"
 FRW_arms_exports_desc:0 "Orders for French rifles, guns and aircraft arrive from many foreign governments."
 FRW_deuxieme_bureau:0 "The Deuxième Bureau"
 FRW_deuxieme_bureau_desc:0 "Military intelligence receives more staff and money. Since 1931 Captain Bertrand has passed Enigma papers bought from a German informer to the Polish cipher bureau."
 FRW_american_credits:0 "American Credits"
 FRW_american_credits_desc:0 "Loans and manufacturing licences from Washington speed up French rearmament."
 FRW_vatican_concordat:0 "Reconciliation with the Vatican"
 FRW_vatican_concordat_desc:0 "A concordat with the Holy See settles the long quarrel between the Republic and the Church."
 FRW_rhineland_response:0 "Answer the Rhineland Coup"
 FRW_rhineland_response_desc:0 "In March 1936 Hitler gambled that France would not move, and won. The next breach of the treaties will be answered with troops as well as protests."
 FRW_collective_security:0 "Collective Security"
 FRW_collective_security_desc:0 "Paris appeals to every government that fears aggression to join France in a common front."
 FRW_collective_security_tt:0 "A democratic France that is in no faction founds §YCollective Security§!."
 FRW_diplomatic_shield:0 "Diplomatic Shield"
 FRW_diplomatic_shield_desc:0 "Any state that attacks France will be seen everywhere as the aggressor."
 FRW_great_power_status:0 "La Grande Nation"
 FRW_great_power_status_desc:0 "With the army rearmed and the eastern alliances restored, no European question is settled without the Quai d'Orsay."
 FRW_empire_colonial:0 "The Colonial Empire"
 FRW_empire_colonial_desc:0 "France holds the second largest colonial empire in the world, and its men and resources are the country's largest reserve."
 FRW_ministry_of_colonies:0 "The Ministry of the Colonies"
 FRW_ministry_of_colonies_desc:0 "The colonial ministry in the Rue Oudinot is reorganised. Trained governors, engineers and doctors take the place of adventurers and speculators."
 FRW_african_development:0 "Develop North Africa"
 FRW_african_development_desc:0 "Power stations, port works and factories are built at Algiers, Oran and Casablanca, making North Africa the industrial base of the empire."
 FRW_colonial_purchases:0 "Colonial Purchases"
 FRW_colonial_purchases_desc:0 "Some territory can be had for money. Spain, Portugal, Belgium, Britain and Italy hold lands that would round off French Africa."
 FRW_aof_federation:0 "French West Africa Federation"
 FRW_aof_federation_desc:0 "The colonies of French West Africa are governed as one federation from Dakar."
 FRW_trans_saharan_railway:0 "The Trans-Saharan Railway"
 FRW_trans_saharan_railway_desc:0 "Work begins on a railway across the Sahara from Algiers to the Niger, linking North and West Africa."
 FRW_saharan_oil:0 "Oil of the Sahara"
 FRW_saharan_oil_desc:0 "Geologists believe large oil deposits lie beneath the Algerian Sahara, and survey teams are sent south."
 FRW_tonkin_industry:0 "Industry in Tonkin"
 FRW_tonkin_industry_desc:0 "Japan is looking south. The garrison of Indochina is reinforced. The coal mines and labour of Tonkin are put to use for local industry."
 FRW_moroccan_question:0 "Lyautey's Legacy"
 FRW_moroccan_question_desc:0 "Marshal Lyautey built the Moroccan protectorate on respect for the Sultan and on roads, ports and schools. His successors are to finish the work."
 FRW_moroccan_question_tt:0 "Moroccan states: §G+10%§! compliance."
 FRW_liberia_protectorate:0 "Protectorate over Liberia"
 FRW_liberia_protectorate_desc:0 "Liberia is heavily in debt. France offers it credit and protection."
 FRW_dakar_naval_base:0 "Dakar Naval Base"
 FRW_dakar_naval_base_desc:0 "From Dakar the navy can watch the Atlantic narrows between Africa and South America."
 FRW_dakar_naval_base_tt:0 "§G+1§! dockyard and building slot in a coastal state in Africa."
 FRW_mauritanian_iron:0 "Iron Ore of Mauritania"
 FRW_mauritanian_iron_desc:0 "Surveys confirm that the mountain of Kediet ej Jill near Zouérat is almost solid iron ore. A railway to the coast will bring it to French furnaces."
 FRW_pacific_bases:0 "Pacific Bases"
 FRW_pacific_bases_desc:0 "New airfields in Indochina cover the Asian possessions of the empire."
 FRW_libyan_question:0 "The Saharan Frontier"
 FRW_libyan_question_desc:0 "From Tindouf to the Fezzan the desert frontier is watched by a handful of méharistes. The Armée d'Afrique asks for forts, airfields and wells."
 FRW_colonial_development_fund:0 "The Colonial Investment Fund"
 FRW_colonial_development_fund_desc:0 "A public fund is set up to pay for roads, railways and ports in Africa."
 FRW_colonial_development_fund_tt:0 "§G+1§! civilian factory and building slot in a state in Africa."
 FRW_algerian_departments:0 "Algeria Is France"
 FRW_algerian_departments_desc:0 "Since 1848 Algeria has been organised in departments, and Paris treats it as part of France itself."
 FRW_djibouti_railway:0 "The Djibouti–Addis Ababa Railway"
 FRW_djibouti_railway_desc:0 "The French railway from Djibouti to Addis Ababa is Ethiopia's only line to the sea."
 FRW_indochina_rubber:0 "Rubber from Indochina"
 FRW_indochina_rubber_desc:0 "Rubber from the Michelin plantations in Indochina is reserved for the army."
 FRW_levant_mandates:0 "Integrate the Levant Mandates"
 FRW_levant_mandates_desc:0 "Syria and Lebanon are brought under direct French administration."
 FRW_levant_mandates_tt:0 "Annexes the French mandates §YSyria§! and §YLebanon§! if they are French puppets. If France already governs the Levant directly (e.g. in Road to 56), it simply receives the administration bonus."
 FRW_eurafrique:0 "Eurafrica"
 FRW_eurafrique_desc:0 "Planners in Paris propose a single economic area joining Europe and Africa, with France at its head."
 FRW_colonial_war_production:0 "War Production in the Empire"
 FRW_colonial_war_production_desc:0 "Factories built in Africa lie beyond the range of enemy bombers."
 FRW_imperial_preference:0 "Imperial Preference"
 FRW_imperial_preference_desc:0 "Tariffs fall inside the empire and rise at its borders. Colonial cotton, rubber and ore go to French factories first."
 FRW_madagascar_development:0 "Develop Madagascar"
 FRW_madagascar_development_desc:0 "Madagascar receives new ports and roads."
 FRW_national_cohesion:0 "National Cohesion"
 FRW_national_cohesion_desc:0 "Since the riots of 6 February 1934 right and left have been at each other's throats."
 FRW_end_political_violence:0 "Dissolve the Leagues"
 FRW_end_political_violence_desc:0 "The Croix-de-Feu, the Camelots du Roi and the militias of the left are dissolved and their arms seized. Order in the streets is left to the police."
 FRW_radio_propaganda:0 "Radio Paris"
 FRW_radio_propaganda_desc:0 "Radio-Paris and the regional stations carry the government's message into homes, cafés and barracks across the country."
 FRW_code_de_la_famille:0 "The Family Code"
 FRW_code_de_la_famille_desc:0 "The Code de la famille of 1939 offers allowances and incentives to raise France's low birth rate."
 FRW_civil_defence:0 "Civil Defence"
 FRW_civil_defence_desc:0 "Cities dig air-raid shelters and hold black-out drills."
 FRW_mobilization_laws:0 "The Wartime Organisation Law"
 FRW_mobilization_laws_desc:0 "The law of July 1938 on the organisation of the nation in wartime sets out how men and industry are to be mobilised."
 FRW_rural_modernization:0 "Modernise Agriculture"
 FRW_rural_modernization_desc:0 "Tractors and fertiliser reach the farms, releasing labour for the factories."
 FRW_national_service:0 "National Service"
 FRW_national_service_desc:0 "Civilians as well as soldiers are given duties, either at the front or in the war factories."
 FRW_women_in_industry:0 "Women in Industry"
 FRW_women_in_industry_desc:0 "As in 1914, women take over much of the work in the factories."
 FRW_union_sacree:0 "The Sacred Union"
 FRW_union_sacree_desc:0 "In August 1914 the parties set aside their quarrels for the duration of the war. The government now asks workers and employers, Catholics and anticlericals to do the same."
 FRW_secret_captain:0 "The Captain from Saint-Malo"
 FRW_secret_captain_desc:0 "The letter from Geneva lies on the desk of an empty ministry. Its writer, a Breton sea captain with Polish blood and a fortune of uncertain origin, asks only to be sent for. He arrives with a single suitcase, a Polish officer's sabre and a black flag folded at the bottom of his trunk. Nobody else has offered to govern France."
 FRW_secret_captain_tt:0 "§YMalo Kervadec§! becomes leader of France.\nFrance and §YPoland§! grow closer.\nA hidden path opens: the §YBrethren of the Coast§!, the §YIslands§! and §YIberia§!."
 FRW_brethren_of_the_coast:0 "The Brethren of the Coast"
 FRW_brethren_of_the_coast_desc:0 "In the taverns of Saint-Malo, Brest and Toulon the captain's men sign the old articles of the Brethren: a share of every prize, a vote on every captain, a pension for every wound. Volunteers queue at the naval recruiting offices."
 FRW_shipyards_of_saint_malo:0 "The Shipyards of Saint-Malo"
 FRW_shipyards_of_saint_malo_desc:0 "The old corsair port is building again, with frigates, freighters and the factories to supply them."
 FRW_sea_wolves:0 "The Sea Wolves"
 FRW_sea_wolves_desc:0 "Fast raiders and long-range submarines are sent to lie in wait on the sea lanes. The captain wants every merchant captain of Europe to look over his shoulder."
 FRW_corsair_economy:0 "The Prize Economy"
 FRW_corsair_economy_desc:0 "Gold, ships and cargoes taken at sea are turned into steel and machinery on land. The prize courts of Saint-Malo sit day and night."
 FRW_privateer_squadrons:0 "Privateer Squadrons"
 FRW_privateer_squadrons_desc:0 "Every shipowner of Brittany and Normandy may arm his ships under a French letter of marque. The State pays for the guns; the owners keep half of what they take."
 FRW_boarding_parties:0 "The Boarding Parties"
 FRW_boarding_parties_desc:0 "Marines trained to take a ship or a harbour by surprise: grappling hooks, sub-machine guns and no questions asked."
 FRW_new_tortuga:0 "A New Tortuga"
 FRW_new_tortuga_desc:0 "Saint-Malo is declared a free port without customs or inspections. Any cargo in Europe that needs to slip past a blockade can come through the captain's harbour, for a fee."
 FRW_black_admiralty:0 "The Black Admiralty"
 FRW_black_admiralty_desc:0 "The old admirals are retired and the captain's own men take their places on the bridges of the fleet. Le Goff, Morvan and Duroc have sailed under flags that no navy list mentions."
 FRW_black_admiralty_tt:0 "Three new admirals join the fleet: §YYann Le Goff§! (Sea Wolf), §YCorentin Morvan§! (Blockade Runner) and §YAnatole Duroc§! (Ironside)."
 FRW_jolly_roger:0 "Under the Jolly Roger"
 FRW_jolly_roger_desc:0 "The black flag flies from the mainmast of the flagship. The fleet fights as the corsairs of Saint-Malo did, choosing its prey and keeping the prize."
 FRW_letters_of_marque:0 "Letters of Marque"
 FRW_letters_of_marque_desc:0 "The corsairs of Saint-Malo always fought for profit as well as glory. Every defeated enemy and every protected nation will pay into the captain's war chest, and every island that commands a sea lane is a prize worth taking."
 FRW_letters_of_marque_tt:0 "Unlocks §YSeize the Treasury§!: take the gold reserves of any country that is §Ya French subject§! or has §Ycapitulated§! while at war with France.\nFrance gains §G+75§! political power, a civilian factory and §YCorsair Gold§! (180 days); the victim suffers §RPlundered Treasury§! (365 days). Each country can be plundered once a year."
 FRW_isles_balearics:0 "Raid the Balearics"
 FRW_isles_balearics_desc:0 "Mallorca and Minorca lie across every route from Marseille to Gibraltar. The captain means to anchor his frigates in Port Mahon, where French ships last flew the lilies in 1756."
 FRW_isles_balearics_tt:0 "§YClaims§! the §YBalearic Islands§! and a §Ywar goal§! against their owner, Spain."
 FRW_isles_fortunate:0 "The Fortunate Isles"
 FRW_isles_fortunate_desc:0 "The Canaries and Madeira guard the way to Africa and the Americas. The corsairs of the past took them for their wine and their sugar; the captain wants their harbours."
 FRW_isles_fortunate_tt:0 "§YClaims§! the §YCanary Islands§! and §YMadeira§!, and §Ywar goals§! against their owners (Spain, Portugal)."
 FRW_isles_keys_med:0 "The Keys of the Mediterranean"
 FRW_isles_keys_med_desc:0 "Malta and Gibraltar are the two locks of the inland sea, and the Royal Navy holds both keys. The captain has never been afraid of the Royal Navy."
 FRW_isles_keys_med_tt:0 "§YClaims§! on §YMalta§! and §YGibraltar§! and a §Ywar goal§! against Britain."
 FRW_isles_azores:0 "The Atlantic Islands"
 FRW_isles_azores_desc:0 "The Azores, the Cape Verde islands and São Tomé would let a French fleet cross the Atlantic without asking anyone for coal."
 FRW_isles_azores_tt:0 "§YClaims§! on the §YAzores§!, §YCape Verde§! and §YSão Tomé§! and a §Ywar goal§! against Portugal."
 FRW_isles_spanish_main:0 "The Spanish Main"
 FRW_isles_spanish_main_desc:0 "Tortuga, Port Royal, Nassau: the Caribbean was the kingdom of the Brethren of the Coast. The captain sends his ships back to the old hunting grounds of Jamaica, the Bahamas, Trinidad, Curaçao and the islands in between."
 FRW_isles_spanish_main_tt:0 "§YClaims§! on the Caribbean islands and §Ywar goals§! against their owners:\n- §YBritain§!: Jamaica, the Bahamas, Trinidad, the Windward Islands, Bermuda\n- the §YNetherlands§!: Curaçao\n- §YHaiti§!, the §YDominican Republic§! and §YCuba§!"
 FRW_isles_libertalia:0 "Libertalia"
 FRW_isles_libertalia_desc:0 "Legend says that the pirates of the Indian Ocean once founded a free republic on the coast of Madagascar. The captain means to make the legend true, starting with Mauritius and the Seychelles."
 FRW_isles_libertalia_tt:0 "§YClaims§! on §YMauritius§! and the §YSeychelles§! and a §Ywar goal§! against Britain.\n§YMadagascar§!, §YRéunion§! and the §YComoros§! (if French): §G+10%§! compliance."
 FRW_isles_north:0 "The Northern Isles"
 FRW_isles_north_desc:0 "Shetland, the Faroes and Iceland close the North Atlantic like a gate. Whoever holds them can choke the convoys of three nations."
 FRW_isles_north_tt:0 "§YClaims§! on §YShetland§!, the §YFaroe Islands§! and §YIceland§! and §Ywar goals§! against their owners (Britain, Denmark, Iceland)."
 FRW_isles_republic:0 "The Republic of the Isles"
 FRW_isles_republic_desc:0 "From the Balearics to the Seychelles, the captain's islands are governed as one free federation of ports. They pay no taxes to Paris and send ships and sailors instead."
 FRW_isles_republic_tt:0 "§GCores§! on every island France owns among the Balearics, Canaries, Madeira, Azores, Cape Verde, São Tomé, Malta, Gibraltar, the Caribbean islands, Mauritius, the Seychelles, Shetland and the Faroes."
 FRW_iberian_ambitions:0 "The Iberian Question"
 FRW_iberian_ambitions_desc:0 "Beyond the Pyrenees Spain is sliding towards civil war. Control of the peninsula would give the captain the western entrance to the Mediterranean and the finest harbours of the Atlantic."
 FRW_intervene_in_spain:0 "Intervene in Spain"
 FRW_intervene_in_spain_desc:0 "The Spaniards are killing each other. France intends to intervene and end the war on its own terms, whichever faction stands in the way."
 FRW_intervene_in_spain_tt:0 "War goal §Yannexation§! against §Yevery side§! of the Spanish Civil War that is not allied with France."
 FRW_spanish_protectorate:0 "A Protectorate over Spain"
 FRW_spanish_protectorate_desc:0 "Whether or not the civil war came, Spain is weak and Paris is close. A French protectorate is proposed."
 FRW_one_iberia:0 "One Iberia under France"
 FRW_one_iberia_desc:0 "The guns are silent. What is left of Spain will pass to France, by treaty if possible and by force if not."
 FRW_one_iberia_tt:0 "Every Spanish state that is already a §Ysubject of France§! is §Yannexed completely§!, including its army.\nAgainst every §Yindependent§! Spain France gains a §Ywar goal§! instead.\nIf Spain no longer exists, this focus is skipped."
 FRW_portuguese_question:0 "The Portuguese Question"
 FRW_portuguese_question_desc:0 "Lisbon is now isolated at the edge of a French peninsula. French divisions on the border strengthen the case put by French diplomats."
 FRW_portuguese_question_tt:0 "§YPortugal§! must decide: join France peacefully or face war.\nThe stronger the French army compared to Portugal's, the more likely Lisbon gives in. If Portugal refuses, France gets a war goal §Yannexation§!."
 FRW_raise_the_black_flag:0 "The Kingdom of Francia"
 FRW_raise_the_black_flag_desc:0 "The captain from Saint-Malo unites France and Iberia under one banner bearing the lilies of France and the ermine of Brittany. He calls it a kingdom for now, and an eternal one for his son."
 FRW_raise_the_black_flag_tt:0 "Proclaims the §YKingdom of Francia§!, the forerunner of the Eternal Kingdom, with a banner of lilies and Breton ermine, §YLe Pavillon Corsaire§! (+15% attack and defence on core territory) and §Gcores on the lands of Spain and Portugal§! that France owns (also on any it gains later there) and §Yclaims§! on the rest.\nReplaces any nation France has formed before (its formable spirit is removed). If France is already the §YEternal Kingdom of Francia§!, it stays that."
 FRW_iberian_cores:0 "One Peninsula, One Nation"
 FRW_iberian_cores_desc:0 "From Calais to Cádiz and from Brest to Lisbon, the lands are to be governed as a single nation."
 FRW_iberian_cores_tt:0 "§GCores§! on every owned state that is a core of §YSpain§! or §YPortugal§!, and §G+15%§! compliance there."
 FRW_asturian_steel:0 "Asturian Coal and Andalusian Ore"
 FRW_asturian_steel_desc:0 "The mines and blast furnaces of Asturias and the old copper mines of Río Tinto now work for France."
 FRW_catalan_industry:0 "The Factories of Barcelona"
 FRW_catalan_industry_desc:0 "Catalonia was the workshop of Spain, and its mills and factories are now turned to French needs in the south."
 FRW_port_of_lisbon:0 "The Port of Lisbon"
 FRW_port_of_lisbon_desc:0 "The harbour of Lisbon, one of the best on the Atlantic, becomes the home of the captain's Atlantic squadron."
 FRW_iberian_arsenal:0 "The Iberian Arsenal"
 FRW_iberian_arsenal_desc:0 "Arsenals in Madrid and Burgos turn out rifles, guns and tanks for the imperial armies."
 FRW_eternal_kingdom:0 "The Eternal Kingdom of Francia"
 FRW_eternal_kingdom_desc:0 "From the Alps to Gibraltar, from Brest to the Highlands and from the Caribbean to the Indian Ocean, the old crown is restored under an admiral who has never lost a battle at sea. France becomes the Eternal Kingdom of Francia."
 FRW_eternal_kingdom_tt:0 "Forms the §YEternal Kingdom of Francia§!: new flag, dark blue map colour, national spirit §YThe Eternal Kingdom§! and §Gcores on the lands of Spain, Portugal and the Scottish isles§! that France owns (also on any it gains later there) and §Yclaims§! on the rest.\nIt replaces any nation formed before – and it can never be replaced.\nMalo Kervadec dies when this focus begins; his son §YAymeric Kervadec§! is crowned when it completes."
 FRW_appeal_of_18_june:0 "The Appeal of 18 June"
 FRW_appeal_of_18_june_desc:0 "«France has lost a battle, but France has not lost the war.» Speaking from London, a little-known general urges every Frenchman to keep fighting."
 FRW_appeal_of_18_june_tt:0 "This branch appears once France has §Ycapitulated§! or lost control of §YParis§! – even if a peace has already been signed. Its focuses can be taken while capitulated.\nFree French Prestige starts at §Y20§! of 100 and the decisions §YFree France§! open. Removes §YDefeatism§!."
 FRW_continue_the_fight:0 "Continue the Fight"
 FRW_continue_the_fight_desc:0 "An armistice signed in Bordeaux binds no one in London. The Free French declare that the war goes on."
 FRW_continue_the_fight_tt:0 "France declares war again on whoever holds §YParis§! (if it is no longer at war with them) and joins §YBritain§!'s faction (if Britain leads one).\nFree French Prestige: §G+5§!"
 FRW_free_french_forces:0 "The Free French Forces"
 FRW_free_french_forces_desc:0 "Legionnaires back from Narvik, sailors who escaped from Brest and colonial riflemen from Chad form the core of a new army."
 FRW_free_french_forces_tt:0 "§G+2§! military factories in exile (British and colonial workshops).\nFree French Prestige: §G+5§!"
 FRW_rally_the_colonies:0 "Rally the Colonies"
 FRW_rally_the_colonies_desc:0 "In August 1940 Chad, Cameroon and the Middle Congo declared for de Gaulle. The other governors are asked to follow."
 FRW_rally_the_colonies_tt:0 "§YClaims§! on every French colony in Africa held by someone else, and a §Ywar goal§! against every country (outside France's faction) that holds one.\nFree French Prestige: §G+10§!"
 FRW_lend_lease:0 "Help from Washington"
 FRW_lend_lease_desc:0 "Roosevelt's Lend-Lease reaches the Free French by way of Britain: rifles, trucks and uniforms."
 FRW_lend_lease_tt:0 "§G+3§! military factories in exile (American Lend-Lease production)."
 FRW_leclerc_column:0 "Leclerc's Column"
 FRW_leclerc_column_desc:0 "In 1941 Leclerc crossed the Sahara from Chad and took the Italian fort at Kufra. At the oasis his men swore to fight on until the flag flew over Strasbourg."
 FRW_leclerc_column_tt:0 "Claims on the §YFezzan§! and §YSirte§! and a war goal against §YItaly§! for them.\nFree French Prestige: §G+5§!"
 FRW_algiers_capital:0 "Algiers, Capital of France"
 FRW_algiers_capital_desc:0 "The ministries move into the villas above the bay of Algiers. For now, this is where France is governed."
 FRW_algiers_capital_tt:0 "§G+2§! civilian factories in exile.\nMoves the capital to §YAlgiers§! (or to §YBrazzaville§! if France does not hold Algeria)."
 FRW_the_resistance:0 "The Resistance"
 FRW_the_resistance_desc:0 "Jean Moulin is parachuted into Provence to unite the resistance movements. Railway workers, students and communists begin to sabotage the occupier."
 FRW_brazzaville_conference:0 "The Brazzaville Conference"
 FRW_brazzaville_conference_desc:0 "De Gaulle promises the colonies a new place in the French community after the war. In return, Africa gives him men and raw materials."
 FRW_brazzaville_conference_tt:0 "Every owned state in §YAfrica§!: §G+10%§! compliance.\nFree French Prestige: §G+10§!"
 FRW_mobilise_the_empire:0 "Mobilise the Empire"
 FRW_mobilise_the_empire_desc:0 "Factories are improvised in Casablanca and Dakar, and the railways of the Maghreb run day and night."
 FRW_mobilise_the_empire_tt:0 "§G+2§! military factories in exile."
 FRW_army_of_africa_marches:0 "The Army of Africa Marches"
 FRW_army_of_africa_marches_desc:0 "Rearmed by the Americans after Tunisia, the Armée d'Afrique is needed in Italy and Provence."
 FRW_eurafrican_federation_focus:0 "The Eurafrican Federation"
 FRW_eurafrican_federation_focus_desc:0 "With Paris occupied, the empire is France. Algiers proposes to join Europe and Africa in one federation, for as long as the war lasts and perhaps longer."
 FRW_eurafrican_federation_focus_tt:0 "Optional – excludes §YThe Provisional Government§!.\nForms the §YEurafrican Federation§!: new name and flag, national spirit and §Gcores on French North Africa, Dakar and the overseas départements§! that France owns (also later) and §Yclaims§! on the rest of them.\nReplaces any nation France has formed before (its formable spirit is removed). If France is already the §YEternal Kingdom of Francia§!, it stays that.\nRequires control of a capital in Africa – §YAlgiers§!, §YDakar§!, §YBrazzaville§! or §YChad§! (rally them with the §YFree France§! decisions). If France holds none of them yet, the nation is founded automatically as soon as it does."
 FRW_provisional_government:0 "The Provisional Government"
 FRW_provisional_government_desc:0 "The Free French form the Provisional Government of the French Republic. It promises elections and a new constitution as soon as the country is free."
 FRW_provisional_government_tt:0 "Optional – excludes §YThe Eurafrican Federation§!. France stays France and keeps the Republic."
 FRW_liberation_of_paris:0 "The Liberation of Paris"
 FRW_liberation_of_paris_desc:0 "The bells of Notre-Dame ring for the first time in four years. The government returns to the capital."
 FRW_liberation_of_paris_tt:0 "The Forces of the Interior join the army: §G+50,000§! manpower.\nRequires control of §YParis§!. Paris becomes French again and the capital returns there."
 FRW_ff_chequers:0 "The Chequers Agreement"
 FRW_ff_chequers_desc:0 "Churchill and de Gaulle sign an agreement: Britain will pay, arm and supply the Free French, and France will keep her independence in command."
 FRW_ff_chequers_tt:0 "§G+1§! military factory in exile.\nFree French Prestige: §G+5§!"
 FRW_ff_national_committee:0 "The French National Committee"
 FRW_ff_national_committee_desc:0 "In London the scattered services of Free France become a true government, with commissioners for war, finance, foreign affairs and the colonies."
 FRW_ff_national_committee_tt:0 "Free French Prestige: §G+5§!"
 FRW_ff_bcra:0 "The BCRA"
 FRW_ff_bcra_desc:0 "Colonel Passy builds the Bureau Central de Renseignements et d'Action. Its agents run networks from Brittany to Marseille."
 FRW_ff_cnr:0 "The National Council of the Resistance"
 FRW_ff_cnr_desc:0 "In a flat in the Rue du Four, the movements, parties and unions of the Resistance meet for the first time under one leadership."
 FRW_ff_cnr_tt:0 "Every occupied French state in Europe: resistance §G+15§!.\nFree French Prestige: §G+10§!"
 FRW_ff_first_division:0 "The 1st Free French Division"
 FRW_ff_first_division_desc:0 "Legionnaires, marines, colonial infantry and volunteers from every corner of the empire are formed into a single division."
 FRW_ff_bir_hakeim:0 "Bir Hakeim"
 FRW_ff_bir_hakeim_desc:0 "For sixteen days Koenig's brigade holds a ruined fort in the Libyan desert against Rommel's tanks. The world learns that the French are fighting again."
 FRW_ff_bir_hakeim_tt:0 "Free French Prestige: §G+5§!"
 FRW_ff_second_armoured:0 "The 2nd Armoured Division"
 FRW_ff_second_armoured_desc:0 "Leclerc's veterans of the desert are re-equipped in Morocco with American Shermans and half-tracks."
 FRW_ff_fafl:0 "The Free French Air Force"
 FRW_ff_fafl_desc:0 "A few hundred pilots and mechanics who escaped from France fly with the Royal Air Force under their own roundel."
 FRW_ff_groupe_lorraine:0 "The Groupe Lorraine"
 FRW_ff_groupe_lorraine_desc:0 "French bomber crews trained in Britain and Syria form their own group and fly Bostons against targets in France and the Low Countries."
 FRW_ff_normandie_niemen:0 "Normandie-Niemen"
 FRW_ff_normandie_niemen_desc:0 "A squadron of French fighter pilots goes to fight on the Eastern Front, flying Soviet Yaks against the Luftwaffe."
 FRW_ff_fnfl:0 "The Free French Naval Forces"
 FRW_ff_fnfl_desc:0 "Admiral Muselier gathers the ships that escaped to British ports, from the submarine Surcouf to a handful of trawlers."
 FRW_ff_corvettes:0 "Corvettes from Britain"
 FRW_ff_corvettes_desc:0 "The Admiralty lends Flower-class corvettes to the Free French Navy. They escort the convoys of the Atlantic."
 FRW_ff_corvettes_tt:0 "§G+1§! dockyard in exile."
 FRW_ff_richelieu:0 "The Richelieu Rejoins the Fight"
 FRW_ff_richelieu_desc:0 "The great battleship that lay damaged in Dakar sails to New York for repair and returns to the war under the tricolour."
 FRW_ff_richelieu_tt:0 "§G+2§! dockyards in exile (American yards)."
 FRW_ff_maquis:0 "The Maquis"
 FRW_ff_maquis_desc:0 "Young men fleeing forced labour in Germany take to the hills of the Vercors, the Limousin and the Alps, where the Resistance arms and drills them."
 FRW_ff_maquis_tt:0 "Every occupied French state in Europe: resistance §G+10§!.\nFree French Prestige: §G+5§!"
 FRW_ff_colonial_recruitment:0 "Recruitment in the Colonies"
 FRW_ff_colonial_recruitment_desc:0 "Recruiting offices open from Dakar to Madagascar. Tirailleurs, goumiers and spahis will form half of the army that liberates France."
 FRW_ff_cfln:0 "The French Committee of National Liberation"
 FRW_ff_cfln_desc:0 "In Algiers in June 1943 de Gaulle's Free French and Giraud's Army of Africa come together under a single committee, and their troops are merged into one army."
 FRW_ff_cfln_tt:0 "Free French Prestige: §G+10§!"
 FRW_ff_consultative_assembly:0 "The Consultative Assembly"
 FRW_ff_consultative_assembly_desc:0 "Delegates of the Resistance, the parties and the old parliament meet in Algiers in November 1943. It is the first assembly to speak for France since 1940, though its members are appointed, not elected."
 FRW_ff_cef:0 "The French Expeditionary Corps"
 FRW_ff_cef_desc:0 "General Juin's corps of mountain troops and colonial divisions breaks the German line in the mountains of Italy where others had failed."
 FRW_ff_dragoon:0 "Landing in Provence"
 FRW_ff_dragoon_desc:0 "Two hundred thousand French soldiers land between Toulon and Saint-Raphaël and push up the Rhône valley towards Lyon and the Vosges."
 FRW_ff_epuration:0 "The Épuration"
 FRW_ff_epuration_desc:0 "Special courts in every département try those accused of collaboration."
 FRW_ff_votes_for_women:0 "Votes for Women"
 FRW_ff_votes_for_women_desc:0 "By the ordinance of Algiers of April 1944, French women receive the right to vote and to stand for office."
 FRW_ff_securite_sociale:0 "The Sécurité Sociale"
 FRW_ff_securite_sociale_desc:0 "Following the programme of the Resistance, every worker is insured against illness, old age and accidents at work."
 FRW_ff_securite_sociale_tt:0 "Inflation: §R+5§!"
 FRW_ff_reconstruction:0 "The Reconstruction of France"
 FRW_ff_reconstruction_desc:0 "Bridges, railways, ports and whole towns lie in ruins. The Ministry of Reconstruction gets to work."
 FRW_ff_reconstruction_tt:0 "Inflation: §R+10§! (reconstruction is paid on credit)."
 FRW_ff_fourth_republic:0 "The Fourth Republic"
 FRW_ff_fourth_republic_desc:0 "A new constitution is approved by referendum. The Provisional Government hands power to an elected Assembly."
 FRW_ff_fourth_republic_tt:0 "Requires §YThe Provisional Government§!."
 FRW_ff_eurafrican_assembly:0 "The Eurafrican Assembly"
 FRW_ff_eurafrican_assembly_desc:0 "Deputies from Dakar, Algiers, Brazzaville and Paris sit together in one assembly for the first time."
 FRW_ff_eurafrican_assembly_tt:0 "Requires §YThe Eurafrican Federation§!.\nEvery owned state in §YAfrica§!: §G+10%§! compliance."
 FRW_qol_state_reform:0 "The Commission for State Reform"
 FRW_qol_state_reform_desc:0 "Files pile up in every ministry and a simple decree can take months to pass through the offices of the Third Republic. A commission of senior officials has been told to simplify the procedures."
 FRW_qol_state_reform_tt:0 "Unlocks the department §YPolitics§! in the §YCouncil of Ministers§! (decisions)."
 FRW_qol_cabinet:0 "A Leaner Cabinet"
 FRW_qol_cabinet_desc:0 "The number of ministries is reduced and their duties are redrawn, so that the Council of Ministers can reach decisions more quickly."
 FRW_qol_cabinet_tt:0 "Unlocks the department §YEconomy§! in the §YCouncil of Ministers§!."
 FRW_qol_staff_college:0 "The Staff College"
 FRW_qol_staff_college_desc:0 "The École Supérieure de Guerre revises its courses to prepare younger officers for command in a modern war."
 FRW_qol_staff_college_tt:0 "Unlocks the department §YArmy§! in the §YCouncil of Ministers§!."
 FRW_qol_logistics:0 "The Bureau of Logistics"
 FRW_qol_logistics_desc:0 "A single office in Paris now plans the use of railways, lorries and supply depots for the whole army."
 FRW_qol_standards:0 "Standardised Equipment"
 FRW_qol_standards_desc:0 "Arms factories are ordered to work to common standards, so that rifles, shells and spare parts fit every regiment's equipment."
 FRW_qol_research_council:0 "The Higher Council for Research"
 FRW_qol_research_council_desc:0 "A council of scientists is attached to the Prime Minister's office, on the lines of the under-secretariat for research that Irène Joliot-Curie held in 1936."
 FRW_qol_research_council_tt:0 "Unlocks the department §YResearch§! in the §YCouncil of Ministers§!."
 FRW_qol_special_projects:0 "The Directorate of Special Projects"
 FRW_qol_special_projects_desc:0 "Rockets, jet engines and the atom are too important to be left to private workshops. A directorate in the Ministry of Armament takes charge of them."
 FRW_qol_special_projects_tt:0 "Unlocks the department §YSpecial Projects§! in the §YCouncil of Ministers§!."
 FRW_qol_deuxieme_bureau:0 "Reorganise the Deuxième Bureau"
 FRW_qol_deuxieme_bureau_desc:0 "The military intelligence service and its counter-espionage section receive new money, new offices and a direct line to the government."
 FRW_qol_deuxieme_bureau_tt:0 "Unlocks the department §YIntelligence Agency§! in the §YCouncil of Ministers§!."
 FRW_qol_modern_state:0 "The Modern State"
 FRW_qol_modern_state_desc:0 "After years of reform a decree reaches the prefectures in weeks rather than months."
 FRW_rhine_question:0 "The Rhine Question"
 FRW_rhine_question_desc:0 "Poincaré occupied the Ruhr in 1923 and backed the Rhenish separatists, and the Saar stayed under League of Nations rule, its mines in French hands, until 1935. Many in Paris still hold that the security of France depends on the Rhine."
 FRW_demand_the_saar:0 "Demand the Saar"
 FRW_demand_the_saar_desc:0 "Paris now calls the plebiscite of January 1935 a sham held under Nazi pressure and demands the transfer of the Saar to France."
 FRW_rhenish_republic:0 "The Rhenish Republic"
 FRW_rhenish_republic_desc:0 "The separatists of 1923 failed for want of support. France now means to give the Rhineland that support and bring it under French control."
 FRW_pyrenees_question:0 "The Pyrenees Question"
 FRW_pyrenees_question_desc:0 "In Barcelona the workers are fighting the same battle as their comrades in Paris. A red France has no intention of repeating Blum's policy of non-intervention."
 FRW_demand_catalonia:0 "The Catalan Commune"
 FRW_demand_catalonia_desc:0 "The CNT and the POUM hold Barcelona. Paris proposes that Catalonia, annexed to France under Napoleon in 1812, join the French workers' republic."
 FRW_iberian_protectorate:0 "A Soviet Iberia"
 FRW_iberian_protectorate_desc:0 "Paris will not leave Spain to Franco. The plan is to make the whole peninsula a fraternal republic guided from Paris."
 FRW_alpine_question:0 "The Alpine Question"
 FRW_alpine_question_desc:0 "French is spoken in Geneva, the Valais and the Aosta Valley, while Rome lays claim to Nice and Savoy. The leagues want France to stop giving ground in the Alps and take back what they consider French."
 FRW_demand_romandy:0 "Demand Romandy"
 FRW_demand_romandy_desc:0 "The leagues claim Geneva, Lausanne and the rest of French-speaking Switzerland for France."
 FRW_demand_aosta_nice:0 "Demand Piedmont and Aosta"
 FRW_demand_aosta_nice_desc:0 "The House of Savoy took its name from lands on the French side of the Alps. Paris now claims Piedmont and the Aosta Valley."
 FRW_swiss_anschluss:0 "Union with Switzerland"
 FRW_swiss_anschluss_desc:0 "Swiss neutrality has rested on its mountains and its militia for centuries. Paris no longer intends to respect it."
 FRW_corsica_and_sardinia:0 "Corsica and Sardinia"
 FRW_corsica_and_sardinia_desc:0 "Sardinia lies only a few miles south of Corsica across the Strait of Bonifacio. Paris argues that the two islands should be governed together."
 FRW_latin_destiny:0 "A Latin Destiny"
 FRW_latin_destiny_desc:0 "France, Italy and Spain share the inheritance of Rome. Between them they hold most of the coasts of the western Mediterranean, from Gibraltar to Sicily."
 FRW_latin_destiny_tt:0 "§GCores§! on §YSardinia§! (if France owns it)."
 FRW_rome_accords:0 "The Rome Accords"
 FRW_rome_accords_desc:0 "In January 1935 Laval and Mussolini settled their quarrels in Africa. France ceded a strip of desert to Libya, and Italy agreed to give up the special status of its settlers in Tunisia. La Rocque means to hold Rome to the bargain."
 FRW_stresa_front:0 "The Stresa Front Renewed"
 FRW_stresa_front_desc:0 "At Stresa in April 1935 France, Britain and Italy stood together to keep Austria free. La Rocque wants that front restored, with Rome as France's first ally."
 FRW_stresa_front_tt:0 "Invites §YItaly§! into France's faction (if France leads one)."
 FRW_latin_naval_pact:0 "The Latin Naval Pact"
 FRW_latin_naval_pact_desc:0 "Toulon and La Spezia share their plans. The French fleet guards the western Mediterranean, the Italian fleet the central basin and the Sicilian narrows."
 FRW_latin_union:0 "The Latin Union"
 FRW_latin_union_desc:0 "La Rocque has no wish to conquer his Latin neighbours. He offers Rome and Madrid a customs union and a common defence from Lisbon to Trieste, with Paris at its head."
 FRW_latin_union_tt:0 "An §YItaly§! allied in France's faction now counts as controlled for the §YLatin Empire§! (Spain and Portugal are still needed)."
 FRW_benelux_question:0 "The Burgundian Heritage"
 FRW_benelux_question_desc:0 "Louise d'Orléans was the first Queen of the Belgians, and the Low Countries once lay at the heart of the Burgundian lands. A King of France can point to old claims and family ties in Brussels and Luxembourg."
 FRW_union_with_luxembourg:0 "Union with Luxembourg"
 FRW_union_with_luxembourg_desc:0 "Wedged between France and Germany, the Grand Duchy has little chance of standing alone. Paris offers it union."
 FRW_demand_wallonia:0 "Demand Wallonia"
 FRW_demand_wallonia_desc:0 "Paris demands that the French-speaking provinces of southern Belgium be returned to France."
 FRW_belgian_union:0 "Union with Belgium"
 FRW_belgian_union_desc:0 "Belgium was part of France from 1795 to 1814. Brussels is now asked whether it wishes to be French again."
 FRW_batavian_union:0 "Union with the Netherlands"
 FRW_batavian_union_desc:0 "In 1810 Napoleon annexed the Kingdom of Holland to France. Paris now intends to do the same."
 FRW_batavian_union_tt:0 "If the §YNetherlands§! are independent, they receive a union demand (accept = annexation). If they are a French puppet, France annexes them.\nForms the §YKingdom of Burgundy§!: new name and flag, national spirit and §Gcores on the lands of Belgium, the Netherlands and Luxembourg§! that France owns (also on any it gains later there) and §Yclaims§! on the rest.\nReplaces any nation France has formed before (its formable spirit is removed). If France is already the §YEternal Kingdom of Francia§!, it stays that.\nRequires control of the whole of §YBelgium§!, the §YNetherlands§! and §YLuxembourg§! (annexed, not as puppets). If France does not control them yet, the nation is founded automatically as soon as it does."
 FRW_reunions_complete:0 "The Burgundian Realm Restored"
 FRW_reunions_complete_desc:0 "The old Burgundian lands from Flanders to Luxembourg are once more united under the French crown."
