l_japanese:
GFTR_E_independence.1.t: "独立戦争！"
GFTR_E_independence.1.d: "我々の我慢も限界だ。これは我々の土地であり、我々が思う通りに支配する権利がある。今日より、侵略者・占領者どもに対する闘争を開始する。彼らは我々の土地に踏み込み、我々に意志と文化を押しつけ、人民を奴隷とし、旗を立てたのだ。"
GFTR_E_independence.1.a: "彼らの血を流せ！"
# # # # # # # # # # # # # # #
GFTR_E_independence.2.t: "要請書"
GFTR_E_independence.2.d: "本日、我が傀儡国家より正式な要請が届いた。彼らは我々の影響力の見直しを求め、外交・内政において独自の声を要求を持ち、事実上完全な独立を宣言している。要請の文面はまだ抑制されており外交的だが、指を鳴らせば一瞬で戦争に発展しかねない。"
GFTR_E_independence.2.a: "一切の譲歩はしない！"
GFTR_E_independence.2.b: "独立を認めてもよい。"
GFTR_E_independence.2.c: "裏切り者ども！同盟から追放せよ！"
GFTR_E_independence.2.d: "軍が秩序を回復する。"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.0.t: "悪い知らせ"
GFTR_E_independence_response.0.d: "今朝、我が元傀儡国家が突然独立を宣言し、我が領内に駐留していた部隊を攻撃してきた。背後からの一撃だ。交渉の試みはすべて拒絶された。"
GFTR_E_independence_response.0.a: "戦争が欲しいのか？ならば与えてやろう！"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.1.t: "拒絶"
GFTR_E_independence_response.1.d: "数日前に独立の要請を送ったが、本日完全な拒絶が届いた。宗主国は我々を解放する気はなく、この問題に関する一切の議論を拒否した。外交は完全に袋小路に陥った。"
GFTR_E_independence_response.1.a: "戦うしかない！"
GFTR_E_independence_response.1.b: "…わかった"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.2.t: "我々は自由だ！"
GFTR_E_independence_response.2.d: "朗報だ！宗主国が正式に我々の独立を承認した。これより我々は自らの運命を自らの手で決める。我が民族にとって、これは歴史に残る一日となるだろう。"
GFTR_E_independence_response.2.a: "万歳！万歳！万歳！"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.3.t: "ほろ苦い自由"
GFTR_E_independence_response.3.d: "本日、宗主国より曖昧な回答が届いた。我々は裏切り者と罵られた！独立は勝ち取ったが、旧宗主国は我々との一切の外交関係を断絶した。これより我々は自由だが、この激動の時代に孤立することとなる。言葉は厳しかったが、武力衝突は回避できた。"
GFTR_E_independence_response.3.a: "何より平和的に終わったことだ。"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.4.t: "独立戦争"
GFTR_E_independence_response.4.d: "我々の従属関係を外交的に解決するという希望は今日崩れ去った。最近の要請に対し、宗主国は国境に軍を展開し、我々の主権獲得の意志を武力で押し潰すべく侵攻準備を進めている。これより我々は自由のためではなく、国家の存続そのもののために戦う。"
GFTR_E_independence_response.4.a: "我々は耐え抜く！"
# # # # # # # # # # # # #
GFTR_E_change_of_power.1.t: "選挙は終了"
GFTR_E_change_of_power.1.d: "国で公正な民主主義選挙が行われ、国民は選択した。"
GFTR_E_change_of_power.1.a: "了解"
# # # # # # # # # # # # #
GFTR_E_change_of_power.2.t: "権力奪取"
GFTR_E_change_of_power.2.d: "予想された対立は起こらなかった。旧体制は敗北を認め、権限を手放し、新体制に平和裏に統治権を譲渡した。"
GFTR_E_change_of_power.2.a: "正しい判断"
# # # # # # # # # # # # #
GFTR_E_change_of_power.3.t: "内戦だ！"
GFTR_E_change_of_power.3.d: "政治危機は限界に達した。国は敵対する二勢力に分裂し、権力争いが全面的な武装衝突へと発展した。"
GFTR_E_change_of_power.3.a: "我々は勝つ"