l_korean:
# # # # # # # # # # # # # # #
GFTR_categories_settings: "설정"
GFTR_categories_settings_desc: "안녕하세요! §YGeneric Focus Tree: Redux§! 모드를 구독해 주셔서 정말 기쁩니다! 제 작업이 마음에 드신다면 Steam 창작마당 페이지에서 모드를 지원해 주세요 :) \n최신 업데이트 확인 및 버그·문제 신고도 그곳에서 가능합니다."
# # # # # # # # # # # # # # #
GFTR_D_set_focus_tree_SHOW: "1. 초점 트리 설치"
GFTR_D_set_focus_tree_SHOW_tt: "여기서 자국 및 타국에 다양한 초점 트리를 설치하거나 삭제할 수 있습니다."
GFTR_D_set_focus_tree_HIDE: "1. §R섹션 닫기§!"
GFTR_D_set_gftr_a: "          1. 설치 (GFT: Redux)"
GFTR_D_set_gftr_a_tt: "현재 국가에 §YGeneric Focus Tree: Redux§!가 설치 또는 업데이트됩니다.\n~~~\n주의: 바닐라·DLC에 고유 초점 트리가 있는 국가(예: 독일, 프랑스, 이란 등)의 트리를 교체하면 원래 트리로 복구하려면 §L새 게임 시작§! 또는 §L콘솔§!만 가능합니다."
GFTR_D_set_gftr_b: "          1. AI용 설치 (GFT: Redux)"
GFTR_D_set_gftr_b_tt: "AI가 통제하는 모든 국가에 §YGeneric Focus Tree: Redux§!가 설치 또는 업데이트됩니다.\n~~~\n§L주의§! – 클릭 시 모든 AI 국가가 새 트리를 받습니다. §G게임 시작 직후에만 사용§!하고, 아래 결정으로 국가 정신·특수 메커니즘을 먼저 제거하는 것을 권장합니다."
GFTR_D_set_generic_focus: "          1. 바닐라 트리 설치"
GFTR_D_set_generic_focus_tt: "현재 국가에 §G바닐라§! 기본 초점 트리가 설치 또는 업데이트됩니다.\n~~~\n현재 게임에 있는 바닐라 트리를 불러옵니다. 다른 대형 모드에 의해 변경된 경우 변경된 트리가 설치됩니다."
GFTR_D_deleted_focus_tree: "          1. 초점 트리 삭제"
GFTR_D_deleted_focus_tree_tt: "현재 국가의 초점 트리가 §R삭제§!됩니다. 정확히는 완전히 빈 트리(지속형 초점 제외)로 교체됩니다.\n~~~\n솔직히 왜 필요한지 모르겠습니다 §YXD§!. 국가를 '비활성화'하고 싶다면 트리를 꺼서 성능을 약간 향상시킬 수 있습니다."
GFTR_D_test_focus_tree: "          1. 모드 테스트"
GFTR_D_test_focus_tree_tt: "§YGeneric Focus Tree: Redux§!의 정확한 복사본이 설치되지만, 모든 초점이 1일만 소요됩니다.\n~~~\n주로 AI 행동 테스트용입니다. AI 문제 발견에 도움을 주실 수 있습니다.\n~~~\n일반 플레이에서도 재미있을 수 있습니다."
# # # # # # # # # # # # # # #
GFTR_D_remove_national_spirits_SHOW: "2. 국가 정신 제거"
GFTR_D_remove_national_spirits_SHOW_tt: "여기서 자국 및 타국의 다양한 국가 정신을 제거할 수 있습니다."
GFTR_D_remove_national_spirits_HIDE: "2. §R섹션 닫기§!"
GFTR_D_remove_gftr_national_spirits_a: "          2. 정신 제거 (GFT: Redux)"
GFTR_D_remove_gftr_national_spirits_a_tt: "현재 국가에서 §YGeneric Focus Tree: Redux§!가 추가한 모든 국가 정신이 삭제됩니다.\n~~~\n기술 정신은 삭제되지 않습니다."
GFTR_D_remove_gftr_national_spirits_b: "          2. AI의 정신 제거 (GFT: Redux)"
GFTR_D_remove_gftr_national_spirits_b_tt: "AI 통제 모든 국가에서 §YGeneric Focus Tree: Redux§!가 추가한 국가 정신이 삭제됩니다.\n~~~\n기술 정신은 삭제되지 않습니다.\n~~~\n§R주의§! – 짧은 프리즈가 발생할 수 있습니다."
GFTR_D_remove_vanilla_national_spirits_a: "          2. 바닐라 정신 제거"
GFTR_D_remove_vanilla_national_spirits_a_tt: "현재 국가에서 모든 초기 §G바닐라§! 국가 정신이 삭제됩니다!\n~~~\n'모든 정신 삭제' 기능이 없어 1936년 시작 시 존재하는 사전 정의 목록만 삭제합니다. 게임 진행 중 사용 시 효과가 없을 가능성이 큽니다. §G게임 시작 직후에만 권장§!."
GFTR_D_remove_vanilla_national_spirits_b: "          2. AI의 바닐라 정신 제거"
GFTR_D_remove_vanilla_national_spirits_b_tt: "AI 통제 모든 국가에서 초기 §G바닐라§! 국가 정신이 삭제됩니다.\n~~~\n위와 동일한 제한. §G게임 시작 직후에만 권장§!.\n~~~\n§R주의§! – 짧은 프리즈가 발생할 수 있습니다."
# # # # # # # # # # # # # # #
GFTR_D_remove_unique_mechanics_SHOW: "3. 고유 메커니즘 제거"
GFTR_D_remove_unique_mechanics_SHOW_tt: "여기서 일부 국가가 가진 특수 메커니즘·결정·수식어를 제거할 수 있습니다. 네이티브 트리 교체 시 방해가 되는 것들을 정리합니다."
GFTR_D_remove_unique_mechanics_HIDE: "3. §R섹션 닫기§!"
GFTR_D_remove_state_modifier_a: "          3. 주 수식어 제거"
GFTR_D_remove_state_modifier_a_tt: "현재 국가에서 일부 주 수식어가 삭제됩니다.\n~~~\n§Y주 수식어§!는 특정 주에만 적용되는 특수 수식어입니다(예: 에티오피아 '분권화', 터키 '쿠르드 분리주의').\n~~~\n§G네이티브§! 트리 교체 시 영구화되어 문제가 됩니다. 이 결정으로 제거 가능.\n~~~\n대상 국가는 위 '요구 조건'에 표시. §L(AI에도 적용)§!\n~~~\n§G게임 시작 시에만 권장§!."
GFTR_D_remove_state_modifier_b: "          3. AI의 주 수식어 제거"
GFTR_D_remove_state_modifier_b_tt: "AI 통제 지역의 주 수식어가 삭제됩니다.\n~~~\n위 결정 참조. 현재 소유자는 무관합니다.\n~~~\n§G모든 AI 국가의 네이티브 트리 교체 시에만 권장§!."
GFTR_D_remove_special_mechanics_a: "          3. 특수 메커니즘 제거"
GFTR_D_remove_special_mechanics_a_tt: "현재 국가에서 특수 메커니즘이 삭제됩니다.\n~~~\n§Y특수 메커니즘§!은 일부 국가만 가진, 특정 초점으로만 조작 가능한 시스템입니다(예: 세력 균형, 소련 파라노이아, 폴란드 농민 반란 등).\n~~~\n§G네이티브§! 트리 교체 시 다른 방법으로 제거 불가.\n~~~\n대상 국가는 위 '요구 조건'에 표시."
GFTR_D_remove_special_mechanics_b: "          3. AI의 특수 메커니즘 제거"
GFTR_D_remove_special_mechanics_b_tt: "AI 통제 일부 국가에서 특수 메커니즘이 삭제됩니다.\n~~~\n위 결정 참조.\n~~~\n§G모든 AI 국가의 네이티브 트리 교체 시에만 권장§!."
# # # # # # # # # # # # # # #
GFTR_D_ai_management_SHOW: "4. AI 행동 설정"
GFTR_D_ai_management_SHOW_tt: "여기서 AI 통제 국가의 행동을 관리할 수 있습니다."
GFTR_D_ai_management_HIDE: "4. §R섹션 닫기§!"
GFTR_D_ai_political_freedom: "          4. \"정치적 자유\""
GFTR_D_ai_political_freedom_tt: "AI 통제 모든 국가에 국가 정신 §Y$GFTR_idea_ai_political_freedom$§! 부여.\n~~~\n기본적으로 모드에서 AI는 현재 이념과 맞는 정치 분기를 약간 우선하며, 역사 모드에서는 이념 변경·비역사적 동맹을 하지 않습니다.\n§Y정치적 자유§!는 이 제한을 해제합니다. 역사 모드에서도 AI가 더 자유롭고 랜덤해집니다.\n~~~\n바닐라에서는 별로 유용하지 않지만, 많은 새 국가를 추가하는 모드와의 호환을 위해 제작되었습니다(예: §L\"Every State Independent\"§!).\n~~~\nAI가 모든 정치 분기를 동일 확률로 선택하게 하거나 역사 모드를 무시하게 하고 싶을 때 사용하세요."
GFTR_D_ai_limit: "          4. AI 제한"
GFTR_D_ai_limit_tt: "현재 국가에 국가 정신 §Y$GFTR_idea_ai_limit$§! 부여.\n~~~\n특정 국가의 AI를 거의 \"비활성화\"하여 성능 향상에 도움이 됩니다(콘솔 + \"observe\" 필요).\n~~~\n§G참고§!: 위에 초점 트리 완전 삭제 결정도 있어 더 강하게 제한 가능."
GFTR_D_ai_madness_mode: "          4. \"광기\" 모드"
GFTR_D_ai_madness_mode_tt: "AI 통제 모든 국가에 국가 정신 §Y$GFTR_idea_ai_madness_mode$§! 부여.\n~~~\n§Y\"광기\" 모드§!는 AI가 전쟁 관련 경로만 선택하게 합니다. 모두가 모두와 싸우는 카오스에 빠져보세요! §R주의§!: §YGeneric Focus Tree: Redux§!가 있는 국가에만 적용."
GFTR_D_remove_management_ideas: "          4. 기술 정신 제거"
GFTR_D_remove_management_ideas_tt: "이 모드가 추가한 모든 기술 국가 정신이 모든 국가에서 삭제됩니다."
