l_korean:
GFTR_E_independence.1.t: "독립 전쟁!"
GFTR_E_independence.1.d: "우리의 인내심이 바닥났다. 이것은 우리의 땅이며, 우리가 원하는 대로 관리할 권리가 있다. 오늘부터 침략자와 점령자들에 맞서 싸움을 시작한다. 그들은 우리의 땅에 들어와 우리의 의지와 문화를 강요하고, 우리 백성을 노예로 만들고, 그들의 깃발을 우리의 땅에 꽂았다."
GFTR_E_independence.1.a: "그들의 피가 흘러라!"
# # # # # # # # # # # # # # #
GFTR_E_independence.2.t: "요청서"
GFTR_E_independence.2.d: "오늘 우리 괴뢰 국가로부터 공식 요청서가 도착했다. 그들은 우리의 영향력 재검토를 요구하며, 외교 및 국내 정책에서 독자적인 목소리를 내고자 하며, 사실상 완전한 독립국이 되기를 원한다고 선언했다. 요청서는 아직 신중하고 외교적인 톤이지만, 손가락을 튕기는 순간 전쟁으로 번질 수 있다."
GFTR_E_independence.2.a: "양보는 없다!"
GFTR_E_independence.2.b: "그들에게 독립을 허락할 것이다."
GFTR_E_independence.2.c: "배신자들! 우리 동맹에서 쫓아내라!"
GFTR_E_independence.2.d: "군대가 질서를 회복할 것이다."
# # # # # # # # # # # # # # #
GFTR_E_independence_response.0.t: "나쁜 소식이다"
GFTR_E_independence_response.0.d: "오늘 아침, 우리 옛 괴뢰 국가가 갑자기 독립을 선언하고 그 영토에 주둔 중이던 우리 군대를 공격하면서 등 뒤에서 찔린 꼴이 되었다. 협상 시도는 모두 거부당했다."
GFTR_E_independence_response.0.a: "전쟁을 원하나? 주도록 하마!"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.1.t: "거부당했다"
GFTR_E_independence_response.1.d: "며칠 전 독립 요청을 보냈으나, 오늘 단호한 거부를 받았다. 메트로폴리스는 우리를 놓아주려 하지 않으며, 이에 대한 어떤 논의도 거부했다. 외교는 막다른 골목에 갇혔다."
GFTR_E_independence_response.1.a: "싸워야 할 것이다!"
GFTR_E_independence_response.1.b: "…좋아"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.2.t: "우리는 자유다!"
GFTR_E_independence_response.2.d: "좋은 소식이다! 메트로폴리스가 공식적으로 우리의 독립을 인정했다. 이제부터 우리는 스스로 운명을 결정한다. 우리 민중에게는 교과서에 실릴 역사적인 날이다."
GFTR_E_independence_response.2.a: "만세! 만세! 만세!"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.3.t: "쓰디쓴 자유"
GFTR_E_independence_response.3.d: "오늘 메트로폴리스로부터 모호한 답변을 받았다. 우리는 배신자라는 누명을 썼다! 독립을 얻었지만, 옛 메트로폴리스는 우리와의 모든 외교 관계를 끊었다. 우리는 자유롭지만, 이 혼란스러운 시대에 홀로 남겨졌다. 그들의 거친 말에도 불구하고 무력 충돌은 피할 수 있었다."
GFTR_E_independence_response.3.a: "평화롭게 끝난 게 제일 중요하다."
# # # # # # # # # # # # # # #
GFTR_E_independence_response.4.t: "독립 전쟁"
GFTR_E_independence_response.4.d: "오늘 우리의 종속 문제를 외교적으로 해결할 희망이 무너졌다. 최근 요청에 메트로폴리스가 국경에 군대를 배치하고 우리 주권 국가가 되려는 열망을 진압하기 위해 침공을 준비하고 있다. 이제 우리는 자유만이 아니라 국가의 생존 자체를 위해 싸운다."
GFTR_E_independence_response.4.a: "우리는 버틸 것이다!"
# # # # # # # # # # # # #
GFTR_E_change_of_power.1.t: "선거가 끝났다"
GFTR_E_change_of_power.1.d: "나라에서 공정하고 민주적인 선거가 치러졌다. 국민이 선택을 내렸다."
GFTR_E_change_of_power.1.a: "좋아"
# # # # # # # # # # # # #
GFTR_E_change_of_power.2.t: "권력 장악"
GFTR_E_change_of_power.2.d: "예상했던 저항은 일어나지 않았다. 구 체제는 패배를 인정하고 권한을 내려놓았으며, 새로운 정권에 평화롭게 통치권을 넘겼다."
GFTR_E_change_of_power.2.a: "올바른 결정"
# # # # # # # # # # # # #
GFTR_E_change_of_power.3.t: "내전이다!"
GFTR_E_change_of_power.3.d: "정치 위기가 극에 달했다. 국가는 적대적인 두 진영으로 갈라졌고, 권력 투쟁이 전면적인 무장 충돌로 변했다."
GFTR_E_change_of_power.3.a: "우리가 이길 것이다"