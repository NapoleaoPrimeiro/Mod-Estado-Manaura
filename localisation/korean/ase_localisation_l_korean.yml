l_korean:
ase_Asia_War:0 "§RTora! Tora! Tora!§!"
ase_Asia_War_QUOTE:0 "Today, Admiral Yamamoto decided to smash the American fleet in the Pacific. The operation is meant to ensure Japan's unhindered conquest of all Southeast Asia, including the oil fields of the Dutch East Indies."
ase_Asia_War_REMARK:0 "Defend the rubber!"
ase_Asia_War_REMARK_a:0 "Together we can do it!"
ase_Asia_War_REMARK_jap:0 "For the Emperor!"

ase_Barbarossa:0 "§ROperation Barbarossa§!"
ase_Barbarossa_QUOTE:0 "The German Armed Forces must be ready, even before the war with England is over, to crush Soviet Russia in a swift campaign. It is of decisive importance that our intention to attack must not be known. \n- §RBarbarossa has begun§!"
ase_Barbarossa_REMARK:0 "To arms!"

ase_WW2_Started:0 "§RThe Outbreak of World War II§!"
ase_WW2_Started_QUOTE:0 "Hitler's German Reich has invaded Poland. France, the United Kingdom, and the Commonwealth quickly responded by declaring war on Germany. Martial law has been declared in France, civil aviation in Germany has been suspended, and children in London are being evacuated to the countryside. \n- §RWorld War II has begun§!"
ase_WW2_Started_REMARK:0 "War is Hell..."

ase_Great_Italy:0 "§RIrredentist Goals Achieved§!"
ase_Great_Italy_QUOTE:0 "Today, the Duce proclaimed the start of integrating regions claimed by Italian irredentists into the country. He declared that this would strengthen Italy’s position as a world power and finally unite the Italian people under one flag."
ase_Great_Italy_REMARK:0 "Vincere!"

ase_Anschluss:0 "§RAnschluss of Austria§!"
ase_Anschluss_QUOTE:0 "After a successful coup in Vienna carried out by local Nazis, German troops crossed the Austrian border and took control of the country.\n\nAccording to reports, there was no resistance, and German soldiers were welcomed in the streets by cheering crowds.\n\nSpeaking before the gathered masses at Heldenplatz in Vienna, Hitler announced the Anschluss of Austria — its unification with Germany:\n\n\"The oldest German eastern province will now become the newest bastion of the German Reich!\""
ase_Anschluss_REMARK:0 "Is this even legal?"
ase_Anschluss_REMARK_a:0 "Welcome to the Reich!"

ase_Czech:0 "§RThe Fate of Czechoslovakia§!"
ase_Czech_QUOTE:0 "German troops have crossed into Bohemia and Moravia, ostensibly to restore order to the regions in the wake of the collapsing Czechoslovakian government. \n\nIn Prague, the occupying forces announced the creation of an 'autonomous protectorate' within the German Reich.\n The nation of Czechoslovakia is no more."
ase_Czech_REMARK:0 "So much for peace"

ase_Stalingrad:0 "§RThe Battle of Stalingrad§!"
ase_Stalingrad_QUOTE:0 "At this moment, the meat grinder of Stalingrad is raging. \n\nIt is not yet clear who truly controls the city, but German forces have advanced deep into the urban areas. \n\nThe results of this battle will determine the fate of the war."
ase_Stalingrad_REMARK:0 "A horrifying sight..."

ase_Dday:0 "§RD-Day§!"
ase_Dday_QUOTE:0 "Under the cover of powerful air and artillery support, thousands of soldiers crossed the English Channel to open the long-awaited second front in Europe. \nDespite fierce German resistance, the Allies managed to secure the beaches and begin their advance into the heart of France. \n\n §RIs this the end of Nazi domination in Europe?§!"
ase_Dday_REMARK:0 "A turning point in the war?"

ase_Berlin:0 "§RThe Fall of Berlin§!"
ase_Berlin_QUOTE:0 "The Red Army has captured most of Berlin and the Reichstag. Fighting in the city rages with ferocity — street by street, block by block, Soviet troops push forward. \n\nGerman forces, despite being surrounded and hopeless, continue to resist to the very end. \n- §RBerlin has fallen§!"
ase_Berlin_REMARK:0 "It all led to this..."
ase_Berlin_REMARK_ger:0 "Hold the capital to the end!"

ase_Cairo:0 "§RThe Fall of Cairo§!"
ase_Cairo_QUOTE:0 "The ancient city on the banks of the Nile has fallen. The symbol of the Arab world and the heart of Egypt is now in Nazi hands. Crowds flee through the streets, the mosques fall silent, and German flags rise above the city. The fate of the entire region now hangs by a thread — the fall of Cairo is a blow not only to Egypt but to the whole Middle East. \n- §R'The one who holds Cairo, holds the East.'§!"
ase_Cairo_REMARK:0 "Protect the oil!"

ase_Moskov:0 "§RThe Battle of Moscow§!"
ase_Moskov_QUOTE:0 "Snow and steel have merged in a deadly clash. The enemy stands at the gates of the capital — the fate of the nation will be decided here, on the approaches to Moscow. \nEvery house has become a fortress, every street a battlefield. The red walls of the Kremlin reflect the flashes of explosions, while the radio blares: \n“§RFor Moscow! Not one step back!§!”"
ase_Moskov_REMARK:0 "The end of the Red Giant?"

ase_Fall_Fra:0 "§RThe Fall of France§!"
ase_Fall_Fra_QUOTE:0 "Paris has fallen. Columns of Nazis march along the Champs-Élysées, and the French government signs the act of capitulation. Europe trembles once more to the sound of the enemy's triumphant fanfares. \nYet in the heart of France, a spark of resistance still burns — those who refuse to surrender are preparing to continue the fight for freedom."
ase_Fall_Fra_REMARK:0 "Well, they tried."
ase_Fall_Fra_REMARK_a:0 "The German army is invincible!"

ase_Italy_War:0 "§RItaly Enters the War§!"
ase_Italy_War_QUOTE:0 "Today, at the Piazza Venezia in Rome, the Duce addressed the people of Italy: 'Today our destined hour has struck in the heavens! For years Italy has waited for this moment, tempering its strength, forging its resolve — now it enters the war not from fear, but from will, from faith, from the right to be a great power.' \n- §R'Fate calls — and we answer!'§!"
ase_Italy_War_REMARK:0 "Another pawn of Germany..."
ase_Italy_War_REMARK_a:0 "At last."
ase_Italy_War_REMARK_ita:0 "Saluto al Duce!"

ase_Kursk:0 "§RThe Battle of Kursk§!"
ase_Kursk_QUOTE:0 "The largest tank battle of the Second World War has begun. After the great encirclements near Kiev and the shortage of supplies, the Red Army was forced to retreat to Kursk. Now the Wehrmacht has caught up and is fighting to break through the Soviet defenses around the city.\n- §RThe outcome of this battle will decide who holds the initiative on the Eastern Front.§!"
ase_Kursk_REMARK:0 "They've gone too far..."
ase_Kursk_REMARK_a:0 "Germany will prevail!"

ase_ASE_Blitzkrieg:0 "§RBlitzkrieg§!"
ase_ASE_Blitzkrieg_QUOTE:0 "The lightning campaign in Poland has demonstrated the superiority of the new German tactic - §RBlitzkrieg§!. Autonomous armored groups (fists), supported by active air operations, have broken through Polish defenses, disrupted communications between fronts, and forced the Polish government to evacuate to Britain."
ase_ASE_Blitzkrieg_REMARK:0 "An interesting tactic"
ase_ASE_Blitzkrieg_REMARK_a:0 "Just as the Führer had planned!"

ase_2Sino_War:0 "§RSecond Sino–Japanese War§!"
ase_2Sino_War_QUOTE:0 "Following the Marco Polo Bridge Incident near Beijing, §RJapan launched a full-scale invasion§! of mainland China. \nIn response, China formed the Second United Front to jointly resist the threat."
ase_2Sino_War_REMARK:0 "The world is already unstable..."
ase_2Sino_War_REMARK_g:0 "Tenno Heika, Banzai!"
ase_2Sino_War_REMARK_china:0 "We are many — they are few"

ase_Winter_War:0 "§RThe Winter War§!"
ase_Winter_War_QUOTE:0 "Citing security concerns for Leningrad, the Soviet leadership made several proposals for Finland to cede border territories in exchange for land in Karelia. \nFinland rejected these proposals. \nPerhaps instead of defending Leningrad, the Soviet Union intends to conquer the entire country."
ase_Winter_War_REMARK:0 "Another war..."
ase_Winter_War_REMARK_c:0 "We tried to negotiate!"
ase_Winter_War_REMARK_fin:0 "Njet, Molotov!"

ase_Kiev:0 "§RFall of Kyiv§!"
ase_Kiev_QUOTE:0 "Despite the large Komsomol militia in Kyiv, Army Group South and the 2nd Panzer Group from Army Group Center broke through the defenses of the Southwestern Front of the Red Army.\nSoviet forces were encircled and crushed, and the remnants of the front retreated far beyond the Dnieper.\n\nMany civilians don't seem to miss the communists much."
ase_Kiev_REMARK:0 "The communists are losing?"
ase_Kiev_REMARK_c:0 "We should have attacked!"
ase_Kiev_REMARK_a:0 "This is only the beginning!"

ase_Normandy:0 "§RAtlantic Wall§!"
ase_Normandy_QUOTE:0 "The construction project of the century — the §R\"Atlantic Wall\"§! — is nearing completion, intended by German leadership to protect them from a seaborne invasion.\n\nFritz Todt, Reich Minister for Armaments and Munitions, has already scheduled the celebration of its completion."
ase_Normandy_QUOTE_a:0 "The construction project of the century — the §R\"Atlantic Wall\"§! — is nearing completion, intended by the Führer to shield the German nation from barbarians from the sea.\n\nFritz Todt has already arranged a celebration, complete with a large swastika cake."
ase_Normandy_REMARK:0 "Maybe land somewhere else?"
ase_Normandy_REMARK_a:0 "Landing? What landing?"

ase_Spain_Civil_War:0 "§RSpanish Civil War§!"
ase_Spain_Civil_War_QUOTE:0 "During the day, the rebellious General Gonzalo Queipo de Llano, known for his liberal reputation, unexpectedly seized power in the southern city of Seville. Soon, fierce fighting broke out between rebels and republicans.\n\nThe uprising quickly spread across all of Spain. The rebels achieved significant success, capturing 35 out of 50 provincial capitals."
ase_Spain_Civil_War_REMARK:0 "As expected..."
ase_Spain_Civil_War_REMARK_spr:0 "¡Viva España!"

ase_Spain_Franco_Win:0 "§RVictory of Francisco Franco§!"
ase_Spain_Franco_Win_QUOTE:0 "The long and bloody Spanish Civil War has come to an end.\n\n\"The Red Army has collapsed, all key points of the country are under nationalist control. §RThe war is over§!.\"\n— thus declared Caudillo and Generalissimo Francisco Franco, announcing victory in the brutal conflict."
ase_Spain_Franco_Win_REMARK:0 "Noted..."
ase_Spain_Franco_Win_REMARK_a:0 "A new ally?"
ase_Spain_Franco_Win_REMARK_spr:0 "¡Viva Franco!"

ase_Citadel:0 "§ROperation Citadel§!"
ase_Citadel_QUOTE:0 "The largest tank battle of the Second World War has begun. After the massive encirclements near Kyiv, and due to supply shortages, the Red Army was forced to retreat toward Kursk. At this moment, the Wehrmacht is already fighting for the city, attempting to break through Soviet defenses.\n- §RThe outcome of this battle will determine who holds the initiative on the Eastern Front§!"
ase_Citadel_REMARK:0 "They've gone too far..."
ase_Citadel_REMARK_a:0 "The decisive battle!"

#######

ase_Nuclear1:0 "§RThe Atomic Dawn§!"
ase_Nuclear1_QUOTE:0 "For the first time in history, a nuclear bomb has been detonated in the course of war. It was used by the nation [?global.nukecountry.GetNameDef]. The sheer scale of destruction demonstrates the power of this new weapon, which instills fear not only because of what it can do, but also because of the consequences it brings — for those who wield it, and for all of humanity.\n- §RThe world holds its breath§!"
ase_Nuclear1_REMARK:0 "The atomic age has begun..."

ase_Great_Reich:0 "§RThe Greater German Reich§!"
ase_Great_Reich_QUOTE:0 "After a series of victories and territorial expansions, the Reich has secured its dominance over Europe. Subjugated peoples are integrated into the new order, and Speer has just completed his grand project of transforming Berlin into the World Capital — §RGermania§!. The largest domed structure ever built — the §RHall of Glory§! — now stands as a symbol of unity, power, and the unwavering will of the Aryan race."
ase_Great_Reich_REMARK:0 "How did we let this happen?"
ase_Great_Reich_REMARK_a:0 "A great victory!"

ase_New_Order:0 "§RThe New World Order§!"
ase_New_Order_QUOTE:0 "The fall of the Statue of Liberty has become a symbol of the end of an era. No force remains capable of stopping the Nazis.\nUpon the ruins of the former world hegemon rises a §Rnew world order§!."
ase_New_Order_REMARK:0 "The collapse of democracy..."

ase_Eva_Braun:0 "§RIron Lady§!"
ase_Eva_Braun_QUOTE:0 "Somehow, Eva Braun is now in control of the USA. Yeah, we don't understand how that happened either.\nHistorians are confused, generals are panicking, and someone clearly §Rbroke the timeline§!."
ase_Eva_Braun_REMARK:0 "Well… at least she's pretty"

#######

