l_polish:
# # # # # # # # # # # # # # #
GFTR_categories_settings: "Ustawienia"
GFTR_categories_settings_desc: "Witaj! Bardzo się cieszę, że subskrybujesz moda §YGeneric Focus Tree: Redux!§! Jeśli podoba Ci się moja praca, proszę wesprzyj moda na stronie Warsztatu Steam :) \nTam znajdziesz też wszystkie najnowsze zmiany oraz możesz zgłosić mi problemy lub błędy."
# # # # # # # # # # # # # # #
GFTR_D_set_focus_tree_SHOW: "1. Zainstalować drzewko fokusów?"
GFTR_D_set_focus_tree_SHOW_tt: "Tutaj możesz instalować lub usuwać różne drzewka fokusów dla swojego i innych krajów."
GFTR_D_set_focus_tree_HIDE: "1. §RZamknij sekcję§!"
GFTR_D_set_gftr_a: "          1. Zainstaluj (GFT: Redux)"
GFTR_D_set_gftr_a_tt: "Bieżący kraj otrzyma otrzyma lub zaktualizuje §YGeneric Focus Tree: Redux§!. \n~~~ \nUwaga: jeśli wymienisz drzewko fokusów kraju z unikalnym drzewkiem vanilla/DLC (np. Niemcy, Francja, Iran itd.), przywrócenie oryginalnego drzewka będzie możliwe tylko §Lrozpoczynając nową grę§! lub §Lprzez konsolę§!."
GFTR_D_set_gftr_b: "          1. Zainstaluj (GFT: Redux) dla AI"
GFTR_D_set_gftr_b_tt: "§YGeneric Focus Tree: Redux§! zostanie zainstalowane lub zaktualizowane we WSZYSTKICH krajach kontrolowanych przez AI. \n~~~ \n§LUważaj§! – wszystkie kraje AI otrzymają nowe drzewko. §GZalecane§! tylko na samym początku gry oraz po wcześniejszym usunięciu duchów narodowych i specjalnych mechanik (decyzje poniżej)."
GFTR_D_set_generic_focus: "          1. Zainstaluj drzewko vanilla"
GFTR_D_set_generic_focus_tt: "Bieżący kraj otrzyma lub zaktualizuje §Gvanilla§! podstawowe drzewko fokusów.\n~~~ \nFunkcja ładuje aktualne drzewko vanilla z gry – może być zmodyfikowane przez inne duże mody. Wtedy zostanie zainstalowane to zmodyfikowane drzewko."
GFTR_D_deleted_focus_tree: "          1. Usuń drzewko fokusów"
GFTR_D_deleted_focus_tree_tt: "Drzewko fokusów bieżącego kraju zostanie §Rusunięte§!. Dokładniej: zostanie zastąpione całkowicie pustym drzewkiem (bez żadnego fokusu poza „ciągłymi“). \n~~~ \nSzczerze nie wiem po co to komu §YXD§! Może chcesz uczynić kraj „nieaktywnym“ – wyłączenie drzewka może nieco poprawić wydajność."
GFTR_D_test_focus_tree: "          1. Testuj moda"
GFTR_D_test_focus_tree_tt: "Zostanie zainstalowana dokładna kopia §YGeneric Focus Tree: Redux§!, ale każdy fokus trwa tylko 1 dzień. \n~~~ \nFunkcja stworzona głównie do testowania zachowania AI. Możesz jej użyć, by pomóc mi znaleźć problemy z AI. \n~~~ \nMoże być też zabawna w zwykłej grze."
# # # # # # # # # # # # # # #
GFTR_D_remove_national_spirits_SHOW: "2. Usunąć duchy narodowe?"
GFTR_D_remove_national_spirits_SHOW_tt: "Tutaj możesz usuwać różne duchy narodowe ze swojego i innych krajów."
GFTR_D_remove_national_spirits_HIDE: "2. §RZamknij sekcję§!"
GFTR_D_remove_gftr_national_spirits_a: "          2. Usuń duchy (GFT: Redux)"
GFTR_D_remove_gftr_national_spirits_a_tt: "Wszystkie duchy narodowe dodane przez §YGeneric Focus Tree: Redux§! zostaną usunięte z bieżącego kraju. \n~~~ \nDuchy techniczne nie będą usunięte."
GFTR_D_remove_gftr_national_spirits_b: "          2. Usuń duchy (GFT: Redux) z AI"
GFTR_D_remove_gftr_national_spirits_b_tt: "Wszystkie duchy narodowe dodane przez §YGeneric Focus Tree: Redux§! zostaną usunięte ze WSZYSTKICH krajów AI. \n~~~ \nDuchy techniczne nie będą usunięte. \n~~~ \n§RUważaj§! – może spowodować krótkie zacięcia."
GFTR_D_remove_vanilla_national_spirits_a: "          2. Usuń duchy vanilla"
GFTR_D_remove_vanilla_national_spirits_a_tt: "Wszystkie początkowe §Gvanilla§! duchy narodowe zostaną usunięte z bieżącego kraju! \n~~~ \nGra nie posiada prostej funkcji „usuń wszystkie duchy“, więc usuwana jest tylko predefiniowana lista z 1936 roku. Użycie później prawdopodobnie nie da efektu. §GZalecane§! tylko na samym początku gry."
GFTR_D_remove_vanilla_national_spirits_b: "          2. Usuń duchy vanilla z AI"
GFTR_D_remove_vanilla_national_spirits_b_tt: "Wszystkie początkowe §Gvanilla§! duchy narodowe zostaną usunięte ze WSZYSTKICH krajów AI. \n~~~ \nTe same ograniczenia co wyżej. §GZalecane§! tylko na początku gry. \n~~~ \n§RUważaj§! – może spowodować krótkie zacięcia."
# # # # # # # # # # # # # # #
GFTR_D_remove_unique_mechanics_SHOW: "3. Usunąć unikalne mechaniki?"
GFTR_D_remove_unique_mechanics_SHOW_tt: "Tutaj możesz usuwać specjalne mechaniki, decyzje i modyfikatory, które przeszkadzają przy wymianie natywnych drzewek fokusów."
GFTR_D_remove_unique_mechanics_HIDE: "3. §RZamknij sekcję§!"
GFTR_D_remove_state_modifier_a: "          3. Usuń modyfikatory stanów"
GFTR_D_remove_state_modifier_a_tt: "Niektóre modyfikatory prowincji zostaną usunięte z bieżącego kraju. \n~~~ \n§YModyfikatory prowincji§! to specjalne modyfikatory tylko niektórych prowincji (np. „Decentralizacja“ w Etiopii, „Kurdyjski separatyzm“ w Turcji). \n~~~ \n§GPrzy wymianie§! §Gnatywnego§! drzewka stają się one permanentne. Ta decyzja je usuwa. \n~~~ \nKraje objęte podane w „Wymaganiach“. §L(Dotyczy też wersji AI)§! \n~~~ \n§GZalecane§! na starcie gry."
GFTR_D_remove_state_modifier_b: "          3. Usuń modyfikatory stanów z AI"
GFTR_D_remove_state_modifier_b_tt: "Modyfikatory prowincji zostaną usunięte z regionów kontrolowanych przez AI. \n~~~ \nSzczegóły w decyzji powyżej. Właściciel nie ma znaczenia. \n~~~ \n§GZalecane§! tylko przy wymianie natywnych drzewek wszystkich krajów AI."
GFTR_D_remove_special_mechanics_a: "          3. Usuń specjalne mechaniki"
GFTR_D_remove_special_mechanics_a_tt: "Specjalne mechaniki zostaną usunięte z bieżącego kraju. \n~~~ \n§YSpecjalne mechaniki§! to unikalne systemy niektórych krajów (np. Równowaga sił, paranoja ZSRR, powstanie chłopskie w Polsce). \n~~~ \n§GPrzy wymianie§! natywnego drzewka nie da się ich usunąć inaczej. \n~~~ \nKraje objęte w „Wymaganiach“ powyżej."
GFTR_D_remove_special_mechanics_b: "          3. Usuń specjalne mechaniki z AI"
GFTR_D_remove_special_mechanics_b_tt: "Specjalne mechaniki zostaną usunięte z wybranych krajów AI. \n~~~ \nSzczegóły w decyzji powyżej. \n~~~ \n§GZalecane§! tylko przy wymianie natywnych drzewek wszystkich krajów AI."
# # # # # # # # # # # # # # #
GFTR_D_ai_management_SHOW: "4. Skonfigurować zachowanie AI?"
GFTR_D_ai_management_SHOW_tt: "Tutaj możesz kontrolować zachowanie krajów kontrolowanych przez AI."
GFTR_D_ai_management_HIDE: "4. §RZamknij sekcję§!"
GFTR_D_ai_political_freedom: "          4. \"Wolność polityczna\""
GFTR_D_ai_political_freedom_tt: "Wszystkie kraje AI otrzymają ducha narodowego §Y$GFTR_idea_ai_political_freedom$§!. \n~~~ \nDomyślnie w modzie AI nieco bardziej preferuje gałąź polityczną swojej ideologii i w trybie historycznym nigdy jej nie zmienia. \n§YWolność polityczna§! usuwa te ograniczenia – AI będzie bardziej wolna i losowa nawet w trybie historycznym. \n~~~ \nMało przydatne w czystej vanilla, ale świetne do modów z wieloma nowymi krajami (np. §L\"Every State Independent\"§!). \n~~~ \nWarto użyć, jeśli chcesz, by AI wybierała wszystkie gałęzie z równym prawdopodobieństwem lub ignorowała tryb historyczny."
GFTR_D_ai_limit: "          4. Ogranicz AI"
GFTR_D_ai_limit_tt: "Bieżący kraj otrzyma ducha narodowego §Y$GFTR_idea_ai_limit$§!. \n~~~ \nPrzydatne do „wyłączenia“ AI wybranego kraju i poprawy wydajności (wymaga konsoli + \"observe\"). \n~~~ \n§GPrzypomnienie§!: wyżej jest decyzja usuwająca całe drzewko fokusów – jeszcze silniejsze ograniczenie AI."
GFTR_D_ai_madness_mode: "          4. Tryb \"Szaleństwo\""
GFTR_D_ai_madness_mode_tt: "Wszystkie kraje AI otrzymają ducha narodowego §Y$GFTR_idea_ai_madness_mode$§!. \n~~~ \n§YTryb \"Szaleństwo\"§! zmusza AI do wyboru wyłącznie ścieżek wojennych. Zanurz się w chaosie, gdzie wszyscy walczą wszyscy ze wszystkimi! §RUwaga§! – dotyczy tylko krajów z §YGeneric Focus Tree: Redux§!."
GFTR_D_remove_management_ideas: "          4. Usuń techniczne duchy"
GFTR_D_remove_management_ideas_tt: "Wszystkie techniczne duchy narodowe dodane przez ten mod zostaną usunięte z WSZYSTKICH krajów."
