l_polish:
GFTR_E_independence.1.t: "Wojna o niepodległość!"
GFTR_E_independence.1.d: "Nasza cierpliwość się wyczerpała. To nasza ziemia i my będziemy nią zarządzać tak, jak uznamy za stosowne. Dziś rozpoczynamy walkę z najeźdźcami i okupantami, którzy weszli na nasze terytorium, narzucili nam swoją wolę i kulturę, zniewolili nasz lud i wbijają swoją flagę w naszą glebę."
GFTR_E_independence.1.a: "Niech ich krew się poleje!"
# # # # # # # # # # # # # # #
GFTR_E_independence.2.t: "List z prośbą"
GFTR_E_independence.2.d: "Dziś otrzymaliśmy oficjalny list od naszego państwa marionetkowego. Domagają się przeglądu naszego wpływu, chcą mieć własny głos w polityce zagranicznej i wewnętrznej oraz jawnie deklarują pragnienie uzyskania pełnej niepodległości. Ton listu jest na razie powściągliwy i dyplomatyczny, ale wystarczy pstryknięcie palcami, by wszystko przerodziło się w wojnę."
GFTR_E_independence.2.a: "Żadnych ustępstw!"
GFTR_E_independence.2.b: "Jesteśmy gotowi przyznać im niepodległość."
GFTR_E_independence.2.c: "Zdrajcy! Precz z naszego sojuszu!"
GFTR_E_independence.2.d: "Armia przywróci porządek."
# # # # # # # # # # # # # # #
GFTR_E_independence_response.0.t: "Złe wieści"
GFTR_E_independence_response.0.d: "Dziś rano doznaliśmy ciosu w plecy od naszego dawnego państwa marionetkowego, które nagle ogłosiło niepodległość i zaatakowało nasze wojska stacjonujące na jego terytorium. Nasze próby negocjacji zostały odrzucone."
GFTR_E_independence_response.0.a: "Chcą wojny? Dostaną ją!"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.1.t: "Odmowa"
GFTR_E_independence_response.1.d: "Kilka dni temu wysłaliśmy prośbę o niepodległość, ale dziś otrzymaliśmy kategoryczną odmowę. Metropolia nie chce nas puścić i odrzuciła wszelkie rozmowy na ten temat. Dyplomacja utknęła w martwym punkcie."
GFTR_E_independence_response.1.a: "Będziemy musieli walczyć!"
GFTR_E_independence_response.1.b: "Dobra..."
# # # # # # # # # # # # # # #
GFTR_E_independence_response.2.t: "Jesteśmy wolni!"
GFTR_E_independence_response.2.d: "Dobra wiadomość! Metropolia oficjalnie uznała naszą niepodległość. Od teraz sami kształtujemy swój los. Dla naszego ludu to historyczny dzień, który trafi do podręczników."
GFTR_E_independence_response.2.a: "Hurra! Hurra! HURRA!"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.3.t: "Wolność z gorzkim posmakiem"
GFTR_E_independence_response.3.d: "Dziś otrzymaliśmy niejednoznaczne pismo od metropolii. Oskarżono nas o zdradę! Uzyskaliśmy niepodległość, lecz dawna metropolia zerwała z nami wszelkie stosunki dyplomatyczne. Jesteśmy wolni, ale zdani tylko na siebie w tych burzliwych czasach. Mimo ostrości słów uniknęliśmy konfliktu zbrojnego."
GFTR_E_independence_response.3.a: "Ważne, że obyło się bez przemocy."
# # # # # # # # # # # # # # #
GFTR_E_independence_response.4.t: "Wojna o niepodległość"
GFTR_E_independence_response.4.d: "Nasze nadzieje na pokojowe rozwiązanie kwestii podległości runęły dziś na ziemię. Po naszym niedawnym wniosku metropolia wysłała wojska na granicę i szykuje się do inwazji, by stłumić naszą wolę zostania suwerennym państwem. Od tej chwili nie walczymy już tylko o wolność, lecz o samo istnienie naszego państwa."
GFTR_E_independence_response.4.a: "Wytrwamy!"
# # # # # # # # # # # # # #
GFTR_E_change_of_power.1.t: "Wybory za nami"
GFTR_E_change_of_power.1.d: "W kraju odbyły się uczciwe demokratyczne wybory. Naród dokonał wyboru."
GFTR_E_change_of_power.1.a: "Dobrze"
# # # # # # # # # # # # # #
GFTR_E_change_of_power.2.t: "Przejęcie władzy"
GFTR_E_change_of_power.2.d: "Oczekiwanego oporu nie było. Stary reżim uznał swoją porażkę i złożył pełnomocnictwa, przekazując kontrolę nowemu rządowi bez walki."
GFTR_E_change_of_power.2.a: "Słuszna decyzja"
# # # # # # # # # # # # # #
GFTR_E_change_of_power.3.t: "Wojna domowa!"
GFTR_E_change_of_power.3.d: "Kryzys polityczny osiągnął punkt kulminacyjny. Kraj rozpadł się na dwa wrogie obozy, a spór o władzę przerodził się w otwarty konflikt zbrojny."
GFTR_E_change_of_power.3.a: "Poradzimy sobie"