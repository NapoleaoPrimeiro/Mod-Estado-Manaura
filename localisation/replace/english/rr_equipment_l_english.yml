 GER_land_cruiser_equipment_1:0 "Landkreuzer P.1000 Ratte"
 GER_land_cruiser_equipment_1_short:0 "Ratte"
 GER_land_cruiser_equipment_1_desc:0 "The P.1000 Ratte was a super-heavy tank concept developed by Germany during World War II. Proposed by Krupp in 1942, the design envisioned a 1,000-ton armored behemoth, armed with two 280 mm naval guns, multiple secondary weapons, and armor up to 360 mm thick. The Ratte was intended to serve as a mobile fortress capable of overpowering any opponent on the battlefield. However, due to its enormous size, high fuel consumption, and logistical infeasibility, the project was deemed impractical and ultimately canceled in 1943."
