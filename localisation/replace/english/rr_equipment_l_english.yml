 GER_heavy_tank_flame_equipment_2_short:0 "Flammtiger"
 GER_heavy_tank_flame_equipment_3:0 "Flammanlage auf Jagdtiger"
 GER_heavy_tank_flame_equipment_3_short:0 "Flammjagdtiger"
