 SPA_nationalist_garrison_control_decisions_tt: "£decision_modifier_texticon  \nSchaltet die Entscheidungen „§YGarnisonskontrolle ausweiten§!“ auf der Karte frei, wodurch §YNationalistischer Einfluss§! in Staaten §Gausgeweitet§! werden kann .\n\nNur Staaten mit §Rvollständiger§! nationalistischer §YGarnisonskontrolle§! bei Ausbruch des Bürgerkriegs beginnen den Konflikt unter §Ynationalistischer Eigentümerschaft§!.\n"
