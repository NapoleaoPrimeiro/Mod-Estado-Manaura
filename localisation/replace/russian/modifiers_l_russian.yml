 NOR_prepare_historical_unlock_TT: "£decision_modifier_texticon  Открывает решение §Y«Развить регион»§!, позволяющее ускорить §Gгражданское строительство§!, но дающее штрафы к §Rвоенному строительству и обороне§!."
