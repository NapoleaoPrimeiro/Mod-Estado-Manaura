 PER_reintegrate_anatolia_tt: "£decision_modifier_texticon  Открывается решение §Y«Реинтегрировать Анатолию»§!, которое позволит нам интегрировать завоеванные территории."
 PER_absorb_byzantines_tt: "£decision_modifier_texticon  Открывается решение §Y«Поглотить Византию»§!, которое позволит нам интегрировать завоеванные территории."
 PER_memphis_initiative_tt: "£decision_modifier_texticon  Открывается решение §Y«Мемфисская инициатива»§!, которое позволит нам интегрировать завоеванные территории."
 PER_address_the_issue_tt: "£decision_modifier_texticon  Открывает §Yрешения исламской революции§!, которые дают нам §R90 дней§!, чтобы усмирить революционеров."
 PER_resistance_decisions_tt: "£decision_modifier_texticon  Открывает решения §Y«Внедренное сопротивление»§!, которые позволяют расшатать обстановку в соседних государствах перед вторжением."
 PER_assessing_the_opposition_tt: "£decision_modifier_texticon  Открывает решения «§YДавление на правительство§!» в рамках задания «§YГражданские беспорядки§!» из «§YНаследия величия§!», что позволит нам снизить риск и предотвратить гражданскую войну."
 SPR_republican_garrison_control_decisions_tt: "£decision_modifier_texticon  \nОткрывает решение на карте §YРасширить контроль над гарнизоном§!, позволяющее §Gпротиводействовать§! §Yвлиянию националистов§! в государствах.\n\nГосударства, в которых на момент начала гражданской войны нет §Rтотального§! националистического §Yконтроля над гарнизоном§!, вступят в конфликт под §Yуправлением республиканцев§!.\n"
 SPA_nationalist_garrison_control_decisions_tt: "£decision_modifier_texticon  \nОткрывает решение на карте §YРасширить контроль над гарнизоном§!, позволяющее §Gрасширить§! §Yвлияние националистов§! в государствах.\n\nТолько государства, в которых на момент начала гражданской войны действует §Gтотальный§! националистический §Yконтроль над гарнизоном§!, вступят в конфликт под §Yуправлением националистов§!.\n"
 lar_spain.6_tt: "£decision_modifier_texticon  \nОткрывает на карте решения §YАтака в гражданской войне§!, позволяющие убрать в выбранных регионах боевые штрафы за §Rнезапланированное наступление§!.\n"
 SPA_the_fifth_column_tt: "£decision_modifier_texticon  Открывает решения §YЗадействовать пятую колонну§!, которые позволяют разжигать мелкие восстания на территории противника.\n"
 SPR_recovering_from_civil_war_focus_tt: "£decision_modifier_texticon  Открывает решение §YВосстановление после гражданской войны§!, которое позволяет вернуть владения Испании в статус §Yнациональных территорий§!, если у них достаточно высок уровень §Yподчинения§!.\n"
 SPA_reassert_american_dominance_tt: "£decision_modifier_texticon  Открывает решение §YУтвердить американское доминирование§!, позволяющее мирно подчинить себе более слабые страны Американского континента.\n"
 SPA_reduce_reliance_on_foreign_resources_tt: "£decision_modifier_texticon  Открывает уникальное решение §YРазведка ресурсов§!, позволяя расширить уже существующие залежи ресурсов на материке и разработать новые.\n"
 SPA_prepare_the_carlist_insurrection_tt: "£decision_modifier_texticon  Открывает решение §YПодготовка карлистского мятежа§!, позволяя привлечь подчиненные государства на сторону карлистов в начале мятежа.\n\nТакже на стороне карлистов будут §YБургос§! и §YНаварра§!, если они находятся под контролем."
 SPR_foreign_arms_purchases_tt: "£decision_modifier_texticon  Открывает решение §YЗакупка иностранного вооружения§!, позволяя закупать снаряжение различного типа.\n"
 SPR_plant_the_seeds_of_revolution_tt: "£decision_modifier_texticon  Открывает решение §YЗёрна революции§!, позволяя разжигать восстания анархистов во враждебных соседних странах.\n"
 SPR_global_defense_council_tt_2: "£decision_modifier_texticon  Открывает решение §YЗёрна революции§!, позволяя осуществлять передачу и перевод в статус национальных территорий любых контролируемых стран, у которых достаточно высок уровень §Yподчинения§!.\n"
 SPR_anti_fascist_unity_tt: "£decision_modifier_texticon  Открывает решение §YАнтифашистский союз§!, позволяя задерживать восстания анархистов в обмен на уступки.\n"
 mtg_usa_anti_bolshevist_aid_tt: "£decision_modifier_texticon  Открывает решение: §YОружие для войны (противник — [GetSovietThreatNameAlt])§!\nПри выборе решения:\nОтправить §Y1000§! ед. §Yпехотного снаряжения§! в страны, чей противник в войне — §Y[SOV.GetNameDefCap]§!. Старое снаряжение отправится первым."
 ENG_organize_the_blackshirts_tt: "£decision_modifier_texticon  Открывает решения §YОрганизация шествий чернорубашечников§!.\n"
 ENG_appeal_to_imperial_loyalists_tt: "£decision_modifier_texticon  Открывает решение: §YОбращение к императорским лоялистам§!, позволяющее организовывать выгодные Британии гражданские войны в бывших доминионах.\n"
 ENG_bring_the_dominions_back_into_the_fold_tt: "£decision_modifier_texticon  Открывает решение: §YПомощь империалистическому восстанию§!.\n"
 ENG_concessions_to_the_trade_unions_tt: "£decision_modifier_texticon  Открывает решения §YУступки профсоюзам§!, являющиеся обязательными для перехода к коммунизму.\n"
 ENG_concessions_to_the_trade_unions_tt_3: "£decision_modifier_texticon  Открывает решения §YПоддержка профсоюзов§!.\n"
 ENG_imperial_conference_tt: "£decision_modifier_texticon  Открывает решения §YИмперская конференция§! на 60 дней.\n§RУбедитесь, что вы накопили достаточно политической власти, чтобы ими воспользоваться!§!\n"
 CZE_a_divided_nation_category_2_tt: "§YEffects when selected§!:\n£decision_modifier_texticon  Unlocks §Y$CZE_a_divided_nation_category$§! Decisions, which will §YRemove§! negative State Modifiers in our §YStates§! and will also lower the negative modifiers on the §Y$CZE_a_divided_nation_dynamic_modifier$ National Spirit§! until it is §YRemoved§!."
