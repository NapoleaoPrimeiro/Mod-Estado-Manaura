 FIN_heimosodat_dec_tt: "£decision_modifier_texticon  Unlocks §Y$FIN_the_last_kinship_war$§! decisions to §Y$FIN_stir_anti_soviet_sentiment_in_karelia$§! in Soviet-controlled states §Y[215.GetName]§! and §Y[216.GetName]§!, and to §Y$FIN_instigate_a_new_karelian_uprising$§! against [SOV.GetNameDef].\n\n"
