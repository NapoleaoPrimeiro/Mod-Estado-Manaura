 NOR_unlocking_prep_deploy_dem_his_TT: "£decision_modifier_texticon  Открывает решения, позволяющие использовать §Yразвитие региона§! для защиты Норвегии.\n §RВ случае войны§!:\nРешения §Y«Защищать регион»§!, при которых развитие заменяется на бонусы к обороне и сопротивлению в этом регионе.\nРешения §Y«Экстренное производство в регионе»§!, сдвигающие производство на военные рельсы\n и решения §Y«Развернуть ополчение в регионе»§!, когда за счет развития вербуется ополчение в регионе."
