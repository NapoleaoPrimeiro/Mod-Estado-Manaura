 FIN_coastal_garrisons_locked: "\n£decision_modifier_texticon  Unlocks Decision: §Y$FIN_coastal_garrisons$§! allowing us to deploy garrison divisions in coastal states in the Baltic. \nIf the decision is already unlocked by another focus: §GCost and Time§! to complete §Y$FIN_coastal_garrisons$§! decision is §Ghalved§!."
