 FRW_mio_brest_req_tt:0 "Выполнен фокус §Y$FRW_darlan_programme$§!"
 FRW_citroen_organization:0 "Ситроен"
 FRW_citroen_organization_initial:0 "Сборочные линии на набережной Жавель"
 FRW_brandt_organization:0 "Эдгар Брандт"
 FRW_brandt_organization_initial:0 "Миномётные мастерские Шатийона"
 FRW_hispano_organization:0 "Испано-Сюиза"
 FRW_hispano_organization_initial:0 "Пушечный завод в Буа-Коломб"
 FRW_european_research_name:0 "Европейский совет оборонных исследований"
 FRW_european_research_desc:0 "Лаборатории и штабы европейских партнёров обмениваются результатами через общий совет в Париже."
 FRW_latin_research_name:0 "Латинский научный совет"
 FRW_latin_research_desc:0 "Университеты и арсеналы латинских наций обмениваются инженерами, патентами и результатами."
 FRW_join_european_research_tt:0 "Франция и её партнёры по фракции вступают в §YЕвропейский совет оборонных исследований§! (обмен технологиями)."
 FRW_join_latin_research_tt:0 "Франция и её партнёры по фракции вступают в §YЛатинский научный совет§! (обмен технологиями)."
 FRW_trait_army_of_africa:0 "Африканская армия"
 FRW_trait_army_of_africa_desc:0 "Годы в Сахаре и Рифе научили его снабжать армию вдали от любой железной дороги."
 FRW_trait_ecole_de_guerre:0 "Профессор Военной школы"
 FRW_trait_ecole_de_guerre_desc:0 "Он научил целое поколение штабных офицеров планировать методичное сражение."
 FRW_trait_armoured_pioneer:0 "Пионер бронетанковой дивизии"
 FRW_trait_armoured_pioneer_desc:0 "Он выступал за французскую бронетанковую дивизию задолго до того, как штаб её захотел."
 FRW_trait_alpine_school:0 "Школа горной войны"
 FRW_trait_alpine_school_desc:0 "Он тренировал своих егерей на ледниках Альп и во фьордах севера."
 frw_war.1.t:0 "Враг входит в Париж"
 frw_war.1.d:0 "Сегодня утром колонны войск ([ROOT.GetAdjective]) прошли маршем по Елисейским Полям. Правительство уже покинуло столицу, а город был объявлен открытым, чтобы уберечь его от разрушения. Мало кто из парижан смотрел на парад: большинство не открывали ставен."
 frw_war.1.a:0 "Франция проиграла сражение. Но не проиграла войну."
 frw_war.1.b:0 "Париж наш!"
 frw_war.1.c:0 "Город Света погружается во тьму."
 frw_war.2.t:0 "Париж освобождён"
 frw_war.2.d:0 "Колокола Нотр-Дама зазвонили над городом, когда французские войска вошли в Париж. После долгой оккупации толпы заполнили улицы от Орлеанских ворот до Ратуши."
 frw_war.2.a:0 "Париж поруганный, Париж разбитый — но Париж освобождённый!"
 frw_war.2.b:0 "Да здравствует Франция!"

 # ---------- Game rule: secret paths ----------
 RULE_FRW_SECRET_PATHS:0 "France Rework: секретные пути"
 RULE_FRW_SECRET_PATHS_ENABLED:0 "Включено"
 RULE_FRW_SECRET_PATHS_ENABLED_DESC:0 "Франция может открыть секретные пути: капитана-корсара из Сен-Мало (его флот, набеги на острова и Иберийское королевство), выжидая после фокуса «Отсрочка заседаний палат», революционных синдикалистов ВКТ, удерживая захваченные заводы, и неосоциалистов Марселя Деа, выслушав их."
 RULE_FRW_SECRET_PATHS_DISABLED:0 "Отключено (рекомендуется для соревновательной сетевой игры)"
 RULE_FRW_SECRET_PATHS_DISABLED_DESC:0 "Решения, открывающие секретные пути, никогда не появятся: ни капитана, ни пути ВКТ, ни пути Деа. Доступны только обычные политические пути."







































 # ---------- FRW secret ideology paths ----------
 FRW_leader_deat:0 "Марсель Деа"
 FRW_leader_deat_desc:0 "Выпускник Высшей нормальной школы и ветеран войны, Марсель Деа когда-то считался преемником Блюма. В 1933 году он порвал с СФИО и основал движение неосоциалистов, выступающих за плановую экономику, сильное государство и мир почти любой ценой."
 FRW_leader_deat_fascist_desc:0 "Марсель Деа порвал с парламентской демократией. Его Национально-народное объединение добивается единой партии, корпоративного Трудового фронта и социалистической и национальной Европы."
 FRW_leader_besnard:0 "Пьер Беснар"
 FRW_leader_besnard_desc:0 "Железнодорожник из Анжу, Пьер Беснар возглавлял революционных синдикалистов ВКТ-СР и был секретарём Международной ассоциации трудящихся. Он убеждён, что новым обществом должны управлять профсоюзы, а не партия."
 FRW_SYNDIC:0 "Синдикалистская Франция"
 FRW_SYNDIC_DEF:0 "Синдикалистская Франция"
 FRW_SYNDIC_ADJ:0 "синдикалистская"
 FRW_new_europe_faction:0 "Новый европейский порядок"
 FRW_backer_deat_req:0 "Получена поддержка §YМарселя Деа§!"
 FRW_backer_besnard_req:0 "Получена поддержка §YПьера Беснара§!"
 FRW_dec_hear_the_neos:0 "Выслушать неосоциалистов"
 FRW_dec_hear_the_neos_desc:0 "Марсель Деа и исключённые из СФИО неосоциалисты проводят свои собрания в зале Ваграм. Послать туда кого-нибудь послушать почти ничего не стоит, а у них есть идеи о государстве, которые никто больше в Палате не решается высказать вслух."
 FRW_dec_backer_deat:0 "Заручиться поддержкой Марселя Деа"
 FRW_dec_backer_deat_desc:0 "Переговоры с Марселем Деа и неосоциалистами займут около шести недель. Одновременно можно добиваться расположения лишь одного лидера этого лагеря.\n\nТребуется §Y45%§! поддержки партии и §Y30%§! стабильности. После этого в дереве фокусов вместо путей Блюма и Рейно откроется скрытый путь."
 FRW_dec_occupy_factories:0 "Удерживать захваченные заводы"
 FRW_dec_occupy_factories_desc:0 "Забастовщики отказываются уходить. На заводских воротах висят красные флаги, а местные профсоюзные секции ведают столовыми и ночными дежурствами. С каждым месяцем захватов ВКТ становится всё смелее."
 FRW_dec_backer_besnard:0 "Заручиться поддержкой Пьера Беснара"
 FRW_dec_backer_besnard_desc:0 "Переговоры с Пьером Беснаром и революционными синдикалистами займут около шести недель. Одновременно можно добиваться расположения лишь одного лидера этого лагеря.\n\nТребуется §Y35%§! поддержки партии и §Y30%§! стабильности. После этого в дереве фокусов вместо путей Тореза и Пивера откроется скрытый путь."
 frw_sp.1.t:0 "Амьенская хартия"
 frw_sp.1.d:0 "Прошло три месяца, а заводы всё ещё заняты. В министерство прибывает делегация революционных синдикалистов с экземпляром Амьенской хартии 1906 года, в которой подчёркнута одна фраза: профсоюз, сегодня орган сопротивления, завтра станет органом производства и распределения.\n\nИх представитель, железнодорожник по имени Пьер Беснар, говорит прямо: «Рабочим не нужен новый хозяин в Ратуше, красный или какой-либо ещё. Им нужны их профсоюзы. Оставьте заводы тем, кто на них работает, и Франция будет управлять собой сама».\n\n§GДоступно новое решение: Заручиться поддержкой Пьера Беснара.§!"
 frw_sp.1.a:0 "Пусть говорят профсоюзы."
 frw_sp.2.t:0 "Порядок, власть, нация"
 frw_sp.2.d:0 "Зал Ваграм переполнен. С трибуны Марсель Деа повторяет лозунг, стоивший неосоциалистам места в СФИО: социализм победит, только если возьмёт на вооружение порядок, власть и нацию и перестанет оставлять их лигам.\n\nПотом он принимает нашего посланника. «Блюм хочет дождаться революции, а правые не хотят дожидаться вообще ничего. Я предлагаю План и государство, достаточно сильное, чтобы его осуществить. Передайте правительству, что неосоциалисты готовы служить».\n\n§GДоступно новое решение: Заручиться поддержкой Марселя Деа.§!"
 frw_sp.2.a:0 "Республике нужна твёрдая рука."
 frw_sp.3.t:0 "Деа основывает единую партию"
 frw_sp.3.d:0 "В Париже Марсель Деа закрыл Палату и провозгласил Национально-народное объединение единственной партией Франции. Бывшие социалисты маршируют рядом с ветеранами лиг под лозунгом национальной и народной революции. Деа говорит о новой Европе, а другие столицы гадают, куда он намерен её повести."
 frw_sp.3.a:0 "Ещё один социалист стал диктатором."
 frw_sp.3.b:0 "Ни правые, ни левые — Франция!"
 # ---------- /FRW secret ideology paths ----------
 # ---------- FRW pirate path ----------
 FRW_black_flag_desc:0 "Статьи Берегового братства: доля каждому, голос каждому капитану и никакой пощады купцу, который сопротивляется."
 FRW_black_flag_2_desc:0 "Рейдеры и подводные лодки охотятся на всех морских путях Европы."
 FRW_black_flag_3_desc:0 "Чёрный флаг развевается на грот-мачте флагмана. Флот капитана не щадит никого и получает плату призами."
 FRW_boarders_desc:0 "Морские пехотинцы, обученные внезапно захватывать корабль или гавань."
 FRW_free_port_desc:0 "Сен-Мало является вольным портом. Таможенники не поднимаются на борт, но каждый корабль платит сбор."
 FRW_island_bases_desc:0 "Цепь островных гаваней от Балеар до Сейшел снабжает флоты и десантные отряды капитана."
 FRW_pirate_captain:0 "Капитан-корсар"
 FRW_pirate_captain_desc:0 "Он сражался под тремя флагами и ни под одним из них не проиграл ни одного морского сражения."
 FRW_pirate_legoff:0 "Ян Ле Гофф"
 FRW_pirate_morvan:0 "Корантен Морван"
 FRW_pirate_duroc:0 "Анатоль Дюрок"
 # ---------- /FRW pirate path ----------
 # ---------- FRW franc column ----------
 FRW_franc_below_40_tt:0 "Инфляция ниже §Y40%§!"
 FRW_strong_franc_desc:0 "Кредит дёшев, и франку снова доверяют. По всей стране возобновляются стройки."
 FRW_war_finance_desc:0 "Войну финансируют военные займы, налоги и контроль над ценами."
 # ---------- /FRW franc column ----------
 # ---------- FRW colonies ----------
 FRW_colonial_administration:0 "Колониальная администрация"
 FRW_colonial_administration_tt:0 "Каждая область этого региона, которой владеет Франция (не являющаяся национальной территорией и ещё не находящаяся под управлением), получает §YКолониальную администрацию§!: больше доступных для призыва людских ресурсов и §G+15%§! ресурсов."
 FRW_colonial_administration_all_tt:0 "§YАлжир§!, §YАнтильские острова§!, §YФранцузская Гвиана§! и §YРеюньон§! становятся §Gнациональными территориями§! (заморские департаменты).\nКаждая другая область в §YАфрике§!, которой владеет Франция, получает §YКолониальную администрацию§!: больше доступных для призыва людских ресурсов и §G+15%§! ресурсов."
 FRW_free_caribbean:0 "Освободить Антильские острова и Гвиану"
 FRW_free_caribbean_desc:0 "Острова плантаций в Карибском море и каторжная колония Гвианы передаются их собственным народам.\n\nОсвобождает их как §Yкоммунистических сателлитов§! (только там, где Франция владеет их землями) и усиливает §YБратские народы§!."
 # ---------- /FRW colonies ----------
 # ---------- FRW feedback 2 ----------
 FRW_dec_renew_federal_offer:0 "Возобновить федеральное предложение"
 FRW_dec_renew_federal_offer_desc:0 "Не каждое правительство было готово, когда Париж обратился к нему впервые. Новая делегация федералистов объезжает столицы Европы с тем же предложением: одна армия, одна валюта, одно федеральное собрание."
 FRW_dec_renew_federal_offer_tt:0 "Каждой малой демократической стране Европы во фракции Франции или под французскими гарантиями снова предлагается вступить в §YЕвропейскую федерацию§!."
 # ---------- /FRW feedback 2 ----------
 # ---------- FRW feedback 3 ----------
 FRW_continental_system_faction:0 "Континентальная система"
 FRW_rhine_held_desc:0 "Когда германские батальоны вошли в Рейнскую область, Франция объявила мобилизацию, и Берлин отвёл их назад. Со времён 1918 года страна не чувствовала такой уверенности в себе."
 frw_fb3.1.t:0 "Рейн удержан"
 frw_fb3.1.d:0 "Германские колонны, вступившие в демилитаризованную зону, уходят обратно по мостам через Рейн. Гитлер отступил первым. В Париже газеты называют это первой победой со времён Версаля, а депутатов, голосовавших за мобилизацию, приветствуют у Бурбонского дворца."
 frw_fb3.1.a:0 "Франция по-прежнему стоит на страже Рейна."
 FRW_dec_invite_trotsky:0 "Предоставить убежище Льву Троцкому"
 FRW_dec_invite_trotsky_desc:0 "Троцкий жил во Франции до 1935 года, когда Республика выслала его в угоду Москве. Рабочая Франция могла бы вернуть создателя Красной армии, хотя Сталин этого не простит."
 FRW_dec_invite_trotsky_tt:0 "§YЛев Троцкий§! прибывает во Францию, и его можно назначить §Yполитическим советником§!."
 frw_fb3.2.t:0 "Троцкий в Париже"
 frw_fb3.2.d:0 "Лев Троцкий сошёл с поезда на Лионском вокзале через десять лет после того, как Сталин изгнал его из Советского Союза. Он хочет читать лекции, писать и помогать в организации нашей армии. Москва отозвала своего посла для консультаций."
 frw_fb3.2.a:0 "Добро пожаловать, товарищ."
 frw_fb3.2.a.tt:0 "§YЛьва Троцкого§! можно назначить §Yполитическим советником§!.\nС §YМарсо Пивером§!: §G+3%§! стабильности и поддержки коммунизма.\nС §YМорисом Торезом§!: §R-5%§! стабильности.\nКоммунистический §YСоветский Союз§! оскорблён (§R-40§! к отношению)."
 FRW_adv_trotsky:0 "Лев Троцкий"
 FRW_trait_trotsky:0 "Создатель Красной армии"
 FRW_trotsky_affront:0 "Приютила Троцкого"
 # ---------- /FRW feedback 3 ----------

