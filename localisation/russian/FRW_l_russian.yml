 FRW_imperial_scientist:0 "Директор имперской науки"
 FRW_imperial_scientist_desc:0 "Нобелевский лауреат 1935 года, которому ныне поручено организовать лаборатории Империи."
 FRW_backer_captain_req:0 "Получена поддержка §Yкапитана Керваде§!"
 FRW_dec_backer_captain:0 "Заручиться поддержкой капитана Керваде"
 FRW_dec_backer_captain_desc:0 "Автор письма из Женевы ждёт ответа. Переговоры с Мало Керваде и его цюрихскими покровителями займут около шести недель. Одновременно можно добиваться расположения лишь одного лидера этого лагеря.\n\nТребуется §Y35%§! поддержки партии и §Y30%§! стабильности. После этого в дереве фокусов откроется скрытый путь."
 FRW_dec_wait:0 "Выжидать"
 FRW_dec_wait_desc:0 "Палаты не заседают, министерства живут по заведённому порядку. Ещё месяц в Париже никто не примет никакого решения."

