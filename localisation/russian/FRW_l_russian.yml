 FRW_dec_franc_rates:0 "Повысить учётную ставку"
 FRW_dec_franc_rates_desc:0 "Банк Франции повышает ставку. Деньги дорожают, цены успокаиваются, а вместе с ними затихают и стройки."
 FRW_dec_franc_bonds:0 "Выпустить облигации национальной обороны"
 FRW_dec_franc_bonds_desc:0 "Вкладчики не тратят свои франки, а одалживают их государству. Патриотические плакаты покрывают стены каждого почтового отделения."
 FRW_dec_franc_controls:0 "Контроль над ценами и зарплатами"
 FRW_dec_franc_controls_desc:0 "Цены и зарплаты заморожены декретом. Лавочники ворчат, профсоюзы ворчат, но франк держится."
 FRW_dec_franc_gold:0 "Продать золото из резервов"
 FRW_dec_franc_gold_desc:0 "Часть золота из хранилищ Банка Франции продаётся за границу, чтобы выкупить франки."
 FRW_dec_franc_reserves:0 "Восстановить золотой запас"
 FRW_dec_franc_reserves_desc:0 "Банк Франции скупает золото на лондонском рынке за вновь выпущенные франки. Хранилища снова наполняются, но денежная масса растёт."
 FRW_dec_franc_exchange:0 "Валютный контроль"
 FRW_dec_franc_exchange_desc:0 "Франки больше не могут покидать страну без разрешения. Бегство капитала останавливается на границе — а вместе с ним и значительная часть торговли."
 FRW_dec_franc_contracts:0 "Оружейные контракты за границей"
 FRW_dec_franc_contracts_desc:0 "Золото покупает то, что французские заводы не успевают поставить вовремя: американские авиадвигатели, станки и целые самолёты, оплаченные наличными."
 FRW_dec_franc_austerity:0 "Бюджет жёсткой экономии"
 FRW_dec_franc_austerity_desc:0 "Декреты-законы урезают жалованье государственных служащих и пенсии ветеранов. Бюджет сбалансирован ценой всеобщего недовольства."
 FRW_dec_franc_cfa:0 "Колониальная зона франка"
 FRW_dec_franc_cfa_desc:0 "Колонии получают собственный франк, привязанный к парижскому. Часть давления на валюту перекладывается на Африку."
 FRW_dec_franc_print:0 "Печатать деньги на перевооружение"
 FRW_dec_franc_print_desc:0 "Печатные станки Банка Франции работают днём и ночью. Заводы получают деньги сразу, а счёт инфляция предъявит позже."
 FRW_dec_franc_tripartite:0 "Трёхстороннее валютное соглашение"
 FRW_dec_franc_tripartite_desc:0 "Лондон и Вашингтон соглашаются вместе с Парижем поддерживать стабильность девальвированного франка. Это конец золотого блока."
 FRW_franc_cat:0 "Франк"
 FRW_franc_cat_desc:0 "Инфляция: §Y[?FRW_inflation|0]%§! (§Y[?FRW_inf_trend|2]§! п. в месяц). Золотой запас Банка Франции: §Y[?FRW_gold|0] т§! ([?FRW_gold_trend|+0] т в месяц).\n\nНиже 20% крепкий франк ускоряет строительство. Выше 20% инфляция повышает расходы на товары народного потребления, снижает стабильность и замедляет строительство. При 100%: товары народного потребления §R+12%§!, стабильность §R-12%§!, скорость строительства §R-8%§!.\nЗолотое обеспечение: выше §Y2000 т§! оно укрепляет франк, ниже §Y1000 т§! — ослабляет его, ниже §Y400 т§! хранилища пусты.\n\n§YИзменение инфляции в месяц§!\n- Банк Франции держит оборону: §G-0.5§![FRW_inf_line_1][FRW_inf_line_2][FRW_inf_line_3][FRW_inf_line_4][FRW_inf_line_5][FRW_inf_line_6][FRW_inf_line_7][FRW_inf_line_8][FRW_inf_line_9][FRW_inf_line_10][FRW_inf_line_11][FRW_inf_line_12][FRW_inf_line_13][FRW_inf_line_14][FRW_inf_line_15][FRW_inf_line_16][FRW_inf_line_17][FRW_inf_line_18]\n\n§YИзменение золотого запаса в месяц§![FRW_gold_line_0][FRW_gold_line_1][FRW_gold_line_2][FRW_gold_line_3][FRW_gold_line_4][FRW_gold_line_5][FRW_gold_line_6][FRW_gold_line_7][FRW_gold_line_8][FRW_gold_line_9][FRW_gold_line_10][FRW_gold_line_11]"
 FRW_liberation_prestige_tt:0 "Все французские области в Европе освобождены от врага: престиж Свободной Франции §G+2§!."
 FRW_exchange_controls_tt:0 "Бегство капитала (Народный фронт, революция, политическая нестабильность) больше не истощает золотой запас."
 FRW_contracts_tt:0 "На один год: §G+3§! военных завода за границей (производство за рубежом)."
 FRW_cfa_drift_tt:0 "Отныне инфляция снижается ещё на §G0.25§! п. в месяц, а колонии присылают §G+5 т§! золота в месяц."
 FRW_tripartite_drift_tt:0 "Отныне инфляция снижается ещё на §G0.25§! п. в месяц, а в Париж возвращается §G+5 т§! золота в месяц."
 FRW_tight_money_desc:0 "Кредит дорог. Новых проектов начинается меньше, зато франк в безопасности."
 FRW_austerity_desc:0 "Сокращение расходов успокоило рынки, но его ощущают и чиновники, и ветераны, и строители."
 FRW_price_riots_desc:0 "Толпы штурмуют рынки и булочные. С каждой неделей франк стоит всё меньше."
 FRW_new_franc_desc:0 "Денежная реформа в одночасье уничтожила сбережения. Франк снова крепок, но доверие к государству — нет."
 FRW_fighting_france_desc:0 "Весь союзный мир теперь признаёт Сражающуюся Францию подлинной Францией."
 FRW_exchange_controls_idea_desc:0 "На каждый франк, покидающий страну, нужно разрешение. Золото остаётся дома, но импортёры и банкиры недовольны."
 FRW_foreign_contracts_desc:0 "Заводы в Америке выполняют французские заказы, оплаченные золотом."
 FRW_gold_loan_desc:0 "Лондон одолжил нам золото. Проценты нужно выплачивать каждый месяц."
 FRW_printing_press_desc:0 "Новые деньги рекой текут на заводы. За ними последует инфляция."
 FRW_franc:0 "Франк"
 FRW_franc_desc:0 "Инфляция: §Y[?FRW_inflation|0]%§!. Управляйте ею в меню решений §YФранк§!."
 FRW_ff_prestige_mod:0 "Престиж Свободной Франции"
 FRW_ff_prestige_mod_desc:0 "Престиж Свободной Франции: §Y[?FRW_ff_prestige|0]§! из 100. Чем он выше, тем охотнее губернаторы переходят на нашу сторону."
 FRW_dec_rally_eq:0 "Посланник во Французскую Экваториальную Африку"
