 FRW_EURAFRICA_ADJ:0 "еврафриканский"
 FRW_entente:0 "Антанта"
 FRW_red_front:0 "Красный фронт Европы"
 FRW_latin_bloc_faction:0 "Латинский блок"
 FRW_holy_alliance_faction:0 "Священный союз"
 FRW_collective_security_faction:0 "Коллективная безопасность"
 FRW_political_cat:0 "Внутренняя политика"
 FRW_political_cat_desc:0 "Меры по укреплению внутренней стабильности Франции и её подготовке к войне."
 FRW_dec_national_rally:0 "Национальный митинг"
 FRW_dec_national_rally_desc:0 "В крупнейших городах проходят массовые митинги в поддержку правительства."
 FRW_dec_war_propaganda:0 "Кампания национальной обороны"
 FRW_dec_war_propaganda_desc:0 "Плакаты, кинохроника и радиопередачи готовят общество к возможной войне."
 FRW_dec_colonial_recruitment:0 "Набор в Империи"
 FRW_dec_colonial_recruitment_desc:0 "Вербовочные пункты в Северной и Западной Африке набирают добровольцев в армию."
 FRW_colonial_purchases_cat:0 "Колониальные покупки"
 FRW_colonial_purchases_cat_desc:0 "Франция предлагает другим колониальным державам золото и политическую поддержку в обмен на африканские территории. Решение по каждому предложению принимает продавец; в сетевой игре — игрок, которому принадлежат эти земли."
 FRW_buy_spanish_morocco:0 "Купить Испанское Марокко"
 FRW_buy_spanish_morocco_desc:0 "Мадриду предлагают французское золото в обмен на зону Риф."
 FRW_buy_ifni_rio_de_oro:0 "Купить Ифни и Рио-де-Оро"
 FRW_buy_ifni_rio_de_oro_desc:0 "Пустынные владения Испании на атлантическом побережье лежат между Французским Марокко и Мавританией."
 FRW_buy_spanish_guinea:0 "Купить Испанскую Гвинею"
 FRW_buy_spanish_guinea_desc:0 "Рио-Муни со стороны суши окружён Французской Экваториальной Африкой."
 FRW_buy_portuguese_guinea:0 "Купить Португальскую Гвинею"
 FRW_buy_portuguese_guinea_desc:0 "Португальская колония в Западной Африке почти полностью окружена французскими владениями."
 FRW_buy_gambia:0 "Купить Гамбию"
 FRW_buy_gambia_desc:0 "Узкая британская полоса вдоль реки Гамбия рассекает Сенегал надвое."
 FRW_buy_sierra_leone:0 "Купить Сьерра-Леоне"
 FRW_buy_sierra_leone_desc:0 "Фритаун дал бы Французской Западной Африке превосходную гавань на Атлантике."
 FRW_buy_belgian_congo:0 "Купить концессию в Конго"
 FRW_buy_belgian_congo_desc:0 "Брюсселю предлагают условия уступки Франции части Конго."
 FRW_buy_fezzan:0 "Купить Феццан"
 FRW_buy_fezzan_desc:0 "Феццан, пустынный тыл итальянской Ливии, граничит и с Алжиром, и с Чадом."
 FRW_union_francaise_cat:0 "Французский союз"
 FRW_union_francaise_cat_desc:0 "Колониальная империя преобразуется в союз, в котором протектораты Тунис и Марокко становятся полноправными частями Франции."
 FRW_form_union_francaise:0 "Провозгласить Французский союз"
 FRW_form_union_francaise_desc:0 "Тунис и Марокко становятся национальными территориями Франции."
 FRW_europe_cat:0 "Европейская федерация"
 FRW_europe_cat_desc:0 "Планы объединённой Европы под руководством Франции — демократической или социалистической."
 FRW_form_european_federation:0 "Основать Европейскую федерацию"
 FRW_form_european_federation_desc:0 "Бенилюкс и Рейнская область становятся национальными территориями федерации во главе с Францией."
 FRW_grand_empire_cat:0 "Великая империя"
 FRW_grand_empire_cat_desc:0 "Восстановление Империи французов в границах времён Наполеона."
 FRW_form_grand_empire:0 "Провозгласить Великую империю"
 FRW_form_grand_empire_desc:0 "Бенилюкс, Рейнская область и Пьемонт становятся национальными территориями Империи."
 FRW_francia_cat:0 "Франкская империя"
 FRW_francia_cat_desc:0 "Из Ахена Карл Великий правил землями от Пиренеев до Эльбы. Франция притязает на роль его законной наследницы."
 FRW_form_francia:0 "Восстановить империю Карла Великого"
 FRW_form_francia_desc:0 "Требуется контроль над Бельгией, Голландией, Рейнской областью, Вестфалией и Баденом. Они становятся национальными территориями."
 FRW_latin_cat:0 "Латинская империя"
 FRW_latin_cat_desc:0 "Планы объединить Францию, Италию и Испанию, наследниц Рима, под одной короной или властью одного вождя."
 FRW_form_latin_empire:0 "Провозгласить Латинскую империю"
 FRW_form_latin_empire_desc:0 "Требуется контроль над Римом, Мадридом и Пьемонтом. Все принадлежащие нам национальные территории Италии, Испании и Португалии становятся нашими."
 FRW_eurafrique_cat:0 "Еврафриканская федерация"
 FRW_eurafrique_cat_desc:0 "Планы объединить Европу и Африку в единую федерацию под руководством Франции."
 FRW_form_eurafrican_federation:0 "Основать Еврафриканскую федерацию"
 FRW_form_eurafrican_federation_desc:0 "Сахара, Французский Судан и Гвинея становятся национальными территориями."
 frw.1.t:0 "Кризис Третьей республики"
 frw.1.d:0 "Со времени беспорядков 6 февраля 1934 года страна не знает покоя. Кабинеты сменяют друг друга, лиги маршируют по улицам, коммунисты набирают силу, а экономика стоит на месте. В салонах и казармах офицеры и политики открыто обсуждают, чем заменить Республику."
 frw.1.a:0 "Сохранить закон и порядок."
 frw.1.b:0 "Нужны решительные действия."
 frw.2.t:0 "Провозглашена Коммуна!"
 frw.2.d:0 "Над Отель-де-Виль реют красные знамёна. В Париже рабочие, солдаты и Коммунистическая партия взяли власть и вместо Республики создали социалистическое правительство. Другие столицы Европы с тревогой ждут, что будет дальше."
 frw.2.a:0 "Призрак бродит по Европе."
 frw.2.b:0 "Да здравствует Коммуна!"
 frw.3.t:0 "Национальная революция во Франции"
 frw.3.d:0 "После нескольких недель волнений объединённые лиги свергли правительство. Палата депутатов и Сенат распущены, власть перешла к национальному правительству."
 frw.3.a:0 "Франция изменилась."
 frw.3.b:0 "Франция пробуждается!"
 frw.4.t:0 "Палаты Франции распущены на каникулы"
 frw.4.d:0 "Неожиданно правительство прервало работу Палаты депутатов и Сената на неопределённый срок. Теперь страной управляет кабинет «вне партий», и пока неясно, какой режим придёт на смену Республике."
 frw.4.a:0 "Что дальше?"
 frw.5.t:0 "Империя французов!"
 frw.5.d:0 "Луи, принц Наполеон, коронован в соборе Нотр-Дам как Наполеон VI, император французов. Гвардия прошла парадом по Елисейским Полям, а на полковые знамёна вернулись орлы."
 frw.5.a:0 "История повторяется."
 frw.5.b:0 "Да здравствует император!"
 frw.6.t:0 "Король в Париже"
 frw.6.d:0 "Анри Орлеанский, граф Парижский, вернулся из изгнания и взошёл на престол как Генрих VI. Впервые с 1848 года у Франции есть король."
 frw.6.a:0 "Любопытно."
 frw.6.b:0 "Да здравствует король!"
 frw.10.t:0 "Франция просит о вступлении"
 frw.10.d:0 "Французское правительство официально попросило принять его в наш союз. Франция привносит многочисленную армию и мощный флот."
 frw.10.a:0 "Добро пожаловать, Франция."
 frw.10.b:0 "Мы отказываем."
 frw.11.t:0 "Вступление подтверждено"
 frw.11.d:0 "Наша просьба удовлетворена, и теперь у Франции есть союзники."
 frw.11.a:0 "Превосходно."
 frw.12.t:0 "Просьба отклонена"
 frw.12.d:0 "Нашу просьбу о вступлении отклонили. Франции придётся обойтись без этого союза."
 frw.12.a:0 "Значит, мы одни."
 frw.16.t:0 "Предложение союза из Парижа"
 frw.16.d:0 "Франция создала новый союз и приглашает нас присоединиться."
 frw.16.a:0 "Мы вступаем."
 frw.16.b:0 "Мы сохраним независимость."
 frw.17.t:0 "Предложение союза принято"
 frw.17.d:0 "[From.GetNameDefCap] принимает наше предложение и вступает в союз."
 frw.17.a:0 "Вместе мы сильны."
 frw.18.t:0 "Предложение союза отклонено"
 frw.18.d:0 "[From.GetNameDefCap] отклоняет наше предложение союза."
 frw.18.a:0 "Досадно."
 frw.20.t:0 "Франко-британский союз?"
 frw.20.d:0 "Париж предлагает союз двух наций с общими министерствами обороны и экономики, единым гражданством и единым военным кабинетом."
 frw.20.a:0 "Нерушимый союз."
 frw.20.b:0 "Это уже слишком."
 frw.21.t:0 "Лондон согласен!"
 frw.21.d:0 "Британское правительство приняло предложение об объединении, и отныне две империи будут действовать как одна."
 frw.21.a:0 "Да здравствует Союз!"
 frw.22.t:0 "Лондон отказывает"
 frw.22.d:0 "Лондон считает объединение преждевременным. Антанта сохранится, но лишь на нынешних условиях."
 frw.22.a:0 "Коварный Альбион."
 frw.25.t:0 "Французский протекторат?"
 frw.25.d:0 "Франция предлагает взять на себя наши долги и гарантировать нашу безопасность при условии, что мы станем французским протекторатом."
 frw.25.a:0 "Мы согласны."
 frw.25.b:0 "Наша независимость не обсуждается."
 frw.26.t:0 "Либерия согласна"
 frw.26.d:0 "Либерия отныне находится под покровительством Франции."
 frw.26.a:0 "Очень хорошо."
 frw.27.t:0 "Либерия отказывает"
 frw.27.d:0 "Правительство Либерии отвергло наше предложение."
 frw.27.a:0 "Жаль."
 frw.50.t:0 "Французское предложение о покупке"
 frw.50.d:0 "Из Парижа прибыл посланник с предложением. Франция желает купить колониальные земли, граничащие с её африканскими владениями, и готова щедро заплатить золотом, а также оказать политическую поддержку."
 frw.50.a:0 "Мы продаём."
 frw.50.b:0 "Эта земля не продаётся."
 frw.51.t:0 "Покупка завершена"
 frw.51.d:0 "Переговоры увенчались успехом, и территория вошла в состав Французской империи, хотя покупка и легла тяжким бременем на бюджет."
 frw.51.a:0 "Выгодная сделка."
 frw.52.t:0 "Предложение отклонено"
 frw.52.d:0 "Наше предложение о покупке отвергнуто. Часть средств возвращена в казну."
 frw.52.a:0 "Может быть, в другой раз."
 frw.60.t:0 "Основана Европейская федерация"
 frw.60.d:0 "В Страсбурге подписана учредительная хартия Европейской федерации. Под руководством Франции народы Западной Европы сольются в единое государство."
 frw.60.a:0 "Новая эпоха."
 frw.61.t:0 "Великая империя"
 frw.61.d:0 "Имперский орёл вновь реет от Северного моря до Альп. Великая империя Наполеона восстановлена."
 frw.61.a:0 "Наследие императора."
 frw.62.t:0 "Французский союз"
 frw.62.d:0 "Франция провозгласила Французский союз, и Тунис с Марокко отныне являются равноправными частями Республики."
 frw.62.a:0 "Новый порядок для империи."
 frw.63.t:0 "Империя Карла Великого восстановлена"
 frw.63.d:0 "В Ахенском соборе, где покоится Карл Великий, Франция провозгласила восстановление Франкской империи. Земли от Пиренеев до Рейна вновь едины."
 frw.63.a:0 "Karolus Magnus гордился бы нами."
 frw.64.t:0 "Провозглашена Латинская империя"
 frw.64.d:0 "Франция, Италия и Испания отныне подчиняются единому правительству. В Риме провозглашена Латинская империя, возводящая себя к цезарям."
 frw.64.a:0 "Рим возрождается."
 frw.65.t:0 "Еврафриканская федерация"
 frw.65.d:0 "Франция объединила свои африканские территории в Еврафриканскую федерацию — единое государство от Дюнкерка до Нигера."
 frw.65.a:0 "Еврафрика!"
 frw.70.t:0 "Франция требует объединения"
 frw.70.d:0 "Французское правительство, ссылаясь на общий язык и общую историю, требует, чтобы [Root.GetNameDef] объединилась с Францией. Париж ясно дал понять, что на отказ может ответить силой."
 frw.70.a:0 "Мы согласны на объединение."
 frw.70.b:0 "Никогда!"
 frw.71.t:0 "Франция требует территорий"
 frw.71.d:0 "Франция требует уступить ей приграничные районы, которые она считает исторически французскими. Если мы откажемся, Париж может прибегнуть к силе."
 frw.71.a:0 "Мы уступаем территорию."
 frw.71.b:0 "Ни пяди нашей земли!"
 frw.72.t:0 "Наши требования приняты"
 frw.72.d:0 "Наши требования удовлетворены, и французские войска пересекают новую границу без единого выстрела."
 frw.72.a:0 "Да здравствует Франция!"
 frw.73.t:0 "В объединении отказано"
 frw.73.d:0 "[From.GetNameDefCap] отказывается объединиться с Францией. У Генерального штаба уже готовы планы, чтобы силой взять то, в чём нам отказали."
 frw.73.a:0 "Тогда возьмём силой."
 frw.73.b:0 "Мы не станем начинать из-за этого войну."
 frw.74.t:0 "Требования отвергнуты"
 frw.74.d:0 "[From.GetNameDefCap] отказывается уступить требуемые территории. Армия всё ещё может занять их, если правительство отдаст приказ."
 frw.74.a:0 "Готовиться к войне."
 frw.74.b:0 "Оставим это — пока."
 frw.75.t:0 "Франция требует покорности"
 frw.75.d:0 "Париж требует, чтобы [Root.GetNameDef] перешла под покровительство Франции, а наша внешняя политика и армия подчинялись французам. Французский посол дал понять, что отказ не будет забыт и что французская армия приведена в готовность."
 frw.75.a:0 "Мы принимаем покровительство Франции."
 frw.75.b:0 "Мы остаёмся суверенными!"
 frw.76.t:0 "Покровительство отвергнуто"
 frw.76.d:0 "[From.GetNameDefCap] отвергает наше предложение о покровительстве. Правительству предстоит решить, навязывать ли его силой."
 frw.76.a:0 "Тогда они научатся повиноваться."
 frw.76.b:0 "Не стоит войны."
 frw.80.t:0 "Тайное предложение из Парижа"
 frw.80.d:0 "В строжайшей тайне французское правительство предложило уступить Конфедерации Савойю и Альпы. Взамен швейцарские банки откроют свои хранилища для французской промышленности. Решение теперь за Федеральным советом в Берне."
 frw.80.a:0 "Согласиться — кантоны Савойя и Альпы входят в Конфедерацию."
 frw.80.b:0 "Швейцария землёй не торгует."
 frw.81.t:0 "Капитан из Женевы"
 frw.81.d:0 "Он прибыл на Лионский вокзал с одним чемоданом и саблей польского офицера. Мало Керваде родился в Женеве в семье бретонского морского капитана из Сен-Мало и польской изгнанницы из Кракова и вырос между набережными Женевского озера и рассказами матери о стране, которой больше не было ни на одной карте. В 1917 году он вступил в Голубую армию генерала Галлера во Франции, а в 1920 году был на Висле, когда Красную армию остановили под Варшавой.\n\nС тех пор он служил частным банкам Цюриха и Женевы, переправляя их золото через неспокойную Европу. Теперь он везёт это золото в Париж, убеждённый, что Польша выживет лишь при сильной Франции."
 frw.81.a:0 "Полный вперёд."
 frw.82.t:0 "Альпийская сделка заключена"
 frw.82.d:0 "Швейцария согласилась. Савойя и Альпы перешли под швейцарское управление, а швейцарское золото уже поступает на французские заводы."
 frw.82.a:0 "Удачный обмен."
 frw.83.t:0 "Берн отказывает"
 frw.83.d:0 "Федеральный совет отклонил наше предложение. Альпы остаются французскими, и общество никогда не узнает, как близко правительство было к тому, чтобы их отдать."
 frw.83.a:0 "Возможно, так даже лучше."
 FRW_CORSAIR:0 "Королевство Франкия"
 FRW_CORSAIR_DEF:0 "Королевство Франкия"
 FRW_CORSAIR_ADJ:0 "франкийский"
 FRW_corsair_cat:0 "Королевство Франкия"
 FRW_corsair_cat_desc:0 "Франция и Пиренейский полуостров, объединённые под корсарским флагом Сен-Мало с горностаем, мёртвой головой и львом. Ни один захватчик, высадившийся на наших берегах, не уйдёт с них живым."
 FRW_form_corsair_empire:0 "Провозгласить Королевство Франкия"
 FRW_form_corsair_empire_desc:0 "Требуется контроль над Парижем, Мадридом, Бургосом и Лиссабоном и поддержка войны выше 50 %. Даёт национальные территории во всех принадлежащих нам испанских и португальских областях и национальный дух «Корсарский флаг» (+30 % к атаке и обороне на национальной территории)."
 frw.90.t:0 "Интервенция в Испании"
 frw.90.d:0 "Испания охвачена гражданской войной, а вдоль Пиренеев сосредоточены французские войска. Правительство должно решить, какую сторону поддержит Франция и какую поможет сокрушить."
 frw.90.a:0 "За Республику — сокрушить националистов!"
 frw.90.b:0 "За националистов — сокрушить Республику!"
 frw.90.c:0 "За законное правительство — сокрушить мятежников!"
 frw.92.t:0 "Франция требует объединения"
 frw.92.d:0 "Французские дивизии развёрнуты вдоль всей нашей границы, от Галисии до Андалусии. Париж требует, чтобы Португалия присоединилась к Франции — мирным путём, как настаивает его нота. Генеральный штаб в Лиссабоне докладывает, что сопротивление безнадёжно."
 frw.92.a:0 "У нас нет выбора. Португалия присоединяется к Франции."
 frw.92.b:0 "Португалия будет сражаться!"
 frw.93.t:0 "Лиссабон отказывает"
 frw.93.d:0 "[From.GetNameDefCap] отвергает объединение. Наши дивизии ждут приказа о наступлении."
 frw.93.a:0 "Тогда идём на Лиссабон."
 frw.93.b:0 "Не сейчас."
 frw.95.t:0 "Королевство Франкия"
 frw.95.d:0 "От Ла-Манша до Гибралтара над министерствами развевается новый флаг с лилиями Франции и горностаем Сен-Мало. Франция и Пиренейский полуостров провозглашены единым государством, Королевством Франкия. Капитан из Сен-Мало сказал своим офицерам, что это только начало."
 frw.95.a:0 "Новая держава на Западе."
 frw.95.b:0 "Монжуа Сен-Дени!"
 FRW_leader_corsair:0 "Мало Керваде"
 FRW_leader_corsair_desc:0 "Мало Керваде родился в Женеве в семье бретонского морского капитана из Сен-Мало и польской изгнанницы. Он сражался в Голубой армии Галлера, перевозил золото для частных банков Цюриха и, по слухам, ходил под чёрным флагом у берегов Африки. Он правит Францией так, как капитан корсаров правит своим кораблём: по писаным статьям и с долей добычи для каждого."
 frw.96.t:0 "Франция просит Шетландские острова"
 frw.96.d:0 "Ссылаясь на Старый союз и сердечные отношения между нашими странами, Париж просит правительство Его Величества уступить Франции Шетландские острова для устройства военно-морской базы."
 frw.96.a:0 "Хорошо — во имя дружбы."
 frw.96.b:0 "Британия не раздаёт свои острова."
 frw.97.t:0 "Франция просит Хайленд"
 frw.97.d:0 "Французский посол предлагает передать Шотландское нагорье и Абердиншир под французское управление — в память, как он выражается, о Старом союзе."
 frw.97.a:0 "Если это удержит Францию на нашей стороне..."
 frw.97.b:0 "Об этом не может быть и речи."
 frw.98.t:0 "Лондон говорит «нет»"
 frw.98.d:0 "[From.GetNameDefCap] вежливо, но твёрдо отклоняет нашу просьбу."
 frw.98.a:0 "Может быть, когда мы станем им милее."
 FRW_BURGUNDY:0 "Бургундское королевство"
 FRW_BURGUNDY_DEF:0 "Бургундское королевство"
 FRW_BURGUNDY_ADJ:0 "бургундский"
 FRW_WESTUNION:0 "Западный союз"
 FRW_WESTUNION_DEF:0 "Западный союз"
 FRW_WESTUNION_ADJ:0 "западный"
 FRW_burgundy_cat:0 "Бургундское наследие"
 FRW_burgundy_cat_desc:0 "В XV веке герцоги Бургундские из династии Валуа владели землями от Дижона до Амстердама, одними из богатейших в Европе. Теперь Франция в силах вновь объединить их."
 FRW_form_burgundy:0 "Восстановить Бургундское королевство"
 FRW_form_burgundy_desc:0 "Требуется контроль над Фландрией, Голландией, Люксембургом, Валлонией и Бургундией (не коммунистическое правительство). Даёт национальные территории в странах Бенилюкса и национальный дух «Бургундское наследие»."
 FRW_western_union_cat:0 "Западный союз"
 FRW_western_union_cat_desc:0 "Франция и страны Бенилюкса, связанные таможенным союзом и общей обороной."
 FRW_form_western_union:0 "Провозгласить Западный союз"
 FRW_form_western_union_desc:0 "Требуется демократическое правительство, стабильность выше 50 % и контроль над Фландрией, Голландией, Люксембургом и Валлонией. Даёт национальные территории в странах Бенилюкса и национальный дух «Западный союз»."
 frw.99.t:0 "Возрождённая Бургундия"
 frw.99.d:0 "Почти через пять столетий после гибели Карла Смелого при Нанси в 1477 году земли между Рейном и Соммой вновь объединены — на этот раз под властью Парижа. Провозглашено Бургундское королевство."
 frw.99.a:0 "Золотой век возвращается."
 frw.100.t:0 "Западный союз"
 frw.100.d:0 "Франция и страны Бенилюкса подписали в Брюсселе договор о Западном союзе. Он предусматривает общий рынок и объединённую армию демократий Западной Европы, а также общий парламент, который будет надзирать за ними."
 frw.100.a:0 "Новое начало."
 FRW_ETERNAL:0 "Вечное королевство Франкия"
 FRW_ETERNAL_DEF:0 "Вечное королевство Франкия"
 FRW_ETERNAL_ADJ:0 "франкийский"
 FRW_leader_admiral_king:0 "Эмерик Керваде"
 FRW_leader_admiral_king_desc:0 "Эмерик Керваде родился в Женеве в 1894 году и вырос на кораблях своего отца, ходивших между швейцарскими банками и гаванями Танжера и Данцига. В 1920 году он стал одним из первых офицеров молодого польского флота и постигал морское дело в холодных водах у Гдыни. Позднее он командовал флотом, доставившим армии его отца в Лиссабон и Лит. Коронованный в Реймсе как Эмерик I, в народе он известен как «Король-адмирал». В отличие от отца он предпочитает договоры набегам и хочет основать династию, которая его переживёт. Он ни разу не проиграл морского сражения."
 FRW_admiral_king:0 "Король-адмирал"
 frw.101.t:0 "Вечное королевство Франкия"
 frw.101.d:0 "В Реймсском соборе адмирал Эмерик Керваде, сын покойного «Чёрного корсара», коронован как Эмерик I, король франков. Франция и её завоевания провозглашены Вечным королевством Франкия под новым флагом с лилиями, королевским гербом и крестом крестоносцев.\n\nВ своей первой речи король пообещал завершить дело отца. Франция, сказал он, должна стать настолько сильной, чтобы ни один враг больше никогда не ступил на её землю, а Польша больше никогда не должна оставаться в одиночестве."
 frw.101.a:0 "Новая корона в Европе."
 frw.101.b:0 "Pro Rege et Patria!"
 frw.84.t:0 "Письмо из Женевы"
 frw.84.d:0 "Елисейский дворец молчал уже несколько месяцев. И вот приходит письмо на плотной бумаге с водяным знаком частного женевского банка, написанное старомодным почерком.\n\n«Господа, Франция дрейфует, а корабль без капитана кончает на скалах. У меня есть корабли и есть золото. Когда-то я сражался за народ, стёртый с карты, и знаю, чего стоит потеря родины. Пошлите за мной — и я приду.\n\nМ. Керваде, капитан»\n\nВ Париже это имя никому не знакомо. В Цюрихе его знают хорошо.\n\n§GДоступно новое решение: Заручиться поддержкой капитана Керваде.§!"
 frw.84.a:0 "Пожалуй, стоит ему ответить."
 frw.102.t:0 "Чёрный корсар мёртв"
 frw.102.d:0 "Мало Керваде умер в море. Бурной ночью у Гдыни его сердце остановилось на борту корабля, двадцать лет перевозившего его золото и его армии. По словам его офицеров, последние слова он произнёс по-польски.\n\nЕго гроб выставлен для прощания в соборе Сен-Мало под охраной французских морских пехотинцев и польских моряков, прибывших из Гдыни, чтобы проводить его домой. До коронации Францией будет управлять регентский совет. Его сын, адмирал Эмерик Керваде, направляется в Реймс."
 frw.102.a:0 "Покойся в море, капитан."
 FRW_req_european_federation_tt:0 "§gТребуется контроль над §YБельгией§!, §YНидерландами§! и §YЛюксембургом§!, а также над §YИталией§! или §YГерманией§! (аннексированными или в качестве марионеток, если не указано иное). Если Франция ещё не контролирует их, государство будет основано автоматически, как только это произойдёт.§!"
 FRW_req_western_union_tt:0 "§gТребуется контроль над §YБельгией§!, §YНидерландами§! и §YЛюксембургом§! (аннексированными или в качестве марионеток, если не указано иное). Если Франция ещё не контролирует их, государство будет основано автоматически, как только это произойдёт.§!"
 FRW_req_latin_empire_tt:0 "§gТребуется контроль над §YИталией§!, §YИспанией§! и §YПортугалией§! (аннексированными или в качестве марионеток, если не указано иное). Если Франция ещё не контролирует их, государство будет основано автоматически, как только это произойдёт.§!"
 FRW_req_eurafrica_tt:0 "§gТребуется контроль над Французской Северной Африкой (§YАлжиром§!, §YМарокко§! и §YТунисом§!) – достаточно удерживать их военной силой. Если Франция ещё не контролирует их, государство будет основано автоматически, как только это произойдёт.§!"
 FRW_req_francia_tt:0 "§gТребуется контроль над §YРейнландом§!, §YМозельландом§!, §YБельгией§! и §YНидерландами§! (аннексированными или в качестве марионеток, если не указано иное). Если Франция ещё не контролирует их, государство будет основано автоматически, как только это произойдёт.§!"
 FRW_req_burgundy_tt:0 "§gТребуется контроль над всей территорией §YБельгии§!, §YНидерландов§! и §YЛюксембурга§! (аннексированными, а не в качестве марионеток). Если Франция ещё не контролирует их, государство будет основано автоматически, как только это произойдёт.§!"
 FRW_req_grand_empire_tt:0 "§gТребуется контроль над §YРейном§! (Рейнланд, Мозельланд), §YПьемонтом§!, §YБельгией§! и §YНидерландами§! (аннексированными или в качестве марионеток, если не указано иное). Если Франция ещё не контролирует их, государство будет основано автоматически, как только это произойдёт.§!"
 FRW_plunder_cat_desc:0 "Каждая страна, покорившаяся Франции — в качестве сателлита или после капитуляции, — хранит золото в своём центральном банке. Капитан из Сен-Мало намерен его забрать."
 FRW_seize_the_treasury:0 "Захватить казну: [FROM.GetName]"
 FRW_seize_the_treasury_desc:0 "Золотой запас [FROM.GetNameDef] грузят на французские корабли.\n\nФранция: §G+75§! политической власти, §Gгражданский завод§! и §YКорсарское золото§! на 180 дней.\n[FROM.GetNameDefCap]: §RРазграбленная казна§! на 365 дней. Каждую страну можно грабить раз в год."
 FRW_corsair_gold_desc:0 "Захваченное золото поступает в королевскую казну."
 FRW_plundered_treasury_desc:0 "Французские корсары вывезли наш золотой запас."
 FRW_saint_malo_shipyards_desc:0 "Верфи старого корсарского порта вновь строят корабли — и быстрее, чем когда-либо в своей истории."
 FRW_prize_economy_desc:0 "Деньги от захваченных призов вкладываются в заводы и станки."
 FRW_econ_dirigiste_2_desc:0 "План теперь охватывает все регионы, и новые заводы строятся там, где решат плановики."
 FRW_econ_dirigiste_3_desc:0 "Экономика полностью плановая, от цены угля до выпуска каждого завода."
 FRW_econ_liberal_1_desc:0 "Частный капитал и открытые рынки движут французской промышленностью."
 FRW_econ_liberal_2_desc:0 "Инвесторы и инженеры состязаются за контракты, а Франция пожинает прибыль."
 FRW_econ_liberal_3_desc:0 "Кредит дёшев, а портфели заказов французских фирм заполнены."
 FRW_econ_rearmament_1_desc:0 "Каждый свободный франк идёт в арсеналы."
 FRW_econ_rearmament_2_desc:0 "Производство вооружений имеет приоритет над всеми прочими отраслями промышленности."
 FRW_econ_rearmament_3_desc:0 "Франция превратилась в один огромный арсенал."
 FRW_colonial_integration_cat:0 "Колониальная интеграция"
 FRW_colonial_integration_cat_desc:0 "Владение территорией в Африке само по себе ещё не делает её французской. Эти решения ставят принадлежащие Франции африканские земли под надлежащее колониальное управление, что даёт больше солдат и больше ресурсов из каждой области. Лишь §YАлжир§!, французский с 1848 года, становится §Gнациональной территорией§!; с фокусом §YАлжир — это Франция§! за ним следуют заморские департаменты. Решения можно использовать повторно всякий раз, когда Франция получает новые земли в каком-либо регионе."
 FRW_integrate_maghreb:0 "Интегрировать Французскую Северную Африку"
 FRW_integrate_maghreb_desc:0 "Марокко, Тунис и Алжирская Сахара организуются в департаменты по образцу Алжира и Орана.\n\nСтавит все области этого региона, которыми владеет Франция, под §YКолониальную администрацию§!. §YАлжир§! становится §Gнациональной территорией§!."
 FRW_integrate_aof:0 "Интегрировать Французскую Западную Африку"
 FRW_integrate_aof_desc:0 "От Дакара до Ниамея на ФЗА распространяется французское гражданское право, а её жители становятся гражданами.\n\nСтавит все области этого региона, которыми владеет Франция, под §YКолониальную администрацию§!."
 FRW_integrate_aef:0 "Интегрировать Французскую Экваториальную Африку"
 FRW_integrate_aef_desc:0 "Браззавиль, Либревиль, Форт-Лами и подмандатный Камерун переходят под прямое управление Парижа.\n\nСтавит все области этого региона, которыми владеет Франция, под §YКолониальную администрацию§!."
 FRW_integrate_indian_ocean:0 "Интегрировать территории в Индийском океане"
 FRW_integrate_indian_ocean_desc:0 "Мадагаскар, Реюньон, Коморские острова и Джибути включаются в состав заморской Франции.\n\nСтавит все области этого региона, которыми владеет Франция, под §YКолониальную администрацию§!."
 FRW_integrate_spanish:0 "Интегрировать бывшие испанские колонии"
 FRW_integrate_spanish_desc:0 "Риф, Ифни, Рио-де-Оро и Рио-Муни навсегда переходят под французское управление.\n\nСтавит все области этого региона, которыми владеет Франция, под §YКолониальную администрацию§!."
 FRW_integrate_portuguese:0 "Интегрировать бывшие португальские колонии"
 FRW_integrate_portuguese_desc:0 "Гвинея, Ангола, Мозамбик и атлантические острова бывшей Португальской империи присоединяются к Франции.\n\nСтавит все области этого региона, которыми владеет Франция, под §YКолониальную администрацию§!."
 FRW_integrate_congo:0 "Интегрировать Конго"
 FRW_integrate_congo_desc:0 "Бельгийское Конго вместе с Руандой и Бурунди присоединяется к Французской Экваториальной Африке.\n\nСтавит все области этого региона, которыми владеет Франция, под §YКолониальную администрацию§!."
 FRW_integrate_libya:0 "Интегрировать Ливию"
 FRW_integrate_libya_desc:0 "Триполитания, Киренаика и Феццан отныне дают Франции непрерывную связь между Тунисом и Чадом.\n\nСтавит все области этого региона, которыми владеет Франция, под §YКолониальную администрацию§!."
 FRW_integrate_british_west:0 "Интегрировать Британскую Западную Африку"
 FRW_integrate_british_west_desc:0 "Гамбия, Сьерра-Леоне и Нигерия присоединяются к ФЗА.\n\nСтавит все области этого региона, которыми владеет Франция, под §YКолониальную администрацию§!."
 FRW_integrate_african_territories:0 "Заморские департаменты"
 FRW_integrate_african_territories_desc:0 "Алжир, Антильские острова, Гвиана и Реюньон становятся такими же департаментами Франции, как и все остальные. Остальная Африка переходит под колониальное управление."
 RULE_FRW_FRANCE_AI:0 "Франция (France Rework)"
 RULE_FRW_FRANCE_AI_HISTORICAL:0 "Историческая"
 RULE_FRW_FRANCE_AI_HISTORICAL_DESC:0 "Франция остаётся демократией, как правило с Народным фронтом. Рекомендуется."
 RULE_FRW_FRANCE_AI_DEMOCRATIC:0 "Демократическая"
 RULE_FRW_FRANCE_AI_DEMOCRATIC_DESC:0 "Франция следует одному из демократических путей (Блюм или Рейно/де Голль)."
 RULE_FRW_FRANCE_AI_COMMUNIST:0 "Коммунистическая"
 RULE_FRW_FRANCE_AI_COMMUNIST_DESC:0 "Франция следует одному из коммунистических путей (Торез или Пивер)."
 RULE_FRW_FRANCE_AI_FASCIST:0 "Фашистская"
 RULE_FRW_FRANCE_AI_FASCIST_DESC:0 "Франция следует одному из фашистских путей (де Ла Рок или Дорио)."
 RULE_FRW_FRANCE_AI_NONALIGNED:0 "Неприсоединившаяся"
 RULE_FRW_FRANCE_AI_NONALIGNED_DESC:0 "Франция следует одному из неприсоединившихся путей (Петен, Орлеаны или Бонапарты)."
 RULE_FRW_FRANCE_AI_RANDOM:0 "Случайная"
 RULE_FRW_FRANCE_AI_RANDOM_DESC:0 "ИИ с равной вероятностью выбирает любую из четырёх идеологий."
 FRW_shortcut_democratic:0 "Демократические пути"
 FRW_shortcut_communist:0 "Коммунистические пути"
 FRW_shortcut_fascist:0 "Фашистские пути"
 FRW_shortcut_nonaligned:0 "Неприсоединившиеся пути"
 FRW_shortcut_secret:0 "Тайный путь"
 FRW_shortcut_economy:0 "Экономика"
 FRW_shortcut_military:0 "Армия"
 FRW_shortcut_diplomacy:0 "Дипломатия"
 FRW_shortcut_colonies:0 "Колониальная империя"
 FRW_plunder_cat:0 "Военные трофеи"
 FRW_econ_dirigiste_1_desc:0 "Государство составляет инвестиционные планы и руководит крупнейшими отраслями промышленности."
 FRW_union_francaise_formed_desc:0 "Колонии от Дакара до Сайгона отныне входят в единый Французский союз."
 FRW_european_federation_desc:0 "Федеративная Европа под руководством Франции с единым рынком и общим парламентом."
 FRW_western_union_idea_desc:0 "Демократии Западной Европы имеют общий рынок и объединённую армию."
 FRW_latin_empire_idea_desc:0 "Mare Nostrum. Латинские флоты господствуют в Средиземноморье."
 FRW_eurafrican_federation_idea_desc:0 "Европа и Африка образуют единое экономическое пространство, управляемое из Парижа."
 FRW_francia_idea_desc:0 "Как наследник Карла Великого, король правит от Пиренеев до Рейна."
 FRW_burgundy_idea_desc:0 "Богатые провинции старого Бургундского государства вновь объединены."
 FRW_grand_empire_idea_desc:0 "Европа Наполеона восстановлена, и Великая армия снова на марше."
 FRW_franco_british_union_spirit_desc:0 "Франция и Британия слили свои империи в единый союз."
 FRW_drapeau_noir_desc:0 "Под чёрным флагом корсаров наши солдаты защищают каждую пядь родной земли."
 FRW_eternal_kingdom_spirit_desc:0 "Корона восстановлена, и носящий её король ни разу не проиграл морского сражения."
 FRW_decolonisation_cat:0 "Антиколониальная революция"
 FRW_decolonisation_cat_desc:0 "Рабочая республика не может силой править другими народами. Каждая освобождённая колония становится социалистическим союзником и повышает авторитет Коммуны среди колониальных народов по всему миру.\n\nКаждое освобождение усиливает §YБратские народы§! на один уровень (максимум до трёх)."
 FRW_free_north_africa:0 "Освободить Северную Африку"
 FRW_free_north_africa_desc:0 "Марокко, Тунис и Алжир становятся независимыми социалистическими республиками в союзе с Французской коммуной.\n\nОсвобождает их как §Yкоммунистических сателлитов§! (только там, где Франция владеет их землями) и усиливает §YБратские народы§!."
 FRW_free_west_africa:0 "Освободить Западную Африку"
 FRW_free_west_africa_desc:0 "Территории ФЗА от Сенегала до Нигера и подмандатное Того избирают собственные советы и выходят из империи.\n\nОсвобождает их как §Yкоммунистических сателлитов§! (только там, где Франция владеет их землями) и усиливает §YБратские народы§!."
 FRW_free_equatorial_africa:0 "Освободить Экваториальную Африку"
 FRW_free_equatorial_africa_desc:0 "Чад, Камерун, Габон, Среднее Конго и Убанги-Шари провозглашаются свободными республиками.\n\nОсвобождает их как §Yкоммунистических сателлитов§! (только там, где Франция владеет их землями) и усиливает §YБратские народы§!."
 FRW_free_indian_ocean:0 "Освободить Мадагаскар и Джибути"
 FRW_free_indian_ocean_desc:0 "Мадагаскар и побережье Джибути переходят в руки их собственных народов.\n\nОсвобождает их как §Yкоммунистических сателлитов§! (только там, где Франция владеет их землями) и усиливает §YБратские народы§!."
 FRW_free_indochina:0 "Освободить Индокитай"
 FRW_free_indochina_desc:0 "При поддержке Франции индокитайские коммунисты берут власть в Ханое, Пномпене и Вьентьяне.\n\nОсвобождает их как §Yкоммунистических сателлитов§! (только там, где Франция владеет их землями) и усиливает §YБратские народы§!."
 FRW_free_levant:0 "Освободить Левант"
 FRW_free_levant_desc:0 "Сирийский и ливанский мандаты прекращаются, и Дамаск и Бейрут отныне управляют собой сами.\n\nОсвобождает их как §Yкоммунистических сателлитов§! (только там, где Франция владеет их землями) и усиливает §YБратские народы§!."
 FRW_european_community_faction:0 "Европейское сообщество"
 FRW_neutral_bloc_faction:0 "Латинский нейтральный блок"
 frw.120.t:0 "Франция предлагает нейтральный блок"
 frw.120.d:0 "Посланник маршала привёз предложение из Парижа. Латинские народы, говорит он, должны держаться вместе и остаться в стороне от грядущей войны между Берлином, Лондоном и Москвой. Франция предлагает общую оборону и больше ничего не просит."
 frw.120.a:0 "Мы согласны."
 frw.120.b:0 "Мы предпочитаем стоять в одиночку."
 frw.121.t:0 "Европейская федерация"
 frw.121.d:0 "Париж призывает членов Европейского сообщества сделать последний шаг к федеральному правительству с единой армией и валютой. Наши министры заседали бы в Париже, а наш флаг висел бы рядом с остальными в федеральной ассамблее."
 frw.121.a:0 "Мы вступаем в федерацию."
 frw.121.b:0 "Мы сохраняем суверенитет."
 FRW_imperial_redoubt_desc:0 "Если метрополия падёт, правительство продолжит войну из Северной Африки."
 FRW_imperial_redoubt_2_desc:0 "Каждая колония укреплена, а её гарнизон приведён в боевую готовность."
 FRW_marshals_france_desc:0 "Порядок внутри страны и мир за надёжно вооружёнными границами."
 FRW_continental_empire_spirit_desc:0 "Империя простирается от Атлантики до Вислы и Нила."
 FRW_free_france_spirit_desc:0 "Правительство продолжает войну из колоний до освобождения Парижа."
 FRW_brazzaville_spirit_desc:0 "В Браззавиле колониям пообещали новое место во французском сообществе после окончания войны."
 FRW_liberation_spirit_desc:0 "Париж освобождён, и правительство вернулось в столицу."
 FRW_european_partner_desc:0 "Членство в Европейском сообществе открывает французским фирмам и учёным зарубежные рынки и лаборатории."
 FRW_european_market_desc:0 "Товары теперь свободно перемещаются между государствами — членами Сообщества."
 FRW_fraternal_peoples_desc:0 "Освобождённые колонии стоят на стороне Коммуны."
 FRW_fraternal_peoples_2_desc:0 "Освобождённые колонии стоят на стороне Коммуны."
 FRW_fraternal_peoples_3_desc:0 "Освобождённые колонии стоят на стороне Коммуны."
 FRW_diplomatic_overture:0 "Дипломатическая инициатива Франции"
 FRW_royal_ties:0 "Связи с французской короной"
 FRW_fascist_friendship:0 "Фашистская дружба"
 FRW_lend_lease_spirit_desc:0 "Американское снаряжение поступает Свободным французам через Британию."
 FRW_resistance_spirit_desc:0 "Сети Сопротивления в оккупированной Франции подчиняются Лондону."
 FRW_provisional_government_spirit_desc:0 "Республика продолжает существовать в изгнании и готовит своё возвращение."
 FRW_fight_on_spirit_desc:0 "Перемирие не признано. Каждый солдат Свободной Франции сражается так, будто судьба Франции зависит только от него."
 FRW_oath_of_kufra_desc:0 "В Куфре бойцы Леклерка поклялись не складывать оружия, пока флаг не поднимется над Страсбургом."
 FRW_liberation_cat:0 "Освободительная война"
 FRW_liberation_cat_desc:0 "Когда Свободные французы овладеют основными регионами своей страны, они смогут предложить оккупанту мир по нынешней линии фронта или продолжить борьбу за остальное."
 FRW_liberation_metropole:0 "Предложить мир: метрополия"
 FRW_liberation_metropole_desc:0 "Требуется контроль над §YПарижем§!, §YПа-де-Кале§!, §YЭльзасом-Лотарингией§!, §YАквитанией§! и §YМарселем§!."
 FRW_liberation_africa:0 "Предложить мир: Северная Африка"
 FRW_liberation_africa_desc:0 "Требуется контроль над §YАлжиром§!, §YТунисом§! и §YМарокко§!."
 frw.130.t:0 "Оккупант просит об условиях"
 frw.130.d:0 "Сердце Франции вновь под трёхцветным флагом, и в наш штаб прибывают вражеские посланники. Они предлагают перемирие по нынешней линии фронта. Наши генералы полагают, что остальную часть страны тоже можно отвоевать, но дорогой ценой."
 frw.130.a:0 "Подписать мир."
 frw.130.a.tt:0 "Каждая §Yнациональная территория Франции§!, которую контролирует Франция, вновь становится французской.\n§YБелый мир§! с каждым противником, владевшим одной из них. Столица возвращается в §YПариж§!, если Франция его удерживает."
 frw.130.b:0 "Сражаться до освобождения Франции."
 frw.130.b.tt:0 "Война продолжается. §YМы продолжаем борьбу§! на 180 дней (если ещё не действует). Предложение можно будет повторить через 90 дней."
 FRW_latin_destiny_spirit_desc:0 "Корсика, Сардиния и побережье Прованса охраняют западное Средиземноморье для Франции."
 FRW_leader_alfonso_desc:0 "Альфонс Бурбонский покинул Мадрид в апреле 1931 года, не отрекшись от престола. Как старший наследник Людовика XIV по мужской линии, для французских легитимистов он — король Франции и Наварры Альфонс I."
 FRW_legitimist_party:0 "Легитимисты"
 FRW_legitimist_party_long:0 "Роялистский легитимистский союз"
 FRW_bourbon_pact_faction:0 "Семейный пакт Бурбонов"
 FRW_BOURBON:0 "Королевство Франции и Испании"
 FRW_BOURBON_DEF:0 "Королевство Франции и Испании"
 FRW_BOURBON_ADJ:0 "франко-испанский"
 FRW_legitimist_crown_desc:0 "Старшая ветвь Бурбонов царствует во Франции впервые с 1830 года."
 FRW_legitimist_crown_2_desc:0 "Церковь и корона поддерживают друг друга в обоих королевствах."
 FRW_two_crowns_spirit_desc:0 "У Франции и Испании общие король, судостроительная программа и оружейные заводы."
 FRW_bourbon_partner_desc:0 "Испания извлекает выгоду из союза с бурбонским королём Франции."
 FRW_grand_siecle_desc:0 "Бурбон правит от Ла-Манша до Гибралтара, как во времена Короля-Солнце."
 FRW_double_monarchy_idea_desc:0 "Франция и Испания — единое королевство под властью одного короля из дома Бурбонов."
 FRW_req_bourbon_tt:0 "§gТребуется контроль над §YМадридом§! (аннексированным или в качестве марионетки). Если Франция ещё не контролирует его, королевство будет основано автоматически, как только это произойдёт.§!"
 frw.140.t:0 "Король Франции притязает на Испанию"
 frw.140.d:0 "Бурбонский король в Париже напоминает Мадриду, что никогда не отрекался от испанского престола. Он просит Испанию вновь признать его своим королём. Согласие поставит Испанию под защиту Франции; отказ может означать войну."
 frw.140.a:0 "Да здравствует король!"
 frw.140.b:0 "Испанией не будут править из Парижа."
 frw.141.t:0 "Король из дома Бурбонов в Париже"
 frw.141.d:0 "Легитимисты провозгласили королём Франции Альфонса Бурбонского, изгнанного короля Испании. Орлеанский претендент выразил протест из Брюсселя, а республиканское правительство в Мадриде наблюдает за происходящим с тревогой."
 frw.141.a:0 "Два трона, один король?"
 frw.142.t:0 "Короны Франции и Испании объединены"
 frw.142.d:0 "Более чем через два столетия после того, как Утрехтский мир это запретил, Франция и Испания объединены под властью одного короля из дома Бурбонов. Новое королевство простирается от Дюнкерка до Кадиса."
 frw.142.a:0 "Пиренеев больше нет."
 frw.143.t:0 "Испания признаёт короля"
 frw.143.d:0 "Мадрид признал нашего короля королём Испании и передал страну под защиту Франции."
 frw.143.a:0 "Vive le Roi! ¡Viva el Rey!"
 frw.144.t:0 "Испания отвергает короля"
 frw.144.d:0 "Мадрид отверг притязания нашего короля. Армия стоит наготове у Пиренеев."
 frw.144.a:0 "Тогда мы возьмём её силой."
 FRW_disjointed_2_desc:0 "Министерская чехарда прекратилась, но министры по-прежнему не доверяют друг другу, а администрация повинуется медленно."
 FRW_disjointed_3_desc:0 "Правительство обрело почву под ногами. Осталось лишь несколько старых распрей."
 FRW_victors_2_desc:0 "Армия начала сомневаться в доктринах 1918 года, но старые привычки отмирают медленно."
 FRW_dec_consolidate_government:0 "Укрепить правительство"
 FRW_dec_consolidate_government_desc:0 "Очистить министерства от враждующих клик и обеспечить кабинету твёрдое большинство.\n\nДоступно с §Y1937 года§!, не ранее чем через §Y6 месяцев§! после начала реформы, при стабильности §Y40%§!: §YХрупкое правительство§! становится §YСтабилизирующимся правительством§!."
 FRW_dec_stable_government:0 "Стабильное правительство"
 FRW_dec_stable_government_desc:0 "Министерства без промедления исполняют постановления кабинета.\n\nДоступно с §Y1938 года§!, не ранее чем через §Y6 месяцев§! после предыдущего шага, при стабильности §Y50%§!: убирает §YСтабилизирующееся правительство§!."
 FRW_dec_backer_blum:0 "Заручиться поддержкой Леона Блюма"
 FRW_dec_backer_blum_desc:0 "Переговоры с Леоном Блюмом, СФИО и Народным фронтом займут около шести недель. Одновременно можно добиваться поддержки только одного лидера этого лагеря.\n\nТребуется §Y45%§! поддержки партии и §Y30%§! стабильности. После этого в дереве фокусов можно будет выбрать путь Леона Блюма."
 FRW_dec_backer_reynaud:0 "Заручиться поддержкой Поля Рейно"
 FRW_dec_backer_reynaud_desc:0 "Переговоры с Полем Рейно, Демократическим альянсом и правым центром займут около шести недель. Одновременно можно добиваться расположения лишь одного лидера этого лагеря.\n\nТребуется §Y45%§! поддержки партии и §Y30%§! стабильности. После этого в дереве фокусов можно будет избрать путь Поля Рейно."
 FRW_dec_backer_thorez:0 "Заручиться поддержкой Мориса Тореза"
 FRW_dec_backer_thorez_desc:0 "Переговоры с Морисом Торезом и ФКП, следующей линии Москвы, займут около шести недель. Одновременно можно добиваться расположения лишь одного лидера этого лагеря.\n\nТребуется §Y35%§! поддержки партии и §Y30%§! стабильности. После этого в дереве фокусов можно будет избрать путь Мориса Тореза."
 FRW_dec_backer_pivert:0 "Заручиться поддержкой Марсо Пивера"
 FRW_dec_backer_pivert_desc:0 "Переговоры с Марсо Пивером и «Революционными левыми» займут около шести недель. Одновременно можно добиваться расположения лишь одного лидера этого лагеря.\n\nТребуется §Y35%§! поддержки партии и §Y30%§! стабильности. После этого в дереве фокусов можно будет избрать путь Марсо Пивера."
 FRW_dec_backer_larocque:0 "Заручиться поддержкой Франсуа де Ла Рока"
 FRW_dec_backer_larocque_desc:0 "Переговоры с Франсуа де Ла Роком, «Огненными крестами» и ФСП займут около шести недель. Одновременно можно добиваться расположения лишь одного лидера этого лагеря.\n\nТребуется §Y35%§! поддержки партии и §Y30%§! стабильности. После этого в дереве фокусов можно будет избрать путь Франсуа де Ла Рока."
 FRW_dec_backer_doriot:0 "Заручиться поддержкой Жака Дорио"
 FRW_dec_backer_doriot_desc:0 "Переговоры с Жаком Дорио и ФНП займут около шести недель. Одновременно можно добиваться расположения лишь одного лидера этого лагеря.\n\nТребуется §Y35%§! поддержки партии и §Y30%§! стабильности. После этого в дереве фокусов можно будет избрать путь Жака Дорио."
 FRW_dec_backer_petain:0 "Заручиться поддержкой маршала Петена"
 FRW_dec_backer_petain_desc:0 "Переговоры с маршалом Петеном, ветеранами и армией займут около шести недель. Одновременно можно добиваться расположения лишь одного лидера этого лагеря.\n\nТребуется §Y35%§! поддержки партии и §Y30%§! стабильности. После этого в дереве фокусов можно будет избрать путь маршала Петена."
 FRW_dec_backer_orleans:0 "Заручиться поддержкой графа Парижского"
 FRW_dec_backer_orleans_desc:0 "Переговоры с графом Парижским, орлеанистами и «Аксьон франсез» займут около шести недель. Одновременно можно добиваться расположения лишь одного лидера этого лагеря.\n\nТребуется §Y35%§! поддержки партии и §Y30%§! стабильности. После этого в дереве фокусов можно будет избрать путь графа Парижского."
 FRW_dec_backer_bonaparte:0 "Заручиться поддержкой принца Луи Наполеона"
 FRW_dec_backer_bonaparte_desc:0 "Переговоры с принцем Луи Наполеоном и бонапартистскими комитетами займут около шести недель. Одновременно можно добиваться расположения лишь одного лидера этого лагеря.\n\nТребуется §Y35%§! поддержки партии и §Y30%§! стабильности. После этого в дереве фокусов можно будет избрать путь принца Луи Наполеона."
 FRW_dec_backer_legit:0 "Заручиться поддержкой Альфонса Бурбонского"
 FRW_dec_backer_legit_desc:0 "Переговоры с Альфонсом Бурбонским и легитимистами займут около шести недель. Одновременно можно добиваться расположения лишь одного лидера этого лагеря.\n\nТребуется §Y35%§! поддержки партии и §Y30%§! стабильности. После этого в дереве фокусов можно будет избрать путь Альфонса Бурбонского."
