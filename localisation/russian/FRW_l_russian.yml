 FRW_ffp_tt_p2:0 "Престиж Свободной Франции: §G+2§!"
 FRW_ffp_tt_p3:0 "Престиж Свободной Франции: §G+3§!"
 FRW_ralliement_cat:0 "Свободная Франция"
 FRW_exped_eq_tt:0 "На складах не менее §Y1500§! ед. пехотного снаряжения"
 FRW_dec_exped_tt:0 "Задействует §Y15 000§! людских ресурсов и §Y1500§! ед. пехотного снаряжения. Через §Y45 дней§! экспедиция доложит о результате: при успехе регион присоединяется к Свободной Франции (§G+5§! престижа, армейский опыт), при неудаче §R-8§! престижа."
 FRW_dec_ff_agents:0 "Забросить агентов во Францию"
 FRW_dec_ff_agents_desc:0 "Радисты и организаторы BCRA по ночам десантируются над оккупированной Францией."
 FRW_dec_ff_agents_tt:0 "Все оккупированные французские области в Европе: сопротивление §G+5§!."
 FRW_dec_ff_sabotage:0 "Диверсии на железных дорогах"
 FRW_dec_ff_sabotage_desc:0 "Железнодорожники из «Резистанс-Фер» взрывают стрелки, пускают поезда под откос и задерживают каждый немецкий эшелон."
 FRW_dec_ff_sabotage_tt:0 "Все оккупированные французские области в Европе: сопротивление §G+10§!, инфраструктура повреждена."
 FRW_dec_ff_gold:0 "Потратить золото Банка Франции"
 FRW_dec_ff_gold_desc:0 "Золото, вывезенное из Франции до перемирия, оплачивает оружие и мастерские за границей.\n\nОсталось золота: §Y[?FRW_gold|0] т§!"
 FRW_gold_m400_tt:0 "Золотой запас: §R-400 т§!"
 FRW_ralliement_cat_desc:0 "Колонии были переданы Виши, но их можно вернуть регион за регионом: с помощью §Yпосланника§! (дёшево, зависит от престижа) или §Yэкспедиции§! (стоит людей и винтовок, +25% к шансу и ещё +10%, пока Британия продолжает сражаться).\n\nПрестиж Свободной Франции: §Y[?FRW_ff_prestige|0]§! из 100\n\nШанс успеха растёт с престижем (учитывается его половина), с каждой прежней неудачей в том же регионе (по §G+10%§!, не более трёх раз) и благодаря некоторым фокусам. Успех даёт §G+5§! престижа, неудача §R-5§!. Престиж растёт сам собой каждый месяц, пока Франция сражается, и быстрее, если в войне ещё участвует крупный союзник."
 FRW_dec_rally_tt:0 "Через §Y21 день§! посланник доложит о результате: при успехе все области региона, удерживаемые §YВиши§!, переходят к Свободной Франции вместе с солдатами и их винтовками."
 FRW_ffp_tt_m10:0 "Престиж Свободной Франции: §R-10§!"
 FRW_ffp_tt_p5:0 "Престиж Свободной Франции: §G+5§!"
 frw_sys.20.t:0 "Французская Экваториальная Африка переходит на сторону Свободной Франции"
 frw_sys.20.d:0 "Губернатор Феликс Эбуэ объявил в Форт-Лами о поддержке Свободной Франции. В считанные дни за ним последовали Камерун, Среднее Конго и Габон. Браззавиль становится первой столицей Свободной Франции."
 frw_sys.20.a:0 "Да здравствует Свободная Франция!"
 frw_sys.30.t:0 "Французская Экваториальная Африка остаётся верна Виши"
 frw_sys.30.d:0 "Офицеры в Габоне сохраняют верность Виши, а посланника сажают на ближайшее судно до Лагоса. В следующий раз наши посланники будут лучше подготовлены."
 frw_sys.30.a:0 "Мы попробуем снова."
 frw_sys.60.t:0 "Наши войска высаживаются во Французской Экваториальной Африке"
 frw_sys.60.d:0 "Колонны Свободной Франции при поддержке союзных кораблей и авиации достигли столицы региона. Губернатор Феликс Эбуэ объявил в Форт-Лами о поддержке Свободной Франции. В считанные дни за ним последовали Камерун, Среднее Конго и Габон. Браззавиль становится первой столицей Свободной Франции."
 frw_sys.60.a:0 "Лотарингский крест снова реет над нами."
 frw_sys.70.t:0 "Экспедиция во Французскую Экваториальную Африку провалилась"
 frw_sys.70.d:0 "Наш десант натолкнулся на упорное сопротивление гарнизона Виши, и его пришлось свернуть. Люди и снаряжение потеряны, а пропаганда Виши торжествует."
 frw_sys.70.a:0 "Мы ещё вернёмся."
 frw_sys.21.t:0 "Французская Западная Африка переходит на сторону Свободной Франции"
 frw_sys.21.d:0 "В Дакаре генерал-губернатор перешёл на другую сторону. Большая гавань, линкор в её бассейне и сенегальские стрелки теперь служат Свободной Франции."
 frw_sys.21.a:0 "Да здравствует Свободная Франция!"
 frw_sys.31.t:0 "Французская Западная Африка остаётся верна Виши"
 frw_sys.31.d:0 "Батареи Дакара открывают огонь по кораблям Свободной Франции. Виши пока сохраняет Западную Африку. В следующий раз наши посланники будут лучше подготовлены."
 frw_sys.31.a:0 "Мы попробуем снова."
 frw_sys.61.t:0 "Наши войска высаживаются во Французской Западной Африке"
 frw_sys.61.d:0 "Колонны Свободной Франции при поддержке союзных кораблей и авиации достигли столицы региона. В Дакаре генерал-губернатор перешёл на другую сторону. Большая гавань, линкор в её бассейне и сенегальские стрелки теперь служат Свободной Франции."
 frw_sys.61.a:0 "Лотарингский крест снова реет над нами."
 frw_sys.71.t:0 "Экспедиция во Французскую Западную Африку провалилась"
 frw_sys.71.d:0 "Наш десант натолкнулся на упорное сопротивление гарнизона Виши, и его пришлось свернуть. Люди и снаряжение потеряны, а пропаганда Виши торжествует."
 frw_sys.71.a:0 "Мы ещё вернёмся."
 frw_sys.22.t:0 "Французская Северная Африка переходит на сторону Свободной Франции"
 frw_sys.22.d:0 "Алжир, Оран, Касабланка и Тунис присоединились к нам. Африканская армия численностью сто тысяч человек возвращается в войну."
 frw_sys.22.a:0 "Да здравствует Свободная Франция!"
 frw_sys.32.t:0 "Французская Северная Африка остаётся верна Виши"
 frw_sys.32.d:0 "Генерал Вейган приказывает арестовать заговорщиков в Алжире. Северная Африка остаётся с маршалом. В следующий раз наши посланники будут лучше подготовлены."
 frw_sys.32.a:0 "Мы попробуем снова."
 frw_sys.62.t:0 "Наши войска высаживаются во Французской Северной Африке"
 frw_sys.62.d:0 "Колонны Свободной Франции при поддержке союзных кораблей и авиации достигли столицы региона. Алжир, Оран, Касабланка и Тунис присоединились к нам. Африканская армия численностью сто тысяч человек возвращается в войну."
 frw_sys.62.a:0 "Лотарингский крест снова реет над нами."
 frw_sys.72.t:0 "Экспедиция во Французскую Северную Африку провалилась"
 frw_sys.72.d:0 "Наш десант натолкнулся на упорное сопротивление гарнизона Виши, и его пришлось свернуть. Люди и снаряжение потеряны, а пропаганда Виши торжествует."
 frw_sys.72.a:0 "Мы ещё вернёмся."
 frw_sys.23.t:0 "Левант переходит на сторону Свободной Франции"
 frw_sys.23.d:0 "После короткой и ожесточённой кампании Левантийская армия сложила оружие. Многие её солдаты решили присоединиться к Свободным французам."
 frw_sys.23.a:0 "Да здравствует Свободная Франция!"
 frw_sys.33.t:0 "Левант остаётся верен Виши"
 frw_sys.33.d:0 "Генерал Денц отвергает все предложения. В Дамаске офицеров Свободной Франции судят за измену. В следующий раз наши посланники будут лучше подготовлены."
 frw_sys.33.a:0 "Мы попробуем снова."
