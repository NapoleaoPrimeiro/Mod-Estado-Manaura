 frw_sys.76.t:0 "Экспедиция во Французский Индокитай провалилась"
 frw_sys.76.d:0 "Наш десант натолкнулся на упорное сопротивление гарнизона Виши, и его пришлось свернуть. Люди и снаряжение потеряны, а пропаганда Виши торжествует."
 frw_sys.76.a:0 "Мы ещё вернёмся."
 FRW_gold_p400_tt:0 "Золотой запас: §G+400 т§!"
 FRW_inf_tt_m35:0 "Инфляция: §G-35§!"
 frw_sys.3.t:0 "Гиперинфляция"
 frw_sys.3.d:0 "Банкноты носят корзинами, а цены меняются дважды в день. Франк на грани краха. Эксперты Министерства финансов предлагают радикальную денежную реформу: новый франк, один новый за сто старых."
 frw_sys.3.a:0 "Ввести новый франк."
 frw_sys.3.b:0 "Не сейчас. Переждём."
 frw_sys.4.t:0 "Золото потеряно"
 frw_sys.4.d:0 "Золото Банка Франции не успели вывезти. Теперь оно в руках оккупанта, и Свободной Франции придётся обходиться без него."
 frw_sys.4.a:0 "Надо было отправить его в Дакар."
 frw_sys.50.t:0 "Союзники признают Свободную Францию"
 frw_sys.50.d:0 "Лондон и Вашингтон теперь относятся к Свободной Франции как к настоящему союзнику. В наше распоряжение предоставлены оружие, кредиты и заводские площади в Британии."
 frw_sys.50.a:0 "Франция вернулась за стол переговоров."
 frw_sys.51.t:0 "Сражающаяся Франция"
 frw_sys.51.d:0 "Союзные правительства признают комитет Свободной Франции правительством Франции. Послы, прежде ездившие в Виши, теперь направляются в Карлтон-Гарденс."
 frw_sys.51.a:0 "Да здравствует Сражающаяся Франция!"
 frw_sys.5.t:0 "Хранилища пустеют"
 frw_sys.5.d:0 "Управляющий Банка Франции приносит дурные вести: в хранилищах осталось меньше пятисот тонн золота. Без золота за франком ничего не стоит, и это знает каждый спекулянт в Европе."
 frw_sys.5.a:0 "Закрыть границы для капитала."
 frw_sys.5.b:0 "Просить Лондон о золотом займе."
 frw_sys.5.c:0 "Как-нибудь справимся."
 frw_sys.1.t:0 "Франк падает"
 frw_sys.1.d:0 "Цены в Париже за год удвоились. Домохозяйки стоят в очередях за хлебом, профсоюзы требуют повышения зарплат, а газеты вспоминают 1926 год. Министр финансов просит чрезвычайных мер."
 frw_sys.1.a:0 "Принять горькое лекарство."
 frw_sys.1.b:0 "Нация выдержит — у Франции другие заботы."
 frw_sys.2.t:0 "Правительство в изгнании"
 frw_sys.2.d:0 "Франция пала, но правительство продолжает борьбу. Ветка Свободной Франции в древе фокусов теперь открыта, а меню решений §YСвободная Франция§! позволяет вернуть колонии, переданные Виши."
 frw_sys.2.a:0 "Пламя французского сопротивления не должно погаснуть."
 frw_sys.10.t:0 "Флот в Мерс-эль-Кебире"
 frw_sys.10.d:0 "По перемирию флот отошёл к Виши. В Мерс-эль-Кебире, Тулоне и Александрии корабли стоят на якоре, а экипажи не знают, кому подчиняться. Лондон не допустит, чтобы они попали в руки немцев, и Свободная Франция должна решить, что сказать экипажам."
 frw_sys.10.a:0 "Призвать моряков присоединиться к нам."
 frw_sys.10.a.tt:0 "Шанс (§Y20%§! + 40% престижа): часть флота Виши (§Yоколо трети§!) уходит к Свободной Франции, §G+5§! престижа. Иначе §R-5§! престижа."
 frw_sys.10.b:0 "Пусть с этим разберётся Королевский флот."
 frw_sys.10.b.tt:0 "Королевский флот атакует флот Виши: Виши теряет §Yлинкор, линейный крейсер и три эсминца§!."
 frw_sys.10.c:0 "Французские корабли никогда не откроют огонь по французским кораблям."
 frw_sys.11.t:0 "Моряки присоединяются к нам"
 frw_sys.11.d:0 "Несколько кораблей ночью ускользнули из гавани и теперь идут в порты Свободной Франции, а экипажи ликуют на палубах."
 frw_sys.11.a:0 "Добро пожаловать на борт."
 frw_sys.12.t:0 "Флот остаётся с Виши"
 frw_sys.12.d:0 "Адмирал Дарлан приказал запереть экипажи на кораблях. Ни одно судно не откликнулось на наш призыв."
 frw_sys.12.a:0 "Тяжёлый удар."
 frw_sys.40.t:0 "Губернатор перешёл на сторону врага"
 frw_sys.40.d:0 "Один из наших колониальных губернаторов перешёл к лондонским диссидентам. Над его территорией теперь реет Лотарингский крест."
 frw_sys.40.a:0 "Предатели!"
 FRW_hook_devalue_the_franc_0_tt:0 "Инфляция: §G-10§!"
 FRW_hook_reform_banque_de_france_0_tt:0 "Отныне инфляция снижается ещё на §G0.5§! п. в месяц."
 FRW_hook_war_economy_0_tt:0 "Инфляция: §R+5§!"
 FRW_hook_appeal_of_18_june_0_tt:0 "Престиж Свободной Франции начинается с §Y20§! из 100, открываются решения §YСвободная Франция§!. Снимает §YПораженчество§!."
 FRW_hook_continue_the_fight_0_tt:0 "Престиж Свободной Франции: §G+5§!"
 FRW_hook_free_french_forces_0_tt:0 "Престиж Свободной Франции: §G+5§!"
 FRW_hook_rally_the_colonies_0_tt:0 "Престиж Свободной Франции: §G+10§!"
 FRW_hook_leclerc_column_0_tt:0 "Престиж Свободной Франции: §G+5§!"
 FRW_hook_brazzaville_conference_0_tt:0 "Престиж Свободной Франции: §G+10§!"
 FRW_hook_the_resistance_0_tt:0 "Престиж Свободной Франции: §G+5§!"

 # ---------- Free France extension ----------
 FRW_ff_chequers_spirit_desc:0 "Британия финансирует, вооружает и снабжает Свободных французов и признаёт де Голля их лидером."
 FRW_ff_national_committee_spirit_desc:0 "Французский национальный комитет управляет из Лондона."
 FRW_ff_bcra_spirit_desc:0 "Разведывательная служба Свободной Франции управляет сетями по всей оккупированной Франции."
 FRW_ff_cnr_spirit_desc:0 "Национальный совет Сопротивления объединяет движения."
 FRW_ff_bir_hakeim_spirit_desc:0 "Армия помнит шестнадцать дней в пустыне."
 FRW_ff_fafl_spirit_desc:0 "Французские лётчики снова летают под Лотарингским крестом."
 FRW_ff_normandie_spirit_desc:0 "Французские лётчики летают на «Яках» в составе советских ВВС."
 FRW_ff_fnfl_spirit_desc:0 "Корабли Свободной Франции сопровождают атлантические конвои."
 FRW_ff_securite_sociale_spirit_desc:0 "Каждый наёмный работник застрахован. Это дорого и очень популярно."
 FRW_ff_reconstruction_spirit_desc:0 "Франция восстанавливает то, что разрушила война."
 FRW_ff_fourth_republic_spirit_desc:0 "Францией вновь управляет избранное Собрание."
 FRW_ff_eurafrican_assembly_spirit_desc:0 "У Европы и Африки общий парламент."
 FRW_ff_lorraine_spirit_desc:0 "Французские бомбардировочные экипажи выполняют собственные задания над Францией."
 FRW_ff_richelieu_spirit_desc:0 "Самый современный французский линкор вновь в бою."
 FRW_ff_maquis_spirit_desc:0 "Холмы Франции полны вооружённых людей."
 FRW_ff_colonial_recruitment_spirit_desc:0 "Африканские стрелки пополняют ряды армии освобождения."
 FRW_ff_cfln_spirit_desc:0 "Один комитет, одна армия, одна Франция."
 FRW_ff_cef_spirit_desc:0 "Горные войска Жюэна идут впереди."
 FRW_ff_dragoon_spirit_desc:0 "Армия умеет высаживаться на враждебный берег."
 FRW_ff_dakar_tt:0 "§YФранцузская Западная Африка§! (Дакар) присоединилась к Свободной Франции"
 FRW_ff_sov_fights_tt:0 "§YСоветский Союз§! находится в состоянии войны с §YГерманией§!"

 # ---------- French Africa in allied hands ----------
 FRW_return_cat:0 "Французская Африка в руках союзников"
 FRW_return_cat_desc:0 "Союзные войска удерживают часть Французской Африки. Попросите их вернуть территорию Франции, вежливо или сделав предложение, от которого им будет трудно отказаться.\n\nПрестиж Свободной Франции: §Y[?FRW_ff_prestige|0]§!"
 FRW_dec_return_request:0 "Попросить [FROM.GetName] вернуть Французскую Африку"
 FRW_dec_return_request_desc:0 "[FROM.GetName] удерживает французские территории в Африке. Дипломатическая просьба обходится недорого, но они могут отказать."
 FRW_dec_return_request_tt:0 "Решает [FROM.GetName]. ИИ соглашается тем охотнее, чем выше наш §Yпрестиж Свободной Франции§! (примерно от §Y50%§! до §Y95%§!).\nВ случае согласия все §Yфранцузские§! области в §YАфрике§!, удерживаемые [FROM.GetName], переходят к Франции."
 FRW_dec_return_buy_pp:0 "Выкупить Французскую Африку у [FROM.GetName]"
 FRW_dec_return_buy_pp_desc:0 "Франция предлагает уступки и кредиты в обмен на свои африканские территории."
 FRW_dec_return_buy_tt:0 "ИИ всегда соглашается. [FROM.GetName] получает §Y60§! политической власти; в случае отказа нам возвращаются наши §Y100§! политической власти.\nВ случае согласия все §Yфранцузские§! области в §YАфрике§!, удерживаемые [FROM.GetName], переходят к Франции."
 FRW_dec_return_buy_gold:0 "Заплатить за Французскую Африку золотом"
 FRW_dec_return_buy_gold_desc:0 "Триста тонн золота Банка Франции за возвращение Французской Африки.\n\nОсталось золота: §Y[?FRW_gold|0] т§!"
 FRW_dec_return_gold_tt:0 "Золотой запас: §R-300 т§!. ИИ всегда соглашается. [FROM.GetName] получает §YФранцузское золото§! на год (товары народного потребления §G-5%§!); в случае отказа золото возвращается.\nВ случае согласия все §Yфранцузские§! области в §YАфрике§!, удерживаемые [FROM.GetName], переходят к Франции."
 frw_ret.hand_tt:0 "Все §Yфранцузские§! области в §YАфрике§!, которые мы удерживаем, переходят к §YФранции§!."
 frw_ret.1.t:0 "Франция просит вернуть её колонии"
 frw_ret.1.d:0 "Французское правительство напоминает нам, что африканские территории, которые сейчас удерживают наши войска, принадлежат Франции. Оно просит передать их под его управление."
 frw_ret.1.a:0 "Они наши союзники. Передать."
 frw_ret.1.b:0 "Не раньше, чем закончится война."
 frw_ret.2.t:0 "Французское предложение"
 frw_ret.2.d:0 "Париж предлагает торговые уступки и кредиты, если мы вернём французские территории в Африке, удерживаемые нашими войсками."
 frw_ret.2.a:0 "Справедливая цена. Согласны."
 frw_ret.2.b:0 "Мы не продаёмся."
 frw_ret.3.t:0 "Французское золото за Французскую Африку"
 frw_ret.3.d:0 "Французы предлагают триста тонн золота из резервов Банка Франции за возвращение своих африканских территорий."
 frw_ret.3.a:0 "Золото говорит громче слов. Согласны."
 frw_ret.3.b:0 "Оставьте своё золото себе."
 frw_ret.10.t:0 "Французская Африка возвращается"
 frw_ret.10.d:0 "Наши союзники вернули нам французские территории в Африке. Над правительственными зданиями вновь развевается триколор."
 frw_ret.10.a:0 "Merci, mes amis."
 frw_ret.11.t:0 "Нам отказали"
 frw_ret.11.d:0 "Наши союзники пока не вернут французские территории в Африке."
 frw_ret.11.a:0 "Мы попросим снова."
 FRW_french_gold_payment_desc:0 "Золото, уплаченное Францией за возвращение её африканских территорий."
