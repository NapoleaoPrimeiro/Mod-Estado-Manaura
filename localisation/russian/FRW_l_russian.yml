 # ---------- Council of Ministers: custom advisors ----------
 FRW_adv_appoint_req:0 "Назначен через §YСовет министров§!"
 FRW_dec_dismiss_tt:0 "Министр покидает правительство, освобождая место советника. Позднее его можно назначить снова."
 FRW_council_cat:0 "Совет министров"
 FRW_council_cat_desc:0 "Министры, специалисты и партийные деятели предлагают свои услуги. Выберите ведомство, чтобы увидеть доступных кандидатов. Некоторые реформы невозможно провести без нужного человека в правительстве.\n\nНазначенных здесь министров можно снова отправить в отставку в верхней части этого списка."
 FRW_dec_council_back:0 "« Назад в Совет"
 FRW_dec_council_back_desc:0 "Вернуться к списку ведомств."
 FRW_dec_council_back_tt:0 "Вернуться к списку ведомств."
 FRW_dec_council_open_tt:0 "Показывает кандидатов этого ведомства."
 FRW_dec_council_open_politics:0 "Ведомство: политика"
 FRW_dec_council_open_politics_desc:0 "Партийные деятели, идеологи и голоса улицы."
 FRW_dec_council_open_economy:0 "Ведомство: экономика"
 FRW_dec_council_open_economy_desc:0 "Плановики, инженеры и статистики, способные управлять экономикой."
 FRW_dec_council_open_research:0 "Ведомство: исследования"
 FRW_dec_council_open_research_desc:0 "Учёные, способные вернуть французской науке ведущие позиции."
 FRW_dec_council_open_projects:0 "Ведомство: особые проекты"
 FRW_dec_council_open_projects_desc:0 "Инженеры для великих проектов будущего: ракет и атома."
 FRW_dec_council_open_army:0 "Ведомство: армия"
 FRW_dec_council_open_army_desc:0 "Начальники штабов и реформаторы, готовящие армию к следующей войне."
 FRW_dec_council_open_navy:0 "Ведомство: флот"
 FRW_dec_council_open_navy_desc:0 "Адмиралы, строящие и обучающие флот."
 FRW_dec_council_open_air:0 "Ведомство: военно-воздушные силы"
 FRW_dec_council_open_air_desc:0 "Генералы авиации, определяющие облик французских ВВС."
 FRW_dec_council_open_resistance:0 "Ведомство: разведка"
 FRW_dec_council_open_resistance_desc:0 "Второе бюро и люди, которые организуют сопротивление, если Франция когда-либо окажется под оккупацией."
 FRW_adv_monnet:0 "Жан Монне"
 FRW_adv_monnet_desc:0 "Всю свою жизнь Жан Монне убеждал правительства объединять то, с чем они не в силах справиться поодиночке, от союзного судоходства в 1917 году до займов Польше и Китаю. Он верит, что однажды народам Европы придётся разделить свой уголь и сталь, а вместе с ними и часть своего суверенитета."
 FRW_trait_monnet:0 "Архитектор Европы"
 FRW_trait_monnet_desc:0 "Торговец коньяком, ставший международным финансистом и в тридцать один год – заместителем генерального секретаря Лиги Наций."
 FRW_dec_appoint_monnet:0 "Назначить Жана Монне"
 FRW_dec_appoint_monnet_desc:0 "Всю свою жизнь Жан Монне убеждал правительства объединять то, с чем они не в силах справиться поодиночке, от союзного судоходства в 1917 году до займов Польше и Китаю. Он верит, что однажды народам Европы придётся разделить свой уголь и сталь, а вместе с ними и часть своего суверенитета."
 FRW_dec_dismiss_monnet:0 "Отправить в отставку Жана Монне"
 FRW_dec_dismiss_monnet_desc:0 "Жан Монне покидает Совет министров."
 FRW_adv_monnet_effects_tt:0 "§YЖан Монне§! входит в правительство как §YАрхитектор Европы§! (политический советник):\nМакс. эффективность производства: §G+5%§!\nТорговое отношение: §G+20%§!\nЕжемесячный прирост отношения: §G+10%§!\nПоддержка войны: §R-3%§!"
 FRW_adv_monnet_req:0 "§YЖан Монне§! является политическим советником"
 FRW_adv_dautry:0 "Рауль Дотри"
 FRW_adv_dautry_desc:0 "Рауль Дотри прославился восстановлением разрушенных железных дорог севера Франции и модернизацией Государственных железных дорог. Комиссии выводят его из терпения: он предпочитает поставить цель и предоставить своим инженерам её достичь."
 FRW_trait_dautry:0 "Министр вооружений"
 FRW_trait_dautry_desc:0 "Инженер, восстановивший северные железные дороги после 1918 года и руководивший государственной железной дорогой «Эта» как современным предприятием."
 FRW_dec_appoint_dautry:0 "Назначить Рауля Дотри"
 FRW_dec_appoint_dautry_desc:0 "Рауль Дотри прославился восстановлением разрушенных железных дорог севера Франции и модернизацией Государственных железных дорог. Комиссии выводят его из терпения: он предпочитает поставить цель и предоставить своим инженерам её достичь."
 FRW_dec_dismiss_dautry:0 "Отправить в отставку Рауля Дотри"
 FRW_dec_dismiss_dautry_desc:0 "Рауль Дотри покидает Совет министров."
 FRW_adv_dautry_effects_tt:0 "§YРауль Дотри§! входит в правительство как §YМинистр вооружений§! (политический советник):\nСкорость строительства военных заводов: §G+10%§!\nЭффективность при смене производства: §G+10%§!\nСкорость строительства: §G+3%§!\nСтабильность: §R-2%§!"
 FRW_adv_dautry_req:0 "§YРауль Дотри§! является политическим советником"
 FRW_adv_cot:0 "Пьер Кот"
 FRW_adv_cot_desc:0 "Пьер Кот впервые стал министром авиации в 1933 году, в тридцать семь лет, и помог сделать Армэ де л'Эр самостоятельным родом войск. Он хочет национализировать авиационные заводы и подготовить в народных аэроклубах целое поколение молодых лётчиков."
 FRW_trait_cot:0 "Поборник авиации"
 FRW_trait_cot_desc:0 "Молодой радикал, сделавший Armée de l'Air самостоятельным родом войск и национализировавший авиационную промышленность."
 FRW_dec_appoint_cot:0 "Назначить Пьера Кота"
 FRW_dec_appoint_cot_desc:0 "Пьер Кот впервые стал министром авиации в 1933 году, в тридцать семь лет, и помог сделать Армэ де л'Эр самостоятельным родом войск. Он хочет национализировать авиационные заводы и подготовить в народных аэроклубах целое поколение молодых лётчиков."
 FRW_dec_dismiss_cot:0 "Отправить в отставку Пьера Кота"
 FRW_dec_dismiss_cot_desc:0 "Пьер Кот покидает Совет министров."
 FRW_adv_cot_effects_tt:0 "§YПьер Кот§! входит в правительство как §YПоборник авиации§! (политический советник):\nСтоимость авиационных доктрин: §G-10%§!\nПолучение авиационного опыта: §G+10%§!\nШанс появления асов: §G+10%§!"
 FRW_adv_cot_req:0 "§YПьер Кот§! является политическим советником"
 FRW_adv_mandel:0 "Жорж Мандель"
 FRW_adv_mandel_desc:0 "Жорж Мандель постигал политику рядом с Клемансо и перенял беспощадность своего учителя. Как министр колоний он намерен набрать за морем армию в полмиллиона человек. Франция, любит повторять он, это нация в 110 миллионов."
 FRW_trait_mandel:0 "Колониальный ястреб"
 FRW_trait_mandel_desc:0 "Бывшая правая рука Клемансо, ныне министр колоний и самый громкий противник политики умиротворения."
 FRW_dec_appoint_mandel:0 "Назначить Жоржа Манделя"
 FRW_dec_appoint_mandel_desc:0 "Жорж Мандель постигал политику рядом с Клемансо и перенял беспощадность своего учителя. Как министр колоний он намерен набрать за морем армию в полмиллиона человек. Франция, любит повторять он, это нация в 110 миллионов."
 FRW_dec_dismiss_mandel:0 "Отправить в отставку Жоржа Манделя"
 FRW_dec_dismiss_mandel_desc:0 "Жорж Мандель покидает Совет министров."
 FRW_adv_mandel_effects_tt:0 "§YЖорж Мандель§! входит в правительство как §YКолониальный ястреб§! (политический советник):\nПоддержка войны: §G+5%§!\nПризывное население с ненациональных территорий: §G+5%§!\nВремя обоснования повода для войны: §G-10%§!\nПрирост политической власти: §R-5%§!"
 FRW_adv_mandel_req:0 "§YЖорж Мандель§! является политическим советником"
 FRW_adv_marty:0 "Андре Марти"
 FRW_adv_marty_desc:0 "Андре Марти возглавил мятеж французского флота на Чёрном море в 1919 году и так и не перестал быть революционером. Москва ему доверяет, его добровольцы его боятся. Под его командованием Интернациональные бригады будут организованы и подчинены суровой дисциплине."
 FRW_trait_marty:0 "Комиссар бригад"
 FRW_trait_marty_desc:0 "Мятежник Черноморской эскадры 1919 года, ныне секретарь Коминтерна."
 FRW_dec_appoint_marty:0 "Назначить Андре Марти"
 FRW_dec_appoint_marty_desc:0 "Андре Марти возглавил мятеж французского флота на Чёрном море в 1919 году и так и не перестал быть революционером. Москва ему доверяет, его добровольцы его боятся. Под его командованием Интернациональные бригады будут организованы и подчинены суровой дисциплине."
 FRW_dec_dismiss_marty:0 "Отправить в отставку Андре Марти"
 FRW_dec_dismiss_marty_desc:0 "Андре Марти покидает Совет министров."
 FRW_adv_marty_effects_tt:0 "§YАндре Марти§! входит в правительство как §YКомиссар бригад§! (политический советник):\nДобровольческие дивизии: §G+2§!\nПолучение армейского опыта: §G+5%§!\nЗащита от смены идеологии: §G+20%§!\nСтабильность: §R-3%§!"
 FRW_adv_marty_req:0 "§YАндре Марти§! — политический советник"
 FRW_adv_ybarnegaray:0 "Жан Ибарнегарай"
 FRW_adv_ybarnegaray_desc:0 "Жан Ибарнегарай заседает в палате депутатов с 1914 года и представляет там «Огненные кресты». Ветеран войны и спортсмен, он придаёт движению респектабельный облик, необходимый, чтобы завоевать провинцию."
 FRW_trait_ybarnegaray:0 "Голос «Огненных крестов»"
 FRW_trait_ybarnegaray_desc:0 "Баскский депутат, чемпион по пелоте и парламентский голос полковника де Ла Рока."
 FRW_dec_appoint_ybarnegaray:0 "Назначить Жана Ибарнегарая"
 FRW_dec_appoint_ybarnegaray_desc:0 "Жан Ибарнегарай заседает в палате депутатов с 1914 года и представляет там «Огненные кресты». Ветеран войны и спортсмен, он придаёт движению респектабельный облик, необходимый, чтобы завоевать провинцию."
 FRW_dec_dismiss_ybarnegaray:0 "Отправить в отставку Жана Ибарнегарая"
 FRW_dec_dismiss_ybarnegaray_desc:0 "Жан Ибарнегарай покидает Совет министров."
 FRW_adv_ybarnegaray_effects_tt:0 "§YЖан Ибарнегарай§! входит в правительство как §YГолос «Огненных крестов»§! (политический советник):\nСтабильность: §G+5%§!\nПризывное население: §G+5%§!\nСтабильность от популярности партии: §G+5%§!"
 FRW_adv_ybarnegaray_req:0 "§YЖан Ибарнегарай§! — политический советник"
 FRW_adv_marion:0 "Поль Марион"
 FRW_adv_marion_desc:0 "Поль Марион изучил методы Коминтерна изнутри, прежде чем выступить против него. Он знает, как партия завоёвывает улицу и прессу, и намерен поставить это знание на службу Жаку Дорио."
 FRW_trait_marion:0 "Глава пропаганды"
 FRW_trait_marion_desc:0 "Бывший коммунист, разочарованным покинувший Москву, а ныне пишущий речи для ФНП."
 FRW_dec_appoint_marion:0 "Назначить Поля Мариона"
 FRW_dec_appoint_marion_desc:0 "Поль Марион изучил методы Коминтерна изнутри, прежде чем выступить против него. Он знает, как партия завоёвывает улицу и прессу, и намерен поставить это знание на службу Жаку Дорио."
 FRW_dec_dismiss_marion:0 "Отправить в отставку Поля Мариона"
 FRW_dec_dismiss_marion_desc:0 "Поль Марион покидает Совет министров."
 FRW_adv_marion_effects_tt:0 "§YПоль Марион§! входит в правительство как §YГлава пропаганды§! (политический советник):\nПоддержка войны: §G+5%§!\nЗащита от смены идеологии: §G+25%§!\nПрирост политической власти: §G+5%§!\nСтабильность: §R-3%§!"
 FRW_adv_marion_req:0 "§YПоль Марион§! — политический советник"
 FRW_adv_bichelonne:0 "Жан Бишлонн"
 FRW_adv_bichelonne_desc:0 "Говорят, Жан Бишлонн знает наизусть выпуск продукции каждого завода Франции. Он убеждён, что нация — это машина, которой должны управлять инженеры, и новый режим передал ему рычаги управления."
 FRW_trait_bichelonne:0 "Технократ"
 FRW_trait_bichelonne_desc:0 "Лучший выпускник своего года в Политехнической школе с самыми высокими оценками за всю её историю."
 FRW_dec_appoint_bichelonne:0 "Назначить Жана Бишлонна"
 FRW_dec_appoint_bichelonne_desc:0 "Говорят, Жан Бишлонн знает наизусть выпуск продукции каждого завода Франции. Он убеждён, что нация — это машина, которой должны управлять инженеры, и новый режим передал ему рычаги управления."
 FRW_dec_dismiss_bichelonne:0 "Отправить в отставку Жана Бишлонна"
 FRW_dec_dismiss_bichelonne_desc:0 "Жан Бишлонн покидает Совет министров."
 FRW_adv_bichelonne_effects_tt:0 "§YЖан Бишлонн§! входит в правительство как §YТехнократ§! (политический советник):\nРост эффективности производства: §G+10%§!\nПроизводительность заводов: §G+4%§!\nСтоимость переоборудования гражданских заводов в военные: §G-15%§!\nСтабильность: §R-3%§!"
 FRW_adv_bichelonne_req:0 "§YЖан Бишлонн§! — политический советник"
 FRW_adv_sauvy:0 "Альфред Сови"
 FRW_adv_sauvy_desc:0 "У Альфреда Сови есть цифры, которые не хочет слышать ни один министр: во Франции умирает больше людей, чем рождается, и сорок один миллион французов противостоит почти семидесяти миллионам немцев. Он призывает ввести семейные пособия и провести надлежащий учёт людских ресурсов страны."
 FRW_trait_sauvy:0 "Демограф"
