 frw_sys.73.a:0 "Мы ещё вернёмся."
 frw_sys.24.t:0 "Мадагаскар и Индийский океан переходят на сторону Свободной Франции"
 frw_sys.24.d:0 "Губернатор в Тананариве передал нам остров. Индийский океан закрыт для Оси."
 frw_sys.24.a:0 "Да здравствует Свободная Франция!"
 frw_sys.34.t:0 "Мадагаскар и Индийский океан остаются верны Виши"
