 FRW_adv_grobert_effects_tt:0 "§YЖорж Робер§! входит в правительство как §YАдмирал Атлантики§! (начальник штаба флота):\nОрганизация флота: §G+5%§!\nШанс попадания флота: §G+4%§!"
 FRW_adv_grobert_req:0 "§YЖорж Робер§! возглавляет флот"
 FRW_adv_platon:0 "Шарль Платон"
 FRW_adv_platon_desc:0 "Шарль Платон командовал эсминцами и миноносцами и уверен, что исход сражений в узких морях вокруг Франции решат небольшие быстроходные корабли."
 FRW_trait_platon:0 "Специалист по торпедам"
 FRW_trait_platon_desc:0 "Контр-адмирал, специалист по лёгким силам и торпедной войне."
 FRW_dec_appoint_platon:0 "Назначить Шарля Платона"
 FRW_dec_appoint_platon_desc:0 "Шарль Платон командовал эсминцами и миноносцами и уверен, что исход сражений в узких морях вокруг Франции решат небольшие быстроходные корабли."
 FRW_dec_dismiss_platon:0 "Отправить в отставку Шарля Платона"
 FRW_dec_dismiss_platon_desc:0 "Шарль Платон покидает Совет министров."
 FRW_adv_platon_effects_tt:0 "§YШарль Платон§! входит в правительство как §YСпециалист по торпедам§! (начальник штаба флота):\nШанс попадания торпед: §G+8%§!\nСкорость флота: §G+3%§!"
 FRW_adv_platon_req:0 "§YШарль Платон§! возглавляет флот"
 FRW_adv_armengaud:0 "Поль-Франсуа Арменго"
 FRW_adv_armengaud_desc:0 "Поль-Франсуа Арменго доказывает в своих книгах, что авиация должна сначала завоевать небо, и лишь потом она сможет помочь армии. Ему нужна прежде всего доктрина, а затем и самолёты под неё."
 FRW_trait_armengaud:0 "Теоретик авиации"
 FRW_trait_armengaud_desc:0 "Генерал ВВС, пишущий о роли авиации в современной войне."
 FRW_dec_appoint_armengaud:0 "Назначить Поля-Франсуа Арменго"
 FRW_dec_appoint_armengaud_desc:0 "Поль-Франсуа Арменго доказывает в своих книгах, что авиация должна сначала завоевать небо, и лишь потом она сможет помочь армии. Ему нужна прежде всего доктрина, а затем и самолёты под неё."
 FRW_dec_dismiss_armengaud:0 "Отправить в отставку Поля-Франсуа Арменго"
 FRW_dec_dismiss_armengaud_desc:0 "Поль-Франсуа Арменго покидает Совет министров."
 FRW_adv_armengaud_effects_tt:0 "§YПоль-Франсуа Арменго§! входит в правительство как §YТеоретик авиации§! (начальник штаба ВВС):\nСтоимость авиационных доктрин: §G-10%§!\nЭффективность завоевания превосходства в воздухе: §G+5%§!"
 FRW_adv_armengaud_req:0 "§YПоль-Франсуа Арменго§! возглавляет ВВС"
 FRW_adv_mendigal:0 "Жан Мандигаль"
 FRW_adv_mendigal_desc:0 "Жан Мандигаль летал на истребителях над Западным фронтом и готовит истребительные группы Армэ де л'Эр. Он хочет, чтобы его пилоты поднимались в воздух каждый день, чего бы это ни стоило в топливе."
 FRW_trait_mendigal:0 "Командир истребителей"
 FRW_trait_mendigal_desc:0 "Лётчик-истребитель Великой войны, ныне возглавляющий истребительные группы."
 FRW_dec_appoint_mendigal:0 "Назначить Жана Мандигаля"
 FRW_dec_appoint_mendigal_desc:0 "Жан Мандигаль летал на истребителях над Западным фронтом и готовит истребительные группы Армэ де л'Эр. Он хочет, чтобы его пилоты поднимались в воздух каждый день, чего бы это ни стоило в топливе."
 FRW_dec_dismiss_mendigal:0 "Отправить в отставку Жана Мандигаля"
 FRW_dec_dismiss_mendigal_desc:0 "Жан Мандигаль покидает Совет министров."
 FRW_adv_mendigal_effects_tt:0 "§YЖан Мандигаль§! входит в правительство как §YКомандир истребителей§! (начальник штаба ВВС):\nМанёвренность авиации: §G+5%§!\nПолучение авиационного опыта: §G+8%§!"
 FRW_adv_mendigal_req:0 "§YЖан Мандигаль§! возглавляет ВВС"
 FRW_adv_bouscat:0 "Рене Буска"
 FRW_adv_bouscat_desc:0 "Рене Буска знает, что самолёт на земле бесполезен. Лучшие аэродромы, запчасти и механики позволят держать в воздухе большую часть авиации."
 FRW_trait_bouscat:0 "Организатор авиации"
 FRW_trait_bouscat_desc:0 "Штабной офицер ВВС, организатор баз и технического обслуживания."
 FRW_dec_appoint_bouscat:0 "Назначить Рене Буска"
 FRW_dec_appoint_bouscat_desc:0 "Рене Буска знает, что самолёт на земле бесполезен. Лучшие аэродромы, запчасти и механики позволят держать в воздухе большую часть авиации."
 FRW_dec_dismiss_bouscat:0 "Отправить в отставку Рене Буска"
