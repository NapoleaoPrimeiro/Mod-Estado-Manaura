 # ---------- France Rework: frontier, war, industry ----------
 FRW_dec_fort_meuse:0 "Закрыть брешь на Маасе"
 FRW_dec_fort_meuse_desc:0 "Штаб считает Арденны непроходимыми. Инженеры 2-й армии в этом не столь уверены и требуют построить казематы на Маасе между Седаном и Монмеди."
 FRW_dec_fort_nord:0 "Укрепить северную границу"
 FRW_dec_fort_nord_desc:0 "От Дюнкерка до Мобёжа граница с Бельгией открыта. Вдоль каналов должна протянуться линия блокгаузов и противотанковых рвов."
 FRW_dec_fort_alps:0 "Альпийский укреплённый сектор"
 FRW_dec_fort_alps_desc:0 "Форты высоко над перевалами Морьена и Тине способны остановить любую армию, которая попытается перейти Альпы."
 FRW_dec_fort_pyrenees:0 "Дозор на Пиренеях"
 FRW_dec_fort_pyrenees_desc:0 "Война в Испании может перекинуться через горы. Несколько опорных пунктов охраняют перевалы и прибрежную дорогу у Ле-Пертюса."
 FRW_dec_fort_mareth:0 "Линия Марет"
 FRW_dec_fort_mareth_desc:0 "Между морем и холмами Матмата, к югу от Габеса, линия блокгаузов перекрывает дорогу из итальянской Ливии в Тунис."
 FRW_dec_fort_coast:0 "Береговые батареи Бреста и Тулона"
 FRW_dec_fort_coast_desc:0 "Новые тяжёлые батареи и зенитные орудия защищают две крупнейшие военно-морские базы Республики."
 FRW_dec_fort_paris_aa:0 "ПВО Парижа"
 FRW_dec_fort_paris_aa_desc:0 "Прожекторы, посты звукоулавливания и зенитные батареи окружают столицу кольцом, а новая радарная станция следит за северным небом."
 FRW_dec_fort_corsica:0 "Укрепить Корсику"
 FRW_dec_fort_corsica_desc:0 "Аяччо и Бастия находятся в пределах досягаемости итальянского флота. Береговые орудия и небольшой гарнизон обеспечат безопасность острова."
 FRW_frontier_cat:0 "Оборона границ"
 FRW_frontier_cat_desc:0 "Линия Мажино прикрывает лишь часть Франции. Эти сооружения закрывают оставшиеся бреши на севере, в Альпах, на Пиренеях и за морем. На каждый проект уходит несколько недель."
 FRW_dec_war_taxis:0 "Реквизировать парижские такси"
 FRW_dec_war_taxis_desc:0 "В 1914 году парижские такси доставили на Марну целую дивизию. Теперь на службу мобилизуются все грузовики, автобусы и легковые машины столичного региона."
 FRW_dec_war_reserves:0 "Призвать резервистов"
 FRW_dec_war_reserves_desc:0 "Старшие призывные возрасты, уволенные в запас много лет назад, снова призываются под знамёна."
 FRW_dec_war_arsenals:0 "Открыть арсеналы 1918 года"
 FRW_dec_war_arsenals_desc:0 "На складах всё ещё хранятся винтовки и орудия прошлой войны. Старые, но лучше, чем ничего."
 FRW_dec_war_gold:0 "Вывезти золото в Дакар"
 FRW_dec_war_gold_desc:0 "Крейсеры флота могут вывезти резервы Банка Франции туда, где их не достанет враг. Что бы ни случилось в Париже, государство не обанкротится."
 FRW_dec_war_loire:0 "Отступить за Луару"
 FRW_dec_war_loire_desc:0 "Если фронт не удержать, армию нельзя дать уничтожить. Она в порядке отходит к следующей реке и вновь закрепляется."
 FRW_patrie_cat:0 "Отечество в опасности"
 FRW_gold_safe_tt:0 "Золотой запас в безопасности: если Франция капитулирует, §YСвободная Франция§! всё равно сможет им распоряжаться."
 FRW_patrie_cat_desc:0 "Враг стоит на французской земле. Каждую из этих чрезвычайных мер можно принять лишь однажды, поэтому выбирайте момент с умом."
 FRW_invaded_tt:0 "Противник удерживает часть §Yметропольной Франции§!"
 FRW_gold_abroad_desc:0 "Резервы Банка Франции надёжно укрыты в Западной Африке. Правительство может по-прежнему платить своим солдатам и поставщикам."
 FRW_line_of_the_loire_desc:0 "Армия оторвалась от противника и закрепилась вдоль реки. Наступать она не будет, но и выбить её отсюда будет непросто."
