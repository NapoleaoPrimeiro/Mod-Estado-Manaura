 FRW_econ_reforms_cat:0 "Экономические реформы"
 FRW_econ_reforms_cat_desc:0 "Избранную Францией экономическую модель можно углублять шаг за шагом. Каждая реформа состоит из трёх этапов; новый этап можно начать лишь через пять месяцев после предыдущего в той же области."
