 FRW_leader_blum_desc:0 "Леон Блюм, лидер СФИО, — первый социалист и первый еврей во главе французского правительства. Его Народный фронт пришёл к власти в 1936 году под лозунгом «Хлеб, мир, свобода»."
 FRW_leader_reynaud:0 "Поль Рейно"
 FRW_leader_reynaud_desc:0 "Энергичный финансист из Демократического альянса, Рейно давно предупреждает об угрозе со стороны Германии и покровительствует молодому полковнику де Голлю."
 FRW_leader_degaulle:0 "Шарль де Голль"
 FRW_leader_degaulle_desc:0 "Давний сторонник танковой войны и сильной исполнительной власти, высокий офицер теперь возглавляет преобразованную Республику."
 FRW_leader_thorez:0 "Морис Торез"
 FRW_leader_thorez_desc:0 "Сын шахтёра из Па-де-Кале, Торез занимает пост генерального секретаря ФКП и неукоснительно следует линии Коминтерна."
 FRW_leader_pivert:0 "Марсо Пивер"
 FRW_leader_pivert_desc:0 "Пивер, лидер «Революционной левой», выдвинул лозунг «Всё возможно!». Он стремится к революции, которую вершат рабочие советы, независимые от Москвы."
 FRW_leader_larocque:0 "Франсуа де Ла Рок"
 FRW_leader_larocque_desc:0 "Полковник де Ла Рок возглавлял «Огненные кресты», а теперь руководит Французской социальной партией. Он призывает к созданию католического и национального государства с сильной социальной политикой."
 FRW_leader_doriot:0 "Жак Дорио"
 FRW_leader_doriot_desc:0 "Бывший коммунист и по-прежнему мэр Сен-Дени, Дорио в 1936 году основал Французскую народную партию — самое радикальное массовое движение французских правых."
 FRW_leader_petain:0 "Филипп Петен"
 FRW_leader_petain_desc:0 "Победитель при Вердене — самый уважаемый военный Франции, и многие видят в нём спасителя страны."
 FRW_leader_comtedeparis:0 "Генрих VI (граф Парижский)"
 FRW_leader_comtedeparis_desc:0 "Анри Орлеанский, граф Парижский, — глава Орлеанского дома и орлеанистский претендент на престол. Он правит под именем Генриха VI."
 FRW_leader_napoleon:0 "Наполеон VI"
 FRW_leader_napoleon_desc:0 "Луи, принц Наполеон, глава дома Бонапартов, молод и честолюбив и носит самое знаменитое имя во французской истории."
