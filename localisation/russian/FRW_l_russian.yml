l_russian:
 # ---------- Fokusse (generiert) ----------
 FRW_crisis_of_the_republic:0 "Кризис Третьей республики"
 FRW_crisis_of_the_republic_desc:0 "Беспорядки 6 февраля 1934 года оставили пятнадцать убитых на площади Согласия и свалили кабинет Даладье. Прошло два года, но партии по-прежнему расходятся во мнениях о том, куда должна идти страна."
 FRW_defend_the_republic:0 "Защитить Республику"
 FRW_defend_the_republic_desc:0 "Третья республика выдержала четыре года войны с 1914 по 1918 год. Её защитники утверждают, что она переживёт и лиги, и кризис."
 FRW_social_truce:0 "Социальное перемирие"
 FRW_social_truce_desc:0 "В июне 1936 года два миллиона рабочих занимают свои заводы. Профсоюзных лидеров и представителей федерации работодателей вызывают в Матиньонский дворец, и никто не уйдёт, пока не будет достигнуто соглашение."
 FRW_social_truce_tt:0 "Защищает Францию от §Rкоммунистического восстания§!, которое в противном случае вызвала бы низкая стабильность.\nПрекращает §YЗабастовочную волну§!.\nСтановится доступно в §Yиюне 1936 года§!."
 FRW_end_disjointed_government:0 "Покончить с министерской чехардой"
 FRW_end_disjointed_government_desc:0 "С 1930 года во Франции сменилось больше дюжины кабинетов, и лишь немногие продержались дольше года. Министры едва успевают вникнуть в дела, как уже уходят в отставку."
 FRW_end_disjointed_government_tt:0 "§YРазобщённое правительство§! становится §YХрупким правительством§!. Два решения (с 1937 и с 1938 года, с интервалом не менее 6 месяцев) полностью устраняют его – либо §YНовая конституция§! сразу кладёт ему конец."
 FRW_front_populaire:0 "Народный фронт"
 FRW_front_populaire_desc:0 "После выборов в мае 1936 года Леон Блюм формирует правительство социалистов и радикалов при поддержке коммунистов в палате, обязавшееся провести социальные реформы."
 FRW_front_populaire_tt:0 "Требуется поддержка §YЛеона Блюма§! (решение §YЗаручиться поддержкой Леона Блюма§!, 45 дней)."
 FRW_union_nationale:0 "Национальный союз"
 FRW_union_nationale_desc:0 "Поль Рейно объединяет правый центр вокруг программы сбалансированного бюджета и перевооружения."
 FRW_union_nationale_tt:0 "Требуется поддержка §YПоля Рейно§! (решение §YЗаручиться поддержкой Поля Рейно§!, 45 дней)."
 FRW_matignon_reforms:0 "Матиньонские соглашения"
 FRW_matignon_reforms_desc:0 "Матиньонские соглашения июня 1936 года повышают заработную плату и вводят коллективные договоры. Занятые заводы пустеют, и работа возобновляется."
 FRW_nationalize_arms_industry:0 "Национализировать оборонную промышленность"
 FRW_nationalize_arms_industry_desc:0 "По закону от августа 1936 года государство берёт под контроль крупнейшие оружейные заводы, и военное производство переходит в общественные руки."
 FRW_conges_payes:0 "Оплачиваемые отпуска"
 FRW_conges_payes_desc:0 "Теперь каждый рабочий имеет право на две недели оплачиваемого отпуска в год. Тем летом поезда к побережью переполнены семьями, которые никогда прежде не видели моря."
 FRW_republican_volunteers:0 "Добровольцы Республики"
 FRW_republican_volunteers_desc:0 "Французские добровольцы переходят Пиренеи, чтобы сражаться за Испанскую Республику, и возвращаются с суровым опытом современной войны."
 FRW_plan_de_relance:0 "План восстановления"
 FRW_plan_de_relance_desc:0 "Правительство запускает масштабную программу общественных работ и инвестиций, чтобы вывести Францию из Великой депрессии."
 FRW_reynaud_rearmament:0 "Перевооружение Рейно"
 FRW_reynaud_rearmament_desc:0 "Годами Рейно предупреждал палату о перевооружении Германии. Получив власть, он может претворить в жизнь то, о чём говорил в оппозиции."
 FRW_decree_laws:0 "Правление декретами"
 FRW_decree_laws_desc:0 "Получив право издавать декреты, правительство может принимать меры, не дожидаясь расколотого парламента."
 FRW_armee_de_metier:0 "К профессиональной армии"
 FRW_armee_de_metier_desc:0 "В книге «К профессиональной армии» (1934) подполковник де Голль призвал создать профессиональную армию, построенную вокруг бронетанковых дивизий. На следующий год Рейно поддержал эту идею в палате. Франция создаёт меньшую по численности армию из кадровых военных, служащих долгий срок."
 FRW_gaullist_presidency:0 "Президентская республика"
 FRW_gaullist_presidency_desc:0 "Шарль де Голль становится главой государства с полномочиями, намного превосходящими полномочия любого президента по конституции 1875 года."
 FRW_republican_mobilization:0 "Республика под ружьём"
 FRW_republican_mobilization_desc:0 "По всей стране призываются резервисты, а заводы переходят на нужды национальной обороны."
 FRW_entente_cordiale:0 "Возродить Сердечное согласие"
 FRW_entente_cordiale_desc:0 "Антанта 1904 года выдержала четыре года на Западном фронте. Париж предлагает превратить её в постоянный союз с Лондоном."
 FRW_entente_cordiale_tt:0 "Франция и §YВеликобритания§! вступают в одну фракцию (если Великобритания демократическая):\n- Если Великобритания возглавляет фракцию, Франция вступает в неё.\n- Иначе Франция основывает §YАнтанту§!, и Великобритания вступает в неё.\nВеликобритания под управлением игрока принимает решение через событие."
 FRW_union_francaise:0 "Французский союз"
 FRW_union_francaise_desc:0 "Париж предлагает превратить колониальную империю в союз ассоциированных народов, во главе которого по-прежнему стоит Франция."
 FRW_union_francaise_tt:0 "Образует §YФранцузский союз§!: новое название и флаг, национальный дух и §Gнациональные территории в Алжире и заморских департаментах§! (Антильские острова, Гвиана, Реюньон), принадлежащих Франции (в том числе позднее), и §Yпретензии§! на остальные из них.\nЗаменяет любое государство, ранее образованное Францией (его дух формирования удаляется). Если Франция уже является §YВечным королевством Франкия§!, она им и остаётся."
 FRW_little_entente_guarantees:0 "Привлечь Малую Антанту"
 FRW_little_entente_guarantees_desc:0 "Чехословакия, Югославия и Румыния уже полагаются на французские гарантии. Теперь Кэ д'Орсе приглашает их в официальный союз."
 FRW_franco_british_union:0 "Франко-британский союз"
 FRW_franco_british_union_desc:0 "Жан Монне и Уинстон Черчилль оба говорили об объединении двух наций под одним правительством. Теперь Париж выносит это предложение на рассмотрение Лондона."
 FRW_franco_british_union_tt:0 "Предлагает Лондону §YФранко-британский союз§! (Великобритания под управлением ИИ всегда соглашается, игрок решает сам):\n- Обе страны получают §YФранко-британский союз§!.\n- Франция принимает название и флаг Союза (это заменяет любое ранее образованное государство, кроме §YВечного королевства Франкия§!). Союз не даёт новых национальных территорий."
 FRW_colonial_assembly:0 "Колониальная ассамблея"
 FRW_colonial_assembly_desc:0 "Делегаты от колоний занимают места в совещательной ассамблее в Париже."
 FRW_colonial_assembly_tt:0 "Все области, не являющиеся национальной территорией: §G+10%§! подчинения."
 FRW_council_of_europe:0 "План Бриана"
 FRW_council_of_europe_desc:0 "В 1929 году в Женеве Аристид Бриан предложил создать европейский союз. Его преемники достают этот план из архивов Кэ д'Орсе."
 FRW_council_of_europe_tt:0 "Основывает §YЕвропейское сообщество§! (если Франция не состоит во фракции) и приглашает §YБельгию§!, §YНидерланды§!, §YЛюксембург§! и §YШвейцарию§!.\nСама §YЕвропейская федерация§! провозглашается позже, когда Сообщество срастётся воедино."
 FRW_rhine_guarantee:0 "Стражи Рейна"
 FRW_rhine_guarantee_desc:0 "Дважды за семьдесят лет германские армии вторгались во Францию. Рейн надлежит удерживать как рубеж безопасности страны."
 FRW_rhine_guarantee_tt:0 "Если §YГермания§! фашистская: повод для войны §Yсвержение правительства§! против Германии."
 FRW_arsenal_of_democracy:0 "Оружие для свободных наций"
 FRW_arsenal_of_democracy_desc:0 "Французские заводы производят оружие для всех демократий Европы, которые ещё сопротивляются."
 FRW_european_defence_community:0 "Общий совет обороны"
 FRW_european_defence_community_desc:0 "Франция и её партнёры объединяют исследования в области вооружений и разрабатывают общие оборонные планы."
 FRW_franco_belgian_customs:0 "Таможенный союз с Бельгией"
 FRW_franco_belgian_customs_desc:0 "Таможенный союз связывает экономики Бельгии и Люксембурга с экономикой Франции."
 FRW_franco_belgian_customs_tt:0 "Образует §YЗападный союз§!: новое название и флаг, национальный дух и §Gнациональные территории на принадлежащих Франции землях Бельгии, Нидерландов и Люксембурга§! (а также на тех, что она получит там позже) и §Yпретензии§! на остальные.\nЗаменяет любое государство, ранее образованное Францией (его дух формирования удаляется). Если Франция уже является §YВечным королевством Франкия§!, она им и остаётся.\nТребуется контроль над §YБельгией§!, §YНидерландами§! и §YЛюксембургом§! (аннексированными или в качестве марионеток, если не указано иное). Если Франция ещё не контролирует их, государство будет основано автоматически, как только это произойдёт."
 FRW_fourth_republic:0 "Новая конституция"
 FRW_fourth_republic_desc:0 "Законы 1875 года были временной мерой, продержавшейся шестьдесят лет. Новая конституция даёт Франции более сильную исполнительную власть и более долговечные кабинеты."
 FRW_aid_spanish_republic:0 "Помочь Испанской Республике"
 FRW_aid_spanish_republic_desc:0 "В 1936 году Блюм хотел помочь Мадриду, но его удержали Лондон и собственные радикалы. На этот раз самолёты летят на юг."
 FRW_aid_spanish_republic_tt:0 "Отправляет Испанской Республике §Y2000 винтовок§! и даёт Франции повод для войны §Yсвержение правительства§! против националистов."
 FRW_european_customs_union:0 "Европейский таможенный союз"
 FRW_european_customs_union_desc:0 "Уголь, сталь и зерно теперь пересекают границы Сообщества без пошлин. Плановики Монне называют это лишь началом."
 FRW_european_customs_union_tt:0 "Каждый член фракции Франции получает §YЕвропейского партнёра§! (+5% к производительности заводов, +3% к скорости исследований).\nТребуется §YЖан Монне§! в качестве политического советника (решение §YНазначить Жана Монне§! в §YСовете министров§!, ведомство §YЭкономика§!)."
 FRW_european_federation_focus:0 "Европейская федерация"
 FRW_european_federation_focus_desc:0 "Государствам-членам предлагается передать свои армии и валюты федеральному правительству с резиденцией в Париже. Большинство из них соглашается."
 FRW_european_federation_focus_tt:0 "Каждой малой демократической стране Европы во фракции Франции или под французскими гарантиями предлагается вступить в федерацию (согласие означает мирную аннексию). Предложение можно повторить решением §YВозобновить федеральное предложение§!.\nОбразует §YЕвропейскую федерацию§!: новое название и флаг, национальный дух и §Gнациональные территории на принадлежащих Франции землях Бенилюкса, Швейцарии, Италии, Германии и Рейнланда§! (а также на тех, что она получит там позже) и §Yпретензии§! на остальные.\nЗаменяет любое государство, ранее образованное Францией (его дух формирования удаляется). Если Франция уже является §YВечным королевством Франкия§!, она им и остаётся.\nТребуется контроль над §YБельгией§!, §YНидерландами§! и §YЛюксембургом§! (аннексированными, в качестве марионеток или вступившими в федерацию) — после этого фокуса §YИталия§! или §YГермания§! больше не требуются. Если Франция ещё не контролирует их, государство будет основано автоматически, как только это произойдёт."
 FRW_forty_hour_week:0 "Сорокачасовая неделя"
 FRW_forty_hour_week_desc:0 "Закон от июня 1936 года ограничивает рабочую неделю сорока часами. Рабочие приветствуют его, а работодатели жалуются на издержки."
 FRW_pierre_cot_aviation:0 "Народная авиация"
 FRW_pierre_cot_aviation_desc:0 "Министр авиации Пьер Кот национализирует авиазаводы и открывает аэроклубы для сыновей рабочих."
 FRW_jean_zay_reforms:0 "Реформы Жана Зе"
 FRW_jean_zay_reforms_desc:0 "Министр просвещения Жан Зе повышает возраст окончания обязательного обучения и основывает исследовательскую службу, которая станет НЦНИ."
 FRW_relax_forty_hours:0 "Приоритет арсеналам"
 FRW_relax_forty_hours_desc:0 "Сорокачасовая неделя остаётся в силе, но оружейные заводы освобождаются от неё и могут работать сверхурочно."
 FRW_bread_peace_liberty:0 "Хлеб, мир и свобода"
 FRW_bread_peace_liberty_desc:0 "«Хлеб, мир и свобода» – таков был предвыборный лозунг Народного фронта в 1936 году. Теперь правительство считает его своей программой."
 FRW_reynaud_recovery:0 "Декреты Рейно"
 FRW_reynaud_recovery_desc:0 "Став министром финансов, Рейно смягчает сорокачасовую неделю, возвращает доверие инвесторов и привлекает капитал обратно во Францию."
 FRW_mandel_colonies:0 "Министерство колоний Манделя"
 FRW_mandel_colonies_desc:0 "Жорж Мандель, министр колоний, обещает собрать большую колониальную армию для защиты метрополии."
 FRW_mandel_colonies_tt:0 "Требуется §YЖорж Мандель§! в качестве политического советника (решение §YНазначить Жоржа Манделя§! в §YСовете министров§!, ведомство §YПолитика§!)."
 FRW_edge_of_the_sword:0 "На острие шпаги"
 FRW_edge_of_the_sword_desc:0 "Бронетанковая дивизия, описанная де Голлем, становится образцом для всей остальной армии. «На острие шпаги», эссе де Голля о командовании 1932 года, включено в список обязательной литературы Высшей военной школы."
 FRW_certaine_idee:0 "Определённое представление о Франции"
 FRW_certaine_idee_desc:0 "Де Голль давно убеждён, что Франция остаётся собой, лишь когда стоит в первом ряду наций. Став президентом, он берётся построить Республику на этом убеждении."
 FRW_deat_neosocialism:0 "Порядок, власть, нация"
 FRW_deat_neosocialism_desc:0 "На социалистическом съезде 1933 года Адриен Марке и Марсель Деа заявили партии, что она должна завоевать средние классы лозунгом «порядок, власть, нация». Блюм добился их исключения. Неосоциалисты предлагают Республике сильное государство и плановую экономику."
 FRW_deat_neosocialism_tt:0 "Требуется поддержка §YМарселя Деа§! (решение §YЗаручиться поддержкой Марселя Деа§!, 45 дней)."
 FRW_deat_labour_plan:0 "План труда"
 FRW_deat_labour_plan_desc:0 "В Бельгии Анри де Ман указал путь: кредит, энергетика и тяжёлая промышленность под государственным руководством, всё остальное — в частных руках. Плановики неосоциалистов разрабатывают французский вариант."
 FRW_deat_national_credit:0 "Национальное кредитное управление"
 FRW_deat_national_credit_desc:0 "Банк Франции и крупные депозитные банки подчиняются Национальному кредитному управлению. «Двести семейств» теряют власть над казначейством, и теперь государство решает, куда идут деньги."
 FRW_deat_strong_state:0 "Сильное государство"
 FRW_deat_strong_state_desc:0 "Декреты-законы становятся правилом. Парламент раз в год утверждает бюджет и План, а в промежутках правит исполнительная власть. Левые критики Деа говорят, что его социализм порядка смотрит скорее на Рим, чем на Жореса."
 FRW_deat_die_for_danzig:0 "Умирать за Данциг?"
 FRW_deat_die_for_danzig_desc:0 "«Нужно ли умирать за Данциг?» спрашивает Деа в газете «Эвр». Французские крестьяне, пишет он, не пойдут на войну ради вольного города на Балтике. Статья раскалывает страну, а критики Деа называют её первым шагом на пути в Берлин."
 FRW_deat_die_for_danzig_tt:0 "Теперь неосоциалисты должны выбрать: остаться в §YРеспублике§! или основать §YЕдиную партию§!."
 FRW_deat_planist_republic:0 "Планистская республика"
 FRW_deat_planist_republic_desc:0 "Деа остаётся в рамках Республики. План закрепляется законом, Палата сохраняет право голосовать за него, а Экономический совет собирает профсоюзы, предпринимателей и инженеров за одним столом."
 FRW_deat_x_crise:0 "Инженеры «Икс-Кризиса»"
 FRW_deat_x_crise_desc:0 "Выпускники Политехнической школы из кружка «Икс-Кризис» (X-Crise), среди них Жан Кутро, Луи Валлон и молодой Альфред Сови, покидают свои кружки ради министерств. Впервые Францией управляют плановики."
 FRW_deat_republic_of_order:0 "Республика порядка"
 FRW_deat_republic_of_order_desc:0 "Впервые после войны кабинет держится дольше своего бюджета, а План выполняет свои показатели. Сторонники Деа говорят, что ни одному парламенту это не удалось бы."
 FRW_deat_single_party:0 "Единая партия"
 FRW_deat_single_party_desc:0 "Социалисты, ветераны и люди из лиг, утверждает Деа, хотят одного и того же — национальной и народной революции. Он призывает их объединиться в одну партию, Национально-народное объединение, и навсегда закрыть Палату."
 FRW_deat_single_party_tt:0 "Требуется не менее §Y15%§! популярности §Yфашизма§!."
 FRW_deat_labour_front:0 "Трудовой фронт"
 FRW_deat_labour_front_desc:0 "Профсоюзы и объединения работодателей сливаются в единый Трудовой фронт. Забастовки и локауты одинаково запрещены; заработную плату и цены устанавливает План."
 FRW_deat_national_legion:0 "Национально-народный легион"
 FRW_deat_national_legion_desc:0 "ННО создаёт собственный легион добровольцев. Он марширует с лопатами не реже, чем с винтовками, а его новобранцы приходят как с заводов, так и из старых лиг."
 FRW_deat_new_europe:0 "Новый европейский порядок"
 FRW_deat_new_europe_desc:0 "Деа мечтает о Европе одновременно социалистической и национальной, от Бреста до Бухареста, со второй столицей в Париже. Брюсселю, Гааге, Берну и Копенгагену предложено присоединиться."
 FRW_deat_new_europe_tt:0 "Основывает §YНовый европейский порядок§! (если Франция не состоит во фракции) и приглашает §YБельгию§!, §YНидерланды§!, §YЛюксембург§!, §YШвейцарию§! и §YДанию§!."
 FRW_deat_continental_economy:0 "Континентальная экономика"
 FRW_deat_continental_economy_desc:0 "Европейский клиринговый союз, общий план для угля и стали и единый рынок от Атлантики до Вислы. Деа называет это континентальным социализмом."
 FRW_deat_lvf:0 "Легион французских добровольцев"
 FRW_deat_lvf_desc:0 "Деа и его соперники из других партий сходятся хотя бы в одном: французские добровольцы должны сражаться с большевизмом за границей. Легион вербует людей в отделениях ННО и выступает туда, где идёт крестовый поход."
 FRW_deat_ministry_of_labour:0 "Министерство труда"
 FRW_deat_ministry_of_labour_desc:0 "Деа берёт Министерство труда себе. Биржи труда, ученичество и тарифные сетки подчиняются одному ведомству на улице Гренель."
 FRW_deat_revolutionary_front:0 "Революционный национальный фронт"
 FRW_deat_revolutionary_front_desc:0 "Последние соперничающие движения вливаются в единый Революционный национальный фронт под руководством Деа. Бывшие социалисты, синдикалисты и люди из лиг теперь носят один партийный билет."
 FRW_deat_european_revolution:0 "Европейская революция"
 FRW_deat_european_revolution_desc:0 "Национальная и социалистическая Европа не может остановиться у бельгийской границы, пишет Деа. Брюсселю и Гааге предложено перейти под покровительство Франции и стать первыми провинциями нового континента."
 FRW_protect_austria:0 "Защитить независимость Австрии"
 FRW_protect_austria_desc:0 "Австрия беззащитна между Берлином и Римом. Париж предлагает ей свою защиту и ожидает, что взамен Вена будет следовать французской политике."
 FRW_libyan_border:0 "Гарантировать безопасность Нидерландских стран"
 FRW_libyan_border_desc:0 "Как в Локарно в 1925 году, Франция выступает гарантом безопасности своих соседей. Париж будет считать нападение на Брюссель, Гаагу или Люксембург нападением на Францию."
 FRW_workers_popular_front:0 "Рабочий фронт"
 FRW_workers_popular_front_desc:0 "ФКП порывает со своими буржуазными партнёрами по Народному фронту и призывает рабочих взять власть в свои руки."
 FRW_truce_unity_of_action:0 "Единство действий"
 FRW_truce_unity_of_action_desc:0 "В 1934 году ФКП и СФИО подписали пакт о прекращении взаимных нападок и совместной борьбе против лиг. Теперь Партия держит рабочих в этом единстве – под своим собственным знаменем."
 FRW_truce_unity_of_action_tt:0 "Защищает Францию от §Rкоммунистического восстания§!, которое в противном случае вызвала бы низкая стабильность.\nПрекращает §YЗабастовочную волну§!.\nСтановится доступно в §Yиюне 1936 года§!."
 FRW_cgt_general_strike:0 "Всеобщая забастовка ВКТ"
 FRW_cgt_general_strike_desc:0 "Миллионы рабочих по призыву ВКТ прекращают работу, и заводы замолкают. Правительство может не продержаться и недели."
 FRW_proclaim_the_commune:0 "Провозгласить Коммуну"
 FRW_proclaim_the_commune_desc:0 "В 1871 году Париж восстал в одиночку и был раздавлен. На этот раз провинция поднимается вместе со столицей."
 FRW_proclaim_the_commune_tt:0 "§YРазобщённое правительство§! становится §YХрупким правительством§!. Два решения (с 1937 и с 1938 года, с интервалом не менее 6 месяцев) полностью устраняют его."
 FRW_thorez_party_line:0 "Торез берёт власть"
 FRW_thorez_party_line_desc:0 "При Морисе Торезе Франция тесно согласует свою политику с политикой Москвы."
 FRW_thorez_party_line_tt:0 "Требуется поддержка §YМориса Тореза§! (решение §YЗаручиться поддержкой Мориса Тореза§!, 45 дней)."
 FRW_pivert_revolution:0 "Всё возможно!"
 FRW_pivert_revolution_desc:0 "Марсо Пивер и Революционные левые призывают к демократии рабочих советов, независимой от Москвы."
 FRW_pivert_revolution_tt:0 "Требуется поддержка §YМарсо Пивера§! (решение §YЗаручиться поддержкой Марсо Пивера§!, 45 дней)."
 FRW_five_year_plan_fr:0 "Французская пятилетка"
 FRW_five_year_plan_fr_desc:0 "По образцу советского Госплана комиссары в каждом департаменте устанавливают нормы по углю, стали и зерну. Заводы «Рено» в Бийанкуре теперь получают задания от плана, а не от рынка."
 FRW_soviet_military_mission:0 "Советская военная миссия"
 FRW_soviet_military_mission_desc:0 "Офицеры Красной армии прибывают в Париж, чтобы обучить французских штабистов теории глубокой операции."
 FRW_join_comintern:0 "Вступить в Коминтерн"
 FRW_join_comintern_desc:0 "Партия считает, что революция не может победить в одной отдельно взятой стране. Париж присоединяется к Москве и рабочим движениям других стран в Коммунистическом интернационале."
 FRW_join_comintern_tt:0 "Предлагает §YСоветскому Союзу§! вступить в его фракцию. Если Советы не возглавляют фракцию, Франция основывает §YКрасный фронт§! и приглашает их."
 FRW_red_army_of_france:0 "Красная армия Франции"
 FRW_red_army_of_france_desc:0 "Армия реорганизуется по советскому образцу, а к её частям прикрепляются политические комиссары."
 FRW_workers_councils:0 "Рабочие советы"
 FRW_workers_councils_desc:0 "Выборные рабочие советы берут на себя управление заводами."
 FRW_revolutionary_militias:0 "Революционная милиция"
 FRW_revolutionary_militias_desc:0 "Коммуна 1871 года началась, когда версальское правительство попыталось забрать пушки Монмартра. На этот раз каждый завод и каждый квартал сохраняет вооружённую рабочую милицию."
 FRW_export_the_revolution:0 "Экспорт революции"
 FRW_export_the_revolution_desc:0 "Руководители партии утверждают, что революция не может ограничиться пределами Франции."
 FRW_iberian_revolution:0 "Революция на Пиренеях"
 FRW_iberian_revolution_desc:0 "Испанские коммунисты и профсоюзы просят у Парижа оружия для борьбы с генералами."
 FRW_iberian_revolution_tt:0 "Повод для войны §Yсвержение правительства§! против §YИспании§! (если Испания не коммунистическая и не союзная)."
 FRW_red_navy_of_toulon:0 "Красный флот и авиация"
 FRW_red_navy_of_toulon_desc:0 "Черноморское восстание 1919 года, которое возглавлял в том числе Андре Марти, до сих пор помнят во флоте. Теперь моряки Тулона удерживают корабли для народа. Молодые рабочие учатся летать в партийных аэроклубах."
 FRW_red_industry:0 "Красная промышленность"
 FRW_red_industry_desc:0 "Ле-Крёзо и сталелитейные заводы де Венделя переходят к государству. Плановые задания заменяют дивиденды."
 FRW_liberate_colonies:0 "Освободить колонии"
 FRW_liberate_colonies_desc:0 "Социалистическая Франция не может удерживать колонии силой. Марокко и Тунис становятся независимыми братскими республиками."
 FRW_liberate_colonies_tt:0 "§YМарокко§! и §YТунис§! освобождаются как коммунистические сателлиты (если принадлежат Франции), а §YБратские народы§! повышаются на один уровень."
 FRW_union_of_european_socialist_republics:0 "Соединённые Социалистические Штаты Европы"
 FRW_union_of_european_socialist_republics_desc:0 "Партия ставит своей целью социалистический союз Европы, свободный от границ и капиталистов."
 FRW_union_of_european_socialist_republics_tt:0 "Повод для войны §Yсвержение правительства§! против §YБельгии§!, §YНидерландов§! и §YЛюксембурга§! (если они ещё не коммунистические, не подчинены Франции и не являются союзниками).\nОбразует §YЕвропейскую федерацию§!: новое название и флаг, национальный дух и §Gнациональные территории на принадлежащих Франции землях Бенилюкса, Швейцарии, Италии, Германии и Рейнланда§! (а также на тех, что она получит там позже) и §Yпретензии§! на остальные.\nЗаменяет любое государство, ранее образованное Францией (его дух формирования удаляется). Если Франция уже является §YВечным королевством Франкия§!, она им и остаётся.\nТребуется контроль над §YБельгией§!, §YНидерландами§! и §YЛюксембургом§!, а также §YИталией§! или §YГерманией§! (аннексированными или в качестве марионеток, если не указано иное). Если Франция ещё не контролирует их, государство будет основано автоматически, как только это произойдёт."
 FRW_peoples_science:0 "Наука для народа"
 FRW_peoples_science_desc:0 "Фредерик Жолио-Кюри и другие учёные ставят свои лаборатории на службу революции."
 FRW_internationale_victory:0 "Последний решительный бой"
 FRW_internationale_victory_desc:0 "На улицах поют «Интернационал», пока Красная армия Франции выступает в поход."
 FRW_purge_deviationists:0 "Чистка уклонистов"
 FRW_purge_deviationists_desc:0 "Троцкистов, сторонников Пивера и прочих «врагов партии» исключают из ФКП и ВКТ."
 FRW_fils_du_peuple:0 "Сын народа"
 FRW_fils_du_peuple_desc:0 "Автобиография Тореза «Сын народа» издаётся миллионными тиражами. Сын шахтёра из Па-де-Кале смотрит с плакатов в каждом отделении партии."
 FRW_second_five_year_plan:0 "Вторая пятилетка"
 FRW_second_five_year_plan_desc:0 "Второй план ставит тяжёлую промышленность и электрификацию превыше всего."
 FRW_political_commissars:0 "Политические комиссары"
 FRW_political_commissars_desc:0 "К каждому полку прикрепляется комиссар, и теперь армия подчиняется партии."
 FRW_bastion_of_the_west:0 "Бастион революции"
 FRW_bastion_of_the_west_desc:0 "Париж стал столицей социализма в Западной Европе. Каждым поездом прибывают рабочие делегации из Лондона, Брюсселя и Барселоны."
 FRW_federation_of_communes:0 "Федерация коммун"
 FRW_federation_of_communes_desc:0 "Префекты упразднены, и каждая коммуна управляет собой через выборный совет. В городах по всей Франции открываются вечерние курсы. Рабочие, взявшие в свои руки заводы, теперь заполняют лекционные залы."
 FRW_aid_the_poum:0 "Помочь иберийским товарищам"
 FRW_aid_the_poum_desc:0 "Винтовки, грузовики и добровольцы переходят Пиренеи, чтобы добраться до ПОУМ и антисталинских левых в Барселоне."
 FRW_workers_army:0 "От милиции к рабочей армии"
 FRW_workers_army_desc:0 "Милиция получает офицеров, регулярную строевую подготовку и тяжёлое вооружение, сохраняя при этом выборные комитеты."
 FRW_republic_of_labour:0 "Республика труда"
 FRW_republic_of_labour_desc:0 "Сторонники Пивера описывают новое государство как свободную ассоциацию производителей, управляемую ни капиталистами, ни бюрократами."
 FRW_cgt_unions_take_power:0 "Вся власть профсоюзам"
 FRW_cgt_unions_take_power_desc:0 "В 1906 году ВКТ провозгласила в Амьене, что ячейкой будущего общества станет профсоюз, а не партия. Пьер Беснар и революционные синдикалисты теперь ловят движение на слове: пусть Партия заседает в Ратуше, но управлять Францией будут профсоюзы."
 FRW_cgt_unions_take_power_tt:0 "Требуется поддержка §YПьера Беснара§! (решение §YЗаручиться поддержкой Пьера Беснара§!, 45 дней)."
 FRW_cgt_factory_committees:0 "Заводские комитеты"
 FRW_cgt_factory_committees_desc:0 "На каждом предприятии управление берёт на себя комитет, избранный в цехах. Инженеры и мастера остаются, но теперь они отчитываются перед мужчинами и женщинами у станков."
 FRW_cgt_local_unions:0 "Правят местные профсоюзы"
 FRW_cgt_local_unions_desc:0 "Префектов отправляют по домам. В каждом городе местная профсоюзная секция и её делегаты берут на себя работу мэрии — от хлебного пайка до трамваев."
 FRW_cgt_bourses_du_travail:0 "Биржи труда"
 FRW_cgt_bourses_du_travail_desc:0 "Фернан Пеллутье хотел, чтобы биржи труда стали школами рабочего класса. Для этого в каждом городе открываются библиотеки, вечерние классы и технические курсы."
 FRW_cgt_confederal_congress:0 "Конфедеральный съезд"
 FRW_cgt_confederal_congress_desc:0 "Делегаты всех федераций собираются в зале Мютюалите. Решения поднимаются от завода к съезду, а не спускаются от центрального комитета. Захваты предприятий прекращаются, поскольку захватившие их рабочие сами управляют заводами."
 FRW_cgt_confederal_congress_tt:0 "Прекращает §YВолну забастовок§! и защищает Францию от §Rкоммунистического восстания§!, которое в противном случае вызвала бы низкая стабильность."
 FRW_cgt_red_black_columns:0 "Красно-чёрные колонны"
 FRW_cgt_red_black_columns_desc:0 "Профсоюзные милиции формируют колонны под красно-чёрным знаменем. Они выбирают своих командиров и упорно сражаются, но приказы принимают неохотно."
 FRW_cgt_iwa:0 "Международная ассоциация трудящихся"
 FRW_cgt_iwa_desc:0 "Беснар был секретарём Международной ассоциации трудящихся — синдикалистского интернационала. Теперь, когда Франция в руках профсоюзов, её конгрессы переезжают в Париж."
 FRW_cgt_aid_the_cnt:0 "Помощь НКТ"
 FRW_cgt_aid_the_cnt_desc:0 "Винтовки и грузовики идут через Пиренеи для НКТ и анархистских колонн Каталонии и Арагона."
 FRW_cgt_collectivise_land:0 "Коллективизация земли"
 FRW_cgt_collectivise_land_desc:0 "Сельскохозяйственные рабочие забирают крупные поместья Боса и Юга. Мелкие собственники могут вступить в коллективы или сохранить свои поля."
 FRW_cgt_workers_self_defence:0 "Рабочая самооборона"
 FRW_cgt_workers_self_defence_desc:0 "Съезд соглашается, что революции всё же нужна армия, но такая, что защищает коммуны и не имеет собственного генерального штаба."
 FRW_cgt_iberian_federation:0 "Иберийская федерация"
 FRW_cgt_iberian_federation_desc:0 "В Барселоне НКТ говорит о свободной федерации иберийских народов. Париж обещает помочь её создать."
 FRW_cgt_iberian_federation_tt:0 "Повод для войны §Yсвержение правительства§! против §YИспании§! (если Испания не коммунистическая и не союзная)."
 FRW_cgt_libertarian_commune:0 "Либертарная коммуна"
 FRW_cgt_libertarian_commune_desc:0 "Во Франции нет ни хозяев, ни бюрократов — только федерации свободных производителей. Способно ли такое общество вести современную войну — вопрос, который съезд предпочитает не задавать."
 FRW_workers_belgium:0 "Долой Салазара"
 FRW_workers_belgium_desc:0 "В Лиссабоне Новое государство Салазара продолжает подавлять рабочее движение. Когда Испания в руках революции, Португалия окажется в изоляции."
 FRW_smash_italian_fascism:0 "Сокрушить итальянский фашизм"
 FRW_smash_italian_fascism_desc:0 "Муссолини правит Италией с 1922 года – дольше любого другого фашистского вождя в Европе. Итальянские эмигранты во Франции говорят, что рабочие на родине готовы подняться."
 FRW_red_switzerland:0 "Интернациональные бригады"
 FRW_red_switzerland_desc:0 "Добровольцы многих народов отправляются с Аустерлицкого вокзала в Испанию – французы бок о бок с немцами, поляками и американцами. Париж стал вербовочным пунктом мировой революции."
 FRW_red_switzerland_tt:0 "Требуется §YАндре Марти§! в качестве политического советника (решение §YНазначить Андре Марти§! в §YСовете министров§!, ведомство §YПолитика§!)."
 FRW_national_renewal:0 "Национальное обновление"
 FRW_national_renewal_desc:0 "Лиги снова выходят на марш с криками «Долой воров!» в адрес Республики."
 FRW_truce_labour_charter:0 "Корпоративный порядок"
 FRW_truce_labour_charter_desc:0 "Забастовки и локауты запрещены. Рабочие и работодатели каждой отрасли заседают вместе в единой корпорации, а то, о чём они не могут договориться, решает государство."
 FRW_truce_labour_charter_tt:0 "Защищает Францию от §Rкоммунистического восстания§!, которое в противном случае вызвала бы низкая стабильность.\nПрекращает §YЗабастовочную волну§!.\nСтановится доступно в §Yиюне 1936 года§!."
 FRW_february_sixth:0 "Штурм Бурбонского дворца"
 FRW_february_sixth_desc:0 "6 февраля 1934 года лиги были остановлены у моста Согласия. На этот раз они намерены его перейти."
 FRW_national_revolution:0 "Национальная революция"
 FRW_national_revolution_desc:0 "Республика пала, и её место занимает авторитарное националистическое правительство."
 FRW_national_revolution_tt:0 "§YРазобщённое правительство§! сменяется §YХрупким правительством§!. Два решения (с 1937 и с 1938 года, с перерывом не менее 6 месяцев) полностью устраняют его."
 FRW_la_rocque_psf:0 "Труд, семья, отечество"
 FRW_la_rocque_psf_desc:0 "Полковник де Ла Рок и его Французская социальная партия стремятся к католическому национальному государству, чуждому внешних авантюр."
 FRW_la_rocque_psf_tt:0 "Требуется поддержка §YФрансуа де Ла Рока§! (решение §YЗаручиться поддержкой Франсуа де Ла Рока§!, 45 дней)."
 FRW_doriot_ppf:0 "Французская народная партия"
 FRW_doriot_ppf_desc:0 "Жак Дорио, исключённый из Коммунистической партии в 1934 году, теперь возглавляет ФНП и стремится к тоталитарному массовому государству."
 FRW_doriot_ppf_tt:0 "Требуется поддержка §YЖака Дорио§! (решение §YЗаручиться поддержкой Жака Дорио§!, 45 дней)."
 FRW_corporatist_state:0 "Корпоративное государство"
 FRW_corporatist_state_desc:0 "Работодатели и рабочие каждой отрасли объединяются в корпорации под надзором государства."
 FRW_latin_bloc:0 "Латинский блок"
 FRW_latin_bloc_desc:0 "Франция, Испания, Португалия и Италия сближаются, образуя блок латинских наций между Берлином и Москвой."
 FRW_latin_bloc_tt:0 "Создаёт фракцию §YЛатинский блок§! и приглашает в неё §YИталию§!, §YИспанию§! и §YПортугалию§!.\nСама §YЛатинская империя§! провозглашается позднее фокусом §YГлавенство в Латинской Европе§!."
 FRW_colonial_legions:0 "Колониальные легионы"
 FRW_colonial_legions_desc:0 "Новобранцы из Сенегала, Мадагаскара и Индокитая сводятся в легионы под командованием французских офицеров."
 FRW_restore_french_honour:0 "Савойское наследие"
 FRW_restore_french_honour_desc:0 "Савойя и Ницца принадлежат Франции со времён Туринского договора 1860 года. Франция требует и Женеву, на которую долго притязали герцоги Савойские. Пьемонт остаётся Риму, партнёру Франции по Латинскому блоку."
 FRW_totalitarian_party:0 "Единая партия"
 FRW_totalitarian_party_desc:0 "Палаты, лиги и старые партии распускаются декретом. ФНП становится единственной легальной партией во Франции."
 FRW_totalitarian_party_tt:0 "Требуется §YПоль Марион§! в качестве политического советника (решение §YНазначить Поля Мариона§! в §YСовете министров§!, ведомство §YПолитика§!)."
 FRW_approach_germany:0 "Сближение с Берлином"
 FRW_approach_germany_desc:0 "Дорио убеждён, что Европу поведут за собой фашистские державы, и хочет видеть Францию на их стороне."
 FRW_greater_france_claims:0 "Великая Франция"
 FRW_greater_france_claims_desc:0 "В Романдии и Вале говорят по-французски, а Муссолини зарится на Ниццу, Савойю и Корсику. Париж отвечает собственной картой: Романдия, Пьемонт и Валле-д'Аоста, а также Сардиния по ту сторону пролива от Корсики."
 FRW_march_on_brussels:0 "Ультиматум Женеве"
 FRW_march_on_brussels_desc:0 "В Женеве находятся Лига Наций, политические эмигранты и враждебное режиму иностранное золото. Дорио уже отправил свой ультиматум и второго посылать не намерен."
 FRW_march_on_brussels_tt:0 "Повод для войны §Yаннексия§! против §YШвейцарии§! (если она не союзник).\nДоступно с §Yянваря 1937 года§!."
 FRW_national_rearmament:0 "Национальное перевооружение"
 FRW_national_rearmament_desc:0 "Правительство ставит цель вновь сделать французскую армию сильнейшей на континенте."
 FRW_mediterranean_ambition:0 "Хозяйка Средиземноморья"
 FRW_mediterranean_ambition_desc:0 "Тулон, Бизерта, Алжир и Бейрут дают Франции гавани на всех берегах Средиземного моря. От Рима ждут признания французского первенства на море: как от партнёра при Ла Роке или как от побеждённого соперника при Дорио."
 FRW_mediterranean_ambition_tt:0 "Если Францию возглавляет §YЖак Дорио§!: §Yпретензии§! на §YТриполитанию§! и §YФеццан§!."
 FRW_french_state_youth:0 "Национальная молодёжь"
 FRW_french_state_youth_desc:0 "Школы и молодёжные организации переходят под контроль государства и воспитывают молодёжь в духе служения нации."
 FRW_french_imperium:0 "Имперская миссия"
 FRW_french_imperium_desc:0 "От Дакара до Ханоя империя подчиняется одному лишь Парижу."
 FRW_nouvel_ordre:0 "Главенство в Латинской Европе"
 FRW_nouvel_ordre_desc:0 "Рим, Мадрид и Лиссабон ждут руководства от Парижа. Франция предлагает создать блок латинских наций под своим началом."
 FRW_nouvel_ordre_tt:0 "Повод для войны §Yмарионетка§! против §YИспании§! и §YПортугалии§! (если они не сателлиты или союзники Франции).\nОбразует §YЛатинскую империю§!: новое название и флаг, национальный дух и §Gнациональные территории на землях Италии, Испании и Португалии§!, которыми владеет Франция (а также на всех, что она получит там позднее), и §Yпретензии§! на остальные.\nЗаменяет любое государство, образованное Францией ранее (его национальный дух удаляется). Если Франция уже является §YВечным королевством Франкия§!, она им и остаётся.\nТребуется контроль над §YИталией§!, §YИспанией§! и §YПортугалией§! (аннексированными или марионетками, если не указано иное). Если Франция их ещё не контролирует, государство будет образовано автоматически, как только это произойдёт."
 FRW_african_empire_fascist:0 "Тунисский вопрос"
 FRW_african_empire_fascist_desc:0 "В ноябре 1938 года итальянские депутаты кричали в палате в Риме: «Tunisi, Corsica, Nizza!» Ответ Парижа конкретен: линия Марет на юге Туниса будет удержана."
 FRW_corporative_chambers:0 "Корпоративные палаты"
 FRW_corporative_chambers_desc:0 "Палаты работодателей и рабочих берут на себя роль Сената в экономическом законодательстве."
 FRW_volontaires_nationaux:0 "Национальные добровольцы"
 FRW_volontaires_nationaux_desc:0 "Национальные добровольцы, молодёжное крыло ФСП, проходят подготовку как дисциплинированный национальный резерв."
 FRW_volontaires_nationaux_tt:0 "Требуется §YЖан Ибарнегарай§! в качестве политического советника (решение §YНазначить Жана Ибарнегарая§! в §YСовете министров§!, ведомство §YПолитика§!)."
 FRW_social_catholicism:0 "Социальный католицизм"
 FRW_social_catholicism_desc:0 "Благотворительность, семейные пособия и католические профсоюзы — вот рецепт ФСП против классовой борьбы."
 FRW_friendship_with_lisbon:0 "Дружба с Лиссабоном и Мадридом"
 FRW_friendship_with_lisbon_desc:0 "Салазар правит Португалией с 1932 года, не ища войны. Ла Рок указывает на Новое государство как на доказательство того, что порядок и мир совместимы."
 FRW_french_social_state:0 "Французское социальное государство"
 FRW_french_social_state_desc:0 "Ла Рок обещает Францию, построенную на труде, семье и католической вере, живущую в порядке и в мире с самой собой."
 FRW_purge_the_reds:0 "Чистка красных"
 FRW_purge_the_reds_desc:0 "Когда-то Дорио был коммунистическим мэром Сен-Дени. Он знает бывших товарищей по именам, а теперь у него есть полиция, чтобы их арестовать."
 FRW_purge_the_reds_tt:0 "Популярность коммунистов: §R-10%§!"
 FRW_anti_bolshevik_crusade:0 "Антибольшевистский крестовый поход"
 FRW_anti_bolshevik_crusade_desc:0 "Дорио призывает народы Европы объединиться против Москвы."
 FRW_party_militia:0 "Партийная милиция"
 FRW_party_militia_desc:0 "Служба порядка ФНП получает оружие и становится гвардией режима."
 FRW_pact_with_berlin:0 "Пакт с Берлином"
 FRW_pact_with_berlin_desc:0 "Дважды за семьдесят лет Франция и Германия воевали друг с другом. Теперь Париж просит принять его в германский союз."
 FRW_pact_with_berlin_tt:0 "Просит §YГерманию§! принять Францию в свою фракцию (если Германия фашистская и возглавляет фракцию)."
 FRW_cult_of_the_chef:0 "Культ вождя"
 FRW_cult_of_the_chef_desc:0 "Портрет Дорио висит в каждой мэрии. Партией и государством руководит один лишь Шеф."
 FRW_seize_libya:0 "Захват Ливии"
 FRW_seize_libya_desc:0 "Триполи и Феццан связали бы Тунис с Французской Западной и Экваториальной Африкой. Италию предстоит вынудить отказаться от них."
 FRW_swiss_protectorate:0 "Mare Nostrum"
 FRW_swiss_protectorate_desc:0 "Муссолини называет Средиземное море «mare nostrum». Париж с этим не согласен: Тулон, Бизерта и Мерс-эль-Кебир оборудуются как базы флота, способного его контролировать."
 FRW_demand_spanish_morocco:0 "Требовать Феццан"
 FRW_demand_spanish_morocco_desc:0 "По соглашениям Лаваля — Муссолини от января 1935 года Франция обещала Италии полосу Сахары. Новое правительство отказывается от них и вместо этого требует Феццан."
 FRW_above_the_parties:0 "Над партиями"
 FRW_above_the_parties_desc:0 "Многие во Франции утратили веру в коммунистов, фашистские лиги и запятнанный скандалами парламент. Они хотят твёрдой руки наверху."
 FRW_truce_national_concord:0 "Партийное перемирие"
 FRW_truce_national_concord_desc:0 "После беспорядков февраля 1934 года Гастон Думерг правил с министрами из всех лагерей в условиях партийного перемирия. Пора объявить его вновь."
 FRW_truce_national_concord_tt:0 "Защищает Францию от §Rкоммунистического восстания§!, которое иначе вызвала бы низкая стабильность.\nПрекращает §YВолну забастовок§!.\nСтановится доступно в §Yиюне 1936 года§!."
 FRW_suspend_the_chambers:0 "Отсрочка заседаний палат"
 FRW_suspend_the_chambers_desc:0 "Президент Лебрен отказывается назначать очередной кабинет. Заседания Палаты депутатов и Сената откладываются на неопределённый срок."
 FRW_suspend_the_chambers_tt:0 "§YРазобщённое правительство§! сменяется §YХрупким правительством§!. Два решения (с 1937 и с 1938 года, с перерывом не менее 6 месяцев) полностью устраняют его.\nПалаты распущены по домам. Никто не знает, что заполнит такую тишину..."
 FRW_etat_francais:0 "Французское государство"
 FRW_etat_francais_desc:0 "Маршал Петен, победитель при Вердене в 1916 году, берёт власть в качестве главы государства."
 FRW_etat_francais_tt:0 "Требуется поддержка §Yмаршала Петена§! (решение §YЗаручиться поддержкой маршала Петена§!, 45 дней)."
 FRW_return_to_the_land:0 "Возвращение к земле"
 FRW_return_to_the_land_desc:0 "«La terre, elle, ne ment pas.» Режим рассчитывает на крестьянство в деле обновления Франции."
 FRW_fortress_france:0 "Крепость Франция"
 FRW_fortress_france_desc:0 "Под Верденом в 1916 году Петен понял, что исход сражений решает огневая мощь. Соответственно он и планирует оборону Франции. Ветераны 1914-1918 годов объединяются в единый Легион и становятся главной опорой режима."
 FRW_corporation_paysanne:0 "Крестьянская корпорация"
 FRW_corporation_paysanne_desc:0 "Создаётся национальная крестьянская корпорация для организации сельского хозяйства и обеспечения продовольствием."
 FRW_weygand_staff:0 "Штаб генерала Вейгана"
 FRW_weygand_staff_desc:0 "Генерал Вейган пересматривает оборонительную доктрину армии и модернизирует её вооружение."
 FRW_armee_d_afrique:0 "Африканская армия"
 FRW_armee_d_afrique_desc:0 "Дивизии Африканской армии в Алжире, Марокко и Тунисе становятся стратегическим резервом империи."
 FRW_armed_neutrality:0 "Вооружённый нейтралитет"
 FRW_armed_neutrality_desc:0 "Франция заявляет, что не вступит ни в одну чужую войну. Любое нападение на её территорию встретит силу."
 FRW_redoubt_of_the_empire:0 "Редут империи"
 FRW_redoubt_of_the_empire_desc:0 "Разрабатываются планы продолжения войны из Алжира на случай, если метрополия будет захвачена."
 FRW_charte_du_travail:0 "Хартия труда"
 FRW_charte_du_travail_desc:0 "Забастовки и локауты запрещены. Споры в каждой отрасли разрешают смешанные комитеты работодателей и рабочих."
 FRW_charte_du_travail_tt:0 "Требуется §YЖан Бишлонн§! в качестве политического советника (решение §YНазначить Жана Бишлонна§! в §YСовете министров§!, ведомство §YЭкономика§!)."
 FRW_chantiers_de_jeunesse:0 "Молодёжные трудовые лагеря"
 FRW_chantiers_de_jeunesse_desc:0 "Каждый двадцатилетний юноша проводит восемь месяцев в лагерях, валя лес и обучаясь строевой подготовке."
 FRW_cult_of_the_marshal:0 "Маршал, мы здесь!"
 FRW_cult_of_the_marshal_desc:0 "Школьники разучивают песню «Maréchal, nous voilà». Во многих мэриях его портрет теперь висит там, где прежде стоял бюст Марианны."
 FRW_darlan_admiralty:0 "Дарлан в Адмиралтействе"
 FRW_darlan_admiralty_desc:0 "Адмирал Дарлан сохраняет флот в целости. Для нейтральной Франции это самый сильный козырь на переговорах."
 FRW_unconquerable_france:0 "Непокорённая Франция"
 FRW_unconquerable_france_desc:0 "Линия обороны тянется от линии Мажино до перевалов Атласа. Захватчику пришлось бы дорого платить за каждый метр."
 FRW_order_in_the_rif:0 "Порядок в Рифе"
 FRW_order_in_the_rif_desc:0 "В 1925 году Петен принял командование против Абд аль-Крима и завершил Рифскую войну. Испания так и не установила прочной власти над регионом, и теперь Франция предлагает сделать это сама."
 FRW_latin_neutral_bloc:0 "Латинский нейтральный блок"
 FRW_latin_neutral_bloc_desc:0 "Франко, Салазар и швейцарский Федеральный совет разделяют стремление маршала остаться в стороне от грядущей войны. Действуя сообща, они могут преуспеть."
 FRW_latin_neutral_bloc_tt:0 "Создаёт §YЛатинский нейтральный блок§! (если Франция не состоит во фракции) и, если Франция возглавляет свою фракцию, приглашает в неё §YИспанию§!, §YПортугалию§! и §YШвейцарию§!."
 FRW_empire_stands_guard:0 "Империя на страже"
 FRW_empire_stands_guard_desc:0 "Вейган инспектирует гарнизоны от Дакара до Бейрута. Колониальной армии приказано быть готовой к нападению с любой стороны."
 FRW_marshals_peace:0 "Мир маршала"
 FRW_marshals_peace_desc:0 "Пока великие державы истощают друг друга, Франция восстанавливается за своими границами. Маршал пообещал, что ни один француз не погибнет ни за Данциг, ни за Москву."
 FRW_orleanist_restoration:0 "Орлеанистская реставрация"
 FRW_orleanist_restoration_desc:0 "Анри Орлеанский, граф Парижский, возвращается из изгнания и провозглашается королём Генрихом VI."
 FRW_orleanist_restoration_tt:0 "Требуется поддержка §Yграфа Парижского§! (решение §YЗаручиться поддержкой графа Парижского§!, 45 дней)."
 FRW_charter_of_1830:0 "Обновление Хартии"
 FRW_charter_of_1830_desc:0 "Новая конституция по образцу Хартии 1830 года связывает корону с имущими классами."
 FRW_royal_diplomacy:0 "Королевская дипломатия"
 FRW_royal_diplomacy_desc:0 "Орлеанский дом связан брачными узами со многими правящими династиями Европы."
 FRW_action_francaise_ministers:0 "Министры из «Аксьон франсез»"
 FRW_action_francaise_ministers_desc:0 "Впервые члены «Аксьон франсез» Шарля Морраса входят в правительство."
 FRW_royal_army:0 "Королевская армия"
 FRW_royal_army_desc:0 "Офицеры приносят присягу королю. Взамен они получают средства, в которых им отказывала Республика."
 FRW_parliamentary_monarchy:0 "Парламентская монархия"
 FRW_parliamentary_monarchy_desc:0 "По британскому образцу король царствует, а правят его министры."
 FRW_absolute_crown:0 "Правление короны"
 FRW_absolute_crown_desc:0 "Генрих VI правит лично, опираясь на армию и Церковь."
 FRW_crown_of_the_franks:0 "Наследие Карла Великого"
 FRW_crown_of_the_franks_desc:0 "Валлония и Люксембург некогда принадлежали французской короне, а Карл Великий держал свой двор в Ахене."
 FRW_crown_of_the_franks_tt:0 "Повод для войны против §YГермании§! за §YРейнланд§! и §YМозельланд§! (если они ещё не принадлежат Франции).\nОбразует §YФранкскую империю§!: новое название и флаг, национальный дух и §Gнациональные территории на землях Нидерландов, Бельгии и Люксембурга, Рейнланда, Швейцарии и Северной Италии§!, которыми владеет Франция (а также на всех, что она получит там позднее), и §Yпретензии§! на остальные.\nЗаменяет любое государство, образованное Францией ранее (его национальный дух удаляется). Если Франция уже является §YВечным королевством Франкия§!, она им и остаётся.\nТребуется контроль над §YРейнландом§!, §YМозельландом§!, §YБельгией§! и §YНидерландами§! (аннексированными или марионетками, если не указано иное). Если Франция их ещё не контролирует, государство будет образовано автоматически, как только это произойдёт."
 FRW_catholic_revival:0 "Католическое возрождение"
 FRW_catholic_revival_desc:0 "Церковь благословляет восстановленную монархию."
 FRW_holy_alliance:0 "Новый Священный союз"
 FRW_holy_alliance_desc:0 "Монархии Европы объединяются в лигу против революции и войны."
 FRW_holy_alliance_tt:0 "Создаёт фракцию §YСвященный союз§!."
 FRW_kings_government:0 "Правительство короля"
 FRW_kings_government_desc:0 "Король назначает кабинет национального согласия, который затем утверждает Палата. Академия наук находит в новом короле щедрого покровителя."
 FRW_conseil_du_roi:0 "Королевский совет"
 FRW_conseil_du_roi_desc:0 "Подобно Людовику XIV, король правит вместе с небольшим советом доверенных советников."
 FRW_provinces_restored:0 "Восстановление провинций"
 FRW_provinces_restored_desc:0 "Департаменты, созданные в 1790 году, вновь уступают место историческим провинциям, таким как Нормандия и Бретань."
 FRW_most_christian_king:0 "Христианнейший король"
 FRW_most_christian_king_desc:0 "Генрих VI проходит миропомазание в Реймсском соборе, где веками короновались французские короли."
 FRW_belgian_crown:0 "Королевский флот"
 FRW_belgian_crown_desc:0 "Флот издавна был самым роялистским родом войск во Франции. Под знаком лилий ему предстоит вернуть былой престиж."
 FRW_luxembourg_protectorate:0 "Королевские академии"
 FRW_luxembourg_protectorate_desc:0 "Людовик XIV основал Академию наук в 1666 году. Корона намерена вновь стать её покровительницей."
 FRW_bonapartist_appeal:0 "Зов орла"
 FRW_bonapartist_appeal_desc:0 "Бонапартистские комитеты призывают к возвращению принца Луи Наполеона."
 FRW_bonapartist_appeal_tt:0 "Требуется поддержка §Yпринца Луи Наполеона§! (решение §YЗаручиться поддержкой принца Луи Наполеона§!, 45 дней)."
 FRW_proclaim_the_empire:0 "Провозглашение империи"
 FRW_proclaim_the_empire_desc:0 "Луи Наполеон коронуется в соборе Парижской Богоматери как Наполеон VI, император французов."
 FRW_code_napoleon:0 "Новый Кодекс Наполеона"
 FRW_code_napoleon_desc:0 "Законы и управление унифицируются по образцу Первой империи."
 FRW_imperial_guard:0 "Императорская гвардия"
 FRW_imperial_guard_desc:0 "Как во времена Первой империи, лучших солдат Франции отбирают в гвардию императора."
 FRW_grande_armee_reborn:0 "Возрождение Великой армии"
 FRW_grande_armee_reborn_desc:0 "Штаб изучает Аустерлиц и Йену и приспосабливает их стремительные манёвры и сосредоточенные удары к танкам и авиации."
 FRW_marshals_of_the_empire:0 "Маршалы империи"
 FRW_marshals_of_the_empire_desc:0 "Чины вновь даются по заслугам, и любой рядовой может надеяться, что носит в ранце маршальский жезл."
 FRW_marshals_of_the_empire_tt:0 "§YПринц Луи Наполеон§! сам выступает в поход как §Yфельдмаршал§! (Наступательная доктрина)."
 FRW_continental_system:0 "Континентальная система"
 FRW_continental_system_desc:0 "Франция создаёт замкнутую европейскую торговую зону под своим руководством."
 FRW_continental_system_tt:0 "Основывает фракцию §YКонтинентальная система§! (если Франция не состоит во фракции) и приглашает в неё §YПольшу§! и §YДанию§!, старых союзников императора."
 FRW_imperial_university:0 "Императорский университет"
 FRW_imperial_university_desc:0 "Высшие школы поставлены на службу подготовке инженеров и чиновников империи."
 FRW_imperial_university_tt:0 "Открывает политического советника §YФредерик Жолио-Кюри§! (директор имперской науки: скорость исследований §G+15%§!, 150 политической власти)."
 FRW_natural_borders:0 "Естественные границы"
 FRW_natural_borders_desc:0 "Рейн и Пиренеи — естественные рубежи Франции, как некогда провозглашала Революция."
 FRW_hundred_days_spirit:0 "Дух Ста дней"
 FRW_hundred_days_spirit_desc:0 "В 1815 году Наполеон обещал, что орёл полетит с колокольни на колокольню до самых башен Нотр-Дама. Его наследник повторяет эти слова."
 FRW_kingdom_of_holland:0 "Королевство Голландия"
 FRW_kingdom_of_holland_desc:0 "Луи Бонапарт был королём Голландии с 1806 по 1810 год. Нидерланды вновь должны стать зависимым королевством империи."
 FRW_kingdom_of_holland_tt:0 "Повод для войны §Yмарионетка§! против §YНидерландов§! (если они независимы и не являются союзником)."
 FRW_rhine_confederation:0 "Рейнский союз"
 FRW_rhine_confederation_desc:0 "Левый берег Рейна и Баден вновь переходят под покровительство императора."
 FRW_rhine_confederation_tt:0 "Повод для войны против §YГермании§! за §YМозельланд§!, §YРейнланд§! и §YБаден§! (если она не союзник)."
 FRW_kingdom_of_italy_napoleon:0 "Королевство Италия"
 FRW_kingdom_of_italy_napoleon_desc:0 "При Первой империи Пьемонт был французским департаментом, а Милан — столицей наполеоновского Королевства Италия. Его наследник намерен восстановить и то и другое."
 FRW_kingdom_of_italy_napoleon_tt:0 "Повод для войны против §YИталии§! за §YПьемонт§! (если она не союзник)."
 FRW_grand_empire:0 "Великая империя"
 FRW_grand_empire_desc:0 "Империя французов некогда простиралась от Гамбурга до Рима. Наполеон VI намерен воссоздать её."
 FRW_grand_empire_tt:0 "Образует §YВеликую Французскую империю§!: новое название, имперский флаг, тёмно-синий цвет на карте, национальный дух и §Gнациональные территории на землях Нидерландов, Бельгии и Люксембурга, Рейнланда, Швейцарии, Северной Италии, Сардинии и Каталонии§!, которыми владеет Франция (а также на всех, что она получит там позднее), и §Yпретензии§! на остальные.\nЗаменяет любое государство, образованное Францией ранее (его национальный дух удаляется). Если Франция уже является §YВечным королевством Франкия§!, она им и остаётся.\nТребуется контроль над §YРейном§! (Рейнланд, Мозельланд), §YПьемонтом§!, §YБельгией§! и §YНидерландами§! (аннексированными или марионетками, если не указано иное). Если Франция их ещё не контролирует, государство будет образовано автоматически, как только это произойдёт."
 FRW_iron_crown:0 "Железная корона"
 FRW_iron_crown_desc:0 "В 1805 году в Милане Наполеон был коронован Железной короной Ломбардии. Его наследник намерен также её надеть."
 FRW_legion_of_honour:0 "Орден Почётного легиона"
 FRW_legion_of_honour_desc:0 "Подобно первому Наполеону, император награждает за храбрость на поле боя орденом Почётного легиона."
 FRW_imperial_navy:0 "Императорский флот"
 FRW_imperial_navy_desc:0 "Поражение при Трафальгаре в 1805 году так и осталось неотомщённым. Империя заказывает флот, достойный её амбиций."
 FRW_emperor_of_the_west:0 "Император Запада"
 FRW_emperor_of_the_west_desc:0 "Власть императора простирается теперь от Атлантики до Эльбы и от Северного моря до Тибра, и повсюду действует единый свод законов."
 FRW_act_of_mediation:0 "Акт посредничества"
 FRW_act_of_mediation_desc:0 "В 1803 году Наполеон дал швейцарцам конституцию и своё покровительство. Его наследник возобновляет это устройство."
 FRW_duchy_of_warsaw:0 "Герцогство Варшавское"
 FRW_duchy_of_warsaw_desc:0 "Польские уланы следовали за Наполеоном от Мадрида до Москвы. Польше вновь предстоит стать форпостом империи на Востоке."
 FRW_egyptian_campaign:0 "Египетский поход"
 FRW_egyptian_campaign_desc:0 "В 1798 году Бонапарт привёл свою армию к пирамидам. Его наследник присматривается к Суэцкому каналу."
 FRW_egyptian_campaign_tt:0 "Претензии на §YКаир§!, §YАлександрию§! и район §YСуэца§!, а также повод для войны против того, кто владеет Александрией (Египет или Великобритания)."
 FRW_road_to_moscow:0 "Дорога на Москву"
 FRW_road_to_moscow_desc:0 "Поход 1812 года закончился в снегах. На этот раз у Великой армии есть танки, а Варшава уже союзник."
 FRW_road_to_moscow_tt:0 "Претензии на §YМинск§!, §YВитебск§!, §YСмоленск§! и §YМоскву§!, а также повод для войны против §YСоветского Союза§!."
 FRW_continental_empire:0 "Континентальная империя"
 FRW_continental_empire_desc:0 "Династия теперь правит от Кадиса до Нила и от Ла-Манша до Вислы."
 FRW_legitimate_heir:0 "Законный наследник"
 FRW_legitimate_heir_desc:0 "Для легитимистов Орлеаны — узурпаторы. Законный король — старший наследник Людовика XIV: Альфонс Бурбонский, изгнанный король Испании, которого они именуют Альфонсом I."
 FRW_legitimate_heir_tt:0 "§YАльфонс Бурбонский§! (после его смерти в 1941 году — его сын §YЖак II§!) становится королём Франции. Легитимисты формируют правительство.\nТребуется поддержка §YАльфонса Бурбонского§! (решение §YЗаручиться поддержкой Альфонса Бурбонского§!, 45 дней)."
 FRW_white_flag:0 "Белое знамя"
 FRW_white_flag_desc:0 "В 1873 году Генрих V отказался от трона, лишь бы не принимать триколор. Его наследники возвращают белое знамя Бурбонов — по крайней мере, на крыши дворцов."
 FRW_spanish_bourbons:0 "Мадридские Бурбоны"
 FRW_spanish_bourbons_desc:0 "Новый король — также изгнанный король Испании. Монархисты по обе стороны Пиренеев смотрят на Париж."
 FRW_spanish_bourbons_tt:0 "Каждая испанская сторона гражданской войны также получает §YСвязи с французской короной§!."
 FRW_requetes:0 "Рекете Наварры"
 FRW_requetes_desc:0 "Карлистские добровольцы в красных беретах переходят Пиренеи, чтобы служить королю. Они набожны, дисциплинированны и рвутся в бой."
 FRW_secure_crown_of_spain:0 "Обеспечить корону Испании"
 FRW_secure_crown_of_spain_desc:0 "Альфонс покинул Мадрид в 1931 году, не отрекшись от престола. Париж просит Испанию принять своего короля обратно, по возможности мирно."
 FRW_secure_crown_of_spain_tt:0 "Если в Испании идёт гражданская война: повод для войны (§Yмарионетка§!) против каждой испанской стороны, не состоящей в союзе с Францией.\nВ противном случае §YИспании§! предлагается признать короля Франции своим королём (становится марионеткой Франции). Отказ даёт Франции повод для войны."
 FRW_unite_the_crowns:0 "Объединить короны"
 FRW_unite_the_crowns_desc:0 "В 1713 году Филипп V был вынужден отказаться от французского престола, чтобы две короны никогда не объединились. Утрехтский договор утратил силу, и Франция с Испанией становятся единым королевством."
 FRW_unite_the_crowns_tt:0 "Аннексирует всех испанских марионеток Франции.\nОбразует §YБурбонское королевство Франции и Испании§!: новое название и флаг, национальный дух §YДвуединая монархия§! и §Gнациональные территории на землях Испании§!, принадлежащих Франции (а также на тех, что она получит там позднее), и §Yпретензии§! на остальные.\nЗаменяет любое государство, образованное Францией ранее. Требуется контроль над §YМадридом§! (аннексированным или в качестве марионетки); если Франция ещё не контролирует его, королевство будет основано, как только это произойдёт."
 FRW_two_crowns:0 "Две страны, две короны"
 FRW_two_crowns_desc:0 "Один король, два королевства: Франция и Испания сохраняют собственные правительства и армии, но стоят вместе под властью дома Бурбонов."
 FRW_two_crowns_tt:0 "Испания вновь становится независимой (если была марионеткой Франции) и вместе с Францией вступает в §YСемейный пакт Бурбонов§!. Оба королевства сохраняют собственные правительства."
 FRW_no_more_pyrenees:0 "Пиренеев больше нет"
 FRW_no_more_pyrenees_desc:0 "«Il n'y a plus de Pyrénées», — якобы заметил Людовик XIV, когда его внук стал королём Испании. Шоссе, железные дороги и тарифы теперь обходятся с горами так, словно их нет."
 FRW_no_more_pyrenees_tt:0 "Испания, если она на стороне Франции: §YПартнёр Бурбонов§! (+5% к производительности заводов, +5% к стабильности)."
 FRW_catholic_kings:0 "Католичнейшие короли"
 FRW_catholic_kings_desc:0 "Церковь возвращает себе школы и места в государственных советах. Взамен епископы обоих королевств проповедуют верность короне."
 FRW_portuguese_alliance:0 "Предложение Лиссабону"
 FRW_portuguese_alliance_desc:0 "Лишь Лиссабон стоит особняком на полуострове. Париж и Мадрид предлагают Салазару место под короной Бурбонов и долго ждать ответа не станут."
 FRW_heirs_of_louis_xiv:0 "Наследники Людовика XIV"
 FRW_heirs_of_louis_xiv_desc:0 "Впервые со времён Короля-Солнца Бурбон правит от Ла-Манша до Гибралтара. Придворные говорят о новом Великом веке."
 FRW_rock_of_gibraltar:0 "Гибралтарская скала"
 FRW_rock_of_gibraltar_desc:0 "Испания уступила Гибралтар британцам в 1704 году, сражаясь за права Филиппа Анжуйского, первого Бурбона на испанском троне. Теперь его наследники правят в Париже и Мадриде и хотят вернуть Скалу."
 FRW_rock_of_gibraltar_tt:0 "Повод для войны против §YВеликобритании§! за §YГибралтар§! (если Великобритания не союзник)."
 FRW_two_sicilies:0 "Корона Обеих Сицилий"
 FRW_two_sicilies_desc:0 "До 1861 года в Неаполе и Палермо правил король из династии Бурбонов. Савойская династия силой отняла его королевство, и старший Бурбон теперь требует его как наследие своего рода."
 FRW_two_sicilies_tt:0 "Повод для войны против §YИталии§! за §YКампанию, Сицилию, Калабрию и Апулию§! (если Италия не союзник)."
 FRW_family_compact_fleet:0 "Флот Семейного пакта"
 FRW_family_compact_fleet_desc:0 "В 1761 году короли Франции и Испании из династии Бурбонов объединили свои флоты против Британии. Брест, Тулон, Ферроль и Картахена вновь строят корабли для единого флота."
 FRW_family_compact_fleet_tt:0 "Если Франции принадлежат §YГалисия§! (Ферроль) и §YМурсия§! (Картахена): §G+2§! верфи в каждой."
 FRW_house_of_parma:0 "Дом Бурбон-Пармских"
 FRW_house_of_parma_desc:0 "Принц Феликс Бурбон-Пармский — супруг великой герцогини Люксембургской, а сама Парма до 1859 года была бурбонским герцогством. Обоих призывают вернуться в лоно семьи."
 FRW_nec_pluribus_impar:0 "Nec Pluribus Impar"
 FRW_nec_pluribus_impar_desc:0 "«Не уступающий и многим» — таков был девиз Людовика XIV. От Ла-Манша до Сицилии дом Бурбонов вновь способен противостоять любой коалиции, какую Европа может против него собрать."
 FRW_nec_pluribus_impar_tt:0 "§YВеликий век§! становится §YNec Pluribus Impar§!."
 FRW_devalue_the_franc:0 "Девальвировать франк"
 FRW_devalue_the_franc_desc:0 "Франция больше не в силах удерживать золотой блок. Девальвация должна вернуть французскому экспорту конкурентоспособность."
 FRW_econ_dirigisme:0 "Управляемая экономика"
 FRW_econ_dirigisme_desc:0 "От национализаций Народного фронта до плановых ведомств последующих правительств французские министры всех партий доверяли Парижу руководство экономикой. Кредит, инвестиции и производство будут следовать планам, составленным государством."
 FRW_econ_dirigisme_tt:0 "Выбирает §YУправляемую экономику§! в качестве экономической модели Франции. Её дух усиливается благодаря §YПромышленным картелям§! и §YЭкономической независимости§!."
 FRW_econ_liberal:0 "Экономический либерализм"
 FRW_econ_liberal_desc:0 "Металлургические магнаты из Комитета кузниц хотят освободить франк от контроля и предоставить рынки самим себе. Дайте им свободу действий, говорят они, и заводы будут расти."
 FRW_econ_liberal_tt:0 "Выбирает §YЭкономический либерализм§! в качестве экономической модели Франции (недоступно коммунистам). Её дух усиливается благодаря §YПромышленным картелям§! и §YЭкономической независимости§!."
 FRW_econ_rearmament:0 "Перевооружение прежде всего"
 FRW_econ_rearmament_desc:0 "Заводы Германии работают на армию с 1935 года. Теперь Париж следует её примеру, и бюджет арсеналов ставится превыше всего."
 FRW_econ_rearmament_tt:0 "Выбирает §YПеревооружение прежде всего§! в качестве экономической модели Франции. Её дух усиливается благодаря §YПромышленным картелям§! и §YЭкономической независимости§!."
 FRW_economic_plan:0 "Экономический план"
 FRW_economic_plan_desc:0 "Какой бы курс ни выбрало правительство, ему предстоит решить, что строить, где и кто за это заплатит."
 FRW_public_works:0 "Большие общественные работы"
 FRW_public_works_desc:0 "Строительство дорог, мостов и гаваней отдаётся на подряд: безработные получают работу, а страна — лучшее оснащение."
 FRW_rationalize_industry:0 "Рационализация промышленности"
 FRW_rationalize_industry_desc:0 "Многие французские фирмы по-прежнему остаются небольшими семейными предприятиями со старым оборудованием. Поощряются слияния и современные методы производства."
 FRW_rationalize_industry_tt:0 "Если Франция всё ещё страдает от §YНеэффективной экономики§!, её уровень снижается на один."
 FRW_reform_banque_de_france:0 "Реформа Банка Франции"
 FRW_reform_banque_de_france_desc:0 "200 крупнейших акционеров теряют контроль над Банком Франции, совет которого теперь в основном назначается государством."
 FRW_autoroutes_nationales:0 "Национальные дороги"
 FRW_autoroutes_nationales_desc:0 "Старые национальные дороги расширяют, заново покрывают и связывают между собой. Грузовики и армейские колонны теперь могут пересечь страну за часы, а не за дни."
 FRW_sncf_modernization:0 "Основать SNCF"
 FRW_sncf_modernization_desc:0 "1 января 1938 года крупные частные железнодорожные компании объединяются в Национальное общество железных дорог Франции."
 FRW_modern_management:0 "Научная организация труда"
 FRW_modern_management_desc:0 "Дипломированные инженеры приходят в советы директоров, которыми долго управляли семьи основателей, и французская промышленность начинает считать свои издержки."
 FRW_modern_management_tt:0 "Полностью убирает §YНеэффективную экономику§!.\nТребуются все фокусы ряда над ним и промышленность не менее чем из §Y40§! гражданских и §Y25§! военных заводов.\nНа нём основываются все нижние фокусы экономического дерева."
 FRW_industrial_cartels:0 "Промышленные картели"
 FRW_industrial_cartels_desc:0 "Комитеты каждой отрасли промышленности распределяют сырьё и согласовывают инвестиции."
 FRW_industrial_cartels_tt:0 "Повышает дух выбранной вами §Yэкономической модели§! до следующего уровня."
 FRW_hydroelectric_alps:0 "Гидроэнергетика Альп"
 FRW_hydroelectric_alps_desc:0 "Плотины на Роне и в альпийских долинах снабжают новые заводы дешёвой электроэнергией."
 FRW_electrification:0 "Электрификация"
 FRW_electrification_desc:0 "Электростанции на Роне и Рейне подают ток на самые отдалённые фермы Центрального массива. Вдоль линий возникают новые производства."
 FRW_lorraine_steel:0 "Лотарингская сталь"
 FRW_lorraine_steel_desc:0 "Новые методы добычи и плавки позволяют эффективнее использовать бедную лотарингскую руду — минет."
 FRW_heavy_industry_nord:0 "Тяжёлая промышленность Севера"
 FRW_heavy_industry_nord_desc:0 "Шахты и металлургические заводы в департаментах Нор и Па-де-Кале расширяются."
 FRW_renault_and_citroen:0 "«Рено» и «Ситроен»"
 FRW_renault_and_citroen_desc:0 "«Рено» и «Ситроен» переводят свои сборочные линии на выпуск грузовиков, тракторов и бронемашин."
 FRW_research_institutes:0 "Основать CNRS"
 FRW_research_institutes_desc:0 "Новый Национальный центр научных исследований объединяет лаборатории страны под единым управлением."
 FRW_bauxite_provence:0 "Бокситы Прованса"
 FRW_bauxite_provence_desc:0 "Боксит, названный по селению Ле-Бо в Провансе, добывают там ради алюминия, необходимого авиастроителям."
 FRW_rearmament_plan:0 "Программа перевооружения 1936 года"
 FRW_rearmament_plan_desc:0 "На четыре года перевооружения выделено четырнадцать миллиардов франков. «Рено» будет строить танки, «Шнейдер» — орудия, «Девуатин» — самолёты."
 FRW_rearmament_plan_tt:0 "Требуется §YРауль Дотри§! в качестве политического советника (решение §YНазначить Рауля Дотри§! в §YСовете министров§!, ведомство §YЭкономика§!)."
 FRW_aviation_industry:0 "Реорганизовать авиапромышленность"
 FRW_aviation_industry_desc:0 "Авиационные заводы переходят под контроль государства и объединяются в региональные компании SNCA."
 FRW_atomic_research:0 "Лаборатория Жолио-Кюри"
 FRW_atomic_research_desc:0 "Фредерик и Ирен Жолио-Кюри, лауреаты Нобелевской премии 1935 года, находятся в авангарде ядерных исследований."
 FRW_ecole_polytechnique:0 "Расширить высшие школы"
 FRW_ecole_polytechnique_desc:0 "Политехническая школа, Центральная школа и Горная школа удваивают набор. Их выпускники будут конструировать оружие страны и управлять её заводами."
 FRW_iraqi_oil:0 "Мосульская нефтяная концессия"
 FRW_iraqi_oil_desc:0 "Через Французскую нефтяную компанию Франция владеет почти четвертью Иракской нефтяной компании. Нефть из Киркука по трубопроводу доходит до Триполи, а оттуда морем отправляется на нефтеперерабатывающие заводы близ Марселя."
 FRW_dockyards_brest:0 "Арсеналы Бреста"
 FRW_dockyards_brest_desc:0 "Арсеналы Бреста и Лорьяна получают новое оборудование и новые стапели. Здесь будут строиться корабли для Атлантического флота."
 FRW_consumer_economy:0 "Промышленность товаров народного потребления"
 FRW_consumer_economy_desc:0 "Всё больше семей среднего класса могут позволить себе холодильник, радиоприёмник или автомобиль."
 FRW_thomson_electronics:0 "Радиопромышленность"
 FRW_thomson_electronics_desc:0 "«Томсон-Хьюстон», SFR и Центральная лаборатория телекоммуникаций получают государственные заказы на радиостанции и первые радары."
 FRW_war_economy:0 "Военная экономика"
 FRW_war_economy_desc:0 "Заводы готовятся к переоснащению, создаются запасы, рабочая сила берётся на учёт для распределения. Если начнётся война, промышленность будет готова в считаные недели."
 FRW_dispersed_industry:0 "Децентрализовать военную промышленность"
 FRW_dispersed_industry_desc:0 "Новые заводы строятся в Тулузе, Бордо и Марселе — вне досягаемости бомбардировщиков, базирующихся в Германии."
 FRW_paris_expo:0 "Всемирная выставка в Париже 1937 года"
 FRW_paris_expo_desc:0 "Международная выставка 1937 года представляет на берегах Сены французское искусство и инженерную мысль."
 FRW_economic_modernization:0 "Модернизация экономики"
 FRW_economic_modernization_desc:0 "Широкая инвестиционная программа призвана поднять французскую промышленность до британского и германского уровня."
 FRW_arsenal_de_la_republique:0 "Арсенал Республики"
 FRW_arsenal_de_la_republique_desc:0 "Государственные арсеналы работают посменно круглые сутки и выпускают оружие в количествах, невиданных в мирное время."
 FRW_strategic_stockpiles:0 "Стратегические запасы"
 FRW_strategic_stockpiles_desc:0 "Склады заполняются винтовками, снарядами и запчастями на случай мобилизации."
 FRW_regional_development:0 "Региональное планирование"
 FRW_regional_development_desc:0 "Кредиты и общественные работы направляются в заброшенные департаменты Центральной Франции."
 FRW_war_production_board:0 "Министерство вооружений"
 FRW_war_production_board_desc:0 "Министерство вооружений Рауля Дотри берёт на себя руководство всем военным производством."
 FRW_economic_independence:0 "Экономическая независимость"
 FRW_economic_independence_desc:0 "Франция стремится обеспечивать свои потребности за счёт ресурсов метрополии и империи."
 FRW_economic_independence_tt:0 "Повышает дух выбранной вами §Yэкономической модели§! на один уровень (до последнего уровня, если также выполнен фокус §YПромышленные картели§!)."
 FRW_franc_treasury_crisis:0 "Кризис казначейства"
 FRW_franc_treasury_crisis_desc:0 "Казначейство живёт от месяца к месяцу на авансы Банка Франции. Прежде чем начинать какую-либо реформу, нужно выяснить, сколько денег у государства на самом деле."
 FRW_franc_treasury_crisis_tt:0 "Инфляция: §G-5§!"
 FRW_franc_stabilisation_fund:0 "Валютный стабилизационный фонд"
 FRW_franc_stabilisation_fund_desc:0 "Для защиты франка на рынках создаётся фонд из золота и иностранной валюты, как это уже делают Лондон и Вашингтон. Спекулянтам придётся считаться не только с Банком Франции, но и с казначейством."
 FRW_franc_stabilisation_fund_tt:0 "Золотой запас: §G+100 т§!\nОтныне §G+5 т§! золота в месяц."
 FRW_franc_defence_bonds:0 "Облигации национальной обороны"
 FRW_franc_defence_bonds_desc:0 "Казначейство продаёт облигации в каждом почтовом отделении Франции. Вкладчики не тратят свои франки, а одалживают их государству, и плакаты обещают, что на каждый франк будет куплен снаряд."
 FRW_franc_defence_bonds_tt:0 "Инфляция: §G-8§!"
 FRW_franc_fiscal_reform:0 "Финансовая реформа"
 FRW_franc_fiscal_reform_desc:0 "Парламент вводит новые налоги, сокращает льготы и на этот раз принимает бюджет вовремя. Дефицит сокращается, а вместе с ним и авансы Банка Франции."
 FRW_franc_fiscal_reform_tt:0 "Отныне инфляция снижается ещё на §G0.25§! п. в месяц."
 FRW_franc_safe_havens:0 "Надёжные убежища для золота"
 FRW_franc_safe_havens_desc:0 "Часть запасов втайне переправляется в хранилища Дакара, Фор-де-Франса и Оттавы, вне досягаемости любого захватчика."
 FRW_franc_safe_havens_tt:0 "Золотой запас в безопасности: если Франция капитулирует, §YСвободная Франция§! всё равно сможет им распоряжаться."
 FRW_franc_colonial_gold:0 "Золото империи"
 FRW_franc_colonial_gold_desc:0 "Геологи и инженеры отправляются на золотые прииски Гвинеи и Французского Судана. Добыча невелика, но каждая унция добыта в зоне франка."
 FRW_franc_colonial_gold_tt:0 "Золотой запас: §G+50 т§!\nОтныне §G+5 т§! золота в месяц."
 FRW_franc_strong_franc:0 "Крепкий франк"
 FRW_franc_strong_franc_desc:0 "Со сбалансированным бюджетом и полными хранилищами франк сохраняет свою стоимость, а капитал, бежавший в Лондон и Нью-Йорк, возвращается домой. Кредит дешевеет, и стройки возобновляются."
 FRW_franc_strong_franc_tt:0 "Инфляция: §G-10§!"
 FRW_franc_war_finance:0 "Финансирование войны"
 FRW_franc_war_finance_desc:0 "Война будет оплачена налогами, займами и контролем, а не печатным станком. Министры помнят, что сделали с франком военные долги после 1918 года."
 FRW_franc_war_finance_tt:0 "Инфляция: §G-8§!\nДоступно только §Yво время войны§!."
 FRW_lessons_of_verdun:0 "Уроки Вердена"
 FRW_lessons_of_verdun_desc:0 "Штабные офицеры изучают кампании 1914–1918 годов, чтобы армия не повторила прежних ошибок."
 FRW_beyond_victory:0 "Преодолеть самоуспокоенность победителя"
 FRW_beyond_victory_desc:0 "Победа 1918 года оставила армию уверенной в своих методах. Теперь её офицерам предстоит их пересмотреть."
 FRW_beyond_victory_tt:0 "Оставшиеся сомнения (§YСомнения победителя§!) устраняются только фокусом §YСовременная армия§! в конце армейской ветки."
 FRW_methodical_battle:0 "Методичное сражение"
 FRW_methodical_battle_desc:0 "Армия воюет по тщательно продуманному плану, с массированной артиллерией и сплошным, прочно удерживаемым фронтом."
 FRW_methodical_battle_tt:0 "Дух §YГенералы 1918 года§! ослабевает до §YКомандование в переходный период§!. Фокус §YРеформа Генерального штаба§! устраняет его."
 FRW_war_of_movement:0 "Манёвренная война"
 FRW_war_of_movement_desc:0 "Танки, грузовики и радио решат исход следующей войны, и она будет стремительной."
 FRW_war_of_movement_tt:0 "Дух §YГенералы 1918 года§! ослабевает до §YКомандование в переходный период§!. Фокус §YРеформа Генерального штаба§! устраняет его."
 FRW_maginot_extension:0 "Продлить линию Мажино"
 FRW_maginot_extension_desc:0 "Линия Мажино обрывается у бельгийской границы, и германскому штабу это хорошо известно. Теперь новые казематы и заграждения протянутся от Монмеди до моря."
 FRW_heavy_artillery:0 "Тяжёлая артиллерия"
 FRW_heavy_artillery_desc:0 "«Шнейдер» и Ателье де Пюто поставляют новые орудия на смену запасам прошлой войны."
 FRW_mas_rifles:0 "MAS-36"
 FRW_mas_rifles_desc:0 "MAS-36 короче и легче старой винтовки Лебеля и быстрее перезаряжается. Ею предстоит вооружить каждый пехотный полк."
 FRW_mechanized_divisions:0 "Лёгкие механизированные дивизии"
 FRW_mechanized_divisions_desc:0 "Кавалерия формирует лёгкие механизированные дивизии для разведки впереди армии и преследования разбитого противника. Грузовики заменяют конные обозы, которые всё ещё подвозят армии снабжение."
 FRW_divisions_cuirassees:0 "Бронетанковые дивизии"
 FRW_divisions_cuirassees_desc:0 "Следуя идеям полковника де Голля, танки сводятся в самостоятельные бронетанковые дивизии. Продолжается работа над более тяжёлым танком прорыва на смену Char B1."
 FRW_chasseurs_alpins:0 "Альпийские стрелки и спаги"
 FRW_chasseurs_alpins_desc:0 "Альпийские стрелки, «голубые дьяволы» прошлой войны, считаются одними из лучших горных войск Европы. Все альпийские дивизии должны быть подготовлены по их образцу. Конные полки спаги из Северной Африки перевооружаются как разведывательные части."
 FRW_colonial_troops:0 "Колониальные войска"
 FRW_colonial_troops_desc:0 "Для усиления армии привлекаются сенегальские стрелки и североафриканские спаги."
 FRW_general_staff_reform:0 "Реформа Генерального штаба"
 FRW_general_staff_reform_desc:0 "Пожилых генералов отправляют в отставку, а командование получают более молодые офицеры."
 FRW_foreign_legion:0 "Иностранный легион"
 FRW_foreign_legion_desc:0 "Иностранный легион, девиз которого — Legio Patria Nostra, расширяется и готовится как элитное соединение."
 FRW_reserve_system:0 "Система резервов"
 FRW_reserve_system_desc:0 "Резервистов регулярно призывают на сборы, чтобы они могли быстро вернуться в свои части."
 FRW_reserve_system_tt:0 "Требуется §YАльфред Сови§! в качестве политического советника (решение §YНазначить Альфреда Сови§! в §YСовете министров§!, ведомство §YЭкономика§!)."
 FRW_combined_arms:0 "Общевойсковой бой"
 FRW_combined_arms_desc:0 "Пехота, танки, артиллерия и авиация проходят совместную подготовку и учатся действовать согласованно. 47-мм пушка SA 37 способна пробить броню любого танка, состоящего сейчас на вооружении в Европе. Каждая пехотная дивизия должна получить их в количестве, достаточном для отражения танковой атаки."
 FRW_paratroopers:0 "Парашютисты и вольные отряды"
 FRW_paratroopers_desc:0 "Франция сформировала свои первые парашютные роты — «Воздушную пехоту» — в 1937 году, одной из первых в мире. Небольшие штурмовые отряды готовятся для разведки и рейдов."
 FRW_desert_warfare:0 "Война в пустыне"
 FRW_desert_warfare_desc:0 "Опыт кампаний в Марокко и Сахаре обобщается и преподаётся."
 FRW_artillery_barrage:0 "Огневой вал"
 FRW_artillery_barrage_desc:0 "Детально спланированный огонь, тесно увязанный с действиями пехоты, остаётся основой французской тактики."
 FRW_army_of_the_republic:0 "Современная армия"
 FRW_army_of_the_republic_desc:0 "Если не считать знамён, у армии 1940 года мало общего с армией 1918-го. Создаётся объединённый штаб для координации сухопутных войск, флота и военно-воздушных сил."
 FRW_tank_production_lines:0 "Танковые сборочные линии"
 FRW_tank_production_lines_desc:0 "В Исси-ле-Мулино и Вениссьё открываются новые танковые сборочные линии."
 FRW_darlan_programme:0 "Программа Дарлана"
 FRW_darlan_programme_desc:0 "Франция располагает четвёртым по величине флотом в мире, и её корабли нужно поддерживать на современном уровне. Адмирал Дарлан, начальник военно-морского штаба с 1937 года, добивается создания флота, способного действовать в открытом море."
 FRW_darlan_programme_tt:0 "Дух §YРазобщённый флот§! ослабевает до §YФлот в процессе реформ§!. Фокус §YВерфи Тулона и Бреста§! устраняет его.\nОткрывает ведомство §YФлот§! в §YСовете министров§!."
 FRW_richelieu_class:0 "Линкоры типа «Ришельё»"
 FRW_richelieu_class_desc:0 "«Дюнкерк» и «Страсбург» были лишь первыми из новых линкоров. Корабли типа «Ришельё» не уступят ничему, что Италия или Германия смогут вывести в море. «Ришельё» и однотипные с ним корабли станут самыми мощными линкорами из когда-либо построенных Францией."
 FRW_mediterranean_fleet:0 "Средиземноморский флот"
 FRW_mediterranean_fleet_desc:0 "Французские крейсера и большие эсминцы — одни из самых быстрых военных кораблей в мире. Морской путь в Северную Африку должен оставаться открытым любой ценой."
 FRW_atlantic_squadrons:0 "Атлантические эскадры"
 FRW_atlantic_squadrons_desc:0 "Флот вкладывает значительные средства в подводные лодки — от гигантского «Сюркуфа» до малых прибрежных лодок. Брест становится главной базой Атлантического флота."
 FRW_carrier_programme:0 "Авианосная программа"
 FRW_carrier_programme_desc:0 "Старый «Беарн» — единственный авианосец флота, и он слишком тихоходен для современных операций. Новый тип «Жоффр» даст флоту собственную авиацию."
 FRW_naval_aviation:0 "Морская авиация"
 FRW_naval_aviation_desc:0 "Аэронаваль получает собственные самолёты, лётчиков и авиастанции. Торпедоносцы и разведчики будут вести поиск и наносить удары в интересах флота."
 FRW_toulon_brest_yards:0 "Верфи Тулона и Бреста"
 FRW_toulon_brest_yards_desc:0 "В Тулоне и Бресте строятся новые сухие доки для следующего поколения военных кораблей."
 FRW_convoy_escorts:0 "Конвойное сопровождение"
 FRW_convoy_escorts_desc:0 "Авизо и корветы сопровождают суда на путях в колонии."
 FRW_coastal_defence:0 "Береговая оборона"
 FRW_coastal_defence_desc:0 "Морские фузилёры, памятные своей стойкостью при Диксмёйде в 1914 году, воссоздаются как современные десантные силы. Береговые батареи и минные поля защищают порты Франции и империи."
 FRW_fleet_in_being:0 "Сбалансированный флот"
 FRW_fleet_in_being_desc:0 "Линкоры, крейсера, эсминцы и подводные лодки строятся в сбалансированных количествах, чтобы флот мог действовать в любом море."
 FRW_naval_treaties_end:0 "Прощание с морскими договорами"
 FRW_naval_treaties_end_desc:0 "Франция больше не считает себя связанной Вашингтонским и Лондонским морскими договорами."
 FRW_plan_v:0 "План V"
 FRW_plan_v_desc:0 "Военно-воздушные силы Франции стали отдельным видом вооружённых сил лишь в 1934 году. План V предусматривает 2400 современных самолётов."
 FRW_plan_v_tt:0 "Дух §YУстаревшие ВВС§! ослабевает до §YВВС в переходный период§!. Фокус §YЛётные школы§! устраняет его.\nОткрывает ведомство §YВВС§! в §YСовете министров§!."
 FRW_dewoitine_fighters:0 "Истребители «Девуатин»"
 FRW_dewoitine_fighters_desc:0 "Dewoitine D.520 должен на равных противостоять любому истребителю, с которым встретится."
 FRW_bomber_command:0 "Бомбардировочная авиация"
 FRW_bomber_command_desc:0 "Эскадрильи перевооружаются современными двухмоторными бомбардировщиками, такими как LeO 45."
 FRW_air_doctrine:0 "Авиационная доктрина"
 FRW_air_doctrine_desc:0 "Штаб письменно излагает, какие задачи ВВС предстоит выполнять в будущей войне."
 FRW_colonial_air_bases:0 "Авиабазы в империи"
 FRW_colonial_air_bases_desc:0 "Аэродромы в Северной Африке расширяют воздушное прикрытие над западной частью Средиземного моря."
 FRW_close_air_support:0 "Непосредственная авиаподдержка"
 FRW_close_air_support_desc:0 "Пикирующие бомбардировщики и штурмовики будут направляться туда, куда их вызовет пехота. Впервые французские ВВС всерьёз проводят совместные учения с армией."
 FRW_air_defence_paris:0 "ПВО Парижа"
 FRW_air_defence_paris_desc:0 "Столицу окружает кольцо зенитных орудий и звукоулавливателей."
 FRW_pilot_schools:0 "Лётные школы"
 FRW_pilot_schools_desc:0 "Новые лётные школы в Истре и Салон-де-Провансе ежегодно готовят несколько сотен пилотов, а «Народная авиация» Пьера Кота учит молодых людей летать в местных аэроклубах."
 FRW_jet_research:0 "Реактивные двигатели"
 FRW_jet_research_desc:0 "Инженер Рене Ледюк работает над прямоточным воздушно-реактивным двигателем."
 FRW_strategic_air_force:0 "Стратегическая авиация"
 FRW_strategic_air_force_desc:0 "Заказаны четырёхмоторные бомбардировщики для ударов по заводам, железным дорогам и портам в глубоком тылу противника."
 FRW_strategic_air_force_tt:0 "Требуется §YПьер Кот§! в качестве политического советника (решение §YНазначить Пьера Кота§! в §YСовете министров§!, раздел §YИсследования§!)."
 FRW_air_superiority:0 "Господство в воздухе"
 FRW_air_superiority_desc:0 "Недавние бои в Испании показали, что армии без прикрытия с воздуха несут тяжёлые потери. Военно-воздушным силам Франции нужно больше истребителей, и более быстрых."
 FRW_air_staff:0 "Штаб ВВС"
 FRW_air_staff_desc:0 "Постоянный штаб ВВС отныне совместно планирует действия истребительных, бомбардировочных и разведывательных эскадрилий. Приказы будут отдавать офицеры, знающие авиацию."
 FRW_quai_d_orsay:0 "Кэ д’Орсе"
 FRW_quai_d_orsay_desc:0 "Кэ д’Орсе обладает бо́льшим опытом европейской дипломатии, чем любое другое министерство иностранных дел, и его послы получают важные поручения."
 FRW_league_of_nations:0 "Укрепить Лигу Наций"
 FRW_league_of_nations_desc:0 "Париж возлагает надежды на Лигу Наций в Женеве и на коллективные действия против любого агрессора."
 FRW_eastern_alliances:0 "Система восточных союзов"
 FRW_eastern_alliances_desc:0 "На востоке Польша и государства Малой Антанты должны сдерживать Германию."
 FRW_mediterranean_policy:0 "Средиземноморская политика"
 FRW_mediterranean_policy_desc:0 "Переговоры с Римом, Мадридом и Анкарой призваны сохранить спокойствие в Средиземноморье и открытыми морские пути в Африку."
 FRW_belgian_alliance:0 "Союз с Бельгией"
 FRW_belgian_alliance_desc:0 "Старый путь вторжения во Францию лежит через Бельгию. Её оборона считается делом Франции."
 FRW_franco_polish_pact:0 "Франко-польский договор"
 FRW_franco_polish_pact_desc:0 "Союз 1921 года возобновлён и дополнен новыми военными статьями. Продвижение Германии на восток означало бы для неё войну на два фронта."
 FRW_franco_soviet_pact:0 "Франко-советский договор"
 FRW_franco_soviet_pact_desc:0 "Договор о взаимной помощи, подписанный в 1935 году, наконец подкреплён штабными переговорами и практическими обязательствами."
 FRW_franco_soviet_pact_tt:0 "Подписывает §Yпакт о ненападении§! с §YСоветским Союзом§!."
 FRW_turkish_friendship:0 "Дружба с Турцией"
 FRW_turkish_friendship_desc:0 "Передача Александреттского санджака Турции обеспечивает благосклонность Анкары."
 FRW_turkish_friendship_tt:0 "§YХатай§! передаётся §YТурции§! (если принадлежит Франции или Французской Сирии)."
 FRW_swiss_talks:0 "Переговоры с Берном"
 FRW_swiss_talks_desc:0 "Париж начинает переговоры с Берном, чтобы ни одна армия не смогла обойти французскую оборону через швейцарскую территорию."
 FRW_balkan_guarantees:0 "Поддержать Балканский пакт"
 FRW_balkan_guarantees_desc:0 "Гарантии Греции и Турции замыкают кольцо французских союзов на юго-востоке."
 FRW_arms_exports:0 "Экспорт оружия"
 FRW_arms_exports_desc:0 "Заказы на французские винтовки, орудия и самолёты поступают от множества иностранных правительств."
 FRW_deuxieme_bureau:0 "Второе бюро"
 FRW_deuxieme_bureau_desc:0 "Военная разведка получает больше сотрудников и средств. С 1931 года капитан Бертран передаёт польскому шифровальному бюро документы об «Энигме», купленные у немецкого осведомителя."
 FRW_american_credits:0 "Американские кредиты"
 FRW_american_credits_desc:0 "Займы и производственные лицензии из Вашингтона ускоряют перевооружение Франции."
 FRW_vatican_concordat:0 "Примирение с Ватиканом"
 FRW_vatican_concordat_desc:0 "Конкордат со Святым Престолом кладёт конец долгой распре между Республикой и Церковью."
 FRW_rhineland_response:0 "Ответ на рейнский переворот"
 FRW_rhineland_response_desc:0 "В марте 1936 года Гитлер сделал ставку на то, что Франция не шелохнётся, и выиграл. На следующее нарушение договоров Франция ответит не только протестами, но и войсками."
 FRW_collective_security:0 "Коллективная безопасность"
 FRW_collective_security_desc:0 "Париж призывает все правительства, опасающиеся агрессии, встать вместе с Францией в общий фронт."
 FRW_collective_security_tt:0 "Демократическая Франция, не состоящая во фракции, основывает §YКоллективную безопасность§!."
 FRW_diplomatic_shield:0 "Дипломатический щит"
 FRW_diplomatic_shield_desc:0 "Любое государство, напавшее на Францию, повсюду будет считаться агрессором."
 FRW_great_power_status:0 "Великая нация"
 FRW_great_power_status_desc:0 "Армия перевооружена, восточные союзы восстановлены, и ни один европейский вопрос больше не решается без Кэ д'Орсе."
 FRW_empire_colonial:0 "Колониальная империя"
 FRW_empire_colonial_desc:0 "Франции принадлежит вторая по величине колониальная империя в мире, и её люди и ресурсы — крупнейший резерв страны."
 FRW_ministry_of_colonies:0 "Министерство колоний"
 FRW_ministry_of_colonies_desc:0 "Министерство колоний на улице Удино реорганизовано. Место авантюристов и спекулянтов занимают подготовленные губернаторы, инженеры и врачи."
 FRW_african_development:0 "Развитие Северной Африки"
 FRW_african_development_desc:0 "В Алжире, Оране и Касабланке строятся электростанции, портовые сооружения и заводы, превращая Северную Африку в промышленную базу империи."
 FRW_colonial_purchases:0 "Колониальные приобретения"
 FRW_colonial_purchases_desc:0 "Некоторые территории можно получить за деньги. Испании, Португалии, Бельгии, Великобритании и Италии принадлежат земли, которые дополнили бы Французскую Африку."
 FRW_aof_federation:0 "Федерация Французской Западной Африки"
 FRW_aof_federation_desc:0 "Колонии Французской Западной Африки управляются из Дакара как единая федерация."
 FRW_trans_saharan_railway:0 "Транссахарская железная дорога"
 FRW_trans_saharan_railway_desc:0 "Начинается строительство железной дороги через Сахару от Алжира до Нигера, которая свяжет Северную и Западную Африку."
 FRW_saharan_oil:0 "Нефть Сахары"
 FRW_saharan_oil_desc:0 "Геологи полагают, что под Алжирской Сахарой залегают крупные месторождения нефти, и на юг отправляются разведочные партии."
 FRW_tonkin_industry:0 "Промышленность Тонкина"
 FRW_tonkin_industry_desc:0 "Япония смотрит на юг. Гарнизон Индокитая усилен. Угольные шахты и рабочая сила Тонкина поставлены на службу местной промышленности."
 FRW_moroccan_question:0 "Наследие Лиотэ"
 FRW_moroccan_question_desc:0 "Маршал Лиотэ построил марокканский протекторат на уважении к султану, а также на дорогах, портах и школах. Его преемникам предстоит завершить это дело."
 FRW_moroccan_question_tt:0 "Марокканские регионы: подчинение §G+10%§!."
 FRW_liberia_protectorate:0 "Протекторат над Либерией"
 FRW_liberia_protectorate_desc:0 "Либерия погрязла в долгах. Франция предлагает ей кредиты и покровительство."
 FRW_dakar_naval_base:0 "Военно-морская база в Дакаре"
 FRW_dakar_naval_base_desc:0 "Из Дакара флот может контролировать атлантический пролив между Африкой и Южной Америкой."
 FRW_dakar_naval_base_tt:0 "§G+1§! верфь и ячейка строительства в прибрежном регионе Африки."
 FRW_mauritanian_iron:0 "Железная руда Мавритании"
 FRW_mauritanian_iron_desc:0 "Изыскания подтверждают, что гора Кедиет-эдж-Джиль близ Зуэрата почти целиком состоит из железной руды. Железная дорога к побережью доставит её к французским домнам."
 FRW_pacific_bases:0 "Тихоокеанские базы"
 FRW_pacific_bases_desc:0 "Новые аэродромы в Индокитае прикрывают азиатские владения империи."
 FRW_libyan_question:0 "Сахарская граница"
 FRW_libyan_question_desc:0 "От Тиндуфа до Феццана пустынную границу охраняет горстка мехаристов. Африканская армия просит форты, аэродромы и колодцы."
 FRW_colonial_development_fund:0 "Колониальный инвестиционный фонд"
 FRW_colonial_development_fund_desc:0 "Создаётся государственный фонд для финансирования дорог, железных дорог и портов в Африке."
 FRW_colonial_development_fund_tt:0 "§G+1§! гражданский завод и ячейка строительства в регионе Африки."
 FRW_algerian_departments:0 "Алжир — это Франция"
 FRW_algerian_departments_desc:0 "С 1848 года Алжир разделён на департаменты, и Париж считает его частью самой Франции."
 FRW_djibouti_railway:0 "Железная дорога Джибути — Аддис-Абеба"
 FRW_djibouti_railway_desc:0 "Французская железная дорога от Джибути до Аддис-Абебы — единственный выход Эфиопии к морю."
 FRW_indochina_rubber:0 "Каучук из Индокитая"
 FRW_indochina_rubber_desc:0 "Каучук с плантаций «Мишлен» в Индокитае резервируется для армии."
 FRW_levant_mandates:0 "Интеграция подмандатного Леванта"
 FRW_levant_mandates_desc:0 "Сирия и Ливан переходят под прямое французское управление."
 FRW_levant_mandates_tt:0 "Аннексирует французские подмандатные территории §YСирию§! и §YЛиван§!, если они являются марионетками Франции. Если Франция уже напрямую управляет Левантом (например, в Road to 56), она просто получает бонус к управлению."
 FRW_eurafrique:0 "Еврафрика"
 FRW_eurafrique_desc:0 "Парижские плановики предлагают единое экономическое пространство, объединяющее Европу и Африку во главе с Францией."
 FRW_colonial_war_production:0 "Военное производство в империи"
 FRW_colonial_war_production_desc:0 "Заводы, построенные в Африке, недосягаемы для вражеских бомбардировщиков."
 FRW_imperial_preference:0 "Имперские преференции"
 FRW_imperial_preference_desc:0 "Пошлины внутри империи снижаются, а на её границах растут. Колониальный хлопок, каучук и руда в первую очередь идут на французские заводы."
 FRW_madagascar_development:0 "Развитие Мадагаскара"
 FRW_madagascar_development_desc:0 "Мадагаскар получает новые порты и дороги."
 FRW_national_cohesion:0 "Национальное единство"
 FRW_national_cohesion_desc:0 "Со времени беспорядков 6 февраля 1934 года правые и левые готовы вцепиться друг другу в горло."
 FRW_end_political_violence:0 "Роспуск лиг"
 FRW_end_political_violence_desc:0 "«Огненные кресты», «Королевские молодчики» и левые милиции распущены, их оружие изъято. Порядок на улицах отныне поддерживает полиция."
 FRW_radio_propaganda:0 "Радио Париж"
 FRW_radio_propaganda_desc:0 "«Радио-Пари» и региональные станции несут слово правительства в дома, кафе и казармы по всей стране."
 FRW_code_de_la_famille:0 "Семейный кодекс"
 FRW_code_de_la_famille_desc:0 "Семейный кодекс 1939 года предусматривает пособия и льготы для повышения низкой рождаемости во Франции."
 FRW_civil_defence:0 "Гражданская оборона"
 FRW_civil_defence_desc:0 "Города роют бомбоубежища и проводят учения по светомаскировке."
 FRW_mobilization_laws:0 "Закон об организации нации в военное время"
 FRW_mobilization_laws_desc:0 "Закон от июля 1938 года об организации нации в военное время определяет порядок мобилизации людей и промышленности."
 FRW_rural_modernization:0 "Модернизация сельского хозяйства"
 FRW_rural_modernization_desc:0 "Тракторы и удобрения приходят в хозяйства, высвобождая рабочие руки для заводов."
 FRW_national_service:0 "Всеобщая трудовая повинность"
 FRW_national_service_desc:0 "Обязанности возлагаются не только на солдат, но и на гражданских — на фронте или на военных заводах."
 FRW_women_in_industry:0 "Женщины в промышленности"
 FRW_women_in_industry_desc:0 "Как и в 1914 году, женщины берут на себя значительную часть работы на заводах."
 FRW_union_sacree:0 "Священное единение"
 FRW_union_sacree_desc:0 "В августе 1914 года партии отложили свои распри до конца войны. Теперь правительство просит рабочих и предпринимателей, католиков и антиклерикалов поступить так же."
 FRW_secret_captain:0 "Капитан из Сен-Мало"
 FRW_secret_captain_desc:0 "Письмо из Женевы лежит на столе в опустевшем министерстве. Его автор, бретонский морской капитан с польской кровью и состоянием сомнительного происхождения, просит лишь об одном — чтобы за ним послали. Он прибывает с единственным чемоданом, саблей польского офицера и чёрным флагом, сложенным на самом дне сундука. Больше никто не предложил взять на себя управление Францией."
 FRW_secret_captain_tt:0 "§YМало Керваде§! становится лидером Франции.\nФранция и §YПольша§! сближаются.\nОткрывается скрытый путь: §YБереговое братство§!, §YОстрова§! и §YИберия§!."
 FRW_brethren_of_the_coast:0 "Береговое братство"
 FRW_brethren_of_the_coast_desc:0 "В тавернах Сен-Мало, Бреста и Тулона люди капитана подписывают старые статьи Берегового братства: доля в каждом призе, голос при выборе каждого капитана, пенсия за каждое ранение. У вербовочных пунктов флота выстраиваются очереди добровольцев."
 FRW_shipyards_of_saint_malo:0 "Верфи Сен-Мало"
 FRW_shipyards_of_saint_malo_desc:0 "Старый корсарский порт вновь строит — фрегаты, грузовые суда и заводы для их снабжения."
 FRW_sea_wolves:0 "Морские волки"
 FRW_sea_wolves_desc:0 "Быстрые рейдеры и подводные лодки дальнего действия выходят в засаду на морских путях. Капитан хочет, чтобы каждый торговый шкипер Европы то и дело оглядывался через плечо."
 FRW_corsair_economy:0 "Призовая экономика"
 FRW_corsair_economy_desc:0 "Золото, корабли и грузы, захваченные на море, превращаются в сталь и станки на суше. Призовые суды Сен-Мало заседают днём и ночью."
 FRW_privateer_squadrons:0 "Каперские эскадры"
 FRW_privateer_squadrons_desc:0 "Каждый судовладелец Бретани и Нормандии может вооружить свои суда по французскому каперскому свидетельству. Государство платит за орудия, а владельцы оставляют себе половину добычи."
 FRW_boarding_parties:0 "Абордажные команды"
 FRW_boarding_parties_desc:0 "Морские пехотинцы, обученные внезапно захватывать корабль или гавань: абордажные крючья, пистолеты-пулемёты и никаких лишних вопросов."
 FRW_new_tortuga:0 "Новая Тортуга"
 FRW_new_tortuga_desc:0 "Сен-Мало объявлен вольным портом без пошлин и досмотров. Любой груз в Европе, которому нужно обойти блокаду, может пройти через гавань капитана за плату."
 FRW_black_admiralty:0 "Чёрное адмиралтейство"
 FRW_black_admiralty_desc:0 "Старых адмиралов отправляют в отставку, и на мостики флота поднимаются люди капитана. Ле Гофф, Морван и Дюрок ходили под флагами, которых нет ни в одном военно-морском списке."
 FRW_black_admiralty_tt:0 "Во флот вступают три новых адмирала: §YЯн Ле Гофф§! (Морской волк), §YКорантен Морван§! (Прорыватель блокады) и §YАнатоль Дюрок§! (Железный борт)."
 FRW_jolly_roger:0 "Под «Весёлым Роджером»"
 FRW_jolly_roger_desc:0 "Чёрный флаг развевается на грот-мачте флагмана. Флот сражается так же, как корсары Сен-Мало: сам выбирает добычу и оставляет приз себе."
 FRW_letters_of_marque:0 "Каперские свидетельства"
 FRW_letters_of_marque_desc:0 "Корсары Сен-Мало всегда сражались ради наживы не меньше, чем ради славы. Каждый побеждённый враг и каждая страна под защитой будут пополнять военную казну капитана, а каждый остров, господствующий над морским путём, станет достойным призом."
 FRW_letters_of_marque_tt:0 "Открывает решение §YЗахватить казну§!: забрать золотой запас любой страны, которая является §Yсателлитом Франции§! или §Yкапитулировала§! в войне с Францией.\nФранция получает §G+75§! политической власти, гражданский завод и §YКорсарское золото§! (180 дней); жертва получает §RРазграбленную казну§! (365 дней). Каждую страну можно грабить раз в год."
 FRW_isles_balearics:0 "Набег на Балеары"
 FRW_isles_balearics_desc:0 "Майорка и Менорка лежат на каждом пути из Марселя в Гибралтар. Капитан намерен поставить свои фрегаты на якорь в Порт-Маоне, где французские корабли в последний раз несли лилии в 1756 году."
 FRW_isles_balearics_tt:0 "§YПретензии§! на §YБалеарские острова§! и §Yповод для войны§! против их владельца — Испании."
 FRW_isles_fortunate:0 "Счастливые острова"
 FRW_isles_fortunate_desc:0 "Канары и Мадейра стерегут путь в Африку и Америку. Корсары прошлого захватывали их ради вина и сахара; капитану нужны их гавани."
 FRW_isles_fortunate_tt:0 "§YПретензии§! на §YКанарские острова§! и §YМадейру§!, а также §Yповоды для войны§! против их владельцев (Испания, Португалия)."
 FRW_isles_keys_med:0 "Ключи от Средиземноморья"
 FRW_isles_keys_med_desc:0 "Мальта и Гибралтар — два замка внутреннего моря, и оба ключа держит Королевский флот. Капитан никогда не боялся Королевского флота."
 FRW_isles_keys_med_tt:0 "§YПретензии§! на §YМальту§! и §YГибралтар§! и §Yповод для войны§! против Великобритании."
 FRW_isles_azores:0 "Атлантические острова"
 FRW_isles_azores_desc:0 "Азорские острова, острова Зелёного Мыса и Сан-Томе позволили бы французскому флоту пересечь Атлантику, ни у кого не прося угля."
 FRW_isles_azores_tt:0 "§YПретензии§! на §YАзорские острова§!, §YКабо-Верде§! и §YСан-Томе§! и §Yповод для войны§! против Португалии."
 FRW_isles_spanish_main:0 "Испанский Мэйн"
 FRW_isles_spanish_main_desc:0 "Тортуга, Порт-Ройал, Нассау: Карибское море было королевством Берегового братства. Капитан отправляет свои корабли обратно в старые охотничьи угодья на Ямайке, Багамах, Тринидаде, Кюрасао и островах между ними."
 FRW_isles_spanish_main_tt:0 "§YПретензии§! на острова Карибского моря и §Yповоды для войны§! против их владельцев:\n- §YВеликобритания§!: Ямайка, Багамские острова, Тринидад, Наветренные острова, Бермуды\n- §YНидерланды§!: Кюрасао\n- §YГаити§!, §YДоминиканская Республика§! и §YКуба§!"
 FRW_isles_libertalia:0 "Либерталия"
 FRW_isles_libertalia_desc:0 "Легенда гласит, что пираты Индийского океана некогда основали на побережье Мадагаскара вольную республику. Капитан намерен сделать легенду явью, начав с Маврикия и Сейшельских островов."
 FRW_isles_libertalia_tt:0 "§YПретензии§! на §YМаврикий§! и §YСейшельские острова§! и §Yповод для войны§! против Великобритании.\n§YМадагаскар§!, §YРеюньон§! и §YКоморские острова§! (если они французские): §G+10%§! к подчинению."
 FRW_isles_north:0 "Северные острова"
 FRW_isles_north_desc:0 "Шетландские и Фарерские острова и Исландия запирают Северную Атлантику, словно ворота. Тот, кто владеет ими, может задушить конвои трёх держав."
 FRW_isles_north_tt:0 "§YПретензии§! на §YШетландские острова§!, §YФарерские острова§! и §YИсландию§! и §Yповоды для войны§! против их владельцев (Великобритания, Дания, Исландия)."
 FRW_isles_republic:0 "Республика островов"
 FRW_isles_republic_desc:0 "От Балеар до Сейшел острова капитана управляются как единая вольная федерация портов. Они не платят налогов Парижу, а вместо этого поставляют корабли и моряков."
 FRW_isles_republic_tt:0 "§GНациональные территории§! на каждом принадлежащем Франции острове из числа Балеарских, Канарских островов, Мадейры, Азорских островов, Кабо-Верде, Сан-Томе, Мальты, Гибралтара, островов Карибского моря, Маврикия, Сейшельских, Шетландских и Фарерских островов."
 FRW_iberian_ambitions:0 "Иберийский вопрос"
 FRW_iberian_ambitions_desc:0 "За Пиренеями Испания скатывается к гражданской войне. Контроль над полуостровом дал бы капитану западный вход в Средиземное море и лучшие гавани Атлантики."
 FRW_intervene_in_spain:0 "Вмешаться в Испании"
 FRW_intervene_in_spain_desc:0 "Испанцы убивают друг друга. Франция намерена вмешаться и закончить войну на своих условиях, какая бы фракция ни встала у неё на пути."
 FRW_intervene_in_spain_tt:0 "Повод для войны §Yаннексия§! против §Yкаждой стороны§! гражданской войны в Испании, не состоящей в союзе с Францией."
 FRW_spanish_protectorate:0 "Протекторат над Испанией"
 FRW_spanish_protectorate_desc:0 "Была гражданская война или нет, Испания слаба, а Париж близко. Предлагается французский протекторат."
 FRW_one_iberia:0 "Единая Иберия под властью Франции"
 FRW_one_iberia_desc:0 "Пушки умолкли. То, что осталось от Испании, перейдёт к Франции — по договору, если возможно, и силой, если нет."
 FRW_one_iberia_tt:0 "Каждое испанское государство, уже являющееся §Yсателлитом Франции§!, §Yполностью аннексируется§! вместе с армией.\nПротив каждой §Yнезависимой§! Испании Франция вместо этого получает §Yповод для войны§!.\nЕсли Испании больше не существует, этот фокус пропускается."
 FRW_portuguese_question:0 "Португальский вопрос"
 FRW_portuguese_question_desc:0 "Лиссабон теперь изолирован на краю французского полуострова. Французские дивизии на границе придают вес доводам французских дипломатов."
 FRW_portuguese_question_tt:0 "§YПортугалия§! должна решить: мирно присоединиться к Франции или столкнуться с войной.\nЧем сильнее французская армия по сравнению с португальской, тем вероятнее, что Лиссабон уступит. Если Португалия откажется, Франция получит повод для войны §Yаннексия§!."
 FRW_raise_the_black_flag:0 "Королевство Франкия"
 FRW_raise_the_black_flag_desc:0 "Капитан из Сен-Мало объединяет Францию и Иберию под одним знаменем с лилиями Франции и горностаем Бретани. Пока он зовёт его королевством, а для своего сына — вечным."
 FRW_raise_the_black_flag_tt:0 "Провозглашает §YКоролевство Франкия§!, предшественника Вечного королевства, со знаменем из лилий и бретонского горностая, §YКорсарским флагом§! (+15% к атаке и защите на национальной территории) и §Gнациональными территориями на землях Испании и Португалии§!, принадлежащих Франции (а также на тех, что она получит там позднее), и §Yпретензиями§! на остальные.\nЗаменяет любое государство, сформированное Францией ранее (его национальный дух удаляется). Если Франция уже является §YВечным королевством Франкия§!, она им и остаётся."
 FRW_iberian_cores:0 "Один полуостров — одна нация"
 FRW_iberian_cores_desc:0 "От Кале до Кадиса и от Бреста до Лиссабона эти земли будут управляться как единая нация."
 FRW_iberian_cores_tt:0 "§GНациональные территории§! во всех принадлежащих регионах, являющихся национальной территорией §YИспании§! или §YПортугалии§!, и подчинение там §G+15%§!."
 FRW_asturian_steel:0 "Астурийский уголь и андалусская руда"
 FRW_asturian_steel_desc:0 "Шахты и домны Астурии и старые медные рудники Рио-Тинто теперь работают на Францию."
 FRW_catalan_industry:0 "Фабрики Барселоны"
 FRW_catalan_industry_desc:0 "Каталония была мастерской Испании, и теперь её фабрики и заводы служат нуждам Франции на юге."
 FRW_port_of_lisbon:0 "Порт Лиссабона"
 FRW_port_of_lisbon_desc:0 "Лиссабонская гавань, одна из лучших на Атлантике, становится домом Атлантической эскадры капитана."
 FRW_iberian_arsenal:0 "Иберийский арсенал"
 FRW_iberian_arsenal_desc:0 "Арсеналы Мадрида и Бургоса выпускают винтовки, орудия и танки для имперских армий."
 FRW_eternal_kingdom:0 "Вечное королевство Франкия"
 FRW_eternal_kingdom_desc:0 "От Альп до Гибралтара, от Бреста до Хайленда и от Карибского моря до Индийского океана старая корона восстановлена под властью адмирала, не проигравшего ни одного морского сражения. Франция становится Вечным королевством Франкия."
 FRW_eternal_kingdom_tt:0 "Образует §YВечное королевство Франкия§!: новый флаг, тёмно-синий цвет на карте, национальный дух §YВечное королевство§! и §Gнациональные территории на землях Испании, Португалии и шотландских островов§!, принадлежащих Франции (а также на тех, что она получит там позднее), и §Yпретензии§! на остальные.\nЗаменяет любое ранее образованное государство – и само никогда не может быть заменено.\nМало Керваде умирает в начале этого фокуса; его сын §YЭмерик Керваде§! коронуется по его завершении."
 FRW_appeal_of_18_june:0 "Призыв 18 июня"
 FRW_appeal_of_18_june_desc:0 "«Франция проиграла сражение, но Франция не проиграла войну». Из Лондона малоизвестный генерал призывает каждого француза продолжать борьбу."
 FRW_appeal_of_18_june_tt:0 "Эта ветка появляется, как только Франция §Yкапитулировала§! или утратила контроль над §YПарижем§!, — даже если мир уже подписан. Её фокусы можно брать и после капитуляции.\nПрестиж Свободной Франции начинается с §Y20§! из 100, и становятся доступны решения §YСвободная Франция§!. Удаляет §YПораженчество§!."
 FRW_continue_the_fight:0 "Продолжить борьбу"
 FRW_continue_the_fight_desc:0 "Перемирие, подписанное в Бордо, никого в Лондоне ни к чему не обязывает. Свободные французы заявляют, что война продолжается."
 FRW_continue_the_fight_tt:0 "Франция вновь объявляет войну тому, кто владеет §YПарижем§! (если она больше не воюет с ним), и вступает во фракцию §YВеликобритании§! (если Великобритания её возглавляет).\nПрестиж Свободной Франции: §G+5§!"
 FRW_free_french_forces:0 "Силы Свободной Франции"
 FRW_free_french_forces_desc:0 "Легионеры, вернувшиеся из Нарвика, моряки, бежавшие из Бреста, и колониальные стрелки из Чада составляют ядро новой армии."
 FRW_free_french_forces_tt:0 "§G+2§! военных завода в изгнании (британские и колониальные мастерские).\nПрестиж Свободной Франции: §G+5§!"
 FRW_rally_the_colonies:0 "Сплотить колонии"
 FRW_rally_the_colonies_desc:0 "В августе 1940 года Чад, Камерун и Среднее Конго высказались в поддержку де Голля. Остальным губернаторам предлагается последовать их примеру."
 FRW_rally_the_colonies_tt:0 "§YПретензии§! на каждую французскую колонию в Африке, которой владеет кто-то другой, и §Yповод для войны§! против каждой страны (вне фракции Франции), которая владеет такой колонией.\nПрестиж Свободной Франции: §G+10§!"
 FRW_lend_lease:0 "Помощь из Вашингтона"
 FRW_lend_lease_desc:0 "Ленд-лиз Рузвельта доходит до Свободных французов через Великобританию: винтовки, грузовики и обмундирование."
 FRW_lend_lease_tt:0 "§G+3§! военных завода в изгнании (американское производство по ленд-лизу)."
 FRW_leclerc_column:0 "Колонна Леклерка"
 FRW_leclerc_column_desc:0 "В 1941 году Леклерк пересёк Сахару из Чада и взял итальянский форт в Куфре. В оазисе его люди поклялись сражаться, пока флаг не поднимется над Страсбургом."
 FRW_leclerc_column_tt:0 "Претензии на §YФеццан§! и §YСирт§! и повод для войны против §YИталии§! за них.\nПрестиж Свободной Франции: §G+5§!"
 FRW_algiers_capital:0 "Алжир — столица Франции"
 FRW_algiers_capital_desc:0 "Министерства переезжают на виллы над Алжирской бухтой. Пока что Францией управляют отсюда."
 FRW_algiers_capital_tt:0 "§G+2§! гражданских завода в изгнании.\nПереносит столицу в §YАлжир§! (или в §YБраззавиль§!, если Франция не владеет Алжиром)."
 FRW_the_resistance:0 "Сопротивление"
 FRW_the_resistance_desc:0 "Жан Мулен сброшен с парашютом в Провансе, чтобы объединить движения Сопротивления. Железнодорожники, студенты и коммунисты начинают диверсии против оккупантов."
 FRW_brazzaville_conference:0 "Браззавильская конференция"
 FRW_brazzaville_conference_desc:0 "Де Голль обещает колониям новое место во французском сообществе после войны. Взамен Африка даёт ему людей и сырьё."
 FRW_brazzaville_conference_tt:0 "Каждый принадлежащий регион в §YАфрике§!: подчинение §G+10%§!.\nПрестиж Свободной Франции: §G+10§!"
 FRW_mobilise_the_empire:0 "Мобилизовать империю"
 FRW_mobilise_the_empire_desc:0 "В Касабланке и Дакаре наспех создаются заводы, а железные дороги Магриба работают днём и ночью."
 FRW_mobilise_the_empire_tt:0 "§G+2§! военных завода в изгнании."
 FRW_army_of_africa_marches:0 "Африканская армия выступает"
 FRW_army_of_africa_marches_desc:0 "Перевооружённая американцами после Туниса, Африканская армия нужна в Италии и Провансе."
 FRW_eurafrican_federation_focus:0 "Еврафриканская федерация"
 FRW_eurafrican_federation_focus_desc:0 "Пока Париж оккупирован, империя и есть Франция. Алжир предлагает объединить Европу и Африку в одну федерацию — на время войны, а может быть, и дольше."
 FRW_eurafrican_federation_focus_tt:0 "Необязательно — исключает §YВременное правительство§!.\nОбразует §YЕврафриканскую федерацию§!: новое название и флаг, национальный дух и §Gнациональные территории во Французской Северной Африке, Дакаре и заморских департаментах§!, принадлежащих Франции (в том числе позднее), и §Yпретензии§! на остальные из них.\nЗаменяет любое государство, сформированное Францией ранее (его национальный дух удаляется). Если Франция уже является §YВечным королевством Франкия§!, она им и остаётся.\nТребуется контроль над столицей в Африке — §YАлжиром§!, §YДакаром§!, §YБраззавилем§! или §YЧадом§! (присоедините их с помощью решений §YСвободной Франции§!). Если Франция пока не владеет ни одной из них, государство будет основано автоматически, как только это произойдёт."
 FRW_provisional_government:0 "Временное правительство"
 FRW_provisional_government_desc:0 "Свободные французы формируют Временное правительство Французской Республики. Оно обещает выборы и новую конституцию, как только страна будет освобождена."
 FRW_provisional_government_tt:0 "Необязательно – исключает §YЕврафриканскую федерацию§!. Франция остаётся Францией и сохраняет Республику."
 FRW_liberation_of_paris:0 "Освобождение Парижа"
 FRW_liberation_of_paris_desc:0 "Впервые за четыре года звонят колокола Нотр-Дама. Правительство возвращается в столицу."
 FRW_liberation_of_paris_tt:0 "Французские внутренние силы вливаются в армию: §G+50 000§! людских ресурсов.\nТребуется контроль над §YПарижем§!. Париж снова становится французским, и столица возвращается туда."
 FRW_ff_chequers:0 "Соглашение в Чекерсе"
 FRW_ff_chequers_desc:0 "Черчилль и де Голль подписывают соглашение: Великобритания будет финансировать, вооружать и снабжать Свободных французов, а Франция сохранит независимость командования."
 FRW_ff_chequers_tt:0 "§G+1§! военный завод в изгнании.\nПрестиж Свободной Франции: §G+5§!"
 FRW_ff_national_committee:0 "Французский национальный комитет"
 FRW_ff_national_committee_desc:0 "В Лондоне разрозненные службы Свободной Франции превращаются в настоящее правительство с комиссарами по военным делам, финансам, иностранным делам и колониям."
 FRW_ff_national_committee_tt:0 "Престиж Свободной Франции: §G+5§!"
 FRW_ff_bcra:0 "BCRA"
 FRW_ff_bcra_desc:0 "Полковник Пасси создаёт Центральное бюро разведки и действия (BCRA). Его агенты руководят сетями от Бретани до Марселя."
 FRW_ff_cnr:0 "Национальный совет Сопротивления"
 FRW_ff_cnr_desc:0 "В квартире на улице Фур движения, партии и профсоюзы Сопротивления впервые собираются под единым руководством."
 FRW_ff_cnr_tt:0 "Все оккупированные французские области в Европе: сопротивление §G+15§!.\nПрестиж Свободной Франции: §G+10§!"
 FRW_ff_first_division:0 "1-я дивизия Свободной Франции"
 FRW_ff_first_division_desc:0 "Легионеры, морские пехотинцы, колониальная пехота и добровольцы со всех концов империи сводятся в единую дивизию."
 FRW_ff_bir_hakeim:0 "Бир-Хакейм"
 FRW_ff_bir_hakeim_desc:0 "Шестнадцать дней бригада Кёнига удерживает разрушенный форт в Ливийской пустыне против танков Роммеля. Мир узнаёт, что французы снова сражаются."
 FRW_ff_bir_hakeim_tt:0 "Престиж Свободной Франции: §G+5§!"
 FRW_ff_second_armoured:0 "2-я бронетанковая дивизия"
 FRW_ff_second_armoured_desc:0 "Ветераны пустыни Леклерка получают в Марокко новое снаряжение: американские «Шерманы» и полугусеничные машины."
 FRW_ff_fafl:0 "Военно-воздушные силы Свободной Франции"
 FRW_ff_fafl_desc:0 "Несколько сотен лётчиков и механиков, бежавших из Франции, летают вместе с Королевскими ВВС под собственными опознавательными знаками."
 FRW_ff_groupe_lorraine:0 "Группа «Лотарингия»"
 FRW_ff_groupe_lorraine_desc:0 "Французские экипажи бомбардировщиков, подготовленные в Британии и Сирии, формируют собственную группу и летают на «Бостонах» против целей во Франции и Нидерландах."
 FRW_ff_normandie_niemen:0 "«Нормандия — Неман»"
 FRW_ff_normandie_niemen_desc:0 "Эскадрилья французских лётчиков-истребителей отправляется сражаться на Восточный фронт, летая на советских «Яках» против люфтваффе."
 FRW_ff_fnfl:0 "Военно-морские силы Свободной Франции"
 FRW_ff_fnfl_desc:0 "Адмирал Мюзелье собирает корабли, ушедшие в британские порты, — от подводной лодки «Сюркуф» до горстки траулеров."
 FRW_ff_corvettes:0 "Корветы из Британии"
 FRW_ff_corvettes_desc:0 "Адмиралтейство передаёт флоту Свободной Франции корветы типа «Флауэр». Они сопровождают атлантические конвои."
 FRW_ff_corvettes_tt:0 "§G+1§! верфь в изгнании."
 FRW_ff_richelieu:0 "«Ришелье» возвращается в строй"
 FRW_ff_richelieu_desc:0 "Великий линкор, стоявший повреждённым в Дакаре, уходит на ремонт в Нью-Йорк и возвращается на войну под триколором."
 FRW_ff_richelieu_tt:0 "§G+2§! верфи в изгнании (американские верфи)."
 FRW_ff_maquis:0 "Маки"
 FRW_ff_maquis_desc:0 "Молодые люди, спасающиеся от принудительных работ в Германии, уходят в горы Веркора, Лимузена и Альп, где Сопротивление вооружает и обучает их."
 FRW_ff_maquis_tt:0 "Все оккупированные французские области в Европе: сопротивление §G+10§!.\nПрестиж Свободной Франции: §G+5§!"
 FRW_ff_colonial_recruitment:0 "Вербовка в колониях"
 FRW_ff_colonial_recruitment_desc:0 "От Дакара до Мадагаскара открываются вербовочные пункты. Тиральеры, гумьеры и спаги составят половину армии, которая освободит Францию."
 FRW_ff_cfln:0 "Французский комитет национального освобождения"
 FRW_ff_cfln_desc:0 "В июне 1943 года в Алжире Свободные французы де Голля и Африканская армия Жиро объединяются под руководством единого комитета, а их войска сливаются в одну армию."
 FRW_ff_cfln_tt:0 "Престиж Свободной Франции: §G+10§!"
 FRW_ff_consultative_assembly:0 "Консультативная ассамблея"
 FRW_ff_consultative_assembly_desc:0 "В ноябре 1943 года в Алжире собираются делегаты Сопротивления, партий и старого парламента. Это первое с 1940 года собрание, говорящее от имени Франции, хотя его члены назначены, а не избраны."
 FRW_ff_cef:0 "Французский экспедиционный корпус"
 FRW_ff_cef_desc:0 "Корпус генерала Жюэна из горных войск и колониальных дивизий прорывает немецкую линию в горах Италии там, где другие потерпели неудачу."
 FRW_ff_dragoon:0 "Высадка в Провансе"
 FRW_ff_dragoon_desc:0 "Двести тысяч французских солдат высаживаются между Тулоном и Сен-Рафаэлем и наступают вверх по долине Роны к Лиону и Вогезам."
 FRW_ff_epuration:0 "Чистка"
 FRW_ff_epuration_desc:0 "Особые суды в каждом департаменте судят обвиняемых в коллаборационизме."
 FRW_ff_votes_for_women:0 "Избирательное право для женщин"
 FRW_ff_votes_for_women_desc:0 "По Алжирскому ордонансу апреля 1944 года француженки получают право избирать и быть избранными."
 FRW_ff_securite_sociale:0 "Социальное обеспечение"
 FRW_ff_securite_sociale_desc:0 "В соответствии с программой Сопротивления каждый работник застрахован на случай болезни, старости и несчастных случаев на производстве."
 FRW_ff_securite_sociale_tt:0 "Инфляция: §R+5§!"
 FRW_ff_reconstruction:0 "Восстановление Франции"
 FRW_ff_reconstruction_desc:0 "Мосты, железные дороги, порты и целые города лежат в руинах. Министерство восстановления берётся за работу."
 FRW_ff_reconstruction_tt:0 "Инфляция: §R+10§! (восстановление оплачивается в кредит)."
 FRW_ff_fourth_republic:0 "Четвёртая республика"
 FRW_ff_fourth_republic_desc:0 "Новая конституция одобрена на референдуме. Временное правительство передаёт власть избранному Собранию."
 FRW_ff_fourth_republic_tt:0 "Требуется §YВременное правительство§!."
 FRW_ff_eurafrican_assembly:0 "Еврафриканская ассамблея"
 FRW_ff_eurafrican_assembly_desc:0 "Депутаты из Дакара, Алжира, Браззавиля и Парижа впервые заседают вместе в одном собрании."
 FRW_ff_eurafrican_assembly_tt:0 "Требуется §YЕврафриканская федерация§!.\nВсе принадлежащие области в §YАфрике§!: §G+10%§! к подчинению."
 FRW_qol_state_reform:0 "Комиссия по государственной реформе"
 FRW_qol_state_reform_desc:0 "Во всех министерствах копятся бумаги, и простой декрет может месяцами проходить через канцелярии Третьей республики. Комиссии высокопоставленных чиновников поручено упростить процедуры."
 FRW_qol_state_reform_tt:0 "Открывает ведомство §YПолитика§! в §YСовете министров§! (решения)."
 FRW_qol_cabinet:0 "Сокращённый кабинет"
 FRW_qol_cabinet_desc:0 "Число министерств сокращено, а их обязанности перераспределены, чтобы Совет министров мог быстрее принимать решения."
 FRW_qol_cabinet_tt:0 "Открывает ведомство §YЭкономика§! в §YСовете министров§!."
 FRW_qol_staff_college:0 "Штабной колледж"
 FRW_qol_staff_college_desc:0 "Высшая военная школа пересматривает свои курсы, чтобы подготовить молодых офицеров к командованию в современной войне."
 FRW_qol_staff_college_tt:0 "Открывает ведомство §YАрмия§! в §YСовете министров§!."
 FRW_qol_logistics:0 "Бюро логистики"
 FRW_qol_logistics_desc:0 "Единое бюро в Париже теперь планирует использование железных дорог, грузовиков и складов снабжения для всей армии."
 FRW_qol_standards:0 "Стандартизированное снаряжение"
 FRW_qol_standards_desc:0 "Оружейным заводам приказано работать по общим стандартам, чтобы винтовки, снаряды и запчасти подходили к снаряжению любого полка."
 FRW_qol_research_council:0 "Высший совет по исследованиям"
 FRW_qol_research_council_desc:0 "При канцелярии председателя Совета министров создан совет учёных по образцу заместительства государственного секретаря по делам научных исследований, которое в 1936 году занимала Ирен Жолио-Кюри."
 FRW_qol_research_council_tt:0 "Открывает ведомство §YИсследования§! в §YСовете министров§!."
 FRW_qol_special_projects:0 "Управление особых проектов"
 FRW_qol_special_projects_desc:0 "Ракеты, реактивные двигатели и атом слишком важны, чтобы оставлять их частным мастерским. Ими займётся управление в Министерстве вооружений."
 FRW_qol_special_projects_tt:0 "Открывает ведомство §YОсобые проекты§! в §YСовете министров§!."
 FRW_qol_deuxieme_bureau:0 "Реорганизация Второго бюро"
 FRW_qol_deuxieme_bureau_desc:0 "Военная разведка и её контрразведывательный отдел получают новые средства, новые помещения и прямую связь с правительством."
 FRW_qol_deuxieme_bureau_tt:0 "Открывает ведомство §YРазведывательное управление§! в §YСовете министров§!."
 FRW_qol_modern_state:0 "Современное государство"
 FRW_qol_modern_state_desc:0 "После многих лет реформ декрет доходит до префектур за недели, а не за месяцы."
 FRW_rhine_question:0 "Рейнский вопрос"
 FRW_rhine_question_desc:0 "Пуанкаре оккупировал Рур в 1923 году и поддержал рейнских сепаратистов, а Саар до 1935 года оставался под управлением Лиги Наций, и его шахты принадлежали французам. Многие в Париже по-прежнему считают, что безопасность Франции зависит от Рейна."
 FRW_demand_the_saar:0 "Потребовать Саар"
 FRW_demand_the_saar_desc:0 "Париж теперь называет плебисцит января 1935 года фарсом, проведённым под нацистским давлением, и требует передать Саар Франции."
 FRW_rhenish_republic:0 "Рейнская республика"
 FRW_rhenish_republic_desc:0 "Сепаратисты 1923 года потерпели неудачу из-за отсутствия поддержки. Теперь Франция намерена дать Рейнланду эту поддержку и поставить его под французский контроль."
 FRW_pyrenees_question:0 "Пиренейский вопрос"
 FRW_pyrenees_question_desc:0 "В Барселоне рабочие ведут ту же борьбу, что и их товарищи в Париже. Красная Франция не собирается повторять политику невмешательства Блюма."
 FRW_demand_catalonia:0 "Каталонская коммуна"
 FRW_demand_catalonia_desc:0 "НКТ и ПОУМ удерживают Барселону. Париж предлагает Каталонии, присоединённой к Франции при Наполеоне в 1812 году, войти во французскую рабочую республику."
 FRW_iberian_protectorate:0 "Советская Иберия"
 FRW_iberian_protectorate_desc:0 "Париж не оставит Испанию Франко. План состоит в том, чтобы превратить весь полуостров в братскую республику, направляемую из Парижа."
 FRW_alpine_question:0 "Альпийский вопрос"
 FRW_alpine_question_desc:0 "В Женеве, Вале и долине Аосты говорят по-французски, а Рим претендует на Ниццу и Савойю. Лиги хотят, чтобы Франция перестала уступать в Альпах и вернула то, что они считают французским."
 FRW_demand_romandy:0 "Потребовать Романдию"
 FRW_demand_romandy_desc:0 "Лиги требуют для Франции Женеву, Лозанну и всю остальную франкоязычную Швейцарию."
 FRW_demand_aosta_nice:0 "Потребовать Пьемонт и Аосту"
 FRW_demand_aosta_nice_desc:0 "Савойская династия получила своё имя от земель на французской стороне Альп. Теперь Париж претендует на Пьемонт и долину Аосты."
 FRW_swiss_anschluss:0 "Союз со Швейцарией"
 FRW_swiss_anschluss_desc:0 "Веками швейцарский нейтралитет держался на горах и ополчении. Париж больше не намерен его уважать."
 FRW_corsica_and_sardinia:0 "Корсика и Сардиния"
 FRW_corsica_and_sardinia_desc:0 "Сардиния лежит всего в нескольких милях к югу от Корсики, по ту сторону пролива Бонифачо. Париж утверждает, что оба острова должны управляться вместе."
 FRW_latin_destiny:0 "Латинская судьба"
 FRW_latin_destiny_desc:0 "Франция, Италия и Испания разделяют наследие Рима. Вместе им принадлежит большая часть побережья западного Средиземноморья, от Гибралтара до Сицилии."
 FRW_latin_destiny_tt:0 "§GНациональные территории§! на §YСардинии§! (если она принадлежит Франции)."
 FRW_rome_accords:0 "Римские соглашения"
 FRW_rome_accords_desc:0 "В январе 1935 года Лаваль и Муссолини уладили свои споры в Африке. Франция уступила Ливии полосу пустыни, а Италия согласилась отказаться от особого статуса своих поселенцев в Тунисе. Ла Рок намерен добиться от Рима соблюдения этой сделки."
 FRW_stresa_front:0 "Возрождённый фронт Стрезы"
 FRW_stresa_front_desc:0 "В апреле 1935 года в Стрезе Франция, Великобритания и Италия выступили единым фронтом, чтобы сохранить независимость Австрии. Ла Рок хочет восстановить этот фронт, сделав Рим первым союзником Франции."
 FRW_stresa_front_tt:0 "Приглашает §YИталию§! во фракцию Франции (если Франция возглавляет фракцию)."
 FRW_latin_naval_pact:0 "Латинский военно-морской пакт"
 FRW_latin_naval_pact_desc:0 "Тулон и Специя согласуют свои планы. Французский флот охраняет западное Средиземноморье, итальянский флот охраняет центральный бассейн и Сицилийский пролив."
 FRW_latin_union:0 "Латинский союз"
 FRW_latin_union_desc:0 "Ла Рок не стремится завоевать своих латинских соседей. Он предлагает Риму и Мадриду таможенный союз и общую оборону от Лиссабона до Триеста во главе с Парижем."
 FRW_latin_union_tt:0 "Союзная §YИталия§! во фракции Франции теперь считается подконтрольной для §YЛатинской империи§! (Испания и Португалия по-прежнему необходимы)."
 FRW_benelux_question:0 "Бургундское наследие"
 FRW_benelux_question_desc:0 "Луиза Орлеанская была первой королевой бельгийцев, а Нидерланды некогда лежали в самом сердце бургундских земель. Король Франции может сослаться на старые права и родственные связи в Брюсселе и Люксембурге."
 FRW_union_with_luxembourg:0 "Союз с Люксембургом"
 FRW_union_with_luxembourg_desc:0 "Зажатое между Францией и Германией великое герцогство вряд ли сможет выстоять в одиночку. Париж предлагает ему союз."
 FRW_demand_wallonia:0 "Потребовать Валлонию"
 FRW_demand_wallonia_desc:0 "Париж требует вернуть Франции франкоязычные провинции южной Бельгии."
 FRW_belgian_union:0 "Союз с Бельгией"
 FRW_belgian_union_desc:0 "С 1795 по 1814 год Бельгия входила в состав Франции. Теперь Брюсселю задают вопрос, не желает ли он снова стать французским."
 FRW_batavian_union:0 "Союз с Нидерландами"
 FRW_batavian_union_desc:0 "В 1810 году Наполеон присоединил Королевство Голландия к Франции. Теперь Париж намерен поступить так же."
 FRW_batavian_union_tt:0 "Если §YНидерланды§! независимы, они получают требование об унии (согласие = аннексия). Если они марионетка Франции, Франция их аннексирует.\nОбразует §YБургундское королевство§!: новое название и флаг, национальный дух и §Gнациональные территории на землях Бельгии, Нидерландов и Люксембурга§!, принадлежащих Франции (а также на тех, что она получит там позднее), и §Yпретензии§! на остальные.\nЗаменяет любое государство, ранее образованное Францией (его национальный дух удаляется). Если Франция уже является §YВечным королевством Франкия§!, она им и остаётся.\nТребуется контроль над всей §YБельгией§!, §YНидерландами§! и §YЛюксембургом§! (аннексированными, а не марионетками). Если Франция ещё не контролирует их, государство будет образовано автоматически, как только это произойдёт."
 FRW_reunions_complete:0 "Бургундское королевство восстановлено"
 FRW_reunions_complete_desc:0 "Старые бургундские земли от Фландрии до Люксембурга вновь объединены под французской короной."
