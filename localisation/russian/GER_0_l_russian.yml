 GER_mefo_bills_category:0 "Векселя MEFO"
 GER_mefo_bills_category_desc:0 "Для финансирования нашей растущей военной промышленности и сохранения этого в тайне от британских и французских глаз мы были вынуждены использовать балансовую единицу для перечисления платежей в виде векселей. Если мы не используем наши политические связи для продления сроков этих векселей, нам придётся их погасить, и мы больше не будем получать их преимущества."
 GER_mefo_bills_mission:0 "Срок векселей MEFO"
 GER_can_delay_mefo_payment:0 "Можно отложить платеж по векселям MEFO."
 GER_mefo_bills_mission_desc:0 "Наши выпущенные векселя скоро подлежат погашению. Мы должны решить, продлевать их или начинать платежи."
 GER_extend_mefo_bills:0 "Векселя MEFO"
 GER_extend_mefo_bills_desc:0 "Продлить срок действия векселей MEFO ещё на 3 месяца, что позволит нам продолжать пользоваться их преимуществами в течение этого времени. Однако это также увеличит стоимость наших будущих платежей."
 GER_extend_mefo_bills_tt:1 "Решить, продлевать ли '§YВекселя MEFO§!' или начинать платежи.\n"
 GER_mefo_bills_mission_tt:1 "Выпустить шестимесячное продление '§YВекселей MEFO§!', которое вступит в силу после истечения срока действия текущей партии векселей MEFO.\n\nСтоимость каждого продления будет постепенно увеличиваться, пока не начнётся война, после чего зависимость от векселей MEFO будет устранена, а платежи будут отложены до окончания войны.\n\n"
 GER_mefo_bills_effect_in_days:1 "Следующее произойдёт через [?Root.days_mission_timeout@GER_mefo_bills_mission|H0] дней:\n"
 GER_mefo_bills_extension_timer:0 "До срока действия векселей MEFO."
 GER_mefo_bills_extension:0 "Менее 60 дней с момента продления векселей MEFO."
 GER_mefo_bills_extended:0 "Продлённые векселя MEFO"
 GER_renew_mefos:0 "Обновить векселя MEFO"
 GER_renew_mefos_desc:0 "Рейхсбанк имеет решающее значение для восстановления и перевооружения нашей нации. Очевидно, что мы ошиблись в решении погасить наши долги, и мы должны продлить векселя MEFO ещё на несколько месяцев."
 GER_cancel_mefos:0 "Отменить векселя MEFO"
 GER_cancel_mefos_desc:0 "Мы слишком долго полагались на Рейхсбанк для восстановления нашей военной промышленности. Пора выполнить наши обязательства по векселям с нашими производителями вооружений и положить конец этой шараде с 'векселями MEFO'."
 GER_case_anton_category:0 "Операция Антон"
 GER_case_anton_category_desc:0 "Цель создания Вишистской Франции всегда заключалась в том, чтобы не допустить попадания французских колоний и флота в руки союзников. Однако это соглашение, которое мы можем отменить в любой момент. У нас есть план по принудительной интеграции региона, а также молниеносного наступления на базу французского флота в Тулоне."
 GER_case_anton:1 "Выполнить операцию Антон"
 GER_case_anton_tt2:2 "Не контролирует большинство французских штатов в Северной Африке."
 GER_case_anton_desc:0 "Наше марионеточное государство во Франции исчерпало свою полезность. Мы немедленно начнём интеграцию в [Root.GetName], и, если мы будем действовать достаточно быстро, мы сможем даже захватить остатки французского флота."
 GER_case_anton_tt:0 "Аннексирует Вишистскую Францию через 7 дней и захватит французский флот.\n\n§RФранция сможет затопить свой флот, если немецкие войска не будут в Тулоне в течение 2 дней!§!\n"
