 trait_GER_SS_desc:0 "Ваффен-СС — название военной организации Национал-социалистической партии СС"
 GER_adolf_hitler_desc:0 "Адольф «Фюрер» Гитлер, рейхсканцлер Германии, президент НСДАП, рейхспрезидент, фюрер и рейхсканцлер, верховный главнокомандующий.\nОн призвал членов рейхстага проголосовать за Закон о чрезвычайных полномочиях 24 марта 1933 года. Гитлер получил «временные» полномочия благодаря этому закону. Это дало ему свободу действовать без парламентского одобрения и даже без конституционных ограничений.\nИспользуя характерную смесь переговоров и запугивания, Гитлер предложил возможность дружеского сотрудничества, пообещав не угрожать рейхстагу, президенту, землям или церквям, если ему будут предоставлены чрезвычайные полномочия.\nЗакон позволил Гитлеру и его кабинету управлять посредством чрезвычайных декретов в течение четырёх лет, но Гинденбург оставался президентом. Гитлер немедленно начал устранять полномочия земель и существование неназистских политических партий и организаций. Неназистские партии были официально запрещены 14 июля 1933 года, а рейхстаг лишился своих демократических функций. Гинденбург оставался главнокомандующим армии и сохранил право вести переговоры о международных договорах.\nЗакон не затрагивал полномочия президента, и Гитлер не получил полной диктаторской власти до смерти Гинденбурга в августе 1934 года. Только Гитлер как глава государства мог сместить себя как главу правительства. Все солдаты присягнули на верность лично Гитлеру в день смерти Гинденбурга, клянясь в «безусловном повиновении» ему, а не должности или нации. С этого момента началась эпоха великого фюрера Германии, и теперь настала его очередь править Европой."
