 GER_weserubung_sud:0 "Везерюбунг-Зюд"
 GER_weserubung_sud_desc:0 "Для получения хорошей базы для вторжения в Норвегию нам нужно сначала захватить Данию."
 GER_weserubung_nord:0 "Везерюбунг-Норд"
 GER_weserubung_nord_desc:0 "Норвегия — критически важный стратегический пункт и очевидная цель для любого врага, желающего нарушить нашу торговлю сталью со Швецией. Мы не можем рисковать тем, что наши враги создадут базы в этом регионе."
 GER_case_yellow_netherlands:0 "План «Гельб» — Нидерланды"
 GER_case_yellow_netherlands_desc:0 "Атака через Бельгию вынуждает нас наступать слишком узким фронтом. Мы должны расширить наш военный план, включив в него Нидерланды, чтобы избежать ошибок 1914 года."
 GER_case_yellow_belgium_luxembourg:0 "План «Гельб» — Бельгия и Люксембург"
 GER_case_yellow_belgium_luxembourg_desc:0 "Атака через линию Мажино — это самоубийство. Мы обойдем ее с севера и пройдем через Арденны, чтобы миновать самые мощные укрепления."
 GER_polish_ultimatum:0 "Предъявить ультиматум Польше"
 GER_reichskommissariats:0 "Рейхскомиссариаты"
 GER_reichskommissariats_desc:0 "Позволяет создавать определенные рейхскомиссариаты на подконтрольных территориях.\n\n"
 GER_reichskommissariat_norwegen:0 "Рейхскомиссариат Норвегия"
 GER_reichskommissariat_niederlande:0 "Рейхскомиссариат Нидерланды"
