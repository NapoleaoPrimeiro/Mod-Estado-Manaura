 reinstate_wilhelm_iv_succession_rights:0 "Восстановить права престолонаследия принца Вильгельма"
 reinstate_wilhelm_iv_succession_rights_desc:1 "Сын кайзера Вильгельма III был вынужден отказаться от прав престолонаследия из-за желания жениться вопреки одобрению тогдашнего главы семьи Вильгельма II. Теперь, когда Вильгельм III занял эту роль, он может надавить на своего изгнанного отца, чтобы тот поддержал отмену этого решения."
 reinstate_wilhelm_iv_succession_rights_tt:0 "Линия престолонаследия изменена.\n"
 modernize_the_succession_laws:0 "Модернизировать законы о престолонаследии"
 modernize_the_succession_laws_desc:0 "У сына нынешнего кайзера, будущего Вильгельма IV, в качестве наследниц есть только две дочери. Мы должны обезопасить престолонаследие, поэтому законы должны быть модернизированы, чтобы позволить принцессе Фелицитас править, когда придет время."
 modernize_the_succession_laws_tt:0 "Женщины могут наследовать трон.\n"
 request_restoration_of_british_titles:0 "Запросить восстановление британских титулов"
 request_restoration_of_british_titles_desc:0 "В 1917 году британский парламент проголосовал за отзыв всех британских пэрств и королевских титулов у немецких королевских и княжеских семей. Теперь, когда мы союзники и наслаждаемся отличными отношениями, возможно, пришло время запросить отмену этого решения."
 hindenburg_destroyed_tt:0 "Дирижабль «Гинденбург» §YНЕ§! уничтожен.\n"
 request_restoration_of_british_titles_tt:0 "Это, несомненно, приведет к беспрецедентным наградам...\n"
 GER_request_polish_war_participation:0 "Требовать участия Польши в войне"
 GER_request_polish_war_participation_desc:0 "Поскольку мы находимся в состоянии войны с [SOV.GetName], нам необходимо пропустить наши армии через территорию [POL.GetAdjective]. Так как мы поклялись защищать их, вполне естественно, что они должны присоединиться к нашей войне."
 GER_reform_austro_hungarian_empire:1 "Воссоздать Австро-Венгерскую империю"
 GER_reform_austro_hungarian_empire_tt:0 "Запрос к другим государствам-преемникам Австро-Венгрии о воссоздании Империи.\n§RЕсли они согласятся, вы унаследуете все войны, в которых они участвуют!§!\n"
 GER_reformed_austro_hungarian_empire:0 "Воссоздана Австро-Венгерская империя"
 GER_barbarossa_mission:0 "Директива фюрера №21"
 emergency_factory_conversion_defensive:0 "Чрезвычайная конверсия заводов"
 emergency_factory_conversion_defensive_desc:0 "Фронту отчаянно необходимо больше снаряжения. Нам нужно срочно переоборудовать больше заводов для производства оружия и техники для обороны нашей страны."
 emergency_factory_conversion_offensive:0 "Чрезвычайная конверсия заводов"
 emergency_factory_conversion_offensive_desc:0 "Нашим войскам срочно требуется больше снаряжения. Нужно больше заводов для производства оборудования, необходимого для победы в войне."
 demolish_enemy_fortifications:0 "Снос вражеских укреплений"
 dismantle_maginot:0 "Демонтаж линии Мажино"
 propaganda_efforts:0 "Пропагандистские усилия"
 war_propaganda:0 "Военная пропаганда"
 war_propaganda_desc:0 "Пока мир вокруг нас горит, наш народ совершенно не готов к войне. Мы должны сплотить их поддержку, чтобы они взяли в руки оружие за нашу нацию."
 desperate_defense:0 "Отчаянная оборона"
 desperate_defense_desc:0 "Мы не можем больше отступать. Наши солдаты должны окопаться и держать оборону."
 war_bonds:0 "Военные облигации"
 war_bonds_desc:0 "Нам нужно больше ресурсов для военной экономики, и военные облигации — лучший способ их получить."
 GER_aid_hun_rom_democratic_civil_war:0 "Молодые демократии"
 GER_aid_hun_democratic_civil_war:0 "Вмешаться в гражданскую войну в Венгрии"
 GER_aid_rom_democratic_civil_war:0 "Вмешаться в гражданскую войну в Румынии"
 GER_austro_hungarian_empire:0 "Австро-Венгрия"
 GER_mefo_bills_category:0 "Векселя МЕФО"
 GER_mefo_bills_category_desc:0 "Чтобы финансировать нашу растущую военную промышленность и скрыть это от британцев и французов, мы были вынуждены использовать балансовую организацию для проведения платежей в виде векселей. Если мы не используем наши политические связи для продления сроков оплаты, мы будем вынуждены их погасить и потеряем преимущества."
 GER_mefo_bills_mission:0 "Срок оплаты векселей МЕФО"
 GER_can_delay_mefo_payment:0 "Возможность отсрочить выплату по векселям МЕФО."
 GER_mefo_bills_mission_desc:0 "Срок оплаты наших векселей скоро истекает. Мы должны решить: продлить их или начать выплаты."
 GER_extend_mefo_bills:0 "Векселя МЕФО"
 GER_extend_mefo_bills_desc:0 "Продлить срок оплаты векселей МЕФО еще на 3 месяца, что позволит нам продолжать пользоваться их преимуществами. Однако это также увеличит стоимость наших будущих выплат."
 GER_extend_mefo_bills_tt:1 "Решите, продлевать ли «§YВекселя МЕФО§!» или начать выплаты.\n"
 GER_mefo_bills_mission_tt:1 "Выпустить шестимесячное продление «§YВекселей МЕФО§!», которое вступит в силу по истечении срока текущей партии.\n\nСтоимость каждого продления будет прогрессивно расти до начала войны, после чего зависимость от МЕФО снимается, а выплаты откладываются до конца войны.\n\n"
 GER_mefo_bills_effect_in_days:1 "Следующее произойдет через [?Root.days_mission_timeout@GER_mefo_bills_mission|H0] дней:\n"
 GER_mefo_bills_extension_timer:0 "До срока оплаты векселей МЕФО."
 GER_mefo_bills_extension:0 "Менее 60 дней с момента продления векселей МЕФО."
 GER_mefo_bills_extended:0 "Векселя МЕФО продлены"
 GER_renew_mefos:0 "Возобновить векселя МЕФО"
 GER_renew_mefos_desc:0 "Рейхсбанк играет решающую роль в восстановлении и перевооружении нашей нации. Ясно, что мы совершили ошибку, решив выплатить долги, и нам следует продлить векселя МЕФО еще на несколько месяцев."
 GER_cancel_mefos:0 "Аннулировать векселя МЕФО"
 GER_cancel_mefos_desc:0 "Мы слишком долго полагались на Рейхсбанк в вопросе восстановления военной промышленности. Пора выполнить наши обязательства перед производителями оружия и прекратить этот фарс с векселями МЕФО."
 GER_case_anton_category:0 "Операция «Антон»"
 GER_case_anton_category_desc:0 "Целью создания вишистской Франции всегда было удержание французских колоний и флота подальше от рук союзников. Однако это соглашение мы можем расторгнуть в любое время. У нас есть план по принудительной интеграции этой области и молниеносному захвату базы французского флота в Тулоне."
 GER_case_anton:1 "Начать операцию «Антон»"
 GER_case_anton_tt2:2 "Не контролирует большинство французских штатов в Северной Африке."
 GER_case_anton_desc:0 "Наше марионеточное государство во Франции изжило свою полезность. Мы немедленно начнем интеграцию в [Root.GetName], и если будем действовать быстро, то сможем захватить остатки французского флота."
 GER_case_anton_tt:0 "Аннексирует вишистскую Францию через 7 дней и захватывает французский флот.\n\n§RФранция сможет затопить свой флот, если германские войска не дойдут до Тулона в течение 2 дней!§!\n"
 GER_case_red:0 "План «Рот»"
 GER_operation_marita:0 "Операция «Марита»"
 GER_sharpen_air_safety_regulations:0 "Ужесточить правила авиационной безопасности"
 GER_sharpen_air_safety_regulations_desc:0 "С более строгими правилами безопасности мы сможем предотвратить распространенные причины катастроф, включая те, что происходят с дирижаблями."
