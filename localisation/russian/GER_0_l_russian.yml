 GER_power_balance_himmler:0 "Рейхсфюрер СС в кабинете министров"
 ss_coup_event.1.t:0 "Покушение на [GER.GetLeader]"
 ss_coup_event.1.d:0 "Поступили сообщения из штаб-квартиры фюрера о стычке во время частной встречи [GER.GetLeader] и Генриха Гиммлера. Деталей мало, но абвер утверждает, что перехватил приказы частям СС готовиться к операции «Шварц» — захвату ключевых узлов в случае попытки военного переворота."
 ss_coup_event.1.a:0 "Судьба Германии изменилась."
 ss_coup_event.2.t:0 "Путч Гиммлера"
 ss_coup_event.2.d:0 "Когда дым в штаб-квартире фюрера рассеялся, Генрих Гиммлер вышел из перестрелки единственным выжившим. По его словам фюрер, охваченный безумием, объявил его предателем. Гиммлер решил действовать немедленно и застрелил его. Вермахт решил поддержать Гиммлера, чтобы избежать гражданской войны."
 ss_coup_event.2.a:0 "Хайль Гиммлер!"
 wehrmacht_coup_event.1.t:0 "Покушение на [GER.GetLeader]"
 wehrmacht_coup_event.1.d:0 "Неподтвержденные сообщения указывают на взрыв устройства во время совещания, где был [GER.GetLeader]. В Вермахте и СС царит замешательство, офицеры обвиняют друг друга в попытке переворота. Герман Геринг, как преемник, принимает руководство Рейхом."
 wehrmacht_coup_event.1.a:0 "Нам остается только надеяться."
 wehrmacht_coup_event.2.t:0 "Операция «Валькирия»"
 wehrmacht_coup_event.2.d:0 "Части Вермахта начали операцию «Валькирия». Армейские подразделения окружили министерства и пытаются арестовать чиновников. Перестрелки СС и армии идут в Берлине. Вермахт требует от СС немедленно сложить оружие."
 wehrmacht_coup_event.2.a:0 "Предатели! Неудачники!"
