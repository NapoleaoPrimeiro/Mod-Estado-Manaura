 GER_very_low_increase_effect:0 "Получить совет Вермахта"
 GER_very_low_increase_effect_desc:0 "У Вермахта есть ценный совет для нас. Нам стоит к нему прислушаться."
 GER_low_increase_effect:0 "Нанять военный завод"
 GER_low_increase_effect_desc:0 "Мы всегда можем нанять частный завод для военных нужд."
 GER_medium_increase_effect:0 "Дать Вермахту среднее влияние"
 GER_high_increase_effect:0 "Передать снаряжение армии"
 GER_high_increase_effect_desc:0 "На складах наверняка завалялось снаряжение, которое все равно никто не будет искать."
 GER_absurdly_high_increase_effect:0 "Дать Вермахту полное влияние"
 GER_very_low_decrease_effect:0 "Получить совет СС"
 GER_very_low_decrease_effect_desc:0 "У СС есть ценный совет для нас. Нам стоит к нему прислушаться."
 GER_low_decrease_effect:0 "Изъять гражданскую собственность"
 GER_low_decrease_effect_desc:0 "Любая пустующая земля должна быть передана правительству для нужд войны."
 GER_medium_decrease_effect:0 "Дать СС среднее влияние"
 GER_high_decrease_effect:0 "Сформировать дивизии СС"
 GER_high_decrease_effect_desc:0 "СС подготовили для нас несколько дивизий. Мы должны использовать их."
 GER_absurdly_high_decrease_effect:0 "Дать СС полное влияние"
 GER_division_infantry_ss:0 "Создать две наполовину укомплектованные моторизованные дивизии СС в случайном подконтрольном регионе. Используется раз в год."
 add_equipment_effect:0 "Добавить снаряжение в запасы. Используется раз в год."
 add_factory_effect:0 "Добавить один военный завод. Используется раз в год."
 add_building_slot:0 "Добавить две ячейки штатам. Используется раз в год."
 GER_ahnenerbe_society_category:0 "Наследие и исследования Аненербе"
 GER_ahnenerbe_society_category_desc:0 "Под руководством Генриха Гиммлера общество Аненербе ищет мистические и наследственные корни немецкого народа, снаряжая экспедиции в самые отдаленные уголки мира."
 GER_activate_ahnenerbe_society:0 "Основать общество Аненербе"
 GER_activate_ahnenerbe_society_desc:0 "Открывает возможность отправлять исследовательские группы к историческим и мистическим местам по всему миру."
 GER_expedition_tibet:0 "Отправить экспедицию в Тибет"
 GER_expedition_arctic:0 "Отправить экспедицию в Антарктиду"
 GER_expedition_middle_east:0 "Отправить экспедицию на Ближний Восток"
 GER_ahnenerbe_success_tt:0 "§YЭКСПЕДИЦИЯ ПРОШЛА УСПЕШНО!§!\nНаша группа вернулась с древними артефактами и утраченными знаниями, что дает Рейху долгосрочные преимущества."
 GER_ahnenerbe_nothing_tt:0 "§WРЕЗУЛЬТАТОВ НЕ НАЙДЕНО.§!\nГруппа провела месяцы в поисках, но вернулась ни с чем, кроме пустых карманов и незначительных окаменелостей."
 GER_ahnenerbe_failure_tt:0 "§RКАТАСТРОФИЧЕСКИЙ ПРОВАЛ!§!\nЛогистические катастрофы и международные скандалы нанесли ущерб стабильности нашего правительства."
 GER_spirit_tibet_success:0 "Мистическая дисциплина Востока"
 GER_spirit_arctic_success:0 "Протоколы северной адаптации"
 GER_spirit_middle_east_success:0 "Тайны песков пустыни"
 GER_weserubung_nord_desc:0 "Норвегия является важным стратегическим пунктом и очевидной целью для любого врага, желающего нарушить нашу торговлю сталью со Швецией. Мы не можем рисковать тем, что наши враги создадут базы в этом регионе."
 GER_case_yellow_netherlands:0 "План «Гельб» — Нидерланды"
 GER_case_yellow_netherlands_desc:0 "Атака через Бельгию вынуждает нас наступать слишком узким фронтом. Мы должны расширить наш план войны, включив в него Нидерланды, чтобы избежать ошибок 1914 года."
 GER_case_yellow_belgium_luxembourg:0 "План «Гельб» — Бельгия и Люксембург"
 GER_case_yellow_belgium_luxembourg_desc:0 "Атака через линию Мажино — это самоубийство. Мы обойдем её с севера и пройдем через Арденны, чтобы миновать самые мощные укрепления."
 GER_polish_ultimatum:0 "Предъявить ультиматум Польше"
GER_reichskommissariats:0 "Рейхскомиссариаты"
 GER_reichskommissariats_desc:0 "Позволяет создавать определенные рейхскомиссариаты на подконтрольных территориях.\n\n"
 GER_reichskommissariat_norwegen:0 "Рейхскомиссариат Норвегия"
 GER_reichskommissariat_niederlande:0 "Рейхскомиссариат Нидерланды"
 GER_reichskommissariat_belgien_nordfrankreich:0 "Рейхскомиссариат Бельгия-Северная Франция"
 GER_reichskommissariat_ostland:0 "Рейхскомиссариат Остланд"
 GER_reichskommissariat_ukraine:0 "Рейхскомиссариат Украина"
 reinstate_wilhelm_iv_succession_rights:0 "Восстановить права принца Вильгельма на престол"
 reinstate_wilhelm_iv_succession_rights_desc:1 "Сын кайзера Вильгельма III был вынужден отказаться от своих прав на престол из-за желания жениться вопреки воле тогдашнего главы семьи Вильгельма II. Поскольку теперь эту роль занял Вильгельм III, он может надавить на своего изгнанного отца, чтобы тот поддержал отмену этого решения."
 reinstate_wilhelm_iv_succession_rights_tt:0 "Порядок престолонаследия изменен.\n"
 modernize_the_succession_laws:0 "Модернизировать законы о престолонаследии"
 modernize_the_succession_laws_desc:0 "У нынешнего сына кайзера, будущего Вильгельма IV, в качестве наследниц есть только две дочери. Мы должны обезопасить линию престолонаследия, и поэтому законы должны быть модернизированы, чтобы принцесса Фелицитас могла взойти на трон, когда придет время."
 modernize_the_succession_laws_tt:0 "Женщины могут наследовать трон.\n"
 request_restoration_of_british_titles:0 "Запросить восстановление британских титулов"
 request_restoration_of_british_titles_desc:0 "В 1917 году британский парламент проголосовал за лишение всех британских пэрств и королевских титулов членов немецких королевских и княжеских семей. Теперь, когда мы союзники и наслаждаемся прекрасными отношениями, возможно, пришло время запросить отмену этого решения."
 hindenburg_destroyed_tt:0 "Дирижабль «Гинденбург» §YНЕ§! уничтожен.\n"
 request_restoration_of_british_titles_tt:0 "Это, несомненно, приведет к беспрецедентным наградам...\n"
 GER_request_polish_war_participation:0 "Требовать участия Польши в войне"
 GER_request_polish_war_participation_desc:0 "Поскольку мы находимся в состоянии войны с [SOV.GetName], нам необходимо пропустить наши армии через территорию [POL.GetAdjective]. Так как мы поклялись защищать их, вполне естественно, что они должны присоединиться к нашей войне."
 GER_reform_austro_hungarian_empire:1 "Восстановить Австро-Венгерскую империю"
 GER_reform_austro_hungarian_empire_tt:0 "Запрос к другим государствам-преемникам Австро-Венгрии о воссоздании Империи.\n§RЕсли они согласятся, вы унаследуете все войны, в которых они участвуют!§!\n"
 GER_reformed_austro_hungarian_empire:0 "Воссозданная Австро-Венгерская империя"
 GER_barbarossa_mission:0 "Директива фюрера № 21"
 emergency_factory_conversion_defensive:0 "Чрезвычайная конверсия фабрик"
 emergency_factory_conversion_defensive_desc:0 "Фронту отчаянно необходимо больше снаряжения. Нам нужно срочно переоборудовать больше фабрик для производства оружия и техники для обороны нашей страны."
 emergency_factory_conversion_offensive:0 "Чрезвычайная конверсия фабрик"
 emergency_factory_conversion_offensive_desc:0 "Нашим войскам срочно требуется больше снаряжения. Нужно больше заводов для производства оборудования, необходимого для победы в войне."
 demolish_enemy_fortifications:0 "Снос вражеских укреплений"
 dismantle_maginot:0 "Демонтаж линии Мажино"
 propaganda_efforts:0 "Пропагандистские усилия"
 war_propaganda:0 "Военная пропаганда"
 war_propaganda_desc:0 "Пока мир вокруг нас горит, наш народ прискорбно не готов к войне. Мы должны мобилизовать их поддержку для защиты нации."
 desperate_defense:0 "Отчаянная оборона"
 desperate_defense_desc:0 "Нам некуда больше отступать. Наши солдаты должны окопаться и держать оборону."
 war_bonds:0 "Военные облигации"
 war_bonds_desc:0 "Нам нужно больше ресурсов для военной экономики, и военные облигации — лучший способ их получить."
GER_aid_hun_rom_democratic_civil_war:0 "Молодые демократии"
 GER_aid_hun_democratic_civil_war:0 "Вмешаться в гражданскую войну в Венгрии"
 GER_aid_rom_democratic_civil_war:0 "Вмешаться в гражданскую войну в Румынии"
 GER_austro_hungarian_empire:0 "Австро-Венгрия"
 GER_mefo_bills_category:0 "Векселя МЕФО"
 GER_mefo_bills_category_desc:0 "Чтобы финансировать нашу растущую военную промышленность и скрыть это от глаз британцев и французов, мы были вынуждены использовать фиктивную компанию для проведения платежей в форме долговых обязательств. Если мы не используем наши политические связи для продления сроков оплаты этих векселей, мы будем вынуждены выплатить их и потеряем преимущества."
 GER_mefo_bills_mission:0 "Срок оплаты векселей МЕФО"
 GER_can_delay_mefo_payment:0 "Может отсрочить выплату по векселям МЕФО."
 GER_mefo_bills_mission_desc:0 "Срок оплаты наших векселей скоро истекает. Мы должны решить: продлить их или начать выплаты."
 GER_extend_mefo_bills:0 "Векселя МЕФО"
 GER_extend_mefo_bills_desc:0 "Продлить срок оплаты векселей МЕФО еще на 3 месяца, что позволит нам продолжать пользоваться их преимуществами. Однако это также увеличит стоимость окончательных выплат."
 GER_extend_mefo_bills_tt:1 "Решите, продлевать ли «§YВекселя МЕФО§!» или начать выплаты.\n"
 GER_mefo_bills_mission_tt:1 "Выпустить продление «§YВекселей МЕФО§!» на шесть месяцев, которое вступит в силу по истечении срока текущей партии.\n\nСтоимость каждого продления будет постепенно расти до начала войны, после чего потребность в векселях МЕФО отпадет, а выплаты будут отложены до окончания войны.\n\n"
 GER_mefo_bills_effect_in_days:1 "Следующее произойдет через [?Root.days_mission_timeout@GER_mefo_bills_mission|H0] дней:\n"
 GER_mefo_bills_extension_timer:0 "До срока оплаты векселей МЕФО."
 GER_mefo_bills_extension:0 "Прошло менее 60 дней с момента продления векселей МЕФО."
 GER_mefo_bills_extended:0 "Векселя МЕФО продлены"
 GER_renew_mefos:0 "Возобновить векселя МЕФО"
 GER_renew_mefos_desc:0 "Рейхсбанк играет решающую роль в восстановлении и перевооружении нашей нации. Ясно, что мы совершили ошибку, решив выплатить долги, и нам следует продлить векселя МЕФО еще на несколько месяцев."
 GER_cancel_mefos:0 "Аннулировать векселя МЕФО"
 GER_cancel_mefos_desc:0 "Мы слишком долго полагались на Рейхсбанк в вопросе восстановления военной промышленности. Пора выполнить наши обязательства перед производителями оружия и прекратить этот фарс с векселями МЕФО."
 GER_case_anton_category:0 "Операция «Антон»"
 GER_case_anton_category_desc:0 "Целью создания вишистской Франции всегда было удержание французских колоний и флота подальше от рук союзников. Однако это соглашение мы можем расторгнуть в любое время. У нас есть план по принудительной интеграции этой области, а также молниеносному захвату базы французского флота в Тулоне."
 GER_case_anton:1 "Начать операцию «Антон»"
 GER_case_anton_tt2:2 "Не контролирует большинство французских регионов в Северной Африке."
 GER_case_anton_desc:0 "Наше марионеточное государство во Франции изжило свою полезность. Мы немедленно начнем интеграцию в [Root.GetName], и если будем действовать быстро, то сможем захватить остатки французского флота."
 GER_case_anton_tt:0 "Аннексирует вишистскую Францию через 7 дней и захватывает французский флот.\n\n§RФранция сможет затопить свой флот, если германские войска не войдут в Тулон в течение 2 дней!§!\n"
