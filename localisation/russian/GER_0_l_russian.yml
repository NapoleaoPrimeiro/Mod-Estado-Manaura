 GER_power_balance_himmler:0 "Рейхсфюрер СС в кабинете министров"
 ss_coup_event.1.t:0 "Покушение на [GER.GetLeader]"
 ss_coup_event.1.d:0 "Поступили сообщения из штаб-квартиры фюрера о том, что во время частной встречи между [GER.GetLeader] и Генрихом Гиммлером произошла какая-то стычка. Деталей мало, но абвер утверждает, что перехватил сообщение секретного курьера с приказами частям СС по всей Германии готовиться к операции «Шварц» — захвату ключевых узлов связи на случай попытки военного переворота."
 ss_coup_event.1.a:0 "Судьба Германии изменилась."
 ss_coup_event.2.t:0 "Путч Гиммлера"
 ss_coup_event.2.d:0 "Когда дым в штаб-квартире фюрера рассеялся, Генрих Гиммлер вышел из хаотичной перестрелки единственным выжившим. По его словам, фюрер, охваченный безумием, объявил его предателем и шпионом. Гиммлер решил действовать немедленно и застрелил его. В последовавшей неразберихе Вермахт решил поддержать Гиммлера, чтобы обеспечить будущее страны и остановить гражданскую войну. Теперь наследие Гитлера принадлежит Гиммлеру."
 ss_coup_event.2.a:0 "Хайль Гиммлер!"
 wehrmacht_coup_event.1.t:0 "Покушение на [GER.GetLeader]"
 wehrmacht_coup_event.1.d:0 "Неподтвержденные сообщения из штаб-квартиры фюрера указывают на то, что кто-то привел в действие взрывное устройство во время совещания, на котором присутствовал [GER.GetLeader]. Информации мало, в рядах Вермахта и СС царит замешательство, офицеры с обеих сторон обвиняют друг друга в попытке переворота.\n\nГерман Геринг, назначенный преемником Гитлера, решил принять руководство Рейхом."
 wehrmacht_coup_event.1.a:0 "Мы можем только надеяться."
 wehrmacht_coup_event.2.t:0 "Операция «Валькирия»"
 wehrmacht_coup_event.2.d:0 "Части Вермахта начали операцию «Валькирия». Подразделения армии окружили ряд министерств и предприняли попытку ареста высокопоставленных чиновников партии. По всему Берлину сообщается о стычках между охраной СС и отрядами армии. Похоже, Вермахт потребовал от всех частей СС сложить оружие, на что руководство СС ответило категорическим отказом.\n\nОбе фракции борются за контроль над Берлином. Пламя этой войны скоро распространится повсюду."
 wehrmacht_coup_event.2.a:0 "Предатели! Неудачники!"
