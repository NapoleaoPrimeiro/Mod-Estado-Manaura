l_russian:
# # # # # # # # # # # # # # #
GFTR_categories_settings: "Настройки"
GFTR_categories_settings_desc: "Приветствую! Я очень рад что вы подписались на мод §YGeneric Focus Tree: Redux!§! Если вам нравиться проделанная мной работа, пожалуйста, поддержите мод на странице мастерской Steam :) \nТам же вы можете увидеть все последние изминения, сообщить мне о проблемах мода или ошибках."
# # # # # # # # # # # # # # #
GFTR_D_set_focus_tree_SHOW: "1. Установить дерево фокусов?"
GFTR_D_set_focus_tree_SHOW_tt: "Здесь вы сможете устанавливать или удалять различные деревья вокусов для вашей и других стран."
GFTR_D_set_focus_tree_HIDE: "1. §RЗакрыть раздел§!"
GFTR_D_set_gftr_a: "          1. Установить (GFT: Redux)"
GFTR_D_set_gftr_a_tt: "Для текущей страны будет установлено или обновлено §YGeneric Focus Tree: Redux.§! \n~~~ \nОбратите внимание, если вы смените дерево фокусов у стран, которые имеют свои уникальные фокуси в ванильной игре или в ДЛС (Например: Германии, Франция, Иран и другие) то вернуть назад их "родные" деревья фокусов вы сможете только §Lначав новую игру§! или §Lчерез концоль.§!"
GFTR_D_set_gftr_b: "          1. Установить (GFT: Redux) для ИИ"
GFTR_D_set_gftr_b_tt: "Для абсолютно ВСЕХ стран что контролирует ИИ будет установлено или обновлено §YGeneric Focus Tree: Redux.§! \n~~~ \n§LБудьте осторожны§!, так как нажимая это, все страны без исключения, что управляються ИИ, получат новое дерево фокусов. §GРекомендуется§! прожимать это решение только на самом старте вашей игры, а также удалить национальные духи и особые механики у всех стран (с помощью решений ниже).§!"
GFTR_D_set_generic_focus: "          1. Установить ванильное дерево"
GFTR_D_set_generic_focus_tt: "Для текущей страны будет установлено или обновлено §Gванильное§! базовое дерево фокусов.\n~~~ \nОбратите внимание, данная функция загружает текущее ванильное дерево в вашей игре, а оно может быть измененно в других крупных модах. В таких случаях эта функция будет устанавливать изменённое дерево фокусов, а не ванильное."
GFTR_D_deleted_focus_tree: "          1. Удалить дерево фокусов"
GFTR_D_deleted_focus_tree_tt: "У текущей страны будет §Rудалено§! дерево фокусов. А если быть точнее, то будет установлено полностью пустое дерево, в котором нет ни единого фокуса (кроме так званных "непрырывных"). \n~~~ \nНа самом деле я не знаю зачем вам эта возможность §YXD§!. Возможно вы захотите сделать какую-то страну "не активной", тогда вы сможете отключить ей дерево фокусов, и, возможно, это увеличит производительность."
GFTR_D_test_focus_tree: "          1. Тестировать мод"
GFTR_D_test_focus_tree_tt: "Будет установлено точная копия §YGeneric Focus Tree: Redux.§!, но в нём, все фокуси требуют всего 1 день на изучения. \n~~~ \nВ первую очередь, эта функция создана для тестирования ИИ, чтобы легко и быстро увидеть как он действует и какие фокуси с каким шансом он выбирает. Если вы хотите, можете воспользоваться этой функций для того, чтобы помочь мне выявить какие-то проблемы с ИИ. \n~~~ \nВозможно, эта функция вам покажеться интересной для вашей игры."
# # # # # # # # # # # # # # #
GFTR_D_remove_national_spirits_SHOW: "2. Удалить национальные духи?"
GFTR_D_remove_national_spirits_SHOW_tt: "Здесь вы сможете удалить различные национальные духи у своей и других стран."
GFTR_D_remove_national_spirits_HIDE: "2. §RЗакрыть раздел§!"
GFTR_D_remove_gftr_national_spirits_a: "          2. Удалить духи (GFT: Redux)"
GFTR_D_remove_gftr_national_spirits_a_tt: "У текущей страны будут удалены все национальные духи что добавлены в моде §YGeneric Focus Tree: Redux.§! \n~~~ \nТехнические национальные духи удалены не будут."
GFTR_D_remove_gftr_national_spirits_b: "          2. Удалить духи (GFT: Redux) у ИИ"
GFTR_D_remove_gftr_national_spirits_b_tt: "У абсолютно ВСЕХ стран что контролирует ИИ будут удалены национальные духи что добавлены в моде §YGeneric Focus Tree: Redux.§! \n~~~ \nТехнические национальные духи удалены не будут. \n~~~ \n§RБудьте осторожны,§! удаление национальных духов вызывает небольшое подвисание."
GFTR_D_remove_vanilla_national_spirits_a: "          2. Удалить ванильные духи"
GFTR_D_remove_vanilla_national_spirits_a_tt: "У текущей страны будут удалены все стартовые §Gванильные§! национальные духи! \n~~~ \nК сожалению, в игре нет простой функции "удалить все духи у страны", поэтому, эта функция удаляет лишь заранее прописанный список национальных духов, которые есть у всех стран на карте на момент старта игры в 1936 году. \nЕсли вы решите прожать эту функцию спустя некоторое время игры, то с большой вероятностью, это не даст вам нужного эффекта. Поэтому, §Gрекомендуется§! прожимать эту функцию только на самом старте вашей игры."
GFTR_D_remove_vanilla_national_spirits_b: "          2. Удалить ванильные духи у ИИ"
GFTR_D_remove_vanilla_national_spirits_b_tt: "У абсолютно ВСЕХ стран что контролирует ИИ будут удалены стартовые §Gванильные§! национальные духи. \n~~~ \nК сожалению, в игре нет простой функции "удалить все духи у страны", поэтому, эта функция удаляет лишь заранее прописанный список национальных духов, которые есть у всех стран на карте на момент старта игры в 1936 году. \nЕсли вы решите прожать эту функцию спустя некоторое время игры, то с большой вероятностью, это не даст вам нужного эффекта. Поэтому, §Gрекомендуется§! прожимать эту функцию только на самом старте вашей игры. \n~~~ \n§RБудьте осторожны,§! удаление национальных духов вызывает небольшое подвисание."
GFTR_D_remove_vanilla_national_spirits_c: "          2. Удалить все ванильные духи"
GFTR_D_remove_vanilla_national_spirits_c_tt: "§RВНИМАНИЕ!§! Это решение удаляет большую часть национальных духов в игре §Y(но не все!)§! Из-за большого количества удаляемых национальных духов, игра может подвиснуть на продолжительное время (от нескольких секунд до пары минут). Обязательно сохранитесь прежде чем использовать эту функцию! \n~~~ \n§RВНИМАНИЕ!§! Я НЕ могу гарантировать, что это решение безопасно для вашей игры. Во время создание этой функции, я для себя узнал, что в игре существуют особые национальные духи, удаление которых вызывает гражданские войны в некоторых странах. Например, удаление у АВСТРИИ национального духа КИТАЯ "CHI_republican_agitation" вызывает моминтальную Австрийскую гражданскую войну. КАК? ПОЧЕМУ? ЗАЧЕМ? Я не знаю. Я убирал подобные национальные духи, но всеравно остается шанс что вы встретите подобные или другие проблемы. Лучше сохраните свою игру."
# # # # # # # # # # # # # # #
GFTR_D_remove_unique_mechanics_SHOW: "3. Удалить уникальные механики?"
GFTR_D_remove_unique_mechanics_SHOW_tt: "Здесь вы сможете удалять особые механики, решения и модификаторы которые есть у некоторых стран и которые могут помешать вашей игре в случае, если вы захотите менять странам их "родные" деревья фокусов."
GFTR_D_remove_unique_mechanics_HIDE: "3. §RЗакрыть раздел§!"
GFTR_D_remove_state_modifier_a: "          3. Удалить модификаторы"
GFTR_D_remove_state_modifier_a_tt: "У текущей страны будут удалены некоторые модификаторы провинций. \n~~~ \n§YМодификаторы провинций§! - это такие особые модификаторы, которые имеют лишь некоторые провинции на карте и которые влияют на игровой процесс. Ярким их примером является "Децинтрилизация" в провинциях Эфиопии или "Курдский сепаратизм" на территории Турции. \n~~~ \n§GЕсли вы заменяете§! у страны её §G"родное"§! дерево фокусов, то такие территориальные модификаторы станут проблемой, так как от них попросту нельзя будет избавиться. Именно для этого существует это решение. \n~~~ \nВыше, в пункте "Требования" указаны все страны, на территории которых могут быть удалены модификаторы провинций. §L(Это касается и удаления модификаторов у ИИ)§! \n~~~ \n§GРекомендую§! прожимать это решение на старте игры, так как позже все эти модиикаторы могут заменятся другими, которые уже НЕ удаляет это решение."
GFTR_D_remove_state_modifier_b: "          3. Удалить модификаторы у ИИ"
GFTR_D_remove_state_modifier_b_tt: "Будут удалены модификаторы провинций тех регионов, которыми владеют государства под контролем ИИ. \n~~~ \nВ решении выше вы можете прочесть о каких "модификаторах" идёт речь. Там же, в пункте §L"требования"§!, вы увидете на территории каких стран есть эти самые модификаторы что будут удалены. Но при этом, не важно какое государство на данный момент контролирует территории, модификаторы всеравно будут удалены. \n~~~ \n§GРекомендую§! нажимать это решение только в том случае, если вы планируете у всех стран под контролем ИИ заменить их "родное" дерево фокусов."
GFTR_D_remove_special_mechanics_a: "          4. Удалить механики"
GFTR_D_remove_special_mechanics_a_tt: "У текущей страны будут удалены особые механики. \n~~~ \n§YОсобые механики§! - это механики, которыми владеют лишь некоторые страны, и которыми можно управлять только с помощью специальных фокусов. В большинстве случаев это так званный "Баланс Сил", который вы можете встретить, например, у Эфиопии, Дании и других. Кроме того, это решение убирает систему "Паранои" у СССР и "Крестьянское востание" в Польше. \n~~~ \n§GЕсли вы заменяете§! у страны её §G"родное"§! дерево фокусов, то особые механики не возможно будет убрать никаким другим способом кроме этого решения. \n~~~ \nВыше, в пункте "Требования" указаны все страны у которых есть эти самые механики, что удаляет это и решение ниже."
GFTR_D_remove_special_mechanics_b: "          4. Удалить механики у ИИ"
GFTR_D_remove_special_mechanics_b_tt: "У некоторых странах что контролирует ИИ будут удалены особые механики. \n~~~ \nОписание того, что такое "особые механики" и сам список стран у которых будет удалены механики вы можете найти в решении выше. \n~~~ \n§GРекомендую§! нажимать это решение только в том случае, если вы планируете у всех стран под контролем ИИ заменить их "родное" дерево фокусов."
# # # # # # # # # # # # # # #
GFTR_D_ai_management_SHOW: "4. Настроить поведение ИИ?"
GFTR_D_ai_management_SHOW_tt: "Здесь можете управлять поведением стран под контролем ИИ."
GFTR_D_ai_management_HIDE: "4. §RЗакрыть раздел§!"
GFTR_D_ai_political_freedom: "          4. "Политическая свобода""
GFTR_D_ai_political_freedom_tt: "Всем странам под контролем ИИ будет выдан национальный дух §Y$GFTR_idea_ai_political_freedom$§!. \n~~~ \nПо стандарту, в моём моде сделано так, что ИИ слегка больше отдаёт предпочтение той ветке политики, которая совпадает с его текущей идеологией,а также, в историческом режиме, ИИ вовсе не сменяет свою идеологию и не создаёт альянсов. \n§YПолитическая свобода§! убирает эти ограничения. Даже с включённым историческим режимом ИИ будет иметь больше свободы и будет более случайным. \n~~~ \nНа самом деле, данная функция при ванильной игре вам будет не очень полезна. Она создана скорее для совместимости с другими модами, которые добавляют много других стран. Ярким примером является мод §L"Every State Independent"§!, в котором сотни стран, у каждой из которых по стандарту идеология нейтралитет, поэтому, без этой фнкции ИИ очень часто идёт в ветку монархизма. \n~~~ \nЕсть смысл прожимать это решение в том случае, если вы хотите чтобы ИИ с равным шансом выбирал разные ветки политики или чтобы он игнорировал исторический режим."
GFTR_D_ai_limit: "          4. Ограничить ИИ"
GFTR_D_ai_limit_tt: "Текущей стране будет выдан национальный дух §Y$GFTR_idea_ai_limit$§! \n~~~ \nЭта функция может быть полезна если вы хотите "отключить" ИИ. Это может положительно повлиять на производительность. \nДа, это вам не заменит моды для оптимизации, но зато вы можете ограничть лишь выбраные вами страны, но только с использование концоли и команды "observe". \n~~~ \n§GНапоминаю,§! выше вы можете также найти решение чтобы удалить дерево фокусов у страны, чтобы ещё сильнее ограничить ИИ. \n~~~ \n"
GFTR_D_ai_madness_mode: "          4. Режим "Бузумия""
GFTR_D_ai_madness_mode_tt: "Всем странам под контролем ИИ будет выдан национальный дух §Y$GFTR_idea_ai_madness_mode$§!. \n~~~ \n§YРежим "Безумия"§! сделает так, что ИИ будет выбирать только те пути, что ведут к войнам. Погрузитесь в мир хаоса, где все воюют против всех! §RНО обратите внимание,§! это решение касается только тех стран, у которых есть §YGeneric Focus Tree: Redux.§!"
GFTR_D_remove_management_ideas: "          4. Удалить технические духи"
GFTR_D_remove_management_ideas_tt: "У абсолютно ВСЕХ стран будут удалены все возможные технические национальные духи что добавляет этот мод."
