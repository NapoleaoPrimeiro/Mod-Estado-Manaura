l_russian:
GFTR_E_independence.1.t: "Война за независимость!"
GFTR_E_independence.1.d: "Наше терпение лопнуло. Это наша земля и это мы будем распоряжаться ею так, как считаем нужным. Сегодня мы начинаем борьбу против захватчиков и оккупантов которые пришли на нашу землю, навязали нам свою волю, культуру, поработили наших людей и воткнули свой флаг в нашу землю."
GFTR_E_independence.1.a: "Да прольётся их кровь!"
# # # # # # # # # # # # # # #
GFTR_E_independence.2.t: "Письмо с просьбой"
GFTR_E_independence.2.d: "Сегодня к нам поступило официальное обращение от нашей марионеточной державы. Они требуют пересмотра нашего влияния, желают иметь собственный голос во внешней и внутренней политике и фактически заявляют о желании стать самостоятельной страной. Это обращение пока что весьма сдержанное и дипломатическое, но по щелчку пальцев все может перерости в войну."
GFTR_E_independence.2.a: "Никаких уступок!"
GFTR_E_independence.2.b: "Мы готовы дать им независимость."
GFTR_E_independence.2.c: "Предатели! Вон из нашего альянса!"
GFTR_E_independence.2.d: "Армия наведёт порядок."
# # # # # # # # # # # # # # #
GFTR_E_independence_response.0.t: "Плохие вести"
GFTR_E_independence_response.0.d: "Сегоднешнее утро началось с удара в спину от него бывшего марионеточного государства, которое внезапно объявило о своей независимости и напало на наши войска, расположенные на их территории. Наши попытки переговоров были отвергнуты."
GFTR_E_independence_response.0.a: "Они хотят войны? Они её получат!"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.1.t: "Отказ"
GFTR_E_independence_response.1.d: "Несколькими днями назад, мы отправили просьбу о предоставлении независимости, но сегодня получили категорический отказ. Метрополия не желает отпускать нас и отвергла любое обсуждение данного вопроса. Дипломатия зашла в тупик."
GFTR_E_independence_response.1.a: "Придётся воевать!"
GFTR_E_independence_response.1.b: "Ну ладно"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.2.t: "Мы свободны!"
GFTR_E_independence_response.2.d: "Хорошие новости! Метрополия официально признала нашу независимость. Отныне мы сами определяем свою судьбу. Для нашего народа это исторический день, который войдёт в учебники."
GFTR_E_independence_response.2.a: "Ура-Ура-УРА!"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.3.t: "Свобода с привкусом горечи"
GFTR_E_independence_response.3.d: "Сегодня мы получили неоднозначный ответ от метраполии. Нас обвинили в предательстве! Хоть свою независимость мы и получили, но бывшая метраполия оборвала с нами любые дипломатические связи, поэтому отныне мы свободны, но сами по себе в это турбулентное время. Несмотря на резкость заявлений, нам удалось избежать военного конфликта."
GFTR_E_independence_response.3.a: "Главное что всё прошло мирно."
# # # # # # # # # # # # # # #
GFTR_E_independence_response.4.t: "Война за независимость"
GFTR_E_independence_response.4.d: "Наши надежды на дипломатический пересмотр нашей зависимости сегодня рухнули. После нашего недавнего запроса метрополия выдвинула свои войска к границе и готовится начать вторжение с целью подавить наше желание быть самостоятельным государством. С этого момента мы сражаемся не за свободу, а за само существование государства."
GFTR_E_independence_response.4.a: "Мы выстоим!"
# # # # # # # # # # # # # # #
GFTR_E_change_of_power.1.t: "Выборы позади"
GFTR_E_change_of_power.1.d: "В стране прошли честные демократические выборы. Народ сделал свой выбор."
GFTR_E_change_of_power.1.a: "Ок"
# # # # # # # # # # # # # # #
GFTR_E_change_of_power.2.t: "Захват власти"
GFTR_E_change_of_power.2.d: "Ожидаемого противостояния не произошло. Старая власть признала своё поражение и сложила полномочия, передав контроль новому режиму без борьбы."
GFTR_E_change_of_power.2.a: "Правильное решение"
# # # # # # # # # # # # # # #
GFTR_E_change_of_power.3.t: "Гражданская война!"
GFTR_E_change_of_power.3.d: "Политический кризис достиг предела. Страна раскололась на две враждующие стороны, и спор о власти перерос в открытое вооружённое противостояние."
GFTR_E_change_of_power.3.a: "Мы справимся"