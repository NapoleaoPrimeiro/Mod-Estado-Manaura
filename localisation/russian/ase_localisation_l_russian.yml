l_russian:
ase_Asia_War:0 "§RТора! Тора! Тора!§!"
ase_Asia_War_QUOTE:0 "Сегодня Адмирал Ямамото решил расхуярить американский флот в Тихом океане. Операция должна обеспечить беспрепятственное завоевание Японией всей Юго-Восточной Азии, включая нефтяные месторождения Голландской Ост-Индии"
ase_Asia_War_REMARK:0 "Защищайте резину!"
ase_Asia_War_REMARK_a:0 "Вместе мы сможем!"
ase_Asia_War_REMARK_jap:0 "За Императора!"

ase_Barbarossa:0 "§RОперация Барбаросса§!"
ase_Barbarossa_QUOTE:0 "Немецкие вооруженные силы должны быть готовы еще до завершения войны против Англии разгромить Советскую Россию в ходе быстрой кампании. Решающее значение имеет то, что наше намерение атаковать не должно быть известно. \n- §RБарбаросса началась§!"
ase_Barbarossa_REMARK:0 "К оружию!"

ase_WW2_Started:0 "§RНачало Второй Мировой§!"
ase_WW2_Started_QUOTE:0 "Гитлеровский Германский Рейх вторгся в Польшу, на этот агрессивный шаг быстро отреагировали Франция, Великобритания и Содружество объявлением войны Германии. Во Франции объявлено военное положение, гражданские самолеты в Германии приостановлены, а детей из Лондона эвакуируют в сельскую местность. \n- §RНачалась Вторая мировая война§!"
ase_WW2_Started_REMARK:0 "Война это Ад..."

ase_Great_Italy:0 "§RДостигнута цель итальянского ирредентизма§!"
ase_Great_Italy_QUOTE:0 "Сегодня Дуче провозгласил начало интеграции в страну регионов, права на которые заявили итальянские ирредентисты. Он объявил, что это усилит позицию Италии как мировой державы и наконец-то объединит итальянский народ под одним флагом."
ase_Great_Italy_REMARK:0 "Vincere!"

ase_Anschluss:0 "§RАншлюс Австрии§!"
ase_Anschluss_QUOTE:0 "После успешно проведенного местными нацистами переворота в Вене, немецкие войска пересекли границу Австрии и захватили страну. По сообщениям, никакого сопротивления не было, немецких солдат встречала на улицах восторженная толпа. Перед собравшимися на Хельденплац в Вене Гитлер объявил об аншлюсе Австрии, то есть о присоединении ее к Германии: «Старейшая немецкая восточная провинция станет отныне новым бастионом Германского рейха!»"
ase_Anschluss_REMARK:0 "А это точно законно?"
ase_Anschluss_REMARK_a:0 "Добро пожаловать в Рейх!"

ase_Czech:0 "§RСудьба Чехословакии§!"
ase_Czech_QUOTE:0 "Немецкие войска вторглись в Богемию и Моравию с целью поддержания порядка после падения чешского правительства. \n\nВ Праге оккупационные силы заявили о создании «автономного протектората» Третьего рейха.\n Чехословакии больше не существует."
ase_Czech_REMARK:0 "Вот вам и мир"

ase_Stalingrad:0 "§RБитва за Сталинград§!"
ase_Stalingrad_QUOTE:0 "В данный момент просходит сталинградская мясорубка. \nПока не ясно кто окончательно владеет городом, однако немецкие силы значительно продвинулись в глубь жилой застройки. \n\nРезультаты этой битвы будут иметь решающее значение в войне."
ase_Stalingrad_REMARK:0 "Ужасное зрелище..."

ase_Dday:0 "§RВысадка в Нормандии§!"
ase_Dday_QUOTE:0 "Под прикрытием мощной авиации и артиллерии тысячи солдат пересекли Ла-Манш, чтобы открыть долгожданный второй фронт в Европе. \nНесмотря на ожесточённое сопротивление немецких войск, союзники сумели закрепиться на побережье и начать наступление вглубь Франции. \n §RНеужели это конец нацистской гегемонии в Европе?§!"
ase_Dday_REMARK:0 "Перелом в войне?"

ase_Berlin:0 "§RБитва за Берлин§!"
ase_Berlin_QUOTE:0 "Красная Армия заняла большую часть Берлина и Рейхстаг. Бои на улицах города идут с ожесточением — дом за домом, квартал за кварталом, советские войска продвигаются вперёд. \n\nНемецкие войска, несмотря на окружение и безысходность, продолжают сопротивляться до последнего. \n- §RБерлин пал§!"
ase_Berlin_REMARK:0 "Всё шло к этому..."
ase_Berlin_REMARK_ger:0 "Держать столицу до конца!"

ase_Cairo:0 "§RПадение Каира§!"
ase_Cairo_QUOTE:0 "Древний город на берегах Нила пал. Символ арабского мира и сердце Египта оказался в руках нацистов. Толпы людей бегут по улицам, мечети молчат, а над городом поднимаются германские флаги. Судьба всего региона теперь висит на волоске — падение Каира стало ударом не только по Египту, но и по всему Ближнему Востоку. \n- §R«Кто владеет Каиром — тот владеет Востоком»§!"
ase_Cairo_REMARK:0 "Защищайте нефть"

ase_Moskov:0 "§RБитва за Москву§!"
ase_Moskov_QUOTE:0 "Снег и сталь смешались в смертельной схватке. Враг стоит у ворот столицы — и судьба страны решается здесь, на подступах к Москве. \nКаждый дом превращён в крепость, каждая улица — в поле боя. На красных стенах Кремля отражаются вспышки взрывов, а по радио звучат слова: \n“§RМосква за нами! Отступать некуда!§!”"
ase_Moskov_REMARK:0 "Конец красному гиганту?"

ase_Fall_Fra:0 "§RКапитуляция Франции§!"
ase_Fall_Fra_QUOTE:0 "Париж пал. Колонны нацистов маршируют по Елисейским Полям, а французское правительство подписывает акт капитуляции. \nЕвропа вновь содрогается от звука победных фанфар противника. \nНо в сердце Франции ещё теплится искра сопротивления — те, кто не смирились, готовятся продолжить борьбу за свободу."
ase_Fall_Fra_REMARK:0 "Ну, они старались"
ase_Fall_Fra_REMARK_a:0 "Мы высшая раса!"

ase_Italy_War:0 "§RВступление Италии в войну§!"
ase_Italy_War_QUOTE:0 "Сегодня, на площади Венеции в Риме, Дуче выступил с речью к Народу Италии: "Cегодня на небесах пробил наш час — предначертанный судьбой! Много лет Италия ждала этого момента, сдерживая свою силу, выковывая решимость, теперь она вступает в войну не из страха, но из воли, из веры, из права быть великой державой." \n- §R"Судьба требует — и мы отвечаем!"§!"
ase_Italy_War_REMARK:0 "Очередная пешка Германии..."
ase_Italy_War_REMARK_a:0 "Наконец-то"
ase_Italy_War_REMARK_ita:0 "Saluto al Duce!"

ase_Kursk:0 "§RКурская дуга§!"
ase_Kursk_QUOTE:0 "Началось крупнейшее танковое сражение Второй мировой. После огромных котлов под Киевом, из-за недостатка снабжения, Красная армия была вынуждена отступить к Курску. На данный момент Вермахт догнал коммунистов и уже ведёт бои за город, пытаясь прорвать советскую оборону.\n- §RИсход этой битвы решит, кто удержит инициативу на Восточном фронте§!"
ase_Kursk_REMARK:0 "Они зашли слишком далеко..."
ase_Kursk_REMARK_a:0 "Германия победит!"

ase_ASE_Blitzkrieg:0 "§RБлицкриг§!"
ase_ASE_Blitzkrieg_QUOTE:0 "Молниеносная кампания в Польше показала превосходство новой немецкой тактики - §RБлицкрига§!! \nАвтономные танковые группы(кулаки) при активной поддержке авиации прорвали польскую оборону, нарушили связь между фронтами и вынудили польское правительство эвакуивароваться в Британию."
ase_ASE_Blitzkrieg_REMARK:0 "Интересная тактика"
ase_ASE_Blitzkrieg_REMARK_a:0 "Фюрер так и планировал!"

ase_2Sino_War:0 "§RВторая Японо-Китайская Война§!"
ase_2Sino_War_QUOTE:0 "После инцидента на мосту Марко Поло под Пекином §Rначалось полномасштабное японское вторжение§! на остальную часть материкового Китая. \n\nВ ответ Китай сформировал Второй объединенный фронт чтобы вместе противостоять японской угрозе."
ase_2Sino_War_REMARK:0 "Мир и так нестабилен..."
ase_2Sino_War_REMARK_g:0 "Тэнно хэйка, бандзай!"
ase_2Sino_War_REMARK_china:0 "Нас много - их мало"

ase_Winter_War:0 "§RЗимняя Война§!"
ase_Winter_War_QUOTE:0 "Ссылаясь на соображения безопасности для Ленинграда, советское руководство выдвигало несколько предложений о том, чтобы Финляндия уступила пограничные территории в обмен на земли в Карелии. \nФинляндия отказалась от этих предложений. \nВозможно вместо защиты Ленинграда Советский Союз намереваеться завоевать всю страну."
ase_Winter_War_REMARK:0 "Ещё одна война..."
ase_Winter_War_REMARK_c:0 "Мы пытались договориться!"
ase_Winter_War_REMARK_fin:0 "Njet, Molotoff!"

ase_Kiev:0 "§RПадение Киева§!"
ase_Kiev_QUOTE:0 "Несмотря на крупное комсомольское ополчение Киева, группа армий «Юг» и 2-я танковая группа из группы армий «Центр» прорвали оборону Юго-Западного фронта РККА.\nСоветские войска были окружены и разгромлены, остатки фронта отступили далеко за Днепр.\n\nМногие граждане особо и не скучают по коммунистам."
ase_Kiev_REMARK:0 "Коммунисты проигрывают?"
ase_Kiev_REMARK_c:0 "Мы должны были наступать!"
ase_Kiev_REMARK_a:0 "Это только начало!"

ase_Normandy:0 "§RАтлантический вал§!"
ase_Normandy_QUOTE:0 "Идёт к завершению стройка века — §R"Атлантическая стена"§!, которая по замыслу немецкого руководства должна обезопасить их от морского десанта с океана.\n\nФриц Тодт, рейхсминистр вооружения и боеприпасов, в своей манере, уже назначил дату празднования окончания стройки."
ase_Normandy_QUOTE_a:0 "Идёт к завершению стройка века — §R"Атлантическая стена"§!, которая по замыслу Фюрера должна отгородить немецкую нацию от варваров с моря.\n\nФриц Тодт, рейхсминистр вооружения и боеприпасов, уже назначил мероприятие по празднованию окончания стройки с большим тортом со свастикой."
ase_Normandy_REMARK:0 "Высадимся в другое место?"
ase_Normandy_REMARK_a:0 "Высадка? Какая высадка?"

ase_Spain_Civil_War:0 "§RГражданская война в Испании§!"
ase_Spain_Civil_War_QUOTE:0 "Днём мятежный генерал Гонсало Кейпо де Льяно, имевший репутацию либерала, неожиданно захватил власть в центральном городе южной Испании Севилье. Вскоре в городе начались ожесточённые бои между мятежниками и республиканцами. Затем мятеж перекинулся на всю Испанию. Восставшие добились значительных успехов, захватив 35 из 50 провинциальных центров страны."
ase_Spain_Civil_War_REMARK:0 "Ожидаемо..."
ase_Spain_Civil_War_REMARK_spr:0 "¡Viva España!"

ase_Spain_Franco_Win:0 "§RПобеда Франсиско Франко§!"
ase_Spain_Franco_Win_QUOTE:0 "Завершилась многолетняя гражданская война в Испании.\n\n"Красная армия развалилась, все главные пункты страны заняты национальными войсками. §RВойна окончена§!."\n— так каудильо, генералиссимус Франсиско Франко огласил победу Христианской Национальной Испании в ожесточенной войне против мировых коммунистических сил."
ase_Spain_Franco_Win_REMARK:0 "Примем к сведению..."
ase_Spain_Franco_Win_REMARK_a:0 "Новый союзник?"
ase_Spain_Franco_Win_REMARK_spr:0 "¡Viva Franco!"

ase_Citadel:0 "§RОперация Цитадель§!"
ase_Citadel_QUOTE:0 "Началось крупнейшее танковое сражение Второй мировой. После огромных котлов под Киевом, из-за недостатка снабжения, Красная армия была вынуждена отступить к Курску. На данный момент Вермахт догнал коммунистов и уже ведёт бои за город, пытаясь прорвать советскую оборону.\n- §RИсход этой битвы решит, кто удержит инициативу на Восточном фронте§!"
ase_Citadel_REMARK:0 "Они зашли слишком далеко..."
ase_Citadel_REMARK_a:0 "Решающее сражение!"

#######

ase_Nuclear1:0 "§RЯдерний фаллаут§!"
ase_Nuclear1_QUOTE:0 "В первый раз в истории ядерная бомба была взорвана в ходе военных действий. Ее применило государство [?global.nukecountry.GetNameDef]. Огромный масштаб разрушений говорит о мощи нового оружия, которое вызывает страх не только тем, на что оно способно, но и тем, какие последствия это несет и для тех, кто его использует, и для всего человечества.\n- §RМир затаил дыхание в ожидании§!"
ase_Nuclear1_REMARK:0 "Началась атомная эра..."

ase_Great_Reich:0 "§RВеликий Германский Рейх§!"
ase_Great_Reich_QUOTE:0 "После череды побед и расширения границ Рейх окончательно утвердил своё господство в Европе. Покорённые народы включены в новую систему власти, а Шпеер только что завершил проект по переустройству Берлина в Столицу мира — §RГерманию§!. Было воздвинуто самое большое купольное здание в мире — §RЗал Славы§! — символ единства, силы и непоколебимости арийской рассы."
ase_Great_Reich_REMARK:0 "Как мы допустили?"
ase_Great_Reich_REMARK_a:0 "Великая победа!"

ase_New_Order:0 "§RНовый мировой порядок§!"
ase_New_Order_QUOTE:0 "Падение Статуи Свободы стало символом конца старой эпохи. Больше не осталось силы, способной остановить нацистов. \nНа руинах бывшего мирового гегемона рождается §Rновый мировой порядок§!."
ase_New_Order_REMARK:0 "Это крах демократии..."

ase_Eva_Braun:0 "§RЖелезная леди§!"
ase_Eva_Braun_QUOTE:0 "Каким-то образом Ева Браун теперь господствует над США. Да, мы тоже не поняли, как это произошло.\nИсторики в шоке, генералы в панике, а кто-то явно §Rсломал таймлайн§!."
ase_Eva_Braun_REMARK:0 "Ну, она хотя бы красивая"


