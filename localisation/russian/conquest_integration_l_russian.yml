l_russian:
 conquest_integration.1.t:0 "Трофеи завоевания"
 conquest_integration.1.desc:0 "Теперь, когда [event_target:ci_conquered_country.GetName] находится под нашим контролем, их офицерский корпус, командиры и политические деятели остались не у дел. Мы можем принять их к себе на службу — их опыт не должен пропасть впустую."
 conquest_integration.1.advisors:0 "Интегрировать их советников"
 conquest_integration.1.commanders:0 "Интегрировать их командиров"
 conquest_integration.1.scientists:0 "Интегрировать их ученых"
 conquest_integration.1.industry:0 "Интегрировать их военную промышленность"
 conquest_integration.1.all:0 "Интегрировать всех"
 conquest_integration.1.decline:0 "Они нам ни к чему"
 ci_integrated_industry:0 "Интегрированная военная промышленность"
 ci_integrated_industry_desc:0 "Поглощенные фабрики, конструкторские бюро и квалифицированные рабочие покоренных нами стран. Каждая такая интеграция укрепляет нашу военную экономику."
 conquest_integration.2.t:0 "Военные трибуналы"
 conquest_integration.2.desc:0 "Офицеры и советники, которых мы намерены привлечь, сперва должны ответить за свои поступки. Трибуналы, чистки и старые счеты берут свое — лишь немногие получают допуск к службе. Остальные к нам не присоединятся."
 conquest_integration.2.a:0 "Да будет так"
 conquest_integration.5.t:0 "Захватить их флот"
 conquest_integration.5.desc:0 "[event_target:ci_capitulated_navy_country.GetName] капитулировала, и теперь ее боевые корабли стоят на якоре без флага, которому могли бы служить. Мы можем включить их флот в состав нашего. (Авианосцы захватить нельзя.)"
 conquest_integration.5.a:0 "Захватить их флот"
 conquest_integration.5.b:0 "Пусть ржавеет"
 conquest_integration.6.t:0 "Захваченные чертежи"
 conquest_integration.6.desc:0 "Конструкторские бюро [event_target:ci_defeated_licensor.GetName] попали в наши руки, а вместе с ними — чертежи их танков, самолетов и кораблей. Мы можем лицензировать их разработки для производства на наших собственных заводах."
 conquest_integration.6.a:0 "Захватить их производственные лицензии"
 conquest_integration.6.b:0 "Нам хватит и собственных разработок"
 RULE_GROUP_CI:0 "Интеграция завоеваний"
 RULE_CI_WAR_TRIALS:0 "Выживаемость на военных трибуналах"
 RULE_CI_WT_25:0 "Жестко (25%)"
 RULE_CI_WT_25_DESC:0 "Около четверти интегрируемых советников и генералов переживают трибуналы. Значение по умолчанию."
 RULE_CI_WT_10:0 "Беспощадно (10%)"
 RULE_CI_WT_10_DESC:0 "Выживает лишь каждый десятый. Большинство вражеских офицеров и советников подвергается чисткам."
 RULE_CI_WT_50:0 "Снисходительно (50%)"
 RULE_CI_WT_50_DESC:0 "Половина интегрируемых советников и генералов получает допуск к службе."
 RULE_CI_WT_75:0 "Великодушно (75%)"
 RULE_CI_WT_75_DESC:0 "Большинство вражеских офицеров и советников переходит к нам. Отсев почти отсутствует."
 RULE_CI_AI:0 "Интеграция завоеваний для ИИ"
 RULE_CI_AI_OFF:0 "Только игрок"
 RULE_CI_AI_OFF_DESC:0 "Только вы можете интегрировать трофеи завоевания. Страны под управлением ИИ игнорируют механики этого мода. Значение по умолчанию."
 RULE_CI_AI_ON:0 "Игрок и ИИ"
 RULE_CI_AI_ON_DESC:0 "Страны под управлением ИИ также интегрируют захваченных советников, командиров и промышленность и захватывают вражеские флоты при капитуляции."
 RULE_CI_LICENSE:0 "Захваченные производственные лицензии"
 RULE_CI_LIC_FREE:0 "Бесплатно"
 RULE_CI_LIC_FREE_DESC:0 "Лицензии, захваченные у побежденных стран, не несут штрафа к производству — стройте их танки, самолеты и корабли как свои собственные. Трофеи войны. Значение по умолчанию."
 RULE_CI_LIC_HALF:0 "Со скидкой (50%)"
 RULE_CI_LIC_HALF_DESC:0 "Захваченные лицензии несут половину обычного штрафа к производству."
 RULE_CI_LIC_FULL:0 "Полная стоимость"
 RULE_CI_LIC_FULL_DESC:0 "Захваченные лицензии несут тот же штраф к производству, что и обычная лицензия, полученная путем переговоров."
 RULE_CI_LIC_OFF:0 "Отключено"
 RULE_CI_LIC_OFF_DESC:0 "Побежденные страны не предоставляют производственных лицензий."
