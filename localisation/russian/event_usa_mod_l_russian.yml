 new_usa_an_peace_guarantees_for_neighbors_event.1.t: "[From.GetNameDefCap] желает заключить взаимное мирное соглашение"
 new_usa_an_peace_guarantees_for_neighbors_event.1.desc: "[from.GetAdjective] администрация передала нам сообщение относительно своего намерения обеспечить кольцо мира вокруг себя. Американцы, судя по всему, желают заключить взаимный пакт о сотрудничестве и дружбе со своими соседями, без сомнения, из-за недавних потрясений."
 new_usa_an_peace_guarantees_for_neighbors_event.1.a: "Сохраним мир"
 new_usa_an_peace_guarantees_for_neighbors_event.1.b: "Мы им не доверяем"
 new_usa_an_peace_guarantees_for_neighbors_event.2.t: "[From.GetNameDefCap] соглашается на взаимное мирное соглашение"
 new_usa_an_peace_guarantees_for_neighbors_event.2.desc: "[from.GetAdjective] правительство согласилось заключить с нами ряд мирных соглашений. Это поможет обеспечить дальнейшую безопасность и процветание американского народа."
 new_usa_an_peace_guarantees_for_neighbors_event.2.a: "Замечательно"
 new_usa_an_peace_guarantees_for_neighbors_event.3.t: "[From.GetNameDefCap] отклоняет взаимное мирное соглашение"
 new_usa_an_peace_guarantees_for_neighbors_event.3.desc: "Тревожно, но [From.GetAdjective] правительство отклонило наше предложение о взаимных мирных соглашениях. Что это будет означать для будущего — неясно, но нам, возможно, придётся следить за своей спиной."
 new_usa_an_peace_guarantees_for_neighbors_event.3.a: "Это может стать проблемой"

 new_usa_an_the_philadelphia_fiasco_event.1.t: "Филадельфийское фиаско"
 new_usa_an_the_philadelphia_fiasco_event.1.desc: "[GetDateText] обрушилась крыша нового театра «Амблтон» в Филадельфии, погибли 72 американца, ещё 40 получили ранения. Сразу же после этой трагедии местные и штатные чиновники начали расследование проекта общественных работ, в рамках которого был построен этот театр. Проект, финансируемый десятками конгрессменов, включал развитие городских парков, субсидии и фонды помощи, а также строительство театра и нового моста. Однако при более тщательном расследовании выяснилось, что из миллионов долларов, выделенных на различные части проекта, подавляющее большинство так и не вышло на свет. Более того, значительные средства, которые удалось отследить, оказались в карманах бизнесменов, клерков, чиновников и даже других конгрессменов, близких к организаторам. Однако наибольшее возмущение вызвало открытие того, что значительные ресурсы, которые должны были пойти на строительство театра, были отвлечены или удержаны, а сроки строительства были существенно ускорены благодаря «чрезмерно щедрому» одобрению различных норм безопасности.\n\nИными словами, коррумпированные федеральные чиновники дали волю своей жадности, и теперь более 100 американцев заплатили за эту коррупцию."
 new_usa_an_the_philadelphia_fiasco_event.1.a: "Наши лидеры — глупцы и мошенники!"

 usa_new_an_parkerite_act_event.1.t: "Соединённые Штаты ратифицируют 22-ю поправку"
 usa_new_an_parkerite_act_event.1.desc: "После многих лет ненадёжного управления и недавних трагедий, приписываемых повсеместной коррупции в федеральном правительстве, США официально ратифицировали «Закон паркеритов» — 22-ю поправку к Конституции.\nЗакон устанавливает ряд новых прав для отдельных штатов союза. Прежде всего, он даёт штатам право авторитетного вето на все федеральные проекты и федеральное финансирование, действующие в пределах их юрисдикции. Более того, все федеральные действия, предпринимаемые в пределах штата, подлежат полной проверке и открытости перед этим штатом, который также может вносить в проект поправки или изменять его по своему усмотрению.\n\nНа практике «Закон паркеритов» радикально сместит баланс государственной власти в Америке."
 usa_new_an_parkerite_act_event.1.a: "Народ у власти"
 usa_new_an_parkerite_act_event.1.b: "Занятно"

 usa_new_an_civil_war_event.1.t: "Вторая гражданская война в Америке"
 usa_new_an_civil_war_event.1.d: "Сегодня ранее несколько штатов по всему Союзу одновременно выдвинули официальные уведомления о выходе из состава США. В особняке в Ричмонде, штат Виргиния, представители каждого из этих штатов собрались вместе, чтобы подписать документ, разработка которого шла уже несколько месяцев, официально провозглашая создание нового союза штатов и свою поддержку ему. Назвав себя Свободными американскими штатами, дюжина представителей затем доставила копию этого документа прямиком в столицу США — Вашингтон. Однако по прибытии все представители были арестованы, и было созвано специальное заседание Конгресса из представителей оставшихся штатов. Спустя несколько часов Соединённые Штаты объявили войну Свободным американским штатам.\n\nВойна пришла на эту землю, и мы подверглись нападению. Мы делали всё возможное, чтобы позволить федеральному правительству оставаться в мире, не желая свергать его, но теперь оно пришло за нами! Их предательству и коррупции нет предела. Впрочем, нас это не удивило — мы прекрасно знали, каким будет их ответ. К несчастью для них, мы готовились."
 usa_new_an_civil_war_event.1.a: "За республику!"
 usa_new_an_civil_war_event.1.a.tt: "Сторонники демократии начинают гражданскую войну."
 usa_new_an_civil_war_event.2.t: "Вторая гражданская война в Америке"
 usa_new_an_civil_war_event.2.desc: "Ещё вчера по всей территории Соединённых Штатов вспыхнули боевые действия, сосредоточенные вокруг старого раскола между Севером и Югом. Американские националисты внутри США вновь объявили о выходе из состава, и федеральное правительство в ответ объявило им войну. \n\nКрупные бои идут в городских центрах по всему континенту: стычки между вооружёнными гражданами вспыхивают в крупных городах и округах на обоих побережьях, на Севере и Юге, внутри и за пределами общин. Вооружённые силы раскололись между враждующими правительствами."
 usa_new_an_civil_war_event.2.a: "Только не снова..."
 usa_new_an_civil_war_event.2.b: "По крайней мере, они знают, за что сражаются"
 usa_new_an_civil_war_event.2.c: "Опять?"
 usa_new_an_civil_war_event.3.t: "Золотой рассвет"
 usa_new_an_civil_war_event.3.desc: "После окончательной капитуляции старого американского правительства на его месте из пепла гражданской войны восстаёт [USA.GetNameDef]. Война принесла страшные разрушения по всему континенту, и, по имеющимся данным, десятки, если не сотни тысяч человек числятся пропавшими без вести или погибшими.\n\nКак это скажется на будущем страны, ещё предстоит увидеть, но, похоже, штаты вырвали бразды правления из рук федерального правительства."
 usa_new_an_civil_war_event.3.a: "Будем надеяться, что это не станет проблемой"
 usa_new_an_civil_war_event.3.b: "Понятно"
 usa_new_an_civil_war_event.4.t: "Американские националисты разбиты в Америке"
 usa_new_an_civil_war_event.4.desc: "Неожиданным поворотом событий измученное американское правительство и армия сумели подавить эту вторую попытку отделения. После кровопролитной гражданской войны погибли тысячи людей, но страна наконец-то снова может идти своим собственным курсом."
 usa_new_an_civil_war_event.4.a: "Понятно"
 usa_new_an_civil_war_event.5.t: "Восстание [USA.GetNameDef]"
 usa_new_an_civil_war_event.5.desc: "\nПосле политических потрясений, вызванных Великой депрессией, Соединённые Штаты перенесли своё главное средоточие власти от центрального федерального правительства к штатам. То, чего не смогла добиться Конфедерация 80 лет назад, теперь удалось осуществить штатам и новой администрации в Вашингтоне."
 usa_new_an_civil_war_event.5.a: "А..."
 usa_new_an_civil_war_event.5.b: "Понятно"

 new_usa_an_americas_rightful_claims_event.1.t: "[FROM.GetNameDefCap] требует нашей аннексии"
 new_usa_an_americas_rightful_claims_event.1.desc: "[FROM.GetAdjective] правительство направило нам ультиматум через наше посольство в Америке. Они утверждают, что [THIS.GetNameDefCap] и её территория входят в число законных притязаний американского народа. Они также продемонстрировали, что более чем готовы подкрепить эти притязания.\n\nКак нам ответить?"
 new_usa_an_americas_rightful_claims_event.1.a: "У нас нет выбора"
 new_usa_an_americas_rightful_claims_event.1.b: "Мы будем твёрды"
 new_usa_an_americas_rightful_claims_event.2.t: "[FROM.GetNameDefCap] принимает наши притязания на аннексию"
 new_usa_an_americas_rightful_claims_event.2.desc: "[FROM.GetAdjective] правительство приняло наши притязания на их территории и полностью подчинило свою администрацию нашей."
 new_usa_an_americas_rightful_claims_event.2.a: "Превосходно"
 new_usa_an_americas_rightful_claims_event.3.t: "[FROM.GetNameDefCap] отклоняет наши притязания"
 new_usa_an_americas_rightful_claims_event.3.desc: "[FROM.GetAdjective] правительство отклонило наши притязания на их территории и в ответ заявило, что готово рискнуть войной с [THIS.getName], чтобы защитить свой суверенитет."
 new_usa_an_americas_rightful_claims_event.3.a: "Мы не впечатлены"
 new_usa_an_americas_rightful_claims_event.3.b: "Сейчас не время"
 new_usa_an_americas_rightful_claims_event.3.c: "Возможно, мы были слишком амбициозны"
 new_usa_an_americas_rightful_claims_event.4.t: "[FROM.GetNameDefCap] требует нашего подчинения"
 new_usa_an_americas_rightful_claims_event.4.desc: "[FROM.GetAdjective] правительство направило нам ультиматум через наше посольство в Америке. Они утверждают, что [THIS.GetNameDefCap] и её территория входят в число законных притязаний американского народа. Они также продемонстрировали, что более чем готовы подкрепить эти притязания.\n\nКак нам ответить?"
 new_usa_an_americas_rightful_claims_event.4.a: "У нас нет выбора"
 new_usa_an_americas_rightful_claims_event.4.b: "Мы будем твёрды"
 new_usa_an_americas_rightful_claims_event.5.t: "[FROM.GetNameDefCap] принимает наши притязания на подчинение"
 new_usa_an_americas_rightful_claims_event.5.desc: "[FROM.GetAdjective] правительство приняло наши притязания на их территории и полностью подчинило свою администрацию нашей."
 new_usa_an_americas_rightful_claims_event.5.a: "Превосходно"
 new_usa_an_americas_rightful_claims_event.6.t: "[FROM.GetNameDefCap] отклоняет наши притязания"
 new_usa_an_americas_rightful_claims_event.6.desc: "[FROM.GetAdjective] правительство отклонило наши притязания на их территории и в ответ заявило, что готово рискнуть войной с [THIS.getName], чтобы защитить свой суверенитет."
 new_usa_an_americas_rightful_claims_event.6.a: "Мы не впечатлены"
 new_usa_an_americas_rightful_claims_event.6.b: "Сейчас не время"
 new_usa_an_americas_rightful_claims_event.6.c: "Возможно, мы были слишком амбициозны"

 new_usa_an_americas_rightful_claims_event.7.t: "[FROM.GetNameDefCap] требует аннексии наших американских территорий"
 new_usa_an_americas_rightful_claims_event.7.desc: "[FROM.GetAdjective] правительство направило нам ультиматум через наше посольство в Америке. Они утверждают, что наши владения в Америке входят в число законных притязаний американского народа, и также продемонстрировали, что более чем готовы подкрепить эти притязания силой, если потребуется.\n\nКак нам ответить?"
 new_usa_an_americas_rightful_claims_event.7.a: "Разумнее было бы избежать войны"
 new_usa_an_americas_rightful_claims_event.7.b: "Они не знают своего места"
 new_usa_an_americas_rightful_claims_event.8.t: "[FROM.GetNameDefCap] передаёт нам свои американские территории"
 new_usa_an_americas_rightful_claims_event.8.desc: "[FROM.GetAdjective] правительство приняло наши притязания на их территории и полностью передало их нам."
 new_usa_an_americas_rightful_claims_event.8.a: "Превосходно"
 new_usa_an_americas_rightful_claims_event.9.t: "[FROM.GetNameDefCap] отклоняет наши притязания"
 new_usa_an_americas_rightful_claims_event.9.desc: "[FROM.GetAdjective] правительство отклонило наши притязания на их американские территории и заявило, что более чем готово поставить нас на место, если мы продолжим давить."
 new_usa_an_americas_rightful_claims_event.9.a: "Мы преподадим Старому Свету урок"
 new_usa_an_americas_rightful_claims_event.9.b: "Мы неверно выразились"
 new_usa_an_americas_rightful_claims_event.9.c: "Они правы..."
 new_usa_an_americas_rightful_claims_event.10.t: "[FROM.GetNameDefCap] требует подчинения наших американских территорий"
 new_usa_an_americas_rightful_claims_event.10.desc: "[FROM.GetAdjective] правительство направило нам ультиматум через наше посольство в Америке. Они утверждают, что наши владения в Америке входят в число законных притязаний американского народа, и также продемонстрировали, что более чем готовы подкрепить эти притязания силой, если потребуется.\n\nКак нам ответить?"
 new_usa_an_americas_rightful_claims_event.10.a: "Разумнее было бы избежать войны"
 new_usa_an_americas_rightful_claims_event.10.b: "Они не знают своего места"
 new_usa_an_americas_rightful_claims_event.11.t: "[FROM.GetNameDefCap] передаёт нам свои американские территории"
 new_usa_an_americas_rightful_claims_event.11.desc: "[FROM.GetAdjective] правительство приняло наши притязания на их территории и полностью передало их нам."
 new_usa_an_americas_rightful_claims_event.11.a: "Превосходно"
 new_usa_an_americas_rightful_claims_event.12.t: "[FROM.GetNameDefCap] отклоняет наши притязания"
 new_usa_an_americas_rightful_claims_event.12.desc: "[FROM.GetAdjective] правительство отклонило наши притязания на их американские территории и заявило, что более чем готово поставить нас на место, если мы продолжим давить."
 new_usa_an_americas_rightful_claims_event.12.a: "Мы преподадим Старому Свету урок"
 new_usa_an_americas_rightful_claims_event.12.b: "Мы неверно выразились"
 new_usa_an_americas_rightful_claims_event.12.c: "Они правы..."

 new_usa_an_our_saftey_before_yours_event.1.t: "[FROM.GetNameDefCap] требует признать американскую торговую гегемонию"
 new_usa_an_our_saftey_before_yours_event.1.desc: "[FROM.GetAdjective] администрация начала кампанию по утверждению себя титаном торговли в Западном полушарии. С этой целью они потребовали, чтобы [THIS.getName] подчинилась их новым торговым законам, которые дадут им значительное преимущество на переговорах и потребуют от нас открыть нашу инфраструктуру для использования их вооружёнными силами. Взамен [from.GetAdjective] правительство обещает дополнительно обеспечить нашу безопасность от иностранных сил.\n\nВпрочем, учитывая, что они и ранее уже придерживались своей доктрины Монро, это на самом деле просто услуга, которую нам теперь придётся оказать им за удовольствие."
 new_usa_an_our_saftey_before_yours_event.1.a: "Это в наших интересах"
 new_usa_an_our_saftey_before_yours_event.1.b: "Нас не запугать"
 new_usa_an_our_saftey_before_yours_event.2.t: "[FROM.GetNameDefCap] признаёт нашу торговую гегемонию"
 new_usa_an_our_saftey_before_yours_event.2.desc: "[FROM.GetAdjective] администрация официально приняла наши требования о расширении торговых привилегий [FROM.getName] в отношении [THIS.GetNameDefCap]. Они также открыли свою внутреннюю инфраструктуру для нашего использования."
 new_usa_an_our_saftey_before_yours_event.2.a: "Превосходно"
 new_usa_an_our_saftey_before_yours_event.3.t: "[FROM.GetNameDefCap] отклоняет наши требования"
 new_usa_an_our_saftey_before_yours_event.3.desc: "[FROM.GetAdjective] администрация отклонила наши притязания на торговую гегемонию в полушарии. Своим отказом они демонстративно бросают нам вызов."
 new_usa_an_our_saftey_before_yours_event.3.a: "Как неблагодарно..."

 new_usa_an_USA_the_second_confederation_event.1.t: "Первый президент Второй конфедерации"
 new_usa_an_USA_the_second_confederation_event.1.desc: "По мере того как Конфедерация обретает форму, а центральная администрация конфедеративного правительства заканчивает переезд в новую столицу — Ричмонд, — уже идут первые президентские выборы. Свои кандидатуры выдвинули сотни претендентов, но наибольшую поддержку получили двое: Уильям Дадли Пелли и Смедли Батлер.\n\nПелли позиционирует себя как «американского фюрера», перенимая стиль и организацию режима Гитлера в Германии. Он харизматичен и предан делу, хотя несколько фанатичен в некоторых своих взглядах по сравнению со средним американцем.\n\nБатлер — военачальник, ранее едва не оказавшийся замешан в попытке переворота против старого режима, и теперь он вновь оказался на пороге высшей должности, предлагая себя в качестве гражданского командующего нацией.\n\nИ победителем становится..."
 new_usa_an_USA_the_second_confederation_event.1.a: "Уильям Дадли Пелли"
 new_usa_an_USA_the_second_confederation_event.1.b: "Смедли Батлер"
 new_usa_an_USA_the_goldstar_federation_event.1.t: "Первый президент Федерации"
 new_usa_an_USA_the_goldstar_federation_event.1.desc: "По мере того как Федерация обретает форму, а новое правительство реорганизует себя в Вашингтоне, уже идут первые президентские выборы. Свои кандидатуры выдвинули и заявили о себе множество кандидатов со всей страны, но наибольшую поддержку получили двое: Джон Обиц и Роберт И. Вуд.\n\nОбиц — недавно прославившийся основатель сети «Золотая звезда», духовного станового хребта нашей новой государственной структуры. Бывший военный инженер и начинающий философ, его сторонники окрестили его «Фениксом Золотой звезды».\n\nВуд — фигура с Уолл-стрит с впечатляющим послужным списком, бывший глава Sears и ведущий член движения «Америка прежде всего». Его прошлое и связи, вероятно, хорошо подготовили бы его к этой роли.\n\nИ победителем становится..."
 new_usa_an_USA_the_goldstar_federation_event.1.a: "Джон Обиц"
 new_usa_an_USA_the_goldstar_federation_event.1.b: "Роберт И. Вуд"

 new_usa_the_eagle_flies_alone_event.1.t: "[FROM.GetNameDefCap] начинает движение к утверждению гегемонии над Америками"
 new_usa_the_eagle_flies_alone_event.1.desc: "[FROM.GetAdjective] правительство начало делать заявления о своём полном и абсолютном господстве в Америках, провозглашая, что их воля — безраздельно править полушарием. Вслед за этими заявлениями они направили прямые сигналы [ROOT.GetAdjective] администрации и руководству, требуя подчиниться их контролю и власти — или же."
 new_usa_the_eagle_flies_alone_event.1.a: "Мы признаем их власть"
 new_usa_the_eagle_flies_alone_event.1.b: "Мы не подчинимся"
 new_usa_the_eagle_flies_alone_event.2.t: "[FROM.GetNameDefCap] признаёт нашу власть"
 new_usa_the_eagle_flies_alone_event.2.desc: "[FROM.GetAdjective] государство официально и публично признало наше положение гегемона Запада, и они согласились с условиями, которые мы им направили касательно торгового и промышленного сотрудничества и совместной безопасности."
 new_usa_the_eagle_flies_alone_event.2.a: "Превосходно"
 new_usa_the_eagle_flies_alone_event.3.t: "[FROM.GetNameDefCap] отклоняет наши притязания"
 new_usa_the_eagle_flies_alone_event.3.desc: "[FROM.GetAdjective] государство бросило нам вызов, заявив, что отказывается уступать давлению [ROOT.GetAdjective] и предпочтёт сражаться за сохранение статус-кво."
 new_usa_the_eagle_flies_alone_event.3.a: "Им от нас не уйти"
 new_usa_the_eagle_flies_alone_event.3.b: "Мы это запомним"

 usa_new_an_song_for_the_horizon_event.1.t: "[FROM.GetNameDefCap] объявляет о намерениях в отношении «Великого явного предначертания»"
 usa_new_an_song_for_the_horizon_event.1.desc: "\n[FROM.GetAdjective] правительство объявило о новой инициативе. «Песнь для горизонта», как они её называют, судя по всему, будет означать, что [FROM.GetAdjective] народ распространит своё влияние и господство на весь мир. Что это будет означать на практике, ещё предстоит увидеть.\n\n[ENG.GetAdjective], [GER.GetAdjective], [JAP.GetAdjective], [SOV.GetAdjective] и другие правительства отреагировали с разной степенью тревоги, пренебрежения или осуждения, и различные мировые лидеры уже начали искать превентивные решения этой возможной новой угрозы.\n\nЕсли американцы говорят серьёзно, их песнь может стать гимном нового, более масштабного конфликта."
 usa_new_an_song_for_the_horizon_event.1.a: "По коням!"
 usa_new_an_song_for_the_horizon_event.1.b: "Да поможет нам всем Бог..."

