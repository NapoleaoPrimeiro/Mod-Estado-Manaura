 new_usa_country_roads_through_the_north_event.1.t: "[FROM.GetNameDefCap] желает выкупить у нас Западный разрыв"
 new_usa_country_roads_through_the_north_event.1.desc: "[FROM.GetAdjective] правительство дало нам понять, что хотело бы выкупить контролируемую нами территорию между Аляской и материковой частью Америки. Более того, они предлагают заплатить за неё по высшему разряду. Стоит ли нам продать им эти территории?"
 new_usa_country_roads_through_the_north_event.1.a: "Выгодная сделка"
 new_usa_country_roads_through_the_north_event.1.b: "Мы так не думаем"
