 USA_america_the_proud: "Гордая Америка"
 USA_america_the_proud_desc: "В 11-й час мы держимся. Мы не отступим, не падём, не потерпим поражения. Мы выгоним захватчиков в море и разобьём их. Демократия устоит!"
 USA_america_the_proud_tt: "Если нам не удастся выбить врага, мы начнём нести §Rштрафы§!."
 
 USA_political_shift: "Политический сдвиг"
 USA_political_shift_desc: "Недавние потрясения в политической жизни ведут к странным и необычным политическим линиям, стремящимся к демократии иными путями."
 USA_political_shift_tt: "§YВремя§! выполнения этого фокуса может быть §Gсокращено§! в зависимости от первоначального выбора пути."
 
 USA_roosevelt_stays: "Рузвельт остаётся"
 USA_roosevelt_stays_desc: "ФДР пользуется поддержкой американского народа, и его лояльное правительство и мощное руководство ведут нас вперёд."
 
 USA_alf_landons_government: "Правительство Альфа Лэндона"
 USA_alf_landons_government_desc: "Альф Лэндон обеспечил поддержку Америки, и его политика и руководство выведут Америку из упадка в новую светлую эру."
 
 USA_asymmetric_operations: "Асимметричные операции"
 USA_asymmetric_operations_desc: "Наша разведка должна специализироваться на закулисной работе в других странах, формируя общественное мнение в соответствии с нашими взглядами. Мы можем использовать нашу мощь и богатство для демонстрации наших ценностей на поверхности, а УСС — для их продвижения под ней."
 
 USA_counter_espionage: "Контрразведка"
 USA_counter_espionage_desc: "Нашей стране угрожают иностранные агенты. Мы убедимся, что враг не сможет узнать ничего полезного."
 
 USA_trade_policy: "Торговая политика"
 USA_trade_policy_desc: "Мы можем резко повысить эффективность и координацию наших торговых отношений, устанавливая стандарты нашей торговой политики."
 USA_trade_policy_tt: "§YВремя§! выполнения этого фокуса может быть §Gсокращено§! фокусом §Y$USA_trade_policy$§!."
 
 USA_encourage_domestic_trade: "Поощрять внутреннюю торговлю"
 USA_encourage_domestic_trade_desc: "По мере восстановления экономики американцы смогут всё чаще заниматься межштатной торговлей. Это дополнительно улучшит темпы восстановления и поможет вернуться к прежнему росту."
 
 USA_grow_export_market: "Развивать экспортный рынок"
 USA_grow_export_market_desc: "Нам следует уделить особое внимание увеличению товаров, которые мы можем продавать за рубеж, и обогащению американских отраслей."
 
 USA_subsidize_imports: "Субсидировать импорт"
 USA_subsidize_imports_desc: "Для того чтобы ввозить нужные нам материалы и товары, мы обеспечим каждому американцу возможность приобретать лучшее, что предлагает остальной мир."
 
 USA_tax_imports: "Обложить импорт пошлиной"
 USA_tax_imports_desc: "По сути, нам нужна самодостаточность, и мы должны стараться направлять как можно больший рост и торговлю во внутреннее русло. Что касается того, что мы всё же ввозим, мы должны максимизировать его ценность для нас."
 
 USA_boost_imports: "Стимулировать импорт"
 USA_boost_imports_desc: "Америка не единственный источник материального богатства в мире, и, развивая собственное богатство, мы должны быть открыты для помощи от других."
 
 USA_emphasize_trade_leverage: "Акцентировать торговые рычаги"
 USA_emphasize_trade_leverage_desc: "Наш акцент должен быть на получении рычагов влияния над странами, с которыми мы ведём дела."
 
 USA_emphasize_trade_security: "Акцентировать торговую безопасность"
 USA_emphasize_trade_security_desc: "Наш акцент должен быть на том, чтобы наша экономика не могла быть поставлена под угрозу действиями иностранных игроков."
 
 USA_emphasize_trade_growth: "Акцентировать торговый рост"
 USA_emphasize_trade_growth_desc: "Наш акцент должен быть на использовании внешней торговли для максимизации внутреннего роста."
 
 USA_prioritize_state_trade_authority: "Приоритет торговых полномочий штатов"
 USA_prioritize_state_trade_authority_desc: "По сути, торговые полномочия должны принадлежать самим штатам. Именно из их локальных экономик черпает силу вся страна в целом."
 
 USA_prioritize_market_trade_authority: "Приоритет торговых полномочий рынка"
 USA_prioritize_market_trade_authority_desc: "По сути, торговые полномочия должны принадлежать самому рынку. Поток товаров и обмен ценностями — слишком масштабный процесс, чтобы им управляли единые организованные структуры."
 
 USA_prioritize_federal_trade_authority: "Приоритет торговых полномочий федерации"
 USA_prioritize_federal_trade_authority_desc: "По сути, торговые полномочия должны принадлежать федеральному правительству. Именно на национальном уровне США ведут дела с другими странами, и именно на национальном уровне необходимо обеспечивать и поддерживать наши интересы."
 
 USA_expand_resource_production: "Расширить добычу ресурсов"
 USA_expand_resource_production_desc: "Америка полна огромными запасами ещё не освоенных и не открытых ресурсов, готовых обогатить наш народ и мир. Нам следует сделать всё возможное для инвестирования в наш базовый ресурсный рынок. Это создаст прочную базу для роста наших передовых отраслей."
 
 USA_develop_higher_quality_products: "Разрабатывать продукты более высокого качества"
 USA_develop_higher_quality_products_desc: "Одно из лучших качеств американской экономики — производство высококачественного оборудования. Нам нужно оживить наши отрасли прецизионной механики, чтобы поддержать этот стандарт."
 
 USA_formalize_arms_trading: "Формализовать торговлю оружием"
 USA_formalize_arms_trading_desc: "Закрепив наше присутствие на рынке, мы теперь можем полностью направить наши отрасли на продажу вооружений странам, нуждающимся в средствах обороны."
 
 USA_international_industrial_tutelage: "Международное промышленное наставничество"
 USA_international_industrial_tutelage_desc: "Экспертиза Америки в массовой промышленности и производстве ставит её в отличное положение для помощи другим странам, не развившим свои отрасли до такой же степени. Почему бы не помочь им тоже расти? Это стало бы очень популярным шагом."
 USA_international_industrial_tutelage_tt: "Открывает §Yrешения§! для развития и роста §Yпромышленности§! других стран, в свою очередь повышая общественное одобрение правительства."
 
 USA_department_of_territorial_integrity: "Департамент территориальной целостности"
 USA_department_of_territorial_integrity_desc: "ДТЦ будет осуществлять надзор за нашим кругом действий в отношении того, как мы управляем землями, которые попадают в наше владение. Это крайне важная функция — мы стремимся поддерживать мир и свободу, но должны оставаться бдительными, чтобы не подвергать риску собственных людей."
 
 USA_focus_on_civil_administration: "Сосредоточиться на гражданском управлении"
 USA_focus_on_civil_administration_desc: "Мы обязаны улучшать и защищать подконтрольные нам территории по всему миру, независимо от того, как мы получили над ними контроль. Мы должны убедиться, что правильно разрабатываем любую политику оккупации — с целью соблюдения наших ценностей и неприкосновенности тех, кем мы управляем."
 
 USA_apple_pie_diplomacy: "Дипломатия яблочного пирога"
 USA_apple_pie_diplomacy_desc: "Имея дело с иностранными землями, мы воплощаем наши американские ценности и распространяем их везде, куда бы ни пришли. Мы завоюем сердца и умы наших врагов и противников так же просто, как угощая их вкусным яблочным пирогом!"
 USA_apple_pie_diplomacy_tt: "Открывает закон об оккупации §Y$apple_pie_occupation$§!."
 
 USA_reconstruction_efforts: "Усилия по восстановлению"
 USA_reconstruction_efforts_desc: "Мы оккупируем территорию, разорённую конфликтом. Наш долг — помочь жителям и как можно скорее и как можно лучше восстановить их уклад жизни."
 
 USA_foreign_development_projects: "Иностранные проекты развития"
 USA_foreign_development_projects_desc: "Производство снаряжения, строительство инфраструктуры и создание безопасной среды на иностранной территории — это совершенно иная задача по сравнению с внутренними регионами. Для разработки и координации строительства наших подконтрольных территорий с целью обеспечения порядка и эффективности будет создана Международная девелоперская компания."
 USA_foreign_development_projects_tt: "Открывает промышленный концерн §Y$international_development_company$§!."
 
 USA_focus_on_maintaining_security: "Сосредоточиться на поддержании безопасности"
 USA_focus_on_maintaining_security_desc: "Наш первый приоритет при управлении оккупированными землями — обеспечить защиту американских граждан, союзников и интересов там. Как только они будут в безопасности, мы сможем заняться поддержкой местного населения."
 
 USA_industrial_continuity: "Промышленная преемственность"
 USA_industrial_continuity_desc: "Важно, чтобы регионы, которые мы берём под контроль, поддерживали уровень производительности. Нет смысла позволять промышленности наших подконтрольных земель простаивать."
 USA_industrial_continuity_tt: "Открывает закон об оккупации §Y$continuity_occupation$§!."
 
 USA_support_occupation_police_forces: "Поддержать полицию оккупации"
 USA_support_occupation_police_forces_desc: "Наши оккупационные войска и полиция постоянно находятся под угрозой со стороны экстремистов и радикалов. Мы вложим средства в оснащение нашего зарубежного правопорядка инструментами и финансированием, необходимыми для поддержания порядка."
 
 USA_spread_american_ideals: "Распространять американские идеалы"
 USA_spread_american_ideals_desc: "Мы воплотим священные для нас идеалы и будем продвигать их везде и при любой возможности. Если мы сделаем это правильно, все остальные увидят, что плоды нашего труда связаны с истинами, которые мы исповедуем."
 USA_spread_american_ideals_tt: "§GУлучшает§! закон об оккупации §Y$apple_pie_occupation$§!.\n§GУлучшает§! промышленный концерн §Y$international_development_company$§!."
 
 USA_establish_regional_administrations: "Создать региональные администрации"
 USA_establish_regional_administrations_desc: "Мы будем управлять нашими зарубежными владениями с ориентацией на эффективность и надлежащее управление, обеспечивая жителей там, защищая наши собственные интересы и в конечном счёте принося пользу Соединённым Штатам Америки."
 USA_establish_regional_administrations_tt: "§GУлучшает§! закон об оккупации §Y$continuity_occupation$§!.\n§GУлучшает§! промышленный концерн §Y$international_development_company$§!."
 
 USA_advanced_decryption_department: "Взлом кодов"
 USA_advanced_decryption_department_desc: "Теперь, когда в нашем распоряжении физические устройства, способные вычислять огромное количество алгебраических уравнений за ничтожно малое время по сравнению с тем, что это занимало раньше, мы можем разрабатывать новые методы взлома шифров, позволяющие проникать даже сквозь самые сложные коды и докапываться до секретов наших противников."
 
 USA_restore_the_kadets: "Восстановить кадетов"
 USA_restore_the_kadets_desc: "После поражения [SOV.GetNameDefCap] нашей миссией станет восстановление их кратковременного демократического движения и возвращение его к власти. Синяя Россия будет господствовать в степях."
 
 USA_cold_world: "Холодный мир"
 USA_cold_world_desc: "Объединив наши огромные силы, Америка и [SOV.GetNameDefCap] готовы взять под контроль весь мир. Наступает новая эра, в которой глобус подпадает под господство двух его величайших держав, объединённых целью — пусть и не идеологией."
 
 USA_extensive_support_operations: "Масштабные операции поддержки"
 USA_extensive_support_operations_desc: "Мы снабдим [SOV.GetNameDefCap] потоком снаряжения и всей разведкой, которую только сможем собрать. Мы будем тесно работать с ними для обеспечения их окончательной победы над нашими общими врагами. Однако наша поддержка останется на этом уровне — у нас разные взгляды на мир, нам просто нужно выиграть эту войну."
 
 USA_joint_operations: "Совместные операции"
 USA_joint_operations_desc: "Мы будем тесно работать с союзниками для максимально эффективного ведения этой войны. Взаимодействуя с ведущими военными командирами наших союзников, мы разработаем новые планы действий, которые позволят нам достичь победы."
 
 USA_the_united_nations_alliance: "Альянс Объединённых Наций"
 USA_the_united_nations_alliance_desc: "Наше дело — уничтожить разрушительные силы по всему миру. К нашему делу может присоединиться каждый народ каждого континента. Мы — голос человечества против мрака тирании."
 USA_the_united_nations_alliance_tt: "Альянс Объединённых Наций"
 
 USA_homecoming_of_liberty: "Возвращение свободы"
 USA_homecoming_of_liberty_desc: "Настало время Соединённым Штатам Америки вернуться в Старый Свет — и принести с собой свободу. То, что Основатели начали в 1776 году, мы теперь завершим."
 
 USA_secure_europes_industries: "Взять под контроль европейскую промышленность"
 USA_secure_europes_industries_desc: "Как самый богатый и индустриализированный континент на Земле, Европа — великий подарок нашему Союзу. Её огромное население и мощная промышленность теперь будут способствовать американскому образу жизни."
 
 USA_stars_and_stripes_beyond_the_rhine: "Звёзды и полосы за Рейном"
 USA_stars_and_stripes_beyond_the_rhine_desc: "Пора завершить наше наступление и прорваться через всю Европу. Красно-бело-синее знамя будет развеваться от Парижа до Берлина и Варшавы."
 USA_stars_and_stripes_beyond_the_rhine_trigger_tt: " Контролирует штат в §YЕвропе§!"
 USA_stars_and_stripes_beyond_the_rhine_tt: "Мы получим §Yповоды для войны§! против каждой §Yевропейской нации§!, с которой мы не воюем и не состоим в союзе."
 
 USA_vanguard_of_the_atlantic: "Авангард Атлантики"
 USA_vanguard_of_the_atlantic_desc: "Как только мы установим контроль, Атлантика перестанет быть для наших флотов непроходимой водяной стеной — она станет соединительной тканью, связывающей два наших континента. Она будет переполнена кораблями, перевозящими людей, товары, машины, знания и всё остальное, и при этом будет фланкирована и рассекаема нашим могучим флотом."
 
 USA_dawn_over_europe: "Рассвет над Европой"
 USA_dawn_over_europe_desc: "Наконец, Европа под нашим контролем. Теперь начинается самое трудное — интеграция. Однако наша культура является смесью преимущественно европейских культур, поэтому у нас есть большой задел для помощи Старому Свету по-настоящему адаптироваться и слиться с Новым."
 #USA_dawn_over_europe_trigger_tt: " We, or our Faction members, control Paris, London, Berlin, Warsaw, Rome, and Madrid and the states they reside in."
 USA_dawn_over_europe_trigger_tt: " Мы или члены нашей фракции контролируем §YПариж§!, §YЛондон§!, §YБерлин§!, §YРим§! и §YМадрид§! и штаты, в которых они находятся."
 USA_dawn_over_europe_tt: "Открывает §Yрешения§! по §Gнационализации§! §Yгосударств Западной Европы§! с высоким уровнем §Yподчинения§!."
 
 USA_war_is_business: "Война — это бизнес"
 USA_war_is_business_desc: "Война — это многое: жестокость, разрушение, ужас... и прибыль. Нам даже не нужно участвовать в боях — мы можем позволить другим нациям воевать в собственных конфликтах, сами поглощая разницу в доходах."
 war_is_business_flag: " Не брался за фокус §Y$USA_casting_cinders$§! в последние §Y180§! дней"
 USA_war_is_business_tt: "Открывает §Yrешения§! по установлению других стран в качестве §Y«Партнёров по оружию»§! и развитию торговли с ними.\n  - $USA_establish_official_partnership_decision_tooltip_tt$"
 
 USA_balanced_carnage: "Сбалансированная бойня"
 USA_balanced_carnage_desc: "Война может быть прибыльной, но когда война заканчивается, прекращается и поток снаряжения, необходимого для её поддержки. Для обеспечения стабильного потока прибыли может быть в наших интересах поощрять или убеждать новых участников присоединиться, а возможно, мы и сами сможем организовывать конфликты."
 War_Credits_tt: "§YВоенные кредиты§!"
 War_Credit_tt: "§YВоенный кредит§!"
 USA_balanced_carnage_tt: "Открывает £usa_war_credits_texticon $War_Credits_tt$ \n  - Каждый $War_Credit_tt$, которым мы обладаем, принесёт нам §G5§! §YПрофицита экономической ёмкости§! в конце каждого месяца. $War_Credits_tt$ также можно тратить на другие вещи."
 USA_balanced_carnage_tt_2: "Открывает §Yrешения§! для вмешательства в войны наших §YПартнёров по оружию§!, затягивая их и принося нам $War_Credits_tt$."
 
 USA_casting_cinders: "Разжигание искр"
 USA_casting_cinders_desc: "Там, где за рубежом царит мир, мы видим лишь закрытые для продукции нашей военной промышленности рынки. Это нас не устраивает. Мир — лишь набор пороховых бочек, которым нужна лишь искра."
 casting_cinders_flag: " Не брался за фокус §Y$USA_war_is_business$§! в последние §Y180§! дней"
 
 USA_aid_all_sides: "Поддержать все стороны"
 USA_aid_all_sides_desc: "Чтобы поддерживать войну, нам нужно убедиться, что схватки не заканчиваются досрочно. Независимо от того, какую сторону они поддерживают, нам нужно держать каждого участника в бою как можно дольше, чтобы принести нам как можно больше денег."
 
 USA_mutually_assured_profits: "Взаимно гарантированные прибыли"
 USA_mutually_assured_profits_desc: "Войны — такие превосходные источники дохода, что жаль, что вся эта прибыль не течёт только к нам! Мы обгоним каждую иностранную торговую нацию или захватим её рынки, чтобы в конечном счёте именно мы оказывались в плюсе от любого конфликта в мире."
 USA_mutually_assured_profits_trigger_tt: " Имеет §G[?USA.usa_arms_partners_variable]§! из минимум §R5§! §YПартнёров по оружию§!"
 USA_mutually_assured_profits_tt: "Открывает §Yrешения§! для повышения уровня духа для наших §YПартнёров по оружию§!, крепко удерживая их в наших руках и извлекая выгоду за их счёт.\n  - За каждого §YПартнёра по оружию§! мы теперь будем получать §G1250§! §YПрофицита экономической ёмкости§! ежемесячно.\n  - Каждый $War_Credit_tt$, которым мы обладаем, теперь принесёт нам §G10§! §YПрофицита экономической ёмкости§! в конце каждого месяца."
 
 USA_orchestrate_the_infernos: "Организовывать инферно"
 USA_orchestrate_the_infernos_desc: "Наша военная промышленность созрела и стала весьма компетентной в организации схваток между другими сторонами. Нам больше не нужно полагаться на соперничество других наций — мы можем самостоятельно выбирать клиентов и вводить их в наш рынок."
 USA_orchestrate_the_infernos_trigger_tt: " Имеет §G[?USA.usa_arms_partners_variable]§! из минимум §R3§! §YПартнёров по оружию§!"
 USA_orchestrate_the_infernos_trigger_tt_2: " Имеет §G[?USA.usa_war_credits_var]§! из £usa_war_credits_texticon §R10§! §YВоенных кредитов§!"
 USA_orchestrate_the_infernos_tt: "Открывает §Yrешения§! для трат §YВоенных кредитов§! на организацию §Yвойн§! между странами, над которыми у нас значительное влияние.\n\nМы сможем заключать §YПартнёрства§! с §Gбольшим количеством стран§!."
 
 USA_new_continue_the_new_deal: "Продолжить «Новый курс»"
 USA_new_continue_the_new_deal_desc: "Политика «Нового курса» будет расширена, а её эффектам будет дано время принести плоды. Именно так мы выйдем из Великой депрессии."
 
 USA_double_down_on_the_new_deal: "Удвоить ставку на «Новый курс»"
 USA_double_down_on_the_new_deal_desc: "Хотя есть голоса, не поддерживающие «Новый курс» и его масштабные реформы, именно удвоение ставки на них позволит наконец освободить американский народ от Великой депрессии и дать Соединённым Штатам начать восстановление."
 
 USA_new_agricultural_adjustment_act: "Закон о регулировании сельского хозяйства"
 USA_new_agricultural_adjustment_act_desc: "Депрессия ударила по всем слоям общества, но один из наиболее пострадавших — фермеры. Они не только переживают тяжёлые времена, но и абсолютно необходимо, чтобы они продолжали производить продовольствие. Нам нужно поддержать их финансово и обеспечить здоровое продовольственное снабжение."
 agri_adj_act_tt: "После принятия потребуется ещё §Rнекоторое время§!, прежде чем можно будет разработать новые §Yзаконы «Нового курса»§!."
 
 USA_new_fair_labour_standards_act: "Закон о справедливых трудовых стандартах"
 USA_new_fair_labour_standards_act_desc: "Важно убедиться, что рядовой американский рабочий извлекает выгоду из продолжающегося экономического восстановления. Мы должны обеспечить, чтобы ни один работодатель не пользовался своим положением в ущерб работникам, и закрепим этот принцип федеральным законом."
 USA_new_fair_labour_standards_act_tt: "\nПрежде чем «Новый курс» вступит в полную силу, потребуется разработать ещё больше законодательства, хотя это §Rзаймёт время§!."
 
 USA_federal_zoning_reform: "Федеральная реформа зонирования"
 USA_federal_zoning_reform_desc: "Из-за экономического спада строится значительно меньше домов, чем должно. Ослабляя строительные ограничения, расширяя доступные земли и субсидируя строительство, мы поможем обеспечить достаточное количество домов для каждого американца."
 
 USA_union_defense_act: "Закон о защите профсоюзов"
 USA_union_defense_act_desc: "Боль Великой депрессии привела к тому, что многие люди совершали отчаянные и жестокие действия по отношению к окружающим. Рабочие во многих случаях пострадали от отчаявшихся работодателей и нуждаются в защите. С этой целью мы примем законодательство, обеспечивающее безопасность и эффективность рабочих профсоюзов по всей стране."
 
 USA_new_federal_housing_act: "Федеральный закон о жилье"
 USA_new_federal_housing_act_desc: "Великая депрессия оставила миллионы американцев без крова. Мы будем тратить столько, сколько нужно, для строительства нового жилья для нашего народа, чтобы каждый мог найти дом. Ни один трудолюбивый человек не должен беспокоиться о том, где он будет спать этой ночью."
 
 USA_restore_the_gold_standard: "Восстановить золотой стандарт"
 USA_restore_the_gold_standard_desc: "Хотя мы приняли решение отказаться от золотого стандарта, чтобы лучше найти средства для восстановления экономики, это не дало ожидаемых результатов. Нам нужно отступить и восстановить золотой стандарт, чтобы вновь обеспечить стабильность доллара."
 
 USA_rebalancing_finances: "Перебалансировка финансов"
 USA_rebalancing_finances_desc: "Ограничивая федеральные расходы, нам необходимо полностью переосмыслить нашу денежно-кредитную и фискальную политику. Это будет непросто и небезболезненно, но необходимо."
 
 USA_new_adjusted_compensation_act: "Закон о скорректированной компенсации"
 USA_new_adjusted_compensation_act_desc: "Хотя мы не намерены вмешиваться в индивидуальные сделки наших граждан, мы обязаны помогать великой американской нации в целом и поэтому вмешаемся в рынок, чтобы обеспечить справедливую и честную оплату труда. По мере возобновления роста он не должен доставаться только владельцам бизнеса."
 adj_comp_act_tt: "После успешного принятия потребуется ещё §Rнекоторое время§!, прежде чем можно будет разработать новые §Yполитики§!."
 
 USA_new_protectionist_tariffs: "Протекционистские тарифы"
 USA_new_protectionist_tariffs_desc: "По-прежнему необходимо ставить американскую торговлю выше торговли других стран. Когда мы позаботимся о собственном росте и восстановлении, у нас появится возможность начать инвестировать в другие экономики."
 USA_new_protectionist_tariffs_tt: "\nПравительству придётся принять новые §Yполитики§!, прежде чем страна полностью восстановится, а это §Rзаймёт время§!."
 
 USA_guns_and_shovels: "Ружья и лопаты"
 USA_guns_and_shovels_desc: "Используя военнослужащих на работах по общественным проектам, мы можем одновременно создавать рабочие места для населения и сохранять нашу силу сдерживания против соперников за рубежом."
 
 USA_new_income_tax_reform: "Реформа подоходного налога"
 USA_new_income_tax_reform_desc: "Сокращая налоги, утекающие на бесполезные схемы, и оставляя тем, кто заработал свои доллары, право их сохранить, мы поможем среднему американцу встать на ноги."
 
 USA_military_pensions: "Военные пенсии"
 USA_military_pensions_desc: "Служба этой стране должна сопровождаться ощущением безопасности для тех, кто отдаёт своё время и силы обществу. Инвестирование в более ранние и широкие пенсии для наших солдат будет поощрять рекрутирование и откроет ещё один источник финансовых возможностей."
 
 USA_new_war_propaganda: "Военная пропаганда"
 USA_new_war_propaganda_desc: "Конфликт приближается к американскому народу, и ему нужно быть готовым. Нравится нам эта позиция или нет, но нам нужно подготовиться."
 
 USA_sway_the_public: "Склонить общественное мнение"
 USA_sway_the_public_desc: "Даже в нынешнем состоянии мира значительная часть американского населения выступает против любого рода конфликта. К сожалению, такая позиция больше неприемлема. Нам придётся приложить усилия, чтобы изменить их мнение."
 
 USA_hollywood_endorsements: "Поддержка Голливуда"
 USA_hollywood_endorsements_desc: "Мы можем использовать нашу огромную медиаиндустрию в своих интересах, чтобы сплотить американский народ вокруг любого дела, которое нам нужно отстоять."
 
 USA_family_films: "Семейные фильмы"
 USA_family_films_desc: "Голливудские фильмы, посвящённые американским семейным ценностям, помогут поддержать общественное сознание и дадут давно необходимую передышку от потрясений последних нескольких лет."
 
 USA_war_bond_campaigns: "Кампании по продаже военных облигаций"
 USA_war_bond_campaigns_desc: "Для эффективного ведения этой войны нам понадобится полная поддержка и backing американского народа. Нам понадобятся все доступные активы."
 
 USA_congressional_rallies: "Парламентские митинги"
 USA_congressional_rallies_desc: "После победы Лэндона Республиканская партия находится в отличном положении для дальнейшего расширения поддержки по всей стране и обеспечения доминирующего положения во всём правительстве."
 
 USA_state_empowerment: "Укрепление полномочий штатов"
 USA_state_empowerment_desc: "Важно обеспечить, чтобы многочисленные штаты США сохраняли свои полномочия и самостоятельность даже перед лицом постоянно расширяющегося федерального правительства."
 
 USA_support_titans_of_industry: "Поддержать титанов промышленности"
 USA_support_titans_of_industry_desc: "Поддерживая наши мощные отрасли, мы можем направлять ресурсы туда, где они растут быстрее всего и работают наиболее эффективно."
 
 USA_audit_emergency_programs: "Аудит чрезвычайных программ"
 USA_audit_emergency_programs_desc: "Многочисленные трёхбуквенные агентства и чрезвычайные программы были созданы в ответ на последние кризисы, но теперь, когда мы начинаем от них оправляться, они пережили своё предназначение. Хотя это и непопулярно, мы не можем позволить себе тратить миллионы налогоплательщиков на схемы без обоснования."
 
 USA_national_parks_infrastructure: "Инфраструктура национальных парков"
 USA_national_parks_infrastructure_desc: "Наши обширные и многочисленные национальные парки нуждаются в повышении качества удобств и ухода, а у нас есть миллионы нуждающихся в работе. Федеральное правительство может финансировать обязательные трудовые программы для удовлетворения обеих потребностей одновременно."
 
 USA_new_wpa: "УРТ"
 USA_new_wpa_desc: "Управление по защите рабочих будет предоставлять услуги работникам по всей стране для их защиты и расширения возможностей."
 
 USA_fdic: "Учредить ФКСД"
 USA_fdic_desc: "После ущерба, причинённого безответственными банковскими практиками, ясно, что подобная катастрофа не должна повториться. Федеральная корпорация по страхованию вкладов обеспечит денежное покрытие банков страны и будет регулировать их политику, защищая от возможного набега на банки."
 
 USA_expand_social_security: "Расширить социальное обеспечение"
 USA_expand_social_security_desc: "Кошельки американцев пусты гораздо чаще, чем должны. Долг правительства — дать своим гражданам процветание. Никто не должен голодать или жить в бедности."
 
 USA_new_build_the_pentagon: "Построить Пентагон"
 USA_new_build_the_pentagon_desc: "Пентагон станет центром военного командования Америки. Это учреждение укрепит наши организационные возможности и предоставит пространство для тесной и эффективной работы всех аспектов ведения войны."
 
 USA_host_the_remnants_of_democracy: "Принять остатки демократии"
 USA_host_the_remnants_of_democracy_desc: "Берега Америки — единственное безопасное убежище для тех, в ком жив дух демократии. Мы должны распахнуть объятия каждому отчаявшемуся беженцу, готовому бороться за это дело, и должны быть уверены, что никакие опасные угрозы не пробрались раньше времени."
 USA_host_the_remnants_of_democracy_tt: "Принять остатки демократии"
 
 USA_the_weight_of_the_world: "Бремя мира"
 USA_the_weight_of_the_world_desc: "Мы спорили и бились по множеству вопросов столько, сколько существует эта страна, но теперь мы должны временно отложить эти мелкие разногласия. Сейчас сама судьба требует нашего внимания и сосредоточенности. Нам нужно объединиться против угроз, которые теперь стоят перед нами."
 
 USA_every_chip_down: "Все ставки сделаны"
 USA_every_chip_down_desc: "Часы пробили полночь — пора действовать. Силы тьмы достигли наших берегов и угрожают нашему народу. Всё, что в нашем распоряжении, должно быть мобилизовано на это дело — для победы над великим злом, стремящимся уничтожить последние следы свободы в мире. Америка поднимется на высоту положения и нанесёт быстрый удар. Мы должны дать отпор."
 USA_every_chip_down_tt: "§RУбрать§! §Y$tot_economic_mobilisation$§!. Получить §Y$the_eagles_might_economy$§!."
 
 USA_crusade_for_freedom: "Крестовый поход за свободу"
 USA_crusade_for_freedom_desc: "Хотя мы сделали всё возможное, чтобы продемонстрировать собственные достоинства и возвести здесь великую нацию, теперь мы должны действовать проактивно, чтобы спасти мир от опасностей, захлестнувших его. Соединённые Штаты Америки должны простереть свою волю по всему земному шару и поддержать борьбу человечества за свободу повсюду. Мы не остановимся, пока силы разрушения не будут заглушены, и мы обязаны их заглушить."
 USA_crusade_for_freedom_tt: "Получить §Yповоды для войны§! против каждой страны, которая §Rгенерировала напряжённость§!."
 
 USA_political_funding: "Политическое финансирование"
 USA_political_funding_desc: "Политика в США — грязное дело, как и везде. Иногда всё, что нужно для движения колёс, — немного смазки."
 
 USA_support_the_phillipines: "Поддержать Филиппины"
 USA_support_the_phillipines_desc: "[PHI.GetNameDefCap] находятся под нашей защитой уже несколько десятилетий, но теперь мы быстро приближаемся к моменту их самостоятельного пути. В этом процессе обретения независимости мы будем поддерживать их экономику, управление и оборону, чтобы они смогли уверенно войти в широкий мир."
 
 USA_new_neutrality_act: "$USA_neutrality_act$"
 USA_new_neutrality_act_desc: "$USA_neutrality_act_desc$"
 
 USA_new_limited_intervention: "$USA_limited_intervention$"
 USA_new_limited_intervention_desc: "$USA_limited_intervention_desc$"
 
 USA_new_lend_lease_act:0 "$USA_lend_lease_act$"
 USA_new_lend_lease_act_desc: "$USA_lend_lease_act_desc$"
 
 USA_new_arsenal_of_democracy: "$USA_arsenal_of_democracy$"
 USA_new_arsenal_of_democracy_desc: "$USA_arsenal_of_democracy_desc$"
 
 USA_duty_to_act: "Долг действовать"
 USA_duty_to_act_desc: "Независимо от того, изберём ли мы мир или войну, нам нужно двигаться. Мир не станет ждать, пока мы определимся."
 
 USA_socialized_medical_care: "Социализированная медицинская помощь"
 USA_socialized_medical_care_desc: "Часть того, что значит жить в Соединённых Штатах, — это то, что каждый человек должен иметь доступ ко всему лучшему, что может предложить современный мир. Ни один гражданин не должен быть лишён жизненно важной медицинской помощи. Правительство возьмёт на себя расходы тех, кто не может себе позволить, чтобы все могли извлечь пользу."
 
 USA_bolster_suffrage: "Укрепить избирательное право"
 USA_bolster_suffrage_desc: "По всей стране есть миллионы людей, имеющих право голоса, но ещё не воспользовавшихся им. Нам нужно поощрять каждого выполнять свою роль представителя своих общин."
 
 USA_joint_wargaming: "Совместные военные игры"
 USA_joint_wargaming_desc: "Нашему военному командованию необходимо быть подготовленным к конфликту. У нас достаточно ресурсов для усиления готовности наших людей к более современному бою."
 
 USA_support_democracy_around_the_world: "Поддержать демократию по всему миру"
 USA_support_democracy_around_the_world_desc: "Каждая демократическая страна в мире должна получить поддержку для обеспечения продолжения свободы по всему земному шару."
 
 USA_ramp_up_government_spending: "Резко увеличить государственные расходы"
 USA_ramp_up_government_spending_desc: "Для достижения всего, что записано в нашем длинном списке целей, нам понадобится значительно больше средств для федерального правительства."
 
 USA_public_works_projects: "Проекты общественных работ"
 USA_public_works_projects_desc: "Нанимая миллионы американцев на проекты общественных работ по всей стране, американцы смогут быстро оправиться от Великой депрессии, одновременно служа и обогащая собственные общины."
 
 USA_increase_social_spending: "Увеличить социальные расходы"
 USA_increase_social_spending_desc: "Требуется больше усилий для помощи американскому народу, и обязанность правительства — вытащить их из ямы, в которой оказались многие. Правительство будет оплачивать различные услуги для американцев по всей стране, чтобы процветание могло вернуться."
 
 USA_gunnery_innovations: "Инновации в артиллерии"
 USA_gunnery_innovations_desc: "Новые технологии требуют новых способов их использования в сражениях, и море остается сферой постоянно развивающейся стратегии. В настоящее время наши корабли не предназначены для защиты от авиации, и с этой целью мы разработаем "взрыватель VT", чтобы сбивать вражеские пикирующие бомбардировщики с воздуха до того, как они смогут нанести удар по нам."
 
 USA_the_jeep: "Джип"
 USA_the_jeep_desc: "Стремясь создать новое универсальное транспортное средство повышенной проходимости, мы создали автомобиль, который идеально подходит для выполнения различных функций: джип. Это простое, надежное и сверхуниверсальное моторизованное транспортное средство позволит всем подразделениям наших вооруженных сил передвигаться по полю боя с высокой скоростью и эффективностью. Может, это и не гламурно, но именно такие простые вещи, как эта, действительно помогают выигрывать войны."
 
 USA_propose_canadian_unification: "Предложить объединение с Канадой"
 USA_propose_canadian_unification_desc: "Теперь, когда Канада получила независимость от Европы, мы можем предложить её правительству объединить наши родственные народы в единое целое — прочную Северную Америку."
 
 USA_rotory_innovations: "Роторные инновации"
 USA_propose_canadian_unification_desc: "Потенциал винтокрылого летательного аппарата, способного зависать в воздухе, летать медленно и низко, преодолевать сложный рельеф и выполнять различные задачи непосредственной авиаподдержки, крайне заманчив. Такие аппараты способны участвовать в бою, доставлять снаряжение, выполнять медицинскую эвакуацию, служить мобильными узлами связи и многое другое. Хотя технология всё ещё экспериментальная, стоит приложить усилия к её развитию."
 
 USA_DEBUG_BRANCH: "ВЕТВЬ ОТЛАДКИ"
 USA_DEBUG_BRANCH_desc: "ОТЛАДКА"
 
 USA_IDEA_TEST_FOCUS: "ФОКУС НА ПРОВЕРКЕ ИДЕИ"
 USA_IDEA_TEST_FOCUS_desc: "Проверяет, чтобы убедиться, что все идеи работают должным образом."
 
 USA_IDEA_TEST_ECO_MODIFIERS: "ПРОТЕСТИРУЙТЕ ЭКОНОМИЧЕСКИЕ МОДИФИКАТОРЫ"
 USA_IDEA_TEST_ECO_MODIFIERS_desc: "Тесты, показывающие все модификаторы, которые могут быть в модификаторах экономической динамики"
 
 USA_IDEA_TEST_GOV_MODIFIERS: "ПРОТЕСТИРУЙТЕ МОДИФИКАТОРЫ УПРАВЛЕНИЯ"
 USA_IDEA_TEST_GOV_MODIFIERS_desc: "Проверяет, чтобы показать все модификаторы, которые могут быть в динамических модификаторах правительства"
 
 USA_IDEA_TEST_SPY_MODIFIERS: "ТЕСТИРУЙТЕ ШПИОНСКИЕ МОДИФИКАТОРЫ"
 USA_IDEA_TEST_SPY_MODIFIERS_desc: "Тесты показывают все модификаторы, которые могут быть в динамических модификаторах spy"
 
 USA_IDEA_TEST_MIC_MODIFIERS: "ПРОВЕРКА МОДИФИКАТОРОВ МИКРОФОНА"
 USA_IDEA_TEST_MIC_MODIFIERS_desc: "Тесты для отображения всех модификаторов, которые могут быть в динамических модификаторах микрофона"
 
 USA_IDEA_TEST_ARM_MODIFIERS: "ТЕСТ МОДИФИКАТОРОВ ARM"
 USA_IDEA_TEST_ARM_MODIFIERS_desc: "Тесты для отображения всех модификаторов, которые могут быть в динамических модификаторах arm"
 
 USA_IDEA_TEST_NAV_MODIFIERS: "ПРОВЕРИТЬ НАВИГАЦИОННЫЕ МОДИФИКАТОРЫ"
 USA_IDEA_TEST_NAV_MODIFIERS_desc: "Проверяет, чтобы показать все модификаторы, которые могут быть в динамических модификаторах навигации"
 
 USA_IDEA_TEST_AIR_MODIFIERS: "ТЕСТОВЫЕ МОДИФИКАТОРЫ ВОЗДУХА"
 USA_IDEA_TEST_AIR_MODIFIERS_desc: "Тесты для отображения всех модификаторов, которые могут быть в динамических модификаторах воздуха"
 
 USA_new_two_ocean_navy_act: "Закон о военно-морском флоте двух океанов"
 USA_new_two_ocean_navy_act_desc: "Поскольку война уже на горизонте, мы должны обеспечить, чтобы ни один враг никогда не смог ступить на американские берега. Наш военно-морской флот должен быть способен сражаться с любым врагом в любом из двух великих океанов, которые образуют наши границы."
 
 USA_burden_lessening: "Облегчение бремени"
 USA_burden_lessening_desc: "По всей стране американский народ голодает и страдает. Честные люди ищут работу, но не находят её, сильные духом женщины стремятся помочь, но им нечего дать... Наш долг — облегчить страдания нашего благородного народа. Правительство должно принять чрезвычайные меры, чтобы каждая семья могла поесть уже сегодня вечером. О завтрашнем дне мы побеспокоимся, когда он наступит, но сперва нужно дожить до него."
 
 USA_an_american_five_year_plan: "Американский пятилетний план"
 USA_an_american_five_year_plan_desc: "Крах фондового рынка и провал банков и экономик по всему миру показали, что капитализм не способен самостоятельно поддерживать существование нации. Нам стоит обратить внимание на более новаторские экономические системы, внедряемые в других странах, которые, судя по всему, позволяют им продолжать расти и выживать несмотря на нынешний хаос."
 USA_an_american_five_year_plan_tt: "- Каждые §Y210 дней§! напор консервативного сопротивления социализму будет §Gослабевать§!."
 
 USA_entertain_the_radicals: "Прислушаться к радикалам"
 USA_entertain_the_radicals_desc: "Кажется, будто мир рухнул, и, несмотря на все усилия наших лидеров во всех сферах и на всех постах, американский народ и народы всего мира продолжают страдать. Раздаются голоса, кричащие о новом, лучшем пути вперёд... возможно, наш долг — прислушаться."
 
 USA_southern_crisis: "Южный кризис"
 USA_southern_crisis_desc: "Голод, вызванный Пыльным котлом, наносит невыносимый ущерб общинам по всей стране, но теперь он получил отклик со стороны нескольких крупных общин на Юге. В эти отчаянные времена люди начинают бунтовать и сеять хаос в наиболее пострадавших районах."
 
 USA_banner_clubs: "Клубы Знамени"
 USA_banner_clubs_desc: "По всей стране штаты начали побуждать местные общины объединяться и формировать «клубы Знамени» — локальные группы взаимопомощи, чьи участники заботятся друг о друге и удовлетворяют нужды соседей. Федеральное правительство в Вашингтоне утратило доверие народа, и штаты взяли на себя ответственность восполнять этот пробел самостоятельно, каждый по отдельности."
 
 USA_the_question_of_our_national_character: "Вопрос нашего национального характера"
 USA_the_question_of_our_national_character_desc: "По мере того как мы восстанавливаем нашу нацию и оправляемся от Великой депрессии, мы находим новое предназначение для федерального правительства. Займёт ли оно центральное место или уступит его штатам — похоже, чаша весов теперь склоняется в пользу второго, но это не единственный вопрос, требующий рассмотрения. Америка перерождается, но как именно восстанет этот феникс? Продолжим ли мы и дальше изолировать себя от мира, или же дерзнём заявить новые, революционные притязания?"
 
 USA_visions_of_a_new_frontier: "Видения нового фронтира"
 USA_visions_of_a_new_frontier_desc: "Будущее Америки лежит в освоении нового фронтира. То есть в будущем, где превосходство служит американскому народу, где создаётся лучший завтрашний день для каждого гражданина, где обеспечиваются условия, наиболее благоприятные для взращивания и созревания американской мечты для всех."
 
 USA_state_autarky_movement: "Движение за автаркию штатов"
 USA_state_autarky_movement_desc: "Мы станем полностью самодостаточными. Множество наций на протяжении истории пытались добиться подобного, но ни одна не была так благословенна и процветающа, как наша. Северная Америка сама по себе — житница, её холмистые просторы и пшеничные поля — палитра для многочисленного народа с неутолимой жаждой приключений и роста. Великий город на холме будет подниматься всё выше."
 
 USA_a_new_america: "Новая Америка"
 USA_a_new_america_desc: "Америка вчерашнего дня была ярким пламенем на верхушке мерцающей свечи, но тот старый огонёк угас. Наконец наши глаза привыкли к темноте, и теперь мы зажигаем новое пламя — более сильное, более постоянное, такое, что не погаснет, когда налетят обжигающие ветра. Искры наполняют взор Орла, и наши крылья расправляются для нового полёта."
 
 USA_brotherhood_spirit: "Дух братства"
 USA_brotherhood_spirit_desc: "Восстанавливая нашу прежнюю решимость и укрепляя её сильнее прежнего, мы должны объединиться и сплотиться. Мы зажжём в нашей нации глубокий, братский дух, чтобы в каждой груди билась отважная и доблестная песнь, звучащая в едином ритме с песнью каждого соседа. Мы — нация поселенцев, первопроходцев, изобретателей, воинов — братьев."
 USA_brotherhood_spirit_tt: "Если после §Yзавершения§! этого фокуса начнётся §Rгражданская война§!, ход боевых действий будет §Gзначительно благоприятствовать§! §YАмериканским националистам§!."
 
 USA_a_golden_west: "Золотой Запад"
 USA_a_golden_west_desc: "Великий американский Орёл вновь грациозно парит над своими североамериканскими владениями. Новый Свет поднялся над пеплом Старого и вышел далеко за его пределы, и новая звезда ярко сияет на виду у всего мира. Над нами взошёл золотой запад, и теперь остаётся лишь одно — направиться навстречу этому великолепному рассвету."
 
 USA_the_george_may_proposal: "Предложение Джорджа-Мэя"
 USA_the_george_may_proposal_desc: "Несмотря на общий крах как американской, так и мировой банковской системы, у Уолл-стрит, похоже, есть план восстановления. Различные банки, компании недвижимости, инвестиционные группы, корпорации и частные предприниматели собрались в Нью-Йорке, чтобы составить план стабилизации национальной экономики, хотя план этот, в лучшем случае, экспериментальный. Стоит ли рискнуть?"
 
 USA_the_capitol_hill_disaster: "Катастрофа на Капитолийском холме"
 USA_the_capitol_hill_disaster_desc: "Америку душат. Безответственные банки, недалёкие политики, дурная политика, провокационные СМИ, кумовство и многое другое сломили хребет американской экономике и её народу. Теперь на Капитолийском холме разразился новый скандал, приведший к дракам между нашими представителями. Американскому народу нужно более сильное, умное и надёжное руководство."
 
 USA_a_fallen_roost_among_the_cinders: "Разорённое гнездо среди пепла"
 USA_a_fallen_roost_among_the_cinders_desc: "Четыре года назад атом был впервые расщеплён. За горизонтом таится новая опасность, грозящая поглотить не только США, но и весь мир, находящийся в разгаре краха и трагедии. Грядёт война, а человечество к ней не готово. Те, у кого есть глаза, чтобы увидеть приближающееся, должны действовать."
# Nationalist Communist
 USA_labor_councils: "Рабочие советы"
 USA_labor_councils_desc: "По всей стране будут сформированы рабочие советы для защиты прав трудящихся и координации сети экономической деятельности, которая поможет вновь запустить страну."
 
 USA_graduated_taxation: "Прогрессивное налогообложение"
 USA_graduated_taxation_desc: "Чтобы собрать средства, необходимые для надлежащих государственных мер и вмешательства, мы будем побуждать богатых платить свою справедливую долю через более прогрессивную систему налогообложения."
 
 USA_representation_reform: "Реформа представительства"
 USA_representation_reform_desc: "Американские граждане должны иметь больше возможностей влиять на действия своих представителей в Конгрессе. Более того, больше американцев должны иметь право быть услышанными. Молодые, иностранцы, забытые — неважно, кто именно, важен сам голос каждого. Кроме того, народным профсоюзам также нужно дать собственный голос, чтобы каждая группа была должным образом услышана."
 
 USA_american_economic_industrial_organization: "Американская экономико-промышленная организация"
 USA_american_economic_industrial_organization_desc: "Частная промышленность и банковское дело виновны в Великой депрессии, но не всё так плохо. Среди сорняков есть и здоровые побеги. Что же касается остальной части частного сектора, за её делами и поведением будет пристально следить и направлять их зоркий страж народа."
 
 USA_industrial_recovery_NC: "Промышленное восстановление"
 USA_industrial_recovery_NC_desc: "Страна медленно начинает восстанавливаться после Великой депрессии, и благодаря новым государственным программам расходов и упорному труду народа промышленные мощности Америки вновь вводятся в строй."
 
 USA_red_july: "Красный июль"
 USA_red_july_desc: "Америка оправилась от Великой депрессии и нашла новый путь в будущее. Народная Республика Соединённых Штатов примет на себя мантию прежних США и поведёт свой народ к более великому и процветающему завтрашнему дню!"
 
 USA_homeland_defense_emergency_act_focus_NC: "$USA_homeland_defense_emergency_act_focus-general_title$"
 USA_homeland_defense_emergency_act_focus_NC_desc: "$USA_homeland_defense_emergency_act_focus-general_desc$"
 
 USA_coordinate_militia_defenses_NC: "$USA_coordinate_militia_defenses-general_title$"
 USA_coordinate_militia_defenses_NC_desc: "$USA_coordinate_militia_defenses-general_desc$"
 
 USA_establish_strongholds_in_the_rockies_NC: "$USA_establish_strongholds_in_the_rockies-general_title$"
 USA_establish_strongholds_in_the_rockies_NC_desc: "$USA_establish_strongholds_in_the_rockies-general_desc$"
 
 USA_the_mississippi_bastions_NC: "$USA_the_mississippi_bastions-general_title$"
 USA_the_mississippi_bastions_NC_desc: "$USA_the_mississippi_bastions-general_desc$"
 
 USA_evacuate_civilians_and_industry_NC: "$USA_evacuate_civilians_and_industry-general_title$"
 USA_evacuate_civilians_and_industry_NC_desc: "$USA_evacuate_civilians_and_industry-general_desc$"
 
 USA_launch_the_counteroffensive_NC: "$USA_launch_the_counteroffensive-general_title$"
 USA_launch_the_counteroffensive_NC_desc: "$USA_launch_the_counteroffensive-general_desc$"
 
 USA_spirit_of_defiance_NC: "$USA_spirit_of_defiance-general_title$"
 USA_spirit_of_defiance_NC_desc: "$USA_spirit_of_defiance-general_desc$"
 
 USA_regional_strategic_commands_NC: "$USA_regional_strategic_commands-general_title$"
 USA_regional_strategic_commands_NC_desc: "$USA_regional_strategic_commands-general_desc$"
 
 USA_red_new_deal: "Красный новый курс"
 USA_red_new_deal_desc: "После избрания Рузвельта он и демократы приняли ряд законов, известных как Новый курс, для борьбы с проблемами, стоящими перед страной. Однако их усилия были застопорены различными группами и лицами, которых не устраивали проводимые изменения. Когда мы больны, нельзя бояться лекарства, необходимого для исцеления."
 
 USA_engines_of_industry: "Моторы промышленности"
 USA_engines_of_industry_desc: "Теперь, когда страна начинает восстанавливать прежние объёмы производства до Великой депрессии, мы можем сосредоточиться на более конкретных секторах экономики и населения. Нам следует полностью восстановить нашу промышленную базу и залечить раны, нанесённые американским общинам."
 USA_engines_of_industry_tt: "§YОткрывает§! промышленный концерн §Y$USA_general_motors$§!."
 
 USA_industrialize_the_south: "Индустриализировать Юг"
 USA_industrialize_the_south_desc: "С момента основания страны американский Юг отставал в промышленном и техническом развитии. Этот регион нужно подтянуть до общего уровня."
 
 USA_restore_the_north: "Восстановить Север"
 USA_restore_the_north_desc: "Север — исторический центр нашей промышленной мощи, сильно пострадавший от Великой депрессии. Потребуются значительные усилия, чтобы снова запустить его в полную силу."
 
 USA_TVA_expansion: "Расширение TVA"
 USA_TVA_expansion_desc: "Управление ресурсами долины реки Теннесси (TVA) было создано для электрификации сельской местности Теннесси, но очевидно, что его работу следует распространить за пределы штата."
 USA_TVA_expansion_tt: "§Y[367.getName]§!, §Y[368.getName]§!, §Y[369.getName]§!, §Y[370.getName]§!, §Y[372.getName]§!, §Y[373.getName]§!: \n   Добавить §G1§! слот строительства. \n   Добавить §G1§! §Y$energy_infrastructure$§!. \n   Добавить §Y$USA_tva_expansion_modifier$§!, дающий: \nСкорость строительства: §G+5.00%§! \nСкорость строительства §Y$infrastructure$§!: §G+15.00%§! \nСкорость строительства §Y$rail_way$§!: §G+15.00%§!"
 
 USA_grand_public_works: "Великие общественные работы"
 USA_grand_public_works_desc: "Наследие производственной мощи Америки поведёт нас вперёд, пока мы формируем природу по своей воле."
 
 USA_protecting_our_land: "Защита нашей земли"
 USA_protecting_our_land_desc: "Обширные просторы Америки, её холмистые поля и величественные горные хребты, её прекрасное, нетронутое природное великолепие — долг американского народа уважать эту великолепную землю и сохранить её для наших потомков."
 
 USA_funds_to_reopen_factories: "Средства на возобновление работы заводов"
 USA_funds_to_reopen_factories_desc: "Чтобы полностью восстановить нашу промышленную мощь, нам понадобится привлечь ресурсы из каждого уголка страны, из каждой дееспособной общины, из каждого доступного нам резерва средств. Это будет затратное предприятие, но оно с лихвой окупится в долгосрочной перспективе."
 
 USA_the_western_project: "Западный проект"
 USA_the_western_project_desc: "Подавляющая часть Америки не просто не заселена, но и совершенно нетронута. Обширные земли, готовые к освоению, для проектов такого невиданного прежде масштаба. Мы воспользуемся нашим изобилием."
 USA_the_western_project_tt: "Открывает §Yрешения§! по развитию американского Среднего Запада."
 
 USA_the_frontier_sandbox: "Фронтир как чистый лист"
 USA_the_frontier_sandbox_desc: "Американский Средний Запад остаётся чистым холстом для нашего воображения; мы построим там великие сооружения и используем эту землю, чтобы строить будущее."
 USA_the_frontier_sandbox_tt: "Открывает дополнительные, §Gболее мощные§! §Yрешения§! по развитию американского Среднего Запада."
 
 USA_state_labor_associations: "Штатные объединения труда"
 USA_state_labor_associations_desc: "Множество рабочих в этой стране никогда не состояли в профсоюзах и потому могут не знать, как в них вступить и заявить о себе. Создав в каждом отдельном штате собственный набор стандартизированных профсоюзов, мы поможем развеять это незнание."
 
 USA_spread_expertise: "Распространение знаний"
 USA_spread_expertise_desc: "Одна из проблем неконтролируемого капитализма — сосредоточение знаний в руках избранных лиц, монополизирующих свои знания и навыки за счёт всех остальных. Создав общественные программы для распространения специализированных знаний среди широкой публики, мы сможем остановить эти тенденции."
 
 USA_light_machinery_training: "Обучение работе с лёгкой техникой"
 USA_light_machinery_training_desc: "Сосредоточив техническое обучение новых рабочих на лёгкой технике, мы сможем быстрее производить основные потребительские товары и более простую продукцию."
 
 USA_heavy_machinery_training: "Обучение работе с тяжёлой техникой"
 USA_heavy_machinery_training_desc: "Сосредоточившись на обучении рабочих работе с тяжёлой техникой, мы сможем сохранить наше промышленное преимущество в мире."
 
 USA_employ_the_boy_scouts: "Задействовать бойскаутов"
 USA_employ_the_boy_scouts_desc: "В нашем обществе есть тысячи способных юношей, уже сделавших первые шаги к большей зрелости. Те, кто дошёл до звания «Орлиный скаут», демонстрируют свою компетентность в юном возрасте. Почему бы не ввести несколько новых и полезных значков отличия?"
 
 USA_liberty_rides_the_rivers: "Свобода плывёт по рекам"
 USA_liberty_rides_the_rivers_desc: "Природные водные артерии Северной Америки — огромное благо для страны. Максимальное использование этих путей расширит нашу способность осваивать наши обширные территории."
 USA_liberty_rides_the_rivers_tt: "За каждый штат Среднего Запада, в котором было принято решение §YСтимулировать рост§!, мы получим §G15§! §Yполитической силы§! и §G1%§! §Yстабильности§!. \nПри будущих применениях этого решения также будет возвращаться §G5§! §Yполитической силы§! по завершении."
 
 USA_heal_the_heart_of_rural_america: "Исцелить сердце сельской Америки"
 USA_heal_the_heart_of_rural_america_desc: "После Великой депрессии, Пыльного котла и десятилетий пренебрежения со стороны прибрежных элит, сельская местность и малые города Америки почувствовали себя брошенными и позабытыми, но теперь мы можем облегчить эти беды должной заботой, финансированием и вниманием. Мы не бросим никого в этой стране, будь то великий или малый, близкий или далёкий."
 
 USA_that_well_never_be_wanting: "...Чтобы мы никогда не нуждались"
 USA_that_well_never_be_wanting_desc: "Вкладывая столь много в наш народ, мы можем децентрализовать значительную часть промышленных систем и позволить общинам по всей стране справляться с временными решениями, которые напрямую приносят пользу тем, кто выполняет работу, а также создают больше возможностей для новых и изобретательных решений любых проблем."
 USA_that_well_never_be_wanting_tt: "За каждый штат Среднего Запада, в котором было принято решение §Y$USA_the_frontier_sandbox$§!, мы получим §G1§! §Yвнекарточную гражданскую фабрику§! и §G1§! §Yвнекарточную военную фабрику§!. \nПри будущих применениях этих решений также будет выдаваться §G1§! §Yвнекарточная гражданская фабрика§! по завершении."
 
 USA_that_well_never_go_hungry: "...Чтобы мы никогда не голодали"
 USA_that_well_never_go_hungry_desc: "После ужасных времён Пыльного котла крайне важно не допустить, чтобы американский народ вновь оказался под угрозой голода. Пожалуй, важнейший долг доброй общины и правительства — обеспечить, чтобы каждый мужчина, женщина и ребёнок могли поставить еду на стол. Мы позаботимся об укреплении и лучшем финансировании наших ферм."
 
 USA_meritocratic_managers: "Меритократические управляющие"
 USA_meritocratic_managers_desc: "Хотя капитализм далёк от совершенства, он номинально провозглашает, что руководить компаниями и заводами должны те, кто лучше всего подходит для этой работы, чтобы максимизировать результат. Промышленный прогресс, достигнутый Америкой к настоящему времени, доказывает, что этот принцип, по крайней мере, принимался во внимание, и теперь мы можем сосредоточиться на нём гораздо лучше."
 
 USA_representative_work_leaders: "Представительные трудовые лидеры"
 USA_representative_work_leaders_desc: "В любом собрании единомышленников естественным образом появляются лидеры. Этих деятельных людей, равных своим товарищам и способных по своему положению, следует поощрять принимать на себя более значительные руководящие роли в американской промышленности в целом."
 
 USA_american_exceptionalism: "Американская исключительность"
 USA_american_exceptionalism_desc: "У нас долгая история передового мышления и новаторского решения проблем, и теперь, освободившись от тех навязанных сверху сил, которые невежественно и из страха подавляли бы творчество широкой публики, мы вольны стремиться к технологиям и методам завтрашнего дня!"
 
 USA_resource_security: "Ресурсная безопасность"
 USA_resource_security_desc: "В мире всё ещё остаются силы, недовольные устремлениями американского народа, и ещё больше сил, завидующих нашему процветанию. Нам следует убедиться, что ни один из этих потенциальных противников не сможет вынудить нас к действиям, придерживая необходимые нам ресурсы."
 
 USA_advanced_machining: "Передовое станкостроение"
 USA_advanced_machining_desc: "Сохранение превосходства в области высококачественных станков обеспечит американским заводам преимущество в производстве над теми, кто хотел бы с нами соперничать."
 
 USA_a_truly_democratic_economy: "По-настоящему демократическая экономика"
 USA_a_truly_democratic_economy_desc: "Америка уже десятилетиями остаётся крупнейшей экономикой мира, но теперь она также стала самой свободной и справедливой. Факел Леди Свободы освещает тысячи заводских цехов, полных самых трудолюбивых, изобретательных и деятельных граждан на Земле."
 
 USA_no_one_left_behind: "Никто не забыт"
 USA_no_one_left_behind_desc: "Американский образ жизни подразумевает, что у каждого должна быть возможность построить для себя прекрасную жизнь. Ни один американец не должен быть лишён возможности улучшить свою жизнь."
 
 USA_america_for_her_people: "Америка для своего народа"
 USA_america_for_her_people_desc: "Хотя Америка выступает маяком прогресса и возможностей среди наций, её главная забота — собственный народ, стабильность, прогресс и возможности у себя дома."
 
 USA_give_me_your_poor_your_tired_masses: "Отдайте мне ваших бедных, уставших"
 USA_give_me_your_poor_your_tired_masses_desc: "Американская мечта распространяется на каждого мужчину, женщину и ребёнка по всему миру, кто ищет лучшей жизни и готов ради неё трудиться. Леди Свобода раскрывает объятия великим массам мира, готовая дать им всем то же обещание."
 
 USA_elevate_the_common_american: "Возвысить простого американца"
 USA_elevate_the_common_american_desc: "Американская традиция всегда подчёркивала важность личности, самоопределения, неотъемлемых прав, данных каждому человеку. Благодаря переменам, произошедшим в правительстве и экономике, мы теперь в лучшем положении, чтобы в полной мере уважать эту традицию."
 
 USA_unrestricted_specialization: "Неограниченная специализация"
 USA_unrestricted_specialization_desc: "Превосходные стандарты, к которым мы стремимся в Америке, — результат невероятной сосредоточенности и упорного труда, который средний американец демонстрирует в своих повседневных усилиях. Теперь, когда у каждого гражданина больше доступа к высококлассному обучению и опыту, чем когда-либо прежде, мы способны достичь новых высот в объёме и качестве производства."
 
 USA_every_worker_finds_their_voice: "Каждый рабочий обретает свой голос"
 USA_every_worker_finds_their_voice_desc: "На протяжении истории, и особенно с начала промышленной революции, рабочее место часто было очень суровой средой для тех, кто в нём трудился, но теперь, когда мы лучше упорядочили роль власти в этой сфере, американские рабочие свободнее, чем когда-либо, обретают новый комфорт и смысл в своих обязанностях."
 
 USA_protecting_our_peace: "Защита нашего мира"
 USA_protecting_our_peace_desc: "Американский народ должен быть готов защитить с трудом завоёванный мир, если однажды нам будет действительно угрожать опасность у себя дома."
 
 USA_2a_chapters: "Отделения Второй поправки"
 USA_2a_chapters_desc: "Вторая поправка — одна из определяющих черт американской культуры, отличающих её от остального мира, и она означает, что, если американской нации будет угрожать опасность извне, множество граждан смогут подняться на её защиту. С этой целью координация более организованных отделений гражданских защитников поможет уберечь нас от такого исхода."
 
 USA_community_stockpiles: "Общинные запасы"
 USA_community_stockpiles_desc: "В случае вторжения на нашу землю каждой общине придётся внести свой вклад в защиту себя и всего американского народа. Поэтому важно, чтобы общины по всей стране создали собственные независимые запасы провизии, снаряжения, оружия и общих припасов."
 
 USA_rural_simeon_crucibles: "Сельские тигли Симеона"
 USA_rural_simeon_crucibles_desc: "Разработанные американскими патриотами на юго-западе, «тигли Симеона» — небольшие мануфактуры, позволяющие малым городам производить приличные объёмы базовых боеприпасов и стрелкового оружия из общедоступных материалов. Обучение людей по всей стране созданию таких мастерских обеспечит нам возможность всегда защищаться, даже когда наши сосредоточенные силы испытывают нехватку снабжения."
 
 USA_border_plans: "Планы обустройства границы"
 USA_border_plans_desc: "Для защиты от вторжения на континент нам нужно приложить усилия к укреплению нашей приграничной обороны."
 
 USA_shoreline_plans: "Планы обустройства побережья"
 USA_shoreline_plans_desc: "Для защиты от вторжения на континент нам нужно приложить усилия к подготовке нашего побережья для отражения морского десанта."
 
 USA_external_politics_NC: "Внешняя политика"
 USA_external_politics_NC_desc: "Независимо от нашей внутренней позиции, мы не живём в вакууме. Нам нужно решить, как мы будем взаимодействовать с остальным миром."
 
 USA_learning_from_others: "Учиться на чужом опыте"
 USA_learning_from_others_desc: "Есть определённая опасность в попытке вести игру в государственность, не обращая внимания на действия или позиции других игроков. Нам нужно убедиться, что мы всегда на шаг впереди наших врагов."
 
 USA_educate_our_protectorates: "Просвещать наши протектораты"
 USA_educate_our_protectorates_desc: "Благодаря нашему положению по отношению к зависимым государствам мы можем помочь модернизировать и развить их правительства и культуры."
 
 USA_protect_american_liberty: "Защищать американскую свободу"
 USA_protect_american_liberty_desc: "Америку не особенно заботит происходящее в остальном мире — мы заняты строительством будущего у себя дома. Поэтому наше внимание останется сосредоточено на созидании будущего и обеспечении собственного продолжающегося мира."
 
 USA_focus_on_domestic_prosperity: "Сосредоточиться на внутреннем процветании"
 USA_focus_on_domestic_prosperity_desc: "Америка — для народа, а народ — для Америки. Мы не пожалеем средств на развитие этой страны для нынешнего и всех последующих поколений."
 
 USA_rose_tinted_lampstand: "Светильник в розовых тонах"
 USA_rose_tinted_lampstand_desc: "Иммигранты искали в Америке страну возможностей, и они были правы в этом, но теперь мы пошли дальше, приняв более справедливый набор политик и образ жизни. Мы намерены превзойти даже наши прежние вершины славы и служить настоящим примером свободы и превосходства, которому может последовать весь остальной мир."
 
 USA_the_eagles_bulwark: "Оплот орла"
 USA_the_eagles_bulwark_desc: "Процветание, которым мы теперь наслаждаемся, неизбежно станет слишком соблазнительным, чтобы иностранные силы оставили его в покое. Мы не можем просто порождать величие — мы должны защищать то, что заслужили."
 
 USA_throw_out_the_forces_of_tyranny: "Изгнать силы тирании"
 USA_throw_out_the_forces_of_tyranny_desc: "Время пришло! Мы должны приложить все усилия, чтобы изгнать этих иностранных захватчиков и деспотов с нашей земли! Мы не имеем права проиграть, мы должны выложиться до конца."
 
 USA_secure_peace_guarantees: "Обеспечить гарантии мира"
 USA_secure_peace_guarantees_desc: "Мы проведём конференцию наций, чтобы обеспечить взаимные гарантии мира от крупнейших держав мира, что поможет сохранить нашу безопасность у себя дома."
 
 USA_peaceful_and_proud: "Мирные и гордые"
 USA_peaceful_and_proud_desc: "Хотя у Америки долгая история военных действий, теперь мы обращаем взор внутрь себя и сосредотачиваемся на улучшении жизни собственного народа. Мы сильны, и нам не нужно доказывать это внешне."
 
 USA_proselytize_north_america: "Обратить в свою веру Северную Америку"
 USA_proselytize_north_america_desc: "Мы распространим наше более полно реализованное видение прогресса и процветания, свободы для всех, на весь континент Северной Америки. Новый Свет будет купаться в тёплом красном свете свободы."
 
 USA_wheatstock_international: "Международный Хлебсток"
 USA_wheatstock_international_desc: "Радиостанция «Хлебсток» здесь, в Америке, стала настоящим хитом и прекрасным примером правильно выстроенной подачи информации. Если распространить её и другие культурные объекты за пределы наших границ, они могут оказаться чрезвычайно эффективными в распространении наших ценностей в других странах."
 
 USA_liberty_abroad: "Свобода за рубежом"
 USA_liberty_abroad_desc: "Хотя наши ресурсы сосредоточены на внутреннем развитии, нам следует выделить хоть немного средств, чтобы поднять наши идеалы в других странах и уголках мира."
 
 USA_sons_of_liberty_brigades: "Бригады «Сынов свободы»"
 USA_sons_of_liberty_brigades_desc: "Американский народ сочувствует угнетённым и подвергшимся нападению по всему миру, и люди добровольно выстраиваются в очередь, формируя группы единомышленников и отправляясь на зарубежные поля сражений в надежде оказать положительное влияние на мир."
 
 USA_crimson_flag_crimson_hearts: "Багровый флаг, багровые сердца"
 USA_crimson_flag_crimson_hearts_desc: "У канадского народа схожее с нашим прошлое и культура. Мы приведём их к свету и в нашу сферу влияния."
 
 USA_a_revolution_across_the_border: "Революция за границей"
 USA_a_revolution_across_the_border_desc: "Мы поддержим мексиканский народ и приведём его к свету вместе с нами!"
 
 USA_the_whiskey_jay_compatriot: "Соратник «Виски Джей»"
 USA_the_whiskey_jay_compatriot_desc: "Теперь, когда канадцы увидели свет истинной свободы, мы попытаемся включить их в нашу сферу влияния."
 USA_the_whiskey_jay_compatriot_tt: " - Если они §Rоткажутся§!, мы получим против них §Rцель войны§!!"
 
 USA_the_golden_eagle_compatriot: "Соратник «Золотой орёл»"
 USA_the_golden_eagle_compatriot_desc: "Теперь, когда мексиканцы восстали и зародили в своих сердцах свободу, пришло время протянуть им руку и включить их в нашу сферу влияния."
 USA_the_golden_eagle_compatriot_tt: " - Если они §Rоткажутся§!, мы получим против них §Rцель войны§!!"
 
 USA_the_western_peoples_coalition: "Коалиция народов Запада"
 USA_the_western_peoples_coalition_desc: "Пришло время Северной Америке выделиться из остального мира и показать, что она нашла свой собственный, истинный путь к свободе, отдельный от Старого Света."
 
 USA_arsenal_of_liberty: "Арсенал свободы"
 USA_arsenal_of_liberty_desc: "Америка превратила себя в город на холме, отстаивающий величайшие ценности свободы. Однако эти ценности разделяют не во всём мире, и им действительно может угрожать опасность. Более того, может настать день, когда американцам придётся отправиться из дома, чтобы освободить народы других земель. Америка должна стать арсеналом свободы для поддержки таких начинаний."
 
 USA_internal_politics_NC: "Внутренняя политика"
 USA_internal_politics_NC_desc: "Если эта страна собирается пройти через Депрессию, потребуется значительная сосредоточенность и энергия, чтобы направлять её курс."
 
 USA_wheatstock_radio: "Радио «Хлебсток»"
 USA_wheatstock_radio_desc: "Вещая из анонимного места где-то в Миссури, передачи «Хлебсток» приобрели значительную аудиторию в местах массового скопления людей по всей стране. Звуча в барах, отелях, клубах и даже в дорогих переносных радиоприёмниках, их послания, отстаивающие ценности более социалистически ориентированных демократических систем, покоряют сердца и умы по всей стране."
 
 USA_destigmatize_socialism: "Снять клеймо с социализма"
 USA_destigmatize_socialism_desc: "Несмотря на провал капиталистических доктрин в нашей стране, социализм всё ещё несёт для большинства людей очень негативный оттенок. Потребуется некоторая работа, чтобы устранить эту пропасть в общественном сознании, даже если это немного больно."
 
 USA_socialist_womens_organizations: "Социалистические женские организации"
 USA_socialist_womens_organizations_desc: "Используя социалистический уклон, уже присутствующий во многих феминистских группах по всей стране, мы сможем заручиться поддержкой женщин страны в продвижении наших идей."
 
 USA_lift_the_peoples_spirits: "Поднять дух народа"
 USA_lift_the_peoples_spirits_desc: "Одна трагедия за другой обрушивалась на эту страну на протяжении нескольких лет, что привело к общему настроению пессимизма и невезения. Однако мы знаем, что будущее может быть светлым. Мы можем поднять дух народа и мотивировать людей внести свой вклад в преодоление этих трудностей."
 
 USA_organize_new_unions: "Организовать новые профсоюзы"
 USA_organize_new_unions_desc: "Основа любой социалистической системы — сеть рабочих союзов, позволяющая каждому продуктивному гражданину полезно направлять свою энергию."
 
 USA_stand_up_for_the_unemployed: "Заступиться за безработных"
 USA_stand_up_for_the_unemployed_desc: "Огромное количество трудоспособных рабочих не по своей вине не имели возможности зарабатывать на жизнь и обеспечивать себя и своих близких. О них нужно позаботиться."
 USA_stand_up_for_the_unemployed_tt: "Только §Yодин§! из этого фокуса и §Y$USA_homeless_relief_funds$§! §Yснизит§! консервативное сопротивление.\n "
 
 USA_homeless_relief_funds: "Фонды помощи бездомным"
 USA_homeless_relief_funds_desc: "На родине смелых у смелых должен быть свой дом. Никто не должен ворочаться во сне, не найдя крова, под которым можно приклонить голову."
 USA_homeless_relief_funds_tt: "Только §Yодин§! из этого фокуса и §Y$USA_stand_up_for_the_unemployed$§! §Yснизит§! консервативное сопротивление.\n "
 
 USA_socialist_patriot_parades: "Парады социалистов-патриотов"
 USA_socialist_patriot_parades_desc: "Мы не намерены перенимать насильственные революции, охватившие другие страны мира, равно как и вступать в какое-либо «царство террора». Мы американцы, гордые патриоты нашего блистательного национального наследия. Пути прошлого не были ошибочными или неверными — они были просто незавершёнными; мы стремимся завершить их в американской традиции."
 
 USA_denounce_capitalism: "Осудить капитализм"
 USA_denounce_capitalism_desc: "Америка проложила великий путь до сих пор, но коварные силы капитализма кусали её за пятки, пока она не упала. Великая депрессия стала явнейшим признаком провала этой формы экономической организации, и мы должны выступить против него!"
 USA_denounce_capitalism_tt: "Мы получим §Yрешение§!, позволяющее §Rразжечь гражданскую войну раньше срока§!. Чем ниже §Yконсервативное сопротивление§!, тем хуже будет для них."
 
 USA_demand_government_action: "Потребовать действий правительства"
 USA_demand_government_action_desc: "В духе наших вдохновляющих общественных движений администрация Рузвельта выдвинула на голосование поправку к конституции, которая закрепит представителей профсоюзов в Конгрессе и расширит их полномочия на рабочем месте. Простой американский гражданин наконец-то получит право быть услышанным в полной мере!"
 
 USA_protect_productive_entrepreneurs: "Защитить продуктивных предпринимателей"
 USA_protect_productive_entrepreneurs_desc: "Многие социалисты и коммунисты станут утверждать, что все представители класса капиталистов по определению злы, но на самом деле наши проблемы проистекают лишь от тех алчных людей, которые никогда не вносили реального вклада в получение своего богатства. С другой стороны, те, чей упорный труд улучшает жизнь всех, — их следует чтить за проделанную работу."
 USA_protect_productive_entrepreneurs_tt: "Только §Yодин§! из этого фокуса, §Y$USA_american_worker_guilds$§! и §Y$USA_federal_honor_programs$§! §Yснизит§! консервативное сопротивление.\n "
 
 USA_american_worker_guilds: "Американские рабочие гильдии"
 USA_american_worker_guilds_desc: "Американский народ обладает одним из величайших промышленных и технических знаний в мире. Объединив местные профсоюзы предприятий в более крупные торговые гильдии, мы сможем скоординировать знания и навыки целой отрасли, чтобы помочь ей расти эффективнее."
 USA_american_worker_guilds_tt: "Только §Yодин§! из этого фокуса, §Y$USA_protect_productive_entrepreneurs$§! и §Y$USA_federal_honor_programs$§! §Yснизит§! консервативное сопротивление.\n "
 
 USA_federal_honor_programs: "Федеральные программы чести"
 USA_federal_honor_programs_desc: "Для тех людей, кому просто не повезло в жизни, мы можем создать национальные программы чести, которые предоставят жильё, еду и поддержку, одновременно обучая, давая опыт и реальную продуктивную работу, чтобы помочь им встать на ноги."
 USA_federal_honor_programs_tt: "Только §Yодин§! из этого фокуса, §Y$USA_protect_productive_entrepreneurs$§! и §Y$USA_american_worker_guilds$§! §Yснизит§! консервативное сопротивление.\n "
 
 USA_culmination_of_the_founding_fathers: "Кульминация отцов-основателей"
 USA_culmination_of_the_founding_fathers_desc: "При основании нашей страны мы поставили целью обеспечить мир, справедливость и возможности для всех, кто прибыл в Америку. Это был долгий путь, но мы наконец пришли к цели. Отцы-основатели гордились бы тем, чего мы здесь достигли."
 
 USA_property_reform: "Реформа собственности"
 USA_property_reform_desc: "Если мы хотим по-настоящему исцелить эту нацию, нельзя просто действовать во имя «реформы» — нам нужно коренным образом изменить те системы власти в этой стране, которые ответственны за наши беды. Мы не желаем полностью упразднить частную собственность, но намерены обобществить то, что несправедливо накапливается и удерживается взаперти."
 
 USA_soviet_style_policies: "Политика советского образца"
 USA_soviet_style_policies_desc: "Советский Союз продемонстрировал экономическую политику, необходимую для управления более централизованной экономикой. Хотя мы не настолько централизованы, как они, стало ясно, что капиталистический класс нельзя оставлять предоставленным самому себе — им нужно управлять и осуществлять надзор."
 
 USA_rally_disaffected_militias: "Сплотить недовольные ополчения"
 USA_rally_disaffected_militias_desc: "Многие общины по всей стране остаются разочарованы тем, как правительство до сих пор пыталось решать их проблемы. Учитывая наши цели, было бы разумно уже сейчас начать организовывать группы сопротивления, готовые взять дело в свои руки, если ситуация накалится."
 USA_rally_disaffected_militias_tt: "Когда §Yначнётся гражданская война§!, мы получим дополнительно §Y8 подразделений ополчения§! и §Y75 тыс. живой силы§!."
 
 USA_apple_pie_barns: "Амбары «Яблочный пирог»"
 USA_apple_pie_barns_desc: "В сельских районах с сильной поддержкой мы поможем создать так называемые амбары «Яблочный пирог». Используя ящики из-под яблок и другие контейнеры для еды, мы будем провозить значительные объёмы военной техники в тайные убежища по всей стране, что поможет нашему будущему делу. Разумеется, для непосвящённых всё это будет выглядеть как обычные соседские проекты по выпечке."
 USA_apple_pie_barns_tt: "Когда §Yначнётся гражданская война§!, мы получим §Y10 тыс. пехотного снаряжения§!, §Y1 тыс. вспомогательного снаряжения§! и §Y1 тыс. буксируемой артиллерии§!."
 
 USA_invite_foreign_freedom_fighters: "Пригласить иностранных борцов за свободу"
 USA_invite_foreign_freedom_fighters_desc: "Наше дело разделяют миллионы людей по всему миру. Мы призовём на помощь иностранных борцов за свободу для участия в нашей борьбе!"
 USA_invite_foreign_freedom_fighters_tt: "Через две недели после §Yначала гражданской войны§! мы получим §Y6 дивизий иностранных добровольцев§!."
 USA_invite_foreign_freedom_fighters_tt_2: "Через неделю после завершения этого фокуса мы получим §Y6 дивизий иностранных добровольцев§!."
 
 USA_the_people_rise_up: "Народ восстаёт!"
 USA_the_people_rise_up_desc: "Настало время действовать! Рвитесь к победе, обеспечьте наше будущее, восстаньте против корпоративистских угнетателей!"
 USA_the_people_rise_up_tt: "  Наш §Yпротивник§! в гражданской войне пострадает следующим образом: "
 USA_the_people_rise_up_tt_2: "  в течение §Y180§! дн."
 
 USA_redistribute_the_vieux_riches: "Перераспределить состояния старых богачей"
 USA_redistribute_the_vieux_riches_desc: "Тысячи богатых капиталистов в этой стране за всю жизнь не внесли ни цента. Они живут за счёт труда простых американцев и используют свои ресурсы, чтобы усложнять жизнь народу. Европейские общества, возможно, терпят это, но мы — нет."
 
 USA_bury_the_robberbarons: "Похоронить баронов-разбойников"
 USA_bury_the_robberbarons_desc: "Многие новые элиты в этой стране добились своего положения, монополизируя и разоряя крупные отрасли за счёт простых людей. Эти «бароны-разбойники» испортили жизнь миллионам американцев, и от них нужно избавиться, а их активы конфисковать на благо народа."
 
 USA_amnesty_for_the_ignorant: "Амнистия для несведущих"
 USA_amnesty_for_the_ignorant_desc: "Огромное множество американцев выступило против нашего дела без всякой злобы в сердце. Они просто были не осведомлены о ходе истории, но всё же остаются нашими братьями и сёстрами. Мы должны простить тех, кто теперь с нами, а прежде считал себя нашим врагом."
 
 USA_manifest_equality: "Явное равенство"
 USA_manifest_equality_desc: "Американский эксперимент был направлен на создание страны возможностей, где каждый был бы волен стремиться к собственному процветанию, не будучи растоптанным суровыми властями. Теперь, когда мы преодолели ограничения, наложенные нашим европейским наследием, мы можем завершить этот эксперимент."
 
 USA_the_vision_of_1776_achieved: "Видение 1776 года достигнуто"
 USA_the_vision_of_1776_achieved_desc: "В 1776 году была официально провозглашена революция против старых порядков Европы. Она стремилась извлечь уроки из Старого Света и построить на их основе Новый Свет, где личность максимально раскрывается и тем самым максимально раскрывается всё общество. То, что было начато более 150 лет назад, мы теперь достигли! Новый Свет станет утопией."

# American Nationalist
 USA_industrial_recovery_AN: "Промышленное восстановление"
 USA_industrial_recovery_AN_desc: "Вращение шестерён, пар машин, пронзительный свист гудков — темп жизни страны вновь становится оживлённым. Немалую роль в этом сыграли те группы американцев, которые взялись трудиться на благо своих общин и сотрудничать с группами за пределами своих городов."
 
 USA_homeland_defense_emergency_act_focus_AN: "$USA_homeland_defense_emergency_act_focus-general_title$"
 USA_homeland_defense_emergency_act_focus_AN_desc: "$USA_homeland_defense_emergency_act_focus-general_desc$"
 
 USA_coordinate_militia_defenses_AN: "$USA_coordinate_militia_defenses-general_title$"
 USA_coordinate_militia_defenses_AN_desc: "$USA_coordinate_militia_defenses-general_desc$"
 
 USA_establish_strongholds_in_the_rockies_AN: "$USA_establish_strongholds_in_the_rockies-general_title$"
 USA_establish_strongholds_in_the_rockies_AN_desc: "$USA_establish_strongholds_in_the_rockies-general_desc$"
 
 USA_the_mississippi_bastions_AN: "$USA_the_mississippi_bastions-general_title$"
 USA_the_mississippi_bastions_AN_desc: "$USA_the_mississippi_bastions-general_desc$"
 
 USA_evacuate_civilians_and_industry_AN: "$USA_evacuate_civilians_and_industry-general_title$"
 USA_evacuate_civilians_and_industry_AN_desc: "$USA_evacuate_civilians_and_industry-general_desc$"
 
 USA_launch_the_counteroffensive_AN: "$USA_launch_the_counteroffensive-general_title$"
 USA_launch_the_counteroffensive_AN_desc: "$USA_launch_the_counteroffensive-general_desc$"
 
 USA_spirit_of_defiance_AN: "$USA_spirit_of_defiance-general_title$"
 USA_spirit_of_defiance_AN_desc: "$USA_spirit_of_defiance-general_desc$"
 
 USA_regional_strategic_commands_AN: "$USA_regional_strategic_commands-general_title$"
 USA_regional_strategic_commands_AN_desc: "$USA_regional_strategic_commands-general_desc$"
 
 USA_defend_our_homeland: "Защитить нашу Родину!"
 USA_defend_our_homeland_desc: "Час настал: время изгнать наших врагов с родной земли раз и навсегда! Мы обрушим возмездие на захватчиков и потопим их в водах, омывающих нашу страну. Они не смогут нам противостоять."
 
 USA_tend_to_the_nation: "Позаботиться о нации"
 USA_tend_to_the_nation_desc: "Нам нужно направить наше внимание на будущее нации. История Америки величественна на фоне истории в целом, и, возможно, эти недавние бедствия — как раз то, что нужно, чтобы открыть нам глаза и проложить лучший курс вперёд."
 
 USA_the_goldstar_network: "Сеть «Золотая звезда»"
 USA_the_goldstar_network_desc: "Основанная в 1934 году Джоном Обицем, сеть «Золотая звезда» — патриотическая американская газета и радиоканал, ставшие неотъемлемой частью баров, домов, рабочих мест и политических отделений по всей стране. Она вдохновила миллионы американцев в эти тяжёлые времена, собирала средства для нуждающихся, предоставляла службу поиска работы и помогала избирать чиновников, устремлённых в будущее."
 
 USA_community_aid_programs: "Программы общинной помощи"
 USA_community_aid_programs_desc: "Общины по всей стране продолжают испытывать трудности, поскольку институты и инфраструктура, от которых они зависят, остаются ненадёжными. Лучше всего было бы, если бы сами штаты координировали усилия по восстановлению наших регионов."
 
 USA_our_place_in_the_world: "Наше место в мире"
 USA_our_place_in_the_world_desc: "По мере того как мы начинаем восстанавливаться, вопрос о том, какой должна быть наша судьба, начинает звучать всё яснее. Суждено ли нам остаться просто ещё одной из множества стран мира, или же нам следует стремиться выделиться и заявить права на ещё невиданную роль?"
 
 USA_properly_account_for_the_carpetbaggers: "Должным образом взыскать с «саквояжников»"
 USA_properly_account_for_the_carpetbaggers_desc: "«Реконструкция» Юга после гражданской войны 1860-х годов была колоссальным цирком, оставившим Юг в ещё худшем положении, чем если бы надменный Север вовсе не пытался так усердно «помогать». Нам нужно взыскать за ущерб, причинённый теми коварнейшими оппортунистами, которых мы называли «саквояжниками»."
 USA_properly_account_for_the_carpetbaggers_tt: "§Y[366.getName]§!, §Y[365.getName]§!, §Y[364.getName]§!, §Y[363.getName]§!, §Y[367.getName]§!, §Y[370.getName]§!, §Y[371.getName]§!, §Y[368.getName]§!, §Y[369.getName]§!, §Y[362.getName]§!:"
 
 USA_the_gettysburg_debate: "Геттисбергские дебаты"
 USA_the_gettysburg_debate_desc: "С момента нашей революции мы формально предприняли две попытки конфедерализации. Первая обернулась провалом по неведению, а вторая, надо признать, провалом по форме, однако именно во второй обнаружились стабильность и товарищество, которые нам бы сейчас очень пригодились. Возможно, стоит вновь обратиться к природе той несостоявшейся конфедерации и решить, не стоит ли попробовать снова."
 USA_the_gettysburg_debate_tt: "§YАмериканский народ§! начнёт рассматривать перспективу §Yконфедерализации§!."
 
 USA_a_question_of_confidence: "Вопрос доверия"
 USA_a_question_of_confidence_desc: "Управленческая, экономическая и политическая практика, приведшая нас к этому положению, подвела нас и неоднократно демонстрировала свою неспособность действовать решительно и эффективно. Смена курса — единственный разумный выход."
 
 USA_america_on_its_own: "Америка сама по себе"
 USA_america_on_its_own_desc: "Америку изначально основали те, кого удручал Старый Свет и кто желал отыскать Новый, и мудрость наших праотцов по-прежнему остаётся истинной. Внешний мир продолжает подводить и свой народ, и нас. Мы не можем полагаться на него — путь Америки вперёд, куда бы он ни вёл, нужно пройти в одиночку."
 
 USA_first_among_equals: "Первые среди равных"
 USA_first_among_equals_desc: "Америку изначально основали те, кого удручал Старый Свет и кто желал отыскать Новый, и мудрость наших праотцов по-прежнему остаётся истинной. Совершенно ясно, что Старый Свет не способен подняться над своей долгой и беспокойной историей и своими конфликтами, но мы видим дальше их потрясений. Америка займёт место у руля цивилизации."
 USA_first_among_equals_tt: "Этот §Yфокус§! подтолкнёт нас к §Yначалу§! §Rгражданской войны§!!"
 
 USA_patriot_parades: "Патриотические парады"
 USA_patriot_parades_desc: "В это время неопределённости и тревоги собрания дееспособных и полных духа людей сотворят чудеса, подняв душу этой нации из руин. Тёмные времена обрушились на нас, но благодаря силе и решимости мы найдём свой путь к новому рассвету!"
 
 USA_patriots_stand_ready: "Патриоты наготове"
 USA_patriots_stand_ready_desc: "Назревает конфликт, и лишь те, кто видит его приближение, смогут взять на себя ответственность за него. Мы заблаговременно организуем отряды ополчения и армейские формирования по всей стране на случай неизбежного обострения, чтобы, когда пробьёт час, мы были готовы нанести удар и воспользоваться моментом."
 USA_patriots_stand_ready_tt: "Когда §Yначнётся гражданская война§!, мы получим дополнительные §Yсилы§! и §Yснаряжение§!."
 
 USA_the_philadelphia_fiasco: "Филадельфийское фиаско"
 USA_the_philadelphia_fiasco_desc: "Десятки сенаторов и членов Палаты представителей внесли в Конгресс законопроект об общем развитии города Филадельфия. Жемчужиной этого пакета расходов станет строительство театра «Амблтон», который предоставит городу первоклассные удобства."
 
 USA_the_parkerite_act: "Закон паркеритов"
 USA_the_parkerite_act_desc: "После трагедии в Филадельфии общественность открыто выступает против Вашингтона. В ответ несколько южных сенаторов выдвинули «Закон паркеритов», который закрепит в Конституции 22-ю поправку, дающую штатам право авторитетного вето и надзора над всеми федеральными проектами и финансированием в пределах их границ или юрисдикции."
 
 USA_what_the_future_holds: "Что готовит будущее"
 USA_what_the_future_holds_desc: "После трагедии в Филадельфии общественность сыта по горло провалами федерального правительства. Стремительно приближается момент, когда будет зажжена спичка. Федеральное правительство необходимо реорганизовать в корне, а те, кто сейчас занимает властные посты, никогда не отдадут бразды правления добровольно."
 USA_what_the_future_holds_tt: "\nЭтот §Yдух§! будет §Yснят§! в начале §Yгражданской войны§!."
 
 USA_paul_revere_rides_again: "Пол Ревир снова в седле"
 USA_paul_revere_rides_again_desc: "Федеральное правительство Соединённых Штатов Америки утратило право на власть. Его, как и страну в целом, необходимо реструктурировать, чтобы обеспечить непрерывность существования нации. К сожалению, это потребует временного раскола, который придётся залечивать кровью и железом, но американцы любят вызовы."
 USA_paul_revere_rides_again_tt: "Мы §Rначнём гражданскую войну§!!\nЧем больше у нас §Yподдержки фашизма§!, тем больше §Yштатов§! перейдёт на нашу сторону."
 
 USA_the_goldstar_federation: "Федерация «Золотой звезды»"
 USA_the_goldstar_federation_desc: "Старая система была сильна, но недостаточно сильна — слишком слаба, чтобы пережить натиск кризиса, слишком слаба, чтобы противостоять провалам Старого Света. Необходим новый порядок — тот, что ставит американский народ, его видение и его будущее превыше всего и всех прочих. Старая Америка не смогла ухватить свою судьбу — мы не повторим этой ошибки."
 USA_the_goldstar_federation_tt_2: "Пока §YСША§! остаются во главе фракции §Y$USA_the_goldstar_federation_tt$§!, §YСША§! и их §Yмарионетки§! будут иметь динамический модификатор §Y$USA_goldstar_dynamic_modifier$§!.\nЭтот модификатор будет §Rутрачен§!, если §YСША§! перестанут стоять во главе фракции §Y$USA_the_goldstar_federation_tt$§!."
 USA_the_goldstar_federation_tt_3: "Создать фракцию: §Y$USA_the_goldstar_federation_tt$§!."
 
 USA_the_second_confederation: "Вторая конфедерация"
 USA_the_second_confederation_desc: "Стало ясно, что разделению властей, присущему нашей идентичности, не было уделено должного внимания. Права штатов возобладают над властью центрального правительства. Пришло время заложить основы более совершенного союза, исправив просчёты старого и развив дух и видение первой Конфедерации."
 
 USA_swift_and_lethal: "Быстро и смертоносно"
 USA_swift_and_lethal_desc: "Либо мы должны действовать сейчас, либо не действовать вовсе, но мы не можем и дальше медлить с решениями о том, как и где мы будем наносить удары и воплощать наши цели в жизнь. Если дать противникам время, они перегруппируются и организуют более крепкую оборону, а мы не хотим терять больше жизней, чем необходимо."
 
 USA_peace_guarantees_for_our_neighbors: "Гарантии мира для наших соседей"
 USA_peace_guarantees_for_our_neighbors_desc: "Разобравшись с основной массой внутренних потрясений, было бы разумно обратиться к нашим друзьям и соседям и заверить их в нашей спокойной и мирной природе. Правильно избавить их от беспокойства, но не менее важно обеспечить, чтобы наши фланги не стали уязвимыми."
 
 USA_our_safety_before_yours: "Наша безопасность прежде вашей"
 USA_our_safety_before_yours_desc: "Безопасность наших соседей неотделима от нашей собственной — и им следует дать понять, что такая безопасность имеет свою цену. Гарнизоны, уступки и твёрдая рука в их делах — небольшая плата за защиту, которую можем предложить только мы. Наша ресурсная безопасность будет формироваться нашим контролем над ресурсами этого полушария."
 
 USA_the_sun_has_already_set: "Солнце уже зашло"
 USA_the_sun_has_already_set_desc: "Лондон и Париж цепляются за империи, которые больше не в состоянии удержать. Пусть цепляются. Пока старые державы истощают себя в бесплодных войнах, полушарие лежит открытым перед нами. Нация, не желающая воспользоваться своим моментом, не заслуживает его, и мы ухватим сам рассвет."
 
 USA_americas_rightful_claims: "Законные притязания Америки"
 USA_americas_rightful_claims_desc: "Судьба Запада лежит через Вашингтон. Нет нужды в деликатности там, где всё и без того очевидно. Мы возьмём то, что по праву принадлежит нам."
 USA_americas_rightful_claims_tt: "Открывает §Yрешения§! по §Yустановлению контроля над территориями§! в §YСеверной§! и §YЦентральной Америке§!.\n\nЕсли взят §Y$USA_peace_guarantees_for_our_neighbors$§!, мы сможем §Yукреплять доверие§! с нашими соседями.\n\nЕсли взят §Y$USA_our_safety_before_yours$§!, мы сможем §Yзапугивать§! наших соседей."
 
 USA_golden_opportunities: "Золотые возможности"
 USA_golden_opportunities_desc: "Обе Америки принадлежат нам, и если наши соседи откажутся уступить, мы застигнем их врасплох, когда они меньше всего этого ждут. С восходом золотого солнца оно отбросит длинные тени, и мы будем действовать в этой темноте, чтобы привести весь континент к зарождающемуся свету."
 USA_golden_opportunities_tt: "Открывает §Yрешения§! по §Yинфильтрации в американские страны§! и захвату их изнутри, что со временем позволит §YСША§! организовывать §Rперевороты§! в их правительствах и §Yустанавливать контроль§! над ними."
 
 USA_ballads_between_brothers: "Баллады между братьями"
 USA_ballads_between_brothers_desc: "Благодаря нашей территориальной близости и обильному культурному смешению между нашими странами не составит труда протянуть руку и ещё больше улучшить наши отношения с канадцами и мексиканцами. К тому же у обоих народов есть многое из желаемого нами, и мы предпочитаем добиваться этого через мир, дипломатию и яблочный пирог."
 
 USA_establish_the_new_southern_states: "Учредить новые южные штаты"
 USA_establish_the_new_southern_states_desc: "Мы будем стремиться учредить Рио-Гранде и Сонору к югу от нас, предоставив этим регионам и их народам большую автономию и доступ к рынкам, а заодно обеспечив себе буферную зону."
 USA_establish_the_new_southern_states_tt: "  §YОбезопасит§! наш фланг."
 
 USA_country_roads_through_the_north: "Просёлочные дороги через Север"
 USA_country_roads_through_the_north_desc: "Западный разрыв, отделяющий американскую метрополию от наших аляскинских территорий, крайне слабо заселён канадцами. Мы приложим усилия, чтобы связаться с ними и предложить крупную сумму денег и инвестиций в обмен на эти земли, чтобы соединить все наши континентальные территории и укрепить наши позиции на Севере."
 
 USA_prudence_across_the_land: "Осмотрительность по всей стране"
 USA_prudence_across_the_land_desc: "Обезопасив свои фланги, мы теперь можем уделить внимание защите нашего мира и сделать себя особенно неудобной мишенью для любых потенциальных агрессоров."
 
 USA_secure_the_gulf: "Обезопасить Залив"
 USA_secure_the_gulf_desc: "Пока Залив остаётся незащищённым, наши враги могут пользоваться уязвимостью нашего южного побережья. Мы устраним эту брешь в безопасности и установим контроль над нашими законными притязаниями в ближних водах."
 
 USA_the_rush_for_the_canal: "Гонка за канал"
 USA_the_rush_for_the_canal_desc: "Тот, кто контролирует Панамский канал, контролирует морскую мощь по обе стороны полушария. Нам не просто совершенно необходимо полностью обезопасить его для сохранения нашей способности проецировать силу — сам канал является нашей собственностью и наследием, и мы не дадим ему пасть."
 
 USA_seize_the_great_flanks: "Захватить великие фланги"
 USA_seize_the_great_flanks_desc: "Мы захватим те обширные территории и океаны, что окружают Америку, и установим полный контроль над континентом."
 
 USA_realize_the_golden_circle: "Осуществить Золотой круг"
 USA_realize_the_golden_circle_desc: "Давным-давно элитное американское общество под названием «Рыцари Золотого круга» представляло себе континентальную империю, раскинувшуюся и безраздельно властвующую над всей Северной Америкой. Сегодня мы осуществляем эту мечту и провозглашаем её реальность."
 USA_realize_the_golden_circle_trigger_tt_NOT: "Контролирует все §YСевероамериканские§! штаты"
 USA_realize_the_golden_circle_trigger_tt_2_NOT: "Контролирует все §YЦентральноамериканские§! штаты и штаты §YЗалива§!"
 USA_realize_the_golden_circle_trigger_tt_3_NOT: "Контролирует штаты §YЮжного гребня§!"
 
 USA_no_place_for_traitors: "Нет места предателям"
 USA_no_place_for_traitors_desc: "Готовясь выступить в мир, мы не можем терпеть подрывные элементы уже внутри нас самих. Те, кто желал бы провала великому американскому проекту, не получат никакой свободы действий. Приближая наш новый рассвет, мы не оставим им ни одной тени, где можно было бы укрыться."
 
 USA_pledge_for_the_new_order: "Присяга новому порядку"
 USA_pledge_for_the_new_order_desc: "Берлин предлагает партнёрство равных — Новый порядок, построенный на силе, отвечающей силе. Нет стыда в том, чтобы встать плечом к плечу с единственными державами, не боящимися строить новый мир."
 
 USA_renaissance_and_retribution: "Возрождение и возмездие"
 USA_renaissance_and_retribution_desc: "Старый Свет пребывает в предсмертной агонии, а мы — на подъёме. Даже когда [GER.GetNameDefCap] в очередной раз пытается подняться над застоем Европы, мы видим дальше их тщетных попыток. Куётся Новый Свет, и именно мы будем держать молот; Германия станет лишь нашей наковальней."
 USA_renaissance_and_retribution_tt: " - Эта идея будет §Rутрачена§!, если начнётся война с §Y[GER.getName]§!."
 USA_renaissance_and_retribution_tt_2: "Открывает §Yрешения§! по узурпации власти §Y[GER.GetName]§! и захвату контроля над §YОсью§! или §Yполному подчинению Германии§!."
 
 USA_throw_in_with_the_old: "Встать на сторону Старого Света"
 USA_throw_in_with_the_old_desc: "Мы не забыли своих корней. Наша культура и история тесно связаны с англичанами и французами, и мы, как никто, верны своему слову. В этот отчаянный час мы придём, чтобы поднять высоко факел, который Европа больше не может удержать."
 
 USA_do_our_part: "Внести свой вклад"
 USA_do_our_part_desc: "Несмотря на наши сомнения, война, с которой мы столкнулись, требует международного сотрудничества в беспрецедентных масштабах. Тем не менее у нас есть ресурсы и дух, чтобы выстоять, сохраняя собственную безопасность, пока мы протягиваем руку помощи ради защиты безопасности наших союзников."
 USA_do_our_part_tt: "Открывает §Yобщее дерево фокусов§! КАБГАВС"
 USA_do_our_part_tt_2: "Если мы состоим во §Yфракции§! с §Y[ENG.getName]§!, §Yчлены нашей фракции§! получат:"
 
 USA_the_eagle_flies_alone: "Орёл летит один"
 USA_the_eagle_flies_alone_desc: "Мы не станем ждать разрешения от Старого Света, прежде чем действовать. Наше будущее — в наших собственных руках, наша судьба принадлежит нам самим, и мы не позволим никаким соперникам встать у нас на пути."
 
 USA_imperial_roost: "Имперское гнездовье"
 USA_imperial_roost_desc: "[ROOT.GetNameDefCap] — предначертанный наследник Западного полушария. Это удел Орла, и здесь он вьёт своё гнездо. Ни одному врагу не будет позволено нанести по нему удар, и он обладает полным контролем и господством над самыми дальними пределами своей территории. Небеса, земли и моря Северной и Южной Америки принадлежат нам."
 USA_imperial_roost_tt: "Каждая §Yамериканская§! страна под нашей §Yгегемонией§!:\n---------------------------------------------------------\n\n"
 USA_imperial_roost_tt_2: "Становится §Yмарионеткой§! §Y[USA.GetNameDefCap]§!, если ещё не является ею.\n§YВступает§! во фракцию §Y[USA.GetAdjective]§!.\n\n---------------------------------------------------------"
 
 USA_a_song_for_the_horizon: "Песнь для горизонта"
 USA_a_song_for_the_horizon_desc: "«...На карте есть черта, где кончается старый мир и начинает расти молодой — что ж, у меня полный грузовик звёзд и полос, и больше некуда идти. От Рио-Гранде до Берингова пролива, от равнин до чужого берега — если Господь дал нам весь этот необъятный мир, значит, я так считаю, мы ещё не закончили, нет, мы ещё не закончили,\n мы просто снова отправимся вершить Явное предначертание...»"
 
 USA_stars_on_the_horizon: "Звёзды на горизонте"
 USA_stars_on_the_horizon_desc: "В последние несколько лет отчаяние сковало американский народ, но он не сдался — он выстоял и не отступил. Теперь мы начинаем видеть все плоды этой стойкости, которая не удовлетворится простым возвращением к статус-кво, но утолится лишь прокладыванием нового, более славного курса."
 
 USA_the_eagle_lifts_its_wings: "Орёл расправляет крылья"
 USA_the_eagle_lifts_its_wings_desc: "Экономика вновь взмывает выше, чем кто-либо мог представить! Американский народ полностью очнулся от своего оцепенения и сбросил с себя тяготы Великой депрессии. Остальной мир взирает с восхищением на нашу невероятную стойкость и волю."
 USA_the_eagle_lifts_its_wings_tt: "§YОткрывает§! промышленный концерн §Y$USA_general_motors$§!."
 
 USA_lady_libertys_arsenal: "Арсенал Леди Свободы"
 USA_lady_libertys_arsenal_desc: "Экономика полностью восстановилась, и наш дух вновь свободен. Мировая обстановка с каждым днём накаляется всё сильнее, и теперь нам нужна более развитая и передовая военная промышленность, чтобы не отставать."
 
 USA_federal_recovery_emergency_enterprise: "Федеральная чрезвычайная администрация по восстановлению"
 USA_federal_recovery_emergency_enterprise_desc: "Федеральная чрезвычайная администрация по восстановлению, или ФЧАВ, будет содействовать распределению федеральных средств и направлению внимания народного государства на восстановление, рост и будущую защиту американской экономики. Оно получит широчайшие полномочия как в том, что может требовать, так и в том, что может позволять."
 USA_federal_recovery_emergency_enterprise_tt: "Добавляет §Y$USA_FREE_dynamic_modifier$§!, дающий текущие эффекты политики [USAGetFREETitle]:\n  §Y(-3)§! [USA_federal_recovery_emergency_enterprise_SL_a]\n  §Y(-3)§! [USA_federal_recovery_emergency_enterprise_SL_b]\n  §Y(-3)§! [USA_federal_recovery_emergency_enterprise_SL_c]\n  §Y(-3)§! [USA_federal_recovery_emergency_enterprise_SL_d]\n  §Y(-3)§! [USA_federal_recovery_emergency_enterprise_SL_e]\n  §Y(-3)§! [USA_federal_recovery_emergency_enterprise_SL_f]\n"
 USA_federal_recovery_emergency_enterprise_tt_2: "Каждые §Y10 очков§! §Yфинансирования§! могут изменить §9сектор§! в пределах от §R-30§! до §G+50§! очков. Большинство §Yфокусов§! будут §Yперераспределять финансирование§!."
 
 USA_crisis_of_dependency: "Кризис зависимости"
 USA_crisis_of_dependency_desc: "С крахом мировой торговли и общих мировых экономик мы оказались в кризисе у себя дома. Хотя торговля приносит большую пользу при разумном подходе, очевидно, что мы не можем позволить себе опираться в благополучии на чужую промышленность."
 
 USA_the_bay_otzen_plan: "План Бея-Отцена"
 USA_the_bay_otzen_plan_desc: "Экономист Освальд Бей объединил усилия с недавно основанным Институтом экономики Отцена, чтобы представить Конгрессу план на будущее. В нём детально описан радикальный отход от нашей прежней политики: сдерживание экспорта, повышение пошлин, субсидирование базовых отраслей и интеграция ФЧАВ в проекты общественных работ по всей стране. Этот план может быть нашей единственной надеждой на восстановление нормальной жизни и стабильности."
 
 USA_invest_in_infrastructure: "Инвестировать в инфраструктуру"
 USA_invest_in_infrastructure_desc: "Каждый уголок страны связан со всеми остальными через нашу общую инфраструктуру. Если мы собираемся полагаться на себя, нам нужно быть в состоянии надёжно добираться до наших соседей."
 
 USA_reinforce_interstate_routes: "Укрепить межштатные маршруты"
 USA_reinforce_interstate_routes_desc: "Нам нужна всеобъемлющая сеть скоростных дорог и систем по всей стране. Межштатный проект обеспечит необходимую сосредоточенность усилий."
 
 USA_finance_new_mines_and_refineries: "Финансировать новые рудники и заводы"
 USA_finance_new_mines_and_refineries_desc: "По мере восстановления нашей промышленности и роста экономики нам понадобится больше ресурсов, чем когда-либо прежде. Мир завтрашнего дня сделан из резиновых шин, нефтяных двигателей и передовых сплавов из лучших материалов."
 
 USA_establish_new_forestry_zones: "Учредить новые лесохозяйственные зоны"
 USA_establish_new_forestry_zones_desc: "Выдав огромное количество новых лесозаготовительных лицензий, мы сможем открыть значительную часть наших природных ресурсов для промышленного использования и занять десятки тысяч готовых к труду американцев. Наши национальные парки останутся священными обителями покоя, но помимо этого мы задействуем наши леса."
 
 USA_tap_old_gold_mines: "Разработать старые золотые рудники"
 USA_tap_old_gold_mines_desc: "Имея в распоряжении новые инструменты, мы можем ещё раз взглянуть на наши старые карьеры и рудники и попытаться получить доступ к тем ресурсам, которые прежде было слишком трудно извлечь."
 
 USA_the_continental_grid: "Континентальная сеть"
 USA_the_continental_grid_desc: "По мере роста нашего технического мастерства и знаний мы способны всё эффективнее использовать природные богатства континента на благо среднего американца. Создав единую сеть организаций по добыче и освоению ресурсов, мы сможем координировать общее обогащение нашей национальной казны."
 
 USA_american_wellspring_administration: "Американское управление источников"
 USA_american_wellspring_administration_desc: "ФЧАВ создаст дочернюю структуру: Американское управление источников. Его роль будет заключаться в содействии широкой организации и партнёрству в добыче, переработке и использовании природных ресурсов."
 USA_american_wellspring_administration_tt: "§YОткрывает§! промышленный концерн §Y$FREE_american_wellspring_administration$§!."
 
 USA_american_architectural_administration: "Американское архитектурное управление"
 USA_american_architectural_administration_desc: "ФЧАВ создаст дочернюю структуру: Американское архитектурное управление. Его роль будет заключаться в объединении и стандартизации различных строительных практик по всей стране, расширении диапазона осваиваемых территорий и повышении темпов их использования."
 USA_american_architectural_administration_tt: "§YОткрывает§! промышленный концерн §Y$FREE_american_architectural_administration$§!."
 
 USA_ohio_mechanical_complex: "Механический комплекс Огайо"
 USA_ohio_mechanical_complex_desc: "Огромная промышленность лежит сразу к западу от Новой Англии, ожидая перезапуска и подъёма. Миллионы стойких американцев готовы взяться за работу, строя будущее Америки."
 
 USA_strive_for_the_present: "Стремиться к настоящему"
 USA_strive_for_the_present_desc: "Мы сосредоточим наше внимание на немедленном выводе нации из оцепенения, хотя часть этих усилий потребует займов, которые придётся выплачивать позже."
 USA_strive_for_the_present_tt: "Когда мы §Gзавершим§! фокус §Y$USA_north_american_autarky$§!, мы получим §Gнебольшой бонус§!."
 
 USA_rapid_growth: "Стремительный рост"
 USA_rapid_growth_desc: "Чтобы снова запустить нашу промышленность, необходимо кое-где пропустить некоторые шаги и поставить действие превыше всего. Нельзя терять времени!"
 
 USA_protect_our_tomorrow: "Защитить наше завтра"
 USA_protect_our_tomorrow_desc: "Мы сосредоточим наше внимание на удовлетворении нужд нации и подготовке к её полному восстановлению и дееспособности."
 USA_protect_our_tomorrow_tt: "Когда мы §Gзавершим§! фокус §Y$USA_north_american_autarky$§!, мы получим §Gумеренный бонус§!."
 
 USA_promote_the_national_will: "Утвердить национальную волю"
 USA_promote_the_national_will_desc: "Нам нужно помнить, зачем мы делаем то, что делаем, и ради кого. Со временем появится финансирование для помощи нашим семьям и малым общинам, на которых зиждется вся наша культура и общество."
 
 USA_steady_economic_policies: "Стабильная экономическая политика"
 USA_steady_economic_policies_desc: "Прагматичная экономическая политика поможет сформировать тенденции роста экономики и обеспечить созревание сбережений, развитие собственности, доступность ресурсов. Пока человек знает, что может рассчитывать на стабильное будущее, он способен вложить в настоящее все свои силы."
 
 USA_plan_for_the_future: "Планировать на будущее"
 USA_plan_for_the_future_desc: "Мы сосредоточим наше внимание на долгосрочных планах, которые принесут наибольшую отдачу, хотя на это потребуется время."
 USA_plan_for_the_future_tt: "Через §Y250 дней§! мы получим:\n"
 USA_plan_for_the_future_tt_2: "Через §Y250 дней§! после получения этой идеи мы получим:\n"
 USA_plan_for_the_future_tt_3: "$special_v_consumer_goods_factor_tt$§Y-25.0%§!\n$production_speed_buildings_factor_tt$§G+10.0%§!\n$production_factory_max_efficiency_factor_tt$§G+10.0%§!"
 USA_plan_for_the_future_tt_4: "в течение §Y250§! дн."
 USA_plan_for_the_future_tt_5: "Когда мы §Gзавершим§! фокус §Y$USA_north_american_autarky$§!, мы получим §Gбольшой бонус§!."
 
 USA_invest_in_long_term_schemes: "Инвестировать в долгосрочные проекты"
 USA_invest_in_long_term_schemes_desc: "По своей природе инвестиции в будущее не приносят плодов немедленно. Нам нужно набраться терпения, выстраивая тот желанный завтрашний день."
 
 USA_blue_districts: "Синие районы"
 USA_blue_districts_desc: "Заимствуя термин из работ Освальда Бея, «синие районы» — это регулируемые штатом экономические зоны, призванные максимизировать эффективность и возможности наших лучших и талантливейших людей. Регулирование и бюрократические процедуры применяются по принципу «невиновен, пока не доказано обратное», налоги и прибыль обязательно реинвестируются по высоким ставкам, а эффективная инфраструктура является первоочередной задачей."
 USA_blue_districts_tt: "Открывает §Yрешения§! по созданию §Yсиних районов§! в населённых штатах."
 
 USA_increase_technological_funding: "Увеличить финансирование технологий"
 USA_increase_technological_funding_desc: "Наши инвестиции в экономику и людей уже начали окупаться, и теперь мы обнаруживаем избыток капитала и талантов, готовых к применению. По мере того как растёт гений нашей нации, растут и наша промышленность, наша безопасность и наш уровень жизни. Вложение этой отдачи в дальнейшие инвестиции ради будущего поможет обеспечить нашим сыновьям и дочерям более процветающий завтрашний день."
 
 USA_north_american_autarky: "Североамериканская автаркия"
 USA_north_american_autarky_desc: "Мы построили эдем для собственных потомков. Между нашими двумя побережьями теперь лежит самодостаточный народ, способный выдержать сильнейшие бури мира. Наша промышленность взмыла к новым высотам, дав Америке возможность строить всё, к чему стремится её сердце."
 USA_north_american_autarky_tt_1: "Этот фокус будет §Yтем ценнее§!, в зависимости от выбранного §Yгоризонта инвестирования§!."
 #USA_north_american_autarky_tt_2: "Если был взят §Y$USA_strive_for_the_present$§!:"
 USA_north_american_autarky_tt_2_i: "Если взят §Y$USA_strive_for_the_present$§!:"
 USA_north_american_autarky_tt_2_c: "§Y$USA_strive_for_the_present$§! даёт:"
 #USA_north_american_autarky_tt_2_y: "§3Если был взят $USA_strive_for_the_present$:§!"
 #USA_north_american_autarky_tt_2_n: "§gЕсли был взят $USA_strive_for_the_present$:§!"
 #USA_north_american_autarky_tt_3: "Если был взят §Y$USA_protect_our_tomorrow$§!:"
 USA_north_american_autarky_tt_3_i: "Если взят §Y$USA_protect_our_tomorrow$§!:"
 USA_north_american_autarky_tt_3_c: "§Y$USA_protect_our_tomorrow$§! даёт:"
 #USA_north_american_autarky_tt_3_y: "§3Если был взят §Y$USA_protect_our_tomorrow$§!:§!"
