 USA_north_american_autarky_tt_4_i: "Если взят §Y$USA_plan_for_the_future$§!:"
 USA_north_american_autarky_tt_4_c: "§Y$USA_plan_for_the_future$§! даёт:"
 #USA_north_american_autarky_tt_4_y: "§3Если был взят §Y$USA_plan_for_the_future$§!:§!"
 #USA_north_american_autarky_tt_4_n: "§gЕсли был взят $USA_plan_for_the_future$:§!"
 
 USA_kickstart_the_steel_belt: "Запустить Стальной пояс"
 USA_kickstart_the_steel_belt_desc: "Сердцу нашей тяжёлой промышленности нужен лишь правильный толчок и должное финансирование, чтобы вновь встать на ноги в полный рост."
 
 USA_focus_on_our_fleets: "Сосредоточиться на наших флотах"
 USA_focus_on_our_fleets_desc: "Как страна, окружённая с обеих сторон великими океанами, мы зависим от эффективности наших флотов в вопросах проекции силы и безопасности. Нам нужно убедиться, что нашим флотам уделяется должное внимание."
 USA_focus_on_our_fleets_tt: "Если этот фокус взят §Gдо§! §Y$USA_focus_on_our_army$§!:\n\n§Y1x§! §G100%§! бонус к исследованиям в области: §YКораблестроения§!."
 USA_focus_on_our_fleets_tt_2: " Производительность верфей: §G+5.0%§!\n\n---------------------------------------------------------\nЕсли этот фокус взят §Rпосле§! §Y$USA_focus_on_our_army$§!:\n\n§Y1x§! §G50%§! бонус к исследованиям в области: §YКораблестроения§!."
 USA_focus_on_our_fleets_tt_3: " Производительность верфей: §G2.0%§!"
 
 USA_increase_naval_funding: "Увеличить финансирование флота"
 USA_increase_naval_funding_desc: "Как всегда, необходимо больше денег и инвестиций, чтобы привести наш флот в наилучшее состояние. Модернизация старых корпусов, постройка новых и поддержание обученности и готовности экипажей — дорогостоящее предприятие."
 USA_increase_naval_funding_tt: "Если §Y$USA_focus_on_our_fleets$§! завершён, этот §Yфокус§! будет §Gэффективнее§!.\n "
 
 USA_shipwreckers: "Мастера кораблекрушений"
 USA_shipwreckers_desc: "Обучение наших портовых специалистов и аварийных команд справляться с наихудшими из наихудших ситуаций подготовит наши корабли к боям высокой интенсивности."
 
 USA_special_investments_in_annapolis: "Особые инвестиции в Аннаполис"
 USA_special_investments_in_annapolis_desc: "По мере взросления американского флота стало очевидно, что ему требуется всё больше многочисленных и всё более талантливых офицеров."
 
 USA_focus_on_our_army: "Сосредоточиться на нашей армии"
 USA_focus_on_our_army_desc: "Армия Америки участвовала в боевых действиях, с перерывами, уже более века, и остаётся ключевым аспектом способности нашей нации защищать свои притязания и свой дом. Нам нужно убедиться, что нашим войскам уделяется должное внимание."
 USA_focus_on_our_army_tt: "Если этот фокус взят §Gдо§! §Y$USA_focus_on_our_fleets$§!:\n\n§Y1x§! §G100%§! бонус к исследованиям в области: §YПехотных технологий и грузовиков§!."
 USA_focus_on_our_army_tt_2: " Производительность заводов: §G+5.0%§!\n\n---------------------------------------------------------\nЕсли этот фокус взят §Rпосле§! §Y$USA_focus_on_our_fleets$§!:\n\n§Y1x§! §G50%§! бонус к исследованиям в области: §YПехотных технологий и грузовиков§!."
 USA_focus_on_our_army_tt_3: " Производительность заводов: §G+2.0%§!"
 
 USA_increase_army_funding: "Увеличить финансирование армии"
 USA_increase_army_funding_desc: "Как всегда, необходимо больше денег и инвестиций, чтобы держать наши дивизии оснащёнными современной и эффективной техникой, а передовая подготовка требует всё более значительных ресурсов. Содержание современной армии — дорогостоящее предприятие."
 USA_increase_army_funding_tt: "Если §Y$USA_focus_on_our_army$§! завершён, этот §Yфокус§! будет §Gэффективнее§!.\n "
 
 USA_precision_mechanisms: "Точные механизмы"
 USA_precision_mechanisms_desc: "В современной войне становится очевидным, что победа может зависеть от технического и материального превосходства. Проектирование снаряжения, способного использовать наши самые передовые достижения, даст нашим войскам наилучший шанс, какой мы можем обеспечить."
 
 USA_special_investments_in_westpoint: "Особые инвестиции в Вест-Пойнт"
 USA_special_investments_in_westpoint_desc: "По мере взросления американской армии стало очевидно, что ей требуется всё больше многочисленных и всё более талантливых офицеров."
 
 USA_industrialize_california: "Индустриализировать Калифорнию"
 USA_industrialize_california_desc: "Создание крупной промышленной базы операций в Калифорнии позволит нам гораздо эффективнее направлять ресурсы на Запад. Это также поможет нам укрепить контроль над нашими тихоокеанскими территориями."
 
 USA_industrial_funding: "Промышленное финансирование"
 USA_industrial_funding_desc: "Наши заводы работают не на речах. Мы откроем казну и позволим промышленности самой решить, что ей нужно."
 
 USA_wonder_workshops: "Мастерские чудес"
 USA_wonder_workshops_desc: "Мануфактуры Америки производят одни из самых элегантных и совершенных изделий и предметов роскоши в мире. Мы можем извлечь выгоду из всего мирового таланта, и дальнейшие инвестиции в наши передовые разработки хорошо послужат нам в будущем."
 
 USA_improve_military_training: "Улучшить военную подготовку"
 USA_improve_military_training_desc: "При такой большой численности армии нам нужно обеспечить, чтобы наши методы подготовки были не только эффективны, но и способны расти вместе с нашими рядами."
 
 USA_county_militias: "Окружные ополчения"
 USA_county_militias_desc: "Если война когда-либо достигнет наших берегов, именно сам американский народ наверняка удержит рубеж."
 
 USA_independently_funded_armories: "Независимо финансируемые арсеналы"
 USA_independently_funded_armories_desc: "Предоставив расширенные права отдельным лицам и общинам на приобретение оборонительного снаряжения, гражданские группы и финансируемые штатами ополчения смогут получить современное и совершенное вооружение и технику, позволяющие им противостоять даже самым мощным захватчикам."
 
 USA_civilian_logistics_contracts: "Контракты гражданской логистики"
 USA_civilian_logistics_contracts_desc: "Хорошая логистика не выигрывает войн, но тот, чья логистика подведёт первой, точно их проиграет. Учитывая масштаб, в котором нас могут призвать сражаться, расширение рядов наших логистических систем за счёт широких гражданских структур даст нам стратегическую гибкость, необходимую для того, чтобы продолжать бой в любой час, в любой точке."
 
 USA_terrain_navigation_courses: "Курсы ориентирования на местности"
 USA_terrain_navigation_courses_desc: "Способность ориентироваться в густых лесах, на холмистых равнинах и в суровых горах даёт огромное преимущество на войне. Если армия планирует сражаться с нами дома, ей придётся столкнуться с огромным разнообразием наших ландшафтов и обширным населением, способным умело действовать в них."
 
 USA_cloth_and_rope_ramparts: "Валы из ткани и верёвок"
 USA_cloth_and_rope_ramparts_desc: "Даже самые простые и обыденные предметы домашнего обихода можно использовать для создания укреплений и скрытых позиций почти где угодно. Всё дело в изобретательности, и пробуждение её в нашем народе сейчас поможет ему проявлять больше выдумки в дальнейшем."
 
 USA_confederalized_asset_procurement: "Конфедерализованные закупки вооружений"
 USA_confederalized_asset_procurement_desc: "Разделение ответственности и обязанностей по накоплению запасов вооружений между федеральным правительством, правительствами штатов и местными подразделениями станет дорогостоящей и поначалу пугающей организационной задачей, но как только эта система будет полностью децентрализована, каждая группа и каждый человек смогут применять свои знания и опыт на месте ради повышения нашей общей боеготовности."
 
 USA_FREE_improved_focus: "Улучшенная сосредоточенность"
 USA_FREE_improved_focus_desc: "Когда ФЧАВ вкладывает время и ресурсы в какой-либо сектор, это требует мобилизации сотен тысяч людей. Эти масштабные операции трудно координировать, но по мере того как ведомство работает и действует, оно и его руководство становятся эффективнее."
 USA_FREE_improved_focus_tt: "§GУлучшает значение§! §Yфокуса§! [USAGetFREETitle] на §Y(+1§!, §Y+2§!, §Y+3)§! соответственно в дальнейшем.\n§R(Не изменяет уже выделенные средства)§!"
 
 USA_FREE_recovery_funds: "Фонды восстановления"
 USA_FREE_recovery_funds_desc: "Поскольку финансирование и внимание федерального правительства направляются в первую очередь ФЧАВ, области особого интереса, не входящие в его фокус, зачастую остаются забытыми на периферии. Поэтому необходим новый подкомитет, чтобы должным образом позаботиться о тех секторах, что были случайно упущены."
 USA_FREE_recovery_funds_tt: "Каждый §9сектор§!, который в настоящее время §Yбедствует§! под управлением [USAGetFREETitle], получит §Gдополнительное финансирование§! §Y(+[?FREE_recovery_funds_S])§! (§G$S_LOC$§!). \n§9Секторы§!, которые в настоящее время §Yпроцветают§!, получат §Gнебольшое дополнительное финансирование§! §Y(+[?FREE_recovery_funds_P])§! (§G$P_LOC$§!)."
 
 USA_FREE_expert_guidance: "Экспертное руководство"
 USA_FREE_expert_guidance_desc: "Особенно для крупного государственного ведомства невозможно точно знать, как действовать в тончайших деталях каждого отдельного аспекта деятельности целой страны. Поэтому, имея дело с конкретным сектором, ФЧАВ будет привлекать специалистов и экспертов в этой области для консультаций."
 USA_FREE_expert_guidance_tt: "Каждый §9сектор§!, который в настоящее время §Yпроцветает§! под управлением [USAGetFREETitle], получит §Gдополнительное финансирование§! §Y(+[?FREE_expert_guidance_P])§! (§G$P_LOC$§!). \n§9Секторы§!, которые в настоящее время §Yбедствуют§!, получат §Gнебольшое дополнительное финансирование§! §Y(+[?FREE_expert_guidance_S])§! (§G$S_LOC$§!)."
 
 USA_FREE_improved_focus_II: "Улучшенная сосредоточенность II"
 USA_FREE_improved_focus_II_desc: "Усилия, вкладываемые в продвижение сектора, можно дополнительно улучшить, создав независимые группы подрядчиков и экспертов для надзора за распределением средств и выделением талантов и ресурсов в их областях."
 USA_FREE_improved_focus_II_tt: "§GЕщё больше улучшает значение§! §Yфокуса§! [USAGetFREETitle] на §Y(+1§!, §Y+2§!, §Y+3)§! соответственно в дальнейшем.\n§R(Не изменяет уже выделенные средства)§!"
 
 USA_FREE_funds_management: "Управление финансами"
 USA_FREE_funds_management_desc: "В организации столь грандиозной, как ФЧАВ, неизбежно найдётся значительное количество денег, которые по той или иной причине уходят в никуда. Внимание к этому с самого начала каждого нового проекта поможет сократить общие потери."
 USA_FREE_funds_management_tt: "§GСнижает серьёзный штраф§! §Yфокуса§! [USAGetFREETitle] на §Y(-1)§! в дальнейшем.\n§R(Не изменяет уже выделенные средства)§!"
 
 USA_FREE_top_end_funds_management: "Управление финансами верхнего уровня"
 USA_FREE_top_end_funds_management_desc: "Администрация ФЧАВ сосредоточит своё внимание на надлежащем распределении средств и ресурсов на самые грандиозные начинания организации."
 USA_FREE_top_end_funds_management_tt: "§GЕщё больше снижает серьёзный штраф§! §Yфокуса§! [USAGetFREETitle] на §Y(-1)§! в дальнейшем.\n§R(Не изменяет уже выделенные средства)§!"
 
 USA_FREE_lower_end_funds_management: "Управление финансами нижнего уровня"
 USA_FREE_lower_end_funds_management_desc: "Администрация ФЧАВ сосредоточит своё внимание на надлежащем распределении и делегировании ролей и ресурсов тем проектам, что составляют основную часть работы организации."
 USA_FREE_lower_end_funds_management_tt: "§GСнижает значительный штраф§! §Yфокуса§! [USAGetFREETitle] на §Y(-1)§! в дальнейшем.\n§R(Не изменяет уже выделенные средства)§!"
 
 USA_FREE_department_expansion: "Расширение ведомства"
 USA_FREE_department_expansion_desc: "С новыми офисами, новым персоналом и новыми полномочиями ФЧАВ сможет расширить свой охват и своё влияние."
 USA_FREE_department_expansion_tt: "Позволяет §Gулучшить§! §Yфокус§! или §Yуправление финансами§! [USAGetFREETitle].\n\nВсе §9секторы§! получают §Rнебольшой штраф§! §Y([?FREE_points_V])§!."
 USA_FREE_department_expansion_tt_3: "Позволяет [USAGetFREETitle] §Gулучшить§! свой §Yфокус§! или §Yуправление средствами§!."
 USA_FREE_department_expansion_tt_2: "§YОткрывает§! промышленный концерн §YФЧАВ§!."
 
 USA_FREE_raise_taxes_for_reinvestment: "Повысить налоги ради реинвестирования"
 USA_FREE_raise_taxes_for_reinvestment_desc: "Федеральное правительство улучшит и расширит возможности и потенциал ФЧАВ, повысив налоги для его финансирования. Хотя это будет не самым популярным решением, оно станет самым ответственным."
 USA_FREE_raise_taxes_for_reinvestment_tt: "Позволяет §Gещё больше улучшить§! §Yфокус§! или §Yуправление финансами§! [USAGetFREETitle].\n\nВсе §9секторы§! получают §Rнебольшой штраф§! §Y([?FREE_points_V])§!."
 USA_FREE_raise_taxes_for_reinvestment_tt_2: "§GУлучшает§! промышленный концерн §YФЧАВ§!."
 
 USA_FREE_print_money_to_fund_FREE: "Напечатать деньги для финансирования ФЧАВ"
 USA_FREE_print_money_to_fund_FREE_desc: "Федеральное правительство просто напечатает деньги, чтобы оплатить новые системы и рабочую силу ФЧАВ. В краткосрочной перспективе это будет эффективнее, хотя негативные последствия могут проявиться позже, и в этом случае ФЧАВ придётся доказать свою ценность в ещё большей степени."
 USA_FREE_print_money_to_fund_FREE_tt: "Позволяет §Gещё больше улучшить§! §Yфокус§! или §Yуправление финансами§! [USAGetFREETitle].\n\nВсе §9секторы§! получают §Rнебольшой штраф§! §Y([?FREE_points_V])§!."
 USA_FREE_print_money_to_fund_FREE_tt_2: "§GУлучшает§! промышленный концерн §YФЧАВ§!."
 
 USA_FREE_undersecretariat_for_sectoral_administration: "Заместитель секретариата по отраслевому управлению"
 USA_FREE_undersecretariat_for_sectoral_administration_desc: "Влияние и масштаб ФЧАВ выросли до такой степени, что стали неповоротливыми. В ответ будет учреждён Заместитель секретариата по отраслевому управлению, который станет дополнительным уровнем руководства и контроля, позволяющим ФЧАВ эффективно действовать в своих нынешних и всё расширяющихся масштабах."
 USA_FREE_undersecretariat_for_sectoral_administration_tt: "§Y$USA_FREE_dynamic_modifier$§! становится §Y$USA_FREE_dynamic_modifier_2$§!.\n\nПозволяет §Gполностью улучшить§! §Yфокус§! и §Yуправление финансами§! [USAGetFREETitle].\n\nВсе §9секторы§! получают §Rнебольшой штраф§! §Y([?FREE_points_V])§!."
 USA_FREE_undersecretariat_for_sectoral_administration_tt_2: "§GУлучшает§! промышленный концерн §YФЧАВ§!."
 
 USA_FREE_recovery_achieved: "Восстановление достигнуто"
 USA_FREE_recovery_achieved_desc: "Экономика процветает, американский народ оправился, деньги вновь текут свободным потоком! Теперь, когда нам не нужно так крепко держаться за кошелёк, ФЧАВ волен продвигать секторы более высокими темпами и с большими ресурсами за каждым предложением."
 USA_FREE_recovery_achieved_tt: "Этот фокус даст §Yтем больший эффект§!, чем §Yположительнее финансирование§! от [USAGetFREETitle] на данный момент.\n\n"
 USA_FREE_recovery_achieved_tt_2: "§GУлучшает все значения§! §Yфокуса§! [USAGetFREETitle] на §Y(+1)§! в дальнейшем.\n§GСнимает все небольшие штрафы§! §Yфокуса§! [USAGetFREETitle] в дальнейшем.\n§R(Не изменяет уже выделенные средства)§!"
 
 USA_grange_auxiliary_corps: "Вспомогательный корпус Грейнджа"
 USA_grange_auxiliary_corps_desc: "«Грейндж» уже долгое время остаётся благом для сельских регионов страны — они знают своё дело. Мы могли бы задействовать их для ремонта нашей инфраструктуры и восстановления наших городов и улиц, а у них уже есть ресурсы, необходимые для большей части этой работы."
 
 USA_protect_against_foreign_interference: "Защититься от иностранного вмешательства"
 USA_protect_against_foreign_interference_desc: "Есть немало внешних сил, стремящихся подточить наш город на холме ради собственной выгоды или даже отравить его колодцы и разрушить изнутри. Мы не можем допустить, чтобы американский народ подвергался каким-либо подрывным иностранным влияниям."
