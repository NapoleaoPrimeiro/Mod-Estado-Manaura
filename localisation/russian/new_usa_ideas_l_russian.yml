   add_air_base_4: "Проверяет возможность строительства 4 авиабаз. Строит 4, если можно, иначе проверяет возможность постройки 3."
   USA_improve_eco_dynamic_modifier: "Изменяет динамический модификатор экономики, чтобы улучшить отображаемую иконку во вкладке национальных духов."
   skip_line_tt: "Добавляет пустую строку в локализации данного текстового раздела."
   USA_modify_eco: "Проверяет текущий динамический модификатор экономики и указывает на изменение правильной версии."
   USA_modify_gov: "Делает пометку об изменении динамического модификатора правительства, если он активен. Если нет, добавляет его."
   USA_modify_airforce: "Делает пометку об изменении динамического модификатора авиации. Обновляется для проверки, является ли модификатор для ВВС или Армейского авиакорпуса."
   USA_modify_army: "Делает пометку об изменении динамического модификатора армии."
   USA_modify_navy: "Делает пометку об изменении динамического модификатора флота."
   USA_modify_oss: "Делает пометку об изменении динамического модификатора OSS, если он активен. Если нет, добавляет его."
   USA_modify_mic: "Делает пометку об изменении динамического модификатора ВПК."
   USA_spawn_national_guard: "Создать дивизию национальной гвардии."
   USA_create_2A_militia_template: "Создать шаблон дивизии ополчения 2A, если он еще не создан."
   USA_spawn_2A_militia: "Создать дивизию ополчения 2A."
   USA_NC_increase_conservative_resistance: "Повышает идею «консервативное сопротивление» на 1 ступень, если она активна. При достижении 5 начинается гражданская война."
   USA_NC_decrease_conservative_resistance: "Понижает идею «консервативное сопротивление» на 1 ступень, если она активна. При достижении 1 идея снимается."
   USA_NC_remove_conservative_resistance: "Удаляет любой активный дух «Консервативное сопротивление»."
   USA_start_NC_civil_war: "Запускает гражданскую войну националистов-коммунистов. Если флаг уже установлен, ничего не делает. Если активно «консервативное сопротивление», снимает его. Проверяет уровень поддержки коммунизма и устанавливает соответствующий глобальный флаг для войны."
   USA_NC_apply_surprise_ti: "Добавляет противоположной стороне в Гражданской войне националистов-коммунистов соответствующий временный дух «Застигнуты врасплох»."
   USA_AN_check_FREE_civ_score: "Если под-идея гражданской промышленности ФЧАВ активна, устанавливает дух на правильный тип значения очков."
   USA_AN_check_FREE_mil_score: "Если под-идея военной промышленности ФЧАВ активна, устанавливает дух на правильный тип значения очков."
   USA_AN_check_FREE_arm_score: "Если под-идея армии ФЧАВ активна, устанавливает дух на правильный тип значения очков."
   USA_AN_check_FREE_nav_score: "Если под-идея флота ФЧАВ активна, устанавливает дух на правильный тип значения очков."
   USA_AN_check_FREE_air_score: "Если под-идея ВВС ФЧАВ активна, устанавливает дух на правильный тип значения очков."
   USA_AN_check_FREE_sci_score: "Если под-идея науки ФЧАВ активна, устанавливает дух на правильный тип значения очков."
   USA_remove_all_BOP_modifiers: "Удаляет все текущие активные §Yмодификаторы баланса сил§! для баланса сил §Y«Оборонная готовность»§! (#1-18)."
   USA_AN_improve_under_crisis_spirit: "Повышает уровень духа «В условиях кризиса», ослабляя его негативные эффекты вплоть до полного удаления."
   USA_AN_create_RIG: "Проверяет контроль над регионами 479 или 480. Если они контролируются, создает там интегрированного марионетку Рио-Гранде с некоторыми бонусами. Задает соответствующие косметические названия в зависимости от пути."
   USA_AN_create_RNS: "Проверяет контроль над регионами 482, 483 или 484. Если они контролируются, создает там интегрированного марионетку Сонора с некоторыми бонусами. Задает соответствующие косметические названия в зависимости от пути."
   USA_start_AN_civil_war: "Начинает гражданскую войну американских националистов. Если флаг уже установлен, ничего не делает. Проверяет духи «Братский дух» и «Патриоты наготове». Проверяет уровень поддержки фашизма и устанавливает соответствующий глобальный флаг для войны."
   USA_RR_update_influence: "Устанавливает правильные значения различных переменных влияния."
   USA_RR_increase_ties: "Увеличивает значение флага связей на 1 или добавляет его, если он отсутствует."
   USA_GO_increase_infiltration: "Увеличивает значение флага проникновения на 1 или добавляет его, если он отсутствует."
  
  # Flags
   usa_nc_homeless_relief_or_stand_up_flag: "Проверяет, был ли взят один из фокусов $USA_homeless_relief_funds$ или $USA_stand_up_for_the_unemployed$. Если да, другой фокус не снижает консервативное сопротивление (эффект применяется только один раз)."
   usa_nc_bottom_branch_flag: "Проверяет, был ли взят один из фокусов $USA_protect_productive_entrepreneurs$, $USA_american_worker_guilds$ или $USA_federal_honor_programs$. Если да, остальные не снижают консервативное сопротивление (эффект применяется только один раз)."
   USA_NC_civil_war_started_flag: "Проверяет, началась ли уже (или была запущена) гражданская война националистов-коммунистов."
