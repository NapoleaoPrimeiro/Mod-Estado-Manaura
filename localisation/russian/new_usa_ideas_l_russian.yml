 # DYNAMIC MODIFIERS
  USA_economy_dynamic_modifier_great_depression: "Великая депрессия"
  USA_economy_dynamic_modifier_great_depression_desc: "Хотя Великая депрессия была общемировым явлением, она началась с краха фондового рынка в Соединенных Штатах, что привело к резкому росту уровня безработицы и падению налоговых поступлений. У американского народа и правительства достаточно забот и без участия в очередной войне."
  USA_economy_dynamic_modifier_bad: "Интенсивное восстановление"
  USA_economy_dynamic_modifier_bad_desc: "Экономика медленно восстанавливается, но ее беды еще не закончились."
  USA_government_dynamic_modifier: "Федеральное правительство"
  USA_government_dynamic_modifier_desc: "Федеральное правительство Соединенных Штатов состоит из Белого дома, Палаты представителей и Сената в Конгрессе, Верховного суда и многочисленных федеральных институтов при этих органах."
  USA_government_dynamic_modifier_2: "Реорганизованное федеральное правительство"
  USA_government_dynamic_modifier_2_desc: "Федеральное правительство Соединенных Штатов было реорганизовано в целях повышения эффективности и выполнения своих конституционных обязанностей."
  USA_economy_dynamic_modifier_good: "Американская экономика"
  USA_economy_dynamic_modifier_good_desc: "Экономика обретает силу и скоро расцветет."
  USA_economy_dynamic_modifier_great: "Американская экономика"
  USA_economy_dynamic_modifier_great_desc: "Американская экономика пробудилась и восстала из пепла Великой депрессии. Теперь она стоит могучая и блистательная, являясь маяком для всего мира."
  USA_agency_dynamic_modifier: "OSS"
  USA_agency_dynamic_modifier_desc: "Американские службы внешней и внутренней разведки находятся в ведении Управления стратегических служб, влияние которого растет с каждым днем."
  USA_agency_dynamic_modifier_2: "ЦРУ"
  USA_agency_dynamic_modifier_2_desc: "Центральное разведывательное управление — это департамент внешней разведки Америки, которому поручено контролировать дела иностранных противников, пока правительство сосредоточено на собственных делах."
  USA_mic_dynamic_modifier: "Американский военно-промышленный комплекс"
  USA_mic_dynamic_modifier_desc: "Построенный на базе невероятной экономической мощи, присущей США, военно-промышленный комплекс охватывает сотни интересов во всех существующих отраслях, работая над созданием более многочисленных и эффективных военных систем."
  USA_arm_dynamic_modifier: "Армия Соединенных Штатов"
  USA_arm_dynamic_modifier_desc: "Несмотря на свое относительно молодое наследие, армия Соединенных Штатов существует непрерывно с момента рождения нации. Несмотря на относительную неопытность по сравнению с кадровыми войсками Европы и Азии, американская армия доказывала свою состоятельность снова и снова."
  USA_nav_dynamic_modifier: "Военно-морской флот США"
  USA_nav_dynamic_modifier_desc: "Будучи страной, омываемой океанами с обеих сторон, Военно-морской флот США является одним из важнейших активов страны. Его мощь возросла в последние десятилетия для обеспечения безопасности американских интересов дома и за рубежом."
  USA_air_dynamic_modifier: "Армейский авиационный корпус США"
  USA_air_dynamic_modifier_desc: "Первоклассный актив армии Соединенных Штатов. Воздушная мощь Америки будет доминировать в небе, позволяя армии и флоту быстро расправляться с противниками."
  USA_air_dynamic_modifier_2: "ВВС США"
  USA_air_dynamic_modifier_2_desc: "Новый первоклассный актив вооруженных сил Соединенных Штатов. Воздушная мощь Америки будет доминировать в небе, поддерживать войска и патрулировать моря."
  USA_economy_dynamic_modifier_great_communist: "Американская экономика"
  USA_economy_dynamic_modifier_great_communist_desc: "Экономика американского народа возродилась и восстала из пепла Великой депрессии. Теперь она стоит могучей и блистательной, маяком для всего мира."
  #USA_FREE_dynamic_modifier: "£GFX_usa_free_left_text_icon FREE £GFX_usa_free_right_text_icon"
  USA_FREE_dynamic_modifier: "Федеральная чрезвычайная администрация по восстановлению (ФЧАВ)"
  USA_FREE_dynamic_modifier_desc: "ФЧАВ действует в интересах центрального правительства [USA.GetNameDefCap]. Его миссией является обеспечение быстрого и эффективного восстановления экономики, культуры и стабильности страны. Для достижения своих целей оно наделено широчайшими полномочиями. \n$USA_federal_recovery_emergency_enterprise_tt_2$"
  USA_FREE_dynamic_modifier_tt: "Текущие §Yсредства§! по секторам [USAGetFREETitle] и политика:[USAGetFREECivilianIndustryNL]§Y([?USA_FREE_civ_points])§! [USAGetFREECivilianIndustry][USAGetFREEMilitaryIndustryNL]§Y([?USA_FREE_mil_points])§! [USAGetFREEMilitaryIndustry][USAGetFREEArmyNL]§Y([?USA_FREE_arm_points])§! [USAGetFREEArmy][USAGetFREENavyNL]§Y([?USA_FREE_nav_points])§! [USAGetFREENavy][USAGetFREEAirNL]§Y([?USA_FREE_air_points])§! [USAGetFREEAir][USAGetFREEScienceNL]§Y([?USA_FREE_sci_points])§! [USAGetFREEScience]"
  #USA_FREE_dynamic_modifier_tt: "Текущая политика §9FREE§!:[USAGetFREECivilianIndustryNL][USAGetFREECivilianIndustry][USAGetFREEMilitaryIndustryNL][USAGetFREEMilitaryIndustry][USAGetFREEArmyNL][USAGetFREEArmy][USAGetFREENavyNL][USAGetFREENavy][USAGetFREEAirNL][USAGetFREEAir][USAGetFREEScienceNL][USAGetFREEScience]"
  USA_FREE_dynamic_modifier_2: "Федеральная чрезвычайная администрация по восстановлению с Замсекретариата по секторному управлению"
  USA_FREE_dynamic_modifier_2_desc: "ФЧАВ США действует в интересах центрального правительства [USA.GetNameDefCap]. Его миссией является обеспечение быстрого и эффективного восстановления экономики, культуры и стабильности страны. Для достижения своих целей оно наделено широчайшими полномочиями. \n$USA_federal_recovery_emergency_enterprise_tt_2$"
  #USA_FREE_dynamic_modifier_tt: "Текущие §Yсредства§! по секторам [USAGetFREETitle] и политика:[USAGetFREECivilianIndustryNL]§Y([?USA_FREE_civ_points])§! [USAGetFREECivilianIndustry][USAGetFREEMilitaryIndustryNL]§Y([?USA_FREE_mil_points])§! [USAGetFREEMilitaryIndustry][USAGetFREEArmyNL]§Y([?USA_FREE_arm_points])§! [USAGetFREEArmy][USAGetFREENavyNL]§Y([?USA_FREE_nav_points])§! [USAGetFREENavy][USAGetFREEAirNL]§Y([?USA_FREE_air_points])§! [USAGetFREEAir][USAGetFREEScienceNL]§Y([?USA_FREE_sci_points])§! [USAGetFREEScience]"
