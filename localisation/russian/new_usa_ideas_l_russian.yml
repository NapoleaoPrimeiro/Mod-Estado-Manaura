   USA_renaissance_and_retribution_cat: "Ренессанс и возмездие"
   USA_renaissance_and_retribution_cat_desc: "Мы не намерены оставаться просто равными с [GER.GetNameDefCap] — мы намерены заявить свои права и взять под контроль этот авангард Оси. С этой целью мы установим влияние на её членов, заберем в собственность важные элементы её структуры, продемонстрируем нашу ключевую роль и в конечном счете узурпируем [GER.GetAdjective] авторитет внутри альянса. Если мы правильно разыграем свои карты, мы сможем даже захватить сердце правительственных институтов Германии.\n\n§Y[GER.GetNameDefCap]§! будет периодически увеличивать §Rсвое собственное§! влияние в §YОси§!.\n  -  Влияние, которое §YГермания§! вернула себе: £autonomy_texticon §R[?USA.USA_RR_german_recovered_influence]§!\n\n  ------------------------------------------------------------------------\n\n  §YОбщее§! влияние в §YОси§!: £autonomy_texticon §Y[?USA.USA_RR_total_influence]§!\n    -  Влияние, необходимое для узурпации контроля над §YОсью§!: £autonomy_texticon §Y[?USA.USA_RR_influence_to_usurp]§! (§Y70%§!)\n    -  Влияние, необходимое для подчинения §YГермании§!: £autonomy_texticon §Y[?USA.USA_RR_influence_to_puppet]§! (§Y95%§!)\n\n  §Y[USA.GetAdjective]§! влияние: £autonomy_texticon §G[?USA.USA_RR_current_influence]§! (§Y[?USA.USA_RR_current_influence_percentage|%1]§!)\n\n  §Y[GER.GetAdjective]§! влияние: £autonomy_texticon §R[?USA.USA_RR_german_influence]§!\n"
