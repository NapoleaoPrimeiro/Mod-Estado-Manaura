l_russian:
USA_government_de_intervention: "Деинтервенция правительства"
 USA_government_de_intervention_desc: "Великая депрессия ударила сильно и быстро менее десяти лет назад, и её последствия остаются удушающими. Однако ответные меры правительства не улучшили ситуацию, а лишь усугубили её. Чтобы решить проблему, мы должны начать с прекращения дальнейшего вреда."
  
 USA_repeal_the_new_deal: "Отмена «Нового курса»"
 USA_repeal_the_new_deal_desc: "План ФДР по спасению страны путем установления над ней общего контроля не оправдал надежд. Жильё необходимо, но не строится; еда портится, пока американцы голодают, а сбережения густонаселенных районов отправляются в забытую богом глушь. Эта политика звучала красиво, но она не должна продолжаться."
  
 USA_market_information_authority: "Создать МИУ"
 USA_market_information_authority_desc: "Чтобы максимизировать способность отдельных лиц принимать мудрые и обоснованные решения на рынке, будет создано Управление рыночной информации (МИУ). Оно обеспечит общий и всеобъемлющий ряд обновлений о состоянии всей экономики, позволяя продавцам находить покупателей и наоборот."
  
 USA_reorganize_the_fed: "Реорганизовать ФРС"
 USA_reorganize_the_fed_desc: "На протяжении десятилетий федеральное правительство всё глубже вмешивалось в частную жизнь и деятельность граждан. В то же время новые идеологии начали пускать корни, нарушая работу государственных институтов. Необходима общая реорганизация."
  
 USA_glass_act: "Закон Гласса"
 USA_glass_act_desc: "Закон Гласса обяжет раскрывать общественности все расходы и внутренние планы федерального правительства, не связанные с безопасностью, — причём в форме, не напоминающей древнюю латынь. Если каждый чиновник окажется под надзором тех, кто платит ему жалованье, коррупции станет меньше."
  
 USA_doge: "DOGE"
 USA_doge_desc: "Департамент государственной эффективности проследит за тем, чтобы ни одна часть федерального аппарата не расходовала ресурсы впустую на бесполезные затеи, любимые проекты или расточительных чиновников."
  
 USA_double_down: "Удвоить верность Конституции"
 USA_double_down_desc: "Основополагающие идеалы этой страны — то, что выделяет её среди других. Энтропия естественным образом уводила США от их высоких целей, но всё, что нужно, — это коррекция курса и новое обращение взора к тому, чтобы стать великим городом на холме для всего мира."
  
 USA_innovation_prizes: "Инновационные премии"
 USA_innovation_prizes_desc: "Помимо прямого военного применения, государственные субсидии не помогают отраслям в долгосрочной перспективе. За халявными деньгами всегда следует застой. Однако стимулирование разработки востребованных технологий принесло бы большую пользу — тем более что в случае войны эта практика лишь усилилась бы."
  
 USA_spurred_growth: "Стимулированный рост"
 USA_spurred_growth_desc: "Депрессия нанесла стране тяжёлый удар, но американский народ крепок! Двигаясь вперёд и не сворачивая с курса, наш народ начал оправляться от этой трагедии. Сосредоточив усилия на создании честных и эффективных условий игры, мы сможем обеспечить рекордно быстрое восстановление промышленности."
 
 USA_american_excellence: "Американское превосходство"
 USA_american_excellence_desc: "Если американцам суждено вести войны этого мира, они сделают это с наивысшим мастерством — вооружённые самым современным оружием, ведомые лучшими командирами, — всё ради того, чтобы сберечь жизни наших сыновей во имя свободы мира."
 
 USA_american_juggernaught: "Американский Джаггернаут"
 USA_american_juggernaught_desc: "Мощь Соединённых Штатов Америки встанет за нашими сыновьями в форме. Где бы ни оказались наши войска, с ними будет вся сила Арсенала демократии, и враги свободы потерпят сокрушительное поражение."

 USA_natural_recovery: "Естественное восстановление"
 USA_natural_recovery_desc: "Американская экономика восстановилась сама по себе: промышленный ущерб от Великой депрессии залечен, а культурные потрясения начинают уходить в прошлое. Благодаря этому Соединённые Штаты Америки вновь стоят твёрдо, их место в мире надёжно... и, возможно, миру скоро понадобится этот прочный фундамент."
 USA_natural_recovery_tt: "\nДо возобновления полноценного роста пройдёт ещё больше §Rгода§!, хотя при необходимости правительство может попробовать поддержать отдельные секторы немного больше чем §Rчерез полгода§!."

 USA_accelerated_recovery: "Ускоренное восстановление"
 USA_accelerated_recovery_desc: "Американский народ быстро собирает жизнь по кусочкам, но мир не будет ждать, пока мы почувствуем готовность вернуться в него. Мы воспользуемся ограниченной инфляцией, чтобы дать толчок деловой активности и поднять промышленность на ноги раньше, чем позже."

 USA_eagle_of_the_free_market: "Орёл свободного рынка"
 USA_eagle_of_the_free_market_desc: "Экономическое превосходство американского народа давно признано одним из величайших в мире. Предоставленные самим себе, американский бизнес и промышленность, а также наши зарубежные друзья и союзники пробудили всю мощь США, ещё более окрепшую за годы восстановления."
 
 USA_timely_intervention: "Своевременное вмешательство"
 USA_timely_intervention_desc: "Великая депрессия в Соединённых Штатах фактически завершилась. По всему миру разгораются всё более яркие огни, а могучий арсенал демократии остаётся холодным. Нам нужно запустить промышленную базу прямо сейчас, пусть это и не самый эффективный вариант — мир не оставляет нам другого выбора."

 USA_school_funding_used: "Финансирование школ"
 USA_school_funding_used_desc: "Американские студенты и исследователи могут получить большую пользу от ресурсов частного финансирования и целевых государственных инвестиций. В долгосрочной перспективе эти системы будут исключительно эффективны."

 USA_national_curiosity_journal: "Национальный журнал любопытства"
 USA_national_curiosity_journal_desc: "Инвестиции в сообщество учёных, изобретателей, умельцев, инженеров и учёных, которые будут вдохновлять на новые проекты и открытия, могут принести стране только пользу. Мы не только лучше справимся с Великой депрессией с помощью новых методов производства и новых товаров, но и наши вооружённые силы выиграют от более образованного населения, поддерживающего их."

 USA_reborn_american_philanthropy: "Возрождение американской благотворительности"
 USA_reborn_american_philanthropy_desc: "Общее состояние американской экономики восстановилось настолько, что американская культура благотворительности быстро возрождается. Частные пожертвования, общественная доброта и благотворительные организации растут с каждым днём, обогащая наше общество и промышленность."
 
 USA_lowered_taxes: "Снижение налогов"
 USA_lowered_taxes_desc: "Расширение государства неустанно требует всё более высоких налогов. Хотя это не позволит столь же быстро нарастить государственный ответ в случае кризиса, оно обеспечит более здоровый естественный рост экономики."

USA_infrastructure_projects: "Инфраструктурные проекты"
 USA_infrastructure_projects_desc: "Уже созданы значительные институты для строительства инфраструктуры по всей стране. Продолжение этих работ там, где это целесообразно, пойдёт стране на пользу."

 USA_retirement_stocks: "Пенсионные акции"
 USA_retirement_stocks_desc: "Огромные средства граждан были вложены в социальное страхование для будущего использования. Однако вместо того, чтобы просто копить их под проценты, давайте направим эти средства на фондовый рынок, что позволит их периодически снимать."

 USA_repeal_smoot_hawley: "Отменить Смут-Хоули"
 USA_repeal_smoot_hawley_desc: "Эти торговые санкции, спорно считающиеся истинным началом Великой депрессии, обрушили мировую экономику в одночасье и опустошили как американский рынок, так и десятки зарубежных рынков. Хотя это будет непопулярно для многих, нам следует постараться отменить эти санкции и как можно шире открыть американский рынок для мира."

 USA_state_federal_joint_research_initiative: "Совместная исследовательская инициатива штатов и федерации"
 USA_state_federal_joint_research_initiative_desc: "Инновации — естественная часть американской культуры, и разнообразные инициативы предпринимаются постоянно на всех уровнях. Если нам удастся скоординировать эти существующие проекты, чтобы они обменивались знаниями и опытом, прогресс всех проектов может резко ускориться."

 USA_us_science_network: "Научная сеть США"
 USA_us_science_network_desc: "Концентрация научных инвестиций в рамках целенаправленных проектов повысит нашу способность разрабатывать новые технологии на переднем крае исследований."

 USA_national_statistics_department: "Национальный статистический департамент"
 USA_national_statistics_department_desc: "Расширение АРИ за счёт команды, которая будет собирать данные по всей стране, улучшит возможности потребителей, работников и работодателей находить незанятые ниши на рынке и принимать верные решения."

 USA_gradual_subsidy_relief: "Постепенное снятие субсидий"
 USA_gradual_subsidy_relief_desc: "Действуют различные программы по снятию нагрузки с фермеров и других производителей, однако результаты не оправдали ожиданий. Американцы голодают, а еда сжигается в поле. Хотя в краткосрочной перспективе это будет болезненно, спокойное и постепенное снятие широкой субсидиарной политики последних лет поможет восстановить рыночный баланс."

 USA_medical_reform: "Медицинская реформа"
 USA_medical_reform_desc: "Снятие ограничений на врачебные лицензии и устранение федерального вмешательства в устоявшиеся медицинские системы позволят лучшим и готовым специалистам действовать в медицинской отрасли."

 USA_international_free_markets: "Международные свободные рынки"
 USA_international_free_markets_desc: "Благодаря повторному открытию США для мирового рынка американская экономика и экономика остального мира быстро восстанавливаются. Хотя ущерб потребует ещё времени для полного устранения, природное богатство и поразительная сила США уже приносят плоды."

 USA_oss_expansion: "Расширение УСС"
 USA_oss_expansion_desc: "Развитие нашей разведывательной службы будет иметь первостепенное значение для поддержания темпа в современном мире, а Управление стратегических служб будет охранять секреты Америки."

 USA_defense_focus: "Оборонительный уклон"
 USA_defense_focus_desc: "Наши стратегические службы сосредоточат усилия на защите США и её народа."

 USA_offense_focus: "Наступательный уклон"
 USA_offense_focus_desc: "Наши стратегические службы сосредоточат усилия на вмешательстве во внутренние дела иностранных государств."

 USA_wartime_intelligence_operations: "Разведывательные операции военного времени"
 USA_wartime_intelligence_operations_desc: "США ведут войну, и наши спецслужбы крайне необходимы для защиты наших военных интересов и расследования интересов противника. УСС должно действовать с максимальной эффективностью, чтобы срывать действия наших врагов."

 USA_rose_club: "Клуб Роз"
 USA_rose_club_desc: "Клуб Роз — это особое подразделение разведки, занимающееся защитой и поддержкой организаций сопротивления. Его существование будет оставаться в тайне, а оперативники — ещё более скрытными."

 USA_industrial_recovery: "Промышленное восстановление"
 USA_industrial_recovery_desc: "Поскольку доллар вновь набирает силу, рабочие места растут, а работники получают зарплату, шестерёнки промышленности снова начинают крутиться."

 USA_dynamism_unlocked: "Динамизм раскован"
 USA_dynamism_unlocked_desc: "Экономика восстановилась до точки, когда она работает близко к норме. Если бы кризис разразился снова, у нас теперь есть импульс, необходимый для достойного ответа. Американский народ продолжит оправляться от потерянных лет и вернёт стране прежнее процветание!"

 USA_treaty_of_international_reconciliation: "Договор международного примирения"
 USA_treaty_of_international_reconciliation_desc: "Ущерб, причинённый нашими первоначальными тарифами, осложнил многие дипломатические отношения. Попробуем исправить ситуацию, собрав наших друзей и союзников и примирившись из-за наших защитных мер друг против друга."

 USA_industrial_expansion: "Промышленный рост"
 USA_industrial_expansion_desc: "Американская промышленность набирает обороты и возвращается к прежним темпам расширения. Новые отрасли, кажется, появляются каждую неделю, а основа нашей промышленной мощи неустанно совершенствуется."
 USA_industrial_expansion_in_progress_tt: "Экономика начинает расти снова, появляются новые промышленные мощности. \nПрогресс: §Y$FLAG_DAYS$§!/$TIME_DAYS$ дней"
 USA_industrial_expansion_cant_do_tt: "Этот фокус завершится автоматически после выполнения любого из условий. \nСосредоточьтесь либо на §YВнутренней§!, либо на §YСтратегической§! промышленности."
 USA_industrial_expansion_tt: "§YРазблокирует§! промышленный концерн §Y$USA_general_motors$§!."

 USA_wartime_economy: "Экономика военного времени"
 USA_wartime_economy_desc: "Мир в огне, и нашей крепости демократии не удастся оставаться в такой изоляции от пламени. Уже искры летят в нашу сторону и грозят поджечь Северную Америку, поэтому мы должны быть готовы бороться с огнём."

 USA_oil_industry_development: "Развитие нефтяной промышленности"
 USA_oil_industry_development_desc: "В интересах укрепления способности страны добывать и производить ресурсы, необходимые для войны, особое внимание следует уделить отечественным синтетическим материалам. Это даст нам внутреннее производство товаров, необходимых для современной техники и поддержания её боеспособности."

 USA_energy_industry_investment: "Инвестиции в энергетическую промышленность"
 USA_energy_industry_investment_desc: "По мере того как наша промышленность продолжает расти и развиваться, нам требуется всё больше энергии. Америка обладает более чем достаточными ресурсами для обеспечения этого расширения — нужно лишь начать разрабатывать наши резервы."

 USA_strategic_focus: "Стратегический уклон"
 USA_strategic_focus_desc: "С тех пор как экономика снова заработала, необходимо ориентировать наши ожидания и политику на предвидение конфликта в ближайшем будущем. Возможно, усиленная оборона сохранит нам безопасность, но может также возникнуть необходимость протянуть руку помощи нашим друзьям. В любом случае нужно готовиться к этой неизбежности."

 USA_domestic_focus: "Внутренний уклон"
 USA_domestic_focus_desc: "Эта страна строилась на плечах трудолюбивых людей, и снова против всех odds она поднялась благодаря этим же людям. Мы должны сделать всё возможное, чтобы содействовать прогрессу и росту нашего государства на благо наших граждан. Именно собственной природной силой мы будем стоять твёрдо."

 USA_the_east: "Восток"
 USA_the_east_desc: "В глубинке Соединённых Штатов есть многочисленные очаги активности, которые ещё не полностью восстановили силы после биржевого краха. Направление внимания к этим центрам и удовлетворение потребностей плотно населённых районов будет более чем оправданным."

 USA_the_west: "Запад"
 USA_the_west_desc: "По всему фронтиру и вплоть до дальнего берега континента Великая депрессия принесла нашему народу страшные беды. Общие инвестиции в наиболее пострадавшие регионы помогут им эффективнее вернуться к прежней силе."

 USA_shipping_industry: "Судоходная промышленность"
 USA_shipping_industry_desc: "С закрытием международной торговли и опустошением, которое Великая депрессия произвела в каждом секторе экономики, наша судоходная отрасль подверглась удару со всех сторон одновременно. Теперь, когда средства снова текут, координация их воздействия на наш морской сектор была бы весьма своевременной."
 USA_shipping_industry_tt: "Наличие §YСвободной торговли§! сделает этот фокус более эффективным"

 USA_consumer_market: "Потребительский рынок"
 USA_consumer_market_desc: "По мере возвращения процветания растёт эффективность и производительность американских рабочих. С возобновлением богатства потребительские товары снова разлетаются с полок, а гражданская промышленность растёт, чтобы соответствовать темпу."

 USA_military_spending_adjustment: "Корректировка военных расходов"
 USA_military_spending_adjustment_desc: "Учитывая рост напряжённости в мире, было бы неразумно дальше сокращать наши вооружённые силы. Однако сокращение бюджета необходимо там, где есть лишний жир."

 USA_deregulation: "Дерегулирование"
 USA_deregulation_desc: "Естественный цикл государственного управления таков, что контроль со временем усиливается, однако зачастую эти новые меры контрпродуктивны и сдерживают рост. Устранение различных элементов государственной экспансии последних лет поможет снять полностью устранимое давление."

 USA_general_advancement: "Общее развитие"
 USA_general_advancement_desc: "Направление всех усилий на единственную узкую задачу рискует упустить динамичные возможности, открытые для нас, — те, которыми могут воспользоваться как наши союзники, так и враги. Общие инвестиции в развитие наших отраслей и возможностей послужат нам лучше в долгосрочной перспективе."

 USA_coordinated_advancement: "Скоординированное развитие"
 USA_coordinated_advancement_desc: "Хотя любой любознательный ум может взглянуть на мир и увидеть очевидные способы его изменить, именно те особые прозрения, которые кардинально меняют мир, встречаются так редко. Сосредоточение на более фантастических идеях прогресса станет нашим методом вырваться вперёд."

 USA_civilian_industry_investment: "Инвестиции в гражданскую промышленность"
 USA_civilian_industry_investment_desc: "Инвестиции в лёгкое машиностроение, используемое при производстве большинства потребительских товаров, принесут пользу стране."

 USA_military_industry_investment: "Инвестиции в военную промышленность"
 USA_military_industry_investment_desc: "Инвестиции в тяжёлое машиностроение, используемое в военной промышленности, будут мудрым шагом."

 USA_housing_reform: "Реформа жилья"
 USA_housing_reform_desc: "Поддерживая стандарты проектирования и нормы зонирования по всей стране, мы можем снизить нагрузку бюрократии на жилищное строительство. Когда люди уверены в своём жилье, их производительность и настрой улучшаются."

 USA_engineering_grants: "Инженерные гранты"
 USA_engineering_grants_desc: "Инвестиции в общую область инженерии и ресурсы для её развития и продвижения в значительной мере укрепят наши промышленные возможности в будущем."

 USA_school_of_mines: "Горная школа"
 USA_school_of_mines_desc: "Колорадская горная школа — давний прославленный институт, выпускающий лучших наших инженеров. С постоянно растущей потребностью в высококвалифицированных инженерах инвестиции в этот колледж способны принести щедрые дивиденды в будущем."

 USA_banking_reform: "Банковская реформа"
 USA_banking_reform_desc: "Экономический крах, первоначально приведший к Великой депрессии, зародился из проблемы кредитования в банках и пузырей на фондовом рынке. Фондовый рынок ещё не восстановился, но помощь банкам в возвращении к ликвидности и содействие разумным стратегиям кредитования помогут оживить доверие людей к ним."

 USA_stock_market_invigoration: "Оздоровление фондового рынка"
 USA_stock_market_invigoration_desc: "С пробуждением американского рынка и возобновлением международной торговли процветание фондового рынка также может вернуться к норме для людей по всему миру."

 USA_global_charity: "Глобальная благотворительность"
 USA_global_charity_desc: "С открытием зарубежных рынков Америки те страны, открытые для нашей торговли, вновь готовы к инвестициям со стороны американского народа."

 USA_foreign_funds: "Иностранный капитал"
 USA_foreign_funds_desc: "Открытие Америки миру означает, что она вновь созрела для иностранных инвестиций. В страну скоро потекут лучшие капиталы мира."
 USA_foreign_funds_decisions_unlock_tt: "Открывает §Yrешения§! для проведения §Yвзаимных инвестиций§! с другими странами."

 USA_trade_recovery: "Восстановление торговли"
 USA_trade_recovery_desc: "Поскольку ресурсы снова текут через рынок, как прежде, те отрасли, которые были закрыты Великой депрессией, вернулись в полную силу и теперь могут возобновить свой рост и способствовать международной торговле."

 USA_consumerism: "Консюмеризм"
 USA_consumerism_desc: "Свободный рынок Соединённых Штатов Америки направляет свой рост и инвестиции на материальное процветание народа. Индивидуальное благосостояние американских граждан намного превышает все прежние стандарты, и в центре национального внимания оказывается дух потребительства."

 USA_advanced_industrialization: "Передовая индустриализация"
 USA_advanced_industrialization_desc: "Направление развития нашей промышленности в сторону будущего и повышение её способности браться за крупнейшие проекты имеет первостепенное значение для обеспечения постоянного положения самой развитой и способной экономики мира."

 USA_spending_reform: "Реформа расходов"
 USA_spending_reform_desc: "Необходимо обуздать способ расходования ресурсов страной и её администрацией, чтобы расходы были эффективными. Это будет очень непопулярно и огорчит многих, но долгосрочные выгоды перевешивают эти жалобы."

 USA_grand_industrialization: "Грандиозная индустриализация"
 USA_grand_industrialization_desc: "Расширяющаяся экономическая мощь народа начинает делать ценными те огромные участки земли, которые до сих пор оставались дремлющими, а там, где инфраструктура уже создана, ценность сама по себе растёт. Промышленная мощь этой нации неустанно возрастает."

 USA_awoken_economy: "Пробудившаяся экономика"
 USA_awoken_economy_desc: "Процветающий рынок приносит пользу нам и нашим союзникам, а рост экономической мощи Америки служит маяком для всех народов, желающих разделить наше процветание."
 USA_awoken_economy_tt: " США получают §Yдве§! фабрики за каждого члена фракции."
 USA_awoken_economy_no_fac_tt: " Каждый член фракции получит §Yинвестиции§!."

 USA_world_industrial_superiority: "Мировое промышленное превосходство"
 USA_world_industrial_superiority_desc: "Ни одна нация не пользовалась такой экономической и промышленной мощью и богатством, какими мы обладаем сейчас. Ведя мир в материальном совершенстве, мы стоим как яркий город на холме — вдохновение для всех, что возможно."

 USA_state_action_reduction: "Сокращение государственных расходов"
 USA_state_action_reduction_desc: "Лучше используя налоговые поступления, мы можем снизить их негативное воздействие на экономику. Проблемы, присущие национальным схемам расходования, можно ещё больше смягчить, сократив ненужные расходы и сосредоточив средства там, где они наиболее эффективны."

 USA_reform_the_defense_act: "Реформировать закон об обороне"
 USA_reform_the_defense_act_desc: "Пересмотр и модернизация вооружённых сил Америки становятся всё более очевидной потребностью по мере ухудшения ситуации в мире."

 USA_westpoint_expansion: "Расширение Вест-Пойнта"
 USA_westpoint_expansion_desc: "Офицерский корпус армии США является ключом к успеху на поле боя, и наличие лучших офицеров в достаточном количестве будет иметь решающее значение для противостояния будущим конфликтам."

 USA_recruitment_drive: "Рекрутинговая кампания"
 USA_recruitment_drive_desc: "Армии необходимо серьёзно увеличить численность, прежде чем мы можем счесть её готовой к действиям."

 USA_officer_focus: "Акцент на офицерах"
 USA_officer_focus_desc: "Будучи командирами на местах, офицеры армии США должны получать приоритет при разработке доктрины и инвестировании."

 USA_soldier_focus: "Акцент на рядовых"
 USA_soldier_focus_desc: "Человек на передовой — тот, кто непосредственно ведёт бой, и он вышел из широкого американского народа в целом. Им следует уделить особое внимание, чтобы убедиться, что они способны действовать в полную силу."

 USA_international_armed_forces_study: "Изучение иностранных вооружённых сил"
 USA_international_armed_forces_study_desc: "Определяя наилучший путь к возрождению и модернизации наших сил, было бы особенно дальновидно посмотреть, какого прогресса достигли другие. Мудрец учится на ошибках; мудрейший учится на ошибках других."

 USA_joint_action: "Совместный уклон"
 USA_joint_action_desc: "Армии нужны и солдаты на земле, и офицеры, ведущие их. Без полноценного сотрудничества и координации тех и других любые силы будут страдать."

 USA_doctrine_development: "Разработка доктрины"
 USA_doctrine_development_desc: "Боевые действия изменились со времён Великой войны, и наша армия должна быть в курсе всех лучших способов справляться с этими изменениями."

 USA_strategy_development: "Развитие стратегии"
 USA_strategy_development_desc: "Войны ведутся на высоком уровне и должны рассматриваться сверху вниз. Каждое сражение важно лишь постольку, поскольку продвигает общую стратегию. Конечные цели наступления определяются посредством точных военно-доктринальных формулировок."

 USA_tactics_development: "Развитие тактики"
 USA_tactics_development_desc: "Когда начинается стрельба, единственное, что имеет значение, — это координация и планирование армии. Когда цели ясны, победа на виду. Армия, умеющая выигрывать малые сражения, способна попытаться взять весь бой."

 USA_battle_logistics: "Боевая логистика"
 USA_battle_logistics_desc: "С точки зрения командира война — это стратегия и переигрывание противников. Однако в разгаре боя единственное, что важно, — это выживание и победа. Обеспечение высокого морального духа наших войск и заряженных винтовок поможет сохранить их в безопасности и выйти победителями."

 USA_promote_heroism: "Пропаганда героизма"
 USA_promote_heroism_desc: "Американцы имеют долгую традицию героизма — будь то в обычной жизни или на поле боя, и нередко именно действия одного храброго человека или отряда решают исход упорного боя. Наша администрация не должна скупиться на похвалу этих выдающихся проявлений и продвижение мужественного духа нашего наследия."

 USA_force_modernization: "Модернизация армии"
 USA_force_modernization_desc: "Хотя Америка не сидела без дела последние два десятилетия, наша армия всё ещё отстаёт от времени. В области скорости, мобильности и брони появляются новые инновации, и США готовы воспользоваться этими технологиями и идеями, если пожелает."
 USA_force_modernization_tt: "§YРазблокирует§! военную промышленную организацию §Y$detroit_arsenal$§!."

 USA_special_service_branch: "Ветвь специальных служб"
 USA_special_service_branch_desc: "По мере того как боевые действия становятся всё более специализированными, а солдаты — всё более тесно организованными, роль ветви специальных сил начинает вырисовываться с особой чёткостью. Нашим солдатам предстоит сражаться в новых и экстремальных условиях, и подготовка на высшем уровне поможет нашим лучшим людям справиться с тем, что им предстоит."

 USA_spec_ops: "Спецоперации"
 USA_spec_ops_desc: "В сфере передовых операций существует место для людей, которым поручено выполнять невозможное. Такие специальные операции требуют операторов исключительного мастерства и смелости, и, к счастью, у нас нет их нехватки."

 USA_mechanization_initiative: "§RИнициатива механизации§!"
 USA_mechanization_initiative_desc: "Мощные бронемашины способны нанести сокрушительный удар по противникам. Разработка необходимых технологий для применения такого оружия крайне важна."

 USA_advanced_tank_designs: "Передовые конструкции танков"
 USA_advanced_tank_designs_desc: "Поскольку отечественные знания в области бронетехники быстро распространяются и зреют, было бы разумно уделить дополнительное внимание совершенствованию этой области и обеспечению конкурентного преимущества перед любым противником."
 USA_advanced_tank_designs_tt: "§YРазблокирует§! военную промышленную организацию §Y$tank_destroyer_board$§!."

 USA_logistical_focus: "Логистический уклон"
 USA_logistical_focus_desc: "Тот, у кого лучше логистика, не гарантированно победит, но тот, чья логистика даёт сбой первой, гарантированно проиграет, — и мы не намерены занимать второе место."

 USA_art_of_war: "Искусство войны"
 USA_art_of_war_desc: "Оттачивая наши методы доктринального анализа и проектирования, мы сможем лучше готовиться к моментам, когда все наши тщательные планы неизбежно выходят в окно. Тем не менее выработка методов решения проблем всегда будет полезной, а планирование заполнит пробелы в сорванных планах."

 USA_democracys_vanguard: "Авангард демократии"
 USA_democracys_vanguard_desc: "Народ Соединённых Штатов Америки обладает несокрушимым духом. Хотя война далеко от наших берегов, мы обязаны человечеству держать их праведную борьбу близко к сердцу. Мы призываем наш великий народ подняться на высоту положения и удержать рубеж — где бы он ни пролегал."

 USA_kittyhawk_exhibition: "Выставка в Китти-Хок"
 USA_kittyhawk_exhibition_desc: "Соединённые Штаты первыми поднялись в воздух и на протяжении десятилетий оставались на острие авиации. Однако со времён Великой депрессии наш дух был сильно потрясён. Авиашоу с участием лучших пилотов и самолётов могло бы возродить эту часть нашей воли и доставить народу столь необходимую отдушину."
 USA_mastery_bonus_kittyhawk_exhibition_tt: "$USA_kittyhawk_exhibition$"

 USA_air_training: "Авиационная подготовка"
 USA_air_training_desc: "Чтобы хорошо летать, недостаточно иметь современное оборудование — нужно уметь им пользоваться. Важнее самолёта — пилот, и, несмотря на трудности, у нас ещё есть ресурсы для поддержания наших людей на высшем уровне."
 USA_mastery_bonus_air_training_tt: "$USA_air_training$"

 USA_american_designs: "Американские разработки"
 USA_american_designs_desc: "Повышение качества нашей авиации имеет первостепенное значение для сохранения конкурентоспособности в войне и обороне. Остальной мир делает шаги и открытия вокруг нас, и мы не можем позволить себе отставать."

 USA_cutting_edge_aircraft: "Самолёты переднего края"
 USA_cutting_edge_aircraft_desc: "Самолёты высшего класса дадут нашим пилотам наилучшие шансы вернуться домой живыми, гарантировав, что их противники этого не сделают. Объединение накопленного опыта и идей наших собственных экспертов и иностранных специалистов обеспечит нам острое преимущество в разработке следующего поколения аэрокосмических технологий."

 USA_foreign_aircraft_innovations: "Иностранные авиационные инновации"
 USA_foreign_aircraft_innovations_desc: "Недостаточно подходить к задаче или бою лишь с одной стороны. Сколько бы человек ни был эффективен и компетентен, ни один человек не видит полной картины, и ни одна группа инженеров не выиграет каждую конструкторскую гонку в одиночку. Обучение на достижениях других позволит нам продвигать собственные."
 
 USA_british_design_focus: "Британский конструкторский уклон"
 USA_british_design_focus_desc: "Изучая зарубежные разработки самолётов, особое внимание следует обратить на эффективные стратегии и технологии, изобретённые нашими соседями по ту сторону Атлантики. Британская авиакосмическая промышленность создала двигатели высшего класса и ориентированные на безопасность методы пилотирования, которые принесут пользу нашим лётчикам."

 USA_german_design_focus: "Германский конструкторский уклон"
 USA_german_design_focus_desc: "Изучая зарубежные разработки самолётов, особое внимание следует обратить на эффективные стратегии и технологии германских авиаторов. Нравится нам их инженерный подход или нет, немецкие аэрокосмические первопроходцы разрабатывают новые методы интеграции авиации в роли поддержки миссий, а их ВВС отлично готовят отдельных пилотов — идеи и методы, которые стоит взять на заметку."

 USA_japanese_design_focus: "Японский конструкторский уклон"
 USA_japanese_design_focus_desc: "Изучая зарубежные разработки самолётов, особое внимание следует обратить на эффективные стратегии и технологии стремительно растущей Японской империи. Её грозные традиции и военная культура привели к тому, что авиационные приоритеты вращаются вокруг превосходства в бою, а пилоты обучены воплощать это наследие. Столь агрессивная форма подготовки могла бы значительно улучшить наших лётчиков."

 USA_encourage_civilian_air_industry: "Стимулирование гражданской авиапромышленности"
 USA_encourage_civilian_air_industry_desc: "Несмотря на то что мы сосредоточены на развитии военной авиации, именно с гражданской стороны системы зачастую появляются значимые инновации и рождаются новые методы применения промышленности. Содействие расширению транзитных рейсов и гражданского авиастроения станет благом как для экономики, так и для армии."

 USA_support_the_air_industry: "Поддержка авиационной промышленности"
 USA_support_the_air_industry_desc: "По мере того как потребность в развитии нашей авиации растёт всё быстрее, преимущества содействия отечественной авиапромышленности становятся всё более очевидными. Хотя это и затратно, выгоды от такого подхода скоро станут понятны."

 USA_extreme_air_investments: "Масштабные авиационные инвестиции"
 USA_extreme_air_investments_desc: "С появлением у нас всё большего количества средств на развитие вооружённых сил авиация является одним из главных наших приоритетов. Наши силы должны быть подкреплены компетентным и подавляющим флотом самолётов, готовых захватить небо. Однако наши противники не ждут терпеливо, пока мы будем готовы встретить их, и нам необходимо действовать рьяно и неистово, чтобы оставаться на шаг впереди."

 USA_found_the_mechanical_mastery_institute: "Основать Институт механического мастерства"
 USA_found_the_mechanical_mastery_institute_desc: "Рождённый из сердца американской специализированной промышленности, этот фонд централизует лучшие умы в различных инженерных областях и обеспечит им ресурсы и стимулы для работы с максимальной эффективностью, одновременно позволяя различным областям взаимодействовать и находить новые подходы к инновациям."

 USA_war_chest_act: "Закон о военной казне"
 USA_war_chest_act_desc: "Соединённые Штаты находятся в состоянии войны. Неважно, как она началась — она здесь, и единственный правильный ответ — отдать ей всё! Настало время для всей мощи и воли Америки и её народа обрушиться на наших врагов, и все её ресурсы будут брошены на выполнение этой задачи."

 USA_close_air_support_planes: "Самолёты непосредственной поддержки"
 USA_close_air_support_planes_desc: "Хотя концепция непосредственной авиационной поддержки не является полностью новой, в последние годы она стала крупным направлением инвестиций для многих стран мира, включая многих возможных противников. Способность поддерживать войска, обеспечивая прямое огневое прикрытие с воздуха, безусловно, привлекательна, и у нас есть ресурсы для её реализации."

 USA_the_bomber_mafia: "«Бомбардировочная мафия»"
 USA_the_bomber_mafia_desc: "В рядах наших ведущих авиационных командиров существует группа провидцев, именуемая «Бомбардировочной мафией». Эти люди ставят одну идею выше всех остальных: войны можно выиграть путём применения точных стратегических бомбардировок. Это весьма непопулярное мнение, если говорить мягко, поэтому инвестиции в него потребуют убеждения многих представителей как командования, так и правительства."

 USA_true_strategic_bombing: "Подлинная стратегическая бомбардировка"
 USA_true_strategic_bombing_desc: "Идея проста: войну выигрывает уничтожение того, что её ведёт, — так что если уничтожить способность противника воевать ещё до того, как он окажется на фронте? Удары по сердцу материального производства страны могут парализовать её способность вести любой конфликт. С помощью новых технологий — новых прицелов и конструкций — эффективность наших бомб можно значительно повысить."
 USA_mastery_bonus_true_strategic_bombing_tt: "$USA_true_strategic_bombing$"

 USA_exotic_conditions_training: "Подготовка в экстремальных условиях"
 USA_exotic_conditions_training_desc: "Воздушные бои ведутся на всё больших высотах, на всё более высоких скоростях, с более надёжным оборудованием. Чтобы подготовить пилотов к реальным боям, необходимо разработать и внедрить способы подвергать их экстремальным условиям, с которыми им придётся иметь дело в небе, и заблаговременно учить их справляться с ними."

 USA_angel_warriors: "Воины-ангелы"
 USA_angel_warriors_desc: "Хотя наши пилоты будут поддерживаться Арсеналом демократии, крайне важно подходить к бою с целью не терять своих людей без нужды. Мы не только намерены вернуть наших парней домой, но и сделаем из них лучших лётчиков в мире — чьё мастерство воодушевляет наши войска, восхищает союзников и пугает врагов."
 USA_mastery_bonus_angel_warriors_tt: "$USA_angel_warriors$"


 USA_improved_cargo_planes: "Улучшенные транспортные самолёты"
 USA_improved_cargo_planes_desc: "Более крупные транспортники означают, что больше припасов можно переместить дальше, быстрее и в больших количествах. При достаточном развитии они также смогут обеспечивать масштабные воздушно-десантные операции, каких ещё не было в истории войн."

 USA_airborne_logistics: "Воздушная логистика"
 USA_airborne_logistics_desc: "Пожалуй, самый сложный и рискованный способ доставки припасов на передовую — воздушные транспортники — представляет собой чудовищно запутанную логистическую задачу, но при этом обеспечивает возможность немедленно доставить снаряжение туда, где оно нужно, в том числе окружённым бойцам, не имеющим иных путей подхода."

 USA_airpower_identity: "Облик авиации"
 USA_airpower_identity_desc: "Проверяя свои умения и усилия, наши ВВС начинают обретать собственный облик. Какую идентичность они изберут?"

 USA_united_states_army_aircorp: "Военно-воздушный корпус армии США"
 USA_united_states_army_aircorp_desc: "Основная задача американской авиации — поддерживать войска на земле и моряков на море. Полное господство в этих исторических театрах военных действий станет проще, чем когда-либо, с помощью смерти с небес. Истинное назначение наших самолётов — наносить удары по важнейшим активам противника, то есть наземным силам, способным удерживать территорию."

 USA_united_states_airforce: "Военно-воздушные силы США"
 USA_united_states_airforce_desc: "Воздушное пространство слишком велико и слишком важно, чтобы его господство было второстепенной ролью рода войск, даже не имеющего к нему отношения. Авиация Соединённых Штатов будет реорганизована в самостоятельный род войск, готовый завоевать небо. С небес американские самолёты прольют разрушение, и при господстве в воздухе каждое сражение начнётся с преимущества."
 USA_united_states_airforce_tt: "§YУСАК§! отныне будут именоваться §YВВС США§!"

 USA_xaf_development: "Разработка XAF"
 USA_xaf_development_desc: "США были лидером в области радарных технологий, но благодаря улучшенным исследованиям внутри страны и изучению зарубежных систем мы можем расширить наше понимание физики и механики, лежащих в основе этой системы, и опередить конкурентов по уровню сложности."

 USA_turbine_innovations: "Турбинные инновации"
 USA_turbine_innovations_desc: "Американские учёные и инженеры разработали новые методы создания потока воздуха на высоких скоростях с впрыском топлива в поток для создания невероятной тяги. Благодаря этой совершенно новой реактивной технологии мы близки к разработке экстремальных самолётов, способных летать выше, дальше и быстрее, чем когда-либо прежде."

 USA_naval_asset_assessment: "Оценка военно-морских активов"
 USA_naval_asset_assessment_desc: "Поскольку Америку от любых крупных противников отделяет океан, крайне важно, чтобы она могла защищать эти океаны — как для сдерживания агрессоров, так и для обеспечения собственных действий. Хотя наши флоты и могучи, мы не должны праздно ждать, опираясь на традицию. Наш флот должен быть готов к действиям."

 USA_leadership_reorganization: "Реорганизация командования"
 USA_leadership_reorganization_desc: "Нынешний военный кабинет американского флота перегружен лишними слоями бюрократии и устаревшими методами ведения боя. Времена изменились со времён Великой войны, и это требует смены курса."

 USA_department_of_naval_systems: "Департамент военно-морских систем"
 USA_department_of_naval_systems_desc: "Отзывы моряков нередко содержат жалобы на качество выдаваемого снаряжения и несговорчивость правительства при просьбах устранить создаваемые им же проблемы. Торпеда М14 — наглядный пример: она существует по инерции и лени, а не по причине полезности и эффективности. Наш флот должен быть лучше оснащён."

 USA_cross_sector_communication: "Межсекторный обмен опытом"
 USA_cross_sector_communication_desc: "Управляя огромным флотом на нескольких различных океанах, охватывающих весь земной шар, мы имеем возможность координировать опыт и знания совершенно разных театров военных действий, чтобы лучше понимать, как максимизировать эффективность нашего флота."

 USA_invest_in_the_navy: "Инвестировать в флот"
 USA_invest_in_the_navy_desc: "Вкладывая резервы в нашу судостроительную промышленность, мы можем дать толчок расширению флота. Надеемся, что эти инвестиции станут достойным сдерживающим фактором, но в случае конфликта новые доки всё равно понадобятся."

 USA_drydock_expansion: "Расширение сухих доков"
 USA_drydock_expansion_desc: "Удвоение производственных мощностей наших сухих доков резко повысит эффективность наших флотов и поможет выставлять всё большее количество судов."

 USA_littoral_retooling: "Переоснащение прибрежной промышленности"
 USA_littoral_retooling_desc: "Хотя это дорогостоящий и трудоёмкий шаг, с новыми инструментальными станками и накопленным промышленным опытом мы можем позволить себе полностью переработать значительные секции судостроительной промышленности и создать мощности, способные справляться с гораздо большими объёмами работы."

 USA_shipping_investment: "Инвестиции в судоходство"
 USA_shipping_investment_desc: "Расширение эффективности гражданского судоходства и торгового флота обеспечит своевременную доставку нашего снаряжения и припасов в пункт назначения в надлежащем состоянии."

 USA_war_production: "Военное производство"
 USA_war_production_desc: "Пришло время обрушить титаническую мощь американской судостроительной промышленности на силы, угрожающие ей. Мощность производства американского тоннажа требует кардинального расширения."

 USA_armada_act: "Закон об армаде"
 USA_armada_act_desc: "Закон об армаде предоставляет ВМС США средства и автономию, необходимые для резкого наращивания его силы и проецирования мощи. Хотя это значительно истощит наши фонды, ясно, что это расширение совершенно необходимо для противостояния нашим врагам за рубежом."

 USA_semper_fi: "Semper Fi"
 USA_semper_fi_desc: "Старейшие военные силы Америки — морская пехота — имеют долгое наследие превосходства в бою. Посвящение большего количества ресурсов расширению их рядов и силы будет достойным уклоном."

 USA_improved_transport_models: "Улучшенные транспортные модели"
 USA_improved_transport_models_desc: "Чтобы гарантировать, что наши войска и снаряжение смогут безопасно пересечь океан и прибыть поддержанными и готовыми к бою, им нужны лучшие корабли, способные выдерживать волны и огонь."

 USA_amphibious_assaults: "Десантные операции"
 USA_amphibious_assaults_desc: "Находясь через океан от потенциальных врагов, наши войска должны быть готовы к трудным высадкам на территории противника. Их поддержат лучшее доступное снаряжение и подготовка, а также постоянно растущие ряды Корпуса морской пехоты."
 USA_amphibious_assaults_tt_add_nav_caps: "Этот фокус завершит §Y1 ветвь флота§!"

 USA_modern_crew_training: "Современная подготовка экипажей"
 USA_modern_crew_training_desc: "Качество подготовки наших моряков не может позволить себе застояться. Мы должны убедиться, что наш личный состав остаётся в наивысшей готовности к боевым действиям и плаванию — всё меньшее было бы неуважением к нашим согражданам."

 USA_combat_drills: "Масштабные боевые учения"
 USA_combat_drills_desc: "Одна из традиций флота, поддерживающих его в наивысшей готовности на протяжении всей истории, — это сосредоточенность на готовности ко всему. Мир стремительно меняется, как и возможный морской бой. Наши люди будут готовы."
 USA_mastery_bonus_combat_drills_tt: "$USA_combat_drills$"

 USA_veteran_damage_control: "Опытная аварийная служба"
 USA_veteran_damage_control_desc: "В каждом бою будут попадания — сколько бы ни было подготовки или техники. Но то, как экипаж реагирует на эти попадания, — это разница между тем, чтобы остаться в бою, доползти до порта или догореть до ватерлинии. Наши экипажи будут обучены и оснащены для первого варианта."

 USA_large_scale_exercises: "Крупномасштабные учения"
 USA_large_scale_exercises_desc: "Быть готовым к бою — значит практиковаться снова и снова. Планы боя неизбежно не будут отражать реальность, но способность составлять их на ходу помогает сосредоточиться на победе в реальности."

 USA_naval_force_exertion: "Проецирование военно-морской мощи"
 USA_naval_force_exertion_desc: "Способность наших флотов проецировать силу и обеспечивать безопасность мировых вод обеспечит безопасный проход дружественных судов через моря и эффективное развёртывание наших сил там, где они больше всего нужны."

 USA_commando_sections: "Командосные секции"
 USA_commando_sections_desc: "Интеграция командования флота высшего уровня с оперативным планированием корпуса морской пехоты позволит значительно более плавно и эффективно проводить десантные операции и поможет держать наши корабли в курсе состояния безопасности различных островных цепей и прибрежных районов."

 USA_us_naval_invention_complex: "Военно-морской изобретательский комплекс США"
 USA_us_naval_invention_complex_desc: "Наши ребята в Сан-Франциско разрабатывают революционные новые идеи по усилению нашего влияния на море. Создание специального учреждения для дальнейшего развития этих идей даст им ресурсы, необходимые для воплощения их в жизнь."

 USA_advanced_tonnage: "Передовой тоннаж"
 USA_advanced_tonnage_desc: "Исключительно мощная, современная модель корабля значительно укрепит наш флот. Выбор направления наших исследовательских усилий определит, как наши ресурсы принесут нам пользу."

 USA_fleet_modernization: "Модернизация флота"
 USA_fleet_modernization_desc: "Наш флот остаётся примерно в той же форме, что и десятилетие назад, всё ещё спроектированный для боя во время Великой войны. Наши противники строят всё более мощные военные корабли, и мы должны инвестировать в переоснащение и модернизацию нашего флота, чтобы оставаться сильными."

 USA_submarine_experimentation: "Эксперименты с подводными лодками"
 USA_submarine_experimentation_desc: "Подводные лодки по-прежнему остаются относительно неопробованным и неизощрённым инструментом флота. Раздвигая границы возможного в подводной войне, можно получить захватывающие и ценные результаты."
 USA_mastery_bonus_submarine_experimentation_tt: "$USA_submarine_experimentation$"


 USA_steel_sharks: "Стальные акулы"
 USA_steel_sharks_desc: "Главная роль нашего подводного флота — нападение на противника. Наши экипажи подводных лодок жаждут ударить по врагам до того, как те поймут, что их атакуют, — стратегия, в которую мы должны инвестировать."

 USA_the_silent_service: "Немая служба"
 USA_the_silent_service_desc: "Способность наших подводных лодок тихо проникать в воды и даже порты противника и незаметно подбираться к самым ценным его активам представляет собой стратегическую силу огромного значения. Обучение наших экипажей действовать так, чтобы максимизировать их скрытность, является ключевым."

 USA_fanged_raiders: "Клыкастые рейдеры"
 USA_fanged_raiders_desc: "Новые конструкции так называемой «флотской подводной лодки» демонстрируют способность пересечь океан и опустошить противника одним бесшумным касанием. Хотя это дорогостоящая инвестиция, важно, чтобы Америка была ведущей страной в этой новой технологии, иначе мы можем стать жертвой её в руках врага."

 USA_invisible_will: "Невидимая воля"
 USA_invisible_will_desc: "Главная роль нашего подводного флота — поддерживать наши ударные группы. Способность подводных лодок защищать регион океана снизу и передавать свои данные любому находящемуся поблизости союзнику окажется огромной помощью для наших надводных кораблей."

 USA_undersea_escorts: "Подводное эскортирование"
 USA_undersea_escorts_desc: "Наши конвои наиболее уязвимы для атак замаскированных подводных лодок противника. Однако использование наших собственных субмарин для эскортирования этих конвоев позволило бы нам противодействовать тактике врага и создавать беспокойство у вражеских моряков, неуверенных в том, действительно ли любой конвой оставлен беззащитным только потому, что никакие другие силуэты не появляются."

 USA_the_oceans_eyes: "Глаза океана"
 USA_the_oceans_eyes_desc: "Патрули подводных лодок идеально подходят для сбора разведывательных данных о передвижениях и тактике противника, и использование роящихся сетей невидимых подводных активов для наблюдения за каждым шагом врага сделает его следующий ход более очевидным."

 USA_carrier_rnd: "НИОКР авианосцев"
 USA_carrier_rnd_desc: "Хотя мы используем авианосцы уже довольно давно, мы никогда не уделяли серьёзного внимания разработке эффективных боевых доктрин для них. Работа над повышением эффективности их операций и конструкции необходима для движения вперёд."
 USA_mastery_bonus_carrier_rnd_tt: "$USA_carrier_rnd$"


 USA_new_carrier_yards: "Новые верфи для авианосцев"
 USA_new_carrier_yards_desc: "Мы построим огромные новые объекты для производства авианосцев для флота. Эти верфи позволят нам значительно расширить нашу способность проецировать морскую авиационную мощь."

 USA_naval_air_focus: "Морской авиационный уклон"
 USA_naval_air_focus_desc: "Самолёты над водой — зрелище что надо, и наши будут оснащены всем необходимым для достижения целей, эскортирования друзей и потопления врагов."

 USA_carrier_aircraft: "Палубная авиация"
 USA_carrier_aircraft_desc: "Самолёты, специально разработанные для взлёта с палубы авианосцев и снабжения ими, являются необходимостью современной морской войны. Непросто обеспечить их работу в нужных условиях при куда более жёстких ограничениях, чем обычно, но передовые и эффективные палубные самолёты окажутся решающими в максимизации силы наших авианосцев."

 USA_advanced_carriers: "Передовые авианосцы"
 USA_advanced_carriers_desc: "Авианосцы завтрашнего дня будут способны расширить досягаемость влияния и проецирования мощи Америки на каждый океан и каждый фронт. Расширенные ангарные отсеки, улучшенная логистика, лучшая подготовка и увеличенная дальность позволят нашей морской авиации проникать в самые глубокие воды противника."

 USA_pinnacle_advancement: "Вершинное совершенствование"
 USA_pinnacle_advancement_desc: "Благодаря нашим блестящим учёным и инженерам мы приступили к разработке новых конструкций передовых подводных лодок и авианосцев, которые резко увеличат наши преимущества на океане. Как обычно, дешевизны ждать не придётся."

 USA_silverstar_fleet: "Флот Серебряной звезды"
 USA_silverstar_fleet_desc: "Наши военно-морские силы будут определяться превосходством и эффективностью на воде. Благодаря мастерству и сосредоточенности флоты Америки будут господствовать на волнах и прочно занимать своё место в мире."

 USA_fleet_of_the_deep: "Флот глубин"
 USA_fleet_of_the_deep_desc: "Военно-морские силы Америки потопят её врагов, нарастая как прилив, чтобы захлестнуть любого противника. Её промышленность питает неустанный и нескончаемый поток кораблей и орудий."

 USA_airborne_operations: "Воздушно-десантные операции"
 USA_airborne_operations_desc: "С новыми и улучшенными воздушными транспортниками мы можем делать то, о чём армии мечтали всю историю: летать. Наших парней можно быстро перебросить прямо туда, где они нужны, высаживать в тылу врага и даже активно поддерживать их и держать в организованном состоянии с воздуха."

 USA_scientific_industrial_showcase: "Научно-промышленная выставка"
 USA_scientific_industrial_showcase_desc: "Инновационные отрасли Соединённых Штатов смогут быстро восстановиться, как только найдут точку опоры. А пока инвентаризация наших реальных творческих активов и воодушевление всех ими поможет разжечь этот огонь снова и укрепить его в общественном сознании."

 USA_accelerated_research_industries: "Ускоренная исследовательская промышленность"
 USA_accelerated_research_industries_desc: "Уже сейчас частные компании, предприниматели и независимые учёные и инженеры раздвигают границы науки и технологий, и по мере роста доступных ресурсов растёт и их эффективность. Нам следует дополнительно инвестировать в эти светлые умы, оставляя им пространство для роста."

 USA_support_military_contractors: "Поддержка военных подрядчиков"
 USA_support_military_contractors_desc: "Наша оборонная промышленность, как и все остальные, была жестоко ударена депрессией. Однако по мере восстановления гражданских рынков тем, кто обслуживает военные интересы, всё равно придётся ждать, пока армия снова обратится к ним. Нам нужно помочь им продержаться немного раньше, чем иначе, поскольку правительство — их единственный покупатель."

 USA_early_mic_investment: "Ранние инвестиции в ВПК"
 USA_early_mic_investment_desc: "Направление имеющихся ограниченных средств в наш военно-промышленный комплекс может быть не самым мудрым шагом, но он будет необходим, если мы намерены держать нашу армию хорошо оснащённой и современной."
 USA_early_mic_investment_tt: "Если экономика начала §Yвосстанавливаться§!, этот фокус будет §Gдешевле§!."

 USA_dynamic_lines_initiative: "Инициатива динамичных линий"
 USA_dynamic_lines_initiative_desc: "По мере изменения наших потребностей и разработок наши отрасли должны адаптироваться. Учёт этого на раннем этапе возобновления работы поможет укрепить это в дальнейшем."

 USA_address_urgent_defense_needs: "Удовлетворить срочные оборонные потребности"
 USA_address_urgent_defense_needs_desc: "В настоящее время необходима активная военная промышленность. Нам нужно иметь возможность вооружить войска в кратчайшие сроки, независимо от стоимости."
 USA_address_urgent_defense_needs_tt: "Если экономика §Yвосстанавливается§!, этот фокус будет §Gболее эффективным и менее затратным§!."

 USA_encourage_creative_approaches: "Поощрять творческие подходы"
 USA_encourage_creative_approaches_desc: "У нас работают одни из лучших умов по оснащению наших солдат, и их способность находить новые решения для проблем, с которыми мы ещё не столкнулись, является большим благом. Если мы ослабим требования и ограничения для закупаемого снаряжения, оно может оказаться куда более эффективным."

 USA_defense_hardware_symposium: "Симпозиум по оборонному оборудованию"
 USA_defense_hardware_symposium_desc: "Восстановление наших науки и промышленности предоставляет нам отличную возможность объединить гражданские и военные умы, чтобы извлечь из их взаимного творческого потенциала наилучшие идеи."

 USA_futuristic_military_assets: "Футуристические военные активы"
 USA_futuristic_military_assets_desc: "Оставаться впереди — ключ к поддержанию эффективной обороны и наступления. Современный мир движется быстро, поэтому нам придётся двигаться ещё быстрее. Мы достигнем этого, продолжая объединять каждое преимущество в каждой области."

 USA_aggressive_technology_funding: "Агрессивное финансирование технологий"
 USA_aggressive_technology_funding_desc: "Нам крайне необходимо технологическое преимущество. Ресурсы должны быть немедленно перенаправлены на эту цель."

 USA_found_darpa: "Основать DARPA"
 USA_found_darpa_desc: "Агентство перспективных исследовательских проектов Министерства обороны будет заниматься созданием оружия и систем завтрашнего дня. Оно объединит наиболее эффективных творческих людей Соединённых Штатов и будет работать над инициативами, слишком секретными, чтобы выходить на поверхность."

 USA_nuclear_research: "Ядерные исследования"
 USA_nuclear_research_desc: "Различные учёные в США выдвигали идеи о расщеплении атома — идею, прежде считавшуюся невозможной. Если это удастся сделать и если процесс удастся использовать, это может принести невероятные результаты. Каковы эти результаты... нам предстоит выяснить."

 USA_the_manhattan_project: "Манхэттенский проект"
 USA_the_manhattan_project_desc: "Манхэттенский проект, как его будут называть, станет американской программой ядерных исследований и разработок по созданию и испытанию возможной атомной бомбы. В случае успеха Соединённые Штаты Америки станут обладателями первого в мире супероружия — устройства, способного сдерживать всех противников и уничтожать любую армию. Главный приоритет — сохранить этот проект в тайне от всех."

 USA_invest_in_equipment_manufacturers: "Инвестировать в производителей снаряжения"
 USA_invest_in_equipment_manufacturers_desc: "Десятки независимых компаний вносят вклад в ресурсы и снаряжение наших вооружённых сил. Свободный рынок применим к военной промышленности так же, как и к любой другой, и если мы хотим высочайшего качества снаряжения для наших солдат, нам придётся инвестировать в это."

 USA_increase_armor_spending: "Увеличить расходы на бронетехнику"
 USA_increase_armor_spending_desc: "Танковые компании Америки ещё относительно молоды, и их техника в основном не проверена в бою. Однако обеспечение их ресурсами для обучения и роста поможет им снабдить эту страну лучшими танками."

 USA_west_coast_aircraft_armories: "Авиационные заводы Западного побережья"
 USA_west_coast_aircraft_armories_desc: "Расширение и пополнение наших многочисленных авиазаводов жизненно важно для увеличения размера и качества нашего авиационного флота."

 USA_expand_shipyards: "Расширить судоверфи"
 USA_expand_shipyards_desc: "Америка обладает способностью производить первоклассные корабли, как ни одна другая страна на планете, и мы должны воспользоваться этой невероятной силой, развив судостроительную промышленность для подготовки к тому, что впереди."

 USA_cross_disciplinary_industrial_network: "Межотраслевая промышленная сеть"
 USA_cross_disciplinary_industrial_network_desc: "Для лучшего решения проблем в одной отрасли можно использовать навыки и знания других отраслей как источник вдохновения или даже прямых ответов. Создав организационную сеть, помогающую различным компаниям из неконкурирующих отраслей делиться своим опытом, мы можем достичь этой цели."
 USA_cross_disciplinary_industrial_network_tt: "Мы получим §Y2 фабрики/дока§! за каждую ранее вложенную отрасль."
 USA_cross_disciplinary_industrial_network_tt_2: "Каждая §Yранее вложенная компания§! получит:\n  +§G1§! размер\n  Бонус к исследованиям военно-промышленных организаций: §G+10.0%§!"

 USA_capital_industrial_arsenal: "Капитальный промышленный арсенал"
 USA_capital_industrial_arsenal_desc: "Направляемый потоком военных средств в частный капитал, военно-промышленный комплекс Америки превращается в мощную силу, с которой трудно сравниться лучшим из старых держав. Силы Америки будут стоять вооружёнными и готовыми бросить вызов миру."
 USA_capital_industrial_arsenal_tt: "Мы получим §Y2 фабрики/дока§! и §Y1 гражданскую фабрику§! за каждую ранее вложенную отрасль."
 USA_capital_industrial_arsenal_tt_2: "Каждая §Yранее вложенная компания§! получит:\n  +§G1§! размер\n  Рост средств: §G+15.0%§!\n  Стоимость назначения конструкторского бюро: §G-10.0%§!"

 USA_military_industrial_complex: "Военно-промышленный комплекс"
 USA_military_industrial_complex_desc: "Для вооружения своих сил Америка приступила к созданию крупнейшего, наиболее передового и надёжного военно-промышленного комплекса в истории. Арсенал демократии полностью проснулся и готов снабжать любой конфликт, в котором будет развиваться звёздно-полосатый флаг."

 USA_ivy: "«Плющ»"
 USA_ivy_desc: "Операция «Айви Майк» станет сверхсекретным усилием по дальнейшему развитию нашего арсенала суперваружия. Это будет крайне дорогостоящим, но если нам удастся успешно использовать атомную бомбу в качестве первичного взрывчатого вещества для ещё большего ядерного заряда, разрушительный потенциал американского лезвия заострится сильнее, чем кто-либо мог представить."

 USA_advanced_physics_grants: "Гранты по передовой физике"
 USA_advanced_physics_grants_desc: "Область физики стала очень важной темой в последнее время, и светлые умы Америки идеально подходят для ответа на новейшие вопросы. Нам следует поощрять исследования в этой области."

 USA_approach_the_jet_propulsion_laboratory: "Обратиться в Лабораторию реактивного движения"
 USA_approach_the_jet_propulsion_laboratory_desc: "Основанная в 1936 году студентами Калтеха, эта группа находится на переднем крае аэронавтики сразу в нескольких областях, и её способность к инновациям хорошо доказана. Возможно, получив более щедрое финансирование и нестандартные задания, они смогут раздвинуть границы ещё дальше, чем мы можем себе представить."

 USA_supersonic_studies: "Сверхзвуковые исследования"
 USA_supersonic_studies_desc: "Новые аэродинамические трубы позволяют нашим инженерам экспериментировать со сверхзвуковым потоком воздуха и разрабатывать новые технологии в области гидро- и газодинамики. Применительно к небу мы можем увидеть инновации в технологии реактивных двигателей и аэродинамических крыльев."

 USA_in_flight_avionics: "Авиационная электроника в полёте"
 USA_in_flight_avionics_desc: "Мальчики в наших оборонных исследовательских институтах разобрались, как автономно направлять машины к целям или по курсам полёта. Используя новоразработанные бортовые авионические системы, мы можем создавать устройства, способные поражать цели с невероятной точностью."

 USA_heirs_of_prometheus: "Наследники Прометея"
 USA_heirs_of_prometheus_desc: "Невиданная человечеством мощь — такая, о которой люди никогда не мечтали, — у нас на кончиках пальцев, но способ её доставки по-прежнему остаётся логистическим кошмаром, требующим подвергать риску наших пилотов. Но... допустим, оружие массового поражения удастся установить на автономную ракету. Это было бы невероятным инженерным достижением... и непревзойдённым оружием."

 USA_washington_institute_of_modern_science: "Вашингтонский институт современной науки"
 USA_washington_institute_of_modern_science_desc: "Создание специального учреждения для встречи наших ведущих учёных поможет нам раскрыть тайны физики и мироздания в целом."

 USA_the_clean_energy_act: "Закон о чистой энергии"
 USA_the_clean_energy_act_desc: "Имея в руках плоды ядерной энергии, мы должны сделать приоритетом быструю электрификацию страны с помощью этой невероятной новой технологии. Эффективность этих электростанций резко повысит возможности нашей промышленности."

 USA_school_funding: "Финансирование школ"
 USA_school_funding_desc: "Обеспечение грамотности молодёжи и её способности функционировать в развитом промышленном обществе имеет решающее значение для воспитания следующего поколения и обеспечения дальнейшего роста и процветания в будущем."

 USA_soft_power_oriented_designs: "Разработки, ориентированные на мягкую силу"
 USA_soft_power_oriented_designs_desc: "Хотя большая пушка, стреляющая большим калибром на большее расстояние, — это всегда хорошо, ещё важнее то, не заклинивает ли она после первого же выстрела. Акцент на оружии и снаряжении, хорошо служащем нашим солдатам, важнее, чем быть на острие прогресса."

 USA_rigorous_training: "Строгая подготовка"
 USA_rigorous_training_desc: "Во время Великой войны мы брали необстрелянных бойцов и тысячами бросали их под пулемёты. Результатом стали тысячи погибших американцев, которых их семьи так и не увидели снова. Мы не будем воспринимать наши силы как должное, равно как и огромное количество людей, которых мы можем задействовать. Наши солдаты будут должным образом подготовлены к бою."

 USA_house_to_house_combat: "Уличные бои"
 USA_house_to_house_combat_desc: "Хотя тяжёлое вооружение господствует на поле боя, городская среда требует совершенно иного, куда более тактического подхода к ведению войны. Обучение солдат методично зачищать укреплённые позиции противника поможет снизить эффективность врага против наших сил."
 USA_house_to_house_combat_tt: "Включает §YУличную пехотную тактику \nПехота (городская среда)§! \n   Атака: §G+10.0%§! \n   Защита: §G+10.0%§! \n§YПехота (форт)§! \n   Атака: §G+5.0%§! \n   Защита: §G+5.0%§!"

 USA_unceasing_innovation: "Непрекращающиеся инновации"
 USA_unceasing_innovation_desc: "Оснащённые всё более сложными техникой и оборудованием, американские солдаты будут воевать как с лучшим оружием, так и с лучшей подготовкой."

 USA_the_best_of_the_best: "Лучшие из лучших"
 USA_the_best_of_the_best_desc: "Американская армия — не институт безликих людей, отправляемых на мясорубку; это профессиональная боевая сила, воплощающая наилучшие силы Америки. Она не для каждого — она для лучших."

 USA_futuristic_warfare: "Война будущего"
 USA_futuristic_warfare_desc: "Военная промышленность Америки всегда будет на шаг впереди конкурентов, обеспечивая непрерывное боевое превосходство."

 USA_freedoms_blade: "Клинок свободы"
 USA_freedoms_blade_desc: "Вооружённые силы Америки — хребет нашего образа жизни, инструмент защиты того, что нам дорого. Они будут держать рубеж по всему миру — во имя свободы. Куда отправятся её храбрые солдаты, последует вся её мощь."

 USA_plains_fighting: "Бои на открытой местности"
 USA_plains_fighting_desc: "Наши войска получат специализацию в боях на полях и в пустынях, на широких открытых полях сражений, где вся мощь нашей артиллерии может обрушиться на врагов."

 USA_close_quarters: "Ближний бой"
 USA_close_quarters_desc: "Наши враги, скорее всего, встретятся нам в районах густой растительности или укреплений. Обеспечение надлежащей подготовки наших людей для эффективных действий в таком бою будет крайне важным."

 USA_rough_terrain: "Пересечённая местность"
 USA_rough_terrain_desc: "Бои ведутся в районах, естественно или искусственно затруднённых из-за рельефа и укреплений. Хотя современный бой нередко быстр и агрессивен, Великая война также показала ценность поддержания устойчивой оборонительной линии."

 USA_raining_fire: "Дождь огня"
 USA_raining_fire_desc: "Артиллерия — королева боя, всесокрушающая сила, способная осыпать врагов огнём вне досягаемости ответного огня. Разработка более мощного тяжёлого вооружения позволит нашим войскам уничтожать укреплённые позиции противника ещё до того, как первый солдат их достигнет."

 USA_rapid_strike: "Стремительный удар"
 USA_rapid_strike_desc: "Огромное преимущество в скорости не позволяет врагам должным образом реагировать на наши ходы. Если наши удары быстрее их реакции, наша армия будет побеждать каждый раз."

 USA_north_american_waves: "Североамериканские волны"
 USA_north_american_waves_desc: "В нашем распоряжении нескончаемый кадровый резерв, способный сокрушить всех противников. Кроме того, у нас есть промышленная мощь, необходимая для оснащения каждого гражданина, если потребуется. Воспользуемся этим в наших интересах."

 USA_interservice_cooperation: "Межродовое сотрудничество"
 USA_interservice_cooperation_desc: "Хотя наземные войска, авиация и флот не так часто пересекаются, их уникальный опыт может приносить друг другу огромную пользу. Создание организованной системы межродовых атташе поможет каждому перенять опыт остальных."

 USA_mass_production: "Массовое производство"
 USA_mass_production_desc: "Америка обладает величайшей промышленной мощью в мире, и мы можем направить её в нескончаемые волны материала для нашей военной машины. Захлестнуть врагов потоком пуль — наш метод победы."

 USA_unceasing_pressure: "Неустанное давление"
 USA_unceasing_pressure_desc: "Поддержание атаки не позволяет противнику восстановиться, постоянно истощая его силы, пока он не сломится. Хотя это требует от атакующего тонкости и организованности для поддержания постоянного давления, наши солдаты смогут воспользоваться нашим безграничным снаряжением, чтобы непрерывно открывать огонь."

 USA_e_pluribus_unum: "E Pluribus Unum"
 USA_e_pluribus_unum_desc: "Американцы не боятся войны, не боятся драться и не боятся побеждать. Наш долг — сплотиться вокруг идеалов свободы везде, где она под угрозой. Американцы ринутся навстречу врагам свободы и не будут праздно сидеть за своими ружьями."

 USA_the_age_after_victory: "Эпоха после победы"
 USA_the_age_after_victory_desc: "Америка оправилась от ран и пробудилась от спячки. Теперь, когда её способности полностью сформированы и её мощь признана во всей полноте, куда она пойдёт дальше?"

 USA_the_american_dream: "Американская мечта"
 USA_the_american_dream_desc: "Инновации изобретателей и предпринимателей в этих великих американских штатах привели к качеству жизни среднего человека, какого никогда прежде не существовало в истории. Главная роль нашей экономики — повышать жизненный уровень и развивать ещё не пришедшее процветание."

 USA_the_forge_beneath_her_torch: "Кузня под её факелом"
 USA_the_forge_beneath_her_torch_desc: "Война приближается, и Америка должна быть готова. Непревзойдённая мощь Арсенала демократии разожжена и готова строить орудия разрушения, необходимые Соединённым Штатам для победы в любом конфликте и обеспечения непрерывной безопасности."

 USA_the_americas: "Америки"
 USA_the_americas_desc: "Наши отношения с соседями по Американскому континенту — важный уклон нашей внешней дипломатии, которому следует уделить особое внимание."

 USA_fulfill_manifest_destiny: "Осуществить Предначертание"
 USA_fulfill_manifest_destiny_desc: "Соединённые Штаты — страж континента, и наша воля должна простираться так, чтобы это отражать. Нашим границам незачем прекращать расширение или застывать на месте."

 USA_pacify_mexican_turmoil: "Усмирить мексиканские волнения"
 USA_pacify_mexican_turmoil_desc: "Мексика находится в непрерывном состоянии нестабильности уже несколько десятилетий, и недавняя революция не улучшила положения. Её нестабильность представляет для нас угрозу, которой немцы уже воспользовались во время Великой войны. Нам необходимо устранить эту угрозу."

 USA_preempt_a_southern_invasion: "Упредить южное вторжение"
 USA_preempt_a_southern_invasion_desc: "Противник может воспользоваться слабостью наших южных соседей для организации масштабного вторжения в страну. Мы должны убедиться, что нам не грозит угроза с Центральной Америки."

 USA_central_american_bastion: "Центральноамериканский бастион"
 USA_central_american_bastion_desc: "Район вокруг Панамского канала жизненно важен для здоровья и безопасности страны. Мы должны убедиться, что он остаётся под нашей твёрдой защитой."

 USA_dominate_south_america: "Господство в Южной Америке"
 USA_dominate_south_america_desc: "Южная Америка годами остаётся хаотичным болотом, где также процветают диктатуры. Неизвестно, присоединятся ли они к потенциальным врагам США. Более того, под нашим руководством континент мог бы стать куда более безопасным и мирным."

 USA_united_protectorate_of_the_south: "Объединённые протектораты Юга"
 USA_united_protectorate_of_the_south_desc: "Многие страны и народы, принявшие нашу защиту, теперь готовы к интеграции в более широкую американскую сферу влияния. Связав их экономику с нашей и инвестируя в их развитие, мы обеспечим выгоду для всех."
 USA_united_protectorate_of_the_south_tt: "Каждый §YЮжный подданный§!, которого мы имеем, будет превращён в §Yинтегрированного марионетку§! с дополнительным национальным духом."

 USA_southern_states: "Южные штаты"
 USA_southern_states_desc: "Южная половина Западного полушария теперь более безопасна, чем когда-либо прежде. Народы там не так уж сильно отличаются от нас, и со временем они могут полностью интегрироваться и ассимилироваться в американскую культуру. Начнём этот процесс, официально приветствовав наши новейшие территории в союзе, чтобы начать этот долгий путь."
 USA_southern_states_tt: "Каждая §Yюжная марионетка§!, которую мы имеем, будет §Yаннексирована§!."

 USA_bribe_the_canadian_government: "Подкупить канадское правительство"
 USA_bribe_the_canadian_government_desc: "Территории коридора сами по себе не очень ценны, поэтому, возможно, мы можем просто предложить справедливый обмен товаров за них. Конечно, для обхода политической стороны вопроса нам придётся фактически подкупить канадское правительство, что будет очень дорого, но мы справимся."
 USA_bribe_the_canadian_government_tt: " §YЭффекты в случае согласия:§!"

 USA_secure_the_canadian_corridor: "Обезопасить Канадский коридор"
 USA_secure_the_canadian_corridor_desc: "Коридор, разделяющий две части нашей страны, слишком ценен для переговоров. Если необходимо, мы должны нанести удар по нему. Надеемся, что наши соседи на севере поймут и образумятся, прежде чем произойдёт что-то нехорошее."

 USA_bargain_for_canada: "Торговаться за Канаду"
 USA_bargain_for_canada_desc: "[CAN.GetNameDefCap] и [ROOT.GetNameDefCap] всегда имели тесные связи. Учитывая наши взаимные интересы и стратегическую роль Канады в защите всего севера континента, было бы логично попытаться добиться их союза. Мы обратимся к их хозяевам с предложением, от которого они наверняка не смогут отказаться."
 USA_bargain_for_canada_tt: " §YЭффекты в случае согласия:§!"
 USA_bargain_for_canada_tt_2: "Если наша покупка будет принята, мы, §Gвозможно§!, сможем §Yприсоединить Канаду как коренную территорию§!"

 USA_conquer_the_north: "Покорить Север"
 USA_conquer_the_north_desc: "Наш северный фланг слишком широк и уязвим, чтобы доверять его оборону другим. Мы должны действовать сейчас, иначе в будущем столкнёмся с угрозой. Север должен быть нашим."
 USA_conquer_the_north_tt: " Если они откажутся и мы пойдём на §Yвойну§!:"
 USA_conquer_the_north_tt_2: "Если мы возьмём Канаду силой или под принуждением, мы §Rможем не суметь§! §Yприсоединить Канаду как коренную территорию§!"

 USA_welcome_the_canadians: "Приветствовать канадцев"
 USA_welcome_the_canadians_desc: "Теперь, когда наши северные соседи стали частью нашей сферы влияния, мы можем протянуть руки и начать должным образом принимать их в состав союза! Добро пожаловать в [USA.GetNameDefCap]!"

 USA_bring_in_the_Caribbean: "Присоединить Карибский бассейн"
 USA_bring_in_the_Caribbean_desc: "Острова на юге представляют собой как возможности, так и опасности. Их берега — идеальное расположение портов, откуда могли бы расширяться наши флот и торговля, либо откуда враги могли бы устраивать свои собственные действия против нас. Кроме того, их народы подпадают под нашу сферу защиты в этом регионе, а в нынешнем состоянии мы не в силах защитить их столько, сколько может потребоваться. Мы должны действовать."

 USA_treaty_of_london: "Лондонский договор"
 USA_treaty_of_london_desc: "На протяжении многих лет США выступали стражем Америки, защищая её от европейского влияния. Согласно доктрине Монро, в наши прерогативы входит недопущение Европы в колониальные дела здесь. Однако небольшие пережитки европейского влияния остаются. Пришло время окончательно удалить Старый Свет из Нового."

 USA_shield_the_panama_canal: "Защитить Панамский канал"
 USA_shield_the_panama_canal_desc: "Панамский канал — одна из важнейших инфраструктурных единиц в мире, и контроль над ним и поддержание его работоспособности жизненно важно для деятельности нашей торговли и флота. Мы обратимся к [PAN.GetAdjective] правительству с просьбой о более активном присутствии вокруг него. Идеально, если и сама Панама могла бы присоединиться к помощи."
 USA_shield_the_panama_canal_tt: "§YЭффекты в случае согласия§!:\n  Построить §Yбункеры§! и §Yбереговые бункеры§! вокруг канала"

 USA_revisit_the_monroe_doctrine: "Пересмотреть доктрину Монро"
 USA_revisit_the_monroe_doctrine_desc: "США взяли на себя обязанность охранять Америку от европейского вмешательства. Однако для обеспечения независимости Нового Света ещё много предстоит сделать."

 USA_demand_peace_guarantees: "Потребовать гарантий мира"
 USA_demand_peace_guarantees_desc: "Великие державы Старого Света угрожают нашей безопасности непрерывными войнами и завоеваниями. Мы предпочли бы, чтобы Америка оставалась в безопасности от их агрессии. Чтобы дипломатически обеспечить этот мир, мы получим гарантии от наших соседей и крупных стран Европы."

 USA_defence_of_the_hemisphere: "Оборона полушария"
 USA_defence_of_the_hemisphere_desc: "Главный приоритет — обеспечить безопасность наших земель и вод, не позволяя иностранным захватчикам и враждебным державам вступить на территорию этого полушария."

 USA_pacific_atlantic_shield: "Тихоокеанско-Атлантический щит"
 USA_pacific_atlantic_shield_desc: "Любой путь к нашему континенту пролегает через два соседних океана. Для защиты наших берегов мы построим силу, способную остановить любых захватчиков ещё до того, как они увидят наши берега."

 USA_american_alliance: "Американский альянс"
 USA_american_alliance_desc: "Для обеспечения безопасности континента мы будем координировать действия с нашими континентальными соседями и создадим единый фронт для отражения любых нападающих."

 USA_american_customs_union: "Американский таможенный союз"
 USA_american_customs_union_desc: "Для защиты континента от военных угроз, а также от угроз более гражданского характера, представляется необходимым вовлечься в коммерческую деятельность наших союзников. Мы должны гарантировать, что окружающие нас страны не падут жертвой иностранного вмешательства и сохранят стабильность."

 USA_intercontinental_vigilance_pact: "Межконтинентальный пакт бдительности"
 USA_intercontinental_vigilance_pact_desc: "Для защиты Нового Света от иностранных угроз мы должны тесно сотрудничать с нашими соседями в Северной и Южной Америке, чтобы обеспечить совместно обороняемую береговую линию и воздушное пространство. Сотрудничество будет нашим методом дипломатических действий."

 USA_empower_the_guardians: "Укрепить стражей"
 USA_empower_the_guardians_desc: "Для обеспечения эффективной обороны против заморских врагов потребуется тесное военное сотрудничество. С этой целью армия США будет тесно работать с другими американскими союзниками для поддержки всех имеющихся боеспособных вооружённых сил."

 USA_pursue_american_prosperity: "Добиваться американского процветания"
 USA_pursue_american_prosperity_desc: "Как крупнейшая экономика мира и мощнейшая военная держава региона, мы обязаны помогать нуждающимся. Нас окружают соседи, немало пострадавшие в последние десятилетия — по воле случая, по собственной вине или даже вследствие наших собственных действий. Мы будем стремиться их поддерживать."

 USA_bolster_liberty_in_the_south: "Укрепить свободу на Юге"
 USA_bolster_liberty_in_the_south_desc: "Мы обязаны нести свет демократии нашим соседям и помогать разжигать идеалы независимости и свободы."

 USA_support_the_great_white_north: "Поддержать Великий белый север"
 USA_support_the_great_white_north_desc: "У нас уже много связей с северными соседями. Поделимся частью нашего процветания с ними и поможем им оправиться от Великой депрессии."

 USA_purchase_the_western_gap: "Купить Западный разрыв"
 USA_purchase_the_western_gap_desc: "Канадский коридор разделяет континентальные Соединённые Штаты и её Аляскинские территории. Учитывая относительную ценность этой земли для нас и относительную её незаселённость для канадцев, возможно, нам удастся заключить с ними сделку."

 USA_the_crowns_helmet: "Шлем короны"
 USA_the_crowns_helmet_desc: "Канада была хорошим союзником многие годы, и её присутствие помогает предотвращать атаки с севера. Нам следует работать с ней для усиления наших военных возможностей и улучшения способности защищать Северную Америку."

 USA_purchase_colonial_holdovers: "Купить колониальные пережитки"
 USA_purchase_colonial_holdovers_desc: "Старые европейские державы по-прежнему удерживают позиции в Америке, несмотря на то что их постепенно вытесняли из региона на протяжении лет. Теперь у нас есть возможность завершить их уход, но мы не сделаем этого болезненно. Напротив, мы заплатим золотом за эти колониальные пережитки."
 USA_purchase_colonial_holdovers_tt: "§YЭффекты в случае согласия§!:"

 USA_support_mexico: "Поддержать Мексику"
 USA_support_mexico_desc: "Мексика годами испытывает трудности из-за всевозможных проблем. Последние экономические неурядицы тоже не помогли. Мы могли бы предложить поддержку для её роста."

 USA_finance_mexican_renewal: "Финансировать обновление Мексики"
 USA_finance_mexican_renewal_desc: "Напрямую инвестируя в развитие и рост Мексики, мы можем поднять страну из её исторического застоя и помочь ей полностью восстановиться, а затем расти дальше. В этом процессе мы также можем направлять её нашими идеалами и вводить в нашу сферу влияния."

 USA_invest_in_mesoamerica: "Инвестировать в Мезоамерику"
 USA_invest_in_mesoamerica_desc: "Многие небольшие страны к югу от нас особо не преуспели в последние годы. Хотя мы сами недавно пострадали, мы можем направить часть ресурсов нашего восстановления на укрепление этих стран в их собственных интересах и, возможно, в наших — в будущем."

 USA_south_american_industrialization: "Южноамериканская индустриализация"
 USA_south_american_industrialization_desc: "Мы можем инвестировать в Южную Америку, чтобы продвигать американские идеалы. Строя инфраструктуру и гражданские предприятия, мы будем распространять добрую волю, одновременно создавая будущее богатство для наших южных соседей."

 USA_promote_trade: "Содействовать торговле"
 USA_promote_trade_desc: "Вновь открывая нашу экономику миру, мы можем отдать приоритет торговле с нашими соседями в полушарии."

 USA_the_miami_conference: "Майамская конференция"
 USA_the_miami_conference_desc: "Мы проведём грандиозную конференцию в Майами, чтобы собрать наших друзей по полушарию. Цель вполне проста: поощрять сотрудничество и дружелюбие."

 USA_bolster_the_continent: "Укрепить континент"
 USA_bolster_the_continent_desc: "Сотрудничество между странами Нового Света позволит укрепить общую оборону и безопасность. Координация этих действий и соглашений оптимизирует обмен снаряжением."

 USA_new_world_market_system: "Система рынка Нового Света"
 USA_new_world_market_system_desc: "Учитывая многочисленные общие интересы между нами и нашими континентальными соседями, стоило бы объединить наших ближайших друзей для участия в общей экономической сфере, которая напрямую связала бы наши различные рынки и народы."

 USA_continental_citadel: "Континентальная цитадель"
 USA_continental_citadel_desc: "Очевидно, что иностранная агрессия представляет наибольшую угрозу безопасности и процветанию Нового Света. Оборонительный военный союз между нами и нашими союзными соседями создаст прочную основу для защиты от любой такой угрозы."

 USA_european_diplomacy: "Европейская дипломатия"
 USA_european_diplomacy_desc: "Европа в последнее время переживала бурные времена. С момента Великой войны Европа многое пережила, и наш собственный народ не забыл травму, в которую мы были втянуты. Теперь, однако, наконец-то настало время вернуться. Каким образом? Посмотрим..."

 USA_write_war_plan_black: "Разработать Военный план «Чёрный»"
 USA_write_war_plan_black_desc: "[GER.GetName] уже на протяжении десятилетий является крупным источником конфликтов на континенте, и Великая война не стала исключением. Мало шансов, что Германия снова не вызовет конфликт, и мы должны быть готовы к этой неизбежности заблаговременно."

 USA_write_war_plan_red: "Разработать Военный план «Красный»"
 USA_write_war_plan_red_desc: "Хотя мы видели их союзником в последнее время, [ENG.GetNameDefCap] по-прежнему представляет потенциальную серьёзную угрозу для Америки. Если она вернётся к старым взглядам, под угрозой окажется всё полушарие. Пусть сейчас они дружелюбны, мы будем готовы к такому конфликту на всякий случай."

 USA_write_war_plan_white: "Разработать Военный план «Белый»"
 USA_write_war_plan_white_desc: "Мало какие страны или регионы оказывали такое постоянное давление или вызывали такое беспокойство, как Россия. Возвышение Советов и нынешняя форма [SOV.GetNameDefCap] не благоприятствуют процветанию в будущем. Однако это страшный противник для борьбы. В этом случае мы должны быть готовы к победе."

 USA_write_war_plan_silver: "Разработать Военный план «Серебряный»"
 USA_write_war_plan_silver_desc: "[ITA.GetName] не достигла особых успехов в последнее время, и время само по себе было к ней нелюбезно. В последние годы она стремилась снова протянуть руку и попытаться воспользоваться теми, кто слабее её, и её агрессия очевидна. Италия остаётся угрозой, с которой, возможно, придётся иметь дело со временем."

 USA_write_war_plan_gold: "Разработать Военный план «Золотой»"
 USA_write_war_plan_gold_desc: "[FRA.GetName] боролась под гнётом Великой войны и депрессии, и политические потрясения постоянно сотрясают её изнутри. Её будущее никогда не бывает определённым, и прецеденты указывают на то, что она ещё может стать агрессивной по отношению к нам. Война с Францией не будет вестись беспечно."

 USA_victory_act: "Закон о победе\n(Европейский театр)"
 USA_victory_act_desc: "Войны сейчас ведутся в таком масштабе и темпе, что требуют полного вовлечения — это Тотальные войны. Америка не может стоять в стороне и пытаться просто играть по правилам вчерашних войн. Хотя мы будем следить за тем, чтобы самим не превратиться в чудовищ, мы должны быть готовы делать всё необходимое для уничтожения тех чудовищ, что осаждают нас."

 USA_write_war_plan_chrome: "Разработать Военный план «Хром»"
 USA_write_war_plan_chrome_desc: "Европа в целом оставила неприятный привкус. Нестабильность, войны и экстремальные идеологии там в порядке вещей, но если нам придётся вновь вступить в конфликт на континенте, нам следует заблаговременно разработать набор планов."

 USA_the_far_eastern_realm: "Дальневосточный регион"
 USA_the_far_eastern_realm_desc: "Восточная Азия привлекает интерес Америки уже десятилетиями, и даже несмотря на короткую историю США им всё же удалось оказать значительное влияние на регион. Теперь напряжённость стремительно нарастает и угрозы маячат на горизонте. Важность нашей дипломатической позиции здесь не стоит недооценивать."

 USA_write_war_plan_orange: "Разработать Военный план «Оранжевый»"
 USA_write_war_plan_orange_desc: "[JAP.GetNameDefCap] выросла быстро и стремительно, однако её последние действия и потрясения привели к крайне нестабильному и агрессивному положению. Останутся ли японцы миролюбивыми или станут враждебными — нам нужно быть готовыми."

 USA_victory_act_asia: "Закон о победе\n(Азиатский театр)"
 USA_victory_act_asia_desc: "Азия требует масштаба войны, который трудно осмыслить, — несметные орды солдат, местность, сама по себе враждебная войскам, и впечатляющие расстояния. Если мы намерены вести крупную войну через Тихий океан, мы не должны сдерживаться — каждый доступный нам инструмент должен быть задействован."

 USA_write_war_plan_yellow: "Разработать Военный план «Жёлтый»"
 USA_write_war_plan_yellow_desc: "Китай находится в состоянии гражданской войны между империалистическими фракциями, не скрывающими намерения расширяться и вернуться к господству. Хотя война с ними маловероятна, они могут представлять серьёзную угрозу, на которую нам придётся незамедлительно ответить."

 USA_write_war_plan_crimson: "Разработать Военный план «Малиновый»"
 USA_write_war_plan_crimson_desc: "Мы долго наслаждались долгим и плодотворным миром с канадцами на севере, однако протяжённость нашей границы с ними и угроза, которую может представлять северное вторжение, оставляют горькую возможность. В случае конфликта с нашими соседями нас не должны застать врасплох."

 USA_victory_act_americas: "Закон о победе\n(Американский театр)"
 USA_victory_act_americas_desc: "Война на наших берегах требует, чтобы мы наносили удары так сильно, как только можем. Наша родина оказалась под угрозой со стороны соседей. Ничто, кроме абсолютной победы, недопустимо, и мы должны сделать всё в наших силах для её достижения."
 USA_victory_act_americas_tt: "Наши §YВоенные планы§! станут чрезвычайно мощными."

 USA_write_war_plan_green: "Разработать Военный план «Зелёный»"
 USA_write_war_plan_green_desc: "Непрекращающиеся потрясения на юге давно являются потенциальной проблемой. Даже совсем недавно, во время Великой войны, Мексику едва не удалось втянуть в войну против США. Схватка с ней может быть не за горами."

 USA_write_war_plan_turquoise: "Разработать Военный план «Бирюзовый»"
 USA_write_war_plan_turquoise_desc: "Регион, соединяющий Северную и Южную Америку, имеет существенное стратегическое значение как для нас, так и для всего остального мира. Любая угроза региону в целом или Панамскому каналу в частности должна быть встречена своевременно, иначе мы рискуем утратить контроль и безопасность."

 USA_write_war_plan_jade: "Разработать Военный план «Нефритовый»"
 USA_write_war_plan_jade_desc: "Болезненное колониальное прошлое по-прежнему терзает культуру Бразилии. К счастью, какие бы проблемы ни возникали из этого со временем, они практически не затронули Америку. Однако если США окажутся вовлечены в войну в Амазонии, нам нужно быть готовы к ней."

 USA_write_war_plan_mint: "Разработать Военный план «Мятный»"
 USA_write_war_plan_mint_desc: "В Аргентине многое развилось, однако существует потенциал для возникновения агрессивных сил там. Война на юге континента была бы трудной логистической задачей для нас, но задачей, с которой мы всё же должны справиться."

 USA_write_war_plan_teal: "Разработать Военный план «Морской волны»"
 USA_write_war_plan_teal_desc: "Драматическое побережье Чили сделало бы войну там интересным делом. Полный план был бы очень полезен для подготовки к любому такому событию."

 USA_write_war_plan_vermilion: "Разработать Военный план «Алый»"
 USA_write_war_plan_vermilion_desc: "Китайские коммунисты не скрывали, что намерены сделать, придя к власти. Война или конфликт с ними вполне возможны, и в этом случае мы будем готовы."

 USA_write_war_plan_lime: "Разработать Военный план «Лаймовый»"
 USA_write_war_plan_lime_desc: "Извечный враг всего мира, монголы вполне могут снова подняться и стать крупной угрозой."

 USA_write_war_plan_scarlet_garnet: "Разработать Военный план «Алмазно-гранатовый»"
 USA_write_war_plan_scarlet_garnet_desc: "Нападение на Австралию и Новую Зеландию было бы затруднено, хотя война с ними маловероятна в большинстве сценариев. Если по какой-либо причине война всё же придёт, следует набросать общий план нападения."

 USA_write_war_plan_ruby: "Разработать Военный план «Рубиновый»"
 USA_write_war_plan_ruby_desc: "Есть вероятность, что мы окажемся вовлечены в войну на Индийском субконтиненте. Если это произойдёт, она может очень быстро эскалироваться, поэтому нам нужно быть в состоянии прибыть и должным образом сражаться в кратчайшие сроки."

 USA_guided_munitions: "Управляемые боеприпасы"
 USA_guided_munitions_desc: "Используя новоразработанные ракетные технологии, мы теперь можем оснастить наши самолёты боеприпасами, способными наводиться на цель. Движущиеся корабли и труднодостижимые укрепления больше не останутся нетронутыми."

 USA_write_war_plan_onyx: "Разработать Военный план «Оникс»"
 USA_write_war_plan_onyx_desc: "Америки находятся в нашей сфере защиты, а значит, мы должны быть готовы к вмешательству в любые нестабильные режимы на этих континентах. В этом случае у нас будет целый арсенал детальных боевых планов, подготовленных для любого возникающего конфликта."

 USA_write_war_plan_diamond: "Разработать Военный план «Алмазный»"
 USA_write_war_plan_diamond_desc: "Какой бы ни была наша позиция по отношению к западу, нам нужно быть готовы и способны действовать военным образом в Тихом океане в случае необходимости. Военный план «Алмазный» охватит наши коллективные усилия по противодействию более мелким территориям региона."

 USA_enforce_continental_security: "Обеспечить континентальную безопасность"
 USA_enforce_continental_security_desc: "Мы обязаны поддерживать стабильность и безопасность в Америках. Если какая-либо страна в этом полушарии возьмётся быть деструктивной или опасной для континента, наш долг — вмешаться."
 USA_enforce_continental_security_unlock_tt: "Открывает §Yrешения§! по §Yобеспечению континентальной безопасности§! против деструктивных стран Америки."

 USA_build_up_pacific_territories: "Развить тихоокеанские территории"
 USA_build_up_pacific_territories_desc: "Различные острова, которыми мы владеем в Тихом океане, представляют наш плацдарм за морем. Было бы небрежно с нашей стороны не развивать эти территории и не обеспечивать наш надёжный контроль над ними."

 USA_reinforce_pearl_harbor: "Укрепить Пёрл-Харбор"
 USA_reinforce_pearl_harbor_desc: "Ядро нашего тихоокеанского проецирования мощи, безопасность и эффективность нашей военно-морской базы Пёрл-Харбор на Гавайях необходимо поддерживать. Добавление укреплений и улучшенных базовых систем к Пёрл-Харбору должно помочь нашим возможностям проецирования силы."
 USA_reinforce_pearl_harbor_tt: "Если §Yрадар§! исследован, радарная станция может быть добавлена на Гавайи."

 USA_maintain_the_calm_waves: "Поддерживать спокойствие на волнах"
 USA_maintain_the_calm_waves_desc: "Несмотря на растущую напряжённость, мы можем использовать наше военно-морское превосходство в Тихом океане для поддержания мирного статус-кво. Сосредоточив нашу внешнюю политику на снижении агрессии и обеспечении международных торговых путей, мы должны быть в состоянии сохранить нейтралитет."

 USA_mutual_investment_in_east_asia: "Взаимные инвестиции в Восточную Азию"
 USA_mutual_investment_in_east_asia_desc: "Наши отрасли многое выиграют от инвестиций в рынки по другую сторону Тихого океана, и эти рынки многое выиграют от возобновления работы американской экономики. Откроем масштабные взаимные инвестиции с дружественными странами за морем!"
 USA_mutual_investment_in_east_asia_tt: "Открывает §YРешения§! для взаимных инвестиций в дружественные восточноазиатские страны \n§YПо завершении§!: \n §YСоединённые Штаты§!:\n  Фактор потребительских товаров: §Y-5.0%§!\n §YСтрана-реципиент§!: \n  Получить §G1§! заграничную гражданскую фабрику.\n  Политическая власть: §G+50§! \n  Получить стабильность: §G+3.0%§!"

 USA_extend_american_hegemony: "Расширить американскую гегемонию"
 USA_extend_american_hegemony_desc: "У Соединённых Штатов есть интересы на Западе, и в наших интересах преследовать их. Америка является величайшей державой в Тихоокеанском регионе и должна распространить свою гегемонию на него."

 USA_acquire_pacific_territories: "Приобрести тихоокеанские территории"
 USA_acquire_pacific_territories_desc: "Распространяя наше влияние через волны, мы можем расширить сферу власти, которую мы проецируем через Тихий океан. Для закрепления этого роста силы мы расширим территориальные владения, на которые претендуем в океане. Эти земли присоединятся к нам под звёздами и полосами — добровольно или силой."

 USA_cooperative_outreach: "Сотрудническое взаимодействие"
 USA_cooperative_outreach_desc: "Нам следует применять политику сотрудничества и дипломатического партнёрства к странам Азии и Тихоокеанского региона. Таким образом, мы поможем укрепить наши стратегические позиции там и будем содействовать общему миру и безопасности в регионе."
 USA_cooperative_outreach_tt: "§YВосточные страны§! с сильным положительным отношением к нам получат §Yбонус§!."

 USA_expeditionary_industrialization: "Экспедиционная индустриализация"
 USA_expeditionary_industrialization_desc: "Сотрудничая с крупными компаниями Восточной Азии, мы можем расширить наши промышленные рынки и внести свою экспертизу в неосвоенные регионы. Нам есть что выиграть, работая с другими странами в их специализированных отраслях."

 USA_spread_democracy_in_asia: "Распространить демократию в Азии"
 USA_spread_democracy_in_asia_desc: "Наша миссия — делиться нашими идеалами и образом жизни с народами и нациями Восточной Азии, показывая им преимущества демократии и свободы. Экспорт этих идеалов должен помочь склонить эти народы на нашу сторону."

 USA_liberty_over_east_asia: "Свобода над Восточной Азией"
 USA_liberty_over_east_asia_desc: "Восточная Азия, Океания, Тихий океан — этот участок земного шара отставал от западной цивилизации на протяжении столетий и сейчас оказался в серьёзной опасности огромных потрясений. Европа слишком далека и неспокойна, поэтому долг защищать эти регионы ложится на нас."
 USA_liberty_over_east_asia_tt: "Отправляет §Rультиматум§! азиатским и океанским странам с требованием сюзеренитета, а также сюзеренам существующих марионеток в регионе о передаче сюзеренитета."


 USA_outback_offensive: "Наступление в Аутбэке"
 USA_outback_offensive_desc: "Высадившись в Австралии, нам нужно сосредоточить боевые усилия на стремительном броске через открытые равнины аутбэка. Скорость и манёвр будут нашим методом победы."

 USA_oceanic_dominance: "Океаническое господство"
 USA_oceanic_dominance_desc: "Закрепив плацдармы по всей Азии и Океании, мы направим ресурсы на подавление местного сопротивления и укрепление местной поддержки. Чем скорее мы завоюем расположение жителей этих регионов, тем скорее сможем безопасно двинуться дальше и захватить больше территорий."

 USA_conquer_the_subcontinent: "Покорить субконтинент"
 USA_conquer_the_subcontinent_desc: "Огромные просторы Индийского субконтинента требуют военных операций, намного превосходящих, пожалуй, всё, с чем Америка когда-либо сталкивалась. Плотность населения региона и стойкость его защитников потребуют от нас полной сосредоточенности."

 USA_the_vast_frontier: "Бескрайний фронтир"
 USA_the_vast_frontier_desc: "Земли Срединного царства славятся своей обширностью, и её народ многочислен. В войне против различных государств Китая нам нужно обеспечить, чтобы наши войска везде получали необходимое снабжение. Вместе с тем мы усилим наши усилия, подорвав китайские линии снабжения — давая нам окно для использования этой слабости."

 USA_slay_the_dragon: "Убить дракона"
 USA_slay_the_dragon_desc: "В войне с Китаем мы определили Срединное царство как экзистенциальную угрозу Соединённым Штатам и их союзникам и приняли решение стремиться к победе любой ценой. Огненное дыхание зверя должно быть погашено; дракон должен быть повержен."

 USA_operation_downfall: "Операция «Падение»"
 USA_operation_downfall_desc: "Наша война с Японией достигла критической точки. Их стойкость привела к использованию камикадзе против нас — дурной знак для полного вторжения на их родные острова. Тем не менее такое вторжение остаётся нашим единственным оставшимся курсом. Возможно, в тени кроется какой-то другой вариант, но пока мы должны приступить к осуществлению нашей операции «Падение» — вторжению в Японию."

 USA_island_hopping: "Прыжки по островам"
 USA_island_hopping_desc: "В войне с Японией для наступления на их промышленные и военные центры потребуется ряд островных плацдармов. Однако сопротивление, которое мы встретим, потребует жестокой кампании по методичному продвижению через атоллы Тихого океана. Нам нужно готовиться к кампании прыжков по островам."

 USA_quench_the_flames: "Погасить пламя"
 USA_quench_the_flames_desc: "Мы не можем позволить китайским коммунистам сохранять свои силы в Азии. Они представляют собой крупно дестабилизирующий фактор в регионе и, если их не сдержать, могут стать серьёзной угрозой Соединённым Штатам. Война с ними потребует умелого умения преодолевать горы Северного Китая."

 USA_steppe_warfare: "Война в степи"
 USA_steppe_warfare_desc: "Давние мастера степной войны, монголы эффективно сражаются конными отрядами и преуспевают в стремительной тактике. Мы встретим их на поле боя, превзойдя их в скорости."

 USA_america_of_the_orient: "Америка Востока"
 USA_america_of_the_orient_desc: "С момента открытия в 1860-х годах Япония показала себя грозной страной, способной перейти от средневекового общества и экономики к мировой державе с мощной армией. Они создали современную нацию из ничего, кроме воли, за ничтожно малое время. В их обществе мы видим отражение схожего динамизма, свойственного нашему собственному, и мы можем помочь дать новый импульс этой энергии."

 USA_cross_pacific_alliance: "Трансстихоокеанский альянс"
 USA_cross_pacific_alliance_desc: "Японский народ имеет много общего с американским, и по мере сближения наших двух наций и совпадения наших целей перед нами открывается любопытная перспектива: трансстихоокеанский альянс между странами. Страна восходящего солнца и страна смелых могут вступить в совместный пакт для обеспечения наших взаимных интересов и защиты всего Тихоокеанского региона."

 USA_anglo_eastern_investment: "Англо-восточные инвестиции"
 USA_anglo_eastern_investment_desc: "Вкладывая капитал в территории Британской империи на нашем западе, мы можем укрепить наши отношения с самой Великобританией и ускорить развитие наших друзей за Тихим океаном."

 USA_south_eastern_naval_actions: "Юго-восточные морские действия"
 USA_south_eastern_naval_actions_desc: "Для защиты наших стратегических позиций в Тихоокеанском регионе мы будем тесно сотрудничать с нашими союзниками там в разработке совместных военно-морских стратегий, готовя нас к любым возможным конфликтам."
 USA_south_eastern_naval_actions_tt: "Юго-восточные морские действия"

 USA_protect_the_pacific: "Защитить Тихий океан"
 USA_protect_the_pacific_desc: "Острова, усеивающие Тихий океан, уязвимы для плохих актёров, желающих распространить своё влияние через океан. С нарастающей напряжённостью со стороны крупных держав по всему миру крайне важно, чтобы мы приняли меры для обеспечения суверенитета Тихого океана от враждебных наций."

 USA_arteries_of_the_world: "Артерии мира"
 USA_arteries_of_the_world_desc: "Через воды Тихого океана проходят невероятные объёмы торговли и ресурсов. Если какой-либо из этих торговых путей будет перекрыт, как в других частях мира, мы пострадаем страшно. Мы не можем допустить такого сценария — мы должны инвестировать в эскортирование торговых судов и создание флотилий, которые будут сдерживать любые угрозы."

 USA_the_flying_tigers: "«Летающие тигры»"
 USA_the_flying_tigers_desc: "Пока Китай находится в осаде, различные группы по всей Америке собирают средства в помощь, и другие желают вмешаться лично. Одной из таких групп является крыло пилотов, желающих помочь китайцам в воздухе против их агрессоров. Хотя непосредственная отправка войск выходила бы за рамки нашей деятельности, мы могли бы, однако, позволить группе добровольцев пробраться через Тихий океан в Китай..."

 USA_the_firestar_project: "Проект «Фаэр»"
 USA_the_firestar_project_desc: "Есть предложение укрепить военную мощь Китая, чтобы позволить ему противостоять агрессивным державам, угрожающим его завоеванием. Этот так называемый «Проект „Фаэр"» станет нагрузкой на наши ресурсы, но у нас есть ресурсы в избытке. Кроме того, эта материальная поддержка Китая даст нам рычаги влияния для существенного изменения их политики и идеалов, дополнительно сближая их с нами."

 USA_guerilla_support: "Поддержка партизан"
 USA_guerilla_support_desc: "Мы можем помочь китайским коммунистам в их оборонительной войне, направляя им как материальную помощь для военных действий, так и военных советников и добровольцев, способных помочь им отбросить нападавших."

 USA_strategic_foothold: "Стратегический плацдарм"
 USA_strategic_foothold_desc: "КНР представляет собой выгодную позицию, откуда мы могли бы расположить наши силы. Конечно, в рамках этого тесного сотрудничества мы также откроем им доступ к нашим активам, чтобы мы могли извлечь пользу из совместных действий против наших общих врагов."

 USA_a_red_free_orient: "Восток без красных"
 USA_a_red_free_orient_desc: "[PRC.GetNameDefCap] нельзя позволить продолжать существование. Её существование стало экзистенциальной угрозой миру, и мы не должны медлить с её уничтожением."

 USA_trade_in_inner_asia: "Торговля во Внутренней Азии"
 USA_trade_in_inner_asia_desc: "С возвышением Советского Союза Монголия страдала и практически не имела роста или процветания. Тем не менее монголы остаются сильным народом и представляют хорошего кандидата для открытия торговли и дипломатических миссий. Мы не можем действовать настолько официально, насколько хотели бы, из-за нынешнего геополитического ландшафта, но всё же можем найти некоторые возможности."
 USA_mastery_bonus_trade_in_inner_asia_tt: "$USA_trade_in_inner_asia$"


 USA_alliance_with_a_united_china: "Договор «Дракон и Орёл»"
 USA_alliance_with_a_united_china_desc: "По мере того как наши связи с Китаем становятся всё теснее, мы разработали смелый и амбициозный договор, призванный закрепить наш контроль над Тихим океаном и достигнуть вглубь Азии. Этот договор, который мы называем «Договором „Дракон и Орёл"», введёт китайцев в нашу сферу влияния и установит между нашими двумя нациями военный и экономический альянс, способный изменить глобальный баланс сил."
 USA_alliance_with_a_united_china_tt: "Мы попытаемся сформировать §Yальянс§! с одной из китайских держав."

 USA_sino_american_order: "Китайско-американский порядок"
 USA_sino_american_order_desc: "Сформировав альянс, воспользуемся открывшимися возможностями. Мощь партнёрства Китая и Америки ощутит весь мир."

 USA_reopen_trade: "Возобновить торговлю"
 USA_reopen_trade_desc: "Пришло время напрямую обратиться к нашим старым торговым партнёрам в Европе, теперь, когда наша собственная экономика вновь открыта для торговли."

 USA_extend_american_charity: "Распространить американскую благотворительность"
 USA_extend_american_charity_desc: "Поскольку американская благотворительность вновь течёт свободно, мы можем особо сосредоточиться на том, чтобы дать американским гражданам возможность распространить свои благотворительные усилия на наших старых торговых партнёров по другую сторону Атлантики."

 USA_american_influence: "Американское влияние"
 USA_american_influence_desc: "Америка старалась держаться подальше от Европы со времён Великой войны и начала Великой депрессии, но в наше отсутствие экстремальные идеологии охватили Европу. Независимо от пути, который мы выберем сейчас, в наших интересах возобновить влияние на континент и попытаться склонить ситуацию в нашу пользу."
 USA_american_influence_tt: "Наши §Yидеалы§! распространятся на европейские страны, к которым мы относимся положительно."

 USA_pick_a_side: "Выбрать сторону"
 USA_pick_a_side_desc: "Конфликт, разразившийся в Испании, поднимает много вопросов о том, что нам следует делать в ответ. Есть голоса, выступающие за каждую из сторон, каждый по своим причинам. Возможно, нам следует вмешаться..."
 USA_pick_a_side_tt: "Если §Yвоенная поддержка§! и §Yодобрение Конгресса§! §Rслишком низки§!, это будет §Rполитически накладно§!."

 USA_cross_the_pond: "Пересечь пруд"
 USA_cross_the_pond_desc: "Мы старались держаться подальше от худших аспектов европейских дел уже многие годы, но, оглядывая земли по ту сторону Атлантики, мы вынуждены признать, что, хотим мы того или нет, нас ещё могут втянуть в очередной пожар. Мы не можем быть застигнуты врасплох."

 USA_prepare_for_another_great_war: "Подготовиться к ещё одной Великой войне"
 USA_prepare_for_another_great_war_desc: "Снова война.\nМир не удался.\nАмерика должна ответить."

 USA_avoid_conflict: "Избежать конфликта"
 USA_avoid_conflict_desc: "Великая война слишком сильно нас покалечила, чтобы рисковать очередным вовлечением в европейский пожар. Разговоров о мире может быть недостаточно — нам нужно действовать, чтобы держаться подальше от любого потенциального конфликта, который может назревать."

 USA_great_power_attaches: "Атташе великих держав"
 USA_great_power_attaches_desc: "Мы отстали от великих европейских держав в военном опыте и разработках. Нам следует обратиться к нашим контактам в других крупных армиях, чтобы привести наши доктрины в соответствие с нашими коллегами."

 USA_fund_resistance_abroad: "Финансировать сопротивление за рубежом"
 USA_fund_resistance_abroad_desc: "Есть различные народы, которые угнетаются за рубежом прямо сейчас, и мы, возможно, можем что-то сделать с этим. Мы можем использовать наши специальные службы как для поддержки тех групп, которым нужна помощь, так и для подрыва тех государств, чьи экспансионистские политики не согласуются с нами."

 USA_seek_regime_change: "Добиться смены режима"
 USA_seek_regime_change_desc: "Используя все имеющиеся уловки, мы можем работать над дестабилизацией враждебных игроков изнутри, нанося удары по сердцу их администраций без единого выстрела с нашей стороны."
 USA_seek_regime_change_tt: "Остальной мир §Rнеодобрительно отнесётся§! к этому политическому курсу."

 USA_the_old_world: "Старый Свет"
 USA_the_old_world_desc: "Полтора века назад мы провозгласили независимость от Старого Света и создали здесь, в Новом Свете, величайшую нацию на Земле. Теперь Старый Свет пребывает в ужасном и ослабленном состоянии. Возможно, пришло время солнцу зайти над старыми державами и пришло время Соединённым Штатам Америки взять бразды правления Европой."

 USA_fell_the_warring_giants: "Свалить воюющих гигантов"
 USA_fell_the_warring_giants_desc: "Старые державы снова берутся за своё — очередная грандиозная война, которая сотрёт их ещё на пару лет. Если не из собственного корыстного интереса, то ради спасения самих европейцев мы должны рассмотреть вмешательство. Каждый аргумент говорит в пользу вступления."
 USA_fell_the_warring_giants_tt: "Мы получим §Yповоды для войны§! против воюющих европейских держав"

 USA_subvert_foreign_adversaries: "Подорвать иностранных противников"
 USA_subvert_foreign_adversaries_desc: "Наши спецслужбы уже выявили различные точки проникновения во враждебных государствах, которые мы могли бы использовать для срыва их действий. Эти скрытые удары останутся вне поля зрения общественности и могут быть нанесены без риска вызвать её гнев. Почему бы нам не подставить ногу нашим врагам?"

 USA_promote_peace: "Пропагандировать мир"
 USA_promote_peace_desc: "В интересах предотвращения очередной Великой войны Конгресс разработал Декларацию непрерывного мира — прокламацию, гласящую, что страна не будет применять силу для достижения своих целей и не будет разжигать конфликты. Мы привлечём дипломатов европейских стран к подписанию декларации в интересах содействия миру и дружелюбию на континенте."

 USA_embody_peace: "Воплощать мир"
 USA_embody_peace_desc: "Подписывая Декларацию непрерывного мира Конгресса, мы делаем публичное заявление для страны, что эта администрация не будет преследовать никакого рода конфликтов, что мы намерены держаться в стороне от войн, которые нас не касаются, что мы не рвёмся терять ещё людей на другом континенте без ясной цели."

 USA_embargo_hostile_actors: "Ввести эмбарго против враждебных игроков"
 USA_embargo_hostile_actors_desc: "Мы не потерпим новых войн в Европе. Нам нужно дистанцироваться от этих агрессивных игроков. Мы не позволим нашим ресурсам финансировать иностранные войны."
 USA_embargo_hostile_actors_tt: "Мы будем §Yвводить эмбарго§! против враждебных игроков и получать §Yполитическую власть§! за каждое эмбарго."

 USA_international_red_cross: "Международный Красный Крест"
 USA_international_red_cross_desc: "Крайне важно убедиться, что, несмотря на жестокость войны, отдельные солдаты сохраняют свои права. Мы выделим значительное финансирование Красному Кресту, чтобы гарантировать, что солдаты из любой страны могут получить медицинскую помощь."
 USA_international_red_cross_tt: "Европейские страны, §Yнаходящиеся в состоянии войны§!, получат поддержку МКК."

 USA_maintain_neutrality: "Сохранить нейтралитет"
 USA_maintain_neutrality_desc: "Мы не можем участвовать в насилии за рубежом — мы цивилизованнее этого. Пусть Европа ведёт свои войны, но мы не будем их частью."

 USA_enforce_the_naval_treaties: "Добиться соблюдения военно-морских договоров"
 USA_enforce_the_naval_treaties_desc: "Лондонские военно-морские договоры — это защитный механизм, созданный для предотвращения очередной военно-морской гонки вооружений, способной привести к ещё одной Великой войне. Те нации, которые открыто игнорируют их, обнажают свои замыслы, раскрывая скрытую враждебность. Мы должны обеспечить соблюдение договоров."
 USA_enforce_the_naval_treaties_tt: "Открывает §Yrешения§! для обеспечения соблюдения военно-морских договоров другими нациями"

 USA_withdraw_from_the_naval_treaties: "Выйти из военно-морских договоров"
 USA_withdraw_from_the_naval_treaties_desc: "Имея океаны с обеих сторон континента, Америка полностью зависит от сильного флота для сохранения какого-либо влияния в мире. Хотя это благородное дело, мы не можем позволить себе ограничивать наши возможности или нашу безопасность, произвольно сдерживая нашу военно-морскую мощь."

 USA_punish_aggression: "Наказать агрессию"
 USA_punish_aggression_desc: "Нашим экспедиционным силам будет разрешено и они будут оснащены для вмешательства в иностранные войны с целью непосредственной остановки агрессоров."

 USA_operation_unthinkable: "Операция «Немыслимое»"
 USA_operation_unthinkable_desc: "Давно назревало... нам нужно уничтожить [SOV.GetNameDefCap]. Они представляют неотвратимую угрозу, и мы должны разобраться с ними до того, как они выйдут из-под полного контроля. Масштаб этой войны будет огромным, но мы должны приложить всё необходимое для победы."

 USA_eastern_infiltration: "Восточная инфильтрация"
 USA_eastern_infiltration_desc: "Независимо от того, чего мы добьёмся в дипломатии, мы не можем по-настоящему доверять [SOV.GetAdjective]ам на слово. Нам нужны люди внутри, способные донести до нас полную правду."

 USA_overwhelming_material_support: "Подавляющая материальная поддержка"
 USA_overwhelming_material_support_desc: "[SOV.GetNameDefCap] окружает страшными врагами и, вероятно, не сможет выдержать надвигающийся натиск. Мы готовы оказать им значительную материальную поддержку, чтобы обеспечить их суверенитет."

 USA_flank_the_maginot: "Обойти Линию Мажино с фланга"
 USA_flank_the_maginot_desc: "Чтобы захватить центральные районы Франции, нам нужно быть готовы взять её прибрежные порты и иметь возможность наносить удары эффективно с воздуха."

 USA_challenge_the_empire: "Бросить вызов Империи"
 USA_challenge_the_empire_desc: "Пришло время положить конец Британской империи. Она слишком долго простирала своё влияние по всему миру, но теперь её тирания более не может быть терпима."

 USA_shatter_the_crown: "Разбить корону"
 USA_shatter_the_crown_desc: "Нам нужно довести эту войну до завершающей стадии. Солнце должно зайти над Британской империей."

 USA_destroy_the_reich: "Уничтожить Рейх"
 USA_destroy_the_reich_desc: "[GER.GetNameDefCap] доказал, что является страшной угрозой для Америки. Нам нужно действовать быстро и стремительно, чтобы убрать их руководство от власти и положить конец угрозе, которую представляют немцы."

 USA_duel_of_the_eagles: "Дуэль орлов"
 USA_duel_of_the_eagles_desc: "Для [GER.GetNameDefCap] нет места в мире завтрашнего дня. Мы потратим каждую каплю крови и каждую стреляную гильзу, необходимые для уничтожения чёрного орла."

 USA_strike_the_soft_underbelly: "Ударить по мягкому подбрюшью"
 USA_strike_the_soft_underbelly_desc: "Будь то плацдарм или сдерживание, нас привлекает захват Апеннинского полуострова. Это усилие должно быть сосредоточенным и эффективным, если мы хотим удержать любые захваченные рубежи. Если мы преуспеем, над Римом больше не будет развеваться [ITA.GetAdjective] флаг."

 USA_join_the_allies: "Вступить в союзники"
 USA_join_the_allies_desc: "По мере того как мир становится всё более недоверчивым и хаотичным, наличие хороших союзников становится необходимостью. Мы подадим заявку на вступление в военный альянс [ENG.GetNameDefCap] и её союзников, чтобы и защитить наше положение, и способствовать поддержанию глобальной стабильности."

 USA_approach_russia: "Наладить связи с Россией"
 USA_approach_russia_desc: "Чтобы расширить наши дипломатические связи с [SOV.GetNameDefCap], нам сначала нужно напрямую обратиться к ним и начать непосредственно выстраивать эти связи."

 USA_no_more_american_blood: "Больше ни капли американской крови"
 USA_no_more_american_blood_desc: "Нам надоел хаос и разрушение остального мира. Мы не будем в это вмешиваться. Их войны — не наши войны. Мы отказываемся терять больше американской крови. Мы отказываемся хоронить больше наших сыновей."
 USA_no_more_american_blood_tt: "§RСША обязуются§! §Yсоблюдать пацифизм§!"

 USA_arising_opportunities: "Возникающие возможности"
 USA_arising_opportunities_desc: "Хотя мы и не вмешиваемся за рубежом напрямую... возможно, нам это и не нужно. Возможно, есть больше пользы в роли чисто периферийной державы, которая выбирает, в какие части конфликта ей интересно вмешиваться. Наши спецслужбы особенно заинтересованы в том, что здесь возможно."

 USA_pledge_for_the_axis: "Присоединиться к Оси"
 USA_pledge_for_the_axis_desc: "Порядок, возглавляемый [GER.GetName], гораздо стабильнее и таит в себе куда больше потенциала, чем те, кто им противостоит. Нам было бы выгоднее встать на сторону немцев, чем какого-либо иного международного порядка."

 USA_new_order: "Новый мировой порядок"
 USA_new_order_desc: "Объединив усилия Германии и Америки, весь мир мог бы принадлежать нам. Зачем так ограничивать наши амбиции? Мы можем вместе бросить вызов старым державам и создать собственный новый мировой порядок."

 USA_a_world_split_in_two: "Мир, разделённый надвое"
 USA_a_world_split_in_two_desc: "Новый мировой порядок наступает, но нашим немецким союзникам, похоже, не особо интересно делиться им с нами, как и нам — сохранять его с ними. До тех пор пока мы в итоге не разойдёмся, нам нужно вырваться вперёд и захватить всё, что можно, при поддержке немцев, прежде чем они сделают это сами."
 USA_a_world_split_in_two_tt: "Если §Y[USA.GetNameDefCap]§! и §Y[GER.GetNameDefCap]§! не находятся в одной фракции, §Y[GER.GetNameDefCap]§! §Rобъявит войну§! §Y[USA.GetNameDefCap]§!."

 USA_foreign_policy: "Внешняя политика"
 USA_foreign_policy_desc: "Независимо от наших внутренних позиций, мы не существуем в вакууме. Нам нужно решить, как взаимодействовать с остальным миром."
 USA_foreign_policy_tt: "Начало §Yполитического пути§! сократит время выполнения этого фокуса на §G35 дней§!."

 USA_unheilige_politik: "Нечестивая политика"
 USA_unheilige_politik_desc: "По мере того как армии наших двух стран всё теснее сближаются, перед нами открывается возможность: полный альянс с [SOV.GetNameDefCap]. Это решение не следует принимать легкомысленно и, возможно, не стоит и афишировать его... но это игра политики, и мы намерены победить."

 USA_homeland_defense_emergency_act_focus: "Закон о чрезвычайной обороне Родины"
 USA_homeland_defense_emergency_act_focus_desc: "Берега Америки взломаны; враг ступил на нашу землю. Мы не примем такое положение дел и не позволим тем, кто против нас, вести войну против нашего народа у него дома. Они будут отброшены любыми средствами. Американский народ поднимется, чтобы выгнать их!\nДом храбрых останется землёй свободных!"

 USA_the_central_intelligence_agency: "Центральное разведывательное управление"
 USA_the_central_intelligence_agency_desc: "Очевидно, что мы должны взять на себя более активную роль в закулисной деятельности, которая так многое определяет в этом мире. Нынешние инвестиции в наши спецслужбы не годятся; нам нужны совершенно новые усилия в этой роли. Немедленно УСС будет преобразовано в ЦРУ, которому будет поручено проводить волю Америки за рубежом — под прикрытием."
 USA_the_central_intelligence_agency_tt: "§YУСС§! будет реорганизовано в §YЦРУ§!"

 USA_libertys_last_refuge: "Последнее прибежище свободы"
 USA_libertys_last_refuge_desc: "Америка по-прежнему стоит как сияющий город на холме... но теперь кажется, что это единственный оставшийся сияющий город. Те силы, что погасили демократию за рубежом, ещё не закончили, и мы не питаем никаких иллюзий насчёт той судьбы, которую они желают нам уготовить. Наше существование под угрозой.\nМы стоим как последняя надежда свободы в мире.\nМы не должны пасть... мы должны стоять твёрдо."

 USA_militia_readiness_act: "Закон о готовности ополчения"
 USA_militia_readiness_act_desc: "По мере того как мировая температура становится всё горячее, американским гражданам следует быть готовыми к любому надвигающемуся урагану. Добровольческие оборонные организации следует проверить, чтобы убедиться, что они будут активом в плохом сценарии, а не препятствием."

 USA_federal_funding_for_citizen_defense_groups: "Федеральное финансирование групп гражданской обороны"
 USA_federal_funding_for_citizen_defense_groups_desc: "Чтобы лучше подготовить наш народ к потенциальной войне у нас дома, мы обеспечим финансирование существующих оборонных групп, чтобы помочь им поддерживать высокие стандарты и готовность."

 USA_public_training_programs: "Публичные программы подготовки"
 USA_public_training_programs_desc: "В случае конфликта необходимо, чтобы каждый способный к бою знал, как правильно сражаться. Кроме того, чем больше людей умеют держать ружьё, тем легче будет их призвать при необходимости."

 USA_expand_the_national_guard: "Расширить Национальную гвардию"
 USA_expand_the_national_guard_desc: "Для защиты нашей страны мы сосредоточимся на повышении качества нашей Национальной гвардии и увеличении её финансирования и численности."

 USA_interstate_highways: "Межштатные шоссе"
 USA_interstate_highways_desc: "Америка — огромный континент, и любой конфликт, достигший её, потребует способности быстро перемещаться по ней. Создание сети межштатных шоссе облегчит логистическую гибкость, необходимую для обеспечения этих возможностей, и улучшит общее качество нашей инфраструктуры."

 USA_national_security_initiative: "Инициатива национальной безопасности"
 USA_national_security_initiative_desc: "Угрозы за рубежом требуют, чтобы мы приняли превентивные меры для обеспечения территориальной целостности Соединённых Штатов. Мы будем готовы к худшему, если оно наступит, и надеемся, что наша готовность послужит сдерживающим фактором от любых нападений на нас."

 USA_coordinate_militia_defenses: "Координировать оборону ополчения"
 USA_coordinate_militia_defenses_desc: "Миллионы американских граждан откликнулись на призыв к оружию и уже делают всё возможное, чтобы мобилизоваться против захватчиков, однако в настоящее время они действуют независимо и без общей слаженности. Нам нужно сейчас обратиться к нашему народу и начать организовывать их коллективный дух в единую волю."
 USA_coordinate_militia_defenses_tt: "Открывает §Yrешения§! для создания §Yгрупп ополчения§! по всей стране.\nВ зависимости от того, насколько мы §Yготовы§!, изначально появится ряд дивизий.\nЧем лучше §Yготовность§!, тем эффективнее мы сможем формировать §Yополчение§!."

 USA_establish_strongholds_in_the_rockies: "Создать опорные пункты в Скалистых горах"
 USA_establish_strongholds_in_the_rockies_desc: "Природный горный рельеф, которым мы пользуемся на Западе, послужит нам стеной, отрезающей продвижение врагов. Мы не намерены позволять им заходить так далеко, но если какой-то выступ достигнет Скалистых гор, он разобьётся о нашу стойкость."
 USA_establish_strongholds_in_the_rockies_tt_1: "Если специальный проект §Yсети опорных пунктов§! завершён, построить §Yсети опорных пунктов§! по всем Скалистым горам."
 USA_establish_strongholds_in_the_rockies_tt_2: "Если специальный проект §Yрадар§! завершён, построить §Yрадарные станции§! по всем Скалистым горам."
 USA_establish_strongholds_in_the_rockies_tt_3: "§YНью-Мексико, Колорадо, Вайоминг, Айдахо, Монтана§!:\nДобавить §Y$USA_establish_strongholds_in_the_rockies_modifier$§!, дающий:\nСкорость вражеских дивизий: §G-15.00%§!\nМестное снабжение: §G+10%§!\nМестное снабжение врага: §G-10%§!\nАтриция дивизий: §G-10.0%§!\nСкорость строительства §YBаз снабжения§!: §G+20.00%§!\nСкорость строительства §Yжелезных дорог§!: §G+20.00%§!\nСкорость строительства §Yсухопутных фортов§!: §G+20.00%§!"

 USA_the_mississippi_bastions: "Бастионы Миссисипи"
 USA_the_mississippi_bastions_desc: "По всей длине Миссисипи мы возведём мощные укрепления, которые остановят любого врага. Артерия Среднего Запада станет артерией республики."
 USA_the_mississippi_bastions_tt_1: "Если специальный проект §Yсети опорных пунктов§! завершён, построить §Yсети опорных пунктов§! вдоль Миссисипи."
 USA_the_mississippi_bastions_tt_2: "Если специальный проект §Yрадар§! завершён, построить §Yрадарные станции§! вдоль Миссисипи."
 USA_the_mississippi_bastions_tt_3: "§YЛуизиана, Арканзас, Миссури, Айова, Миннесота§!:\nДобавить §Y$USA_the_mississippi_bastions_modifier$§!, дающий:\nСкорость вражеских дивизий: §G-15.00%§!\nМестное снабжение: §G+10%§!\nМестное снабжение врага: §G-10%§!\nАтриция дивизий: §G-10.0%§!\nСкорость строительства §YBаз снабжения§!: §G+20.00%§!\nСкорость строительства §Yжелезных дорог§!: §G+20.00%§!\nСкорость строительства §Yсухопутных фортов§!: §G+20.00%§!\n"

 USA_evacuate_civilians_and_industry: "Эвакуировать гражданское население и промышленность"
 USA_evacuate_civilians_and_industry_desc: "Нам нужно срочно эвакуировать всё, что возможно, из тех регионов, которым больше всего грозит осада или захват противником. Мы не можем медлить или бездействовать — нам нужно действовать, пока ещё можем."
 USA_evacuate_civilians_and_industry_tt: "Открывает §Yrешения§! по §Yэвакуации гражданского населения и промышленности§! из штатов.\nЧем больше штатов §Yэвакуировано§!, тем больше §Rвоздействие§! на страну."

 USA_launch_the_counteroffensive: "Начать контрнаступление"
 USA_launch_the_counteroffensive_desc: "Настало время нанести ответный удар и отвоевать наши земли и захваченных людей. Наш тыл надёжен, а перед нами мы уничтожим всё, что встанет на пути."

 USA_spirit_of_defiance: "Дух непокорности"
 USA_spirit_of_defiance_desc: "Мы не какая-то захолустная страна, созревшая для завоевания — наша земля свободных и дом храбрых! Пусть за каждым кустком травы стоит ружьё, под каждой крышей — клинок, и в каждом сердце и уме — смелость, бросающая вызов обстоятельствам. Наш враг поймёт, насколько невозможна поставленная им задача."
 USA_spirit_of_defiance_tt: "Открывает §Yrешения§! для §Yсаботажа§! врага на нашей территории и §Yнанесения ударов§! по нему."

 USA_regional_strategic_commands: "Региональные стратегические командования"
 USA_regional_strategic_commands_desc: "Для лучшей защиты нашей обширной Родины и создания непреодолимых препятствий для нападающих мы создадим региональные стратегические командования, способные осуществлять тесную поддержку и координацию местных оборонительных операций и открывать возможности для решительных контрударов. Каждое командование станет оплотом для нашего руководства и источником убежища для раненых солдат и мирных жителей."
 USA_regional_strategic_commands_tt_0: "Открывает §Yrешения§! по созданию §YЦентров регионального стратегического командования§! по всей стране, обеспечивающих бонусы нашим войскам в данном районе."
 USA_regional_strategic_commands_tt: "Добавить §Y$USA_regional_strategic_command_modifier$§!, дающий:\nМестное снабжение: §G+5%§!\nАтриция дивизий: §G-5.0%§!\nСкорость строительства §YBаз снабжения§!: §G+5.00%§!\nСкорость строительства §Yжелезных дорог§!: §G+5.00%§!\nСкорость строительства §Yсухопутных фортов§!: §G+5.00%§!"
 USA_regional_strategic_commands_tt_california:       "§Y[378.GetName], [379.GetName]§!:"
 USA_regional_strategic_commands_tt_cascades:         "§Y[385.GetName], [386.GetName]§!:"
 USA_regional_strategic_commands_tt_northern_rockies: "§Y[387.GetName], [388.GetName], [381.GetName]§!:"
 USA_regional_strategic_commands_tt_southern_rockies: "§Y[380.GetName], [382.GetName], [377.GetName], [376.GetName]§!:"
 USA_regional_strategic_commands_tt_central_usa:      "§Y[389.GetName], [391.GetName], [390.GetName], [384.GetName], [392.GetName], [373.GetName], [383.GetName]§!:"
 USA_regional_strategic_commands_tt_south_west:       "§Y[375.GetName], [374.GetName]§!:"
 USA_regional_strategic_commands_tt_gulf_coast:       "§Y[372.GetName], [371.GetName], [370.GetName], [367.GetName], [365.GetName], [366.GetName]§!:"
 USA_regional_strategic_commands_tt_east_coast:       "§Y[368.GetName], [369.GetName], [816.GetName], [364.GetName], [363.GetName], [362.GetName], [361.GetName], [360.GetName], [359.GetName]§!:"
 USA_regional_strategic_commands_tt_great_lakes:      "§Y[394.GetName], [395.GetName], [261.GetName], [393.GetName], [396.GetName]§!:"
 USA_regional_strategic_commands_tt_new_england:      "§Y[358.GetName], [357.GetName]§!:"
 USA_regional_strategic_commands_cost_tt: "£command_power §Y[?USA_regional_strategic_commands_command_power_cost]§! £pol_power §Y[?USA_regional_strategic_commands_political_power_cost]§!"
 USA_regional_strategic_commands_cost_tt_blocked: "£command_power §R[?USA_regional_strategic_commands_command_power_cost]§! £pol_power §R[?USA_regional_strategic_commands_political_power_cost]§!"
 USA_regional_strategic_commands_center_tt: "Создаёт §YУкреплённый командный центр§! в штате."

 USA_america_the_proud: "Гордая Америка"
 USA_america_the_proud_desc: "В 11-й час мы держимся. Мы не отступим, не падём, не потерпим поражения. Мы выгоним захватчиков в море и разобьём их. Демократия устоит!"
 USA_america_the_proud_tt: "Если нам не удастся выбить врага, мы начнём нести §Rштрафы§!."

 USA_political_shift: "Политический сдвиг"
 USA_political_shift_desc: "Недавние потрясения в политической жизни ведут к странным и необычным политическим линиям, стремящимся к демократии иными путями."
 USA_political_shift_tt: "§YВремя§! выполнения этого фокуса может быть §Gсокращено§! в зависимости от первоначального выбора пути."

 USA_roosevelt_stays: "Рузвельт остаётся"
 USA_roosevelt_stays_desc: "ФДР пользуется поддержкой американского народа, и его лояльное правительство и мощное руководство ведут нас вперёд."

 USA_alf_landons_government: "Правительство Алфа Лэндона"
 USA_alf_landons_government_desc: "Алф Лэндон обеспечил поддержку Америки, и его политика и руководство выведут Америку из упадка в новую светлую эру."

 USA_asymmetric_operations: "Асимметричные операции"
 USA_asymmetric_operations_desc: "Наша разведка должна специализироваться на закулисной работе в других странах, формируя общественное мнение в соответствии с нашими взглядами. Мы можем использовать нашу мощь и богатство для демонстрации наших ценностей на поверхности, а УСС — для их продвижения под ней."

 USA_counter_espionage: "Контрразведка"
 USA_counter_espionage_desc: "Нашей стране угрожают иностранные агенты. Мы убедимся, что враг не сможет узнать ничего полезного."

 USA_trade_policy: "Торговая политика"
 USA_trade_policy_desc: "Мы можем резко повысить эффективность и координацию наших торговых отношений, устанавливая стандарты нашей торговой политики."
 USA_trade_policy_tt: "§YВремя§! выполнения этого фокуса может быть §Gсокращено§! фокусом §Y$USA_trade_policy$§!."

 USA_encourage_domestic_trade: "Поощрять внутреннюю торговлю"
 USA_encourage_domestic_trade_desc: "По мере восстановления экономики американцы смогут всё чаще заниматься межштатной торговлей. Это дополнительно улучшит темпы восстановления и поможет вернуться к прежнему росту."

 USA_grow_export_market: "Развивать экспортный рынок"
 USA_grow_export_market_desc: "Нам следует уделить особое внимание увеличению товаров, которые мы можем продавать за рубеж, и обогащению американских отраслей."

 USA_subsidize_imports: "Субсидировать импорт"
 USA_subsidize_imports_desc: "Для того чтобы ввозить нужные нам материалы и товары, мы обеспечим каждому американцу возможность приобретать лучшее, что предлагает остальной мир."

 USA_tax_imports: "Обложить импорт пошлиной"
 USA_tax_imports_desc: "По сути, нам нужна самодостаточность, и мы должны стараться направлять как можно больший рост и торговлю во внутреннее русло. Что касается того, что мы всё же ввозим, мы должны максимизировать его ценность для нас."

 USA_boost_imports: "Стимулировать импорт"
 USA_boost_imports_desc: "Америка не единственный источник материального богатства в мире, и, развивая собственное богатство, мы должны быть открыты для помощи от других."

 USA_emphasize_trade_leverage: "Акцентировать торговые рычаги"
 USA_emphasize_trade_leverage_desc: "Наш акцент должен быть на получении рычагов влияния над странами, с которыми мы ведём дела."

 USA_emphasize_trade_security: "Акцентировать торговую безопасность"
 USA_emphasize_trade_security_desc: "Наш акцент должен быть на том, чтобы наша экономика не могла быть поставлена под угрозу действиями иностранных игроков."

 USA_emphasize_trade_growth: "Акцентировать торговый рост"
 USA_emphasize_trade_growth_desc: "Наш акцент должен быть на использовании внешней торговли для максимизации внутреннего роста."

 USA_prioritize_state_trade_authority: "Приоритет торговых полномочий штатов"
 USA_prioritize_state_trade_authority_desc: "По сути, торговые полномочия должны принадлежать самим штатам. Именно из их локальных экономик черпает силу вся страна в целом."

 USA_prioritize_market_trade_authority: "Приоритет торговых полномочий рынка"
 USA_prioritize_market_trade_authority_desc: "По сути, торговые полномочия должны принадлежать самому рынку. Поток товаров и обмен ценностями — слишком масштабный процесс, чтобы им управляли единые организованные структуры."

 USA_prioritize_federal_trade_authority: "Приоритет торговых полномочий федерации"
 USA_prioritize_federal_trade_authority_desc: "По сути, торговые полномочия должны принадлежать федеральному правительству. Именно на национальном уровне США ведут дела с другими странами, и именно на национальном уровне необходимо обеспечивать и поддерживать наши интересы."

 USA_expand_resource_production: "Расширить добычу ресурсов"
 USA_expand_resource_production_desc: "Америка полна огромными запасами ещё не освоенных и не открытых ресурсов, готовых обогатить наш народ и мир. Нам следует сделать всё возможное для инвестирования в наш базовый ресурсный рынок. Это создаст прочную базу для роста наших передовых отраслей."

 USA_develop_higher_quality_products: "Разрабатывать продукты более высокого качества"
 USA_develop_higher_quality_products_desc: "Одно из лучших качеств американской экономики — производство высококачественного оборудования. Нам нужно оживить наши отрасли прецизионной механики, чтобы поддержать этот стандарт."

 USA_formalize_arms_trading: "Формализовать торговлю оружием"
 USA_formalize_arms_trading_desc: "Закрепив наше присутствие на рынке, мы теперь можем полностью направить наши отрасли на продажу вооружений странам, нуждающимся в средствах обороны."

 USA_international_industrial_tutelage: "Международное промышленное наставничество"
 USA_international_industrial_tutelage_desc: "Экспертиза Америки в массовой промышленности и производстве ставит её в отличное положение для помощи другим странам, не развившим свои отрасли до такой же степени. Почему бы не помочь им тоже расти? Это стало бы очень популярным шагом."
 USA_international_industrial_tutelage_tt: "Открывает §Yrешения§! для развития и роста §Yпромышленности§! других стран, в свою очередь повышая общественное одобрение правительства."

 USA_department_of_territorial_integrity: "Департамент территориальной целостности"
 USA_department_of_territorial_integrity_desc: "ДТЦ будет осуществлять надзор за нашим кругом действий в отношении того, как мы управляем землями, которые попадают в наше владение. Это крайне важная функция — мы стремимся поддерживать мир и свободу, но должны оставаться бдительными, чтобы не подвергать риску собственных людей."

 USA_focus_on_civil_administration: "Сосредоточиться на гражданском управлении"
 USA_focus_on_civil_administration_desc: "Мы обязаны улучшать и защищать подконтрольные нам территории по всему миру, независимо от того, как мы получили над ними контроль. Мы должны убедиться, что правильно разрабатываем любую политику оккупации — с целью соблюдения наших ценностей и неприкосновенности тех, кем мы управляем."

 USA_apple_pie_diplomacy: "Дипломатия яблочного пирога"
 USA_apple_pie_diplomacy_desc: "Имея дело с иностранными землями, мы воплощаем наши американские ценности и распространяем их везде, куда бы ни пришли. Мы завоюем сердца и умы наших врагов и противников так же просто, как угощая их вкусным яблочным пирогом!"
 USA_apple_pie_diplomacy_tt: "Открывает закон об оккупации §Y$apple_pie_occupation$§!."

 USA_reconstruction_efforts: "Усилия по восстановлению"
 USA_reconstruction_efforts_desc: "Мы оккупируем территорию, разорённую конфликтом. Наш долг — помочь жителям и как можно скорее и как можно лучше восстановить их уклад жизни."

 USA_foreign_development_projects: "Иностранные проекты развития"
 USA_foreign_development_projects_desc: "Производство снаряжения, строительство инфраструктуры и создание безопасной среды на иностранной территории — это совершенно иная задача по сравнению с внутренними регионами. Для разработки и координации строительства наших подконтрольных территорий с целью обеспечения порядка и эффективности будет создана Международная девелоперская компания."
 USA_foreign_development_projects_tt: "Открывает промышленный концерн §Y$international_development_company$§!."

 USA_focus_on_maintaining_security: "Сосредоточиться на поддержании безопасности"
 USA_focus_on_maintaining_security_desc: "Наш первый приоритет при управлении оккупированными землями — обеспечить защиту американских граждан, союзников и интересов там. Как только они будут в безопасности, мы сможем заняться поддержкой местного населения."

 USA_industrial_continuity: "Промышленная преемственность"
 USA_industrial_continuity_desc: "Важно, чтобы регионы, которые мы берём под контроль, поддерживали уровень производительности. Нет смысла позволять промышленности наших подконтрольных земель простаивать."
 USA_industrial_continuity_tt: "Открывает закон об оккупации §Y$continuity_occupation$§!."

 USA_support_occupation_police_forces: "Поддержать полицию оккупации"
 USA_support_occupation_police_forces_desc: "Наши оккупационные войска и полиция постоянно находятся под угрозой со стороны экстремистов и радикалов. Мы вложим средства в оснащение нашего зарубежного правопорядка инструментами и финансированием, необходимыми для поддержания порядка."

 USA_spread_american_ideals: "Распространять американские идеалы"
 USA_spread_american_ideals_desc: "Мы воплотим священные для нас идеалы и будем продвигать их везде и при любой возможности. Если мы сделаем это правильно, все остальные увидят, что плоды нашего труда связаны с истинами, которые мы исповедуем."
 USA_spread_american_ideals_tt: "§GУлучшает§! закон об оккупации §Y$apple_pie_occupation$§!.\n§GУлучшает§! промышленный концерн §Y$international_development_company$§!."

 USA_establish_regional_administrations: "Создать региональные администрации"
 USA_establish_regional_administrations_desc: "Мы будем управлять нашими зарубежными владениями с ориентацией на эффективность и надлежащее управление, обеспечивая жителей там, защищая наши собственные интересы и в конечном счёте принося пользу Соединённым Штатам Америки."
 USA_establish_regional_administrations_tt: "§GУлучшает§! закон об оккупации §Y$continuity_occupation$§!.\n§GУлучшает§! промышленный концерн §Y$international_development_company$§!."

 USA_advanced_decryption_department: "Взлом кодов"
 USA_advanced_decryption_department_desc: "Теперь, когда в нашем распоряжении физические устройства, способные вычислять огромное количество алгебраических уравнений за ничтожно малое время по сравнению с тем, что это занимало раньше, мы можем разрабатывать новые методы взлома шифров, позволяющие проникать даже сквозь самые сложные коды и докапываться до секретов наших противников."

 USA_restore_the_kadets: "Восстановить кадетов"
 USA_restore_the_kadets_desc: "После поражения [SOV.GetNameDefCap] нашей миссией станет восстановление их кратковременного демократического движения и возвращение его к власти. Синяя Россия будет господствовать в степях."

 USA_cold_world: "Холодный мир"
 USA_cold_world_desc: "Объединив наши огромные силы, Америка и [SOV.GetNameDefCap] готовы взять под контроль весь мир. Наступает новая эра, в которой глобус подпадает под господство двух его величайших держав, объединённых целью — пусть и не идеологией."

 USA_extensive_support_operations: "Масштабные операции поддержки"
 USA_extensive_support_operations_desc: "Мы снабдим [SOV.GetNameDefCap] потоком снаряжения и всей разведкой, которую только сможем собрать. Мы будем тесно работать с ними для обеспечения их окончательной победы над нашими общими врагами. Однако наша поддержка останется на этом уровне — у нас разные взгляды на мир, нам просто нужно выиграть эту войну."

 USA_joint_operations: "Совместные операции"
 USA_joint_operations_desc: "Мы будем тесно работать с союзниками для максимально эффективного ведения этой войны. Взаимодействуя с ведущими военными командирами наших союзников, мы разработаем новые планы действий, которые позволят нам достичь победы."

 USA_the_united_nations_alliance: "Альянс Объединённых Наций"
 USA_the_united_nations_alliance_desc: "Наше дело — уничтожить разрушительные силы по всему миру. К нашему делу может присоединиться каждый народ каждого континента. Мы — голос человечества против мрака тирании."
 USA_the_united_nations_alliance_tt: "Альянс Объединённых Наций"

 USA_homecoming_of_liberty: "Возвращение свободы"
 USA_homecoming_of_liberty_desc: "Настало время Соединённым Штатам Америки вернуться в Старый Свет — и принести с собой свободу. То, что Основатели начали в 1776 году, мы теперь завершим."

 USA_secure_europes_industries: "Взять под контроль европейскую промышленность"
 USA_secure_europes_industries_desc: "Как самый богатый и индустриализированный континент на Земле, Европа — великий подарок нашему Союзу. Её огромное население и мощная промышленность теперь будут способствовать американскому образу жизни."

 USA_stars_and_stripes_beyond_the_rhine: "Звёзды и полосы за Рейном"
 USA_stars_and_stripes_beyond_the_rhine_desc: "Пора завершить наше наступление и прорваться через всю Европу. Красно-бело-синее знамя будет развеваться от Парижа до Берлина и Варшавы."
 USA_stars_and_stripes_beyond_the_rhine_trigger_tt: " Контролирует штат в §YЕвропе§!"
 USA_stars_and_stripes_beyond_the_rhine_tt: "Мы получим §Yповоды для войны§! против каждой §Yевропейской нации§!, с которой мы не воюем и не состоим в союзе."

 USA_vanguard_of_the_atlantic: "Авангард Атлантики"
 USA_vanguard_of_the_atlantic_desc: "Как только мы установим контроль, Атлантика перестанет быть для наших флотов непроходимой водяной стеной — она станет соединительной тканью, связывающей два наших континента. Она будет переполнена кораблями, перевозящими людей, товары, машины, знания и всё остальное, и при этом будет фланкирована и рассекаема нашим могучим флотом."

 USA_dawn_over_europe: "Рассвет над Европой"
 USA_dawn_over_europe_desc: "Наконец, Европа под нашим контролем. Теперь начинается самое трудное — интеграция. Однако наша культура является смесью преимущественно европейских культур, поэтому у нас есть большой задел для помощи Старому Свету по-настоящему адаптироваться и слиться с Новым."
 #USA_dawn_over_europe_trigger_tt: " We, or our Faction members, control Paris, London, Berlin, Warsaw, Rome, and Madrid and the states they reside in."
 USA_dawn_over_europe_trigger_tt: " Мы или члены нашей фракции контролируем §YПариж§!, §YЛондон§!, §YБерлин§!, §YРим§! и §YМадрид§! и штаты, в которых они находятся."

 USA_war_is_business: "Война — это бизнес"
 USA_war_is_business_desc: "Война — это многое: жестокость, разрушение, ужас... и прибыль. Нам даже не нужно участвовать в боях — мы можем позволить другим нациям воевать в собственных конфликтах, сами поглощая разницу в доходах."
 war_is_business_flag: " Не брался за фокус §Y$USA_casting_cinders$§! в последние §Y180§! дней"
 USA_war_is_business_tt: "Открывает §Yrешения§! по установлению других стран в качестве §Y«Партнёров по оружию»§! и развитию торговли с ними.\n  - $USA_establish_official_partnership_decision_tooltip_tt$"

 USA_balanced_carnage: "Сбалансированная бойня"
 USA_balanced_carnage_desc: "Война может быть прибыльной, но когда война заканчивается, прекращается и поток снаряжения, необходимого для её поддержки. Для обеспечения стабильного потока прибыли может быть в наших интересах поощрять или убеждать новых участников присоединиться, а возможно, мы и сами сможем организовывать конфликты."
 War_Credits_tt: "§YВоенные кредиты§!"
 War_Credit_tt: "§YВоенный кредит§!"
 USA_balanced_carnage_tt: "Открывает £usa_war_credits_texticon $War_Credits_tt$ \n  - Каждый $War_Credit_tt$, которым мы обладаем, принесёт нам §G5§! §YПрофицита экономической ёмкости§! в конце каждого месяца. $War_Credits_tt$ также можно тратить на другие вещи."
 USA_balanced_carnage_tt_2: "Открывает §Yrешения§! для вмешательства в войны наших §YПартнёров по оружию§!, затягивая их и принося нам $War_Credits_tt$."

 USA_casting_cinders: "Разжигание искр"
 USA_casting_cinders_desc: "Там, где за рубежом царит мир, мы видим лишь закрытые для продукции нашей военной промышленности рынки. Это нас не устраивает. Мир — лишь набор пороховых бочек, которым нужна лишь искра."
 casting_cinders_flag: " Не брался за фокус §Y$USA_war_is_business$§! в последние §Y180§! дней"

 USA_aid_all_sides: "Поддержать все стороны"
 USA_aid_all_sides_desc: "Чтобы поддерживать войну, нам нужно убедиться, что схватки не заканчиваются досрочно. Независимо от того, какую сторону они поддерживают, нам нужно держать каждого участника в бою как можно дольше, чтобы принести нам как можно больше денег."

 USA_mutually_assured_profits: "Взаимно гарантированные прибыли"
 USA_mutually_assured_profits_desc: "Войны — такие превосходные источники дохода, что жаль, что вся эта прибыль не течёт только к нам! Мы обгоним каждую иностранную торговую нацию или захватим её рынки, чтобы в конечном счёте именно мы оказывались в плюсе от любого конфликта в мире."
 USA_mutually_assured_profits_trigger_tt: " Имеет §G[?USA.usa_arms_partners_variable]§! из минимум §R5§! §YПартнёров по оружию§!"
 USA_mutually_assured_profits_tt: "Открывает §Yrешения§! для повышения уровня духа для наших §YПартнёров по оружию§!, крепко удерживая их в наших руках и извлекая выгоду за их счёт.\n  - За каждого §YПартнёра по оружию§! мы теперь будем получать §G1250§! §YПрофицита экономической ёмкости§! ежемесячно.\n  - Каждый $War_Credit_tt$, которым мы обладаем, теперь принесёт нам §G10§! §YПрофицита экономической ёмкости§! в конце каждого месяца."

 USA_orchestrate_the_infernos: "Организовывать инферно"
 USA_orchestrate_the_infernos_desc: "Наша военная промышленность созрела и стала весьма компетентной в организации схваток между другими сторонами. Нам больше не нужно полагаться на соперничество других наций — мы можем самостоятельно выбирать клиентов и вводить их в наш рынок."
 USA_orchestrate_the_infernos_trigger_tt: " Имеет §G[?USA.usa_arms_partners_variable]§! из минимум §R3§! §YПартнёров по оружию§!"
 USA_orchestrate_the_infernos_trigger_tt_2: " Имеет §G[?USA.usa_war_credits_var]§! из £usa_war_credits_texticon §R10§! §YВоенных кредитов§!"
 USA_orchestrate_the_infernos_tt: "Открывает §Yrешения§! для трат §YВоенных кредитов§! на организацию §Yвойн§! между странами, над которыми у нас значительное влияние.\n\nМы сможем заключать §YПартнёрства§! с §Gбольшим количеством стран§!."

 USA_new_continue_the_new_deal: "Продолжить «Новый курс»"
 USA_new_continue_the_new_deal_desc: "Политика «Нового курса» будет расширена, а её эффектам будет дано время принести плоды. Именно так мы выйдем из Великой депрессии."

 USA_double_down_on_the_new_deal: "Удвоить ставку на «Новый курс»"
 USA_double_down_on_the_new_deal_desc: "Хотя есть голоса, не поддерживающие «Новый курс» и его масштабные реформы, именно удвоение ставки на них позволит наконец освободить американский народ от Великой депрессии и дать Соединённым Штатам начать восстановление."

 USA_new_agricultural_adjustment_act: "Закон о регулировании сельского хозяйства"
 USA_new_agricultural_adjustment_act_desc: "Депрессия ударила по всем слоям общества, но один из наиболее пострадавших — фермеры. Они не только переживают тяжёлые времена, но и абсолютно необходимо, чтобы они продолжали производить продовольствие. Нам нужно поддержать их финансово и обеспечить здоровое продовольственное снабжение."
 agri_adj_act_tt: "После принятия потребуется ещё §Rнекоторое время§!, прежде чем можно будет разработать новые §Yзаконы «Нового курса»§!."

 USA_new_fair_labour_standards_act: "Закон о справедливых трудовых стандартах"
 USA_new_fair_labour_standards_act_desc: "Важно убедиться, что рядовой американский рабочий извлекает выгоду из продолжающегося экономического восстановления. Мы должны обеспечить, чтобы ни один работодатель не пользовался своим положением в ущерб работникам, и закрепим этот принцип федеральным законом."
 USA_new_fair_labour_standards_act_tt: "\nПрежде чем «Новый курс» вступит в полную силу, потребуется разработать ещё больше законодательства, хотя это §Rзаймёт время§!."

 USA_federal_zoning_reform: "Федеральная реформа зонирования"
 USA_federal_zoning_reform_desc: "Из-за экономического спада строится значительно меньше домов, чем должно. Ослабляя строительные ограничения, расширяя доступные земли и субсидируя строительство, мы поможем обеспечить достаточное количество домов для каждого американца."

 USA_union_defense_act: "Закон о защите профсоюзов"
 USA_union_defense_act_desc: "Боль Великой депрессии привела к тому, что многие люди совершали отчаянные и жестокие действия по отношению к окружающим. Рабочие во многих случаях пострадали от отчаявшихся работодателей и нуждаются в защите. С этой целью мы примем законодательство, обеспечивающее безопасность и эффективность рабочих профсоюзов по всей стране."

 USA_new_federal_housing_act: "Федеральный закон о жилье"
 USA_new_federal_housing_act_desc: "Великая депрессия оставила миллионы американцев без крова. Мы будем тратить столько, сколько нужно, для строительства нового жилья для нашего народа, чтобы каждый мог найти дом. Ни один трудолюбивый человек не должен беспокоиться о том, где он будет спать этой ночью."

 USA_restore_the_gold_standard: "Восстановить золотой стандарт"
 USA_restore_the_gold_standard_desc: "Хотя мы приняли решение отказаться от золотого стандарта, чтобы лучше найти средства для восстановления экономики, это не дало ожидаемых результатов. Нам нужно отступить и восстановить золотой стандарт, чтобы вновь обеспечить стабильность доллара."

 USA_rebalancing_finances: "Перебалансировка финансов"
 USA_rebalancing_finances_desc: "Ограничивая федеральные расходы, нам необходимо полностью переосмыслить нашу денежно-кредитную и фискальную политику. Это будет непросто и небезболезненно, но необходимо."

 USA_new_adjusted_compensation_act: "Закон о скорректированной компенсации"
 USA_new_adjusted_compensation_act_desc: "Хотя мы не намерены вмешиваться в индивидуальные сделки наших граждан, мы обязаны помогать великой американской нации в целом и поэтому вмешаемся в рынок, чтобы обеспечить справедливую и честную оплату труда. По мере возобновления роста он не должен доставаться только владельцам бизнеса."
 adj_comp_act_tt: "После успешного принятия потребуется ещё §Rнекоторое время§!, прежде чем можно будет разработать новые §Yполитики§!."

 USA_new_protectionist_tariffs: "Протекционистские тарифы"
 USA_new_protectionist_tariffs_desc: "По-прежнему необходимо ставить американскую торговлю выше торговли других стран. Когда мы позаботимся о собственном росте и восстановлении, у нас появится возможность начать инвестировать в другие экономики."
 USA_new_protectionist_tariffs_tt: "\nПравительству придётся принять новые §Yполитики§!, прежде чем страна полностью восстановится, а это §Rзаймёт время§!."

 USA_guns_and_shovels: "Ружья и лопаты"
 USA_guns_and_shovels_desc: "Используя военнослужащих на работах по общественным проектам, мы можем одновременно создавать рабочие места для населения и сохранять нашу силу сдерживания против соперников за рубежом."

 USA_new_income_tax_reform: "Реформа подоходного налога"
 USA_new_income_tax_reform_desc: "Сокращая налоги, утекающие на бесполезные схемы, и оставляя тем, кто заработал свои доллары, право их сохранить, мы поможем среднему американцу встать на ноги."

 USA_military_pensions: "Военные пенсии"
 USA_military_pensions_desc: "Служба этой стране должна сопровождаться ощущением безопасности для тех, кто отдаёт своё время и силы обществу. Инвестирование в более ранние и широкие пенсии для наших солдат будет поощрять рекрутирование и откроет ещё один источник финансовых возможностей."

 USA_new_war_propaganda: "Военная пропаганда"
 USA_new_war_propaganda_desc: "Конфликт приближается к американскому народу, и ему нужно быть готовым. Нравится нам эта позиция или нет, но нам нужно подготовиться."

 USA_sway_the_public: "Склонить общественное мнение"
 USA_sway_the_public_desc: "Даже в нынешнем состоянии мира значительная часть американского населения выступает против любого рода конфликта. К сожалению, такая позиция больше неприемлема. Нам придётся приложить усилия, чтобы изменить их мнение."

 USA_hollywood_endorsements: "Поддержка Голливуда"
 USA_hollywood_endorsements_desc: "Мы можем использовать нашу огромную медиаиндустрию в своих интересах, чтобы сплотить американский народ вокруг любого дела, которое нам нужно отстоять."

 USA_family_films: "Семейные фильмы"
 USA_family_films_desc: "Голливудские фильмы, посвящённые американским семейным ценностям, помогут поддержать общественное сознание и дадут давно необходимую передышку от потрясений последних нескольких лет."

 USA_war_bond_campaigns: "Кампании по продаже военных облигаций"
 USA_war_bond_campaigns_desc: "Для эффективного ведения этой войны нам понадобится полная поддержка и backing американского народа. Нам понадобятся все доступные активы."

 USA_congressional_rallies: "Парламентские митинги"
 USA_congressional_rallies_desc: "После победы Лэндона Республиканская партия находится в отличном положении для дальнейшего расширения поддержки по всей стране и обеспечения доминирующего положения во всём правительстве."

 USA_state_empowerment: "Укрепление полномочий штатов"
 USA_state_empowerment_desc: "Важно обеспечить, чтобы многочисленные штаты США сохраняли свои полномочия и самостоятельность даже перед лицом постоянно расширяющегося федерального правительства."

 USA_support_titans_of_industry: "Поддержать титанов промышленности"
 USA_support_titans_of_industry_desc: "Поддерживая наши мощные отрасли, мы можем направлять ресурсы туда, где они растут быстрее всего и работают наиболее эффективно."

 USA_audit_emergency_programs: "Аудит чрезвычайных программ"
 USA_audit_emergency_programs_desc: "Многочисленные трёхбуквенные агентства и чрезвычайные программы были созданы в ответ на последние кризисы, но теперь, когда мы начинаем от них оправляться, они пережили своё предназначение. Хотя это и непопулярно, мы не можем позволить себе тратить миллионы налогоплательщиков на схемы без обоснования."

 USA_national_parks_infrastructure: "Инфраструктура национальных парков"
 USA_national_parks_infrastructure_desc: "Наши обширные и многочисленные национальные парки нуждаются в повышении качества удобств и ухода, а у нас есть миллионы нуждающихся в работе. Федеральное правительство может финансировать обязательные трудовые программы для удовлетворения обеих потребностей одновременно."

 USA_new_wpa: "УРТ"
 USA_new_wpa_desc: "Управление по защите рабочих будет предоставлять услуги работникам по всей стране для их защиты и расширения возможностей."

 USA_fdic: "Учредить ФКСД"
 USA_fdic_desc: "После ущерба, причинённого безответственными банковскими практиками, ясно, что подобная катастрофа не должна повториться. Федеральная корпорация по страхованию вкладов обеспечит денежное покрытие банков страны и будет регулировать их политику, защищая от возможного набега на банки."

 USA_expand_social_security: "Расширить социальное обеспечение"
 USA_expand_social_security_desc: "Кошельки американцев пусты гораздо чаще, чем должны. Долг правительства — дать своим гражданам процветание. Никто не должен голодать или жить в бедности."

 USA_new_build_the_pentagon: "Построить Пентагон"
 USA_new_build_the_pentagon_desc: "Пентагон станет центром военного командования Америки. Это учреждение укрепит наши организационные возможности и предоставит пространство для тесной и эффективной работы всех аспектов ведения войны."

 USA_host_the_remnants_of_democracy: "Принять остатки демократии"
 USA_host_the_remnants_of_democracy_desc: "Берега Америки — единственное безопасное убежище для тех, в ком жив дух демократии. Мы должны распахнуть объятия каждому отчаявшемуся беженцу, готовому бороться за это дело, и должны быть уверены, что никакие опасные угрозы не пробрались раньше времени."
 USA_host_the_remnants_of_democracy_tt: "Принять остатки демократии"

 USA_the_weight_of_the_world: "Бремя мира"
 USA_the_weight_of_the_world_desc: "Мы спорили и бились по множеству вопросов столько, сколько существует эта страна, но теперь мы должны временно отложить эти мелкие разногласия. Сейчас сама судьба требует нашего внимания и сосредоточенности. Нам нужно объединиться против угроз, которые теперь стоят перед нами."

 USA_every_chip_down: "Все ставки сделаны"
 USA_every_chip_down_desc: "Часы пробили полночь — пора действовать. Силы тьмы достигли наших берегов и угрожают нашему народу. Всё, что в нашем распоряжении, должно быть мобилизовано на это дело — для победы над великим злом, стремящимся уничтожить последние следы свободы в мире. Америка поднимется на высоту положения и нанесёт быстрый удар. Мы должны дать отпор."
 USA_every_chip_down_tt: "§RУбрать§! §Y$tot_economic_mobilisation$§!. Получить §Y$the_eagles_might_economy$§!."

 USA_crusade_for_freedom: "Крестовый поход за свободу"
 USA_crusade_for_freedom_desc: "Хотя мы сделали всё возможное, чтобы продемонстрировать собственные достоинства и возвести здесь великую нацию, теперь мы должны действовать проактивно, чтобы спасти мир от опасностей, захлестнувших его. Соединённые Штаты Америки должны простереть свою волю по всему земному шару и поддержать борьбу человечества за свободу повсюду. Мы не остановимся, пока силы разрушения не будут заглушены, и мы обязаны их заглушить."
 USA_crusade_for_freedom_tt: "Получить §Yповоды для войны§! против каждой страны, которая §Rгенерировала напряжённость§!."

 USA_political_funding: "Политическое финансирование"
 USA_political_funding_desc: "Политика в США — грязное дело, как и везде. Иногда всё, что нужно для движения колёс, — немного смазки."

 USA_support_the_phillipines: "Поддержать Филиппины"
 USA_support_the_phillipines_desc: "[PHI.GetNameDefCap] находятся под нашей защитой уже несколько десятилетий, но теперь мы быстро приближаемся к моменту их самостоятельного пути. В этом процессе обретения независимости мы будем поддерживать их экономику, управление и оборону, чтобы они смогли уверенно войти в широкий мир."

 USA_new_neutrality_act: "$USA_neutrality_act$"
 USA_new_neutrality_act_desc: "$USA_neutrality_act_desc$"

 USA_new_limited_intervention: "$USA_limited_intervention$"
 USA_new_limited_intervention_desc: "$USA_limited_intervention_desc$"

 USA_new_lend_lease_act:0 "$USA_lend_lease_act$"
 USA_new_lend_lease_act_desc: "$USA_lend_lease_act_desc$"

 USA_new_arsenal_of_democracy: "$USA_arsenal_of_democracy$"
 USA_new_arsenal_of_democracy_desc: "$USA_arsenal_of_democracy_desc$"

 USA_duty_to_act: "Долг действовать"
 USA_duty_to_act_desc: "Независимо от того, изберём ли мы мир или войну, нам нужно двигаться. Мир не станет ждать, пока мы определимся."

 USA_socialized_medical_care: "Социализированная медицинская помощь"
 USA_socialized_medical_care_desc: "Часть того, что значит жить в Соединённых Штатах, — это то, что каждый человек должен иметь доступ ко всему лучшему, что может предложить современный мир. Ни один гражданин не должен быть лишён жизненно важной медицинской помощи. Правительство возьмёт на себя расходы тех, кто не может себе позволить, чтобы все могли извлечь пользу."

 USA_bolster_suffrage: "Укрепить избирательное право"
 USA_bolster_suffrage_desc: "По всей стране есть миллионы людей, имеющих право голоса, но ещё не воспользовавшихся им. Нам нужно поощрять каждого выполнять свою роль представителя своих общин."

 USA_joint_wargaming: "Совместные военные игры"
 USA_joint_wargaming_desc: "Нашему военному командованию необходимо быть подготовленным к конфликту. У нас достаточно ресурсов для усиления готовности наших людей к более современному бою."

 USA_support_democracy_around_the_world: "Поддержать демократию по всему миру"
 USA_support_democracy_around_the_world_desc: "Каждая демократическая страна в мире должна получить поддержку для обеспечения продолжения свободы по всему земному шару."

 USA_ramp_up_government_spending: "Резко увеличить государственные расходы"
 USA_ramp_up_government_spending_desc: "Для достижения всего, что записано в нашем длинном списке целей, нам понадобится значительно больше средств для федерального правительства."

 USA_public_works_projects: "Проекты общественных работ"
 USA_public_works_projects_desc: "Нанимая миллионы американцев на проекты общественных работ по всей стране, американцы смогут быстро оправиться от Великой депрессии, одновременно служа и обогащая собственные общины."

 USA_increase_social_spending: "Увеличить социальные расходы"
 USA_increase_social_spending_desc: "Требуется больше усилий для помощи американскому народу, и обязанность правительства — вытащить их из ямы, в которой оказались многие. Правительство будет оплачивать различные услуги для американцев по всей стране, чтобы процветание могло вернуться."

 USA_gunnery_innovations: "Инновации в артиллерии"
 USA_gunnery_innovations_desc: "Новые технологии требуют новых способов их использования в сражениях, и море остается сферой постоянно развивающейся стратегии. В настоящее время наши корабли не предназначены для защиты от авиации, и с этой целью мы разработаем "взрыватель VT", чтобы сбивать вражеские пикирующие бомбардировщики с воздуха до того, как они смогут нанести удар по нам."

 USA_the_jeep: "Джип"
 USA_the_jeep_desc: "Стремясь создать новое универсальное транспортное средство повышенной проходимости, мы создали автомобиль, который идеально подходит для выполнения различных функций: джип. Это простое, надежное и сверхуниверсальное моторизованное транспортное средство позволит всем подразделениям наших вооруженных сил передвигаться по полю боя с высокой скоростью и эффективностью. Может, это и не гламурно, но именно такие простые вещи, как эта, действительно помогают выигрывать войны."

 USA_DEBUG_BRANCH: "ВЕТВЬ ОТЛАДКИ"
 USA_DEBUG_BRANCH_desc: "ОТЛАДКА"

 USA_IDEA_TEST_FOCUS: "ФОКУС НА ПРОВЕРКЕ ИДЕИ"
 USA_IDEA_TEST_FOCUS_desc: "Проверяет, чтобы убедиться, что все идеи работают должным образом."

 USA_IDEA_TEST_ECO_MODIFIERS: "ПРОТЕСТИРУЙТЕ ЭКОНОМИЧЕСКИЕ МОДИФИКАТОРЫ"
 USA_IDEA_TEST_ECO_MODIFIERS_desc: "Тесты, показывающие все модификаторы, которые могут быть в модификаторах экономической динамики"

 USA_IDEA_TEST_GOV_MODIFIERS: "ПРОТЕСТИРУЙТЕ МОДИФИКАТОРЫ УПРАВЛЕНИЯ"
 USA_IDEA_TEST_GOV_MODIFIERS_desc: "Проверяет, чтобы показать все модификаторы, которые могут быть в динамических модификаторах правительства"

 USA_IDEA_TEST_SPY_MODIFIERS: "ТЕСТИРУЙТЕ ШПИОНСКИЕ МОДИФИКАТОРЫ"
 USA_IDEA_TEST_SPY_MODIFIERS_desc: "Тесты показывают все модификаторы, которые могут быть в динамических модификаторах spy"

 USA_IDEA_TEST_MIC_MODIFIERS: "ПРОВЕРКА МОДИФИКАТОРОВ МИКРОФОНА"
 USA_IDEA_TEST_MIC_MODIFIERS_desc: "Тесты для отображения всех модификаторов, которые могут быть в динамических модификаторах микрофона"

 USA_IDEA_TEST_ARM_MODIFIERS: "ТЕСТ МОДИФИКАТОРОВ ARM"
 USA_IDEA_TEST_ARM_MODIFIERS_desc: "Тесты для отображения всех модификаторов, которые могут быть в динамических модификаторах arm"

 USA_IDEA_TEST_NAV_MODIFIERS: "ПРОВЕРИТЬ НАВИГАЦИОННЫЕ МОДИФИКАТОРЫ"
