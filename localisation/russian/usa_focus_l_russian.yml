 USA_new_two_ocean_navy_act: "Закон о военно-морском флоте двух океанов"
 USA_new_two_ocean_navy_act_desc: "Поскольку война уже на горизонте, мы должны обеспечить, чтобы ни один враг никогда не смог ступить на американские берега. Наш военно-морской флот должен быть способен сражаться с любым врагом в любом из двух великих океанов, которые образуют наши границы."
