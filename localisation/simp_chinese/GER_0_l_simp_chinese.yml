 ss_coup_event.1.t:0 "针对[GER.GetLeader]的刺杀行动"
 ss_coup_event.1.d:0 "元首总部传来报告：在[GER.GetLeader]与海因里希·希姆莱的私人会晤中突发骚乱。细节尚不明确，但军事情报局截获密令显示，党卫队各部队正为代号'黑色方案'的行动做准备——该计划旨在军事政变发生时控制关键通讯和基础设施节点。"
 ss_coup_event.1.a:0 "德国的命运已被改写"
 
 ss_coup_event.2.t:0 "希姆莱政变"
 ss_coup_event.2.d:0 "当元首总部的硝烟散尽，海因里希·希姆莱成为火并中唯一的幸存者。据其证词，元首在癫狂中指控他是军人的耻辱、该被枪决的叛徒。为挽救国家命运，希姆莱当机立断击毙元首。元首卫队试图处决希姆莱时，党卫队保镖及时赶到。\n\n更令人震惊的是，国防军选择在危局中支持希姆莱以阻止内战。此刻起，希特勒的权柄已移交希姆莱。"
 ss_coup_event.2.a:0 "希姆莱万岁！"
 
 wehrmacht_coup_event.1.t:0 "针对[GER.GetLeader]的刺杀行动"
 wehrmacht_coup_event.1.d:0 "元首总部未经证实的报告显示，[GER.GetLeader]出席的军事会议发生爆炸。国防军与党卫队陷入相互指责的混乱，双方军官均指控对方企图政变。\n\n根据希特勒生前指定，赫尔曼·戈林宣布继任帝国领导权。"
 wehrmacht_coup_event.1.a:0 "我们只能祈祷"
 
 wehrmacht_coup_event.2.t:0 "瓦尔基里行动"
 wehrmacht_coup_event.2.d:0 "国防军发动了应对国内动乱的'瓦尔基里行动'。陆军部队包围多个政府部门，试图逮捕纳粹党高官。柏林全城爆发党卫队与国防军的零星交火。国防军要求党卫队立即缴械的命令遭断然拒绝。\n\n效忠[GER.GetLeader]的部队正与叛军激战。\n\n这场内战的烽火即将燎原。"
 wehrmacht_coup_event.2.a:0 "叛徒！懦夫！"
 
