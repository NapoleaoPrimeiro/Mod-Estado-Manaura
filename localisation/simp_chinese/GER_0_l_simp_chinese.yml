 ss_coup_event.1.t:0 "刺杀[GER.GetLeader]未遂"
 ss_coup_event.1.d:0 "元首总部报告称，[GER.GetLeader]与海因里希·希姆莱的私人会晤中发生骚乱。细节不明，但军事情报局阿勃维尔截获密使，命各地党卫军单位准备代号'黑色方案'的行动，据称是为应对军事政变控制关键通讯和基础设施点。"
 ss_coup_event.1.a:0 "德意志命运已变。"
 
 ss_coup_event.2.t:0 "希姆莱政变"
 ss_coup_event.2.d:0 "元首总部硝烟散尽后，海因里希·希姆莱作为唯一幸存者现身。据其证词，元首显然陷入疯狂，宣布他是彻底的军人败类、叛徒和间谍，应黎明枪决。意识到须在个人荣誉与国家存亡间抉择，希姆莱当即击毙元首。随后元首卫队成员试图刺杀希姆莱灭口，幸得希姆莱贴身护卫及时赶到。\n\n然而国防军意外决定支持希姆莱以保障国家未来，避免内战。希特勒衣钵现由希姆莱继承。"
 ss_coup_event.2.a:0 "西海！希姆莱！"
 
 wehrmacht_coup_event.1.t:0 "刺杀[GER.GetLeader]未遂"
 wehrmacht_coup_event.1.d:0 "元首总部未证实报告称，[GER.GetLeader]出席的形势会议中有人引爆炸弹。信息仍匮乏，国防军和党卫军均陷混乱，双方军官互指对方政变。\n\n原定希特勒继任者赫尔曼·戈林决定领导帝国。"
 wehrmacht_coup_event.1.a:0 "唯存希望。"
 
 wehrmacht_coup_event.2.t:0 "瓦尔基里行动"
 wehrmacht_coup_event.2.d:0 "国防军执行瓦尔基里行动——德国重大内乱应急计划。陆军部队包围多个政府部门，试图逮捕党内高官。柏林全城爆发党卫军警卫与陆军分队的小规模冲突。国防军要求所有党卫军立即缴械，遭党卫军高层断然拒绝。\n\n两派现争夺柏林控制权。部分国防军宣布效忠[GER.GetLeader]并武装镇压叛军。\n\n战火势必蔓延。"
 wehrmacht_coup_event.2.a:0 "叛徒！懦夫！"
 
