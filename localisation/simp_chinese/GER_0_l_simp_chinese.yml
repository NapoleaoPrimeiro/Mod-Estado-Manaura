 GER_adolf_hitler_desc:0 "阿道夫·希特勒，德意志帝国总理，纳粹党领袖，帝国总统兼总理，武装力量最高统帅。\n他于1933年3月24日号召国会议员投票通过《授权法》。该法案赋予希特勒'临时'全权，使其可绕过议会授权甚至宪法限制自由行动。\n通过惯用的谈判与威吓结合手段，希特勒承诺若被授予紧急权力，将保证与国会、总统、各邦及教会友好合作且不予威胁。\n该法允许希特勒及其内阁以紧急法令统治四年，但兴登堡仍保留总统职位。希特勒立即开始剥夺各邦权力，取缔非纳粹政党及组织。1933年7月14日非纳粹政党被正式禁止，国会民主职能遭废除。兴登堡保留军队总司令职权及外交条约谈判权。\n该法未侵犯总统权力，直至1934年8月兴登堡去世，希特勒才获得完全独裁权。仅作为国家元首的希特勒可解除自身政府首脑职务。兴登堡逝世当日，全军官兵向希特勒个人宣誓'无条件效忠'，而非对职位或国家效忠。至此，德意志伟大元首时代来临，统治欧洲的使命落于其肩。"
