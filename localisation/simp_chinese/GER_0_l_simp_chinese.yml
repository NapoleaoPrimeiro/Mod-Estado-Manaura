 GER_mefo_bills_category:0 "梅福票据"
 GER_mefo_bills_category_desc:0 "为资助日益增长的军事工业，并躲避英法耳目，我们被迫使用资产负债表实体通过期票形式转移支付。若不动用政治关系延长票据期限，我们将被迫偿还并失去其效益。"
 GER_mefo_bills_mission:0 "梅福票据到期"
 GER_can_delay_mefo_payment:0 "可延期支付梅福票据。"
 GER_mefo_bills_mission_desc:0 "我们发行的票据即将到期。必须决定延期或开始偿付。"
 GER_extend_mefo_bills:0 "梅福票据"
 GER_extend_mefo_bills_desc:0 "将梅福票据期限延长3个月，使我们在持续期间继续享受其效益。但会提高最终偿付成本。"
 GER_extend_mefo_bills_tt:1 "决定是否延长'§Y梅福票据§!'或开始支付。\n"
 GER_mefo_bills_mission_tt:1 "在现批次梅福票据到期时实施为期6个月的'§Y梅福票据§!'延期。\n\n每次延期成本将递增，直至战争爆发；届时梅福票据依赖解除，支付延至战后。\n\n"
 GER_mefo_bills_effect_in_days:1 "以下将在 [?Root.days_mission_timeout@GER_mefo_bills_mission|H0] 天后发生：\n"
 GER_mefo_bills_extension_timer:0 "梅福票据到期前。"
 GER_mefo_bills_extension:0 "梅福票据延期不足60天。"
 GER_mefo_bills_extended:0 "延期的梅福票据"
 GER_renew_mefos:0 "续期梅福票据"
 GER_renew_mefos_desc:0 "帝国银行对重建和武装国家至关重要。显然偿债决策有误，应再延长梅福票据数月。"
 GER_cancel_mefos:0 "取消梅福票据"
 GER_cancel_mefos_desc:0 "我们依赖帝国银行重建军工业过久。是时候履行对军火商的票据承诺，结束这场'梅福票据'闹剧。"
 GER_case_anton_category:0 "安东行动"
 GER_case_anton_category_desc:0 "建立维希法国的初衷始终是防止法国殖民地和舰队落入盟军之手。但我们可随时废止协议。已有计划强制整合该地区，并闪电突进法国舰队基地土伦。"
 GER_case_anton:1 "执行安东行动"
 GER_case_anton_tt2:2 "未控制北非法属州份多数地区。"
 GER_case_anton_desc:0 "我们在法国的傀儡国已无用武之地。将立即开始整合入[Root.GetName]，若行动足够迅捷，甚至能接管法国舰队残部。"
 GER_case_anton_tt:0 "7天内吞并维希法国并俘获法国舰队。\n\n§R除非德军在2天内进驻土伦，否则法国将自沉舰队！§!\n"
