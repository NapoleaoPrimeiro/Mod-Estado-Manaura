l_simp_chinese:
GFTR_E_independence.1.t: "独立战争！"
GFTR_E_independence.1.d: "我们的耐心已经耗尽。这是我们的土地，我们有权随意支配它。今天，我们开始反抗那些侵入我们领土、强加他们意志和文化、奴役我们人民并插上他们旗帜的侵略者和占领者。"
GFTR_E_independence.1.a: "让他们的鲜血流淌！"
# # # # # # # # # # # # # # #
GFTR_E_independence.2.t: "请求信"
GFTR_E_independence.2.d: "今天我们收到了傀儡国家的正式请求。他们要求重新评估我们的影响力，希望在外政和内政上有自己的声音，并公开宣称希望成为一个独立国家。这份请求目前仍保持克制和外交语气，但手指一响，一切都可能演变为战争。"
GFTR_E_independence.2.a: "绝无让步！"
GFTR_E_independence.2.b: "我们愿意给予他们独立。"
GFTR_E_independence.2.c: "叛徒！滚出我们的联盟！"
GFTR_E_independence.2.d: "军队将恢复秩序。"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.0.t: "坏消息"
GFTR_E_independence_response.0.d: "今早我们遭受了昔日傀儡国家的背后一击，他们突然宣布独立，并袭击了驻扎在其领土上的我军。我们的谈判尝试全部被拒绝。"
GFTR_E_independence_response.0.a: "他们想要战争？那就给他们！"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.1.t: "被拒绝"
GFTR_E_independence_response.1.d: "几天前我们提交了独立请求，但今天收到了断然拒绝。宗主国不愿放手，并拒绝讨论任何相关事宜。外交已陷入僵局。"
GFTR_E_independence_response.1.a: "只能开战了！"
GFTR_E_independence_response.1.b: "……好吧"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.2.t: "我们自由了！"
GFTR_E_independence_response.2.d: "好消息！宗主国正式承认了我们的独立。从今以后，我们自己掌握自己的命运。对我们人民来说，这是一个载入史册的历史性日子。"
GFTR_E_independence_response.2.a: "万岁！万岁！万岁！"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.3.t: "苦涩的自由"
GFTR_E_independence_response.3.d: "今天我们收到了宗主国模棱两可的答复。他们指责我们背叛！我们取得了独立，但前宗主国切断了与我们的所有外交联系。我们自由了，但在这一动荡时代孤立无援。尽管言辞激烈，我们还是避免了武装冲突。"
GFTR_E_independence_response.3.a: "最重要的是和平解决了。"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.4.t: "独立战争"
GFTR_E_independence_response.4.d: "我们对和平解决从属地位的希望今日破灭。在我们最近的请求后，宗主国向边境调兵，准备入侵以粉碎我们成为主权国家的愿望。从此刻起，我们不再是为自由而战，而是为国家本身的存亡而战。"
GFTR_E_independence_response.4.a: "我们将坚守阵地！"
# # # # # # # # # # # # #
GFTR_E_change_of_power.1.t: "选举结束"
GFTR_E_change_of_power.1.d: "国家举行了公正的民主选举。人民做出了自己的选择。"
GFTR_E_change_of_power.1.a: "好的"
# # # # # # # # # # # # #
GFTR_E_change_of_power.2.t: "夺取政权"
GFTR_E_change_of_power.2.d: "预期的对抗并未发生。旧政权承认失败，放下了权力，平和地将控制权移交给新政权。"
GFTR_E_change_of_power.2.a: "正确决定"
# # # # # # # # # # # # #
GFTR_E_change_of_power.3.t: "内战！"
GFTR_E_change_of_power.3.d: "政治危机达到极限。国家分裂成两个敌对阵营，权力之争演变为公开武装对抗。"
GFTR_E_change_of_power.3.a: "我们能行"