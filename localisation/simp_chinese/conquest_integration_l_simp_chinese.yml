l_simp_chinese:
 conquest_integration.1.t:0 "征服的战利品"
 conquest_integration.1.desc:0 "随着[event_target:ci_conquered_country.GetName]落入我们掌控，其军官团、指挥官和政界人士如今都已无所归属。我们可以将他们招入麾下——他们的经验不该白白浪费。"
 conquest_integration.1.advisors:0 "整合其顾问"
 conquest_integration.1.commanders:0 "整合其指挥官"
 conquest_integration.1.scientists:0 "整合其科学家"
 conquest_integration.1.industry:0 "整合其战争工业"
 conquest_integration.1.all:0 "全部整合"
 conquest_integration.1.decline:0 "他们对我们毫无用处"
 ci_integrated_industry:0 "整合的战争工业"
 ci_integrated_industry_desc:0 "被我们征服的国家并入的工厂、设计局和熟练工人。每整合一份工业力量，都会强化我们的战争经济。"
 conquest_integration.2.t:0 "战争审判"
 conquest_integration.2.desc:0 "我们打算招募的军官和顾问，必须先为自己的行为作出交代。审判、清洗和旧怨都会造成损耗——最终只有少数人获准为我们效力。其余人不会加入我们。"
 conquest_integration.2.a:0 "也只能如此"
 conquest_integration.5.t:0 "夺取其舰队"
 conquest_integration.5.desc:0 "[event_target:ci_capitulated_navy_country.GetName]已经投降，其战舰如今停泊在港内，无旗可效忠。我们可以将其舰队编入自己的海军。（航空母舰无法被夺取。）"
 conquest_integration.5.a:0 "夺取其舰队"
 conquest_integration.5.b:0 "任其锈蚀"
 conquest_integration.6.t:0 "缴获的图纸"
 conquest_integration.6.desc:0 "[event_target:ci_defeated_licensor.GetName]的设计局已落入我们手中，其坦克、飞机和军舰的图纸也一并归我们所有。我们可以取得其设计的授权，在自己的工厂里生产。"
 conquest_integration.6.a:0 "夺取其生产授权"
 conquest_integration.6.b:0 "我们自己的设计已经够用"
 RULE_GROUP_CI:0 "征服整合"
 RULE_CI_WAR_TRIALS:0 "战争审判存活率"
 RULE_CI_WT_25:0 "严厉（25%）"
 RULE_CI_WT_25_DESC:0 "约四分之一被整合的顾问和将领能通过审判。这是默认设置。"
 RULE_CI_WT_10:0 "残酷（10%）"
 RULE_CI_WT_10_DESC:0 "只有十分之一能够存活。大多数敌方军官和顾问都会被清洗。"
 RULE_CI_WT_50:0 "宽松（50%）"
 RULE_CI_WT_50_DESC:0 "半数被整合的顾问和将领会获准效力。"
 RULE_CI_WT_75:0 "慷慨（75%）"
 RULE_CI_WT_75_DESC:0 "大多数敌方军官和顾问会加入我们。几乎不会进行淘汰。"
 RULE_CI_AI:0 "AI 征服整合"
 RULE_CI_AI_OFF:0 "仅玩家"
 RULE_CI_AI_OFF_DESC:0 "只有你能够整合征服的战利品。AI 国家会忽略本模组的机制。这是默认设置。"
 RULE_CI_AI_ON:0 "玩家与 AI"
 RULE_CI_AI_ON_DESC:0 "AI 国家也会整合被征服的顾问、指挥官和工业，并在敌国投降时夺取其舰队。"
 RULE_CI_LICENSE:0 "缴获的生产授权"
 RULE_CI_LIC_FREE:0 "免费"
 RULE_CI_LIC_FREE_DESC:0 "从战败国缴获的授权不带生产惩罚——像生产自己的装备一样生产他们的坦克、飞机和军舰。这是战争的战利品。默认设置。"
 RULE_CI_LIC_HALF:0 "折扣（50%）"
 RULE_CI_LIC_HALF_DESC:0 "缴获的授权只带有通常一半的生产惩罚。"
 RULE_CI_LIC_FULL:0 "全额"
 RULE_CI_LIC_FULL_DESC:0 "缴获的授权带有与正常谈判所得授权相同的生产惩罚。"
 RULE_CI_LIC_OFF:0 "禁用"
 RULE_CI_LIC_OFF_DESC:0 "战败国不提供任何生产授权。"
