 new_usa_country_roads_through_the_north_event.1.t: "[FROM.GetNameDefCap]希望从我们这里购买西部缺口"
 new_usa_country_roads_through_the_north_event.1.desc: "[FROM.GetAdjective]政府已向我们表明，他们希望购买我们在阿拉斯加与美国本土之间控制的领土。他们还为此开出了高价。我们应该把这些领土卖给他们吗？"
