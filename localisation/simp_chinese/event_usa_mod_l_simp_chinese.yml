 new_usa_an_our_saftey_before_yours_event.1.t: "[FROM.GetNameDefCap]要求我们接受美国贸易霸权"
 new_usa_an_our_saftey_before_yours_event.1.desc: "[FROM.GetAdjective]政府已开始一场运动，力图将自己确立为西半球的贸易巨人。为此，他们要求[THIS.getName]服从其新贸易法，这将使他们在谈判中拥有显著优势，并要求我们开放基础设施供其军队使用。作为回报，[from.GetAdjective]政府将进一步确保我们免受外国势力侵害。\n\n然而，鉴于他们此前已经维护了门罗主义，这实际上只是我们现在不得不为这种恩惠而提供的服务。"
 new_usa_an_our_saftey_before_yours_event.1.a: "这符合我们的利益"
 new_usa_an_our_saftey_before_yours_event.1.b: "我们不会被欺负"
 new_usa_an_our_saftey_before_yours_event.2.t: "[FROM.GetNameDefCap]接受我们的贸易霸权"
 new_usa_an_our_saftey_before_yours_event.2.desc: "[FROM.GetAdjective]政府已正式接受我们关于[FROM.getName]增加对[THIS.GetNameDefCap]贸易特权的要求。他们还开放了内部基础设施供我们使用。"
 new_usa_an_our_saftey_before_yours_event.2.a: "太好了"
 new_usa_an_our_saftey_before_yours_event.3.t: "[FROM.GetNameDefCap]拒绝我们的要求"
 new_usa_an_our_saftey_before_yours_event.3.desc: "[FROM.GetAdjective]政府拒绝了我们的半球贸易霸权主张。他们通过这次拒绝在我们面前炫耀他们的拒绝。"
 new_usa_an_our_saftey_before_yours_event.3.a: "多么忘恩负义……"

 new_usa_an_USA_the_second_confederation_event.1.t: "第二邦联的第一任总统"
 new_usa_an_USA_the_second_confederation_event.1.desc: "随着邦联的成形以及邦联政府中央行政机构完成迁入里士满的新首都，第一次总统选举已经展开。数百名候选人挺身而出，但势头最强劲的两位是威廉·达德利·佩利和史沫特莱·巴特勒。\n\n佩利以“美国的元首”自居，效仿希特勒在德国的政权风格和组织。他富有魅力且忠诚，尽管与普通美国人相比，他的一些观点有些狂热。\n\n巴特勒是一位军事指挥官，此前曾险些被牵连进一场针对旧政权的未遂政变，如今他再次来到最高职位的悬崖边，提出要成为国家的公民指挥官。\n\n而获胜者是……"
 new_usa_an_USA_the_second_confederation_event.1.a: "威廉·达德利·佩利"
 new_usa_an_USA_the_second_confederation_event.1.b: "史沫特莱·巴特勒"
 new_usa_an_USA_the_goldstar_federation_event.1.t: "联邦的第一任总统"
 new_usa_an_USA_the_goldstar_federation_event.1.desc: "随着联邦的成形以及新政府在华盛顿重组，第一次总统选举已经展开。来自全国各地的许多不同候选人挺身而出并一试身手，但势头最强劲的两位是约翰·奥比茨和罗伯特·E·伍德。\n\n奥比茨是最近声名鹊起的金星网络创始人，这是我们新政府结构的精神支柱。作为一名前军事工程师和崭露头角的哲学家，他的支持者称他为“金星凤凰”。\n\n伍德是一位华尔街人物，履历令人印象深刻，曾任西尔斯负责人，也是“美国优先”运动的主要成员。他的背景和人脉很可能使他为这一角色做好了充分准备。\n\n而获胜者是……"
 new_usa_an_USA_the_goldstar_federation_event.1.a: "约翰·奥比茨"
 new_usa_an_USA_the_goldstar_federation_event.1.b: "罗伯特·E·伍德"

 new_usa_the_eagle_flies_alone_event.1.t: "[FROM.GetNameDefCap]着手确保对美洲的霸权"
 new_usa_the_eagle_flies_alone_event.1.desc: "[FROM.GetAdjective]政府已开始就其在整个美洲的完全绝对主导地位发出信号，宣布其意志是在整个半球实行绝对统治。在这些声明之后，他们直接向[ROOT.GetAdjective]政府和领导层发出信号，要求我们服从他们的控制和权威，否则后果自负。"
 new_usa_the_eagle_flies_alone_event.1.a: "我们将承认他们的权威"
 new_usa_the_eagle_flies_alone_event.1.b: "我们不会屈服"
 new_usa_the_eagle_flies_alone_event.2.t: "[FROM.GetNameDefCap]承认我们的权威"
 new_usa_the_eagle_flies_alone_event.2.desc: "[FROM.GetAdjective]国家已正式公开承认我们作为西方霸主的地位，他们已同意我们就贸易、工业合作和联合安全向他们发送的条款。"
 new_usa_the_eagle_flies_alone_event.2.a: "太好了"
 new_usa_the_eagle_flies_alone_event.3.t: "[FROM.GetNameDefCap]拒绝我们的要求"
 new_usa_the_eagle_flies_alone_event.3.desc: "[FROM.GetAdjective]国家违抗了我们，声称他们拒绝屈服于[ROOT.GetAdjective]的压力，宁愿战斗以维持其现状。"
 new_usa_the_eagle_flies_alone_event.3.a: "他们逃不出我们的手心"
 new_usa_the_eagle_flies_alone_event.3.b: "我们会记住这一点"

 usa_new_an_song_for_the_horizon_event.1.t: "[FROM.GetNameDefCap]宣布“伟大天定命运”的意图"
 usa_new_an_song_for_the_horizon_event.1.desc: "\n[FROM.GetAdjective]政府宣布了一项新倡议。他们所谓的“地平线之歌”，显然将见证[FROM.GetAdjective]人民将其影响力和统治扩展到全世界。这在实践中究竟意味着什么还有待观察。\n\n[ENG.GetAdjective]、[GER.GetAdjective]、[JAP.GetAdjective]、[SOV.GetAdjective]及其他政府已作出不同程度的惊愕、不屑或谴责回应，各国领导人已开始为这一可能的新威胁寻求先发制人的解决方案。\n\n如果美国人是认真的，他们的歌可能成为一场新的、更大冲突的颂歌。"
 usa_new_an_song_for_the_horizon_event.1.a: "上马！"
 usa_new_an_song_for_the_horizon_event.1.b: "上帝帮助我们所有人……"

