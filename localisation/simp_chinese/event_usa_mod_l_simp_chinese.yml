 new_usa_an_peace_guarantees_for_neighbors_event.1.t: "[From.GetNameDefCap]希望建立相互和平安排"
 new_usa_an_peace_guarantees_for_neighbors_event.1.desc: "[from.GetAdjective]政府已向我们传达了一份信息，涉及其在自身周围建立一圈和平的意图。美国人似乎希望与其周边邻国达成一项合作与友好的相互条约，这无疑是由于他们近期的动荡。"
 new_usa_an_peace_guarantees_for_neighbors_event.1.a: "让我们维持和平"
 new_usa_an_peace_guarantees_for_neighbors_event.1.b: "我们不信任他们"
 new_usa_an_peace_guarantees_for_neighbors_event.2.t: "[From.GetNameDefCap]同意相互和平协议"
 new_usa_an_peace_guarantees_for_neighbors_event.2.desc: "[from.GetAdjective]政府已同意与我们建立一系列和平协议。这将有助于确保美国人民的持续安全与繁荣。"
 new_usa_an_peace_guarantees_for_neighbors_event.2.a: "太好了"
 new_usa_an_peace_guarantees_for_neighbors_event.3.t: "[From.GetNameDefCap]拒绝相互和平协议"
 new_usa_an_peace_guarantees_for_neighbors_event.3.desc: "令人不安的是，[From.GetAdjective]政府拒绝了我们的相互和平协议提议。这对未来意味着什么尚不清楚，但我们可能得小心提防。"
 new_usa_an_peace_guarantees_for_neighbors_event.3.a: "这可能是个问题"

 new_usa_an_the_philadelphia_fiasco_event.1.t: "费城惨败"
 new_usa_an_the_philadelphia_fiasco_event.1.desc: "在[GetDateText]，费城新建的安布尔顿剧院屋顶坍塌，造成72名美国人死亡，另有40人受伤。这场悲剧发生后，地方和州官员立即开始调查建造这座剧院的公共工程项目。该项目由数十名国会议员资助，涉及城市公园开发、补贴和救济资金，并包括剧院和一座新桥的建设。然而，经过更深入的调查，发现原本指定用于项目不同部分的数百万美元中，绝大多数从未见光。此外，能够追踪到的大量资金被发现最终流入了商人、职员、官员，甚至与组织者关系密切的其他国会议员的口袋。然而，最引发愤怒的一点是，发现本应用于剧院建设的大量资源被挪用或截留，并且通过“过于慷慨”地盖章批准各种安全法规，其工期被大大加快。\n\n换句话说，腐败的联邦官员让他们的贪婪肆意横行，现在已有100多名美国人为这种腐败付出了代价。"
 new_usa_an_the_philadelphia_fiasco_event.1.a: "我们的领导人都是蠢货和骗子！"

 usa_new_an_parkerite_act_event.1.t: "美国批准第22修正案"
 usa_new_an_parkerite_act_event.1.desc: "在多年不可靠的治理以及近期归因于联邦政府普遍腐败的悲剧之后，美国正式批准了《帕克主义法案》，即宪法第22修正案。\n该法案为联邦各州规定了多项新权利。最引人注目的是，它赋予各州对其管辖范围内所有联邦项目和联邦资金的权威否决权。此外，在州内采取的所有联邦行动都须接受该州的全面检查和透明监督，该州还可以相应地对项目进行附加或修改。\n\n实际上，《帕克主义法案》将极大地改变美国的政府权力平衡。"
 usa_new_an_parkerite_act_event.1.a: "人民掌控一切"
 usa_new_an_parkerite_act_event.1.b: "有趣"

 usa_new_an_civil_war_event.1.t: "第二次美国内战"
 usa_new_an_civil_war_event.1.d: "今天早些时候，联邦多个州同时提交了正式的脱离通知。在弗吉尼亚州里士满的一栋联排别墅中，来自这些州的代表齐聚一堂，签署了一份已经酝酿数月的文件，正式宣布成立一个新的国家并对其表示支持。十几名代表自称“自由美洲国家”，随后将这份文件的一份副本直接带到了华盛顿特区的美国国会大厦。然而，抵达后，代表们全部被捕，国会召开特别会议，仅剩那些留下的州参加。数小时内，美国对自由美洲国家宣战。\n\n战争现已降临这片土地，我们正遭受攻击。我们竭尽全力让联邦政府保持和平，不愿将其击垮，但现在它来找我们了！他们的背叛和腐败没有止境。然而，这并未让我们感到意外——我们清楚知道他们的回应会是什么样子。对他们不幸的是，我们一直在准备。"
 usa_new_an_civil_war_event.1.a: "为了共和国！"
 usa_new_an_civil_war_event.1.a.tt: "民主支持者发动内战。"
 usa_new_an_civil_war_event.2.t: "第二次美国内战"
 usa_new_an_civil_war_event.2.desc: "昨天早些时候，战斗在美国各地爆发，集中在南北之间旧有的分歧上。美国境内的美国民族主义者再次脱离，联邦政府对此宣战。\n\n主要战斗发生在大陆各地的城市中心，武装公民在主要城市和县、两岸、南北、社区内外爆发冲突。军事力量已分裂到对立的政府之间。"
 usa_new_an_civil_war_event.2.a: "不要再来了……"
 usa_new_an_civil_war_event.2.b: "至少他们知道为何而战"
 usa_new_an_civil_war_event.2.c: "又来了？"
 usa_new_an_civil_war_event.3.t: "金色黎明"
 usa_new_an_civil_war_event.3.desc: "随着旧美国政府的最终投降，[USA.GetNameDef]在内战的灰烬中崛起取而代之。这场战争给整个大陆带来了可怕的破坏，目前据报道有数十万甚至更多的人失踪或死亡。\n\n这将如何影响国家的前进方向尚待观察，但似乎各州已从联邦政府手中夺取了权力的缰绳。"
 usa_new_an_civil_war_event.3.a: "希望这不会成为问题"
 usa_new_an_civil_war_event.3.b: "明白"
 usa_new_an_civil_war_event.4.t: "美国民族主义者在美洲被击败"
 usa_new_an_civil_war_event.4.desc: "在一次令人瞩目的转折中，饱受困扰的美国政府和军队成功平息了这次第二次脱离尝试。血腥内战后数千人死亡，但国家现在终于能够再次走自己的道路。"
 usa_new_an_civil_war_event.4.a: "明白"
 usa_new_an_civil_war_event.5.t: "[USA.GetNameDef]的崛起"
 usa_new_an_civil_war_event.5.desc: "\n在大萧条带来的政治动荡之后，美国已将其主要权力所在地从中央联邦政府转移到各州。80年前邦联未能做到的事，各州和华盛顿特区的新政府现在已经完成了。"
 usa_new_an_civil_war_event.5.a: "啊……"
 usa_new_an_civil_war_event.5.b: "明白"

 new_usa_an_americas_rightful_claims_event.1.t: "[FROM.GetNameDefCap]要求吞并我们"
 new_usa_an_americas_rightful_claims_event.1.desc: "[FROM.GetAdjective]政府通过我们在美国的大使馆向我们发出了最后通牒。他们声称[THIS.GetNameDefCap]及其领土属于美国人民的合法要求。他们还表明，他们完全愿意支持这些要求。\n\n我们该如何回应？"
 new_usa_an_americas_rightful_claims_event.1.a: "我们别无选择"
 new_usa_an_americas_rightful_claims_event.1.b: "我们将坚守立场"
 new_usa_an_americas_rightful_claims_event.2.t: "[FROM.GetNameDefCap]接受我们的吞并要求"
 new_usa_an_americas_rightful_claims_event.2.desc: "[FROM.GetAdjective]政府已接受我们对其领土的要求，并将其政府完全交给我们。"
 new_usa_an_americas_rightful_claims_event.2.a: "太好了"
 new_usa_an_americas_rightful_claims_event.3.t: "[FROM.GetNameDefCap]拒绝我们的要求"
 new_usa_an_americas_rightful_claims_event.3.desc: "[FROM.GetAdjective]政府拒绝了我们对他们领土的要求，并进一步回应称，他们愿意冒与[THIS.getName]开战的风险来捍卫其主权。"
 new_usa_an_americas_rightful_claims_event.3.a: "我们不为所动"
 new_usa_an_americas_rightful_claims_event.3.b: "时机不对"
 new_usa_an_americas_rightful_claims_event.3.c: "也许我们太贪心了"
 new_usa_an_americas_rightful_claims_event.4.t: "[FROM.GetNameDefCap]要求我们臣服"
 new_usa_an_americas_rightful_claims_event.4.desc: "[FROM.GetAdjective]政府通过我们在美国的大使馆向我们发出了最后通牒。他们声称[THIS.GetNameDefCap]及其领土属于美国人民的合法要求。他们还表明，他们完全愿意支持这些要求。\n\n我们该如何回应？"
 new_usa_an_americas_rightful_claims_event.4.a: "我们别无选择"
 new_usa_an_americas_rightful_claims_event.4.b: "我们将坚守立场"
 new_usa_an_americas_rightful_claims_event.5.t: "[FROM.GetNameDefCap]接受我们的臣服要求"
 new_usa_an_americas_rightful_claims_event.5.desc: "[FROM.GetAdjective]政府已接受我们对其领土的要求，并将其政府完全交给我们。"
 new_usa_an_americas_rightful_claims_event.5.a: "太好了"
 new_usa_an_americas_rightful_claims_event.6.t: "[FROM.GetNameDefCap]拒绝我们的要求"
 new_usa_an_americas_rightful_claims_event.6.desc: "[FROM.GetAdjective]政府拒绝了我们对他们领土的要求，并进一步回应称，他们愿意冒与[THIS.getName]开战的风险来捍卫其主权。"
 new_usa_an_americas_rightful_claims_event.6.a: "我们不为所动"
 new_usa_an_americas_rightful_claims_event.6.b: "时机不对"
 new_usa_an_americas_rightful_claims_event.6.c: "也许我们太贪心了"

 new_usa_an_americas_rightful_claims_event.7.t: "[FROM.GetNameDefCap]要求吞并我们的美洲领土"
 new_usa_an_americas_rightful_claims_event.7.desc: "[FROM.GetAdjective]政府通过我们在美国的大使馆向我们发出了最后通牒。他们声称我们在美洲的领土属于美国人民的合法要求，并且他们还表明，如有必要，他们完全愿意以武力支持这些要求。\n\n我们该如何回应？"
 new_usa_an_americas_rightful_claims_event.7.a: "避免战争是明智的"
 new_usa_an_americas_rightful_claims_event.7.b: "他们不知道自己的位置"
 new_usa_an_americas_rightful_claims_event.8.t: "[FROM.GetNameDefCap]交出他们的美洲领土"
 new_usa_an_americas_rightful_claims_event.8.desc: "[FROM.GetAdjective]政府已接受我们对其领土的要求，并将其完全交给我们。"
 new_usa_an_americas_rightful_claims_event.8.a: "太好了"
 new_usa_an_americas_rightful_claims_event.9.t: "[FROM.GetNameDefCap]拒绝我们的要求"
 new_usa_an_americas_rightful_claims_event.9.desc: "[FROM.GetAdjective]政府拒绝了我们对他们美洲领土的要求，并表示如果我们继续施压，他们完全愿意教训我们。"
 new_usa_an_americas_rightful_claims_event.9.a: "我们将给旧世界上课"
 new_usa_an_americas_rightful_claims_event.9.b: "我们措辞错了"
 new_usa_an_americas_rightful_claims_event.9.c: "他们是对的……"
