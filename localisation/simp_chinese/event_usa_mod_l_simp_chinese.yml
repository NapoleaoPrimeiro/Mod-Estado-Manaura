l_simp_chinese:
# DEMOCRATIC & SHARED
 new_usa_pacify_mexican_turmoil.1.t: "[USA.GetNameDefCap]要求我们成为其保护国"
 new_usa_pacify_mexican_turmoil.1.desc: "[USA.GetLeader]总统已召见我国大使，转交美国政府的系列要求。其中包括赋予[USA.GetAdjective]大使特别协商权。实际上，这些权利将使[USA.GetAdjective]政府对我们作出的任何决定拥有否决权。\n\n照会称，若我方拒绝，[USA.GetAdjective]政府将被迫“采取其认为必要的措施以保障国家安全”。"
 new_usa_pacify_mexican_turmoil.1.a: "我们必须接受这不可接受的条件，以避免流血冲突。"
 new_usa_pacify_mexican_turmoil.1.b: "绝不！"
 new_usa_pacify_mexican_turmoil.2.t: "[MEX.GetLeader]接受"
 new_usa_pacify_mexican_turmoil.2.desc: "[MEX.GetLeader]政府意识到其处境的绝望，已接受我们的提议，并同意在任何重大政策决定前征求我方意见。"
 new_usa_pacify_mexican_turmoil.2.a: "天命昭彰。"
 new_usa_pacify_mexican_turmoil.3.t: "[MEX.GetLeader]拒绝"
 new_usa_pacify_mexican_turmoil.3.desc: "在长篇大论的演讲中，[MEX.GetLeader]回顾了历代墨西哥人在面对“赤裸裸的美国侵略”时的英勇事迹，拒绝考虑我方请求，并告知我国大使，墨西哥人民永远不会向外国入侵者低头。"
 new_usa_pacify_mexican_turmoil.3.a: "无关紧要——天命自当奋进向前！"
 new_usa_pacify_mexican_turmoil.3.b: "战争目前不符合我们的最大利益。"

 new_usa_preempt_a_southern_invasion.1.t: "[USA.GetNameDefCap]要求外交政策控制权"
 new_usa_preempt_a_southern_invasion.1.desc: "[USA.GetAdjective]大使转交了[USA.GetLeader]总统的照会，告知我们其政府期望我们在未来的任何外交政策决定中征求他们的意见，“以维护我们两国之间的持续和平与友好”。"
 new_usa_preempt_a_southern_invasion.1.a: "我们别无选择。"
 new_usa_preempt_a_southern_invasion.1.b: "我们将坚定立场！"
 new_usa_preempt_a_southern_invasion.2.t: "[From.GetNameDefCap]接受臣服"
 new_usa_preempt_a_southern_invasion.2.desc: "[From.GetLeader]政府已同意我们的要求，将允许我方大使对他们作出的任何重大政策决定拥有否决权。"
 new_usa_preempt_a_southern_invasion.2.a: "明智的选择。"
 new_usa_preempt_a_southern_invasion.3.t: "[From.GetNameDefCap]拒绝"
 new_usa_preempt_a_southern_invasion.3.desc: "[From.GetLeader]对我们的外交照会反应极为震惊。在他的答复中，他宣称[From.GetNameDef]拥有悠久而自豪的独立和主权历史，永远不会允许外国势力将自己的意志强加于他们。\n\n他进一步恳请[USA.GetLeader]总统考虑就此问题发动战争的后果，这必将使[USA.GetNameDef]被贴上和平最大威胁的标签，并带来难以想象的后果。"
 new_usa_preempt_a_southern_invasion.3.a: "如此孱弱之人竟敢口出狂言。"
 new_usa_preempt_a_southern_invasion.3.b: "也许他是对的。"

 new_usa_central_american_bastion.1.t: "[USA.GetNameDefCap]要求必要臣服"
 new_usa_central_american_bastion.1.desc: "[USA.GetAdjective]大使转交了[USA.GetLeader]总统的照会，要求我们立即将外交政策控制权移交给[USA.GetNameDefCap]，否则将面临[USA.GetAdjective]军队的必要攻击。"
 new_usa_central_american_bastion.1.a: "我们别无选择。"
 new_usa_central_american_bastion.1.b: "我们将坚定立场。"
 new_usa_central_american_bastion.2.t: "[From.GetNameDefCap]接受臣服"
 new_usa_central_american_bastion.2.desc: "[From.GetLeader]政府已同意我们的要求，将使其政府服从于我们。"
 new_usa_central_american_bastion.2.a: "明智的选择。"
 new_usa_central_american_bastion.3.t: "[From.GetNameDefCap]拒绝"
 new_usa_central_american_bastion.3.desc: "[From.GetLeader]对我们的外交照会反应极为震惊。在他的答复中，他宣称[From.GetNameDef]拥有悠久而自豪的独立和主权历史，永远不会允许外国势力将自己的意志强加于他们。\n\n他进一步恳请[USA.GetLeader]总统考虑就此问题发动战争的后果，这必将使[USA.GetNameDef]被贴上和平最大威胁的标签，并带来难以想象的后果。"
 new_usa_central_american_bastion.3.a: "如此孱弱之人竟敢口出狂言。"
 new_usa_central_american_bastion.3.b: "也许我们做得太过分了。"

 new_usa_dominate_south_america.1.t: "[USA.GetNameDefCap]要求必要臣服"
 new_usa_dominate_south_america.1.desc: "[USA.GetAdjective]大使转交了[USA.GetLeader]总统的照会，要求我们立即将外交政策控制权移交给[USA.GetNameDefCap]，否则将面临[USA.GetAdjective]军队的必要攻击。"
 new_usa_dominate_south_america.1.a: "我们别无选择。"
 new_usa_dominate_south_america.1.b: "我们将坚定立场。"
 new_usa_dominate_south_america.2.t: "[From.GetNameDefCap]接受臣服"
 new_usa_dominate_south_america.2.desc: "[From.GetLeader]政府已同意我们的要求，将使其政府服从于我们。"
 new_usa_dominate_south_america.2.a: "明智的选择。"
 new_usa_dominate_south_america.3.t: "[From.GetNameDefCap]拒绝"
 new_usa_dominate_south_america.3.desc: "[From.GetLeader]对我们的外交照会反应极为震惊。在他的答复中，他宣称[From.GetNameDef]拥有悠久而自豪的独立和主权历史，永远不会允许外国势力将自己的意志强加于他们。\n\n他进一步恳请[USA.GetLeader]总统考虑就此问题发动战争的后果，这必将使[USA.GetNameDef]被贴上和平最大威胁的标签，并带来难以想象的后果。"
 new_usa_dominate_south_america.3.a: "如此孱弱之人竟敢口出狂言。"
 new_usa_dominate_south_america.3.b: "也许我们做得太过分了。"

 new_usa_bribe_the_canadian_government.1.t: "[USA.GetAdjective]政府为走廊提供付款"
 new_usa_bribe_the_canadian_government.1.desc: "[USA.GetNameDefCap]已发送消息称，他们愿意将大量经济产出注入我国，以换取割让将美国本土与阿拉斯加分隔开的加拿大走廊。如果我们选择接受，我们将获得大量资源。"
 new_usa_bribe_the_canadian_government.1.a: "这是公平的提议"
 new_usa_bribe_the_canadian_government.1.b: "诱人，但我们不会出卖我们的土地"
 new_usa_bribe_the_canadian_government.2.t: "[FROM.GetNameDefCap]同意"
 new_usa_bribe_the_canadian_government.2.desc: "[FROM.GetAdjective]政府已同意放弃对走廊的控制。"
 new_usa_bribe_the_canadian_government.2.a: "确实是一次极好的交易！"
 new_usa_bribe_the_canadian_government.3.t: "[FROM.GetNameDefCap]拒绝受贿"
 new_usa_bribe_the_canadian_government.3.desc: "[FROM.GetAdjective]政府拒绝了我们慷慨的提议。"
 new_usa_bribe_the_canadian_government.3.a: "值得一试"

 new_usa_secure_corridor.1.t: "[USA.GetNameDefCap]要求走廊控制权"
 new_usa_secure_corridor.1.desc: "[USA.GetNameDefCap]通过安全渠道发送了一份措辞强硬的讯息，要求我们立即交出加拿大走廊内的所有领土。讯息称，如果不放弃控制权，[USA.GetAdjective]政府将被迫采取更激烈的措施以确保自身安全。"
 new_usa_secure_corridor.1.a: "不值得为此麻烦。我们会服从。"
 new_usa_secure_corridor.1.b: "我们不会不战而放弃土地！"
 new_usa_secure_corridor.2.t: "[FROM.GetNameDefCap]同意交出走廊"
 new_usa_secure_corridor.2.desc: "在收到我们的讯息后不久，[FROM.GetAdjective]政府迅速回复，强调希望继续维持两国之间的和平。即刻生效，他们对走廊的控制权将移交给我们，以换取不再发生进一步冲突的保证。"
 new_usa_secure_corridor.2.a: "简单、轻松，不流血。"
 new_usa_secure_corridor.3.t: "[FROM.GetNameDefCap]拒绝交出走廊控制权"
 new_usa_secure_corridor.3.desc: "[FROM.GetAdjective]政府断然拒绝了我们的姿态，并明确表示任何侵犯其领土主权的企图都将遭到武力回应。他们的答复恳切希望不要制造更多冲突，强调希望维持两国之间的和平关系，并希望这一事件能就此平息，不再引发进一步的纷争。"
 new_usa_secure_corridor.3.a: "我们会让他们见识见识什么是纷争。"
 new_usa_secure_corridor.3.b: "我们做得太过分了。"

 new_usa_bargain_canada.1.t: "[USA.GetNameDefCap]提议购买[CAN.GetNameDefCap]"
 new_usa_bargain_canada.1.desc: "[USA.GetAdjective]特使转达了总统的消息，称[USA.GetNameDefCap]正在认真考虑提出购买[CAN.GetNameDefCap]的提议，并愿意为此支付相当可观的金额。如果[ENG.GetAdjective]政府同意这笔交易，所得回报将物超所值。"
 new_usa_bargain_canada.1.a: "批准交易"
 new_usa_bargain_canada.1.b: "婉拒提议"
 new_usa_bargain_canada.2.t: "[FROM.GetNameDefCap]同意交易[CAN.GetNameDefCap]"
 new_usa_bargain_canada.2.desc: "我们已收到[FROM.GetAdjective]政府的确认，我方购买[CAN.GetNameDefCap]的提议已获批准！"
 new_usa_bargain_canada.2.a: "太好了！"
 new_usa_bargain_canada.3.t: "[FROM.GetNameDefCap]拒绝交易"
 new_usa_bargain_canada.3.desc: "不幸的是，我方从[FROM.GetNameDefCap]购买[CAN.GetNameDefCap]的提议已被迅速但礼貌地拒绝。确认函还明确表示，[FROM.GetAdjective]方面重视与我们合作，并希望无论交易是否达成，合作都能继续。"
 new_usa_bargain_canada.3.a: "至少他们没有失礼"

 new_usa_buy_newfoundland.1.t: "[USA.GetNameDefCap]提议购买纽芬兰"
 new_usa_buy_newfoundland.1.desc: "在获得加拿大后，[USA.GetAdjective]政府再次前来提议购买纽芬兰和拉布拉多地区，以确保大陆的完整。"
 new_usa_buy_newfoundland.1.a: "也好"
 new_usa_buy_newfoundland.1.b: "我们会保留它"
 new_usa_buy_newfoundland.2.t: "[FROM.GetNameDefCap]同意向我们出售纽芬兰"
 new_usa_buy_newfoundland.2.desc: "[FROM.GetNameDefCap]已同意我们的最终条款，进一步购买加拿大剩余的领土。"
 new_usa_buy_newfoundland.2.a: "北美是我们的了"
 new_usa_buy_newfoundland.3.t: "[FROM.GetNameDefCap]拒绝了我们的最后请求"
 new_usa_buy_newfoundland.3.desc: "不幸的是，我方从[FROM.GetNameDefCap]购买纽芬兰的提议已被迅速但礼貌地拒绝。确认函还明确表示，[FROM.GetAdjective]方面重视与我们合作，并希望无论交易是否达成，合作都能继续。"
 new_usa_buy_newfoundland.3.a: "遗憾"


 new_usa_conquer_north.1.b.tt: "§Y[FROM.GetNameDefCap]§!可能立即§R宣战！§!"
 new_usa_conquer_north.1.t: "[FROM.GetNameDefCap]要求立即臣服"
 new_usa_conquer_north.1.desc: "[FROM.GetAdjective]政府向我国首都发出要求，要求我国立即向其臣服。这一赤裸裸的威胁似乎有充分的武力支持，因为要求中包括各种潜在目标的示例，显示[FROM.GetAdjective]军队在被迫使用武力时计划首先打击的目标。\n\n我们如何回应？"
 new_usa_conquer_north.1.a: "毫无希望……"
 new_usa_conquer_north.1.b: "如果他们想要战斗，那就让他们得到战斗！"
 new_usa_conquer_north.2.t: "[FROM.GetNameDefCap]已接受我们的要求"
 new_usa_conquer_north.2.desc: "就在几分钟前，消息传来，[FROM.GetAdjective]政府已默许我们的要求，并宣布自己接受我们的直接监督。"
 new_usa_conquer_north.2.a: "完美"
 new_usa_conquer_north.3.t: "[FROM.GetNameDefCap]拒绝臣服"
 new_usa_conquer_north.3.desc: "在一场既可笑又勇敢的表演中，[FROM.GetAdjective]政府公开拒绝了我们的温和要求。然而，他们应该明白，这些要求并非凭空提出，我们打算贯彻到底。战争不是我们的首选，但现在是我们唯一的选择。"
 new_usa_conquer_north.3.a: "他们知道自己在做什么"
 new_usa_conquer_north.3.b: "他们以为我们在虚张声势……"


 new_usa_carribean.1.t: "[FROM.GetNameDefCap]要求融入[FROM.GetAdjective]势力范围"
 new_usa_carribean.1.desc: "[FROM.GetNameDefCap]公开对我国的领土提出主张，声称为了促进共同繁荣并防止对[FROM.GetAdjective]领土的可能攻击，必须将我国的外交政策牢牢纳入其势力范围。\n\n我们应如何回应？"
 new_usa_carribean.1.a: "顺从更容易"
 new_usa_carribean.1.b: "我们不会被欺负"
 new_usa_carribean.2.t: "[FROM.GetNameDefCap]同意进入我方势力范围"
 new_usa_carribean.2.desc: "我们收到[FROM.GetAdjective]大使馆的消息，即刻起[FROM.GetAdjective]政府将所有外交政策事项提交我方审查和批准，从而有效地将其牢牢纳入[THIS.GetAdjective]势力范围。"
 new_usa_carribean.2.a: "简单容易"
 new_usa_carribean.3.t: "[FROM.GetNameDefCap]拒绝我们的要求"
 new_usa_carribean.3.desc: "不幸的是，[FROM.GetAdjective]政府似乎决定不遵从我们的要求，不会加入我方势力范围。虽然他们已经做出了决定，但我们现在也必须做出回应。\n\n入侵的威胁仍然存在吗？"
 new_usa_carribean.3.a: "我们必须坚持到底"
 new_usa_carribean.3.b: "没关系，没有他们我们也能过得很好"

 new_usa_london_treaty.1.a.tt: "§Y解放我们在美洲中部和南部的殖民地§!。"
 new_usa_london_treaty.1.t: "[FROM.GetNameDefCap]邀请我们签署伦敦条约"
 new_usa_london_treaty.1.desc: "[FROM.GetAdjective]政府提出了一项宏伟提议，要一劳永逸地将加勒比和南美洲从欧洲殖民主义中解放出来。在会上，[FROM.GetAdjective]外交官慷慨激昂地讲述了自决对他们西半球人民的重大意义，以及我们两国已经有足够多的顾虑，不必涉足维持全球联系的事务，尤其是当[FROM.GetNameDefCap]已承担起维护该地区和平与安全的责任时。如果我们签署条约，我们在美洲的属地将被解放。"
 new_usa_london_treaty.1.a: "美洲的自由早已应得"
 new_usa_london_treaty.1.b: "我们的利益支持在那里的持续存在"
 new_usa_london_treaty.2.t: "[FROM.GetNameDefCap]已签署伦敦条约"
 new_usa_london_treaty.2.desc: "经过反复交涉，出席会议的[FROM.GetAdjective]外交官最终同意签署条约，在其西部领土建立自由共和国。自由的光辉日子！"
 new_usa_london_treaty.2.a: "外交运作"
 new_usa_london_treaty.3.t: "[FROM.GetNameDefCap]拒绝签署伦敦条约"
 new_usa_london_treaty.3.desc: "尽管我们努力争取仍参与新世界事务的大国，[FROM.GetNameDefCap]仍未同意解放其属地。然而，关系保持冷静，尚未恶化。也许还有时间争取他们。"
 new_usa_london_treaty.3.a: "如果我们让他们觉得值得呢？"
 new_usa_london_treaty.3.b: "没用"
 new_usa_london_treaty.4.t: "[FROM.GetNameDefCap]提议付款以签署条约"
 new_usa_london_treaty.4.desc: "尚未放弃，[FROM.GetAdjective]首席外交官向我们提出提议，愿意支付费用以换取我们解放在新世界的属地。如果我们签署伦敦条约，他们承诺为此慷慨付款。"
 new_usa_london_treaty.4.a: "这才是一笔值得做的交易"
 new_usa_london_treaty.4.b: "诱人，但我们的属地太重要了"
 new_usa_london_treaty.5.t: "[FROM.GetNameDefCap]同意以付款换取签署"
 new_usa_london_treaty.5.desc: "我们的外交斡旋取得了回报，我们终于成功获得了[FROM.GetAdjective]外交官的签名。虽然我们不得不为此投入一些资源，但美洲现在更加自由了。"
 new_usa_london_treaty.5.a: "终于"
 new_usa_london_treaty.6.t: "[FROM.GetNameDefCap]仍然拒绝签署"
 new_usa_london_treaty.6.desc: "尽管一切都已表明，[FROM.GetAdjective]外交官仍然拒绝签署伦敦条约。我们必须接受他们的影响将继续留在美洲的事实。"
 new_usa_london_treaty.6.a: "遗憾"
 new_usa_london_treaty.6.b: "不，这还没完……"

 new_usa_shield_pan.1.t: "[FROM.GetNameDefCap]请求直接参与保护运河"
 new_usa_shield_pan.1.desc: "[FROM.GetNameDefCap]通过一名军事武官给我们寄来了一封信，请求我们与他们建立紧密联盟，帮助他们保护巴拿马运河。作为交换，我们将获得财政支持和军事援助。"
 new_usa_shield_pan.1.a: "这符合我们的利益"
 new_usa_shield_pan.1.b: "我们宁愿保持主权"
 new_usa_shield_pan.2.t: "[FROM.GetNameDefCap]已同意我们的请求"
 new_usa_shield_pan.2.desc: "今天上午早些时候，我们收到了[FROM.GetAdjective]政府的官方公报，通知我们联合防御运河和加强国家间关系的提议已被接受。"
 new_usa_shield_pan.2.a: "太好了"
 new_usa_shield_pan.3.t: "[FROM.GetNameDefCap]拒绝我们的请求"
 new_usa_shield_pan.3.desc: "我们收到[FROM.GetAdjective]政府的消息，我方关于建立紧密伙伴关系以保卫巴拿马运河的请求已被拒绝。分歧似乎集中在对方担心失去对自己国家的控制。"
 new_usa_shield_pan.3.a: "我们只能自己去确保它了"
 new_usa_shield_pan.3.b: "运河的安全太重要了"

 new_usa_monroe_neutrality.1.t: "[FROM.GetNameDefCap]请求和平承诺"
 new_usa_monroe_neutrality.1.desc: "我方[FROM.GetAdjective]大使馆转达了一份新协议，[FROM.GetAdjective]总统已向[CAN.GetName]、[MEX.GetName]和欧洲列强发出，请求签署一份继续维持两国和平的承诺书，并承诺尊重美洲的独立。"
 new_usa_monroe_neutrality.1.a: "我们将签署它"
 new_usa_monroe_neutrality.1.b: "这听起来像是一种威胁"
 new_usa_monroe_neutrality.2.t: "[FROM.GetNameDefCap]签署协议"
 new_usa_monroe_neutrality.2.desc: "[FROM.GetAdjective]驻首都的首席外交官刚刚向我们国务部长转交了我们几天前向他们发出的条约的签署副本。看来我们与[FROM.GetNameDefCap]时代的和平应该有了保障。"
 new_usa_monroe_neutrality.2.a: "太好了"
 new_usa_monroe_neutrality.3.t: "[FROM.GetNameDefCap]拒绝签署协议"
 new_usa_monroe_neutrality.3.desc: "无论我们的信息被误解了，还是[FROM.GetAdjective]政府确实有伤害我们的计划，我们与[FROM.GetNameDefCap]的和平协议已被断然拒绝。这对我们与他们未来的外交关系意味着什么尚不清楚。"
 new_usa_monroe_neutrality.3.a: "我们的敌人暴露了"

 new_usa_american_alliance.1.t: "[FROM.GetNameDefCap]邀请我们加入美洲安全联盟"
 new_usa_american_alliance.1.desc: "[FROM.GetNameDefCap]派遣了其顶级外交官通知我们，他们正在建立一个以美洲防御为重点的军事联盟，并希望[THIS.GetNameDefCap]加入，与[FROM.GetAdjective]势力范围团结一致。"
 new_usa_american_alliance.1.a: "这是确保安全的必要步骤"
 new_usa_american_alliance.1.b: "我们不会向[FROM.GetName]效忠"
 new_usa_american_alliance.2.t: "[FROM.GetNameDefCap]加入美洲安全联盟"
 new_usa_american_alliance.2.desc: "随着[FROM.GetNameDefCap]加入美洲安全联盟，我们在整个大陆投射力量的能力得到了极大的增强。更多的盟友和同样关注安全的伙伴意味着任何潜在的敌人将需要面对我们所有人的联合力量。"
 new_usa_american_alliance.2.a: "太好了"
 new_usa_american_alliance.3.t: "[FROM.GetNameDefCap]拒绝加入美洲安全联盟"
 new_usa_american_alliance.3.desc: "尚不清楚是傲慢还是恶意，但无论出于何种原因，[FROM.GetName]拒绝了我们加入美洲安全联盟的邀请。这不仅是一次外交上的羞辱，也是决定我们国家安全命运时需要认真考虑的一个严重问题。一个看不到参与我们共同防御有任何好处的本地国家，很容易在将来成为一个威胁。"
 new_usa_american_alliance.3.a: "令人不安"

 new_usa_vigilance_pact.1.t: "[FROM.GetNameDefCap]邀请我们加入洲际警戒条约"
 new_usa_vigilance_pact.1.desc: "我方[FROM.GetAdjective]大使馆收到消息，[FROM.GetNameDefCap]已发起建立一个正式的合作军事联盟，旨在动员美洲各国共同防御。"
 new_usa_vigilance_pact.1.a: "我们将加入这个条约"
 new_usa_vigilance_pact.1.b: "他们可以有自己的小条约"
 new_usa_vigilance_pact.2.t: "[FROM.GetNameDefCap]加入洲际警戒条约"
 new_usa_vigilance_pact.2.desc: "我们刚刚收到驻[FROM.GetName]大使馆的消息，[FROM.GetAdjective]政府已正式确认接受我们邀请加入IVP，并已宣布支持该条约。随着他们正式加入我们的共同防御条约，我们松了一口气，因为我们知道我们有更多的朋友站在我们这边。"
 new_usa_vigilance_pact.2.a: "听到这消息太好了"
 new_usa_vigilance_pact.3.t: "[FROM.GetNameDefCap]拒绝加入洲际警戒条约"
 new_usa_vigilance_pact.3.desc: "在一个不太令人意外的举动中，[FROM.GetAdjective]政府承认了我们的新军事联盟，但拒绝与我们合作。虽然这确实削弱了条约的一些潜在实力，但也许从长远来看，这反而是最好的结果，因为其凝聚力不必依赖于像[FROM.GetNameDefCap]这样决心动摇的成员。"
 new_usa_vigilance_pact.3.a: "没关系"

 new_usa_purchase_gap.1.t: "[FROM.GetNameDefCap]提议购买加拿大走廊"
 new_usa_purchase_gap.1.desc: "[FROM.GetAdjective]政府向我们发出了一个不错的提议，愿意以可观的价格购买西部走廊。我们的合作似乎让他们以为可以随便从我们这里买地。……他们可以吗？也许这是一笔好交易。"
 new_usa_purchase_gap.1.a: "这是一笔值得的交易"
 new_usa_purchase_gap.1.b: "感谢提议，但我们不感兴趣"
 new_usa_purchase_gap.2.t: "[FROM.GetName]同意出售加拿大走廊"
 new_usa_purchase_gap.2.desc: "我方从[FROM.GetNameDefCap]购买加拿大走廊的提议已收到并被接受。即刻生效，西部缺口现在归美国所有。美国在大陆上的领土终于完全连成一片了。"
 new_usa_purchase_gap.2.a: "太好了！"
 new_usa_purchase_gap.3.t: "[FROM.GetNameDefCap]拒绝我们购买西部缺口的提议"
 new_usa_purchase_gap.3.desc: "不幸的是，我们购买加拿大走廊的外交和经济策略似乎没有得到回应。虽然这次交易今天不会成功，但也许将来会有机会再次出现。在那之前，我们可以继续与[FROM.GetAdjective]政府保持友好关系。"
 new_usa_purchase_gap.3.a: "遗憾"

 new_usa_purchase_holdovers.1.a.tt: "§Y出售我们在美洲中部和南部的殖民地§!。"
 new_usa_purchase_holdovers.1.t: "[FROM.GetNameDefCap]提议购买我们的美洲殖民地"
 new_usa_purchase_holdovers.1.desc: "[FROM.GetAdjective]政府提议购买我们在美洲剩余的殖民地。他们出价很高。然而，我们的殖民地并不是可以随意丢弃的筹码。任何放弃它们的决定都必须经过深思熟虑。"
 new_usa_purchase_holdovers.1.a: "我们接受这笔交易"
 new_usa_purchase_holdovers.1.b: "我们还没准备好放弃它们"
 new_usa_purchase_holdovers.2.t: "[FROM.GetNameDefCap]已同意将其美洲属地转让给我们"
 new_usa_purchase_holdovers.2.desc: "[FROM.GetNameDefCap]在美洲的殖民地不再受欧洲列强的桎梏，这是自由的美好一天。终于，这些地区与旧世界分离了。"
 new_usa_purchase_holdovers.2.a: "太好了"
 new_usa_purchase_holdovers.3.t: "[FROM.GetNameDefCap]拒绝交易"
 new_usa_purchase_holdovers.3.desc: "虽然我们希望购买[FROM.GetAdjective]在美洲最后的殖民地，但我们将不得不在其他时间寻找其他机会。"
 new_usa_purchase_holdovers.3.a: "遗憾"

 new_usa_econ_1.2.t: "经济复苏政策"
 new_usa_econ_1.2.desc: "随着国家经济开始复苏，我们需要决定如何推进。政府是否应干预经济以使其尽快恢复运转，还是应退后一步，尽力让经济自然复苏？"
 new_usa_econ_1.2.a: "自然复苏"
 new_usa_econ_1.2.a.tt: "将致力于完成§Y$USA_natural_recovery$§!国策。\n\n§Y此国策将促进增长，但耗时更长。§!"
 #new_usa_econ_1.2.a.tt_2: "完成时间：§Y399§!天\n§Y效果§!：\n 每日政治点数消耗：§G-0.45§!\n 资源获取效率：§G+40.0%§!\n 可征召人口系数：§G+30.0%§!\n 消费品工厂系数：§Y-10.0%§!\n 稳定度：§G+5.0%§!\n 战争支持度：§G+5.0%§!\n 建造速度：§G+5.0%§!\n 生产"
 new_usa_econ_1.2.b: "加速复苏"
 new_usa_econ_1.2.b.tt: "将致力于完成§Y$USA_accelerated_recovery$§!国策。\n\n§Y此国策将高效且快速。§!"

 new_usa_econ_2.2.t: "经济增长政策"
 new_usa_econ_2.2.desc: "国家经济正在快速有效复苏，不久将恢复昔日的辉煌。我们是让其继续沿着当前道路发展，还是采取战略干预措施以使其更快达标？"
 new_usa_econ_2.2.a: "自由市场之鹰"
 new_usa_econ_2.2.a.tt: "将致力于完成§Y$USA_eagle_of_the_free_market$§!国策。\n\n§Y此国策将最大化增长，但耗时极长！§!"
 new_usa_econ_2.2.b: "及时干预"
 new_usa_econ_2.2.b.tt: "将致力于完成§Y$USA_timely_intervention$§!国策。\n\n§Y此国策将非常强大且完成速度更快。§!"

 error_debug.1.t: "出了点问题"
 error_debug.1.desc: "哎呀"
 error_debug.2.a: "哎哟"
 debug.1.t: "调试"
 debug.1.desc: "此事件已被触发以标记某个连续性节点。"
 debug.1.a: "收到"

 debug.2.t: "[FROM.GetName]发送至[ROOT.GetName]"
 debug.2.desc: "好"
 debug.2.a: "太好了"

 new_usa_new_world_market.1.t: "[FROM.GetNameDefCap]邀请我们加入新世界市场体系"
 new_usa_new_world_market.1.desc: "我们被邀请加入[FROM.GetName]的经济条约，该条约将鼓励相互贸易和经济合作。如果我们加入，可以期待对联盟的任何投资都能获得丰厚回报。"
 new_usa_new_world_market.1.a: "这是值得的努力"
 new_usa_new_world_market.1.b: "承诺于此并不明智"
 new_usa_new_world_market.2.t: "[FROM.GetNameDefCap]加入新世界市场体系"
 new_usa_new_world_market.2.desc: "我们刚刚收到我方[FROM.GetAdjective]大使的消息，[FROM.GetNameDefCap]已选择加入这个新的经济圈。这将如何塑造未来尚待观察。"
 new_usa_new_world_market.2.a: "太棒了"
 new_usa_new_world_market.3.t: "[FROM.GetNameDefCap]拒绝加入新世界市场体系"
 new_usa_new_world_market.3.desc: "不幸的是，[FROM.GetNameDefCap]已决定加入我们新的经济条约目前不符合其利益。"
 new_usa_new_world_market.3.a: "太可惜了"

 new_usa_continental_citadel.1.t: "[FROM.GetNameDefCap]邀请我们加入大陆堡垒联盟"
 new_usa_continental_citadel.1.desc: "[FROM.GetNameDefCap]已发出邀请，参与一项名为“大陆堡垒联盟”的联合军事防御倡议，以试图保护西半球免受外部威胁。如果我们加入，可以期待我们的军事工业获得一些可观的提升。"
 new_usa_continental_citadel.1.a: "这符合我们的利益"
 new_usa_continental_citadel.1.b: "我们不会加入"
 new_usa_continental_citadel.2.t: "[FROM.GetNameDefCap]加入大陆堡垒联盟"
 new_usa_continental_citadel.2.desc: "我们刚刚收到我方[FROM.GetAdjective]大使的消息，[FROM.GetNameDefCap]已选择加入这个新的防御圈。这将如何塑造未来尚待观察。"
 new_usa_continental_citadel.2.a: "太好了"
 new_usa_continental_citadel.3.t: "[FROM.GetNameDefCap]拒绝加入大陆堡垒联盟"
 new_usa_continental_citadel.3.desc: "不幸的是，[FROM.GetNameDefCap]已决定加入我们新的军事防御条约目前不符合其利益。"
 new_usa_continental_citadel.3.a: "这不太理想"


 new_usa_acquire_pacific_territories.0.t: "我们选择购买还是宣称？"
 new_usa_acquire_pacific_territories.0.desc: "当我们联系那些拥有我们目标大洋洲领土的国家时，我们是试图购买这些土地还是对其提出主权要求？"
 new_usa_acquire_pacific_territories.0.a: "我们将购买它们"
 new_usa_acquire_pacific_territories.0.b: "我们将要求它们"
 new_usa_acquire_pacific_territories.1.t: "[FROM.GetNameDefCap]提议购买我们的大洋洲领土"
 new_usa_acquire_pacific_territories.1.desc: "[FROM.GetNameDefCap]已联系我方政府，提议购买我们在澳大拉西亚地区拥有的领土。[FROM.GetAdjective]驻[ROOT.GetName]大使强调，其政府对将影响力扩展到太平洋地区非常感兴趣，并将购买我们在那里的岛屿视为[FROM.GetNameDef]的高度优先投资。\n如果我们同意转让土地，他们将慷慨支付。然而，这意味着要放弃在太平洋的重要影响力。\n\n我们的回应是什么？"
 new_usa_acquire_pacific_territories.1.a: "这笔交易符合我们的利益。"
 new_usa_acquire_pacific_territories.1.b: "这是一笔不公平的交易。"
 new_usa_acquire_pacific_territories.2.t: "[FROM.GetNameDefCap]同意出售大洋洲属地"
 new_usa_acquire_pacific_territories.2.desc: "我们刚刚收到确认，[FROM.GetNameDefCap]已接受我方购买其大洋洲地区领土的提议。有了这些新属地，[THIS.GetAdjective]的影响力将进一步扩散到太平洋彼岸。"
 new_usa_acquire_pacific_territories.2.a: "完美"
 new_usa_acquire_pacific_territories.3.t: "[FROM.GetNameDefCap]拒绝出售大洋洲属地"
 new_usa_acquire_pacific_territories.3.desc: "[FROM.GetNameDefCap]拒绝了我们购买其太平洋岛屿领土的提议。幸运的是，这个提议是友好提出的，因此预计他们的这一决定不会导致外交破裂。现状得以维持，尽管[THIS.GetName]未能从中获益。"
 new_usa_acquire_pacific_territories.3.a: "遗憾"
 new_usa_acquire_pacific_territories.4.t: "[FROM.GetNameDefCap]要求转让大洋洲领土"
 new_usa_acquire_pacific_territories.4.desc: "[FROM.GetNameDefCap]向[THIS.GetAdjective]政府发表声明，要求我们割让在大洋洲和太平洋的殖民地，以保护其势力范围。这是一个异常咄咄逼人的政府做出的鲁莽要求。"
 new_usa_acquire_pacific_territories.4.a: "与他们为敌并不明智"
 new_usa_acquire_pacific_territories.4.b: "这些只是空头威胁"
 new_usa_acquire_pacific_territories.5.t: "[FROM.GetNameDefCap]割让大洋洲领土"
 new_usa_acquire_pacific_territories.5.desc: "[FROM.GetAdjective]政府已同意我们的要求，并交出了他们在太平洋的属地。这些割让使我们更加强大。"
 new_usa_acquire_pacific_territories.5.a: "他们做出了正确的选择"
 new_usa_acquire_pacific_territories.6.t: "[FROM.GetNameDefCap]拒绝割让领土"
 new_usa_acquire_pacific_territories.6.desc: "在一次公然的违抗行为中，[FROM.GetAdjective]政府选择无视我们的要求，公开拒绝将其太平洋属地割让给我们。然而，我们已经明确表达了在这一问题上的立场，我们确实可能会卷土重来。"
 new_usa_acquire_pacific_territories.6.a: "他们不知道自己做了什么"

 new_usa_liberty_over_east_asia.1.t: "[FROM.GetNameDefCap]要求控制我们的外交政策"
 new_usa_liberty_over_east_asia.1.desc: "我方政府刚刚接待了来自[FROM.GetNameDefCap]的特使，通知我们他们正在推行一项名为“亚洲自由”的新政策，作为该政策的一部分，他们要求控制我们的外交政策。尽管表述是和平的，甚至有些古雅，但几位部长不禁注意到[FROM.GetAdjective]外交官使用的并非那么微妙的潜台词。似乎他们对与我们谈判这一点并不特别感兴趣，而是要求立即生效的政策转变。"
 new_usa_liberty_over_east_asia.1.a: "也许这样最好"
 new_usa_liberty_over_east_asia.1.b: "这种鲁莽的手段不会动摇我们！"
 new_usa_liberty_over_east_asia.2.t: "[FROM.GetNameDefCap]移交外交政策控制权"
 new_usa_liberty_over_east_asia.2.desc: "[FROM.GetAdjective]政府已就我们的新外交政策立场向我方特使提交了回应，回应是完全接受我们在该地区的外交追求。[FROM.GetNameDefCap]的外交政策体系现已处于我们的监督之下。"
 new_usa_liberty_over_east_asia.2.a: "太好了，这将有助于确保我们的共同繁荣"
 new_usa_liberty_over_east_asia.3.t: "[FROM.GetNameDefCap]拒绝向我们提交外交政策控制权"
 new_usa_liberty_over_east_asia.3.desc: "[FROM.GetAdjective]政府对我方外交代表团的回应是惩罚性地拒绝了我们关于共同繁荣的慷慨提议，并拒绝继续谈判。现在摆在我们面前的只有一条路——我们必须通过武力将自由扩展到他们那里。"
 new_usa_liberty_over_east_asia.3.a: "那就通过武力扩展吧"
 new_usa_liberty_over_east_asia.3.b: "我们可能做得太过分了"
 new_usa_liberty_over_east_asia.4.t: "[USA.GetNameDefCap]要求对[FROM.GetNameDefCap]的统治权"
 new_usa_liberty_over_east_asia.4.desc: "一个[USA.GetAdjective]代表团通知我方政府，[USA.GetNameDefCap]已将确保东亚和太平洋地区作为新的外交政策目标。在这一追求中，他们的目标是获得我们目前对[FROM.GetNameDefCap]保持的外交政策控制权。尽管代表团使用了华丽和合作的措辞，强调了一般安全与繁荣的要点，并大谈自由，但我们的部长们不禁对他们传达中奇怪的侵略性潜台词感到不安。看来他们的政府正在以武力追求这一目标，因此如果我们不让步，他们很可能诉诸武力。"
 new_usa_liberty_over_east_asia.4.a: "我们应该与美国保持良好关系"
 new_usa_liberty_over_east_asia.4.b: "这是一个显而易见的虚张声势"
 new_usa_liberty_over_east_asia.5.t: "[FROM.GetNameDefCap]割让东亚国家的外交政策控制权"
 new_usa_liberty_over_east_asia.5.desc: "我方派往[FROM.GetAdjective]政府的代表团成功将其一个亚洲傀儡国的控制权转让给了我们。这是确保我们在太平洋霸权的一大步。"
 new_usa_liberty_over_east_asia.5.a: "太好了！"
 new_usa_liberty_over_east_asia.6.t: "[FROM.GetNameDefCap]拒绝割让外交政策权利"
 new_usa_liberty_over_east_asia.6.desc: "通过[FROM.GetAdjective]政府的这一严厉拒绝，我们必须预料到我们在东亚追求自由的进程将不得不与他们的政策相冲突。不幸的是，这一举动很可能随之而来的是冲突。"
 new_usa_liberty_over_east_asia.6.a: "他们阻止不了我们"
 new_usa_liberty_over_east_asia.6.b: "我们高估了自己的筹码……"

 new_usa_cross_pacific_alliance.1.t: "[FROM.GetNameDefCap]邀请我们加入跨太平洋条约"
 new_usa_cross_pacific_alliance.1.desc: "我们从几位不同的[FROM.GetAdjective]大使那里收到消息，[FROM.GetNameDefCap]希望与[THIS.GetNameDefCap]及其盟友签订经济和防御条约。显然，他们相信我们两国之间存在的紧张关系已经缓和，他们对我们的尊重是显而易见的。应该注意的是，接受这一提议将极大地改变我们目前的地缘战略地位。我们应如何回应？"
 new_usa_cross_pacific_alliance.1.a: "我们没有理由不这样做！"
 new_usa_cross_pacific_alliance.1.b: "目前不，不了"
 new_usa_cross_pacific_alliance.2.t: "[FROM.GetNameDefCap]同意与我们签订条约"
 new_usa_cross_pacific_alliance.2.desc: "我方在华盛顿的[FROM.GetAdjective]外交官已确认[FROM.GetName]政府已接受我们关于两国及其盟友之间相互经济和防御条约的提议。这对西方来说是伟大的一天！"
 new_usa_cross_pacific_alliance.2.a: "太棒了！"
 new_usa_cross_pacific_alliance.3.t: "[FROM.GetNameDefCap]拒绝与我们签订条约"
 new_usa_cross_pacific_alliance.3.desc: "不幸的是，尽管我方驻东京的外交官尽了最大努力，[FROM.GetAdjective]政府还是礼貌地拒绝了我们关于两国之间相互经济和防御条约的提议。"
 new_usa_cross_pacific_alliance.3.a: "确实遗憾"

 new_usa_protect_the_pacific.1.t: "[FROM.GetNameDefCap]请求使用战略基础设施"
 new_usa_protect_the_pacific.1.desc: "[FROM.GetNameDefCap]已采取保护太平洋的战略，为追求这一政策，他们请求使用我们的海军基地和机场。[FROM.GetAdjective]外交官强调他们意图提高其舰队在太平洋航道巡逻以打击敌对势力的能力，旨在保护航运和基础设施。"
 new_usa_protect_the_pacific.1.a: "这对我们也有利"
 new_usa_protect_the_pacific.1.b: "我们的基础设施不是向任何人开放的"
 new_usa_protect_the_pacific.2.t: "[FROM.GetNameDefCap]同意提供战略基础设施使用权限"
 new_usa_protect_the_pacific.2.desc: "[FROM.GetAdjective]政府已同意我方请求，允许我们使用其军事和航运基础设施。随着这些新点被添加到地图上，我们海军巡逻的范围和有效性将得到提高。"
 new_usa_protect_the_pacific.2.a: "太好了"
 new_usa_protect_the_pacific.3.t: "[FROM.GetNameDefCap]拒绝提供基地使用权限"
 new_usa_protect_the_pacific.3.desc: "尽管我们向他们陈述了理由，[FROM.GetAdjective]政府仍未同意向我们提供战略基础设施的使用权限。虽然这对我们两国未来的关系不是好兆头，但这仍然只是一个小挫折，不应影响我们的战略态势。"
 new_usa_protect_the_pacific.3.a: "哦好吧"

 new_usa_the_firestar_project.1.t: "美国提议资助我们的战争努力"
 new_usa_the_firestar_project.1.desc: "[FROM.GetNameDefCap]已向我国政府提出了一个非常诱人的提议：作为允许其文化影响进入我国的交换，美国将向我军供应大量武器，并用现代化设备和生产方法加强我们的军事工业。如果我们接受这笔交易，我们的战争将等于胜利，但随之而来的将是一些相当深刻的文化入侵。这值得吗？"
 new_usa_the_firestar_project.1.a: "当然"
 new_usa_the_firestar_project.1.b: "这不值得"
 new_usa_the_firestar_project.2.t: "[FROM.GetNameDefCap]已接受我们的援助"
 new_usa_the_firestar_project.2.desc: "[FROM.GetAdjective]政府已接受我们在其防御战争中的物质和智力援助。下一步是开始向他们提供真正大量的资金和武器，并非常积极地参与援助他们的战争努力。我们的希望是，这些努力也将有助于将美国文化和理想渗透到中国，并在那里引发类似的情绪，一旦这场战争结束，这些情绪就会蓬勃发展。"
 new_usa_the_firestar_project.2.a: "太好了"
 new_usa_the_firestar_project.3.t: "[FROM.GetNameDefCap]拒绝我们的援助"
 new_usa_the_firestar_project.3.desc: "尽管我们尽力强调了接受援助的有用性和智慧，[FROM.GetAdjective]政府还是拒绝了我们的援助提议。我们只能祝愿他们在战争中一切顺利，希望他们能尽可能好地度过难关。"
 new_usa_the_firestar_project.3.a: "希望他们能撑住"

 new_usa_alliance_with_a_united_china.1.t: "[FROM.GetNameDefCap]提议龙鹰条约"
 new_usa_alliance_with_a_united_china.1.desc: "[FROM.GetNameDefCap]提议我们两国建立正式军事联盟，这将赋予我们相对于世界其他地区的战略优势，确保美国对整个西半球的控制，并确保我们对整个中国领土的主权。这个提议相当大胆和广泛，但也相当诱人。"
 new_usa_alliance_with_a_united_china.1.a: "中国接受[FROM.GetName]为盟友"
 new_usa_alliance_with_a_united_china.1.b: "多么愚蠢的建议"
 new_usa_alliance_with_a_united_china.2.t: "[FROM.GetNameDefCap]已签署条约"
 new_usa_alliance_with_a_united_china.2.desc: "在这一天，[FROM.GetNameDefCap]和[ROOT.GetNameDefCap]之间建立了一个新的震撼世界的联盟。通过这项条约，我们两国将确保对整个西半球的完全地缘战略控制，确保相互保护，并为我们两国打开共享彼此全部经济、人口、军事等力量的大门。"
 new_usa_alliance_with_a_united_china.2.a: "完美"
 new_usa_alliance_with_a_united_china.3.t: "[FROM.GetNameDefCap]拒绝签署条约"
 new_usa_alliance_with_a_united_china.3.desc: "我们尽我们所能向[FROM.GetAdjective]政府提出了诱人的提议，但看来我们的努力白费了。"
 new_usa_alliance_with_a_united_china.3.a: "遗憾……"
 new_usa_alliance_with_a_united_china.0.t: "[USA.GetNameDefCap]和[FROM.GetNameDefCap]结成龙鹰联盟"
 new_usa_alliance_with_a_united_china.0.desc: "今天华盛顿传来了令人震惊的消息。[USA.GetNameDefCap]和[FROM.GetNameDefCap]之间建立了一个新的军事联盟，引发了关于美国在世界上的地位及其外交政策最终目标的问题。\n\n这一新条约将带来什么尚待观察，但世界各地政府的官员们并未对事态发展保持沉默，纷纷表达了普遍的失望。"
 new_usa_alliance_with_a_united_china.0.a: "我明白了"

 new_usa_promote_peace.1.t: "[FROM.GetNameDefCap]要求我们签署持久和平宣言"
 new_usa_promote_peace.1.desc: "[FROM.GetAdjective]政府起草了一系列关于国家外交政策行为的条款，并已分发给欧洲各国。总的来说，它们实际上要求欧洲国家承诺与邻国和平与相互合作，宣言的总体基调是不惜一切代价避免另一场世界大战。虽然签署将使我们与美国保持良好关系，但也将严重限制我们动员国家的任何努力。"
 new_usa_promote_peace.1.a: "我们支持和平"
 new_usa_promote_peace.1.b: "这只是毫无意义的理想主义"
 new_usa_promote_peace.2.t: "[FROM.GetNameDefCap]签署持久和平宣言"
 new_usa_promote_peace.2.desc: "[FROM.GetNameDefCap]已在宣言上正式签署，向我们和邻国保证他们打算在地缘政治中保持仁慈和友好的态度。这是维护世界和平的一步。"
 new_usa_promote_peace.2.a: "这是美好的一天"
 new_usa_promote_peace.3.t: "[FROM.GetNameDefCap]拒绝签署持久和平宣言"
 new_usa_promote_peace.3.desc: "随着拒绝签署宣言成为公开知识，[FROM.GetNameDefCap]正在明确表示它对世界没有和平意图，可能对美国本身也是如此。"
 new_usa_promote_peace.3.a: "他们想要冲突吗？"

 new_usa_overwhelming_material_support.1.t: "[FROM.GetNameDefCap]提议提供压倒性物质支持"
 new_usa_overwhelming_material_support.1.desc: "[FROM.GetAdjective]政府提议通过向我们提供其战争生产者和工厂生产的很大一部分来支持我们的冲突。被看作是在向他们求助可能不太好看，但我们肯定可以利用这个经济红利。"
 new_usa_overwhelming_material_support.1.a: "我们接受"
 new_usa_overwhelming_material_support.1.b: "我们可以自己处理战斗"
 new_usa_overwhelming_material_support.2.t: "[FROM.GetNameDefCap]接受我们的支持"
 new_usa_overwhelming_material_support.2.desc: "我们的顾问已经安排了飞往西伯利亚的航班，以支持[FROM.GetAdjective]进一步发展其战争工业。希望在这段伙伴关系的过程中，我们能够帮助他们与我们达成共识。"
 new_usa_overwhelming_material_support.2.a: "让我们看看这会如何发展"
 new_usa_overwhelming_material_support.3.t: "[FROM.GetNameDefCap]拒绝我们的支持"
 new_usa_overwhelming_material_support.3.desc: "并不太出人意料的是，[FROM.GetNameDefCap]拒绝了我们在其战争经济发展中提供帮助的提议。他们表示完全掌握了自己的战争努力，不需要我们的帮助。"
 new_usa_overwhelming_material_support.3.a: "好吧"

 new_usa_new_deal_1.2.t: "新政政策"
 new_usa_new_deal_1.2.desc: "随着国家经济开始复苏，我们需要决定如何推进。我们是强力推行新政并贯彻其理念，还是仅将其作为指导方针？"
 new_usa_new_deal_1.2.a: "公平劳动标准法"
 new_usa_new_deal_1.2.a.tt: "将致力于完成§Y$USA_new_fair_labour_standards_act$§!国策。\n\n§Y此国策符合历史走向，将缓解危机。§!"
 new_usa_new_deal_1.2.b: "工会防御法"
 new_usa_new_deal_1.2.b.tt: "将致力于完成§Y$USA_union_defense_act$§!国策。\n\n§Y此国策将更具争议性，但也将更有效。§!"

 new_usa_new_deal_2.2.t: "新政政策"
 new_usa_new_deal_2.2.desc: "国家经济正在快速有效复苏，不久将恢复昔日的辉煌。我们是推行立法为无家可归者建造新居，还是推行立法放宽建设限制并促进建设？"
 new_usa_new_deal_2.2.a: "联邦住房法"
 new_usa_new_deal_2.2.a.tt: "将致力于完成§Y$USA_new_federal_housing_act$§!国策。\n\n§Y此国策符合历史走向，将为美国人民提供保障。§!"
 new_usa_new_deal_2.2.b: "联邦区划改革"
 new_usa_new_deal_2.2.b.tt: "将致力于完成§Y$USA_federal_zoning_reform$§!国策。\n\n§Y此国策将优先考虑集中发展。§!"

 new_usa_gold_standard_1.2.t: "资金政策"
 new_usa_gold_standard_1.2.desc: "随着国家经济开始复苏，我们需要决定如何推进。我们应当维持较高的进口关税以刺激国内市场增长，还是利用庞大的军队来提供就业和工程项目？"
 new_usa_gold_standard_1.2.a: "保护主义关税"
 new_usa_gold_standard_1.2.a.tt: "将致力于完成§Y$USA_new_protectionist_tariffs$§!国策。\n\n§Y此国策将优先考虑经济复苏。§!"
 new_usa_gold_standard_1.2.b: "枪炮与铁锹"
 new_usa_gold_standard_1.2.b.tt: "将致力于完成§Y$USA_guns_and_shovels$§!国策。\n\n§Y此国策将通过军事就业让美国人重返工作岗位。§!"

 new_usa_gold_standard_2.2.t: "收入政策"
 new_usa_gold_standard_2.2.desc: "国家经济正在快速有效复苏，不久将恢复昔日的辉煌。是减轻公民的财政负担并改革所得税更好，还是改善军人的薪酬和养老金制度更好？"
 new_usa_gold_standard_2.2.a: "所得税改革"
 new_usa_gold_standard_2.2.a.tt: "将致力于完成§Y$USA_new_income_tax_reform$§!国策。\n\n§Y此国策将带来健康的经济。§!"
 new_usa_gold_standard_2.2.b: "军人养老金"
 new_usa_gold_standard_2.2.b.tt: "将致力于完成§Y$USA_military_pensions$§!国策。\n\n§Y此国策将引导经济复苏向军事发展倾斜。§!"

 new_usa_war_is_business.1.t: "[FROM.GetNameDefCap]提供军事支持特别贸易协议"
 new_usa_war_is_business.1.desc: "[FROM.GetAdjective]政府已派遣特使至其驻我国首都的大使馆，向我方政府转达一项独特的贸易协议，以支持和加强我们的军事、国防和战争努力。特使们为我们的高层内阁和各部门成员携带了礼物，行为相当公开。[FROM.GetAdjective]政府的提议本应低调进行——这是一项军事工业合作伙伴关系，将使[ROOT.GetNameDefCap]几乎完全获得[FROM.GetNameDefCap]的武器生产能力。他们将获得经济利益，而我们将在军队效率的各个方面受益。"
 new_usa_war_is_business.1.a: "接受提议"
 new_usa_war_is_business.1.b: "目前暂不接受"
 new_usa_war_is_business.2.t: "[FROM.GetNameDefCap]接受我们的初步提议"
 new_usa_war_is_business.2.desc: "[FROM.GetNameDefCap]已向我方驻其首都的大使馆发回消息，正式接受我们的初步合作提议。"
 new_usa_war_is_business.2.a: "就这样开始了……"
 new_usa_war_is_business.3.t: "[FROM.GetNameDefCap]拒绝我们的初步提议"
 new_usa_war_is_business.3.desc: "我们巧妙的言辞和广泛的承诺及提议这次未能说服[FROM.GetAdjective]政府。"
 new_usa_war_is_business.3.a: "我们可以等……"

 new_usa_army_auto_focus_select.1.t: "美国陆军应专注于什么？"
 new_usa_army_auto_focus_select.1.desc: "随着陆军扩编并迎接新的挑战，我们需要确定发展重点放在何处。"
 new_usa_army_auto_focus_select.1.a: "全面改善陆军"
 new_usa_army_auto_focus_select.1.a_tt: "这将相当昂贵"
 new_usa_army_auto_focus_select.1.b: "投资军官团"
 new_usa_army_auto_focus_select.1.b_tt: "我们将培养领导层"
 new_usa_army_auto_focus_select.1.c: "关注普通士兵"
 new_usa_army_auto_focus_select.1.c_tt: "我们将保持陆军的中坚力量强大"

 new_usa_propose_canadian_unification.1.t: "[FROM.GetNameDefCap]提议[FROM.GetName]与[THIS.GetName]统一"
 new_usa_propose_canadian_unification.1.desc: "[FROM.GetAdjective]政府已向我方政府转达了一项关于两国联合治理和北美国家统一的提议。我们两国有着相当相似的文化遗产，彼此非常友好，经济上也相互依存。我们两国的广泛统一将带来各种好处，尽管这意味着我们将丧失自身的主权。"
 new_usa_propose_canadian_unification.1.a: "让我们联合起来！"
 new_usa_propose_canadian_unification.1.b: "不了谢谢，我们宁愿保持独立"
 new_usa_propose_canadian_unification.2.t: "[FROM.GetNameDefCap]接受统一"
 new_usa_propose_canadian_unification.2.desc: "[FROM.GetNameDefCap]已向我方驻其首都的大使馆发回消息，正式接受我们的国家统一提议！"
 new_usa_propose_canadian_unification.2.a: "太好了！"
 new_usa_propose_canadian_unification.3.t: "[FROM.GetNameDefCap]拒绝我们的国家统一提议"
 new_usa_propose_canadian_unification.3.desc: "尽管未接受我们的提议，[FROM.GetAdjective]政府仍向我们伸出了感谢和祝福的姿态，并招待我方外交使团参加了国宴，强调他们有兴趣继续推进双方的友好关系。"
 new_usa_propose_canadian_unification.3.a: "至少他们态度不错"

 # 民族主义共产主义
 new_usa_nc_secure_peace_guarantees_event.1.t: "[FROM.GetNameDefCap]请求和平保障"
 new_usa_nc_secure_peace_guarantees_event.1.desc: "[FROM.GetAdjective]政府已邀请我方外交代表团参加会议，会上他们请求我们两国签订正式互不侵犯条约。[FROM.GetAdjective]政府着重强调他们自身保持和平的意图，并尽力避免卷入正在全球迅速蔓延的泥潭。他们只要求我们尊重他们的和平意愿，通过承诺尊重其主权来让他们安心。"
 new_usa_nc_secure_peace_guarantees_event.1.a: "让我们为和平签约"
 new_usa_nc_secure_peace_guarantees_event.1.b: "我们另有打算"
 new_usa_nc_secure_peace_guarantees_event.2.t: "[FROM.GetNameDefCap]签署互不侵犯条约"
 new_usa_nc_secure_peace_guarantees_event.2.desc: "[FROM.GetNameDefCap]已向我方驻其首都的大使馆发回消息，正式接受我们两国签订互不侵犯条约的请求。"
 new_usa_nc_secure_peace_guarantees_event.2.a: "太好了！"
 new_usa_nc_secure_peace_guarantees_event.3.t: "[FROM.GetNameDefCap]拒绝签署互不侵犯条约"
 new_usa_nc_secure_peace_guarantees_event.3.desc: "我方与[FROM.GetAdjective]外交官会晤的代表团非常沮丧和不安地发现，[FROM.GetName]似乎对与我们缔结和平承诺并不热衷。"
 new_usa_nc_secure_peace_guarantees_event.3.a: "确实令人不安"

 new_usa_nc_the_whiskey_jay_compatriot_event.1.t: "[FROM.GetNameDefCap]请求我们融入其势力范围"
 new_usa_nc_the_whiskey_jay_compatriot_event.1.desc: "[FROM.GetAdjective]政府提议我们加入其势力范围，同时接受其共产主义倾向。"
 new_usa_nc_the_whiskey_jay_compatriot_event.1.a: "好主意！"
 new_usa_nc_the_whiskey_jay_compatriot_event.1.b: "让他们自求多福"
 new_usa_nc_the_whiskey_jay_compatriot_event.2.t: "[FROM.GetNameDefCap]加入[THIS.GetNameDefCap]"
 new_usa_nc_the_whiskey_jay_compatriot_event.2.desc: "[FROM.GetNameDefCap]已向我方驻其首都的大使馆发回消息，正式接受我方邀请，加入我方的势力范围。"
 new_usa_nc_the_whiskey_jay_compatriot_event.2.a: "太好了！"
 new_usa_nc_the_whiskey_jay_compatriot_event.3.t: "[FROM.GetNameDefCap]拒绝加入我方"
 new_usa_nc_the_whiskey_jay_compatriot_event.3.desc: "[FROM.GetAdjective]政府拒绝回应其人民和自由本身的召唤。只剩一条路可走了！"
 new_usa_nc_the_whiskey_jay_compatriot_event.3.a: "自由必须主宰一切！"

 new_usa_southern_crisis_1.2.t: "我们民族性格的问题"
 new_usa_southern_crisis_1.2.desc: "美国正在复苏之路上，她的人民重拾了活力，大陆也再次开始站稳脚跟。然而，当我们从大萧条的灰烬中崛起时，我们发现眼前的泥泞已被拭去。美国的命运前所未有地清晰展现在我们面前，而她将走上哪条道路的问题如今已可供辩论。一方面，美国可以被引向完全自力更生的道路，脱离并挣脱世界其他地方的束缚，准备好兑现她的承诺并稳固她的地位。另一方面，我们已从虚假的历史潮流和外国影响中解脱——美国是否应反而将头抬高到最高的山峰之上，将目光投向地平线之外，挺身而出，从废墟中夺回属于自己的命运？每一扇门都已敞开，道路就在我们面前。"
 new_usa_southern_crisis_1.2.a: "新边疆的愿景"
 new_usa_southern_crisis_1.2.a.tt: "将致力于完成§Y$USA_visions_of_a_new_frontier$§!国策。\n\n§Y这条道路将引导美国走向自主自给自足§!"
 new_usa_southern_crisis_1.2.b: "一个新美国"
 new_usa_southern_crisis_1.2.b.tt: "将致力于完成§Y$USA_a_new_america$§!国策。\n\n§Y这将使我们走上一条冲突之路，很可能引发§!§R内战§!§Y！§!"

 new_usa_nc_red_july_1.2.t: "我们如何从大萧条中复苏？"
 new_usa_nc_red_july_1.2.desc: "显然，当今国家的现行政策辜负了美国人民，改变方向势在必行。然而，需要多大程度的改变尚不明确。我们应当推行社会主义政策来帮助数百万被大萧条压垮的苦难人民，还是应当摒弃最初导致股市崩盘的贪婪方式，寻求一个更进步的理想国？"
 new_usa_nc_red_july_1.2.a: "代表制改革"
 new_usa_nc_red_july_1.2.a.tt: "将致力于完成§Y$USA_representation_reform$§!国策。\n\n§Y此路径将引导美国走向更社会主义的发展方向。§!"
 new_usa_nc_red_july_1.2.b: "财产改革"
 new_usa_nc_red_july_1.2.b.tt: "将致力于完成§Y$USA_property_reform$§!国策。\n\n§Y这将走向共产主义道路，很可能会引发§!§R内战§!§Y！§!"

 usa_new_nc_civil_war_event.1.t: "第二次美国内战"
 usa_new_nc_civil_war_event.1.d: "今天早些时候，国会召开了特别会议。其目的简单而明确：彻底取缔美利坚合众国内的共产主义。许多参议员和众议员公开宣称，必须立即平息我们境内的红色威胁，不能任其继续恶化，任何宣扬其信条者都必须被罚款或监禁。议事进程进展迅速，但或许辩论中最引人注目的是完全没有任何辩论可言；数十名不赞成的代表全部缺席，均已前往纽约市参加临时国会会议。\n\n会议在仓促重新布置的萨沃伊舞厅举行，来自全国各地的参议员和众议员讨论了新国家政府的细节。显然战争即将来临，在场的政治家、领袖和军官迅速为统一战线做准备。\n\n两场会议开始仅数小时后，前者结束并立即宣布进入紧急状态，调动国民警卫队和军队取缔纽约国会。作为回应，全国各地忠诚的民族主义共产主义者已在预先准备好的部队中动员起来，抵御这一威胁。\n\n第二次美国内战即将来临。"
 usa_new_nc_civil_war_event.1.a: "为了人民！"
 usa_new_nc_civil_war_event.1.a.tt: "民主支持者发动内战。"
 usa_new_nc_civil_war_event.2.t: "罗斯福出任代理领袖"
 usa_new_nc_civil_war_event.2.desc: "罗斯福一直是该国政治精英中的长期成员，也是人民真正的朋友。他反复展示了为人民权利、自由和幸福而对抗敌对的大利益集团的意愿，尽管他许多更宏大的措施已被反动保守派否决。\n\n然而，随着战争的爆发，他在某种程度上变得不愿公开代表我们的理想，也不愿为此与同胞作战。虽然这可以理解，但也可能在未来成为问题。尽管如此，我们仍有选择保留他作为政府首脑和美国人民首席代表的选项。"
 usa_new_nc_civil_war_event.2.a: "保留罗斯福"
 usa_new_nc_civil_war_event.2.b: "他太温和了"
 usa_new_nc_civil_war_event.4.t: "第二次美国内战"
#usa_new_nc_civil_war_event.4.desc: "昨天早些时候，美国各地爆发了战斗，集中在马里兰州和纽约州周围的新英格兰地区。美国境内的民族主义共产主义者已起兵反抗既有的民主政府，联邦政府已向他们及其意识形态宣战。\n\n大规模战斗正在全大陆的城市中心进行，武装公民在主要城市和各县之间爆发小规模冲突，从东西海岸到南北各地，在社区内外都有发生。军队已在敌对政府之间分裂。\n\n从最初的旁观者报告来看，民族主义共产主义者（其政府目前总部设在纽约市的萨沃伊舞厅）为这场战斗准备的时间比正统政府更长，因此预计革命者实际上可能在这场冲突中占据上风。"
 usa_new_nc_civil_war_event.4.desc: "昨天早些时候，美国各地爆发了战斗，集中在马里兰州和纽约州周围的新英格兰地区。美国境内的民族主义共产主义者已起兵反抗既有的民主政府，联邦政府已向他们及其意识形态宣战。\n\n大规模战斗正在全大陆的城市中心进行，武装公民在主要城市和各县之间爆发小规模冲突，从东西海岸到南北各地，在社区内外都有发生。军队已在敌对政府之间分裂。\n\n从最初的旁观者报告来看，民族主义共产主义者（其政府目前总部设在纽约市的萨沃伊舞厅）为这场战斗准备的时间比正统政府更长，因此预计革命者实际上可能在这场冲突中占据上风。"
 usa_new_nc_civil_war_event.4.a: "新世界正受到威胁……"
 usa_new_nc_civil_war_event.4.b: "愿人民的声音被听到"
 usa_new_nc_civil_war_event.4.c: "令人不安"
 usa_new_nc_civil_war_event.5.t: "红色七月"
 usa_new_nc_civil_war_event.5.desc: "随着旧美国政府的最终投降，[USA.GetNameDef]从内战的灰烬中崛起取而代之。战争在美洲大陆造成了可怕的破坏，据报道有数万甚至数十万人失踪或死亡。这将对国家未来的发展产生何种影响尚待观察，但似乎红色七月已经降临美国，民族主义共产主义者已执掌大权。"
 usa_new_nc_civil_war_event.5.a: "已了解"
 usa_new_nc_civil_war_event.6.t: "美国的民族主义共产主义者被击败"
 usa_new_nc_civil_war_event.6.desc: "在一个令人印象深刻的转折中，陷入困境的美国政府和军队成功镇压了全大陆的民族主义共产主义起义。在这场血腥的内战之后，成千上万人丧生，但国家现在终于能够再次追求自己的道路。"
 usa_new_nc_civil_war_event.6.a: "已了解"
 usa_new_nc_civil_war_event.7.t: "美国人民共和国的崛起"
 usa_new_nc_civil_war_event.7.desc: "在大萧条带来的政治动荡之后，美国已将其文官政府转向共产主义意识形态。尽管该运动引发了激烈的保守派抵抗，但其支持者通过坚定的爱国主义和正派的表现为自己赢得了公众的支持。这一新世界政治领域的新转变将如何影响全球力量平衡，仍有待观察。"
 usa_new_nc_civil_war_event.7.a: "哦不好……"
 usa_new_nc_civil_war_event.7.b: "太好了"
 usa_new_nc_civil_war_event.7.c: "有趣"

 # 美国民族主义者
 new_usa_an_establish_the_rio_grande_event.1.t: "[FROM.GetNameDefCap]希望购买我们在里奥格兰德的领土"
 new_usa_an_establish_the_rio_grande_event.1.desc: "[FROM.GetAdjective]政府已向我们表明，他们希望购买我们在墨西哥东北部的领土，将其变成一个全新的独立国家。他们还为此开出了高价。我们应该把这些领土卖给他们吗？"
 new_usa_an_establish_the_rio_grande_event.1.a: "一笔好交易"
 new_usa_an_establish_the_rio_grande_event.1.b: "我们认为不行"
 new_usa_an_establish_the_rio_grande_event.2.t: "[FROM.GetNameDefCap]同意将他们在里奥格兰德的领土卖给我们"
 new_usa_an_establish_the_rio_grande_event.2.desc: "[FROM.GetAdjective]政府已接受我们的提议，并准备在我们履行协议并支付费用后，立即将这些领土的完全控制权移交给我们。"
 new_usa_an_establish_the_rio_grande_event.2.a: "太好了"
 new_usa_an_establish_the_rio_grande_event.2.a_tt: "在我们购买的领土上创建§Y里奥格兰德§!。"
 new_usa_an_establish_the_rio_grande_event.3.t: "[FROM.GetNameDefCap]拒绝将他们在里奥格兰德的领土卖给我们"
 new_usa_an_establish_the_rio_grande_event.3.desc: "不幸的是，[FROM.GetAdjective]政府拒绝了我们购买其领土的提议。"
 new_usa_an_establish_the_rio_grande_event.3.a: "该死"

