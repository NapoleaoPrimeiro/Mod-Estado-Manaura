 USA_america_the_proud: "骄傲的美国"
 USA_america_the_proud_desc: "在最后的时刻，我们坚守阵地。我们不会被击退，我们不会倒下，我们不会失败。我们将把入侵者赶回大海并击败他们。民主将坚定地站立！"
 USA_america_the_proud_tt: "如果我们不能将敌人赶出去，我们将开始遭受§R惩罚§!。"

 USA_political_shift: "政治转向"
 USA_political_shift_desc: "近期政治格局的动荡正在导致奇怪和不寻常的政策，通过不同方式追求民主。"
 USA_political_shift_tt: "完成此国策的§Y时间§!可根据最初选择的路径§G减少§!。"

 USA_roosevelt_stays: "罗斯福留任"
 USA_roosevelt_stays_desc: "罗斯福身后有美国人民的意志，他忠诚的政府和强大的治理将带领我们前进。"

 USA_alf_landons_government: "阿尔夫·兰登政府"
 USA_alf_landons_government_desc: "阿尔夫·兰登已获得美国的支持，他的政策和领导将带领美国走出困境，进入一个光明的新时代。"

 USA_asymmetric_operations: "不对称行动"
 USA_asymmetric_operations_desc: "我们的情报机构应专门在幕后从事其他国家的工作，按照我们自己的意见影响他们的公众。我们可以用我们的力量和财富在表面上展示我们的价值观，而OSS则在表面下推动它们。"

 USA_counter_espionage: "反间谍"
 USA_counter_espionage_desc: "外国特工在我国土地上对我们构成了严重威胁。我们将确保敌人无法学到任何有用的东西。"

 USA_trade_policy: "贸易政策"
 USA_trade_policy_desc: "通过为我们的贸易政策设定标准，我们可以显著提高各种贸易关系的效率和协调性。"
 USA_trade_policy_tt: "完成此国策的§Y时间§!可通过§Y$USA_trade_policy$§!国策§G减少§!。"

 USA_encourage_domestic_trade: "鼓励国内贸易"
 USA_encourage_domestic_trade_desc: "随着经济复苏，美国人将能够更频繁地参与州际商业。这将进一步提高复苏速度，并帮助恢复我们之前经历的增长速度。"

 USA_grow_export_market: "扩大出口市场"
 USA_grow_export_market_desc: "我们应特别强调尝试增加我们可以在海外销售的商品，并帮助丰富美国的工业。"

 USA_subsidize_imports: "补贴进口"
 USA_subsidize_imports_desc: "为了引进我们需要的材料和商品，我们将确保每个美国人都能负担得起世界其他地方所能提供的最好的东西。"

 USA_tax_imports: "对进口征税"
 USA_tax_imports_desc: "从根本上说，我们需要能够自力更生，并应尽量将尽可能多的增长和贸易推向内部。对于我们所引进的东西，我们应该最大化其对我们的价值。"

 USA_boost_imports: "促进进口"
 USA_boost_imports_desc: "美国不是世界上唯一的物质财富来源，在发展和壮大我们自己的财富时，我们应该对接受他人的帮助持开放态度。"

 USA_emphasize_trade_leverage: "强调贸易杠杆"
 USA_emphasize_trade_leverage_desc: "我们的重点应是获得与我们有业务往来的国家的杠杆。"

 USA_emphasize_trade_security: "强调贸易安全"
 USA_emphasize_trade_security_desc: "我们的重点应是确保我们的经济不会因外国行为者的动荡行动而面临风险。"

 USA_emphasize_trade_growth: "强调贸易增长"
 USA_emphasize_trade_growth_desc: "我们的重点应是利用对外贸易来最大化国内增长。"

 USA_prioritize_state_trade_authority: "优先考虑州贸易权力"
 USA_prioritize_state_trade_authority_desc: "从根本上说，贸易权力应属于各州本身。正是从它们的地方经济中，整个国家受益。"

 USA_prioritize_market_trade_authority: "优先考虑市场贸易权力"
 USA_prioritize_market_trade_authority_desc: "从根本上说，贸易权力应属于市场本身。货物的流动和价值的交换是一个太大的过程，无法由单一组织来处理。"

 USA_prioritize_federal_trade_authority: "优先考虑联邦贸易权力"
 USA_prioritize_federal_trade_authority_desc: "从根本上说，贸易权力应属于联邦政府。正是从国家层面，美国与其他国家做生意，也是从国家层面，我们的利益需要得到保障和维护。"

 USA_expand_resource_production: "扩大资源生产"
 USA_expand_resource_production_desc: "美国充满了大量尚未开采和发现的资源储备，随时准备丰富我们的人民和世界。我们应该尽我们所能投资于我们的基本资源市场。这将为我们的先进工业增长提供一个坚实的基础。"

 USA_develop_higher_quality_products: "开发更高质量的产品"
 USA_develop_higher_quality_products_desc: "美国经济做得最好的事情之一是生产高质量的设备。我们需要重振我们的精密加工工业，以进一步提升这一标准。"

 USA_formalize_arms_trading: "正式化武器贸易"
 USA_formalize_arms_trading_desc: "随着我们市场地位的稳固，我们现在可以完全将我们的工业转向向需要防御工具的国家出售武器。"

 USA_international_industrial_tutelage: "国际工业监护"
 USA_international_industrial_tutelage_desc: "美国在大规模工业和制造方面的专业知识使其处于一个绝佳的位置，可以协助那些尚未将工业发展到我们同等程度的国家。为什么不也帮助他们成长呢？这将是一个很受欢迎的措施。"
 USA_international_industrial_tutelage_tt: "解锁§Y决议§!以发展和壮大其他国家的§Y工业§!，从而提升公众对政府的支持度。"

 USA_department_of_territorial_integrity: "领土完整部"
 USA_department_of_territorial_integrity_desc: "DTI将监督我们关于如何管理我们所获得的土地的一系列行动。这是一个非常关键的功能——我们旨在促进和平与自由，但我们需要保持警惕，以免将自己的人民置于危险之中。"

 USA_focus_on_civil_administration: "专注于民政管理"
 USA_focus_on_civil_administration_desc: "我们有责任改善和保护我们在世界各地控制的领土，无论我们是如何控制它们的。我们必须确保我们设计任何占领政策都是正确的，目的是维护我们的价值观和我们所统治的人民的神圣性。"

 USA_apple_pie_diplomacy: "苹果派外交"
 USA_apple_pie_diplomacy_desc: "在处理外国土地时，我们体现我们的美国价值观，并将其传播到我们所到之处。我们将通过向他们提供美味的苹果派来轻松赢得敌人和反对者的心！"
 USA_apple_pie_diplomacy_tt: "解锁§Y$apple_pie_occupation$§!占领法。"

 USA_reconstruction_efforts: "重建努力"
 USA_reconstruction_efforts_desc: "我们发现自己在占领被冲突蹂躏的领土。我们有责任帮助那里的人民，并尽可能好、尽可能快地恢复他们的生活方式。"

 USA_foreign_development_projects: "外国发展项目"
 USA_foreign_development_projects_desc: "在国外领土上生产设备、建设基础设施和建立安全环境与国内地区完全不同。国际发展公司将成立，以设计和协调我们控制领土的建设，确保良好的秩序和效率。"
 USA_foreign_development_projects_tt: "解锁§Y$international_development_company$§!工业集团。"

 USA_focus_on_maintaining_security: "专注于维护安全"
 USA_focus_on_maintaining_security_desc: "我们在管理被占领土地时的首要任务是保护美国公民、盟友和利益。一旦这些得到保障，然后我们可以考虑支持那里现有的居民。"

 USA_industrial_continuity: "工业连续性"
 USA_industrial_continuity_desc: "我们控制的地区保持其能够生产的能力是很重要的。没有理由让我们控制的土地上的工业白白浪费。"
 USA_industrial_continuity_tt: "解锁§Y$continuity_occupation$§!占领法。"

 USA_support_occupation_police_forces: "支持占领警察部队"
 USA_support_occupation_police_forces_desc: "我们的占领部队和警察不断受到那些希望伤害他们的极端分子和激进分子的威胁。我们将投资于为我们在海外的执法机构提供维持和平所需的工具和资金。"

 USA_spread_american_ideals: "传播美国理想"
 USA_spread_american_ideals_desc: "我们将体现我们认为神圣的理想，并尽可能在任何时候、任何地方推广它们。如果我们做得正确，那么其他所有人都会看到我们劳动的果实与我们宣称的真理是紧密相连的。"
 USA_spread_american_ideals_tt: "§G改善§! §Y$apple_pie_occupation$§!占领法。\n§G改善§! §Y$international_development_company$§!工业集团。"

 USA_establish_regional_administrations: "建立地区行政机构"
 USA_establish_regional_administrations_desc: "我们将以效率和良好管理的眼光来治理我们的海外属地，为那里的人民提供保障，保护我们自己的利益，并最终使美利坚合众国受益。"
 USA_establish_regional_administrations_tt: "§G改善§! §Y$continuity_occupation$§!占领法。\n§G改善§! §Y$international_development_company$§!工业集团。"

 USA_advanced_decryption_department: "密码破译"
 USA_advanced_decryption_department_desc: "既然我们拥有能够以过去所需时间的一小部分来计算大量代数方程的物理设备，我们可以负担得起开发新的密码破译方法，这将使我们能够渗透即使是最坚固的密码，并深入探索我们对手的秘密。"

 USA_restore_the_kadets: "恢复立宪民主党"
 USA_restore_the_kadets_desc: "一旦[SOV.GetNameDefCap]被击败，我们的任务将是重建他们短暂而不幸的民主运动，并将其恢复为政府所在地。一个蓝色的俄罗斯将主宰草原。"

 USA_cold_world: "冰冷世界"
 USA_cold_world_desc: "凭借我们极端力量的结合，美国和[SOV.GetNameDefCap]准备控制整个世界。一个新时代已经降临，一个由两个最强大的大国主宰地球的时代，它们在目标上统一，尽管可能在意识形态上不一致。"

 USA_extensive_support_operations: "大规模支援行动"
 USA_extensive_support_operations_desc: "我们将向[SOV.GetNameDefCap]提供大量的装备和我们所能收集到的每一点情报。我们将与他们紧密合作，以确保他们最终战胜我们共同的敌人。然而，我们的支持将保持在那个水平——我们在如何对待世界的问题上看法不一致，我们只需要这场战争获胜。"

 USA_joint_operations: "联合作战"
 USA_joint_operations_desc: "我们将与盟友紧密合作，以最大的效率进行这场战争。通过与盟友的最高军事领导人合作，我们将制定新的行动计划，使我们能够取得胜利。"

 USA_the_united_nations_alliance: "联合国联盟"
 USA_the_united_nations_alliance_desc: "我们的事业是消除世界各地的破坏性力量。每个大陆上的每个民族都可以加入我们的事业。我们是人类对抗暴政黑暗的声音。"
 USA_the_united_nations_alliance_tt: "联合国联盟"

 USA_homecoming_of_liberty: "自由回家"
 USA_homecoming_of_liberty_desc: "是时候让美利坚合众国回到旧世界，并带着自由回去了。开国先贤们在1776年开始的事业，我们现在将完成。"

 USA_secure_europes_industries: "确保欧洲工业安全"
 USA_secure_europes_industries_desc: "作为地球上最富有和最工业化的大陆，欧洲是我们联盟的最高礼物。它庞大的人口和强大的工业现在将为美国的生活方式做出贡献。"

 USA_stars_and_stripes_beyond_the_rhine: "莱茵河彼岸的星条旗"
 USA_stars_and_stripes_beyond_the_rhine_desc: "是时候完成我们的推进，穿越整个欧洲了。红白蓝将从巴黎飘扬到柏林和华沙。"
 USA_stars_and_stripes_beyond_the_rhine_trigger_tt: " 控制§Y欧洲§!的一个地区！"
 USA_stars_and_stripes_beyond_the_rhine_tt: "我们将获得对每个§Y欧洲国家§!的§Y战争目标§!，前提是我们既未与之交战，也不是其盟友。"

 USA_vanguard_of_the_atlantic: "大西洋先锋"
 USA_vanguard_of_the_atlantic_desc: "一旦安全，大西洋将不再只是我们舰队的一堵不可逾越的水墙，它将成为连接我们两大洲的纽带。它将满载船只，运送人员、货物、机械、知识和其他一切，而所有这些都将得到我们强大海军的护卫。"

 USA_dawn_over_europe: "欧洲黎明"
 USA_dawn_over_europe_desc: "终于，欧洲在我们的控制之下。现在开始最困难的部分——整合。然而，我们的文化主要是欧洲文化的融合，因此我们将有很多筹码来帮助旧世界真正适应并融入新世界。"
 #USA_dawn_over_europe_trigger_tt: " 我们或我们的阵营成员控制巴黎、伦敦、柏林、华沙、罗马和马德里及其所在地区。"
 USA_dawn_over_europe_trigger_tt: "我们或我们的附庸控制§Y巴黎§!、§Y伦敦§!、§Y柏林§!、§Y罗马§!和§Y马德里§!及其所在地区。"
 USA_dawn_over_europe_tt: "解锁§Y决议§!以§G核心化§!具有高§Y顺从度§!的§Y西欧§!地区。"

 USA_war_is_business: "战争是生意"
 USA_war_is_business_desc: "战争是许多东西：残酷、毁灭性、可怕……还有利润。我们甚至不需要参与战斗，我们可以让其他国家打自己的冲突，而我们从中获益。"
 war_is_business_flag: "在过去§Y180§!天内未选择国策§Y$USA_casting_cinders$§!"
 USA_war_is_business_tt: "解锁§Y决议§!以将其他国家建立为§Y‘战友’§!并与它们发展贸易。\n  - $USA_establish_official_partnership_decision_tooltip_tt$"

 USA_balanced_carnage: "平衡的屠戮"
 USA_balanced_carnage_desc: "战争可能有利可图，但当战争结束时，支持它的装备流动也随之停止。为了确保稳定的利润流，鼓励或说服新的参与者加入可能符合我们的利益，或者也许我们甚至可以策划我们自己的冲突。"
 War_Credits_tt: "§Y战争积分§!"
 War_Credit_tt: "§Y战争积分§!"
 USA_balanced_carnage_tt: "解锁£usa_war_credits_texticon $War_Credits_tt$ \n  - 我们拥有的每$War_Credit_tt$将在每月末为我们带来§G5§!§Y经济能力盈余§!。$War_Credits_tt$也可以用于其他用途。"
 USA_balanced_carnage_tt_2: "解锁§Y决议§!以干预我们的§Y战友§!的战争，减缓其进程并为我们赚取$War_Credits_tt$。"

 USA_casting_cinders: "投下火星"
 USA_casting_cinders_desc: "在海外存在和平的地方，我们只看到对战争工业产品关闭的市场。这样不行。世界只是一系列火药桶，它们只需要一个火花。"
 casting_cinders_flag: "在过去§Y180§!天内未选择国策§Y$USA_war_is_business$§!"

 USA_aid_all_sides: "援助所有方面"
 USA_aid_all_sides_desc: "为了维持战争，我们需要确保战斗不会过早结束。无论它们援助哪一方，我们需要让每个参与者尽可能长时间地战斗，以给我们带来尽可能多的钱。"

 USA_mutually_assured_profits: "相互确保利润"
 USA_mutually_assured_profits_desc: "战争是这么好的赚钱机器，但遗憾的是，所有这些利润都没有流向我们，只流向我们！我们将击败每一个外国武器贸易国家，或者自己接管它们的市场，这样无论世界上发生什么冲突，我们都能处于有利的一端。我们将观看行动并为此得到报酬！"
 USA_mutually_assured_profits_trigger_tt: " 拥有§G[?USA.usa_arms_partners_variable]§!个（至少需要§R5§!个）§Y战友§!"
 USA_mutually_assured_profits_tt: "解锁§Y决议§!以提升我们的§Y战友§!的精神，将他们牢牢掌握在我们手中，并让他们付出代价使我们受益。\n  - 我们拥有的每个§Y战友§!，现在每月将获得§G1250§!§Y经济能力盈余§!。\n  - 我们拥有的每$War_Credit_tt$现在将在每月末为我们带来§G10§!§Y经济能力盈余§!。"

 USA_orchestrate_the_infernos: "策划地狱之火"
 USA_orchestrate_the_infernos_desc: "我们的战争工业已经成熟，并变得相当擅长安排其他各方之间的战斗。我们不再需要依赖其他国家的竞争——我们可以挑选我们的客户，并按我们认为合适的方式将他们带入我们的市场。"
 USA_orchestrate_the_infernos_trigger_tt: " 拥有§G[?USA.usa_arms_partners_variable]§!个（至少需要§R3§!个）§Y战友§!"
 USA_orchestrate_the_infernos_trigger_tt_2: " 拥有£usa_war_credits_texticon §G[?USA.usa_war_credits_var]§!（至少需要§R10§!）§Y战争积分§!"
 USA_orchestrate_the_infernos_tt: "解锁§Y决议§!以花费§Y战争积分§!在我们对其有重大影响力的国家之间策划§Y战争§!。\n\n我们将能够与§G更多国家§!建立§Y伙伴关系§!。"

 USA_new_continue_the_new_deal: "继续罗斯福新政"
 USA_new_continue_the_new_deal_desc: "新政的政策将进一步推进，其效果将获得所需的时间来实现。这就是我们将如何从大萧条中崛起的方式。"

 USA_double_down_on_the_new_deal: "加倍推进新政"
 USA_double_down_on_the_new_deal_desc: "尽管有不支持新政及其全面改革的声音，但正是通过加倍推进这些改革，我们最终才能让美国人民摆脱大萧条，并看到美国开始复苏。"

 USA_new_agricultural_adjustment_act: "农业调整法案"
 USA_new_agricultural_adjustment_act_desc: "大萧条打击了社会的各个角落，但受打击最严重的群体之一是农民。他们不仅在挣扎，而且在这个时期他们继续能够生产粮食是绝对必要的。我们需要增加他们的资金，确保我们的粮食供应继续保持在健康水平，尽管困难重重。"
 agri_adj_act_tt: "一旦成功通过，仍需§R一段时间§!才能通过进一步的§Y新政§!立法。"

 USA_new_fair_labour_standards_act: "公平劳动标准法"
 USA_new_fair_labour_standards_act_desc: "确保普通美国工人从正在发生的经济复苏中受益是很重要的。我们必须确保没有雇主利用他们的雇员，我们将以联邦法律支持这一理想。"
 USA_new_fair_labour_standards_act_tt: "\n在新政全面生效之前，需要起草更多的立法，尽管这需要§R时间§!。"

 USA_federal_zoning_reform: "联邦区划改革"
 USA_federal_zoning_reform_desc: "由于经济低迷，建造的房屋数量远远少于应有的数量。通过放宽建筑限制、扩大可用土地和补贴建设，我们将帮助确保每个美国人都有足够的住房。"

 USA_union_defense_act: "工会防御法"
 USA_union_defense_act_desc: "大萧条带来的痛苦使许多人对周围的人采取了绝望和不友善的行动。工人在绝望的雇主手下受苦，在许多情况下需要保护。为此，我们将通过立法，确保全国各地工会的安全和有效性。"

 USA_new_federal_housing_act: "联邦住房法"
 USA_new_federal_housing_act_desc: "大萧条使数百万美国人无家可归。我们将根据需要花钱为人民购置新房，以确保他们至少能找到一个家。任何辛勤工作的人都不应担心晚上睡在哪里。"

 USA_restore_the_gold_standard: "恢复金本位"
 USA_restore_the_gold_standard_desc: "虽然我们为了更好地找到复苏经济所需的资金而决定放弃金本位，但这并没有如预期那样奏效。我们需要回溯并恢复金本位，以重新引入美元的安全性。"

 USA_rebalancing_finances: "财政再平衡"
 USA_rebalancing_finances_desc: "在限制联邦支出时，我们需要完全重新评估我们的货币和财政政策。这不会简单，也不会没有痛苦，但这是必要的。"

 USA_new_adjusted_compensation_act: "调整补偿法"
 USA_new_adjusted_compensation_act_desc: "虽然我们不打算过多介入公民的一对一交易，但我们有责任帮助整个伟大的美国民族，因此将干预市场，以确保对雇员的公平和诚实支付。随着增长的恢复，它不应该只流向企业主。"
 adj_comp_act_tt: "一旦成功通过，仍需§R一段时间§!才能制定新的§Y政策§!。"

 USA_new_protectionist_tariffs: "保护主义关税"
 USA_new_protectionist_tariffs_desc: "优先考虑美国贸易仍然是必要的。一旦我们自己的增长和复苏得到保障，我们就有必要的空间开始投资于其他经济体。"
 USA_new_protectionist_tariffs_tt: "\n在国家完全复苏之前，政府必须通过新的§Y政策§!，这仍然需要§R时间§!。"

 USA_guns_and_shovels: "枪炮与铁锹"
 USA_guns_and_shovels_desc: "通过利用穿制服的士兵从事公共项目，我们可以为公众提供就业机会，同时保持对海外竞争对手的威慑力量。"

 USA_new_income_tax_reform: "所得税改革"
 USA_new_income_tax_reform_desc: "通过减少流入无用计划的税收，让赚了钱的人保留他们的钱，我们可以帮助普通美国人重新站起来。"

 USA_military_pensions: "军人养老金"
 USA_military_pensions_desc: "为国家服务应该为那些为社区贡献时间和力量的人带来安全感。为我们的士兵投资更早、更广泛的养老金将鼓励招募，并提供另一个财政机会的来源。"

 USA_new_war_propaganda: "战争宣传"
 USA_new_war_propaganda_desc: "冲突正在降临到美国人民身上，他们需要为此做好准备。无论这是一个受欢迎还是不受欢迎的立场，我们都必须做好准备。"

 USA_sway_the_public: "影响公众"
 USA_sway_the_public_desc: "即使以世界目前的状况，美国的大部分人口仍然反对任何形式的冲突。不幸的是，这不再是一个站得住脚的立场。我们将不得不努力影响他们的意见。"

 USA_hollywood_endorsements: "好莱坞背书"
 USA_hollywood_endorsements_desc: "我们可以利用我们庞大的媒体产业优势，将美国人民团结在我们需要支持的任何事业周围。"

 USA_family_films: "家庭电影"
 USA_family_films_desc: "以美国家庭价值观为中心的好莱坞电影将有助于支持公众意识，并为过去几年的动荡提供一些急需的慰藉。"

 USA_war_bond_campaigns: "战争债券运动"
 USA_war_bond_campaigns_desc: "为了有效进行这场战争，我们需要美国人民的全力支持和后盾。我们需要动用一切可用的资产。"

 USA_congressional_rallies: "国会集会"
 USA_congressional_rallies_desc: "随着兰登的胜利，共和党处于在全国范围内进一步争取支持并在政府中占据主导地位的有利位置。"

 USA_state_empowerment: "州赋权"
 USA_state_empowerment_desc: "确保美国的许多州保持其权力和自治是很重要的，即使在面对不断扩张的联邦政府时也是如此。"

 USA_support_titans_of_industry: "支持工业巨头"
 USA_support_titans_of_industry_desc: "通过支持我们强大的工业，我们可以将资源投入到增长最快、最有效的领域。"

 USA_audit_emergency_programs: "审计紧急计划"
 USA_audit_emergency_programs_desc: "为了应对我们最近面临的危机，创建了许多不同的三字母机构和紧急计划，但现在我们开始渡过这些事件，它们已经超出了其存在目的。尽管不受欢迎，但我们不能在没有理由的情况下挥霍数百万纳税人的钱。"

 USA_national_parks_infrastructure: "国家公园基础设施"
 USA_national_parks_infrastructure_desc: "我们广阔而众多的国家公园可以升级其设施质量和维护水平，我们有数百万需要工作的人。联邦政府可以资助工作创造计划，以同时满足这两个问题。"

 USA_new_wpa: "建立工人保护局"
 USA_new_wpa_desc: "工人保护局将为全国各地的员工提供服务，以保护他们并赋权他们。"

 USA_fdic: "建立美国联邦存款保险公司"
 USA_fdic_desc: "在因不负责任的银行行为造成的损害之后，很明显那种灾难不能再发生了。联邦存款保险公司将为全国银行提供货币支持并规范其政策，防止另一次潜在的银行挤兑。"

 USA_expand_social_security: "扩大社会保障"
 USA_expand_social_security_desc: "美国人的钱包空的频率远超应有。政府的职责是给予其公民繁荣。没有人应该挨饿或贫穷。"

 USA_new_build_the_pentagon: "建造五角大楼"
 USA_new_build_the_pentagon_desc: "五角大楼将成为美国军事领导层的所在地。该设施将增强我们的组织能力，并为进行战争的所有方面提供紧密高效工作的空间。"

 USA_host_the_remnants_of_democracy: "接待民主的残余"
 USA_host_the_remnants_of_democracy_desc: "美国的海岸是那些内心怀有民主精神的人留下的唯一安全港湾。我们必须向每一位准备为这一事业而战的绝望难民张开双臂，我们必须确保没有任何危险的威胁过早地偷偷潜入。"
 USA_host_the_remnants_of_democracy_tt: "接待民主的残余"

 USA_the_weight_of_the_world: "世界的重量"
 USA_the_weight_of_the_world_desc: "自这个国家存在以来，我们一直在许多不同的问题上争吵和争论，但现在我们必须暂时把这些次要问题放在一边。此刻，命运本身要求我们的注意力和专注。我们必须团结起来，共同面对现在摆在我们面前的威胁。"

 USA_every_chip_down: "押上一切"
 USA_every_chip_down_desc: "午夜的钟声已经敲响——是时候行动了。黑暗的力量涌上我们的海岸，威胁着我们的人民。我们必须调动一切可用的力量来应对这一事业，击败这个试图抹去世界上每一丝自由的巨大邪恶。美国将挺身而出并迅速出击。我们必须反击。"
 USA_every_chip_down_tt: "§R移除§! §Y$tot_economic_mobilisation$§!。获得§Y$the_eagles_might_economy$§!。"

 USA_crusade_for_freedom: "自由十字军"
 USA_crusade_for_freedom_desc: "虽然我们已经尽了最大努力来展示我们自己的优点，并在这里建立了一个伟大的国家，但我们现在必须积极主动地将世界从吞噬它的危险中拯救出来。美利坚合众国必须将其意志扩展到全球，并支持人类在各地的自由斗争。我们不会停止，直到毁灭的力量被平息，我们必须平息它们。"
 USA_crusade_for_freedom_tt: "获得对每一个§R制造了紧张度§!的国家的§Y战争目标§!。"

 USA_political_funding: "政治资助"
 USA_political_funding_desc: "美国的政治和任何其他地方一样是一团糟。有时，让车轮转动所需要的只是给它们一些润滑剂。"

 USA_support_the_phillipines: "支持菲律宾"
 USA_support_the_phillipines_desc: "[PHI.GetNameDefCap]几十年来一直受到我们的保护，但现在我们正在迅速接近他们独立自主的时候。在这个发展独立的过程中，我们将支持他们的经济、行政和国防，这样他们就能以充足的机会跳入更广阔的世界。"

 USA_new_neutrality_act: "$USA_neutrality_act$"
 USA_new_neutrality_act_desc: "$USA_neutrality_act_desc$"

 USA_new_limited_intervention: "$USA_limited_intervention$"
 USA_new_limited_intervention_desc: "$USA_limited_intervention_desc$"

 USA_new_lend_lease_act: "$USA_lend_lease_act$"
 USA_new_lend_lease_act_desc: "$USA_lend_lease_act_desc$"

 USA_new_arsenal_of_democracy: "$USA_arsenal_of_democracy$"
 USA_new_arsenal_of_democracy_desc: "$USA_arsenal_of_democracy_desc$"

 USA_duty_to_act: "行动的责任"
 USA_duty_to_act_desc: "无论我们选择追求和平还是战争，我们都需要行动。世界不会等待我们下定决心。"

 USA_socialized_medical_care: "社会化医疗"
 USA_socialized_medical_care_desc: "生活在美国的一部分意义在于，一个人应该能够获得现代世界所能提供的一切最好的东西。任何公民都不应被剥夺救命的医疗护理。政府将为那些负担不起的人支付费用，这样每个人都能受益。"

 USA_bolster_suffrage: "加强选举权"
 USA_bolster_suffrage_desc: "全国有数百万人有投票权但尚未投票。我们需要鼓励每个人都尽自己的一份力来代表他们的社区。"

 USA_joint_wargaming: "联合兵棋推演"
 USA_joint_wargaming_desc: "我们的军事领导层需要为冲突做好准备。我们有足够的资源来赋权我们的部队，为更现代的战斗做好准备。"

 USA_support_democracy_around_the_world: "支持世界各地的民主"
 USA_support_democracy_around_the_world_desc: "世界上每一个民主国家都需要得到支持，以确保自由在全球的延续。"

 USA_ramp_up_government_spending: "增加政府支出"
 USA_ramp_up_government_spending_desc: "为了完成我们长长的目标清单上的所有事项，我们需要为联邦政府提供更多的资金。"

 USA_public_works_projects: "公共工程项目"
 USA_public_works_projects_desc: "通过在全国各地的公共工程项目中雇佣数百万美国人，美国人将能够迅速从大萧条中复苏，同时他们也在服务和丰富自己的社区。"

 USA_increase_social_spending: "增加社会支出"
 USA_increase_social_spending_desc: "需要更多的工作来帮助美国人民，而政府的职责是帮助那些陷入困境的人重新站起来。政府将为全国各地的美国人支付各种服务费用，以便繁荣能够回归。"

 USA_gunnery_innovations: "炮术创新"
 USA_gunnery_innovations_desc: "新技术要求使用它的新方法来战斗，海洋仍然是一个不断发展战略的领域。我们的舰船目前不是为防御飞机而设计的，为此我们将开发“VT引信”，以在敌方的俯冲轰炸机攻击我们之前将其从空中击落。"

 USA_the_jeep: "吉普车"
 USA_the_jeep_desc: "为了设计一种新的通用越野车，我们创造了终极多功能汽车：吉普车。这种简单、可靠、用途广泛的机动车辆将使我们的军队各方面都能以高速和高效率在战场上机动。它可能不光彩，但正是这样简单的东西才能真正赢得战争。"

 USA_propose_canadian_unification: "提议加拿大统一"
 USA_propose_canadian_unification_desc: "随着加拿大现已从欧洲获得独立，我们可以向其政府提出邀请，将我们亲缘的国家和人民联合成一个统一的整体，一个坚定的北美。"

 USA_rotory_innovations: "旋翼创新"
 USA_rotory_innovations_desc: "与能够在空中保持位置、低速低空飞行、穿越地形特征并执行各种近距离空中支援任务的旋翼机相关的潜力极具吸引力。这类车辆可以参与战斗、运送装备、进行医疗后送、充当移动通信枢纽等。虽然仍在试验阶段，但我们应该努力使这项技术成熟。"

 USA_DEBUG_BRANCH: "调试分支"
 USA_DEBUG_BRANCH_desc: "调试"

 USA_IDEA_TEST_FOCUS: "理念测试国策"
 USA_IDEA_TEST_FOCUS_desc: "测试以确保所有理念正常运行。"

 USA_IDEA_TEST_ECO_MODIFIERS: "测试经济修正"
 USA_IDEA_TEST_ECO_MODIFIERS_desc: "测试以显示经济动态修正上可能存在的所有修正。"

 USA_IDEA_TEST_GOV_MODIFIERS: "测试政府修正"
 USA_IDEA_TEST_GOV_MODIFIERS_desc: "测试以显示政府动态修正上可能存在的所有修正。"

 USA_IDEA_TEST_SPY_MODIFIERS: "测试间谍修正"
 USA_IDEA_TEST_SPY_MODIFIERS_desc: "测试以显示间谍动态修正上可能存在的所有修正。"

 USA_IDEA_TEST_MIC_MODIFIERS: "测试MIC修正"
 USA_IDEA_TEST_MIC_MODIFIERS_desc: "测试以显示MIC动态修正上可能存在的所有修正。"

 USA_IDEA_TEST_ARM_MODIFIERS: "测试陆军修正"
 USA_IDEA_TEST_ARM_MODIFIERS_desc: "测试以显示陆军动态修正上可能存在的所有修正。"

 USA_IDEA_TEST_NAV_MODIFIERS: "测试海军修正"
 USA_IDEA_TEST_NAV_MODIFIERS_desc: "测试以显示海军动态修正上可能存在的所有修正。"

 USA_IDEA_TEST_AIR_MODIFIERS: "测试空军修正"
 USA_IDEA_TEST_AIR_MODIFIERS_desc: "测试以显示空军动态修正上可能存在的所有修正。"

 USA_new_two_ocean_navy_act: "两洋海军法案"
 USA_new_two_ocean_navy_act_desc: "随着战争迫在眉睫，我们必须确保没有任何敌人能够踏上美国的海岸。我们的海军必须能够在构成我们边界的两个大洋中的任何一个上与敌人作战。"

 USA_burden_lessening: "减轻负担"
 USA_burden_lessening_desc: "在全国各地，美国人民正在挨饿和受苦。诚实的人寻找工作却找不到，坚强的妇女寻求帮助却没有足够的给予……我们有责任减轻我们高尚人民的痛苦。政府必须采取非常措施，确保每个家庭今晚都能吃上饭。明天的问题等到明天再说，但首先我们必须能够活到明天。"

 USA_an_american_five_year_plan: "美国五年计划"
 USA_an_american_five_year_plan_desc: "股市崩盘以及全球银行和经济的崩溃表明，资本主义本身并不足以维持一个国家的运转。我们应注意其他国家正在实施的更新颖的经济制度，这些制度似乎使它们能够在当前的混乱中继续增长和生存。"
 USA_an_american_five_year_plan_tt: "- 每§Y210天§!，反对社会主义的保守抵抗势头将§G减弱§!。"

 USA_entertain_the_radicals: "接纳激进派"
 USA_entertain_the_radicals_desc: "世界感觉像已经分崩离析，尽管我们的领导人在各个领域和办公室做出了最大的努力，美国人民和世界人民仍在受苦。有声音呼喊着有一条新的更好的前进道路……也许我们有责任倾听。"

 USA_southern_crisis: "南方危机"
 USA_southern_crisis_desc: "由沙尘暴引起的饥荒正在对全国各地的社区造成不可持续的破坏，但现在它已经收到了南方几个主要社区的回应。在这些绝望的时刻，人们开始在受影响最严重的地区暴动并制造混乱。"

 USA_banner_clubs: "旗帜俱乐部"
 USA_banner_clubs_desc: "在全国各地，各州已开始指示当地社区联合起来，组建‘旗帜俱乐部’，即地方性的互助团体，人们相互照顾并满足彼此的需求。华盛顿特区的联邦政府已失去人民的信任，各州已各自承担起填补空缺的责任。"

 USA_the_question_of_our_national_character: "我们民族性格的问题"
 USA_the_question_of_our_national_character_desc: "当我们重建国家并从大萧条中复苏时，我们为联邦政府找到了新的目标。它究竟是占据中心舞台还是让位于各州，如今似乎更倾向于后者，但这并不是唯一需要考虑的新事物。美国正在重生，但凤凰将如何崛起？我们是进一步与世界隔绝，还是敢于提出革命性的新主张？"

 USA_visions_of_a_new_frontier: "新边疆的愿景"
 USA_visions_of_a_new_frontier_desc: "美国的未来在于开发新边疆。也就是说，一个以卓越服务美国人民、为每位公民创造更美好明天、确保最有利于培育和成熟所有人美国梦的条件的未来。"

 USA_state_autarky_movement: "州自给自足运动"
 USA_state_autarky_movement_desc: "我们将变得完全自给自足。历史上许多国家都尝试过这样做，但没有一个像我们这样得天独厚和繁荣。北美本身就是自己的粮仓，其起伏的丘陵和麦田是无数渴望冒险与增长的人民的画布。山巅之城将越升越高。"

 USA_a_new_america: "一个新美国"
 USA_a_new_america_desc: "昨日的美国是闪烁烛光上的明亮火焰，但旧日的光芒已经熄灭。我们的眼睛终于适应了，现在我们点燃新的火焰，更强大、更持久的火焰，当寒风袭来时不会熄灭。火花充满鹰的眼睛，我们的翅膀展开，准备新的飞翔。"

 USA_brotherhood_spirit: "兄弟情谊精神"
 USA_brotherhood_spirit_desc: "在恢复我们昔日的决心并将其建设得比以往更强大时，我们必须团结一致。我们将在国家内部点燃一种深厚的家庭精神，使每一颗胸膛都怀有一首勇敢无畏的歌，与每一个邻居同步跳动。我们是一个由定居者、探险家、发明家、战士——兄弟组成的国家。"
 USA_brotherhood_spirit_tt: "如果在此国策§Y完成§!后爆发§R内战§!，战斗将§G极大地有利于§!§Y美国民族主义者§!。"

 USA_a_golden_west: "金色西部"
 USA_a_golden_west_desc: "伟大的美国雄鹰再次优雅地翱翔于其北美领地之上。新世界已从旧世界的灰烬中崛起并超越，一颗新星闪耀，让全世界都能看到。我们已迎来金色西部，现在剩下要做的就是驰骋进入那辉煌的日出。"

 USA_the_george_may_proposal: "乔治-梅提案"
 USA_the_george_may_proposal_desc: "尽管美国和世界银行体系普遍崩溃，华尔街似乎有一个复苏计划。各种银行、房地产公司、基金集团、企业和私人商人聚集在纽约，起草一份稳定国家经济的计划，尽管该计划充其量只是实验性的。值得一试吗？"

 USA_the_capitol_hill_disaster: "国会山灾难"
 USA_the_capitol_hill_disaster_desc: "美国正在被扼杀。不负责任的银行、愚蠢的政客、糟糕的政策、煽动性的媒体、裙带关系等等已经打断了美国经济和人民的脊梁。现在，一场新的灾难已经袭击了国会山，导致我们的代表之间爆发了冲突。美国人民需要更强、更聪明、更坚定的领导。"

 USA_a_fallen_roost_among_the_cinders: "余烬中的坠落巢穴"
 USA_a_fallen_roost_among_the_cinders_desc: "四年前，原子首次被分裂。一个新的危险潜伏在地平线之外，威胁着不仅要吞噬美国，还要吞噬整个世界，而世界正处于崩溃和悲剧之中。战争即将来临，人类尚未准备好。那些能看到即将到来之事的人必须采取行动。"
# 民族主义共产主义者
 USA_labor_councils: "劳工委员会"
 USA_labor_councils_desc: "全国各地将成立劳工委员会，以保护工人权利并协调经济活动网络，帮助国家重新启动。"

 USA_graduated_taxation: "累进税制"
 USA_graduated_taxation_desc: "为了筹集适当的国家行动和干预所需的资金，我们将通过更累进的税收制度鼓励富人支付其公平份额。"

 USA_representation_reform: "代表制改革"
 USA_representation_reform_desc: "美国公民需要更能影响其国会代表的行为。此外，更多的美国人需要能够发出自己的声音。年轻人、外国人、被遗忘的人——这些都无关紧要；一个人的声音才是重要的。此外，人民的工会也需要有自己的话语权，以便每个群体都能被适当听到。"

 USA_american_economic_industrial_organization: "美国经济工业组织"
 USA_american_economic_industrial_organization_desc: "私营工业和银行应对大萧条负责，但这并非全是坏事。在杂草中也有一些健康的茎秆。然而，对于私营部门的其余部分，他们的事务和行为将受到人民警惕的守护者的密切监视和指导。"

 USA_industrial_recovery_NC: "工业复苏"
 USA_industrial_recovery_NC_desc: "国家正在慢慢开始从大萧条中复苏，得益于政府新的支出计划和人民的辛勤工作，美国的工业能力正在重新上线。"

 USA_red_july: "红色七月"
 USA_red_july_desc: "美国已经从大萧条中复苏，并找到了通往未来的新道路。美国人民共和国现在将接过美国之前的外衣，引导她的人民走向更伟大、更繁荣的明天！"

 USA_homeland_defense_emergency_act_focus_NC: "$USA_homeland_defense_emergency_act_focus-general_title$"
 USA_homeland_defense_emergency_act_focus_NC_desc: "$USA_homeland_defense_emergency_act_focus-general_desc$"

 USA_coordinate_militia_defenses_NC: "$USA_coordinate_militia_defenses-general_title$"
 USA_coordinate_militia_defenses_NC_desc: "$USA_coordinate_militia_defenses-general_desc$"

 USA_establish_strongholds_in_the_rockies_NC: "$USA_establish_strongholds_in_the_rockies-general_title$"
 USA_establish_strongholds_in_the_rockies_NC_desc: "$USA_establish_strongholds_in_the_rockies-general_desc$"

 USA_the_mississippi_bastions_NC: "$USA_the_mississippi_bastions-general_title$"
 USA_the_mississippi_bastions_NC_desc: "$USA_the_mississippi_bastions-general_desc$"

 USA_evacuate_civilians_and_industry_NC: "$USA_evacuate_civilians_and_industry-general_title$"
 USA_evacuate_civilians_and_industry_NC_desc: "$USA_evacuate_civilians_and_industry-general_desc$"

 USA_launch_the_counteroffensive_NC: "$USA_launch_the_counteroffensive-general_title$"
 USA_launch_the_counteroffensive_NC_desc: "$USA_launch_the_counteroffensive-general_desc$"

 USA_spirit_of_defiance_NC: "$USA_spirit_of_defiance-general_title$"
 USA_spirit_of_defiance_NC_desc: "$USA_spirit_of_defiance-general_desc$"

 USA_regional_strategic_commands_NC: "$USA_regional_strategic_commands-general_title$"
 USA_regional_strategic_commands_NC_desc: "$USA_regional_strategic_commands-general_desc$"

 USA_red_new_deal: "红色新政"
 USA_red_new_deal_desc: "罗斯福当选后，他和民主党人推行了一系列被称为新政的立法，以应对国家面临的问题。然而，他们的努力被各种对正在进行的变革感到不安的团体和个人所阻挠。当我们生病时，我们不能让自己害怕治愈所需的药物。"

 USA_engines_of_industry: "工业引擎"
 USA_engines_of_industry_desc: "既然国家开始恢复到经济大萧条前的产出水平，我们可以开始关注经济和人口的更具体部分。我们应该确保我们能够完全恢复我们的工业基础，并完全治愈美国社区所受的创伤。"
 USA_engines_of_industry_tt: "§Y解锁§! §Y$USA_general_motors$§!工业集团。"

 USA_industrialize_the_south: "工业化南方"
 USA_industrialize_the_south_desc: "自这个国家建立以来，美国南方在其工业和技术成熟度方面一直被落后。这是一个需要迎头赶上的地区。"

 USA_restore_the_north: "恢复北方"
 USA_restore_the_north_desc: "北方是我们工业实力的历史核心，并受到了大萧条的严重打击。要使其全部重新运转，需要采取重大行动。"

 USA_TVA_expansion: "TVA扩张"
 USA_TVA_expansion_desc: "田纳西河谷管理局的创建是为了帮助田纳西州的农村电气化，但很明显，其工作应扩展到该州边界之外。"
 USA_TVA_expansion_tt: "§Y[367.getName]§!、§Y[368.getName]§!、§Y[369.getName]§!、§Y[370.getName]§!、§Y[372.getName]§!、§Y[373.getName]§!: \n   添加§G1§!个建筑槽位。\n   添加§G1§!个§Y能源基础设施§!。\n   添加§Y$USA_tva_expansion_modifier$§!提供：\n建造速度：§G+5.00%§! \n§Y基础设施§!建造速度：§G+15.00%§! \n§Y铁路§!建造速度：§G+15.00%§!"

 USA_grand_public_works: "大型公共工程"
 USA_grand_public_works_desc: "美国生产能力的遗产将推动我们前进，我们将塑造自然以适应我们的意志。"

 USA_protecting_our_land: "保护我们的土地"
 USA_protecting_our_land_desc: "美国的广袤土地、起伏的田野和壮丽的山脉，它美丽而未经开发的自然卓越——美国人民有责任尊重这片辉煌的地形，并为我们的后代保护它。"

 USA_funds_to_reopen_factories: "重开工厂资金"
 USA_funds_to_reopen_factories_desc: "为了完全恢复我们的工业实力，我们需要从国家的每个角落、每个有能力的社区、每个可用的资金储备中引入资源。这将是一项昂贵的努力，但从长远来看，它将带来丰厚的回报。"

 USA_the_western_project: "西部计划"
 USA_the_western_project_desc: "美国的绝大部分不仅未被定居，而且完全未被触及。一个广阔的边疆，适合以前从未见过的巨大规模项目的发展。我们将利用我们的丰富资源。"
 USA_the_western_project_tt: "解锁开发美国中西部的§Y决议§!。"

 USA_the_frontier_sandbox: "边疆沙盒"
 USA_the_frontier_sandbox_desc: "美国中西部仍然是我们想象力的开放画布；我们将在那里建造伟大的工程，并利用这片土地建设未来。"
 USA_the_frontier_sandbox_tt: "解锁额外的、§G更强大的§!开发美国中西部的§Y决议§!。"

 USA_state_labor_associations: "州劳工协会"
 USA_state_labor_associations_desc: "这个国家的大量工人从未参加过工会，因此可能不熟悉如何加入工会并表达他们的声音。通过让每个州建立自己的一套标准化工会，我们可以帮助消除这种无知。"

 USA_spread_expertise: "传播专业知识"
 USA_spread_expertise_desc: "不受控制的资本主义的问题之一是将专业知识孤立给那些垄断知识和技能的特定人物，以牺牲他人为代价。通过创建社区项目向公众传播专业知识，我们可以阻止这些趋势。"

 USA_light_machinery_training: "轻机械训练"
 USA_light_machinery_training_desc: "通过将新工人的技术培训集中在轻机械上，我们可以更快地输出基本消费品和更简单的产品。"

 USA_heavy_machinery_training: "重机械训练"
 USA_heavy_machinery_training_desc: "通过专注于培训工人操作重型机械，我们可以继续维持我们在世界上的工业优势。"

 USA_employ_the_boy_scouts: "雇用童子军"
 USA_employ_the_boy_scouts_desc: "有成千上万有能力的年轻人已经在我们社会中迈出了走向更成熟的第一步。那些走得足够远成为鹰级童子军的人在他们很小的时候就证明了他们的能力。为什么不引入一些新的、有生产力的功绩徽章呢？"

 USA_liberty_rides_the_rivers: "自由骑行河流"
 USA_liberty_rides_the_rivers_desc: "北美的天然水路动脉是美国的巨大福音。充分利用这些通道将进一步增强我们利用广阔领土的能力。"
 USA_liberty_rides_the_rivers_tt: "对于每个已执行§Y鼓励增长§!决议的中西部州，我们将获得§G15§!§Y政治点数§!和§G1%§!§Y稳定度§!。\n未来使用该决议将在完成后返还§G5§!§Y政治点数§!。"

 USA_heal_the_heart_of_rural_america: "治愈美国乡村的心脏"
 USA_heal_the_heart_of_rural_america_desc: "在大萧条、沙尘暴以及沿海精英们数十年的忽视之后，美国乡村和小城镇感到被遗弃和抛弃，但现在我们可以通过适当的关怀、资金和关注来帮助缓解这些困境。我们不会放弃这个国家中的任何人，无论大小，无论远近。"

 USA_that_well_never_be_wanting: "……我们永不匮乏"
 USA_that_well_never_be_wanting_desc: "通过对人民的大力投资，我们可以将大量工业系统分散化，允许全国各地的社区处理临时替代方案，这直接惠及从事工作的人，同时也为任何和所有问题创造更多创新解决方案的机会。"
 USA_that_well_never_be_wanting_tt: "对于每个已执行§Y$USA_the_frontier_sandbox$§!决议的中西部州，我们将获得§G1§!§Y离岸民用工厂§!和§G1§!§Y离岸军用工厂§!。\n未来使用这些决议将在完成后也给予§G1§!§Y离岸民用工厂§!。"

 USA_that_well_never_go_hungry: "……我们永不挨饿"
 USA_that_well_never_go_hungry_desc: "在沙尘暴的可怕时期之后，我们必须不让美国人民再次面临饥荒或饥饿的风险。一个好的社区和政府的最基本职责也许是确保每个男人、女人和孩子都能把食物摆在餐桌上。我们将确保我们的农场得到加强和更好的资金支持。"

 USA_meritocratic_managers: "精英管理者"
 USA_meritocratic_managers_desc: "虽然资本主义远非完美，但它名义上声称那些领导或经营公司和工厂的人应该是那些最适合这项工作的人，以最大化结果。美国迄今为止取得的工业进步证明了这一原则至少在视野中，现在我们能更好地专注于它。"

 USA_representative_work_leaders: "代表性工作领袖"
 USA_representative_work_leaders_desc: "在每个志同道合的人的聚会中，总会自然地在他们中间产生领袖。这些有精神的人，作为同伴中的佼佼者，有能力担任职务，应该被鼓励在美国工业中承担更大的领导角色。"

 USA_american_exceptionalism: "美国例外主义"
 USA_american_exceptionalism_desc: "我们有长期的超前思维和创新解决问题的历史，现在我们已经摆脱了那些会无知和恐惧地压制公众创造力的自上而下的力量，我们可以自由地追求未来的技术和方法！"

 USA_resource_security: "资源安全"
 USA_resource_security_desc: "世界上仍然有一些势力对美国人民的追求感到不满，甚至有更多势力对我们的繁荣感到嫉妒。我们应该确保这些潜在的好战者中没有一个能够通过扣留我们从他们那里需要的必需品来强迫我们。"

 USA_advanced_machining: "先进机械加工"
 USA_advanced_machining_desc: "在高质量机床方面保持优势将确保美国工厂的产量超过那些想要与我们竞争的人。"

 USA_a_truly_democratic_economy: "真正民主的经济"
 USA_a_truly_democratic_economy_desc: "美国几十年来一直是世界上最大的经济体，但现在它也是世界上最自由、最公平的经济体。自由女神像的火炬照亮了数千个工厂车间，里面充满了地球上最勤奋、最聪明、最勤勉的公民。"

 USA_no_one_left_behind: "不让任何人掉队"
 USA_no_one_left_behind_desc: "美国方式的一部分是每个人都应该有机会为自己创造美好生活。任何美国人都不应被排除在改善生活的机会之外。"

 USA_america_for_her_people: "美国为人民"
 USA_america_for_her_people_desc: "虽然美国是各国中进步和机遇的灯塔，但她主要关心的是自己的人民，关心国内的稳定、进步和机遇。"

 USA_give_me_your_poor_your_tired_masses: "给我你疲惫的穷人"
 USA_give_me_your_poor_your_tired_masses_desc: "美国梦延伸到全球每一个寻求更好生活并愿意为之努力的男女老少。自由女神像向世界广大民众张开双臂，准备向他们所有人伸出同样的承诺。"

 USA_elevate_the_common_american: "提升普通美国人"
 USA_elevate_the_common_american_desc: "美国传统一直强调个人、自决、赋予每个人的不可剥夺权利的重要性。随着对政府和经济的改革，我们处于更好的位置来充分尊重这一传统。"

 USA_unrestricted_specialization: "无限制专业化"
 USA_unrestricted_specialization_desc: "我们在美国努力追求的卓越标准是普通美国人在日常工作中展现出的惊人专注和辛勤工作的副产品。现在每个公民都比以往任何时候都更多获得高水平培训和经验，我们能够达到产出和质量的新高度。"

 USA_every_worker_finds_their_voice: "每个工人都能找到自己的声音"
 USA_every_worker_finds_their_voice_desc: "纵观历史，特别是自工业革命开始以来，工作场所对占用的工人来说往往是一个非常恶劣的环境，但现在我们已经更好地解决了权威的角色，美国工人现在比以往任何时候都更自由地在他们的职责中找到新的舒适和目标。"

 USA_protecting_our_peace: "保护我们的和平"
 USA_protecting_our_peace_desc: "如果有一天我们在本土真正受到威胁，美国人民必须准备好捍卫我们来之不易的和平。"

 USA_2a_chapters: "第二修正案分会"
 USA_2a_chapters_desc: "第二修正案是美国文化与世界其他地区区别开来的决定性特征之一，这意味着，如果美国受到外部威胁，有许多公民能够挺身而出帮助保卫国家。为此，协调更专门的公民防御分会将有助于保护我们免受那种可能性的侵害。"

 USA_community_stockpiles: "社区储备"
 USA_community_stockpiles_desc: "在入侵我们祖国的情况下，每个社区都必须尽自己的一份力来保护自己和整个美国人民。因此，全国各地社区建立自己的独立口粮、装备、武器和一般物资储备是很重要的。"

 USA_rural_simeon_crucibles: "乡村西缅熔炉"
 USA_rural_simeon_crucibles_desc: "由美国西南部的爱国者开发的“西缅熔炉”是小型的制造厂，能够使小镇使用普通材料生产大量的基本弹药和轻武器。教全国人们如何建立这些设施将确保我们始终能够继续自卫，即使我们的集中部队供应短缺。"

 USA_border_plans: "边境计划"
 USA_border_plans_desc: "为了防御大陆的入侵，我们需要努力建设我们的边境防御。"

 USA_shoreline_plans: "海岸线计划"
 USA_shoreline_plans_desc: "为了防御大陆的入侵，我们需要努力准备我们的海岸线以击退海上的攻击。"

 USA_external_politics_NC: "外部政治"
 USA_external_politics_NC_desc: "无论我们的内部立场如何，我们都不是生活在真空中的。我们必须决定如何与世界其他地区互动。"

 USA_learning_from_others: "向他人学习"
 USA_learning_from_others_desc: "在不注意其他参与者的行动或立场的情况下试图玩国家游戏是有一定危险的。我们需要确保我们比敌人领先一步。"

 USA_educate_our_protectorates: "教育我们的保护国"
 USA_educate_our_protectorates_desc: "由于我们与附属国的地位，我们可以帮助现代化和进步他们的政府和文化。"

 USA_protect_american_liberty: "保护美国自由"
 USA_protect_american_liberty_desc: "美国主要不关心世界其他地方发生的事情——我们忙于在国内建设未来。因此，我们的重点将放在建设未来和确保我们自己的持续和平上。"

 USA_focus_on_domestic_prosperity: "专注于国内繁荣"
 USA_focus_on_domestic_prosperity_desc: "美国为了她的人民，人民为了美国。我们将不遗余力地为这一代和以后的每一代建设这个国家。"

 USA_rose_tinted_lampstand: "玫瑰色的灯台"
 USA_rose_tinted_lampstand_desc: "移民们寻求美国作为一个机遇之地，他们这样做是对的，但现在我们通过采取更公平的政策和生活方式进一步推进了这一点。我们打算超越我们以前的名声高度，成为世界其他国家可以效仿的自由和卓越的真正典范。"

 USA_the_eagles_bulwark: "雄鹰的壁垒"
 USA_the_eagles_bulwark_desc: "我们现在享有的繁荣不可避免地将对外国势力变得太诱人，使他们无法不干涉。我们不能仅仅产生伟大；我们必须保护我们所赢得的东西。"

 USA_throw_out_the_forces_of_tryanny: "驱逐暴政势力"
 USA_throw_out_the_forces_of_tryanny_desc: "就是现在！我们必须尽一切努力将这些外国侵略者和暴君从我们的土地上驱逐出去！我们不能失败，我们必须付出一切。"

 USA_secure_peace_guarantees: "确保和平保障"
 USA_secure_peace_guarantees_desc: "我们将主办一次国际会议，以从世界主要参与者那里获得相互和平保障，这将有助于维护我们在国内的安全。"

 USA_peaceful_and_proud: "和平而自豪"
 USA_peaceful_and_proud_desc: "虽然美国确实有悠久的战争历史，但我们现在正将目光向内转，专注于改善我们自己人民的生活。我们很强大，我们觉得没有必要向外证明这一点。"

 USA_proselytize_north_america: "在北美传道"
 USA_proselytize_north_america_desc: "我们将把我们更充分实现的进步、繁荣和人人自由愿景传播到整个北美大陆。新世界将被自由的温暖红色光芒所沐浴。"

 USA_wheatstock_international: "惠斯多克国际"
 USA_wheatstock_international_desc: "美国的惠斯多克电台已成为一个巨大的成功和正确信息传播的典范。如果它和其他文化物品的影响力扩展到我们的边界之外，它们可以在其他地方非常有效地传播我们的价值观。"

 USA_liberty_abroad: "海外自由"
 USA_liberty_abroad_desc: "虽然我们的资源集中在内部发展上，但我们应该花一点钱在世界其他地方和地区推广我们的理想。"

 USA_sons_of_liberty_brigades: "“自由之子”旅"
 USA_sons_of_liberty_brigades_desc: "美国人民对世界各地受压迫和攻击的人们感同身受，他们自愿组成志同道合的团体，前往外国战场，希望在世界产生积极影响。"

 USA_crimson_flag_crimson_hearts: "深红旗帜，深红之心"
 USA_crimson_flag_crimson_hearts_desc: "加拿大人民有着与我们相似的过去和文化。我们将把他们带入光明，带入我们的势力范围。"

 USA_a_revolution_across_the_border: "边境对面的革命"
 USA_a_revolution_across_the_border_desc: "我们将支持墨西哥人民，并与他们一起走向光明！"

 USA_the_whiskey_jay_compatriot: "威士忌松鸦同胞"
 USA_the_whiskey_jay_compatriot_desc: "既然加拿大人已经看到了真正自由的光芒，我们将尝试将他们融入我们的势力范围。"
 USA_the_whiskey_jay_compatriot_tt: " - 如果他们§R拒绝§!，我们将获得对他们的§R战争目标§!！"

 USA_the_golden_eagle_compatriot: "金鹰同胞"
 USA_the_golden_eagle_compatriot_desc: "既然墨西哥人已经崛起并激发了心中的自由，是时候接触他们以将他们带入我们的势力范围了。"
 USA_the_golden_eagle_compatriot_tt: " - 如果他们§R拒绝§!，我们将获得对他们的§R战争目标§!！"

 USA_the_western_peoples_coalition: "西部人民联盟"
 USA_the_western_peoples_coalition_desc: "是时候让北美与世界其他地区区分开来，并证明它在自己的道路上找到了最真实的自由之路，与旧世界分开。"

 USA_arsenal_of_liberty: "自由兵工厂"
 USA_arsenal_of_liberty_desc: "美国已经将自己建设成一座山巅之城，一个维护自由和自由最高价值的城市。然而，这些价值观在世界各地并不被共享，确实可能受到威胁。此外，有一天美国人可能需要离开家园去解放其他土地的人民。美国必须成为支持这些事业的自由兵工厂。"

 USA_internal_politics_NC: "内部政治"
 USA_internal_politics_NC_desc: "如果这个国家要度过大萧条，将需要大量的精力和专注来引导其方向。"

 USA_wheatstock_radio: "惠斯多克电台"
 USA_wheatstock_radio_desc: "从密苏里州某处匿名地点广播，“惠斯多克”广播在全国各地聚集场所获得了大量听众。在酒吧、酒店、俱乐部甚至昂贵的移动设备中播放，其宣扬更社会主义导向的民主制度美德的信息正在全国范围内深入人心。"

 USA_destigmatize_socialism: "去污名化社会主义"
 USA_destigmatize_socialism_desc: "尽管资本主义学说在我国的失败，社会主义对大多数人来说仍然带有非常负面的含义。需要一些工作来弥合公众意识中的这一鸿沟，即使这有点刺痛。"

 USA_socialist_womens_organizations: "社会主义妇女组织"
 USA_socialist_womens_organizations_desc: "通过利用全国许多女权主义团体中已经存在的社会主义倾向，我们可以让国家的女性支持我们的信息。"

 USA_lift_the_peoples_spirits: "振奋人民精神"
 USA_lift_the_peoples_spirits_desc: "多年来，一场接一场的悲剧袭击了这个国家，导致普遍的悲观和厄运感。然而，我们知道未来可以是光明的。我们可以鼓舞公众的精神，激励他们尽自己的一份力来摆脱这些困境。"

 USA_organize_new_unions: "组织新工会"
 USA_organize_new_unions_desc: "任何社会主义制度的中坚力量都是工人工会网络，它允许每个有生产力的公民有效地引导他们的精力。"

 USA_stand_up_for_the_unemployed: "为失业者挺身而出"
 USA_stand_up_for_the_unemployed_desc: "大量身体健全的工人没有机会谋生并为自己和周围的人提供生活，这不是他们自己的错。他们必须得到照顾。"
 USA_stand_up_for_the_unemployed_tt: "此国策和§Y$USA_homeless_relief_funds$§!中只有§Y一项§!会§Y降低§!保守抵抗。\n "

 USA_homeless_relief_funds: "无家可归者救济基金"
 USA_homeless_relief_funds_desc: "在勇者之乡，勇者应该有家。没有人应该因为在睡觉时找不到可以安放头颅的阁楼而辗转反侧。"
 USA_homeless_relief_funds_tt: "此国策和§Y$USA_stand_up_for_the_unemployed$§!中只有§Y一项§!会§Y降低§!保守抵抗。\n "

 USA_socialist_patriot_parades: "社会主义爱国者游行"
 USA_socialist_patriot_parades_desc: "我们不打算采用席卷世界其他国家的暴力革命，也不打算参与任何形式的“恐怖统治”。我们是美国人，为我们闪闪发光的国家遗产感到自豪的爱国者。过去的方式不是旧的或错误的，它们只是不完整；我们努力在美国传统中完成它们。"
 USA_denounce_capitalism_tt: "我们将获得一项§Y决议§!来§R提前发动内战§!。§Y保守派抵抗§!越弱，对他们就越是致命。"

 USA_denounce_capitalism: "谴责资本主义"
 USA_denounce_capitalism_desc: "美国至今已经走上了一条伟大的道路，但资本主义的阴险势力一直紧紧追赶，直到它跌倒。大萧条是这种经济组织形式失败的最明显标志，我们必须反对它！"

 USA_demand_government_action: "要求政府行动"
 USA_demand_government_action_desc: "与我们有启发性的社会运动一致，罗斯福政府已提出一项宪法修正案，该修正案将把工会代表写入国会，并增加他们在工作场所的权力。普通的美国公民终于将获得他们完全的话语权！"

 USA_protect_productive_entrepreneurs: "保护有生产力的企业家"
 USA_protect_productive_entrepreneurs_desc: "许多社会主义者和共产主义者会争辩说，资本主义阶级中的每个人在定义上都是邪恶的，但实际上我们的问题只是源于那些从未真正贡献任何东西来获得财富的贪婪个体。另一方面，那些辛勤工作改善了每个人生活的人——他们应该为他们所做的工作受到尊敬。"
 USA_protect_productive_entrepreneurs_tt: "此国策、§Y$USA_american_worker_guilds$§!和§Y$USA_federal_honor_programs$§!中只有§Y一项§!会§Y降低§!保守抵抗。\n "

 USA_american_worker_guilds: "美国工人行会"
 USA_american_worker_guilds_desc: "美国人民拥有世界上最伟大的工业和技术专长。通过将地方商业联盟合并成更大的贸易行会，我们可以协调整个行业的知识和技能，帮助其更有效地发展。"
 USA_american_worker_guilds_tt: "此国策、§Y$USA_protect_productive_entrepreneurs$§!和§Y$USA_federal_honor_programs$§!中只有§Y一项§!会§Y降低§!保守抵抗。\n "

 USA_federal_honor_programs: "联邦荣誉计划"
 USA_federal_honor_programs_desc: "对于那些在生活中运气不佳的人，我们可以创建国家荣誉计划，提供住房、食物和支持，同时提供培训、经验和真正有生产力的工作，帮助他们重新站起来。"
 USA_federal_honor_programs_tt: "此国策、§Y$USA_protect_productive_entrepreneurs$§!和§Y$USA_american_worker_guilds$§!中只有§Y一项§!会§Y降低§!保守抵抗。\n "

 USA_culmination_of_the_founding_fathers: "国父们的成果"
 USA_culmination_of_the_founding_fathers_desc: "在我们国家建立之初，我们致力于为所有来到美国的人确保和平、正义和机会。这是一段漫长的旅程，但我们终于到达了。国父们会为我们在这里取得的成就感到自豪。"

 USA_property_reform: "财产改革"
 USA_property_reform_desc: "如果我们要真正治愈这个国家，我们不能仅仅以“改革”的名义行事，而是必须从根本上改变这个国家中应对我们问题负责的权力体系。我们不打算完全废除私有财产，但我们确实打算将那些被不当囤积和限制的物品公开化。"

 USA_soviet_style_policies: "苏联式政策"
 USA_soviet_style_policies_desc: "苏联已经展示了运行更集中经济所需的经济政策。虽然我们没有像他们那样集中，但很明显，资本主义阶级不能任其自生自灭，必须加以管理和监督。"

 USA_rally_disaffected_militias: "集结不满民兵"
 USA_rally_disaffected_militias_desc: "全国许多社区仍然对政府迄今试图处理他们问题的方式感到失望。鉴于我们的目标，提前开始组织抵抗团体是明智的，他们将在情况变得激烈时准备好掌控局面。"
 USA_rally_disaffected_militias_tt: "当§Y内战开始§!时，我们将获得额外的§Y8个民兵单位§!和§Y75k人力§!。"

 USA_apple_pie_barns: "“苹果派”谷仓"
 USA_apple_pie_barns_desc: "在支持度高的农村地区，我们将帮助建立所谓的“苹果派”谷仓。使用苹果箱和其他食品容器，我们将把大量军事硬件走私到全国各地的安全屋，这将有助于我们未来的事业。当然，对于不知情的人来说，这看起来只是一些邻里烘焙项目。"
 USA_apple_pie_barns_tt: "当§Y内战开始§!时，我们将获得§Y10k步兵装备§!、§Y1k支援装备§!和§Y1k牵引火炮§!。"

 USA_invite_foreign_freedom_fighters: "邀请外国自由战士"
 USA_invite_foreign_freedom_fighters_desc: "我们的事业与全世界数百万人共享。我们将呼吁外国自由战士的支持来协助我们的斗争！"
 USA_invite_foreign_freedom_fighters_tt: "在§Y内战开始§!两周后，我们将获得§Y6个外国志愿师§!。"
 USA_invite_foreign_freedom_fighters_tt_2: "完成此国策一周后，我们将获得§Y6个外国志愿师§!。"

 USA_the_people_rise_up: "人民起义！"
 USA_the_people_rise_up_desc: "现在是行动的时候了！冲向胜利，确保我们的未来，奋起反抗社团主义压迫者！"
 USA_the_people_rise_up_tt: "  我们内战的§Y对手§!将遭受以下影响： "
 USA_the_people_rise_up_tt_2: "  持续§Y180§!天。"

 USA_redistribute_the_vieux_riches: "重新分配旧富"
 USA_redistribute_the_vieux_riches_desc: "这个国家成千上万的富裕资本家一生中从未贡献过一分钱。他们靠勤劳的美国人的背脊生活，并用他们的资源使人民的生活更加艰难。欧洲社会可能容忍这一点，但我们不会。"

 USA_bury_the_robberbarons: "埋葬强盗贵族"
 USA_bury_the_robberbarons_desc: "这个国家许多新的精英是通过垄断和破坏大型工业以牺牲普通人为代价而成为这样的。这些“强盗贵族”伤害了数百万美国人的生活，必须被清除，他们的资产为了人民的利益而被没收。"

 USA_amnesty_for_the_ignorant: "赦免无知者"
 USA_amnesty_for_the_ignorant_desc: "大量美国人没有怀着任何恶意反对我们的事业。他们只是对历史进程不了解，但他们仍然是我们的兄弟姐妹。我们必须原谅那些站在我们这边、以前认为自己是我们的敌人的人。"

 USA_manifest_equality: "昭示平等"
 USA_manifest_equality_desc: "美国实验的出发点是创造一个机遇之地，让任何人都可以自由追求自己的繁荣，不被严苛的权威践踏。现在我们已经超越了欧洲传统强加给我们的限制，我们可以完成那个实验。"

 USA_the_vision_of_1776_achieved: "1776年愿景的实现"
 USA_the_vision_of_1776_achieved_desc: "1776年，一场反对欧洲旧方式的革命被正式宣布。它试图从旧世界吸取教训，并在此基础上创建一个新世界，一个个人被最大化，从而更大的社区也被最大化的世界。150多年前开始的事业，我们现在已经实现了！新世界将是一个乌托邦。"

 # 美国民族主义者
 USA_industrial_recovery_AN: "工业复苏"
 USA_industrial_recovery_AN_desc: "齿轮转动、引擎蒸汽、汽笛尖鸣——国家的步伐再次恢复生机。那些投身于社区工作并与其他城镇团体合作的美国人给予了极大的帮助。"

 USA_homeland_defense_emergency_act_focus_AN: "$USA_homeland_defense_emergency_act_focus-general_title$"
 USA_homeland_defense_emergency_act_focus_AN_desc: "$USA_homeland_defense_emergency_act_focus-general_desc$"

 USA_coordinate_militia_defenses_AN: "$USA_coordinate_militia_defenses-general_title$"
 USA_coordinate_militia_defenses_AN_desc: "$USA_coordinate_militia_defenses-general_desc$"

 USA_establish_strongholds_in_the_rockies_AN: "$USA_establish_strongholds_in_the_rockies-general_title$"
 USA_establish_strongholds_in_the_rockies_AN_desc: "$USA_establish_strongholds_in_the_rockies-general_desc$"

 USA_the_mississippi_bastions_AN: "$USA_the_mississippi_bastions-general_title$"
 USA_the_mississippi_bastions_AN_desc: "$USA_the_mississippi_bastions-general_desc$"

 USA_evacuate_civilians_and_industry_AN: "$USA_evacuate_civilians_and_industry-general_title$"
 USA_evacuate_civilians_and_industry_AN_desc: "$USA_evacuate_civilians_and_industry-general_desc$"

 USA_launch_the_counteroffensive_AN: "$USA_launch_the_counteroffensive-general_title$"
 USA_launch_the_counteroffensive_AN_desc: "$USA_launch_the_counteroffensive-general_desc$"

 USA_spirit_of_defiance_AN: "$USA_spirit_of_defiance-general_title$"
 USA_spirit_of_defiance_AN_desc: "$USA_spirit_of_defiance-general_desc$"

 USA_regional_strategic_commands_AN: "$USA_regional_strategic_commands-general_title$"
 USA_regional_strategic_commands_AN_desc: "$USA_regional_strategic_commands-general_desc$"

 USA_defend_our_homeland: "保卫我们的家园！"
 USA_defend_our_homeland_desc: "时刻已到：是时候将敌人从我们的家园永远驱逐出去！我们将对侵略者伸张正义，将他们淹没在我们国家两侧的海水中。他们无法抵抗我们。"

 USA_tend_to_the_nation: "照料国家"
 USA_tend_to_the_nation_desc: "我们需要将注意力转向国家的未来。在历史背景下，美国的历史是宏大的，也许最近的这些灾难正是我们睁开眼睛、开辟更好前进道路所需的东西。"

 USA_the_goldstar_network: "金星网络"
 USA_the_goldstar_network_desc: "金星网络由约翰·奥比茨于1934年创立，是一家爱国主义的美国报纸和广播频道，已成为全国各地酒吧、家庭、工地和政治分部的常客。它在这些艰难时期激励了数百万美国人，为贫困者筹款，提供工作-工人连接服务，并帮助未来导向的官员当选。"

 USA_community_aid_programs: "社区援助计划"
 USA_community_aid_programs_desc: "全国各地的社区继续挣扎，因为他们所依赖的机构和基础设施仍然不可靠。最好由各州自己协调恢复我们地方地区的努力。"

 USA_our_place_in_the_world: "我们在世界上的位置"
 USA_our_place_in_the_world_desc: "当我们开始复苏时，我们的命运究竟应该是什么的问题开始清晰起来。我们是注定要仅仅作为世界上众多国家中的又一个，还是应该努力让自己与众不同，并争取某种前所未见的地位？"

 USA_properly_account_for_the_carpetbaggers: "妥善清算投机客"
 USA_properly_account_for_the_carpetbaggers_desc: "1860年代内战后的南方‘重建’是一场巨大的闹剧，它让南方的处境比傲慢的北方没有如此努力去‘帮助’时还要糟糕。我们需要清算那些我们称之为投机客的最阴险机会主义者所造成的损害。"
 USA_properly_account_for_the_carpetbaggers_tt: "§Y[366.getName]§!、§Y[365.getName]§!、§Y[364.getName]§!、§Y[363.getName]§!、§Y[367.getName]§!、§Y[370.getName]§!、§Y[371.getName]§!、§Y[368.getName]§!、§Y[369.getName]§!、§Y[362.getName]§!："

 USA_the_gettysburg_debate: "葛底斯堡辩论"
 USA_the_gettysburg_debate_desc: "自我们革命以来，我们技术上已经尝试过两次邦联化。第一次是无知的失败，第二次诚然是形式上的失败，但第二次在自身中找到了稳定性和同志情谊，这些我们今天肯定能用上。重新审视那个失败邦联的性质，并决定是否应该再试一次，可能会有用。"
 USA_the_gettysburg_debate_tt: "§Y美国人民§!将开始考虑§Y邦联化§!的前景。"

 USA_a_question_of_confidence: "信心问题"
 USA_a_question_of_confidence_desc: "将我们引至此刻的治理、经济和政治实践已经辜负了我们，并一再证明它们无法果断有效地行动。改变路线是唯一明智的选择。"

 USA_america_on_its_own: "美国独自前行"
 USA_america_on_its_own_desc: "美国最初是由那些被旧世界困扰并希望寻找新世界的人建立的，我们先辈的智慧继续印证着真理。外面的世界继续辜负其人民和我们。我们不能依赖他们——美国的前进道路，无论它将通向何方，都必须独自走过。"

 USA_first_among_equals: "平等中的第一"
 USA_first_among_equals_desc: "美国最初是由那些被旧世界困扰并希望寻找新世界的人建立的，我们先辈的智慧继续印证着真理。很明显，旧世界无法超越其漫长而动荡的历史和冲突，但我们能看透他们的纷争。美国将在文明的舵手位置上占据其应有的位置。"
 USA_first_among_equals_tt: "此§Y国策§!将推动我们§Y开始§!一场§R内战§!！"

 USA_patriot_parades: "爱国者游行"
 USA_patriot_parades_desc: "在这个充满不确定性和担忧的时刻，那些身强力壮、精神饱满的人的集会将奇迹般地从这个国家的废墟中提振其灵魂。黑暗时代已经对我们施压，但通过力量和决心，我们将看到通往新黎明的道路！"

 USA_patriots_stand_ready: "爱国者准备就绪"
 USA_patriots_stand_ready_desc: "冲突正在酝酿，只有那些看到即将到来之事的人才能承担起任何责任。我们将先发制人地在全国组织民兵团体和陆军部队，以应对不可避免的爆发，因此当时刻到来时，我们将准备好出击并抓住时机。"
 USA_patriots_stand_ready_tt: "当§Y内战开始§!时，我们将获得更多§Y部队§!和§Y装备§!。"

 USA_the_philadelphia_fiasco: "费城惨败"
 USA_the_philadelphia_fiasco_desc: "数十名参议员和众议员在国会提出了一项用于费城市总体发展的项目法案。支出方案中的明珠是建造安布尔顿剧院，它将为该市提供一流的设施。"

 USA_the_parkerite_act: "帕克主义法案"
 USA_the_parkerite_act_desc: "在费城悲剧之后，公众一直公开抗议华盛顿特区。作为回应，几位南方参议员提出了《帕克主义法案》，该法案将把第22修正案纳入宪法，赋予各州对其边界或管辖范围内所有联邦项目和资金的权威否决权和监督权。"

 USA_what_the_future_holds: "未来会怎样"
 USA_what_the_future_holds_desc: "在费城悲剧之后，公众已经受够了联邦政府的失败。火柴即将被点燃的时刻正在迅速临近。联邦政府需要从根本上重组，而目前掌权的人永远不会自愿交出他们的缰绳。"
 USA_what_the_future_holds_tt: "\n此§Y精神§!将在§Y内战§!开始时被§Y移除§!。"

 USA_paul_revere_rides_again: "保罗·里维尔再次骑行"
 USA_paul_revere_rides_again_desc: "美利坚合众国联邦政府已经失去了其统治权。它和整个国家都必须重组，以确保国家的延续。不幸的是，这将需要一场暂时的分裂，必须用鲜血和钢铁来弥合，但美国人喜欢挑战。"
 USA_paul_revere_rides_again_tt: "我们将§R发动内战§!！\n我们拥有的§Y法西斯主义支持§!越多，就会有越多的§Y州§!站在我们一边。"

 USA_the_goldstar_federation: "金星联邦"
 USA_the_goldstar_federation_desc: "旧制度很强大，但还不够强大——太弱，无法在危机的冲击中生存；太弱，无法抵抗旧世界的失败。必须建立新秩序，一个将美国人民及其愿景和未来置于一切和其他人之上。旧美国未能抓住其命运——我们不会再犯那个错误。"
 USA_the_goldstar_federation_tt_2: "只要§YUSA§!仍留在§Y$USA_the_goldstar_federation_tt$§!派系中，§YUSA§!及其§Y傀儡§!将拥有§Y$USA_goldstar_dynamic_modifier$§!动态修正。\n如果§YUSA§!不再是§Y$USA_the_goldstar_federation_tt$§!派系的首领，此修正将被§R失去§!。"
 USA_the_goldstar_federation_tt_3: "创建派系：§Y$USA_the_goldstar_federation_tt$§!。"

 USA_the_second_confederation: "第二邦联"
 USA_the_second_confederation_desc: "很明显，我们身份中固有的权力分立没有得到应有的重视。各州的权利将取代中央政府的权力。是时候我们为一个更完美的联盟奠定基础，纠正旧的失败，改进第一邦联的精神和愿景。"

 USA_swift_and_lethal: "迅速而致命"
 USA_swift_and_lethal_desc: "要么我们现在必须行动，要么我们就不行动，但我们不能继续在如何以及在哪里进攻和实现我们的目标上犹豫不决。如果我们给对手时间，他们将重组并发动更顽强的防御，而我们不想损失比必要更多的生命。"

 USA_peace_guarantees_for_our_neighbors: "我们邻国的和平保障"
 USA_peace_guarantees_for_our_neighbors_desc: "在解决了我们内部动荡的主要部分后，向我们的朋友和邻国伸出援手并让他们放心我们的平静和友善本性将是明智的。让他们不担心是正确的，但同样重要的是确保我们的侧翼不会变得脆弱。"

 USA_our_safety_before_yours: "我们的安全先于你们"
 USA_our_safety_before_yours_desc: "我们邻国的安全与我们的安全密不可分——应该让他们明白这种安全是有代价的。驻军、让步以及在其事务中的坚定掌控，是只有我们能提供的保护的小小代价。我们的资源安全将由我们对该半球资源的控制来塑造。"

 USA_the_sun_has_already_set: "太阳早已落下"
 USA_the_sun_has_already_set_desc: "伦敦和巴黎紧抓着他们再也负担不起的帝国。我们将让他们如此。当旧列强在更多无果的战争中耗尽自己时，整个半球在我们面前敞开。一个不愿抓住时机的国家不配拥有时机，而我们将抓住黎明本身。"

 USA_americas_rightful_claims: "美国的合法要求"
 USA_americas_rightful_claims_desc: "西方的命运是一条穿过华盛顿的道路。对于显而易见的事情无需委婉。我们将夺取属于我们的东西。"
 USA_americas_rightful_claims_tt: "解锁§Y决议§!以§Y控制领土§!在§Y北美洲§!和§Y中美洲§!。\n\n如果选择了§Y$USA_peace_guarantees_for_our_neighbors$§!，我们将能够与邻国§Y建立信任§!。\n\n如果选择了§Y$USA_our_safety_before_yours$§!，我们将能够§Y恐吓§!我们的邻国。"

 USA_golden_opportunities: "黄金机遇"
 USA_golden_opportunities_desc: "美洲属于我们，如果我们的邻国拒绝屈服，那么我们将在他们最意想不到的时候给他们一个惊喜。当金色太阳升起时，它将投下长长的阴影，我们将在那黑暗中工作，将整个大陆带入新兴的光芒中。"
 USA_golden_opportunities_tt: "解锁§Y决议§!以§Y渗透美洲国家§!并从内部接管它们，最终允许§Y美国§!§R政变§!其政府并§Y确立控制§!。"

 USA_ballads_between_brothers: "兄弟之间的歌谣"
 USA_ballads_between_brothers_desc: "由于我们的邻近以及我们国家之间丰富的文化交融，伸出援手并进一步改善我们与加拿大人和墨西哥人的关系应该不是难事。此外，两者都有我们渴望的东西，而我们选择通过和平、外交和苹果派来获得这些东西。"

 USA_establish_the_new_southern_states: "建立新的南方州"
 USA_establish_the_new_southern_states_desc: "我们将致力于在我们南方建立里奥格兰德和索诺拉，为这些地区及其人民带来更大的自治权和市场准入，同时也为自己提供一个缓冲。"
 USA_establish_the_new_southern_states_tt: "  将§Y确保§!我们的侧翼。"

 USA_country_roads_through_the_north: "穿越北方的乡村道路"
 USA_country_roads_through_the_north_desc: "分隔美国本土和阿拉斯加领土的西部缺口人口极其稀少，只有加拿大人。我们将努力伸出援手，提供大量现金和投资以换取这些土地，以便我们能够连接我们整个大陆领土并确保我们在北方的地位。"

 USA_prudence_across_the_land: "遍布大地的审慎"
 USA_prudence_across_the_land_desc: "随着我们的侧翼得到更好的保障，我们现在可以关注保护我们的和平，并使我们对于任何潜在侵略者来说都特别棘手。"

 USA_secure_the_gulf: "确保墨西哥湾"
 USA_secure_the_gulf_desc: "只要墨西哥湾仍未得到保障，我们的敌人就能利用我们的南部海岸线。我们将掩盖这一不安全因素，并控制我们在近海地区的合法要求。"

 USA_the_rush_for_the_canal: "争夺运河"
 USA_the_rush_for_the_canal_desc: "谁控制了巴拿马运河，谁就控制了半球两侧的海军力量。不仅我们完全确保它以维持我们的力量投射能力是绝对必要的，运河本身也是我们的财产和遗产，我们不会让它沦陷。"

 USA_seize_the_great_flanks: "夺取巨大的侧翼"
 USA_seize_the_great_flanks_desc: "我们将夺取环绕美国的广阔领土和海洋，并确立我们对整个大陆的完全控制。"

 USA_realize_the_golden_circle: "实现金色圆环"
 USA_realize_the_golden_circle_desc: "很久以前，美国一个名为金色圆环骑士团的精英社团想象了一个大陆帝国，它向外延伸并统治整个北美洲。今天，我们实现那个梦想并宣告其现实。"
 USA_realize_the_golden_circle_trigger_tt_NOT: "控制所有§Y北美洲§!地区"
 USA_realize_the_golden_circle_trigger_tt_2_NOT: "控制所有§Y中美洲§!和§Y墨西哥湾§!地区"
 USA_realize_the_golden_circle_trigger_tt_3_NOT: "控制§Y南方山脊§!地区"

 USA_no_place_for_traitors: "叛徒无处容身"
 USA_no_place_for_traitors_desc: "当我们准备向世界进军时，我们不能容忍已经在我们内部的颠覆分子。那些希望看到伟大美国计划失败的人将不会得到行动自由。当我们带来新黎明时，我们不会给他们留下任何可以躲藏的阴影。"

 USA_pledge_for_the_new_order: "为新秩序宣誓"
 USA_pledge_for_the_new_order_desc: "柏林提出平等伙伴关系——一个以力量回应力量的新秩序。站在唯一不怕建设新世界的大国身旁并无羞耻。"

 USA_renaissance_and_retribution: "复兴与报应"
 USA_renaissance_and_retribution_desc: "旧世界正处于垂死挣扎中，而我们正在崛起。即使[GER.GetNameDefCap]再次试图超越欧洲的停滞，我们也能看穿他们徒劳的尝试。一个新世界正在被锻造，我们将是挥舞锤子的人；德国仅仅是我们的铁砧。"
 USA_renaissance_and_retribution_tt: " - 如果与§Y[GER.getName]§!交战，此理念将被§R失去§!。"
 USA_renaissance_and_retribution_tt_2: "解锁§Y决议§!以篡夺§Y[GER.GetName]§!的权威并控制§Y轴心国§!或§Y直接支配德国§!。"

 USA_throw_in_with_the_old: "与旧世界为伍"
 USA_throw_in_with_the_old_desc: "我们没有忘记我们的根源。我们的文化和历史与英国人和法国人紧密相连，我们坚定不移。在这绝望的时刻，我们将到来，高举欧洲再也无法承载的火炬。"

 USA_do_our_part: "尽我们的本分"
 USA_do_our_part_desc: "尽管我们有保留意见，但我们面临的战争需要前所未有规模的国际合作。然而，我们有资源和精神去坚持，在向外迈进保护盟友安全的同时维护我们自己的安全。"
 USA_do_our_part_tt: "解锁ABDACOM§Y联合国策树§!"
 USA_do_our_part_tt_2: "如果我们与§Y[ENG.getName]§!在同一§Y派系§!中，我们的§Y派系成员§!将获得："

 USA_the_eagle_flies_alone: "雄鹰独自飞翔"
 USA_the_eagle_flies_alone_desc: "我们不会等待向旧世界请求许可才行动。我们的未来掌握在自己手中，我们的命运由我们掌握，我们不会让任何对手阻挡我们的道路。"

 USA_imperial_roost: "帝国栖息地"
 USA_imperial_roost_desc: "[ROOT.GetNameDefCap]是西半球的命中注定的继承者。它是雄鹰的领地，它在此栖息。不允许任何敌人攻击它，它对其领土的最远端拥有完全的控制和主导权。南北美洲的天空、陆地和海洋都属于我们。"
 USA_imperial_roost_tt: "每一个在我们§Y霸权§!下的§Y美洲§!国家：\n---------------------------------------------------------\n\n"
 USA_imperial_roost_tt_2: "如果尚未成为§Y[USA.GetNameDefCap]§!的§Y傀儡§!，则成为其傀儡。\n§Y加入§!§Y[USA.GetAdjective]§!的派系。\n\n---------------------------------------------------------"

 USA_a_song_for_the_horizon: "地平线之歌"
 USA_a_song_for_the_horizon_desc: "“……地图上有一条线，旧世界在那里结束，年轻世界开始生长——好吧，我有一卡车星条旗，却无处可去。从里奥格兰德到白令海峡，从平原到异国海岸，如果上帝给了我们这整个广阔世界，那么我想我们还没完，不，我们还没完，\n我们只是要再来一次天定命运……”"

 USA_stars_on_the_horizon: "地平线上的星辰"
 USA_stars_on_the_horizon_desc: "在过去几年里，绝望笼罩了美国人民，但他们没有放弃——他们坚持了下来。现在我们开始看到那种坚持的全部成果，它不满足于恢复现状，只有开辟一条新的、更光荣的道路才能使其满足。"

 USA_the_eagle_lifts_its_wings: "雄鹰展翅"
 USA_the_eagle_lifts_its_wings_desc: "经济再次翱翔于任何人认为可能的水平之上！美国人民已完全从沉睡中醒来，摆脱了大萧条的痛苦。世界其他地方敬畏地注视着我们的伟大韧性和勇气。"
 USA_the_eagle_lifts_its_wings_tt: "§Y解锁§!§Y$USA_general_motors$§!工业关切。"

 USA_lady_libertys_arsenal: "自由女神的兵工厂"
 USA_lady_libertys_arsenal_desc: "经济已完全恢复，我们的精神再次自由。世界局势日益升温，我们现在需要更成熟和顶级的军事工业来跟上。"

 USA_federal_recovery_emergency_enterprise: "联邦复苏紧急企业"
 USA_federal_recovery_emergency_enterprise_desc: "联邦复苏紧急企业，简称FREE，将促进联邦资金的分配以及人民国家对美国经济复苏、增长和未来保护的关注。它将被赋予广泛的权力，无论是在其可以要求什么还是在其可以允许什么方面。"
 USA_federal_recovery_emergency_enterprise_tt: "添加§Y$USA_FREE_dynamic_modifier$§!，其授予当前[USAGetFREETitle]政策：\n  §Y(-3)§! [USA_federal_recovery_emergency_enterprise_SL_a]\n  §Y(-3)§! [USA_federal_recovery_emergency_enterprise_SL_b]\n  §Y(-3)§! [USA_federal_recovery_emergency_enterprise_SL_c]\n  §Y(-3)§! [USA_federal_recovery_emergency_enterprise_SL_d]\n  §Y(-3)§! [USA_federal_recovery_emergency_enterprise_SL_e]\n  §Y(-3)§! [USA_federal_recovery_emergency_enterprise_SL_f]\n"
 USA_federal_recovery_emergency_enterprise_tt_2: "每§Y10点§!§Y资金§!可以修改一个§9部门§!，从§R-30§!到§G+50§!点。大多数§Y国策§!将§Y转移资金§!。"

 USA_crisis_of_dependency: "依赖危机"
 USA_crisis_of_dependency_desc: "随着全球贸易和世界共享经济的崩溃，我们在国内陷入了危机。虽然保守地进行贸易有巨大好处，但很明显我们无法将我们的福祉寄托在其他人的工业上。"

 USA_the_bay_otzen_plan: "贝-奥岑计划"
 USA_the_bay_otzen_plan_desc: "经济学家奥斯瓦尔德·贝与新成立的经济学奥岑研究所合作，向国会提交了一份未来计划。它详细说明了对我们历史政策的彻底背离：限制出口、增加关税、补贴基础产业，并将FREE整合到全国各地的公共工程项目中。这个计划可能是我们实现正常和稳定的唯一希望。"

 USA_invest_in_infrastructure: "投资基础设施"
 USA_invest_in_infrastructure_desc: "国家的每一部分都通过我们共享的基础设施与每一其他部分互动。如果我们要能够依赖自己，就需要能够可靠地到达我们的邻居。"

 USA_reinforce_interstate_routes: "加强州际路线"
 USA_reinforce_interstate_routes_desc: "我们需要一个遍布全国的全面高速道路和系统网络。州际项目将提供必要的重点。"

 USA_finance_new_mines_and_refineries: "资助新矿山和炼油厂"
 USA_finance_new_mines_and_refineries_desc: "随着我们的工业复苏和经济再次增长，我们将需要比以往更多的资源。明天的世界由橡胶轮胎、石油发动机和最好材料的先进合金构成。"

 USA_establish_new_forestry_zones: "建立新林业区"
 USA_establish_new_forestry_zones_desc: "通过发放大量新林业许可证，我们可以将很大一部分自然资源开放给工业使用，并雇用数万名准备好的美国人。我们的国家公园将仍然是神圣的宁静领域，但我们也会利用我们的森林。"

 USA_tap_old_gold_mines: "开采旧金矿"
 USA_tap_old_gold_mines_desc: "有了新的工具，我们可以重新审视我们的旧采石场和矿山，并尝试获取那些以前太难开采的资源。"

 USA_the_continental_grid: "大陆电网"
 USA_the_continental_grid_desc: "随着我们机械掌握和技术知识的增加，我们能够更有效地开发大陆的自然财富并将其用于普通美国人的利益。通过创建一个统一的资源开采和发展实体网络，我们将能够协调我们国库的总体充实。"

 USA_american_wellspring_administration: "美国源泉管理局"
 USA_american_wellspring_administration_desc: "FREE将发展一个子实体：美国源泉管理局。其角色将是促进自然资源开采、精炼和使用方面的广泛组织和伙伴关系。"
 USA_american_wellspring_administration_tt: "§Y解锁§!§Y$FREE_american_wellspring_administration$§!工业关切。"

 USA_american_architectural_administration: "美国建筑管理局"
 USA_american_architectural_administration_desc: "FREE将发展一个子实体：美国建筑管理局。其角色将是连接和标准化全国各地的各种建筑实践，改善可开发领土的范围并提高其利用速率。"
 USA_american_architectural_administration_tt: "§Y解锁§!§Y$FREE_american_architectural_administration$§!工业关切。"

 USA_ohio_mechanical_complex: "俄亥俄机械综合体"
 USA_ohio_mechanical_complex_desc: "巨大的工业坐落在新英格兰以西，等待重启和提振。数百万坚定的美国人准备好投入建设美国未来的工作。"

 USA_strive_for_the_present: "为当下奋斗"
 USA_strive_for_the_present_desc: "我们将把注意力集中在立即将国家从昏睡中拉出来，尽管一些努力会借用我们以后必须偿还的信用。"
 USA_strive_for_the_present_tt: "当我们§G完成§!国策§Y$USA_north_american_autarky$§!时，我们将§G获得§!一个§Y小加成§!。"

 USA_rapid_growth: "快速增长"
 USA_rapid_growth_desc: "为了让我们的工业再次运转，有必要在一些地方跳过一些步骤，并将行动优先于一切。没有时间可以浪费！"

 USA_protect_our_tomorrow: "保护我们的明天"
 USA_protect_our_tomorrow_desc: "我们将把注意力集中在解决国家的需求上，并准备让它重新站起来，完全恢复和能力充足。"
 USA_protect_our_tomorrow_tt: "当我们§G完成§!国策§Y$USA_north_american_autarky$§!时，我们将§G获得§!一个§Y中等加成§!。"

 USA_promote_the_national_will: "促进国家意志"
 USA_promote_the_national_will_desc: "我们需要记住我们为何做我们所做的事，以及我们为谁而做。随着时间的推移，资金将可用于帮助我们的家庭和小社区，我们的整个文化和社会都建立在其上。"

 USA_steady_economic_policies: "稳健的经济政策"
 USA_steady_economic_policies_desc: "务实的经济政策将有助于塑造经济的增长趋势，并确保储蓄将成熟、财产将发展、资源将可用。只要一个人知道自己可以指望一个稳定的未来，他们就可以在当下为此付出全力。"

 USA_plan_for_the_future: "为未来规划"
 USA_plan_for_the_future_desc: "我们将把注意力集中在长期计划上，这些计划将给我们带来最大的回报，尽管这些需要时间。"
 USA_plan_for_the_future_tt: "在§Y250天§!后，我们将获得：\n"
 USA_plan_for_the_future_tt_2: "获得此理念§Y250天§!后，我们将获得：\n"
 USA_plan_for_the_future_tt_3: "$special_v_consumer_goods_factor_tt$§Y-25.0%§!\n$production_speed_buildings_factor_tt$§G+10.0%§!\n$production_factory_max_efficiency_factor_tt$§G+10.0%§!"
 USA_plan_for_the_future_tt_4: "持续§Y250§!天。"
 USA_plan_for_the_future_tt_5: "当我们§G完成§!国策§Y$USA_north_american_autarky$§!时，我们将§G获得§!一个§Y大加成§!。"

 USA_invest_in_long_term_schemes: "投资长期计划"
 USA_invest_in_long_term_schemes_desc: "就其本质而言，未来的投资不会立即成熟。在建设我们期盼的明天时，我们必须保持耐心。"

 USA_blue_districts: "蓝色区"
 USA_blue_districts_desc: "借用奥斯瓦尔德·贝作品中的一个术语，‘蓝色区’是由州监管的经济区，旨在最大化我们最优秀和最聪明者的效率和机会。法规和繁文缛节以无罪推定方式适用，税收和利润被要求以高比率再投资，有效的基础设施是首要任务。"
 USA_blue_districts_tt: "解锁§Y决议§!以在人口稠密的州建立§Y蓝色区§!。"

 USA_increase_technological_funding: "增加技术资金"
 USA_increase_technological_funding_desc: "我们对经济和人民的投资已经开始回本，我们现在发现有大量资本和人才准备部署。随着我们国家的天才扩展，我们的工业、安全和生活方式也随之扩展。将这些回报投入未来的进一步投资将有助于确保我们的儿女有一个更繁荣的明天。"

 USA_north_american_autarky: "北美自给自足"
 USA_north_american_autarky_desc: "我们为自己的后代建造了一个伊甸园。在我们的两个海岸之间，现在生活着一个自给自足的民族，能够抵御世界上最猛烈的风暴。我们的工业已飙升至新高度，赋予美国建造她心之所向的一切的能力。"
 USA_north_american_autarky_tt_1: "此国策将根据所选择的§Y投资时间尺度§!而§Y更有价值§!。"
 #USA_north_american_autarky_tt_2: "如果选择了§Y$USA_strive_for_the_present$§!："
 USA_north_american_autarky_tt_2_i: "如果选择了§Y$USA_strive_for_the_present$§!："
 USA_north_american_autarky_tt_2_c: "§Y$USA_strive_for_the_present$§!授予："
 #USA_north_american_autarky_tt_2_y: "§3如果选择了$USA_strive_for_the_present$：§!"
 #USA_north_american_autarky_tt_2_n: "§g如果选择了$USA_strive_for_the_present$：§!"
 #USA_north_american_autarky_tt_3: "如果选择了§Y$USA_protect_our_tomorrow$§!："
 USA_north_american_autarky_tt_3_i: "如果选择了§Y$USA_protect_our_tomorrow$§!："
 USA_north_american_autarky_tt_3_c: "§Y$USA_protect_our_tomorrow$§!授予："
 #USA_north_american_autarky_tt_3_y: "§3如果选择了§Y$USA_protect_our_tomorrow$§!：§!"
 #USA_north_american_autarky_tt_3_n: "§g如果选择了$USA_protect_our_tomorrow$：§!"
 #USA_north_american_autarky_tt_4: "如果选择了§Y$USA_plan_for_the_future$§!："
 USA_north_american_autarky_tt_4_i: "如果选择了§Y$USA_plan_for_the_future$§!："
 USA_north_american_autarky_tt_4_c: "§Y$USA_plan_for_the_future$§!授予："
 #USA_north_american_autarky_tt_4_y: "§3如果选择了§Y$USA_plan_for_the_future$§!：§!"
 #USA_north_american_autarky_tt_4_n: "§g如果选择了$USA_plan_for_the_future$：§!"

 USA_kickstart_the_steel_belt: "启动钢铁带"
 USA_kickstart_the_steel_belt_desc: "我们重工业的心脏只需要正确的推动和正确的资金，就能重新站起来并再次屹立。"

 USA_focus_on_our_fleets: "关注我们的舰队"
 USA_focus_on_our_fleets_desc: "作为一个两侧被大洋环绕的国家，我们舰队的有效性对我们的投射和安全至关重要。我们需要确保我们的舰队得到应有的关注。"
 USA_focus_on_our_fleets_tt: "如果此国策在§Y$USA_focus_on_our_army$§!§G之前§!选择：\n\n§Y1x§!§G100%§!研究加成：§Y舰船§!。"
 USA_focus_on_our_fleets_tt_2: " 船坞产出：§G+5.0%§!\n\n---------------------------------------------------------\n如果此国策在§Y$USA_focus_on_our_army$§!§R之后§!选择：\n\n§Y1x§!§G50%§!研究加成：§Y舰船§!。"
 USA_focus_on_our_fleets_tt_3: " 船坞产出：§G2.0%§!"

 USA_increase_naval_funding: "增加海军资金"
 USA_increase_naval_funding_desc: "一如既往，需要更多资金和投资来使我们的舰队达到最佳状态。现代化旧船体、建造新船体以及保持船员训练和准备就绪是一项昂贵的任务。"
 USA_increase_naval_funding_tt: "如果§Y$USA_focus_on_our_fleets$§!已完成，此§Y国策§!将§G更有效§!。\n "

 USA_shipwreckers: "破船者"
 USA_shipwreckers_desc: "训练我们的船坞专家和损害管制队处理最坏情况，将为我们的舰船做好高强度战斗的准备。"

 USA_special_investments_in_annapolis: "安纳波利斯特别投资"
 USA_special_investments_in_annapolis_desc: "随着美国海军的成熟，很明显它需要越来越多和越来越有才华的军官。"

 USA_focus_on_our_army: "关注我们的陆军"
 USA_focus_on_our_army_desc: "美国陆军已经断断续续地作战了一个多世纪，它仍然是我们国家捍卫其主张和家园能力的关键方面。我们需要确保我们的部队得到应有的关注。"
 USA_focus_on_our_army_tt: "如果此国策在§Y$USA_focus_on_our_fleets$§!§G之前§!选择：\n\n§Y1x§!§G100%§!研究加成：§Y步兵科技和卡车§!。"
 USA_focus_on_our_army_tt_2: " 工厂产出：§G+5.0%§!\n\n---------------------------------------------------------\n如果此国策在§Y$USA_focus_on_our_fleets$§!§R之后§!选择：\n\n§Y1x§!§G50%§!研究加成：§Y步兵科技和卡车§!。"
 USA_focus_on_our_army_tt_3: " 工厂产出：§G2.0%§!"

 USA_increase_army_funding: "增加陆军资金"
 USA_increase_army_funding_desc: "一如既往，需要更多资金和投资来保持我们的师配备现代有效的装备，而高级训练需要越来越多的资源。维持一支现代陆军是一项昂贵的事业。"
 USA_increase_army_funding_tt: "如果§Y$USA_focus_on_our_army$§!已完成，此§Y国策§!将§G更有效§!。\n "

 USA_precision_mechanisms: "精密机械"
 USA_precision_mechanisms_desc: "在现代战争中，胜利可能取决于技术和物质的进步。设计能够利用我们最先进成果的装备，将给我们部队最好的机会。"

 USA_special_investments_in_westpoint: "西点特特别投资"
 USA_special_investments_in_westpoint_desc: "随着美国陆军的成熟，很明显它需要越来越多和越来越有才华的军官。"

 USA_industrialize_california: "工业化加利福尼亚"
 USA_industrialize_california_desc: "在加利福尼亚创建一个大型工业行动基地将使我们能够更有效地向西部投入资源。它还将帮助我们确保对太平洋领土的控制。"

 USA_industrial_funding: "工业资金"
 USA_industrial_funding_desc: "我们的工厂不靠演讲运转。我们将打开国库，让工业决定它需要什么。"

 USA_wonder_workshops: "奇迹工坊"
 USA_wonder_workshops_desc: "美国的制造厂生产世界上一些最优雅和精密的设备和奢侈品。我们从世界所有人才中受益，进一步投资于我们的顶级设计将在未来为我们服务。"

 USA_improve_military_training: "改进军事训练"
 USA_improve_military_training_desc: "拥有如此庞大的陆军，我们需要确保我们的训练方法不仅有效，而且能够随着我们队伍的增长而增长。"

 USA_county_militias: "县民兵"
 USA_county_militias_desc: "如果战争降临到我们的海岸，最坚定守住防线的将是美国人民自己。"

 USA_independently_funded_armories: "独立资助的军械库"
 USA_independently_funded_armories_desc: "通过赋予个人和社区更多采购防御装备的权利，平民团体和州资助的民兵将能够配备现代精密的装备和武器，使他们能够对抗最强大的入侵者。"

 USA_civilian_logistics_contracts: "民用后勤合同"
 USA_civilian_logistics_contracts_desc: "拥有更好的后勤不能赢得战争，但谁的后勤先失败谁就肯定会输。鉴于我们可能被要求作战的范围，将我们的后勤系统扩展到包括广泛的民用机构，将给我们必要的战略灵活性，以在每个时刻、每个地点继续战斗。"

 USA_terrain_navigation_courses: "地形导航课程"
 USA_terrain_navigation_courses_desc: "能够穿越茂密的森林、起伏的平原和险峻的山脉，在战争中给予人巨大的优势。如果一支军队计划在我们家园与我们作战，他们将不得不面对我们环境的巨大多样性，以及我们能够在这些环境中娴熟行动的庞大人口。"

 USA_cloth_and_rope_ramparts: "布绳壁垒"
 USA_cloth_and_rope_ramparts_desc: "即使是最基本和必要的家庭物品也可以用来在任何地方建造防御工事和隐蔽阵地。关键在于创造力，现在在我们的人民中激发这种创造力将帮助他们在以后更有想象力。"

 USA_confederalized_asset_procurement: "邦联化资产采购"
 USA_confederalized_asset_procurement_desc: "在联邦政府、州政府和地方分遣队之间分配发展武器储备的责任和义务将是一项昂贵且最初令人生畏的组织任务，但一旦完全分散化，每个团体和个人都将能够就地应用自己的专业知识和知识，以促进我们的全面准备。"

 USA_FREE_improved_focus: "改进重点"
 USA_FREE_improved_focus_desc: "当FREE将时间和资源投入某个部门时，需要动员数十万人。这些大规模行动难以协调，但随着该部门的工作和行动，它及其领导层将变得更加有效。"
 USA_FREE_improved_focus_tt: "§G提升§![USAGetFREETitle]的§Y重点§!价值，今后分别为§Y(+1§!、§Y+2§!、§Y+3)§!。\n§R（不修改现有资金）§!"

 USA_FREE_recovery_funds: "复苏资金"
 USA_FREE_recovery_funds_desc: "由于联邦政府的资金和关注主要由FREE引导，不在其重点范围内的特殊利益领域往往被遗忘在边缘。因此，需要一个新的小组委员会来妥善处理那些被意外遗漏的部门。"
 USA_FREE_recovery_funds_tt: "每个目前在[USAGetFREETitle]下§Y困境§!中的§9部门§!将获得§G额外资金§!§Y(+[?FREE_recovery_funds_S])§!（§G$S_LOC$§!）。\n目前§Y繁荣§!的§9部门§!将获得§G少量资金§!§Y(+[?FREE_recovery_funds_P])§!（§G$P_LOC$§!）。"

 USA_FREE_expert_guidance: "专家指导"
 USA_FREE_expert_guidance_desc: "特别是对于一个大型政府机构来说，不可能确切知道如何在一个国家行动的所有方面的最细微细节中运作。因此，每当处理某个特定部门时，FREE将外包该领域的专家和行家来提供指导。"
 USA_FREE_expert_guidance_tt: "每个目前在[USAGetFREETitle]下§Y繁荣§!的§9部门§!将获得§G额外资金§!§Y(+[?FREE_expert_guidance_P])§!（§G$P_LOC$§!）。\n目前§Y困境§!中的§9部门§!将获得§G少量资金§!§Y(+[?FREE_expert_guidance_S])§!（§G$S_LOC$§!）。"

 USA_FREE_improved_focus_II: "改进重点 II"
 USA_FREE_improved_focus_II_desc: "推动某个部门的努力可以通过创建独立的承包商和专家组来进一步改进，以监督其领域内资金的分配以及人才和资源的分配。"
 USA_FREE_improved_focus_II_tt: "§G进一步提升§![USAGetFREETitle]的§Y重点§!价值，今后分别为§Y(+1§!、§Y+2§!、§Y+3)§!。\n§R（不修改现有资金）§!"

 USA_FREE_funds_management: "资金管理"
 USA_FREE_funds_management_desc: "在一个像FREE这样宏大的组织中，必然会有大量资金因某种原因最终无处可去。在每个新项目开始时注意这一点将有助于减少总体浪费。"
 USA_FREE_funds_management_tt: "§G减少§![USAGetFREETitle]的§Y重点§!的§Y严重惩罚§!，今后为§Y(-1)§!。\n§R（不修改现有资金）§!"

 USA_FREE_top_end_funds_management: "高端资金管理"
 USA_FREE_top_end_funds_management_desc: "FREE的行政部门将把注意力集中在为该组织最宏大的事业妥善分配资金和资源上。"
 USA_FREE_top_end_funds_management_tt: "§G进一步减少§![USAGetFREETitle]的§Y重点§!的§Y严重惩罚§!，今后为§Y(-1)§!。\n§R（不修改现有资金）§!"

 USA_FREE_lower_end_funds_management: "低端资金管理"
 USA_FREE_lower_end_funds_management_desc: "FREE的行政部门将把注意力集中在向那些构成该组织大部分产出的项目妥善分配和委派角色和资源上。"
 USA_FREE_lower_end_funds_management_tt: "§G减少§![USAGetFREETitle]的§Y重点§!的§Y大幅惩罚§!，今后为§Y(-1)§!。\n§R（不修改现有资金）§!"

 USA_FREE_department_expansion: "部门扩展"
 USA_FREE_department_expansion_desc: "有了新办公室、新人员和新范围，FREE将能够扩大其影响力和效果。"
 USA_FREE_department_expansion_tt: "允许[USAGetFREETitle]的§Y重点§!或§Y资金管理§!§G改进§!。\n\n所有§9部门§!遭受§R轻微惩罚§!§Y([?FREE_points_V])§!。"
 USA_FREE_department_expansion_tt_2: "§Y解锁§!§YFREE§!工业关切。"

 USA_FREE_raise_taxes_for_reinvestment: "提高税收以再投资"
 USA_FREE_raise_taxes_for_reinvestment_desc: "联邦政府将通过提高税收来改善和扩大FREE的能力和容量。虽然这不是最受欢迎的选择，但它将是最负责任的。"
 USA_FREE_raise_taxes_for_reinvestment_tt: "允许[USAGetFREETitle]的§Y重点§!或§Y资金管理§!§G进一步改进§!。\n\n所有§9部门§!遭受§R轻微惩罚§!§Y([?FREE_points_V])§!。"
 USA_FREE_raise_taxes_for_reinvestment_tt_2: "§G改进§!§YFREE§!工业关切。"

 USA_FREE_print_money_to_fund_FREE: "印钞资助FREE"
 USA_FREE_print_money_to_fund_FREE_desc: "联邦政府将简单地印钞来支付FREE的新系统和工作队伍。这在短期内会更有效，尽管其负面影响可能会在以后感受到，届时FREE只需让自己有价值到那种程度。"
 USA_FREE_print_money_to_fund_FREE_tt: "允许[USAGetFREETitle]的§Y重点§!或§Y资金管理§!§G进一步改进§!。\n\n所有§9部门§!遭受§R轻微惩罚§!§Y([?FREE_points_V])§!。"
 USA_FREE_print_money_to_fund_FREE_tt_2: "§G改进§!§YFREE§!工业关切。"

 USA_FREE_undersecretariat_for_sectoral_administration: "部门行政副秘书处"
 USA_FREE_undersecretariat_for_sectoral_administration_desc: "FREE的影响力和规模已增长到变得笨拙的程度。作为回应，将成立部门行政副秘书处，以作为进一步的指导和管理层，使FREE能够在其当前和仍在扩大的范围内有效运作。"
 USA_FREE_undersecretariat_for_sectoral_administration_tt: "§Y$USA_FREE_dynamic_modifier$§!变为§Y$USA_FREE_dynamic_modifier_2$§!。\n\n允许[USAGetFREETitle]的§Y重点§!和§Y资金管理§!§G完全改进§!。\n\n所有§9部门§!遭受§R轻微惩罚§!§Y([?FREE_points_V])§!。"
 USA_FREE_undersecretariat_for_sectoral_administration_tt_2: "§G改进§!§YFREE§!工业关切。"

 USA_FREE_recovery_achieved: "实现复苏"
 USA_FREE_recovery_achieved_desc: "经济繁荣，美国人民已经恢复，金钱再次自由流动！既然我们不再需要对我们的钱袋保持如此严格的控制，FREE就可以以更快的速度和每个提案背后更多的资源来推动各部门。"
 USA_FREE_recovery_achieved_tt: "此国策将给予§Y更大的好处§!，[USAGetFREETitle]的§Y正资金§!越多。\n\n"
 USA_FREE_recovery_achieved_tt_2: "§G提升§![USAGetFREETitle]的§Y重点§!的所有价值§Y(+1)§!。\n§G移除§![USAGetFREETitle]的§Y重点§!的所有轻微惩罚§!。\n§R（不修改现有资金）§!"

 USA_grange_auxiliary_corps: "农会辅助队"
 USA_grange_auxiliary_corps_desc: "农会长期以来一直是该国农村地区的长期福音——他们懂行。我们可以雇用他们来修复我们的基础设施，修缮我们的城镇和街道，而且他们已经拥有完成大部分工作所需的资源。"

 USA_protect_against_foreign_interference: "防范外国干涉"
 USA_protect_against_foreign_interference_desc: "有许多外部势力试图为了自己的利益而侵蚀我们的山巅之城，甚至毒害其水井并从内部使其崩溃。我们不能允许美国人民受到任何颠覆性外国影响。"