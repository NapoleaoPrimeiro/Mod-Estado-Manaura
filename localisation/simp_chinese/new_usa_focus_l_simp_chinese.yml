l_simp_chinese:
# 模块化本地化
 USA_homeland_defense_emergency_act_focus-general_title: "国土防御紧急法案"
 USA_homeland_defense_emergency_act_focus-general_desc: "美国的海岸已被突破；敌人已踏上我们的土地。我们不会接受这种状况，也不会允许那些与我们为敌的人在人民家中向我国人民发动战争。他们将以一切必要手段被击退。美国人民将奋起将他们赶出去！\n勇者之乡将永远是自由之地！"

 USA_coordinate_militia_defenses-general_title: "协调民兵防御"
 USA_coordinate_militia_defenses-general_desc: "数百万美国公民响应了战斗的号召，已经在尽己所能动员起来对抗入侵者，但他们目前是独立行动，缺乏更大的凝聚力。我们需要现在向人民伸出援手，开始将他们集体的意志组织成一个统一的意愿。"

 USA_establish_strongholds_in_the_rockies-general_title: "在落基山脉建立据点"
 USA_establish_strongholds_in_the_rockies-general_desc: "我们在西部拥有的天然山地地形将成为一道阻挡敌人推进的绝佳屏障。我们不打算让他们推进到那么远，但如果某个突出部到达落基山脉，他们将在我们的决心面前自取灭亡。"

 USA_the_mississippi_bastions-general_title: "密西西比堡垒"
 USA_the_mississippi_bastions-general_desc: "沿着密西西比河的整个长度，我们将建立强大的防御工事，以阻滞任何敌人。中西部的生命线将成为共和国的生命线。"

 USA_evacuate_civilians_and_industry-general_title: "撤离平民与工业"
 USA_evacuate_civilians_and_industry-general_desc: "我们必须迅速从那些最有可能被敌人围攻或占领的地区撤离一切。我们不能拖延或无所作为，我们需要趁还有时间时采取行动。"

 USA_launch_the_counteroffensive-general_title: "发动反攻"
 USA_launch_the_counteroffensive-general_desc: "是时候反击并收复我们的土地和被俘的人民了。我们的后方已稳固，而在前方，我们将摧毁挡在路上的一切阻碍。"

 USA_spirit_of_defiance-general_title: "反抗精神"
 USA_spirit_of_defiance-general_desc: "我们不是一个任人宰割的落后国家——我们是自由之地和勇者之乡！让每一片草叶后都有一支步枪，每一座屋顶下都有一把利刃，每一颗心灵中都怀有挑战逆境的勇气。我们的敌人将会明白他们所承担的任务是多么不可能完成。"

 USA_regional_strategic_commands-general_title: "地区战略指挥部"
 USA_regional_strategic_commands-general_desc: "为了更好地保卫我们广袤的国土并为攻击者设置不可逾越的障碍，我们将建立地区战略指挥部，以密切支持和协调当地防御行动，并为决定性的反击开辟道路。每个指挥部都将是我们领导层的堡垒，也是我们受伤士兵和平民的庇护所。"

 TBA_TT: "§C待完成§!"

# 隐蔽/虚假/侧面信息国策
 USA_SM_NC_decrease_conservative_resistance: "保守主义抵抗"

# 其他
 USA_government_de_intervention: "政府去干预化"
 USA_government_de_intervention_desc: "不到十年前，大萧条猛烈而迅速地袭来，其后果至今仍令人窒息。然而，政府对此的应对并未改善我们的处境，反而使之恶化。为了解决问题，我们必须从停止进一步伤害开始。"

 USA_repeal_the_new_deal: "废除罗斯福新政"
 USA_repeal_the_new_deal_desc: "罗斯福通过接管国家总体控制权来修复国家的计划并未显示出前景。住房有需求，但并未在建；食物被任其腐烂而美国人却在挨饿；人口稠密地区的积蓄被送往无关紧要的偏远地区。这些政策听起来不错，但不应再继续下去了。"

 USA_market_information_authority: "建立市场信息管理局"
 USA_market_information_authority_desc: "为了最大限度地提高个人在市场内做出明智和知情决策的能力，将建立市场信息管理局，提供关于整体经济状况的全面且包罗万象的系列更新，使卖方能够找到买方，反之亦然。"

 USA_reorganize_the_fed: "重组美联储"
 USA_reorganize_the_fed_desc: "几十年来，联邦政府逐渐侵占了越来越多公民的私人生活与活动。与此同时，新的意识形态开始生根发芽，扰乱了政府的事务。进行一次全面重组是必要的。"

 USA_glass_act: "格拉斯法案"
 USA_glass_act_desc: "《格拉斯法案》将确保联邦政府所有非安全相关的支出和内部计划完全向公众披露，并以通俗易懂的形式呈现。如果每个官僚都能受到那些支付其薪水的人的审视，腐败就会减少。"

 USA_doge: "政府效率部"
 USA_doge_desc: "政府效率部将确保联邦没有任何一部分将资源浪费在无用的项目、个人爱好或挥霍无度的公务员身上。"

 USA_double_down: "加倍恪守宪法"
 USA_double_down_desc: "这个国家的立国理想使其与众不同。熵增自然地将美国从某些崇高目标中偏离了方向，但它所需要的只是一次修正，并再次将目光投向成为那座世界仰望的山巅之城。"

 USA_innovation_prizes: "创新奖"
 USA_innovation_prizes_desc: "除了直接的军事应用外，政府补贴从长远来看并不能帮助工业发展。停滞总是伴随着免费资金而来。然而，激励有需求技术的发展将大有裨益，如果战争爆发，这种做法也会变得更加显著。"

 USA_spurred_growth: "刺激经济增长"
 USA_spurred_growth_desc: "大萧条给国家造成了巨大损害，但美国人民是坚强的！通过推进并坚持到底，我们的人民已经开始从这场悲剧中复苏。如果我们集中精力提供一个公平有效的竞争环境，我们可以确保我们的工业以前所未有的速度恢复。"

 USA_american_excellence: "美国卓越单兵"
 USA_american_excellence_desc: "如果需要美国人为世界战争而战，他们将以最高超的技能、配备最现代的武器、在最伟大领袖的鼓舞下战斗，这一切都是为了在追求世界自由的过程中节省我们子弟的鲜血。"

 USA_american_juggernaught: "美国人海巨兽"
 USA_american_juggernaught_desc: "美利坚合众国的力量将被置于我们穿军装的子弟背后。无论我们的军队身在何处，民主兵工厂的全部力量都将与他们同在，自由的敌人将被彻底击败。"

 USA_natural_recovery: "自然经济复苏"
 USA_natural_recovery_desc: "美国经济已经自然复苏，大萧条造成的工业压力现已愈合，文化冲击也开始从记忆中淡去。得益于此，美利坚合众国再次屹立于世界之林，地位稳固……也许世界很快就会需要这个坚实的基础。"
 USA_natural_recovery_tt: "\n国家仍需要超过§R一年§!的时间才能恢复全面增长，不过如有需要，政府可以在大约§R半年§!多一点的时间内尝试介入并为某些部门提供援助。"

 USA_accelerated_recovery: "加速经济复苏"
 USA_accelerated_recovery_desc: "美国人民正在迅速重新振作起来，但世界不会等待我们准备好重新加入。我们将利用有限的通货膨胀来启动商业活动，使我们的工业尽早恢复。"

 USA_eagle_of_the_free_market: "自由市场之鹰"
 USA_eagle_of_the_free_market_desc: "美国人民的经济卓越性长期以来一直被认为是世界上最杰出的之一。在不受干预的情况下，美国的企业和工业，以及我们的外国朋友和盟友，已经重新唤醒了美国的全部力量，现在更因我们多年来的复苏而进一步加强。"

 USA_timely_intervention: "及时干预"
 USA_timely_intervention_desc: "大萧条在美国已基本完全结束。在世界各地，战火正越烧越旺，而民主的强大兵工厂仍处于沉寂之中。我们现在需要让我们的工业基础上线，即使这不是最有效的选择——世界没有给我们留下选择的余地。"
 USA_school_funding_used: "学校资助"
 USA_school_funding_used_desc: "美国学生和研究人员可以大大受益于私人资助和特定政府投资的资源。这些制度从长远来看将极其有效。"

 USA_national_curiosity_journal: "国家好奇心期刊"
 USA_national_curiosity_journal_desc: "投资于一个由学者、发明家、工匠、工程师和科学家组成的社区，这将激发新的项目和突破，只会对国家有利。我们不仅可以在新生产方法和新商品的帮助下更好地应对大萧条，而且我们的武装部队也将受益于拥有更聪明的人口来支持他们。"

 USA_reborn_american_philanthropy: "重生的美国慈善"
 USA_reborn_american_philanthropy_desc: "美国经济的总体状况已恢复到美国慈善文化迅速复兴的程度。独立捐赠、社区善意和慈善组织日益增长，我们的社会和工业正在受益。"

 USA_lowered_taxes: "降低税收"
 USA_lowered_taxes_desc: "政府扩张不断要求越来越高的税收。虽然这不会允许在紧急情况下同样的政府应对速度，但将允许经济更健康的自然增长。"

 USA_infrastructure_projects: "基础设施项目"
 USA_infrastructure_projects_desc: "已经建立了重要的机构来在全国范围内建设基础设施。在有用之处继续这些工程将有利于国家。"

 USA_retirement_stocks: "退休股票"
 USA_retirement_stocks_desc: "大量公民的钱已被投入社会保障以备将来使用。然而，与其只是让它随时间积累利息，不如将这些资金投入股市，允许它们也定期提取。"

 USA_repeal_smoot_hawley: "逆转斯姆特-霍利关税法"
 USA_repeal_smoot_hawley_desc: "这些贸易制裁可以说是大萧条真正的开端，它一夜之间使世界经济崩溃，摧毁了美国市场和数十个外国市场。尽管对许多人来说这不会受欢迎，但我们应该努力解除这些制裁，并尽最大努力将美国市场重新向世界开放。"

 USA_state_federal_joint_research_initiative: "州-联邦联合研究计划"
 USA_state_federal_joint_research_initiative_desc: "创新是美国文化中自然而然的一部分，各级各类计划都在不断推进。如果我们能够协调这些现有项目，使它们分享见解和技能，所有项目的进展都可以大大改善。"

 USA_us_science_network: "美国科学网络"
 USA_us_science_network_desc: "将我们的科学投资集中在重点项目上，将提高我们在研究前沿开发新技术的能力。"

 USA_national_statistics_department: "国家统计局"
 USA_national_statistics_department_desc: "为MIA扩充一个团队，负责在全国范围内收集数据，将提高消费者、雇员和雇主在市场中发现利基机会并做出卓越选择的能力。"

 USA_gradual_subsidy_relief: "逐步补贴减免"
 USA_gradual_subsidy_relief_desc: "各种计划正在生效以减轻农民和其他生产者的压力，但结果并未达到预期。美国人在饥饿和贫困中挣扎，而粮食却在田间被焚毁。尽管这会产生一些短期阵痛，但冷静而逐步地释放近年来的广泛补贴将有助于恢复市场平衡。"

 USA_medical_reform: "医疗改革"
 USA_medical_reform_desc: "取消医生执照的限制并移除联邦对既有医疗系统的干预，将使最优秀和最有准备的人在医疗行业中发挥作用。"

 USA_international_free_markets: "国际自由市场"
 USA_international_free_markets_desc: "由于美国重新向世界市场开放，美国经济和世界其他国家正在迅速复苏。尽管损害需要更长时间才能完全解决，但美国的自然财富和惊人的实力已经结出硕果。"

 USA_oss_expansion: "美国战略服务局扩张"
 USA_oss_expansion_desc: "情报机构的发展对于跟上现代世界的步伐至关重要，战略服务局将守护美国的秘密。"

 USA_defense_focus: "防御重点"
 USA_defense_focus_desc: "我们的战略服务将把精力投入到保卫美国及其人民上。"

 USA_offense_focus: "进攻重点"
 USA_offense_focus_desc: "我们的战略服务将把精力投入到探查外国事务上。"

 USA_wartime_intelligence_operations: "战时情报行动"
 USA_wartime_intelligence_operations_desc: "美国现已处于战争状态，我们的情报服务现在迫切需要保卫我们的军事利益，同时调查敌方的利益。OSS必须处于最佳效能状态，以破坏敌人的行动。"

 USA_rose_club: "玫瑰俱乐部"
 USA_rose_club_desc: "玫瑰俱乐部是情报机构内部的一项特殊服务，致力于防御和促进抵抗组织。其存在将保持隐秘，其特工将更加沉默。"

 USA_industrial_recovery: "工业复苏"
 USA_industrial_recovery_desc: "随着美元重获价值，就业再次增长，工人获得报酬，工业齿轮正在重新运转。"

 USA_dynamism_unlocked: "经济活力解锁"
 USA_dynamism_unlocked_desc: "经济已恢复到接近正常运转的状态。如果再发生危机，我们现在有必要的势头来做出良好应对。美国人民将继续从失去的岁月中反弹，将国家恢复到昔日的繁荣！"

 USA_treaty_of_international_reconciliation: "国际和解条约"
 USA_treaty_of_international_reconciliation_desc: "我们最初的关税造成的损害使我们的许多外交关系紧张。让我们尝试通过召集我们的朋友和盟友，并调解我们彼此之间的防御行动来修复这种情况。"

 USA_industrial_expansion: "工业增长"
 USA_industrial_expansion_desc: "美国工业正在蓬勃发展，并恢复到其旧的扩张速度。新的工业似乎每周都在兴起，我们工业实力的基础从未停止改善。"
 USA_industrial_expansion_tt: "§Y解锁§! §Y$USA_general_motors$§!工业集团。"

 USA_wartime_economy: "战时经济"
 USA_wartime_economy_desc: "世界正在燃烧，我们的民主堡垒不会一直与火焰隔绝。火星已经向我们袭来，威胁要引燃北美，所以我们必须准备好扑灭这场大火。"

 USA_oil_industry_development: "石油工业发展"
 USA_oil_industry_development_desc: "为了增强国家开采和生产战争所需资源的能力，应特别关注国内合成资源。这将使我们拥有生产现代车辆所需的物资，并使其能够继续战斗。"

 USA_energy_industry_investment: "能源工业投资"
 USA_energy_industry_investment_desc: "随着我们工业的不断增长和进步，我们需要越来越多的能源。美国拥有足够多的资源来支撑这一扩张，我们只需要开始开发我们的储备。"

 USA_strategic_focus: "战略重点"
 USA_strategic_focus_desc: "随着经济再次运转，有必要将我们的期望和政策导向为预判近期的冲突。也许加强防御将保障我们的安全，但也可能需要主动伸出援手帮助我们的朋友。无论哪种情况，我们都需要为可能性做好准备。"

 USA_domestic_focus: "国内重点"
 USA_domestic_focus_desc: "这个国家是建立在勤劳个人的背脊上的，它再次通过同样的个人的努力工作战胜了困难。我们必须尽我们所能进一步促进我们国家的发展和增长，以造福我们的公民。我们将通过自身的力量坚定地站立。"

 USA_the_east: "发展美国东部"
 USA_the_east_desc: "美国的心脏地带有许多活动中心，自市场崩盘以来尚未完全恢复其力量。将重点转向这些中心并满足密集人口的需求将是非常值得的。"

 USA_the_west: "开发美国西部"
 USA_the_west_desc: "从边疆一直到大陆的远海岸，大萧条为我们的人民带来了深重的苦难。对受影响最严重的地区进行普遍投资，将有助于它们更有效地恢复昔日的实力。"

 USA_shipping_industry: "美国航运业"
 USA_shipping_industry_desc: "随着国际贸易的关闭和大萧条对经济各个部门造成严重破坏，我们的航运业同时受到了四面八方的打击。现在资金再次流动起来，协调其对海运部门的影响将恰逢其时。"
 USA_shipping_industry_tt: "拥有§Y自由贸易§!将使此国策效果更显著"

 USA_consumer_market: "消费市场"
 USA_consumer_market_desc: "随着繁荣的回归，美国工人的效率和生产力也随之提高。随着财富的重新积累，消费品再次从货架上飞走，民用工业正在加速发展以跟上步伐。"

 USA_military_spending_adjustment: "军事开支调整"
 USA_military_spending_adjustment_desc: "鉴于世界紧张局势加剧，进一步缩小我军规模是不明智的。然而，在那些有冗余阻碍运作的地方，预算削减是必要的。"

 USA_deregulation: "放松管制"
 USA_deregulation_desc: "政府随时间推移增加控制是自然循环，但这些新措施往往适得其反并阻碍增长。移除近年来政府扩张的各种部分将有助于缓解完全可以避免的压力。"

 USA_general_advancement: "全面发展进步"
 USA_general_advancement_desc: "将我们的努力集中在一个单一的、狭隘的任务上，可能会错失我们可用的动态潜力，而这些潜力可能被我们的盟友和敌人利用。对工业发展和能力的普遍投资从长远来看将更好地服务于我们。"

 USA_coordinated_advancement: "协调发展进步"
 USA_coordinated_advancement_desc: "虽然任何好奇的头脑都可以观察世界并看到它可能被改变的明显方式，但正是那些能戏剧性地改变世界的特殊洞察力才是如此罕见。专注于追求那些更奇特的进步理念将是我们领先的方法。"

 USA_civilian_industry_investment: "民用工业投资"
 USA_civilian_industry_investment_desc: "投资于用于生产大多数消费品的轻机械将有利于国家。"

 USA_military_industry_investment: "军事工业投资"
 USA_military_industry_investment_desc: "投资于军事工业中使用的重型机械将是明智之举。"

 USA_housing_reform: "住房改革"
 USA_housing_reform_desc: "通过在全国范围内为设计和区划法规提供支持，我们可以缓解繁琐的文书工作对住房开发施加的压力。当人们在家庭中感到安全时，他们的产出和前景都会改善。"

 USA_engineering_grants: "工程资助"
 USA_engineering_grants_desc: "投资于工程学的一般领域，并为它的发展和进步提供资源，将极大地帮助我们未来的工业能力。"

 USA_school_of_mines: "矿业学院"
 USA_school_of_mines_desc: "科罗拉多矿业学院是一所历史悠久、声誉卓著的学府，培养了我们一些最优秀的工程师。随着对高素质工程师的需求不断增长，对这所大学的投资有可能在未来产生巨大的回报。"

 USA_banking_reform: "银行业改革"
 USA_banking_reform_desc: "最初导致大萧条的经济崩溃源于银行信贷和股市泡沫的问题。股市尚未复苏，但帮助银行恢复流动性并促进健全的贷款策略将有助于恢复人民对银行的信任。"

 USA_stock_market_invigoration: "股市振兴"
 USA_stock_market_invigoration_desc: "随着美国市场的重新觉醒和国际贸易的恢复，股市所带来的繁荣也可以恢复常态，惠及全世界的人民。"

 USA_global_charity: "全球慈善"
 USA_global_charity_desc: "随着美国外贸市场再次开放，那些对贸易开放的国家已经准备好再次接受美国人民的投资。"

 USA_foreign_funds: "外国资金"
 USA_foreign_funds_desc: "美国向世界重新开放意味着它再次适合外国投资。世界上最优秀的资金很快将流入这个国家。"
 USA_foreign_funds_decisions_unlock_tt: "解锁§Y决议§!以与其他国家进行§Y相互投资§!。"

 USA_trade_recovery: "贸易复苏"
 USA_trade_recovery_desc: "随着资源像过去一样在市场中流动，那些被大萧条关闭的行业已经全面恢复，现在能够恢复增长并惠及国际贸易。"

 USA_consumerism: "消费主义"
 USA_consumerism_desc: "美利坚合众国的自由市场正将其增长和投资重点放在人民的物质繁荣上。美国公民的个人财富远远超过了以前的所有标准，消费主义的氛围现在正占据国家舞台的中心。"

 USA_advanced_industrialization: "先进工业化"
 USA_advanced_industrialization_desc: "将我们工业的发展引向未来，并提高其应对最大项目的能力，对于确保我们作为世界上最有能力和最先进经济的永久地位至关重要。"

 USA_spending_reform: "支出改革"
 USA_spending_reform_desc: "国家和政府使用资源的方式需要被限制，以便支出有效进行。这将非常不受欢迎，会让许多人不满，但长期利益超过了这些抱怨。"

 USA_grand_industrialization: "宏大工业化"
 USA_grand_industrialization_desc: "人民日益增长的经济实力开始使那些迄今仍处于沉睡状态的大片土地变得有价值，而那些基础设施已经建立的地方也在提升自身的价值。这个国家的工业实力日益增长。"

 USA_awoken_economy: "经济觉醒"
 USA_awoken_economy_desc: "繁荣的市场使我们和我们的盟友受益，美国经济实力的增长是所有其他希望分享我们繁荣的民族的一盏灯塔。"
 USA_awoken_economy_tt: " 美国每有一个阵营成员就获得§Y两座§!工厂。"
 USA_awoken_economy_no_fac_tt: " 每个阵营成员都将获得§Y投资§!。"

 USA_world_industrial_superiority: "世界工业优势"
 USA_world_industrial_superiority_desc: "没有哪个国家拥有我们现在所享有的经济和工业实力与财富。在物质卓越方面领先世界，我们如一座明亮的山巅之城，是让所有人看到可能性的启示。"

 USA_state_action_reduction: "国家行动缩减"
 USA_state_action_reduction_desc: "通过更好地利用政府可用的税收，可以减轻其对经济的负面影响。通过减少不必要的支出并将资金集中在对影响最大的地方，可以进一步减轻国家支出模式固有的问题。"

 USA_reform_the_defense_act: "改革国防法案"
 USA_reform_the_defense_act_desc: "随着世界局势的恶化，审查和现代化美国武装力量日益成为明显的需要。"

 USA_westpoint_expansion: "西点军校扩建"
 USA_westpoint_expansion_desc: "美国陆军的军官团是战场成功的关键，拥有我们能够拥有的最好军官并足够数量对于经受未来冲突至关重要。"

 USA_recruitment_drive: "招募兵役运动"
 USA_recruitment_drive_desc: "在军方认为准备好行动之前，其服役规模需要大幅增加。"

 USA_officer_focus: "重点军官培训"
 USA_officer_focus_desc: "作为战场上的领导者，美国陆军的军官应在学说设计和投资中享有最高优先级。"
 #USA_officer_focus_tt: "选择上方的国策将使此国策的时间减少§G14§!天。"

 USA_soldier_focus: "重点士兵训练"
 USA_soldier_focus_desc: "真正作战的是前线的士兵，他们源自伟大的美国人民。他们应得到特别关注，以确保他们能够发挥出最高水平。"

 USA_international_armed_forces_study: "国际武装力量研究"
 USA_international_armed_forces_study_desc: "在我们确定部队振兴和现代化的最佳方向时，了解其他国家取得的进展尤为明智。智者从自己的错误中学习，而更明智的人从他人的错误中学习。"

 USA_joint_action: "联合作战训练"
 USA_joint_action_desc: "一支军队既需要前线的士兵，也需要领导他们的军官。没有两者的充分合作与协调，任何部队都会受到影响。"

 USA_doctrine_development: "学说军事发展"
 USA_doctrine_development_desc: "自一战以来，作战方式已经发生了变化，我们的军队必须与时俱进，掌握应对这些变化的所有最佳方式。"

 USA_strategy_development: "战略发展"
 USA_strategy_development_desc: "战争是在高层进行的，必须自上而下地推进。每场战斗只有在推进整体战略时才重要。进攻的最终目标是通过对战争学说的精确制定来确定的。"

 USA_tactics_development: "战术发展"
 USA_tactics_development_desc: "当子弹开始飞射时，军队的协调与计划便成为唯一重要的事情。当目标明确时，胜利就在眼前。一支懂得如何赢得小规模战斗的军队，才能尝试承担整场战斗。"

 USA_battle_logistics: "战斗后勤"
 USA_battle_logistics_desc: "从指挥官的角度来看，战争关乎战略和智胜对手。然而，在战斗中，唯一重要的是生存与胜利。确保我军士气高昂、步枪装填完毕，将有助于保障他们的安全并取得胜利。"

 USA_promote_heroism: "弘扬英雄主义"
 USA_promote_heroism_desc: "美国人在日常生活中或战场上都有着悠久的英雄主义传统，往往是一位勇敢的战士或一个小队的行动决定了艰苦战斗的胜利。我们的政府不应吝惜对这些杰出表现的赞扬，并应弘扬我们传承中的勇敢精神。"

 USA_force_modernization: "军队现代化"
 USA_force_modernization_desc: "尽管美国在过去二十年中并未无所事事，但我们的军队仍然落后于时代。在速度、机动性和装甲方面，新的创新层出不穷，美国已准备好利用这些技术和理念——如果它选择这样做的话。"
 USA_force_modernization_tt: "§Y解锁§! §Y$detroit_arsenal$§!军事工业组织。"

 USA_special_service_branch: "特种作战分支"
 USA_special_service_branch_desc: "随着作战日益专业化，士兵的组织更加严密，特种部队分支的作用开始变得清晰。我们的士兵将被期望在全新的极端环境中作战，顶级的训练和计划将帮助我们最精锐的部队为应对任何情况做好准备。"

 USA_spec_ops: "特种作战"
 USA_spec_ops_desc: "在高级作战领域中，存在着一支被赋予完成不可能任务的精锐队伍。这些特种行动需要具有非凡技能和勇气的操作员来完成，幸运的是，我们并不缺乏这样的人。"

 USA_mechanization_initiative: "§R机械化倡议§!"
 USA_mechanization_initiative_desc: "强大的装甲车辆有可能对对手造成毁灭性打击。开发掌握这种武器所需的技术至关重要。"

 USA_advanced_tank_designs: "先进坦克设计"
 USA_advanced_tank_designs_desc: "随着国内装甲知识的迅速传播和日益成熟，将额外注意力投入到完善该领域，并确保在该领域对任何对手保持竞争优势是明智之举。"
 USA_advanced_tank_designs_tt: "§Y解锁§! §Y$tank_destroyer_board$§!军事工业组织。"

 USA_logistical_focus: "注重后勤"
 USA_logistical_focus_desc: "后勤更好的人不一定能赢，但后勤先崩溃的人必输无疑，而我们不打算屈居第二。"

 USA_art_of_war: "战争艺术"
 USA_art_of_war_desc: "通过磨练我们的学说分析和设计方法，我们可以更好地为那些不可避免的时刻做好准备，届时我们所有的辛勤工作和计划都将付诸东流。然而，建立解决问题的方法总是有用的，计划将填补计划被破坏时的空白。"

 USA_democracys_vanguard: "民主先锋"
 USA_democracys_vanguard_desc: "美利坚合众国的人民拥有不屈不挠的精神。虽然战争可能远离我们的海岸，但我们有责任将他们的正义斗争放在心上。我们现在呼吁我们伟大的人民挺身而出，坚守战线，无论它划在哪里。"

 USA_kittyhawk_exhibition: "基蒂霍克航空展"
 USA_kittyhawk_exhibition_desc: "美国是飞行的先驱，几十年来一直处于航空领域的前沿。然而，自大萧条以来，我们的精神受到了严重打击。举办一场由我们最优秀的飞行员和最伟大的飞机参与的航空展，可以重振我们意志的那一部分，并为人民提供一些急需的轻松氛围。"
 USA_mastery_bonus_kittyhawk_exhibition_tt: "$USA_kittyhawk_exhibition$"

 USA_air_training: "空中飞行训练"
 USA_air_training_desc: "要飞得好，仅有现代化装备是不够的，你还必须能够使用它。比飞机更重要的是飞行员，尽管遭遇挫折，我们仍有资源让人民保持最高水平。"
 USA_mastery_bonus_air_training_tt: "$USA_air_training$"

 USA_american_designs: "美国航空设计"
 USA_american_designs_desc: "提高我们空中力量的质量对于在战争和防御中保持竞争力至关重要。世界其他地区正在我们周围取得进步和发展，我们不能让自己落后。"

 USA_cutting_edge_aircraft: "尖端飞机"
 USA_cutting_edge_aircraft_desc: "最先进的飞机将给我们飞行员最大的生还机会，同时确保他们的对手无法生还。整合我们自己的专家和外国专家的经验与见解，将为我们设计下一代航空技术提供显著优势。"

 USA_foreign_aircraft_innovations: "外国飞机创新"
 USA_foreign_aircraft_innovations_desc: "仅从一个角度应对战斗或任务是不够的。无论你多么有效和能力出众，没有人能看到全局，也没有一个工程师团队能在孤立中赢得每一场设计竞赛。从他人的进步中学习将推进我们自己能够取得的成就。"

 USA_british_design_focus: "英国设计重点"
 USA_british_design_focus_desc: "在研究外国飞机发展时，我们应该特别注意我们大洋彼岸邻居发明的有效策略和技术。英国航空航天业生产了最先进的发动机和以安全为导向的飞行技术，这将使我们的飞行员受益。"

 USA_german_design_focus: "德国设计重点"
 USA_german_design_focus_desc: "在研究外国飞机发展时，我们应该特别注意德国大国发明的有效策略和技术。无论你喜欢还是讨厌他们的工程设计风格，德国航空航天先驱正在开发将空中力量整合到任务支持角色的新方法，他们的空军在个体飞行员的训练方面表现出色——这些理念和方法值得我们借鉴。"

 USA_japanese_design_focus: "日本设计重点"
 USA_japanese_design_focus_desc: "在研究外国飞机发展时，我们应该特别注意崛起的日本帝国发明的有效策略和技术。他们强大的传统和军事文化使得航空优先事项围绕着战斗卓越展开，他们的飞行员被训练以体现这一传统。这种积极的训练方式可以大大提升我们的飞行员。"

 USA_encourage_civilian_air_industry: "鼓励民用航空工业"
 USA_encourage_civilian_air_industry_desc: "虽然我们专注于发展军事空中力量，但伟大的创新往往出现在民用领域，新的工业应用方法也在此诞生。促进运输航班和市场航空航天制造业的扩张，将对经济和军事都大有裨益。"

 USA_support_the_air_industry: "支持航空工业"
 USA_support_the_air_industry_desc: "随着发展空中力量的需求日益增长，促进本土航空工业的优势变得越来越明显。虽然成本高昂，但这种做法的好处很快会变得清晰。"

 USA_extreme_air_investments: "极端航空投资"
 USA_extreme_air_investments_desc: "随着越来越多的资金可用于发展我们的武装力量，空中力量是我们的首要任务之一。我们的部队必须由一支有能力且压倒性的飞机机队来支持，随时准备夺取天空。然而，我们的对手不会耐心等待我们准备好迎接他们，我们必须热情而猛烈地行动，以保持领先一步。"

 USA_found_the_mechanical_mastery_institute: "建立机械精通研究所"
 USA_found_the_mechanical_mastery_institute_desc: "这个基金会诞生于美国特殊工业的核心，将汇集各个工程领域最优秀和最聪明的人才，为他们提供以最高效率工作所需的资源和激励，同时允许不同领域相互交叉，提供新的创新方法。"

 USA_war_chest_act: "战争基金法案"
 USA_war_chest_act_desc: "美国发现自己处于战争状态。无论它如何开始的，它现在就在这里，唯一正确的回应是全力以赴！现在是美国及其人民的全部力量和意志碾压我们敌人的时候了，她的全部资源将致力于这项任务。"

 USA_close_air_support_planes: "近距离空中支援飞机"
 USA_close_air_support_planes_desc: "虽然这不是一个全新的概念，但近年来，近距离空中支援已成为世界各国（包括许多潜在对手）的主要投资重点。通过从上方提供直接火力支援来协助部队的能力无疑是有吸引力的，我们有资源来实现它。"

 USA_the_bomber_mafia: "轰炸机黑手党"
 USA_the_bomber_mafia_desc: "在我们最高空军领导层的殿堂中，存在着一群被称作“轰炸机黑手党”的远见卓识者。这些人将一种理念置于所有其他理念之上——即战争可以通过精确的战略轰炸来赢得。说得客气点，这是一个非常不受欢迎的观点，因此对其进行投资需要在我们的高层指挥和政府许多成员中进行一些说服工作。"

 USA_true_strategic_bombing: "真正的战略轰炸"
 USA_true_strategic_bombing_desc: "这个想法很简单：赢得战争的是阻止战争进行的能力，那么如果你在敌人到达前线之前就摧毁了他们的作战能力会怎样？打击一个国家的物质生产核心可以削弱其进行任何冲突的能力。在新技术的帮助下，即新的瞄准具和机体框架，我们炸弹的效率可以显著提高。"
 USA_mastery_bonus_true_strategic_bombing_tt: "$USA_true_strategic_bombing$"

 USA_exotic_conditions_training: "极端条件训练"
 USA_exotic_conditions_training_desc: "空中战斗正在越来越高的海拔、越来越快的速度下进行，装备也越来越强大和可靠。为了让我们的飞行员为真正的战斗做好准备，我们必须开发和实施方法，让他们接触他们将在天空中面对的极端条件，并帮助他们提前学习如何最好地应对这些条件。"

 USA_angel_warriors: "天使勇士"
 USA_angel_warriors_desc: "虽然我们的飞行员将得到民主兵工厂的支持，但我们必须以不必要地失去自己人为目标来对待战斗。我们不仅打算把我们的孩子带回家，还打算把他们培养成世界上最优秀的飞行员，他们的技能将鼓舞我们的部队，令盟友赞叹，令敌人畏惧。"
 USA_mastery_bonus_angel_warriors_tt: "$USA_angel_warriors$"


 USA_improved_cargo_planes: "改进型运输机"
 USA_improved_cargo_planes_desc: "更大的运输机意味着更多的补给可以运得更远、更快、数量更大。如果发展得足够远，它们还可以维持大规模的空降作战，这在战争史上是前所未有的。"

 USA_airborne_logistics: "空降后勤"
 USA_airborne_logistics_desc: "也许是最困难和最复杂的向前线运送补给的方法，空运代表了后勤的巨大复杂挑战，但它们也提供了将装备立即送达需要地点的能力，包括向没有其他途径的被围困人员提供补给。"

 USA_airpower_identity: "空中力量身份"
 USA_airpower_identity_desc: "随着其技能和努力现在受到考验，我们的空军已经开始形成自己的特色。它将追求什么身份？"

 USA_united_states_army_aircorp: "美国陆军航空队"
 USA_united_states_army_aircorp_desc: "美国空中力量的首要目标是支援地面部队和海上水手。在这些历史性战场的完全控制将在“来自上方的死亡”的帮助下比以往更容易实现。我们飞机的真正目的是打击敌人最重要的资产，即能够实际占领领土的地面部队。"

 USA_united_states_airforce: "美国空军"
 USA_united_states_airforce_desc: "天空的领域太广阔、太重要，不能使其统治成为一个甚至没有参与的军种的附属角色。美国的空中力量将被重组为军队的一个独立分支，准备夺取上方的天空。从天堂，美国飞机将倾泻毁灭，有了空中保障，每场战斗都将拥有初始优势。"
 USA_united_states_airforce_tt: "§YUSAA§!现在将被称为§YUSAF§!"

 USA_xaf_development: "雷达技术开发"
 USA_xaf_development_desc: "美国一直是雷达技术领域的领导者，但通过改进国内研究和研究外国系统，我们可以扩大对系统背后物理和力学的理解，在复杂性上超越竞争对手。"

 USA_turbine_innovations: "涡轮创新"
 USA_turbine_innovations_desc: "美国科学家和工程师开发了在高速下聚焦气流并将燃料注入气流以产生惊人推力的新方法。凭借这项全新的喷气技术，我们接近于能够开发出比以往飞得更高、更远、更快的极端飞机。"

 USA_naval_asset_assessment: "海军资产评估"
 USA_naval_asset_assessment_desc: "由于美国与任何主要对手相隔一个大洋，她必须能够保卫这些大洋，既要遏制侵略者，也要使其能够采取行动。虽然我们的舰队是强大的，但我们不能袖手旁观，让传统独自延续。我们的海军必须保持随时准备行动。"

 USA_leadership_reorganization: "领导层重组"
 USA_leadership_reorganization_desc: "美国海军目前的战争内阁被层层不必要和有害的官僚机构以及旧的作战方式所拖累。自一战以来，时代已经发生了变化，这要求改变方向。"

 USA_department_of_naval_systems: "海军系统部"
 USA_department_of_naval_systems_desc: "水兵的反馈通常包括对他们所获得的装备质量的抱怨，以及政府在要求解决其制造的问题时的态度。M14鱼雷就是一个完美的例子，它是出于惰性和懒惰而存在，而不是出于实用性和有效性。我们的舰队必须装备得更好。"

 USA_cross_sector_communication: "跨部门沟通"
 USA_cross_sector_communication_desc: "在跨越全球多个不同海洋的庞大舰队运作中，我们有机会和能力协调完全不同的战区的经验和教训，以更好地了解如何最大化我们海军的有效性。"

 USA_invest_in_the_navy: "投资海军"
 USA_invest_in_the_navy_desc: "通过将储备金投入我们的造船工业，我们可以启动海军的扩张。希望这项投资能起到有效的威慑作用，但如果冲突爆发，无论如何都需要新的船坞。"

 USA_drydock_expansion: "干船坞扩建"
 USA_drydock_expansion_desc: "加倍投入我们干船坞的生产能力将显著提高我们舰队的效率，并帮助我们部署越来越多的船只。"

 USA_littoral_retooling: "沿海再装备"
 USA_littoral_retooling_desc: "虽然这是一项昂贵且耗时的举措，但凭借新开发的机床和工业经验，我们可以完全重新设计船舶生产工业的重要部分，并创建能够处理更大工作量的设施。"

 USA_shipping_investment: "航运投资"
 USA_shipping_investment_desc: "扩大民用航运业和我们的商船队的有效性将确保我们的装备和补给能够按时、完好地到达目的地。"

 USA_war_production: "战争生产"
 USA_war_production_desc: "是时候将美国造船工业的巨大力量释放到那些威胁她的势力身上了。美国的吨位产出能力需要大幅扩张。"

 USA_armada_act: "舰队法案"
 USA_armada_act_desc: "舰队法案授予美国海军大幅提升其力量和力量投射所需的资金和自主权。虽然这将极大地消耗我们的资金，但很明显，这次扩张对于面对我们的海外敌人是完全必要的。"

 USA_semper_fi: "永远忠诚"
 USA_semper_fi_desc: "作为美国最古老的军事力量，我们的海军陆战队在作战卓越方面有着悠久的传统。投入更多资源来扩大他们的队伍和力量将是一个值得关注的重点。"

 USA_improved_transport_models: "改进型运输模型"
 USA_improved_transport_models_desc: "为了确保我们的部队和装备能够安全渡海并在支援下抵达并准备战斗，他们需要能够承受海浪和炮火的更好的船只。"

 USA_amphibious_assaults: "两栖突击作战"
 USA_amphibious_assaults_desc: "由于与潜在敌人相隔一个海洋，我们的部队需要准备好在敌人领土上进行艰苦的登陆。他们将得到最佳装备和训练的支持，并得到不断壮大的海军陆战队队伍的支持。"
 USA_amphibious_assaults_tt_add_nav_caps: "此国策将完成§Y1个海军分支§!"

 USA_modern_crew_training: "现代船员训练"
 USA_modern_crew_training_desc: "我们水手训练的质量不能停滞不前。我们必须确保我们的人员在战斗和航行中保持最佳战备状态——任何不足都是对我们同胞的亏欠。"

 USA_combat_drills: "大规模战斗演习"
 USA_combat_drills_desc: "海军在其历史上保持最佳状态的传统之一是其对任何情况都做好准备的重点。世界正在迅速变化，潜在的海战也在变化。我们的人将做好准备。"
 USA_mastery_bonus_combat_drills_tt: "$USA_combat_drills$"

 USA_veteran_damage_control: "老兵损害管制"
 USA_veteran_damage_control_desc: "在每一次战斗中，都会有炮弹击中目标，无论训练或技术如何。然而，船员如何应对这些炮弹，是决定继续战斗、艰难返回港口还是烧到水线之间的区别。我们的船员将接受训练和装备，以确保前者。"

 USA_large_scale_exercises: "大规模演习"
 USA_large_scale_exercises_desc: "为战斗做好准备关乎练习和更多练习。交战计划将不可避免地无法反映实际情况，但即时起草计划的能力是帮助在实际战斗中保持对胜利专注的关键。"

 USA_naval_force_exertion: "海军力量投射"
 USA_naval_force_exertion_desc: "我们的舰队投射力量和确保全球水域安全的能力将确保友方船只安全通行，并有效地将我们的部队部署到最需要的地方。"

 USA_commando_sections: "突击队部队"
 USA_commando_sections_desc: "将高舰队指挥与海军陆战队的作战规划相结合，将使两栖突击更加顺畅和有效，并有助于让我们的舰船了解不同岛链和沿海地区的安全状况。"

 USA_us_naval_invention_complex: "美国海军发明综合体"
 USA_us_naval_invention_complex_desc: "我们在旧金山的孩子们一直在开发革命性的新想法，以增强我们对海洋的影响力。致力于进一步开发这些想法的设施将为他们提供将想法变为现实所需的资源。"

 USA_advanced_tonnage: "先进吨位"
 USA_advanced_tonnage_desc: "一个极其强大、现代的舰船模型将极大地增强我们的海军。决定将我们的研究重点放在哪里将决定我们的资源如何使我们受益。"

 USA_fleet_modernization: "舰队现代化"
 USA_fleet_modernization_desc: "我们的舰队仍然保持与十年前相似的形式，仍然是为了一战而设计的。我们的对手正在部署越来越有能力的战舰，我们必须投资于改装和升级我们的舰队，如果我们要保持强大。"

 USA_submarine_experimentation: "潜艇实验"
 USA_submarine_experimentation_desc: "潜艇仍然是海军中相对未经测试和不成熟的工具。推动水下战争的可能性边界可能会产生令人着迷和有价值的结果。"
 USA_mastery_bonus_submarine_experimentation_tt: "$USA_submarine_experimentation$"


 USA_steel_sharks: "钢铁鲨鱼"
 USA_steel_sharks_desc: "我们潜艇舰队的主要作用将是攻击敌人。我们的潜艇船员渴望在敌人甚至不知道他们在那里之前就对其发动打击，这是一项我们必须投资的战略。"

 USA_the_silent_service: "沉默服务"
 USA_the_silent_service_desc: "我们的潜艇能够悄无声息地潜入敌方水域甚至港口，并在毫无预警的情况下接近其最有价值的资产，这代表了一种具有巨大影响的战略力量。训练我们的船员以最大限度地发挥其隐蔽性的方式行动是关键。"

 USA_fanged_raiders: "尖牙掠夺者"
 USA_fanged_raiders_desc: "所谓的‘舰队潜艇’的新设计展示了一种跨越大洋并以无声的接触摧毁敌人的能力。尽管这是一项昂贵的投资，但美国成为这种新技术的卓越运用者是重要的，以免我们成为敌人手中的受害者。"

 USA_invisible_will: "隐形意志"
 USA_invisible_will_desc: "我们潜艇舰队的主要作用将是支援我们的打击群。潜艇从水下保卫一片海域并将其洞察力传达给附近任何盟友的能力，将对我们的军舰提供巨大帮助。"

 USA_undersea_escorts: "水下护航"
 USA_undersea_escorts_desc: "我们的护航队最有可能受到隐蔽的敌方潜艇的攻击。然而，使用我们自己的潜艇来护航这些护航队将使我们能够反击敌人的战术，并给敌方水兵制造不安，使他们不确定是否真的有任何护航队因为看不到其他轮廓而毫无防御。"

 USA_the_oceans_eyes: "海洋之眼"
 USA_the_oceans_eyes_desc: "潜艇巡逻非常适合收集关于敌方行动和战术的情报，部署无形的海底资产群来监视敌人的每一个举动将使他们的下一步行动更加明显。"

 USA_carrier_rnd: "航母研发"
 USA_carrier_rnd_desc: "虽然我们已经使用航母一段时间了，但我们从未认真研究过它们的有效作战学说。提高其作战和设计效率是前进的必要条件。"
 USA_mastery_bonus_carrier_rnd_tt: "$USA_carrier_rnd$"


 USA_new_carrier_yards: "新航母船坞"
 USA_new_carrier_yards_desc: "我们将建造大型新设施来为舰队生产航母。这些码头将使我们能够大大扩展投射海军空中力量的能力。"

 USA_naval_air_focus: "海军航空重点"
 USA_naval_air_focus_desc: "水面上的飞机是一道亮丽的风景线，我们的飞机将配备他们所需的各种工具，以到达目标、护航友军并击沉敌人。"

 USA_carrier_aircraft: "航母舰载机"
 USA_carrier_aircraft_desc: "专门设计用于从航空母舰甲板上起飞并得到其支持的飞机是现代海战的必需品。确保它们能在合适的环境中操作是一项艰巨的任务，因为它们的限制远比通常情况下要多，但先进而有效的舰载机将在最大化我们航母的力量方面发挥决定性作用。"

 USA_advanced_carriers: "先进航母"
 USA_advanced_carriers_desc: "未来的航母将能够将美国的影响力和力量投射范围扩展到每一个海洋和每一个战场。扩大的机库、改进的后勤、更好的训练和更长的航程将使我们的海军飞机能够深入敌方的水域。"

 USA_pinnacle_advancement: "巅峰进步"
 USA_pinnacle_advancement_desc: "得益于我们杰出的科学家和工程师，我们已经开始研究先进潜艇和航母技术的新设计，这将大大增加我们在海洋上的优势。一如既往，成本不会低。"

 USA_silverstar_fleet: "银星舰队"
 USA_silverstar_fleet_desc: "我们的海军力量将以其在水面上的卓越和高效而著称。通过卓越的技能和专注，美国的舰队将主宰波浪，巩固我们在世界上的地位。"

 USA_fleet_of_the_deep: "深海舰队"
 USA_fleet_of_the_deep_desc: "美国的海军力量将淹没她的敌人，像潮水一样涌来压倒任何对手。她的工业将驱动一股无情而不间断的舰船和火炮浪潮。"

 USA_airborne_operations: "空降作战"
 USA_airborne_operations_desc: "凭借新的和改进的空中运输工具，我们能够实现军队在历史上一直希望做的事情：飞行。我们的士兵可以直接被送到急需的地方，他们可以在敌后部署，他们甚至可以通过空中支援得到积极的支援和组织。"

 USA_scientific_industrial_showcase: "科学工业展示"
 USA_scientific_industrial_showcase_desc: "美国的创新产业一旦站稳脚跟，将能够迅速复苏。与此同时，盘点我们实际拥有的创造性资产并让每个人都对此感到兴奋，将有助于重新点燃那把火并将其置于公众意识中。"

 USA_accelerated_research_industries: "加速研究产业"
 USA_accelerated_research_industries_desc: "私营公司、企业家和独立的科学家和工程师已经在推动科学和技术的边界，随着他们可用资源的改善，他们的效率也在提高。我们应该进一步投资于这些聪明的人才，同时给予他们成长的空间。"

 USA_support_military_contractors: "支持军事承包商"
 USA_support_military_contractors_desc: "我们的军火工业像其他所有行业一样受到了大萧条的严重打击。然而，随着民用市场的复苏，那些服务于军事利益的行业仍将不得不等待军事本身再次上门。我们需要帮助它们比正常情况下稍早一些维持运转，因为政府是它们唯一的买家。"

 USA_early_mic_investment: "早期MIC投资"
 USA_early_mic_investment_desc: "将我们有限的资金投入到军工复合体中可能不是最明智的举动，但如果我们打算保持军队装备精良和现代化，这是必要的。"
 USA_early_mic_investment_tt: "如果经济已经开始§Y复苏§!，此国策将§G更便宜§!。"

 USA_dynamic_lines_initiative: "动态生产线倡议"
 USA_dynamic_lines_initiative_desc: "随着我们的需求和设计的变化，我们的工业需要具备适应性。随着它们重新加速运转，及早牢记这一点将有助于在以后将其制度化。"

 USA_address_urgent_defense_needs: "满足紧急国防需求"
 USA_address_urgent_defense_needs_desc: "此时拥有一支活跃的军事工业是必要的。无论成本如何，我们需要能够尽快武装部队。"
 USA_address_urgent_defense_needs_tt: "如果经济£GFX_usa_star_overlay_2_texticon §Y正在复苏§!，此国策将§G更有效且成本更低§!。"

 USA_encourage_creative_approaches: "鼓励创造性方法"
 USA_encourage_creative_approaches_desc: "我们有一些最优秀的人才在为我们的部队装备而努力，他们能够为我们尚未遇到的问题提出新的解决方案，这是一个巨大的福音。如果我们放宽对我们征用装备的法规和要求，我们可能会发现它远更有效。"

 USA_defense_hardware_symposium: "国防硬件研讨会"
 USA_defense_hardware_symposium_desc: "我们的科学和工业的复苏为我们提供了一个绝佳的机会，让我们将民用和军事人才汇聚在一起，从他们共同的创造力中汲取最佳想法。"

 USA_futuristic_military_assets: "未来军事资产"
 USA_futuristic_military_assets_desc: "保持领先是维持有效防御和进攻的关键。现代世界发展迅速，所以我们必须更快。我们将通过继续融合我们能在每个领域中识别的每一个线索来实现这一目标。"

 USA_aggressive_technology_funding: "激进技术资助"
 USA_aggressive_technology_funding_desc: "我们迫切需要技术优势。必须立即将资源转移到这一事业上。"

 USA_found_darpa: "建立国防高级研究计划局"
 USA_found_darpa_desc: "国防高级研究计划局将负责追求未来的武器和系统。它将汇集美国所能提供的最有效的创意人才，并将致力于那些过于秘密而无法浮出水面的项目。"

 USA_nuclear_research: "核研究"
 USA_nuclear_research_desc: "美国的各种科学家一直在提出分裂原子的想法，这是一个以前被认为不可能的想法。如果能够实现，并且如果能够控制这个过程，它可能会产生令人难以置信的结果。这些结果可能是什么样子……我们拭目以待。"

 USA_the_manhattan_project: "曼哈顿计划"
 USA_the_manhattan_project_desc: "曼哈顿计划，正如它将被称呼的那样，将是美国为制造和测试可能的原子弹而进行的核研究和开发计划。如果成功，美利坚合众国将成为世界上第一个超级武器的拥有者，一种能够威慑所有敌人并摧毁任何军队的装置。首要任务是确保这个项目对所有人保密。"

 USA_invest_in_equipment_manufacturers: "投资装备制造商"
 USA_invest_in_equipment_manufacturers_desc: "我们有数十家独立公司为我们的武装部队贡献资源和装备。自由市场同样适用于战争工业和其他任何行业，如果我们想为我们的士兵提供最高质量的装备，我们就需要投资于它。"

 USA_increase_armor_spending: "增加装甲开支"
 USA_increase_armor_spending_desc: "美国的坦克公司仍然相对年轻，它们的装备大多未经测试。然而，确保它们拥有学习和成长的资源将帮助它们为这个国家提供最好的坦克。"

 USA_west_coast_aircraft_armories: "西海岸飞机军械库"
 USA_west_coast_aircraft_armories_desc: "扩大和增加我们众多的飞机制造厂对于提升我们机队的规模和质量至关重要。"

 USA_expand_shipyards: "扩建船坞"
 USA_expand_shipyards_desc: "美国有能力生产世界上无与伦比的顶级舰船，我们应该通过建设造船工业来利用这一不可思议的力量，为未来做好准备。"

 USA_cross_disciplinary_industrial_network: "跨学科工业网络"
 USA_cross_disciplinary_industrial_network_desc: "为了更好地解决一个行业的问题，其他行业的技能和经验可以作为灵感甚至直接答案。通过创建一个组织网络，帮助非竞争性行业中的不同公司相互分享专业知识，我们可以实现这一目标。"
 USA_cross_disciplinary_industrial_network_tt: "我们将为每个先前投资的行业获得§Y2座工厂/船坞§!。"
 USA_cross_disciplinary_industrial_network_tt_2: "每个先前投资的§Y公司§!将获得：\n  规模：§G+1§!\n  军事工业组织研究加成：§G+10.0%§!"

 USA_capital_industrial_arsenal: "首都工业兵工厂"
 USA_capital_industrial_arsenal_desc: "在资金从军方流向私人资本的引导下，美国的军工复合体正在成长为一个强大的实体，即使是旧列强中最优秀的也难以匹敌。美国的军队将装备齐全，准备好迎接世界的挑战。"
 USA_capital_industrial_arsenal_tt: "我们将为每个先前投资的行业获得§Y2座工厂/船坞§!和§Y1座民用工厂§!。"
 USA_capital_industrial_arsenal_tt_2: "每个先前投资的§Y公司§!将获得：\n  规模：§G+1§!\n  资金获取：§G+15.0%§!\n  设计团队指派消耗：§G-10.0%§!"

 USA_military_industrial_complex: "军工复合体"
 USA_military_industrial_complex_desc: "为了武装其军队，美国已着手创建历史上最大、最先进、最强大的军工复合体。民主兵工厂已完全苏醒，准备好为星条旗飘扬的任何冲突提供补给。"

 USA_ivy: "常春藤计划"
 USA_ivy_desc: "“常春藤麦克”行动将是进一步开发我们超级武器库的秘密努力。这将极其昂贵，但如果我们能成功地将原子弹作为更大核载荷的主要爆炸物，美国之刃的毁灭潜力将被磨砺得超乎想象。"

 USA_advanced_physics_grants: "高级物理资助"
 USA_advanced_physics_grants_desc: "物理学领域最近已成为一个非常重要的课题，美国的聪明人才完全适合回答它所提出的最新问题。我们应鼓励在这一领域的探索。"

 USA_approach_the_jet_propulsion_laboratory: "接触喷气推进实验室"
 USA_approach_the_jet_propulsion_laboratory_desc: "这个团体由加州理工学院的学生于1936年创立，在航空技术方面一直处于前沿，他们的创新能力已得到充分证明。也许如果他们获得更多非常规的资金和项目请求，他们可能能将边界推到我们尚且无法想象的程度。"

 USA_supersonic_studies: "超音速研究"
 USA_supersonic_studies_desc: "新开发的风洞使我们的工程师能够实验超音速气流，并围绕流体动力学开发新技术。应用于天空，我们可能会看到喷气发动机技术和机翼的创新。"

 USA_in_flight_avionics: "飞行中航空电子设备"
 USA_in_flight_avionics_desc: "我们国防研究所的人员已经弄清楚了如何引导机器自主地朝向目标或沿飞行路径前进。使用新开发的飞行中航空电子系统，我们可以创造出能够以惊人精度打击目标的装置。"

 USA_heirs_of_prometheus: "普罗米修斯的继承者"
 USA_heirs_of_prometheus_desc: "无与伦比的力量，如同人类从未梦想过的，触手可及，但其投送方式仍然是一个后勤噩梦，需要我们的飞行员冒着风险。然而……假设一种大规模杀伤性武器可以安装在自主火箭上。这样的东西将是一项令人难以置信的工程壮举……以及一种无与伦比的武器。"

 USA_washington_institute_of_modern_science: "华盛顿现代科学研究所"
 USA_washington_institute_of_modern_science_desc: "为我们的顶尖科学家建立一个专门的会议设施，将帮助我们揭开物理学和整个世界的奥秘。"

 USA_the_clean_energy_act: "清洁能源法案"
 USA_the_clean_energy_act_desc: "随着核能的力量现在触手可及，我们应将利用这项令人难以置信的新技术快速实现全国电气化作为首要任务。这些发电厂的有效性将极大地有利于我们的工业。"

 USA_school_funding: "学校资助"
 USA_school_funding_desc: "确保年轻人能够识字并具备在先进的工业社会中运作的能力，对于培养下一代和确保持续增长与未来繁荣至关重要。"

 USA_soft_power_oriented_designs: "软实力导向的设计"
 USA_soft_power_oriented_designs_desc: "虽然更大口径、更大射程、发射更多弹药的更大枪支总是好的，但更重要的是枪支在第一次射击后是否卡壳。将重点放在为我们的士兵提供良好服务的武器和装备上，比追求尖端更重要。"

 USA_rigorous_training: "严格训练"
 USA_rigorous_training_desc: "在一战期间，我们将新兵成千人地送进机枪火力中。结果是许多美国人失去了生命，他们的家人再也见不到他们。我们不会轻视我们的部队，也不会轻视我们可能雇佣的大量人员。我们的士兵将接受适当的战斗训练。"

 USA_house_to_house_combat: "城市巷战"
 USA_house_to_house_combat_desc: "虽然重型武器在战场上占据统治地位，但城市环境需要一种全新的、更具战术性的战争方法。训练我们的士兵有条不紊地清除敌人的据点，将有助于降低其对我们的效力。"
 USA_house_to_house_combat_tt: "启用§Y城市步兵战术\n步兵（城市）§! \n   攻击：§G+10.0%§! \n   防御：§G+10.0%§! \n§Y步兵（堡垒）§! \n   攻击：§G+5.0%§! \n   防御：§G+5.0%§!"

 USA_unceasing_innovation: "不断创新"
 USA_unceasing_innovation_desc: "在越来越精良的装备和硬件的支持下，美国士兵将使用最好的武器和接受最好的训练来战斗。"

 USA_the_best_of_the_best: "精英中的精英"
 USA_the_best_of_the_best_desc: "美国军队不是一个将无名之辈送往绞肉机的机构，而是一支发挥美国最优秀力量和实力的专业战斗力量。它不只是为任何人准备的，而是为最优秀的人准备的。"

 USA_futuristic_warfare: "未来战争"
 USA_futuristic_warfare_desc: "美国的战争工业将永远领先于其竞争对手，以确保持续的作战优势。"

 USA_freedoms_blade: "自由之刃"
 USA_freedoms_blade_desc: "美国的武装力量是我们生活方式、保障和保护我们所珍视之物的基石。他们将在世界各地为自由坚守防线。无论她勇敢的士兵前往何处，她的力量都将随之而来。"

 USA_plains_fighting: "平原作战"
 USA_plains_fighting_desc: "我们部队的训练将专门针对开阔战场上的战斗，在那里我们火炮的全部力量可以倾泻在敌人身上。"

 USA_close_quarters: "丛林作战"
 USA_close_quarters_desc: "我们的敌人最有可能在茂密植被或防御工事区域被发现。确保我们的士兵接受有效处理此类战斗的训练将至关重要。"

 USA_rough_terrain: "山地作战"
 USA_rough_terrain_desc: "战斗发生在地理和防御使其自然或人为变得困难的地区。虽然现代战斗通常快速而激进，但一战也教会了保持坚固防线的重要性。"

 USA_raining_fire: "火力倾泻"
 USA_raining_fire_desc: "火炮是战争女王，一种能够从敌人射程之外向其倾泻火力的完全毁灭性的力量。开发更大的重型武器将使我们的部队能在第一名士兵到达之前就摧毁敌人的据点。"

 USA_rapid_strike: "快速打击"
 USA_rapid_strike_desc: "巨大的速度优势有助于使敌人无法对我们的行动做出适当反应。如果我们的打击速度快于他们的反应，我们的军队将每次都获胜。"

 USA_north_american_waves: "北美浪潮"
 USA_north_american_waves_desc: "我们可以支配一支源源不断的人力储备，足以压倒所有对手。此外，我们有必要的工业实力来装备每一位公民，如果需要的话。让我们利用这些优势。"

 USA_interservice_cooperation: "联合兵种"
 USA_interservice_cooperation_desc: "虽然地面、空中和海上的部队可能不常交集，但他们独特的见解仍然可以相互受益良多。建立一个有组织的军种联络系统将有助于每个军种向其他军种学习。"

 USA_mass_production: "大规模生产"
 USA_mass_production_desc: "美国拥有世界上最强大的工业实力，我们可以将其集中到源源不断的战争物资中。用子弹洪流淹没我们的敌人是我们胜利的方式。"

 USA_unceasing_pressure: "持续施压"
 USA_unceasing_pressure_desc: "保持攻击可以防止敌人恢复状态，不断消耗他们的力量直到他们崩溃。尽管这需要攻击者的技巧和组织来维持持续压力，我们的士兵将利用我们无限的装备持续倾泻火力。"

 USA_e_pluribus_unum: "合众为一"
 USA_e_pluribus_unum_desc: "美国人不害怕战争，不害怕战斗，不害怕胜利。我们有责任在自由受到威胁的任何地方团结在自由理想之下。美国人将涌向自由的敌人，不会在枪支后面无所事事。"

 USA_the_age_after_victory: "胜利之后的时代"
 USA_the_age_after_victory_desc: "美国已从创伤中恢复，已从沉睡中苏醒。随着她的能力完全形成，她的力量得到充分认可，她将何去何从？"

 USA_the_american_dream: "美国梦"
 USA_the_american_dream_desc: "这些伟大美国州中发明家和企业家的创新带来了普通人历史上从未见过的更高生活质量。我们经济的主要作用是提高生活水平，并发展尚未到来的繁荣。"

 USA_the_forge_beneath_her_torch: "火炬下的锻造厂"
 USA_the_forge_beneath_her_torch_desc: "战争即将来临，美国需要做好准备。民主兵工厂无与伦比的力量已准备就绪，并已点燃，以制造美国赢得任何冲突并确保持续安全所需的各种毁灭工具。"

 USA_the_americas: "美洲外交"
 USA_the_americas_desc: "我们与美洲邻国的关系是我们外交的重要焦点，应给予特别关注。"

 USA_fulfill_manifest_destiny: "实现昭昭天命"
 USA_fulfill_manifest_destiny_desc: "美国是大陆的守护者，我们的意志应被扩展以反映这一点。我们的边界不必停止增长或变得停滞不前。"

 USA_pacify_mexican_turmoil: "平定墨西哥动荡"
 USA_pacify_mexican_turmoil_desc: "墨西哥几十年来一直处于持续动荡状态，他们最近的革命并未改善这一点。他们的不稳定对我们构成威胁，德国人在一战期间已经利用过这一点。我们需要消除这一威胁。"

 USA_preempt_a_southern_invasion: "先发制人防止南方入侵"
 USA_preempt_a_southern_invasion_desc: "敌军可能利用我们南方邻国的弱点对我国发动大规模入侵。我们必须确保我们不会受到中美洲的威胁。"

 USA_central_american_bastion: "中美洲堡垒"
 USA_central_american_bastion_desc: "巴拿马运河周围地区对国家的健康和安全至关重要。我们必须确保它始终处于我们的坚定保护之下。"

 USA_dominate_south_america: "主宰南美洲"
 USA_dominate_south_america_desc: "南美洲多年来一直是一片混乱，独裁政权在这片迷雾中比比皆是。无法知道它们是否会加入美国的任何潜在敌人。此外，在我们的指导下，该大陆可以变得更加安全和和平。"

 USA_united_protectorate_of_the_south: "南方联合保护国"
 USA_united_protectorate_of_the_south_desc: "许多接受我们保护的国家和文化现在处于有利地位，可以融入更广泛的美国势力范围。将它们的经济与我们自己的经济联系起来，并投资于它们的发展，将使我们所有人受益。"
 USA_united_protectorate_of_the_south_tt: "我们的每个§Y南方附庸§!都将被转变为§Y一体化傀儡§!，并附带额外的民族精神。"

 USA_southern_states: "南方诸州"
 USA_southern_states_desc: "西半球南半部现在比以往任何时候都更加安全。那里的人民与我们的差异并不大，随着时间的推移，他们可以完全融入和同化美国文化。我们应该通过正式欢迎我们最新的领土加入联邦来开始这一过程，开启漫长的进程。"
 USA_southern_states_tt: "我们的每个§Y南方傀儡§!都将被§Y吞并§!。"

 USA_bribe_the_canadian_government: "贿赂加拿大政府"
 USA_bribe_the_canadian_government_desc: "走廊的领土本身并不很有价值，所以也许我们可以简单地为他们提供公平的货物交换。当然，为了绕过政治问题，我们将不得不有效地贿赂加拿大政府，这将非常昂贵，但我们可以做到。"
 USA_bribe_the_canadian_government_tt: " §Y如果他们同意的效果：§!"

 USA_secure_the_canadian_corridor: "确保加拿大走廊"
 USA_secure_the_canadian_corridor_desc: "分隔我国两部分的走廊价值太大，无法通过谈判解决。如有必要，我们必须采取行动。希望我们北方的邻国能在任何不愉快的事情发生之前理解并恢复理智。"

 USA_bargain_for_canada: "商议加拿大"
 USA_bargain_for_canada_desc: "[CAN.GetNameDefCap]和[ROOT.GetNameDefCap]一直有着密切的联系。鉴于我们的共同利益以及他们在保护整个大陆北部方面的战略作用，尝试获得他们的统一是有意义的。我们将向他们的主人提出一个他们无法拒绝的提议。"
 USA_bargain_for_canada_tt: " §Y如果他们同意的效果：§!"
 USA_bargain_for_canada_tt_2: "如果我们的购买被接受，我们可能§G能够§! §Y核心化加拿大§!"

 USA_conquer_the_north: "征服北方"
 USA_conquer_the_north_desc: "我们的北部侧翼太宽太脆弱，不能将防御交给他人。我们必须现在采取行动，否则将来将面临威胁。北方必须属于我们。"
 USA_conquer_the_north_tt: " 如果他们拒绝并且我们进入§Y战争§!:"
 USA_conquer_the_north_tt_2: "如果我们通过武力或胁迫占领加拿大，我们可能§R无法§! §Y核心化加拿大§!"

 USA_welcome_the_canadians: "欢迎加拿大人"
 USA_welcome_the_canadians_desc: "随着我们北方的邻国现在成为我们势力范围的一部分，我们可以伸出援手，开始将他们正式带入联邦！欢迎来到[USA.GetNameDefCap]！"

 USA_bring_in_the_Caribbean: "纳入加勒比"
 USA_bring_in_the_Caribbean_desc: "南方的岛屿既代表着机遇，也代表着危险。它们的海岸代表了理想的港口位置，我们的海军和贸易可以从中得到加强，或者敌人可以从中发动针对我们的行动。此外，它们的人民在我们的保护范围内，而在他们目前的状态下，我们无法像可能需要的那样保护他们。我们必须采取行动。"

 USA_treaty_of_london: "伦敦条约"
 USA_treaty_of_london_desc: "多年来，美国一直作为美洲的哨兵，保护它们免受欧洲影响。根据门罗主义，让欧洲远离这里的殖民事务一直是我们的特权。然而，欧洲影响的微小残余仍然存在。是时候最终将旧世界从新世界中移除了。"

 USA_shield_the_panama_canal: "保护巴拿马运河"
 USA_shield_the_panama_canal_desc: "巴拿马运河是世界上最重要的基础设施之一，控制和保持其运营对我们的商业和海军行动至关重要。我们将接触[PAN.GetAdjective]政府，要求在其周围建立更积极的存在。理想情况下，巴拿马本身也可以被纳入帮助。"
 USA_shield_the_panama_canal_tt: "§Y如果他们接受的效果§!：\n  在运河周围建造§Y地堡§!和§Y海岸地堡§!"

 USA_revisit_the_monroe_doctrine: "重审门罗主义"
 USA_revisit_the_monroe_doctrine_desc: "美国已承担起保护美洲免受欧洲干涉的责任。然而，为确保新世界的独立，仍有工作要做。"

 USA_demand_peace_guarantees: "要求和平保障"
 USA_demand_peace_guarantees_desc: "旧世界的大国通过持续的战争和征服威胁着我们的安全。我们更希望美洲远离他们的侵略。为了通过外交手段确保这一和平，我们将从我们的邻国和欧洲主要国家获得保障。"

 USA_defence_of_the_hemisphere: "半球防御"
 USA_defence_of_the_hemisphere_desc: "我们的首要任务必须是确保我们的土地和水域安全，确保外国入侵者和敌对势力无法踏足这个半球。"

 USA_pacific_atlantic_shield: "太平洋-大西洋之盾"
 USA_pacific_atlantic_shield_desc: "任何接近我们大陆的企图都必须通过我们两边的两大洋。为了保护我们的海岸，我们将建立一支能够在任何入侵者看到我们的海岸之前就阻止他们的力量。"

 USA_american_alliance: "美洲联盟"
 USA_american_alliance_desc: "为了确保大陆的安全，我们将与我们的大陆邻国协调，建立一个统一阵线来击退任何攻击者。"

 USA_american_customs_union: "美洲关税同盟"
 USA_american_customs_union_desc: "为了保护大陆免受军事威胁以及更温和的威胁，有必要让我们参与盟友的商业活动。我们必须确保我们周围的国家不会因外国干涉而沦陷，并保持稳定。"

 USA_intercontinental_vigilance_pact: "洲际警戒条约"
 USA_intercontinental_vigilance_pact_desc: "为了保护新世界免受外来威胁，我们必须与北美和南美的邻国密切合作，确保共同防御的海岸线和空域。合作将是我们外交行动的方式。"

 USA_empower_the_guardians: "赋能守护者"
 USA_empower_the_guardians_desc: "为促进对海外敌人的有效防御，紧密的军事合作将是必要的。为此，美国军方将与我们的其他美洲盟友密切合作，以支持所有可用的战斗力量。"

 USA_pursue_american_prosperity: "追求美国繁荣"
 USA_pursue_american_prosperity_desc: "作为世界上最大的经济体和该地区最强大的军事力量，我们有责任帮助那些有需要的人。我们被近几十年来遭受了巨大苦难的邻国包围，无论是由于偶然、自身原因，甚至是我们自己行动的结果。我们将致力于支持他们。"

 USA_bolster_liberty_in_the_south: "在南半球加强自由"
 USA_bolster_liberty_in_the_south_desc: "我们有责任将民主之光传播给我们的邻国，并帮助激发独立和自由的理想。"

 USA_support_the_great_white_north: "支持大北方"
 USA_support_the_great_white_north_desc: "我们已经与北方的邻国有很多联系。让我们与他们分享一些我们的繁荣，帮助他们从大萧条中复苏。"

 USA_purchase_the_western_gap: "购买西部缺口"
 USA_purchase_the_western_gap_desc: "加拿大走廊将美国本土与其阿拉斯加领土分开。鉴于这片土地对我们的相对价值以及对加拿大人的相对空旷，也许我们可以与他们达成一项交易。"

 USA_the_crowns_helmet: "王冠的头盔"
 USA_the_crowns_helmet_desc: "加拿大多年来一直是我们的好盟友，他们的存在有助于防止来自北方的任何攻击。我们应该与他们合作，增强我们的军事力量，提高我们保卫北美大陆的能力。"

 USA_purchase_colonial_holdovers: "购买殖民地遗留"
 USA_purchase_colonial_holdovers_desc: "欧洲的旧列强仍然在美洲拥有土地，尽管多年来他们一直被缓慢地赶出该地区。然而，现在我们有机会完成他们的撤出，但我们不会让这变得痛苦。相反，我们将用黄金购买这些殖民地遗留。"
 USA_purchase_colonial_holdovers_tt: "§Y如果他们接受的效果§!:"

 USA_support_mexico: "支持墨西哥"
 USA_support_mexico_desc: "由于各种问题，墨西哥多年来一直经历困难。最近的经济问题对他们也没有帮助。我们可以提供支持来帮助他们成长。"

 USA_finance_mexican_renewal: "资助墨西哥复兴"
 USA_finance_mexican_renewal_desc: "通过直接投资于墨西哥的发展和增长，我们可以将这个国家从其历史低谷中提升出来，帮助它完全复苏，然后进一步发展。在这个过程中，我们还可以用我们的理想引导它，并将其带入我们的势力范围。"

 USA_invest_in_mesoamerica: "投资中美洲"
 USA_invest_in_mesoamerica_desc: "我们南方的许多小国在近代史上表现不佳。虽然我们自己最近也遭受了苦难，但我们可以将复苏的一些资源用于支持这些国家，为他们自身的利益，也许也为我们将来的利益。"

 USA_south_american_industrialization: "南美工业化"
 USA_south_american_industrialization_desc: "我们可以投资南美以帮助推广美国理想。通过建设基础设施和民用工业，我们可以在为南方邻国积累未来财富的同时传播善意。"

 USA_promote_trade: "促进贸易"
 USA_promote_trade_desc: "当我们向世界重新开放经济时，我们可以优先考虑与本半球的邻国进行贸易。"

 USA_the_miami_conference: "迈阿密会议"
 USA_the_miami_conference_desc: "我们将在迈阿密举行一次盛大会议，汇集我们在本半球的朋友。目标相当直接：鼓励合作与友好。"

 USA_bolster_the_continent: "巩固大陆"
 USA_bolster_the_continent_desc: "新世界国家之间的合作将有助于加强整体防御和安全。协调这些行动和协议将优化装备的交换。"

 USA_new_world_market_system: "新世界市场体系"
 USA_new_world_market_system_desc: "由于我们与大陆邻国之间有许多共同的利益领域，值得将我们附近的友邦聚集在一起，参与一个共同的经济圈，这将直接连接我们不同的市场和人民。"

 USA_continental_citadel: "大陆堡垒"
 USA_continental_citadel_desc: "很明显，外国侵略对新世界的安全和繁荣构成最大威胁。我们与志同道合的邻国之间的防御军事联盟将为抵御任何此类威胁提供坚实的基础。"

 USA_european_diplomacy: "欧洲外交"
 USA_european_diplomacy_desc: "欧洲最近经历了一段动荡时期。自一战以来，欧洲遭受了许多苦难，我们的人民也没有忘记我们被卷入的创伤。然而，现在终于到了回归的时候了。以何种方式？我们拭目以待……"

 USA_write_war_plan_black: "制定黑色战争计划"
 USA_write_war_plan_black_desc: "[GER.GetName]几十年来一直是欧洲大陆冲突的主要来源，这一点并未因一战而停止。德国不太可能不会再次引发冲突，而在那个不可避免的事件中，我们应该提前做好准备。"

 USA_write_war_plan_red: "制定红色战争计划"
 USA_write_war_plan_red_desc: "尽管我们近年来将[ENG.GetNameDefCap]视为盟友，但它仍然代表着对美国的重大潜在威胁。如果它回到旧观点，整个半球都将处于危险之中。虽然现在友好，但我们将为这种冲突做好准备，以防万一。"

 USA_write_war_plan_white: "制定白色战争计划"
 USA_write_war_plan_white_desc: "很少有国家或地区像俄罗斯那样施加持续的压力或恐惧。苏联的崛起和[SOV.GetNameDefCap]当前的形式并不利于未来的繁荣。然而，它们是一个可怕的对手。在这种情况下，我们必须为胜利做好准备。"

 USA_write_war_plan_silver: "制定银色战争计划"
 USA_write_war_plan_silver_desc: "[ITA.GetName]在近代史上并未取得巨大成功，时间本身对她也不甚友好。近年来，她努力再次伸出援手，试图抓住比她弱小的国家，她的侵略性已经暴露无遗。意大利仍然是一个威胁，一个可能必须及时处理的威胁。"

 USA_write_war_plan_gold: "制定金色战争计划"
 USA_write_war_plan_gold_desc: "[FRA.GetName]在一战和萧条中挣扎，政治动荡不断侵蚀其内部。她的未来从未确定，先例表明她可能仍会对我们变得咄咄逼人。与法国的战争不会草率进行。"

 USA_victory_act: "胜利法案\n（欧洲战区）"
 USA_victory_act_desc: "战争现在正在以需要完全投入的规模和节奏进行——它们是全面战争。美国不能袖手旁观，试图简单地按照昨天的战争规则行事。虽然我们会注意不让我们自己变成怪物，但我们必须愿意不惜一切代价摧毁那些困扰我们的怪物。"

 USA_write_war_plan_chrome: "制定铬色战争计划"
 USA_write_war_plan_chrome_desc: "整个欧洲仍然让我们留下不好的印象。不稳定、战争和极端意识形态在那里很常见，但如果我们要在欧陆应对另一场冲突，我们应该提前制定一套计划。"

 USA_the_far_eastern_realm: "远东领域"
 USA_the_far_eastern_realm_desc: "东亚几十年来一直引起美国的兴趣，尽管美国历史短暂，但仍在该地区产生了重大影响。现在，紧张局势正在迅速升级，威胁似乎在地平线上隐约可见。我们在这里的外交立场的重要性不应被低估。"

 USA_write_war_plan_orange: "制定橙色战争计划"
 USA_write_war_plan_orange_desc: "[JAP.GetNameDefCap]发展迅速而显著，然而其近期的行动和动荡使其处于非常不稳定和侵略性的地位。无论日本将保持和平还是变得好战，我们都需要做好准备。"

 USA_victory_act_asia: "胜利法案\n（亚洲战区）"
 USA_victory_act_asia_desc: "亚洲要求一种难以把握的战争规模，有数不清的士兵，地形本身对部队不利，距离令人印象深刻。如果我们打算在太平洋进行大规模战争，我们必须全力以赴——所有可用的工具都必须可用。"

 USA_write_war_plan_yellow: "制定黄色战争计划"
 USA_write_war_plan_yellow_desc: "中国发现自己处于帝国主义派系之间的内战状态，这些派系对其扩张和恢复主导地位的意图毫不掩饰。虽然我们不太可能与它们开战，但它们可能构成严重威胁，我们必须能够随时应对。"

 USA_write_war_plan_crimson: "制定深红色战争计划"
 USA_write_war_plan_crimson_desc: "我们与北方的加拿大人享有长期而富有成效的和平，但我们与他们的边界长度以及北方入侵可能构成的威胁仍然留下了一种苦涩的可能性。在与我们的邻国发生冲突的情况下，我们不应措手不及。"

 USA_victory_act_americas: "胜利法案\n（美洲战区）"
 USA_victory_act_americas_desc: "在我们海岸上的战争要求我们尽可能猛烈地打击。我们的家园已受到邻国的威胁。只有绝对胜利是可以接受的，我们必须尽一切可能实现它。"
 USA_victory_act_americas_tt: "我们的§Y战争计划§!将变得极其强大。"

 USA_write_war_plan_green: "制定绿色战争计划"
 USA_write_war_plan_green_desc: "长期以来，我们南方的持续动荡一直是一个潜在问题。即使在一战期间，墨西哥也几乎被引诱与美国开战。与他们的战斗可能即将到来。"

 USA_write_war_plan_turquoise: "制定绿松石色战争计划"
 USA_write_war_plan_turquoise_desc: "连接北美和南美的地区对我们和世界其他地区都具有重要的战略意义。对该地区或特别是对巴拿马运河的任何威胁都必须及时应对，以免我们失去控制和安全。"

 USA_write_war_plan_jade: "制定翡翠色战争计划"
 USA_write_war_plan_jade_desc: "痛苦的殖民遗产仍然折磨着巴西的文化。幸运的是，随着时间的推移可能产生的任何问题对美国的影响都不大。然而，如果美国卷入亚马逊地区的战争，我们需要为此做好准备。"

 USA_write_war_plan_mint: "制定薄荷色战争计划"
 USA_write_war_plan_mint_desc: "阿根廷已经进行了大量发展，但那里存在出现侵略势力的可能性。在美洲大陆南部的战争将代表我们面临的后勤困难，但无论如何我们必须能够实现。"

 USA_write_war_plan_teal: "制定蓝绿色战争计划"
 USA_write_war_plan_teal_desc: "智利戏剧性的海岸线将使那里的战争变得有趣。一个完整的计划将非常有用来尝试为任何此类事件做好准备。"

 USA_write_war_plan_vermilion: "制定朱红色战争计划"
 USA_write_war_plan_vermilion_desc: "中国共产主义者对他们上台后的意图毫不讳言。与他们发生战争或冲突是很有可能的，在这种情况下我们将做好准备。"

 USA_write_war_plan_lime: "制定青柠色战争计划"
 USA_write_war_plan_lime_desc: "作为全世界的古老敌人，蒙古人可能再次崛起成为重大威胁。"

 USA_write_war_plan_scarlet_garnet: "制定猩红石榴色战争计划"
 USA_write_war_plan_scarlet_garnet_desc: "攻击澳大利亚和新西兰会很困难，尽管在大多数情况下与它们开战不太可能。如果无论出于何种原因战争来临，我们应该起草一份总体攻击计划。"

 USA_write_war_plan_ruby: "制定红宝石色战争计划"
 USA_write_war_plan_ruby_desc: "有可能我们卷入印度次大陆的战争。如果发生这种情况，可能会迅速升级，所以我们需要能够迅速到达并有效作战。"

 USA_guided_munitions: "制导弹药"
 USA_guided_munitions_desc: "使用新开发的火箭技术，我们现在可以为我们的飞机配备能够被引导至目标的弹药。移动的舰船和难以击中的据点将不再完好无损。"

 USA_write_war_plan_onyx: "制定缟玛瑙色战争计划"
 USA_write_war_plan_onyx_desc: "美洲在我们的保护范围内，这意味着我们必须准备好干预这些大陆上任何不稳定的政权。在这种情况下，我们将为可能产生的任何冲突准备一系列详细的作战计划。"

 USA_write_war_plan_diamond: "制定钻石色战争计划"
 USA_write_war_plan_diamond_desc: "无论我们对西方的立场如何，我们需要做好准备并能够在太平洋对岸采取军事行动，如果情况需要的话。钻石色战争计划将涵盖我们在该地区较小领土上的集体努力。"

 USA_enforce_continental_security: "强制执行大陆安全"
 USA_enforce_continental_security_desc: "我们必须维护美洲的稳定和安全。如果本半球的一个国家自行决定对该大陆造成破坏或危险，我们有责任进行干预。"
 USA_enforce_continental_security_unlock_tt: "解锁§Y决议§!以对美洲的破坏性国家§Y强制执行大陆安全§!。"

 USA_build_up_pacific_territories: "建设太平洋领土"
 USA_build_up_pacific_territories_desc: "我们在太平洋控制的各个岛屿代表了我们在海洋上的立足点。不开发这些领土并确保我们对它们保持牢固控制将是我们失职。"

 USA_reinforce_pearl_harbor: "加强珍珠港"
 USA_reinforce_pearl_harbor_desc: "作为我们太平洋力量投射的核心，我们在夏威夷珍珠港海军基地的安全和有效性需要得到维护。增加防御和改进珍珠港的基地系统应有助于我们的力量投射能力。"
 USA_reinforce_pearl_harbor_tt: "如果已研究§Y雷达§!，则可以在夏威夷添加一个雷达站。"

 USA_maintain_the_calm_waves: "维持平静浪潮"
 USA_maintain_the_calm_waves_desc: "尽管紧张局势加剧，我们可以利用我们在太平洋的海军优势来维持整个海洋的和平现状。通过将我们的外交政策重点放在减少侵略和确保国际贸易路线上，我们应该能够保持我们自己的中立。"

 USA_mutual_investment_in_east_asia: "东亚相互投资"
 USA_mutual_investment_in_east_asia_desc: "我们的工业通过投资于太平洋彼岸的市场将获得巨大收益，而这些市场也将从重新开放的美国经济中获益良多。让我们与海外的友好国家开启大规模的相互投资！"
 USA_mutual_investment_in_east_asia_tt: "解锁与友好东亚国家进行相互投资的§Y决议§! \n§Y完成后§!: \n §Y美国§!：\n  消费品工厂系数：§Y-5.0%§!\n §Y投资对象国§!：\n  获得§G1§!离岸民用工厂。\n  政治点数：§G+50§! \n  基础稳定度：§G+3.0%§!"

 USA_extend_american_hegemony: "扩展美国霸权"
 USA_extend_american_hegemony_desc: "美国在我们西部有利益，追求这些主张符合我们的利益。美国是太平洋最强大的力量，应将其霸权扩展到整个太平洋。"

 USA_acquire_pacific_territories: "获取太平洋领土"
 USA_acquire_pacific_territories_desc: "通过跨越海洋施加我们的影响力，我们可以扩大我们在太平洋投射的权力范围。为了巩固这种权力的增长，我们将扩大我们在海洋上声称的领土。这些土地将在自愿或强制下加入星条旗之下。"

 USA_cooperative_outreach: "合作外联"
 USA_cooperative_outreach_desc: "我们应该对亚洲和太平洋地区的国家实行合作和外交伙伴关系政策。通过这种方式，我们将有助于确保我们在那里的战略地位，并将促进整个地区的普遍和平与安全。"
 USA_cooperative_outreach_tt: "对我们有强烈好感的§Y东方国家§!将获得§Y加成§!。"

 USA_expeditionary_industrialization: "远征工业化"
 USA_expeditionary_industrialization_desc: "通过与东亚的主要公司合作，我们可以扩大我们的工业市场，并将我们的专业知识投入到尚未开发的地区。通过与其他国家在其专业工业领域合作，我们有很多收获。"

 USA_spread_democracy_in_asia: "在亚洲传播民主"
 USA_spread_democracy_in_asia_desc: "我们的使命是与东亚国家和人民分享我们的理想和生活方式，向他们展示民主和自由的好处。输出这些理想应有助于将这些人民吸引到我们这边。"

 USA_liberty_over_east_asia: "东亚自由"
 USA_liberty_over_east_asia_desc: "东亚、大洋洲、太平洋——全球这一地区几个世纪以来一直落后于西方文明，现在发现自己处于大规模动荡的重大风险中。欧洲太遥远且动荡不安，所以保护这些地区的责任落到了我们身上。"
 USA_liberty_over_east_asia_tt: "向亚洲和大洋洲国家发送§R最后通牒§!要求宗主地位，并向该地区现有傀儡的宗主国要求转让宗主地位。"

 USA_outback_offensive: "内陆攻势"
 USA_outback_offensive_desc: "既然我们已在澳大利亚登陆，我们需要集中作战努力，尽可能快速地横扫内陆的开阔平原。速度和机动将是我们胜利的方式。"

 USA_oceanic_dominance: "海洋霸权"
 USA_oceanic_dominance_desc: "随着我们在亚洲和大洋洲建立立足点，我们将投入资源镇压当地抵抗并改善当地支持。我们越早获得这些地区居民的善意，我们就能越早安全地继续前进并占领更多领土。"

 USA_conquer_the_subcontinent: "征服次大陆"
 USA_conquer_the_subcontinent_desc: "印度次大陆的广阔疆域要求一种远超美国以往可能面临的任何军事行动水平。该地区的人口密度以及其捍卫者的实力和决心将需要我们集中精力来驱逐。"

 USA_the_vast_frontier: "辽阔边疆"
 USA_the_vast_frontier_desc: "中国的土地以其广阔而闻名，她的人民也同样广阔。在我们对中国不同王国的战争中，我们需要确保我们的部队能够在任何时候获得所需的补给。然而，我们也将通过削弱中国的补给线来加强我们的努力，给我们一个利用这一弱点的窗口。"

 USA_slay_the_dragon: "屠龙"
 USA_slay_the_dragon_desc: "在我们对中国的战争中，我们已确定中国是对美国及其盟友的生存威胁，并已决定不惜一切代价争取胜利。野兽的火焰必须被扑灭；巨龙必须被屠戮。"

 USA_operation_downfall: "没落行动"
 USA_operation_downfall_desc: "我们与日本的战争已到了关键时刻。他们的决心导致了对我们使用神风特攻，这是全面入侵其本土岛屿的不祥之兆。然而，这样的入侵已被视为我们唯一剩下的选择。也许其他选择隐藏在阴影中，但现在我们必须确保我们的没落行动——对日本的入侵——的实施。"

 USA_island_hopping: "跳岛战术"
 USA_island_hopping_desc: "在与日本的战争中，一系列岛屿立足点对于向其工业和武器中心推进将是必要的。然而，我们将遇到的抵抗将需要我们进行一场缓慢而有条不紊地穿越太平洋环礁的残酷战役。我们需要为跳岛战役做好准备。"

 USA_quench_the_flames: "扑灭火焰"
 USA_quench_the_flames_desc: "我们不能允许中国共产主义者在亚洲保持其力量。它们在该地区代表着一个严重的不稳定因素，如果不加以控制，可能成为美国的主要威胁。与它们的战争将需要巧妙的能力来翻越中国北部的山脉。"

 USA_steppe_warfare: "草原战争"
 USA_steppe_warfare_desc: "作为草原战争的老牌大师，蒙古人使用骑兵有效作战，并擅长快速战术。我们将以更快的速度在战场上与他们会面。"

 USA_america_of_the_orient: "东方美国"
 USA_america_of_the_orient_desc: "自19世纪60年代开放以来，日本已证明自己是一个强大的国家，能够从封建社会和经济一跃成为拥有强大军队的世界级强国。他们在极短的时间内仅凭意志就创造了一个现代国家。我们在他们的社会中看到了一种与我们自身相似的活力，我们可以帮助进一步推动这种动力。"

 USA_cross_pacific_alliance: "跨太平洋联盟"
 USA_cross_pacific_alliance_desc: "日本人民与美国人民有许多相似之处，随着我们两国日益接近，我们的目标开始趋同，我们发现了一个有趣的前景：两国之间的跨太平洋联盟。日出之地和勇者之地可能会达成一项联合条约，以确保我们的共同利益，并保护和维护整个太平洋。"

 USA_anglo_eastern_investment: "英东投资"
 USA_anglo_eastern_investment_desc: "通过向我们在西部的大英帝国领土投资资本，我们可以加强与大不列颠本身的关系，并促进我们在太平洋彼岸和更远地区的朋友的发展。"

 USA_south_eastern_naval_actions: "东南海军行动"
 USA_south_eastern_naval_actions_desc: "为了保护我们在太平洋的战略位置，我们将与那里的盟友密切合作，制定联合海军战略，为我们应对任何潜在冲突做好准备。"
 USA_south_eastern_naval_actions_tt: "东南海军行动"

 USA_protect_the_pacific: "保护太平洋"
 USA_protect_the_pacific_desc: "散布在太平洋上的岛屿很容易受到那些想要将影响力扩展到海洋的坏势力的侵害。随着世界各大国紧张局势的加剧，我们必须采取措施确保太平洋免受敌对国家的侵犯。"

 USA_arteries_of_the_world: "世界动脉"
 USA_arteries_of_the_world_desc: "大量的贸易和资源通过太平洋的水域流动。如果这些贸易路线中的任何一条被切断，就像在世界其他地方一样，我们将遭受巨大损失。我们不能让这种情况发生——我们必须投资于商船护航队，并设计能够威慑任何威胁的舰队。"

 USA_the_flying_tigers: "“飞虎队”"
 USA_the_flying_tigers_desc: "随着中国受到围攻，美国各地的各种团体正在筹集资金提供援助，其他团体则希望直接参与帮助。其中一个团体是一群希望在空中协助中国对抗侵略者的飞行员。虽然直接派遣部队超出了我们的行动范围，但我们可以允许一批志愿部队穿越太平洋进入中国……"

 USA_the_firestar_project: "“火星计划”"
 USA_the_firestar_project_desc: "有一项提议旨在增强中国的军事力量，以使其能够抵抗那些威胁要征服它的侵略势力。这个所谓的“火星计划”将消耗我们的资源，但我们有足够的资源可以投入。此外，对中国的这种物资支持将赋予我们显著影响其政治和意识形态的筹码，使其进一步与我们保持一致。"

 USA_guerilla_support: "支援中国游击队"
 USA_guerilla_support_desc: "我们可以通过向中国共产主义者提供战争物资援助，以及派遣军事顾问和志愿者来帮助他们在防御战争中击退攻击者，从而支持他们。"

 USA_strategic_foothold: "战略立足点"
 USA_strategic_foothold_desc: "中国共产党据点的地理位置很好，这代表着一个我们可以部署我们的部队到该有利位置。当然，在追求这种紧密合作的过程中，我们也将开放自己的资产供他们使用，以便我们能够从针对共同敌人的联合行动中受益。"

 USA_a_red_free_orient: "无红东方"
 USA_a_red_free_orient_desc: "[PRC.GetNameDefCap]不能被允许继续存在。它的存在已成为对世界的生存威胁，我们必须毫不拖延地将其消灭。"

 USA_trade_in_inner_asia: "亚洲内陆贸易"
 USA_trade_in_inner_asia_desc: "自苏联崛起以来，蒙古遭受了巨大苦难，几乎没有增长或繁荣。然而，蒙古人仍然是一个坚强的民族，是开放贸易和外交使团的好选择。由于当前的地缘政治格局，我们无法像希望的那样正式，但我们仍然可以找到一些机会。"
 USA_mastery_bonus_trade_in_inner_asia_tt: "$USA_trade_in_inner_asia$"


 USA_alliance_with_a_united_china: "龙鹰条约"
 USA_alliance_with_a_united_china_desc: "随着我们与中国的关系日益密切，我们起草了一项非常大胆和雄心勃勃的条约，旨在巩固我们对太平洋的控制并延伸到亚洲。这项我们称之为“龙鹰条约”的条约将使中国进入我们的势力范围，并在我们两国之间建立一种军事和经济联盟，这将打破全球力量平衡。"
 USA_alliance_with_a_united_china_tt: "我们将尝试与其中一个中国势力建立§Y联盟§!。"

 USA_sino_american_order: "中美秩序"
 USA_sino_american_order_desc: "随着我们联盟的建立，让我们利用现在掌握的机会。中国-美国伙伴关系的力量将为世界所感受。"

 USA_reopen_trade: "重新开放贸易"
 USA_reopen_trade_desc: "既然我们自己的经济再次开放贸易，是时候向我们在欧洲的老贸易伙伴做出直接示好了。"

 USA_extend_american_charity: "扩展美国慈善"
 USA_extend_american_charity_desc: "随着美国慈善事业再次自由流动，我们可以特别关注让美国公民将他们的慈善努力扩展到我们在大西洋彼岸的老贸易伙伴。"

 USA_american_influence: "美国影响力"
 USA_american_influence_desc: "自一战结束和大萧条开始以来，美国已尽最大努力从欧洲撤退，但在我们缺席的情况下，极端意识形态在欧洲爆发。无论我们现在选择走哪条路，重新向该大陆引入我们的影响力并试图将事情转向对我们有利的方向，都符合我们的利益。"
 USA_american_influence_tt: "我们的§Y理想§!将传播到与我们关系良好的欧洲国家。"

 USA_pick_a_side: "选边站"
 USA_pick_a_side_desc: "西班牙爆发的冲突引发了许多关于我们应该如何回应的问题。有声音支持每一方，每一方都有自己的理由。也许我们应该介入……"
 USA_pick_a_side_tt: "如果§Y战争支持度§!和§Y国会支持度§!§R过低§!，这将在§R政治上代价高昂§!。"

 USA_cross_the_pond: "跨越大西洋"
 USA_cross_the_pond_desc: "多年来，我们已尽力远离欧洲事务最糟糕的方面，但当我们审视大西洋彼岸的土地时，我们不得不承认，无论我们是否愿意，我们可能仍会被拖入另一场大火。我们不能措手不及。"

 USA_prepare_for_another_great_war: "为另一场世界大战做准备"
 USA_prepare_for_another_great_war_desc: "再一次，战争降临到我们头上。\n和平已经失败。\n美国必须做出回应。"

 USA_avoid_conflict: "避免冲突"
 USA_avoid_conflict_desc: "一战给我们留下了太深的创伤，不能冒险卷入另一场欧洲大火。和平谈判可能不够，我们需要采取行动来远离任何可能酝酿的潜在冲突。"

 USA_great_power_attaches: "大国武官"
 USA_great_power_attaches_desc: "我们在军事经验和设计方面落后于欧洲大国。我们应该联系其他主要军队中的联系人，努力使我们的学说与同行保持一致。"

 USA_fund_resistance_abroad: "资助海外抵抗"
 USA_fund_resistance_abroad_desc: "就在我们说话的时候，世界各地有各种民族群体正在遭受压迫，我们也许能够对此采取一些措施。我们可以利用我们的特殊服务来支持那些需要帮助的群体，并削弱那些扩张政策与我们不一致的国家。"

 USA_seek_regime_change: "寻求政权更迭"
 USA_seek_regime_change_desc: "使用所有可用的手段，我们可以从内到外破坏敌对行为者的稳定，在不费一枪一弹的情况下打击他们行政的核心。"
 USA_seek_regime_change_tt: "世界其他国家将§R反对§!这一政策立场。"

 USA_the_old_world: "旧世界"
 USA_the_old_world_desc: "一个半世纪前，我们宣布从旧世界独立，并在新世界建立了地球上最伟大的国家。现在，旧世界处于可怕而衰弱的状态。也许是时候让旧列强的太阳落山，让美利坚合众国接管欧洲了。"

 USA_fell_the_warring_giants: "打倒交战巨人"
 USA_fell_the_warring_giants_desc: "旧列强又在行动了，另一场大规模战争将使它们再衰落20年。如果不是出于我们自身的利益，那么我们必须考虑干预欧洲以拯救欧洲人自己。每一个呈现出来的论据都支持介入。"
 USA_fell_the_warring_giants_tt: "我们将获得对交战欧洲大国的§Y战争目标§!"

 USA_subvert_foreign_adversaries: "颠覆外国对手"
 USA_subvert_foreign_adversaries_desc: "我们的情报部门已经确定了敌对国家的各种渗透点，我们可以利用这些渗透点来试图破坏他们的行动。这些微妙的打击将超出公众的感知，可以在不招致他们愤怒的情况下进行。我们为什么不绊倒我们的敌人呢？"

 USA_promote_peace: "促进和平"
 USA_promote_peace_desc: "为了避免另一场世界大战，国会起草了《持久和平宣言》，一份声明国家不会使用武力来达到目的，也不会煽动冲突的宣言。我们将争取欧洲国家的外交官签署该宣言，以促进整个大陆的和平与友好。"

 USA_embody_peace: "体现和平"
 USA_embody_peace_desc: "通过签署国会的《持久和平宣言》，我们向国家公开声明，这届政府不会追求任何形式的冲突，我们打算远离与我们无关的战争，我们不会在没有明确目的的情况下在另一个大陆上继续牺牲更多人。"

 USA_embargo_hostile_actors: "禁运敌对行为者"
 USA_embargo_hostile_actors_desc: "我们不会容忍欧洲的新战争。我们需要远离这些暴力行为者。我们不会让我们的资源资助外国战争。"
 USA_embargo_hostile_actors_tt: "我们将对敌对行为者实施§Y禁运§!，每实施一项禁运我们将获得§Y政治点数§!。"

 USA_international_red_cross: "国际红十字会"
 USA_international_red_cross_desc: "尽管战争残酷，但确保个别士兵保持其权利是非常必要的。我们将向红十字会提供大量资金，以帮助确保来自任何国家的士兵都能得到医疗救治。"
 USA_international_red_cross_tt: "§Y目前处于战争状态§!的欧洲国家将获得IRC支持。"

 USA_maintain_neutrality: "保持中立"
 USA_maintain_neutrality_desc: "我们不能参与海外暴力——我们比那更文明。欧洲可以有它的战争，但我们不会参与其中。"

 USA_enforce_the_naval_treaties: "强制执行海军条约"
 USA_enforce_the_naval_treaties_desc: "《伦敦海军条约》是为防止可能导致另一场世界大战的海军军备竞赛而设立的保障措施。那些公然无视它的国家正在暴露他们的手牌，揭示他们潜在的敌意。我们必须确保条约得到遵守。"
 USA_enforce_the_naval_treaties_tt: "解锁§Y决议§!以对其他大国强制执行海军条约。"

 USA_withdraw_from_the_naval_treaties: "退出海军条约"
 USA_withdraw_from_the_naval_treaties_desc: "由于大陆两侧都是海洋，美国完全依赖强大的海军来在世界任何地方施加影响。虽然这是一个崇高的事业，但我们不能通过任意限制我们的海军实力来削弱我们的能力或安全。"

 USA_punish_aggression: "惩罚侵略"
 USA_punish_aggression_desc: "我们的远征部队将被允许并装备齐全，以干预外国战争，直接阻止侵略国。"

 USA_operation_unthinkable: "不可思议行动"
 USA_operation_unthinkable_desc: "这一天已经酝酿很久了……我们必须摧毁[SOV.GetNameDefCap]。它们代表着一个不可避免的威胁，我们必须在其完全失控之前处理它们。这场战争的规模将是巨大的，但我们必须投入一切必要的力量来赢得胜利。"

 USA_eastern_infiltration: "渗透东方"
 USA_eastern_infiltration_desc: "无论我们从外交上从[SOV.GetAdjective]那里得到什么，我们都不能真正相信他们的话。我们需要有内部的眼睛来提供全部真相。"

 USA_overwhelming_material_support: "压倒性物质支持"
 USA_overwhelming_material_support_desc: "[SOV.GetNameDefCap]发现自己被巨大的敌人包围，可能无法在即将到来的猛攻中幸存。我们愿意用大量的物资支持来帮助他们，以确保他们的主权。"

 USA_flank_the_maginot: "侧翼马奇诺"
 USA_flank_the_maginot_desc: "为了夺取法国本土，我们需要准备好夺取其沿海港口，并能够从空中有效打击。"

 USA_challenge_the_empire: "挑战帝国"
 USA_challenge_the_empire_desc: "是时候让大英帝国终结了。它已经将其影响力扩展到世界各地足够久了，但现在它的暴政不再能被容忍。"

 USA_shatter_the_crown: "粉碎王冠"
 USA_shatter_the_crown_desc: "我们必须将这场战争推向最后阶段。太阳必须在大英帝国落下。"

 USA_destroy_the_reich: "摧毁帝国"
 USA_destroy_the_reich_desc: "[GER.GetNameDefCap]已证明其对美国构成可怕的威胁。我们必须迅速果断地采取行动，将其领导层赶下台，终结德国构成的威胁。"

 USA_duel_of_the_eagles: "雄鹰决斗"
 USA_duel_of_the_eagles_desc: "在未来的世界中，[GER.GetNameDefCap]没有立足之地。我们将流尽每一滴血，打光每一颗子弹，以摧毁那只黑鹰。"

 USA_strike_the_soft_underbelly: "打击软肋"
 USA_strike_the_soft_underbelly_desc: "无论是为了立足点还是为了遏制，我们都被吸引去确保意大利半岛的安全。如果我们想维持我们所建立的任何突破口，这一努力必须集中且有效。如果我们成功，罗马将不再飘扬[ITA.GetAdjective]旗帜。"

 USA_join_the_allies: "加入同盟国"
 USA_join_the_allies_desc: "随着世界局势日益不信任和混乱，拥有良好的盟友是必要的。我们将申请加入[ENG.GetNameDefCap]及其盟友的军事联盟，以既保护我们自己的地位，又帮助维护全球稳定。"

 USA_approach_russia: "接近俄罗斯"
 USA_approach_russia_desc: "为了扩大我们与[SOV.GetNameDefCap]的外交联系，我们需要首先接触他们，并开始直接建立这些联系。"

 USA_no_more_american_blood: "不再流美国人的血"
 USA_no_more_american_blood_desc: "我们厌倦了世界其他地区的混乱和破坏。我们不会介入。他们的战争不是我们的战争。我们拒绝再流任何美国人的血。我们拒绝再埋葬我们的任何子弟。"
 USA_no_more_american_blood_tt: "§R美国承诺§! §Y和平主义§!"

 USA_arising_opportunities: "新兴机遇"
 USA_arising_opportunities_desc: "虽然我们没有直接介入海外事务……也许我们不必如此。也许通过扮演一个仅仅外围的角色，选择性地关注冲突的某些方面，可以获得更多收益。我们的情报部门对这里可能实现的可能性特别感兴趣。"

 USA_pledge_for_the_axis: "向轴心国宣誓"
 USA_pledge_for_the_axis_desc: "[GER.GetName]领导的秩序远比与之竞争的那些秩序更稳定，也更有潜力。与德国结盟比与其他一些国际秩序结盟，我们会有更多收获。"

 USA_new_order: "新世界秩序"
 USA_new_order_desc: "在德国和美国之间，世界可能属于我们。我们为什么要如此限制我们的野心？我们可以并肩对抗旧列强，创造我们自己的新世界秩序。"

 USA_a_world_split_in_two: "分裂的世界"
 USA_a_world_split_in_two_desc: "新世界秩序已经降临，但我们的德国盟友似乎并不感兴趣与我们分享，我们也不感兴趣与他们维持它。然而，在我们最终分裂之前，我们需要在德国人自己行动之前，利用他们的支持竞速前进并占领一切我们能占领的。"
 USA_a_world_split_in_two_tt: "如果§Y[USA.GetNameDefCap]§!和§Y[GER.GetNameDefCap]§!不在同一阵营，§Y[GER.GetNameDefCap]§!将§R宣战§!§Y[USA.GetNameDefCap]§!。"

 USA_foreign_policy: "外交政策"
 USA_foreign_policy_desc: "无论我们的内部立场如何，我们都不是存在于真空中的。我们需要决定如何与世界其他地区互动。"
 USA_foreign_policy_tt: "选择一条§Y政治道路§!将使此国策的完成时间减少§G35天§!。"

 USA_unheilige_politik: "不洁政治"
 USA_unheilige_politik_desc: "随着我们两国军队日益接近，我们面临一个机会：与[SOV.GetNameDefCap]全面结盟。这不是一个可以轻率做出的决定，也许也不是一个可以事先公开的决定……但这是一场政治游戏，我们打算赢。"
 USA_the_central_intelligence_agency: "中央情报局"
 USA_the_central_intelligence_agency_desc: "很明显，我们必须对幕后活动采取更积极的角色，这些活动决定了世界上发生的很多事情。我们目前对情报机构的投资还不够；我们需要对这一角色进行全新的努力。即刻生效，OSS将被转变为CIA，其任务是在暗处执行美国在海外的意志。"
 USA_the_central_intelligence_agency_tt: "§YOSS§!将被重组为§YCIA§!"

 USA_libertys_last_refuge: "自由国家的最后避难所"
 USA_libertys_last_refuge_desc: "美国仍然作为山巅的闪亮之城屹立……但现在它似乎是唯一仍在闪耀的城市。那些在海外扑灭民主的势力还没有完成，我们对它们想要带来的命运没有任何幻想。我们的存在受到威胁。\n我们作为世界上自由的最后希望而站立。\n我们绝不能倒下……我们必须坚定不移地站立。"

 USA_militia_readiness_act: "民兵预备役法案"
 USA_militia_readiness_act_desc: "随着世界温度日益升高，美国公民应该为可能等待他们的任何风暴做好准备。志愿者防御组织应进行评估，以确保它们在糟糕情况下是资产而非需要绕过的障碍。"

 USA_federal_funding_for_citizen_defense_groups: "联邦对公民防御组织的资助"
 USA_federal_funding_for_citizen_defense_groups_desc: "为了更好地为我们的人民准备潜在的本土战争，我们将向现有防御组织提供资金，以帮助他们保持高标准和战备状态。"

 USA_public_training_programs: "公共训练计划"
 USA_public_training_programs_desc: "在发生冲突的情况下，任何能够战斗的人都需要知道如何正确战斗。此外，越多的人知道如何握枪，在需要时征召他们就越容易。"

 USA_expand_the_national_guard: "扩大国民警卫队"
 USA_expand_the_national_guard_desc: "为了保护我们的国家，我们将专注于提高国民警卫队的质量，并增加其资金和规模。"

 USA_interstate_highways: "州际公路"
 USA_interstate_highways_desc: "美国是一个广阔的大陆，任何到达它的冲突都将要求我们能够快速穿越它。创建州际公路网络将促进必要的后勤灵活性以确保这种能力，并将改善我们基础设施的整体质量。"

 USA_national_security_initiative: "国家安全倡议"
 USA_national_security_initiative_desc: "海外的威胁要求我们采取先发制人的措施，以确保美国的领土完整。我们将为最坏情况做好准备，如果它到来，希望我们的准备首先能起到劝阻任何针对我们的攻击的作用。"

 USA_homeland_defense_emergency_act_focus: "$USA_homeland_defense_emergency_act_focus-general_title$"
 USA_homeland_defense_emergency_act_focus_desc: "$USA_homeland_defense_emergency_act_focus-general_desc$"

 USA_coordinate_militia_defenses: "$USA_coordinate_militia_defenses-general_title$"
 USA_coordinate_militia_defenses_desc: "$USA_coordinate_militia_defenses-general_desc$"
 USA_coordinate_militia_defenses_tt: "解锁在全国范围内动员§Y民兵组织§!的§Y决议§!。\n根据我们的§Y准备§!程度，最初将生成一定数量的部队。\n我们§Y准备§!越充分，我们就能越有效地动员§Y民兵§!。"

 USA_establish_strongholds_in_the_rockies: "$USA_establish_strongholds_in_the_rockies-general_title$"
