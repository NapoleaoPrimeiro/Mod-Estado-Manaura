l_spanish:
GFTR_E_independence.1.t: "¡Guerra por la independencia!"
GFTR_E_independence.1.d: "¡Nuestra paciencia se ha agotado! Esta es nuestra tierra y nosotros decidiremos qué hacer con ella. ¡Hoy comenzamos la lucha contra los invasores y ocupantes que llegaron a nuestro territorio, nos impusieron su voluntad y cultura, esclavizaron a nuestro pueblo y clavaron su bandera en nuestra tierra!"
GFTR_E_independence.1.a: "¡Que su sangre se derrame!"
# # # # # # # # # # # # # # #
GFTR_E_independence.2.t: "Carta de petición"
GFTR_E_independence.2.d: "Hoy hemos recibido una solicitud oficial de nuestro estado títere. Exigen una revisión de nuestra influencia, desean tener voz propia en política exterior e interior, y declaran abiertamente su deseo de convertirse en un país independiente. El tono de la carta es por ahora comedido y diplomático, pero con un chasquido de dedos todo podría derivar en guerra."
GFTR_E_independence.2.a: "¡Ninguna concesión!"
GFTR_E_independence.2.b: "Estamos dispuestos a concederles la independencia."
GFTR_E_independence.2.c: "¡Traidores! ¡Fuera de nuestra alianza!"
GFTR_E_independence.2.d: "El ejército restaurará el orden."
# # # # # # # # # # # # # # #
GFTR_E_independence_response.0.t: "Malas noticias"
GFTR_E_independence_response.0.d: "Esta mañana nos han apuñalado por la espalda: nuestro antiguo estado títere ha declarado repentinamente su independencia y ha atacado a nuestras tropas estacionadas en su territorio. Todos nuestros intentos de negociación han sido rechazados."
GFTR_E_independence_response.0.a: "¡Quieren guerra? ¡La tendrán!"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.1.t: "Rechazo"
GFTR_E_independence_response.1.d: "Hace unos días enviamos una petición de independencia, pero hoy recibimos un rechazo categórico. La metrópoli no quiere soltarnos y ha rechazado cualquier discusión al respecto. La diplomacia está en un callejón sin salida."
GFTR_E_independence_response.1.a: "¡Tendremos que pelear!"
GFTR_E_independence_response.1.b: "Está bien..."
# # # # # # # # # # # # # # #
GFTR_E_independence_response.2.t: "¡Somos libres!"
GFTR_E_independence_response.2.d: "¡Buenas noticias! La metrópoli ha reconocido oficialmente nuestra independencia. De ahora en adelante trazamos nuestro propio destino. Para nuestro pueblo, este es un día histórico que pasará a los libros de texto."
GFTR_E_independence_response.2.a: "¡Hurra! ¡Hurra! ¡HURRA!"
# # # # # # # # # # # # # # #
GFTR_E_independence_response.3.t: "Libertad con regusto amargo"
GFTR_E_independence_response.3.d: "Hoy hemos recibido una respuesta ambigua de la metrópoli. Nos han acusado de traición. Hemos logrado nuestra independencia, pero la antigua metrópoli ha roto todo contacto diplomático con nosotros. Somos libres, pero solos en estos tiempos turbulentos. A pesar de la dureza de sus palabras, hemos evitado un conflicto armado."
GFTR_E_independence_response.3.a: "Lo importante es que todo transcurrió en paz."
# # # # # # # # # # # # # # #
GFTR_E_independence_response.4.t: "Guerra por la independencia"
GFTR_E_independence_response.4.d: "Nuestras esperanzas de una solución diplomática a nuestro sometimiento se han desmoronado hoy. Tras nuestra reciente petición, la metrópoli ha enviado tropas a la frontera y se prepara para invadir con el objetivo de aplastar nuestro deseo de convertirnos en un estado soberano. A partir de este momento, no luchamos solo por la libertad, sino por la supervivencia misma de nuestra nación."
GFTR_E_independence_response.4.a: "¡Resistiremos!"
# # # # # # # # # # # # # #
GFTR_E_change_of_power.1.t: "Las elecciones han terminado"
GFTR_E_change_of_power.1.d: "Se han celebrado elecciones democráticas honestas en el país. El pueblo ha hecho su elección."
GFTR_E_change_of_power.1.a: "Bien"
# # # # # # # # # # # # # #
GFTR_E_change_of_power.2.t: "Toma del poder"
GFTR_E_change_of_power.2.d: "El enfrentamiento esperado no tuvo lugar. El antiguo régimen reconoció su derrota y entregó sus poderes, transfiriendo el control al nuevo gobierno sin resistencia."
GFTR_E_change_of_power.2.a: "Decisión correcta"
# # # # # # # # # # # # # #
GFTR_E_change_of_power.3.t: "¡Guerra civil!"
GFTR_E_change_of_power.3.d: "La crisis política ha alcanzado su punto álgido. El país se ha dividido en dos bandos enfrentados y la lucha por el poder ha derivado en un conflicto armado abierto."
GFTR_E_change_of_power.3.a: "Lo superaremos"